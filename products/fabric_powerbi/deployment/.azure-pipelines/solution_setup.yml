# Solution Setup Pipeline
# Creates Fabric workspaces, connections, and Git integration for environments

trigger: none

parameters:
  - name: environments
    type: string
    default: 'dev,tst,prd'
    displayName: 'Environments to setup'

stages:
  - stage: Setup
    displayName: 'Setup Fabric Environments'
    jobs:
      - job: SetupEnvironments
        displayName: 'Setup ${{ matrix.environment }}'
        strategy:
          matrix:
            dev:
              environment: dev
            tst:
              environment: tst
            prd:
              environment: prd
          maxParallel: 3
        
        pool:
          vmImage: 'windows-latest'
        
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: 1
          TENANT_ID: $(SPN_TENANT_ID)
          CLIENT_ID: $(SPN_CLIENT_ID)
          CLIENT_SECRET: $(SPN_CLIENT_SECRET)
          GITHUB_PAT: $(GITHUB_PAT)
        
        steps:
          - checkout: self
            displayName: 'Checkout repository'
          
          - task: UsePythonVersion@0
            displayName: 'Set up Python'
            inputs:
              versionSpec: '3.12'
          
          - script: |
              python -m pip install --upgrade pip
              pip install -r products/fabric_powerbi/deployment/resources/requirements.txt
            displayName: 'Install Python dependencies'
            workingDirectory: products/fabric_powerbi/deployment
          
          - script: |
              python products/fabric_powerbi/deployment/scripts/fabric_setup.py `
                --environment $(environment) `
                --action create
            displayName: 'Setup Fabric environment'
            pwsh: true
            continueOnError: false
