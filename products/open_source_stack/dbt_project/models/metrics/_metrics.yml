version: 2
metrics:
- name: sales_net_sales_amount
  label: Net Sales Amount
  description: Total invoiced revenue net of discounts and returns.
  type: simple
  type_params:
    measure: metric_value
  meta:
    kpi_id: sales.net_sales.amount
    source: core_ir
    calculation_logic_source: core
    required_by_use_cases: &id001
    - COM-001
    - COM-004
    semantic_projection:
      table: metric_observations
      filter_column: kpi_id
      filter_value: sales.net_sales.amount
- name: cost_cogs_amount
  label: Cost of Goods Sold Amount
  description: Total cost of goods sold for invoiced revenue; base for margin and
    PVM.
  type: simple
  type_params:
    measure: metric_value
  meta:
    kpi_id: cost.cogs.amount
    source: core_ir
    calculation_logic_source: core
