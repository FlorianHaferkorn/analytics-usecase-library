# Proposal Costing – Projection horizons (short / medium / long term).
# All values only here; no horizon definitions in code. Merge with base scenario per horizon.

schema_version: "1.0"

# TCO year options (configurable; no hardcoded 3 or 5 in code).
tco_years: [3, 5]

horizons:
  - id: year1
    label: "Year 1 (short-term)"
    years: 1
    capacities:
      dev: F2
      test: F4
      prod: F8
    pro_users: 3
    ppu_users: 0

  - id: year2_3
    label: "Year 2–3 (medium-term)"
    years: 2
    capacities:
      dev: F2
      test: F4
      prod: F16
    pro_users: 5
    ppu_users: 0

  - id: year4_5
    label: "Year 4–5 (long-term)"
    years: 2
    capacities:
      dev: F2
      test: F4
      prod: F32
    pro_users: 8
    ppu_users: 0
