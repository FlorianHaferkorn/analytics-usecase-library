# Build Solution Template
# Reusable template for building and validating solution artifacts

parameters:
  - name: environments
    type: string
    default: 'dev,tst,prd'
    displayName: 'Environments to build for'

jobs:
  - job: Build
    displayName: 'Build Solution'
    pool:
      vmImage: 'windows-latest'
    
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: 1
    
    steps:
      - checkout: self
        displayName: 'Checkout repository'
      
      - task: UsePythonVersion@0
        displayName: 'Set up Python'
        inputs:
          versionSpec: '3.12'
      
      - script: |
          python -m pip install --upgrade pip
          pip install -r products/fabric/powerbi/deployment/resources/requirements.txt
        displayName: 'Install Python dependencies'
        workingDirectory: products/fabric/powerbi/deployment

      # Secret scan (I-21 W5.4): fail the build when a credential-like string is committed in
      # the release automation. Exit 2 = scan did not run, also red. Scope and measurement:
      # scripts/secret_scan_gate.py. First choice on Azure Repos: Advanced Security push protection.
      - script: python -m pip install detect-secrets==1.5.0
        displayName: 'Install detect-secrets (pinned)'

      - script: python products/fabric/powerbi/deployment/scripts/secret_scan_gate.py
        displayName: 'Secret scan (release automation)'
        workingDirectory: $(System.DefaultWorkingDirectory)
        continueOnError: false
      
      - task: PowerShell@2
        displayName: 'Run Stage 1 validation'
        inputs:
          targetType: 'filePath'
          filePath: '$(System.DefaultWorkingDirectory)/tooling/run_stage1_checks.ps1'
          pwsh: true
        continueOnError: false
      
      - task: PowerShell@2
        displayName: 'Run Fabric checks'
        inputs:
          targetType: 'filePath'
          filePath: '$(System.DefaultWorkingDirectory)/products/fabric/powerbi/tooling/run_fabric_checks.ps1'
          pwsh: true
        continueOnError: false
        condition: succeeded()
      
      - script: |
          python products/fabric/powerbi/deployment/scripts/utils_build_parameter_file.py --environments ${{ parameters.environments }}
        displayName: 'Build parameter files'
        workingDirectory: $(System.DefaultWorkingDirectory)
        condition: succeeded()
      
      - task: PublishPipelineArtifact@1
        displayName: 'Upload solution artifacts'
        inputs:
          targetPath: '$(System.DefaultWorkingDirectory)'
          artifactName: 'solution'
          publishLocation: 'pipeline'
      
      - task: PublishPipelineArtifact@1
        displayName: 'Upload automation artifacts'
        inputs:
          targetPath: 'products/fabric/powerbi/deployment'
          artifactName: 'automation'
          publishLocation: 'pipeline'
