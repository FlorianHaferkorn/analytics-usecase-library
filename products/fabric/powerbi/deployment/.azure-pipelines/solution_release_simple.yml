# Simple Release Pipeline with Manual Approvals
# Alternative to multi-stage pipeline - uses ManualValidation tasks instead of Environments
# Use this if you prefer task-based approvals over environment-based approvals

trigger:
  branches:
    include:
      - releases/release*
  paths:
    include:
      - products/fabric/powerbi/**
      - core/**
      - showcases/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - products/fabric/powerbi/**
      - core/**
      - showcases/**

variables:
  - group: Fabric-Release-Variables

stages:
  - stage: Build
    displayName: 'Build Solution'
    jobs:
      - template: _template_build_solution.yml
        parameters:
          environments: 'dev,tst,prd'
  
  - stage: ReleaseTest
    displayName: 'Release to TEST'
    dependsOn: Build
    # Branch rule (I-21 W5.4): deploy only from releases/*, never from a PR build or a
    # manual run on another branch. The `pr:` trigger above is for Build only.
    condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/heads/releases/'), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      # ManualValidation@0 runs only in an agentless job (`pool: server`); the job timeout
      # must exceed the task timeout (job default 60 min). Learn manual-validation-v0, 01.10.2026.
      - job: ApproveTest
        displayName: 'Approve TEST Deployment'
        pool: server
        timeoutInMinutes: 1500
        steps:
          - task: ManualValidation@0
            displayName: 'Approve TEST Deployment'
            timeoutInMinutes: 1440  # 24 hours; common task property, not an input
            inputs:
              notifyUsers: |
                $(APPROVAL_NOTIFY_USERS)
              onTimeout: 'reject'

      - job: ReleaseTest
        displayName: 'Deploy to TEST'
        dependsOn: ApproveTest
        pool:
          vmImage: 'windows-latest'
        steps:
          - template: _template_release_solution.yml
            parameters:
              environment: 'tst'
  
  - stage: ReleaseProd
    displayName: 'Release to PRODUCTION'
    dependsOn: ReleaseTest
    # Branch rule (I-21 W5.4): deploy only from releases/*, never from a PR build or a
    # manual run on another branch. The `pr:` trigger above is for Build only.
    condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/heads/releases/'), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      # ManualValidation@0 runs only in an agentless job (`pool: server`); the job timeout
      # must exceed the task timeout (job default 60 min). Learn manual-validation-v0, 01.10.2026.
      - job: ApproveProd
        displayName: 'Approve PRODUCTION Deployment'
        pool: server
        timeoutInMinutes: 1500
        steps:
          - task: ManualValidation@0
            displayName: 'Approve PRODUCTION Deployment'
            timeoutInMinutes: 1440  # 24 hours; common task property, not an input
            inputs:
              notifyUsers: |
                $(APPROVAL_NOTIFY_USERS)
              onTimeout: 'reject'

      - job: ReleaseProd
        displayName: 'Deploy to PRODUCTION'
        dependsOn: ApproveProd
        pool:
          vmImage: 'windows-latest'
        steps:
          - template: _template_release_solution.yml
            parameters:
              environment: 'prd'
