# Release Solution Template
# Reusable template for releasing solution to Fabric environment
# Supports approval gates via Azure DevOps Environments
#
# Usage: Include as steps in a deployment job that references an environment
#
# No approval step here: these steps run in an agent job, and ManualValidation@0 runs only in an
# agentless job (`pool: server`, Learn manual-validation-v0, 01.10.2026). Approvals come from the
# environment (solution_release_multistages.yml) or from a separate agentless job before the
# release job (solution_release_simple.yml). The former parameters `requireManualApproval` and
# `approvalTimeoutMinutes` were removed on 01.10.2026; a caller still passing them fails at
# template expansion instead of deploying without the approval it asked for.

parameters:
  - name: environment
    type: string
    default: 'dev'
    displayName: 'Target environment'

steps:
  - task: DownloadPipelineArtifact@2
    displayName: 'Download automation artifacts'
    inputs:
      artifactName: 'automation'
      targetPath: '$(Pipeline.Workspace)/automation'
  
  - task: DownloadPipelineArtifact@2
    displayName: 'Download solution artifacts'
    inputs:
      artifactName: 'solution'
      targetPath: '$(Pipeline.Workspace)/solution'
  
  - task: UsePythonVersion@0
    displayName: 'Set up Python'
    inputs:
      versionSpec: '3.12'
  
  - script: |
      python -m pip install --upgrade pip
      pip install -r $(Pipeline.Workspace)/automation/resources/requirements.txt
    displayName: 'Install Python dependencies'
  
  - pwsh: |
      python $(Pipeline.Workspace)/automation/scripts/fabric_release.py `
        --environment ${{ parameters.environment }} `
        --repo_path "$(Pipeline.Workspace)/solution" `
        --unpublish_items true
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    displayName: 'Release Fabric items'
    continueOnError: false
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: 1
      TENANT_ID: $(SPN_TENANT_ID)
      CLIENT_ID: $(SPN_CLIENT_ID)
      CLIENT_SECRET: $(SPN_CLIENT_SECRET)
  
  - task: PowerShell@2
    displayName: 'Post-deployment validation'
    condition: succeeded()
    inputs:
      targetType: 'inline'
      script: |
        Write-Host "##[section]Post-deployment checks"
        Write-Host "Environment: ${{ parameters.environment }}"
        Write-Host "Deployment completed successfully"
        # Add custom validation logic here if needed
      pwsh: true
