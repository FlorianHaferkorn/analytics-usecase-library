# Feature Branch Pipeline
# Creates isolated Fabric workspace for feature branch development

trigger:
  branches:
    include:
      - feature/*

pr: none

stages:
  - stage: CreateFeatureWorkspace
    displayName: 'Create Feature Workspace'
    jobs:
      - job: SetupFeatureWorkspace
        displayName: 'Setup Feature Workspace'
        pool:
          vmImage: 'windows-latest'
        
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: 1
          TENANT_ID: $(SPN_TENANT_ID)
          CLIENT_ID: $(SPN_CLIENT_ID)
          CLIENT_SECRET: $(SPN_CLIENT_SECRET)
          GITHUB_PAT: $(GITHUB_PAT)
          BRANCH_NAME: $(Build.SourceBranchName)
        
        steps:
          - checkout: self
            displayName: 'Checkout repository'
          
          - task: UsePythonVersion@0
            displayName: 'Set up Python'
            inputs:
              versionSpec: '3.12'
          
          - script: |
              python -m pip install --upgrade pip
              pip install -r products/fabric/powerbi/deployment/resources/requirements.txt
            displayName: 'Install Python dependencies'
            workingDirectory: products/fabric/powerbi/deployment
          
          - script: |
              python products/fabric/powerbi/deployment/scripts/fabric_feature_maintenance.py `
                --action create `
                --branch_name $(BRANCH_NAME)
            displayName: 'Create feature workspace'
            pwsh: true
            continueOnError: false
