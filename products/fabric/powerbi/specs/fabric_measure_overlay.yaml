crm.active_customers.count:
  dax_expression: DISTINCTCOUNT ( fact_sales[CustomerKey] )
  format_string: ''
  dax_name: Active Customers
  display_folder: ''
crm.churned_customers.count:
  dax_expression: "VAR PreviousMonthCustomers =\n    CALCULATETABLE (\n        VALUES\
    \ ( fact_sales[CustomerKey] ),\n        DATEADD ( dim_date[Date], -1, MONTH )\n\
    \    )\nVAR CurrentMonthCustomers =\n    VALUES ( fact_sales[CustomerKey] )\n\
    RETURN\n    COUNTROWS ( EXCEPT ( PreviousMonthCustomers, CurrentMonthCustomers\
    \ ) )"
  format_string: ''
  dax_name: Churned Customers
  display_folder: ''
crm.clv.amount:
  dax_expression: "AVERAGEX (\n    VALUES ( fact_sales[CustomerKey] ),\n    CALCULATE\
    \ (\n        SUM ( fact_sales[Net Sales Amount] ) - SUM ( fact_sales[Cost of Goods\
    \ Sold Amount] )\n    ) * 3\n)"
  format_string: ''
  dax_name: CLV
  display_folder: ''
crm.complaint.count:
  dax_expression: COUNTROWS ( fact_experience )
  format_string: ''
  dax_name: Complaint Count
  display_folder: ''
crm.lifetime_revenue.amount:
  dax_expression: "CALCULATE (\n    SUM ( fact_sales[Net Sales Amount] ),\n    ALLSELECTED\
    \ ( dim_date )\n)"
  format_string: ''
  dax_name: Customer Lifetime Revenue Amount
  display_folder: ''
crm.nps.index:
  dax_expression: 'VAR Promoters = CALCULATE ( COUNTROWS ( fact_nps ), fact_nps[Is
    Promoter] = TRUE () )

    VAR Detractors = CALCULATE ( COUNTROWS ( fact_nps ), fact_nps[Is Detractor] =
    TRUE () )

    VAR Total = COUNTROWS ( fact_nps )

    RETURN DIVIDE ( Promoters - Detractors, Total ) * 100'
  format_string: ''
  dax_name: NPS Score
  display_folder: ''
crm.retention.pct:
  dax_expression: "VAR CurrentPeriodCustomers =\n    CALCULATE (\n        DISTINCTCOUNT\
    \ ( fact_sales[CustomerKey] ),\n        FILTER ( ALLSELECTED ( dim_date ), dim_date[Date]\
    \ = MAX ( dim_date[Date] ) )\n    )\nVAR PreviousPeriodCustomers =\n    CALCULATE\
    \ (\n        DISTINCTCOUNT ( fact_sales[CustomerKey] ),\n        DATEADD ( dim_date[Date],\
    \ -1, MONTH )\n    )\nRETURN DIVIDE ( CurrentPeriodCustomers, PreviousPeriodCustomers\
    \ )"
  format_string: 0.0%
  dax_name: Customer Retention %
  display_folder: ''
crm.revenue_at_risk.amount:
  dax_expression: 'VAR ChurnRiskPct = 0.15

    RETURN [CLV] * ChurnRiskPct'
  format_string: ''
  dax_name: Revenue at Risk Amount
  display_folder: ''
