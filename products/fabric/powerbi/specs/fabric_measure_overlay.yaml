margin.gm.vs_plan.pct:
  dax_expression: "VAR GMAct =\n    DIVIDE ( [Net Sales Amount] - [Cost of Goods Sold\
    \ Amount], [Net Sales Amount] )\nVAR GMPlan =\n    DIVIDE ( SUM ( fact_sales[Plan\
    \ Sales Amount] ) - SUM ( fact_sales[Plan COGS Amount] ),\n             SUM (\
    \ fact_sales[Plan Sales Amount] ) )\nRETURN\n    DIVIDE ( GMAct - GMPlan, GMPlan\
    \ )"
