sales.pvm.mix_effect.amount:
  dax_expression: "[Net Sales Amount]\n    - SUM ( fact_sales[Plan Sales Amount] )\n\
    \    - [Price Effect Amount]\n    - [Volume Effect Amount]"
  format_string: ''
  dax_name: Mix Effect Amount
  display_folder: ''
sales.pvm.price_effect.amount:
  dax_expression: "SUMX (\n    fact_sales,\n    VAR ActualPrice = DIVIDE ( fact_sales[Net\
    \ Sales Amount], fact_sales[Quantity] )\n    VAR PlanPrice   = DIVIDE ( fact_sales[Plan\
    \ Sales Amount], fact_sales[Plan Quantity] )\n    RETURN ( ActualPrice - PlanPrice\
    \ ) * fact_sales[Quantity]\n)"
  format_string: ''
  dax_name: Price Effect Amount
  display_folder: ''
sales.pvm.volume_effect.amount:
  dax_expression: "SUMX (\n    fact_sales,\n    VAR ActualQty = fact_sales[Quantity]\n\
    \    VAR PlanQty   = fact_sales[Plan Quantity]\n    VAR PlanPrice = DIVIDE ( fact_sales[Plan\
    \ Sales Amount], PlanQty )\n    RETURN ( ActualQty - PlanQty ) * PlanPrice\n)"
  format_string: ''
  dax_name: Volume Effect Amount
  display_folder: ''
