# Fabric-Measure-Overlay — Restbestand.
#
# Bis 04.08.2026 trug diese Datei fuer jeden KPI vier Felder. Drei davon waren
# keine eigene Information: dax_name war 104 von 105 mal identisch zu
# technical.measure_name, display_folder war 105 mal leer, format_string liess
# sich aus business.unit_format ableiten (fuer alle 108 KPIs mit Vorbild im
# handgebauten Modell exakt reproduziert). Sie kommen jetzt aus dem Katalog.
#
# Was bleibt, ist der einzige Fall mit echter Berechtigung: eine handgeschriebene
# DAX-Formel dort, wo die Katalog-Grammatik den Ausdruck nicht hergibt (op: hitl).
# Jeder neue Eintrag hier ist eine zweite Quelle fuer eine Rechenvorschrift und
# wird von tooling/superversion/tests/test_dax_parity_legacy.py abgelehnt.
#
# Diese Datei verschwindet ganz, sobald die Grammatik die letzten Faelle ausdrueckt.
