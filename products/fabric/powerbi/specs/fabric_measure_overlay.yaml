wc.ccc.days:
  dax_expression: '[DSO Days] + [DIO Days] - [DPO Days]'
  format_string: '0'
  dax_name: CCC Days
  display_folder: ''
wc.dio.days:
  dax_expression: 'VAR Inventory = SUM ( fact_inventory[Inventory Amount] )

    VAR COGS = SUM ( fact_inventory[COGS Amount] )

    RETURN DIVIDE ( Inventory * 365, COGS )'
  format_string: '0'
  dax_name: DIO Days
  display_folder: ''
wc.dpo.days:
  dax_expression: 'VAR AP = SUM ( fact_accounts_payable[AP Amount] )

    VAR COGS = SUM ( fact_accounts_payable[COGS Amount] )

    RETURN DIVIDE ( AP * 365, COGS )'
  format_string: '0'
  dax_name: DPO Days
  display_folder: ''
wc.dso.days:
  dax_expression: 'VAR AR = SUM ( fact_accounts_receivable[AR Amount] )

    VAR NetSales = SUM ( fact_accounts_receivable[Revenue Amount] )

    RETURN DIVIDE ( AR * 365, NetSales )'
  format_string: '0'
  dax_name: DSO Days
  display_folder: ''
