# Finance Semantic Model - Aurora Group
#
# Purpose:
#   Aurora-specific semantic model blueprint for Finance analytics domain
#   Covers cash & liquidity performance and cost control
#
# Scope:
#   Use Cases: FIN-001, FIN-002
#   Data: Aurora synthetic gold layer (fact_finance, fact_cash_position, fact_cash_flow,
#         fact_accounts_receivable, fact_accounts_payable, fact_inventory,
#         fact_cost, fact_output, fact_labor)
#   Tool: Power BI Semantic Model (TMDL format)
#
# Generation:
#   This blueprint drives TMDL generation for dist/Finance.SemanticModel/
#   Measures sourced from core/kpi_catalog/KPI_Catalog.md
#   Data contract: data_contracts/domains/finance.yaml

model_id: aurora_finance
domain: Finance
description: >
  Aurora Group Finance Analytics - Cash & liquidity performance,
  working capital management, and cost control vs plan.

# ────────────────────────────────────────────────────────────────────────────
# Use Cases
# ────────────────────────────────────────────────────────────────────────────
use_cases:
  - id: FIN-001
    title: "Cash & Liquidity Performance"
    purpose: "Control cash and liquidity by monitoring balances, operating cash flow, and working capital drivers"
    strategic_kpis:
      - KPI-FIN-006
      - KPI-FIN-007
      - KPI-FIN-009
      - KPI-FIN-010
      - KPI-FIN-001
      - KPI-FIN-004
      - KPI-FIN-005
    action_codes: [F-C1.1, F-C1.2, S-I1.2, F-C1.4]
    display_folder: "05_Cash & Liquidity"
    reporting_level: Tactical
    analytics_stage: Diagnostic / Predictive
    expected_impact: "Reduce CCC by 5–10 days through improved DSO collection and DPO discipline"

  - id: FIN-002
    title: "Cost Performance"
    purpose: "Reduce unit cost and improve margin by controlling material, labor, and OpEx vs plan"
    strategic_kpis:
      - KPI-FIN-015
      - KPI-FIN-016
      - KPI-FIN-014
      - KPI-SCM-020
      - KPI-OPS-004
    action_codes: [F-K2.1, F-K2.2, F-K2.3, F-K2.4]
    display_folder: "06_Cost Performance"
    reporting_level: Tactical
    analytics_stage: Diagnostic / Prescriptive
    expected_impact: "Reduce unit cost by 3–5% and OpEx variance to plan within ±2%"

# ────────────────────────────────────────────────────────────────────────────
# Tables
# ────────────────────────────────────────────────────────────────────────────
tables:
  dimensions:
    - table_name: dim_date
      description: "Calendar dimension for finance reporting"
      source_contract: data_contracts/domains/finance.yaml
      key_columns: [DateKey]
      attributes:
        - Date
        - Year
        - Quarter
        - Month
        - MonthNumber
      hierarchies:
        - name: Fiscal Calendar
          levels: [Year, Quarter, Month, Date]

    - table_name: dim_org
      description: "Entity/organization dimension (entity, region, country) for finance"
      source_contract: data_contracts/domains/finance.yaml
      key_columns: [OrgKey]
      attributes:
        - Entity
        - Region
        - Country
      hierarchies:
        - name: Org Hierarchy
          levels: [Region, Country, Entity]

    - table_name: dim_customer
      description: "Customer dimension for AR and revenue attribution (PII-free, Aurora synthetic)"
      source_contract: data_contracts/domains/finance.yaml
      key_columns: [CustomerKey]
      attributes:
        - CustomerCode
        - CustomerName
        - Region

    - table_name: dim_supplier
      description: "Supplier dimension for AP and procurement attribution"
      source_contract: data_contracts/domains/finance.yaml
      key_columns: [SupplierKey]
      attributes:
        - SupplierCode
        - SupplierName
        - Region

    - table_name: dim_product
      description: "Product dimension for inventory valuation and cost analysis"
      source_contract: data_contracts/domains/finance.yaml
      key_columns: [ProductKey]
      attributes:
        - ProductCode
        - ProductName
        - Category

  facts:
    - table_name: fact_finance
      description: "P&L facts (net sales, COGS, EBITDA, OpEx, plan) per entity-month"
      source_contract: data_contracts/domains/finance.yaml
      grain: entity_month
      foreign_keys: [DateKey, OrgKey]
      measures:
        - Net Sales Amount
        - COGS Amount
        - EBITDA Amount
        - Material Cost Amount
        - OpEx Amount
        - Plan OpEx Amount

    - table_name: fact_cash_position
      description: "Daily cash balance and plan cash per entity"
      source_contract: data_contracts/domains/finance.yaml
      grain: day
      foreign_keys: [DateKey, OrgKey]
      measures:
        - Cash Balance Amount
        - Plan Cash Amount

    - table_name: fact_cash_flow
      description: "Monthly operating cash flow, CapEx, and plan OCF per entity"
      source_contract: data_contracts/domains/finance.yaml
      grain: month
      foreign_keys: [DateKey, OrgKey]
      measures:
        - Operating Cash Flow Amount
        - CapEx Amount
        - Plan OCF Amount

    - table_name: fact_accounts_receivable
      description: "Accounts receivable and revenue by entity and customer per month"
      source_contract: data_contracts/domains/finance.yaml
      grain: month
      foreign_keys: [DateKey, OrgKey, CustomerKey]
      measures:
        - AR Amount
        - Revenue Amount

    - table_name: fact_accounts_payable
      description: "Accounts payable and COGS by entity and supplier per month"
      source_contract: data_contracts/domains/finance.yaml
      grain: month
      foreign_keys: [DateKey, OrgKey, SupplierKey]
      measures:
        - AP Amount
        - COGS Amount

    - table_name: fact_inventory
      description: "Inventory value by entity and product per month (finance view)"
      source_contract: data_contracts/domains/finance.yaml
      grain: month
      foreign_keys: [DateKey, OrgKey, ProductKey]
      measures:
        - Inventory Amount
        - Average Inventory Amount
        - COGS Amount

    - table_name: fact_cost
      description: "Cost breakdown (COGS, material, overhead) per plant-line-product-month"
      source_contract: data_contracts/domains/finance.yaml
      grain: plant_line_product_month
      foreign_keys: [DateKey, OrgKey, ProductKey]
      measures:
        - COGS Amount
        - Material Cost Amount
        - Overhead Amount

    - table_name: fact_output
      description: "Output units per plant-line-product-month"
      source_contract: data_contracts/domains/finance.yaml
      grain: plant_line_product_month
      foreign_keys: [DateKey, OrgKey, ProductKey]
      measures:
        - Output Units

    - table_name: fact_labor
      description: "Labor hours per plant-line-month"
      source_contract: data_contracts/domains/finance.yaml
      grain: plant_line_month
      foreign_keys: [DateKey, OrgKey]
      measures:
        - Labor Hours

  security:
    - table_name: security_user_org
      description: "User to Org mapping for Row-Level Security (RLS)"
      key_columns: [UserPrincipalName, OrgKey]
      purpose: "Restrict data access based on user's assigned entities/organizations"

# ────────────────────────────────────────────────────────────────────────────
# Relationships
# ────────────────────────────────────────────────────────────────────────────
relationships:
  # dim_date → fact tables
  - from_table: dim_date
    from_column: DateKey
    to_table: fact_finance
    to_column: DateKey
    cardinality: one-to-many
    cross_filter: single

  - from_table: dim_date
    from_column: DateKey
    to_table: fact_cash_position
    to_column: DateKey
    cardinality: one-to-many
    cross_filter: single

  - from_table: dim_date
    from_column: DateKey
    to_table: fact_cash_flow
    to_column: DateKey
    cardinality: one-to-many
    cross_filter: single

  - from_table: dim_date
    from_column: DateKey
    to_table: fact_accounts_receivable
    to_column: DateKey
    cardinality: one-to-many
    cross_filter: single

  - from_table: dim_date
    from_column: DateKey
    to_table: fact_accounts_payable
    to_column: DateKey
    cardinality: one-to-many
    cross_filter: single

  - from_table: dim_date
    from_column: DateKey
    to_table: fact_inventory
    to_column: DateKey
    cardinality: one-to-many
    cross_filter: single

  - from_table: dim_date
    from_column: DateKey
    to_table: fact_cost
    to_column: DateKey
    cardinality: one-to-many
    cross_filter: single

  - from_table: dim_date
    from_column: DateKey
    to_table: fact_output
    to_column: DateKey
    cardinality: one-to-many
    cross_filter: single

  - from_table: dim_date
    from_column: DateKey
    to_table: fact_labor
    to_column: DateKey
    cardinality: one-to-many
    cross_filter: single

  # dim_org → fact tables
  - from_table: dim_org
    from_column: OrgKey
    to_table: fact_finance
    to_column: OrgKey
    cardinality: one-to-many
    cross_filter: single

  - from_table: dim_org
    from_column: OrgKey
    to_table: fact_cash_position
    to_column: OrgKey
    cardinality: one-to-many
    cross_filter: single

  - from_table: dim_org
    from_column: OrgKey
    to_table: fact_cash_flow
    to_column: OrgKey
    cardinality: one-to-many
    cross_filter: single

  - from_table: dim_org
    from_column: OrgKey
    to_table: fact_accounts_receivable
    to_column: OrgKey
    cardinality: one-to-many
    cross_filter: single

  - from_table: dim_org
    from_column: OrgKey
    to_table: fact_accounts_payable
    to_column: OrgKey
    cardinality: one-to-many
    cross_filter: single

  - from_table: dim_org
    from_column: OrgKey
    to_table: fact_inventory
    to_column: OrgKey
    cardinality: one-to-many
    cross_filter: single

  - from_table: dim_org
    from_column: OrgKey
    to_table: fact_cost
    to_column: OrgKey
    cardinality: one-to-many
    cross_filter: single

  - from_table: dim_org
    from_column: OrgKey
    to_table: fact_output
    to_column: OrgKey
    cardinality: one-to-many
    cross_filter: single

  - from_table: dim_org
    from_column: OrgKey
    to_table: fact_labor
    to_column: OrgKey
    cardinality: one-to-many
    cross_filter: single

  # dim_customer → fact_accounts_receivable
  - from_table: dim_customer
    from_column: CustomerKey
    to_table: fact_accounts_receivable
    to_column: CustomerKey
    cardinality: one-to-many
    cross_filter: single

  # dim_supplier → fact_accounts_payable
  - from_table: dim_supplier
    from_column: SupplierKey
    to_table: fact_accounts_payable
    to_column: SupplierKey
    cardinality: one-to-many
    cross_filter: single

  # dim_product → fact tables with product grain
  - from_table: dim_product
    from_column: ProductKey
    to_table: fact_inventory
    to_column: ProductKey
    cardinality: one-to-many
    cross_filter: single

  - from_table: dim_product
    from_column: ProductKey
    to_table: fact_cost
    to_column: ProductKey
    cardinality: one-to-many
    cross_filter: single

  - from_table: dim_product
    from_column: ProductKey
    to_table: fact_output
    to_column: ProductKey
    cardinality: one-to-many
    cross_filter: single

  # RLS relationship
  - from_table: security_user_org
    from_column: OrgKey
    to_table: dim_org
    to_column: OrgKey
    cardinality: many-to-one
    cross_filter: single
    security: true

# ────────────────────────────────────────────────────────────────────────────
# Measures & Display Folders
# ────────────────────────────────────────────────────────────────────────────
display_folders:
  - folder_name: "05_Cash & Liquidity"
    description: "FIN-001: Cash position, operating cash flow, and working capital cycle"
    measures:
      - KPI-FIN-006
      - KPI-FIN-007
      - KPI-FIN-009
      - KPI-FIN-010
      - KPI-FIN-001
      - KPI-FIN-004
      - KPI-FIN-005
      - KPI-SCM-007
      - KPI-SCM-022
      - KPI-FIN-002

  - folder_name: "06_Cost Performance"
    description: "FIN-002: Unit cost, COGS share, OpEx vs plan, labor productivity"
    measures:
      - KPI-FIN-015
      - KPI-FIN-016
      - KPI-FIN-014
      - KPI-SCM-020
      - KPI-OPS-004
      - KPI-FIN-019
      - KPI-SCM-021
      - KPI-OPS-009
      - KPI-QUA-006
      - KPI-OPS-003
      - KPI-COM-005

  - folder_name: "Supporting Measures"
    description: "Hidden helper measures used by KPI calculations"
    visibility: hidden
    measures:
      - Net Sales Amount
      - COGS Amount
      - AR Amount
      - AP Amount
      - Inventory Amount

# ────────────────────────────────────────────────────────────────────────────
# Row-Level Security (RLS)
# ────────────────────────────────────────────────────────────────────────────
security_roles:
  - role_name: OrgAccess
    description: "Restrict finance data to user's assigned entities/organizations"
    dax_filter: |
      dim_org[OrgKey] IN CALCULATETABLE(
        VALUES(security_user_org[OrgKey]),
        security_user_org[UserPrincipalName] = USERPRINCIPALNAME()
      )
    applies_to_tables: [dim_org]
    notes:
      - RLS propagates to all fact tables via dim_org relationships
      - security_user_org must be populated with UserPrincipalName → OrgKey mappings
      - Finance RLS should align with entity-level access in ERP system

# ────────────────────────────────────────────────────────────────────────────
# Configuration & Notes
# ────────────────────────────────────────────────────────────────────────────
configuration:
  fiscal_year_start: "Jan 1"
  default_currency: EUR
  date_grain: day
  fact_grain: entity_month
  aggregation_behavior: sum
  time_intelligence: enabled

notes:
  data_source:
    - "Aurora synthetic data: showcases/aurora_group/data/gold/"
    - "Conforms to domain contracts: data_contracts/domains/finance.yaml"
    - "Delta Lake format (Parquet + _delta_log)"

  measure_definitions:
    - "DAX expressions sourced from core/kpi_catalog/KPI_Catalog.md"
    - "Generator: tooling/generation/generate_tmdl_measures.ps1"
    - "TMDL output: dist/Finance.SemanticModel/definition/tables/_Measures.tmdl"

  dependencies:
    - "Requires: fact_finance, fact_cash_position, fact_cash_flow (core FIN-001/002)"
    - "Requires: fact_accounts_receivable, fact_accounts_payable (DSO/DPO calculation)"
    - "Requires: fact_inventory, fact_cost, fact_output, fact_labor (FIN-002 cost analysis)"

  implementation_status:
    - "FIN-001: COMPLETE — 10 measures with real DAX in _Measures.tmdl"
    - "FIN-002: COMPLETE — 12 measures with real DAX in _Measures.tmdl"
    - "KPI-SCM-022: INTENTIONAL BLANK() — awaiting fact_supplier_risk table"

  future_enhancements:
