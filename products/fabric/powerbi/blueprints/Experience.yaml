# Experience Semantic Model - Aurora Group
#
# Purpose:
#   Aurora-specific semantic model blueprint for Experience analytics domain
#   Covers service level performance, resource utilization, and executive KPI overview
#
# Scope:
#   Use Cases: XD-001, XD-002, XD-003
#   Data: Aurora synthetic gold layer (fact_support_cases, fact_workforce_management, fact_nps)
#   Tool: Power BI Semantic Model (TMDL format)
#
# Generation:
#   This blueprint drives TMDL generation for dist/Experience.SemanticModel/
#   Measures sourced from core/kpi_catalog/KPI_Catalog.md
#   Data contract: data_contracts/domains/experience.yaml

model_id: aurora_experience
domain: Experience
description: >
  Aurora Group Experience Analytics - Service level and SLA attainment,
  workforce utilization, and cross-functional executive overview.

# ────────────────────────────────────────────────────────────────────────────
# Use Cases
# ────────────────────────────────────────────────────────────────────────────
use_cases:
  - id: XD-001
    title: "Service Level Performance"
    purpose: "Improve SLA attainment by identifying root causes of SLA breaches, high handle times, and case backlogs"
    strategic_kpis:
      - svc.sla.attainment.pct
      - svc.fcr.pct
      - svc.aht.minutes
      - svc.backlog.count
      - svc.nps.index
      - svc.escalation.pct
      - svc.tickets.created.count
      - svc.tickets.closed.count
    action_codes: [X-S1.1, X-S1.2, X-S1.3, X-S1.4]
    display_folder: "10_Service Level"
    reporting_level: Tactical / Operational
    analytics_stage: Diagnostic / Prescriptive
    expected_impact: "Lift SLA attainment to >95%; reduce escalation rate by 20% through FCR improvement"

  - id: XD-002
    title: "Resource Utilization"
    purpose: "Optimize workforce capacity by balancing utilization, occupancy, and shrinkage against service level"
    strategic_kpis:
      - res.utilization.pct
      - res.occupancy.pct
      - svc.sla.attainment.pct
      - res.overtime.pct
      - res.shrinkage.pct
      - svc.backlog.count
      - svc.tickets.created.count
    action_codes: [X-R2.1, X-R2.2, X-R2.3, X-R2.4]
    display_folder: "11_Resources"
    reporting_level: Tactical / Operational
    analytics_stage: Diagnostic / Predictive
    expected_impact: "Reduce overtime by 15%; improve utilization to target band; maintain SLA while reducing headcount cost"

  - id: XD-003
    title: "Executive KPI Overview"
    purpose: "Give C-level a single-screen view of enterprise health across Commercial, Finance, Ops, Supply Chain, and Experience"
    strategic_kpis:
      - margin.gm.pct
      - sales.net_sales.delta_pct.ly
      - crm.clv.amount
      - svc.sla.attainment.pct
      - ops.otif.pct
      - ops.working_capital.ccc.days
      - people.digital_adoption.pct
      - people.attrition_risk.pct
      - enterprise.action_routed.count
      - enterprise.action_outcome_rate.pct
      - enterprise.value_at_risk.index
    action_codes: [X-E3.2, X-E3.3]
    display_folder: "12_Executive"
    reporting_level: Strategic
    analytics_stage: Descriptive / Diagnostic
    expected_impact: "Single pane of glass for C-level; faster exception detection; drive action completion rate >80%"

# ────────────────────────────────────────────────────────────────────────────
# Tables
# ────────────────────────────────────────────────────────────────────────────
tables:
  dimensions:
    - table_name: dim_date
      description: "Calendar dimension for experience and service reporting"
      source_contract: data_contracts/domains/experience.yaml
      key_columns: [DateKey]
      attributes:
        - Date
        - Year
        - Quarter
        - Month
        - MonthNumber
        - Week
      hierarchies:
        - name: Calendar
          levels: [Year, Quarter, Month, Date]
        - name: Week Calendar
          levels: [Year, Week, Date]

    - table_name: dim_org
      description: "Organization dimension (region, channel, queue, agent group) for experience"
      source_contract: data_contracts/domains/experience.yaml
      key_columns: [OrgKey]
      attributes:
        - Region
        - Channel
        - Queue
        - Agent Group
      hierarchies:
        - name: Org Hierarchy
          levels: [Region, Channel, Queue]

    - table_name: dim_case_queue
      description: "Support case queue dimension (queue name, channel, region)"
      source_contract: data_contracts/domains/experience.yaml
      key_columns: [QueueKey]
      attributes:
        - QueueName
        - Channel
        - Region

    - table_name: dim_issue_type
      description: "Issue type dimension (type, severity) for case classification"
      source_contract: data_contracts/domains/experience.yaml
      key_columns: [IssueKey]
      attributes:
        - IssueType
        - Severity

  facts:
    - table_name: fact_support_cases
      description: "Support case facts (SLA met, FCR, handle time, escalation, backlog, open flag)"
      source_contract: data_contracts/domains/experience.yaml
      grain: case
      foreign_keys: [DateKey, OrgKey, QueueKey, IssueKey]
      measures:
        - SLA Met Flag
        - FCR Flag
        - Handle Time Minutes
        - Escalation Flag
        - Backlog Flag
        - Open Case Flag

    - table_name: fact_workforce_management
      description: "Workforce management facts (work, paid, talk, wrap, idle, overtime, shrinkage) per agent-day"
      source_contract: data_contracts/domains/experience.yaml
      grain: agent_day
      foreign_keys: [DateKey, OrgKey, QueueKey]
      measures:
        - Work Time Minutes
        - Paid Time Minutes
        - Talk Time Minutes
        - Wrap Time Minutes
        - Idle Time Minutes
        - Overtime Minutes
        - Shrinkage Minutes

    - table_name: fact_nps
      description: "NPS survey facts (score per survey response)"
      source_contract: data_contracts/domains/experience.yaml
      grain: survey
      foreign_keys: [DateKey, OrgKey, QueueKey]
      measures:
        - NPS Score

  security:
    - table_name: security_user_org
      description: "User to Org mapping for Row-Level Security (RLS)"
      key_columns: [UserPrincipalName, OrgKey]
      purpose: "Restrict experience data to user's assigned queues/regions/channels"

# ────────────────────────────────────────────────────────────────────────────
# Relationships
# ────────────────────────────────────────────────────────────────────────────
relationships:
  # dim_date → fact tables
  - from_table: dim_date
    from_column: DateKey
    to_table: fact_support_cases
    to_column: DateKey
    cardinality: one-to-many
    cross_filter: single

  - from_table: dim_date
    from_column: DateKey
    to_table: fact_workforce_management
    to_column: DateKey
    cardinality: one-to-many
    cross_filter: single

  - from_table: dim_date
    from_column: DateKey
    to_table: fact_nps
    to_column: DateKey
    cardinality: one-to-many
    cross_filter: single

  # dim_org → fact tables
  - from_table: dim_org
    from_column: OrgKey
    to_table: fact_support_cases
    to_column: OrgKey
    cardinality: one-to-many
    cross_filter: single

  - from_table: dim_org
    from_column: OrgKey
    to_table: fact_workforce_management
    to_column: OrgKey
    cardinality: one-to-many
    cross_filter: single

  - from_table: dim_org
    from_column: OrgKey
    to_table: fact_nps
    to_column: OrgKey
    cardinality: one-to-many
    cross_filter: single

  # dim_case_queue → fact tables
  - from_table: dim_case_queue
    from_column: QueueKey
    to_table: fact_support_cases
    to_column: QueueKey
    cardinality: one-to-many
    cross_filter: single

  - from_table: dim_case_queue
    from_column: QueueKey
    to_table: fact_workforce_management
    to_column: QueueKey
    cardinality: one-to-many
    cross_filter: single

  - from_table: dim_case_queue
    from_column: QueueKey
    to_table: fact_nps
    to_column: QueueKey
    cardinality: one-to-many
    cross_filter: single

  # dim_issue_type → fact_support_cases
  - from_table: dim_issue_type
    from_column: IssueKey
    to_table: fact_support_cases
    to_column: IssueKey
    cardinality: one-to-many
    cross_filter: single

  # RLS relationship
  - from_table: security_user_org
    from_column: OrgKey
    to_table: dim_org
    to_column: OrgKey
    cardinality: many-to-one
    cross_filter: single
    security: true

# ────────────────────────────────────────────────────────────────────────────
# Measures & Display Folders
# ────────────────────────────────────────────────────────────────────────────
display_folders:
  - folder_name: "10_Service Level"
    description: "XD-001: SLA attainment, FCR, handle time, backlog, NPS, escalation"
    measures:
      - svc.sla.attainment.pct
      - svc.fcr.pct
      - svc.aht.minutes
      - svc.backlog.count
      - svc.nps.index
      - svc.escalation.pct
      - svc.tickets.created.count
      - svc.tickets.closed.count

  - folder_name: "11_Resources"
    description: "XD-002: Utilization, occupancy, overtime, shrinkage, and workload balance"
    measures:
      - res.utilization.pct
      - res.occupancy.pct
      - svc.sla.attainment.pct
      - res.overtime.pct
      - res.shrinkage.pct
      - svc.backlog.count
      - svc.tickets.created.count

  - folder_name: "12_Executive"
    description: "XD-003: Cross-functional executive scorecard — Commercial, Finance, Ops, SC, Experience"
    measures:
      - margin.gm.pct
      - sales.net_sales.delta_pct.ly
      - crm.clv.amount
      - svc.sla.attainment.pct
      - ops.otif.pct
      - ops.working_capital.ccc.days
      - people.digital_adoption.pct
      - people.attrition_risk.pct
      - enterprise.action_routed.count
      - enterprise.action_outcome_rate.pct
      - enterprise.value_at_risk.index
      - supply.otif.pct
      - sales.net_sales.amount
      - cost.cogs.amount

  - folder_name: "Supporting Measures"
    description: "Hidden helper measures used by KPI calculations"
    visibility: hidden
    measures:
      - Handle Time Minutes
      - Work Time Minutes
      - Paid Time Minutes
      - Talk Time Minutes
      - Wrap Time Minutes

# ────────────────────────────────────────────────────────────────────────────
# Row-Level Security (RLS)
# ────────────────────────────────────────────────────────────────────────────
security_roles:
  - role_name: OrgAccess
    description: "Restrict experience data to user's assigned queues, regions, and channels"
    dax_filter: |
      dim_org[OrgKey] IN CALCULATETABLE(
        VALUES(security_user_org[OrgKey]),
        security_user_org[UserPrincipalName] = USERPRINCIPALNAME()
      )
    applies_to_tables: [dim_org]
    notes:
      - RLS propagates to all fact tables via dim_org relationships
      - security_user_org must be populated with UserPrincipalName → OrgKey mappings
      - Executive users (XD-003) typically receive unrestricted OrgAccess

# ────────────────────────────────────────────────────────────────────────────
# Configuration & Notes
# ────────────────────────────────────────────────────────────────────────────
configuration:
  fiscal_year_start: "Jan 1"
  default_currency: EUR
  date_grain: day
  fact_grain: case
  aggregation_behavior: sum
  time_intelligence: enabled

notes:
  data_source:
    - "Aurora synthetic data: showcases/aurora_group/data/gold/"
    - "Conforms to domain contracts: data_contracts/domains/experience.yaml"
    - "Delta Lake format (Parquet + _delta_log)"

  measure_definitions:
    - "DAX expressions sourced from core/kpi_catalog/KPI_Catalog.md"
    - "Generator: tooling/generation/generate_tmdl_measures.ps1"
    - "TMDL output: dist/Experience.SemanticModel/definition/tables/_Measures.tmdl"

  dependencies:
    - "Requires: fact_support_cases (SLA, FCR, handle time, escalation — XD-001)"
    - "Requires: fact_workforce_management (utilization, occupancy, shrinkage — XD-002)"
    - "Requires: fact_nps (NPS score — XD-001)"
    - "XD-003 references KPIs from other domains — cross-model measures via composite model or shared measures"

  cross_domain_note:
    - "XD-003 (Executive KPI Overview) references measures from Commercial (margin.gm.pct, crm.clv.amount),"
    - "Operations (ops.otif.pct, ops.working_capital.ccc.days), and Supply Chain (supply.otif.pct)."
    - "In a Fabric deployment, implement XD-003 as a Composite Model that references the other domain models,"
    - "or duplicate the critical cross-domain KPIs as shared measures in this model."

  implementation_status:
