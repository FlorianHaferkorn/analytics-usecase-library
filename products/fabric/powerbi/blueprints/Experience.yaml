    - "XD-002: COMPLETE — 7 measures with real DAX in _Measures.tmdl"
    - "XD-003: COMPLETE — 13 measures (2 intentional BLANK() for people.digital_adoption.pct and people.attrition_risk.pct)"
    - "people.digital_adoption.pct: INTENTIONAL BLANK() — awaiting fact_it + fact_hr data contract"
    - "people.attrition_risk.pct: INTENTIONAL BLANK() — awaiting predictive attrition model output"

  future_enhancements:
    - "Implement XD-003 as Composite Model consuming Commercial, Finance, Operations, SupplyChain models"
    - "Add fact_it and fact_hr tables to unlock people.digital_adoption.pct and people.attrition_risk.pct"
    - "Add dim_agent for agent-level drill-through in workforce analysis (XD-002)"
    - "Implement real-time refresh for SLA attainment and backlog (XD-001)"

governance:
  business_owner: "COO / Chief Customer Officer"
  data_owner: "Experience BI Team"
  steward: "Head of Service Operations Analytics"
  review_cycle: monthly
  maintainers: [analytics-core-team, aurora-showcase-team]
  version: v1.0
  last_updated: 2026-03-24
