# Supply Chain Semantic Model - Aurora Group
#
# Purpose:
#   Aurora-specific semantic model blueprint for Supply Chain analytics domain
#   Covers inventory performance, supply reliability (OTIF), and forecast accuracy
#
# Scope:
#   Use Cases: SCM-001, SCM-002, SCM-003
#   Data: Aurora synthetic gold layer (fact_inventory, fact_cogs, fact_fulfillment,
#         fact_stockout, fact_forecast, fact_sales, fact_procurement)
#   Tool: Power BI Semantic Model (TMDL format)
#
# Generation:
#   This blueprint drives TMDL generation for dist/SupplyChain.SemanticModel/
#   Measures sourced from core/kpi_catalog/KPI_Catalog.md
#   Data contract: data_contracts/domains/supply_chain.yaml

model_id: aurora_supply_chain
domain: SupplyChain
description: >
  Aurora Group Supply Chain Analytics - Inventory optimization, delivery reliability
  (OTIF), and demand forecast accuracy.

# ────────────────────────────────────────────────────────────────────────────
# Use Cases
# ────────────────────────────────────────────────────────────────────────────
use_cases:
  - id: SCM-001
    title: "Inventory Performance"
    purpose: "Optimize inventory levels by balancing turnover, stockout risk, and working capital"
    strategic_kpis:
      - KPI-SCM-001
      - KPI-SCM-016
      - KPI-SCM-002
      - KPI-SCM-007
      - KPI-SCM-004
      - KPI-SCM-005
      - KPI-COM-012
    action_codes: [S-I1.1, S-I1.2, S-I1.3, S-I1.4, S-I1.5]
    display_folder: "07_Inventory"
    reporting_level: Tactical / Operational
    analytics_stage: Diagnostic / Prescriptive
    expected_impact: "Reduce DIO by 5–8 days; cut obsolescence by 15% through ABC/XYZ-driven replenishment"

  - id: SCM-002
    title: "Supply Reliability & OTIF"
    purpose: "Improve on-time in-full delivery performance by eliminating root causes of late or partial shipments"
    strategic_kpis:
      - KPI-SCM-007
      - KPI-SCM-008
      - KPI-SCM-018
      - KPI-SCM-009
      - KPI-SCM-011
      - KPI-SCM-010
      - KPI-SCM-013
      - KPI-SCM-015
    action_codes: [S-R2.1, S-R2.2, S-R2.3, S-R2.4, S-R2.5]
    display_folder: "08_OTIF"
    reporting_level: Tactical / Operational
    analytics_stage: Diagnostic / Prescriptive
    expected_impact: "Lift OTIF to >95%; reduce expedite costs by 20% through proactive exception management"

  - id: SCM-003
    title: "Forecast vs Actual"
    purpose: "Improve demand forecast accuracy to reduce safety stock, stockouts, and supply volatility"
    strategic_kpis:
      - KPI-SCM-005
      - KPI-SCM-017
      - KPI-SCM-006
      - KPI-SCM-012
      - KPI-SCM-013
      - KPI-SCM-014
      - KPI-COM-012
    action_codes: [S-F3.1, S-F3.2, S-F3.3, S-F3.4]
    display_folder: "09_Forecast"
    reporting_level: Tactical
    analytics_stage: Diagnostic / Predictive
    expected_impact: "Improve forecast accuracy by 5–8pp; reduce replan cycles and downstream supply disruptions"

# ────────────────────────────────────────────────────────────────────────────
# Tables
# ────────────────────────────────────────────────────────────────────────────
tables:
  dimensions:
    - table_name: dim_date
      description: "Calendar dimension for supply chain time slicing"
      source_contract: data_contracts/domains/supply_chain.yaml
      key_columns: [DateKey]
      attributes:
        - Date
        - Year
        - Quarter
        - Month
        - MonthNumber
        - Week
      hierarchies:
        - name: Calendar
          levels: [Year, Quarter, Month, Date]
        - name: Week Calendar
          levels: [Year, Week, Date]

    - table_name: dim_org
      description: "Location/organization dimension (location, region, channel, customer) for supply chain"
      source_contract: data_contracts/domains/supply_chain.yaml
      key_columns: [OrgKey]
      attributes:
        - Location
        - Region
        - Channel
        - Customer
      hierarchies:
        - name: Location Hierarchy
          levels: [Region, Channel, Location]
        - name: Org Hierarchy
          levels: [Country, OrgLevel, OrgName]

    - table_name: dim_product
      description: "Product dimension with ABC/XYZ classification for supply chain analysis"
      source_contract: data_contracts/domains/supply_chain.yaml
      key_columns: [ProductKey]
      attributes:
        - ProductCode
        - ProductName
        - Category
        - Subcategory
        - ABC_Class
        - XYZ_Class
      hierarchies:
        - name: Product Hierarchy
          levels: [Category, Subcategory, ProductName]
        - name: ABC/XYZ Classification
          levels: [ABC_Class, XYZ_Class, ProductName]

    - table_name: dim_lane
      description: "Transport lane dimension (origin, destination, mode) for OTIF analysis"
      source_contract: data_contracts/domains/supply_chain.yaml
      key_columns: [LaneKey]
      attributes:
        - Origin
        - Destination
        - Mode

    # E8 (24.09.2026): Gold fuehrt Beschaffung auf Kategorie x Lieferant (Vertrag supply_chain.yaml).
    - table_name: dim_category
      description: "Procurement spend category (direct merchandise vs indirect)"
      source_contract: data_contracts/domains/supply_chain.yaml
      key_columns: [CategoryKey]
      attributes:
        - Category
        - Category Group

    - table_name: dim_vendor
      description: "Procurement vendor (region, tier)"
      source_contract: data_contracts/domains/supply_chain.yaml
      key_columns: [VendorKey]
      attributes:
        - Vendor
        - Region
        - Tier

  facts:
    - table_name: fact_inventory
      description: "Inventory snapshot (average/obsolete) at location-SKU-month grain"
      source_contract: data_contracts/domains/supply_chain.yaml
      grain: location_sku_month
      foreign_keys: [DateKey, OrgKey, ProductKey]
      measures:
        - Average Inventory Amount
        - Average Inventory Units
        - Obsolete Inventory Amount
        - Obsolete Inventory Units

    - table_name: fact_cogs
      description: "Cost of goods sold at location-SKU-month grain"
      source_contract: data_contracts/domains/supply_chain.yaml
      grain: location_sku_month
      foreign_keys: [DateKey, OrgKey, ProductKey]
      measures:
        - COGS Amount

    - table_name: fact_fulfillment
      description: "Order-level fulfillment facts (OTIF, on-time, in-full, penalties, expedite)"
      source_contract: data_contracts/domains/supply_chain.yaml
      grain: order
      foreign_keys: [DateKey, OrgKey, ProductKey, LaneKey]
      measures:
        - OTIF Flag
        - On-Time Flag
        - In-Full Flag
        - Order Correct Flag
        - Order Qty
        - Penalty Amount
        - Expedite Cost

    - table_name: fact_stockout
      description: "Stockout events and lost demand at location-SKU-day"
      source_contract: data_contracts/domains/supply_chain.yaml
      grain: location_sku_day
      foreign_keys: [DateKey, OrgKey, ProductKey]
      measures:
        - Stockout Flag
        - Lost Demand Units
        - Demand Units

    - table_name: fact_forecast
      description: "Demand forecast by SKU, location, and month (with version tracking)"
      source_contract: data_contracts/domains/supply_chain.yaml
      grain: sku_location_month
      foreign_keys: [DateKey, ProductKey, OrgKey]
      measures:
        - Forecast Units
        - Forecast Version

    - table_name: fact_sales
      description: "Sales units by SKU and month (supply chain demand view)"
      source_contract: data_contracts/domains/supply_chain.yaml
      grain: sku_month
      foreign_keys: [DateKey, ProductKey, OrgKey]
      measures:
        - Sales Units

    - table_name: fact_procurement
      description: "Purchase order line facts (amount, quantity, contracted vs actual)"
      source_contract: data_contracts/domains/supply_chain.yaml
      grain: purchase_order_line
      foreign_keys: [DateKey, OrgKey, CategoryKey, VendorKey]   # E8: kein ProductKey in Gold
      measures:
        - Purchase Amount
        - Contracted Amount
        - Actual Unit Price
        - Contract Unit Price
        - Purchase Quantity

  security:
    - table_name: security_user_org
      description: "User to Org mapping for Row-Level Security (RLS)"
      key_columns: [UserPrincipalName, OrgKey]
      purpose: "Restrict supply chain data to user's assigned locations/organizations"

# ────────────────────────────────────────────────────────────────────────────
# Relationships
# ────────────────────────────────────────────────────────────────────────────
relationships:
  # dim_date → fact tables
  - from_table: dim_date
    from_column: DateKey
    to_table: fact_inventory
    to_column: DateKey
    cardinality: one-to-many
    cross_filter: single

  - from_table: dim_date
    from_column: DateKey
    to_table: fact_cogs
    to_column: DateKey
    cardinality: one-to-many
    cross_filter: single

  - from_table: dim_date
    from_column: DateKey
    to_table: fact_fulfillment
    to_column: DateKey
    cardinality: one-to-many
    cross_filter: single

  - from_table: dim_date
    from_column: DateKey
    to_table: fact_stockout
    to_column: DateKey
    cardinality: one-to-many
    cross_filter: single

  - from_table: dim_date
    from_column: DateKey
    to_table: fact_forecast
    to_column: DateKey
    cardinality: one-to-many
    cross_filter: single

  - from_table: dim_date
    from_column: DateKey
    to_table: fact_sales
    to_column: DateKey
    cardinality: one-to-many
    cross_filter: single

  - from_table: dim_date
    from_column: DateKey
    to_table: fact_procurement
    to_column: DateKey
    cardinality: one-to-many
    cross_filter: single

  # dim_org → fact tables
  - from_table: dim_org
    from_column: OrgKey
    to_table: fact_inventory
    to_column: OrgKey
    cardinality: one-to-many
    cross_filter: single

  - from_table: dim_org
    from_column: OrgKey
    to_table: fact_cogs
    to_column: OrgKey
    cardinality: one-to-many
    cross_filter: single

  - from_table: dim_org
    from_column: OrgKey
    to_table: fact_fulfillment
    to_column: OrgKey
    cardinality: one-to-many
    cross_filter: single

  - from_table: dim_org
    from_column: OrgKey
    to_table: fact_stockout
    to_column: OrgKey
    cardinality: one-to-many
    cross_filter: single

  - from_table: dim_org
    from_column: OrgKey
    to_table: fact_forecast
    to_column: OrgKey
    cardinality: one-to-many
    cross_filter: single

  - from_table: dim_org
    from_column: OrgKey
    to_table: fact_sales
    to_column: OrgKey
    cardinality: one-to-many
    cross_filter: single

  - from_table: dim_org
    from_column: OrgKey
    to_table: fact_procurement
    to_column: OrgKey
    cardinality: one-to-many
    cross_filter: single

  # dim_product → fact tables
  - from_table: dim_product
    from_column: ProductKey
    to_table: fact_inventory
    to_column: ProductKey
    cardinality: one-to-many
    cross_filter: single

  - from_table: dim_product
    from_column: ProductKey
    to_table: fact_cogs
    to_column: ProductKey
    cardinality: one-to-many
    cross_filter: single

  - from_table: dim_product
    from_column: ProductKey
    to_table: fact_fulfillment
    to_column: ProductKey
    cardinality: one-to-many
    cross_filter: single

  - from_table: dim_product
    from_column: ProductKey
    to_table: fact_stockout
    to_column: ProductKey
    cardinality: one-to-many
    cross_filter: single

  - from_table: dim_product
    from_column: ProductKey
    to_table: fact_forecast
    to_column: ProductKey
    cardinality: one-to-many
    cross_filter: single

  - from_table: dim_product
    from_column: ProductKey
    to_table: fact_sales
    to_column: ProductKey
    cardinality: one-to-many
    cross_filter: single

  # E8 (24.09.2026): Beschaffung haengt an Kategorie und Lieferant, nicht am Produkt.
  - from_table: dim_category
    from_column: CategoryKey
    to_table: fact_procurement
    to_column: CategoryKey
    cardinality: one-to-many
    cross_filter: single

  - from_table: dim_vendor
    from_column: VendorKey
    to_table: fact_procurement
    to_column: VendorKey
    cardinality: one-to-many
    cross_filter: single

  # dim_lane → fact_fulfillment
  - from_table: dim_lane
    from_column: LaneKey
    to_table: fact_fulfillment
    to_column: LaneKey
    cardinality: one-to-many
    cross_filter: single

  # RLS relationship
  - from_table: security_user_org
    from_column: OrgKey
    to_table: dim_org
    to_column: OrgKey
    cardinality: many-to-one
    cross_filter: single
    security: true

# ────────────────────────────────────────────────────────────────────────────
# Measures & Display Folders
# ────────────────────────────────────────────────────────────────────────────
display_folders:
  - folder_name: "07_Inventory"
    description: "SCM-001: Inventory performance — DIO, turnover, stockout, obsolescence"
    measures:
      - KPI-SCM-001
      - KPI-SCM-016
      - KPI-SCM-002
      - KPI-SCM-007
      - KPI-SCM-004
      - KPI-SCM-005
      - KPI-COM-012

  - folder_name: "08_OTIF"
    description: "SCM-002: Supply reliability — OTIF, on-time, in-full, penalties, expedite"
    measures:
      - KPI-SCM-007
      - KPI-SCM-008
      - KPI-SCM-018
      - KPI-SCM-009
      - KPI-SCM-011
      - KPI-SCM-010
      - KPI-SCM-013
      - KPI-SCM-015

  - folder_name: "09_Forecast"
    description: "SCM-003: Forecast accuracy — MAPE, bias, service impact, replan frequency"
    measures:
      - KPI-SCM-005
      - KPI-SCM-017
      - KPI-SCM-006
      - KPI-SCM-012
      - KPI-SCM-014
      - KPI-SCM-013
      - KPI-COM-012

  - folder_name: "Supporting Measures"
    description: "Hidden helper measures used by KPI calculations"
    visibility: hidden
    measures:
      - Average Inventory Amount
      - COGS Amount
      - Lost Demand Units
      - Demand Units

# ────────────────────────────────────────────────────────────────────────────
# Row-Level Security (RLS)
# ────────────────────────────────────────────────────────────────────────────
security_roles:
  - role_name: OrgAccess
    description: "Restrict supply chain data to user's assigned locations/organizations"
    dax_filter: |
      dim_org[OrgKey] IN CALCULATETABLE(
        VALUES(security_user_org[OrgKey]),
        security_user_org[UserPrincipalName] = USERPRINCIPALNAME()
      )
    applies_to_tables: [dim_org]
    notes:
      - RLS propagates to all fact tables via dim_org relationships
      - security_user_org must be populated with UserPrincipalName → OrgKey mappings
      - Align location access with ERP warehouse/plant authorization groups

# ────────────────────────────────────────────────────────────────────────────
# Configuration & Notes
# ────────────────────────────────────────────────────────────────────────────
configuration:
  fiscal_year_start: "Jan 1"
  default_currency: EUR
  date_grain: day
  fact_grain: order
  aggregation_behavior: sum
  time_intelligence: enabled

notes:
  data_source:
    - "Aurora synthetic data: showcases/aurora_group/data/gold/"
    - "Conforms to domain contracts: data_contracts/domains/supply_chain.yaml"
    - "Delta Lake format (Parquet + _delta_log)"

  measure_definitions:
    - "DAX expressions sourced from core/kpi_catalog/KPI_Catalog.md"
    - "Generator: tooling/generation/generate_tmdl_measures.ps1"
    - "TMDL output: dist/SupplyChain.SemanticModel/definition/tables/_Measures.tmdl"

  dependencies:
    - "Requires: fact_inventory + fact_cogs (DIO, turnover, obsolescence — SCM-001)"
    - "Requires: fact_fulfillment (OTIF, on-time, in-full — SCM-002)"
    - "Requires: fact_stockout (stockout rate and lost demand — SCM-001/002)"
    - "Requires: fact_forecast + fact_sales (forecast accuracy — SCM-003)"
    - "Requires: dim_lane for lane-level OTIF breakdown (SCM-002)"

  implementation_status:
    - "SCM-001: COMPLETE — 7 measures with real DAX in _Measures.tmdl"
    - "SCM-002: COMPLETE — 8 measures with real DAX in _Measures.tmdl"
    - "SCM-003: COMPLETE — 8 measures with real DAX in _Measures.tmdl"

  future_enhancements:
    - "Add dim_supplier for supplier-level OTIF and procurement analysis (SCM-002)"
    - "Add fact_replenishment for replenishment cycle time and fill rate"
    - "Add fact_logistics for lane-level cost and transport performance"
    - "Implement time intelligence: rolling 13-week trend for OTIF and forecast accuracy"

governance:
  business_owner: "Chief Supply Chain Officer"
  data_owner: "Supply Chain BI Team"
  steward: "Head of Supply Chain Controlling"
  review_cycle: monthly
  maintainers: [analytics-core-team, aurora-showcase-team]
  version: v1.0
  last_updated: 2026-03-24
