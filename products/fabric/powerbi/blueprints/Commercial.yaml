# Commercial Semantic Model - Aurora Group
#
# Purpose:
#   Aurora-specific semantic model blueprint for Commercial analytics domain
#   Covers sales, margin, customer value, and promotion effectiveness use cases
#
# Scope:
#   Use Cases: COM-001, COM-002, COM-003, COM-004
#   Data: Aurora synthetic gold layer (fact_sales, dimensions)
#   Tool: Power BI Semantic Model (TMDL format)
#
# Generation:
#   This blueprint drives TMDL generation for showcases/aurora_group/semantic_models/Commercial.SemanticModel/
#   Measures sourced from core/kpi_catalog/KPI_Catalog.md
#   Display folders defined in semantic_models/domains/Commercial/Measure_Dictionary_Commercial.md

model_id: aurora_commercial
domain: Commercial
description: >
  Aurora Group Commercial Analytics - Sales performance, margin optimization,
  customer lifetime value, and promotion effectiveness.

# ────────────────────────────────────────────────────────────────────────────
# Use Cases
# ────────────────────────────────────────────────────────────────────────────
use_cases:
  - id: COM-001
    title: "Sales Performance vs Plan & LY"
    purpose: "Explain Net Sales performance vs Plan and vs Last Year by price, volume, mix, and channel/region"
    strategic_kpis:
      - sales.net_sales.amount
      - sales.net_sales.delta_pct.plan
      - sales.net_sales.delta_pct.ly
      - margin.gm.pct
      - sales.pvm.price_effect.amount
      - sales.pvm.volume_effect.amount
      - sales.pvm.mix_effect.amount
    action_codes: [P2, P4, M3, D1]
    display_folder: "01_Sales Performance"
    reporting_level: Tactical
    analytics_stage: Descriptive / Diagnostic
    expected_impact: "Faster detection of revenue gaps; targeted pricing and mix actions to stabilise gross margin"

  - id: COM-002
    title: "Margin & Price Performance"
    purpose: "Protect and improve gross margin by explaining leakage across price realization, mix, and unit cost"
    strategic_kpis:
      - margin.gm.pct
      - margin.gm.amount
      - sales.price.realization_pct
      - sales.pvm.mix_effect.amount
      - cost.cogs_per_unit.amount
      - margin.gm.vs_plan.pct
    action_codes: [P2, M3, D1, PC2]
    display_folder: "02_Margin Analysis"
    reporting_level: Tactical
    analytics_stage: Diagnostic / Prescriptive
    expected_impact: "+0.5-1.5 pp GM%, tighter discount discipline, clearer mix levers, faster correction of cost leakage"

  - id: COM-003
    title: "Customer Value"
    purpose: "Maximise customer lifetime value by improving retention, reducing churn, and prioritising profitable segments"
    strategic_kpis:
      - crm.clv.amount
      - crm.lifetime_revenue.amount
      - crm.retention.pct
      - crm.churned_customers.count
      - crm.revenue_at_risk.amount
      - crm.active_customers.count
      - crm.nps.index
      - crm.complaint.count
    action_codes: [C1, P2, M3, D1]
    display_folder: "03_Customer Analysis"
    reporting_level: Tactical
    analytics_stage: Diagnostic / Predictive
    expected_impact: "Higher CLV and margin through targeted retention/upsell actions; reduced revenue leakage from churn"

  - id: COM-004
    title: "Promotion Effectiveness"
    purpose: "Improve promotion ROI by measuring true incremental sales and margin, controlling leakage"
    strategic_kpis:
      - sales.promo.roi.pct
      - sales.promo.incremental.amount
      - margin.promo.gm.pct
      - sales.price.realization_pct
      - sales.promo.cannibalization.pct
    action_codes: [PC2, P2, M3, D1]
    display_folder: "04_Promotion"
    reporting_level: Tactical
    analytics_stage: Diagnostic / Prescriptive
    expected_impact: "Fewer unprofitable promos; higher incremental GM; better channel/product targeting; reduced cannibalization"

# ────────────────────────────────────────────────────────────────────────────
# Tables
# ────────────────────────────────────────────────────────────────────────────
tables:
  dimensions:
    - table_name: dim_date
      description: "Conformed date dimension with fiscal calendar (Aurora: FY starts Apr 1)"
      source_contract: data_contracts/domains/commercial_sales.yaml
      key_columns: [DateKey]
      attributes:
        - Date
        - Fiscal Year
        - Fiscal Quarter
        - Fiscal Month
        - Month Number
        - Month Name
        - Weekday Number
        - Weekday Name
      hierarchies:
        - name: Fiscal Calendar
          levels: [Fiscal Year, Fiscal Quarter, Fiscal Month, Date]
        - name: ISO Calendar
          levels: [Calendar Year, Calendar Quarter, Calendar Month, Date]

    - table_name: dim_org
      description: "Organization hierarchy (Region → Country → Channel → Org)"
      source_contract: data_contracts/domains/commercial_sales.yaml
      key_columns: [OrgKey]
      attributes:
        - Org Name
        - Region Name
        - Country Name
        - Channel Name
        - Org Type
      hierarchies:
        - name: Org Hierarchy
          levels: [Region Name, Country Name, Channel Name, Org Name]

    - table_name: dim_product
      description: "Product master with category hierarchy"
      source_contract: data_contracts/domains/commercial_sales.yaml
      key_columns: [ProductKey]
      attributes:
        - Product Name
        - Product Code
        - Brand
        - Category
        - Subcategory
        - Unit Cost Amount
      hierarchies:
        - name: Product Hierarchy
          levels: [Category, Subcategory, Brand, Product Name]

    - table_name: dim_customer
      description: "Customer master (PII-free, Aurora synthetic)"
      source_contract: data_contracts/domains/commercial_sales.yaml
      key_columns: [CustomerKey]
      attributes:
        - Customer Name
        - Customer Segment
        - Region
        - Country

  facts:
    - table_name: fact_sales
      description: "Sales transactions (invoice line level)"
      source_contract: data_contracts/domains/commercial_sales.yaml
      grain: "InvoiceLineID (one row per product per invoice)"
      key_columns: [InvoiceLineID]
      foreign_keys:
        - DateKey
        - OrgKey
        - ProductKey
        - CustomerKey
        - PromoKey
      measures:
        - Quantity
        - Plan Quantity
        - Net Sales Amount
        - Plan Sales Amount
        - Last Year Sales Amount
        - Cost of Goods Sold Amount
        - Plan COGS Amount
        - List Price Amount
        - Net Price Amount
        - Discount Amount
      partitions:
        - Fiscal Year
        - Fiscal Month

  security:
    - table_name: security_user_org
      description: "User to Org mapping for Row-Level Security (RLS)"
      key_columns: [UserPrincipalName, OrgKey]
      purpose: "Restrict data access based on user's assigned organizations"

# ────────────────────────────────────────────────────────────────────────────
# Relationships
# ────────────────────────────────────────────────────────────────────────────
relationships:
  # Date relationships
  - from_table: dim_date
    from_column: DateKey
    to_table: fact_sales
    to_column: DateKey
    cardinality: one-to-many
    cross_filter: single

  # Org relationships
  - from_table: dim_org
    from_column: OrgKey
    to_table: fact_sales
    to_column: OrgKey
    cardinality: one-to-many
    cross_filter: single

  # Product relationships
  - from_table: dim_product
    from_column: ProductKey
    to_table: fact_sales
    to_column: ProductKey
    cardinality: one-to-many
    cross_filter: single

  # Customer relationships
  - from_table: dim_customer
    from_column: CustomerKey
    to_table: fact_sales
    to_column: CustomerKey
    cardinality: one-to-many
    cross_filter: single

  # RLS relationship (many-to-one for security enforcement)
  - from_table: security_user_org
    from_column: OrgKey
    to_table: dim_org
    to_column: OrgKey
    cardinality: many-to-one
    cross_filter: single
    security: true

# ────────────────────────────────────────────────────────────────────────────
# Measures & Display Folders
# ────────────────────────────────────────────────────────────────────────────
display_folders:
  - folder_name: "01_Sales Performance"
    description: "COM-001: Sales vs Plan and Last Year, PVM decomposition"
    measures:
      - sales.net_sales.amount
      - sales.net_sales.delta_pct.plan
      - sales.net_sales.delta_pct.ly
      - margin.gm.pct
      - sales.pvm.price_effect.amount
      - sales.pvm.volume_effect.amount
      - sales.pvm.mix_effect.amount

  - folder_name: "02_Margin Analysis"
    description: "COM-002: Gross margin protection and price realization"
    measures:
      - margin.gm.pct
      - margin.gm.amount
      - sales.price.realization_pct
      - sales.pvm.mix_effect.amount
      - cost.cogs_per_unit.amount
      - margin.gm.vs_plan.pct

  - folder_name: "03_Customer Analysis"
    description: "COM-003: Customer lifetime value and retention"
    measures:
      - crm.clv.amount
      - crm.lifetime_revenue.amount
      - crm.retention.pct
      - crm.churned_customers.count
      - crm.revenue_at_risk.amount
      - crm.active_customers.count
      - crm.nps.index
      - crm.complaint.count

  - folder_name: "04_Promotion"
    description: "COM-004: Promotion ROI and effectiveness"
    measures:
      - sales.promo.roi.pct
      - sales.promo.incremental.amount
      - margin.promo.gm.pct
      - sales.price.realization_pct
      - sales.promo.cannibalization.pct

  - folder_name: "Supporting Measures"
    description: "Hidden helper measures used by KPI calculations"
    visibility: hidden
    measures:
      - Net Sales Amount
      - Cost of Goods Sold Amount
      - List Price Amount
      - Net Price Amount
      - Price Effect Amount
      - Volume Effect Amount

# ────────────────────────────────────────────────────────────────────────────
# Row-Level Security (RLS)
# ────────────────────────────────────────────────────────────────────────────
security_roles:
  - role_name: OrgAccess
    description: "Restrict data to user's assigned organizations via security_user_org"
    dax_filter: |
      dim_org[OrgKey] IN CALCULATETABLE(
        VALUES(security_user_org[OrgKey]),
        security_user_org[UserPrincipalName] = USERPRINCIPALNAME()
      )
    applies_to_tables: [dim_org]
    notes:
      - RLS propagates to fact_sales via dim_org relationship
      - security_user_org must be populated with UserPrincipalName → OrgKey mappings
      - Test with different user contexts before production deployment

# ────────────────────────────────────────────────────────────────────────────
# Configuration & Notes
# ────────────────────────────────────────────────────────────────────────────
configuration:
  fiscal_year_start: "Apr 1"
  default_currency: EUR
  date_grain: day
  fact_grain: invoice_line
  aggregation_behavior: sum
  time_intelligence: enabled

notes:
  data_source:
    - "Aurora synthetic data: showcases/aurora_group/data/gold/"
    - "Conforms to domain contracts: data_contracts/domains/commercial_sales.yaml"
    - "Delta Lake format (Parquet + _delta_log)"

  measure_definitions:
    - "DAX expressions sourced from core/kpi_catalog/KPI_Catalog.md"
    - "Display folder mapping in semantic_models/domains/Commercial/Measure_Dictionary_Commercial.md"
    - "Generator: tooling/generation/generate_tmdl_measures.ps1"

  dependencies:
    - "Requires: core/kpi_catalog/KPI_Catalog.md populated with dax_expression for all KPIs"
    - "Requires: semantic_models/domains/Commercial/Measure_Dictionary_Commercial.md"
    - "Optional: fact_customer_value, fact_customer_events for COM-003 full implementation"

  implementation_status:
    - "COM-002: COMPLETE (6 measures with real DAX, tested in Power BI)"
    - "COM-001: PENDING (need DAX expressions in KPI Catalog)"
    - "COM-003: PENDING (need DAX expressions + customer tables)"
    - "COM-004: PENDING (need DAX expressions + promotion analysis logic)"

  future_enhancements:
    - "Add dim_promo for promotion analysis (COM-004)"
    - "Add fact_customer_value, fact_customer_events for customer analytics (COM-003)"
    - "Implement time intelligence measures (YTD, QTD, Rolling 12M)"
    - "Add calculation groups for time intelligence patterns"
    - "Implement What-If parameters for scenario planning"

governance:
  business_owner: "Head of Commercial Analytics"
  data_owner: "Commercial BI Team"
  steward: "Senior Business Analyst - Commercial"
  review_cycle: monthly
  maintainers: [analytics-core-team, aurora-showcase-team]
  version: v1.0
  last_updated: 2026-01-27
