# Lint/Style Rules for TMDL (machine-checked in CI)
# Scope: enforce our Allowed Subset and house style. Adjust safely via PRs.

requireDescriptions:
  tables: true
  columns: true
  measures: true

naming:
  currencySuffix: " Amount"
  integerSuffixes: [" Qty", " Count", " Distinct Count"]
  percentSuffix: " %"
  timeSuffixes: ["YTD", "MTD", "QTD", "YoY", "MoM"]

format:
  currency: "€ #,0.00"
  percent: "0.0 %"
  integer: "#,0"
  date: "dd.MM.yyyy"

measures:
  requireDisplayFolder: true
  requireFormatStringFor:
    - suffix: " %"
      formatString: "0.0 %"
    - suffix: " Amount"
      formatString: "€ #,0.00"
  forbidAssignmentOperator: true            # DAX does not support ':='
  defaultSummarization:
    percent: "None"

columns:
  hideTechnicalByPattern: ["*Key", "*_id"]
  requireSortByForLabels: true
  requireDataCategoryFor:
    - contains: "Currency"
    - contains: "Country"
    - contains: "City"
    - contains: "WebURL"
    - contains: "ImageURL"
  defaultSummarization:
    keys: "None"
    labels: "None"
    qty: "Sum"
    count: "Sum"

relationships:
  enforceSingleDirectionDefault: true
  forbidBothUnlessTagged: true
  allowedCardinalities: ["ManyToOne"]

partitions:
  allowedModes: ["import", "DirectLake", "DirectQuery"]
  preferredModes: ["import", "DirectLake"]
  requiredNamingPattern: "^p_([0-9]{6}|all)$"   # e.g., p_202501 or p_all

ci:
  failOnWarning: true
  minReferentialIntegrity: 0.999    # target ≥ 99.9%
