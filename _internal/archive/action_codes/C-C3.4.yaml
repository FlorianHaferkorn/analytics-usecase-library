schema_version: "1.1"

id: "C-C3.4"
name: "Experience-Driven Churn Prevention"
owner_domain: "Customer Experience / Service"
impact_dimension: "Growth"

status: "active"
lifecycle:
  introduced_date: "2025-12-18"
  deprecated_date: null
  replaced_by: null
  change_notes: []

category:
  group: "Customer Experience Steering"
  theme: "Reduce Churn via Service Quality Correction"

tags: ["cx", "nps", "complaints", "churn-prevention"]

strategic_alignment:
  strategic_kpis:
    - id: "crm.complaint.count"
      role: "primary"
    - id: "crm.nps.index"
      role: "secondary"
  decisions_enabled:
    - "Escalate service issues for high-value customers"
    - "Trigger root-cause correction for CX-driven churn risk"
  non_goals:
    - "Broad CX transformation programs"
    - "Generic satisfaction surveys"
    - "Retention discounting (handled by C-C3.1)"

use_case_links:
  core_use_cases:
    - "COM-003"
  related_use_cases: []

kpis:
  trigger_kpis:
    - kpi_id: "crm.complaint.count"
      label: "Customer Complaints Count"
      semantic_ref:
        model_domain: "CustomerValue"
        measure: "Customer Complaints Count"
    - kpi_id: "crm.nps.index"
      label: "Net Promoter Score"
      semantic_ref:
        model_domain: "CustomerValue"
        measure: "NPS Score"
  guardrail_kpis:
    - kpi_id: "crm.clv.amount"
      label: "Customer Lifetime Value Amount"
      semantic_ref:
        model_domain: "CustomerValue"
        measure: "Customer Lifetime Value Amount"
  outcome_kpis:
    - kpi_id: "crm.complaint.count"
      label: "Customer Complaints Count"
      semantic_ref:
        model_domain: "CustomerValue"
        measure: "Customer Complaints Count"
    - kpi_id: "crm.nps.index"
      label: "Net Promoter Score"
      semantic_ref:
        model_domain: "CustomerValue"
        measure: "NPS Score"

scope:
  default_grain: "month"
  default_perspective: ["Customer Segment", "Channel"]
  supported_slices:
    - "Region"
  exclusions:
    - "Low-CLV customers below prioritisation threshold"
    - "Customers already churned"
    - "Customers in active retention save workflows (C-C3.1)"

trigger:
  type: "Pattern"
  evaluation:
    grain: "month"
    window:
      kind: "rolling"
      length: 2
      unit: "periods"
    persistence:
      required: true
      min_consecutive_periods: 2
    minimum_data:
      min_observations: 1
      volume_guardrail:
        enabled: true
        metric_kpi_id: "crm.clv.amount"
        comparator: "gte"
        value: 25000
        unit: "amount"
  levels:
    L1:
      severity: "EarlyWarning"
      condition:
        metric_kpi_id: "crm.complaint.count"
        comparator: "gt"
        threshold:
          basis: "absolute"
          value: 1
          unit: "count"
        filters: []
    L2:
      severity: "RequiredIntervention"
      condition:
        metric_kpi_id: "crm.nps.index"
        comparator: "lt"
        threshold:
          basis: "absolute"
          value: 30
          unit: "score"
        filters: []
    L3:
      severity: "PrescriptiveExecution"
      condition:
        metric_kpi_id: "crm.complaint.count"
        comparator: "gt"
        threshold:
          basis: "absolute"
          value: 3
          unit: "count"
        filters: []
  gating_rules:
    - "Trigger only for customers above CLV prioritisation threshold"
    - "Do not trigger if churn already materialised"
    - "Exclude customers with open contractual disputes"

impact:
  category: "Medium"
  expected_range:
    metric_kpi_id: "crm.complaint.count"
    value_low: -10.0
    value_high: -30.0
    unit: "%"
    time_to_effect:
      min_periods: 1
      max_periods: 3
  mechanism:
    - "Faster resolution of service issues"
    - "Reduction of recurring complaint drivers"
  confidence:
    level: "Medium"
    rationale:
      - "Strong correlation between CX issues and churn"
      - "Effectiveness depends on service response quality"

operational_execution:
  primary_owner_role: "Customer Service Lead"
  stakeholders:
    - "Customer Success"
    - "Operations"
  prerequisites:
    - "Complaint categorisation and root-cause tagging"
    - "Escalation paths defined for high-value customers"
  steps:
    - "Identify high-CLV customers with rising complaints or low NPS"
    - "Trigger service escalation and root-cause analysis"
    - "Implement corrective actions"
    - "Monitor CX recovery over next cycles"
  effort:
    level: "Medium"
    typical_duration_days: 45
  risks_and_tradeoffs:
    - "Service capacity constraints"
    - "Over-escalation leading to inefficiency"

data_requirements:
  required_entities:
    - "Customer"
    - "Customer Segment"
    - "Channel"
  semantic_dependencies:
    measures:
      - "Customer Complaints Count"
      - "NPS Score"
      - "Customer Lifetime Value Amount"
    tables:
      - "fact_complaints"
      - "fact_nps"
      - "fact_customer_value"
      - "dim_customer"

automation:
  detection:
    enabled: true
    evaluation_frequency: "monthly"
    output: "High-value customers with CX-driven churn risk"
  suggested_actions:
    enabled: true
    outputs:
      - "CX escalation and root-cause action list"
  copilot_prompts: []

tracking:
  execution_log:
    enabled: true
    recommended_storage: "fact_action_execution"
    minimum_fields:
      - "ActionCode"
      - "CustomerKey"
      - "TriggerLevel"
      - "ExecutedDate"
  outcome_evaluation:
    enabled: true
    recommended_storage: "fact_action_outcome"
    minimum_fields:
      - "ActionCode"
      - "Pre_Complaints"
      - "Post_Complaints_60d"
      - "Pre_NPS"
      - "Post_NPS_60d"

governance:
  approvals_required:
    - "Head of Customer Service"
  rollback_plan:
    - "De-escalate if service backlog exceeds tolerance"
  documentation_links:
    - "usecases/core/COM-003/Business_Factsheet.md"

quality_rules:
  - "All kpi_id values must exist in KPI catalog."
  - "Trigger severity must be strictly increasing from L1 to L3."
  - "impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis."
  - "If status=deprecated then lifecycle.replaced_by is required."
  - "No free-text trigger notes: use gating_rules and structured filters."

