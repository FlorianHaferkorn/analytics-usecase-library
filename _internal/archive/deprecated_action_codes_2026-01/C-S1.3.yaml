schema_version: "1.1"

inherits_decision_spine: "pricing_discipline"

id: "C-S1.3"
name: "Mix Steering to Margin-Safe Growth"
owner_domain: "Commercial"
impact_dimension: "Profitability"

status: "active"
lifecycle:
  introduced_date: "2025-12-18"
  deprecated_date: null
  replaced_by: null
  change_notes: []

category:
  group: "Product & Portfolio Steering"
  theme: "Improve Sales Mix Quality"

tags: ["mix", "portfolio", "margin-quality"]

strategic_alignment:
  strategic_kpis:
    - id: "margin.gm.pct"
      role: "primary"
    - id: "sales.net_sales.amount"
      role: "secondary"
  decisions_enabled:
    - "Prioritize higher-margin SKUs in sales focus"
    - "Deprioritize low-margin volume drivers"
  non_goals:
    - "List price changes"
    - "Promotion design or ROI optimization"
    - "Assortment rationalization programs"

use_case_links:
  core_use_cases:
    - "COM-001"
  related_use_cases:
    - "COM-002"

kpis:
  trigger_kpis:
    - kpi_id: "sales.pvm.mix_effect.amount"
      label: "Mix Effect Amount"
      semantic_ref:
        model_domain: "Commercial"
        measure: "Mix Effect Amount"
  guardrail_kpis:
    - kpi_id: "margin.gm.pct"
      label: "Gross Margin %"
      semantic_ref:
        model_domain: "Commercial"
        measure: "Gross Margin %"
  outcome_kpis:
    - kpi_id: "margin.gm.pct"
      label: "Gross Margin %"
      semantic_ref:
        model_domain: "Commercial"
        measure: "Gross Margin %"

scope:
  default_grain: "month"
  default_perspective: ["Region", "Channel"]
  supported_slices:
    - "Product Category"
    - "Brand"
  exclusions:
    - "Strategic SKUs"
    - "Contractually fixed assortments"

trigger:
  type: "Pattern"
  evaluation:
    grain: "month"
    window:
      kind: "rolling"
      length: 3
      unit: "periods"
    persistence:
      required: true
      min_consecutive_periods: 2
    minimum_data:
      min_observations: 2
      volume_guardrail:
        enabled: true
        metric_kpi_id: "sales.net_sales.amount"
        comparator: "gte"
        value: 150000
        unit: "amount"
  levels:
    L1:
      severity: "EarlyWarning"
      condition:
        metric_kpi_id: "sales.pvm.mix_effect.amount"
        comparator: "lt"
        threshold:
          basis: "absolute"
          value: 0
          unit: "amount"
        filters: []
    L2:
      severity: "RequiredIntervention"
      condition:
        metric_kpi_id: "sales.pvm.mix_effect.amount"
        comparator: "lt"
        threshold:
          basis: "absolute"
          value: -50000
          unit: "amount"
        filters: []
    L3:
      severity: "PrescriptiveExecution"
      condition:
        metric_kpi_id: "sales.pvm.mix_effect.amount"
        comparator: "lt"
        threshold:
          basis: "absolute"
          value: -150000
          unit: "amount"
        filters: []
  gating_rules:
    - "Trigger only if Gross Margin % < target despite stable pricing"
    - "Do not trigger if volume effect is primary negative driver"
    - "Exclude SKUs flagged as strategic or mandatory"

impact:
  category: "Medium"
  expected_range:
    metric_kpi_id: "margin.gm.pct"
    value_low: 0.3
    value_high: 1.0
    unit: "pp"
    time_to_effect:
      min_periods: 1
      max_periods: 3
  mechanism:
    - "Shift sales focus to higher-margin products"
    - "Reduce exposure to low-margin mix components"
  confidence:
    level: "Medium"
    rationale:
      - "Observed mix elasticity in comparable categories"
      - "No price dependency reduces execution risk"

operational_execution:
  primary_owner_role: "Category Manager"
  stakeholders:
    - "Sales Operations"
    - "Regional Sales Leads"
  prerequisites:
    - "Defined product margin tiers"
    - "Clear classification of strategic SKUs"
  steps:
    - "Identify categories with persistent negative mix effect"
    - "Rank SKUs by margin contribution"
    - "Adjust sales focus and incentives"
    - "Monitor mix shift monthly"
  effort:
    level: "Medium"
    typical_duration_days: 60

data_requirements:
  required_entities:
    - "Region"
    - "Channel"
    - "Product"
  semantic_dependencies:
    measures:
      - "Mix Effect Amount"
      - "Gross Margin %"
      - "Net Sales Amount"
    tables:
      - "fact_sales"
      - "dim_product"
      - "dim_org"

automation:
  detection:
    enabled: true
    evaluation_frequency: "monthly"
    output: "Categories and SKUs with adverse mix patterns"
  suggested_actions:
    enabled: true
    outputs:
      - "SKU priority lists by margin tier"
  copilot_prompts: []

tracking:
  execution_log:
    enabled: true
    recommended_storage: "fact_action_execution"
    minimum_fields:
      - "ActionCode"
      - "TriggerLevel"
      - "Category"
      - "Region"
      - "ExecutedDate"
  outcome_evaluation:
    enabled: true
    recommended_storage: "fact_action_outcome"
    minimum_fields:
      - "ActionCode"
      - "Pre_GM_Pct"
      - "Post_GM_Pct_60d"

governance:
  approvals_required:
    - "Commercial Controlling Lead"
    - "Category Management Lead"
  rollback_plan:
    - "Revert mix focus if Net Sales decline exceeds tolerance"
  documentation_links:
    - "usecases/core/COM-001/Business_Factsheet.md"

quality_rules:
  - "All kpi_id values must exist in KPI catalog."
  - "Trigger severity must be strictly increasing from L1 to L3."
  - "impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis."
  - "If status=deprecated then lifecycle.replaced_by is required."
  - "No free-text trigger notes: use gating_rules and structured filters."
