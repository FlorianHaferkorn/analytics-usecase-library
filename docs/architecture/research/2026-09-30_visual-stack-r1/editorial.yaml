- id: editorial-015
  pattern: 'Urban: Titel = Hauptaussage, Qualifier in den Untertitel'
  description: Titel nennt den Hauptpunkt des Charts, kürzer als zwei Zeilen, ohne Qualifier; Jahre, Einheiten,
    Präzisierungen gehören in den Untertitel; Methodik in Quelle/Anmerkungen, nicht in Titel oder Labels.
  source: *id002
  evidence: The main point of the chart. Try to keep shorter than two lines and avoid qualifiers.
