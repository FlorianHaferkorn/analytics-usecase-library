- id: editorial-014
  pattern: 'Urban: Typografie-Hierarchie (Web/Print)'
  description: 'Feste Größen je Textrolle; Titel fett, Achsentitel kursiv und immer horizontal über dem obersten
    Achsenlabel, Einheiten in Klammern im Achsentitel statt an den Ticks. Schrift Lato, Ersatz Arial; Textfarbe
    #000000.'
  source: &id002
