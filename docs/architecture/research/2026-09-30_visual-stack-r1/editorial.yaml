    - NEU:priestley_timeline
    - NEU:candlestick
    - NEU:streamgraph
    - NEU:column_line_combo
    style_pack: editorial
    layer: idiom
  confidence: from_source
- id: editorial-006
  pattern: FT-Kategorie Part-to-whole
  description: 'Zerlegung einer Einheit in Bestandteile; wenn nur die Größe der Teile interessiert, Magnitude-Chart
    nehmen. Chart-Typen: Stacked column/bar, Marimekko, Pie, Donut, Treemap, Voronoi, Arc, Gridplot, Venn, Waterfall.'
  source: *id001
  evidence: If the reader's interest is solely in the size of the components, consider a magnitude-type chart instead.
  parameters: {}
  applies_to:
    purposes:
    - part_to_whole
    idioms:
    - bar_stacked
    - stacked_100
    - donut
    - waterfall_buildup
    - NEU:treemap
    - NEU:marimekko
    - NEU:gridplot_waffle
    - NEU:arc_hemicycle
    - NEU:voronoi
    style_pack: editorial
    layer: idiom
  confidence: from_source
- id: editorial-007
  pattern: FT-Kategorie Magnitude
  description: 'Größenvergleich, relativ oder absolut; meist gezählte Mengen statt Raten. Chart-Typen: Column, Bar,
    Paired column/bar, Marimekko, Proportional symbol, Isotype, Lollipop, Radar, Parallel coordinates, Bullet, Grouped
    symbol. Bullet (Messwert gegen Ziel/Leistungsband) steht laut Textextraktion in diesem Bereich; Spaltenzuordnung
    aus PDF-Text abgeleitet.'
  source: *id001
  evidence: Usually these show a 'counted' number (for example, barrels, dollars or people) rather than a calculated
    rate or per cent.
  parameters: {}
  applies_to:
    purposes:
    - compare_categories
    - deviation_from_target
    idioms:
    - bar_absolute
    - lollipop
    - bullet
    - NEU:paired_bar
    - NEU:isotype
    - NEU:proportional_symbol
    - NEU:radar
    - NEU:parallel_coordinates
    - NEU:grouped_symbol
    style_pack: editorial
    layer: idiom
  confidence: from_source
- id: editorial-008
  pattern: FT-Kategorie Spatial
  description: 'Karten nur, wenn genaue Lage oder geografisches Muster wichtiger ist als alles andere; Choropleth
    immer mit Raten statt Summen. Chart-Typen: Choropleth, Proportional symbol, Flow map, Contour, Equalised/Scaled
    cartogram, Dot density, Heat map. Kein Purpose in unserer Liste deckt Raum ab.'
  source: *id001
  evidence: should always be rates rather than totals and use a sensible base geography.
  parameters: {}
  applies_to:
    purposes: []
    idioms:
    - NEU:choropleth
    - NEU:proportional_symbol_map
    - NEU:flow_map
    - NEU:equalised_cartogram
    - NEU:dot_density
    style_pack: editorial
    layer: idiom
  confidence: from_source
- id: editorial-009
  pattern: FT-Kategorie Flow
  description: 'Volumen oder Intensität von Bewegung zwischen Zuständen (logische Sequenzen oder Orte). Chart-Typen:
    Sankey, Waterfall (Sequenz durch einen Prozess, typischerweise Budgets, mit +/- Komponenten), Chord, Network.'
  source: *id001
  evidence: Show the reader volumes or intensity of movement between two or more states or conditions.
  parameters: {}
  applies_to:
    purposes:
    - flow_between_stages
    - contribution_to_change
    idioms:
    - sankey
    - waterfall_buildup
    - waterfall_variance
    - NEU:chord
    - NEU:network
    style_pack: editorial
    layer: idiom
  confidence: from_source
- id: editorial-010
  pattern: 'FT-Auswahllogik: wichtigste Datenbeziehung zuerst'
  description: 'Auswahl in zwei Schritten: (1) die für die Geschichte wichtigste Datenbeziehung aus 9 Kategorien
    wählen, (2) innerhalb der Kategorie Chart-Typen als Startpunkt prüfen. Ausdrücklich kein Wizard und nicht erschöpfend.
    Für die automatische Auswahl: Kategorie = Purpose-Feld je Use-Case-Frage, Chart-Typ = Idiom-Kandidatenliste.'
  source: *id001
  evidence: Use the categories across the top to decide which data relationship is most important in your story
  parameters:
    kategorien: 9
  applies_to:
    purposes:
    - time_comparison
    - deviation_from_target
    - compare_categories
    - part_to_whole
    - correlation
    - flow_between_stages
    - distribution
    idioms: []
    style_pack: editorial
    layer: selection_logic
  confidence: from_source
- id: editorial-011
  pattern: 'FT: Nullbasis nur für Längen-Encodings'
  description: Bar/Column müssen bei 0 beginnen; Lollipop muss nicht (aber vorzugsweise). Säulen über Zeit am besten
    mit nur einer Serie; Paired column wird ab mehr als 2 Serien schwer lesbar.
  source: *id001
  evidence: The standard way to compare the size of things. Must always start at 0 on the axis.
  parameters:
    paired_column_max_series: 2
  applies_to:
