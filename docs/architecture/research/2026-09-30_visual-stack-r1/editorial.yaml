- id: editorial-001
  pattern: FT-Kategorie Deviation
  description: 'Abweichung (+/-) von einem festen Bezugspunkt (Null, Ziel oder Langfristmittel), auch Stimmungsdaten.
    Chart-Typen: Diverging bar, Diverging stacked bar, Spine, Surplus/deficit filled line. Abbildung: deviation_from_target;
    Diverging bar = deviation_bar vorhanden, übrige neu.'
  source: &id001
    title: Visual Vocabulary (Poster, EN)
    publisher: Financial Times Visual Journalism Team
    url: https://github.com/Financial-Times/chart-doctor/blob/main/visual-vocabulary/Visual-vocabulary-en.pdf
    date_published: '2019'
    date_accessed: '2026-09-30'
    kind: primary
  evidence: Emphasise variations (+/-) from a fixed reference point. Typically the reference point is zero but it
    can also be a target or a long-term average.
  parameters: {}
  applies_to:
    purposes:
    - deviation_from_target
    - value_verdict
    idioms:
    - deviation_bar
    - NEU:diverging_stacked_bar
    - NEU:spine
    - NEU:surplus_deficit_line
    style_pack: editorial
    layer: idiom
  confidence: from_source
- id: editorial-002
  pattern: FT-Kategorie Correlation
  description: 'Beziehung zwischen zwei oder mehr Variablen, mit Warnhinweis, dass Leser Kausalität unterstellen.
    Chart-Typen: Scatterplot, Column + line timeline, Connected scatterplot, Bubble, XY heatmap. Abbildung: correlation;
    nur scatter vorhanden.'
  source: *id001
  evidence: Be mindful that, unless you tell them otherwise, many readers will assume the relationships you show
    them to be causal
  parameters: {}
  applies_to:
    purposes:
    - correlation
    idioms:
    - scatter
    - NEU:connected_scatter
    - NEU:bubble
    - NEU:xy_heatmap
    - NEU:column_line_combo
    style_pack: editorial
    layer: idiom
  confidence: from_source
- id: editorial-003
  pattern: FT-Kategorie Ranking
  description: 'Position in einer geordneten Liste wichtiger als absoluter Wert; Punkte von Interesse hervorheben.
    Chart-Typen: Ordered bar/column, Ordered proportional symbol, Dot strip plot, Slope, Lollipop, Bump. Abbildung:
    compare_categories (Rang).'
  source: *id001
  evidence: Use where an item's position in an ordered list is more important than its absolute or relative value.
  parameters: {}
  applies_to:
    purposes:
    - compare_categories
    idioms:
    - bar_ranking
    - lollipop
    - slope
    - NEU:dot_strip
    - NEU:bump
    - NEU:ordered_proportional_symbol
    style_pack: editorial
    layer: idiom
  confidence: from_source
- id: editorial-004
  pattern: FT-Kategorie Distribution
  description: 'Werte und ihre Häufigkeit; Schiefe als Aussage über Ungleichheit. Chart-Typen: Histogram, Boxplot,
    Violin, Population pyramid, Dot strip plot, Dot plot, Barcode plot, Cumulative curve, Frequency polygons, Beeswarm.
    Histogramm: Lücken zwischen Säulen klein halten, damit die Form sichtbar wird.'
  source: *id001
  evidence: The standard way to show a statistical distribution - keep the gaps between columns small to highlight
    the 'shape' of the data.
  parameters: {}
  applies_to:
    purposes:
    - distribution
    idioms:
    - histogram
    - boxplot
    - dumbbell
    - NEU:violin
    - NEU:population_pyramid
    - NEU:beeswarm
    - NEU:barcode_plot
    - NEU:cumulative_curve
    - NEU:frequency_polygon
    - NEU:dot_strip
    style_pack: editorial
    layer: idiom
  confidence: from_source
- id: editorial-005
  pattern: FT-Kategorie Change over Time
  description: 'Trends betonen, kurz (intraday) bis Jahrhunderte; die Wahl des Zeitfensters ist Teil der Aussage.
    Chart-Typen: Line, Column, Column + line, Slope, Area, Fan chart, Connected scatterplot, Calendar heatmap, Priestley/Circle/Vertical
    timeline, Seismogram, Candlestick, Streamgraph. Vertical timeline ist explizit für Scrollen auf Mobilgeräten
    gedacht.'
  source: *id001
  evidence: Choosing the correct time period is important to provide suitable context for the reader.
  parameters: {}
  applies_to:
    purposes:
    - time_comparison
    idioms:
    - line
    - column_time
    - slope
    - area_stacked
