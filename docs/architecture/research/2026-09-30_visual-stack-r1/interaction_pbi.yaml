  must_have_for_parity: false
  vegavisual: {status: build, basis: "Vega-Lite interval selection möglich, aber nicht an onInteraction gekoppelt (inferred)"}

- id: pbi-017
  pattern: Kontextmenü (Rechtsklick/Long-Press) mit Datenpunkt-Aktionen inkl. Include/Exclude
  description: >-
    Rechtsklick auf Leerfläche zeigt das Basismenü, auf einem Datenpunkt zusätzlich "Show data point as a table",
