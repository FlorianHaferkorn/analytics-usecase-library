  evidence: "You can only cross-filter line charts, scatter charts, and maps. You can't cross-highlight them."
  parameters: {}
  applies_to:
    purposes: []
    idioms: [line, scatter]
    style_pack: pbi_native
    layer: interaction
  confidence: from_source
  user_value: medium
  must_have_for_parity: true
  vegavisual: {status: build, basis: "kein Interaktionsmatrix-Konzept im Paket; Host-Logik (inferred)"}

- id: pbi-014
  pattern: Legendeneintrag anklicken wählt die ganze Serie
  description: >-
    Klick auf einen Legendeneintrag hebt die Serie hervor und cross-highlightet andere Visuals; per Tastatur über den
