# R1 Strang interaction_pbi: Konsumenten-Interaktionsbaseline eines Power-BI-Report-Visuals (Stand 30.09.2026)
# Zweck: Paritätsliste für die eigene Vega-Lite-Chartbibliothek (Fabric App via VegaVisual + HTML).
# Quellenzugang:
#   - Microsoft Learn: Inhalte über den Microsoft-Learn-MCP (docs_search) gelesen. Direkter Abruf von
#     learn.microsoft.com per curl scheitert am Egress-Proxy (CONNECT 403); ms.date war daher nicht lesbar
#     -> date_published: unbekannt. Zitate stammen aus den MCP-Auszügen der genannten Seite.
#   - npmjs.com-Paketseite: WebFetch 403 (blockiert). registry.npmjs.org erreichbar: fabric-visuals latest = 4.1.0
#     (Registry-Zeit 2026-09-23T23:31Z). Tarball 4.1.0 geladen, 4.0.0 lokal im Freelancing-Scaffold-Cache.
# Zusatzfelder (über FORMAT.md hinaus, vom Auftrag verlangt):
#   user_value: high|medium|low            -> eigene Einschätzung, immer inferred
#   must_have_for_parity: true|false       -> eigene Einschätzung, immer inferred
#   vegavisual: {status, basis}            -> native | partial | build | n_a (was @microsoft/fabric-visuals mitbringt)
# style_pack: pbi_native (Kandidat für "Power-BI-Standardverhalten").

# ---------------------------------------------------------------- Tooltips
- id: pbi-001
  pattern: Standard-Tooltip mit Feldname und Wert je Datenpunkt
  description: >-
    Hover über einen Datenpunkt zeigt Feldname und Wert aller im Visual verwendeten Felder, gestylt aus dem
    Report-Theme. Unterstützt u. a. Balken, Säulen, Linie, Fläche, Treemap, Scatter, Pie/Donut, Ribbon, Funnel, Waterfall.
  source:
    title: Visual tooltips in Power BI
    publisher: Microsoft
    url: https://learn.microsoft.com/power-bi/visuals/power-bi-visualization-visual-tooltips
    date_published: unbekannt
    date_accessed: 2026-09-30
    kind: primary
  evidence: "By default, the tooltip shows: The field name and value for each field used in the visual."
  parameters: {}
  applies_to:
    purposes: [evidence_detail]
    idioms: []
    style_pack: pbi_native
    layer: interaction
  confidence: from_source
  user_value: high
  must_have_for_parity: true
  vegavisual: {status: native, basis: "vega-tooltip-Dependency; CHANGELOG 2.0.0 'Treat empty params array as built-in tooltip', Theme-Tooltips (#285)"}

- id: pbi-002
  pattern: Zusätzliche Tooltip-Felder (Tooltip-Feldbereich) und "nur Tooltip-Felder"
  description: >-
    Autor legt weitere Measures/Dimensionen in den Tooltip-Feldbereich; Option "Tooltip fields only" zeigt nur diese.
    Tabellen und Matrizen haben keinen Tooltip-Feldbereich.
  source:
    title: Visual tooltips in Power BI
    publisher: Microsoft
    url: https://learn.microsoft.com/power-bi/visuals/power-bi-visualization-visual-tooltips
    date_published: unbekannt
    date_accessed: 2026-09-30
    kind: primary
  evidence: "Tooltip fields only: Turn on to show only the fields you add to the Tooltip field well."
  parameters: {}
  applies_to:
    purposes: [evidence_detail, driver_breakdown]
    idioms: []
    style_pack: pbi_native
    layer: interaction
  confidence: from_source
  user_value: high
  must_have_for_parity: true
  vegavisual: {status: native, basis: "Vega-Lite tooltip-Kanal nimmt beliebige Felder; Spalten-displayName aus DataTable (CHANGELOG #284)"}

- id: pbi-003
  pattern: Satz-Tooltip aus Vorlage
  description: >-
    Tooltip kann statt Feldliste einen Satz aus einer Vorlage mit Feldreferenzen in geschweiften Klammern rendern,
    optional mit fett gesetzten Werten.
  source:
    title: Visual tooltips in Power BI
    publisher: Microsoft
    url: https://learn.microsoft.com/power-bi/visuals/power-bi-visualization-visual-tooltips
    date_published: unbekannt
    date_accessed: 2026-09-30
    kind: primary
  evidence: "Sentence format only: Turn on to render the tooltip as a sentence from a template instead of a list of fields."
  parameters: {}
  applies_to:
    purposes: [evidence_detail, value_verdict]
    idioms: []
    style_pack: pbi_native
    layer: interaction
  confidence: from_source
  user_value: medium
  must_have_for_parity: false
  vegavisual: {status: build, basis: "kein Satz-Template im Typ; per eigenem Tooltip-Handler oder berechnetem Feld (inferred)"}

- id: pbi-004
  pattern: Moderner Tooltip mit Drill-Aktionen im Footer
  description: >-
    Bei eingeschaltetem Actions-Footer zeigen unterstützte Visuals Drill down, Drill up und Drillthrough direkt im
    Tooltip; Footer erscheint nur bei drillbarer Hierarchie oder Drillthrough-Ziel. Nicht bei Decomposition Tree,
    Report-Page-Tooltips und AppSource-Custom-Visuals.
  source:
    title: Visual tooltips in Power BI
    publisher: Microsoft
    url: https://learn.microsoft.com/power-bi/visuals/power-bi-visualization-visual-tooltips
    date_published: unbekannt
    date_accessed: 2026-09-30
    kind: primary
  evidence: "Using drill actions from the tooltip means consumers don't need to use right-click menus or header icons."
  parameters: {}
  applies_to:
    purposes: [driver_breakdown, evidence_detail]
    idioms: []
    style_pack: pbi_native
    layer: interaction
  confidence: from_source
  user_value: high
  must_have_for_parity: true
  vegavisual: {status: build, basis: "Popover-Tooltip (CHANGELOG 2.0.0 #478) vorhanden, aber keine Aktionen/Drill-API im Typ"}

- id: pbi-005
  pattern: Report-Page-Tooltip (ganze Berichtsseite als Hover-Karte)
  description: >-
    Eine als Tooltip markierte Seite ersetzt den Standard-Tooltip, gefiltert auf den Datenpunkt; automatisch über
    Tooltip-Felder oder manuell je Visual zugewiesen. Page-Tooltips sind nicht interaktiv.
  source:
    title: Extend visuals with report page tooltips
    publisher: Microsoft
    url: https://learn.microsoft.com/power-bi/guidance/report-page-tooltips
    date_published: unbekannt
    date_accessed: 2026-09-30
    kind: primary
  evidence: "You can use the built-in Tooltip option (320 pixels wide, 240 pixels high)."
  parameters:
    tooltip_page_default_width_px: 320
    tooltip_page_default_height_px: 240
  applies_to:
    purposes: [evidence_detail, time_comparison]
    idioms: [kpi_card_spark, line]
    style_pack: pbi_native
    layer: interaction
  confidence: from_source
  user_value: medium
  must_have_for_parity: false
  vegavisual: {status: build, basis: "kein Mechanismus für eingebettete Mini-Visuals im Tooltip (inferred)"}

- id: pbi-006
  pattern: Help-Tooltip im Visual-Header
  description: >-
    Ein Fragezeichen-Icon im Header zeigt Kurztext oder eine Report-Seite mit Erklärung zum Visual. Text-Hilfe
    reagiert nicht auf Filter.
  source:
    title: Add Help tooltips to visuals in Power BI
    publisher: Microsoft
    url: https://learn.microsoft.com/power-bi/visuals/power-bi-visualization-help-tooltips
    date_published: unbekannt
    date_accessed: 2026-09-30
    kind: primary
  evidence: "Consumers select the icon to view either short text or a report page that explains the visual or describes how to interact with it."
  parameters: {}
  applies_to:
    purposes: []
    idioms: []
    style_pack: pbi_native
    layer: interaction
  confidence: from_source
  user_value: medium
  must_have_for_parity: false
  vegavisual: {status: partial, basis: "VisualContainer hat header {title, subtitle}; kein Help-Icon (fabric-visuals-core 4.0.0 HeaderProps)"}

- id: pbi-007
  pattern: Führungslinie (Crosshair) auf der X-Achse bei Liniendiagrammen
  description: >-
    Hover auf einen Punkt einer Linie zeigt den Tooltip und eine Führungslinie auf der X-Achse; in Small Multiples je
    Multiple.
  source:
    title: Interact with small multiples in Power BI
    publisher: Microsoft
    url: https://learn.microsoft.com/power-bi/visuals/power-bi-visualization-small-multiples-interact
    date_published: unbekannt
    date_accessed: 2026-09-30
    kind: primary
  evidence: "You also see a guide line on the X axis for line charts."
  parameters: {}
  applies_to:
    purposes: [time_comparison]
    idioms: [line, indexed_line, small_multiples]
    style_pack: pbi_native
    layer: interaction
  confidence: from_source
  user_value: high
  must_have_for_parity: true
  vegavisual: {status: native, basis: "capability disableLineChartCrosshairTooltip (default aktiv): vertikale Regel + Mehrserien-Tooltip"}

# ---------------------------------------------------------------- Auswahl, Cross-Filter, Cross-Highlight
- id: pbi-010
  pattern: Klick auf Datenpunkt cross-filtert und cross-highlightet die anderen Visuals der Seite
  description: >-
    Standardmäßig wirkt eine Auswahl auf alle Visuals der Seite: Cross-Highlight dimmt Nicht-Passendes und behält den
    Kontext, Cross-Filter blendet Nicht-Passendes aus. Ohne Konfiguration aktiv.
  source:
    title: Power BI reports overview
    publisher: Microsoft
    url: https://learn.microsoft.com/power-bi/create-reports/power-bi-reports-overview
    date_published: unbekannt
    date_accessed: 2026-09-30
    kind: primary
  evidence: "By default, selecting a data point in one visual cross-filters and cross-highlights other visuals on the page."
  parameters: {}
  applies_to:
    purposes: [part_to_whole, compare_categories, driver_breakdown]
    idioms: []
    style_pack: pbi_native
    layer: interaction
  confidence: from_source
  user_value: high
  must_have_for_parity: true
  vegavisual: {status: partial, basis: "onInteraction liefert select/clear mit Set-/Range-Prädikaten; Weitergabe an andere Visuals und Highlight-Rendering (Teilbalken) muss der Host bauen"}

- id: pbi-011
  pattern: Mehrfachauswahl per Strg+Klick
  description: Strg+Klick fügt Datenpunkte zur Auswahl hinzu; die Mehrfachauswahl wirkt auf alle verbundenen Visuals.
  source:
    title: Multiselect data elements, data points, and visuals in Power BI
    publisher: Microsoft
    url: https://learn.microsoft.com/power-bi/create-reports/desktop-multi-select
    date_published: unbekannt
    date_accessed: 2026-09-30
    kind: primary
  evidence: "To multiselect data points in visuals, use Ctrl + Click to select multiple data points."
  parameters: {}
  applies_to:
    purposes: [compare_categories]
    idioms: []
    style_pack: pbi_native
    layer: interaction
  confidence: from_source
  user_value: high
  must_have_for_parity: true
  vegavisual: {status: native, basis: "disableSelfHighlight-Doku: 'Shift / Ctrl / Cmd-click adds to the selection'; CHANGELOG 1.2.0 #334"}

- id: pbi-012
  pattern: Auswahl aufheben durch erneuten Klick oder Klick auf Leerfläche
  description: Deselektieren des Elements oder Klick in eine leere Fläche des Visuals setzt Filter und Highlight zurück.
  source:
    title: Create and use column charts in Power BI
    publisher: Microsoft
    url: https://learn.microsoft.com/power-bi/visuals/power-bi-visualization-column-charts
    date_published: unbekannt
    date_accessed: 2026-09-30
    kind: primary
  evidence: "To reset the visuals and remove the filtering or highlighting effect, you can either deselect the item or select an empty space within the visual."
  parameters: {}
  applies_to:
    purposes: []
    idioms: []
    style_pack: pbi_native
    layer: interaction
  confidence: from_source
  user_value: high
  must_have_for_parity: true
  vegavisual: {status: native, basis: "ClearInteractionEvent 'User clicked empty space'; CHANGELOG 'clear catcher behind plot area' (#270)"}

- id: pbi-013
  pattern: Wirkungsart je Zielvisual (Filter / Highlight / None), Linie und Scatter nur filterbar
  description: >-
    Der Autor legt pro Quell-Ziel-Paar fest, ob gefiltert, hervorgehoben oder nicht reagiert wird; der Konsument erlebt
    das Ergebnis. Linien-, Scatter- und Kartenvisuals können nur cross-gefiltert, nicht cross-highlightet werden.
  source:
    title: Change how visuals interact in a Power BI report
    publisher: Microsoft
    url: https://learn.microsoft.com/power-bi/create-reports/service-reports-visual-interactions
    date_published: unbekannt
    date_accessed: 2026-09-30
