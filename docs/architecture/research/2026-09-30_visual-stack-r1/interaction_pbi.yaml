    idioms: []
    style_pack: pbi_native
    layer: interaction
  confidence: from_source
  user_value: high
  must_have_for_parity: true
  vegavisual: {status: build, basis: "Router-/Seitenlogik der App; onInteraction liefert die Prädikate als Eingang (inferred)"}

- id: pbi-023
