# ---------------------------------------------------------------- Drill
- id: pbi-020
  pattern: Drill-Modus mit vier Header-Icons (Drill up, Drill down, Next level, Expand all)
  description: >-
    Bei Hierarchien zeigt der Header Drill up, Drill-Modus an/aus, "Go to next level" (ersetzt Ebene für alle Punkte)
    und "Expand all down one level" (fügt Ebene unter jede Kategorie, Kontext bleibt). Titel zeigt die aktuelle Ebene.
  source:
    title: Use drill mode to explore visuals in the Power BI service
    publisher: Microsoft
    url: https://learn.microsoft.com/power-bi/explore-reports/end-user-drill
    date_published: unbekannt
    date_accessed: 2026-09-30
    kind: primary
  evidence: "Expand keeps the current view and adds the next level underneath each category."
  parameters:
    drill_icons: 4
  applies_to:
    purposes: [driver_breakdown, time_comparison]
    idioms: [column_time, bar_ranking]
    style_pack: pbi_native
    layer: interaction
  confidence: from_source
  user_value: high
  must_have_for_parity: true
  vegavisual: {status: build, basis: "keine Hierarchie-/Drill-API; Spec-Tausch per Host (inferred)"}

- id: pbi-021
  pattern: Drill auf einzelnen Datenpunkt; bei ausgeschaltetem Drill-Modus wird cross-gefiltert
  description: >-
    Im Drill-Modus führt Klick auf einen Punkt eine Ebene tiefer nur für diesen Punkt; ohne Drill-Modus bewirkt derselbe
    Klick Cross-Filter. Drill filtert andere Visuals standardmäßig nicht.
  source:
    title: Use drill mode to explore visuals in the Power BI service
    publisher: Microsoft
    url: https://learn.microsoft.com/power-bi/explore-reports/end-user-drill
    date_published: unbekannt
    date_accessed: 2026-09-30
    kind: primary
  evidence: "By default, drilling one visual doesn't filter the other visuals on the report page."
  parameters: {}
  applies_to:
    purposes: [driver_breakdown]
    idioms: []
    style_pack: pbi_native
    layer: interaction
  confidence: from_source
  user_value: medium
  must_have_for_parity: true
  vegavisual: {status: build, basis: "Klickmodus-Umschaltung Auswahl vs. Drill nicht vorhanden (inferred)"}

- id: pbi-022
  pattern: Drillthrough auf Detailseite mit automatischem Zurück-Button
  description: >-
    Rechtsklick (oder Tooltip-Footer, Button) auf einen Datenpunkt öffnet eine Detailseite, gefiltert auf den Punkt;
    Power BI fügt einen Zurück-Button hinzu. Drillthrough-Feld muss im Quellvisual vorkommen.
  source:
