  vegavisual: {status: build, basis: "Self-Highlight injiziert point-Selection auf Marks; Legend-Binding nicht dokumentiert, HTML-Scroll-Legende ist eigener Renderer (inferred)"}

- id: pbi-015
  pattern: Achsenbeschriftung oder Multiple-Titel anklicken wählt die Kategorie
  description: >-
    Klick auf eine Kategorie-Achsenbeschriftung oder den Titel eines Small Multiple cross-highlightet andere Visuals nach
