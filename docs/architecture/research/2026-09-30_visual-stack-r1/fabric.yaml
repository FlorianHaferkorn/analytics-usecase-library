# ---------------------------------------------------------------- Vega-Lite-Grenzen (alle Ziele mit VL)
- id: fabric-013
  pattern: Füllung ist Farbe oder Verlauf; Muster nur über SVG-url()-Referenz
  description: >-
    Vega-Lite 6.4.3 typisiert fill als Color | Gradient (linear/radial) | null | ExprRef; Color
    akzeptiert jeden String. Der Vega-SVG-Renderer schreibt den String als fill-Attribut, daher
    greift "url(#schraffur)", wenn ein <pattern> mit dieser id im selben Dokument liegt. VegaVisual
    rendert SVG. Nicht getestet in Fabric; Canvas-Renderer und Export verlieren das Muster.
  source:
    title: "vega-lite 6.4.3 build/vega-lite-schema.json (MarkDef.fill, Color) + vega-scenegraph (lokal)"
    publisher: Vega
    url: https://www.npmjs.com/package/vega-lite/v/6.4.3
    date_published: 2026-04-24
    date_accessed: 2026-09-30
    kind: primary
  evidence: "Default fill color. This property has higher precedence than `config.color`. Set to `null` to remove fill."
  parameters:
    fabric_app: custom_svg
    pbir: deneb
    html: vega_lite
    fabric_app_renderer: svg
    vl_gradient_types: [linear, radial]
  applies_to:
    purposes: [time_comparison, deviation_from_target]
    idioms: [column_time, bar_absolute, waterfall_buildup, matrix_bullet, bullet]
    style_pack: ibcs
    layer: style
  confidence: inferred

