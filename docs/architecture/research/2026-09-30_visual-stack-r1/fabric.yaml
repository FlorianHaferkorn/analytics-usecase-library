  pattern: Flint chartProperties werden ignoriert (Widerspruch zur Skill-Doku)
  description: >-
    In 4.0.0 und 4.1.0 entfernt der Typ FlintSpec chartProperties; das README sagt, sie würden
    ignoriert. Der mitgelieferte Skill flint-authoring.md dokumentiert sie trotzdem (innerRadius für
    Donut, stackMode normalize, waterfall totals, cornerRadius). Donut und 100%-Stapel daher über
    Vega-Lite, nicht Flint.
