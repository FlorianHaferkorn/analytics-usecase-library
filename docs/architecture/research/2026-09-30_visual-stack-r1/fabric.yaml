    eingebauten Cross-Filter zwischen Visuals gibt es nicht; der Host filtert. Innerhalb eines
    Visuals dimmt Self-Highlight per Klick, Shift/Ctrl/Cmd erweitert die Auswahl. Hover-Events
    sind im Typ als TODO markiert.
