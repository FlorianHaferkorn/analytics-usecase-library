- id: fabric-020
  pattern: EmbeddableVegaVisual für CSP ohne unsafe-eval
  description: >-
    VegaVisual braucht new Function() (unsafe-eval) und zeigt bei blockierender CSP eine
    Fehlermeldung. EmbeddableVegaVisual nutzt vega-interpreter, gleiche Props, etwa 6 KB gzip
    mehr. Das Scaffold nutzt VegaVisual, was auf erlaubtes unsafe-eval im Fabric-Hosting hindeutet.
  source:
    title: "@microsoft/fabric-visuals 4.0.0 README.md, Embeddable (CSP-Safe) Variant"
    publisher: Microsoft
    url: https://www.npmjs.com/package/@microsoft/fabric-visuals/v/4.0.0
    date_published: 2026-09-09
    date_accessed: 2026-09-30
    kind: primary
  evidence: "`VegaVisual` relies on Vega's default expression compiler which uses `new Function()`. This is blocked in CSP environments that disallow `unsafe-eval`."
  parameters:
    embeddable_extra_gzip_kb: 6
  applies_to:
    purposes: []
    idioms: []
    style_pack: fluent
    layer: interaction
  confidence: from_source

- id: fabric-021
  pattern: Headless-SVG-Render derselben Spec (renderVisualToSvg)
