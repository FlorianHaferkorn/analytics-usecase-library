- id: fabric-029
  pattern: Textlänge beim Laden 32.766 Zeichen, in DAX etwa 2,1 Mio.
  description: >-
    Beim Laden ins Modell wird Text über 32.766 Zeichen still abgeschnitten; in DAX-Funktionen
    liegt die Grenze bei rund 2,1 Mio. Zeichen. SVG-Measures bauen den String zur Abfragezeit und
    fallen unter die DAX-Grenze; die in Blogs genannte 32k-Grenze je Measure ist nicht offiziell belegt.
  source:
    title: What Is The Maximum Length Of A Text Value In Power BI?
