    publisher: Microsoft
    url: https://www.npmjs.com/package/@microsoft/fabric-visuals/v/4.0.0
    date_published: 2026-09-09
    date_accessed: 2026-09-30
    kind: primary
  evidence: "VegaVisual always applies its built-in theme. A custom `config` defined within the the given spec is overridden."
  parameters:
    kanal: configVegaLite
  applies_to:
    purposes: []
    idioms: []
    style_pack: fluent
    layer: token
  confidence: from_source

- id: fabric-007
  pattern: Optimistische Laufzeit-Transformationen (capabilities, Opt-out)
  description: >-
    VegaVisual verändert Specs zur Laufzeit: Nullbasis bei Balken, nice-Achsen, kompakte Zahlen
    (10K), Mindestbalkengröße, Datenlabels auf Stapeln und Ringen, Kategorien-Scroll ab 15,
    Crosshair-Tooltip auf Linien, Self-Highlight per Klick. Jedes ist per Flag abschaltbar; eine
    IBCS-Library muss die meisten explizit abschalten, sonst weicht das Bild vom Spec ab.
  source:
    title: "@microsoft/fabric-visuals 4.0.0 dist/index.d.ts, interface VegaVisualCapabilities"
    publisher: Microsoft
    url: https://www.npmjs.com/package/@microsoft/fabric-visuals/v/4.0.0
    date_published: 2026-09-09
    date_accessed: 2026-09-30
    kind: primary
  evidence: "Controls which optimistic behaviors the VegaVisual compilation pipeline applies. Most behaviors are on by default. Set a key to `true` to disable it."
  parameters:
    categorical_scroll_threshold: 15
    categorical_scroll_window: 10
    capability_flags: 15
    default_disableLegendScroll: true
  applies_to:
    purposes: [compare_categories, time_comparison, part_to_whole]
    idioms: [bar_absolute, bar_ranking, bar_stacked, column_time, donut, line, scatter]
    style_pack: fluent
    layer: style
  confidence: from_source

- id: fabric-008
  pattern: Standard-Eckenradius 4 an Balken, Wasserfall-Farben grün/rot/primär
  description: >-
    Der Template-Skill setzt cornerRadiusEnd 4 (aus --radius-md) als Balkenvorgabe und färbt
    Wasserfälle nach Typ grün/rot/primär. Für eckige IBCS-Balken muss cornerRadiusEnd 0 gesetzt
    werden; gemischte Vorzeichen brauchen zwei Layer, weil ein Radius sonst auf der falschen Seite rundet.
  source:
    title: "Rayfin-Template-Skill app-design/references/visual-style-recipes.md (Scaffold 1.36.0)"
    publisher: Microsoft
    url: https://learn.microsoft.com/fabric/apps/create-app
    date_published: unbekannt
    date_accessed: 2026-09-30
    kind: primary
  evidence: "The default `cornerRadiusEnd` is `4` (from `--radius-md`). Use `0` for sharp aesthetics or higher for rounder feels."
  parameters:
    default_bar_corner_radius_px: 4
    waterfall_default_colors: "increase green, decrease red, subtotal primary"
  applies_to:
    purposes: [contribution_to_change, compare_categories]
    idioms: [waterfall_buildup, waterfall_pvm, waterfall_variance, bar_absolute, deviation_bar]
    style_pack: fluent
    layer: style
  confidence: from_source

# ---------------------------------------------------------------- Fabric App: Theming
- id: fabric-009
  pattern: useCssTheme liest nur Farben (8 Variablen + 10 Datenfarben)
  description: >-
    readCssTheme bildet foreground, background(--color-card), stroke(--color-border),
    foregroundSecondary, backgroundSecondary, backgroundHover, brandBackground, brandForeground
    sowie --color-data-1..10 ab (stoppt an der ersten Lücke), dazu isDark (.dark) und
    isHighContrast. Schrift, Größen und Abstände liest der Hook nicht.
  source:
    title: "@microsoft/fabric-visuals-core 4.0.0 dist/index.d.ts + dist/index.js readCssTheme"
    publisher: Microsoft
    url: https://www.npmjs.com/package/@microsoft/fabric-visuals-core/v/4.0.0
    date_published: 2026-09-09
    date_accessed: 2026-09-30
    kind: primary
  evidence: "Ordered CSS custom properties used to build the default categorical series palette. Hosts may define a contiguous prefix beginning at `--color-data-1`"
  parameters:
    css_color_vars: ["--color-foreground", "--color-card", "--color-border", "--color-muted-foreground", "--color-muted", "--color-hover", "--color-brand", "--color-brand-foreground"]
    categorical_palette_max: 10
    dark_trigger: ".dark auf <html>"
  applies_to:
    purposes: []
    idioms: []
    style_pack: fluent
    layer: token
  confidence: from_source

- id: fabric-010
  pattern: Diagrammschrift kommt aus Token-Konstante oder theme.typography, nicht aus --font-base
  description: >-
    Der Vega-Theme-Bau nutzt theme.typography.label/heading, sonst die feste Konstante
    fontFamily.base (Segoe-UI-Stack). Da useCssTheme typography nicht füllt, folgt die
    Diagrammschrift einer geänderten --font-base nicht von selbst; die Skill-Tabelle behauptet das
    Gegenteil. Weg: theme = {...useCssTheme(), typography: {...}} oder configVegaLite.font.
  source:
    title: "@microsoft/fabric-visuals 4.0.0 dist/chunk-HIKZQ6YR.js (Theme-Bau) vs. visuals/references/formatting.md"
    publisher: Microsoft
    url: https://www.npmjs.com/package/@microsoft/fabric-visuals/v/4.0.0
    date_published: 2026-09-09
    date_accessed: 2026-09-30
    kind: primary
  evidence: "const bodyFamily = theme.typography?.label?.family ?? fontFamily.base;"
  parameters:
    default_font_stack: "'Segoe UI', 'Segoe UI Web (West European)', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', sans-serif"
    default_numeric_font: "Bahnschrift, 'Segoe UI', …"
    widerspruch: "formatting.md nennt --font-base als Stellschraube für Charts"
  applies_to:
    purposes: []
    idioms: []
    style_pack: fluent
    layer: token
  confidence: from_source

