# R1d — Strang fabric: technische Grenzen der Zielplattformen (Fabric App / PBIR / HTML)
# Stand 30.09.2026. Lokale Primärbelege: Scaffold-Cache
#   Freelancing-Checkout .cache/fabric_app/1.36.0/scaffold/ (fabric-visuals 4.0.0, flint-chart 0.5.1,
#   vega-lite 6.4.3, vega 6.4.0) und npm-Tarball @microsoft/fabric-visuals 4.1.0 (Scratchpad fv41/).
# Plattform-Status je Eintrag in parameters: fabric_app / pbir / html
#   = native | flint | vega_lite | custom_svg | deneb | svg_measure | nicht_moeglich | unklar

# ---------------------------------------------------------------- Fabric App: Spec-Eingang
- id: fabric-001
  pattern: VegaVisual nimmt Vega-Lite oder Flint, nicht Vega
  description: >-
    Der Typ VisualizationSpec ist eine Union aus Vega-Lite-TopLevelSpec (data optional) und
    Flint-Spec. Volle Vega-Specs (Sankey per linkpath, Baum-Layouts) sind im Typ nicht vorgesehen;
    Vega-Lite-Specs gehen vollständig durch (layer, facet, concat, params, transforms).
  source:
    title: "@microsoft/fabric-visuals 4.0.0 dist/index.d.ts (lokal: .cache/fabric_app/1.36.0/scaffold/node_modules)"
    publisher: Microsoft
    url: https://www.npmjs.com/package/@microsoft/fabric-visuals/v/4.0.0
    date_published: 2026-09-09
    date_accessed: 2026-09-30
    kind: primary
  evidence: "type VisualizationSpec = VegaLiteSpecWithOptionalData | FlintSpec;"
  parameters:
    fabric_app_vega_lite_version: "6.4.3 (installiert), ^6.4.2 (Dependency)"
    fabric_app_vega_version: "6.4.0 (installiert)"
    fabric_app_vega_full_spec: nicht_moeglich
  applies_to:
    purposes: [flow_between_stages, driver_breakdown]
    idioms: [sankey, decomposition_tree]
    style_pack: fluent
    layer: idiom
  confidence: from_source

- id: fabric-002
  pattern: Flint-Katalog mit 34 chartTypes und festen Kanälen
  description: >-
    Flint-Specs bestehen aus chartType plus encodings. Der Katalog nennt u. a. Bar, Grouped Bar,
    Stacked Bar, Waterfall, Bullet (goal Pflicht), Ranged Dot Plot (Dumbbell), Lollipop, Slope,
    Bump, Sparkline, KPI Card, Bar Table, Boxplot, Histogram, Heatmap, Range Area. Kein Sankey,
    keine Treemap im VegaVisual-Katalog, kein Zerlegungsbaum.
  source:
    title: "Rayfin-Template-Skill visuals/references/flint-authoring.md (Scaffold 1.36.0) + flint-chart 0.5.1 dist/vegalite/index.js"
    publisher: Microsoft
    url: https://github.com/microsoft/flint-chart/blob/main/agent-skills/flint-chart-author/SKILL.md
    date_published: unbekannt
    date_accessed: 2026-09-30
    kind: primary
  evidence: "Use one of the registered names **exactly**:"
  parameters:
    flint_version: "0.5.1"
    flint_chart_types: 34
    flint_bullet_channels: "y, x, goal, color, column, row"
    flint_waterfall_channels: "x, y, color, column, row (color reserviert für Typ-Spalte)"
    flint_ranged_dot_plot_channels: "x, y, color"
    flint_kpi_card_channels: "metric, value, goal"
    flint_range_area_channels: "x, y, y2, color, column, row"
  applies_to:
    purposes: [compare_categories, time_comparison, deviation_from_target, contribution_to_change, distribution, correlation, value_verdict]
    idioms: [bar_absolute, bar_ranking, bar_stacked, waterfall_buildup, bullet, dumbbell, lollipop, slope, kpi_card_spark, kpi_card_bullet, boxplot, histogram, scatter, line, column_time, small_multiples]
    style_pack: fluent
    layer: idiom
  confidence: from_source

