# ---------------------------------------------------------------- Fabric App: Laufzeit-Eingriffe
- id: fabric-006
  pattern: VegaVisual überschreibt config im Spec
  description: >-
    Das eingebaute Theme hat Vorrang; ein config-Block im Spec wird überschrieben. Strukturelle
    Abweichungen (Achsen, Schrift, Eckenradius) gehen nur über die Prop configVegaLite.
  source:
