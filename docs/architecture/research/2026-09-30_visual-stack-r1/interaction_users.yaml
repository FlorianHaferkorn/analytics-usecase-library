- id: users-005
  pattern: Die Zahlen hinter dem Chart sehen (Tabelle als Idiom)
  description: Qualitative Studie mit Data Workern - Nutzer wollen die zugrunde liegenden Daten über den ganzen
    Analyseprozess sehen und "in die Hand nehmen", umformen und ergänzen; Tabellen sind ein eigenständiges Idiom.
    Für das Cockpit - zu jedem Chart eine Tabellensicht (Matrix mit Werten) erreichbar.
  source:
    title: "Untidy Data: The Unreasonable Effectiveness of Tables"
    publisher: IEEE TVCG (Bartram, Correll, Tory; Tableau Research)
