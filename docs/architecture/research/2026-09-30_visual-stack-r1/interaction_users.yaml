- id: users-016
  pattern: Aktive Filter sichtbar, Live- vs. Batch-Filter nach Latenz
  description: Angewandte Filter an Ort und Stelle und in einer Zusammenfassung zeigen; bei eingeklapptem
    Filterbereich Anzahl aktiver Filter plus "alle löschen". Live-Filterung nur bei Ergebnis unter 1 s, sonst
    Batch mit Übernehmen-Knopf ab 1-2 s. Für das Cockpit - Filterzustand im Seitenkopf ausgeschrieben.
  source:
    title: Filter UI Design (Zusammenfassung, beruft sich auf NN/g)
