# frequency_evidence: nur Zahlen, die der Suchauszug nennt; Zuordnungsunsicherheit steht im Feld.

- id: users-001
  pattern: Auf einen Blick lesbar, minimale Interaktion
  description: Ein Dashboard ist eine Einseitenansicht, deren Kernaussage ohne Interaktion und mit minimaler
    kognitiver Verarbeitung erfasst wird; Exploration ist nicht sein Zweck. Konsequenz für das Cockpit - alle
    Steuerungsaussagen der Startseite ohne Klick, Hover oder Scrollen lesbar.
  source:
    title: Dashboards - Making Charts and Graphs Easier to Understand
    publisher: Nielsen Norman Group
    url: https://www.nngroup.com/articles/dashboards-preattentive/
    date_published: unbekannt
    date_accessed: 2026-09-30
    kind: primary
  evidence: "provide information that can be consumed fast, with a minimum of interaction or cognitive processing"
  parameters: {}
  applies_to:
    purposes: [value_verdict, deviation_from_target]
    idioms: [kpi_card_bullet, kpi_card_spark, matrix_delta_pill]
    style_pack: fluent
    layer: layout
  confidence: from_source
  user_value: high
  frequency_evidence: null
  default_on: true
  zugang: search_index

