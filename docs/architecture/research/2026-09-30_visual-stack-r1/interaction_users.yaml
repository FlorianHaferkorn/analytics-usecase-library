- id: users-015
  pattern: Antwortzeit-Grenzen 0,1 / 1 / 10 s
  description: 0,1 s wirkt sofort, 1 s hält den Gedankenfluss, 10 s hält die Aufmerksamkeit; darüber brauchen
    Nutzer Fortschrittsanzeige. Als Test - Seitenwechsel und Filterreaktion im Cockpit unter 1 s Ziel, harte Grenze 10 s.
  source:
    title: The 3 Response Time Limits in Interaction Design
    publisher: Nielsen Norman Group
    url: https://www.nngroup.com/videos/3-response-time-limits-interaction-design/
    date_published: unbekannt
    date_accessed: 2026-09-30
    kind: primary
  evidence: "about the limit for the user's flow of thought to stay uninterrupted"
