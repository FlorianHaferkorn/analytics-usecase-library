- id: users-011
  pattern: Meta-Information - Quelle, Beschreibung, Disclaimer, Annotation
  description: Systematische Analyse von 144 Dashboards, 42 Muster in 8 Gruppen; die Meta-Information-Gruppe
    umfasst Data Source, Data Description, Update Information, Disclaimer (was nicht enthalten ist / nicht
    geschlossen werden soll) und Annotations. Ergänzt durch 2-wöchigen Design-Workshop mit 23 Teilnehmenden.
  source:
    title: Dashboard Design Patterns
    publisher: IEEE TVCG 29(1) (Bach, Freeman, Abdul-Rahman, Turkay, Khan, Fan, Chen)
    url: https://wrap.warwick.ac.uk/id/eprint/170047/1/WRAP-dashboard-design-patterns-Turkay-2022.pdf
    date_published: 2022-09-26
    date_accessed: 2026-09-30
