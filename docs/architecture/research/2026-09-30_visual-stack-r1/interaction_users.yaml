- id: users-012
  pattern: Vertrauen durch prüfbare Daten (Data Guards)
  description: Interviews mit Produzenten und Konsumenten von Spreadsheets, Charts, Dashboards - wiederkehrender
    Bedarf nach Validierung/Verifikation besonders bei Konsumenten, ohne Standard dafür; Hindernisse u. a.
    Kontextabhängigkeit und fehlende Transparenz über Pipeline-Änderungen. Für das Cockpit - sichtbare
    Plausibilitäts-/Abstimmungssignale (Zeilen-/Summenabgleich, Änderungshinweise).
  source:
    title: "Data Guards: Challenges and Solutions for Fostering Trust in Data"
    publisher: IEEE VIS 2024 (Sultanum, Bromley, Correll)
    url: https://www.ieeevis.org/year/2024/program/paper_v-short-1040.html
