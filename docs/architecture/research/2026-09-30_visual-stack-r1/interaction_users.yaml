  description: Seiten- und Charttitel formulieren die Aussage ("Umsatz 4 % unter Plan, getrieben von Region Nord"),
    nicht das Thema; liest man nur die Titel, soll sich die Geschichte ergeben. IBCS SAY - eine Botschaft vermitteln.
