- id: users-008
  pattern: Monatlicher Standardbericht mit Kommentar zu Abweichungen
  description: WHU Controller Panel - über 80 % erstellen den Standardbericht monatlich, im Mittel 8 Arbeitstage;
    80 % der Berichte enthalten Kommentare, nur 12 % Handlungsempfehlungen, 24 % externe Informationen.
    Controller sind mit der grafischen Darstellung am wenigsten zufrieden. Mit BI/Dashboard verschiebt sich
    Arbeitszeit zu Analyse und Kommentar.
  source:
