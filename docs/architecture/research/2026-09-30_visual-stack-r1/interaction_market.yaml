  description: Beim Überfahren der Zeitachse wird der nächstgelegene Zeitpunkt zum Index 0; alle Reihen werden live als prozentuale Veränderung seit diesem Punkt neu gerechnet (lookup + calculate). Beantwortet "wie viel seit Monat X?" ohne Slicer.
