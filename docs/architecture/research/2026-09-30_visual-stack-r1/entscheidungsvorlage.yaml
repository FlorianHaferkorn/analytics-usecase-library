# R1-Synthese — Widersprüche und Lücken als Entscheidungsvorlage (Stand 30.09.2026)
# Bezug: Ledger A-31, Freelancing D-635. status: vorgeschlagen | entschieden (mit datum + entscheider)
# belege = IDs in ibcs.yaml / editorial.yaml / product.yaml / fabric.yaml
# zugang: fetched = Quelle gelesen; search_index = nur Suchauszug (vor Test-Autorität am Original prüfen)

widersprueche:
  - id: W-1
    thema: IBCS-Szenarien (AC/PY/PL/FC)
    fassungen:
      - {ort: "Meridian style_packs/ibcs/column_chart.json", wert: "PY umrandet, PL gestrichelt"}
      - {ort: "Meridian TPL-001 chart_standards", wert: "PY grau, PL umrandet"}
      - {ort: "Meridian core/report_design/ibcs.py", wert: "PL weiß mit Umriss, PY hell"}
      - {ort: "ALUCA _notation_profiles.yaml / color_semantics.yaml", wert: "PY solide 50 %, PL umrandet, FC schraffiert"}
    quelle_sagt: "UN 3.2 (S. 44–45): AC solide dunkel (z. B. dunkelgrau), PY heller solide, PL/BU nur umrandet, FC umrandet und schraffiert in AC-Farbe; bei Stapeln Szenarionotation nur im untersten Segment; keine Farbwerte"
    belege: [ibcs2-un-3-2, ibcs-011]
    zugang: original
    vorschlag: "Rollen fest nach Quelle (Klasse A), Helligkeitswerte aus der Marke (Klasse C). Meridians Style-Pack ibcs ist falsch (PY ohne Füllung) und wird mit R2 ersetzt."
    status: vorgeschlagen
  - id: W-2
    thema: Donut / Kreis
    fassungen:
      - {ort: "Meridian TPL-001", wert: "verboten"}
      - {ort: "Meridian DESIGN_SYSTEM.md", wert: "erlaubt bis 4 Teile"}
      - {ort: "KONZEPT_Cockpit_Design_System", wert: "erlaubt bis 3 Teile"}
      - {ort: "ALUCA index.yaml", wert: "best für part_to_whole bis 4 Teile"}
    quelle_sagt: "IBCS EX 2.1 (S. 136): Torte und Ring ersetzen, Ausnahme auf Karten mit höchstens 2–3 Werten; FT Visual Vocabulary führt Donut unter part-to-whole"
    belege: [ibcs2-ex-2-1, editorial-006, editorial-022]
    zugang: gemischt
    vorschlag: "Profilparameter statt globale Regel: Profil ibcs verbietet, übrige Profile erlauben bis 4 Teile (ALUCA-Stand)."
    status: vorgeschlagen
  - id: W-3
    thema: Negativ-Farbe
    fassungen:
      - {ort: ALUCA, wert: "#A4262C"}
      - {ort: "Meridian tokens.py, neutral_demo", wert: "#D13438"}
      - {ort: "Meridian _fhc_base, contoso", wert: "#8B1E24"}
    quelle_sagt: "IBCS UN 4.1 (S. 52): gut hellgrün, schlecht dunkelrot, neutral blau; ohne Farbe dunkelgrau/mittelgrau/hellgrau; bei Farbsehschwäche Blaugrün statt Grün; ausdrücklich keine Farbcodes. WCAG 1.4.11 verlangt 3:1 für Grafik."
    belege: [ibcs2-un-4-1, ibcs-012]
    zugang: original
    vorschlag: "Eine Rolle `bad` (Klasse A), Wert je Marke (Klasse C); Default ALUCA #A4262C; Kontrasttor erzwingt 3:1 bzw. 4.5:1 für Text."
    status: vorgeschlagen
  - id: W-4
    thema: Kombination Linie + Säule
    fassungen:
      - {ort: "Meridian visuals/line_column_chart", wert: "Standard-Visual"}
      - {ort: "ALUCA index.yaml deny", wert: "dual_axis_no_reason"}
    quelle_sagt: "FT führt column_line_combo (Menge gegen Rate); IBCS trennt Ratios in eigene Charts (halbe Breite/Strichstärke)."
    belege: [editorial-002, editorial-005, ibcs-013]
    zugang: gemischt
    vorschlag: "Zwei Achsen bleiben verboten. Menge + Rate als zwei gestapelte Charts mit gemeinsamer Zeitachse (neues Idiom NEU:paired_time); line_column_chart entfällt mit der Archivierung."
    status: vorgeschlagen
  - id: W-5
    thema: Achsenschnitt
    fassungen:
      - {ort: "Design Lab 30.09.2026", wert: "Säulen ab 80 bzw. 86"}
    quelle_sagt: "IBCS CH 1.1 (S. 68): Achsen nicht abschneiden, Ausnahme indexierte Daten; FT: Nullbasis für Längen-Encodings; ONS erlaubt gekappte Achse bei Linien mit sichtbarer Markierung; Urban verlangt immer Null."
    belege: [ibcs2-ch-1-1, editorial-011, editorial-036]
    zugang: gemischt
    vorschlag: "Säulen/Balken/Flächen: Nullbasis in allen Profilen (Test am Spec). Linie: Profilparameter (ibcs: Null oder Skalierungsindikator; editorial: Kappung mit Markierung)."
    status: vorgeschlagen
  - id: W-6
    thema: Legendenposition
    fassungen:
      - {ort: Carbon, wert: unten}
      - {ort: "Fluent / Power BI", wert: "oben links"}
      - {ort: Tremor, wert: rechts}
      - {ort: "IBCS UN 2.3 (S. 34)", wert: "Direktbeschriftung bevorzugt, Legende erlaubt (z. B. bei zwei Werteachsen), Position je Charttyp"}
      - {ort: "Urban, BBC", wert: "Direktbeschriftung; falls Legende: oben"}
    belege: [product-028, product-038, editorial-030, ibcs2-un-2-3]
    zugang: gemischt
    vorschlag: "Direktbeschriftung Standard bis 4 Serien in allen Profilen; Legende nur darüber, Position als Profilparameter."
    status: vorgeschlagen

luecken:
  - id: L-1
    thema: "IBCS 2.0 Original (Regelnummern, UN 4.x/5.x, Templates C02–C05) nicht gelesen"
    grund: "Egress-Proxy sperrt ibcs.com; PDF nur für Mitglieder"
    folge: "Kein IBCS-Eintrag bekommt Test-Autorität (R3), bevor evidence am Original steht"
    status: geschlossen 2026-09-30
    ergebnis: "Original (Mitglieder-PDF, 169 S.) abgeglichen: ibcs_v2.yaml mit 105 Regeln, alle Zitate wörtlich auf der angegebenen Seite (Skriptprüfung); Chart-Templates C01–C13 und Software-Zertifizierung stehen nicht im Standard (ibcs_abgleich.md)"
    rest: "Zahlenwerte (Grau-/Farbwerte, Strichstärken, Pinbreite, Schraffur, Schriftgrößen) nennt das Original nicht — das Profil legt sie fest, Tests prüfen Relationen"
  - id: L-2
    thema: "Fabric-Apps: Schraffur per url(#pattern), CSP-Header, Bundle-Größe ungemessen"
    grund: "kein Rendertest, kein Deployment in R1"
    folge: "R2: headless mit renderVisualToSvg (fabric-visuals 4.1.0) messen; CSP nach erstem rayfin up lesen"
  - id: L-3
    thema: "Design-System-Seiten (shadcn, Tremor, Geist, Carbon, Fluent 2, Material, Atlassian) nur über GitHub-Quellen"
    grund: "Egress-Proxy sperrt die Doku-Domains"
    folge: "Parameter aus Quellcode belegt; Leitlinien-Texte fehlen"

neue_purposes_kandidaten:
  - {id: forecast_uncertainty, frage: "Wo landen wir voraussichtlich — mit welcher Spanne?", idiome: ["NEU:range_band", "NEU:fan_chart", line], beleg: [editorial-012, editorial-045, ibcs-011]}
  - {id: ranking, frage: "Wer führt, wer fällt zurück — und wie hat sich der Rang bewegt?", idiome: [bar_ranking, "NEU:bump", "NEU:dot_strip"], beleg: [editorial-003, editorial-012], hinweis: "heute Teil von compare_categories"}

neue_idiome_prioritaet_cockpit:
  - {id: variance_pin, quelle: IBCS, purposes: [deviation_from_target]}
  - {id: multi_tier_column, quelle: IBCS, purposes: [deviation_from_target, time_comparison]}
  - {id: table_variance_bars_pins, quelle: IBCS, purposes: [evidence_detail, deviation_from_target]}
  - {id: range_band, quelle: "FT, Observable Plot", purposes: [forecast_uncertainty]}
  - {id: surplus_deficit_line, quelle: "FT, Observable Plot difference mark", purposes: [deviation_from_target, time_comparison]}
  - {id: diverging_stacked_bar, quelle: FT, purposes: [part_to_whole]}
  - {id: paired_time, quelle: "abgeleitet aus W-4", purposes: [time_comparison]}

profile_kandidaten:
  - {id: house_default, basis: "shadcn/ui + Tremor (modern_product)", belege_anzahl: 31}
  - {id: fluent, basis: "Fluent UI Tokens + Power-BI-Fluent-2-Basisthema", belege_anzahl: 13}
  - {id: editorial, basis: "BBC bbplot, Urban, ONS, FT"}
  - {id: minimal, basis: "Tufte / Storytelling with Data (nur Suchauszüge)", hinweis: "swd und tufte als ein Profil"}
  - {id: ibcs, basis: "IBCS Standards 2.0 / ISO 24896", hinweis: "extern nur als 'folgt der IBCS-Notation' benennen (Terms of use)"}
  - {id: print_safe, basis: "bestehendes ALUCA-Profil"}
