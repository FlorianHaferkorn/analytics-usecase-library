    Anhangsformat kommen aus einem Semantic Model (Mapping-Tabelle). Standard-Enddatum ein Jahr nach Start.
    Lizenzvoraussetzung in der gelesenen Stelle nicht genannt.
  source: {title: "Dynamic per recipient subscriptions for paginated reports", publisher: Microsoft, url: "https://learn.microsoft.com/power-bi/collaborate-share/dynamic-subscriptions", date_published: unbekannt, date_accessed: 2026-09-30, kind: primary}
  zugang: mcp
  evidence: "Power BI connects to a semantic model that defines the mapping between recipients and parameters."
  parameters: {max_attachment_mb_exclusive: 25, default_end_date_after_start_years: 1}
  pbi_status: native
  cockpit_build: build_backend
  user_value: high
  must_have_for_parity: true
  confidence: from_source

