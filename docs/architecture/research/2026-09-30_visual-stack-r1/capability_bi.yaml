# Strang capability_bi: Plattform- und Berichtsfähigkeiten jenseits des einzelnen Visuals (Stand 30.09.2026)
# Baseline Power BI/Fabric, Vergleich Tableau, Qlik, Looker, SAP Analytics Cloud, Pyramid.
# Abgrenzung: Visual-Interaktionen (Tooltip, Cross-Filter, Drill, Export je Visual, Focus, Show as table,
# Slicer, Bookmarks/Persistente Filter/Personalize, Kommentare am Visual, Visual-Alert, Q&A-Visual,
# Visual-Barrierefreiheit, Mobil-Layout) stehen in interaction_pbi.yaml und werden hier nicht wiederholt.
# Felder user_value, must_have_for_parity und cockpit_build sind eigene Einschätzung (nicht Quelle).
# zugang: mcp = Microsoft-Learn-MCP gelesen; search_index = Seite per Egress gesperrt, nur Suchauszug.

# ---------------------------------------------------------------- distribution
- id: bi-001
  capability: E-Mail-Abonnement für Seite oder ganzen Bericht mit PDF/PPTX-Anhang
  area: distribution
  description: >-
    Leser abonnieren eine Berichtsseite oder den ganzen Bericht per Mail nach Zeitplan. Anhang des ganzen Berichts
    als PDF oder PowerPoint nur bei Premium-Kapazität oder PPU; Sensitivity Labels gehen auf den Anhang über.
    Ergänzt pbi-041 (Snapshot-Abo) um Anhang und Grenzen.
  source: {title: "Email subscriptions for reports and dashboards in the Power BI service", publisher: Microsoft, url: "https://learn.microsoft.com/power-bi/collaborate-share/end-user-subscribe", date_published: unbekannt, date_accessed: 2026-09-30, kind: primary}
  zugang: mcp
  evidence: "The size of the attachment is limited to no more than 20 pages and less than 25 MB."
  parameters: {max_attachment_pages: 20, max_attachment_mb_exclusive: 25}
  pbi_status: premium
  cockpit_build: build_backend
  user_value: high
  must_have_for_parity: true
  confidence: from_source

- id: bi-002
