- id: ibcs2-si-1-1
  rule_id: SI 1.1
  pattern: Avoid cluttered layouts
  group: SI 1 Avoid unnecessary elements
  part: NOTATION
  section: SIMPLIFY
  description: Keine Layout-Elemente ohne Bedeutung (Logos, Bilder, Zierleisten), auch wenn das Corporate Design sie vorsieht.
  source:
    title: IBCS Standards Version 2.0
    publisher: IBCS Association
    url: https://www.ibcs.com/standards
    date_published: '2026'
    date_accessed: '2026-09-30'
    kind: primary
    license: CC BY-SA 4.0
    citation: IBCS Standards Version 2.0, IBCS Association 2026, CC BY-SA 4.0
  pdf_seite: 16
  seite: 16
  evidence: Layout concepts often contain elements that lack meaning but merely conform to corporate design or personal taste. Avoid all these
    elements.
  iso_klausel: null
  iso_bezug: null
  parameters:
    decorative_elements_allowed: false
  test: 'SVG: keine <image>-Elemente und keine Pfade ausserhalb der Chart-/Titel-/Fussnoten-Gruppen; Spec: keine image-Marks.'
  testbar: spec+svg
  applies_to:
    purposes: []
    idioms: []
    style_pack: ibcs
    layer: layout
  confidence: from_source
  abgleich_alt: []
  regel_ab_seite: 16
