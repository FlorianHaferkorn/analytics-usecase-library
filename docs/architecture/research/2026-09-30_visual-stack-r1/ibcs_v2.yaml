- id: ibcs2-ex-1-1
  rule_id: EX 1.1
  pattern: Use appropriate chart types
  group: EX 1 Use appropriate visuals
  part: COMPOSITION
  section: EXPRESS
  description: 'Horizontale Charts (Zeit): Einzel-, gestapelte, gruppierte Saeulen, horizontale Pin-Charts (senkrechte Pins), horizontale Wasserfaelle
    (Wachstums-, Varianz-), Linien. Vertikale Charts (Struktur): Einzel-, gestapelte, gruppierte Balken, vertikale Pin-Charts (waagerechte Pins),
    vertikale Wasserfaelle (Rechen-, Varianz-), Restbalken. Zwei Werteachsen: Streu- und Blasendiagramm. Keine Linien/Flaechen in vertikalen Charts;
    Linien nicht bei wenigen Werten; >3 sich schneidende Linien -> Small Multiples; Stapel nur bei einheitlichem Vorzeichen, >5 Reihen nur bei
    geringer Streuung; Restbalken unten mit breiterer Luecke.'
  source:
    title: IBCS Standards Version 2.0
    publisher: IBCS Association
    url: https://www.ibcs.com/standards
    date_published: '2026'
    date_accessed: '2026-09-30'
    kind: primary
    license: CC BY-SA 4.0
    citation: IBCS Standards Version 2.0, IBCS Association 2026, CC BY-SA 4.0
  pdf_seite: 107
  seite: 107
  evidence: Do not use lines in vertical charts as they could be interpreted as trends or developments, which do not exist in structure analyses.
  iso_klausel: null
  iso_bezug: null
  parameters:
    horizontal_chart_types:
    - single column
    - stacked column
    - grouped column
    - horizontal pin chart
    - growth waterfall
    - horizontal variance waterfall
    - line
    vertical_chart_types:
    - single bar
    - stacked bar
    - grouped bar
    - vertical pin chart
    - calculation waterfall
    - vertical variance waterfall
    - remainder bar
    two_value_axes:
    - scattergram
    - bubble chart
    - bubble pie chart
