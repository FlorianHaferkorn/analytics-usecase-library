- id: ibcs2-un-4-1
  rule_id: UN 4.1
  pattern: Unify scenario analyses
  group: UN 4 Unify analyses
  part: NOTATION
  section: UNIFY
  description: 'Szenariovergleich ueberlappend gruppiert oder mit Szenario-Dreiecken; AC/FC im Vordergrund; Reihenfolge nach Periode bzw. Erstellungszeit.
    Absolute Varianzen (ΔPL, ΔPY) als Varianzbalken gleicher Breite und Skala: gut hellgruen, schlecht dunkelrot, neutral blau; Fuellung zeigt
    Minuend (solide AC, schraffiert FC, umrandet PL); Achse zeigt Referenz (PY solide hell, PL/BU Doppellinie); Labels immer aussen in Wachstumsrichtung,
    ''+'' bei positiven Varianzen, pp bei Prozentwerten. Relative Varianzen (ΔPL%) als duenne Pins mit Kopf (Kopffuellung = Minuend), N/A bei
    nicht interpretierbarem Nenner.'
  source:
    title: IBCS Standards Version 2.0
    publisher: IBCS Association
    url: https://www.ibcs.com/standards
    date_published: '2026'
    date_accessed: '2026-09-30'
    kind: primary
    license: CC BY-SA 4.0
    citation: IBCS Standards Version 2.0, IBCS Association 2026, CC BY-SA 4.0
  pdf_seite: 51
  seite: 51
  evidence: these variance columns or bars have the same width and the same scale as the corresponding base value columns or bars
  iso_klausel: ISO 24896 Clause 4 (kapitelweit, S. 25); Unterklausel im Original nicht genannt
  iso_bezug: covers labelling of variances and semantic design (see also ISO 24896)
  parameters:
    comparison_forms:
    - overlapped grouped columns/bars
    - scenario triangles
    foreground_scenarios:
    - AC
    - FC
    scenario_order: 'ascending time; same period: by creation time (e.g. PL, FC, AC)'
    abs_variance_labels:
    - ΔPL
    - ΔPY
    - AC-PL
    - FC-PL
    - AC-PY
    - FC-PY
    rel_variance_labels:
    - ΔPL%
    - ΔPY%
    - (AC-PL)%
    - (FC-PL)%
    positive_variance_prefix: +
    percent_point_unit: pp
    not_interpretable: N/A
    variance_bar_width: same as base bars
    variance_bar_scale: same as base bars
    color_desirable: bright green
    color_undesirable: dark red
    color_neutral: blue
    bw_fallback:
      undesirable: dark gray
      neutral: medium gray
      desirable: light gray
    cvd_fallback:
      desirable: blue-green
    hex_values: nicht vorgeschrieben (IBCS does not prescribe exact codes)
    minuend_fill:
      AC: solid
      FC: hatched
      PL: outlined
    reference_axis:
      PY: solid light
      PL: outline (two parallel lines)
      BU: outline (two parallel lines)
    variance_label_position: always outside, in direction of increase
    relative_variance_mark: pin (thin column/bar) with head marker
    pin_head_fill: minuend scenario notation
    pin_width: nicht im Original (very thin column/bar)
    table_variance_numbers: colored the same way if helpful
  test: 'Spec: Varianz-Layer x/y-Skala = Basis-Skala (resolve shared) und Bandbreite gleich; color-Encoding ueber Bewertungsfeld (desirable/undesirable/neutral),
