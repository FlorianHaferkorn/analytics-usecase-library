- id: product-048
  pattern: Kleine Charts als Vorschau, Details auf Anforderung, ein Datensatz = ein Stil
  description: Chartgröße an Funktion und Detailgrad anpassen; kleine Charts als Snapshot mit Weg zur größeren Ansicht; Details schrittweise freigeben; mehrere Charts desselben Datensatzes mit gleichem Typ, Farben und Layout.
  source:
