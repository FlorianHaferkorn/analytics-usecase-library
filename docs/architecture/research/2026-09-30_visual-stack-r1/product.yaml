- id: product-049
  pattern: Material-3-Motion als Federn (Standard vs. Expressive, räumlich vs. Effekt)
  description: Material 3 (Compose-Tokens) definiert Motion als Federphysik - räumliche Federn für Position/Größe, Effektfedern (Dämpfung 1.0, kein Überschwingen) für Farbe/Deckkraft; Expressive schwingt über (Dämpfung 0.6–0.8), Standard kaum (0.9).
