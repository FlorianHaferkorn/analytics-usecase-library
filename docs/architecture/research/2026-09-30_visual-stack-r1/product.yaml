  description: Accessibility-Labels nennen Werte mit Kontext (Datum, Ort), keine subjektiven Wörter („rapidly“), eindeutige Formate („June 6“ statt 6/6), beschreiben Bedeutung statt Farbe, Achsen immer in gleicher Reihenfolge; Audio Graphs mit Titel und Zusammenfassung.
