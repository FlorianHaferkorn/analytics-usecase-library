  evidence_access: search_index
  parameters:
    logo_use_requires: [certification, license_agreement, written_consent]
    product_name_use_allowed: false
    implied_certification_allowed: false
    neutral_mention_allowed: true
  applies_to:
    purposes: []
    idioms: []
    style_pack: ibcs
    layer: selection_logic
