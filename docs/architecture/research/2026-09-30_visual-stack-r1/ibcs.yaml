- id: ibcs-004
  pattern: "SUCCESS-Formel — sieben Regelbereiche"
  description: "Konformitaet verlangt die sieben Regelbereiche SAY, UNIFY, CONDENSE, CHECK, EXPRESS, SIMPLIFY, STRUCTURE mit Kuerzeln SA, UN, CO, CH, EX, SI, ST."
  rule_id: SUCCESS
  source:
    title: "IBCS Standards 2.0"
    publisher: IBCS Association
    url: https://ibcs.com/standards/
    date_published: 2026-06-11
    date_accessed: 2026-09-30
    kind: primary
  evidence: "Business Communication meets the IBCS Standards if it complies with the seven rules of the SUCCESS formula"
  evidence_access: search_index
  parameters:
    areas:
      SA: SAY – Convey a message
      UN: UNIFY – Apply semantic notation
      CO: CONDENSE – Increase information density
      CH: CHECK – Ensure visual integrity
      EX: EXPRESS – Choose proper visualization
      SI: SIMPLIFY – Avoid clutter
      ST: STRUCTURE – Organize content
  applies_to:
    purposes: []
    idioms: []
    style_pack: ibcs
    layer: selection_logic
