# R1a IBCS-Regelkatalog. Zugriff 30.09.2026.
# WICHTIG: ibcs.com, ISO-Mirror, Wikipedia und Archive waren per Egress-Proxy fuer WebFetch gesperrt.
# Alle Belege stammen aus WebSearch-Treffern (Suchindex-Auszuege von ibcs.com-Seiten), nicht aus
# direkt abgerufenen Seiten. Daher: evidence_access: search_index = Wortlaut nicht am Original
# gegengeprueft. Regel-IDs (SA/ST/EX/SI/CO/CH/UN) stammen aus der SUCCESS-Struktur bis Version 1.2;
# Version 2.0 (11.06.2026) gliedert neu in Notation + Composition — deren Nummerierung ist nicht gesehen.

