schema_gap_id: SGR-BRACKET-001
use_case_id: ALL
identified_by: framework-architect-agent
date: "2026-06-01"
status: proposed

problem_statement: >
  The UseCase_Bracket.yaml `documentation` block only supports `business_factsheet`.
  There is no way to declare a Domain Evidence Pack path in the machine-readable bracket,
  which prevents the Semantic Quality Gate from automatically locating the DEP for a use
  case and computing source coverage scores.

necessity:
  description: >
    Semantic quality gate automation requires a deterministic path to the DEP for each
    use case. Without a schema field, each tool must heuristically discover the file, which
    is fragile and prevents enforcement. A single optional `evidence_pack` field in
    `documentation` solves this with minimal schema surface area.
  affected_use_cases:
    - ALL  # applies to every use case that produces a DEP
  alternatives_considered:
    - option: "Heuristic discovery — always look for Domain_Evidence_Pack.yaml in the same folder"
      rejected_because: "Fragile; does not work if DEP is in a different location (shared evidence, multi-use-case packs)"
    - option: "Separate evidence registry file"
      rejected_because: "Adds a new global artifact that is harder to maintain and decoupled from use case ownership"

proposed_change:
  schema_file: tooling/generator/schemas/usecase_bracket.schema.json
  field_name: evidence_pack
  parent_object: documentation
  field_type: string
  field_description: "Relative path to Domain_Evidence_Pack.yaml for this use case."
  required: false
  example_value: "./Domain_Evidence_Pack.yaml"
  proposed_addition: |
    In the `documentation` object:
    "evidence_pack": {
      "type": "string",
      "description": "Relative path to Domain_Evidence_Pack.yaml. Optional — required when semantic quality gate is enabled."
    }

impact_assessment:
  generator_impact: "No generator change required. Optional field; generator passes it through."
  validator_impact: >
    Semantic quality gate validator should check this field if present and verify the
    referenced file exists and has status != 'draft'.
  migration_impact: >
    No migration required. Field is optional. Existing brackets remain valid without it.
    Use cases that have a DEP should add the field; others remain unchanged.
  estimated_affected_use_cases: 0  # migration not required

decision:
  approved_by: "pending"
  decision_date: "pending"
  decision_rationale: "pending — awaiting Framework Architect review"
  implementation_ticket: "pending"
