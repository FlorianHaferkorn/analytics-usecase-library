rules:
  agent-workflow:
    description: >
      Execute. Use when: working on any assigned GitHub Issue or PR task.
      Triggers: "start task", "work on issue", "implement", "begin sprint"
    alwaysApply: true
    globs: null

  artifacts-factsheets:
    description: >
      Govern factsheets. Use when: creating or editing Business Factsheets or UseCase_Bracket.yaml.
      Triggers: "factsheet", "use case", "business factsheet", "UseCase_Bracket"
    alwaysApply: false
    globs: "**/usecases/**/*.md"

  artifacts-yaml:
    description: >
      Govern YAML artifacts. Use when: editing action codes, data contracts, or KPI YAML files.
      Triggers: "action code", "data contract", "yaml artifact"
    alwaysApply: false
    globs: "**/*.yaml"

  assistant-agent:
    description: >
      Assist. Use when: preparing daily briefings, plan overviews, decision summaries, or identifying bottlenecks.
      Triggers: "briefing", "what's next", "daily plan", "decisions", "today's focus"
    alwaysApply: false
    globs: null

  fabric-expert:
    description: >
      Author Fabric artifacts. Use when: editing TMDL, DAX, PBIP, Fabric reports, or running Fabric checks.
      Triggers: "tmdl", "dax", "pbip", "fabric", "semantic model", "measure", "report", "pbir"
    alwaysApply: false
    globs: "products/fabric/powerbi/**, **/products/fabric/powerbi/**/*.tmdl"

  framework-architect:
    description: >
      Architect framework. Use when: designing core structure, connector contracts, or living hub strategy.
      Triggers: "architect", "framework design", "connector contract", "hub strategy"
    alwaysApply: false
    globs: null

  framework-conventions:
    description: >
      Enforce conventions. Use when: any edit touching core/ or framework artifacts — ensures Golden Thread and SSOT rules.
      Triggers: always active
    alwaysApply: true
    globs: null

  framework-expert:
    description: >
      Author core artifacts. Use when: editing core/, tooling/ir/, data_contracts/, tooling/validation/, or ontology — tool-agnostic only.
      Triggers: "kpi", "action code", "factsheet", "data contract", "framework", "core/"
    alwaysApply: false
    globs: "core/**, tooling/ir/**, data_contracts/**, tooling/validation/**, tooling/ontology/**"

  oss-stack-expert:
    description: >
      Author OSS stack. Use when: editing Evidence.dev pages, DuckDB queries, dbt models, or page generator.
      Triggers: "evidence", "duckdb", "dbt", "oss", "open source", "dashboard"
    alwaysApply: false
    globs: "products/open_source_stack/**"

  pm-agent:
    description: >
      Manage project. Use when: prioritising backlog, capturing new requirements, updating project fields, or assigning next task.
      Triggers: "prioritize", "next task", "backlog", "project management", "pm", "intake"
    alwaysApply: false
    globs: null

  reviewer-agent:
    description: >
      Review. Use when: reviewing PRs or changes for compliance with rules, skills, and Stage 1.
      Triggers: "review pr", "review changes", "compliance check", "reviewer"
    alwaysApply: false
    globs: null

  router-agent:
    description: >
      Route. Use when: given an issue number or task description, determine which expert rule and skills to apply.
      Triggers: "route", "which expert", "route issue #N", "who handles"
    alwaysApply: false
    globs: null
    delegates_to:
      - fabric-powerbi-authoring
      - fabric-powerbi-consumption
      - fabric-expert
      - framework-expert
      - kpi-framework-agent
      - pbi-generator-orchestrator
      - fabric-api-core

  stage1-awareness:
    description: >
      Enforce Stage 1. Use when: any edit that might be committed — ensures stage1 checks pass.
      Triggers: always active
    alwaysApply: true
    globs: null

  learning-routing:
    description: >
      Route learnings. Use when: fixing any validation, build, drift or Desktop error — decides where the fix is persisted
      (KNOWN_ERRORS_AND_FIXES.md vs core/kpi_catalog/planned.yaml vs generator + regression test).
      Triggers: always active
    alwaysApply: true
    globs: null

  tmdl-dax:
    description: >
      Enforce TMDL/DAX style. Use when: writing or editing .tmdl files or DAX expressions.
      Triggers: "tmdl", "dax", ".tmdl", "measure syntax", "tab indentation"
    alwaysApply: false
    globs: "**/*.tmdl"
