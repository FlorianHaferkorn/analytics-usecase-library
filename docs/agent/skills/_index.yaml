skills:
  add-action-code-and-wire-up:
    name: add-action-code-and-wire-up
    version: "1.0.0"
    description: "Create or update action codes and wire them into use cases. Use when creating action code YAML files, updating orchestration.action_code_ids, or linking action codes to use cases."

  add-kpi-reference-safely:
    name: add-kpi-reference-safely
    version: "1.0.0"
    description: "Add a KPI reference to a use case or action code only if the KPI exists in the catalog; otherwise add to catalog first. Use when adding kpi_id to factsheets, brackets, or action codes."

  add-usecase-scaffold:
    name: add-usecase-scaffold
    version: "1.0.0"
    description: "Create a new use case with Business Factsheet and UseCase_Bracket (Lean 2.0). Use when adding a new use case, scaffolding COM-xxx or FIN-xxx, or the user asks to create a use case."

  assess-change-impact:
    name: assess-change-impact
    version: "1.0.0"
    description: "Assess blast radius before renaming, deleting, or deprecating KPI IDs, action code IDs, or governance roles. Use when making changes that could break downstream references."

  edit-factsheet-safely:
    name: edit-factsheet-safely
    version: "1.0.0"
    description: "Edit Business factsheets without breaking Stage 1 (Lean 2.0). Use when editing Business_Factsheet.md or any use case markdown. Technical Factsheets no longer exist."

  edit-usecase-bracket-safely:
    name: edit-usecase-bracket-safely
    version: "1.0.0"
    description: "Edit UseCase_Bracket.yaml (SSOT) without breaking orchestration or governance (Lean 2.0). Use when editing brackets, orchestration config, governance roles, or action_code_ids."

  run-agentic-loop:
    name: run-agentic-loop
    version: "1.0.0"
    description: "Run the agentic loop S0-S7 (spec, model, report, sandbox, DAX runtime, render, image checks, teardown) through one command. Use when validating a use case end to end or preparing a tenant run."

  fabric-powerbi-validation:
    name: fabric-powerbi-validation
    version: "1.0.0"
    description: "Validate Fabric and Power BI output (TMDL, DAX, measures). Use when working on TMDL files, DAX measures, Fabric checks, or Power BI semantic models."

  fix-oss-dashboard-errors:
    name: fix-oss-dashboard-errors
    version: "1.0.0"
    description: "Diagnose and fix Evidence.dev dashboard and OSS validation errors. Use when validate_oss.py reports errors, an Evidence page fails npm run build in evidence_app/, or an OSS dashboard SQL query returns unexpected results."

  fix-pbi-report-errors:
    name: fix-pbi-report-errors
    version: "1.1.0"
    description: "Diagnose and fix Power BI report and semantic model errors and record each fix in the knowledge base. Use when Power BI Desktop shows an error opening a report, visuals are empty or fields land in filters, TMDL validation fails, measures are missing or DAX errors, or the PBI pipeline/orchestrator reports errors."

  fix-stage1-failure:
    name: fix-stage1-failure
    version: "1.0.0"
    description: "Diagnose and fix Stage 1 CI check failures. Use when Stage 1 checks fail, validation errors occur, or the user asks how to fix a specific check failure."

  generate-and-validate-pbi-report:
    name: generate-and-validate-pbi-report
    version: "1.1.0"
    description: "Generate and validate a Power BI report and semantic model (PBIP/TMDL/PBIR) for a use case in an iterative loop until all checks pass. Use when generating or regenerating a Power BI report from a UseCase_Bracket, building or updating a semantic model with measures, or refreshing reports after UseCase_Bracket.yaml changes."

  generate-oss-dashboard:
    name: generate-oss-dashboard
    version: "1.0.0"
    description: "Generate or regenerate Evidence.dev (OSS stack) dashboard pages from the IR and a UseCase_Bracket. Use when a use case needs an OSS dashboard, after bracket UX layout changes, or when KPI catalog changes require page updates."

  oss-stack-validation:
    name: oss-stack-validation
    version: "1.0.0"
    description: "Run all validation checks for the open-source Evidence.dev stack (Evidence pages, adapter manifest, theme tokens, SQL style, dbt metrics vs KPIs). Use after generating or editing Evidence pages and before committing OSS stack changes."

  recommend-fabric-capacity:
    name: recommend-fabric-capacity
    version: "1.0.0"
    description: "Recommend a Fabric capacity: SKU floor, reserved vs pay-as-you-go, region, and split. Use when sizing a capacity, answering reservation or pricing questions, filling platform.capacity_sku, or when a customer asks which F-SKU or region to buy."

  stage1-pre-commit:
    name: stage1-pre-commit
    version: "1.0.0"
    description: "Run Stage 1 CI checks before committing. Use when the user is about to commit, asks to run checks, validation, or mentions Stage 1, pre-commit gate, or CI checks."

  visual-library:
    name: visual-library
    version: "1.0.0"
    description: "Resolve an analytical question to a governed Power BI chart idiom (evidence-based choice, notation profile, minimum grid size) and audit existing report visuals against the ALUCA deny-list. Use when choosing a chart type, reviewing or upgrading an existing report's visuals, or generating report pages from a use case bracket."
