skills:
  add-action-code-and-wire-up:
    name: add-action-code-and-wire-up
    description: "Create or update action codes and wire them into use cases. Use when creating action code YAML files, updating orchestration.action_code_ids, or linking action codes to use cases."

  add-kpi-reference-safely:
    name: add-kpi-reference-safely
    description: "Add a KPI reference to a use case or action code only if the KPI exists in the catalog; otherwise add to catalog first. Use when adding kpi_id to factsheets, brackets, or action codes."

  add-usecase-scaffold:
    name: add-usecase-scaffold
    description: "Create a new use case with Business Factsheet and UseCase_Bracket (Lean 2.0). Use when adding a new use case, scaffolding COM-xxx or FIN-xxx, or the user asks to create a use case."

  assess-change-impact:
    name: assess-change-impact
    description: "Assess blast radius before renaming, deleting, or deprecating KPI IDs, action code IDs, or governance roles. Use when making changes that could break downstream references."

  edit-factsheet-safely:
    name: edit-factsheet-safely
    description: "Edit Business factsheets without breaking Stage 1 (Lean 2.0). Use when editing Business_Factsheet.md or any use case markdown. Technical Factsheets no longer exist."

  edit-usecase-bracket-safely:
    name: edit-usecase-bracket-safely
    description: "Edit UseCase_Bracket.yaml (SSOT) without breaking orchestration or governance (Lean 2.0). Use when editing brackets, orchestration config, governance roles, or action_code_ids."

  fabric-powerbi-validation:
    name: fabric-powerbi-validation
    description: "Validate Fabric and Power BI output (TMDL, DAX, measures). Use when working on TMDL files, DAX measures, Fabric checks, or Power BI semantic models."

  fix-oss-dashboard-errors:
    name: fix-oss-dashboard-errors
    description: "Diagnose and fix Evidence.dev dashboard / OSS validation errors"

  fix-pbi-report-errors:
    name: fix-pbi-report-errors
    description: "Diagnose and fix Power BI report and semantic model errors. Tool-agnostic workflow for any AI tool or human."

  fix-stage1-failure:
    name: fix-stage1-failure
    description: "Diagnose and fix Stage 1 CI check failures. Use when Stage 1 checks fail, validation errors occur, or the user asks how to fix a specific check failure."

  generate-and-validate-pbi-report:
    name: generate-and-validate-pbi-report
    description: "Iterative, learning workflow for error-free Power BI report and semantic model generation. Tool-agnostic workflow for any AI tool or human."

  generate-oss-dashboard:
    name: generate-oss-dashboard
    description: "Generate Evidence.dev dashboard pages from IR and UseCase Bracket"

  oss-stack-validation:
    name: oss-stack-validation
    description: "Validate OSS stack artifacts (Evidence pages, adapter manifest, theme tokens, SQL style)"

  stage1-pre-commit:
    name: stage1-pre-commit
    description: "Run Stage 1 CI checks before committing. Use when the user is about to commit, asks to run checks, validation, or mentions Stage 1, pre-commit gate, or CI checks."
