- kpi_id: "sales.net_sales.amount"
  kpi_key: "Net Sales Amount"
  kpi_type: "strategic"
  kpi_role: "strategic"
  impact_dimension: "Growth"
  domain_tag:
    - "Commercial"
  use_case_ref:
    - "COM-001"
  calc_type: "amount"

  business:
    purpose: "Tracks total realized sales revenue."
    definition: "Net sales after discounts and returns."
    grain_scope: "Invoice line aggregated by Month, Org, Product."
    unit_format: "USD (0 decimals)"
    interpretation: "Higher is better; compare to plan and prior year."

  technical:
    dax_name: "Net Sales Amount"
    depends_on_measures:
      - "Gross Sales Amount"
      - "Discount Amount"
      - "Return Amount"
    lineage:
      - "fact_sales.Net Sales Amount"

  governance:
    business_owner: "Head of Sales"
    data_owner: "Commercial BI"
    steward: "Sales Analytics Lead"
    review_cycle: "monthly"
    validation_process: "Reconcile to finance-reported net sales each close."
    qa_rules:
      - "Must reconcile within ±0.5% to finance net sales."
      - "Value must be >= 0 at company level."
    version: "v1.0"

  metadata_quality:
    completeness_score: 0.95
    last_review: "22.01.2026"

- kpi_id: "margin.gm.pct"
  kpi_key: "Gross Margin %"
  kpi_type: "strategic"
  kpi_role: "strategic"
  impact_dimension: "Profitability"
  domain_tag:
    - "Commercial"
  use_case_ref:
    - "COM-002"
  calc_type: "ratio"

  business:
    purpose: "Measures profitability relative to net sales."
    definition: "(Net Sales Amount - COGS Amount) / Net Sales Amount."
    grain_scope: "Invoice line aggregated by Month, Org, Product."
    unit_format: "% (1 decimal)"
    interpretation: "Higher is better; negative values indicate loss."

  technical:
    dax_name: "Gross Margin %"
    depends_on_measures:
      - "Net Sales Amount"
      - "COGS Amount"
    lineage:
      - "fact_sales.Net Sales Amount"
      - "fact_sales.COGS Amount"

  governance:
    business_owner: "Head of Controlling"
    data_owner: "Finance BI"
    steward: "Senior Controller"
    review_cycle: "monthly"
    validation_process: "Reconcile to finance gross margin at month-end."
    qa_rules:
      - "Value must be between -100% and 100%."
      - "Reconcile within ±0.5 pp at company level."
    version: "v1.0"

  metadata_quality:
    completeness_score: 0.95
    last_review: "22.01.2026"

- kpi_id: "sales.price.realization_pct"
  kpi_key: "Price Realization %"
  kpi_type: "supporting"
  kpi_role: "supporting"
  impact_dimension: "Profitability"
  domain_tag:
    - "Commercial"
  use_case_ref:
    - "COM-001"
  calc_type: "ratio"

  business:
    purpose: "Measures realized price versus list price."
    definition: "Net price divided by list price."
    grain_scope: "Invoice line aggregated by Month, Product, Customer."
    unit_format: "% (1 decimal)"
    interpretation: "Lower values indicate discount leakage."

  technical:
    dax_name: "Price Realization %"
    depends_on_measures:
      - "Net Price Amount"
      - "List Price Amount"
    lineage:
      - "fact_sales.Net Price Amount"
      - "fact_sales.List Price Amount"

  governance:
    business_owner: "Pricing Lead"
    data_owner: "Commercial BI"
    steward: "Pricing Analyst"
    review_cycle: "monthly"
    validation_process: "Reconcile to pricing system extracts."
    qa_rules:
      - "Value must be between 0% and 200%."
    version: "v1.0"

  metadata_quality:
    completeness_score: 0.9
    last_review: "22.01.2026"

- kpi_id: "ops.downtime.pct"
  kpi_key: "Downtime %"
  kpi_type: "supporting"
  kpi_role: "supporting"
  impact_dimension: "Efficiency"
  domain_tag:
    - "Operations"
  use_case_ref:
    - "OPS-001"
  calc_type: "ratio"

  business:
    purpose: "Measures downtime relative to planned production time."
    definition: "Downtime divided by planned production time."
    grain_scope: "Line aggregated by Day and Site."
    unit_format: "% (1 decimal)"
    interpretation: "Lower is better; high values indicate disruptions."

  technical:
    dax_name: "Downtime %"
    depends_on_measures:
      - "Downtime Minutes"
      - "Planned Minutes"
    lineage:
      - "fact_ops.Downtime Minutes"
      - "fact_ops.Planned Minutes"

  governance:
    business_owner: "Operations Director"
    data_owner: "Ops Analytics"
    steward: "Plant Performance Lead"
    review_cycle: "monthly"
    validation_process: "Reconcile to MES downtime logs."
    qa_rules:
      - "Value must be between 0% and 100%."
    version: "v1.0"

  metadata_quality:
    completeness_score: 0.9
    last_review: "22.01.2026"
