# Sync backlog (granular_issues.json) to GitHub Project: get-or-create issues, add to project, set fields, remove duplicates.
# Triggered only when the machine-readable source or sync script changes. Manual run can override project number.
# See: internal/project_mgmt/BACKLOG_GRANULAR.md, tooling/project_mgmt/sync_project_from_backlog.ps1
#
# REQUIRED SECRET: GH_PAT — a classic Personal Access Token with 'repo' and 'project' scopes.
# The standard GITHUB_TOKEN does NOT have GitHub Projects v2 write access.
# Create one at https://github.com/settings/tokens and store it as a repository secret named GH_PAT.

name: Sync project from backlog

on:
  push:
    paths:
      - tooling/project_mgmt/granular_issues.json
      - tooling/project_mgmt/sync_project_from_backlog.ps1
      - tooling/project_mgmt/GranularIssues.ps1
      - tooling/project_mgmt/setup_project_full.ps1
  workflow_dispatch:
    inputs:
      project_number:
        description: "Project number (default 2)"
        required: false
        default: "2"

jobs:
  sync:
    name: Sync backlog to project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync project from backlog
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PROJECT_NUMBER: ${{ github.event.inputs.project_number || '2' }}
        run: pwsh -File tooling/project_mgmt/sync_project_from_backlog.ps1
