# Updated WORKFLOW

name: Project Status Update

on:
  push:
    branches:
      - main

jobs:
  update_project_status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Update Project Status
        run: |
          echo "PROJECT_NUMBER=2" > .env
      - name: Print Project Number
        run: |
          echo "Current Project Number: 2"