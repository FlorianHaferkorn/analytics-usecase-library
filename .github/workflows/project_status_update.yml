# Weekly Project status update: generates a draft status update from Project V2 data
# and creates it via GraphQL (createProjectV2StatusUpdate). A human reviews and
# publishes the update in the GitHub Project UI.
# See: internal/project_mgmt/OPERATING_MODEL.md, tooling/project_mgmt/weekly_status_update.py

name: Weekly project status update

on:
  schedule:
    # Friday 16:00 UTC
    - cron: "0 16 * * 5"
  workflow_dispatch:

jobs:
  status-update:
    name: Create draft status update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create Project status update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PROJECT_NUMBER: "1"
        run: python tooling/project_mgmt/weekly_status_update.py
