# Project Status Update Workflow

name: Project Status Update

on:
  push:
    branches:
      - main

jobs:
  update-project-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Update Project Number
        run: |
          PROJECT_NUMBER="2"
          echo "PROJECT_NUMBER updated to $PROJECT_NUMBER"

      - name: Commit Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .github/workflows/project_status_update.yml
          git commit -m "Update PROJECT_NUMBER to 2" || echo "No changes to commit" 
