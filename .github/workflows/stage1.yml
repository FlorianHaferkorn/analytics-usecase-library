# Stage 1 CI: hard gate for all PRs. Must pass before merge.
# See: tooling/run_stage1_checks.ps1, .cursor/rules/stage1-awareness.mdc
#
# Job responsibilities:
#   python-checks  — pytest (all tests incl. report_quality), health scorecard.
#                    Runs on ubuntu-latest for speed.
#   fabric-bindings — PBIR visual binding checks per domain.
#                    Runs on ubuntu-latest with Python only.
#   stage1         — Core governance checks via run_stage1_checks.ps1 (PowerShell).
#                    Runs on windows-latest; includes registry builder, drift,
#                    markdownlint, docs links, and all other PS1 validators.
#
# Previously separate catalog-tmdl-drift and duplicate registry builder jobs
# have been consolidated: stage1 already runs both via run_stage1_checks.ps1.

name: Stage 1

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  python-checks:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jsonschema pytest typer rich referencing

      - name: Run tests
        run: python -m pytest --tb=short -q

      - name: Health scorecard
        run: python tooling/health_scorecard.py

  fabric-bindings:
    name: Fabric bindings (${{ matrix.domain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        domain:
          - Commercial
          - Experience
          - Finance
          - Operations
          - SupplyChain
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate report bindings (${{ matrix.domain }})
        run: |
          python3 products/fabric/powerbi/tooling/validate_bindings.py \
            --dist-dir products/fabric/powerbi/dist \
            --domain ${{ matrix.domain }} \
            --strict

  stage1:
    name: Stage 1 checks
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install schema validation dependencies
        run: npm ci
        working-directory: tooling/validation

      - name: Install Stage 1 Python validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tooling/validation/requirements-data-contracts.txt

      - name: Install test dependencies
        run: python -m pip install -r tooling/tests/requirements.txt

      - name: Install PowerShell modules
        shell: pwsh
        run: Install-Module -Name powershell-yaml -Force -Scope CurrentUser

      - name: Run Stage 1 checks
        shell: pwsh
        run: ./tooling/run_stage1_checks.ps1 -Root $env:GITHUB_WORKSPACE
        working-directory: ${{ github.workspace }}

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: drift_report.json
          if-no-files-found: ignore
