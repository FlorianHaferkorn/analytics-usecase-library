# Stage 1 CI: hard gate for all PRs. Must pass before merge.
# See: tooling/run_stage1_checks.ps1, .cursor/rules/stage1-awareness.mdc

name: Stage 1

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  python-checks:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jsonschema pytest

      - name: Run tests
        run: python -m pytest --tb=short -q

      - name: Registry builder (strict)
        run: python tooling/ontology/registry_builder.py --strict

      - name: Health scorecard
        run: python tooling/health_scorecard.py

  # Drift gate — strict: blocks merge on any unregistered missing measure or
  # duplicate un-suffixed measure name across domain models.
  # Entries in core/kpi_catalog/planned.yaml are warnings only.
  drift-strict:
    name: Catalog ↔ TMDL drift (strict — blocks merge)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jsonschema

      - name: Run drift check (strict)
        run: python tooling/validation/check_catalog_tmdl_drift.py --strict --repo-root .

  # Drift gate — informational: lists planned entries as a warning annotation.
  # Never blocks merge; intended for visibility and backlog tracking.
  drift-informational:
    name: Catalog ↔ TMDL drift (informational — planned entries)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jsonschema

      - name: List planned KPI entries (informational)
        run: |
          echo "::notice title=Planned KPI entries::The following catalog entries are not yet in TMDL. See core/kpi_catalog/planned.yaml for ETA and owner."
          python tooling/validation/check_catalog_tmdl_drift.py --repo-root . || true

  stage1:
    name: Stage 1 checks
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install schema validation dependencies
        run: npm ci
        working-directory: tooling/validation

      - name: Install data contract validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tooling/validation/requirements-data-contracts.txt

      - name: Install test dependencies
        run: python -m pip install -r tooling/tests/requirements.txt

      - name: Run Python unit tests (brand derivation pipeline)
        run: python -m pytest tooling/tests/test_brand_derivations.py -v --tb=short

      - name: Run Stage 1 checks
        shell: pwsh
        run: ./tooling/run_stage1_checks.ps1 -Root $env:GITHUB_WORKSPACE
        working-directory: ${{ github.workspace }}
