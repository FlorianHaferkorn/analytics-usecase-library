# Stage 1 CI: hard gate for all PRs. Must pass before merge.
# See: tooling/run_stage1_checks.ps1, tooling/quality/run_quality_gate.ps1
#
# Job responsibilities:
#   python-checks  — pytest (all tests incl. report_quality), health scorecard.
#                    Runs on ubuntu-latest for speed.
#   fabric-bindings — PBIR visual binding checks per domain.
#                    Runs on ubuntu-latest with Python only.
#   stage1         — Core governance (run_stage1_checks.ps1) then Fabric quality
#                    gate (run_quality_gate.ps1 -SkipStage1) on windows-latest.
#                    Includes TMDL, PBIR, pbir-cli --qa, P0 report quality.

name: Stage 1

on:
  pull_request:
    # Meridian D-572: Entwurfs-PRs laufen nicht; `ready_for_review` startet den vollen Lauf.
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  push:
    branches: [main]
  # Manual trigger — lets you run the FULL workflow on any branch from the Actions
  # tab ("Run workflow") without merging to main or marking a draft PR ready. Under
  # workflow_dispatch the event is not `pull_request`, so the draft-skip `if:` below
  # evaluates true and the Windows job runs too — i.e. this tests the complete matrix
  # on the branch. (A normal branch push does NOT trigger this workflow — only
  # pull_request→main, push→main, or this manual dispatch do.)
  workflow_dispatch: {}

# Cancel a superseded run when a newer commit lands on the same ref (PR or branch).
# Without this, every push to an active PR started a *fresh* full matrix while the
# previous run kept burning minutes — the single biggest Actions-usage drain.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-checks:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    # Python gate + report-binding validation in ONE ubuntu job. Folding the former
    # separate fabric-bindings job in here saves a whole checkout+setup cycle (and one
    # concurrent runner) per run — validate_bindings is a fast script, not worth its own
    # runner. Wall-clock is a few seconds longer; runner-minutes are lower.
    name: Python checks + report bindings
    runs-on: ubuntu-latest
    # Cap a hung run. Default is 360 min of billed runner time; the suite takes ~12.5 min
    # serial locally (745 s), a few minutes with xdist — 30 leaves headroom for cold caches.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # The package list lives inline in "Install dependencies" below, so the cache
          # key hashes this workflow file: edit the list and the key changes with it.
          # Saves the pyarrow/pandas/vl-convert wheel downloads on every run.
          cache: "pip"
          cache-dependency-path: .github/workflows/stage1.yml

      - name: Index drift-gate (_INDEX.md completeness)
        run: python3 scripts/check_index.py --strict

      # Sieben Annahmen, die nur auf Linux stimmen. Diese CI FAEHRT auf Linux
      # und kann sie deshalb nicht durch Laufen finden -- nur so. Zwei Klassen
      # stehen auf Null und sind hart gesperrt, der Rest laeuft als Klinke
      # (scripts/plattform_baseline.json): der Bestand darf sinken, nie steigen.
      - name: Plattform-Sperrklinke (blockierend)
        run: python3 scripts/check_plattform.py


      # Ungueltige Escape-Sequenz in einem nicht-rohen String: heute eine
      # SyntaxWarning, ab 3.14 ein SyntaxError. Gefunden am 10.09.2026 in
      # `e2e_smoke.py` -- ``System32\bash.exe`` in einem Docstring, wo ``\b``
      # still zum Backspace wurde. `-f` erzwingt das Neuuebersetzen: sonst
      # verschluckt der Bytecode-Cache die Warnung beim zweiten Lauf.
      - name: Escape-Sequenzen (blockierend)
        run: python3 -W error::SyntaxWarning -m compileall -q -f core products scripts tooling

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pyarrow UND pandas: `tooling/validation/check_data_model.py` importiert beide
          # ungeschuetzt (pyarrow beim Parquet-Scan, pandas in `_read_small`). Fehlt eines,
          # scheitert `test_shipped_model_has_no_hard_findings` mit ModuleNotFoundError — ein
          # Gate, das in der CI nie gruen werden KONNTE. Beide Male gemessen statt vermutet:
          # pyarrow in Lauf 30683999827, pandas im Folgelauf 30684535523 (01.08.2026). Die
          # zweite Luecke lag hinter der ersten: erst nachdem pyarrow da war, kam der Import
          # ueberhaupt bis zur naechsten Zeile.
          # vl-convert-python UND altair: die gesamte Rasterisierungs-Schicht der Visual
          # Library haengt daran (`pytest.importorskip`). Ohne sie meldet die CI Erfolg und
          # hat kein einziges Bild erzeugt — gemessen 08.09.2026: 13 uebersprungene Tests je
          # Lauf, darunter `test_frozen_validation_matrix_is_current`, weshalb die
          # eingefrorene Matrix seit dem 07.09. still veraltet war. Das ist dieselbe Klasse
          # wie ein Tor, dessen Werkzeug nicht startet: `n/a` und `nicht gelaufen` sehen von
          # aussen gleich aus. Mit beiden Paketen lokal gemessen: 78 passed, 1 skipped.
          # Nachtrag 24.09.2026: die Tests oben liefen hier trotzdem nie. `pytest` ohne Pfad
          # sammelt nur die `testpaths` der pyproject.toml, und `tooling/visual_library/tests`
          # stand dort seit dem 10.08. nicht drin (gemessen: 0 gesammelt, danach 105).
          # pillow: sechs visreg-Tests haengen daran; ohne es uebersprungen, mit es 6 passed.
          # pytest-xdist: `-n auto` below. Gemessen 29.09.2026, 4 Kerne, gleiche venv mit
          # genau dieser Paketliste: seriell 3326 passed / 26 skipped in 790 s, `-n auto`
          # 3326 passed / 26 skipped in 218 s, identische Skip-Menge. Ein Einzellauf je
          # Modus belegt keinen Determinismus; ein Reihenfolge-Fehler zeigt sich als rot
          # nur unter -n — dann lokal seriell gegenstellen.
          pip install pyyaml jsonschema pytest pytest-xdist typer rich referencing python-docx pyarrow pandas vl-convert-python altair pillow

      - name: Run tests
        run: python -m pytest -n auto --tb=short -q

      - name: Report quality gate (0 criticals)
        run: |
          python -c "import sys; sys.path.insert(0, 'packages/pbi_quality_tools'); from pbi_quality_tools.cli import main; raise SystemExit(main(['validate', '--summary']))"

      - name: Health scorecard
        run: python tooling/health_scorecard.py

      - name: Validate report bindings (all domains)
        # validate_bindings.py with no --domain validates every dist report in one
        # call (same as run_local_ci_check.sh) — replaces the former 5-way domain matrix.
        run: |
          python3 products/fabric/powerbi/tooling/validate_bindings.py \
            --dist-dir products/fabric/powerbi/dist \
            --strict

  stage1:
    name: Stage 1 checks
    runs-on: windows-latest
    # windows-latest is billed at 2× the ubuntu minute rate and this job is the
    # heaviest (Node + Python×2 + PSGallery + fab-inspector + full quality gate),
    # so it is the biggest single cost. Skip it while a PR is a draft — full CI
    # (incl. this job) runs the moment the PR is marked ready for review, and it
    # always runs on push to main. Local `run_quality_gate.ps1` covers drafts.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # Cap a hung run (default 360 min, billed at 2x on Windows).
    timeout-minutes: 45
    env:
      # Point the `py` launcher at the same minor version actions/setup-python installs,
      # so `py -3` (run_stage1_checks.ps1) and `python` (other gate scripts) agree.
      PY_PYTHON: "3.11"
      PY_PYTHON3: "3.11"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # cache the npm downloads for `npm ci` below (cache-miss just re-downloads)
          cache: "npm"
          cache-dependency-path: tooling/validation/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # cache the pip wheel dir keyed on the requirements this job installs
          cache: "pip"
          cache-dependency-path: |
            tooling/validation/requirements-data-contracts.txt
            products/fabric/powerbi/tooling/requirements-fabric-checks.txt
            tooling/tests/requirements.txt

      - name: Install schema validation dependencies
        run: npm ci
        working-directory: tooling/validation

      - name: Install Python dependencies (once, into the interpreter the gates use)
        # run_stage1_checks.ps1 prefers the `py -3` launcher (to dodge the Windows Store
        # `python` alias); other gate scripts call `python`. Formerly every requirements
        # file was installed twice, into both, because they could resolve to different
        # interpreters. Now: ask both which interpreter they are, install once, and only
        # install a second time if they really differ (logged as a warning, so the first
        # real runner measures whether the launcher pin above suffices).
        shell: pwsh
        run: |
          $reqs = @(
            '-r', 'tooling/validation/requirements-data-contracts.txt',
            '-r', 'products/fabric/powerbi/tooling/requirements-fabric-checks.txt',
            '-r', 'tooling/tests/requirements.txt'
          )
          $pythonExe = (& python -c "import sys; print(sys.executable)").Trim()
          $launcherExe = $null
          try { $launcherExe = (& py -3 -c "import sys; print(sys.executable)" 2>$null | Select-Object -First 1) } catch { }
          if ($launcherExe) { $launcherExe = $launcherExe.Trim() }
          Write-Host "python -> $pythonExe"
          Write-Host "py -3  -> $launcherExe"
          $targets = @(,@('python'))
          if ($launcherExe -and ($launcherExe -ne $pythonExe)) {
            Write-Warning "py -3 resolves to a different interpreter; installing into both."
            $targets += ,@('py', '-3')
          }
          foreach ($t in $targets) {
            $exe = $t[0]; $pre = @($t | Select-Object -Skip 1)
            & $exe @pre -m pip install --upgrade pip
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $exe @pre -m pip install @reqs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Install PowerShell modules
        shell: pwsh
        run: |
          # Harden against the two most common causes of PSGallery's
          # "No match was found for the specified search criteria and module
          # name" on a fresh Windows runner: (1) TLS 1.2 not negotiated by
          # default, so the gallery query silently returns nothing; (2) the
          # NuGet package provider missing/stale, which Install-Module needs
          # to even talk to PSGallery. Also retries a few times — PSGallery
          # has occasional transient blips.
          [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12

          if (-not (Get-PackageProvider -Name NuGet -ErrorAction SilentlyContinue)) {
            Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
          }
          if ((Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue).InstallationPolicy -ne 'Trusted') {
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          }

          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            try {
              Install-Module -Name powershell-yaml -Repository PSGallery -Force -Scope CurrentUser -AllowClobber -ErrorAction Stop
              Write-Host "powershell-yaml installed (attempt $attempt)"
              break
            } catch {
              Write-Warning "Install-Module attempt $attempt/$maxAttempts failed: $($_.Exception.Message)"
              if ($attempt -eq $maxAttempts) { throw }
              Start-Sleep -Seconds (5 * $attempt)
            }
          }

      - name: Run Stage 1 checks
        shell: pwsh
        run: ./tooling/run_stage1_checks.ps1 -Root $env:GITHUB_WORKSPACE
        working-directory: ${{ github.workspace }}

      - name: Install fab-inspector CLI (PBI-Inspector V2)
        shell: pwsh
        # Cross-platform, PBIR-capable JSON-Logic rules engine used by
        # check_fab_inspector.ps1. See .tools/fab-inspector.lock and
        # docs/architecture/r3-2-fab-inspector-integration.md.
        run: |
          $lockContent = Get-Content ".tools/fab-inspector.lock" -Raw
          $urlMatch = [regex]::Match($lockContent, 'download_url:\s*"([^"]+)"')
          if (-not $urlMatch.Success) { Write-Error "fab-inspector.lock missing download_url"; exit 1 }
          $downloadUrl = $urlMatch.Groups[1].Value
          $sha256Match = [regex]::Match($lockContent, 'sha256:\s*"([^"]+)"')
          $expectedHash = if ($sha256Match.Success) { $sha256Match.Groups[1].Value } else { "" }

          New-Item -ItemType Directory -Force -Path ".tools/fab-inspector" | Out-Null
          $zipPath = ".tools/fab-inspector.zip"
          try {
            Invoke-WebRequest -Uri $downloadUrl -OutFile $zipPath -MaximumRetryCount 3 -RetryIntervalSec 5
          } catch {
            Write-Warning "fab-inspector download failed: $($_.Exception.Message). check_fab_inspector.ps1 will skip gracefully."
            exit 0
          }

          if ($expectedHash -and $expectedHash -ne "placeholder_update_after_download") {
            $actualHash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLower()
            if ($actualHash -ne $expectedHash.ToLower()) {
              Write-Error "fab-inspector hash mismatch. Expected $expectedHash, got $actualHash."
              exit 1
            }
          } else {
            Write-Warning "fab-inspector.lock contains placeholder SHA-256 -- update it with the hash printed below."
            Write-Host "Downloaded fab-inspector.zip SHA-256: $((Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLower())"
          }

          Expand-Archive $zipPath -DestinationPath ".tools/fab-inspector" -Force
          $exe = Get-ChildItem -Path ".tools/fab-inspector" -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match "(?i)fab-?insp" } | Select-Object -First 1
          if (-not $exe) {
            $exe = Get-ChildItem -Path ".tools/fab-inspector" -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $exe) {
            Write-Warning "fab-inspector executable not found after extraction. check_fab_inspector.ps1 will skip gracefully."
            exit 0
          }
          Write-Host "fab-inspector resolved to: $($exe.FullName)"
          "FAB_INSPECTOR_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        working-directory: ${{ github.workspace }}

      - name: Run Fabric quality gate
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: ./tooling/quality/run_quality_gate.ps1 -SkipStage1
        working-directory: ${{ github.workspace }}

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: drift_report.json
          if-no-files-found: ignore

      - name: Upload fab-inspector BPA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fab-inspector-report
          path: internal/metrics/runs/fab_inspector/
          if-no-files-found: ignore

      - name: Upload report scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-scorecard
          path: internal/metrics/runs/report_scorecard/
          if-no-files-found: ignore
