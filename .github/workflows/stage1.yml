# Stage 1 CI: hard gate for all PRs. Must pass before merge.
# See: tooling/run_stage1_checks.ps1, .cursor/rules/stage1-awareness.mdc

name: Stage 1

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  stage1:
    name: Stage 1 checks
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install schema validation dependencies
        run: npm ci
        working-directory: tooling/validation

      - name: Install data contract validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tooling/validation/requirements-data-contracts.txt

      - name: Run Stage 1 checks
        shell: pwsh
        run: ./tooling/run_stage1_checks.ps1 -Root $env:GITHUB_WORKSPACE
        working-directory: ${{ github.workspace }}
