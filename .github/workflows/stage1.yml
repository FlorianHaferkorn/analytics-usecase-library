# Stage 1 CI: hard gate for all PRs. Must pass before merge.
# See: tooling/run_stage1_checks.ps1, .cursor/rules/stage1-awareness.mdc

name: Stage 1

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  python-checks:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jsonschema pytest

      - name: Run tests
        run: python -m pytest --tb=short -q

      - name: Registry builder (strict)
        run: python tooling/ontology/registry_builder.py --strict

      - name: Health scorecard
        run: python tooling/health_scorecard.py

  validate-bindings:
    name: Validate bindings (${{ matrix.domain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        domain:
          - Commercial
          - Experience
          - Finance
          - Operations
          - SupplyChain
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate report bindings (${{ matrix.domain }})
        run: |
          python3 products/fabric/powerbi/tooling/validate_bindings.py \
            --dist-dir products/fabric/powerbi/dist \
            --domain ${{ matrix.domain }} \
            --strict

  catalog-tmdl-drift:
    name: Catalog↔TMDL drift check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Check catalog↔TMDL drift
        run: |
          python3 tooling/validation/check_catalog_tmdl_drift.py \
            --catalog core/kpi_catalog/KPI_Catalog.md \
            --dist-dir products/fabric/powerbi/dist \
            --ignore-missing
        id: drift_check

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: drift_report.json
          if-no-files-found: ignore

  action-outcome-reconciliation:
    name: Action-outcome reconciliation gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow pyyaml

      - name: Run action-outcome reconciliation check
        run: |
          python3 tooling/generator/validation/check_action_outcome_reconciliation.py \
            --fact-dir showcases/aurora_group/data/gold/facts/fact_action_outcome \
            --impactful-15 core/action_codes/impactful_15.yaml \
            --strict

  stage1:
    name: Stage 1 checks
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install schema validation dependencies
        run: npm ci
        working-directory: tooling/validation

      - name: Install data contract validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tooling/validation/requirements-data-contracts.txt

      - name: Install test dependencies
        run: python -m pip install -r tooling/tests/requirements.txt

      - name: Run Python unit tests (brand derivation pipeline)
        run: python -m pytest tooling/tests/test_brand_derivations.py -v --tb=short

      - name: Install PowerShell modules
        shell: pwsh
        run: Install-Module -Name powershell-yaml -Force -Scope CurrentUser

      - name: Run Stage 1 checks
        shell: pwsh
        run: ./tooling/run_stage1_checks.ps1 -Root $env:GITHUB_WORKSPACE
        working-directory: ${{ github.workspace }}
