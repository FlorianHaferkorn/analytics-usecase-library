# Post or update a single PR comment with: title, body, files changed, diff stats.
# Also checks that delivery PRs (title [N] or branch agent/N-*) contain "Closes #N" so the issue is closed on merge.
# See: internal/project_mgmt/PM_FLOW.md

name: PR review summary

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  check-closes-issue:
    name: Require Closes #N in PR body
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check PR has Closes #N when delivery-style
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -e
          # Extract issue number from title [N] or branch agent/N-*
          N=""
          if [[ "$TITLE" =~ \[([0-9]+)\] ]]; then
            N="${BASH_REMATCH[1]}"
          elif [[ "$REF" =~ ^agent/([0-9]+)- ]]; then
            N="${BASH_REMATCH[1]}"
          fi
          if [[ -z "$N" ]]; then
            echo "Not a delivery-style PR (no [N] in title or agent/N-* branch); skip Closes check."
            exit 0
          fi
          # Require body to contain Closes #N or Fixes #N (case-insensitive)
          BODY_NORM=$(echo "$BODY" | tr '[:upper:]' '[:lower:]')
          if echo "$BODY_NORM" | grep -qE '(closes|fixes)\s*#'"$N"'\b'; then
            echo "PR body contains Closes #${N} or Fixes #${N}. OK."
            exit 0
          fi
          echo "::error::Delivery PR (title or branch references issue #${N}) must contain 'Closes #${N}' or 'Fixes #${N}' in the description so the issue is closed on merge."
          exit 1

  summary:
    name: Post review summary comment
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout (with fetch-depth for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build summary and post/update comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -e
          MARKER="<!-- pr-review-summary -->"
          TITLE="${PR_TITLE:-}"
          DESC="${PR_BODY:-}"
          [ -z "$DESC" ] && DESC="*No description.*"
          BASE="${BASE_SHA:-}"
          FILES=$(git diff --name-status "$BASE"...HEAD 2>/dev/null || echo "—")
          STATS=$(git diff --shortstat "$BASE"...HEAD 2>/dev/null || echo "—")

          CHECKS_URL="https://github.com/${REPO}/pull/${PR_NUMBER}/checks"
          {
            echo "$MARKER"
            echo "## PR review summary"
            echo ""
            echo "**Automated checks (run on every PR):**"
            echo "- [Stage 1](https://github.com/${REPO}/blob/main/.github/workflows/stage1.yml) and [Closes #N](https://github.com/${REPO}/blob/main/.github/workflows/pr_review_summary.yml) — see [Checks](${CHECKS_URL}) for status."
            echo "- **Manual before merge:** Run the Reviewer Agent (Cursor session with \`.cursor/rules/reviewer-agent.mdc\`, say \"Review PR #${PR_NUMBER}\"). See [PM_FLOW.md](https://github.com/${REPO}/blob/main/internal/project_mgmt/PM_FLOW.md) §2.3."
            echo ""
            echo "**Title:** $TITLE"
            echo ""
            echo "**Summary / description:**"
            printf '%s\n' "$DESC"
            echo ""
            echo "**Files changed:**"
            echo '```'
            echo "$FILES"
            echo '```'
            echo ""
            echo "**Diff stats:** $STATS"
          } > comment_body.md

          EXISTING=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --jq '.[] | select(.body | contains("<!-- pr-review-summary -->")) | .id' 2>/dev/null | head -1)
          if [ -n "$EXISTING" ]; then
            BODY_JSON=$(jq -Rs '{body: .}' comment_body.md)
            echo "$BODY_JSON" | gh api "repos/${REPO}/issues/comments/${EXISTING}" -X PATCH --input -
          else
            gh pr comment "$PR_NUMBER" --body-file comment_body.md
          fi
