# Studio CI: gate for the ActionReady Studio Next.js app (studio/).
#
# Prior to this workflow, studio/'s own test suite (vitest + Playwright) had
# zero CI coverage — noted as a gap during I-10.3/I-10.4 (see
# docs/architecture/premium-acceptance-F0-F6.md, F4). Kept as its own
# workflow, scoped to studio/ changes, so it doesn't slow down PRs that never
# touch the Studio app.

name: Studio

on:
  pull_request:
    branches: [main]
    paths:
      - "studio/**"
      - ".github/workflows/studio.yml"
  push:
    branches: [main]
    paths:
      - "studio/**"
      - ".github/workflows/studio.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-unit:
    name: Studio (typecheck + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: studio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Vitest
        run: npm test

  e2e:
    name: Studio (Playwright e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: studio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Write minimal env for demo-login e2e runs
        run: echo 'AUTH_SECRET=ci-only-not-a-real-secret' > .env.local

      - name: Run Playwright
        # playwright.ci.config.ts excludes visual-regression.spec.ts /
        # design-system-optical.spec.ts — their baseline PNGs were captured on
        # Windows (filenames end -win32) and would fail on every Linux CI run
        # from font/anti-aliasing differences alone, not real regressions.
        # They remain real coverage run locally on Windows.
        run: npx playwright test --config=playwright.ci.config.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: studio/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
