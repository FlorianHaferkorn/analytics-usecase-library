name: Linux generation (capability)

# Proves the canonical PowerShell measure generator runs on Linux (PowerShell
# Core is cross-platform; GitHub ubuntu runners ship pwsh pre-installed). This is
# the enabler for the "golden build" regeneration (rebuild dist from source on a
# Linux CI runner) -- see products/fabric/powerbi/docs/linux-generation.md.
#
# Smoke scope: registry build (Python) + measure generation (pwsh) to a scratch
# dir, asserting a _Measures.tmdl is produced. It does NOT overwrite committed
# dist and does NOT yet assert full-output parity (standalone generation resolves
# display names only through the full orchestrator pipeline -- tracked in the doc).

on:
  pull_request:
    paths:
      - "tooling/generator/**"
      - "core/kpi_catalog/**"
      - "core/usecases/**"
      - ".github/workflows/linux-generation.yml"
  workflow_dispatch: {}

jobs:
  linux-generate:
    name: Generate measures on Linux (pwsh)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install pyyaml jsonschema typer rich

      - name: Confirm pwsh is available
        shell: pwsh
        run: $PSVersionTable.PSVersion.ToString()

      - name: Build registry (Python, non-fatal)
        run: python tooling/ontology/registry_builder.py --repo-root . || true

      - name: Generate measures on Linux (pwsh, scratch dir)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path scratch_gen | Out-Null
          ./tooling/generator/generate_tmdl_measures.ps1 -UseCase COM-001 -UseCasesRoot core/usecases/core -KpiCatalogRoot core/kpi_catalog -DistRoot products/fabric/powerbi/dist -TargetTablesDir scratch_gen -OverwriteExisting

      - name: Assert a _Measures.tmdl was produced
        run: |
          test -s scratch_gen/_Measures.tmdl
          echo "Linux generation produced $(grep -c '^\tmeasure ' scratch_gen/_Measures.tmdl) measure(s)."

      - name: Assert committed dist was not modified
        run: |
          git diff --quiet -- products/fabric/powerbi/dist || (echo "generation must not touch committed dist" && exit 1)
