name: Linux generation (capability)

# Proves the canonical PowerShell measure generator runs on Linux (PowerShell
# Core is cross-platform; GitHub ubuntu runners ship pwsh pre-installed). This is
# the enabler for the "golden build" regeneration (rebuild dist from source on a
# Linux CI runner) -- see products/fabric/powerbi/docs/linux-generation.md.
#
# Smoke scope: registry build (Python) + measure generation (pwsh) to a scratch
# dir, asserting a _Measures.tmdl is produced. It does NOT overwrite committed
# dist and does NOT yet assert full-output parity (standalone generation resolves
# display names only through the full orchestrator pipeline -- tracked in the doc).

on:
  pull_request:
    # Meridian D-572: Entwurfs-PRs laufen nicht; `ready_for_review` startet den vollen Lauf.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "tooling/generator/**"
      - "core/kpi_catalog/**"
      - "core/usecases/**"
      - ".github/workflows/linux-generation.yml"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-generate:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Generate measures on Linux (pwsh)
    runs-on: ubuntu-latest
    # Cap a hung run (default 360 min); the smoke itself takes a few minutes.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # Packages are listed inline below, so the cache key hashes this workflow file.
          cache: "pip"
          cache-dependency-path: .github/workflows/linux-generation.yml

      - name: Install Python dependencies
        run: python -m pip install pyyaml jsonschema typer rich

      - name: Confirm pwsh is available
        shell: pwsh
        run: $PSVersionTable.PSVersion.ToString()

      - name: Build ontology registry (SSOT — master_registry.json, value_map.json)
        run: python tooling/ontology/registry_builder.py

      - name: Build IR from the KPI catalog (DAX synthesised, display names derived)
        run: |
          python tooling/ir/build_ir.py --kpi-catalog core/kpi_catalog \
            --out ir_v1.json

      - name: Generate Commercial measures on Linux (pwsh, IR pipeline, scratch)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path scratch_gen | Out-Null
          ./tooling/generator/generate_tmdl_measures.ps1 -IRPath ir_v1.json -UseCase COM-001,COM-002,COM-003,COM-004 -TargetTablesDir scratch_gen -OverwriteExisting

      - name: Assert display-named measures with real DAX (no BLANK)
        run: |
          test -s scratch_gen/_Measures.tmdl
          grep -q "measure 'Gross Margin %' = DIVIDE" scratch_gen/_Measures.tmdl
          grep -q "measure 'Net Sales Amount' = SUM" scratch_gen/_Measures.tmdl
          if grep -q "= BLANK()" scratch_gen/_Measures.tmdl; then echo "BLANK measures in Commercial output"; exit 1; fi
          echo "Linux IR generation: display-named Commercial measures with real DAX, no BLANK."

      - name: Assert committed dist was not modified
        run: git diff --quiet -- products/fabric/powerbi/dist || (echo "generation must not touch committed dist" && exit 1)
