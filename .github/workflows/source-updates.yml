name: Source Update Discovery

# Runs twice weekly (Mon + Thu 06:00 UTC) and can be triggered manually.
# Checks for new versions of:
#   - Microsoft PBIR/PBIP schemas (via discover_schema_latest.py)
#   - Tabular Editor BPA rules (via tooling/quality/check_upstream_sources.py)
#   - Any other allowlisted upstream references
#
# On success: uploads discovery report as artefact.
# If drift detected: opens / updates a draft PR with schema_registry.py changes.

on:
  schedule:
    - cron: "0 6 * * 1,4"   # Mon and Thu at 06:00 UTC (tightened for fast-moving upstreams)
  workflow_dispatch:
    inputs:
      update_registry:
        description: "Update schema_registry.py and open a PR if drift is found"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover-schemas:
    name: Schema & Source Discovery
    runs-on: ubuntu-latest
    # Cap a hung run (default 360 min); network discovery only.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install PyYAML requests jsonschema packaging

      - name: Discover latest Microsoft PBIR schemas
        id: schema_discover
        run: |
          mkdir -p internal/reviews
          discover_rc=0
          python products/fabric/powerbi/tooling/discover_schema_latest.py \
            --fail-if-behind \
            --json-out > internal/reviews/schema_update_report.json || discover_rc=$?

          report_rc=0
          python products/fabric/powerbi/tooling/write_schema_report.py || report_rc=$?

          if [ "$discover_rc" -ne 0 ]; then
            echo "Schema discovery exited $discover_rc (schemas may be behind latest)."
            echo "discovery_failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "discovery_failed=false" >> "$GITHUB_OUTPUT"
          fi

          if [ "$report_rc" -ne 0 ]; then
            echo "Schema report generation failed with exit code $report_rc."
            exit "$report_rc"
          fi

          echo "report_written=true" >> "$GITHUB_OUTPUT"

          if [ "$discover_rc" -ne 0 ]; then
            exit "$discover_rc"
          fi

      - name: Check upstream BPA rules and external references
        id: upstream_check
        run: |
          python tooling/quality/check_upstream_sources.py \
            --output internal/reviews/upstream_sources_report.md \
            --summary

      - name: Check delivery reference-source review dates
        id: delivery_reference_review
        continue-on-error: true
        run: |
          python -m tooling.quality.check_delivery_reference_sources \
            --model core/reference_models/e2e_delivery_quality/model.yaml \
            --schema tooling/generator/schemas/delivery_quality_model.schema.json \
            --output internal/reviews/delivery_reference_review.json

      - name: Upload discovery reports
        uses: actions/upload-artifact@v4
        with:
          name: source-update-reports-${{ github.run_number }}
          path: |
            internal/reviews/schema_update_report.md
            internal/reviews/upstream_sources_report.md
            internal/reviews/delivery_reference_review.json
          retention-days: 30

      - name: Enforce current delivery reference sources
        if: steps.delivery_reference_review.outcome == 'failure'
        run: |
          cat internal/reviews/delivery_reference_review.json
          exit 1

      - name: Open PR if registry drift detected and update requested
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.update_registry == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python products/fabric/powerbi/tooling/discover_schema_latest.py \
            --update-comments --update-manifest
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="chore/schema-registry-update-${{ github.run_id }}"
          git checkout -B "$BRANCH"
          git add products/fabric/powerbi/tooling/schema_registry.py \
                  internal/reviews/schema_update_report.md \
                  tooling/schemas/ || true
          if git diff --cached --quiet; then
            echo "No registry changes to commit."
          else
            git commit -m "chore: update schema_registry.py to latest Microsoft PBIR schemas"
            git push -u origin "$BRANCH"
            gh pr create \
              --head "$BRANCH" \
              --title "chore: schema registry update $(date +%Y-%m-%d)" \
              --body "$(cat internal/reviews/schema_update_report.md)" \
              --label "automated,schema-update" \
              --draft
          fi
