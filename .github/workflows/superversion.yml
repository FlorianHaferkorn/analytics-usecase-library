# Superversion CI: gate for the ALUCA × Meridian source-adapter layer.
#
# Runs the superversion adapter test suite (tooling/superversion/) plus the
# _INDEX drift-gate. Kept as its own workflow (not folded into Stage 1) so the
# layer has an isolated, fast signal and a clean rollback (delete this file).
#
# ⚠️ CI-Quota note (see CLAUDE.md / AGENTS.md): GitHub Actions is quota-blocked
# repo-wide until 2026-07-01 — every run fails at the runner level (~seconds, no
# runner, HTTP 404 logs) regardless of code, on main and all branches. Treat
# those red runs as infrastructure, not code defects; do NOT re-run or "fix"
# them. The authoritative gate until the window reopens is LOCAL:
#   python -m pytest tooling/superversion/ tooling/tests/test_dist_validator_ratchet.py -q -rs
#   python scripts/check_index.py --strict
# (mit powerbi-report-author 0.5.0 auf PATH und ALUCA_PBIR_CLI_PFLICHT=1, wie unten)
# (both must be green before commit). This workflow becomes meaningful again
# once the quota window reopens.

name: Superversion

on:
  pull_request:
    # Meridian D-572: Entwurfs-PRs laufen nicht; `ready_for_review` startet den vollen Lauf.
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - "tooling/superversion/**"
      - "core/usecases/**"
      - "core/kpi_catalog/**"
      - "scripts/check_index.py"
      - "conftest.py"
      - "products/fabric/powerbi/dist/**"
      - "tooling/tests/test_dist_validator_ratchet.py"
      - "tooling/tests/test_base_theme_drift.py"
      - "tooling/report_quality/base_theme.py"
      - "tooling/schemas/pbir/base_themes/**"
      - ".github/workflows/superversion.yml"
  push:
    branches: [main]
    paths:
      - "tooling/superversion/**"
      - "core/usecases/**"
      - "core/kpi_catalog/**"
      - "scripts/check_index.py"
      - "conftest.py"
      - "products/fabric/powerbi/dist/**"
      - "tooling/tests/test_dist_validator_ratchet.py"
      - "tooling/tests/test_base_theme_drift.py"
      - "tooling/report_quality/base_theme.py"
      - "tooling/schemas/pbir/base_themes/**"
      - ".github/workflows/superversion.yml"
  # manual trigger for on-demand branch testing (no merge / ready needed)
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  superversion:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: superversion (adapter tests + drift-gate)
    runs-on: ubuntu-latest
    # Cap a hung run (default 360 min).
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # Packages are listed inline below, so the cache key hashes this workflow file.
          cache: "pip"
          cache-dependency-path: .github/workflows/superversion.yml

      - name: Index drift-gate (_INDEX.md completeness)
        run: python scripts/check_index.py --strict

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # jsonschema: `tooling/superversion/project_package/validator.py` importiert es
          # ungeschuetzt, und `project_package/__init__.py` zieht den Validator beim Import
          # nach. Ohne das Paket bricht schon das Einsammeln ab (`2 errors during collection`,
          # gemessen 04.09.2026 in Lauf 33930671538) — der Job konnte seit `aa8e5cd4` nie
          # gruen werden. Dieselbe Klasse wie pyarrow/pandas in stage1.yml: wo die CI weniger
          # installiert, prueft sie etwas anderes.
          pip install pyyaml jsonschema pytest python-docx

      - name: Set up Node (for the official PBIR validator CLI)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install official PBIR validator (powerbi-report-author)
        # GEPINNT, und zwar auf denselben Stand wie der Repo-Pin in Meridian
        # (`scripts/check_pbir.py` PINNED_VERSION, `research/upstream_pins.yaml`).
        # Ungepinnt war das hier die Ursache eines echten CI-Ausfalls: am 01.08.2026 lieferte
        # npm 0.1.4 statt 0.1.1, die neuere Fassung prueft `.platform`, und der Lauf wurde rot
        # auf einem Commit, der daran nichts geaendert hatte. Ein Pin, der nur an einer Stelle
        # gilt, ist kein Pin.
        run: npm install -g @microsoft/powerbi-report-authoring-cli@0.5.0

      - name: Show validator version (must equal the pin)
        run: |
          v="$(powerbi-report-author --version)"
          echo "powerbi-report-author $v"
          test "$v" = "0.5.0"

      # Laeuft NACH der CLI-Installation (bis 29.09.2026 lief er davor: der offizielle
      # Validator-Test und die dist-Ratsche wurden hier still uebersprungen, der Lauf war
      # trotzdem gruen). ALUCA_PBIR_CLI_PFLICHT=1 macht eine fehlende CLI rot statt Skip
      # und verlangt, dass mindestens ein `braucht_pbir_cli`-Test wirklich lief
      # (Wurzel-`conftest.py`). "Nichts gefunden" ist nicht "nicht gelaufen".
      - name: Run superversion adapter tests + official-validator tests
        env:
          ALUCA_PBIR_CLI_PFLICHT: "1"
        run: python -m pytest tooling/superversion/ tooling/tests/test_dist_validator_ratchet.py tooling/tests/test_base_theme_drift.py -q -rs

      - name: Pin-drift sensor (advisory — reports, never bumps)
        run: python scripts/check_superversion_pins.py

      - name: Golden-Thread gate (measures must have a strategic anchor)
        run: python -m tooling.superversion.golden_thread

      - name: E2E smoke (Bracket → TMDL+PBIR → validate, COM-001)
        run: python -m tooling.superversion.e2e_smoke --require-cli

      # Value-Gate (I-4.2): advisory here (no live engine in CI to compute KPI
      # values → exit 0). The blocking "wrong value → red" behaviour is covered
      # by tests/test_value_gate.py in the suite above.
      - name: Value-Gate (KPI value vs reference, advisory without engine)
        run: python -m tooling.superversion.eval.value_gate COM-001

      # COMP-DSGVO gate (I-4.4): PII without row-level security → FAIL. Gated
      # universal UCs are all personal_data: false, so this is green here; the
      # blocking "PII-UC without RLS → red" behaviour is covered by
      # tests/test_comp_gate.py (XD-002).
      - name: COMP-DSGVO gate (PII without RLS → FAIL)
        run: python -m tooling.superversion.eval.comp_gate

