# When a branch matching agent/* is pushed, set the linked issue's project Status to "In progress".
# Issue number is taken from the branch name (e.g. agent/42-short-name -> 42).
# See: internal/project_mgmt/PM_FLOW.md, tooling/project_mgmt/set_issue_status.ps1

name: Set project status on agent branch

on:
  push:
    branches:
      - "agent/*"

jobs:
  set-in-progress:
    name: Set issue In progress
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get issue number from branch
        id: issue
        run: |
          REF="${{ github.ref_name }}"
          if [[ "$REF" =~ ^agent/([0-9]+) ]]; then
            echo "issue=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set project Status to In progress
        if: steps.issue.outputs.issue != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PROJECT_NUMBER: ${{ github.event.inputs.project_number || '2' }}
        run: pwsh -File tooling/project_mgmt/set_issue_status.ps1 -Issue ${{ steps.issue.outputs.issue }} -Status "In progress"
