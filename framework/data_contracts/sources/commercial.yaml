source_system: ERP / CRM / Promo Mgmt
domain: commercial_sales
version: v1.2

tables:
  - name: sales_transactions
    target: fact_sales
    grain: invoice_line
    columns:
      - {name: invoice_date, maps_to: DateKey}
      - {name: org_code, maps_to: OrgKey}
      - {name: product_code, maps_to: ProductKey}
      - {name: customer_code, maps_to: CustomerKey}
      - {name: promo_code, maps_to: PromoKey, nullable: true}
      - {name: net_sales_amount, maps_to: Net Sales Amount}
      - {name: quantity, maps_to: Quantity}
      - {name: list_price_amount, maps_to: List Price Amount}
      - {name: net_price_amount, maps_to: Net Price Amount}
      - {name: discount_amount, maps_to: Discount Amount}
      - {name: plan_sales_amount, maps_to: Plan Sales Amount, nullable: true}
      - {name: ly_sales_amount, maps_to: Last Year Sales Amount, nullable: true}
      - {name: cogs_amount, maps_to: Cost of Goods Sold Amount}

  - name: promotions
    target: dim_promo
    grain: promotion
    columns:
      - {name: promo_code, maps_to: PromoKey}
      - {name: promo_name, maps_to: Promotion}
      - {name: promo_type, maps_to: PromoType}
      - {name: mechanic, maps_to: Mechanic}
      - {name: start_date, maps_to: StartDateKey}
      - {name: end_date, maps_to: EndDateKey}

  - name: promo_finance
    target: fact_promo
    grain: promotion
    columns:
      - {name: promo_code, maps_to: PromoKey}
      - {name: promo_cost, maps_to: Promo Cost}
      - {name: vendor_funding_amount, maps_to: Funding Amount}
      - {name: baseline_sales_amount, maps_to: Baseline Sales Amount}
      - {name: baseline_quantity, maps_to: Baseline Quantity}
