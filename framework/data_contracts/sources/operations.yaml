source_system: MES / CMMS / QMS
domain: operations
version: v1.2

tables:
  - name: production_events
    target: fact_ops
    grain: line_day
    columns:
      - {name: date, maps_to: DateKey}
      - {name: org_code, maps_to: OrgKey}
      - {name: asset_code, maps_to: AssetKey, nullable: true}
      - {name: planned_time_min, maps_to: Planned Time Minutes}
      - {name: run_time_min, maps_to: Run Time Minutes}
      - {name: downtime_min, maps_to: Downtime Minutes}
      - {name: output_units, maps_to: Output Units}
      - {name: good_units, maps_to: Good Units}
      - {name: scrap_units, maps_to: Scrap Units}
      - {name: std_rate_units_per_min, maps_to: Standard Rate Units Per Minute}

  - name: failure_events
    target: fact_ops_failures
    grain: failure_event
    columns:
      - {name: asset_code, maps_to: AssetKey}
      - {name: start_datetime, maps_to: Failure Start DateTime}
      - {name: end_datetime, maps_to: Failure End DateTime}
      - {name: repair_hours, maps_to: Repair Duration Hours}
      - {name: downtime_min, maps_to: Downtime Minutes}
      - {name: cause_code, maps_to: Cause Code}

  - name: maintenance_orders
    target: fact_maintenance
    grain: maintenance_order
    columns:
      - {name: asset_code, maps_to: AssetKey}
      - {name: date, maps_to: DateKey}
      - {name: order_type, maps_to: Order Type}
      - {name: order_status, maps_to: Order Status}
      - {name: on_time_flag, maps_to: On Time Flag}
      - {name: parts_stockout_flag, maps_to: Parts Stockout Flag}

  - name: quality_results
    target: fact_quality
    grain: line_day
    columns:
      - {name: date, maps_to: DateKey}
      - {name: org_code, maps_to: OrgKey}
      - {name: product_code, maps_to: ProductKey}
      - {name: total_units, maps_to: Total Units}
      - {name: good_units, maps_to: Good Units}
      - {name: scrap_units, maps_to: Scrap Units}
      - {name: rework_units, maps_to: Rework Units}
      - {name: defect_count, maps_to: Defect Count}

  - name: quality_costs
    target: fact_quality_costs
    grain: month_product
    columns:
      - {name: date, maps_to: DateKey}
      - {name: org_code, maps_to: OrgKey}
      - {name: product_code, maps_to: ProductKey}
      - {name: copq_amount, maps_to: COPQ Amount}

  - name: complaints
    target: fact_complaints
    grain: complaint
    columns:
      - {name: date, maps_to: DateKey}
      - {name: product_code, maps_to: ProductKey}
      - {name: complaint_count, maps_to: Complaint Count}
      - {name: severity, maps_to: Severity}
      - {name: org_code, maps_to: OrgKey}

  - name: shipments
    target: fact_shipments
    grain: shipment_line
    columns:
      - {name: date, maps_to: DateKey}
      - {name: product_code, maps_to: ProductKey}
      - {name: org_code, maps_to: OrgKey}
      - {name: shipped_units, maps_to: Shipped Units}
