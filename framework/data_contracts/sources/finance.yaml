source_system: ERP (FI/CO) / Treasury
domain: finance
version: v1.2

tables:
  - name: cash_daily
    target: fact_cash
    grain: day
    columns:
      - {name: date, maps_to: DateKey}
      - {name: entity_code, maps_to: OrgKey}
      - {name: cash_balance_amount, maps_to: Cash Balance Amount}
      - {name: plan_cash_amount, maps_to: Plan Cash Amount}

  - name: cashflow_monthly
    target: fact_cashflow
    grain: month
    columns:
      - {name: date, maps_to: DateKey}
      - {name: entity_code, maps_to: OrgKey}
      - {name: ocf_amount, maps_to: Operating Cash Flow Amount}
      - {name: plan_ocf_amount, maps_to: Plan OCF Amount}

  - name: accounts_receivable
    target: fact_ar
    grain: month
    columns:
      - {name: date, maps_to: DateKey}
      - {name: entity_code, maps_to: OrgKey}
      - {name: customer_code, maps_to: CustomerKey}
      - {name: ar_amount, maps_to: AR Amount}
      - {name: revenue_amount, maps_to: Revenue Amount}

  - name: accounts_payable
    target: fact_ap
    grain: month
    columns:
      - {name: date, maps_to: DateKey}
      - {name: entity_code, maps_to: OrgKey}
      - {name: supplier_code, maps_to: SupplierKey}
      - {name: ap_amount, maps_to: AP Amount}
      - {name: cogs_amount, maps_to: COGS Amount}

  - name: inventory_monthly
    target: fact_inventory
    grain: month
    columns:
      - {name: date, maps_to: DateKey}
      - {name: entity_code, maps_to: OrgKey}
      - {name: product_code, maps_to: ProductKey}
      - {name: inventory_amount, maps_to: Inventory Amount}
      - {name: cogs_amount, maps_to: COGS Amount}

  - name: finance_pl
    target: fact_finance
    grain: entity_month
    columns:
      - {name: date, maps_to: DateKey}
      - {name: entity_code, maps_to: OrgKey}
      - {name: net_sales_amount, maps_to: Net Sales Amount}
      - {name: cogs_amount, maps_to: COGS Amount}
      - {name: ebitda_amount, maps_to: EBITDA Amount}
      - {name: material_cost_amount, maps_to: Material Cost Amount}
      - {name: opex_amount, maps_to: OpEx Amount}
      - {name: plan_opex_amount, maps_to: Plan OpEx Amount}

  - name: cost_detail
    target: fact_cost
    grain: plant_line_product_month
    columns:
      - {name: date, maps_to: DateKey}
      - {name: entity_code, maps_to: OrgKey}
      - {name: product_code, maps_to: ProductKey}
      - {name: cogs_amount, maps_to: COGS Amount}
      - {name: material_cost_amount, maps_to: Material Cost Amount}
      - {name: overhead_amount, maps_to: Overhead Amount}

  - name: output_volume
    target: fact_output
    grain: plant_line_product_month
    columns:
      - {name: date, maps_to: DateKey}
      - {name: entity_code, maps_to: OrgKey}
      - {name: product_code, maps_to: ProductKey}
      - {name: output_units, maps_to: Output Units}

  - name: labor_hours
    target: fact_labor
    grain: plant_line_month
    columns:
      - {name: date, maps_to: DateKey}
      - {name: entity_code, maps_to: OrgKey}
      - {name: labor_hours, maps_to: Labor Hours}
