schema_version: "1.1"

id: "C-C3.1"
name: "Retention Playbook Activation"
owner_domain: "Commercial / Customer Success"
impact_dimension: "Growth"

status: "active"
lifecycle:
  introduced_date: "2025-12-18"
  deprecated_date: null
  replaced_by: null
  change_notes: []

category:
  group: "Customer Retention"
  theme: "Prevent Churn and Protect Customer Value"

tags: ["retention", "churn", "customer-value"]

strategic_alignment:
  strategic_kpis:
    - id: "customer.loyalty.retention.pct"
      role: "primary"
    - id: "customer.loyalty.revenue_at_risk.amount"
      role: "secondary"
  decisions_enabled:
    - "Trigger targeted retention outreach"
    - "Escalate high-risk accounts to Customer Success"
  non_goals:
    - "Customer acquisition campaigns"
    - "Broad discounting without margin guardrails"
    - "Generic customer satisfaction initiatives"

use_case_links:
  core_use_cases:
    - "COM-003"
  related_use_cases:
    - "COM-002"

kpis:
  trigger_kpis:
    - kpi_id: "customer.loyalty.retention.pct"
      label: "Customer Retention %"
      semantic_ref:
        model_domain: "CustomerValue"
        measure: "Customer Retention %"
    - kpi_id: "customer.loyalty.churned.count"
      label: "Churned Customers Count"
      semantic_ref:
        model_domain: "CustomerValue"
        measure: "Churned Customers Count"
  guardrail_kpis:
    - kpi_id: "margin.gm.pct"
      label: "Gross Margin %"
      semantic_ref:
        model_domain: "Commercial"
        measure: "Gross Margin %"
  outcome_kpis:
    - kpi_id: "customer.loyalty.retention.pct"
      label: "Customer Retention %"
      semantic_ref:
        model_domain: "CustomerValue"
        measure: "Customer Retention %"
    - kpi_id: "customer.loyalty.churned.count"
      label: "Churned Customers Count"
      semantic_ref:
        model_domain: "CustomerValue"
        measure: "Churned Customers Count"

scope:
  default_grain: "month"
  default_perspective: ["Customer Segment", "Channel"]
  supported_slices:
    - "Region"
  exclusions:
    - "New customers (<3 months tenure)"
    - "Strategic accounts with dedicated save programs"
    - "Dormant customers already churned"

trigger:
  type: "Deviation"
  evaluation:
    grain: "month"
    window:
      kind: "rolling"
      length: 2
      unit: "periods"
    persistence:
      required: true
      min_consecutive_periods: 2
    minimum_data:
      min_observations: 1
      volume_guardrail:
        enabled: true
        metric_kpi_id: "customer.loyalty.active_customers.count"
        comparator: "gte"
        value: 100
        unit: "count"
  levels:
    L1:
      severity: "EarlyWarning"
      condition:
        metric_kpi_id: "customer.loyalty.retention.pct"
        comparator: "lt"
        threshold:
          basis: "target"
          value: "segment_retention_target"
          unit: "%"
        filters: []
    L2:
      severity: "RequiredIntervention"
      condition:
        metric_kpi_id: "customer.loyalty.churned.count"
        comparator: "gt"
        threshold:
          basis: "relative"
          value: 0.10
          unit: "%"
        filters: []
    L3:
      severity: "PrescriptiveExecution"
      condition:
        metric_kpi_id: "customer.loyalty.revenue_at_risk.amount"
        comparator: "gt"
        threshold:
          basis: "absolute"
          value: 500000
          unit: "EUR"
        filters: []
  gating_rules:
    - "Trigger only if Gross Margin % remains within COM-002 guardrails"
    - "Do not trigger for customers with unresolved service incidents (handled by C-C3.4)"
    - "Exclude segments under active contractual renegotiation"

impact:
  category: "High"
  expected_range:
    metric_kpi_id: "customer.loyalty.retention.pct"
    value_low: 1.0
    value_high: 3.0
    unit: "pp"
    time_to_effect:
      min_periods: 1
      max_periods: 3
  mechanism:
    - "Proactive outreach to at-risk customers"
    - "Timely resolution of churn drivers"
  confidence:
    level: "High"
    rationale:
      - "Direct linkage between outreach and churn reduction"
      - "Short feedback loop in monthly cohorts"

operational_execution:
  primary_owner_role: "Customer Success Manager"
  stakeholders:
    - "Sales Account Leads"
    - "Marketing Operations"
  prerequisites:
    - "Defined retention playbooks by segment"
    - "Clear ownership for at-risk customer outreach"
  steps:
    - "Identify segments breaching retention thresholds"
    - "Rank customers by revenue at risk"
    - "Initiate targeted outreach and save actions"
    - "Track save outcomes and reasons"
  effort:
    level: "Medium"
    typical_duration_days: 60
  risks_and_tradeoffs:
    - "Over-contacting low-value customers"
    - "Inconsistent execution across regions"

data_requirements:
  required_entities:
    - "Customer"
    - "Customer Segment"
    - "Channel"
  semantic_dependencies:
    measures:
      - "Customer Retention %"
      - "Churned Customers Count"
      - "Revenue at Risk Amount"
      - "Active Customers Count"
    tables:
      - "fact_customer_events"
      - "fact_customer_value"
      - "dim_customer"

automation:
  detection:
    enabled: true
    evaluation_frequency: "monthly"
    output: "Segment- and customer-level retention risk alerts"
  suggested_actions:
    enabled: true
    outputs:
      - "Prioritized customer save list"
  copilot_prompts: []

tracking:
  execution_log:
    enabled: true
    recommended_storage: "fact_action_execution"
    minimum_fields:
      - "ActionCode"
      - "TriggerLevel"
      - "CustomerKey"
      - "Segment"
      - "ExecutedDate"
  outcome_evaluation:
    enabled: true
    recommended_storage: "fact_action_outcome"
    minimum_fields:
      - "ActionCode"
      - "Pre_Retention_Pct"
      - "Post_Retention_Pct_60d"
      - "Churn_Pre"
      - "Churn_Post"

governance:
  approvals_required:
    - "Head of Sales Operations"
    - "Commercial Controlling Lead"
  rollback_plan:
    - "Suspend outreach if margin erosion exceeds tolerance"
  documentation_links:
    - "usecases/core/COM-003/Business_Factsheet.md"

quality_rules:
  - "All kpi_id values must exist in KPI catalog."
  - "Trigger severity must be strictly increasing from L1 to L3."
  - "impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis."
  - "If status=deprecated then lifecycle.replaced_by is required."
  - "No free-text trigger notes: use gating_rules and structured filters."
