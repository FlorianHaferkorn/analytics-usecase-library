schema_version: "1.1"

id: "C-S1.4"
name: "Sales Focus Reallocation by Region and Channel"
owner_domain: "Commercial"
impact_dimension: "Growth"

status: "active"
lifecycle:
  introduced_date: "2025-12-18"
  deprecated_date: null
  replaced_by: null
  change_notes: []

category:
  group: "Sales Steering & Resource Allocation"
  theme: "Reallocate Commercial Focus to Growth Areas"

tags: ["sales-focus", "region-channel", "resource-allocation"]

strategic_alignment:
  strategic_kpis:
    - id: "sales.net_sales.delta_pct.ly"
      role: "primary"
    - id: "sales.net_sales.amount"
      role: "secondary"
  decisions_enabled:
    - "Reallocate sales capacity across regions and channels"
    - "Adjust sales targets and focus segments"
  non_goals:
    - "Organizational restructuring"
    - "Headcount reduction or increase"
    - "Pricing or promotion mechanics"

use_case_links:
  core_use_cases:
    - "COM-001"
  related_use_cases: []

kpis:
  trigger_kpis:
    - kpi_id: "sales.net_sales.delta_pct.ly"
      label: "Net Sales % vs LY"
      semantic_ref:
        model_domain: "Commercial"
        measure: "Net Sales % vs LY"
  guardrail_kpis:
    - kpi_id: "margin.gm.pct"
      label: "Gross Margin %"
      semantic_ref:
        model_domain: "Commercial"
        measure: "Gross Margin %"
  outcome_kpis:
    - kpi_id: "sales.net_sales.amount"
      label: "Net Sales Amount"
      semantic_ref:
        model_domain: "Commercial"
        measure: "Net Sales Amount"

scope:
  default_grain: "month"
  default_perspective: ["Region", "Channel"]
  supported_slices:
    - "Customer Segment"
    - "Product Category"
  exclusions:
    - "Regions with regulatory or contractual sales constraints"
    - "Strategic customer accounts with fixed coverage model"

trigger:
  type: "Pattern"
  evaluation:
    grain: "month"
    window:
      kind: "rolling"
      length: 3
      unit: "periods"
    persistence:
      required: true
      min_consecutive_periods: 3
    minimum_data:
      min_observations: 2
      volume_guardrail:
        enabled: true
        metric_kpi_id: "sales.net_sales.amount"
        comparator: "gte"
        value: 250000
        unit: "amount"
  levels:
    L1:
      severity: "EarlyWarning"
      condition:
        metric_kpi_id: "sales.net_sales.delta_pct.ly"
        comparator: "lt"
        threshold:
          basis: "absolute"
          value: 0
          unit: "%"
        filters: []
    L2:
      severity: "RequiredIntervention"
      condition:
        metric_kpi_id: "sales.net_sales.delta_pct.ly"
        comparator: "lt"
        threshold:
          basis: "absolute"
          value: -0.05
          unit: "%"
        filters: []
    L3:
      severity: "PrescriptiveExecution"
      condition:
        metric_kpi_id: "sales.net_sales.delta_pct.ly"
        comparator: "lt"
        threshold:
          basis: "absolute"
          value: -0.10
          unit: "%"
        filters: []
  gating_rules:
    - "Trigger only if Gross Margin % >= target"
    - "Do not trigger if decline is driven by temporary supply constraints"
    - "Exclude regions under active turnaround programs"

impact:
  category: "Medium"
  expected_range:
    metric_kpi_id: "sales.net_sales.amount"
    value_low: 2.0
    value_high: 5.0
    unit: "%"
    time_to_effect:
      min_periods: 2
      max_periods: 4
  mechanism:
    - "Shift sales effort to higher-growth regions and channels"
    - "Reduce exposure to structurally declining areas"
  confidence:
    level: "Medium"
    rationale:
      - "Reallocation effects observed with short lag"
      - "Does not rely on pricing or cost levers"

operational_execution:
  primary_owner_role: "Sales Leadership Team"
  stakeholders:
    - "Regional Sales Directors"
    - "Sales Operations"
  prerequisites:
    - "Transparent regional performance benchmarks"
    - "Flexibility in sales capacity allocation"
  steps:
    - "Identify regions/channels with persistent YoY decline"
    - "Rank regions by growth and margin attractiveness"
    - "Reassign sales focus and targets"
    - "Review impact quarterly"
  effort:
    level: "Medium"
    typical_duration_days: 90
  risks_and_tradeoffs:
    - "Temporary coverage gaps in deprioritized regions"
    - "Change management friction within sales teams"

data_requirements:
  required_entities:
    - "Region"
    - "Channel"
    - "Customer Segment"
  semantic_dependencies:
    measures:
      - "Net Sales % vs LY"
      - "Net Sales Amount"
      - "Gross Margin %"
    tables:
      - "fact_sales"
      - "dim_org"

automation:
  detection:
    enabled: true
    evaluation_frequency: "monthly"
    output: "Region/Channel performance heatmap with reallocation candidates"
  suggested_actions:
    enabled: true
    outputs:
      - "Priority region/channel list"
  copilot_prompts: []

tracking:
  execution_log:
    enabled: true
    recommended_storage: "fact_action_execution"
    minimum_fields:
      - "ActionCode"
      - "TriggerLevel"
      - "Region"
      - "Channel"
      - "ExecutedDate"
  outcome_evaluation:
    enabled: true
    recommended_storage: "fact_action_outcome"
    minimum_fields:
      - "ActionCode"
      - "Pre_NetSales"
      - "Post_NetSales_90d"

governance:
  approvals_required:
    - "Chief Commercial Officer"
  rollback_plan:
    - "Rebalance focus if strategic accounts show service degradation"
  documentation_links:
    - "usecases/core/COM-001/Business_Factsheet.md"

quality_rules:
  - "All kpi_id values must exist in KPI catalog."
  - "Trigger severity must be strictly increasing from L1 to L3."
  - "impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis."
  - "If status=deprecated then lifecycle.replaced_by is required."
  - "No free-text trigger notes: use gating_rules and structured filters."
