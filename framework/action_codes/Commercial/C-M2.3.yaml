schema_version: "1.1"

id: "C-M2.3"
name: "Unit Cost Leakage Correction"
owner_domain: "Operations / Procurement"
impact_dimension: "Profitability"

status: "active"
lifecycle:
  introduced_date: "2025-12-18"
  deprecated_date: null
  replaced_by: null
  change_notes: []

category:
  group: "Cost Control"
  theme: "Stabilize and Reduce Unit Costs"

tags: ["cogs", "unit-cost", "procurement"]

strategic_alignment:
  strategic_kpis:
    - id: "cost.cogs_per_unit.amount"
      role: "primary"
    - id: "margin.gm.amount"
      role: "secondary"
  decisions_enabled:
    - "Initiate supplier renegotiation or sourcing actions"
    - "Correct production or logistics cost deviations"
  non_goals:
    - "Long-term footprint or make-or-buy strategy"
    - "Volume-driven scale optimization"
    - "Pricing or promotion interventions"

use_case_links:
  core_use_cases:
    - "COM-002"
  related_use_cases: []

kpis:
  trigger_kpis:
    - kpi_id: "cost.cogs_per_unit.amount"
      label: "COGS per Unit"
      semantic_ref:
        model_domain: "Commercial"
        measure: "COGS per Unit"
  guardrail_kpis:
    - kpi_id: "margin.gm.pct"
      label: "Gross Margin %"
      semantic_ref:
        model_domain: "Commercial"
        measure: "Gross Margin %"
  outcome_kpis:
    - kpi_id: "cost.cogs_per_unit.amount"
      label: "COGS per Unit"
      semantic_ref:
        model_domain: "Commercial"
        measure: "COGS per Unit"
    - kpi_id: "margin.gm.amount"
      label: "Gross Margin Amount"
      semantic_ref:
        model_domain: "Commercial"
        measure: "Gross Margin Amount"

scope:
  default_grain: "month"
  default_perspective: ["Product", "Supplier"]
  supported_slices:
    - "Region"
  exclusions:
    - "New product launches (<3 months)"
    - "One-off cost spikes already approved"
    - "Low-volume SKUs"

trigger:
  type: "Deviation"
  evaluation:
    grain: "month"
    window:
      kind: "rolling"
      length: 2
      unit: "periods"
    persistence:
      required: true
      min_consecutive_periods: 2
    minimum_data:
      min_observations: 1
      volume_guardrail:
        enabled: true
        metric_kpi_id: "margin.gm.amount"
        comparator: "gte"
        value: 60000
        unit: "amount"
  levels:
    L1:
      severity: "EarlyWarning"
      condition:
        metric_kpi_id: "cost.cogs_per_unit.amount"
        comparator: "gt"
        threshold:
          basis: "relative"
          value: 0.02
          unit: "%"
        filters: []
    L2:
      severity: "RequiredIntervention"
      condition:
        metric_kpi_id: "cost.cogs_per_unit.amount"
        comparator: "gt"
        threshold:
          basis: "relative"
          value: 0.05
          unit: "%"
        filters: []
    L3:
      severity: "PrescriptiveExecution"
      condition:
        metric_kpi_id: "cost.cogs_per_unit.amount"
        comparator: "gt"
        threshold:
          basis: "relative"
          value: 0.08
          unit: "%"
        filters: []
  gating_rules:
    - "Trigger only if price realization is within guardrails"
    - "Do not trigger if volume decline explains unit cost increase"
    - "Exclude periods with approved cost pass-through"

impact:
  category: "Medium"
  expected_range:
    metric_kpi_id: "cost.cogs_per_unit.amount"
    value_low: 1.0
    value_high: 4.0
    unit: "%"
    time_to_effect:
      min_periods: 2
      max_periods: 6
  mechanism:
    - "Supplier price correction"
    - "Logistics and production cost optimization"
  confidence:
    level: "Medium"
    rationale:
      - "Procurement actions have measurable lag"
      - "Effectiveness depends on contract cycles"

operational_execution:
  primary_owner_role: "Procurement Lead"
  stakeholders:
    - "Operations"
    - "Commercial Controlling"
  prerequisites:
    - "COGS breakdown by supplier or cost component"
    - "Valid Plan COGS baseline"
  steps:
    - "Identify SKUs with sustained unit cost increase"
    - "Trace cost increase to supplier or process"
    - "Initiate renegotiation or corrective actions"
    - "Review unit cost trend quarterly"
  effort:
    level: "Medium"
    typical_duration_days: 120
  risks_and_tradeoffs:
    - "Supplier relationship strain"
    - "Delayed impact due to contract terms"

data_requirements:
  required_entities:
    - "Product"
    - "Supplier"
  semantic_dependencies:
    measures:
      - "COGS per Unit"
      - "Gross Margin %"
      - "Gross Margin Amount"
    tables:
      - "fact_sales"
      - "dim_product"

automation:
  detection:
    enabled: true
    evaluation_frequency: "monthly"
    output: "SKUs with sustained unit cost increases vs plan"
  suggested_actions:
    enabled: true
    outputs:
      - "Supplier/SKU cost leakage list"
  copilot_prompts: []

tracking:
  execution_log:
    enabled: true
    recommended_storage: "fact_action_execution"
    minimum_fields:
      - "ActionCode"
      - "TriggerLevel"
      - "Product"
      - "ExecutedDate"
  outcome_evaluation:
    enabled: true
    recommended_storage: "fact_action_outcome"
    minimum_fields:
      - "ActionCode"
      - "Pre_COGS_per_Unit"
      - "Post_COGS_per_Unit_90d"

governance:
  approvals_required:
    - "Head of Procurement"
  rollback_plan:
    - "Suspend action if supply continuity risk increases"
  documentation_links:
    - "usecases/core/COM-002/Business_Factsheet.md"

quality_rules:
  - "All kpi_id values must exist in KPI catalog."
  - "Trigger severity must be strictly increasing from L1 to L3."
  - "impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis."
  - "If status=deprecated then lifecycle.replaced_by is required."
  - "No free-text trigger notes: use gating_rules and structured filters."
