schema_version: "1.0"

id: "DEC-SPINE-XD-RESOURCE"
name: "Resource Utilization Discipline"
owner_domains: ["Service"]
impact_dimension: "Workforce"

purpose:
  intent: >
    Balance utilization with SLA and staff sustainability.

decision_context:
  decision_type: "Prescriptive"
  primary_question: >
    Which capacity lever should be used to restore balance?
  decision_owner_roles:
    - "Domain Lead"
    - "Controlling Lead"

decision_tradeoffs:
  improves:
    - "Utilization"
    - "SLA"
    - "Overtime"
  risks:
    - "Burnout"
    - "Backlog growth"

when_not_to_act:
  conditions:
    - description: "Training periods"
      signal: "Defined in Action Codes"
    - description: "Approved surge coverage"
      signal: "Defined in Action Codes"

escalation_logic:
  principle: "Escalate as impact persists while guardrails are respected"
  escalation_path:
    - level: "EarlyWarning"
      action: "Visibility and monitoring"
    - level: "RequiredIntervention"
      action: "Controlled corrective action"
    - level: "PrescriptiveExecution"
      action: "Mandatory enforcement"

decision_confidence:
  level: "Medium"
  rationale:
    - "Depends on signal quality and execution follow-through"

governance:
  ownership:
    accountable_role: "Domain Lead"
    consulted_roles:
      - "Strategy"
      - "Analytics"
  change_policy:
    - "Spine changes require domain and governance sign-off"

quality_rules:
  - "No KPI IDs or thresholds are defined in the spine."
  - "Spine must remain domain-agnostic within its decision field."

