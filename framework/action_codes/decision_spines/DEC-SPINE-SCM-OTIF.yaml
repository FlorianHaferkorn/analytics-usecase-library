schema_version: "1.0"

id: "DEC-SPINE-SCM-OTIF"
name: "OTIF and Service Reliability Discipline"
owner_domains: ["SupplyChain"]
impact_dimension: "Service Reliability"

purpose:
  intent: >
    Improve OTIF while controlling penalty and expedite costs.

decision_context:
  decision_type: "Prescriptive"
  primary_question: >
    Which reliability lever should be activated without masking root causes?
  decision_owner_roles:
    - "Domain Lead"
    - "Controlling Lead"

decision_tradeoffs:
  improves:
    - "OTIF"
    - "Cost"
    - "Expedite spend"
  risks:
    - "Masking systemic issues"

when_not_to_act:
  conditions:
    - description: "Temporary disruptions"
      signal: "Defined in Action Codes"
    - description: "Customer-approved exceptions"
      signal: "Defined in Action Codes"

escalation_logic:
  principle: "Escalate as impact persists while guardrails are respected"
  escalation_path:
    - level: "EarlyWarning"
      action: "Visibility and monitoring"
    - level: "RequiredIntervention"
      action: "Controlled corrective action"
    - level: "PrescriptiveExecution"
      action: "Mandatory enforcement"

decision_confidence:
  level: "Medium"
  rationale:
    - "Depends on signal quality and execution follow-through"

governance:
  ownership:
    accountable_role: "Domain Lead"
    consulted_roles:
      - "Strategy"
      - "Analytics"
  change_policy:
    - "Spine changes require domain and governance sign-off"

quality_rules:
  - "No KPI IDs or thresholds are defined in the spine."
  - "Spine must remain domain-agnostic within its decision field."

