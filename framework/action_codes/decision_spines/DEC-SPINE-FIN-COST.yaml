schema_version: "1.0"

id: "DEC-SPINE-FIN-COST"
name: "Cost and Productivity Discipline"
owner_domains: ["Finance"]
impact_dimension: "Cost"

purpose:
  intent: >
    Reduce unit cost without degrading output quality or service.

decision_context:
  decision_type: "Prescriptive"
  primary_question: >
    Which cost levers are safe to activate now?
  decision_owner_roles:
    - "Domain Lead"
    - "Controlling Lead"

decision_tradeoffs:
  improves:
    - "Unit cost"
    - "Quality"
    - "Service level"
  risks:
    - "Quality loss"
    - "Understaffing"

when_not_to_act:
  conditions:
    - description: "Safety-critical operations"
      signal: "Defined in Action Codes"
    - description: "Contractual labor limits"
      signal: "Defined in Action Codes"

escalation_logic:
  principle: "Escalate as impact persists while guardrails are respected"
  escalation_path:
    - level: "EarlyWarning"
      action: "Visibility and monitoring"
    - level: "RequiredIntervention"
      action: "Controlled corrective action"
    - level: "PrescriptiveExecution"
      action: "Mandatory enforcement"

decision_confidence:
  level: "Medium"
  rationale:
    - "Depends on signal quality and execution follow-through"

governance:
  ownership:
    accountable_role: "Domain Lead"
    consulted_roles:
      - "Strategy"
      - "Analytics"
  change_policy:
    - "Spine changes require domain and governance sign-off"

quality_rules:
  - "No KPI IDs or thresholds are defined in the spine."
  - "Spine must remain domain-agnostic within its decision field."

