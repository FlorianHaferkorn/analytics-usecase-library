schema_version: "1.0"

id: "DEC-SPINE-SCM-FORECAST"
name: "Forecast Quality Discipline"
owner_domains: ["SupplyChain"]
impact_dimension: "Planning"

purpose:
  intent: >
    Improve forecast accuracy and stability without overcorrecting.

decision_context:
  decision_type: "Prescriptive"
  primary_question: >
    Which forecast quality lever should be applied first?
  decision_owner_roles:
    - "Domain Lead"
    - "Controlling Lead"

decision_tradeoffs:
  improves:
    - "Accuracy"
    - "Stability"
    - "Service impact"
  risks:
    - "Planning churn"

when_not_to_act:
  conditions:
    - description: "Promotions or launches"
      signal: "Defined in Action Codes"
    - description: "Insufficient history"
      signal: "Defined in Action Codes"

escalation_logic:
  principle: "Escalate as impact persists while guardrails are respected"
  escalation_path:
    - level: "EarlyWarning"
      action: "Visibility and monitoring"
    - level: "RequiredIntervention"
      action: "Controlled corrective action"
    - level: "PrescriptiveExecution"
      action: "Mandatory enforcement"

decision_confidence:
  level: "Medium"
  rationale:
    - "Depends on signal quality and execution follow-through"

governance:
  ownership:
    accountable_role: "Domain Lead"
    consulted_roles:
      - "Strategy"
      - "Analytics"
  change_policy:
    - "Spine changes require domain and governance sign-off"

quality_rules:
  - "No KPI IDs or thresholds are defined in the spine."
  - "Spine must remain domain-agnostic within its decision field."

