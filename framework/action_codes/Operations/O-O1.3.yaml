schema_version: "1.1"

id: "O-O1.3"
name: "Quality & Yield Recovery"
owner_domain: "Quality / Production"
impact_dimension: "Effectiveness"

status: "active"
lifecycle:
  introduced_date: "2025-12-18"
  deprecated_date: null
  replaced_by: null
  change_notes: []

category:
  group: "Quality Loss Control"
  theme: "Stabilise First-Pass Yield and Reduce Scrap"

tags: ["quality", "yield", "scrap", "oee"]

strategic_alignment:
  strategic_kpis:
    - id: "ops.quality.pct"
      role: "primary"
    - id: "ops.oee.pct"
      role: "secondary"
  decisions_enabled:
    - "Prioritise root-cause correction for quality losses"
    - "Stabilise process capability on critical lines"
  non_goals:
    - "Product redesign or specification changes"
    - "Supplier quality programs (OPS-003)"
    - "Long-term Six Sigma programs"

use_case_links:
  core_use_cases:
    - "OPS-001"
  related_use_cases:
    - "OPS-003"

kpis:
  trigger_kpis:
    - kpi_id: "ops.quality.pct"
      label: "Quality %"
      semantic_ref:
        model_domain: "Operations"
        measure: "Quality %"
  guardrail_kpis:
    - kpi_id: "ops.availability.pct"
      label: "Availability %"
      semantic_ref:
        model_domain: "Operations"
        measure: "Availability %"
  outcome_kpis:
    - kpi_id: "ops.quality.pct"
      label: "Quality %"
      semantic_ref:
        model_domain: "Operations"
        measure: "Quality %"
    - kpi_id: "ops.oee.pct"
      label: "Overall Equipment Effectiveness %"
      semantic_ref:
        model_domain: "Operations"
        measure: "OEE %"

scope:
  default_grain: "line_month"
  default_perspective: ["Plant", "Production Line"]
  supported_slices:
    - "Defect Category"
    - "Product Variant"
  exclusions:
    - "Lines under product change trials"
    - "Low-volume prototype runs"
    - "Quality losses driven by supplier defects"

trigger:
  type: "Deviation"
  evaluation:
    grain: "line_month"
    window:
      kind: "rolling"
      length: 2
      unit: "periods"
    persistence:
      required: true
      min_consecutive_periods: 2
    minimum_data:
      min_observations: 1
      volume_guardrail:
        enabled: true
        metric_kpi_id: "ops.planned.hours"
        comparator: "gte"
        value: 150
        unit: "hours"
  levels:
    L1:
      severity: "EarlyWarning"
      condition:
        metric_kpi_id: "ops.quality.pct"
        comparator: "lt"
        threshold:
          basis: "absolute"
          value: 98.0
          unit: "%"
        filters: []
    L2:
      severity: "RequiredIntervention"
      condition:
        metric_kpi_id: "ops.quality.pct"
        comparator: "lt"
        threshold:
          basis: "absolute"
          value: 96.0
          unit: "%"
        filters: []
    L3:
      severity: "PrescriptiveExecution"
      condition:
        metric_kpi_id: "ops.quality.pct"
        comparator: "lt"
        threshold:
          basis: "absolute"
          value: 94.0
          unit: "%"
        filters: []
  gating_rules:
    - "Trigger only if availability and performance are stable"
    - "Do not trigger if defects are supplier-driven"
    - "Exclude periods with approved engineering changes"

impact:
  category: "Medium"
  expected_range:
    metric_kpi_id: "ops.quality.pct"
    value_low: 1.0
    value_high: 3.0
    unit: "pp"
    time_to_effect:
      min_periods: 1
      max_periods: 3
  mechanism:
    - "Root-cause elimination of dominant defect drivers"
    - "Stabilisation of process parameters"
  confidence:
    level: "Medium"
    rationale:
      - "Defect causes often concentrated"
      - "Guarded by upstream availability and performance"

operational_execution:
  primary_owner_role: "Quality Manager"
  stakeholders:
    - "Production Supervisors"
    - "Process Engineering"
  prerequisites:
    - "Consistent defect categorisation"
    - "Clear escalation paths for quality issues"
  steps:
    - "Identify lines with sustained quality loss"
    - "Prioritise dominant defect categories"
    - "Execute corrective actions and process controls"
    - "Monitor yield recovery weekly"
  effort:
    level: "Medium"
    typical_duration_days: 60
  risks_and_tradeoffs:
    - "Over-correction impacting throughput"
    - "Hidden interaction with performance actions"

data_requirements:
  required_entities:
    - "Plant"
    - "Production Line"
  semantic_dependencies:
    measures:
      - "Quality %"
      - "OEE %"
      - "Availability %"
      - "Planned Runtime Hours"
    tables:
      - "fact_ops_quality"
      - "fact_ops_runtime"
      - "dim_production_line"
      - "dim_plant"

automation:
  detection:
    enabled: true
    evaluation_frequency: "monthly"
    output: "Lines with sustained quality loss"
  suggested_actions:
    enabled: true
    outputs:
      - "Defect root-cause and correction actions"
  copilot_prompts: []

tracking:
  execution_log:
    enabled: true
    recommended_storage: "fact_action_execution"
    minimum_fields:
      - "ActionCode"
      - "Plant"
      - "ProductionLine"
      - "TriggerLevel"
      - "ExecutedDate"
  outcome_evaluation:
    enabled: true
    recommended_storage: "fact_action_outcome"
    minimum_fields:
      - "ActionCode"
      - "Pre_Quality_Pct"
      - "Post_Quality_Pct_60d"

governance:
  approvals_required:
    - "Plant Manager"
    - "Head of Quality"
  rollback_plan:
    - "Suspend corrective actions if throughput drops below tolerance"
  documentation_links:
    - "usecases/core/OPS-001/Business_Factsheet.md"

quality_rules:
  - "All kpi_id values must exist in KPI catalog."
  - "Trigger severity must be strictly increasing from L1 to L3."
  - "impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis."
  - "If status=deprecated then lifecycle.replaced_by is required."
  - "No free-text trigger notes: use gating_rules and structured filters."
