schema_version: "1.1"

id: "O-Q3.3"
name: "Scrap & Rework Reduction"
owner_domain: "Quality / Production"
impact_dimension: "Efficiency"

status: "active"
lifecycle:
  introduced_date: "2025-12-18"
  deprecated_date: null
  replaced_by: null
  change_notes: []

category:
  group: "Yield Loss Control"
  theme: "Reduce Internal Scrap and Rework Loops"

tags: ["scrap", "rework", "yield"]

strategic_alignment:
  strategic_kpis:
    - id: "quality.scrap.pct"
      role: "primary"
    - id: "quality.rework.pct"
      role: "secondary"
  decisions_enabled:
    - "Prioritise dominant scrap and rework drivers"
    - "Break recurring rework loops at process level"
  non_goals:
    - "Supplier quality programs"
    - "Product redesign or specification changes"
    - "Generic cost reduction initiatives"

use_case_links:
  core_use_cases:
    - "OPS-003"
  related_use_cases:
    - "FIN-002"

kpis:
  trigger_kpis:
    - kpi_id: "quality.scrap.pct"
      label: "Scrap %"
      semantic_ref:
        model_domain: "Quality"
        measure: "Scrap %"
    - kpi_id: "quality.rework.pct"
      label: "Rework %"
      semantic_ref:
        model_domain: "Quality"
        measure: "Rework %"
  guardrail_kpis:
    - kpi_id: "quality.fpy.pct"
      label: "First Pass Yield %"
      semantic_ref:
        model_domain: "Quality"
        measure: "First Pass Yield %"
  outcome_kpis:
    - kpi_id: "quality.scrap.pct"
      label: "Scrap %"
      semantic_ref:
        model_domain: "Quality"
        measure: "Scrap %"
    - kpi_id: "quality.rework.pct"
      label: "Rework %"
      semantic_ref:
        model_domain: "Quality"
        measure: "Rework %"

scope:
  default_grain: "line_month"
  default_perspective: ["Plant", "Production Line"]
  supported_slices:
    - "Scrap Reason"
    - "Rework Loop"
  exclusions:
    - "Scrap driven by approved process experiments"
    - "Low-volume or prototype production"
    - "Scrap explained by supplier defects"

trigger:
  type: "Deviation"
  evaluation:
    grain: "line_month"
    window:
      kind: "rolling"
      length: 2
      unit: "periods"
    persistence:
      required: true
      min_consecutive_periods: 2
    minimum_data:
      min_observations: 1
      volume_guardrail:
        enabled: true
        metric_kpi_id: "ops.planned_output.units"
        comparator: "gte"
        value: 15000
        unit: "units"
  levels:
    L1:
      severity: "EarlyWarning"
      condition:
        metric_kpi_id: "quality.scrap.pct"
        comparator: "gt"
        threshold:
          basis: "absolute"
          value: 2.0
          unit: "%"
        filters: []
    L2:
      severity: "RequiredIntervention"
      condition:
        metric_kpi_id: "quality.scrap.pct"
        comparator: "gt"
        threshold:
          basis: "absolute"
          value: 4.0
          unit: "%"
        filters: []
    L3:
      severity: "PrescriptiveExecution"
      condition:
        metric_kpi_id: "quality.scrap.pct"
        comparator: "gt"
        threshold:
          basis: "absolute"
          value: 6.0
          unit: "%"
        filters: []
  gating_rules:
    - "Trigger only if FPY deterioration is confirmed"
    - "Do not trigger if scrap increase is short-term mix-driven"
    - "Exclude lines with active process defect elimination actions"

impact:
  category: "Medium"
  expected_range:
    metric_kpi_id: "quality.scrap.pct"
    value_low: -0.5
    value_high: -2.0
    unit: "pp"
    time_to_effect:
      min_periods: 1
      max_periods: 3
  mechanism:
    - "Elimination of recurring scrap causes"
    - "Reduction of rework loops consuming capacity"
  confidence:
    level: "Medium"
    rationale:
      - "Scrap often concentrated in few causes"
      - "Rework loops are structurally correctable"

operational_execution:
  primary_owner_role: "Production Manager"
  stakeholders:
    - "Quality Engineering"
    - "Line Supervisors"
  prerequisites:
    - "Clear scrap and rework classification"
    - "Visibility into rework loops"
  steps:
    - "Identify dominant scrap and rework drivers"
    - "Analyse rework loops and root causes"
    - "Implement process or control corrections"
    - "Review scrap and rework trends weekly"
  effort:
    level: "Medium"
    typical_duration_days: 60
  risks_and_tradeoffs:
    - "Over-tightening controls impacting throughput"
    - "Hidden quality shifts to other defect categories"

data_requirements:
  required_entities:
    - "Plant"
    - "Production Line"
  semantic_dependencies:
    measures:
      - "Scrap %"
      - "Rework %"
      - "First Pass Yield %"
      - "Planned Output Units"
    tables:
      - "fact_quality"
      - "fact_ops_output"
      - "dim_production_line"
      - "dim_plant"

automation:
  detection:
    enabled: true
    evaluation_frequency: "monthly"
    output: "Lines with sustained scrap and rework issues"
  suggested_actions:
    enabled: true
    outputs:
      - "Scrap cause and rework loop reduction actions"
  copilot_prompts: []

tracking:
  execution_log:
    enabled: true
    recommended_storage: "fact_action_execution"
    minimum_fields:
      - "ActionCode"
      - "Plant"
      - "ProductionLine"
      - "TriggerLevel"
      - "ExecutedDate"
  outcome_evaluation:
    enabled: true
    recommended_storage: "fact_action_outcome"
    minimum_fields:
      - "ActionCode"
      - "Pre_Scrap_Pct"
      - "Post_Scrap_Pct_60d"

governance:
  approvals_required:
    - "Plant Manager"
  rollback_plan:
    - "Relax controls if throughput or FPY deteriorates"
  documentation_links:
    - "usecases/core/OPS-003/Business_Factsheet.md"

quality_rules:
  - "All kpi_id values must exist in KPI catalog."
  - "Trigger severity must be strictly increasing from L1 to L3."
  - "impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis."
  - "If status=deprecated then lifecycle.replaced_by is required."
  - "No free-text trigger notes: use gating_rules and structured filters."
