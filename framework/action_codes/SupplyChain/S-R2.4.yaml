schema_version: "1.1"

id: "S-R2.4"
name: "Penalty & Expedite Cost Control"
owner_domain: "Logistics / Procurement"
impact_dimension: "Cost Efficiency"

status: "active"
lifecycle:
  introduced_date: "2025-12-18"
  deprecated_date: null
  replaced_by: null
  change_notes: []

category:
  group: "Service Cost Governance"
  theme: "Reduce Avoidable Penalties and Expedite Spend Without Masking OTIF Issues"

tags: ["penalties", "expedites", "service-cost", "otif"]

strategic_alignment:
  strategic_kpis:
    - id: "supply.penalty.amount"
      role: "primary"
    - id: "supply.expedite.amount"
      role: "secondary"
  decisions_enabled:
    - "Identify structurally avoidable service-failure costs"
    - "Differentiate justified expedites from systemic inefficiencies"
  non_goals:
    - "Generic logistics cost cutting programs"
    - "Carrier rate renegotiations"
    - "Inventory buffer inflation to avoid penalties"

use_case_links:
  core_use_cases:
    - "SCM-002"
  related_use_cases:
    - "FIN-002"

kpis:
  trigger_kpis:
    - kpi_id: "supply.penalty.amount"
      label: "Penalty Cost Amount"
      semantic_ref:
        model_domain: "SupplyChain"
        measure: "Penalty Amount"
    - kpi_id: "supply.expedite.amount"
      label: "Expedite Cost Amount"
      semantic_ref:
        model_domain: "SupplyChain"
        measure: "Expedite Cost Amount"
  guardrail_kpis:
    - kpi_id: "supply.otif.pct"
      label: "OTIF %"
      semantic_ref:
        model_domain: "SupplyChain"
        measure: "OTIF %"
  outcome_kpis:
    - kpi_id: "supply.penalty.amount"
      label: "Penalty Cost Amount"
      semantic_ref:
        model_domain: "SupplyChain"
        measure: "Penalty Amount"
    - kpi_id: "supply.expedite.amount"
      label: "Expedite Cost Amount"
      semantic_ref:
        model_domain: "SupplyChain"
        measure: "Expedite Cost Amount"

scope:
  default_grain: "lane_dc_month"
  default_perspective: ["Lane", "Distribution Center"]
  supported_slices:
    - "Customer Contract"
    - "Carrier"
  exclusions:
    - "Penalties driven by customer-side process failures"
    - "Approved premium service agreements"
    - "Force majeure-driven expedites"

trigger:
  type: "Deviation"
  evaluation:
    grain: "lane_dc_month"
    window:
      kind: "rolling"
      length: 2
      unit: "periods"
    persistence:
      required: true
      min_consecutive_periods: 2
    minimum_data:
      min_observations: 1
      volume_guardrail:
        enabled: true
        metric_kpi_id: "shipments.count"
        comparator: "gte"
        value: 200
        unit: "count"
  levels:
    L1:
      severity: "EarlyWarning"
      condition:
        metric_kpi_id: "supply.penalty.amount"
        comparator: "gt"
        threshold:
          basis: "relative"
          value: 0.10
          unit: "%"
        filters: []
    L2:
      severity: "RequiredIntervention"
      condition:
        metric_kpi_id: "supply.penalty.amount"
        comparator: "gt"
        threshold:
          basis: "relative"
          value: 0.25
          unit: "%"
        filters: []
    L3:
      severity: "PrescriptiveExecution"
      condition:
        metric_kpi_id: "supply.penalty.amount"
        comparator: "gt"
        threshold:
          basis: "relative"
          value: 0.40
          unit: "%"
        filters: []
  gating_rules:
    - "Trigger only if penalties/expedites are structurally recurring"
    - "Do not trigger if cost increase is explained by approved service upgrades"
    - "Exclude lanes with active transport stabilisation actions"

impact:
  category: "Medium"
  expected_range:
    metric_kpi_id: "supply.penalty.amount"
    value_low: -10.0
    value_high: -30.0
    unit: "%"
    time_to_effect:
      min_periods: 1
      max_periods: 3
  mechanism:
    - "Elimination of avoidable service failure penalties"
    - "Reduction of reactive expedite usage"
  confidence:
    level: "Medium"
    rationale:
      - "Cost drivers are often concentrated"
      - "Effectiveness depends on root-cause follow-through"

operational_execution:
  primary_owner_role: "Logistics Cost Manager"
  stakeholders:
    - "Supply Planning"
    - "Customer Operations"
    - "Finance"
  prerequisites:
    - "Penalty attribution by lane/customer"
    - "Clear expedite approval logic"
  steps:
    - "Identify lanes with recurring penalties or expedites"
    - "Classify costs as avoidable vs justified"
    - "Correct underlying execution or planning issues"
    - "Review cost trends monthly"
  effort:
    level: "Medium"
    typical_duration_days: 60
  risks_and_tradeoffs:
    - "Cost focus masking service degradation"
    - "Delayed service recovery if expedites are over-restricted"

data_requirements:
  required_entities:
    - "Lane"
    - "Distribution Center"
    - "Customer"
  semantic_dependencies:
    measures:
      - "Penalty Amount"
      - "Expedite Cost Amount"
      - "OTIF %"
      - "Shipments Count"
    tables:
      - "fact_logistics_cost"
      - "fact_shipments"
      - "dim_lane"
      - "dim_distribution_center"
      - "dim_customer"

automation:
  detection:
    enabled: true
    evaluation_frequency: "monthly"
    output: "Lane-DC combinations with structurally high service costs"
  suggested_actions:
    enabled: true
    outputs:
      - "Penalty and expedite containment actions"
  copilot_prompts: []

tracking:
  execution_log:
    enabled: true
    recommended_storage: "fact_action_execution"
    minimum_fields:
      - "ActionCode"
      - "Lane"
      - "DistributionCenter"
      - "TriggerLevel"
      - "ExecutedDate"
  outcome_evaluation:
    enabled: true
    recommended_storage: "fact_action_outcome"
    minimum_fields:
      - "ActionCode"
      - "Pre_Penalty_Amount"
      - "Post_Penalty_Amount_60d"

governance:
  approvals_required:
    - "Head of Logistics"
    - "Finance Business Partner"
  rollback_plan:
    - "Reinstate expedites if OTIF deteriorates beyond tolerance"
  documentation_links:
    - "framework/usecases/core/SCM-002_Supply_Reliability_OTIF/Business_Factsheet.md"

quality_rules:
  - "All kpi_id values must exist in KPI catalog."
  - "Trigger severity must be strictly increasing from L1 to L3."
  - "impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis."
  - "If status=deprecated then lifecycle.replaced_by is required."
  - "No free-text trigger notes: use gating_rules and structured filters."
