schema_version: "1.1"

id: "S-F3.1"
name: "Forecast Quality Orchestration"
owner_domain: "S&OP Leadership"
impact_dimension: "Planning Governance"

status: "active"
lifecycle:
  introduced_date: "2025-12-18"
  deprecated_date: null
  replaced_by: null
  change_notes: []

category:
  group: "Forecast Governance"
  theme: "Coordinate Forecast Quality Levers Without Conflicting Fixes"

tags: ["forecast", "orchestration", "governance"]

strategic_alignment:
  strategic_kpis:
    - id: "plan.forecast.accuracy.pct"
      role: "primary"
    - id: "plan.forecast.bias.pct"
      role: "secondary"
    - id: "plan.replan.count"
      role: "secondary"
  decisions_enabled:
    - "Select dominant forecast-quality lever per SKU/location (bias correction, containment, replan discipline)"
    - "Sequence corrective actions to avoid parallel, conflicting planning fixes"
  non_goals:
    - "Executing forecast corrections directly"
    - "Statistical model redesign or ML tuning"
    - "Inventory buffer or logistics changes"

use_case_links:
  core_use_cases:
    - "SCM-003"
  related_use_cases:
    - "SCM-001"
    - "SCM-002"

kpis:
  trigger_kpis:
    - kpi_id: "plan.forecast.accuracy.pct"
      label: "Forecast Accuracy %"
      semantic_ref:
        model_domain: "Planning"
        measure: "Forecast Accuracy %"
    - kpi_id: "plan.replan.count"
      label: "Re-Plan Count"
      semantic_ref:
        model_domain: "Planning"
        measure: "Re-Plan Count"
  guardrail_kpis:
    - kpi_id: "plan.forecast.service_impact.pct"
      label: "Forecast Service Impact %"
      semantic_ref:
        model_domain: "Planning"
        measure: "Forecast Service Impact %"
  outcome_kpis:
    - kpi_id: "plan.forecast.accuracy.pct"
      label: "Forecast Accuracy %"
      semantic_ref:
        model_domain: "Planning"
        measure: "Forecast Accuracy %"

scope:
  default_grain: "sku_location_month"
  default_perspective: ["SKU", "Location"]
  supported_slices:
    - "Demand Pattern"
    - "Planning Horizon"
  exclusions:
    - "New product introductions"
    - "Promotion-driven demand spikes (COM-004)"
    - "Markets under exceptional events"

trigger:
  type: "Deviation"
  evaluation:
    grain: "sku_location_month"
    window:
      kind: "rolling"
      length: 3
      unit: "periods"
    persistence:
      required: true
      min_consecutive_periods: 2
    minimum_data:
      min_observations: 3
      volume_guardrail:
        enabled: true
        metric_kpi_id: "sales.units"
        comparator: "gte"
        value: 3000
        unit: "units"
  levels:
    L1:
      severity: "EarlyWarning"
      condition:
        metric_kpi_id: "plan.forecast.accuracy.pct"
        comparator: "lt"
        threshold:
          basis: "absolute"
          value: 75.0
          unit: "%"
        filters: []
    L2:
      severity: "RequiredIntervention"
      condition:
        metric_kpi_id: "plan.forecast.accuracy.pct"
        comparator: "lt"
        threshold:
          basis: "absolute"
          value: 65.0
          unit: "%"
        filters: []
    L3:
      severity: "PrescriptiveExecution"
      condition:
        metric_kpi_id: "plan.forecast.accuracy.pct"
        comparator: "lt"
        threshold:
          basis: "absolute"
          value: 55.0
          unit: "%"
        filters: []
  gating_rules:
    - "Trigger only if forecast error is structurally recurring"
    - "Do not trigger if service containment actions already mitigate impact"
    - "Exclude SKUs with active execution Action Codes in progress"

impact:
  category: "Medium"
  expected_range:
    metric_kpi_id: "plan.forecast.accuracy.pct"
    value_low: 5.0
    value_high: 12.0
    unit: "pp"
    time_to_effect:
      min_periods: 2
      max_periods: 5
  mechanism:
    - "Focused activation of the dominant forecast-quality lever"
    - "Avoidance of parallel corrective actions"
  confidence:
    level: "Medium"
    rationale:
      - "Accuracy improvement depends on execution follow-through"
      - "Governance effects compound over cycles"

operational_execution:
  primary_owner_role: "S&OP Lead"
  stakeholders:
    - "Demand Planning"
    - "Supply Planning"
    - "Sales Operations"
  prerequisites:
    - "Consistent forecast accuracy and bias measurement"
    - "Clear ownership of execution Action Codes"
  steps:
    - "Detect sustained forecast accuracy deterioration"
    - "Diagnose dominant forecast error driver"
    - "Activate corresponding execution Action Code"
    - "Review forecast quality monthly"
  effort:
    level: "Low"
    typical_duration_days: 30
  risks_and_tradeoffs:
    - "Delayed correction if driver diagnosis is incorrect"
    - "Underreaction to multi-driver forecast issues"

data_requirements:
  required_entities:
    - "SKU"
    - "Location"
  semantic_dependencies:
    measures:
      - "Forecast Accuracy %"
      - "Forecast Bias %"
      - "Forecast Service Impact %"
      - "Re-Plan Count"
      - "Sales Units"
    tables:
      - "fact_forecast"
      - "fact_sales"
      - "dim_product"
      - "dim_location"

automation:
  detection:
    enabled: true
    evaluation_frequency: "monthly"
    output: "SKU-locations with sustained forecast quality deterioration"
  suggested_actions:
    enabled: true
    outputs:
      - "Recommended forecast-quality lever activation"
  copilot_prompts: []

tracking:
  execution_log:
    enabled: true
    recommended_storage: "fact_action_execution"
    minimum_fields:
      - "ActionCode"
      - "SKU"
      - "Location"
      - "TriggerLevel"
      - "ActivatedLever"
      - "ExecutedDate"
  outcome_evaluation:
    enabled: true
    recommended_storage: "fact_action_outcome"
    minimum_fields:
      - "ActionCode"
      - "Pre_Forecast_Accuracy_Pct"
      - "Post_Forecast_Accuracy_Pct_120d"

governance:
  approvals_required:
    - "VP Supply Chain"
  rollback_plan:
    - "Suspend orchestration if planning churn increases"
  documentation_links:
    - "usecases/core/SCM-003/Business_Factsheet.md"

quality_rules:
  - "All kpi_id values must exist in KPI catalog."
  - "Trigger severity must be strictly increasing from L1 to L3."
  - "impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis."
  - "If status=deprecated then lifecycle.replaced_by is required."
  - "No free-text trigger notes: use gating_rules and structured filters."
