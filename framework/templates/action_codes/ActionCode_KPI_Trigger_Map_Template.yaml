# ActionCode ↔ KPI Trigger Mapping
# Canonical YAML – Source of Truth
#
# Purpose:
# - Define WHEN an Action Code becomes decision-relevant
# - Keep Action Codes stable and use-case-agnostic
# - Externalize context-specific thresholds without duplicating Action Codes
#
# Non-negotiable:
# - This file never defines execution logic
# - This file never overrides Action Code L1–L3 triggers
# - Cross-domain orchestration is handled only by XD-003 Action Codes

settings:
  timezone: Europe/Berlin
  currency_default: EUR
  evaluation_default_window: "1–3 periods"

governance:
  status: approved            # draft | approved | deprecated
  owner: Analytics Governance
  last_reviewed: 18.12.2025
  change_notes: null

# Contextual scopes for threshold variation
scopes:
  - scope_id: GLOBAL
    description: "Default thresholds for all entities."
    filters: {}

# Action Code ↔ KPI trigger bindings
# Each mapping configures surfacing relevance only
mappings:
  # Example mapping (reference only – can be removed)
  - mapping_id: ACMAP-ENTERPRISE-001
    action_code_id: X-E3.1
    owner_domain: Enterprise
    scope_id: GLOBAL

    surfacing:
      primary_page_type: T4
      secondary_page_types: [T3]
      attention_priority: high        # low | medium | high | critical
      needs_action_panel: true

    trigger:
      trigger_type: composite         # variance | trend | threshold | anomaly | composite

      persistence:
        periods: 2
        period_grain: monthly

      cooldown:
        periods: 1
        period_grain: monthly

      conditions:
        - id: C1
          kpi_id: sales.net_sales_growth.pct
          comparator: "<"
          value: 0.00
          unit: percent
          calc: variance_pct
          description: "Growth below target."

      suppress_if: []

    evaluation_tracking:
      evaluation_window: "1–3 periods"

      leading_indicators:
        - kpi_id: sales.net_sales_growth.pct
          expected_direction: up
          tolerance: 0.01

      lagging_indicators: []

      success_rule: >
        KPI trajectory improves within the evaluation window
        without violating Action Code guardrails.

    operational_metadata:
      escalation_path: null
      notes: null
