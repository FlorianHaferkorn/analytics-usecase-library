# ActionCode ↔ KPI Trigger Mapping

# Purpose
# - Define **when** an Action Code becomes decision-relevant
# - Keep Action Codes stable and use-case-agnostic
# - Centralize KPI targets and thresholds for simple maintenance
#
# Important Clarifications
# - A trigger indicates **decision relevance**, not mandatory execution.
# - Final decisions are made on **T4 – Prescriptive Recommendation** pages.
# - This file configures *context-specific measurement*, not business logic.

settings:
  timezone: Europe/Berlin
  currency_default: EUR
  evaluation_default_window: "1–3 periods"

governance:
  status: approved                    # draft | approved | deprecated
  owner: Analytics Governance
  last_reviewed: <DD.MM.YYYY>
  change_notes: <optional>

# Optional scopes allow different thresholds by business context
# without duplicating Action Codes.
scopes:
  - scope_id: GLOBAL
    description: "Default thresholds for all organizations."
    filters: {}

mappings:
  - mapping_id: ACMAP-<DOMAIN>-<NNN>
    action_code_id: AC-<DOMAIN>-<NNN>
    domain: <Commercial | Finance | Ops | Cross>

    # Surfacing controls *attention*, not business priority.
    surfacing:
      primary_page_type: T4
      secondary_page_types: [T3]
      attention_priority: high        # low | medium | high | critical
      needs_action_panel: true

    scope_id: GLOBAL

    # Trigger logic defines the measurable signal pattern
    # that makes the Action Code relevant.
    trigger:
      trigger_type: variance          # variance | trend | threshold | anomaly

      persistence:
        periods: 2
        period_grain: monthly
      cooldown:
        periods: 1
        period_grain: monthly

      conditions:
        - id: C1
          kpi: <KPI_Name>
          target: <Target_Name>
          comparator: "<"
          value: -0.05
          unit: percent
          calc: variance_pct
          description: "Primary KPI deviation exceeds threshold."
        - id: C2
          kpi: <Optional_KPI_Name>
          comparator: ">="
          value: 0.00
          unit: percent
          calc: trend_pct
          description: "Context condition to avoid false positives."

      suppress_if:
        - id: S1
          description: "Known business exception or data quality issue."
          condition_ref: <optional>

    # Outcome tracking maps the generic Action Code evaluation
    # to concrete KPIs in this specific context.
    evaluation_tracking:
      evaluation_window: "1–3 periods"
      leading_indicators:
        - kpi: <KPI_Name>
          expected_direction: up
          tolerance: 0.01
      lagging_indicators:
        - kpi: <KPI_Name>
          expected_direction: up
          tolerance: 0.005
      success_rule: >
        Define success based on measurable improvement of the expected outcome.

    operational_metadata:
      escalation_path: <optional>
      notes: <optional>
