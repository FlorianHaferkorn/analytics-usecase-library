model_id: aurora_core_action_ready
description: Sample semantic model for Aurora Group demo aligned to the ActionReady Semantic Layer blueprint.

tables:
  dimensions:
    - dim_date
    - dim_org
    - dim_product
    - dim_customer
    - dim_asset
    - dim_supplier
  facts:
    - fact_sales
    - fact_ops
    - fact_inventory
    - fact_finance
    - fact_service
  security:
    - security_user_org

relationships:
  - {from_table: dim_date, from_column: DateKey, to_table: fact_sales, to_column: DateKey, cardinality: one-to-many, direction: single}
  - {from_table: dim_org, from_column: OrgKey, to_table: fact_sales, to_column: OrgKey, cardinality: one-to-many, direction: single}
  - {from_table: dim_product, from_column: ProductKey, to_table: fact_sales, to_column: ProductKey, cardinality: one-to-many, direction: single}
  - {from_table: dim_customer, from_column: CustomerKey, to_table: fact_sales, to_column: CustomerKey, cardinality: one-to-many, direction: single}
  - {from_table: dim_date, from_column: DateKey, to_table: fact_ops, to_column: DateKey, cardinality: one-to-many, direction: single}
  - {from_table: dim_org, from_column: OrgKey, to_table: fact_ops, to_column: OrgKey, cardinality: one-to-many, direction: single}
  - {from_table: dim_asset, from_column: AssetKey, to_table: fact_ops, to_column: AssetKey, cardinality: one-to-many, direction: single}
  - {from_table: dim_date, from_column: DateKey, to_table: fact_inventory, to_column: DateKey, cardinality: one-to-many, direction: single}
  - {from_table: dim_org, from_column: OrgKey, to_table: fact_inventory, to_column: OrgKey, cardinality: one-to-many, direction: single}
  - {from_table: dim_product, from_column: ProductKey, to_table: fact_inventory, to_column: ProductKey, cardinality: one-to-many, direction: single}
  - {from_table: dim_date, from_column: DateKey, to_table: fact_finance, to_column: DateKey, cardinality: one-to-many, direction: single}
  - {from_table: dim_org, from_column: OrgKey, to_table: fact_finance, to_column: OrgKey, cardinality: one-to-many, direction: single}
  - {from_table: dim_date, from_column: DateKey, to_table: fact_service, to_column: DateKey, cardinality: one-to-many, direction: single}
  - {from_table: dim_org, from_column: OrgKey, to_table: fact_service, to_column: OrgKey, cardinality: one-to-many, direction: single}
  - {from_table: security_user_org, from_column: OrgKey, to_table: dim_org, to_column: OrgKey, cardinality: many-to-one, direction: single}

notes:
  - Conformed dimensions reuse the domain data contracts in data_contracts/domains/.
  - Measures should be taken from semantic_models/domains/Measure_Dictionary_*.md to stay consistent.
  - RLS follows security_user_org with UserPrincipalName filter as defined in data_governance.md.
