# Operations Semantic Model - Aurora Group
#
# Purpose:
#   Aurora-specific semantic model blueprint for Operations analytics domain
#   Covers OEE, asset performance, quality & yield
#
# Scope:
#   Use Cases: OPS-001, OPS-002, OPS-003
#   Data: Aurora synthetic gold layer (fact_ops, fact_inventory_snapshot)
#   Tool: Power BI Semantic Model (TMDL format)
#
# Status: PLACEHOLDER - To be implemented after Commercial domain

model_id: aurora_operations
domain: Operations
description: >
  Aurora Group Operations Analytics - Overall equipment effectiveness,
  asset reliability, and quality management.

use_cases:
  - id: OPS-001
    title: "Operations Performance"
    purpose: "Improve overall equipment effectiveness and throughput by addressing availability, performance, and quality losses"
    strategic_kpis:
      - ops.oee.pct
      - ops.availability.pct
      - ops.performance.pct
      - ops.quality.pct
      - ops.throughput.units
      - ops.downtime.pct
    action_codes: [O2, M2, L2, D1]
    display_folder: "07_OEE & Throughput"
    reporting_level: Tactical / Operational
    analytics_stage: Diagnostic

  - id: OPS-002
    title: "Asset Performance"
    purpose: "Improve asset reliability and availability by reducing unplanned downtime and optimizing preventive maintenance"
    strategic_kpis:
      - ops.availability.pct
      - ops.mtbf.hours
      - ops.mttr.hours
      - ops.downtime.unplanned.pct
      - ops.spare_parts.stockout.pct
      - ops.pm_compliance.pct
    action_codes: [O2, L2, D1, M2]
    display_folder: "08_Asset Reliability"
    reporting_level: Tactical
    analytics_stage: Diagnostic / Prescriptive

  - id: OPS-003
    title: "Quality & Yield"
    purpose: "Improve first pass yield and reduce scrap/rework by identifying top defect drivers and cost of poor quality"
    strategic_kpis:
      - quality.fpy.pct
      - quality.scrap.pct
      - quality.rework.pct
      - quality.copq.amount
      - quality.complaint.pct
      - quality.defect_density
    action_codes: [L2, O2, D1, M2]
    display_folder: "09_Quality & Yield"
    reporting_level: Tactical / Operational
    analytics_stage: Diagnostic / Prescriptive

# ────────────────────────────────────────────────────────────────────────────
# Tables (from data_contracts/domains/operations.yaml)
# ────────────────────────────────────────────────────────────────────────────
tables:
  dimensions:
    - dim_date
    - dim_org
    - dim_asset
    - dim_product
  facts:
    - fact_ops
    - fact_inventory_snapshot
  security:
    - security_user_org

# ────────────────────────────────────────────────────────────────────────────
# Relationships
# ────────────────────────────────────────────────────────────────────────────
relationships:
  - from_table: dim_date
    from_column: DateKey
    to_table: fact_ops
    to_column: DateKey
    cardinality: one-to-many
    cross_filter: single

  - from_table: dim_org
    from_column: OrgKey
    to_table: fact_ops
    to_column: OrgKey
    cardinality: one-to-many
    cross_filter: single

  - from_table: dim_asset
    from_column: AssetKey
    to_table: fact_ops
    to_column: AssetKey
    cardinality: one-to-many
    cross_filter: single

  - from_table: security_user_org
    from_column: OrgKey
    to_table: dim_org
    to_column: OrgKey
    cardinality: many-to-one
    cross_filter: single
    security: true

# fact_inventory_snapshot (when present): dim_date, dim_org, dim_product
  - from_table: dim_date
    from_column: DateKey
    to_table: fact_inventory_snapshot
    to_column: DateKey
    cardinality: one-to-many
    cross_filter: single

  - from_table: dim_org
    from_column: OrgKey
    to_table: fact_inventory_snapshot
    to_column: OrgKey
    cardinality: one-to-many
    cross_filter: single

  - from_table: dim_product
    from_column: ProductKey
    to_table: fact_inventory_snapshot
    to_column: ProductKey
    cardinality: one-to-many
    cross_filter: single

# ────────────────────────────────────────────────────────────────────────────
# Display folders (measures per use case)
# DAX from core/kpi_catalog/KPI_Catalog.md; add dax_expression for each KPI
# ────────────────────────────────────────────────────────────────────────────
display_folders:
  - folder_name: "07_OEE & Throughput"
    description: "OPS-001: Overall equipment effectiveness and throughput"
    measures:
      - ops.oee.pct
      - ops.availability.pct
      - ops.performance.pct
      - ops.quality.pct
      - ops.throughput.units
      - ops.downtime.pct

  - folder_name: "08_Asset Reliability"
    description: "OPS-002: Asset reliability and maintenance"
    measures:
      - ops.availability.pct
      - ops.mtbf.hours
      - ops.mttr.hours
      - ops.downtime.unplanned.pct
      - ops.spare_parts.stockout.pct
      - ops.pm_compliance.pct

  - folder_name: "09_Quality & Yield"
    description: "OPS-003: First-pass yield and cost of poor quality"
    measures:
      - quality.fpy.pct
      - quality.scrap.pct
      - quality.rework.pct
      - quality.copq.amount
      - quality.complaint.pct
      - quality.defect_density

# ────────────────────────────────────────────────────────────────────────────
# Row-Level Security
# ────────────────────────────────────────────────────────────────────────────
security_roles:
  - role_name: OrgAccess
    description: "Restrict data to user's assigned organizations via security_user_org"
    dax_filter: |
      dim_org[OrgKey] IN CALCULATETABLE(
        VALUES(security_user_org[OrgKey]),
        security_user_org[UserPrincipalName] = USERPRINCIPALNAME()
      )
    applies_to_tables: [dim_org]

# ────────────────────────────────────────────────────────────────────────────
# Notes & governance
# ────────────────────────────────────────────────────────────────────────────
notes:
  - "Relationships and display_folders complete; DAX in KPI Catalog still required for OPS-001/002/003"
  - "Data source: showcases/aurora_group/data/gold/ (fact_ops, fact_inventory_snapshot when generated)"
  - "See showcases/aurora_group/models/README.md § Next Steps"

governance:
  business_owner: "COO"
  data_owner: "Operations BI Team"
  version: v0.2
  last_updated: 2026-02-20
