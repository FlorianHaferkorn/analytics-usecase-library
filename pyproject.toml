[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aluca"
version = "2.1.0"
description = "ALUCA — Analytics Library of Use Cases: a Strategy-to-Action analytics framework"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.17.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
]

[project.scripts]
aluca = "aluca:main"

[tool.setuptools]
py-modules = ["aluca"]

[tool.pytest.ini_options]
testpaths = ["tooling/tests", "tooling/generator_core/tests", "tooling/superversion/tests", "products"]
pythonpath = [".", "tooling", "tooling/ontology"]
norecursedirs = ["products/fabric/powerbi/deployment/scripts/modules/tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
# Vendored Meridian canonical-core (ADR-0005) is third-party; not linted by ALUCA rules.
extend-exclude = ["tooling/superversion/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W"]
