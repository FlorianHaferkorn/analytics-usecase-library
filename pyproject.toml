[project]
name = "analytics-usecase-library"
version = "2.1.0"
description = "Analytics Strategy-to-Action Framework — Use Case Library"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.17.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tooling/tests", "tooling/generator_core/tests", "products"]
pythonpath = ["tooling", "tooling/ontology"]
norecursedirs = ["products/fabric/powerbi/deployment/scripts/modules/tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
