title: Report Spec Schema (v1)
type: object
required: [meta, kpis, dataset, pages, theme_ref]
properties:
  pbir:
    type: object
    description: Optional PBIR schema reference and version
    properties:
      schema_ref: { type: string }
      version: { type: string }
  meta:
    type: object
    required: [id, title, domain, reporting_level, analytics_stage]
    properties:
      id: { type: string }
      title: { type: string }
      domain: { type: string }
      reporting_level: { enum: [Strategic, Tactical, Operational] }
      analytics_stage: { enum: [Descriptive, Diagnostic, Predictive, Prescriptive] }
  kpis:
    type: object
    required: [required_measures]
    properties:
      required_measures:
        type: array
        items: { type: string }
      segments:
        type: array
        items: { type: string }
      filters_default:
        type: array
        items: { type: string }
  dataset:
    type: object
    required: [model_ref]
    properties:
      model_ref: { type: string }
      roles:
        type: array
        items: { type: string }
  pages:
    type: array
    items:
      type: object
      required: [name, template_ref, visuals]
      properties:
        name: { type: string }
        template_ref: { type: string }
        visuals:
          type: array
          items:
            type: object
            required: [type, bindings, position]
            properties:
              type: { type: string }
              title: { type: string }
              bindings: { type: object }
              formatting: { type: object }
              interactions: { type: object }
              position:
                type: object
                required: [x, y, w, h]
                properties:
                  x: { type: integer }
                  y: { type: integer }
                  w: { type: integer }
                  h: { type: integer }
        slicers:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              selection: { type: string }
  theme_ref: { type: string }
  qa:
    type: object
    properties:
      assert_measures:
        type: array
        items: { type: string }
