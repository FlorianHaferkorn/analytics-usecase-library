meta:
  id: COM-001
  title: Sales Performance vs Plan & Last Year
  domain: Commercial
  reporting_level: Tactical
  analytics_stage: Descriptive

kpis:
  required_measures:
    - Net Sales Amount
    - Δ Net Sales Amount
    - Δ% Net Sales
    - Price Realization %
    - Promo Uplift %
    - Price Effect Amount
    - Volume Effect Amount
    - Mix Effect Amount
  segments:
    - Org.Region>Area>Store
    - Product.Category>Subcategory>SKU
    - Channel
    - Time.Year>Month>Week>Day
  filters_default:
    - Time: Last 12M
    - Org: All
    - Channel: All

dataset:
  model_ref: Contoso Sales Sample for Power BI Desktop.SemanticModel
  roles: []

pages:
  - name: Overview
    template_ref: 3-30-300_overview
    visuals:
      - type: card
        title: Δ% Net Sales
        bindings:
          value: Δ% Net Sales
        position: { x: 0, y: 0, w: 3, h: 2 }
      - type: card
        title: Net Sales Amount
        bindings:
          value: Net Sales Amount
        position: { x: 3, y: 0, w: 3, h: 2 }
      - type: line
        title: Net Sales Trend
        bindings:
          y: Net Sales Amount
          x: Date
        formatting:
          y.displayUnits: auto
          y.precision: 0
        position: { x: 0, y: 2, w: 12, h: 5 }
      - type: bar
        title: Top Regions by Net Sales
        bindings:
          value: Net Sales Amount
          category: Org.Region
        position: { x: 0, y: 7, w: 6, h: 6 }
      - type: waterfall
        title: Price-Volume-Mix Bridge
        bindings:
          y:
            - Price Effect Amount
            - Volume Effect Amount
            - Mix Effect Amount
        position: { x: 6, y: 7, w: 6, h: 6 }
    slicers:
      - field: Time.YearMonth
        selection: Last 12M
      - field: Channel
        selection: All

  - name: Drivers
    template_ref: drivers
    visuals: []
    slicers: []

  - name: Details
    template_ref: details
    visuals: []
    slicers: []

theme_ref: analog_light_118dff

qa:
  assert_measures:
    - RI_OK
    - DeltaPct_OnlyWhenPlanPositive
