# runs against ≥2 ontologies — guarding against "only one demo tenant".
# Grain = delivery line (Delivery/day; matches supply.* KPI grain_scope).
# Expected values under `expected/SCM-002.yaml` are derived from THESE rows by
# `refcalc.recompute()`; the self-consistency test enforces it.
