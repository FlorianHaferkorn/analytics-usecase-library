# Expected KPI values for COM-001 over `commercial_invoice_lines` (I-4.1).
#
# Every `value` is DERIVED from the reference dataset by the `formula` via
# `refcalc.recompute()`; `tests/test_eval_refdata.py::test_expected_values_are_self_consistent`
# fails if a checked-in value drifts from its formula. So these are reproducible
# golden values, not hand-authored constants. The Value-Gate (I-4.2) compares a
# generated model's computed KPI against these within `tolerance`.
use_case: COM-001
dataset: commercial_invoice_lines
expected:
  - measure_name: Net Sales Amount
    kpi_id: KPI-COM-005
    formula: sum(net_sales_amount)
    value: 10000.00
    tolerance: 0.01
    unit: EUR
  - measure_name: Gross Margin Amount
    kpi_id: KPI-COM-019
    formula: sum(gross_margin_amount)
    value: 4090.00
    tolerance: 0.01
    unit: EUR
  - measure_name: Gross Margin %
    kpi_id: KPI-COM-013
    formula: sum(gross_margin_amount) / sum(net_sales_amount)
    value: 0.409
    tolerance: 0.0001
    unit: ratio
  # Comparison measure (not a governed catalog KPI — the adapter does not yet
  # materialize Plan; see I-3.4 Golden-Thread WARN). Kept here to exercise the
  # ratio formula and to anchor what COM-001 visuals actually display.
  - measure_name: Net Sales % vs Plan
    kpi_id: null
    comparison: true
    formula: sum(net_sales_amount) / sum(plan_sales_amount)
    value: 1.0416666667
    tolerance: 0.0001
    unit: ratio
