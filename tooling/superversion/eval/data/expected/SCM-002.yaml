# Expected KPI values for SCM-002 over `supply_deliveries` (I-4.3).
#
# Second reference ontology. Every `value` is DERIVED from the dataset via the
# `formula` (refcalc); the self-consistency test enforces reproducibility.
# On-Time/In-Full/OTIF % = matching deliveries ÷ total deliveries.
use_case: SCM-002
dataset: supply_deliveries
expected:
  - measure_name: On-Time %
    kpi_id: supply.on_time.pct
    formula: sum(on_time) / sum(delivery_count)
    value: 0.75
    tolerance: 0.0001
    unit: ratio
  - measure_name: In-Full %
    kpi_id: supply.in_full.pct
    formula: sum(in_full) / sum(delivery_count)
    value: 0.75
    tolerance: 0.0001
    unit: ratio
  - measure_name: OTIF %
    kpi_id: supply.otif.pct
    formula: sum(otif) / sum(delivery_count)
    value: 0.625
    tolerance: 0.0001
    unit: ratio
