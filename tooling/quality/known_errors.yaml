# Known Errors & Fix Classification
# ─────────────────────────────────────────────────────────────────────────────
# Machine-readable knowledge base for the Quality Platform.
# Human-readable companion: internal/project_mgmt/KNOWN_ERRORS_AND_FIXES.md
#
# Fields per entry:
#   id               – stable identifier (snake_case)
#   signature        – regex or exact string pattern found in validator output
#   check            – validator check ID (matches tooling_manifest.yaml)
#   scope            – report | model | kpi | governance | all
#   severity         – critical | warning | info
#   category         – structural | schema | dax | tmdl | governance | content
#   deterministic_fix – true = self_heal can fix; false = human / agent action required
#   fix_id           – self_heal fix function ID (null if not deterministic)
#   manual_fix       – short description of what a human/agent should do
#   regression_test  – test function in tooling/tests/ that covers this case (if any)
#   docs             – reference doc or KNOWN_ERRORS_AND_FIXES.md heading
# ─────────────────────────────────────────────────────────────────────────────

version: "1.0"

