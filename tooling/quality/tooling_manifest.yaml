# Quality Tooling Manifest
# ────────────────────────────────────────────────────────────────────────────
# Single source of truth for every script, check, hook, skill, rule, and
# reference doc that forms the Power BI Quality Platform.
#
# Fields per entry:
#   id           – stable identifier used in known_errors.yaml and context packs
#   type         – gate | validator | self_heal | schema_source | agent_skill |
#                  hook | bpa_rule | reference_doc
#   scope        – report | model | kpi | governance | all
#   entrypoint   – repo-relative path to the script / file
#   runs_in      – pwsh | python | bash | yaml | json | markdown
#   fixes        – list of check IDs this tool can repair (self_heal only)
#   owner        – team / component owning this artefact
#   docs         – repo-relative path to docs or inline description
#   summary_mode – flag or option that produces compact CI output (if any)
# ────────────────────────────────────────────────────────────────────────────

version: "1.0"

# ── Gates ───────────────────────────────────────────────────────────────────
gates:
  - id: quality_gate
    type: gate
    scope: all
    entrypoint: tooling/quality/run_quality_gate.ps1
    runs_in: pwsh
    owner: quality
    docs: "Canonical local + CI entry point. Runs Stage 1 + Fabric checks. -SelfHeal for local repair loop."
    summary_mode: "-Summary"

  - id: stage1_gate
    type: gate
    scope: governance
    entrypoint: tooling/run_stage1_checks.ps1
    runs_in: pwsh
    owner: quality
    docs: "Governance, docs, YAML, registry, markdownlint."
    summary_mode: null

  - id: fabric_gate
    type: gate
    scope: report
    entrypoint: products/fabric/powerbi/tooling/run_fabric_checks.ps1
    runs_in: pwsh
    owner: fabric
    docs: "TMDL, PBIR, pbir-cli --qa, fab-inspector BPA rules, report scorecard, P0 report quality, bindings."
    summary_mode: null

# ── Report Quality Validators (Python) ──────────────────────────────────────
validators:
  - id: report.schema
    type: validator
    scope: report
    entrypoint: tooling/report_quality/schema_validator.py
    runs_in: python
    owner: quality
    docs: "Validates $schema URLs in PBIR JSON files against the schema registry."

  - id: report.structural
    type: validator
    scope: report
    entrypoint: tooling/report_quality/structural_validator.py
    runs_in: python
    owner: quality
    docs: "Checks page size, required visual slots, forbidden visual types, visual bounds."

  - id: report.content
    type: validator
    scope: report
    entrypoint: tooling/report_quality/content_validator.py
    runs_in: python
    owner: quality
    docs: "Checks KPI card presence, date slicer, titles, and display names."

  - id: report.dax_refs
    type: validator
    scope: report
    entrypoint: tooling/report_quality/dax_reference_validator.py
    runs_in: python
    owner: quality
    docs: "Validates that all measure references in visuals resolve to known TMDL measures."

  # ── Fabric / PBIR Validators (PowerShell) ─────────────────────────────────
  - id: pbir.schema
    type: validator
    scope: report
    entrypoint: products/fabric/powerbi/tooling/validation/check_pbir_schema.ps1
    runs_in: pwsh
    owner: fabric
    docs: "Validates PBIR JSON schema URLs, folder names (page/visual/bookmark), and $schema fields."

  - id: pbir.schema_versions
    type: validator
    scope: report
    entrypoint: products/fabric/powerbi/tooling/validation/check_schema_versions.py
    runs_in: python
    owner: fabric
    docs: "Checks that all $schema URLs in dist/ match the pinned versions in schema_registry.py."

  - id: pbir.jsonschema
    type: validator
    scope: report
    entrypoint: products/fabric/powerbi/tooling/validation/validate_pbir_jsonschema.py
    runs_in: python
    owner: fabric
    docs: "Full JSON schema validation against Microsoft PBIR schemas (fetched/cached)."

  - id: pbir.report_quality_ps1
    type: validator
    scope: report
    entrypoint: products/fabric/powerbi/tooling/validation/check_report_quality.ps1
    runs_in: pwsh
    owner: fabric
    docs: "PowerShell wrapper that invokes the Python report_quality CLI within Fabric checks."

  - id: pbir.report_scorecard
    type: validator
    scope: report
    entrypoint: products/fabric/powerbi/tooling/validation/check_report_scorecard.ps1
    runs_in: pwsh
    owner: fabric
    docs: "IBCS scorecard (R3.3): weighted points (100 - severity-weighted deductions) + Mixed-Scale/Unsorted-Evidence knock-outs, threshold 70%. Only -Enforce report(s) (default COM-002) fail the gate; others are scored/logged only pending R5.1 rollout."

  - id: pbir.report_pages
    type: validator
    scope: report
    entrypoint: products/fabric/powerbi/tooling/validation/check_pbip_report_pages.ps1
    runs_in: pwsh
    owner: fabric
    docs: "Checks that every report has the required Overview and Detail pages."

  - id: pbir.report_layout
    type: validator
    scope: report
    entrypoint: products/fabric/powerbi/tooling/validation/check_report_layout.ps1
    runs_in: pwsh
    owner: fabric
    docs: "Validates report visual layout against page template specs."

  - id: pbir.page_template
    type: validator
    scope: report
    entrypoint: products/fabric/powerbi/tooling/validation/check_page_template_compliance.py
    runs_in: python
    owner: fabric
    docs: "Checks page template slot/visual-type compliance against UseCase_Bracket.yaml."

  - id: pbir.theme
    type: validator
    scope: report
    entrypoint: products/fabric/powerbi/tooling/validation/check_report_theme_compliance.py
    runs_in: python
    owner: fabric
    docs: "Validates report theme.json against the canonical brand theme."

  - id: pbir.actioncode_to_report
    type: validator
    scope: report
    entrypoint: products/fabric/powerbi/tooling/validation/check_actioncode_to_report.ps1
    runs_in: pwsh
    owner: fabric
    docs: "Verifies action code references in reports match orchestration definitions."

  # ── TMDL / Semantic Model Validators ──────────────────────────────────────
  - id: tmdl.syntax
    type: validator
    scope: model
    entrypoint: products/fabric/powerbi/tooling/validation/check_tmdl_syntax.ps1
    runs_in: pwsh
    owner: fabric
    docs: "TMDL syntax checks: tabs, assignment operators, M-expression/table-name collision."

  - id: tmdl.pbip_readiness
    type: validator
    scope: model
    entrypoint: products/fabric/powerbi/tooling/validation/check_tmdl_pbip_readiness.ps1
    runs_in: pwsh
    owner: fabric
    docs: "PBIP Desktop-readiness: auto-date tables, isAvailableInMDX, wide tables (>100 cols)."

  - id: tmdl.diagram_layout
    type: validator
    scope: model
    entrypoint: products/fabric/powerbi/tooling/validation/check_diagram_layout.ps1
    runs_in: pwsh
    owner: fabric
    docs: "Validates diagramLayout.json (spaghetti-principle position rules)."

  - id: tmdl.vs_measure_dict
    type: validator
    scope: model
    entrypoint: products/fabric/powerbi/tooling/validation/check_tmdl_vs_measure_dictionary.ps1
    runs_in: pwsh
    owner: fabric
    docs: "Diffs TMDL measures against the Measure Dictionary XLSX for gaps."

  - id: tmdl.measures_vs_kpi
    type: validator
    scope: model
    entrypoint: products/fabric/powerbi/tooling/validation/check_measures_vs_kpi.ps1
    runs_in: pwsh
    owner: fabric
    docs: "Checks that all TMDL measures align with KPI catalog definitions."

  - id: tmdl.dax_bpa
    type: validator
    scope: model
    entrypoint: products/fabric/powerbi/tooling/validation/check_dax_best_practices.ps1
    runs_in: pwsh
    owner: fabric
    docs: "Runs DAX Best Practice Analyzer rules from tooling/linters/powerbi/bpa-rules-dax.json."

  - id: tmdl.with_pbi_cli
    type: validator
    scope: model
    entrypoint: products/fabric/powerbi/tooling/validation/check_with_pbi_cli.ps1
    runs_in: pwsh
    owner: fabric
    docs: "Runs pbir validate --qa against each .Report directory."

  - id: pbir.fab_inspector
    type: validator
    scope: report
    entrypoint: products/fabric/powerbi/tooling/validation/check_fab_inspector.ps1
    runs_in: pwsh
    owner: fabric
    docs: "Runs fab-inspector (PBI-Inspector V2) against fab-inspector-rules.json; logType:error rules block the gate. See docs/architecture/r3-2-fab-inspector-integration.md."

  # ── Governance / Stage 1 Validators ───────────────────────────────────────
  - id: gov.kpi_catalog
    type: validator
    scope: kpi
    entrypoint: tooling/check_kpi_catalog_gaps.py
    runs_in: python
    owner: governance
    docs: "Checks for gaps and inconsistencies in the KPI catalog."

  - id: gov.docs_links
    type: validator
    scope: governance
    entrypoint: tooling/validation/check_docs_links.py
    runs_in: python
    owner: governance
    docs: "Validates documentation links and detects deprecated path references."

  - id: gov.markdownlint
    type: validator
    scope: governance
    entrypoint: tooling/validation/check_markdownlint.ps1
    runs_in: pwsh
    owner: governance
    docs: "Runs markdownlint-cli2 with rules MD010 (tabs), MD041 (first heading), MD047 (final newline)."

# ── Self-Heal ────────────────────────────────────────────────────────────────
self_heals:
  - id: self_heal.report_quality
    type: self_heal
    scope: report
    entrypoint: tooling/report_quality/self_heal.py
    runs_in: python
    fixes:
      - page:size
      - visual:bounds
      - schema:url
    owner: quality
    docs: "Deterministic check->fix->revalidate loop. Max iterations capped. Writes fix_log.json."

  - id: self_heal.repair_ps1
    type: self_heal
    scope: report
    entrypoint: products/fabric/powerbi/tooling/validation/repair_report_quality.ps1
    runs_in: pwsh
    fixes:
      - page:size
      - visual:bounds
      - schema:url
    owner: fabric
    docs: "PowerShell wrapper for the Python self-heal CLI. Writes fix log to internal/metrics/runs/."

  - id: self_heal.tmdl_render
    type: self_heal
    scope: model
    entrypoint: products/fabric/powerbi/tooling/tmdl_render_and_fix.ps1
    runs_in: pwsh
    fixes:
      - tmdl.syntax
    owner: fabric
    docs: "Normalises TMDL indentation, removes BOM, fixes common syntax errors."

# ── Schema Sources ────────────────────────────────────────────────────────────
schema_sources:
  - id: schema.registry
    type: schema_source
    scope: report
    entrypoint: products/fabric/powerbi/tooling/schema_registry.py
    runs_in: python
    owner: fabric
    docs: "Pinned PBIR/PBIP schema URLs. Updated by discover_schema_latest.py when versions change."

  - id: schema.discover
    type: schema_source
    scope: report
    entrypoint: products/fabric/powerbi/tooling/discover_schema_latest.py
    runs_in: python
    owner: fabric
    docs: "Discovers latest Microsoft schema versions from GitHub; caches locally; flags drift."
    summary_mode: "--summary"

  - id: schema.pbir_resolver
    type: schema_source
    scope: report
    entrypoint: products/fabric/powerbi/tooling/validation/pbir_schema_resolver.py
    runs_in: python
    owner: fabric
    docs: "Resolves $ref chains in Microsoft PBIR JSON schemas; caches fetched schemas locally."

  - id: schema.cached_fetch
    type: schema_source
    scope: report
    entrypoint: products/fabric/powerbi/tooling/cache_pbir_schemas.py
    runs_in: python
    owner: fabric
    docs: "Pre-fetches and caches all pinned Microsoft PBIR schemas to tooling/schemas/pbir/."

# ── Agent Skills ──────────────────────────────────────────────────────────────
agent_skills:
  - id: skill.fabric_pbi_validation
    type: agent_skill
    scope: report
    entrypoint: docs/agent/skills/fabric-powerbi-validation.md
    runs_in: markdown
    owner: fabric
    docs: "Guides validation of TMDL, PBIR, DAX, and measures. Run before every Fabric commit."

  - id: skill.generate_validate_pbi
    type: agent_skill
    scope: report
    entrypoint: docs/agent/skills/generate-and-validate-pbi-report.md
    runs_in: markdown
    owner: fabric
    docs: "Full skill for generating Power BI reports with iterative quality validation."

  - id: skill.fix_pbi_report_errors
    type: agent_skill
    scope: report
    entrypoint: docs/agent/skills/fix-pbi-report-errors.md
    runs_in: markdown
    owner: fabric
    docs: "Diagnose and fix Power BI report and semantic model errors systematically."

  - id: skill.stage1_precommit
    type: agent_skill
    scope: governance
    entrypoint: docs/agent/skills/stage1-pre-commit.md
    runs_in: markdown
    owner: governance
    docs: "Run Stage 1 checks before committing. References quality_gate."

  - id: skill.fix_stage1_failure
    type: agent_skill
    scope: governance
    entrypoint: docs/agent/skills/fix-stage1-failure.md
    runs_in: markdown
    owner: governance
    docs: "Diagnose and fix Stage 1 CI failures."

# ── Hooks ─────────────────────────────────────────────────────────────────────
hooks:
  - id: hook.validate_tmdl_style
    type: hook
    scope: model
    entrypoint: .claude/hooks/validate_tmdl_style.sh
    runs_in: bash
    owner: fabric
    docs: "PostToolUse hook: blocks on tab/`:=`/`description:` violations in .tmdl files."

  - id: hook.validate_pbir_structure
    type: hook
    scope: report
    entrypoint: .claude/hooks/validate_pbir_structure.sh
    runs_in: bash
    owner: fabric
    docs: "PostToolUse hook: blocks on JSON syntax errors in .json/.pbir inside PBIP directories."

  - id: hook.validate_measure_metadata
    type: hook
    scope: model
    entrypoint: .claude/hooks/validate_measure_metadata.sh
    runs_in: bash
    owner: fabric
    docs: "PostToolUse hook: enforces formatString, displayFolder, /// Purpose: on _Measures.tmdl."

  - id: hook.check_pbi_desktop
    type: hook
    scope: report
    entrypoint: .claude/hooks/check_pbi_desktop.sh
    runs_in: bash
    owner: fabric
    docs: "PostToolUse hook: opportunistic advisory if Power BI Desktop is running (pbir validate --fields)."

# ── BPA Rules ─────────────────────────────────────────────────────────────────
bpa_rules:
  - id: bpa.dax
    type: bpa_rule
    scope: model
    entrypoint: tooling/linters/powerbi/bpa-rules-dax.json
    runs_in: json
    owner: fabric
    docs: "DAX best practice rules: dax.ifnesting.avoid, dax.format.forbidden (with allowWhenContains)."
    source: custom
    last_checked: "2026-05"

  - id: bpa.tmdl
    type: bpa_rule
    scope: model
    entrypoint: tooling/linters/powerbi/bpa-rules-tmdl.json
    runs_in: json
    owner: fabric
    docs: "TMDL structural rules: summarizeBy:none, tabs, no := operator."
    source: custom
    last_checked: "2026-05"

  - id: bpa.report
    type: bpa_rule
    scope: report
    entrypoint: tooling/linters/powerbi/bpa-rules-report.json
    runs_in: json
    owner: fabric
    docs: "Report-level rules: forbidden visuals, slot requirements."
    source: custom
    last_checked: "2026-05"

  - id: bpa.semanticmodel
    type: bpa_rule
    scope: model
    entrypoint: tooling/linters/powerbi/bpa-rules-semanticmodel.json
    runs_in: json
    owner: fabric
    docs: "Semantic model best practices: isAvailableInMDX, hidden columns, auto date tables."
    source: custom
    last_checked: "2026-05"

  - id: bpa.fab_inspector
    type: bpa_rule
    scope: report
    entrypoint: products/fabric/powerbi/tooling/validation/fab-inspector-rules.json
    runs_in: json
    owner: fabric
    docs: "JSON-Logic rules for the fab-inspector (PBI-Inspector V2) engine: max visuals/page, no vertical scroll, theme-colour hygiene. All logType:error."
    source: "adapted from NatVanG/fab-inspector Rules/Base-rules.json (MIT)"
    last_checked: "2026-07"

# ── Reference Docs ────────────────────────────────────────────────────────────
reference_docs:
  - id: ref.tmdl_allowed_subset
    type: reference_doc
    scope: model
    entrypoint: core/strategy_operating_model/operating_model/reference/TMDL_Allowed_Subset.md
    runs_in: markdown
    owner: fabric
    docs: "Canonical TMDL conventions: tabs, DAX assignment, measure docs, summarizeBy, layout."

  - id: ref.pbir_visual_json
    type: reference_doc
    scope: report
    entrypoint: products/fabric/powerbi/docs/references/pbir-visual-json.md
    runs_in: markdown
    owner: fabric
    docs: "Editing visual.json: position, expressions, data binding."

  - id: ref.pbir_schemas_versions
    type: reference_doc
    scope: report
    entrypoint: products/fabric/powerbi/docs/references/pbir-schemas-versions.md
    runs_in: markdown
    owner: fabric
    docs: "PBIR schema version history and migration patterns."

  - id: ref.pbir_conditional_formatting
    type: reference_doc
    scope: report
    entrypoint: products/fabric/powerbi/docs/references/pbir-conditional-formatting.md
    runs_in: markdown
    owner: fabric
    docs: "Adding measure-based, gradient, or rules-based conditional formatting."

  - id: ref.pbir_filter_pane
    type: reference_doc
    scope: report
    entrypoint: products/fabric/powerbi/docs/references/pbir-filter-pane.md
    runs_in: markdown
    owner: fabric
    docs: "Filter pane and filter structure reference for PBIR."

  - id: ref.pbir_fix_broken_refs
    type: reference_doc
    scope: report
    entrypoint: products/fabric/powerbi/docs/references/pbir-fix-broken-field-references.md
    runs_in: markdown
    owner: fabric
    docs: "Step-by-step guide for fixing broken field references in PBIR reports."

  - id: ref.known_errors
    type: reference_doc
    scope: all
    entrypoint: internal/project_mgmt/KNOWN_ERRORS_AND_FIXES.md
    runs_in: markdown
    owner: quality
    docs: "Human-readable knowledge base of known errors, causes, and fixes. Machine version: tooling/quality/known_errors.yaml."

  - id: ref.quality_tooling_map
    type: reference_doc
    scope: all
    entrypoint: docs/architecture/quality-tooling-map.md
    runs_in: markdown
    owner: quality
    docs: "Generated map of all quality tooling. DO NOT edit manually -- regenerate with generate_quality_tooling_map.py."
