# Taxonomy Index — Machine-readable taxonomy for validation tooling
# This file defines the canonical domain prefixes, ID patterns, and
# structural rules that validators can reference.
#
# Consumed by: registry_builder.py, health_scorecard.py, Stage 1 checks
# Human reference: TAXONOMY.md (kept in sync manually)

version: "1.0"

domains:
  COM:
    name: Commercial
    scope: "Sales, Marketing, CRM, Pricing, Retail"
    kpi_domain_keys: [sales, crm, marketing, pricing, commercial, retail, customer]
    action_prefix: "C"
  FIN:
    name: Finance
    scope: "Cash, P&L, Controlling, Treasury"
    kpi_domain_keys: [finance, cash, treasury, controlling]
    action_prefix: "F"
  OPS:
    name: Operations
    scope: "Production, Efficiency, Quality"
    kpi_domain_keys: [ops, operations, production, quality, efficiency]
    action_prefix: "O"
  SCM:
    name: Supply Chain
    scope: "Inventory, Logistics, Procurement"
    kpi_domain_keys: [scm, supply_chain, inventory, logistics, procurement]
    action_prefix: "S"
  HR:
    name: People & HR
    scope: "Workforce, Talent, Engagement"
    kpi_domain_keys: [hr, people, workforce, talent]
    action_prefix: "P"
  MFG:
    name: Manufacturing
    scope: "Plant, Production Lines, OEE"
    kpi_domain_keys: [mfg, manufacturing, plant]
    action_prefix: "M"
  XD:
    name: Cross-Domain / Executive
    scope: "Enterprise KPIs, Service Levels"
    kpi_domain_keys: [xd, executive, enterprise, service]
    action_prefix: "X"
  SVC:
    name: Service
    scope: "Customer Service, Support, SLA"
    kpi_domain_keys: [service, support, sla]
    action_prefix: "V"
  ENT:
    name: Enterprise
    scope: "Enterprise-wide, Governance"
    kpi_domain_keys: [enterprise, governance]
    action_prefix: "E"

id_patterns:
  kpi:
    format: "<domain>.<entity>.<metric>[.<qualifier>]"
    regex: "^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*){1,4}$"
    examples:
      - sales.net_sales.amount
      - crm.clv.amount
      - finance.cash_flow.amount

  use_case:
    # Core + extension tiers ratified in ADR-0004 (industry-variant use-case tier).
    format: "<DOMAIN>-<NNN> | <DOMAIN>-EXT-<NNN> | <DOMAIN>-IND-<S><NNN>"
    regex: "^[A-Z]{2,4}-(EXT-|IND-[A-Z])?\\d{3}$"
    folder_format: "<ID>_<Descriptive_Name>"
    tiers:
      core: "core/usecases/core/ — <DOMAIN>-<NNN> (governed core-16)"
      extended: "core/usecases/extended/ — <DOMAIN>-EXT-<NNN> (cross-industry, sector-agnostic)"
      industry: "core/usecases/industry/<sector>/ — <DOMAIN>-IND-<S><NNN> (sector-specific)"
    sector_letters: { R: Retail, L: Logistics, M: Manufacturing }
    examples:
      - COM-001
      - COM-EXT-001
      - COM-IND-R001

  action_code:
    format: "<Prefix>-<Type><Seq>.<Sub>"
    regex: "^[A-Z]-[A-Z]\\d+\\.\\d+$"
    examples:
      - C-M1.1
      - F-C2.1
      - O-P3.1

  data_contract_domain:
    format: "<domain_name>.yaml"
    regex: "^[a-z][a-z0-9_]+\\.yaml$"
    examples:
      - commercial_sales.yaml
      - operations.yaml

kpi_roles:
  - strategic     # Top-level, tracked by leadership
  - influencing   # Mid-level, drives strategic KPIs
  - operational   # Day-to-day metric
  - supporting    # Supporting/derived measure backing other KPIs

action_types:
  M: "Margin / Revenue"
  P: "Process"
  S: "Service"
  C: "Cost"
  R: "Risk"

governance_statuses:
  - active
  - draft
  - deprecated

metric_suffixes:
  amount: "Absolute value (currency, units)"
  pct: "Percentage"
  count: "Count / integer"
  ratio: "Ratio (dimensionless)"
  days: "Duration in days"
  rate: "Rate per period"
  score: "Composite score"
  index: "Index value"
