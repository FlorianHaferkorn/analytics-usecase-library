# Proposal Costing – Defaults for proposal text (scope, assumptions, viewer notes).
# Optional: if missing, engine uses inline fallbacks.

schema_version: "1.0"

scope_in:
  - "Fabric Capacity (Pay-as-you-go or reservation)"
  - "Power BI Pro / PPU licenses as specified"

scope_out:
  - "Implementation / Professional Services"
  - "Training"
  - "OneLake Storage (unless estimated via --storage-gb)"
  - "Network egress"
  - "Local taxes and currency conversion"

default_contract_term_months: 12
default_region: "West Europe"
price_basis: "Microsoft list price (USD)"

# Viewer notes (used when prod capacity is below vs at/above F64).
viewer_note_below_f64: "With production capacity below F64, report viewers require Power BI Pro."
viewer_note_f64_plus: "With F64+ production capacity, viewers can use the Free license."

# Quote validity: default days from valid_from (from cost_drivers) until quote expires.
default_quote_valid_days: 30

# Optional default FTE for implementation and maintenance (overridden by CLI or overrides).
default_implementation_fte: null
default_implementation_months: null
default_maintenance_fte: null

# Building block labels (for "Kosten nach Bausteinen"). Keys: fabric_capacity, power_bi, onelake_storage, implementation, maintenance.
building_block_labels:
  fabric_capacity: "Fabric Capacity"
  power_bi: "Power BI (Pro / PPU)"
  onelake_storage: "OneLake Storage"
  implementation: "Implementation (one-time)"
  maintenance: "Maintenance (per year)"

# Optional: TCO category per building block (Acquisition vs Operating).
building_block_categories:
  fabric_capacity: "Operating"
  power_bi: "Operating"
  onelake_storage: "Operating"
  implementation: "Acquisition"
  maintenance: "Operating"

# Optional: sensitivity note (one line or short paragraph).
sensitivity_note: "Änderungen bei Nutzerzahl, Capacity oder Region beeinflussen die TCO; bei Abweichung bitte neu kalkulieren."

# Optional: customer contributions / prerequisites for implementation (RFP-style).
customer_contributions:
  - "Benennung fachlicher und technischer Ansprechpartner"
  - "Bereitstellung von Testdaten bzw. Zugang zu Quellsystemen"
  - "Freigabe von Meilensteinen und Teilnahme an Review-Terminen"
  - "Kick-off und regelmäßige Abstimmungstermine"

# Optional: implementation milestones (RFP-style). List of phase, deliverable, duration.
implementation_milestones:
  - phase: "Kick-off & Anforderung"
    deliverable: "Anforderungsdokument, Abnahme Kriterien"
    duration: "Woche 1–2"
  - phase: "Aufbau & Konfiguration"
    deliverable: "Umgebungen, erste Reports"
    duration: "Woche 3–8"
  - phase: "Test & Go-Live"
    deliverable: "UAT, Schulung, Go-Live"
    duration: "Woche 9–12"
