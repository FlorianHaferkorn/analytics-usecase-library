schema_version: "1.1"

id: "C-P4.2"
name: "Promotion Price & Discount Guardrails"
owner_domain: "Pricing / Sales Operations"
impact_dimension: "Profitability"

status: "active"
lifecycle:
  introduced_date: "2025-12-18"
  deprecated_date: null
  replaced_by: null
  change_notes: []

category:
  group: "Promotion Pricing Control"
  theme: "Prevent Discount-Driven Margin Erosion"

tags: ["promotion", "pricing", "discount-guardrails"]

strategic_alignment:
  strategic_kpis:
    - id: "sales.price.realization_pct"
      role: "primary"
    - id: "margin.promo.gm.pct"
      role: "secondary"
  decisions_enabled:
    - "Enforce discount floors during promotions"
    - "Require approval for promo price exceptions"
  non_goals:
    - "List price strategy redesign"
    - "Non-promo pricing governance (handled in COM-002)"
    - "Promotion calendar decisions (handled in C-P4.1)"

use_case_links:
  core_use_cases:
    - "COM-004"
  related_use_cases:
    - "COM-002"

kpis:
  trigger_kpis:
    - kpi_id: "sales.price.realization_pct"
      label: "Price Realization %"
      semantic_ref:
        model_domain: "Commercial"
        measure: "Price Realization %"
  guardrail_kpis:
    - kpi_id: "margin.promo.gm.pct"
      label: "Promo Gross Margin %"
      semantic_ref:
        model_domain: "Commercial"
        measure: "Promo Gross Margin %"
  outcome_kpis:
    - kpi_id: "sales.price.realization_pct"
      label: "Price Realization %"
      semantic_ref:
        model_domain: "Commercial"
        measure: "Price Realization %"
    - kpi_id: "margin.promo.gm.pct"
      label: "Promo Gross Margin %"
      semantic_ref:
        model_domain: "Commercial"
        measure: "Promo Gross Margin %"

scope:
  default_grain: "promotion"
  default_perspective: ["Region", "Channel"]
  supported_slices:
    - "Product Category"
    - "PromoType"
  exclusions:
    - "Strategic brand campaigns with approved pricing override"
    - "Promotions without price mechanics (e.g. visibility-only)"
    - "Legally fixed retail price promotions"

trigger:
  type: "Deviation"
  evaluation:
    grain: "promotion"
    window:
      kind: "point_in_time"
      length: 1
      unit: "execution"
    persistence:
      required: false
      min_consecutive_periods: 1
    minimum_data:
      min_observations: 1
      volume_guardrail:
        enabled: true
        metric_kpi_id: "sales.promo.incremental.amount"
        comparator: "gte"
        value: 50000
        unit: "amount"
  levels:
    L1:
      severity: "EarlyWarning"
      condition:
        metric_kpi_id: "sales.price.realization_pct"
        comparator: "lt"
        threshold:
          basis: "absolute"
          value: 0.90
          unit: "%"
        filters: []
    L2:
      severity: "RequiredIntervention"
      condition:
        metric_kpi_id: "sales.price.realization_pct"
        comparator: "lt"
        threshold:
          basis: "absolute"
          value: 0.85
          unit: "%"
        filters: []
    L3:
      severity: "PrescriptiveExecution"
      condition:
        metric_kpi_id: "sales.price.realization_pct"
        comparator: "lt"
        threshold:
          basis: "absolute"
          value: 0.80
          unit: "%"
        filters: []
  gating_rules:
    - "Trigger only for promotions with price-based mechanics"
    - "Do not trigger if promo ROI is positive and Promo GM % exceeds target"
    - "Exclude promotions flagged as strategic branding with approved override"

impact:
  category: "High"
  expected_range:
    metric_kpi_id: "margin.promo.gm.pct"
    value_low: 0.5
    value_high: 2.0
    unit: "pp"
    time_to_effect:
      min_periods: 0
      max_periods: 1
  mechanism:
    - "Reduced discount depth"
    - "Prevention of excessive promo price erosion"
  confidence:
    level: "High"
    rationale:
      - "Immediate effect on promo pricing"
      - "Clear governance lever"

operational_execution:
  primary_owner_role: "Pricing Lead"
  stakeholders:
    - "Trade Marketing"
    - "Commercial Controlling"
  prerequisites:
    - "Defined promo discount floors by category"
    - "Approval workflow for promo price exceptions"
  steps:
    - "Identify promotions breaching price realization guardrails"
    - "Block or revise discount depth"
    - "Require approval for exceptions"
    - "Validate promo GM impact post-execution"
  effort:
    level: "Low"
    typical_duration_days: 14
  risks_and_tradeoffs:
    - "Reduced headline attractiveness of promotions"
    - "Channel resistance to tighter price control"

data_requirements:
  required_entities:
    - "Promotion"
    - "Product"
    - "Org"
  semantic_dependencies:
    measures:
      - "Price Realization %"
      - "Promo Gross Margin %"
      - "Incremental Sales Amount"
    tables:
      - "fact_sales"
      - "fact_promo"
      - "dim_promo"

automation:
  detection:
    enabled: true
    evaluation_frequency: "per_promotion"
    output: "Promotions breaching price realization thresholds"
  suggested_actions:
    enabled: true
    outputs:
      - "Discount adjustment or approval requirement"
  copilot_prompts: []

tracking:
  execution_log:
    enabled: true
    recommended_storage: "fact_action_execution"
    minimum_fields:
      - "ActionCode"
      - "Promotion"
      - "TriggerLevel"
      - "ExecutedDate"
  outcome_evaluation:
    enabled: true
    recommended_storage: "fact_action_outcome"
    minimum_fields:
      - "ActionCode"
      - "Promotion"
      - "Pre_PriceRealization_Pct"
      - "Post_PriceRealization_Pct"

governance:
  approvals_required:
    - "Head of Pricing"
  rollback_plan:
    - "Relax guardrails if promo participation drops below tolerance"
  documentation_links:
    - "usecases/core/COM-004/Business_Factsheet.md"

quality_rules:
  - "All kpi_id values must exist in KPI catalog."
  - "Trigger severity must be strictly increasing from L1 to L3."
  - "impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis."
  - "If status=deprecated then lifecycle.replaced_by is required."
  - "No free-text trigger notes: use gating_rules and structured filters."
