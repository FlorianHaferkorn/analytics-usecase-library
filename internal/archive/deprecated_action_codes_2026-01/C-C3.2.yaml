schema_version: "1.1"

id: "C-C3.2"
name: "High-Risk Revenue Prioritisation"
owner_domain: "Commercial / Sales Ops"
impact_dimension: "Growth"

status: "active"
lifecycle:
  introduced_date: "2025-12-18"
  deprecated_date: null
  replaced_by: null
  change_notes: []

category:
  group: "Customer Value Protection"
  theme: "Focus Retention Capacity on Highest Exposure"

tags: ["revenue-at-risk", "prioritisation", "retention-focus"]

strategic_alignment:
  strategic_kpis:
    - id: "crm.revenue_at_risk.amount"
      role: "primary"
    - id: "crm.clv.amount"
      role: "secondary"
  decisions_enabled:
    - "Prioritise retention capacity toward highest value exposure"
    - "Sequence outreach by risk-weighted value"
  non_goals:
    - "Executing retention offers (handled by C-C3.1)"
    - "Discounting or pricing changes"
    - "Customer acquisition"

use_case_links:
  core_use_cases:
    - "COM-003"
  related_use_cases:
    - "COM-002"

kpis:
  trigger_kpis:
    - kpi_id: "crm.revenue_at_risk.amount"
      label: "Revenue at Risk Amount"
      semantic_ref:
        model_domain: "CustomerValue"
        measure: "Revenue at Risk Amount"
  guardrail_kpis:
    - kpi_id: "margin.gm.pct"
      label: "Gross Margin %"
      semantic_ref:
        model_domain: "Commercial"
        measure: "Gross Margin %"
  outcome_kpis:
    - kpi_id: "crm.revenue_at_risk.amount"
      label: "Revenue at Risk Amount"
      semantic_ref:
        model_domain: "CustomerValue"
        measure: "Revenue at Risk Amount"

scope:
  default_grain: "month"
  default_perspective: ["Customer Segment", "Channel"]
  supported_slices:
    - "Region"
  exclusions:
    - "Low-value customers below minimum CLV threshold"
    - "Customers already in active save workflows (C-C3.1)"
    - "New customers (<3 months tenure)"

trigger:
  type: "Threshold"
  evaluation:
    grain: "month"
    window:
      kind: "point_in_time"
      length: 1
      unit: "period"
    persistence:
      required: false
      min_consecutive_periods: 1
    minimum_data:
      min_observations: 1
      volume_guardrail:
        enabled: true
        metric_kpi_id: "crm.active_customers.count"
        comparator: "gte"
        value: 50
        unit: "count"
  levels:
    L1:
      severity: "EarlyWarning"
      condition:
        metric_kpi_id: "crm.revenue_at_risk.amount"
        comparator: "gt"
        threshold:
          basis: "relative"
          value: 0.10
          unit: "%"
        filters: []
    L2:
      severity: "RequiredIntervention"
      condition:
        metric_kpi_id: "crm.revenue_at_risk.amount"
        comparator: "gt"
        threshold:
          basis: "relative"
          value: 0.20
          unit: "%"
        filters: []
    L3:
      severity: "PrescriptiveExecution"
      condition:
        metric_kpi_id: "crm.revenue_at_risk.amount"
        comparator: "gt"
        threshold:
          basis: "absolute"
          value: 750000
          unit: "EUR"
        filters: []
  gating_rules:
    - "Trigger only if Gross Margin % remains within COM-002 guardrails"
    - "Do not trigger if churn already materialised"
    - "Exclude segments under contractual renewal freeze"

impact:
  category: "Medium"
  expected_range:
    metric_kpi_id: "crm.revenue_at_risk.amount"
    value_low: 5.0
    value_high: 15.0
    unit: "%"
    time_to_effect:
      min_periods: 1
      max_periods: 3
  mechanism:
    - "Reallocation of retention capacity toward highest exposure"
    - "Faster engagement of high-risk, high-value customers"
  confidence:
    level: "Medium"
    rationale:
      - "Effect depends on downstream execution quality"
      - "Prioritisation improves efficiency, not guarantees saves"

operational_execution:
  primary_owner_role: "Sales Operations Lead"
  stakeholders:
    - "Customer Success"
    - "Sales Leadership"
  prerequisites:
    - "Agreed CLV and attrition risk methodology"
    - "Capacity limits defined for retention teams"
  steps:
    - "Rank customers by revenue at risk"
    - "Segment into priority tiers"
    - "Assign top tiers to retention workflows"
    - "Review prioritisation monthly"
  effort:
    level: "Low"
    typical_duration_days: 30
  risks_and_tradeoffs:
    - "Neglect of lower-value but strategically important customers"
    - "Perceived unfairness in account attention"

data_requirements:
  required_entities:
    - "Customer"
    - "Customer Segment"
    - "Channel"
  semantic_dependencies:
    measures:
      - "Revenue at Risk Amount"
      - "Customer Lifetime Value Amount"
      - "Active Customers Count"
    tables:
      - "fact_customer_value"
      - "fact_customer_events"
      - "dim_customer"

automation:
  detection:
    enabled: true
    evaluation_frequency: "monthly"
    output: "Ranked customer list by revenue at risk"
  suggested_actions:
    enabled: true
    outputs:
      - "Priority tiers for retention assignment"
  copilot_prompts: []

tracking:
  execution_log:
    enabled: true
    recommended_storage: "fact_action_execution"
    minimum_fields:
      - "ActionCode"
      - "TriggerLevel"
      - "CustomerKey"
      - "PriorityTier"
      - "ExecutedDate"
  outcome_evaluation:
    enabled: true
    recommended_storage: "fact_action_outcome"
    minimum_fields:
      - "ActionCode"
      - "Pre_RevenueAtRisk"
      - "Post_RevenueAtRisk_60d"

governance:
  approvals_required:
    - "Head of Sales Operations"
  rollback_plan:
    - "Rebalance prioritisation if retention throughput degrades"
  documentation_links:
    - "usecases/core/COM-003/Business_Factsheet.md"

quality_rules:
  - "All kpi_id values must exist in KPI catalog."
  - "Trigger severity must be strictly increasing from L1 to L3."
  - "impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis."
  - "If status=deprecated then lifecycle.replaced_by is required."
  - "No free-text trigger notes: use gating_rules and structured filters."

