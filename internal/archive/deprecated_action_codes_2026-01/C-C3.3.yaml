schema_version: "1.1"

id: "C-C3.3"
name: "Customer Value Mix Steering"
owner_domain: "Commercial / Category Management"
impact_dimension: "Profitability"

status: "active"
lifecycle:
  introduced_date: "2025-12-18"
  deprecated_date: null
  replaced_by: null
  change_notes: []

category:
  group: "Value Mix Steering"
  theme: "Increase CLV via Margin-Safe Offer Mix"

tags: ["clv", "mix", "upsell", "bundles"]

strategic_alignment:
  strategic_kpis:
    - id: "crm.clv.amount"
      role: "primary"
    - id: "margin.gm.pct"
      role: "secondary"
  decisions_enabled:
    - "Steer customers toward higher-margin products and bundles"
    - "Prioritise upsell paths with positive CLV contribution"
  non_goals:
    - "Price discounting or deal renegotiation"
    - "Promotion ROI optimisation"
    - "Assortment rationalisation programs"

use_case_links:
  core_use_cases:
    - "COM-003"
  related_use_cases:
    - "COM-002"

kpis:
  trigger_kpis:
    - kpi_id: "crm.clv.amount"
      label: "Customer Lifetime Value Amount"
      semantic_ref:
        model_domain: "CustomerValue"
        measure: "Customer Lifetime Value Amount"
  guardrail_kpis:
    - kpi_id: "margin.gm.pct"
      label: "Gross Margin %"
      semantic_ref:
        model_domain: "Commercial"
        measure: "Gross Margin %"
  outcome_kpis:
    - kpi_id: "crm.clv.amount"
      label: "Customer Lifetime Value Amount"
      semantic_ref:
        model_domain: "CustomerValue"
        measure: "Customer Lifetime Value Amount"

scope:
  default_grain: "customer_month"
  default_perspective: ["Customer Segment", "Channel"]
  supported_slices:
    - "Product Category"
    - "Bundle"
  exclusions:
    - "Customers in active churn-save workflows (C-C3.1)"
    - "Strategic customers with bespoke pricing"
    - "Customers with unresolved CX escalations"

trigger:
  type: "Pattern"
  evaluation:
    grain: "customer_month"
    window:
      kind: "rolling"
      length: 3
      unit: "periods"
    persistence:
      required: true
      min_consecutive_periods: 2
    minimum_data:
      min_observations: 2
      volume_guardrail:
        enabled: true
        metric_kpi_id: "crm.lifetime_revenue.amount"
        comparator: "gte"
        value: 50000
        unit: "amount"
  levels:
    L1:
      severity: "EarlyWarning"
      condition:
        metric_kpi_id: "crm.clv.amount"
        comparator: "lt"
        threshold:
          basis: "target"
          value: "segment_clv_target"
          unit: "EUR"
        filters: []
    L2:
      severity: "RequiredIntervention"
      condition:
        metric_kpi_id: "crm.clv.amount"
        comparator: "lt"
        threshold:
          basis: "relative"
          value: 0.15
          unit: "%"
        filters: []
    L3:
      severity: "PrescriptiveExecution"
      condition:
        metric_kpi_id: "crm.clv.amount"
        comparator: "lt"
        threshold:
          basis: "relative"
          value: 0.30
          unit: "%"
        filters: []
  gating_rules:
    - "Trigger only if Gross Margin % remains within COM-002 guardrails"
    - "Do not trigger if churn risk exceeds tolerance (handled by C-C3.1)"
    - "Exclude customers with declining NPS over last 2 periods"

impact:
  category: "Medium"
  expected_range:
    metric_kpi_id: "crm.clv.amount"
    value_low: 5.0
    value_high: 15.0
    unit: "%"
    time_to_effect:
      min_periods: 2
      max_periods: 6
  mechanism:
    - "Upsell to higher-margin products"
    - "Cross-sell bundles with positive contribution margin"
  confidence:
    level: "Medium"
    rationale:
      - "CLV uplift depends on customer acceptance"
      - "Margin guardrails reduce downside risk"

operational_execution:
  primary_owner_role: "Category Manager"
  stakeholders:
    - "Sales Account Leads"
    - "Marketing Operations"
  prerequisites:
    - "Defined upsell and bundle playbooks by segment"
    - "Certified CLV calculation methodology"
  steps:
    - "Identify segments with persistent CLV underperformance"
    - "Map eligible upsell/bundle options"
    - "Activate targeted offers via sales and marketing"
    - "Review CLV uplift quarterly"
  effort:
    level: "Medium"
    typical_duration_days: 120
  risks_and_tradeoffs:
    - "Offer complexity increasing sales friction"
    - "Customer fatigue from excessive upsell attempts"

data_requirements:
  required_entities:
    - "Customer"
    - "Customer Segment"
    - "Product"
  semantic_dependencies:
    measures:
      - "Customer Lifetime Value Amount"
      - "Customer Lifetime Revenue Amount"
      - "Gross Margin %"
      - "NPS Score"
    tables:
      - "fact_customer_value"
      - "fact_sales"
      - "fact_nps"

automation:
  detection:
    enabled: true
    evaluation_frequency: "monthly"
    output: "Customers and segments eligible for value mix steering"
  suggested_actions:
    enabled: true
    outputs:
      - "Upsell and bundle recommendation list"
  copilot_prompts: []

tracking:
  execution_log:
    enabled: true
    recommended_storage: "fact_action_execution"
    minimum_fields:
      - "ActionCode"
      - "CustomerKey"
      - "Segment"
      - "ExecutedDate"
  outcome_evaluation:
    enabled: true
    recommended_storage: "fact_action_outcome"
    minimum_fields:
      - "ActionCode"
      - "Pre_CLV"
      - "Post_CLV_90d"

governance:
  approvals_required:
    - "Head of Category Management"
    - "Commercial Controlling Lead"
  rollback_plan:
    - "Suspend offers if margin or NPS deteriorates"
  documentation_links:
    - "usecases/core/COM-003/Business_Factsheet.md"

quality_rules:
  - "All kpi_id values must exist in KPI catalog."
  - "Trigger severity must be strictly increasing from L1 to L3."
  - "impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis."
  - "If status=deprecated then lifecycle.replaced_by is required."
  - "No free-text trigger notes: use gating_rules and structured filters."

