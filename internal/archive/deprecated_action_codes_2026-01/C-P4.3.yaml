schema_version: "1.1"

id: "C-P4.3"
name: "Cannibalization & Mix Control"
owner_domain: "Category Management"
impact_dimension: "Profitability"

status: "active"
lifecycle:
  introduced_date: "2025-12-18"
  deprecated_date: null
  replaced_by: null
  change_notes: []

category:
  group: "Promotion Portfolio Quality"
  theme: "Protect Net Incrementality"

tags: ["promotion", "cannibalization", "mix"]

strategic_alignment:
  strategic_kpis:
    - id: "sales.promo.cannibalization.pct"
      role: "primary"
    - id: "sales.promo.incremental.amount"
      role: "secondary"
  decisions_enabled:
    - "Adjust promo SKU scope and mechanics to reduce cannibalization"
    - "Exclude or swap SKUs causing net value destruction"
  non_goals:
    - "Assortment redesign"
    - "Channel strategy changes"
    - "Pricing strategy outside promo mechanics"

use_case_links:
  core_use_cases:
    - "COM-004"
  related_use_cases:
    - "COM-001"
    - "COM-002"

kpis:
  trigger_kpis:
    - kpi_id: "sales.promo.cannibalization.pct"
      label: "Cannibalization %"
      semantic_ref:
        model_domain: "Commercial"
        measure: "Cannibalization %"
  guardrail_kpis:
    - kpi_id: "margin.promo.gm.pct"
      label: "Promo Gross Margin %"
      semantic_ref:
        model_domain: "Commercial"
        measure: "Promo Gross Margin %"
  outcome_kpis:
    - kpi_id: "sales.promo.incremental.amount"
      label: "Incremental Sales Amount"
      semantic_ref:
        model_domain: "Commercial"
        measure: "Incremental Sales Amount"
    - kpi_id: "sales.promo.cannibalization.pct"
      label: "Cannibalization %"
      semantic_ref:
        model_domain: "Commercial"
        measure: "Cannibalization %"

scope:
  default_grain: "promotion"
  default_perspective: ["Region", "Channel"]
  supported_slices:
    - "Product Category"
    - "SKU"
  exclusions:
    - "First-time pilot promotions (<1 execution)"
    - "Strategic brand campaigns with approved override"
    - "Promotions without related-SKU mapping"

trigger:
  type: "Deviation"
  evaluation:
    grain: "promotion"
    window:
      kind: "rolling"
      length: 2
      unit: "executions"
    persistence:
      required: true
      min_consecutive_periods: 2
    minimum_data:
      min_observations: 2
      volume_guardrail:
        enabled: true
        metric_kpi_id: "sales.promo.incremental.amount"
        comparator: "gte"
        value: 80000
        unit: "amount"
  levels:
    L1:
      severity: "EarlyWarning"
      condition:
        metric_kpi_id: "sales.promo.cannibalization.pct"
        comparator: "gt"
        threshold:
          basis: "absolute"
          value: 0.20
          unit: "%"
        filters: []
    L2:
      severity: "RequiredIntervention"
      condition:
        metric_kpi_id: "sales.promo.cannibalization.pct"
        comparator: "gt"
        threshold:
          basis: "absolute"
          value: 0.30
          unit: "%"
        filters: []
    L3:
      severity: "PrescriptiveExecution"
      condition:
        metric_kpi_id: "sales.promo.cannibalization.pct"
        comparator: "gt"
        threshold:
          basis: "absolute"
          value: 0.40
          unit: "%"
        filters: []
  gating_rules:
    - "Trigger only if Incremental Sales Amount is positive"
    - "Do not trigger if promo ROI is negative due to cost (handled by C-P4.4)"
    - "Exclude promotions flagged as strategic branding with approved override"

impact:
  category: "Medium"
  expected_range:
    metric_kpi_id: "sales.promo.cannibalization.pct"
    value_low: -5.0
    value_high: -20.0
    unit: "pp"
    time_to_effect:
      min_periods: 1
      max_periods: 2
  mechanism:
    - "Removal of cannibalizing SKUs from promo scope"
    - "Shift to mechanics with broader demand creation"
  confidence:
    level: "Medium"
    rationale:
      - "Depends on quality of related-item mapping"
      - "Short feedback loop per promotion"

operational_execution:
  primary_owner_role: "Category Manager"
  stakeholders:
    - "Trade Marketing"
    - "Commercial BI"
  prerequisites:
    - "Validated related-SKU mapping for cannibalization"
    - "Clear promo mechanic taxonomy"
  steps:
    - "Identify promotions with repeated high cannibalization"
    - "Analyze cannibalized SKUs and overlap"
    - "Adjust SKU scope or mechanic"
    - "Validate net incrementality in next execution"
  effort:
    level: "Low to Medium"
    typical_duration_days: 30
  risks_and_tradeoffs:
    - "Reduced promo simplicity"
    - "Risk of underestimating halo effects"

data_requirements:
  required_entities:
    - "Promotion"
    - "Product"
    - "Org"
  semantic_dependencies:
    measures:
      - "Cannibalization %"
      - "Incremental Sales Amount"
      - "Promo Gross Margin %"
    tables:
      - "fact_sales"
      - "fact_promo"
      - "dim_promo"
      - "dim_product"

automation:
  detection:
    enabled: true
    evaluation_frequency: "per_promotion"
    output: "Promotions with excessive cannibalization"
  suggested_actions:
    enabled: true
    outputs:
      - "SKU scope and mechanic adjustment recommendations"
  copilot_prompts: []

tracking:
  execution_log:
    enabled: true
    recommended_storage: "fact_action_execution"
    minimum_fields:
      - "ActionCode"
      - "Promotion"
      - "TriggerLevel"
      - "ExecutedDate"
  outcome_evaluation:
    enabled: true
    recommended_storage: "fact_action_outcome"
    minimum_fields:
      - "ActionCode"
      - "Promotion"
      - "Pre_Cannibalization_Pct"
      - "Post_Cannibalization_Pct"

governance:
  approvals_required:
    - "Head of Category Management"
  rollback_plan:
    - "Revert SKU scope if incremental sales drop below tolerance"
  documentation_links:
    - "usecases/core/COM-004/Business_Factsheet.md"

quality_rules:
  - "All kpi_id values must exist in KPI catalog."
  - "Trigger severity must be strictly increasing from L1 to L3."
  - "impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis."
  - "If status=deprecated then lifecycle.replaced_by is required."
  - "No free-text trigger notes: use gating_rules and structured filters."
