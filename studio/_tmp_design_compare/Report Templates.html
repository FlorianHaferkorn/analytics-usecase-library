<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Report Page Templates · T1 – T4</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; font-family: Inter, system-ui, sans-serif; }
  * { box-sizing: border-box; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="tokens.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="primitives.jsx"></script>
<script type="text/babel" src="pages/T1_overview.jsx"></script>
<script type="text/babel" src="pages/T2_overview.jsx"></script>
<script type="text/babel" src="pages/T3_overview.jsx"></script>
<script type="text/babel" src="pages/T4_detail.jsx"></script>

<script type="text/babel" data-presets="react">
const { useState } = React;

// Tweaks state — default tweak block (used by the host for persisted edits)
const TWEAKS = /*EDITMODE-BEGIN*/{
  "annotate": true,
  "showSpecCard": true
}/*EDITMODE-END*/;

function SpecCard() {
  const T = window.TOKENS;
  return (
    <div style={{
      width: 1280, background: T.surfaceCard, padding: '28px 36px',
      fontFamily: 'Inter, sans-serif', color: T.textPrimary,
      border: `0.5px solid ${T.border}`, borderRadius: 4,
    }}>
      <div style={{ display: 'flex', alignItems: 'baseline', gap: 16, marginBottom: 4 }}>
        <div style={{ fontSize: 10, letterSpacing: 1, color: T.primary,
          fontWeight: 700, textTransform: 'uppercase' }}>Report Templates</div>
        <div style={{ fontSize: 10, color: T.textSecondary }}>
          Canvas 1280×720 · 12×12 LU · outer 32 · gutter 16
        </div>
      </div>
      <div style={{ fontSize: 22, fontWeight: 700, letterSpacing: -0.3, marginBottom: 18 }}>
        Tool-agnostic page templates — T1 · T2 · T3 · T4
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)',
        gap: 16, fontSize: 11, lineHeight: 1.5 }}>
        {[
          { id: 'T1', name: 'Strategic Overview',
            horizon: 'Quarterly · Annual', aud: 'Executives, Board',
            q: '"Are we on track against strategy?"',
            struct: 'Pulse (KPI band · 3 drivers · signal callout)',
            action: 'No Action Panel — only strategic signals',
            color: T.primary },
          { id: 'T2', name: 'Tactical Variance',
            horizon: 'Monthly · Weekly', aud: 'Managers, Dept. Heads',
            q: '"Why are we off plan?"',
            struct: 'Pulse + Variance Bridge (Waterfall)',
            action: 'Tactical signal — no owner/steps',
            color: T.primary },
          { id: 'T3', name: 'Operational Monitoring',
            horizon: 'Daily · Real-time', aud: 'Operational teams',
            q: '"Where is execution breaking now?"',
            struct: 'Exception list dominant + Pulse',
            action: 'Severity-driven, exception rows are the action',
            color: T.warning },
          { id: 'T4', name: 'Prescriptive Recommendation',
            horizon: 'On-demand drill',  aud: 'Decision makers',
            q: '"What to do, by whom, with what impact?"',
            struct: 'Slicer pane · narrative · detail matrix · Action Panel',
            action: 'Action Panel MANDATORY (from Action Codes YAML)',
            color: T.positive },
        ].map(t => (
          <div key={t.id} style={{
            border: `0.5px solid ${T.border}`, borderLeft: `3px solid ${t.color}`,
            padding: '10px 12px', borderRadius: 3, background: T.surfacePage,
          }}>
            <div style={{ display: 'flex', alignItems: 'baseline', gap: 6 }}>
              <div style={{ fontSize: 14, fontWeight: 700, color: t.color,
                fontFamily: '"JetBrains Mono", monospace' }}>{t.id}</div>
              <div style={{ fontSize: 12, fontWeight: 600 }}>{t.name}</div>
            </div>
            <div style={{ marginTop: 6, fontSize: 10, fontStyle: 'italic',
              color: T.textSecondary }}>{t.q}</div>
            <div style={{ marginTop: 8, display: 'grid', rowGap: 3, fontSize: 10 }}>
              <div><strong>Horizon:</strong> {t.horizon}</div>
              <div><strong>Audience:</strong> {t.aud}</div>
              <div><strong>Structure:</strong> {t.struct}</div>
              <div><strong>Action:</strong> {t.action}</div>
            </div>
          </div>
        ))}
      </div>

      <div style={{ marginTop: 18, padding: '10px 14px', background: T.surfacePage,
        border: `0.5px solid ${T.border}`, borderRadius: 3, fontSize: 10.5,
        lineHeight: 1.55, color: T.textPrimary }}>
        <strong style={{ color: T.primary }}>Tool-agnostic contract:</strong> every
        template is defined by <em>zones</em> (page role), <em>slot IDs</em> (machine-readable
        anchors: <code>KPI_1</code>, <code>Main_1_Trend</code>, <code>ActionPanel</code>) and
        <em> abstract visual types</em> (<code>KPI_Card</code>, <code>Trend_Line_with_Reference</code>,
        <code>Variance_Bridge</code>, <code>Ranked_Bar</code>, …). Adapters translate these
        into Power BI visuals, Evidence components, or OSS library widgets without
        design drift. Semantic colors (<span style={{ color: T.positive, fontWeight: 600 }}>
        positive</span>, <span style={{ color: T.negative, fontWeight: 600 }}>negative</span>,
        <span style={{ color: T.warning, fontWeight: 600 }}>warning</span>, neutral) map
        1:1 to theme-role tokens.
      </div>
    </div>
  );
}

function TweaksPanel({ tweaks, setTweaks, visible }) {
  if (!visible) return null;
  const T = window.TOKENS;
  return (
    <div style={{
      position: 'fixed', right: 16, bottom: 16, zIndex: 1000,
      background: '#fff', border: '1px solid #d0d0cc', borderRadius: 6,
      boxShadow: '0 10px 30px rgba(0,0,0,0.15)', padding: '14px 16px',
      fontFamily: 'Inter, sans-serif', fontSize: 12, minWidth: 220,
    }}>
      <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: 0.5,
        color: T.primary, textTransform: 'uppercase', marginBottom: 8 }}>
        Tweaks
      </div>
      <label style={{ display: 'flex', alignItems: 'center', gap: 8,
        marginBottom: 6, cursor: 'pointer' }}>
        <input type="checkbox" checked={tweaks.annotate}
          onChange={e => setTweaks({ ...tweaks, annotate: e.target.checked })} />
        Show zone & slot annotations
      </label>
      <label style={{ display: 'flex', alignItems: 'center', gap: 8,
        cursor: 'pointer' }}>
        <input type="checkbox" checked={tweaks.showSpecCard}
          onChange={e => setTweaks({ ...tweaks, showSpecCard: e.target.checked })} />
        Show template spec card
      </label>
    </div>
  );
}

function App() {
  const [tweaks, setTweaks] = useState(TWEAKS);
  const [editMode, setEditMode] = useState(false);

  React.useEffect(() => {
    const onMsg = (e) => {
      if (!e.data) return;
      if (e.data.type === '__activate_edit_mode') setEditMode(true);
      if (e.data.type === '__deactivate_edit_mode') setEditMode(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  React.useEffect(() => {
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: tweaks }, '*');
  }, [tweaks]);

  return (
    <>
      <DesignCanvas>

        {tweaks.showSpecCard && (
          <DCSection id="spec" title="Report Templates — System Overview"
            subtitle="4 page types · 3-30-300 framework · tool-agnostic semantic contract">
            <DCArtboard id="spec" label="Specification" width={1280} height={420}>
              <SpecCard />
            </DCArtboard>
          </DCSection>
        )}

        <DCSection id="t1" title="T1 · Strategic Overview"
          subtitle="Executive horizon · Quarterly & Annual · Decision Q: 'Are we on track against strategy?'">
          <DCArtboard id="overview" label="T1 Overview · anatomy" width={1280} height={720}>
            <T1Overview annotate={tweaks.annotate} />
          </DCArtboard>
          <DCArtboard id="clean" label="T1 Overview · clean" width={1280} height={720}>
            <T1Overview annotate={false} />
          </DCArtboard>
          {tweaks.annotate && (
            <DCPostIt top={-10} left={1340} rotate={2} width={240}>
              <strong>T1 rule:</strong> no Action Panel, no detail grain.
              Strategic signals escalate to T2 for diagnosis.
            </DCPostIt>
          )}
        </DCSection>

        <DCSection id="t2" title="T2 · Tactical Variance"
          subtitle="Management horizon · Monthly · Decision Q: 'Why are we off plan?'">
          <DCArtboard id="overview" label="T2 Overview · anatomy" width={1280} height={720}>
            <T2Overview annotate={tweaks.annotate} />
          </DCArtboard>
          <DCArtboard id="clean" label="T2 Overview · clean" width={1280} height={720}>
            <T2Overview annotate={false} />
          </DCArtboard>
          {tweaks.annotate && (
            <DCPostIt top={-10} left={1340} rotate={-2} width={240}>
              The <strong>Waterfall</strong> is the defining widget of T2 —
              it reconciles Δ into named drivers. Sum of driver bars MUST
              equal the Actual − Plan gap.
            </DCPostIt>
          )}
        </DCSection>

        <DCSection id="t3" title="T3 · Operational Monitoring"
          subtitle="Operational horizon · Daily / real-time · Decision Q: 'Where is execution breaking now?'">
          <DCArtboard id="overview" label="T3 Overview · anatomy" width={1280} height={720}>
            <T3Overview annotate={tweaks.annotate} />
          </DCArtboard>
          <DCArtboard id="clean" label="T3 Overview · clean" width={1280} height={720}>
            <T3Overview annotate={false} />
          </DCArtboard>
          {tweaks.annotate && (
            <DCPostIt top={-10} left={1340} rotate={1.5} width={240}>
              T3 reverses the Pulse emphasis — the <strong>exception list</strong>
              is the hero. KPIs are counts (criticals, ageing), not strategic values.
            </DCPostIt>
          )}
        </DCSection>

        <DCSection id="t4" title="T4 · Prescriptive Recommendation"
          subtitle="Action horizon · On-demand · Decision Q: 'What action, for whom, with what impact?'">
          <DCArtboard id="detail" label="T4 Detail · anatomy" width={1280} height={720}>
            <T4Detail annotate={tweaks.annotate} />
          </DCArtboard>
          <DCArtboard id="clean" label="T4 Detail · clean" width={1280} height={720}>
            <T4Detail annotate={false} />
          </DCArtboard>
          {tweaks.annotate && (
            <DCPostIt top={-10} left={1340} rotate={-1.5} width={260}>
              <strong>Action Panel is MANDATORY</strong> on every T4 page. Its
              content (Why · Steps · Owner · Due · Impact) is pulled verbatim
              from the Action Code YAML referenced in the narrative.
            </DCPostIt>
          )}
        </DCSection>

      </DesignCanvas>
      <TweaksPanel tweaks={tweaks} setTweaks={setTweaks} visible={editMode} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
