// Dashboard — framework overview
function Sparkline({ data, color = "var(--accent)", height = 32 }) {
  const max = Math.max(...data), min = Math.min(...data);
  const range = max - min || 1;
  const w = 120;
  const pts = data.map((v, i) => [(i / (data.length - 1)) * w, height - ((v - min) / range) * (height - 4) - 2]);
  const d = "M" + pts.map(p => p.join(",")).join(" L");
  const areaD = d + ` L${w},${height} L0,${height} Z`;
  return (
    <svg width={w} height={height} style={{display:"block"}}>
      <path d={areaD} fill={color} opacity="0.08" />
      <path d={d} fill="none" stroke={color} strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round" />
      <circle cx={pts[pts.length-1][0]} cy={pts[pts.length-1][1]} r="2.5" fill={color} />
    </svg>
  );
}

function DonutCoverage({ pct = 82 }) {
  const r = 36, c = 2 * Math.PI * r;
  return (
    <svg width="96" height="96" viewBox="0 0 96 96">
      <circle cx="48" cy="48" r={r} stroke="var(--line)" strokeWidth="6" fill="none"/>
      <circle cx="48" cy="48" r={r} stroke="var(--accent)" strokeWidth="6" fill="none"
              strokeLinecap="round" strokeDasharray={c}
              strokeDashoffset={c * (1 - pct/100)}
              transform="rotate(-90 48 48)"
              style={{ transition: "stroke-dashoffset 600ms ease" }}/>
      <text x="48" y="52" textAnchor="middle" fontFamily="var(--font-display)"
            fontSize="22" fontWeight="500" fill="var(--ink)">{pct}%</text>
    </svg>
  );
}

// ======== src/canvas.jsx ========
// Canvas — node graph of the framework
function Canvas({ onOpenDetail }) {
  const [zoom, setZoom] = useState(0.85);
  const [pan, setPan] = useState({ x: 0, y: 20 });
  const [sel, setSel] = useState(null);
  const [hover, setHover] = useState(null);
  const [dragging, setDragging] = useState(false);
  const dragRef = useRef(null);
  const [nodes, setNodes] = useState(GRAPH.nodes);

  const nodeMap = useMemo(() => Object.fromEntries(nodes.map(n => [n.id, n])), [nodes]);

  const onMouseDown = (e) => {
    if (e.target.closest("[data-node]")) return;
    dragRef.current = { x: e.clientX - pan.x, y: e.clientY - pan.y };
    setDragging(true);
  };
  const onMouseMove = (e) => {
    if (dragging && dragRef.current) {
      setPan({ x: e.clientX - dragRef.current.x, y: e.clientY - dragRef.current.y });
    }
  };
  const onMouseUp = () => { setDragging(false); dragRef.current = null; };

  const onWheel = (e) => {
    e.preventDefault();
    const next = Math.max(0.4, Math.min(1.6, zoom - e.deltaY * 0.001));
    setZoom(next);
  };

  const nodeKinds = {
    source:    { bg: "var(--panel)", border: "var(--line)",           accent: "oklch(0.6 0.04 250)", icon: "Source" },
    dimension: { bg: "var(--panel)", border: "var(--line)",           accent: "oklch(0.7 0.1 310)",  icon: "Dim" },
    metric:    { bg: "var(--panel)", border: "var(--line)",           accent: "oklch(0.7 0.1 250)",  icon: "Metric" },
    derived:   { bg: "var(--panel)", border: "var(--accent)",         accent: "var(--accent)",       icon: "Metric" },
    goal:      { bg: "var(--ink)",   border: "var(--ink)",            accent: "var(--bg)",           icon: "Sparkle" },
  };

  const NODE_W = 178, NODE_H = 56;

  const edgePath = (from, to) => {
    const x1 = from.x + NODE_W, y1 = from.y + NODE_H/2;
    const x2 = to.x,             y2 = to.y + NODE_H/2;
    const mx = (x1 + x2) / 2;
    return `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`;
  };

  const isHighlighted = (edge) => {
    if (!sel && !hover) return false;
    const target = sel || hover;
    return edge[0] === target || edge[1] === target;
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", height: "100%", overflow: "hidden", background: "var(--bg-2)" }}>
      {/* Toolbar */}
      <div style={{
        height: 48, flexShrink: 0, padding: "0 var(--pad)",
        display: "flex", alignItems: "center", gap: 8,
        borderBottom: "1px solid var(--line)", background: "var(--bg)",
      }}>
        <button style={ghostSmall}><I.Filter size={12}/> All domains</button>
        <button style={ghostSmall}>Layer: Logical</button>
        <div style={{ width: 1, height: 18, background: "var(--line)" }}/>
        <button style={ghostSmall}><I.Plus size={12}/> Add node</button>
        <button style={ghostSmall}><I.Link size={12}/> Connect</button>
        <div style={{ flex: 1 }}/>
        <div style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 11.5, color: "var(--ink-3)" }} className="mono">
          {Math.round(zoom * 100)}%
        </div>
        <div style={{ display: "flex", border: "1px solid var(--line)", borderRadius: 6, overflow: "hidden" }}>
          <button onClick={() => setZoom(z => Math.max(0.4, z - 0.1))} style={{ padding: "6px 10px", color: "var(--ink-2)" }}>−</button>
          <div style={{ width: 1, background: "var(--line)" }}/>
          <button onClick={() => { setZoom(0.85); setPan({x:0,y:20}); }} style={{ padding: "6px 10px", color: "var(--ink-2)", fontSize: 12 }}>Fit</button>
          <div style={{ width: 1, background: "var(--line)" }}/>
          <button onClick={() => setZoom(z => Math.min(1.6, z + 0.1))} style={{ padding: "6px 10px", color: "var(--ink-2)" }}>+</button>
        </div>
      </div>

      {/* Viewport */}
      <div
        onMouseDown={onMouseDown}
        onMouseMove={onMouseMove}
        onMouseUp={onMouseUp}
        onMouseLeave={onMouseUp}
        onWheel={onWheel}
        style={{
          flex: 1, position: "relative", overflow: "hidden",
          cursor: dragging ? "grabbing" : "grab",
          backgroundImage: `radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 0)`,
          backgroundSize: `${24 * zoom}px ${24 * zoom}px`,
          backgroundPosition: `${pan.x}px ${pan.y}px`,
        }}
      >
        <div style={{
          position: "absolute", top: 0, left: 0,
          transform: `translate(${pan.x}px, ${pan.y}px) scale(${zoom})`,
          transformOrigin: "0 0",
          width: 1300, height: 700,
        }}>
          {/* Edges */}
          <svg width="1300" height="700" style={{ position: "absolute", inset: 0, pointerEvents: "none", overflow: "visible" }}>
            <defs>
              <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0,0 L10,5 L0,10 z" fill="var(--ink-4)"/>
              </marker>
              <marker id="arrow-hl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
              </marker>
            </defs>
            {GRAPH.edges.map(([a, b], i) => {
              const from = nodeMap[a], to = nodeMap[b];
              if (!from || !to) return null;
              const hl = isHighlighted([a, b]);
              return (
                <path key={i} d={edgePath(from, to)}
                      fill="none"
                      stroke={hl ? "var(--accent)" : "var(--ink-4)"}
                      strokeWidth={hl ? 1.5 : 1}
                      opacity={sel || hover ? (hl ? 1 : 0.15) : 0.55}
                      markerEnd={`url(#${hl ? "arrow-hl" : "arrow"})`}
                      style={{ transition: "opacity 160ms, stroke 160ms, stroke-width 160ms" }}/>
              );
            })}
          </svg>

          {/* Nodes */}
          {nodes.map(n => {
            const k = nodeKinds[n.kind];
            const IC = I[k.icon];
            const isSel = sel === n.id;
            const dim = (sel || hover) && !isHighlightedNode(n.id, sel || hover);
            return (
              <div key={n.id} data-node
                   onMouseEnter={() => setHover(n.id)}
                   onMouseLeave={() => setHover(null)}
                   onClick={() => setSel(sel === n.id ? null : n.id)}
                   onDoubleClick={() => n.kind !== "goal" && n.kind !== "source" && onOpenDetail({ ref: n.id, name: n.label })}
                   style={{
                     position: "absolute", left: n.x, top: n.y,
                     width: NODE_W, height: NODE_H,
                     background: n.kind === "goal" ? "var(--ink)" : "var(--panel)",
                     color: n.kind === "goal" ? "var(--bg)" : "var(--ink)",
                     border: `1px solid ${isSel ? "var(--accent)" : k.border}`,
                     borderRadius: 10,
                     boxShadow: isSel ? `0 0 0 3px var(--accent-soft), var(--shadow-md)` : "var(--shadow-sm)",
                     padding: "10px 12px",
                     display: "flex", flexDirection: "column", gap: 3,
                     cursor: "pointer",
                     opacity: dim ? 0.3 : 1,
                     transition: "opacity 160ms, box-shadow 160ms, border-color 160ms",
                   }}>
                <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                  <span style={{
                    width: 18, height: 18, borderRadius: 5,
                    background: n.kind === "goal" ? "rgba(255,255,255,0.1)" : k.accent + "20",
                    color: n.kind === "goal" ? "var(--bg)" : k.accent,
                    display: "grid", placeItems: "center",
                  }}><IC size={11}/></span>
                  <span style={{ fontSize: 12.5, fontWeight: 500, letterSpacing: "-0.005em" }}>{n.label}</span>
                </div>
                <span className="mono" style={{ fontSize: 10, color: n.kind === "goal" ? "rgba(255,255,255,0.5)" : "var(--ink-4)", marginLeft: 24 }}>
                  {n.sub}
                </span>
              </div>
            );
          })}
        </div>

        {/* Legend */}
        <div style={{
          position: "absolute", left: 20, bottom: 20,
          background: "var(--panel)", border: "1px solid var(--line)",
          borderRadius: 10, padding: "12px 14px",
          display: "flex", flexDirection: "column", gap: 6,
          fontSize: 11.5, boxShadow: "var(--shadow-sm)",
        }}>
          <div style={{ fontSize: 10.5, color: "var(--ink-4)", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 2 }}>Legend</div>
          {[
            ["Source", "Source"], ["Dimension", "Dim"], ["Metric", "Metric"], ["Derived", "Metric"], ["North star", "Sparkle"],
          ].map(([l, ic]) => {
            const IC = I[ic];
            return (
              <div key={l} style={{ display: "flex", alignItems: "center", gap: 8, color: "var(--ink-2)" }}>
                <IC size={12} stroke={1.3}/><span>{l}</span>
              </div>
            );
          })}
        </div>

        {/* Inspector */}
        {sel && nodeMap[sel] && (
          <div style={{
            position: "absolute", right: 20, top: 20, bottom: 20,
            width: 320, background: "var(--panel)",
            border: "1px solid var(--line)", borderRadius: 12,
            boxShadow: "var(--shadow-md)",
            display: "flex", flexDirection: "column",
            overflow: "hidden",
          }}>
            <div style={{ padding: "16px 18px", borderBottom: "1px solid var(--line-2)", display: "flex", alignItems: "flex-start", gap: 10 }}>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 11, color: "var(--ink-3)", textTransform: "uppercase", letterSpacing: "0.08em" }}>{nodeMap[sel].kind}</div>
                <div style={{ fontSize: 16, fontWeight: 500, marginTop: 4, letterSpacing: "-0.01em" }}>{nodeMap[sel].label}</div>
                <div className="mono" style={{ fontSize: 11, color: "var(--ink-4)", marginTop: 4 }}>{nodeMap[sel].id}</div>
              </div>
              <button onClick={() => setSel(null)} style={iconBtn}><I.X size={13}/></button>
            </div>
            <div style={{ padding: "16px 18px", display: "flex", flexDirection: "column", gap: 14, fontSize: 12.5 }}>
              <InspectorRow label="Description" value="The definitive measure of recurring revenue, aggregated daily from billing events."/>
              <InspectorRow label="Owner" value="R. Okafor"/>
              <InspectorRow label="Dependencies" value={`${GRAPH.edges.filter(e => e[1] === sel).length} inputs · ${GRAPH.edges.filter(e => e[0] === sel).length} outputs`}/>
              <InspectorRow label="Last updated" value="2h ago"/>
            </div>
            <div style={{ padding: 14, marginTop: "auto", borderTop: "1px solid var(--line-2)", display: "flex", gap: 6 }}>
              <button onClick={() => onOpenDetail({ ref: sel, name: nodeMap[sel].label })} style={{ ...ghostBtn, flex: 1, justifyContent: "center" }}>
                <I.Eye size={12}/> Open
              </button>
              <button style={{ ...primaryBtn, flex: 1, justifyContent: "center" }}>
                <I.Edit size={12}/> Edit
              </button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function InspectorRow({ label, value }) {
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 3 }}>
      <div style={{ fontSize: 11, color: "var(--ink-4)", textTransform: "uppercase", letterSpacing: "0.06em" }}>{label}</div>
      <div style={{ color: "var(--ink-2)", lineHeight: 1.5 }}>{value}</div>
    </div>
  );
}

function isHighlightedNode(id, target) {
  if (id === target) return true;
  return GRAPH.edges.some(e => (e[0] === target && e[1] === id) || (e[1] === target && e[0] === id));
}

Object.assign(window, { Canvas });

                <th style={thStyle}>Grain</th>

                <th style={thStyle}>Updated</th>
              </tr>
            </thead>
            <tbody>
              {filtered.map((m, i) => {
                const d = FRAMEWORK.domains.find(x => x.id === m.domain);
                return (
                  <tr key={m.id} onClick={() => onOpenDetail(m)} style={rowStyle}>
                    <td style={{ ...tdStyle, fontWeight: 500 }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                        <StatusDot status={m.status}/>
                        {m.name}
                        <Pill tone={m.status === "certified" ? "positive" : m.status === "review" ? "warn" : "draft"}>{m.status}</Pill>
                      </div>
                    </td>
                    <td style={{ ...tdStyle, color: "var(--ink-3)" }} className="mono">{m.ref}</td>
                    <td style={tdStyle}>{m.type}</td>
                    <td style={tdStyle}>
                      <span style={{ display: "inline-flex", alignItems: "center", gap: 6 }}>
                        <span style={{ width: 6, height: 6, borderRadius: 2, background: `oklch(0.7 0.1 ${d.color})` }}/>
                        {d.name}
                      </span>
                    </td>
                    <td style={tdStyle}>{m.owner}</td>
                    <td style={tdStyle}>{m.grain}</td>
                    <td style={{ ...tdStyle, color: "var(--ink-3)" }} className="mono">{m.deps}</td>
                    <td style={{ ...tdStyle, color: "var(--ink-3)" }}>{m.updated}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        )}
        {tab === "dimensions" && (
          <table style={tableStyle}>
            <thead><tr>
              <th style={thStyle}>Name</th><th style={thStyle}>Ref</th>
              <th style={thStyle}>Source</th><th style={thStyle}>Cardinality</th>
            </tr></thead>
            <tbody>
              {filtered.map(d => (
                <tr key={d.id} style={rowStyle}>
                  <td style={{ ...tdStyle, fontWeight: 500 }}>{d.name}</td>
                  <td style={{ ...tdStyle, color: "var(--ink-3)" }} className="mono">{d.ref}</td>
                  <td style={tdStyle}>{d.source}</td>
                  <td style={{ ...tdStyle, color: "var(--ink-3)" }} className="mono">{d.cardinality}</td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
        {tab === "sources" && (
          <table style={tableStyle}>
            <thead><tr>
              <th style={thStyle}>Name</th><th style={thStyle}>Ref</th>
              <th style={thStyle}>Rows</th><th style={thStyle}>Last sync</th>
            </tr></thead>
            <tbody>
              {filtered.map(s => (
                <tr key={s.id} style={rowStyle}>
                  <td style={{ ...tdStyle, fontWeight: 500 }}>
                    <span style={{ display: "inline-flex", alignItems: "center", gap: 10 }}>
                      <StatusDot status="certified"/> {s.name}
                    </span>
                  </td>
                  <td style={{ ...tdStyle, color: "var(--ink-3)" }} className="mono">{s.ref}</td>
                  <td style={{ ...tdStyle, color: "var(--ink-3)" }} className="mono">{s.rows}</td>
                  <td style={tdStyle}>{s.lastSync}</td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>
    </div>
  );
}

const tableStyle = { width: "100%", borderCollapse: "collapse", fontSize: 13 };

  textAlign: "left", fontWeight: 500, fontSize: 11,

  );
}

// Wizard — create new element with AI assist
function Wizard({ open, onClose }) {
  const [step, setStep] = useState(0);
  const [kind, setKind] = useState("metric");
  const [prompt, setPrompt] = useState("");
  const [generating, setGenerating] = useState(false);
  const [draft, setDraft] = useState(null);

  useEffect(() => { if (!open) { setStep(0); setKind("metric"); setPrompt(""); setDraft(null); } }, [open]);

  const runAI = () => {
    setGenerating(true);
    setTimeout(() => {
      setGenerating(false);
      setDraft({
        name: prompt ? titleCase(prompt) : "Qualified Pipeline Velocity",
        ref: "met.growth." + slug(prompt || "qualified_pipeline_velocity"),
        domain: "Growth",
        type: "Ratio",
        grain: "week",
        unit: "USD/day",
        description: "Measures how quickly qualified opportunities convert to closed-won revenue, normalized by cycle length.",
        sql: `select
  week,
  sum(closed_won_arr) / nullif(avg(cycle_days), 0) as velocity
from {{ ref('fct_opportunities') }}
where stage in ('qualified','closed_won')
group by 1;`,
        sources: ["src.crm", "src.billing"],
      });
      setStep(2);
    }, 900);
  };

  if (!open) return null;

  return (
    <div onClick={onClose} style={{
      position: "fixed", inset: 0, zIndex: 90,
      background: "rgba(11,11,12,0.4)", backdropFilter: "blur(4px)",
      display: "grid", placeItems: "center", padding: 40,
    }}>
      <div onClick={e => e.stopPropagation()} style={{
        width: 720, maxWidth: "100%", maxHeight: "88vh",
        background: "var(--panel)", borderRadius: 14,
        border: "1px solid var(--line)", boxShadow: "var(--shadow-lg)",
        display: "flex", flexDirection: "column", overflow: "hidden",
      }}>
        {/* Stepper */}
        <div style={{ padding: "16px 24px", borderBottom: "1px solid var(--line-2)", display: "flex", alignItems: "center", gap: 12 }}>
          <div style={{ fontSize: 11, color: "var(--ink-4)", textTransform: "uppercase", letterSpacing: "0.08em" }}>New element</div>
          <div style={{ flex: 1, display: "flex", gap: 6 }}>
            {["Choose", "Describe", "Review"].map((s, i) => (
              <div key={s} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12,
                color: i === step ? "var(--ink)" : "var(--ink-4)", fontWeight: i === step ? 500 : 400 }}>
                <span style={{
                  width: 18, height: 18, borderRadius: 99,
                  background: i <= step ? "var(--accent)" : "var(--bg-2)",
                  color: i <= step ? "var(--accent-ink)" : "var(--ink-4)",
                  display: "grid", placeItems: "center", fontSize: 10, fontWeight: 600,
                }}>{i < step ? "✓" : i + 1}</span>
                {s}
                {i < 2 && <span style={{ width: 16, height: 1, background: "var(--line)", marginLeft: 4 }}/>}
              </div>
            ))}
          </div>
          <button onClick={onClose} style={iconBtn}><I.X size={14}/></button>
        </div>

        <div style={{ flex: 1, overflow: "auto", padding: 28 }}>
          {/* Step 0 */}
          {step === 0 && (
            <div>
              <h2 className="display" style={{ fontSize: 22, fontWeight: 500, margin: "0 0 6px", letterSpacing: "-0.02em" }}>What are you creating?</h2>
              <p style={{ color: "var(--ink-3)", margin: "0 0 22px", fontSize: 13.5 }}>
                Pick a primitive. You can always change type later.
              </p>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 12 }}>
                {[
                  { id: "metric",    icon: "Metric", label: "Metric",    desc: "A measurable number — count, sum, ratio or model." },
                  { id: "dimension", icon: "Dim",    label: "Dimension", desc: "A categorical slice — cohort, region, channel." },
                  { id: "source",    icon: "Source", label: "Source",    desc: "A connected upstream data source." },
                ].map(o => {
                  const IC = I[o.icon];
                  const active = kind === o.id;
                  return (
                    <button key={o.id} onClick={() => setKind(o.id)} style={{
                      padding: 16, borderRadius: 10,
                      border: `1px solid ${active ? "var(--accent)" : "var(--line)"}`,
                      boxShadow: active ? "0 0 0 3px var(--accent-soft)" : "none",
                      background: "var(--panel)", textAlign: "left",
                      display: "flex", flexDirection: "column", gap: 8,
                      transition: "all 120ms",
                    }}>
                      <IC size={18} stroke={1.5}/>
                      <div style={{ fontSize: 13.5, fontWeight: 500 }}>{o.label}</div>
                      <div style={{ fontSize: 12, color: "var(--ink-3)", lineHeight: 1.5 }}>{o.desc}</div>
                    </button>
                  );
                })}
              </div>
            </div>
          )}

          {/* Step 1 */}
          {step === 1 && (
            <div>
              <h2 className="display" style={{ fontSize: 22, fontWeight: 500, margin: "0 0 6px", letterSpacing: "-0.02em" }}>Describe your {kind}</h2>
              <p style={{ color: "var(--ink-3)", margin: "0 0 16px", fontSize: 13.5 }}>
                Studio will draft the definition, dependencies and SQL. You can edit anything afterwards.
              </p>
              <div style={{
                padding: 14, borderRadius: 10,
                border: "1px solid var(--line)",
                background: "var(--panel)",
              }}>
                <textarea value={prompt} onChange={e => setPrompt(e.target.value)}
                          placeholder={`e.g. "Velocity of qualified pipeline, weekly, for enterprise plan customers"`}
                          style={{
                            width: "100%", minHeight: 110, border: 0, outline: 0,
                            background: "transparent", fontSize: 14, lineHeight: 1.5, resize: "vertical",
                          }}/>
                <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 10, flexWrap: "wrap" }}>
                  <span style={{ fontSize: 11, color: "var(--ink-4)" }}>Try:</span>
                  {["Weekly activation by cohort", "Net new ARR per rep", "P50 support response time"].map(s => (
                    <button key={s} onClick={() => setPrompt(s)} style={{
                      fontSize: 11.5, padding: "4px 10px", borderRadius: 99,
                      border: "1px solid var(--line)", color: "var(--ink-2)",
                    }}>{s}</button>
                  ))}
                </div>
              </div>
              {generating && (
                <div style={{ marginTop: 14, padding: 12, borderRadius: 10, background: "var(--accent-soft)", color: "var(--accent)", fontSize: 12.5, display: "flex", alignItems: "center", gap: 8 }}>
                  <I.Sparkle size={13} stroke={1.8}/> Drafting definition and checking for duplicates…
                </div>
              )}
            </div>
          )}

          {/* Step 2 */}
          {step === 2 && draft && (
            <div>
              <div style={{ display: "flex", alignItems: "center", gap: 8, color: "oklch(0.52 0.14 150)", fontSize: 12, marginBottom: 8 }}>
                <I.Sparkle size={12} stroke={1.8}/> Draft ready — review and edit before saving.
              </div>
              <div className="mono" style={{ fontSize: 11, color: "var(--ink-4)" }}>{draft.ref}</div>
              <h2 className="display" style={{ fontSize: 26, fontWeight: 500, margin: "4px 0 12px", letterSpacing: "-0.02em" }}>{draft.name}</h2>
              <div style={{ color: "var(--ink-2)", fontSize: 13.5, lineHeight: 1.6, marginBottom: 18 }}>{draft.description}</div>

              <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 10, marginBottom: 18 }}>
                {[["Domain", draft.domain], ["Type", draft.type], ["Grain", draft.grain], ["Unit", draft.unit]].map(([k,v]) => (
                  <div key={k} style={{ padding: 10, border: "1px solid var(--line)", borderRadius: 8 }}>
                    <div style={{ fontSize: 10.5, color: "var(--ink-4)", textTransform: "uppercase", letterSpacing: "0.06em" }}>{k}</div>
                    <div style={{ fontSize: 13, fontWeight: 500, marginTop: 2 }}>{v}</div>
                  </div>
                ))}
              </div>

              <div style={{ fontSize: 11, color: "var(--ink-4)", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 6 }}>SQL</div>
              <pre className="mono" style={{
                margin: 0, padding: 14, borderRadius: 10,
                background: "var(--bg-2)", border: "1px solid var(--line)",
                fontSize: 12, lineHeight: 1.7, color: "var(--ink-2)", overflow: "auto",
              }}>{draft.sql}</pre>
            </div>
          )}
        </div>

        {/* Footer */}
        <div style={{ padding: "14px 20px", borderTop: "1px solid var(--line-2)", display: "flex", justifyContent: "space-between", gap: 8 }}>
          <button style={ghostBtn} onClick={() => step === 0 ? onClose() : setStep(step - 1)}>
            {step === 0 ? "Cancel" : "Back"}
          </button>
          {step === 0 && <button style={primaryBtn} onClick={() => setStep(1)}>Continue <I.ArrowR size={12}/></button>}
          {step === 1 && (
            <button style={primaryBtn} onClick={runAI} disabled={generating}>
              <I.Sparkle size={12} stroke={1.8}/> {generating ? "Drafting…" : "Generate draft"}
            </button>
          )}
          {step === 2 && <button style={primaryBtn} onClick={onClose}><I.Check size={12} stroke={2}/> Save to framework</button>}
        </div>
      </div>
    </div>
  );
}

function titleCase(s) { return s.replace(/\b\w/g, c => c.toUpperCase()); }
function slug(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "").slice(0, 40); }

// ───────── Mini chart primitives ─────────
function MiniLine({ data, color = "var(--accent)", refLine, height = 80 }) {
  const max = Math.max(...data.flat(), refLine ?? -Infinity);
  const min = Math.min(...data.flat(), refLine ?? Infinity);
  const range = (max - min) || 1;
  const W = 280;
  const series = Array.isArray(data[0]) ? data : [data];
  const colors = [color, "var(--ink-4)"];
  const yFor = v => height - ((v - min) / range) * (height - 8) - 4;
  return (
    <svg width="100%" viewBox={`0 0 ${W} ${height}`} preserveAspectRatio="none" style={{ display: "block" }}>
      {refLine != null && (
        <g>
          <line x1="0" x2={W} y1={yFor(refLine)} y2={yFor(refLine)}
                stroke="var(--ink-4)" strokeDasharray="3 3" strokeWidth="1" opacity="0.5"/>
          <text x={W-2} y={yFor(refLine)-3} textAnchor="end" fontSize="9" fill="var(--ink-4)" fontFamily="var(--font-mono)">Plan</text>
        </g>
      )}
      {series.map((s, si) => {
        const pts = s.map((v, i) => [(i / (s.length - 1)) * W, yFor(v)]);
        const d = "M" + pts.map(p => p.join(",")).join(" L");
        return <path key={si} d={d} fill="none" stroke={colors[si]} strokeWidth={si===0?1.6:1} strokeLinejoin="round" strokeLinecap="round" opacity={si===0?1:0.5}/>;
      })}
    </svg>
  );
}

function MiniWaterfall({ bars }) {
  const W = 280, H = 90;
  let cum = 0;
  const positions = bars.map(b => {
    if (b.type === "start" || b.type === "end") {
      const start = 0;
      const v = b.value;
      cum = b.type === "end" ? cum : v;
      return { ...b, start, top: v };
    }
    const start = cum;
    cum += b.value;
    return { ...b, start, top: cum };
  });
  const all = positions.flatMap(p => [p.start, p.top, p.value]);
  const max = Math.max(...all, 0);
  const min = Math.min(...all, 0);
  const range = (max - min) || 1;
  const yFor = v => H - ((v - min) / range) * (H - 16) - 8;
  const bw = (W - bars.length * 4) / bars.length;
  return (
    <svg width="100%" viewBox={`0 0 ${W} ${H+18}`} preserveAspectRatio="none" style={{ display: "block" }}>
      {positions.map((p, i) => {
        const x = i * (bw + 4);
        const isAnchor = p.type === "start" || p.type === "end";
        const y0 = isAnchor ? yFor(0) : yFor(p.start);
        const y1 = isAnchor ? yFor(p.top) : yFor(p.top);
        const top = Math.min(y0, y1), bot = Math.max(y0, y1);
        const fill = isAnchor ? "var(--ink)" : (p.value >= 0 ? "oklch(0.6 0.13 150)" : "oklch(0.6 0.15 30)");
        return (
          <g key={i}>
            <rect x={x} y={top} width={bw} height={Math.max(2, bot-top)} fill={fill} rx="1"/>
            <text x={x + bw/2} y={H+10} textAnchor="middle" fontSize="9" fill="var(--ink-3)" fontFamily="var(--font-mono)">{p.label}</text>
          </g>
        );
      })}
    </svg>
  );
}

function MiniHBar({ rows, max }) {
  const m = max || Math.max(...rows.map(r => Math.abs(r.value)));
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
      {rows.map((r, i) => {
        const w = (Math.abs(r.value) / m) * 100;
        const neg = r.value < 0;
        const color = r.color || (neg ? "oklch(0.6 0.15 30)" : "oklch(0.55 0.12 150)");
        return (
          <div key={i} style={{ display: "grid", gridTemplateColumns: "60px 1fr 50px", alignItems: "center", gap: 8, fontSize: 10.5 }}>
            <span style={{ color: "var(--ink-2)" }}>{r.label}</span>
            <div style={{ position: "relative", height: 10, background: "var(--bg-2)", borderRadius: 2 }}>
              <div style={{ position: neg ? "absolute" : "static", right: neg ? "50%" : "auto", left: neg ? "auto" : "50%", marginLeft: neg ? 0 : 0,
                            width: `${w/2}%`, height: "100%", background: color, borderRadius: 2 }}/>
              <div style={{ position: "absolute", left: "50%", top: 0, bottom: 0, width: 1, background: "var(--line)" }}/>
            </div>
            <span className="mono" style={{ color: "var(--ink-3)", textAlign: "right", fontSize: 10 }}>{r.value > 0 ? "+" : ""}{r.value.toFixed(1)}</span>
          </div>
        );
      })}
    </div>
  );
}

function MiniStack100({ rows }) {

    if (q && !(`${uc.title} ${uc.id} ${uc.question}`).toLowerCase().includes(q.toLowerCase())) return false;
    return true;
  }), [tier, bracket, q]);

  if (selected) return <UseCaseDetail uc={selected} onBack={() => setSelected(null)} onOpen={open}/>;

    <div style={{ padding: "var(--pad)", maxWidth: 1500, margin: "0 auto", width: "100%" }}>

      boxShadow: "var(--shadow-sm)",
    }}
    onMouseEnter={e => { e.currentTarget.style.borderColor = "var(--accent)"; e.currentTarget.style.boxShadow = "var(--shadow-md)"; e.currentTarget.style.transform = "translateY(-1px)"; }}
    onMouseLeave={e => { e.currentTarget.style.borderColor = "var(--line)"; e.currentTarget.style.boxShadow = "var(--shadow-sm)"; e.currentTarget.style.transform = "translateY(0)"; }}>
      {/* Mini preview */}
      <div style={{ height: 200, background: "var(--bg-2)", padding: 10, overflow: "hidden", position: "relative", borderBottom: "1px solid var(--line)" }}>
        <div style={{ transform: "scale(0.42)", transformOrigin: "top left", width: "238%", height: "238%", pointerEvents: "none" }}>
          <Renderer uc={uc}/>
        </div>
      </div>
      {/* Meta */}
      <div style={{ padding: 14, display: "flex", flexDirection: "column", gap: 6 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <span style={{ width: 6, height: 6, borderRadius: 99, background: `oklch(0.7 0.1 ${bracketColor})` }}/>
          <span className="mono" style={{ fontSize: 10.5, color: "var(--ink-4)", letterSpacing: "0.04em" }}>{uc.id} · {uc.bracket}</span>
          <div style={{ flex: 1 }}/>
          <TierBadge tier={uc.tier}/>
        </div>
        <div style={{ fontSize: 14.5, fontWeight: 500, letterSpacing: "-0.01em", lineHeight: 1.3 }}>{uc.title}</div>
        <div style={{ fontSize: 12, color: "var(--ink-3)", fontStyle: "italic", lineHeight: 1.4 }}>"{uc.question}"</div>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 4, fontSize: 11, color: "var(--ink-4)" }}>
          <span>{uc.owner}</span>
          <span>·</span>
          <span>{uc.freq}</span>
          <span style={{ flex: 1 }}/>
          <Pill tone={uc.status === "live" ? "positive" : uc.status === "review" ? "warn" : "draft"}>{uc.status}</Pill>
        </div>
      </div>
    </button>
  );
}

// ───────── Use Case Detail ─────────
function UseCaseDetail({ uc, onBack }) {
  const [tab, setTab] = useState("preview");
  const [activeTier, setActiveTier] = useState(uc.tier);
  const Renderer = TIER_RENDERER[activeTier];

  const tabs = [
    { id: "preview",   label: "Preview" },
    { id: "spec",      label: "Specification" },
    { id: "lineage",   label: "Lineage" },
    { id: "actions",   label: "Action Codes", count: uc.actions.length },
    { id: "history",   label: "History" },
  ];

  return (
    <div style={{ display: "flex", height: "100%", overflow: "hidden" }}>
      <div style={{ flex: 1, overflow: "auto" }}>
        <div style={{ padding: "var(--pad)", maxWidth: 1300, margin: "0 auto", width: "100%" }}>
          <button onClick={onBack} style={{ ...ghostSmall, marginBottom: 14, paddingLeft: 0 }}>
            <I.Chevron size={12} style={{ transform: "rotate(180deg)" }}/> Back to use cases
          </button>

          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8 }}>
            <span className="mono" style={{ fontSize: 11, color: "var(--ink-3)" }}>{uc.id}</span>
            <TierBadge tier={uc.tier} large/>
            <Pill tone={uc.status === "live" ? "positive" : uc.status === "review" ? "warn" : "draft"}>{uc.status}</Pill>
            <span style={{ fontSize: 12, color: "var(--ink-4)" }}>· {uc.bracket} · {uc.domain}</span>
          </div>

          <h1 className="display" style={{ fontSize: 36, margin: "0 0 8px", fontWeight: 500, letterSpacing: "-0.025em" }}>{uc.title}</h1>
          <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 14px", background: "var(--bg-2)", border: "1px solid var(--line)", borderLeft: "3px solid var(--accent)", borderRadius: 6, marginBottom: 18 }}>
            <span style={{ fontSize: 10, fontWeight: 700, color: "var(--accent)", textTransform: "uppercase", letterSpacing: "0.06em" }}>Decision</span>
            <span style={{ fontSize: 14, fontStyle: "italic", color: "var(--ink-2)" }}>{uc.question}</span>
          </div>

          {/* Tabs */}
          <div style={{ display: "flex", gap: 2, borderBottom: "1px solid var(--line)", marginBottom: 22 }}>
            {tabs.map(t => {
              const active = tab === t.id;
              return (
                <button key={t.id} onClick={() => setTab(t.id)} style={{
                  padding: "10px 14px", display: "flex", alignItems: "center", gap: 6,
                  fontSize: 13, color: active ? "var(--ink)" : "var(--ink-3)",
                  fontWeight: active ? 500 : 400,
                  borderBottom: `1.5px solid ${active ? "var(--accent)" : "transparent"}`,
                  marginBottom: -1,
                }}>
                  {t.label}
                  {t.count != null && (
                    <span className="mono" style={{ fontSize: 10, padding: "1px 6px", borderRadius: 99, background: "var(--hover)", color: "var(--ink-3)" }}>{t.count}</span>
                  )}
                </button>
              );
            })}
          </div>

          {tab === "preview" && (
            <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
              {/* Tier switcher — narrative path */}
              <div style={{ display: "flex", alignItems: "center", gap: 0, padding: "10px 12px", background: "var(--panel)", border: "1px solid var(--line)", borderRadius: 10 }}>
                <span style={{ fontSize: 11, color: "var(--ink-4)", textTransform: "uppercase", letterSpacing: "0.06em", marginRight: 12 }}>Decision flow</span>
                {Object.keys(TIERS).map((t, i) => {
                  const active = activeTier === t;
                  const isUcTier = uc.tier === t;
                  return (
                    <React.Fragment key={t}>
                      {i > 0 && <span style={{ color: "var(--ink-4)", margin: "0 4px" }}>→</span>}
                      <button onClick={() => setActiveTier(t)} style={{
                        padding: "5px 10px", borderRadius: 6, fontSize: 11,
                        background: active ? `oklch(0.7 0.1 ${TIERS[t].color} / 0.2)` : "transparent",
                        color: active ? `oklch(0.4 0.13 ${TIERS[t].color})` : "var(--ink-3)",
                        fontWeight: active ? 600 : 400,
                        border: isUcTier && !active ? `1px dashed oklch(0.7 0.1 ${TIERS[t].color} / 0.5)` : "1px solid transparent",
                        position: "relative",
                      }} className="mono">
                        {t} · {TIERS[t].time}
                      </button>
                    </React.Fragment>
                  );
                })}
                <div style={{ flex: 1 }}/>
                <button style={ghostSmall}><I.Eye size={12}/> Open full</button>
                <button style={{ ...ghostSmall, marginLeft: 4 }}><I.Edit size={12}/> Edit layout</button>
              </div>

              <Renderer uc={uc}/>

                <div style={{ fontSize: 11, color: "var(--ink-4)", textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 10 }}>Tier validation</div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, fontSize: 12.5 }}>
                  {[
                    { ok: true,  text: `KPI band — ${activeTier === "T1" ? "5" : "4"} cards, full width` },
                    { ok: true,  text: "Slicer bar within Pulse limit (≤3 slicers)" },
                    { ok: activeTier !== "T1", text: "Variance/waterfall reconciles to total Δ" },
                    { ok: activeTier === "T4", text: "Action panel mandatory for T4" },
                    { ok: true,  text: "Decision question matches tier-time hierarchy" },
                    { ok: activeTier !== "T1" || true, text: "Strategic signal — no owner, no steps" },
                  ].map((v, i) => (
                    <div key={i} style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      <span style={{ width: 14, height: 14, borderRadius: 99, background: v.ok ? "oklch(0.92 0.08 150)" : "oklch(0.92 0.08 30)", color: v.ok ? "oklch(0.4 0.14 150)" : "oklch(0.4 0.16 30)", display: "grid", placeItems: "center", fontSize: 9, fontWeight: 700 }}>
                        {v.ok ? "✓" : "!"}
                      </span>
                      <span style={{ color: "var(--ink-2)" }}>{v.text}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {tab === "spec" && (
            <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
              <div style={{ background: "var(--panel)", border: "1px solid var(--line)", borderRadius: 10 }}>
                <div style={cardHead}><div style={cardTitle}>Use case specification</div><span className="mono" style={{ fontSize: 11, color: "var(--ink-4)" }}>YAML</span></div>
                <pre className="mono" style={{ margin: 0, padding: "var(--pad)", fontSize: 12, lineHeight: 1.7, background: "var(--bg-2)", color: "var(--ink-2)", overflow: "auto" }}>
{`id: ${uc.id}
title: "${uc.title}"
bracket: ${uc.bracket}
domain: ${uc.domain}
tier: ${uc.tier}
decision_question: |
  ${uc.question}
audience: ${uc.audience}
owner: ${uc.owner}
frequency: ${uc.freq}
metrics:
  primary: [met.commercial.net_sales, met.commercial.gm_pct]
  secondary: [met.commercial.volume, met.commercial.asp]
dimensions: [dim.region, dim.segment, dim.period]
slicers: [Period, Region, ${uc.tier === "T4" ? "Priority" : "Business Unit"}]
action_codes:
${uc.actions.map(a => `  - ${a}`).join("\n") || "  []"}
status: ${uc.status}`}
                </pre>
              </div>
            </div>
          )}

          {tab === "lineage" && (
            <div style={{ background: "var(--panel)", border: "1px solid var(--line)", borderRadius: 10, padding: "var(--pad)" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 14, marginBottom: 18 }}>
                <span className="mono" style={{ fontSize: 11, color: "var(--ink-4)", textTransform: "uppercase" }}>Sources</span>
                <span style={{ flex: 1, height: 1, background: "var(--line)" }}/>
                <span className="mono" style={{ fontSize: 11, color: "var(--ink-4)" }}>Metrics</span>
                <span style={{ flex: 1, height: 1, background: "var(--line)" }}/>
                <span className="mono" style={{ fontSize: 11, color: "var(--ink-4)" }}>This use case</span>
                <span style={{ flex: 1, height: 1, background: "var(--line)" }}/>
                <span className="mono" style={{ fontSize: 11, color: "var(--ink-4)" }}>Actions</span>
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 16 }}>
                {[
                  ["src.billing", "src.crm", "src.events"],
                  ["met.commercial.net_sales", "met.commercial.gm_pct", "met.commercial.volume"],
                  [uc.id + " · " + uc.title],
                  uc.actions.length ? uc.actions : ["—"],
                ].map((col, i) => (
                  <div key={i} style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                    {col.map(item => (
                      <div key={item} style={{
                        padding: "10px 12px", background: i === 2 ? "var(--ink)" : "var(--bg-2)",
                        color: i === 2 ? "var(--bg)" : "var(--ink-2)",
                        border: "1px solid var(--line)",
                        borderRadius: 6, fontSize: 12, fontFamily: i === 2 ? "var(--font-ui)" : "var(--font-mono)",
                        fontWeight: i === 2 ? 500 : 400,
                      }}>
                        {item}
                      </div>
                    ))}
                  </div>
                ))}
              </div>
            </div>
          )}

          {tab === "actions" && (
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {uc.actions.length === 0 && (
                <div style={{ padding: 28, textAlign: "center", color: "var(--ink-3)", border: "1px dashed var(--line)", borderRadius: 10, fontSize: 13 }}>
                  No action codes linked. Add one to make this a T4 use case.
                </div>
              )}
              {uc.actions.map(aId => {
                const a = ACTION_CODES.find(x => x.id === aId);
                if (!a) return null;
                return (
                  <div key={aId} style={{ background: "var(--panel)", border: "1px solid var(--line)", borderRadius: 10, padding: "var(--pad)" }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8 }}>
                      <span className="mono" style={{ fontSize: 11, fontWeight: 700, color: "var(--accent)", background: "var(--accent-soft)", padding: "3px 8px", borderRadius: 4 }}>{a.id}</span>
                      <span style={{ fontSize: 14, fontWeight: 500 }}>{a.name}</span>
                      <div style={{ flex: 1 }}/>
                      <Pill tone={a.priority === "Critical" ? "warn" : a.priority === "High" ? "accent" : "neutral"}>{a.priority}</Pill>
                    </div>
                    <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 14, marginTop: 10 }}>
                      <PropPair label="Trigger" value={a.trigger} mono/>
                      <PropPair label="Owner" value={a.owner}/>
                      <PropPair label="Impact" value={a.impact} bold/>
                      <PropPair label="Active instances" value={a.active}/>
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {tab === "history" && (
            <div style={{ background: "var(--panel)", border: "1px solid var(--line)", borderRadius: 10, padding: "6px 0" }}>
              {[
                ["A. Haferkorn", `published v1.2 to ${uc.audience}`, uc.updated],
                ["R. Okafor",    "added action code C-M1.1",         "2d ago"],
                ["L. Chen",      "validated tier classification",    "5d ago"],
                ["M. Park",      `created use case ${uc.id}`,        "2w ago"],
              ].map((e, i) => (
                <div key={i} style={{ padding: "12px var(--pad)", borderTop: i === 0 ? "none" : "1px solid var(--line-2)", display: "flex", alignItems: "center", gap: 12 }}>
                  <I.Clock size={13}/>
                  <div style={{ fontSize: 13, flex: 1 }}>
                    <span style={{ fontWeight: 500 }}>{e[0]}</span>
                    <span style={{ color: "var(--ink-3)" }}> {e[1]}</span>
                  </div>
                  <span style={{ fontSize: 11.5, color: "var(--ink-4)" }}>{e[2]}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>

      {/* Right rail */}
      <aside style={{ width: 300, flexShrink: 0, borderLeft: "1px solid var(--line)", padding: "var(--pad)", overflow: "auto", background: "var(--bg)" }}>
        <div style={{ fontSize: 11, color: "var(--ink-4)", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 12 }}>Properties</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 14, fontSize: 12.5 }}>
          <PropRow label="Tier"><TierBadge tier={uc.tier}/></PropRow>
          <PropRow label="Bracket"><Pill>{uc.bracket}</Pill></PropRow>
          <PropRow label="Domain">{uc.domain}</PropRow>
          <PropRow label="Owner"><OwnerChip name={uc.owner}/></PropRow>
          <PropRow label="Audience">{uc.audience}</PropRow>
          <PropRow label="Frequency">{uc.freq}</PropRow>
          <PropRow label="Last updated">{uc.updated}</PropRow>
        </div>

        <div style={{ margin: "24px 0 12px", fontSize: 11, color: "var(--ink-4)", textTransform: "uppercase", letterSpacing: "0.08em" }}>
          Decision-time hierarchy
        </div>
        <div style={{ background: "var(--bg-2)", border: "1px solid var(--line)", borderRadius: 10, padding: 12, fontSize: 11.5, lineHeight: 1.5 }}>
          A <strong>{uc.tier}</strong> use case must answer its decision in
          <span style={{ color: "var(--accent)", fontWeight: 600 }}> {TIERS[uc.tier].time} </span>
          for <strong>{TIERS[uc.tier].audience}</strong>.
          <div style={{ marginTop: 8, color: "var(--ink-3)", fontSize: 11 }}>
            Pulse principle: 3s read → 30s scan → 5min investigate → 30min decide.
          </div>
        </div>

        <div style={{ margin: "24px 0 12px", fontSize: 11, color: "var(--ink-4)", textTransform: "uppercase", letterSpacing: "0.08em" }}>
          Studio AI
        </div>
        <div style={{ padding: 14, borderRadius: 10, background: "linear-gradient(180deg, var(--accent-soft), transparent)", border: "1px solid var(--line)" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 8, fontSize: 12 }}>
            <I.Sparkle size={12} stroke={1.8}/><span style={{ fontWeight: 500 }}>Suggestion</span>
          </div>
          <div style={{ fontSize: 12.5, color: "var(--ink-2)", lineHeight: 1.5, marginBottom: 10 }}>
            {uc.tier === "T1" || uc.tier === "T2"
              ? "This use case escalates to a T4 prescriptive layer. Want me to draft the recommended actions?"
              : "Detected 3 candidate metrics not yet linked. Auto-add to the spec?"}
          </div>
          <button style={{ ...primaryBtn, width: "100%", justifyContent: "center" }}>Review draft</button>
        </div>
      </aside>
    </div>
  );
}

function PropPair({ label, value, mono, bold }) {
  return (
    <div>
      <div style={{ fontSize: 10.5, color: "var(--ink-4)", textTransform: "uppercase", letterSpacing: "0.06em" }}>{label}</div>
      <div style={{ fontSize: 12.5, marginTop: 3, fontFamily: mono ? "var(--font-mono)" : "var(--font-ui)", fontWeight: bold ? 600 : 400, color: bold ? "oklch(0.5 0.13 150)" : "var(--ink-2)" }}>{value}</div>
    </div>
  );
}



// ======== src/app.jsx ========
// App — root component, routing, tweaks state, Tweaks host protocol
function App() {
  const [tweaks, setTweaks] = useState(window.__TWEAKS__);
  const [route, setRoute] = useState("dashboard");
  const [detailMetric, setDetailMetric] = useState(null);
  const [cmdOpen, setCmdOpen] = useState(false);
  const [wizardOpen, setWizardOpen] = useState(false);
  const [tweaksOpen, setTweaksOpen] = useState(false);
  const [editMode, setEditMode] = useState(false);
  const [sidebarCollapsed, setSidebarCollapsed] = useState(tweaks.sidebar === "collapsed");

  useEffect(() => { setSidebarCollapsed(tweaks.sidebar === "collapsed"); }, [tweaks.sidebar]);

  // Apply tweaks to root element
  useEffect(() => {
    const r = document.documentElement;
    r.dataset.theme = tweaks.theme;
    r.dataset.density = tweaks.density;
    r.dataset.fonts = tweaks.fontPairing;
    r.style.setProperty("--accent", `oklch(${tweaks.accentLightness ?? 0.62} ${tweaks.accentChroma ?? 0.13} ${tweaks.accentHue})`);
    r.style.setProperty("--accent-soft", `oklch(${tweaks.accentLightness ?? 0.62} ${tweaks.accentChroma ?? 0.13} ${tweaks.accentHue} / 0.14)`);
    r.style.setProperty("--accent-ink", tweaks.theme === "dark" ? `oklch(0.12 0.02 ${tweaks.accentHue})` : `oklch(0.98 0.01 ${tweaks.accentHue})`);
  }, [tweaks]);

  const setTweak = useCallback((k, v) => {
    setTweaks(t => {
      const next = { ...t, [k]: v };
      // persist
      window.parent?.postMessage({ type: "__edit_mode_set_keys", edits: { [k]: v } }, "*");
      return next;
    });
  }, []);

  // Edit mode protocol
  useEffect(() => {
    const onMsg = (e) => {
      if (e.data?.type === "__activate_edit_mode")   { setEditMode(true); setTweaksOpen(true); }
      if (e.data?.type === "__deactivate_edit_mode") { setEditMode(false); setTweaksOpen(false); }
    };
    window.addEventListener("message", onMsg);
    window.parent?.postMessage({ type: "__edit_mode_available" }, "*");
    return () => window.removeEventListener("message", onMsg);
  }, []);

  // Keybinds
  useEffect(() => {
    const onKey = (e) => {
      const mod = e.metaKey || e.ctrlKey;
      if (mod && e.key.toLowerCase() === "k") { e.preventDefault(); setCmdOpen(o => !o); }
      else if (e.key.toLowerCase() === "n" && !e.target.matches("input,textarea")) { setWizardOpen(true); }
      else if (e.key === "Escape") { setCmdOpen(false); setWizardOpen(false); }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  const openDetail = (m) => { setDetailMetric(m); setRoute("detail"); };

  return (
    <div style={{ height: "100vh", display: "flex", overflow: "hidden" }}>
      <Sidebar route={route} setRoute={setRoute}
               collapsed={sidebarCollapsed}
               setCollapsed={(v) => { setSidebarCollapsed(v); setTweak("sidebar", v ? "collapsed" : "expanded"); }}
               onNew={() => setWizardOpen(true)}
               onCmd={() => setCmdOpen(true)}/>

      <main style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden", minWidth: 0, background: "var(--bg)" }}>
        <Topbar route={route}
                onCmd={() => setCmdOpen(true)}
                onToggleTweaks={() => setTweaksOpen(o => !o)}/>
        <div style={{ flex: 1, overflow: "auto" }}>
          {route === "dashboard" && <Dashboard onOpenDetail={openDetail}/>}
          {route === "canvas"    && <Canvas onOpenDetail={openDetail}/>}
          {route === "library"   && <Library onOpenDetail={openDetail}/>}
          {route === "usecases"  && <UseCases open={openDetail}/>}
          {route === "detail"    && <Detail metric={detailMetric} onBack={() => setRoute("library")}/>}
        </div>
      </main>

      <CommandPalette open={cmdOpen} onClose={() => setCmdOpen(false)} onNav={setRoute}/>
      <Wizard open={wizardOpen} onClose={() => setWizardOpen(false)}/>
      <Tweaks open={tweaksOpen} onClose={() => setTweaksOpen(false)} tweaks={tweaks} setTweak={setTweak}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);


</script>
