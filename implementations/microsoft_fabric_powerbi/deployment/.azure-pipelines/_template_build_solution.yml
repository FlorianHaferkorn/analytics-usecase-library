# Build Solution Template
# Reusable template for building and validating solution artifacts

parameters:
  - name: environments
    type: string
    default: 'dev,tst,prd'
    displayName: 'Environments to build for'

jobs:
  - job: Build
    displayName: 'Build Solution'
    pool:
      vmImage: 'windows-latest'
    
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: 1
    
    steps:
      - checkout: self
        displayName: 'Checkout repository'
      
      - task: UsePythonVersion@0
        displayName: 'Set up Python'
        inputs:
          versionSpec: '3.12'
      
      - script: |
          python -m pip install --upgrade pip
          pip install -r implementations/microsoft_fabric_powerbi/deployment/resources/requirements.txt
        displayName: 'Install Python dependencies'
        workingDirectory: implementations/microsoft_fabric_powerbi/deployment
      
      - task: PowerShell@2
        displayName: 'Run Stage 1 validation'
        inputs:
          targetType: 'filePath'
          filePath: '$(System.DefaultWorkingDirectory)/_internal/tools/run_stage1_checks.ps1'
          pwsh: true
        continueOnError: false
      
      - task: PowerShell@2
        displayName: 'Run Fabric checks'
        inputs:
          targetType: 'filePath'
          filePath: '$(System.DefaultWorkingDirectory)/implementations/microsoft_fabric_powerbi/tools/run_fabric_checks.ps1'
          pwsh: true
        continueOnError: false
        condition: succeeded()
      
      - script: |
          python implementations/microsoft_fabric_powerbi/deployment/scripts/utils_build_parameter_file.py --environments ${{ parameters.environments }}
        displayName: 'Build parameter files'
        workingDirectory: $(System.DefaultWorkingDirectory)
        condition: succeeded()
      
      - task: PublishPipelineArtifact@1
        displayName: 'Upload solution artifacts'
        inputs:
          targetPath: '$(System.DefaultWorkingDirectory)'
          artifactName: 'solution'
          publishLocation: 'pipeline'
      
      - task: PublishPipelineArtifact@1
        displayName: 'Upload automation artifacts'
        inputs:
          targetPath: 'implementations/microsoft_fabric_powerbi/deployment'
          artifactName: 'automation'
          publishLocation: 'pipeline'
