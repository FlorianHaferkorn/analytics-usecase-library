t","owner":"Head of Marketing Controlling","completeness":"1.0","useCases":["COM-002","COM-003","COM-004"],"actionCodes":["C-P4.1"]},"sales.promo.incremental.amount":{"id":"sales.promo.incremental.amount","key":"Incremental Sales Amount","type":"diagnostic","role":"supporting","dimension":"Profitability","purpose":"Additional sales due to promotion.","definition":"Promo Sales Amount - Baseline Sales Amount","grain":"Promo period/product","unit":"EUR (2 decimals)","interpretation":"Input to promo ROI.","dax":"Incremental Sales Amount","owner":"Head of Marketing Controlling","completeness":"1.0","useCases":["COM-002","COM-003","COM-004"],"actionCodes":["C-P4.1"]},"margin.cogs.pct":{"id":"margin.cogs.pct","key":"COGS % of Sales","type":"diagnostic","role":"supporting","dimension":"Profitability","purpose":"Shows cost share relative to net sales.","definition":"COGS Amount / Net Sales Amount.","grain":"Invoice line aggregated to period.","unit":"% (1 decimal)","interpretation":"Lower is better; complements gross margin %.","dax":"COGS % of Sales","owner":"Head of Controlling","completeness":"0.8","useCases":["FIN-002"],"actionCodes":["F-K2.1"]},"margin.gm.vs_plan.pct":{"id":"margin.gm.vs_plan.pct","key":"Gross Margin % vs Plan","type":"diagnostic","role":"supporting","dimension":"Profitability","purpose":"Measures gross margin rate variance versus plan.","definition":"(Gross Margin % - Plan Gross Margin %) / Plan Gross Margin %.","grain":"Company/segment; monthly.","unit":"% (1 decimal)","interpretation":"Positive values indicate better-than-plan margin.","dax":"Gross Margin % vs Plan","owner":"Head of Controlling","completeness":"0.8","useCases":["COM-002"],"actionCodes":[]},"cost.base_volume.amount":{"id":"cost.base_volume.amount","key":"Cost Base Volume Amount","type":"diagnostic","role":"supporting","dimension":"Profitability","purpose":"Baseline cost volume used for variance analysis.","definition":"Baseline amount of cost volume for the selected period.","grain":" window.__FS_DATA__  = {"COM-001":{"id":"COM-001","purpose":"Explain Net Sales performance vs Plan and vs Last Year by price,\nvolume, mix, and channel/region to protect revenue and margin.","value":"Faster detection of revenue gaps; targeted pricing and mix\nactions to stabilise gross margin; focus resources on the most material\nregions/channels.","outOfScope":"Promotion ROI deep dives (COM-004); detailed margin leakage\ndiagnostics (COM-002); pipeline/win-loss (COM-010).\n\n---","questions":["Where do Net Sales deviate most vs Plan and vs LY by region, channel, and","What is the contribution of price, volume, and mix to the Net Sales gap?","Which customer or product segments drive negative gross margin %?","Which actions (pricing, mix, volume activation) close the largest gaps","How persistent are the gaps over the last 3 months and current quarter?"],"owner":"CCO / Head of Sales","kpiOwner":"Commercial Controlling Lead","decisionOwner":"Sales Leadership Team","reportingLevel":"Tactical","stage":"Descriptive / Diagnostic","layer3s":"- Net Sales Amount  \n- Net Sales % vs Plan  \n- Net Sales % vs LY  \n- Gross Margin %  \n- Price/Volume/Mix Effects (cards or mini-tiles)","success":"- Impact: Net Sales vs Plan/LY gaps reduced; GM % at or above target.\n- Adoption: Used in monthly sales performance reviews; actions tracked via\n  Action Codes.\n- Quality: PVM residual within tolerance; reconciled to source totals;\n  definitions consistent with COM-002/004.\n- Decision Frequency: Mon"},"COM-002":{"id":"COM-002","purpose":"Protect and improve gross margin by explaining leakage across price realization, mix, and unit cost.","value":"+0.5-1.5 pp GM%, tighter discount discipline, clearer mix levers, faster correction of cost leakage.","outOfScope":"Long-term list price strategy; promo ROI (COM-004); channel mix strategy (COM-009).\n\n---","questions":["Where is gross margin eroding vs Plan and vs LY by region/channel/product?","Which products/channels/regions drive negat ount  \n- NPS Score  \n- Customer Complaints Count","success":"- Impact: CLV uplift in priority segments; churn reduced vs target; margin improvement on low-margin high-revenue accounts.  \n- Adoption: Used in monthly account/retention reviews; action codes triggered with <5% false positives.  \n- Quality: KPI definitions consistent across COM-001/002/003; reconc"},"COM-004":{"id":"COM-004","purpose":"Improve promotion ROI by measuring true incremental sales and margin, controlling leakage, and optimising promo mechanics.","value":"Fewer unprofitable promos; higher incremental GM; better channel/product targeting; reduced cannibalization.","outOfScope":"Long-term pricing strategy (COM-002); assortment optimisation; omni-channel mix (COM-009).\n\n---","questions":["Which promotions generated true incremental sales and gross margin?","Which channels/products deliver the highest promo ROI and uplift?","How much did discounts erode price realization and GM?","What promo depth/timing/mechanics should we standardize or stop?","Where do cannibalization or leakage offset uplift?"],"owner":"CMO / Trade Marketing Lead","kpiOwner":"Revenue Growth Management / Commercial Controlling","decisionOwner":"Sales & Marketing Leadership","reportingLevel":"Tactical","stage":"Diagnostic / Prescriptive","layer3s":"- Promotion ROI %  \n- Incremental Sales Amount  \n- Promo Gross Margin %  \n- Price Realization %  \n- Cannibalization %","success":"- Impact: Higher promo ROI (>=120%), higher incremental GM, reduced cannibalization.\n- Adoption: Used in promo/post-event reviews; actions logged via Action Codes.\n- Quality: Uplift and ROI reconcile to baseline and costs; definitions aligned with COM-001/002.\n- Decision Frequency: Promo cycle (pre/"},"FIN-001":{"id":"FIN-001","purpose":"Control cash and liquidity by monitoring balances, operating cash\nflow, and working capital drivers (DSO, DIO, DPO, CCC).","value":"Better liquidity visibility, reduced financing needs, faster\ncash conversion, and improved resilience.","outOfScope":"Credit risk scoring (COR-016); investment/CapEx tracking\n(COR-009); supply chain OTIF specifics (SCM-002).\n\n---","questions":["What is the cash position vs plan and how is OCF trending?","How do DSO, DIO, DPO and CCC develop by region/entity?","Which customers/suppliers drive cash conversion issues?","What actions improve cash quickly with minimal business risk?","\"Which regions/entities have CCC above target and DSO deteriorating?\"  "],"owner":"CFO / Treasury Lead","kpiOwner":"Treasury / Finance Controlling","decisionOwner":"Finance Leadership Team","reportingLevel":"Tactical","stage":"Diagnostic / Predictive","layer3s":"- Cash Balance  \n- Cash vs Plan %  \n- OCF  \n- CCC (days)  \n- DSO / DIO / DPO","success":"- Impact: Positive cash vs plan; CCC reduced toward target; DSO/DIO down and DPO\n  optimized.  \n- Adoption: Used in monthly treasury/WC reviews; action codes triggered with <5%\n  false positives.  \n- Quality: KPI definitions consistent across finance and supply chain;\n  reconciled to source totals. "},"FIN-002":{"id":"FIN-002","purpose":"Reduce unit cost and improve margin by controlling material, labor, and OpEx vs plan.","value":"Better cost competitiveness, margin protection, and more efficient operations without sacrificing throughput/quality.","outOfScope":"Detailed OEE/performance tuning (OPS-001); supplier PPV specifics (OPS-002); logistics cost ratio (OPS-009).\n\n---","questions":["What is unit cost vs plan/LY by plant/line/product?","Which cost buckets (material, labor, overhead/OpEx) drive variance?","Where is COGS % rising and margin eroding?","Which actions reduce cost fastest without harming service/quality?","\"Which plants have unit cost above plan and margin below target in the last quarter?\""],"owner":"CFO / Ops Finance Lead","kpiOwner":"Plant/Ops Controllers","decisionOwner":"Finance & Operations Leadership","reportingLevel":"Tactical","stage":"Diagnostic / Prescriptive","layer3s":"- Un function getChatResponse(q,mode){
  if(mode==="validate"){
    const gaps=USE_CASES.filter(u=>u.status==="gap");
    return `**Framework-Validierung**\n\n${gaps.length} Use Cases haben Lücken:\n\n${gaps.map(u=>`• **${u.id}** — ${u.confidence}% vollständig`).join("\n")}\n\n**Top-3 Prioritäten:**\n1. FIN-001 / FIN-002 — Finance kritisch für Q2\n2. OPS-001/002/003 — Synthetic Data fehlt\n3. COM-004 — Trade Marketing Anbindung offen`;
  }
  if(mode==="complete"){
    return `**Vervollständigungs-Vorschläge:**\n\n✨ **FIN-001** — DAX-Measures fehlen:\n• PotentialSavingsEUR\n• RealizedSavingsEUR\n\n✨ **OPS-001/002/003** — Lakehouse-Setup:\n• 3 Fact Tables benötigt\n\n✨ **COM-004** — Data Contract:\n• Trade-Marketing-System noch nicht verknüpft`;
  }
  const ql=q.toLowerCase();
  const kpis=window.__KPI_DATA__;
  // Find matching KPI
  for(const [kid,kd] of Object.entries(kpis)){
    if(ql.includes(kid)||ql.includes(kd.key.toLowerCase())){
      return `**${kd.key}** (\`${kid}\`)\n\n**Typ:** ${kd.type} · **Rolle:** ${kd.role}\n\n**Zweck:** ${kd.purpose}\n\n**Definition:** ${kd.definition}\n\n**Einheit:** ${kd.unit}\n\n**Verknüpfte Use Cases:** ${kd.useCases.join(", ")||"—"}`;
    }
  }
  const fs=window.__FS_DATA__;
  for(const [ucid,fsd] of Object.entries(fs)){
    if(ql.includes(ucid.toLowerCase())||ql.includes(fsd.purpose.toLowerCase().slice(0,20))){
      return `**${ucid}** — Business Factsheet\n\n**Zweck:** ${fsd.purpose}\n\n**Business Value:** ${fsd.value}\n\n**Kernfragen:**\n${fsd.questions.slice(0,3).map(q=>`• ${q}`).join("\n")}\n\n**Reporting Level:** ${fsd.reportingLevel} · **Stage:** ${fsd.stage}`;
    }
  }
  if(ql.includes("framework")||ql.includes("golden thread"))
    return "**Analytics Use Case Library**\n\nGolden Thread: Strategie → KPIs → Use Cases → Semantic Models → Reports → Actions\n\n**Stand:** 15 Use Cases · 107 KPIs · 53 Action Codes\n\n**Domains:** Commercial ✅ · Finance ⚠️ · Operations ⚠️ · Supply Chain ✅ · Experience ✅ · Executive ✅\n\nKlicke auf einen Knoten im Tree oder eine Use Case Karte für interaktive Details.";
  return "Ich helfe bei:\n\n• **KPIs** — z.B. `margin.gm.pct`, `wc.ccc.days`, `ops.oee.pct`\n• **Use Cases** — z.B. `COM-001`, `FIN-001`\n• **Framework** — Überblick über den Golden Thread\n\nOder wechsle zu *Ergänze* / *Validiere* für strukturierte Analysen.";
}

// ── Value Driver Tree ──────────────────────────────────────────────────────
function ValueDriverTree({dark,onNodeClick,hlIds}){
  const svgRef=useRef(null);
  const wrapRef=useRef(null);
  useEffect(()=>{
    if(!svgRef.current||!wrapRef.current)return;
    const W=wrapRef.current.clientWidth||700;
    const H=480;
    d3.select(svgRef.current).selectAll("*").remove();
    const svg=d3.select(svgRef.current).attr("width",W).attr("height",H);
    const root=d3.hierarchy(TREE);
    d3.tree().size([H-80,W-280])(root);
    const g=svg.append("g").attr("transform","translate(110,40)");
    // defs glow
    const defs=svg.append("defs");
    const glow=defs.append("filter").attr("id","glow");
    glow.append("feGaussianBlur").attr("stdDeviation","3.5").attr("result","blur");
    const m=glow.append("feMerge");
    m.append("feMergeNode").attr("in","blur");
    m.append("feMergeNode").attr("in","SourceGraphic");
    // links
    g.selectAll(".lk").data(root.links()).enter().append("path")
      .attr("fill","none")
      .attr("stroke",dark?"rgba(196,201,210,0.13)":"rgba(19,41,75,0.11)")
      .attr("stroke-width",1.5)
      .attr("d",d3.linkHorizontal().x(d=>d.y).y(d=>d.x));
    // nodes
    const nd=g.selectAll(".n").data(root.descendants()).enter().append("g")
      .attr("transform",d=>`translate(${d.y},${d.x})`)
      .style("cursor","pointer")
      .on("click",(e,d)=>{if(onNodeClick)onNodeClick(d.data);});
    nd.each(function(d){
      const el=d3.select(this);
      const hl=hlIds&&hlIds.includes(d.data.id);
      const c=d.data.color||B.mint;
      const t=d.data.type;
      if(t==="root"){
        el.append("rect").attr("x",-56).attr("y",-15).attr("width",112).attr("height",30).attr("rx",15)
          .attr("fill",B.nightfall).attr("stroke",B.mint).attr("stroke-width",2)
          .attr("filter",hl?"url(#glow)":null);
        el.append("text").attr("y",5).attr("text-anchor","middle")
          .attr("font-family","'Barlow Condensed',sans-serif").attr("font-size","12px").attr("font-weight","800")
          .attr("fill",B.mint).text(d.data.label);
      }else if(t==="strategy"){
        el.append("rect").attr("x",-54).attr("y",-13).attr("width",108).attr("height",26).attr("rx",7)
          .attr("fill",c).attr("fill-opacity",dark?.2:.12)
          .attr("stroke",c).attr("stroke-width",hl?2.5:1.5)
          .attr("filter",hl?"url(#glow)":null);
        el.append("text").attr("y",5).attr("text-anchor","middle")
          .attr("font-family","'Barlow Condensed',sans-serif").attr("font-size","11px").attr("font-weight","700")
          .attr("fill",dark?c:B.nightfall)
          .text(d.data.label.length>15?d.data.label.slice(0,14)+"…":d.data.label);
      }else if(t==="kpi"){
        el.append("circle").attr("r",9)
          .attr("fill",hl?c:(dark?"#1a2a44":"#eef3fb"))
          .attr("stroke",c).attr("stroke-width",hl?2.5:1.5)
          .attr("filter",hl?"url(#glow)":null);
        el.append("text").attr("x",14).attr("y",4)
          .attr("font-family","'Barlow',sans-serif").attr("font-size","10.5px").attr("font-weight",600)
          .attr("fill",dark?B.limestone:B.nightfall)
          .text(d.data.label.length>18?d.data.label.slice(0,17)+"…":d.data.label);
        if(d.data.ucs&&d.data.ucs.length){
          el.append("circle").attr("cx",26).attr("cy",-13).attr("r",7.5)
            .attr("fill",B.mint).attr("opacity",.92);
          el.append("text").attr("x",26).attr("y",-9)
            .attr("text-anchor","middle").attr("font-size","7.5px").attr("font-weight","800")
            .attr("fill",B.petrol).text(d.data.ucs.length);
        }
      }else{
        el.append("circle").attr("r",4)
          .attr("fill",hl?c:(dark?"#111827":"#f5f8fd"))
          .attr("stroke",c).attr("stroke-width",1.2).attr("stroke-opacity",.75);
        el.append("text").attr("x",9).attr("y",4)
          .attr("font-family","'Barlow',sans-serif").attr("font-size","9.5px")
          .attr("fill",dark?"#64748b":"#94a3b8")
          .text(d.data.label.length>22?d.data.label.slice(0,21)+"…":d.data.label);
      }
    });
  },[dark,hlIds,onNodeClick]);
  return(
    <div ref={wrapRef} style={{width:"100%",overflowX:"auto"}}>
      <svg ref={svgRef} style={{display:"block",margin:"0 auto"}}/>
    </div>
  );
}

      <div style={{background:bg,width:460,height:"100%",overflowY:"auto",padding:"28px 26px"}} onClick={e=>e.stopPropagation()}>
        {/* Header */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:16}}>
          <div>
            <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:6}}>
              <span style={{fontSize:"0.62rem",fontWeight:700,letterSpacing:".08em",textTransform:"uppercase",color:c,background:`${c}15`,padding:"3px 10px",borderRadius:999}}>{ucId} · {uc.domain}</span>
              <span style={{display:"flex",alignItems:"center",gap:4}}>{statusIcon}<span style={{fontSize:"0.62rem",color:uc.status==="ready"?B.mint:B.vanilla,fontWeight:600}}>{uc.status==="ready"?"Ready":"Lücken"}</span></span>
            </div>
            <h2 className="heading" style={{fontSize:"1.1rem",color:tx,lineHeight:1.2}}>{uc.title}</h2>
          </div>
          <button onClick={onClose} style={closeBtn(dark)}><Ph.X s={16} c={mu}/></button>
        </div>

        {/* Tabs inside factsheet */}
        <FactsheetTabs fs={fs} uc={uc} dark={dark} color={c}/>
      </div>
    </Overlay>
  );
}

      {tab==="kpis"&&(

            const kd=window.__KPI_DATA__[kid];
            return(
              <div key={kid} style={{marginBottom:8,padding:"9px 12px",background:dark?"rgba(255,255,255,.03)":"#f8fafc",border:`1px solid ${dark?"rgba(255,255,255,.06)":"rgba(19,41,75,.08)"}`,borderRadius:9}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:kd?4:0}}>

                {kd&&<div style={{fontSize:"0.64rem",color:dark?"#94a3b8":"#64748b"}}>{kd.definition}</div>}
              </div>

          <div style={{marginTop:10}}>
            <div style={{fontSize:"0.6rem",fontWeight:700,textTransform:"uppercase",letterSpacing:".07em",color:mu,marginBottom:8}}>Action Codes</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
              {uc.actionCodes.map(ac=>(
                <span key={ac} style={{fontSize:"0.67rem",fontWeight:700,padding:"3px 10px",background:`${B.mint}12`,border:`1px solid ${B.mint}30`,borderRadius:999,color:B.mint}}>{ac}</span>

  );
}

// ── Shared helpers ─────────────────────────────────────────────────────────
function DetailRow({icon,label,val,dark}){

  const tx=dark?"#cbd5e1":"#475569";
  return(
    <div style={{marginBottom:14}}>
      <div style={{display:"flex",alignItems:"center",gap:5,marginBottom:4}}>
        {icon}
        <span style={{fontSize:"0.59rem",fontWeight:700,letterSpacing:".07em",textTransform:"uppercase",color:mu}}>{label}</span>
      </div>
      {typeof val==="string"
        ?<p style={{fontSize:"0.72rem",color:tx,lineHeight:1.6,margin:0}}>{val}</p>

      }

}
function Overlay({onClose,children}){
  return(
    <div style={{position:"fixed",inset:0,zIndex:70,background:"rgba(0,0,0,.5)",backdropFilter:"blur(6px)",display:"flex",justifyContent:"flex-end"}} onClick={onClose}>
      <div style={{animation:"slideIn .22s ease",height:"100%"}}>
        {children}
      </div>
    </div>
  );
}
function closeBtn(dark){return{background:"none",border:"none",cursor:"pointer",padding:"5px",borderRadius:8,display:"flex",alignItems:"center",color:dark?"#64748b":"#94a3b8"};}

// ── Use Case Card ─────────────────────────────────────────────────────────
function UCCard({uc,dark,selected,onOpenFS,onOpenKPI}){
  const c=DOMAIN_COL[uc.domain]||B.mint;
  const sC=uc.status==="ready"?B.mint:B.vanilla;
  const bg=dark?(selected?"#1a2a44":"#111827"):(selected?"#f0f9ff":"#ffffff");
  const bdr=selected?c:(dark?"rgba(255,255,255,.07)":"rgba(19,41,75,.08)");
  return(
    <div onClick={onOpenFS} style={{
      background:bg,border:`1.5px solid ${bdr}`,borderRadius:13,
      padding:"13px 15px",cursor:"pointer",
      transition:"box-shadow .18s,transform .18s",
      boxShadow:selected?`0 0 0 2px ${c}35,0 6px 24px ${c}16`:(dark?"0 2px 10px rgba(0,0,0,.35)":"0 2px 10px rgba(19,41,75,.06)"),
      position:"relative",overflow:"hidden",animation:"fadeIn .22s ease",
    }}
    onMouseEnter={e=>{if(!selected){e.currentTarget.style.transform="translateY(-2px)";e.currentTarget.style.boxShadow=`0 6px 20px ${c}18`;}}}
    onMouseLeave={e=>{e.currentTarget.style.transform="";e.currentTarget.style.boxShadow=selected?`0 0 0 2px ${c}35,0 6px 24px ${c}16`:(dark?"0 2px 10px rgba(0,0,0,.35)":"0 2px 10px rgba(19,41,75,.06)");}}
    >
      <div style={{position:"absolute",top:0,left:0,right:0,height:3,background:c,borderRadius:"13px 13px 0 0",opacity:selected?1:.45}}/>
      {/* ID + Status */}
      <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:8}}>
        <div>
          <span style={{fontSize:"0.59rem",fontWeight:700,letterSpacing:".07em",color:c,textTransform:"uppercase",background:`${c}18`,padding:"2px 7px",borderRadius:999}}>{uc.id}</span>
          <div className="subhead" style={{fontSize:"0.82rem",color:dark?"#f1f5f9":B.nightfall,marginTop:5,lineHeight:1.25}}>{uc.title}</div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:4,flexShrink:0,marginLeft:8}}>
          {uc.status==="ready"?<Ph.CheckCircle s={18} c={B.mint}/>:<Ph.Warning s={18} c={B.vanilla}/>}
        </div>
      </div>
      {/* Strategic KPI — clickable */}
      <div style={{marginBottom:8}}>
        <span style={{fontSize:"0.58rem",color:dark?"#64748b":"#94a3b8",display:"block",marginBottom:3}}>Strategic KPI</span>
        <button onClick={e=>{e.stopPropagation();onOpenKPI(uc.strategicKpi);}} style={{
          background:"none",border:`1px solid ${c}30`,borderRadius:999,cursor:"pointer",
          padding:"2px 9px",color:c,fontFamily:"monospace",fontSize:"0.67rem",fontWeight:600,
          background:`${c}10`,transition:"background .15s",
        }}
        onMouseEnter={e=>e.currentTarget.style.background=`${c}22`}
        onMouseLeave={e=>e.currentTarget.style.background=`${c}10`}
        >{uc.strategicKpi} <Ph.ArrowRight s={10} c={c}/></button>
      </div>
      {/* KPI chips */}
      <div style={{display:"flex",flexWrap:"wrap",gap:3,marginBottom:8}}>
        {uc.kpis.map(k=>(
          <button key={k} onClick={e=>{e.stopPropagation();onOpenKPI(k);}} style={{
            fontSize:"0.56rem",padding:"2px 6px",fontFamily:"monospace",
            border:`1px solid ${dark?"rgba(255,255,255,.09)":"rgba(19,41,75,.1)"}`,
            borderRadius:999,color:dark?"#94a3b8":"#64748b",
            background:dark?"rgba(255,255,255,.03)":"#f8fafc",
            cursor:"pointer",transition:"all .13s",
          }}
          onMouseEnter={e=>{e.currentTarget.style.borderColor=c;e.currentTarget.style.color=c;}}
          onMouseLeave={e=>{e.currentTarget.style.borderColor="";e.currentTarget.style.color="";}}
          >{k.split(".").slice(-1)[0]}</button>
        ))}
      </div>
      {/* Action codes */}
      <div style={{display:"flex",alignItems:"center",gap:5,flexWrap:"wrap",marginBottom:10}}>
        <Ph.Lightning s={12} c={dark?"#475569":"#94a3b8"}/>
        {uc.actionCodes.map(ac=>(
          <span key={ac} style={{fontSize:"0.59rem",fontWeight:700,padding:"1px 6px",background:`${B.mint}10`,border:`1px solid ${B.mint}35`,borderRadius:999,color:B.mint}}>{ac}</span>
        ))}
      </div>
      {/* Confidence */}
      <div>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
          <span style={{fontSize:"0.57rem",color:dark?"#475569":"#94a3b8"}}>Completeness</span>
          <span style={{fontSize:"0.6rem",fontWeight:700,color:sC}}>{uc.confidence}%</span>
        </div>
        <div style={{height:3,borderRadius:999,background:dark?"rgba(255,255,255,.05)":"rgba(0,0,0,.05)"}}>
          <div style={{height:"100%",borderRadius:999,width:`${uc.confidence}%`,background:sC,transition:"width .7s ease"}}/>
        </div>
      </div>
    </div>
  );
}

// ── Chat Panel ─────────────────────────────────────────────────────────────
function ChatPanel({dark}){
  const [mode,setMode]=useState("explain");
  const [input,setInput]=useState("");
  const [msgs,setMsgs]=useState([{role:"a",text:"Willkommen im **Strategy Studio**!\n\nFrag mich nach:\n• **KPIs** — z.B. `margin.gm.pct`, `wc.ccc.days`\n• **Use Cases** — z.B. `COM-001`, `FIN-001`\n• **Framework** — Golden Thread Überblick\n\nOder wechsle den Modus für Ergänzungs- und Validierungsanalysen."}]);
  const [loading,setLoading]=useState(false);
  const botRef=useRef(null);
  useEffect(()=>{botRef.current?.scrollIntoView({behavior:"smooth"});},[msgs]);
  const send=()=>{
    if(!input.trim())return;
    const q=input;
    setMsgs(p=>[...p,{role:"u",text:q}]);
    setInput(""); setLoading(true);
    setTimeout(()=>{
      setMsgs(p=>[...p,{role:"a",text:getChatResponse(q,mode)}]);
      setLoading(false);
    },480+Math.random()*320);
  };
  const bdr=dark?"rgba(255,255,255,.07)":"rgba(19,41,75,.08)";
  const tx=dark?"#e2e8f0":B.nightfall;
  const mu=dark?"#64748b":"#94a3b8";
  const MODES=[{id:"explain",l:"Erkläre",icon:<Ph.Info s={14} c="currentColor"/>},{id:"complete",l:"Ergänze",icon:<Ph.Lightning s={14} c="currentColor"/>},{id:"validate",l:"Validiere",icon:<Ph.MagnifyingGlass s={14} c="currentColor"/>}];
  const renderTxt=t=>t.split(/(\*\*[^*]+\*\*|`[^`]+`)/).map((p,i)=>{
    if(p.startsWith("**")&&p.endsWith("**"))return<strong key={i}>{p.slice(2,-2)}</strong>;
    if(p.startsWith("`")&&p.endsWith("`"))return<code key={i} style={{fontFamily:"monospace",fontSize:".88em",color:B.cyan,background:dark?"rgba(22,231,207,.1)":"rgba(22,231,207,.08)",padding:"1px 4px",borderRadius:4}}>{p.slice(1,-1)}</code>;
    return<span key={i}>{p}</span>;
  });
  return(
    <div style={{display:"flex",flexDirection:"column",height:"100%",background:dark?"#0a1020":"#f9fafb"}}>
      {/* Mode toggles */}
      <div style={{padding:"10px 12px 8px",borderBottom:`1px solid ${bdr}`}}>
        <div style={{fontSize:"0.57rem",fontWeight:700,letterSpacing:".08em",textTransform:"uppercase",color:mu,marginBottom:6,fontFamily:"'Barlow Condensed',sans-serif"}}>Modus</div>
        <div style={{display:"flex",gap:4}}>
          {MODES.map(m=>(
            <button key={m.id} onClick={()=>setMode(m.id)} style={{
              flex:1,padding:"5px 4px",fontSize:"0.6rem",fontWeight:mode===m.id?700:400,
              border:`1px solid ${mode===m.id?B.mint:bdr}`,borderRadius:8,
              background:mode===m.id?(dark?`${B.mint}1e`:`${B.mint}12`):"transparent",
              color:mode===m.id?B.mint:mu,cursor:"pointer",transition:"all .15s",
              display:"flex",flexDirection:"column",alignItems:"center",gap:2,fontFamily:"'Barlow',sans-serif",
            }}><span style={{color:mode===m.id?B.mint:mu}}>{m.icon}</span>{m.l}</button>
          ))}
        </div>
      </div>
      {/* Messages */}
      <div style={{flex:1,overflowY:"auto",padding:"10px 12px",display:"flex",flexDirection:"column",gap:10}}>
        {msgs.map((m,i)=>(
          <div key={i} style={{display:"flex",justifyContent:m.role==="u"?"flex-end":"flex-start"}}>
            <div style={{
              maxWidth:"90%",padding:"8px 12px",
              borderRadius:m.role==="u"?"12px 12px 2px 12px":"12px 12px 12px 2px",
              background:m.role==="u"?B.nightfall:(dark?"#1a2744":"#ffffff"),
              border:m.role==="u"?"none":`1px solid ${bdr}`,
              fontSize:"0.7rem",lineHeight:1.65,color:m.role==="u"?"#fff":tx,
              whiteSpace:"pre-wrap",animation:"fadeIn .2s ease",
              fontFamily:"'Barlow',sans-serif",
            }}>{renderTxt(m.text)}</div>
          </div>
        ))}
        {loading&&<div style={{display:"flex",gap:5,padding:"6px 12px"}}>
          {[0,1,2].map(i=><div key={i} style={{width:6,height:6,borderRadius:"50%",background:B.mint,animation:`bounce .7s ${i*.2}s infinite`}}/>)}
        </div>}
        <div ref={botRef}/>
      </div>
      {/* Input */}
      <div style={{padding:"10px 12px",borderTop:`1px solid ${bdr}`}}>
        <div style={{display:"flex",gap:6,alignItems:"flex-end"}}>
          <textarea value={input} onChange={e=>setInput(e.target.value)}
            onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}}}
            placeholder={mode==="explain"?"KPI oder Use Case ID eingeben...":mode==="complete"?"Ergänzungs-Vorschläge...":"Framework validieren..."}
            rows={1} style={{
              flex:1,padding:"7px 11px",fontFamily:"'Barlow',sans-serif",
              border:`1px solid ${dark?"rgba(255,255,255,.1)":"rgba(19,41,75,.12)"}`,
              borderRadius:10,background:dark?"#1e293b":"#fff",
              color:tx,fontSize:"0.7rem",resize:"none",outline:"none",lineHeight:1.5,
              minHeight:34,maxHeight:80,
            }}/>
          <button onClick={send} disabled={!input.trim()} style={{
            background:input.trim()?B.mint:"rgba(71,215,172,.3)",
            border:"none",borderRadius:10,width:34,height:34,
            color:B.petrol,cursor:input.trim()?"pointer":"default",
            display:"flex",alignItems:"center",justifyContent:"center",
            flexShrink:0,transition:"background .15s",
          }}><Ph.ArrowUp s={16} c={B.petrol}/></button>
        </div>
        <div style={{fontSize:"0.55rem",color:mu,marginTop:4,textAlign:"center",fontFamily:"'Barlow',sans-serif"}}>Enter senden · Shift+Enter neue Zeile</div>
      </div>
    </div>
  );
}

function InputSidebar({dark,state,setState}){
  const bdr=dark?"rgba(255,255,255,.07)":"rgba(19,41,75,.08)";
  const tx=dark?"#e2e8f0":B.nightfall;
  const mu=dark?"#64748b":"#94a3b8";
  const iBg=dark?"#1e293b":"#fff";
  const inpSt={width:"100%",padding:"6px 10px",border:`1px solid ${bdr}`,borderRadius:8,background:iBg,color:tx,fontSize:"0.7rem",outline:"none",fontFamily:"'Barlow',sans-serif",boxSizing:"border-box"};
  const DOMAINS=["Commercial","Finance","Operations","Supply Chain","Experience","Executive"];
  const toggle=d=>{const s=new Set(state.domains);s.has(d)?s.delete(d):s.add(d);setState(p=>({...p,domains:[...s]}));};
  const readyN=USE_CASES.filter(u=>u.status==="ready").length;
  const gapN=USE_CASES.filter(u=>u.status==="gap").length;
  return(
    <div style={{height:"100%",overflowY:"auto",padding:"10px 9px",background:dark?"#0a1020":"#f5f8fc"}}>
      <SidebarSection label="Unternehmen" icon={<Ph.Buildings s={14} c={B.mint}/>} dark={dark}>
        <input type="text" value={state.company} onChange={e=>setState(p=>({...p,company:e.target.value}))} placeholder="Firmenname…" style={inpSt}/>
        <select value={state.industry} onChange={e=>setState(p=>({...p,industry:e.target.value}))} style={{...inpSt,marginTop:6,color:state.industry?tx:mu}}>
          <option value="">Branche…</option>
          {["FMCG","Manufacturing","Retail","Financial Services","Healthcare","Technology","Logistics"].map(i=><option key={i} value={i}>{i}</option>)}
        </select>
      </SidebarSection>
      <SidebarSection label="Fokus-Domains" icon={<Ph.Target s={14} c={B.mint}/>} dark={dark}>
        <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
          {DOMAINS.map(d=>{
            const on=state.domains.includes(d);
            const col=DOMAIN_COL[d]||B.mint;
            return<button key={d} onClick={()=>toggle(d)} style={{fontSize:"0.59rem",padding:"3px 8px",border:`1px solid ${on?col:bdr}`,borderRadius:999,background:on?(dark?`${col}20`:`${col}13`):"transparent",color:on?col:mu,cursor:"pointer",transition:"all .14s",fontWeight:on?600:400,fontFamily:"'Barlow',sans-serif"}}>{d}</button>;
          })}
        </div>
      </SidebarSection>
      <SidebarSection label="Strategisches Ziel" icon={<Ph.Lightning s={14} c={B.mint}/>} dark={dark}>
        <textarea value={state.goal} onChange={e=>setState(p=>({...p,goal:e.target.value}))} placeholder="z.B. EBITDA +2pp in 18 Monaten…" style={{...inpSt,resize:"none",minHeight:52,lineHeight:1.5}} rows={3}/>
      </SidebarSection>
      <SidebarSection label="Framework-Status" icon={<Ph.ChartBar s={14} c={B.mint}/>} dark={dark}>
        {[{s:"ready",l:"Ready",c:B.mint,n:readyN},{s:"gap",l:"Lücken",c:B.vanilla,n:gapN}].map(({l,c,n})=>(
          <div key={l} style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:7}}>
            <div style={{display:"flex",alignItems:"center",gap:6}}>
              <div style={{width:7,height:7,borderRadius:"50%",background:c}}/>
              <span style={{fontSize:"0.67rem",color:dark?"#94a3b8":"#64748b",fontFamily:"'Barlow',sans-serif"}}>{l}</span>
            </div>
            <span style={{fontSize:"0.7rem",fontWeight:700,color:c,fontFamily:"'Barlow Condensed',sans-serif"}}>{n}</span>
          </div>
        ))}
        <div style={{marginTop:6,padding:"7px 10px",background:dark?`${B.mint}10`:`${B.mint}08`,border:`1px solid ${B.mint}22`,borderRadius:8,fontSize:"0.62rem",color:B.mint,fontWeight:600,textAlign:"center",lineHeight:1.65,fontFamily:"'Barlow Condensed',sans-serif"}}>
          {USE_CASES.length} Use Cases<br/><span style={{fontWeight:400,color:dark?"#64748b":"#94a3b8"}}>107 KPIs · 53 Action Codes</span>
        </div>
      </SidebarSection>
    </div>
  );
}

// ── Icon Button ────────────────────────────────────────────────────────────
function IBtn({onClick,active,dark,title,children}){
  return<button onClick={onClick} title={title} style={{padding:"5px 8px",border:`1px solid ${active?B.mint:(dark?"rgba(255,255,255,.09)":"rgba(19,41,75,.1)")}`,borderRadius:8,cursor:"pointer",background:active?(dark?`${B.mint}1e`:`${B.mint}10`):"transparent",color:active?B.mint:(dark?"#64748b":"#94a3b8"),fontSize:"0.8rem",display:"flex",alignItems:"center",transition:"all .14s"}}>{children}</button>;
}

// ── Main App ───────────────────────────────────────────────────────────────
function App(){
  const [dark,setDark]=useState(false);
  const [tab,setTab]=useState("tree");
  const [hlIds,setHlIds]=useState([]);
  const [filterDomain,setFilterDomain]=useState("");
  const [sidebarOn,setSidebarOn]=useState(true);
  const [chatOn,setChatOn]=useState(true);
  const [kpiPanelId,setKpiPanelId]=useState(null);
  const [fsPanelId,setFsPanelId]=useState(null);
  const [ctx,setCtx]=useState({company:"Aurora AG",industry:"FMCG",domains:["Commercial","Finance"],goal:"EBITDA-Verbesserung um 2pp in 18 Monaten"});

  const bg=dark?"#080e1a":"#eef3fb";
  const sf=dark?"#0c1528":"#ffffff";
  const bdr=dark?"rgba(255,255,255,.07)":"rgba(19,41,75,.09)";
  const tx=dark?"#f1f5f9":B.nightfall;
  const mu=dark?"#64748b":"#94a3b8";

  const filtered=useMemo(()=>filterDomain?USE_CASES.filter(u=>u.domain===filterDomain):USE_CASES,[filterDomain]);
  const DOMAINS_ALL=["","Commercial","Finance","Operations","Supply Chain","Experience","Executive"];

  const handleNodeClick=useCallback(node=>{
    if(node.type==="kpi"&&window.__KPI_DATA__[node.id]){setKpiPanelId(node.id);return;}
    if(node.ucs&&node.ucs.length){setHlIds(node.ucs);setTab("cards");setFilterDomain("");}
  },[]);

  const PILLARS=[
    {icon:<Ph.ChartBar s={16} c={B.mint}/>,label:"Revenue Growth",kpis:["GM %","CLV","Promo ROI"],color:B.mint,ucs:4},
    {icon:<Ph.Lightning s={16} c={B.blue}/>,label:"Cost Efficiency",kpis:["Unit Cost","OEE %","FPY"],color:B.blue,ucs:5},
    {icon:<Ph.Buildings s={16} c={B.pink}/>,label:"Cash & WC",kpis:["CCC","DSO","DIO"],color:B.pink,ucs:2},
    {icon:<Ph.Target s={16} c={B.lavender}/>,label:"Service & Exp.",kpis:["OTIF %","SLA %","NPS"],color:B.lavender,ucs:4},
  ];

  return(
    <div style={{minHeight:"100vh",background:bg,color:tx,fontFamily:"'Barlow',system-ui,sans-serif",display:"flex",flexDirection:"column",WebkitFontSmoothing:"antialiased"}}>
      <style>{`
        button,input,select,textarea{font-family:'Barlow',sans-serif;}
        textarea:focus,input:focus,select:focus{border-color:${B.mint}!important;box-shadow:0 0 0 1px ${B.mint}40!important;}
      `}</style>

      {/* ── Header ── */}
      <header style={{height:50,display:"flex",alignItems:"center",padding:"0 16px",gap:10,background:dark?"#0c1528":sf,borderBottom:`1px solid ${bdr}`,position:"sticky",top:0,zIndex:30,boxShadow:dark?"0 1px 12px rgba(0,0,0,.4)":"0 1px 8px rgba(19,41,75,.07)",flexShrink:0}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginRight:4}}>
          <div style={{width:30,height:30,borderRadius:9,background:`linear-gradient(135deg,${B.nightfall},${B.lavender})`,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:`0 0 0 2px ${B.mint}28`}}>
            <Ph.Tree s={16} c={B.mint}/>
          </div>
          <div>
            <div className="heading" style={{fontSize:"0.92rem",color:tx,lineHeight:1}}>Strategy<span style={{color:B.mint}}>Studio</span></div>
            <div style={{fontSize:"0.5rem",color:mu,letterSpacing:".06em",textTransform:"uppercase",fontFamily:"'Barlow Condensed',sans-serif"}}>Analytics Use Case Library</div>
          </div>
        </div>
        <div style={{width:1,height:22,background:bdr}}/>
        <div style={{display:"flex",alignItems:"center",gap:6,padding:"3px 10px",borderRadius:999,border:`1px solid ${bdr}`,background:dark?"rgba(255,255,255,.03)":"rgba(19,41,75,.03)",fontSize:"0.67rem",color:mu}}>
          <div style={{width:6,height:6,borderRadius:"50%",background:B.mint,boxShadow:`0 0 0 2px ${B.mint}28`}}/>
          <span style={{color:tx,fontWeight:600,fontFamily:"'Barlow Condensed',sans-serif"}}>{ctx.company||"—"}</span>
          {ctx.industry&&<span style={{opacity:.55}}>· {ctx.industry}</span>}
        </div>
        <div style={{flex:1}}/>
        <div style={{display:"flex",gap:16,fontSize:"0.62rem",color:mu}}>
          {[{v:USE_CASES.length,l:"Use Cases",c:tx},{v:USE_CASES.filter(u=>u.status==="ready").length,l:"Ready",c:B.mint},{v:USE_CASES.filter(u=>u.status==="gap").length,l:"Lücken",c:B.vanilla}].map(s=>(
            <div key={s.l} style={{textAlign:"center"}}>
              <div className="heading" style={{fontSize:"0.95rem",color:s.c,lineHeight:1}}>{s.v}</div>
              <div style={{marginTop:1,fontFamily:"'Barlow Condensed',sans-serif"}}>{s.l}</div>
            </div>
          ))}
        </div>
        <div style={{width:1,height:22,background:bdr}}/>
        <div style={{display:"flex",gap:5}}>
          <IBtn onClick={()=>setSidebarOn(!sidebarOn)} active={sidebarOn} dark={dark} title="Sidebar"><Ph.Sidebar s={15} c="currentColor"/></IBtn>
          <IBtn onClick={()=>setChatOn(!chatOn)} active={chatOn} dark={dark} title="Chat"><Ph.Chat s={15} c="currentColor"/></IBtn>
          <IBtn onClick={()=>setDark(!dark)} dark={dark} title="Dark/Light">{dark?<Ph.Sun s={15} c="currentColor"/>:<Ph.Moon s={15} c="currentColor"/>}</IBtn>
        </div>
      </header>

      {/* ── Body ── */}
      <div style={{flex:1,display:"flex",overflow:"hidden",minHeight:0}}>
        {/* Sidebar */}
        {sidebarOn&&<div style={{width:196,flexShrink:0,borderRight:`1px solid ${bdr}`,overflow:"hidden"}}><InputSidebar dark={dark} state={ctx} setState={setCtx}/></div>}

        {/* Center */}
        <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden",minWidth:0}}>
          {/* Tab bar */}
          <div style={{display:"flex",alignItems:"center",gap:10,padding:"8px 14px",flexWrap:"wrap",background:dark?"#0c1528":sf,borderBottom:`1px solid ${bdr}`,flexShrink:0}}>
            <div style={{display:"flex",gap:2,background:dark?"#1a2744":"#f1f5f9",borderRadius:10,padding:3}}>
              {[{id:"tree",label:"Werttreiber-Baum",icon:<Ph.Tree s={14} c="currentColor"/>},{id:"cards",label:"Use Case Cards",icon:<Ph.Cards s={14} c="currentColor"/>}].map(t=>(
                <button key={t.id} onClick={()=>setTab(t.id)} style={{padding:"5px 12px",borderRadius:7,border:"none",fontSize:"0.7rem",fontWeight:tab===t.id?700:400,background:tab===t.id?(dark?"#0f172a":"#fff"):"transparent",color:tab===t.id?B.mint:mu,cursor:"pointer",boxShadow:tab===t.id?"0 1px 5px rgba(0,0,0,.1)":"none",transition:"all .15s",display:"flex",alignItems:"center",gap:6,fontFamily:"'Barlow',sans-serif"}}>
                  {t.icon}{t.label}
                </button>
              ))}
            </div>
            {tab==="cards"&&(
              <div style={{display:"flex",gap:3,flexWrap:"wrap"}}>
                {DOMAINS_ALL.map(d=>{
                  const on=filterDomain===d;
                  const col=d?(DOMAIN_COL[d]||B.mint):mu;
                  return<button key={d||"all"} onClick={()=>setFilterDomain(d)} style={{fontSize:"0.6rem",padding:"3px 9px",border:`1px solid ${on?col:bdr}`,borderRadius:999,background:on?(dark?`${col}22`:`${col}13`):"transparent",color:on?col:mu,cursor:"pointer",transition:"all .14s",fontWeight:on?700:400,fontFamily:"'Barlow',sans-serif"}}>{d||"Alle"}</button>;
                })}
              </div>
            )}
            {hlIds.length>0&&<button onClick={()=>setHlIds([])} style={{marginLeft:"auto",fontSize:"0.6rem",padding:"3px 10px",border:`1px solid ${B.mint}`,borderRadius:999,background:"transparent",color:B.mint,cursor:"pointer",display:"flex",alignItems:"center",gap:4,fontFamily:"'Barlow',sans-serif"}}><Ph.X s={10} c={B.mint}/>Hervorhebung</button>}
          </div>

          {/* Content */}
          <div style={{flex:1,overflow:"auto",padding:14}}>
            {tab==="tree"&&(
              <div>
                <div style={{background:dark?"#0f172a":sf,border:`1px solid ${bdr}`,borderRadius:14,padding:"14px 16px",marginBottom:14,boxShadow:dark?"0 4px 24px rgba(0,0,0,.35)":"0 4px 20px rgba(19,41,75,.06)"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12,flexWrap:"wrap",gap:8}}>
                    <div>
                      <h2 className="heading" style={{fontSize:"0.9rem",margin:0}}>Werttreiber-Baum</h2>
                      <p style={{margin:"3px 0 0",fontSize:"0.63rem",color:mu}}>KPI-Knoten klicken → KPI Katalog · Badge-Knoten → Use Cases · Strategie-Knoten → Ziel-Details</p>
                    </div>
                    <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
                      {Object.entries(DOMAIN_COL).slice(0,5).map(([d,c])=>(
                        <span key={d} style={{display:"flex",alignItems:"center",gap:4,fontSize:"0.58rem",color:mu,fontFamily:"'Barlow',sans-serif"}}>
                          <div style={{width:7,height:7,borderRadius:"50%",background:c}}/>{d}
                        </span>
                      ))}
                    </div>
                  </div>
                  <ValueDriverTree dark={dark} onNodeClick={handleNodeClick} hlIds={hlIds}/>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(195px,1fr))",gap:10}}>
                  {PILLARS.map(p=>(
                    <div key={p.label} style={{background:dark?"#0f172a":sf,border:`1px solid ${p.color}26`,borderRadius:10,padding:"12px 14px",boxShadow:dark?"none":`0 2px 12px ${p.color}0e`}}>
                      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>{p.icon}<span className="subhead" style={{fontSize:"0.76rem",color:p.color}}>{p.label}</span></div>
                      <div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:8}}>
                        {p.kpis.map(k=><span key={k} style={{fontSize:"0.59rem",padding:"2px 7px",background:dark?`${p.color}14`:`${p.color}0e`,border:`1px solid ${p.color}22`,borderRadius:999,color:p.color}}>{k}</span>)}
                      </div>
                      <div style={{fontSize:"0.61rem",color:mu}}><span style={{color:p.color,fontWeight:700,fontFamily:"'Barlow Condensed',sans-serif"}}>{p.ucs}</span> Use Cases</div>
                    </div>
                  ))}
                </div>
              </div>
            )}
            {tab==="cards"&&(
              <div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(238px,1fr))",gap:10}}>
                  {filtered.map(uc=>(
                    <UCCard key={uc.id} uc={uc} dark={dark}
                      selected={hlIds.includes(uc.id)}
                      onOpenFS={()=>setFsPanelId(uc.id)}
                      onOpenKPI={setKpiPanelId}
                    />
                  ))}
                </div>
                <div style={{marginTop:10,textAlign:"center",fontSize:"0.62rem",color:mu}}>
                  {filtered.length} von {USE_CASES.length} Use Cases · Karte → Business Factsheet · KPI-Chip → KPI Katalog
                </div>
              </div>
            )}
          </div>
        </div>

        {/* Chat */}
        {chatOn&&(
          <div style={{width:272,flexShrink:0,borderLeft:`1px solid ${bdr}`,display:"flex",flexDirection:"column",overflow:"hidden"}}>
            <div style={{padding:"10px 13px 8px",borderBottom:`1px solid ${bdr}`,background:dark?"#0c1528":sf,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
              <div>
                <div className="subhead" style={{fontSize:"0.76rem"}}>Framework-Assistent</div>
                <div style={{fontSize:"0.57rem",color:mu}}>Erkläre · Ergänze · Validiere</div>
              </div>
              <div style={{width:7,height:7,borderRadius:"50%",background:B.mint,boxShadow:`0 0 0 3px ${B.mint}25`}}/>
            </div>
            <div style={{flex:1,overflow:"hidden"}}><ChatPanel dark={dark}/></div>
          </div>
        )}
      </div>

      {/* Slide-over panels */}
      {kpiPanelId&&<KpiPanel kpiId={kpiPanelId} dark={dark} onClose={()=>setKpiPanelId(null)}/>}
      {fsPanelId&&<FactsheetPanel ucId={fsPanelId} dark={dark} onClose={()=>setFsPanelId(null)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
