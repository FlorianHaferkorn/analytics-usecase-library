<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body,#root{height:100%;overflow:hidden;}
body{font-size:14px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}
.heading{font-family:'Barlow Condensed',sans-serif;font-weight:800;line-height:1.2;}
.subhead{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.04em;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(71,215,172,.35);border-radius:4px;}
::-webkit-scrollbar-thumb:hover{background:rgba(71,215,172,.55);}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
@keyframes slideInR{from{opacity:0;transform:translateX(28px);}to{opacity:1;transform:translateX(0);}}
@keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.5;}}
.fade-in{animation:fadeIn .28s ease;}
.slide-in{animation:slideInR .22s ease;}
button{transition:opacity .15s,background .15s,border-color .15s,color .15s;}
button:hover{opacity:.88;}
input,textarea,select{outline:none;}
a{color:inherit;}
/* Improve min touch target sizes */
button{min-height:28px;}
/* Better focus ring */
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:2px solid rgba(71,215,172,.6);outline-offset:2px;
}
</style>
</head>

window.__KPI_DATA__ = {"crm.revenue_at_risk.amount":{"id":"crm.revenue_at_risk.amount","key":"Revenue at Risk Amount","type":"diagnostic","role":"strategic","dimension":"Customer","purpose":"Quantify revenue exposure from customers flagged as churn-risk.","definition":"CLV Remaining Amount * Attrition Risk %.","grain":"Customer/segment; monthly.","unit":"EUR (0 decimals)","interpretation":"Higher values indicate more revenue at risk; prioritize retention actions.","dax":"Revenue at Risk Amount","owner":"Head of Marketing","completeness":"1.0","useCases":["COM-003"],"actionCodes":[]},"crm.complaint.count":{"id":"crm.complaint.count","key":"Complaint Count","type":"diagnostic","role":"strategic","dimension":"Customer","purpose":"Provide the absolute number of logged complaints.","definition":"Count of complaint records in the complaint/service system.","grain":"Complaint / ticket; aggregated to org / channel / product / period.","unit":"count","interpretation":"Higher values indicate more issues; interpret with Complaint Rate % to normalize by volume.","dax":"Complaint Count","owner":"Head of Customer Service","completeness":"1.0","useCases":["COM-003"],"actionCodes":[]},"crm.retention.pct":{"id":"crm.retention.pct","key":"Customer Retention %","type":"diagnostic","role":"strategic","dimension":"customer","purpose":"Measure the share of customers that remain active from one period to the next, as a core loyalty KPI.","definition":"(Active Customers at end of period) / (Active Customers at start of period).","grain":"Customer / segment / org; monthly or quarterly.","unit":"% (1 decimal)","interpretation":"Higher retention indicates better loyalty and relationship quality; interpret jointly with churn and CLV.","dax":"Customer Retention %","owner":"Head of Marketing","completeness":"0.97","useCases":["COM-003"],"actionCodes":[]},"crm.nps.index":{"id":"crm.nps.index","key":"Net Promoter Score (NPS)","type":"diagnostic","role":"strategic","dimension":"Customer","purpose":"Measures customer advocacy and likelihood to recommend.","definition":"(%Promoters - %Detractors) from survey responses in the period.","grain":"Survey response aggregated by period, segment, or region.","unit":"Index (-100 to 100)","interpretation":">0 is positive, >50 strong advocacy; track trend and segment gaps.","dax":"NPS Score","owner":"Head of Customer Experience","completeness":"1.0","useCases":["COM-003"],"actionCodes":[]},"crm.churned_customers.count":{"id":"crm.churned_customers.count","key":"Churned Customers","type":"diagnostic","role":"supporting","dimension":"Customer","purpose":"Count customers that have stopped purchasing in the observation window as basis for churn calculations.","definition":"Distinct customers with no qualifying transactions in the current period but active in the look-back window.","grain":"Customer/segment; monthly or quarterly.","unit":"count","interpretation":"Higher counts indicate deteriorating retention; validate against cohort definitions.","dax":"Churned Customers","owner":"Head of CRM / Marketing Analytics","completeness":"1.0","useCases":["COM-003"],"actionCodes":[]},"crm.lifetime_revenue.amount":{"id":"crm.lifetime_revenue.amount","key":"Customer Lifetime Revenue Amount","type":"diagnostic","role":"supporting","dimension":"Customer","purpose":"Sum of realized revenue across the customer lifecycle.","definition":"Sum of net sales amount from first purchase to date for the customer.","grain":"Customer/segment; monthly or quarterly.","unit":"EUR (0 decimals)","interpretation":"Base for concentration and CLV inputs.","dax":"Customer Lifetime Revenue Amount","owner":"Head of Marketing","completeness":"1.0","useCases":["COM-003"],"actionCodes":[]},"crm.active_customers.count":{"id":"crm.active_customers.count","key":"Active Customers","type":"diagnostic","role":"supporting","dimension":"Customer","purpose":"Number of unique active customers in the reporting period.","definition":"Distinct customers with at least one qualifying transaction in the period.","grain":"Customer/segment; monthly or quarterly.","unit":"count","interpretation":"Base for retention, churn and at-risk share calculations.","dax":"Active Customers","owner":"Head of CRM / Marketing Analytics","completeness":"1.0","useCases":["COM-003"],"actionCodes":[]},"ops.performance.pct":{"id":"ops.performance.pct","key":"Performance %","type":"diagnostic","role":"strategic","dimension":"Efficiency","purpose":"Throughput speed versus theoretical maximum.","definition":"Actual output / Theoretical maximum output","grain":"Machine/line level; per shift or day, aggregated monthly.","unit":"% (1 decimal)","interpretation":"Higher performance indicates faster throughput; values above 100 % require validation of standard rates.","dax":"Performance %","owner":"Head of Manufacturing","completeness":"1.0","useCases":["OPS-001"],"actionCodes":["O-O1.2"]},"ops.quality.pct":{"id":"ops.quality.pct","key":"Quality %","type":"diagnostic","role":"strategic","dimension":"Efficiency","purpose":"Yield of conforming units relative to total units produced.","definition":"Good units / Total units","grain":"Machine/line level; per shift or day, aggregated monthly.","unit":"% (1 decimal)","interpretation":"Higher quality means fewer defects; low values indicate scrap/rework issues.","dax":"Quality %","owner":"Head of Manufacturing","completeness":"1.0","useCases":["OPS-001"],"actionCodes":["O-O1.3"]},"ops.labor.productivity.pct":{"id":"ops.labor.productivity.pct","key":"Labor Productivity %","type":"diagnostic","role":"strategic","dimension":"Efficiency","purpose":"Shows output efficiency relative to labor input.","definition":"Output Units or Net Sales divided by Labor Hours (normalized to % baseline).","grain":"Line/site; reported weekly or monthly.","unit":"% (1 decimal)","interpretation":"Higher values indicate better labor efficiency; validate against mix effects.","dax":"Labor Productivity %","owner":"Head of Operations","completeness":"1.0","useCases":["FIN-002"],"actionCodes":["F-K2.3"]},"ops.mtbf.hours":{"id":"ops.mtbf.hours","key":"MTBF (hours)","type":"diagnostic","role":"strategic","dimension":"Efficiency","purpose":"Measures average operating time between failures.","definition":"Operating Time Hours / Number of Failures.","grain":"Asset/line; aggregated monthly.","unit":"hours","interpretation":"Higher is better; declining MTBF indicates reliability issues.","dax":"MTBF (hours)","owner":"Head of Operations","completeness":"0.8","useCases":["OPS-002"],"actionCodes":["O-A2.2","O-A2.4"]},"ops.mttr.hours":{"id":"ops.mttr.hours","key":"MTTR (hours)","type":"diagnostic","role":"strategic","dimension":"Efficiency","purpose":"Measures average repair time after failures.","definition":"Total Repair Time Hours / Number of Failures.","grain":"Asset/line; aggregated monthly.","unit":"hours","interpretation":"Lower is better; high MTTR indicates slow recovery or parts issues.","dax":"MTTR (hours)","owner":"Head of Operations","completeness":"0.8","useCases":["OPS-002"],"actionCodes":["O-A2.3","O-A2.5"]},"ops.pm_compliance.pct":{"id":"ops.pm_compliance.pct","key":"PM Compliance %","type":"diagnostic","role":"strategic","dimension":"Efficiency","purpose":"Tracks adherence to preventive maintenance plan.","definition":"Completed PM Orders / Planned PM Orders.","grain":"Site/asset; monthly.","unit":"% (1 decimal)","interpretation":"Higher is better; low compliance increases breakdown risk.","dax":"PM Compliance %","owner":"Head of Maintenance","completeness":"0.8","useCases":["OPS-002"],"actionCodes":["O-A2.4"]},"ops.spare_parts.stockout.pct":{"id":"ops.spare_parts.stockout.pct","key":"Spare Parts Stockout %","type":"diagnostic","role":"strategic","dimension":"Efficiency","purpose":"Measures stockout frequency for critical spare parts.","definition":"Stockout Events / Total Parts Requests.","grain":"Site/part; monthly.","unit":"% (1 decimal)","interpretation":"Lower is better; stockouts drive downtime and MTTR.","dax":"Spare Parts Stockout %","owner":"Head of Maintenance","completeness":"1.0","useCases":["OPS-002"],"actionCodes":["O-A2.5"]},"ops.throughput.units":{"id":"ops.throughput.units","key":"Throughput Units","type":"diagnostic","role":"strategic","dimension":"Efficiency","purpose":"Measures total output volume in units.","definition":"Sum of produced units in the period.","grain":"Line/day; aggregated to site and month.","unit":"units","interpretation":"Higher values indicate higher output; analyze against capacity and demand.","dax":"Throughput Units","owner":"Head of Operations","completeness":"1.0","useCases":["OPS-001"],"actionCodes":["O-O1.2","O-O1.4"]},"quality.fpy.pct":{"id":"quality.fpy.pct","key":"First Pass Yield %","type":"diagnostic","role":"strategic","dimension":"Efficiency","purpose":"Measures share of units produced without rework or scrap.","definition":"Good Units / Total Units.","grain":"Line/day; aggregated monthly.","unit":"% (1 decimal)","interpretation":"Higher is better; low FPY indicates process instability.","dax":"First Pass Yield %","owner":"Head of Quality","completeness":"1.0","useCases":["OPS-003"],"actionCodes":["O-Q3.1","O-Q3.2"]},"quality.scrap.pct":{"id":"quality.scrap.pct","key":"Scrap Rate %","type":"diagnostic","role":"strategic","dimension":"Efficiency","purpose":"Measures share of units scrapped in production.","definition":"Scrap Units / Total Units.","grain":"Line/day; aggregated monthly.","unit":"% (1 decimal)","interpretation":"Lower is better; rising scrap increases cost and reduces yield.","dax":"Scrap Rate %","owner":"Head of Quality","completeness":"1.0","useCases":["OPS-003"],"actionCodes":["O-Q3.1","O-Q3.3","O-Q3.4"]},"quality.rework.pct":{"id":"quality.rework.pct","key":"Rework Rate %","type":"diagnostic","role":"strategic","dimension":"Efficiency","purpose":"Measures share of units requiring rework.","definition":"Reworked Units / Total Units.","grain":"Line/day; aggregated monthly.","unit":"% (1 decimal)","interpre n days.","definition":"Average Inventory / (COGS / 365).","grain":"SKU/location; aggregated monthly.","unit":"days","interpretation":"Higher values indicate slower movement and more cash tied up.","dax":"Days in Inventory","owner":"Head of Supply Chain / Logistics","completeness":"1.0","useCases":["SCM-001"],"actionCodes":["S-I1.1","S-I1.2","S-I1.4","S-I1.5"]},"inv.stockout.pct":{"id":"inv.stockout.pct","key":"Stockout Rate %","type":"diagnostic","role":"strategic","dimension":"Efficiency","purpose":"Measures how often inventory is unavailable when demanded.","definition":"Stockout Events / Total Demand Events.","grain":"SKU/location; aggregated weekly or monthly.","unit":"% (1 decimal)","interpretation":"Lower is better; high stockout rate impacts service and revenue.","dax":"Stockout Rate %","owner":"Head of Supply Chain / Logistics","completeness":"1.0","useCases":["SCM-001"],"actionCodes":["S-I1.1","S-I1.3","S-I1.5"]},"inv.obsolete.pct":{"id":"inv.obsolete.pct","key":"Obsolete Inventory %","type":"diagnostic","role":"strategic","dimension":"Efficiency","purpose":"Measures share of inventory considered obsolete.","definition":"Obsolete Inventory Value / Total Inventory Value.","grain":"SKU/location; aggregated monthly.","unit":"% (1 decimal)","interpretation":"Lower is better; high obsolescence indicates slow movement or aging.","dax":"Obsolete Inventory %","owner":"Head of Supply Chain / Logistics","completeness":"0.8","useCases":["SCM-001"],"actionCodes":["S-I1.4"]},"plan.forecast.accuracy.pct":{"id":"plan.forecast.accuracy.pct","key":"Forecast Accuracy %","type":"diagnostic","role":"strategic","dimension":"Efficiency","purpose":"Measures how close forecasted demand is to actual demand.","definition":"1 - |Forecast - Actual| / Actual.","grain":"SKU/week; aggregated monthly.","unit":"% (1 decimal)","interpretation":"Higher is better; low accuracy drives inventory and service issues.","dax":"Forecast Accuracy %","owner":"Supply Planning Lead","completeness":"0.8","useCases":["SCM-001","SCM-003"],"actionCodes":["S-F3.1","S-F3.2","S-F3.4","S-I1.5"]},"plan.forecast.bias.pct":{"id":"plan.forecast.bias.pct","key":"Forecast Bias %","type":"diagnostic","role":"strategic","dimension":"Efficiency","purpose":"Measures systematic over- or under-forecasting.","definition":"(Forecast - Actual) / Actual.","grain":"SKU/week; aggregated monthly.","unit":"% (1 decimal)","interpretation":"Values near 0 are best; positive bias indicates over-forecasting.","dax":"Forecast Bias %","owner":"Supply Planning Lead","completeness":"0.8","useCases":["SCM-003"],"actionCodes":["S-F3.1","S-F3.2"]},"plan.replan.count":{"id":"plan.replan.count","key":"Re-Plan Count","type":"diagnostic","role":"strategic","dimension":"Efficiency","purpose":"Counts number of replanning cycles in a period.","definition":"Total replan events logged in planning system.","grain":"Planning cycle; aggregated monthly.","unit":"count","interpretation":"High values indicate planning instability or frequent disruptions.","dax":"Re-Plan Count","owner":"Supply Planning Lead","completeness":"0.8","useCases":["SCM-003"],"actionCodes":["S-F3.1","S-F3.4"]},"supply.otif.pct":{"id":"supply.otif.pct","key":"OTIF %","type":"diagnostic","role":"strategic","dimension":"Efficiency","purpose":"Measures share of orders delivered on time and in full.","definition":"OTIF Orders / Total Orders.","grain":"Order/day; aggregated weekly or monthly.","unit":"% (1 decimal)","interpretation":"Higher is better; key service level indicator.","dax":"OTIF %","owner":"Head of Supply Chain / Logistics","completeness":"1.0","useCases":["SCM-001","SCM-002","SCM-003"],"actionCodes":["S-F3.3","S-I1.1","S-I1.3","S-R2.1","S-R2.2","S-R2.5"]},"supply.on_time.pct":{"id":"supply.on_time.pct","key":"On-Time %","type":"diagnostic","role":"strategic","dimension":"Efficiency","purpose":"Measures share of deliveries arriving on time.","definition":"On-Time Deliveries / Total Deliveries.","grain":"Delivery/day; aggregated weekly pe":"diagnostic","role":"strategic","dimension":"Efficiency","purpose":"Quantifies how much of the service loss (stockouts or OTIF misses) is attributable to forecast under-coverage (units-based demand forecast).","definition":"Service Impact % = Stockout Impact % x (Under-Forecast Lost Demand / Total Lost Demand). Under-forecast is defined as a negative forecast error below a configurable threshold; all inputs are unit-based (qty), not revenue.","grain":"Calculated at location_sku_day or sku_week; reported at sku_month aggregated by Date, Org, Product.","unit":"%","interpretation":"Lower values are better; high impact indicates forecast under-coverage driving service loss.","dax":"Service Impact %","owner":"Head of Supply Chain Planning","completeness":"1.0","useCases":["SCM-003"],"actionCodes":["S-F3.3"]},"ops.oee.pct":{"id":"ops.oee.pct","key":"Overall Equipment Effectiveness (OEE) %","type":"diagnostic","role":"strategic","dimension":"Efficiency","purpose":"Measures manufacturing performance combining availability, performance, and quality.","definition":"Availability % * Performance % * Quality %","grain":"Production line; aggregated monthly.","unit":"% (1 decimal)","interpretation":"Higher OEE indicates better utilization; capped at 100 %.","dax":"OEE %","owner":"Head of Manufacturing","completeness":"1.0","useCases":["OPS-001"],"actionCodes":["O-O1.1","O-O1.3","O-O1.4"]},"ops.failure.count":{"id":"ops.failure.count","key":"Failure Count","type":"diagnostic","role":"supporting","dimension":"Efficiency","purpose":"Counts equipment or process failures in the period.","definition":"Count of recorded failure events.","grain":"Asset or line; aggregated by period.","unit":"count","interpretation":"Higher counts indicate lower reliability.","dax":"Failure Count","owner":"Head of Operations","completeness":"0.6","useCases":["OPS-002"],"actionCodes":["O-A2.2","O-A2.3","O-A2.5"]},"ops.inventory.value.amount":{"id":"ops.inventory.value.amount","key":"Inventory Value Amount","type":"diagnostic","role":"supporting","dimension":"Efficiency","purpose":"Tracks inventory value for maintenance-relevant items.","definition":"Sum of inventory value amount for the selected scope.","grain":"SKU/location; aggregated by period.","unit":"EUR (2 decimals)","interpretation":"Higher values indicate more capital tied in spare parts.","dax":"Inventory Value Amount","owner":"Head of Supply Chain","completeness":"0.6","useCases":["OPS-002"],"actionCodes":[]},"ops.planned_output.units":{"id":"ops.planned_output.units","key":"Planned Output Units","type":"diagnostic","role":"supporting","dimension":"Efficiency","purpose":"Captures planned production output volume.","definition":"Sum of planned output units for the period.","grain":"Line/site; aggregated by period.","unit":"units","interpretation":"Baseline for comparing actual throughput.","dax":"Planned Output Units","owner":"Head of Operations","completeness":"0.6","useCases":["OPS-001","OPS-003"],"actionCodes":["O-O1.4","O-Q3.1","O-Q3.2","O-Q3.3"]},"ops.pm.task.count":{"id":"ops.pm.task.count","key":"Preventive Maintenance Task Count","type":"diagnostic","role":"supporting","dimension":"Efficiency","purpose":"Counts preventive maintenance tasks executed or scheduled.","definition":"Count of PM tasks in the period.","grain":"Asset; aggregated by period.","unit":"count","interpretation":"Higher counts indicate more planned maintenance activity.","dax":"Preventive Maintenance Task Count","owner":"Head of Maintenance","completeness":"0.6","useCases":["OPS-002"],"actionCodes":["O-A2.4"]},"ops.production.volume":{"id":"ops.production.volume","key":"Production Volume Units","type":"diagnostic","role":"supporting","dimension":"Efficiency","purpose":"Measures total produced volume in units.","definition":"Sum of produced units for the period.","grain":"Line/site; aggregated by period.","unit":"units","interpretation":"Higher values indicate higher output.","dax":"Production Volume Units","owner":"Head of Manuf t","owner":"Head of Marketing Controlling","completeness":"1.0","useCases":["COM-002","COM-003","COM-004"],"actionCodes":["C-P4.1"]},"sales.promo.incremental.amount":{"id":"sales.promo.incremental.amount","key":"Incremental Sales Amount","type":"diagnostic","role":"supporting","dimension":"Profitability","purpose":"Additional sales due to promotion.","definition":"Promo Sales Amount - Baseline Sales Amount","grain":"Promo period/product","unit":"EUR (2 decimals)","interpretation":"Input to promo ROI.","dax":"Incremental Sales Amount","owner":"Head of Marketing Controlling","completeness":"1.0","useCases":["COM-002","COM-003","COM-004"],"actionCodes":["C-P4.1"]},"margin.cogs.pct":{"id":"margin.cogs.pct","key":"COGS % of Sales","type":"diagnostic","role":"supporting","dimension":"Profitability","purpose":"Shows cost share relative to net sales.","definition":"COGS Amount / Net Sales Amount.","grain":"Invoice line aggregated to period.","unit":"% (1 decimal)","interpretation":"Lower is better; complements gross margin %.","dax":"COGS % of Sales","owner":"Head of Controlling","completeness":"0.8","useCases":["FIN-002"],"actionCodes":["F-K2.1"]},"margin.gm.vs_plan.pct":{"id":"margin.gm.vs_plan.pct","key":"Gross Margin % vs Plan","type":"diagnostic","role":"supporting","dimension":"Profitability","purpose":"Measures gross margin rate variance versus plan.","definition":"(Gross Margin % - Plan Gross Margin %) / Plan Gross Margin %.","grain":"Company/segment; monthly.","unit":"% (1 decimal)","interpretation":"Positive values indicate better-than-plan margin.","dax":"Gross Margin % vs Plan","owner":"Head of Controlling","completeness":"0.8","useCases":["COM-002"],"actionCodes":[]},"cost.base_volume.amount":{"id":"cost.base_volume.amount","key":"Cost Base Volume Amount","type":"diagnostic","role":"supporting","dimension":"Profitability","purpose":"Baseline cost volume used for variance analysis.","definition":"Baseline amount of cost volume for the selected period.","grain":" window.__FS_DATA__  = {"COM-001":{"id":"COM-001","purpose":"Explain Net Sales performance vs Plan and vs Last Year by price,\nvolume, mix, and channel/region to protect revenue and margin.","value":"Faster detection of revenue gaps; targeted pricing and mix\nactions to stabilise gross margin; focus resources on the most material\nregions/channels.","outOfScope":"Promotion ROI deep dives (COM-004); detailed margin leakage\ndiagnostics (COM-002); pipeline/win-loss (COM-010).\n\n---","questions":["Where do Net Sales deviate most vs Plan and vs LY by region, channel, and","What is the contribution of price, volume, and mix to the Net Sales gap?","Which customer or product segments drive negative gross margin %?","Which actions (pricing, mix, volume activation) close the largest gaps","How persistent are the gaps over the last 3 months and current quarter?"],"owner":"CCO / Head of Sales","kpiOwner":"Commercial Controlling Lead","decisionOwner":"Sales Leadership Team","reportingLevel":"Tactical","stage":"Descriptive / Diagnostic","layer3s":"- Net Sales Amount  \n- Net Sales % vs Plan  \n- Net Sales % vs LY  \n- Gross Margin %  \n- Price/Volume/Mix Effects (cards or mini-tiles)","success":"- Impact: Net Sales vs Plan/LY gaps reduced; GM % at or above target.\n- Adoption: Used in monthly sales performance reviews; actions tracked via\n  Action Codes.\n- Quality: PVM residual within tolerance; reconciled to source totals;\n  definitions consistent with COM-002/004.\n- Decision Frequency: Mon"},"COM-002":{"id":"COM-002","purpose":"Protect and improve gross margin by explaining leakage across price realization, mix, and unit cost.","value":"+0.5-1.5 pp GM%, tighter discount discipline, clearer mix levers, faster correction of cost leakage.","outOfScope":"Long-term list price strategy; promo ROI (COM-004); channel mix strategy (COM-009).\n\n---","questions":["Where is gross margin eroding vs Plan and vs LY by region/channel/product?","Which products/channels/regions drive negat ount  \n- NPS Score  \n- Customer Complaints Count","success":"- Impact: CLV uplift in priority segments; churn reduced vs target; margin improvement on low-margin high-revenue accounts.  \n- Adoption: Used in monthly account/retention reviews; action codes triggered with <5% false positives.  \n- Quality: KPI definitions consistent across COM-001/002/003; reconc"},"COM-004":{"id":"COM-004","purpose":"Improve promotion ROI by measuring true incremental sales and margin, controlling leakage, and optimising promo mechanics.","value":"Fewer unprofitable promos; higher incremental GM; better channel/product targeting; reduced cannibalization.","outOfScope":"Long-term pricing strategy (COM-002); assortment optimisation; omni-channel mix (COM-009).\n\n---","questions":["Which promotions generated true incremental sales and gross margin?","Which channels/products deliver the highest promo ROI and uplift?","How much did discounts erode price realization and GM?","What promo depth/timing/mechanics should we standardize or stop?","Where do cannibalization or leakage offset uplift?"],"owner":"CMO / Trade Marketing Lead","kpiOwner":"Revenue Growth Management / Commercial Controlling","decisionOwner":"Sales & Marketing Leadership","reportingLevel":"Tactical","stage":"Diagnostic / Prescriptive","layer3s":"- Promotion ROI %  \n- Incremental Sales Amount  \n- Promo Gross Margin %  \n- Price Realization %  \n- Cannibalization %","success":"- Impact: Higher promo ROI (>=120%), higher incremental GM, reduced cannibalization.\n- Adoption: Used in promo/post-event reviews; actions logged via Action Codes.\n- Quality: Uplift and ROI reconcile to baseline and costs; definitions aligned with COM-001/002.\n- Decision Frequency: Promo cycle (pre/"},"FIN-001":{"id":"FIN-001","purpose":"Control cash and liquidity by monitoring balances, operating cash\nflow, and working capital drivers (DSO, DIO, DPO, CCC).","value":"Better liquidity visibility, reduced financing needs, faster\ncash conversion, and improved resilience.","outOfScope":"Credit risk scoring (COR-016); investment/CapEx tracking\n(COR-009); supply chain OTIF specifics (SCM-002).\n\n---","questions":["What is the cash position vs plan and how is OCF trending?","How do DSO, DIO, DPO and CCC develop by region/entity?","Which customers/suppliers drive cash conversion issues?","What actions improve cash quickly with minimal business risk?","\"Which regions/entities have CCC above target and DSO deteriorating?\"  "],"owner":"CFO / Treasury Lead","kpiOwner":"Treasury / Finance Controlling","decisionOwner":"Finance Leadership Team","reportingLevel":"Tactical","stage":"Diagnostic / Predictive","layer3s":"- Cash Balance  \n- Cash vs Plan %  \n- OCF  \n- CCC (days)  \n- DSO / DIO / DPO","success":"- Impact: Positive cash vs plan; CCC reduced toward target; DSO/DIO down and DPO\n  optimized.  \n- Adoption: Used in monthly treasury/WC reviews; action codes triggered with <5%\n  false positives.  \n- Quality: KPI definitions consistent across finance and supply chain;\n  reconciled to source totals. "},"FIN-002":{"id":"FIN-002","purpose":"Reduce unit cost and improve margin by controlling material, labor, and OpEx vs plan.","value":"Better cost competitiveness, margin protection, and more efficient operations without sacrificing throughput/quality.","outOfScope":"Detailed OEE/performance tuning (OPS-001); supplier PPV specifics (OPS-002); logistics cost ratio (OPS-009).\n\n---","questions":["What is unit cost vs plan/LY by plant/line/product?","Which cost buckets (material, labor, overhead/OpEx) drive variance?","Where is COGS % rising and margin eroding?","Which actions reduce cost fastest without harming service/quality?","\"Which plants have unit cost above plan and margin below target in the last quarter?\""],"owner":"CFO / Ops Finance Lead","kpiOwner":"Plant/Ops Controllers","decisionOwner":"Finance & Operations Leadership","reportingLevel":"Tactical","stage":"Diagnostic / Prescriptive","layer3s":"- Un function scoreColor(s){return s>=80?B.mint:s>=55?B.vanilla:B.pink;}
function scoreLabel(s){return s>=80?"Ready":s>=55?"Review":"Draft";}

// ── Gemini AI helper ───────────────────────────────────────────────────────────
async function callGemini(apiKey, systemPrompt, userMessage){
  const url=`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-exp:generateContent?key=${apiKey}`;
  const body={contents:[{role:"user",parts:[{text:systemPrompt+"\n\n---\n\n"+userMessage}]}],
    generationConfig:{temperature:.7,maxOutputTokens:800}};
  const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok){const e=await r.json();throw new Error(e.error?.message||"API error");}
  const d=await r.json();
  return d.candidates?.[0]?.content?.parts?.[0]?.text||"(keine Antwort)";
}

// ── Fallback chat logic ────────────────────────────────────────────────────────
function localAnswer(q,context){
  const ql=q.toLowerCase();
  if(context?.type==="kpi"&&window.__KPI_DATA__[context.id]){
    const kd=window.__KPI_DATA__[context.id];
    return `**${kd.key}** (\`${context.id}\`)\n\n**Typ:** ${kd.type} · **Rolle:** ${kd.role}\n\n**Definition:** ${kd.definition}\n\n**Zweck:** ${kd.purpose}`;
  }
  if(context?.type==="uc"&&window.__FS_DATA__[context.id]){
    const fs=window.__FS_DATA__[context.id];
    return `**${context.id}** — Business Factsheet\n\n**Zweck:** ${fs.purpose}\n\n**Business Value:** ${fs.value}`;
  }
  const kids=Object.keys(window.__KPI_DATA__);
  for(const kid of kids){
    if(ql.includes(kid)||ql.includes(window.__KPI_DATA__[kid].key.toLowerCase())){
      const kd=window.__KPI_DATA__[kid];
      return `**${kd.key}** (\`${kid}\`)\n\n**Definition:** ${kd.definition}\n\n**Zweck:** ${kd.purpose}`;
    }
  }
  const ucm=USE_CASES.find(u=>ql.includes(u.id.toLowerCase()));
  if(ucm&&window.__FS_DATA__[ucm.id]){
    const fs=window.__FS_DATA__[ucm.id];
    return `**${ucm.id}** — ${ucm.title}\n\n**Zweck:** ${fs.purpose}\n\n**Value:** ${fs.value}`;
  }
  if(ql.includes("gap")||ql.includes("missing")||ql.includes("incomplete")){
    const gaps=USE_CASES.filter(u=>u.completeness<60);
    return `**${gaps.length} Use Cases with gaps:**\n\n${gaps.map(u=>`• **${u.id}** — ${u.title} (${u.completeness}%)`).join("\n")}`;
  }
  if(ql.includes("ready")||ql.includes("fertig")){
    const ready=USE_CASES.filter(u=>u.status==="ready");
    return `**${ready.length} Use Cases sind Ready:**\n\n${ready.map(u=>`• **${u.id}** — ${u.title} (${u.completeness}%)`).join("\n")}`;
  }
  return "Ich helfe bei KPIs, Use Cases und dem Framework. Frag mich nach einem spezifischen KPI-Key (z.B. `margin.gm.pct`) oder einer Use Case ID (z.B. `COM-001`).";
}


// ── Value Driver Tree (D3, Zoom/Pan, Tooltip, Heatmap, Filter) ────────────────
function ValueDriverTree({dark,onNodeClick,hlIds,filterDomain,onFilterDomain}){
  const svgRef=useRef(null);
  const wrapRef=useRef(null);
  const [tooltip,setTooltip]=useState(null);

  const visibleTree=useMemo(()=>{
    if(!filterDomain)return TREE;
    // Filter: keep only strategy branches containing KPIs used by filtered domain UCs
    const domainUcIds=USE_CASES.filter(u=>u.domain===filterDomain).map(u=>u.id);
    const filteredChildren=TREE.children.map(strat=>{
      const filtKpis=strat.children.filter(kpi=>kpi.ucs&&kpi.ucs.some(uid=>domainUcIds.includes(uid)));
      return filtKpis.length?{...strat,children:filtKpis}:null;
    }).filter(Boolean);
    return filteredChildren.length?{...TREE,children:filteredChildren}:TREE;
  },[filterDomain]);

  useEffect(()=>{
    if(!svgRef.current||!wrapRef.current)return;
    const W=wrapRef.current.clientWidth||760,H=460;
    const svg=d3.select(svgRef.current).attr("width",W).attr("height",H);
    svg.selectAll("*").remove();

    const defs=svg.append("defs");
    const glow=defs.append("filter").attr("id","gv3");
    glow.append("feGaussianBlur").attr("stdDeviation","3").attr("result","b");
    const m=glow.append("feMerge");m.append("feMergeNode").attr("in","b");m.append("feMergeNode").attr("in","SourceGraphic");

    const zoom=d3.zoom().scaleExtent([.4,2.5]).on("zoom",e=>g.attr("transform",e.transform));
    svg.call(zoom).on("dblclick.zoom",null);

    const g=svg.append("g").attr("transform","translate(80,30)");
    const root=d3.hierarchy(visibleTree);
    d3.tree().size([H-80,W-220])(root);

    // Links
    g.selectAll(".lk").data(root.links()).enter().append("path")
      .attr("fill","none")
      .attr("stroke",d=>{
        const c=d.target.data.color||B.mint;
        return dark?`${c}22`:`${c}20`;
      })
      .attr("stroke-width",1.8)
      .attr("d",d3.linkHorizontal().x(d=>d.y).y(d=>d.x));

    // Node groups
    const nd=g.selectAll(".n").data(root.descendants()).enter().append("g")
      .attr("class","n")
      .attr("transform",d=>`translate(${d.y},${d.x})`)
      .style("cursor","pointer")
      .on("click",(e,d)=>{e.stopPropagation();if(onNodeClick)onNodeClick(d.data);})
      .on("mouseover",(e,d)=>{
        const rect=wrapRef.current.getBoundingClientRect();
        setTooltip({x:e.clientX-rect.left+10,y:e.clientY-rect.top-10,data:d.data});
      })
      .on("mouseout",()=>setTooltip(null));

    nd.each(function(d){
      const el=d3.select(this);
      const hl=hlIds&&hlIds.includes(d.data.id);
      const c=d.data.color||B.mint;
      const t=d.data.type;
      // Completeness color for KPI nodes
      const ucIds=d.data.ucs||[];
      const avgComp=ucIds.length?Math.round(ucIds.reduce((sum,uid)=>{
        const uc=USE_CASES.find(u=>u.id===uid);return sum+(uc?.completeness||0);
      },0)/ucIds.length):null;
      const compC=avgComp!==null?scoreColor(avgComp):c;

      if(t==="root"){
        el.append("rect").attr("x",-60).attr("y",-16).attr("width",120).attr("height",32).attr("rx",16)
          .attr("fill",dark?"#0f172a":B.nightfall).attr("stroke",B.mint).attr("stroke-width",2)
          .attr("filter",hl?"url(#gv3)":null);
        el.append("text").attr("y",5).attr("text-anchor","middle")
          .attr("font-family","'Barlow Condensed',sans-serif").attr("font-size","12px").attr("font-weight","800")
          .attr("fill",B.mint).text(d.data.label);
      }else if(t==="strategy"){
        const isActive=filterDomain&&d.data.children?.some(k=>USE_CASES.filter(u=>u.domain===filterDomain).some(u=>u.kpis.includes(k.id)));
        el.append("rect").attr("x",-56).attr("y",-14).attr("width",112).attr("height",28).attr("rx",7)
          .attr("fill",dark?`${c}18`:`${c}15`).attr("stroke",c).attr("stroke-width",hl||isActive?2.5:1.5)
          .attr("filter",hl||isActive?"url(#gv3)":null);
        el.append("text").attr("y",5).attr("text-anchor","middle")
          .attr("font-family","'Barlow Condensed',sans-serif").attr("font-size","11px").attr("font-weight","700")
          .attr("fill",dark?c:B.nightfall)
          .text(d.data.label.length>15?d.data.label.slice(0,14)+"…":d.data.label);
      }else if(t==="kpi"){
        // Heatmap ring color = avg completeness of linked UCs
        el.append("circle").attr("r",10)
          .attr("fill",hl?compC:(dark?"#1a2a44":"#eef3fb"))
          .attr("stroke",compC).attr("stroke-width",hl?2.5:1.8)
          .attr("filter",hl?"url(#gv3)":null);
        el.append("text").attr("x",15).attr("y",4)
          .attr("font-family","'Barlow',sans-serif").attr("font-size","10.5px").attr("font-weight",600)
          .attr("fill",dark?B.limestone:B.nightfall)
          .text(d.data.label.length>18?d.data.label.slice(0,17)+"…":d.data.label);
        if(d.data.ucs?.length){
          el.append("circle").attr("cx",24).attr("cy",-14).attr("r",7.5)
            .attr("fill",compC).attr("opacity",.9);
          el.append("text").attr("x",24).attr("y",-10)
            .attr("text-anchor","middle").attr("font-size","7.5px").attr("font-weight","800")
            .attr("fill",dark?"#000":"#fff").text(d.data.ucs.length);
        }
      }else{
        el.append("circle").attr("r",4)
          .attr("fill",dark?"#111827":"#f5f8fd").attr("stroke",c).attr("stroke-width",1.2).attr("stroke-opacity",.7);
        el.append("text").attr("x",9).attr("y",4)
          .attr("font-family","'Barlow',sans-serif").attr("font-size","9.5px")
          .attr("fill",dark?"#64748b":"#94a3b8")
          .text(d.data.label.length>22?d.data.label.slice(0,21)+"…":d.data.label);
      }
    });

    // Reset zoom button hint
    svg.append("text").attr("x",W-8).attr("y",H-8).attr("text-anchor","end")
      .attr("font-size","9px").attr("fill",dark?"#334155":"#94a3b8")
      .attr("font-family","'Barlow',sans-serif").text("Scroll = Zoom · Drag = Pan");
  },[dark,hlIds,visibleTree,onNodeClick,filterDomain]);

  return(
    <div ref={wrapRef} style={{position:"relative",width:"100%",overflowX:"hidden"}}>
      <svg ref={svgRef} style={{display:"block",width:"100%"}}/>
      {tooltip&&(
        <div style={{position:"absolute",left:tooltip.x,top:tooltip.y,
          background:dark?"#0f172a":"#fff",border:`1px solid ${tooltip.data.color||B.mint}40`,
          borderRadius:8,padding:"7px 11px",fontSize:"0.68rem",maxWidth:200,
          boxShadow:"0 4px 16px rgba(0,0,0,.18)",pointerEvents:"none",zIndex:50,
          fontFamily:"'Barlow',sans-serif",color:dark?"#e2e8f0":B.nightfall,animation:"fadeIn .15s ease"}}>
          <div style={{fontWeight:700,marginBottom:3,fontFamily:"'Barlow Condensed',sans-serif",fontSize:"0.76rem"}}>
            {tooltip.data.label}
          </div>
          {tooltip.data.type==="kpi"&&<div style={{color:dark?"#64748b":"#94a3b8",fontSize:"0.63rem"}}><code style={{color:tooltip.data.color||B.mint}}>{tooltip.data.id}</code></div>}
          {tooltip.data.ucs?.length>0&&<div style={{marginTop:4,color:dark?"#64748b":"#94a3b8",fontSize:"0.63rem"}}>{tooltip.data.ucs.join(", ")}</div>}
          <div style={{marginTop:4,color:tooltip.data.color||B.mint,fontSize:"0.62rem",fontWeight:600}}>{tooltip.data.type?.toUpperCase()}</div>
        </div>
      )}
    </div>
  );
}

// ── Sources Panel ──────────────────────────────────────────────────────────────
function SourcesPanel({dark,sources,setSources}){
  const [dragOver,setDragOver]=useState(false);
  const [urlInput,setUrlInput]=useState("");
  const bg=dark?"#0f172a":"#ffffff";
  const tx=dark?"#e2e8f0":B.nightfall;
  const mu=dark?"#64748b":"#94a3b8";
  const bdr=dark?"#1e293b":"#e2e8f0";

  const addUrl=()=>{
    if(!urlInput.trim())return;
    setSources(p=>[...p,{id:Date.now(),type:"url",name:urlInput,url:urlInput,status:"pending",linkedUcs:[]}]);
    setUrlInput("");
  };
  const addFile=(file)=>{
    const ext=file.name.split(".").pop().toLowerCase();
    const type=["pdf","pptx","docx"].includes(ext)?"document":["csv","xlsx","json","yaml"].includes(ext)?"data":"other";
    setSources(p=>[...p,{id:Date.now(),type,name:file.name,size:Math.round(file.size/1024)+"KB",status:"pending",linkedUcs:[]}]);
  };
  const handleDrop=(e)=>{
    e.preventDefault();setDragOver(false);
    Array.from(e.dataTransfer.files).forEach(addFile);
  };
  const typeIcon=(t)=>{
    if(t==="url")return<Ph.Link s={13} c={B.blue}/>;
    if(t==="data")return<Ph.Database s={13} c={B.mint}/>;
    return<Ph.FileText s={13} c={B.lavender}/>;
  };
  const statusColor=(s)=>(s==="ready"?B.mint:s==="error"?B.pink:B.vanilla);

  return(
    <div style={{height:"100%",overflow:"auto",padding:"16px 14px",display:"flex",flexDirection:"column",gap:12}}>
      <div>
        <div className="heading" style={{fontSize:"0.9rem",color:tx,marginBottom:2}}>Data Sources</div>
        <p style={{fontSize:"0.67rem",color:mu,lineHeight:1.5}}>Add sources — the AI assistant derives KPIs, value drivers and use cases from them.</p>
      </div>

      {/* URL Input */}
      <div style={{display:"flex",gap:6}}>
        <div style={{flex:1,display:"flex",alignItems:"center",gap:7,padding:"7px 10px",background:bg,border:`1px solid ${bdr}`,borderRadius:8}}>
          <Ph.Link s={13} c={mu}/>
          <input value={urlInput} onChange={e=>setUrlInput(e.target.value)}
            onKeyDown={e=>e.key==="Enter"&&addUrl()}
            placeholder="Add URL (annual report, IR page, …)"
            style={{flex:1,background:"none",border:"none",fontSize:"0.72rem",color:tx,fontFamily:"'Barlow',sans-serif"}}/>
        </div>
        <button onClick={addUrl} style={{padding:"7px 12px",background:B.mint,border:"none",borderRadius:8,cursor:"pointer",color:B.nightfall,fontWeight:700,fontSize:"0.7rem",fontFamily:"'Barlow Condensed',sans-serif"}}>
          Add
        </button>
      </div>

      {/* Drop Zone */}
      <div onDragOver={e=>{e.preventDefault();setDragOver(true);}} onDragLeave={()=>setDragOver(false)} onDrop={handleDrop}
        onClick={()=>document.getElementById("fileInput").click()}
        style={{padding:"20px",border:`2px dashed ${dragOver?B.mint:bdr}`,borderRadius:10,textAlign:"center",
          cursor:"pointer",transition:"all .2s",background:dragOver?`${B.mint}08`:"transparent"}}>
        <Ph.Upload s={20} c={dragOver?B.mint:mu}/>
        <div style={{fontSize:"0.72rem",color:dragOver?B.mint:mu,marginTop:8,fontFamily:"'Barlow Condensed',sans-serif",fontWeight:600}}>
          Drop files here or click to browse
        </div>
        <div style={{fontSize:"0.64rem",color:mu,marginTop:4}}>PDF · PPTX · Excel · CSV · JSON · YAML</div>
        <input id="fileInput" type="file" multiple style={{display:"none"}} accept=".pdf,.pptx,.docx,.xlsx,.csv,.json,.yaml,.yml"
          onChange={e=>Array.from(e.target.files).forEach(addFile)}/>
      </div>

      {/* Source List */}
      {sources.length>0&&(
        <div style={{display:"flex",flexDirection:"column",gap:6}}>
          <div style={{fontSize:"0.58rem",fontWeight:700,color:mu,textTransform:"uppercase",letterSpacing:".06em",fontFamily:"'Barlow Condensed',sans-serif"}}>
            {sources.length} source{sources.length!==1?"s":""} loaded
          </div>
          {sources.map(src=>(
            <div key={src.id} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 10px",background:bg,border:`1px solid ${bdr}`,borderRadius:8}}>
              <div style={{flexShrink:0}}>{typeIcon(src.type)}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:"0.68rem",fontWeight:600,color:tx,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{src.name}</div>
                <div style={{fontSize:"0.6rem",color:mu}}>{src.type}{src.size?` · ${src.size}`:""}</div>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:5,flexShrink:0}}>
                <div style={{width:7,height:7,borderRadius:"50%",background:statusColor(src.status)}}/>
                <button onClick={()=>setSources(p=>p.filter(s=>s.id!==src.id))}
                  style={{background:"none",border:"none",cursor:"pointer",padding:2,opacity:.6}}>
                  <Ph.Trash s={12} c={mu}/>
                </button>
              </div>
            </div>
          ))}
        </div>
      )}

      {sources.length===0&&(
        <div style={{textAlign:"center",padding:"20px 0",color:mu,fontSize:"0.68rem"}}>
          <Ph.Database s={28} c={mu}/>
          <div style={{marginTop:8}}>No sources added yet</div>
        </div>
      )}
    </div>
  );
}

// ── Use Case Creator Wizard ────────────────────────────────────────────────────
function UCCreator({dark,sources,onSave,apiKey}){
  const [step,setStep]=useState(1);
  const [loading,setLoading]=useState(false);
  const [form,setForm]=useState({title:"",domain:"Commercial",goal:"",kpis:[],questions:[],value:"",owner:""});
  const [aiSuggestions,setAiSuggestions]=useState(null);
  const [customKpi,setCustomKpi]=useState("");
  const bg=dark?"#0f172a":"#ffffff";
  const tx=dark?"#e2e8f0":B.nightfall;
  const mu=dark?"#64748b":"#94a3b8";
  const bdr=dark?"#1e293b":"#e2e8f0";
  const c=DOMAIN_COL[form.domain]||B.mint;

  const runAI=async()=>{
    setLoading(true);
    const sys=`You are an Analytics Framework expert. Based on the context suggest:
1. 3-5 relevant KPI keys from the catalog (as array "kpis")
2. 3 key questions for this use case (as array "questions")  
3. Business Value Statement (as string "value")
Reply ONLY as JSON: {"kpis":[],"questions":[],"value":""}`;
    const userMsg=`Use Case Title: ${form.title}\nDomain: ${form.domain}\nGoal: ${form.goal}\nAvailable Sources: ${sources.map(s=>s.name).join(", ")||"none"}`;
    try{
      let result;
      if(apiKey){
        const raw=await callGemini(apiKey,sys,userMsg);
        const jsonMatch=raw.match(/\{[\s\S]*\}/);
        result=jsonMatch?JSON.parse(jsonMatch[0]):null;
      }
      if(!result){
        // Fallback: rule-based suggestions
        const domainKpis={
          "Commercial":["margin.gm.pct","sales.net_sales.delivery","crm.clv.amount"],
          "Finance":["wc.ccc.days","cost.unit.amount","fin.cash.balance"],
          "Operations":["ops.oee.pct","quality.fpy.pct","ops.mtbf.hours"],
          "Supply Chain":["supply.otif.pct","inv.dio.days","plan.forecast.accuracy.pct"],
          "Experience":["svc.sla.attainment.pct","res.utilization.pct","svc.csat.score"],
          "Executive":["margin.gm.pct","ops.oee.pct","wc.ccc.days"],
        };
        result={
          kpis:domainKpis[form.domain]||[],
          questions:[`How does ${form.title} develop vs. plan?`,`Where are the main drivers for ${form.goal}?`,"What actions can be derived from this?"],
          value:`Improving ${form.goal} through data-driven decisions in the ${form.domain} domain.`
        };
      }
      setAiSuggestions(result);
      setForm(p=>({...p,...result}));
      setStep(3);
    }catch(e){console.error(e);}
    setLoading(false);
  };

  const newId=useMemo(()=>{
    const prefix={Commercial:"COM",Finance:"FIN",Operations:"OPS","Supply Chain":"SCM",Experience:"XD",Executive:"XD"}[form.domain]||"UC";
    const existing=USE_CASES.filter(u=>u.id.startsWith(prefix)).length;
    return`${prefix}-${String(existing+1).padStart(3,"0")}`;
  },[form.domain]);

  const handleSave=()=>{
    const newUC={id:newId,title:form.title,domain:form.domain,strategicKpi:form.kpis[0]||"",
      kpis:form.kpis,actionCodes:[],status:"draft",completeness:25};
    onSave(newUC,form);
  };

  const stepLabel=["","Context","AI Derivation","Review & Save"];

  return(
    <div style={{height:"100%",overflow:"auto",padding:"16px 14px",display:"flex",flexDirection:"column",gap:12}}>
      <div>
        <div className="heading" style={{fontSize:"0.9rem",color:tx,marginBottom:2}}>Create Use Case</div>
        <div style={{display:"flex",gap:0,marginTop:8}}>
          {[1,2,3].map(s=>(
            <div key={s} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
              <div style={{width:24,height:24,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",
                background:step>=s?c:(dark?"#1e293b":"#e2e8f0"),
                border:`2px solid ${step>=s?c:(dark?"#334155":"#cbd5e1")}`,
                fontSize:"0.7rem",fontWeight:700,color:step>=s?(dark?"#000":"#fff"):mu}}>
                {step>s?<Ph.CheckCircle s={12} c={dark?"#000":"#fff"}/>:s}
              </div>
              <div style={{fontSize:"0.55rem",color:step===s?c:mu,fontWeight:step===s?700:400,textAlign:"center",fontFamily:"'Barlow Condensed',sans-serif"}}>{stepLabel[s]}</div>
            </div>
          ))}
        </div>
      </div>

      {step===1&&(
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          <div>
            <label style={{fontSize:"0.62rem",fontWeight:700,color:mu,textTransform:"uppercase",letterSpacing:".06em",fontFamily:"'Barlow Condensed',sans-serif",display:"block",marginBottom:5}}>Title</label>
            <input value={form.title} onChange={e=>setForm(p=>({...p,title:e.target.value}))}
              placeholder="e.g. Margin Performance by Customer"
              style={{width:"100%",padding:"8px 10px",background:bg,border:`1px solid ${bdr}`,borderRadius:8,fontSize:"0.72rem",color:tx,fontFamily:"'Barlow',sans-serif"}}/>
          </div>
          <div>
            <label style={{fontSize:"0.62rem",fontWeight:700,color:mu,textTransform:"uppercase",letterSpacing:".06em",fontFamily:"'Barlow Condensed',sans-serif",display:"block",marginBottom:5}}>Domain</label>
            <select value={form.domain} onChange={e=>setForm(p=>({...p,domain:e.target.value}))}
              style={{width:"100%",padding:"8px 10px",background:bg,border:`1px solid ${bdr}`,borderRadius:8,fontSize:"0.72rem",color:tx,fontFamily:"'Barlow',sans-serif",cursor:"pointer"}}>
              {Object.keys(DOMAIN_COL).map(d=><option key={d}>{d}</option>)}
            </select>
          </div>
          <div>
            <label style={{fontSize:"0.62rem",fontWeight:700,color:mu,textTransform:"uppercase",letterSpacing:".06em",fontFamily:"'Barlow Condensed',sans-serif",display:"block",marginBottom:5}}>Goal / Business Problem</label>
            <textarea value={form.goal} onChange={e=>setForm(p=>({...p,goal:e.target.value}))}
              rows={3} placeholder="e.g. Margin improvement through pricing optimization and customer segmentation"
              style={{width:"100%",padding:"8px 10px",background:bg,border:`1px solid ${bdr}`,borderRadius:8,fontSize:"0.72rem",color:tx,fontFamily:"'Barlow',sans-serif",resize:"none"}}/>
          </div>
          <button onClick={()=>form.title&&form.goal?setStep(2):null}
            disabled={!form.title||!form.goal}
            style={{padding:"9px",background:form.title&&form.goal?c:"transparent",border:`1px solid ${c}`,borderRadius:8,
              cursor:form.title&&form.goal?"pointer":"not-allowed",color:form.title&&form.goal?(dark?"#000":"#fff"):c,
              fontWeight:700,fontSize:"0.75rem",fontFamily:"'Barlow Condensed',sans-serif",letterSpacing:".04em",
              opacity:form.title&&form.goal?1:.5}}>
            Continue to AI Derivation
          </button>
        </div>
      )}

      {step===2&&(
        <div style={{display:"flex",flexDirection:"column",gap:10,alignItems:"center",textAlign:"center",padding:"16px 0"}}>
          <Ph.Sparkle s={32} c={c}/>
          <div className="heading" style={{fontSize:"0.9rem",color:tx}}>AI Analyzing Context</div>
          <p style={{fontSize:"0.7rem",color:mu,lineHeight:1.6}}>Gemini derives KPIs, key questions and business value from your context.{!apiKey&&" (No API Key → rule-based fallback)"}</p>
          <button onClick={runAI} disabled={loading}
            style={{padding:"10px 20px",background:c,border:"none",borderRadius:8,cursor:loading?"wait":"pointer",
              color:dark?"#000":"#fff",fontWeight:700,fontSize:"0.75rem",fontFamily:"'Barlow Condensed',sans-serif",
              display:"flex",alignItems:"center",gap:7,opacity:loading?.7:1}}>
            {loading?<span style={{animation:"pulse 1s infinite"}}>Analyzing…</span>:<><Ph.Sparkle s={14} c={dark?"#000":"#fff"}/>Generate AI Suggestions</>}
          </button>
          <button onClick={()=>setStep(1)} style={{background:"none",border:"none",cursor:"pointer",color:mu,fontSize:"0.65rem"}}>Back</button>
        </div>
      )}

      {step===3&&(
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          <div style={{padding:"10px 12px",background:`${c}10`,border:`1px solid ${c}20`,borderRadius:8}}>
            <div style={{fontSize:"0.62rem",fontWeight:700,color:c,fontFamily:"'Barlow Condensed',sans-serif",marginBottom:3}}>New ID: {newId}</div>
            <div className="heading" style={{fontSize:"0.85rem",color:tx}}>{form.title}</div>
            <div style={{fontSize:"0.65rem",color:mu,marginTop:2}}>{form.domain}</div>
          </div>
          <div>
            <div style={{fontSize:"0.62rem",fontWeight:700,color:mu,textTransform:"uppercase",letterSpacing:".06em",fontFamily:"'Barlow Condensed',sans-serif",marginBottom:5}}>Suggested KPIs</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:6}}>
              {form.kpis.map(k=>(
                <span key={k} style={{fontSize:"0.65rem",padding:"2px 9px",background:`${c}14`,border:`1px solid ${c}30`,borderRadius:6,color:c,fontWeight:600,display:"flex",alignItems:"center",gap:4}}>
                  {window.__KPI_DATA__[k]?.key||k}
                  <button onClick={()=>setForm(p=>({...p,kpis:p.kpis.filter(x=>x!==k)}))} style={{background:"none",border:"none",cursor:"pointer",padding:0,display:"flex"}}><Ph.X s={9} c={c}/></button>
                </span>
              ))}
            </div>
            <div style={{display:"flex",gap:5}}>
              <input value={customKpi} onChange={e=>setCustomKpi(e.target.value)} placeholder="Add KPI key…"
                style={{flex:1,padding:"6px 9px",background:bg,border:`1px solid ${bdr}`,borderRadius:7,fontSize:"0.68rem",color:tx,fontFamily:"'Barlow',sans-serif"}}/>
              <button onClick={()=>{if(customKpi.trim()){setForm(p=>({...p,kpis:[...p.kpis,customKpi.trim()]}));setCustomKpi("");}}}
                style={{padding:"6px 10px",background:`${c}20`,border:`1px solid ${c}30`,borderRadius:7,cursor:"pointer",color:c}}>
                <Ph.Plus s={13} c={c}/>
              </button>
            </div>
          </div>
          <div>
            <div style={{fontSize:"0.62rem",fontWeight:700,color:mu,textTransform:"uppercase",letterSpacing:".06em",fontFamily:"'Barlow Condensed',sans-serif",marginBottom:5}}>Business Value</div>
            <textarea value={form.value} onChange={e=>setForm(p=>({...p,value:e.target.value}))} rows={2}
              style={{width:"100%",padding:"8px 10px",background:bg,border:`1px solid ${bdr}`,borderRadius:8,fontSize:"0.7rem",color:tx,fontFamily:"'Barlow',sans-serif",resize:"none"}}/>
          </div>
          <div style={{display:"flex",gap:6}}>
            <button onClick={()=>setStep(2)} style={{flex:1,padding:"9px",background:"transparent",border:`1px solid ${bdr}`,borderRadius:8,cursor:"pointer",color:mu,fontSize:"0.7rem",fontFamily:"'Barlow Condensed',sans-serif"}}>Back</button>
            <button onClick={handleSave} disabled={!form.title}
              style={{flex:2,padding:"9px",background:c,border:"none",borderRadius:8,cursor:"pointer",
                color:dark?"#000":"#fff",fontWeight:700,fontSize:"0.75rem",fontFamily:"'Barlow Condensed',sans-serif",display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
              <Ph.CheckCircle s={14} c={dark?"#000":"#fff"}/>Save Use Case
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

// ── Chat Panel (Context-Aware + Gemini) ───────────────────────────────────────
function ChatPanel({dark,apiKey,contextLock,onAgentCmd}){
  const [msgs,setMsgs]=useState([{id:1,role:"a",text:"Welcome to **Strategy Studio**!\n\nI'm your AI assistant — powered by Gemini when an API key is configured.\n\nAsk me about:\n• KPIs (e.g. `margin.gm.pct`)\n• Use Cases (e.g. `COM-001`)\n• Gaps in the framework\n• Or select a node in the tree / a card for context-aware chat"}]);
  const [input,setInput]=useState("");
  const [loading,setLoading]=useState(false);
  const [mode,setMode]=useState("explain");
  const endRef=useRef(null);

  useEffect(()=>{endRef.current?.scrollIntoView({behavior:"smooth"});},[msgs]);

  useEffect(()=>{
    if(contextLock){
      const label=contextLock.type==="kpi"?(window.__KPI_DATA__[contextLock.id]?.key||contextLock.id):contextLock.id;
      setMsgs(p=>[...p,{id:Date.now(),role:"a",text:`**Context active: ${label}**\n\nI'm now focused on this element. What would you like to know or improve?`}]);
    }
  },[contextLock]);

  const send=async()=>{
    if(!input.trim()||loading)return;
    const q=input.trim();setInput("");
    const userMsg={id:Date.now(),role:"u",text:q};
    setMsgs(p=>[...p,userMsg]);
    setLoading(true);
    try{
      let rawAnswer;
      const modeInstruction={
        explain:"Explain precisely and in a structured way. Use Markdown for formatting.",
        complete:"Complete the missing element and suggest concrete values/definitions. If the user explicitly wants a change, use the %%CMD%% syntax.",
        validate:"Validate the element against best practices and list concrete improvements with priority."
      }[mode];
      const ctxInfo=contextLock?`Aktives Element: ${contextLock.type} "${contextLock.id}"${contextLock.type==="kpi"&&window.__KPI_DATA__[contextLock.id]?` (${window.__KPI_DATA__[contextLock.id].key})`:""}`:"Kein Element aktiv";
      const sys=AGENT_SYSTEM+`\n\nModus: ${mode}\n${ctxInfo}\n${modeInstruction}`;
      if(apiKey){
        rawAnswer=await callGemini(apiKey,sys,q);
      }else{
        rawAnswer=localAnswer(q,contextLock);
      }
      // Parse agent commands
      const cmds=parseAgentCommands(rawAnswer);
      const cleanAnswer=stripAgentCommands(rawAnswer);
      if(cmds.length>0){
        // Show pending commands for approval
        setMsgs(p=>[...p,{id:Date.now()+1,role:"a",text:cleanAnswer},
          {id:Date.now()+2,role:"cmd",cmds,text:`**${cmds.length} change${cmds.length!==1?"s":""} suggested** — Accept?`}]);
      }else{
        setMsgs(p=>[...p,{id:Date.now()+1,role:"a",text:cleanAnswer}]);
      }
    }catch(e){
      setMsgs(p=>[...p,{id:Date.now()+1,role:"a",text:`**Fehler:** ${e.message}`}]);
    }
    setLoading(false);
  };

  const bg=dark?"#080e1a":"#ffffff";
  const tx=dark?"#e2e8f0":B.nightfall;
  const mu=dark?"#64748b":"#94a3b8";
  const bdr=dark?"rgba(255,255,255,.07)":"rgba(19,41,75,.09)";

  const renderText=(t)=>t.split("\n").map((line,i)=>{
    if(line.startsWith("**")&&line.endsWith("**"))return<strong key={i} style={{display:"block",marginTop:i>0?4:0}}>{line.slice(2,-2)}</strong>;
    const parts=line.split(/(\*\*[^*]+\*\*|`[^`]+`)/g);
    return<p key={i} style={{margin:"2px 0",lineHeight:1.55}}>{parts.map((p,j)=>{
      if(p.startsWith("**")&&p.endsWith("**"))return<strong key={j}>{p.slice(2,-2)}</strong>;
      if(p.startsWith("`")&&p.endsWith("`"))return<code key={j} style={{fontFamily:"monospace",fontSize:".87em",color:B.cyan,background:dark?"#0f172a":"#f1f5f9",padding:"1px 4px",borderRadius:4}}>{p.slice(1,-1)}</code>;
      if(p.startsWith("•"))return<span key={j} style={{display:"block",paddingLeft:8,marginTop:1}}>{p}</span>;
      return<span key={j}>{p}</span>;
    })}</p>;
  });

  return(
    <div style={{display:"flex",flexDirection:"column",height:"100%",overflow:"hidden"}}>
      {/* Mode selector */}
      <div style={{padding:"8px 10px",borderBottom:`1px solid ${bdr}`,flexShrink:0,display:"flex",gap:3,background:dark?"#0c1528":"#f8fafc"}}>
        {[{id:"explain",label:"Explain"},{id:"complete",label:"Complete"},{id:"validate",label:"Validate"}].map(m=>(
          <button key={m.id} onClick={()=>setMode(m.id)}
            style={{flex:1,padding:"5px 4px",borderRadius:6,border:"none",cursor:"pointer",fontSize:"0.62rem",fontWeight:700,
              fontFamily:"'Barlow Condensed',sans-serif",letterSpacing:".03em",
              background:mode===m.id?B.mint:"transparent",
              color:mode===m.id?B.nightfall:mu}}>
            {m.label}
          </button>
        ))}
      </div>

      {/* Context lock indicator */}
      {contextLock&&(
        <div style={{padding:"5px 10px",background:`${DOMAIN_COL[contextLock.domain]||B.mint}12`,borderBottom:`1px solid ${DOMAIN_COL[contextLock.domain]||B.mint}20`,fontSize:"0.6rem",color:DOMAIN_COL[contextLock.domain]||B.mint,fontWeight:700,fontFamily:"'Barlow Condensed',sans-serif",display:"flex",alignItems:"center",gap:5}}>
          <Ph.Target s={10} c={DOMAIN_COL[contextLock.domain]||B.mint}/>
          Kontext: {contextLock.type==="kpi"?(window.__KPI_DATA__[contextLock.id]?.key||contextLock.id):contextLock.id}
        </div>
      )}

      {/* API Key indicator */}
      {!apiKey&&(
        <div style={{padding:"4px 10px",background:`${B.vanilla}12`,fontSize:"0.58rem",color:B.vanilla,fontFamily:"'Barlow Condensed',sans-serif",display:"flex",alignItems:"center",gap:4}}>
          <Ph.Warning s={10} c={B.vanilla}/>No API Key — rule-based mode
        </div>
      )}

      {/* Messages */}
      <div style={{flex:1,overflow:"auto",padding:"10px 10px",display:"flex",flexDirection:"column",gap:8}}>
        {msgs.map(m=>(
          <div key={m.id} style={{display:"flex",justifyContent:m.role==="u"?"flex-end":"flex-start",flexDirection:"column",alignItems:m.role==="u"?"flex-end":"flex-start"}}>
            {m.role==="cmd"?(
              <div style={{maxWidth:"92%",padding:"9px 11px",borderRadius:8,border:`1px solid ${B.lavender}40`,
                background:dark?`${B.lavender}10`:`${B.lavender}08`,animation:"fadeIn .2s ease"}}>
                <div style={{fontSize:"0.67rem",color:B.lavender,fontWeight:700,fontFamily:"'Barlow Condensed',sans-serif",marginBottom:6}}>
                  {m.cmds.length} Agent-Aktion(en) vorgeschlagen
                </div>
                {m.cmds.map((cmd,i)=>(
                  <div key={i} style={{fontSize:"0.62rem",color:dark?"#cbd5e1":B.nightfall,marginBottom:3,
                    padding:"3px 7px",background:dark?"rgba(255,255,255,.05)":"#f8fafc",borderRadius:5,fontFamily:"monospace"}}>
                    {cmd.action}: {JSON.stringify(cmd.payload).slice(0,60)}…
                  </div>
                ))}
                <div style={{display:"flex",gap:5,marginTop:7}}>
                  <button onClick={()=>{if(onAgentCmd)m.cmds.forEach(c=>onAgentCmd(c));}}
                    style={{flex:1,padding:"5px",background:B.mint,border:"none",borderRadius:6,cursor:"pointer",
                      fontSize:"0.63rem",fontWeight:700,color:B.nightfall,fontFamily:"'Barlow Condensed',sans-serif",
                      display:"flex",alignItems:"center",justifyContent:"center",gap:4}}>
                    <Ph.CheckCircle s={11} c={B.nightfall}/>Annehmen
                  </button>
                  <button onClick={()=>setMsgs(p=>p.filter(x=>x.id!==m.id))}
                    style={{flex:1,padding:"5px",background:"transparent",border:`1px solid ${dark?"#334155":"#e2e8f0"}`,borderRadius:6,cursor:"pointer",
                      fontSize:"0.63rem",color:dark?"#64748b":"#94a3b8",fontFamily:"'Barlow Condensed',sans-serif"}}>
                    Ablehnen
                  </button>
                </div>
              </div>
            ):(
              <div style={{maxWidth:"88%",padding:"8px 11px",borderRadius:m.role==="u"?"12px 12px 3px 12px":"12px 12px 12px 3px",
                background:m.role==="u"?B.mint:(dark?"#0f172a":"#f1f5f9"),
                color:m.role==="u"?B.nightfall:tx,
                fontSize:"0.71rem",lineHeight:1.5,fontFamily:"'Barlow',sans-serif",
                animation:"fadeIn .2s ease"}}>
                {renderText(m.text)}
              </div>
            )}
          </div>
        ))}
        {loading&&(
          <div style={{display:"flex",gap:5,padding:"8px 11px",background:dark?"#0f172a":"#f1f5f9",borderRadius:"12px 12px 12px 3px",width:"fit-content"}}>
            {[0,1,2].map(i=><div key={i} style={{width:6,height:6,borderRadius:"50%",background:B.mint,animation:`bounce .9s ease ${i*.2}s infinite`}}/>)}
          </div>
        )}
        <div ref={endRef}/>
      </div>

      {/* Input */}
      <div style={{padding:"8px 10px",borderTop:`1px solid ${bdr}`,flexShrink:0,background:dark?"#0c1528":"#f8fafc"}}>
        <div style={{display:"flex",gap:6,alignItems:"flex-end"}}>
          <textarea value={input} onChange={e=>setInput(e.target.value)}
            onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}}}
            rows={3} placeholder="Ask the framework assistant…"
            style={{flex:1,padding:"7px 10px",background:dark?"#0f172a":"#ffffff",border:`1px solid ${bdr}`,borderRadius:9,fontSize:"0.7rem",color:tx,resize:"none",fontFamily:"'Barlow',sans-serif"}}/>
          <button onClick={send} disabled={!input.trim()||loading}
            style={{padding:"8px 10px",background:input.trim()&&!loading?B.mint:"transparent",
              border:`1px solid ${input.trim()&&!loading?B.mint:bdr}`,borderRadius:9,cursor:"pointer",
              opacity:input.trim()&&!loading?1:.5,transition:"all .2s"}}>
            <Ph.ArrowUp s={14} c={input.trim()&&!loading?B.nightfall:(dark?"#475569":"#94a3b8")}/>
          </button>
        </div>
        <div style={{fontSize:"0.53rem",color:mu,marginTop:4,textAlign:"center",fontFamily:"'Barlow',sans-serif"}}>Enter = Senden · Shift+Enter = Umbruch</div>
      </div>
    </div>
  );
}

// ── Sidebar ────────────────────────────────────────────────────────────────────
function InputSidebar({dark,state,setState}){
  const [sections,setSections]=useState({context:true,settings:false});
  const toggle=k=>setSections(p=>({...p,[k]:!p[k]}));
  const bg=dark?"#0c1528":"#ffffff";
  const tx=dark?"#e2e8f0":B.nightfall;
  const mu=dark?"#64748b":"#94a3b8";
  const bdr=dark?"rgba(255,255,255,.07)":"rgba(19,41,75,.09)";

  const Section=({id,label,icon,children})=>(
    <div style={{borderBottom:`1px solid ${bdr}`}}>
      <button onClick={()=>toggle(id)} style={{width:"100%",display:"flex",alignItems:"center",gap:7,padding:"9px 12px",background:"none",border:"none",cursor:"pointer",textAlign:"left"}}>
        {icon}<span className="subhead" style={{flex:1,fontSize:"0.7rem",color:tx}}>{label}</span>
        {sections[id]?<Ph.CaretDown s={11} c={mu}/>:<Ph.CaretRight s={11} c={mu}/>}
      </button>
      {sections[id]&&<div style={{padding:"0 12px 10px"}}>{children}</div>}
    </div>
  );

  const stats={total:USE_CASES.length,ready:USE_CASES.filter(u=>u.status==="ready").length,avg:Math.round(USE_CASES.reduce((s,u)=>s+u.completeness,0)/USE_CASES.length)};

  return(
    <div style={{height:"100%",overflow:"auto",background:bg}}>
      {/* Logo area */}
      <div style={{padding:"12px",borderBottom:`1px solid ${bdr}`}}>
        <div style={{fontSize:"0.58rem",fontWeight:700,color:mu,textTransform:"uppercase",letterSpacing:".06em",marginBottom:6,fontFamily:"'Barlow Condensed',sans-serif"}}>Framework Status</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6}}>
          {[{v:stats.total,l:"Use Cases",c:tx},{v:stats.ready,l:"Ready",c:B.mint},{v:`${stats.avg}%`,l:"∅ Score",c:scoreColor(stats.avg)}].map(s=>(
            <div key={s.l} style={{textAlign:"center",padding:"5px 4px",background:dark?"#0f172a":"#f8fafc",borderRadius:7}}>
              <div className="heading" style={{fontSize:"1.1rem",color:s.c,lineHeight:1}}>{s.v}</div>
              <div style={{fontSize:"0.52rem",color:mu,marginTop:1,fontFamily:"'Barlow Condensed',sans-serif"}}>{s.l}</div>
            </div>
          ))}
        </div>
      </div>

      <Section id="context" label="Company Context" icon={<Ph.Buildings s={13} c={B.mint}/>}>
        {[
          {k:"company",label:"Company",ph:"Aurora AG"},
          {k:"industry",label:"Industry",ph:"FMCG"},
        ].map(f=>(
          <div key={f.k} style={{marginBottom:7}}>
            <label style={{fontSize:"0.57rem",fontWeight:700,color:mu,textTransform:"uppercase",letterSpacing:".05em",fontFamily:"'Barlow Condensed',sans-serif",display:"block",marginBottom:3}}>{f.label}</label>
            <input value={state[f.k]||""} onChange={e=>setState(p=>({...p,[f.k]:e.target.value}))} placeholder={f.ph}
              style={{width:"100%",padding:"7px 9px",background:dark?"#0f172a":"#f8fafc",border:`1px solid ${bdr}`,borderRadius:7,fontSize:"0.72rem",color:tx,fontFamily:"'Barlow',sans-serif"}}/>
          </div>
        ))}
        <div style={{marginBottom:7}}>
          <label style={{fontSize:"0.57rem",fontWeight:700,color:mu,textTransform:"uppercase",letterSpacing:".05em",fontFamily:"'Barlow Condensed',sans-serif",display:"block",marginBottom:3}}>Strategic Goal</label>
          <textarea value={state.goal||""} onChange={e=>setState(p=>({...p,goal:e.target.value}))} rows={2}
            placeholder="e.g. EBITDA +2%, NPS >50"
            style={{width:"100%",padding:"7px 9px",background:dark?"#0f172a":"#f8fafc",border:`1px solid ${bdr}`,borderRadius:7,fontSize:"0.72rem",color:tx,resize:"none",fontFamily:"'Barlow',sans-serif"}}/>
        </div>
      </Section>

      <Section id="settings" label="API & Settings" icon={<Ph.Gear s={13} c={B.blue}/>}>

// ── v5: React Flow Edit Panel (lightweight, CDN-free version) ─────────────────
// Since React Flow requires npm, we implement an interactive edit canvas with
// pure React + SVG that mirrors its core UX: draggable nodes, add/remove,
// double-click to edit — without external dependencies.
function EditableTree({dark,useCases,setUseCases,treeData,setTreeData,onOpenKPI,onAgentCmd}){
  const [nodes,setNodes]=useState(()=>{
    // Flatten tree into positioned nodes
    const flat=[];
    let y=0;
    const walk=(node,depth,parentId)=>{
      flat.push({id:node.id,label:node.label,type:node.type,color:node.color||B.mint,
        x:depth*180+40,y:y*54+40,parentId,editing:false,ucs:node.ucs||[]});
      y++;
      if(node.children)node.children.forEach(c=>walk(c,depth+1,node.id));
    };
    walk(treeData,0,null);
    return flat;
  });
  const [edges]=useState(()=>{
    const e=[];
    const walk=(node)=>{
      if(node.children)node.children.forEach(c=>{e.push({from:node.id,to:c.id});walk(c);});
    };
    walk(treeData);
    return e;
  });
  const [dragging,setDragging]=useState(null);
  const [editingId,setEditingId]=useState(null);
  const [editVal,setEditVal]=useState("");
  const [pendingCmds,setPendingCmds]=useState([]);
  const svgRef=useRef(null);
  const tx=dark?"#e2e8f0":B.nightfall;
  const mu=dark?"#64748b":"#94a3b8";
  const bg=dark?"#0f172a":"#ffffff";
  const bdr=dark?"#1e293b":"#e2e8f0";

  // Process agent commands
  useEffect(()=>{
    if(pendingCmds.length===0)return;
    const cmd=pendingCmds[0];
    if(cmd.action==="add_kpi"){
      setNodes(p=>[...p,{id:cmd.payload.id,label:cmd.payload.label,type:"kpi",
        color:cmd.payload.color||B.mint,x:400,y:Math.random()*300+40,parentId:cmd.payload.parent,editing:false,ucs:[]}]);
    }else if(cmd.action==="update_uc"){
      setUseCases(p=>p.map(u=>u.id===cmd.payload.id?{...u,[cmd.payload.field]:cmd.payload.value}:u));
    }else if(cmd.action==="highlight"){
      onAgentCmd&&onAgentCmd(cmd);
    }
    setPendingCmds(p=>p.slice(1));
  },[pendingCmds]);

  const W=700,H=480;

  const startDrag=(e,id)=>{
    e.preventDefault();
    const rect=svgRef.current.getBoundingClientRect();
    setDragging({id,ox:e.clientX-rect.left,oy:e.clientY-rect.top});
  };
  const onMouseMove=(e)=>{
    if(!dragging)return;
    const rect=svgRef.current.getBoundingClientRect();
    const x=e.clientX-rect.left,y=e.clientY-rect.top;
    setNodes(p=>p.map(n=>n.id===dragging.id?{...n,x,y}:n));
  };
  const onMouseUp=()=>setDragging(null);

  const startEdit=(id,label)=>{setEditingId(id);setEditVal(label);};
  const commitEdit=()=>{
    if(editingId)setNodes(p=>p.map(n=>n.id===editingId?{...n,label:editVal}:n));
    setEditingId(null);
  };
  const deleteNode=(id)=>setNodes(p=>p.filter(n=>n.id!==id));

  const nodeMap=Object.fromEntries(nodes.map(n=>[n.id,n]));

  return(
    <div style={{background:bg,border:`1px solid ${bdr}`,borderRadius:12,overflow:"hidden"}}>
      <div style={{padding:"8px 12px",borderBottom:`1px solid ${bdr}`,background:dark?"#0c1528":"#f8fafc",
        display:"flex",alignItems:"center",gap:8}}>
        <Ph.Gear s={13} c={B.mint}/>
        <span className="subhead" style={{fontSize:"0.7rem",color:tx}}>Edit Mode — Move Nodes</span>
        <span style={{fontSize:"0.6rem",color:mu}}>Double-click = rename · Right-click = delete</span>
        <div style={{marginLeft:"auto",display:"flex",gap:4}}>
          <button onClick={()=>{
            const id="kpi.new."+Date.now();
            setNodes(p=>[...p,{id,label:"Neuer KPI",type:"kpi",color:B.mint,x:350,y:200,parentId:"rev",editing:false,ucs:[]}]);
          }} style={{display:"flex",alignItems:"center",gap:4,padding:"4px 9px",background:`${B.mint}15`,border:`1px solid ${B.mint}30`,borderRadius:6,cursor:"pointer",fontSize:"0.62rem",color:B.mint,fontWeight:700,fontFamily:"'Barlow Condensed',sans-serif"}}>
            <Ph.Plus s={11} c={B.mint}/>Add KPI
          </button>
        </div>
      </div>
      <svg ref={svgRef} width="100%" height={H} style={{display:"block",cursor:dragging?"grabbing":"default"}}
        onMouseMove={onMouseMove} onMouseUp={onMouseUp}>
        {/* Edges */}
        {edges.map((e,i)=>{
          const a=nodeMap[e.from],b=nodeMap[e.to];
          if(!a||!b)return null;
          return<path key={i} d={`M${a.x} ${a.y} C${(a.x+b.x)/2} ${a.y} ${(a.x+b.x)/2} ${b.y} ${b.x} ${b.y}`}
            fill="none" stroke={dark?"rgba(71,215,172,.15)":"rgba(71,215,172,.2)"} strokeWidth={1.5}/>;
        })}
        {/* New node edges */}
        {nodes.filter(n=>n.parentId&&nodeMap[n.parentId]).map((n,i)=>{
          if(edges.some(e=>e.from===n.parentId&&e.to===n.id))return null;
          const p=nodeMap[n.parentId];
          return<path key={"ne"+i} d={`M${p.x} ${p.y} C${(p.x+n.x)/2} ${p.y} ${(p.x+n.x)/2} ${n.y} ${n.x} ${n.y}`}
            fill="none" stroke={`${n.color}30`} strokeWidth={1.5} strokeDasharray="4 3"/>;
        })}
        {/* Nodes */}
        {nodes.map(n=>{
          const isEdit=editingId===n.id;
          return(
            <g key={n.id} transform={`translate(${n.x},${n.y})`}
              onMouseDown={e=>startDrag(e,n.id)}
              onDoubleClick={()=>startEdit(n.id,n.label)}
              onContextMenu={e=>{e.preventDefault();if(n.type!=="root")deleteNode(n.id);}}
              style={{cursor:"grab"}}>
              {n.type==="root"&&<rect x={-52} y={-13} width={104} height={26} rx={13} fill={dark?"#0f172a":B.nightfall} stroke={B.mint} strokeWidth={2}/>}
              {n.type==="strategy"&&<rect x={-50} y={-12} width={100} height={24} rx={6} fill={`${n.color}18`} stroke={n.color} strokeWidth={1.8}/>}
              {n.type==="kpi"&&<circle r={10} fill={dark?`${n.color}20`:"#eef3fb"} stroke={n.color} strokeWidth={1.8}/>}
              {!isEdit&&<text textAnchor="middle" dominantBaseline="middle" fontSize={n.type==="kpi"?"9":"10"}
                fontWeight={n.type==="root"?"800":"700"} fontFamily="'Barlow Condensed',sans-serif"
                fill={n.type==="root"?B.mint:(dark?n.color:B.nightfall)}>
                {n.label.length>14?n.label.slice(0,13)+"…":n.label}
              </text>}
              {isEdit&&(
                <foreignObject x={-60} y={-14} width={120} height={28}>
                  <input value={editVal} onChange={e=>setEditVal(e.target.value)}
                    onBlur={commitEdit} onKeyDown={e=>e.key==="Enter"&&commitEdit()}
                    autoFocus
                    style={{width:"100%",height:"100%",background:bg,border:`1px solid ${n.color}`,borderRadius:4,
                      fontSize:"10px",fontWeight:700,color:tx,textAlign:"center",fontFamily:"'Barlow Condensed',sans-serif",padding:"2px 4px"}}/>
                </foreignObject>
              )}
              {n.ucs?.length>0&&<g transform="translate(16,-16)">
                <circle r={7} fill={n.color}/>
                <text textAnchor="middle" dominantBaseline="middle" fontSize="7" fontWeight="800" fill="#000">{n.ucs.length}</text>
              </g>}
            </g>
          );
        })}
      </svg>
      <div style={{padding:"6px 12px",borderTop:`1px solid ${bdr}`,fontSize:"0.58rem",color:mu,background:dark?"#0c1528":"#f8fafc"}}>
        {nodes.length} nodes · Double-click = rename · Right-click = delete · Drag = move
      </div>
    </div>
  );
}

// ── v5: Perplexity helper ────────────────────────────────────────────────────
async function callPerplexity(apiKey, question){
  const r=await fetch("https://api.perplexity.ai/chat/completions",{
    method:"POST",
    headers:{"Authorization":`Bearer ${apiKey}`,"Content-Type":"application/json"},
    body:JSON.stringify({model:"sonar",messages:[{role:"user",content:question}],return_citations:true})
  });
  if(!r.ok)throw new Error("Perplexity API error "+r.status);
  const d=await r.json();
  return{answer:d.choices?.[0]?.message?.content||"",citations:d.citations||[]};
}

// ── v5: Agentic command parser ────────────────────────────────────────────────
// Gemini can return structured commands embedded in responses
// Format: %%CMD%%{"action":"add_node","payload":{...}}%%END%%
function parseAgentCommands(text){
  const cmds=[];
  const re=/%%CMD%%(.+?)%%END%%/gs;
  let m;
  while((m=re.exec(text))!==null){
    try{cmds.push(JSON.parse(m[1]));}catch(e){}
  }
  return cmds;
}
function stripAgentCommands(text){return text.replace(/%%CMD%%(.+?)%%END%%/gs,"").trim();}
