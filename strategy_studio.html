function useKpiSearch(query){
  return useMemo(()=>{
    if(!query||query.length<2)return[];
    const q=query.toLowerCase();
    return Object.entries(window.__KPI_DATA__)
      .filter(([id,kd])=>id.includes(q)||kd.key?.toLowerCase().includes(q)||kd.purpose?.toLowerCase().includes(q))
      .slice(0,8)
      .map(([id,kd])=>({id,key:kd.key,type:kd.type}));
  },[query]);
}

// ── v4: Gap Report ─────────────────────────────────────────────────────────────
function GapReport({dark,useCases,onOpenFS,onOpenChat}){
  const [sortBy,setSortBy]=useState("score");
  const [filterStatus,setFilterStatus]=useState("");
  const bg=dark?"#0f172a":"#ffffff";
  const tx=dark?"#e2e8f0":B.nightfall;
  const mu=dark?"#64748b":"#94a3b8";
  const bdr=dark?"#1e293b":"#e2e8f0";

  const gapFields=(uc)=>{
    const fs=window.__FS_DATA__[uc.id];
    const gaps=[];
    if(!fs?.purpose||fs.purpose==="—")gaps.push({label:"Purpose missing",severity:"high"});
    if(!fs?.value||fs.value==="—")gaps.push({label:"Business Value missing",severity:"high"});
    if(!fs?.owner||fs.owner==="—")gaps.push({label:"Business Owner missing",severity:"medium"});
    if(!fs?.questions||fs.questions.length===0)gaps.push({label:"Key questions missing",severity:"medium"});
    if(uc.kpis.length===0)gaps.push({label:"No KPIs linked",severity:"high"});
    const hasDAX=uc.kpis.some(k=>window.__KPI_DATA__[k]?.dax);
    if(!hasDAX)gaps.push({label:"DAX measures missing",severity:"low"});
    if(uc.actionCodes.length===0)gaps.push({label:"Action codes missing",severity:"low"});
    return gaps;
  };

  const sorted=useMemo(()=>{
    let list=filterStatus?useCases.filter(u=>scoreLabel(u.completeness).toLowerCase()===filterStatus):useCases;
    return [...list].sort((a,b)=>sortBy==="score"?a.completeness-b.completeness:a.id.localeCompare(b.id));
  },[useCases,sortBy,filterStatus]);

  const totalGaps=useCases.reduce((sum,uc)=>sum+gapFields(uc).length,0);
  const highGaps=useCases.reduce((sum,uc)=>sum+gapFields(uc).filter(g=>g.severity==="high").length,0);

  return(
    <div style={{height:"100%",overflow:"auto",padding:"14px"}}>
      {/* Summary bar */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginBottom:14}}>
        {[
          {v:totalGaps,l:"Total Gaps",c:B.pink,icon:<Ph.Warning s={13} c={B.pink}/>},
          {v:highGaps,l:"Critical",c:B.pink,icon:<Ph.Warning s={13} c={B.pink}/>},
          {v:useCases.filter(u=>u.completeness>=80).length,l:"Ready",c:B.mint,icon:<Ph.CheckCircle s={13} c={B.mint}/>},
          {v:Math.round(useCases.reduce((s,u)=>s+u.completeness,0)/useCases.length),l:"∅ Score",c:scoreColor(Math.round(useCases.reduce((s,u)=>s+u.completeness,0)/useCases.length)),icon:<Ph.Target s={13} c={scoreColor(Math.round(useCases.reduce((s,u)=>s+u.completeness,0)/useCases.length))}/>},
        ].map(s=>(
          <div key={s.l} style={{padding:"10px 12px",background:bg,border:`1px solid ${s.c}25`,borderRadius:10,textAlign:"center"}}>
            <div style={{display:"flex",justifyContent:"center",marginBottom:4}}>{s.icon}</div>
            <div className="heading" style={{fontSize:"1.3rem",color:s.c,lineHeight:1}}>{s.v}{s.l==="∅ Score"?"%":""}</div>
            <div style={{fontSize:"0.57rem",color:mu,marginTop:2,fontFamily:"'Barlow Condensed',sans-serif"}}>{s.l}</div>
          </div>
        ))}
      </div>

      {/* Controls */}
      <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}}>
        <div style={{display:"flex",gap:2,background:dark?"#1a2744":"#f1f5f9",borderRadius:7,padding:3}}>
          {[{id:"score",label:"By Score"},{id:"id",label:"By ID"}].map(s=>(
            <button key={s.id} onClick={()=>setSortBy(s.id)}
              style={{padding:"4px 10px",borderRadius:5,border:"none",cursor:"pointer",fontSize:"0.6rem",fontWeight:700,
                fontFamily:"'Barlow Condensed',sans-serif",background:sortBy===s.id?B.mint:"transparent",
                color:sortBy===s.id?B.nightfall:mu}}>
              {s.label}
            </button>
          ))}
        </div>
        {["","ready","review","draft"].map(s=>(
          <button key={s||"all"} onClick={()=>setFilterStatus(s)}
            style={{fontSize:"0.6rem",padding:"3px 9px",border:`1px solid ${filterStatus===s?(s?scoreColor(s==="ready"?90:s==="review"?65:30):B.mint):bdr}`,
              borderRadius:6,cursor:"pointer",fontFamily:"'Barlow Condensed',sans-serif",fontWeight:filterStatus===s?700:400,
              background:filterStatus===s?`${s?scoreColor(s==="ready"?90:s==="review"?65:30):B.mint}14`:"transparent",
              color:filterStatus===s?(s?scoreColor(s==="ready"?90:s==="review"?65:30):B.mint):mu}}>

      </div>

      {/* Use Case rows */}
      <div style={{display:"flex",flexDirection:"column",gap:7}}>
        {sorted.map(uc=>{

// ── v4: Dependency Network (Force-directed D3) ─────────────────────────────────
function DependencyNetwork({dark,useCases,onOpenFS}){
  const svgRef=useRef(null);
  const wrapRef=useRef(null);
  const [hovNode,setHovNode]=useState(null);

  useEffect(()=>{
    if(!svgRef.current||!wrapRef.current)return;
    const W=wrapRef.current.clientWidth||700,H=420;
    const svg=d3.select(svgRef.current).attr("width",W).attr("height",H);
    svg.selectAll("*").remove();

    // Build nodes: Use Cases + shared KPIs
    const kpiShared={};
    useCases.forEach(uc=>{
      uc.kpis.forEach(k=>{
        if(!kpiShared[k])kpiShared[k]={id:k,type:"kpi",label:window.__KPI_DATA__[k]?.key||k,ucs:[]};
        kpiShared[k].ucs.push(uc.id);
      });
    });
    // Only show KPIs shared by 2+ use cases
    const sharedKpis=Object.values(kpiShared).filter(k=>k.ucs.length>=2);
    const ucNodes=useCases.map(u=>({id:u.id,type:"uc",label:u.id,domain:u.domain,completeness:u.completeness}));
    const kpiNodes=sharedKpis.map(k=>({id:k.id,type:"kpi",label:k.label}));
    const nodes=[...ucNodes,...kpiNodes];
    const links=[];
    sharedKpis.forEach(k=>{k.ucs.forEach(uid=>{links.push({source:uid,target:k.id,kpi:k.id});});});

    const sim=d3.forceSimulation(nodes)
      .force("link",d3.forceLink(links).id(d=>d.id).distance(80).strength(0.6))
      .force("charge",d3.forceManyBody().strength(-180))
      .force("center",d3.forceCenter(W/2,H/2))
      .force("collision",d3.forceCollide(26));

    const zoom=d3.zoom().scaleExtent([.3,2.5]).on("zoom",e=>g.attr("transform",e.transform));
    svg.call(zoom);
    const g=svg.append("g");

    const link=g.append("g").selectAll("line").data(links).enter().append("line")
      .attr("stroke",dark?"rgba(71,215,172,.15)":"rgba(71,215,172,.25)").attr("stroke-width",1.5);

    const node=g.append("g").selectAll("g").data(nodes).enter().append("g")
      .style("cursor","pointer")
      .call(d3.drag().on("start",(e,d)=>{if(!e.active)sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y;})
        .on("drag",(e,d)=>{d.fx=e.x;d.fy=e.y;})
        .on("end",(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null;}))
      .on("click",(e,d)=>{if(d.type==="uc")onOpenFS(d.id);})
      .on("mouseover",(e,d)=>setHovNode(d))
      .on("mouseout",()=>setHovNode(null));

    node.each(function(d){
      const el=d3.select(this);
      if(d.type==="uc"){
        const c=DOMAIN_COL[d.domain]||B.mint;
        const sc=scoreColor(d.completeness);
        el.append("circle").attr("r",18).attr("fill",dark?`${c}18`:`${c}12`).attr("stroke",sc).attr("stroke-width",2);
        el.append("text").attr("y",1).attr("text-anchor","middle").attr("dominant-baseline","middle")
          .attr("font-size","7px").attr("font-weight","800").attr("font-family","'Barlow Condensed',sans-serif")
          .attr("fill",dark?c:B.nightfall).text(d.label);
      }else{
        el.append("circle").attr("r",9).attr("fill",dark?"#1a2a44":"#eef3fb").attr("stroke",B.cyan).attr("stroke-width",1.5);
        el.append("text").attr("x",12).attr("y",4).attr("font-size","8px").attr("font-family","'Barlow',sans-serif")
          .attr("fill",dark?"#94a3b8":"#64748b").text(d.label.length>14?d.label.slice(0,13)+"…":d.label);
      }
    });

    sim.on("tick",()=>{
      link.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
      node.attr("transform",d=>`translate(${d.x},${d.y})`);
    });

    svg.append("text").attr("x",8).attr("y",H-8).attr("font-size","9px").attr("fill",dark?"#334155":"#94a3b8")
      .attr("font-family","'Barlow',sans-serif").text("Geteilte KPIs verbinden Use Cases · Klicken = Factsheet");
  },[dark,useCases]);

  return(
    <div ref={wrapRef} style={{position:"relative",width:"100%"}}>
      <svg ref={svgRef} style={{display:"block",width:"100%"}}/>
    </div>
  );
}

  const tx=dark?"#e2e8f0":B.nightfall;
  const mu=dark?"#64748b":"#94a3b8";
  const bdr=dark?"#1e293b":"#e2e8f0";

  const generate=()=>{
    let content="",filename="",mime="application/json";
    if(fmt==="json"){
      const data={
        meta:{exported:new Date().toISOString(),version:"v3",useCaseCount:useCases.length},
        useCases:useCases.map(u=>({...u,factsheet:window.__FS_DATA__[u.id]||null})),
        kpiCatalog:Object.fromEntries(u.kpis?.flatMap(k=>[[k,window.__KPI_DATA__[k]]]).filter(([,v])=>v)||[])
      };
      content=JSON.stringify(data,null,2);filename="strategy_framework.json";
    }else if(fmt==="yaml"){
      const lines=["# Strategy Framework Export","# Generated: "+new Date().toISOString(),"","use_cases:"];
      useCases.forEach(u=>{
        lines.push(`  - id: ${u.id}`);
        lines.push(`    title: "${u.title}"`);
        lines.push(`    domain: ${u.domain}`);
        lines.push(`    status: ${u.status}`);
        lines.push(`    completeness: ${u.completeness}`);
        lines.push(`    strategic_kpi: ${u.strategicKpi}`);
        lines.push(`    kpis: [${u.kpis.join(", ")}]`);
        lines.push(`    action_codes: [${u.actionCodes.join(", ")}]`);
      });
      content=lines.join("\n");filename="strategy_framework.yaml";mime="text/yaml";
    }else if(fmt==="csv"){
      const header="ID,Title,Domain,Status,Completeness,Strategic KPI,KPI Count,Action Codes";
      const rows=useCases.map(u=>`${u.id},"${u.title}",${u.domain},${u.status},${u.completeness},${u.strategicKpi},${u.kpis.length},"${u.actionCodes.join("|")}"`);
      content=[header,...rows].join("\n");filename="use_cases.csv";mime="text/csv";
    }else if(fmt==="pbi"){
      const tables=useCases.map(u=>({
        name:u.id.replace("-","_"),
        description:u.title,
        columns:u.kpis.map(k=>({name:window.__KPI_DATA__[k]?.dax||k,dataType:"Decimal Number",formatString:window.__KPI_DATA__[k]?.unit||""}))
      }));
      content=JSON.stringify({version:"1.0",model:{tables}},null,2);
      filename="powerbi_schema_stub.json";
    }
    const blob=new Blob([content],{type:mime});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download=filename;a.click();
    URL.revokeObjectURL(url);
  };

  const fmts=[
    {id:"json",label:"JSON",desc:"Complete framework incl. factsheets",icon:<Ph.Database s={15} c={B.mint}/>},
    {id:"yaml",label:"YAML",desc:"Core framework format (ready to use)",icon:<Ph.FileText s={15} c={B.blue}/>},
    {id:"csv",label:"CSV",desc:"Use case overview for Excel",icon:<Ph.ChartBar s={15} c={B.vanilla}/>},
    {id:"pbi",label:"Power BI Schema",desc:"Tabular model stub for Fabric/Desktop",icon:<Ph.Network s={15} c={B.lavender}/>},
  ];

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.55)",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center"}}
      onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="fade-in" style={{background:bg,borderRadius:16,padding:"22px 24px",width:420,maxWidth:"90vw",
        border:`1px solid ${bdr}`,boxShadow:"0 24px 60px rgba(0,0,0,.3)"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
          <div>
            <div className="heading" style={{fontSize:"1rem",color:tx}}>Export Framework</div>
            <div style={{fontSize:"0.63rem",color:mu,marginTop:2}}>{useCases.length} Use Cases · {Object.keys(window.__KPI_DATA__).length} KPIs</div>
          </div>
          <button onClick={onClose} style={{background:"none",border:"none",cursor:"pointer"}}><Ph.X s={16} c={mu}/></button>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:7,marginBottom:14}}>
          {fmts.map(f=>(
            <button key={f.id} onClick={()=>setFmt(f.id)}
              style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",borderRadius:9,
                border:`1px solid ${fmt===f.id?B.mint:bdr}`,background:fmt===f.id?`${B.mint}10`:"transparent",
                cursor:"pointer",textAlign:"left"}}>
              {f.icon}
              <div>
                <div style={{fontSize:"0.72rem",fontWeight:700,color:fmt===f.id?B.mint:tx,fontFamily:"'Barlow Condensed',sans-serif"}}>{f.label}</div>

              {fmt===f.id&&<div style={{marginLeft:"auto"}}><Ph.CheckCircle s={14} c={B.mint}/></div>}
            </button>

            color:B.nightfall,fontWeight:700,fontSize:"0.78rem",fontFamily:"'Barlow Condensed',sans-serif",

// ── v5: YAML Editor (live, bidirektional) ─────────────────────────────────────
function YAMLEditor({dark,useCases,setUseCases}){
  const bg=dark?"#0f172a":"#ffffff";
  const tx=dark?"#e2e8f0":B.nightfall;
  const mu=dark?"#64748b":"#94a3b8";
  const bdr=dark?"#1e293b":"#e2e8f0";

  const toYAML=useCallback((ucs)=>{
    const lines=["# Strategy Framework — Live YAML Editor","# Changes are applied immediately","","use_cases:"];
    ucs.forEach(u=>{
      lines.push(`  - id: ${u.id}`);
      lines.push(`    title: "${u.title}"`);
      lines.push(`    domain: ${u.domain}`);
      lines.push(`    status: ${u.status}`);
      lines.push(`    completeness: ${u.completeness}`);
      lines.push(`    strategic_kpi: ${u.strategicKpi||"—"}`);
      lines.push(`    kpis:`);
      (u.kpis||[]).forEach(k=>lines.push(`      - ${k}`));
      lines.push(`    action_codes: [${(u.actionCodes||[]).join(", ")}]`);
      lines.push("");
    });
    return lines.join("\n");
  },[]);

  const [yaml,setYaml]=useState(()=>toYAML(useCases));
  const [parseError,setParseError]=useState(null);
  const [lastSync,setLastSync]=useState(null);

  // Sync external changes → YAML
  useEffect(()=>setYaml(toYAML(useCases)),[useCases.length]);

  const parseAndApply=(text)=>{
    setYaml(text);
    setParseError(null);
    try{
      // Simple YAML parser for our known format
      const ucBlocks=text.split(/\n  - id:/).slice(1);
      if(ucBlocks.length===0)return;
      const parsed=ucBlocks.map(block=>{
        const get=(key)=>{const m=block.match(new RegExp(`\\n    ${key}: (.+)`));return m?m[1].trim().replace(/^"|"$/g,""):null;};
        const getList=(key)=>{
          const listMatch=block.match(new RegExp(`\\n    ${key}:\\n((?:      - .+\\n?)*)`));
          if(!listMatch)return[];
          return listMatch[1].split("\n").filter(l=>l.trim()).map(l=>l.replace(/.*- /,"").trim());
        };
        const id=block.split("\n")[0].trim();
        const acLine=get("action_codes");
        const acs=acLine?acLine.replace(/[\[\]]/g,"").split(",").map(s=>s.trim()).filter(Boolean):[];
        return{
          id,title:get("title")||id,domain:get("domain")||"Commercial",
          status:get("status")||"draft",
          completeness:parseInt(get("completeness")||"0")||0,
          strategicKpi:get("strategic_kpi")||"",
          kpis:getList("kpis"),actionCodes:acs,
        };
      }).filter(u=>u.id&&u.id.match(/^[A-Z]{2,4}-\d{3}$/));
      if(parsed.length>0){
        setUseCases(parsed);
        setLastSync(new Date().toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit"}));
      }
    }catch(e){
      setParseError(e.message);
    }
  };

  const copyAll=()=>navigator.clipboard.writeText(yaml);
  const downloadYAML=()=>{
    const b=new Blob([yaml],{type:"text/yaml"});
    const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="strategy_framework.yaml";a.click();
  };

  return(
    <div style={{height:"100%",display:"flex",flexDirection:"column",background:bg}}>
      {/* Toolbar */}
      <div style={{padding:"9px 14px",borderBottom:`1px solid ${bdr}`,background:dark?"#0c1528":"#f8fafc",
        display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
        <Ph.FileText s={14} c={B.mint}/>
        <div>
          <div className="subhead" style={{fontSize:"0.72rem",color:tx}}>YAML Live Editor</div>
          <div style={{fontSize:"0.56rem",color:mu}}>Changes are applied to use cases immediately</div>
        </div>
        {lastSync&&<span style={{fontSize:"0.58rem",color:B.mint,marginLeft:4}}>Sync: {lastSync}</span>}
        {parseError&&<span style={{fontSize:"0.58rem",color:B.pink,flex:1}}>Parse error: {parseError}</span>}
        <div style={{marginLeft:"auto",display:"flex",gap:5}}>
          <button onClick={copyAll} style={{display:"flex",alignItems:"center",gap:4,padding:"4px 9px",background:`${B.mint}12`,border:`1px solid ${B.mint}30`,borderRadius:6,cursor:"pointer",fontSize:"0.62rem",color:B.mint,fontWeight:700,fontFamily:"'Barlow Condensed',sans-serif"}}>
            <Ph.Export s={11} c={B.mint}/>Copy
          </button>
          <button onClick={downloadYAML} style={{display:"flex",alignItems:"center",gap:4,padding:"4px 9px",background:`${B.blue}12`,border:`1px solid ${B.blue}30`,borderRadius:6,cursor:"pointer",fontSize:"0.62rem",color:B.blue,fontWeight:700,fontFamily:"'Barlow Condensed',sans-serif"}}>
            <Ph.Export s={11} c={B.blue}/>Download
          </button>
          <button onClick={()=>setYaml(toYAML(useCases))} style={{display:"flex",alignItems:"center",gap:4,padding:"4px 9px",background:`${mu}10`,border:`1px solid ${mu}30`,borderRadius:6,cursor:"pointer",fontSize:"0.62rem",color:mu,fontFamily:"'Barlow Condensed',sans-serif"}}>
            Reset
          </button>
        </div>
      </div>
      {/* Split: Editor + Preview */}
      <div style={{flex:1,display:"flex",overflow:"hidden",gap:0}}>
        {/* Editor pane */}
        <div style={{flex:1,display:"flex",flexDirection:"column",borderRight:`1px solid ${bdr}`}}>
          <div style={{padding:"4px 12px",fontSize:"0.57rem",color:mu,background:dark?"#080e1a":"#f8fafc",borderBottom:`1px solid ${bdr}`,fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700,textTransform:"uppercase",letterSpacing:".06em"}}>
            YAML Editor — bearbeiten und speichern
          </div>
          <textarea value={yaml} onChange={e=>parseAndApply(e.target.value)}
            spellCheck={false}
            style={{flex:1,padding:"12px 14px",background:dark?"#06041F":"#fafafa",color:dark?"#e2e8f0":B.nightfall,
              border:"none",resize:"none",fontFamily:"'Fira Code','Cascadia Code','Consolas',monospace",
              fontSize:"0.73rem",lineHeight:1.75,outline:"none",
              borderLeft:parseError?`3px solid ${B.pink}`:`3px solid ${B.mint}`}}/>
        </div>
        {/* Live preview pane */}
        <div style={{width:260,display:"flex",flexDirection:"column",overflow:"hidden",flexShrink:0}}>
          <div style={{padding:"4px 12px",fontSize:"0.57rem",color:mu,background:dark?"#080e1a":"#f8fafc",borderBottom:`1px solid ${bdr}`,fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700,textTransform:"uppercase",letterSpacing:".06em"}}>
            Live-Vorschau ({useCases.length} Use Cases)
          </div>
          <div style={{flex:1,overflow:"auto",padding:"8px 10px",display:"flex",flexDirection:"column",gap:4}}>
            {useCases.map(u=>{
              const c=DOMAIN_COL[u.domain]||B.mint;
              const sc=scoreColor(u.completeness);
              return(
                <div key={u.id} style={{padding:"6px 8px",background:dark?"#0f172a":"#f8fafc",
                  border:`1px solid ${bdr}`,borderRadius:6,borderLeft:`3px solid ${c}`}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <span style={{fontSize:"0.63rem",fontWeight:700,color:c,fontFamily:"'Barlow Condensed',sans-serif"}}>{u.id}</span>
                    <span style={{fontSize:"0.6rem",fontWeight:700,color:sc}}>{u.completeness}%</span>
                  </div>
                  <div style={{fontSize:"0.65rem",color:tx,marginTop:1,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{u.title}</div>
                </div>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

// ── Main App ──────────────────────────────────────────────────────────────────
function App(){
  const [dark,setDark]=useState(false);
  const [tab,setTab]=useState("tree");
  const [hlIds,setHlIds]=useState([]);
  const [filterDomain,setFilterDomain]=useState("");
  const [sidebarOn,setSidebarOn]=useState(true);
  const [chatOn,setChatOn]=useState(true);
  const [kpiPanelId,setKpiPanelId]=useState(null);
  const [fsPanelId,setFsPanelId]=useState(null);
  const [chatContext,setChatContext]=useState(null);
  const [sources,setSources]=useState([]);
  const [useCases,setUseCases]=useState(USE_CASES);
  const [exportOpen,setExportOpen]=useState(false);
  const [editMode,setEditMode]=useState(false);
  const [onboardingDone,setOnboardingDone]=useState(false);
  const [treeData,setTreeData]=useState(TREE);
  const [ctx,setCtx]=useState({company:"Aurora AG",industry:"FMCG",goal:"EBITDA +2%",apiKey:"AIzaSyCHVpsE1xFVK19JTWqHfCM_jvWPONwEjrE",perplexityKey:""});

  const bg=dark?"#080e1a":"#eef3fb";
  const sf=dark?"#0c1528":"#ffffff";
  const bdr=dark?"rgba(255,255,255,.07)":"rgba(19,41,75,.09)";
  const tx=dark?"#f1f5f9":B.nightfall;
  const mu=dark?"#64748b":"#94a3b8";

  const filtered=useMemo(()=>filterDomain?useCases.filter(u=>u.domain===filterDomain):useCases,[filterDomain,useCases]);
  const DOMAINS_ALL=["","Commercial","Finance","Operations","Supply Chain","Experience","Executive"];

  const handleNodeClick=useCallback(node=>{
    if(node.type==="kpi"&&window.__KPI_DATA__[node.id]){
      setKpiPanelId(node.id);
      setFsPanelId(null);
      setChatContext({type:"kpi",id:node.id});
      return;
    }
    if(node.ucs?.length){
      setHlIds(node.ucs);
      setTab("cards");
      setFilterDomain("");
    }
  },[]);

  const openKPI=(id)=>{setKpiPanelId(id);setFsPanelId(null);setChatContext({type:"kpi",id});};
  const openFS=(id)=>{setFsPanelId(id);setKpiPanelId(null);setChatContext({type:"uc",id});};

  const addUseCase=(newUC,form)=>{
    setUseCases(p=>[...p,newUC]);
    setTab("cards");
  };

  const handleAgentCmd=useCallback((cmd)=>{
    if(cmd.action==="add_kpi"){
      // Add to tree + as standalone KPI entry
      setTreeData(prev=>{
        const newNode={id:cmd.payload.id,label:cmd.payload.label,type:"kpi",
          color:cmd.payload.color||B.mint,ucs:[]};
        const patch=(node)=>{
          if(node.id===cmd.payload.parent){
            return{...node,children:[...(node.children||[]),newNode]};
          }
          return node.children?{...node,children:node.children.map(patch)}:node;
        };
        return patch(prev);
      });
    }else if(cmd.action==="add_uc"){
      const newUC={id:cmd.payload.id,title:cmd.payload.title,domain:cmd.payload.domain,
        strategicKpi:cmd.payload.kpis?.[0]||"",kpis:cmd.payload.kpis||[],
        actionCodes:[],status:"draft",completeness:20};
      setUseCases(p=>[...p,newUC]);
      setTab("cards");
    }else if(cmd.action==="update_uc"){
      setUseCases(p=>p.map(u=>u.id===cmd.payload.id?{...u,[cmd.payload.field]:cmd.payload.value}:u));
    }else if(cmd.action==="highlight"){
      setHlIds(cmd.payload.ids||[]);
      setTab("cards");
    }
  },[]);

  const overallScore=Math.round(useCases.reduce((s,u)=>s+u.completeness,0)/useCases.length);

  const TABS=[
    {id:"tree",label:"Value Driver Tree",icon:<Ph.Tree s={13} c="currentColor"/>},
    {id:"cards",label:"Use Cases",icon:<Ph.Cards s={13} c="currentColor"/>},
    {id:"network",label:"Dependencies",icon:<Ph.Network s={13} c="currentColor"/>},
    {id:"gaps",label:"Gap Report",icon:<Ph.Warning s={13} c="currentColor"/>},
    {id:"sources",label:"Data Sources",icon:<Ph.Database s={13} c="currentColor"/>},
    {id:"yaml",label:"YAML / Export",icon:<Ph.FileText s={13} c="currentColor"/>},
    {id:"create",label:"+ Use Case",icon:<Ph.Plus s={13} c="currentColor"/>},
  ];

  return(
    <div style={{minHeight:"100vh",background:bg,color:tx,fontFamily:"'Barlow',system-ui,sans-serif",display:"flex",flexDirection:"column",overflow:"hidden",height:"100vh"}}>
      <style>{`
        button,input,select,textarea{font-family:'Barlow',sans-serif;}
        textarea:focus,input:focus,select:focus{border-color:${B.mint}!important;outline:none;}
      `}</style>

      {/* ── Header ── */}
      <header style={{height:52,display:"flex",alignItems:"center",padding:"0 16px",gap:10,background:sf,borderBottom:`1px solid ${bdr}`,flexShrink:0,zIndex:10}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginRight:6}}>
          <div style={{width:30,height:30,borderRadius:9,background:`linear-gradient(135deg,${B.nightfall},${B.lavender})`,display:"flex",alignItems:"center",justifyContent:"center"}}>
            <Ph.Tree s={15} c={B.mint}/>
          </div>
          <div>
            <div className="heading" style={{fontSize:"1rem",color:tx,lineHeight:1}}>Strategy<span style={{color:B.mint}}>Studio</span></div>
            <div style={{fontSize:"0.52rem",color:mu,letterSpacing:".07em",textTransform:"uppercase",fontFamily:"'Barlow Condensed',sans-serif"}}>Analytics Operating System</div>
          </div>
        </div>
        <div style={{width:1,height:22,background:bdr}}/>
        {/* Company context pill */}
        <div style={{display:"flex",alignItems:"center",gap:5,padding:"3px 10px",borderRadius:999,border:`1px solid ${bdr}`,background:dark?"#0f172a":"#f1f5f9"}}>
          <div style={{width:5,height:5,borderRadius:"50%",background:B.mint,boxShadow:`0 0 0 2px ${B.mint}28`}}/>
          <span style={{color:tx,fontWeight:600,fontFamily:"'Barlow Condensed',sans-serif",fontSize:"0.75rem"}}>{ctx.company||"—"}</span>
          {ctx.industry&&<span style={{opacity:.5,fontSize:"0.7rem"}}>· {ctx.industry}</span>}
        </div>
        {/* Overall score */}
        <div style={{display:"flex",alignItems:"center",gap:5,padding:"3px 9px",borderRadius:999,border:`1px solid ${scoreColor(overallScore)}30`,background:`${scoreColor(overallScore)}10`}}>
          <div style={{width:5,height:5,borderRadius:"50%",background:scoreColor(overallScore)}}/>
          <span style={{fontSize:"0.68rem",fontWeight:700,color:scoreColor(overallScore),fontFamily:"'Barlow Condensed',sans-serif"}}>Framework {overallScore}%</span>
        </div>
        {sources.length>0&&(
          <div style={{display:"flex",alignItems:"center",gap:4,padding:"2px 8px",borderRadius:999,border:`1px solid ${B.blue}30`,background:`${B.blue}10`}}>
            <Ph.Database s={10} c={B.blue}/>
            <span style={{fontSize:"0.6rem",fontWeight:700,color:B.blue,fontFamily:"'Barlow Condensed',sans-serif"}}>{sources.length} Sources</span>
          </div>
        )}
        <div style={{flex:1}}/>
        {/* Header stats */}
        <div style={{display:"flex",gap:14,fontSize:"0.62rem",color:mu}}>
          {[
            {v:useCases.length,l:"Use Cases",c:tx},
            {v:useCases.filter(u=>u.status==="ready").length,l:"Ready",c:B.mint},
            {v:useCases.filter(u=>u.completeness<60).length,l:"Gaps",c:B.pink},
          ].map(s=>(
            <div key={s.l} style={{textAlign:"center"}}>
              <div className="heading" style={{fontSize:"0.92rem",color:s.c,lineHeight:1}}>{s.v}</div>
              <div style={{marginTop:1,fontFamily:"'Barlow Condensed',sans-serif"}}>{s.l}</div>
            </div>
          ))}
        </div>
        <div style={{width:1,height:22,background:bdr}}/>
        <div style={{display:"flex",gap:4}}>
          <IBtn onClick={()=>setSidebarOn(!sidebarOn)} active={sidebarOn} dark={dark} title="Sidebar"><Ph.Sidebar s={14} c="currentColor"/></IBtn>
          <IBtn onClick={()=>setChatOn(!chatOn)} active={chatOn} dark={dark} title="Chat"><Ph.Chat s={14} c="currentColor"/></IBtn>
          <IBtn onClick={()=>setDark(!dark)} dark={dark} title="Dark/Light">
            {dark?<Ph.Sun s={14} c="currentColor"/>:<Ph.Moon s={14} c="currentColor"/>}
          </IBtn>
          <button onClick={()=>setExportOpen(true)}
            style={{display:"flex",alignItems:"center",gap:5,padding:"5px 10px",borderRadius:7,border:`1px solid ${B.mint}40`,
              background:`${B.mint}10`,color:B.mint,cursor:"pointer",fontSize:"0.65rem",fontWeight:700,
              fontFamily:"'Barlow Condensed',sans-serif"}}>
            <Ph.Export s={13} c={B.mint}/>Export
          </button>
        </div>
      </header>

      {/* ── Demo Banner ── */}
      {sources.length===0&&(
        <div style={{background:`${B.vanilla}14`,borderBottom:`1px solid ${B.vanilla}30`,padding:"5px 14px",display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
          <Ph.Warning s={12} c={B.vanilla}/>
          <span style={{fontSize:"0.65rem",color:B.vanilla,fontWeight:700}}>Demo Data Active</span>
          <span style={{fontSize:"0.62rem",color:dark?"#94a3b8":"#64748b"}}>— Add your own sources under "Data Sources" to build a real framework.</span>
          <button onClick={()=>setTab("sources")} style={{marginLeft:"auto",padding:"3px 9px",background:`${B.vanilla}20`,border:`1px solid ${B.vanilla}40`,borderRadius:5,cursor:"pointer",fontSize:"0.62rem",color:B.vanilla,fontWeight:700,fontFamily:"'Barlow Condensed',sans-serif",display:"flex",alignItems:"center",gap:4}}>
            <Ph.Database s={10} c={B.vanilla}/>Add Sources
          </button>
        </div>
      )}

      {/* ── Body ── */}
      <div style={{flex:1,display:"flex",overflow:"hidden",minHeight:0}}>
        {/* Sidebar */}
        {sidebarOn&&(
          <div style={{width:200,flexShrink:0,borderRight:`1px solid ${bdr}`,overflow:"hidden"}}>
            <InputSidebar dark={dark} state={{...ctx,onOpenFS:openFS}} setState={setCtx}/>
          </div>
        )}

        {/* Center */}
        <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden",minWidth:0}}>
          {/* Tab bar */}
          <div style={{display:"flex",alignItems:"center",gap:8,padding:"7px 12px",background:sf,borderBottom:`1px solid ${bdr}`,flexShrink:0,flexWrap:"wrap"}}>
            <div style={{display:"flex",gap:2,background:dark?"#1a2744":"#f1f5f9",borderRadius:10,padding:3}}>
              {TABS.map(t=>{
                const isNew=t.id==="create";
                const active=tab===t.id;
                return(
                  <button key={t.id} onClick={()=>setTab(t.id)}
                    style={{padding:"5px 11px",borderRadius:6,border:"none",fontSize:"0.63rem",fontWeight:700,
                      fontFamily:"'Barlow Condensed',sans-serif",letterSpacing:".03em",cursor:"pointer",
                      display:"flex",alignItems:"center",gap:4,
                      background:active?(isNew?B.mint:B.lavender):"transparent",
                      color:active?(dark||isNew?"#fff":B.white):mu,transition:"all .15s"}}>
                    {t.icon}{t.label}
                  </button>
                );
              })}
            </div>
            {tab==="cards"&&(
              <div style={{display:"flex",gap:3,flexWrap:"wrap"}}>
                {DOMAINS_ALL.map(d=>{
                  const on=filterDomain===d;
                  const col=d?(DOMAIN_COL[d]||B.mint):mu;
                  return(
                    <button key={d||"all"} onClick={()=>setFilterDomain(d)}
                      style={{fontSize:"0.6rem",padding:"3px 8px",border:`1px solid ${on?col:bdr}`,borderRadius:6,
                        background:on?`${col}18`:"transparent",color:on?col:mu,cursor:"pointer",fontWeight:on?700:400,
                        fontFamily:"'Barlow Condensed',sans-serif"}}>
                      {d||"Alle"}
                    </button>
                  );
                })}
              </div>
            )}
            {tab==="tree"&&(
              <div style={{display:"flex",gap:3,flexWrap:"wrap"}}>
                {DOMAINS_ALL.slice(1).map(d=>{
                  const on=filterDomain===d;
                  const col=DOMAIN_COL[d]||B.mint;
                  return(
                    <button key={d} onClick={()=>setFilterDomain(p=>p===d?"":d)}
                      style={{fontSize:"0.6rem",padding:"3px 8px",border:`1px solid ${on?col:bdr}`,borderRadius:6,
                        background:on?`${col}18`:"transparent",color:on?col:mu,cursor:"pointer",fontWeight:on?700:400,
                        fontFamily:"'Barlow Condensed',sans-serif",display:"flex",alignItems:"center",gap:4}}>
                      <div style={{width:6,height:6,borderRadius:"50%",background:col}}/>
                      {d}
                    </button>
                  );
                })}
              </div>
            )}
            {hlIds.length>0&&(
              <button onClick={()=>setHlIds([])}
                style={{marginLeft:"auto",fontSize:"0.6rem",padding:"3px 9px",border:`1px solid ${B.mint}40`,borderRadius:6,background:`${B.mint}10`,color:B.mint,cursor:"pointer",fontFamily:"'Barlow Condensed',sans-serif",display:"flex",alignItems:"center",gap:4}}>
                <Ph.X s={10} c={B.mint}/>{hlIds.length} markiert — Reset
              </button>
            )}
          </div>

          {/* Content */}
          <div style={{flex:1,overflow:"auto",padding:tab==="sources"||tab==="create"||tab==="yaml"?0:12}}>
            {tab==="tree"&&(
              <div>
                <div style={{background:sf,border:`1px solid ${bdr}`,borderRadius:12,padding:"12px 14px",marginBottom:10}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10,flexWrap:"wrap",gap:8}}>
                    <div>
                      <h2 className="heading" style={{fontSize:"0.88rem",margin:0}}>Value Driver Tree</h2>
                      <p style={{margin:"3px 0 0",fontSize:"0.62rem",color:mu}}>Click = KPI Catalog · Badge = Use Cases · Scroll = Zoom · Color = Quality Score</p>
                    </div>
                    <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"center"}}>
                      {[{c:B.mint,l:"≥80% Ready"},{c:B.vanilla,l:"55–79% Review"},{c:B.pink,l:"<55% Draft"}].map(l=>(
                        <span key={l.l} style={{display:"flex",alignItems:"center",gap:4,fontSize:"0.58rem",color:mu,fontFamily:"'Barlow Condensed',sans-serif"}}>
                          <div style={{width:8,height:8,borderRadius:"50%",background:l.c}}/>{l.l}
                        </span>
                      ))}
                    </div>
                  </div>
                  <ValueDriverTree dark={dark} onNodeClick={handleNodeClick} hlIds={hlIds} filterDomain={filterDomain} onFilterDomain={setFilterDomain}/>
                </div>
              </div>
            )}
            {tab==="cards"&&(
              <div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(236px,1fr))",gap:9}}>
                  {filtered.map(uc=>(
                    <UCCard key={uc.id} uc={uc} dark={dark}
                      selected={hlIds.includes(uc.id)}
                      onOpenFS={()=>openFS(uc.id)}
                      onOpenKPI={openKPI}/>
                  ))}
                </div>
                <div style={{marginTop:10,textAlign:"center",fontSize:"0.6rem",color:mu}}>
                  {filtered.length} von {useCases.length} Use Cases
                </div>
              </div>
            )}
            {tab==="sources"&&(
              <SourcesPanel dark={dark} sources={sources} setSources={setSources}/>
            )}
            {tab==="create"&&(
              <UCCreator dark={dark} sources={sources} onSave={addUseCase} apiKey={ctx.apiKey}/>
            )}
            {tab==="network"&&(
              <div>
                <div style={{background:sf,border:`1px solid ${bdr}`,borderRadius:12,padding:"12px 14px",marginBottom:10}}>
                  <div style={{marginBottom:10}}>
                    <h2 className="heading" style={{fontSize:"0.88rem",margin:0}}>Dependency Network</h2>
                    <p style={{margin:"3px 0 0",fontSize:"0.62rem",color:mu}}>Shared KPIs (2+ use cases) connect nodes · Click = Factsheet · Drag = Move</p>
                  </div>
                  <DependencyNetwork dark={dark} useCases={useCases} onOpenFS={openFS}/>
                </div>
                <div style={{padding:"10px 12px",background:sf,border:`1px solid ${bdr}`,borderRadius:10,fontSize:"0.67rem",color:mu,display:"flex",gap:12,flexWrap:"wrap"}}>
                  <span style={{display:"flex",alignItems:"center",gap:5}}><div style={{width:18,height:18,borderRadius:4,border:`2px solid ${B.mint}`,background:`${B.mint}15`}}/><span>Use Case</span></span>
                  <span style={{display:"flex",alignItems:"center",gap:5}}><div style={{width:12,height:12,borderRadius:"50%",border:`2px solid ${B.cyan}`,background:dark?"#1a2a44":"#eef3fb"}}/><span>Shared KPI</span></span>
                  <span style={{display:"flex",alignItems:"center",gap:5}}><div style={{width:20,height:3,background:`${B.mint}40`,borderRadius:2}}/><span>Connection</span></span>
                  <span style={{color:B.mint}}>Use case edge color = Completeness Score</span>
                </div>
              </div>
            )}
            {tab==="gaps"&&(
              <GapReport dark={dark} useCases={useCases} onOpenFS={openFS} onOpenChat={(ctx)=>{setChatContext(ctx);setChatOn(true);}}/>
            )}
            {tab==="yaml"&&(
              <YAMLEditor dark={dark} useCases={useCases} setUseCases={setUseCases}/>
            )}
          </div>
        </div>

        {/* Chat */}
        {chatOn&&(
          <div style={{width:280,flexShrink:0,borderLeft:`1px solid ${bdr}`,display:"flex",flexDirection:"column",overflow:"hidden"}}>
            <div style={{padding:"9px 12px 8px",borderBottom:`1px solid ${bdr}`,background:sf,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
              <div>
                <div className="subhead" style={{fontSize:"0.76rem",color:tx}}>Framework Assistant</div>
                <div style={{fontSize:"0.6rem",color:mu,marginTop:1}}>{ctx.apiKey?"Gemini AI active":"Rule-based mode"}</div>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:5}}>
                {ctx.apiKey&&<div style={{width:6,height:6,borderRadius:"50%",background:B.mint,boxShadow:`0 0 0 2px ${B.mint}28`}}/>}
                <Ph.Sparkle s={13} c={ctx.apiKey?B.mint:mu}/>
              </div>
            </div>
            <div style={{flex:1,overflow:"hidden"}}>
              <ChatPanel dark={dark} apiKey={ctx.apiKey} contextLock={chatContext} onAgentCmd={handleAgentCmd}/>
            </div>
          </div>
        )}
      </div>

      {/* Slide-over panels */}
      {kpiPanelId&&<KpiPanel kpiId={kpiPanelId} dark={dark} onClose={()=>setKpiPanelId(null)} industry={ctx.industry} perplexityKey={ctx.perplexityKey}/>}
      {fsPanelId&&<FactsheetPanel ucId={fsPanelId} dark={dark} onClose={()=>setFsPanelId(null)} onOpenKPI={openKPI}/>}
      {exportOpen&&<ExportModal dark={dark} useCases={useCases} sources={sources} onClose={()=>setExportOpen(false)}/>}
      {!onboardingDone&&<OnboardingModal dark={dark} onDismiss={()=>setOnboardingDone(true)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
