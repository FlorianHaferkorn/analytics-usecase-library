# Benchmark registry — Content-Grounding §6.3 (KONZEPT_REPORT_QUALITAET.md).
#
# Governed, versioned "what good looks like" references — the THIRD comparison axis
# (next to vs-plan and vs-prior-year). Every entry references an existing KPI (Golden
# Thread) and is CORROBORATED by ≥2 independent public sources, with the observed
# `range` recorded — an industry benchmark is a distribution, not a single point, and a
# lone source is unreliable. Provenance + corroboration are enforced by
# tooling/validation/check_benchmarks.py. Updates flow through the market-sensing loop.
schema_version: '1.0'

benchmarks:
  - kpi_id: ops.oee.pct
    scope: "Manufacturing (discrete & process) — world-class standard"
    metric: world_class
    value: 85.0
    unit: pct
    direction: higher_is_better
    components:
      availability: 90.0
      performance: 95.0
      quality: 99.0
    sources:
      - citation: >-
          Nakajima, S. (1988), "Introduction to TPM", Productivity Press — world-class
          OEE = 90% availability × 95% performance × 99% quality ≈ 85%; the origin of the
          85% standard.
        source_type: industry_standard
        as_of: '2026-07-11'
      - citation: >-
          Evocon, "World-Class OEE: Industry Benchmarks from 50+ countries" (2024) —
          corroborates the 85% world-class threshold against aggregated real-plant data;
          typical plants run well below.
        source_type: market_report
        as_of: '2026-07-11'
      - citation: >-
          Tractian, "What Is World Class OEE?" (2024) — restates the 90/95/99 → 85%
          decomposition and the 85% world-class bar.
        source_type: market_report
        as_of: '2026-07-11'
    note: >-
      Third comparison axis for ops.oee.pct (OPS-001). OEE is multiplicative, so 90/90/90
      yields only ~73% — 85% is a demanding bar, not a soft target.

  - kpi_id: svc.fcr.pct
    scope: "Contact-center / customer service — cross-industry"
    metric: world_class
    value: 80.0
    unit: pct
    direction: higher_is_better
    range: { low: 41.0, high: 94.0 }
    sources:
      - citation: >-
          SQM Group, Call Center FCR Benchmark 2024 — all-industry average ~68–70%,
          world-class 80%+ (achieved by ~5% of centers).
        source_type: market_report
        as_of: '2026-07-11'
      - citation: >-
          MetricNet benchmarking database — FCR industry standard 74%, ranging 41–94% by
          call complexity (retail high; tech-support / telco low).
        source_type: market_report
        as_of: '2026-07-11'
    note: >-
      Third comparison axis for svc.fcr.pct (XD-001). ~70% industry par, 80% world-class;
      the 41–94% spread means: always read against call complexity.

  - kpi_id: supply.otif.pct
    scope: "Supply-chain delivery to retail / CPG customers"
    metric: world_class
    value: 95.0
    unit: pct
    direction: higher_is_better
    range: { low: 85.0, high: 98.0 }
    sources:
      - citation: >-
          Kaizen Institute, "OTIF — an essential supply chain indicator" (2024) — >95%
          world-class; 90–95% strong, 85–90% average, <85% systemic.
        source_type: market_report
        as_of: '2026-07-11'
      - citation: >-
          FourKites / MetricHQ OTIF references (2024) — corroborate >95% world-class;
          major retailers mandate 98–99% (Walmart 98% with a 3% COGS penalty).
        source_type: market_report
        as_of: '2026-07-11'
    note: >-
      Third comparison axis for supply.otif.pct (SCM-002). 95% world-class; retail
      mandates ~98% — the benchmark scales with customer demand.

  - kpi_id: crm.nps.index
    scope: "Net Promoter Score — cross-industry (B2C/B2B)"
    metric: median
    value: 44.0
    unit: index
    direction: higher_is_better
    range: { low: 0.0, high: 72.0 }
    sources:
      - citation: >-
          SurveyMonkey NPS benchmarks (>150,000 organizations) — median NPS 44, average
          32, top quartile ≥72.
        source_type: market_report
        as_of: '2026-07-11'
      - citation: >-
          Retently 2026 NPS Benchmark Report — all-industry average 32, median 44
          (corroborates SurveyMonkey); B2C avg 49, B2B avg 38.
        source_type: market_report
        as_of: '2026-07-11'
      - citation: >-
          Bain & Company (NPS originators) — >30 good, >50 excellent, >70 world-class.
        source_type: market_report
        as_of: '2026-07-11'
    note: >-
      Third comparison axis for crm.nps.index (COM-003). NPS is an index (−100..100), not
      a percent; 44 = median, 72 = top-quartile — always read against the sector.
