# Benchmark registry — Content-Grounding §6.3 (KONZEPT_REPORT_QUALITAET.md).
#
# Governed, versioned "what good looks like" references — the THIRD comparison axis
# (next to vs-plan and vs-prior-year) that turns a bare number into an assertion
# ("58% — 27 pp below world-class 85%"). Every entry references an existing KPI
# (Golden Thread; kpi_id must resolve under core/kpi_catalog/kpis/) and cites a
# concrete public source + as_of date via a source_type from benchmark_sources.yaml.
# Provenance is enforced by tooling/validation/check_benchmarks.py — a benchmark can
# never be freely asserted; updates flow through the market-sensing loop.
schema_version: '1.0'

benchmarks:
  - kpi_id: ops.oee.pct
    scope: "Manufacturing (discrete & process) — world-class standard"
    metric: world_class          # world_class | top_quartile | median | typical
    value: 85.0                  # % — matches ops.oee.pct unit_format
    unit: pct
    direction: higher_is_better
    # World-class OEE decomposes multiplicatively into the three loss factors:
    components:
      availability: 90.0
      performance: 95.0
      quality: 99.0
    source: >-
      Nakajima, S. (1988), "Introduction to TPM: Total Productive Maintenance",
      Productivity Press — world-class OEE = 90% availability × 95% performance ×
      99% quality ≈ 85%. Corroborated across contemporary OEE references (Evocon,
      Tractian world-class-OEE benchmark articles, 2024–2025).
    source_type: industry_standard
    as_of: '2026-07-11'
    note: >-
      Third comparison axis for ops.oee.pct (OPS-001). Because OEE is a product of
      three factors, 90/90/90 yields only ~73% — so 85% is a demanding bar, not a
      soft target.

  - kpi_id: svc.fcr.pct
    scope: "Contact-center / customer service — cross-industry"
    metric: world_class
    value: 80.0
    unit: pct
    direction: higher_is_better
    source: >-
      SQM Group, Call Center FCR Benchmark (2024/2025): the all-industry FCR average is
      ~70% ('industry par'), and 80%+ is 'world-class' — achieved by only ~5% of centers.
      Range 50–90% by call complexity (retail high; tech-support / telco low).
    source_type: market_report
    as_of: '2026-07-11'
    note: >-
      Third comparison axis for svc.fcr.pct (XD-001). 70% = industry par, 80% = the
      world-class bar — pair with sector context (complexity shifts the range).

  - kpi_id: supply.otif.pct
    scope: "Supply-chain delivery to retail / CPG customers"
    metric: world_class
    value: 95.0
    unit: pct
    direction: higher_is_better
    source: >-
      Cross-industry OTIF references (Kaizen Institute; FourKites; MetricHQ, 2024): >95%
      is world-class; major retailers demand the higher bar (Walmart 98% with a 3% COGS
      penalty, Target/Home Depot 98–99%). 90–95% strong, 85–90% average, <85% systemic.
    source_type: market_report
    as_of: '2026-07-11'
    note: >-
      Third comparison axis for supply.otif.pct (SCM-002). 95% world-class; retail
      mandates ~98% — the benchmark scales with customer demand.

  - kpi_id: crm.nps.index
    scope: "Net Promoter Score — cross-industry (B2C/B2B)"
    metric: median
    value: 44.0
    unit: index
    direction: higher_is_better
    source: >-
      SurveyMonkey NPS benchmarks (>150,000 organizations): median NPS 44, average 32,
      top quartile ≥72; >60 broadly 'world-class'. Varies widely by sector (B2B ~41–68,
      B2C ~26–68), so a leading score in one industry lags in another.
    source_type: market_report
    as_of: '2026-07-11'
    note: >-
      Third comparison axis for crm.nps.index (COM-003). NPS is an index (−100..100),
      not a percent; 44 = median, 72 = top-quartile — always read against the sector.
