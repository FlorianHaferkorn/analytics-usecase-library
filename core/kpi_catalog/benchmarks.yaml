# Benchmark registry — Content-Grounding §6.3 (KONZEPT_REPORT_QUALITAET.md).
#
# The THIRD comparison axis (next to vs-plan and vs-prior-year). Two kinds:
#   • NORMATIVE  — a defined standard that applies universally (world-class OEE/OTIF).
#   • EMPIRICAL  — a peer distribution that only means anything against an industry
#                  (NPS, FCR, conversion). These MUST carry per-industry `segments`;
#                  the top-level `value` is a labelled cross-industry FALLBACK.
# Every entry references a real KPI (Golden Thread), needs an authoritative source
# (tier primary/large_sample — not a headcount of secondary blogs), and records the
# observed `range`. Enforced by tooling/validation/check_benchmarks.py.
schema_version: '1.0'

benchmarks:
  - kpi_id: ops.oee.pct
    scope: "Manufacturing (discrete & process) — world-class standard"
    benchmark_class: normative
    metric: world_class
    value: 85.0
    unit: pct
    direction: higher_is_better
    components: { availability: 90.0, performance: 95.0, quality: 99.0 }
    sources:
      - citation: >-
          Nakajima, S. (1988), "Introduction to TPM", Productivity Press — world-class
          OEE = 90% × 95% × 99% ≈ 85%; the origin of the standard.
        source_type: industry_standard
        tier: primary
        as_of: '2026-07-11'
      - citation: >-
          Evocon, "World-Class OEE: Industry Benchmarks from 50+ countries" (2024) —
          corroborates 85% world-class against aggregated real-plant data.
        source_type: market_report
        tier: large_sample
        as_of: '2026-07-11'
    note: >-
      Normative standard for ops.oee.pct (OPS-001). Universal to manufacturing; 90/90/90
      yields only ~73%, so 85% is a demanding bar.

  - kpi_id: svc.fcr.pct
    scope: "Contact-center / customer service — peer performance by sector"
    benchmark_class: empirical
    metric: median
    value: 74.0
    unit: pct
    direction: higher_is_better
    range: { low: 41.0, high: 94.0 }
    segments:
      - { industry: "Retail", value: 78.0 }
      - { industry: "Financial services", value: 74.0 }
      - { industry: "Tech support / telco", value: 65.0 }
    sources:
      - citation: >-
          MetricNet benchmarking database — FCR industry standard 74%, ranging 41–94% by
          call complexity.
        source_type: market_report
        tier: large_sample
        as_of: '2026-07-11'
      - citation: >-
          SQM Group, Call Center FCR Benchmark 2024 — all-industry avg ~68–70%,
          world-class aspiration 80%+ (~5% of centers); retail higher, tech-support lower.
        source_type: market_report
        tier: large_sample
        as_of: '2026-07-11'
    note: >-
      Empirical for svc.fcr.pct (XD-001) — use the sector segment, not the 74% average
      (retail 78 vs tech-support 65 differ by call complexity). 80%+ is the world-class
      aspiration.

  - kpi_id: supply.otif.pct
    scope: "Supply-chain delivery to retail / CPG customers"
    benchmark_class: normative
    metric: world_class
    value: 95.0
    unit: pct
    direction: higher_is_better
    range: { low: 85.0, high: 98.0 }
    sources:
      - citation: >-
          Walmart Supplier OTIF program — 98% OTIF requirement with a 3% COGS penalty for
          non-compliance (public supplier standard); the retail contractual bar.
        source_type: industry_standard
        tier: primary
        as_of: '2026-07-11'
      - citation: >-
          Kaizen Institute / FourKites / MetricHQ OTIF references (2024) — >95%
          world-class; 90–95% strong, 85–90% average, <85% systemic.
        source_type: market_report
        tier: secondary
        as_of: '2026-07-11'
    note: >-
      Normative for supply.otif.pct (SCM-002). 95% world-class; retail mandates ~98% —
      the standard scales with customer power.

  - kpi_id: crm.nps.index
    scope: "Net Promoter Score — peer distribution by sector"
    benchmark_class: empirical
    metric: median
    value: 44.0
    unit: index
    direction: higher_is_better
    range: { low: 0.0, high: 72.0 }
    segments:
      - { industry: "Retail", value: 45.0 }
      - { industry: "SaaS / B2B software", value: 35.0 }
      - { industry: "Financial services", value: 30.0 }
      - { industry: "Telecom / utilities", value: 10.0 }
    sources:
      - citation: >-
          SurveyMonkey NPS benchmarks (>150,000 organizations) — cross-industry median 44,
          average 32, top quartile ≥72.
        source_type: market_report
        tier: large_sample
        as_of: '2026-07-11'
      - citation: >-
          Retently 2026 NPS Benchmark Report — by sector: SaaS/B2B ~30–40, retail ~40–50,
          financial services ~20–40, telecom/utilities ~0–15; B2C avg 49, B2B avg 38.
        source_type: market_report
        tier: large_sample
        as_of: '2026-07-11'
      - citation: >-
          Bain & Company (NPS originators) — >30 good, >50 excellent, >70 world-class.
        source_type: market_report
        tier: primary
        as_of: '2026-07-11'
    note: >-
      Empirical for crm.nps.index (COM-003) — an index (−100..100), not a percent. Use the
      sector segment: 44 cross-industry hides SaaS ~35 vs retail ~45 vs telecom ~10.
