kpi_id: plan.forecast.mape.pct
synonyms:
- Mean Absolute Percentage Error
- MAPE
- WMAPE
- mittlerer absoluter prozentualer Fehler
example_question: Which product families have the highest MAPE?
kpi_key: Forecast MAPE %
kpi_type: diagnostic
kpi_role: supporting
impact_dimension: Efficiency
domain_tag:
- Supply Chain
- Operational Efficiency
use_case_ref:
- SCM-003
action_code_ref:
- S-F3.2
calc_type: rate
business:
  purpose: Measures mean absolute percentage error in forecast.
  definition: Mean(|Forecast - Actual| / Actual).
  grain_scope: SKU/week; aggregated monthly.
  unit_format: percent_1
  interpretation: Lower is better; high MAPE indicates unstable demand or poor model fit.
technical:
  measure_name: Forecast MAPE %
  description: Measures mean absolute percentage error in forecast.
  depends_on_measures: []
  lineage:
  - fact_forecast.Forecast Units
  calculation:
    op: hitl
    reason: Legacy DAX (products/fabric/powerbi/dist/SupplyChain.SemanticModel) is AVERAGEX ( VALUES ( fact_forecast[ProductKey]
      ), ABS ( DIVIDE ( per-key Forecast Units - per-key Sales Units, per-key Sales Units ) ) ) — a per-key iterator
      combining two independent CALCULATE(SUM(...)) lookups inside an ABS/DIVIDE per row, beyond sumx_over_key/avgx_over_key
      (which only wrap ONE value, not a composite ratio of two context-filtered sums) and beyond the current grammar.
governance:
  business_owner: Supply Planning Lead
  data_owner: Supply Chain BI
  steward: Planner
  review_cycle: monthly
  validation_process: manual review
  qa_rules:
  - Actual Demand > 0
  - Review outliers for promotions or anomalies
  version: v1.0
metadata_quality:
  completeness_score: 1.0
  last_review: 23.01.2026
standard_ref:
- standard: SCOR-DS
  alignment: none
  note: As plan.forecast.accuracy.pct — no SCOR metric home; MAPE is defined by IBF/APICS forecasting standards,
    not SCOR.
