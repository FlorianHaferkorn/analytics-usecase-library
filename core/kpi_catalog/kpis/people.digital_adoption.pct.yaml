kpi_id: people.digital_adoption.pct
kpi_key: Digital Adoption Rate %
kpi_type: diagnostic
kpi_role: strategic
impact_dimension: Innovation & People
domain_tag:
- People & Culture
- Corporate & Strategy
use_case_ref:
- XD-003
action_code_ref: []
calc_type: ratio
good_is: higher
business:
  purpose: Measure how much of all eligible process transactions are executed via digital tools instead of manual
    channels.
  definition: Digital Transactions Count / Total Transactions Count for eligible processes.
  grain_scope: Process area / org; aggregated monthly or quarterly.
  unit_format: percent_1
  interpretation: Higher values indicate greater adoption of digital processes; low values show manual work and
    automation potential.
technical:
  measure_name: Digital Adoption Rate %
  description: Measure how much of all eligible process transactions are executed via digital tools instead of manual
    channels.
  depends_on_measures: []
  lineage: []
  calculation:
    op: hitl
    blocked_by: data_contract
    reason: 'Legacy system itself has no real formula here: products/fabric/powerbi/dist/Experience.SemanticModel''s
      own DAX is a documented placeholder (VAR _pending = "Requires fact_it Digital Users and fact_hr Total Headcount
      (not yet in data contracts)" RETURN BLANK()) — the source tables/columns do not exist yet in the data contract,
      upstream of any DSL grammar question.'
governance:
  business_owner: Head of Digital Transformation
  data_owner: Corporate BI
  steward: Digital Adoption Analyst
  review_cycle: quarterly
  validation_process: comparison with process mining and application telemetry
  qa_rules:
  - Eligible processes flagged correctly; adoption bounded between 0 % and 100 %
  version: v1.0
metadata_quality:
  completeness_score: 1.0
  last_review: 23.01.2026
standard_ref:
- standard: ISO 30414
  name: (digital adoption — change management)
  url: https://www.iso.org/standard/69338.html
  alignment: none
  note: Digital adoption (digital / total transactions for eligible processes) is a digital-transformation / change-management
    metric, not part of ISO 30414's human-capital areas. No governing HR standard; loosely relates to ISO 30414
    workforce skills & capabilities.
