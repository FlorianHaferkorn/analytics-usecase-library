kpi_id: plan.forecast.accuracy.pct
synonyms:
- Demand Forecast Accuracy
- Forecast Attainment
- Prognosegenauigkeit
- Vorhersagegenauigkeit
example_question: Where is forecast accuracy weakest this cycle?
kpi_key: Forecast Accuracy %
kpi_type: diagnostic
kpi_role: strategic
impact_dimension: Efficiency
domain_tag:
- Supply Chain
- Operational Efficiency
use_case_ref:
- SCM-001
- SCM-003
action_code_ref:
- S-F3.1
- S-F3.2
- S-F3.4
- S-I1.5
calc_type: rate
business:
  purpose: Measures how close forecasted demand is to actual demand.
  definition: 1 - |Forecast - Actual| / Actual.
  grain_scope: SKU/week; aggregated monthly.
  unit_format: '''% (1 decimal)'''
  interpretation: Higher is better; low accuracy drives inventory and service issues.
technical:
  measure_name: Forecast Accuracy %
  description: Measures how close forecasted demand is to actual demand.
  depends_on_measures: []
  lineage:
  - fact_forecast.Forecast Units
  - fact_sales.Sales Units
  calculation:
    op: delta
    minuend:
      literal: 1
    subtrahend:
      calc:
        op: abs
        value:
          calc:
            op: ratio
            numerator:
              calc:
                op: delta
                minuend:
                  column: Forecast Units
                subtrahend:
                  column: Sales Units
            denominator:
              column: Sales Units
governance:
  business_owner: Supply Planning Lead
  data_owner: Supply Chain BI
  steward: Planner
  review_cycle: monthly
  validation_process: manual review
  qa_rules:
  - Actual Demand > 0
  - Value between 0 % and 100 %
  - 'Known DAX nuance (I-10.0 follow-up): legacy DAX guards Sales Units = 0 with an
    explicit IF(...,BLANK(),...); the synthesized 1 - ABS(DIVIDE(...)) relies on
    DIVIDE''s native BLANK()-on-zero-denominator instead, which in DAX''s "-"
    operator coerces to 0 — so at exactly Sales Units = 0 the synthesized formula
    returns 1 where legacy returns BLANK(). Matches everywhere Actual Demand > 0
    holds (the documented precondition above); the edge case has no flat-DSL
    fix without a dedicated IF/blank-guard op.'
  version: v1.0
metadata_quality:
  completeness_score: 0.8
  last_review: 23.01.2026
