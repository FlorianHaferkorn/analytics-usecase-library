kpi_id: KPI-FIN-005
synonyms:
- Days Payable Outstanding
- Payables Days
- Creditor Days
- Kreditorenlaufzeit
example_question: Are we extending DPO with our largest suppliers this year?
kpi_key: DPO Days
kpi_type: diagnostic
kpi_role: strategic
impact_dimension: Liquidity
domain_tag:
- Finance
- Corporate & Strategy
use_case_ref:
- FIN-001
action_code_ref:
- F-C1.4
calc_type: amount
good_is: higher
business:
  purpose: Measures days payables outstanding.
  definition: Payables / (COGS / 365).
  grain_scope: Company/segment; monthly close.
  unit_format: days_0
  interpretation: Higher values improve cash but may impact supplier terms.
technical:
  measure_name: DPO Days
  description: Measures days payables outstanding.
  depends_on_measures: []
  lineage:
  - dim_date.CalendarYearMonth
  - fact_accounts_payable.AP Amount
  - fact_accounts_payable.COGS Amount
  calculation:
    op: ratio
    numerator:
      calc:
        op: mul
        terms:
        - calc:
            op: avgx_over_key
            key_column: CalendarYearMonth
            value:
              column: AP Amount
        - literal: 365
    denominator:
      calc:
        op: mul
        terms:
        - calc:
            op: avgx_over_key
            key_column: CalendarYearMonth
            value:
              column: COGS Amount
        - literal: 12
governance:
  business_owner: Head of Treasury / Procurement Controlling
  data_owner: Finance BI
  steward: Working Capital Analyst
  review_cycle: monthly
  validation_process: manual review
  qa_rules:
  - COGS > 0
  version: v1.0
metadata_quality:
  completeness_score: 0.8
  last_review: 23.01.2026
standard_ref:
- standard: SCOR-DS
  id: AM.1.1
  name: Cash-to-Cash Cycle Time — DPO component
  url: https://scor.ascm.org/performance/asset-management
  alignment: partial
  note: Days Payables Outstanding is the payables-days input of SCOR Cash-to-Cash Cycle Time (AM.1.1). Not an IFRS
    line item; the payables base is IAS 1 / IFRS 9.
