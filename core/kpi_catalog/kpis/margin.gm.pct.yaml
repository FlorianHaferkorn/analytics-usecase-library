kpi_id: margin.gm.pct
kpi_key: Gross Margin %
kpi_type: diagnostic
kpi_role: strategic
impact_dimension: Profitability
domain_tag:
- Finance
- Commercial
use_case_ref:
- COM-001
- COM-002
- COM-003
- COM-004
- XD-003
action_code_ref:
- C-M2.1
- C-M2.2
- C-S1.1
calc_type: ratio
good_is: higher
synonyms:
- GM%
- Gross Margin Rate
- Bruttomarge %
example_question: Why did Gross Margin % drop in Region North last quarter?
causal_links:
  model_type: local_linear_beta
  as_of: '2026-02-01'
  links:
  - influencing_kpi_id: sales.net_sales.amount
    effect:
      kind: abs_to_abs
      coefficient: 2.0e-06
      direction: positive
      interpretation: Higher net sales improve gross margin % when price and cost structure remain stable.
    applicability:
      grain: month
      segments:
      - Region
      - Channel
      - Product Category
    formula:
      standardized: Δmargin.gm.pct = 0.000002 * Δsales.net_sales.amount
      latex: \Delta GM = 0.000002 \cdot \Delta NetSales
  - influencing_kpi_id: cost.cogs.amount
    effect:
      kind: abs_to_abs
      coefficient: -2.0e-06
      direction: negative
      interpretation: Higher cost of goods sold reduces gross margin % when revenue does not increase
        proportionally.
    applicability:
      grain: month
      segments:
      - Region
      - Channel
      - Product Category
    formula:
      standardized: Δmargin.gm.pct = -0.000002 * Δcost.cogs.amount
      latex: \Delta GM = -0.000002 \cdot \Delta COGS
  - influencing_kpi_id: sales.net_sales.delta_pct.plan
    effect:
      kind: pct_to_pct
      coefficient: 0.3
      direction: positive
      interpretation: Closing the net sales gap versus plan is associated with higher gross margin % through
        better fixed-cost absorption and mix.
    applicability:
      grain: month
      segments:
      - Region
      - Channel
    formula:
      standardized: Δmargin.gm.pct = 0.3 * Δsales.net_sales.delta_pct.plan
      latex: \Delta GM = 0.3 \cdot \Delta NetSales_{vsPlan}
  - influencing_kpi_id: sales.net_sales.delta_pct.ly
    effect:
      kind: pct_to_pct
      coefficient: 0.25
      direction: positive
      interpretation: Improving net sales growth versus prior year tends to improve gross margin % through
        scale and operating leverage.
    applicability:
      grain: month
      segments:
      - Region
      - Channel
    formula:
      standardized: Δmargin.gm.pct = 0.25 * Δsales.net_sales.delta_pct.ly
      latex: \Delta GM = 0.25 \cdot \Delta NetSales_{vsLY}
  - influencing_kpi_id: sales.pvm.price_effect.amount
    effect:
      kind: abs_to_abs
      coefficient: 3.0e-06
      direction: positive
      interpretation: Positive price effect contributes directly to gross margin % improvement.
    applicability:
      grain: month
      segments:
      - Region
      - Channel
      - SKU
    formula:
      standardized: Δmargin.gm.pct = 0.000003 * Δsales.pvm.price_effect.amount
      latex: \Delta GM = 0.000003 \cdot \Delta PVM_{price}
  - influencing_kpi_id: sales.pvm.volume_effect.amount
    effect:
      kind: abs_to_abs
      coefficient: 1.0e-06
      direction: positive
      interpretation: Positive volume effect improves gross margin % when incremental volume carries sufficient
        contribution margin.
    applicability:
      grain: month
      segments:
      - Region
      - Channel
      - SKU
    formula:
      standardized: Δmargin.gm.pct = 0.000001 * Δsales.pvm.volume_effect.amount
      latex: \Delta GM = 0.000001 \cdot \Delta PVM_{volume}
  - influencing_kpi_id: sales.pvm.mix_effect.amount
    effect:
      kind: abs_to_abs
      coefficient: 2.0e-06
      direction: positive
      interpretation: Favorable product or customer mix improves gross margin % by shifting revenue toward
        higher-margin combinations.
    applicability:
      grain: month
      segments:
      - Region
      - Channel
      - Product Category
    formula:
      standardized: Δmargin.gm.pct = 0.000002 * Δsales.pvm.mix_effect.amount
      latex: \Delta GM = 0.000002 \cdot \Delta PVM_{mix}
  - influencing_kpi_id: sales.price.realization_pct
    effect:
      kind: pp_to_pp
      coefficient: 0.8
      direction: positive
      interpretation: +1pp Price Realization implies +0.8pp Gross Margin (ceteris paribus).
    applicability:
      grain: month
      segments:
      - Region
      - Channel
    formula:
      standardized: Δmargin.gm.pct(pp)=0.8*Δsales.price.realization_pct(pp)
      latex: \\Delta GM_{pp} = 0.8 \\cdot \\Delta PR_{pp}
  - influencing_kpi_id: margin.gm.amount
    effect:
      kind: abs_to_abs
      coefficient: 2.0e-06
      direction: positive
      interpretation: Higher gross margin amount is associated with higher gross margin % when revenue
        mix remains comparable.
    applicability:
      grain: month
      segments:
      - Region
      - Channel
      - Product Category
    formula:
      standardized: Δmargin.gm.pct = 0.000002 * Δmargin.gm.amount
      latex: \Delta GM = 0.000002 \cdot \Delta GM_{amount}
  - influencing_kpi_id: sales.price.list.amount
    effect:
      kind: abs_to_abs
      coefficient: 1.0e-06
      direction: positive
      interpretation: Higher list price levels support gross margin % provided realization discipline
        is maintained.
    applicability:
      grain: month
      segments:
      - Region
      - Channel
      - SKU
    formula:
      standardized: Δmargin.gm.pct = 0.000001 * Δsales.price.list.amount
      latex: \Delta GM = 0.000001 \cdot \Delta Price_{list}
  - influencing_kpi_id: sales.price.net.amount
    effect:
      kind: abs_to_abs
      coefficient: 2.0e-06
      direction: positive
      interpretation: Higher net realized price improves gross margin % directly.
    applicability:
      grain: month
      segments:
      - Region
      - Channel
      - SKU
    formula:
      standardized: Δmargin.gm.pct = 0.000002 * Δsales.price.net.amount
      latex: \Delta GM = 0.000002 \cdot \Delta Price_{net}
  - influencing_kpi_id: cost.cogs_per_unit.amount
    effect:
      kind: abs_to_abs
      coefficient: -0.15
      direction: negative
      interpretation: Higher unit COGS reduces gross margin % unless offset by price or mix gains.
    applicability:
      grain: month
      segments:
      - Region
      - Channel
      - SKU
    formula:
      standardized: Δmargin.gm.pct = -0.15 * Δcost.cogs_per_unit.amount
      latex: \Delta GM = -0.15 \cdot \Delta COGS_{unit}
  - influencing_kpi_id: margin.gm.vs_plan.pct
    effect:
      kind: pp_to_pp
      coefficient: 0.9
      direction: positive
      interpretation: Improving gross margin performance versus plan is strongly aligned with higher actual
        gross margin %.
    applicability:
      grain: month
      segments:
      - Region
      - Channel
    formula:
      standardized: Δmargin.gm.pct = 0.9 * Δmargin.gm.vs_plan.pct
      latex: \Delta GM = 0.9 \cdot \Delta GM_{vsPlan}
business:
  purpose: Gross margin % for commercial/operational reporting and strategic P&L reconciliation.
  definition: (Net Sales Amount - COGS Amount) / Net Sales Amount
  grain_scope: Invoice line aggregated to reporting period, org, customer or product segments.
  unit_format: '''% (1 decimal)'''
  interpretation: Values above 0 % indicate positive gross profit; trend over time shows structural profitability
    changes. Used for both operational management reporting and P&L reconciliation.
technical:
  measure_name: Gross Margin %
  description: Gross Margin % used in commercial and management reporting and P&L reconciliation.
  depends_on_measures:
  - sales.net_sales.amount
  - cost.cogs.amount
  lineage:
  - fact_sales.Cost of Goods Sold Amount
  - fact_sales.Net Sales Amount
  calculation:
    op: ratio
    numerator:
      kpi: margin.gm.amount
    denominator:
      kpi: sales.net_sales.amount
governance:
  business_owner: Head of Controlling
  data_owner: BI Engineering
  steward: Controlling Analyst
  review_cycle: quarterly
  validation_process: dual control
  qa_rules:
  - Value in [-100%; 100%]
  - Reconcile with P&L Gross Margin +/-0.5 pp
  version: v2.0
metadata_quality:
  completeness_score: 1.0
  last_review: 23.01.2026
standard_ref:
- standard: ESMA-APM
  name: Gross margin ratio (APM)
  url: https://www.esma.europa.eu/document/esma-guidelines-alternative-performance-measures-apms
  alignment: partial
  note: A ratio of two IFRS figures (IFRS 15 revenue, IAS 2 cost of sales); the percentage itself is a
    non-GAAP APM. Inputs are IFRS-clean — label the ratio as an APM in external reporting.
