standard_ref:
- standard: ISO 22400-2
  id: TR
  name: Throughput rate / Produced quantity
  url: https://www.iso.org/standard/54497.html
  alignment: partial
  note: ISO 22400-2 Throughput rate TR is per-unit-of-time (produced quantity / time); ours is a produced-quantity
    sum (the PQ element). Divide by the period to obtain the ISO throughput rate. Duplicate of ops.production.volume.
