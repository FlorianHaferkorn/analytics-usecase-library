kpi_id: customer.rfm.frequency_score
kpi_key: RFM Frequency Score
kpi_type: diagnostic
kpi_role: influencing
impact_dimension: Customer
domain_tag:
- Commercial
- Retail
use_case_ref:
- COM-IND-R001
action_code_ref: []
calc_type: ratio
business:
  purpose: Quintile score (1-5) of customer purchase frequency within the RFM model, averaged across the active
    base.
  definition: Mean of per-customer frequency quintile scores (1=least frequent, 5=most frequent) over the active
    customer base in scope.
  grain_scope: Customer aggregated to Segment by Month.
  unit_format: score_1
  interpretation: Higher frequency cohorts respond more strongly to cross-sell prompts; used to target attachment
    offers where repeat-visit behaviour already exists.
technical:
  measure_name: RFM Frequency Score
  description: Average customer purchase-frequency quintile score from the RFM model.
  depends_on_measures: []
  lineage:
  - fact_sales.Customer Key
  - fact_sales.Transaction Key
  calculation:
    op: hitl
    blocked_by: authoring
    reason: Quantil-Scoring (Transaktionszahl je Kunde -> Rangklasse 1-5). Kein Legacy-Vorbild im dist, also ist
      die Zielformel nicht festgelegt; ob die Grammatik sie traegt, ist erst nach der Ausformulierung entscheidbar.
governance:
  business_owner: Head of Customer Insight
  data_owner: Commercial BI Engineering
  steward: Customer Analytics Lead
  review_cycle: quarterly
  validation_process: quarterly recalibration of RFM quintile boundaries against the active base
  qa_rules:
  - Bounds [1; 5]
  - Quintile boundaries recomputed each quarter on a trailing 12-month window
  version: v1.0
metadata_quality:
  completeness_score: 1.0
  last_review: 18.06.2026
standard_ref:
- standard: Marketing analytics — RFM (convention)
  name: RFM frequency score
  alignment: none
  note: RFM (Recency-Frequency-Monetary) scoring is a long-standing direct-marketing segmentation model (Hughes/DMA
    lineage), a convention rather than a governed standard.
