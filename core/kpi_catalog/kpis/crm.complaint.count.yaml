kpi_id: crm.complaint.count
kpi_key: Complaint Count
kpi_type: diagnostic
kpi_role: strategic
impact_dimension: Customer
domain_tag:
- Customer & Market
use_case_ref:
- COM-003
action_code_ref:
- C-C3.2
calc_type: count
business:
  purpose: Provide the absolute number of logged complaints.
  definition: Count of complaint records in the complaint/service system.
  grain_scope: Complaint / ticket; aggregated to org / channel / product / period.
  unit_format: count
  interpretation: Higher values indicate more issues; interpret with Complaint Rate % to normalize by
    volume.
technical:
  measure_name: Complaint Count
  description: Count of logged customer complaints
  depends_on_measures: []
  lineage:
  - fact_experience
  calculation:
    op: hitl
    reason: Catalog lineage points column-less at 'fact_experience', but the legacy DAX sums fact_complaints[Complaint
      Count] — documented lineage mismatch (see Ledger I-1.2); fixing lineage is a separate, already-flagged
      scope.
governance:
  business_owner: Head of Customer Service
  data_owner: Service BI
  steward: Service Quality Analyst
  review_cycle: monthly
  validation_process: manual review
  qa_rules:
  - Complaints reconciled to service desk reports
  version: v1.0
metadata_quality:
  completeness_score: 1.0
  last_review: 23.01.2026
