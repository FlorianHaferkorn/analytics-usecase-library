standard_ref:
- standard: ISO 30414
  name: Human capital — turnover / retention
  url: https://www.iso.org/standard/69338.html
  alignment: partial
  note: ISO 30414:2018 (human capital reporting) defines turnover and retention-rate metrics. Attrition RISK here
