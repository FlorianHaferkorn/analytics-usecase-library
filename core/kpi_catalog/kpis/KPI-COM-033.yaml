kpi_id: KPI-COM-033
synonyms:
- Eigenmarkenanteil
- Private Label Anteil
- Private label penetration
kpi_key: Private Label Penetration %
kpi_type: diagnostic
kpi_role: strategic
impact_dimension: Profitability
domain_tag:
- Commercial
- Assortment
use_case_ref:
- COM-IND-R002
action_code_ref:
- C-M2.3
- C-M2.4
calc_type: ratio
good_is: higher
business:
  purpose: Measures the share of revenue from private-label (own-brand) products.
  definition: Private-label net sales / total net sales.
  grain_scope: Category/region; weekly, reported monthly.
  unit_format: percent_1
  interpretation: Higher usually lifts gross margin; an outcome of category-management decisions already taken, so
    read it per category. Requires consistent private-label flagging of every SKU.
technical:
  measure_name: Private Label Penetration %
  description: Net sales of private-label products divided by total net sales.
  depends_on_measures: []
  lineage:
  - fact_sales.Net Sales Amount
  - dim_product.Private Label Flag
  calculation:
    # 30.10.2026: rechenbar. dim_product traegt Private Label Flag im Vertrag commercial_sales;
    # der Zaehler ist eine Summe unter einem Dimensionsfilter (Op sum_filtered, ab dem zweiten
    # Vorkommen des Musters calculate_sum_with_dimension_filter faellig, vorher op:hitl
    # blocked_by data_contract).
    op: ratio
    numerator:
      calc:
        op: sum_filtered
        column: Net Sales Amount
        filters:
        - column: Private Label Flag
          equals: true
    denominator:
      column: Net Sales Amount
governance:
  business_owner: TBD
  data_owner: TBD
  steward: TBD
  review_cycle: monthly
  validation_process: manual review
  qa_rules:
  - Denominator > 0 for reported slices
  - Every SKU flagged private label yes/no
  version: v1.0
metadata_quality:
  completeness_score: 1.0
  last_review: 02.10.2026
standard_ref:
- standard: Retail analytics (convention)
  name: Private label share
  alignment: none
  note: Private-label share is a retail-analytics convention; some sources measure it by units instead of revenue —
    this KPI is revenue-based.
