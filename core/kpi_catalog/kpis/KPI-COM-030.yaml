kpi_id: KPI-COM-030
kpi_key: Sales Velocity
kpi_type: diagnostic
kpi_role: influencing
impact_dimension: Growth
domain_tag:
- Commercial
- Growth
use_case_ref:
- COM-005
action_code_ref: []
calc_type: sum
good_is: higher
business:
  purpose: Measures revenue generation rate through the pipeline.
  definition: (Open Opportunities x Avg Won Deal Value x Win Rate) / Sales Cycle Length.
  grain_scope: Rep/segment; monthly.
  unit_format: eur_0
  interpretation: Higher is better; a composite health signal for the funnel engine.
technical:
  measure_name: Sales Velocity
  description: Measures revenue generation rate through the pipeline.
  depends_on_measures:
  - KPI-COM-027
  - KPI-COM-029
  lineage:
  - fact_pipeline.OpportunityID
  - fact_pipeline.Won Flag
  - fact_pipeline.Lost Flag
  - fact_pipeline.Opportunity Value Amount
  - fact_pipeline.Won Count
  - fact_pipeline.Decided Count
  - fact_pipeline.Cycle Days
  calculation:
    # 24.10.2026: Komposition statt hitl-Platzhalter. Die DSL schachtelt (calc_ref.calc), die Begruendung
    # "beyond the single-op DSL" traf nicht zu. Offen = weder gewonnen noch verloren. Avg Deal Value =
    # Mittelwert der gewonnenen Deals (Entscheid Florian Haferkorn, 24.10.2026; uebliche Lesart
    # "average deal size = closed-won").
    op: ratio
    numerator:
      calc:
        op: mul
        terms:
        - calc:
            op: count_filtered
            column: OpportunityID
            filters:
            - column: Won Flag
              equals: false
            - column: Lost Flag
              equals: false
        - calc:
            op: avg_filtered
            column: Opportunity Value Amount
            filters:
            - column: Won Flag
              equals: true
        - kpi: KPI-COM-027
    denominator:
      kpi: KPI-COM-029
governance:
  business_owner: TBD
  data_owner: TBD
  steward: TBD
  review_cycle: quarterly
  validation_process: manual review
  qa_rules:
  - Denominator > 0 for reported slices
  version: v1.0
metadata_quality:
  completeness_score: 1.0
  last_review: 18.07.2026
standard_ref:
- standard: Sales pipeline management (convention)
  name: Sales velocity formula
  alignment: none
  note: Sales velocity is a widely-used commercial convention (opps x value x win-rate / cycle); no external standard
    defines it.
