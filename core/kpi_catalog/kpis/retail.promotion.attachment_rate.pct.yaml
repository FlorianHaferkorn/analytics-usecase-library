kpi_id: retail.promotion.attachment_rate.pct
kpi_key: Promotion Attachment Rate %
kpi_type: diagnostic
kpi_role: influencing
impact_dimension: Growth
domain_tag:
- Commercial
- Retail
use_case_ref:
- COM-IND-R001
action_code_ref:
- C-M3.1
calc_type: rate
business:
  purpose: Share of promoted-item transactions that also contain at least one attached full-margin item from an
    affinity category.
  definition: Promoted transactions with an attached affinity-category item divided by all promoted transactions
    in scope.
  grain_scope: Transaction aggregated by Month, Store, Channel, Promotion.
  unit_format: percent_1
  interpretation: Measures whether promotion mechanics pull margin-accretive attachment rather than standalone deal-seeking;
    the primary lever for cross-sell rate.
technical:
  measure_name: Promotion Attachment Rate %
  description: Share of promoted transactions carrying an attached affinity-category item.
  depends_on_measures: []
  lineage:
  - fact_sales.Promotion Key
  - fact_sales.Category Key
  calculation:
    op: hitl
    blocked_by: authoring
    reason: Anteil Transaktionen mit Promotion-Bezug je Kategorie. Kein Legacy-Vorbild im dist — dieselbe offene
      Frage wie bei crosssell_rate.
governance:
  business_owner: Head of Trade Marketing
  data_owner: Commercial BI Engineering
  steward: Trade Marketing Analyst
  review_cycle: monthly
  validation_process: monthly reconciliation against promotion participation logs
  qa_rules:
  - Bounds [0%; 100%]
  - Denominator restricted to transactions containing at least one promoted item
  version: v1.0
metadata_quality:
  completeness_score: 1.0
  last_review: 18.06.2026
standard_ref:
- standard: Retail analytics (convention)
  name: Attachment rate
  alignment: none
  note: Promotion attachment rate is a retail merchandising-analytics convention; no external standard.
