kpi_id: crm.revenue_at_risk.amount
kpi_key: Revenue at Risk Amount
kpi_type: diagnostic
kpi_role: strategic
impact_dimension: Customer
domain_tag:
- Customer & Market
- Operations
use_case_ref:
- COM-003
- XD-003
action_code_ref:
- C-C3.1
calc_type: amount
business:
  purpose: Quantify revenue exposure proportional to the customer attrition rate.
  definition: Net Sales Amount × (Churned Customers / Active Customers).
  grain_scope: Customer/segment; monthly.
  unit_format: eur_0
  interpretation: Higher values indicate more revenue at risk from customer churn; prioritize retention actions
    on high-value at-risk segments.
technical:
  measure_name: Revenue at Risk Amount
  description: Net Sales Amount weighted by the churned-to-active customer ratio.
  depends_on_measures:
  - sales.net_sales.amount
  - crm.churned_customers.count
  - crm.active_customers.count
  lineage:
  - fact_sales.Net Sales Amount
  - fact_customer_events.CustomerKey
  - fact_customer_events.Churn Flag
  - fact_customer_events.Activity Flag
  calculation:
    op: mul
    terms:
    - kpi: sales.net_sales.amount
    - calc:
        op: ratio
        numerator:
          calc:
            op: distinctcount
            column: CustomerKey
            filters:
            - column: Churn Flag
              equals: true
        denominator:
          calc:
            op: distinctcount
            column: CustomerKey
            filters:
            - column: Activity Flag
              equals: true
governance:
  business_owner: Head of Operations
  data_owner: Ops BI
  steward: Operations Analyst
  review_cycle: quarterly
  validation_process: manual review
  qa_rules:
  - At-risk revenue reconciles to Net Sales weighted by the churned/active customer ratio within +/- 1 %
  version: v1.1
metadata_quality:
  completeness_score: 1.0
  last_review: 20.04.2026
standard_ref:
- standard: Marketing analytics — CRM (convention)
  name: Revenue at risk (churn-weighted)
  alignment: none
  note: Revenue at risk (net sales x churn rate) is a composite CRM convention built on IFRS 15 revenue and the
    churn convention; no external standard defines it.
