- Umschlagshäufigkeit
example_question: Which categories have the slowest inventory turnover?
kpi_key: Inventory Turnover
kpi_type: diagnostic
kpi_role: supporting
impact_dimension: Efficiency
domain_tag:
- Supply Chain
- Operational Efficiency
use_case_ref:
- SCM-001
action_code_ref:
