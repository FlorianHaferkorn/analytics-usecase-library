kpi_id: KPI-OPS-019
kpi_key: Speed Loss Rate %
kpi_type: diagnostic
kpi_role: supporting
impact_dimension: Efficiency
domain_tag:
- Operations
- Operational Efficiency
use_case_ref:
- OPS-001
action_code_ref:
- O-O1.2
calc_type: rate
good_is: lower
business:
  purpose: Isolates chronic speed reduction from intermittent minor stops.
  definition: Speed Loss = (1 - Performance Rate) adjusted to exclude minor stop events. Corresponds to Six Big
    Losses Category 4 (Reduced Speed).
  grain_scope: Line/shift aggregated to plant and period.
  unit_format: percent_1
  interpretation: Lower is better; speed losses are often misclassified as acceptable safety margin versus ISO ideal
    cycle time.
technical:
  measure_name: Speed Loss Rate %
  description: Chronic speed reduction component of performance loss.
  depends_on_measures:
  - KPI-OPS-002
  lineage:
  - fact_ops.Actual Cycle Time
  - fact_ops.Ideal Cycle Time
  - fact_ops.Minor Stop Count
  calculation:
    op: hitl
    blocked_by: authoring
    reason: New-territory KPI — no legacy DAX counterpart to verify against (not in products/fabric/powerbi/dist/Operations.SemanticModel).
      "(1 - Performance Rate) adjusted to exclude minor stop events" is a residual/decomposition formula whose exact
      minor-stop adjustment isn't specified precisely enough to derive without guessing, and is beyond the current
      grammar regardless.
governance:
  business_owner: Head of Operations
  data_owner: Operations BI
  steward: OEE Analyst
  review_cycle: quarterly
  validation_process: manual review
  qa_rules:
  - KPI-OPS-019 + minor_stops_contribution ≤ 1 - KPI-OPS-002
  version: v1.0
metadata_quality:
  completeness_score: 0.7
  last_review: 01.06.2026
standard_ref:
- standard: ISO 22400-2
  id: E
  name: Effectiveness (speed) loss
  url: https://www.iso.org/standard/54497.html
  alignment: partial
  note: Speed loss = 1 − performance rate is the ISO 22400-2 Effectiveness (E) loss / reduced-speed category of
    the Six Big Losses; report against E to align.
