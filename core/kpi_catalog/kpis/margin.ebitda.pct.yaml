kpi_id: margin.ebitda.pct
kpi_key: EBITDA Margin
kpi_type: diagnostic
kpi_role: strategic
impact_dimension: Profitability
domain_tag:
- Finance
use_case_ref: []
action_code_ref: []
calc_type: ratio
business:
  purpose: EBITDA profitability relative to net sales for P&L reporting.
  definition: EBITDA Amount / Net Sales Amount
  grain_scope: Entity-month; finance reporting.
  unit_format: '''% (1 decimal)'''
  interpretation: Higher values indicate stronger operating profitability before interest, tax, depreciation
    and amortisation.
technical:
  measure_name: EBITDA Margin
  description: EBITDA divided by net sales.
  depends_on_measures: []
  lineage:
  - fact_finance.EBITDA Amount
  - fact_finance.Net Sales Amount
  calculation:
    op: ratio
    numerator:
      column: EBITDA Amount
    denominator:
      column: Net Sales Amount
governance:
  business_owner: Head of Controlling
  data_owner: BI Engineering
  steward: Controlling Analyst
  review_cycle: quarterly
  validation_process: dual control
  qa_rules:
  - Value in [-100%; 100%]
  - Reconcile with P&L EBITDA +/- 0.5 pp
  version: v1.0
metadata_quality:
  completeness_score: 1.0
  last_review: 12.06.2026
standard_ref:
- standard: ESMA-APM
  name: EBITDA margin — Alternative Performance Measure
  url: https://www.esma.europa.eu/document/esma-guidelines-alternative-performance-measures-apms
  alignment: none
  note: 'EBITDA is NOT defined by IFRS. It is an Alternative Performance Measure: under the ESMA APM Guidelines
    it must be labelled as non-GAAP, reconciled to the most directly reconcilable IFRS line item, and
    shown with a comparative. Under IFRS 18 (eff. 1 Jan 2027) an EBITDA-type figure used in public communication
    is a Management-defined Performance Measure (MPM) requiring a dedicated reconciliation note to the
    nearest IFRS subtotal — IFRS 18''s closest defined analogue is OPDAI (''operating profit before depreciation,
    amortisation and impairments''). Do not present as an IFRS metric.'
