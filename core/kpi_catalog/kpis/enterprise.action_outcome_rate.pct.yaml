kpi_id: enterprise.action_outcome_rate.pct
kpi_key: Action Outcome Rate %
kpi_type: diagnostic
kpi_role: strategic
impact_dimension: Governance
domain_tag:
- Enterprise & Governance
- Governance
use_case_ref:
- XD-004
action_code_ref: []
calc_type: rate
business:
  purpose: Measures share of actions that achieved the intended outcome.
  definition: Rows in fact_action_outcome with outcome_status = "achieved" divided
    by all rows in fact_action_outcome.
  grain_scope: Action instance; aggregated by period and domain.
  unit_format: '''% (1 decimal)'''
  interpretation: Higher values indicate better execution effectiveness.
technical:
  measure_name: Action Outcome Rate %
  description: Measures share of actions that achieved the intended outcome.
  depends_on_measures: []
  lineage:
  - fact_action_outcome.outcome_status
  calculation:
    op: ratio
    numerator:
      calc:
        op: count_filtered
        column: outcome_status
        filters:
        - column: outcome_status
          equals: achieved
    denominator:
      calc:
        op: count
        column: outcome_status
governance:
  business_owner: Executive Office
  data_owner: PMO Analytics
  steward: PMO Analyst
  review_cycle: monthly
  validation_process: manual review
  qa_rules:
  - 'Legacy carries two candidate formulas for this KPI id in Experience.SemanticModel:
    the canonical one used here (fact_action_outcome, lowercase "achieved", part
    of the actively-maintained Actions Executed/Avg Time-to-Outcome/Action ROI %
    sibling group) and an older ''Action Outcome Rate % (XD Log)'' variant (fact_action_log,
    "Achieved" capitalized) that has no surviving sibling measures — treated as
    a superseded duplicate, not the source of truth.'
  version: v0.1
metadata_quality:
  completeness_score: 1.0
  last_review: 23.01.2026
