# Golden 18 — Lean Core KPI spine (v1.1)
#
# These 18 KPIs are the authoritative strategic layer of the framework.
# Every Aurora report must reference at least one Golden-spine KPI.
# Supporting and narrow KPIs are in core/kpi_catalog/extended_playbook.md.
#
# v1.1 (KPI dedup): removed svc.nps.index (→ KPI-CUS-003) and ops.otif.pct
#   (→ KPI-SCM-007); both canonicals were already in the spine, so the two
#   twins were redundant. Count reduced 20 → 18.
#
# Selection criteria (audit §2A, 2026-04-20):
#   - kpi_role: strategic in catalog
#   - Referenced in 2+ use cases across different domains
#   - Covers the full P&L / operating model arc: Revenue, Cost, Quality,
#     Service, Supply Chain, Customer Value

schema_version: "1.0"
published: "2026-04-20"

kpi_ids:
  # ── Commercial / Customer ─────────────────────────────────────
  - id: KPI-COM-005
    rationale: Primary revenue KPI; referenced in every commercial and XD use case.

  - id: KPI-FIN-011
    rationale: Anchor cost KPI for margin calculation across Commercial and Finance.

  - id: KPI-CUS-001
    rationale: Customer Lifetime Value — strategic north star for retention investment.

  - id: KPI-CUS-002
    rationale: Retention rate; leading indicator of CLV trajectory.

  - id: KPI-CUS-003
    rationale: Net Promoter Score — gold-standard customer advocacy signal.

  - id: KPI-OPS-001
    rationale: Revenue at risk from delivery/quality failures; bridges ops and CRM.

  # ── Operations / Quality ──────────────────────────────────────
  - id: KPI-OPS-002
    rationale: Overall Equipment Effectiveness (OEE); core manufacturing efficiency.

  - id: KPI-QUA-001
    rationale: First Pass Yield; primary quality output metric.

  - id: KPI-QUA-003
    rationale: Cost of Poor Quality; financial impact of quality failures.

  # ── Supply Chain ──────────────────────────────────────────────
  - id: KPI-SCM-007
    rationale: Supply-side OTIF; differentiates supplier vs. ops OTIF performance.

  - id: KPI-SCM-001
    rationale: Days Inventory Outstanding; cash and turns anchor for SCM.

  - id: KPI-SCM-002
    rationale: Stockout %; customer-facing impact of supply failure.

  - id: KPI-SCM-005
    rationale: Forecast Accuracy (MAPE inverse); upstream driver of stockouts and OTIF.

  - id: KPI-SCM-006
    rationale: Forecast Bias; directional error signal for demand planning.

  # ── Finance ───────────────────────────────────────────────────
  - id: KPI-COM-019
    rationale: Gross Margin Amount; financial reporting anchor for P&L use cases.

  - id: KPI-COM-013
    rationale: Gross Margin %; bridges revenue and cost for executive reporting.

  # ── Service / Experience ──────────────────────────────────────
  - id: KPI-SVC-005
    rationale: First Contact Resolution; primary service efficiency and quality KPI.

  - id: KPI-SVC-008
    rationale: Escalation Rate; leading indicator of NPS deterioration in service.
