# planned.yaml — KPI entries whose measure_name is not yet implemented in _Measures.tmdl
#
# These entries are recognised by check_catalog_tmdl_drift.py and emitted as
# WARNINGS (not errors) so CI is not blocked while implementation is in progress.
#
# Schema: tooling/generator/schemas/planned_kpi.schema.json
#
# Fields:
#   kpi_id     (required) — must match a kpi_id in core/kpi_catalog/KPI_Catalog.md
#   owner      (required) — team / role responsible for implementation
#   eta_date   (required) — target date in ISO 8601 format (YYYY-MM-DD)
#   reason     (required) — one-line explanation of why not yet implemented

