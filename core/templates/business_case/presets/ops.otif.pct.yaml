kpi_id: ops.otif.pct
label: Operations OTIF %
baseline_range:
  min: 80
  likely: 85
  max: 90
  unit: "%"
  note: "Operations-side OTIF (manufacturing to DC); differentiates from supply.otif.pct."
target_range:
  min: 87
  likely: 92
  max: 96
  unit: "%"
  note: "Target: close the gap to customer-facing OTIF threshold required by major accounts."
time_horizon_months: 12
driver_notes:
  - "OEE improvement (O-A2.1) reduces production-side OTIF failures from capacity and downtime."
  - "Forecast accuracy (S-F3.1) reduces last-minute re-scheduling causing on-time failures."
  - "Inventory optimization (S-I1.2) ensures component availability, reducing in-full failures."
  - "Each 1 pp ops OTIF improvement reduces expedite cost by 30-80k EUR and penalty risk by 50-100k EUR."
