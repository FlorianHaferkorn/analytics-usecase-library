kpi_id: KPI-COM-013
label: Gross Margin %
baseline_range:
  min: 30
  likely: 34
  max: 39
  unit: "%"
  note: "GM% benchmark for mid-market manufacturing/FMCG; varies significantly by sector."
target_range:
  min: 33
  likely: 37
  max: 42
  unit: "%"
  note: "Target: 2-4 pp GM% improvement over 12-18 months from price and cost levers."
time_horizon_months: 12
driver_notes:
  - "C-M2.1 (Price Realization Guardrails): protects 0.1-0.7 pp from list-to-invoice gap."
  - "C-M2.2 (Mix Optimization): adds 0.08-0.60 pp through portfolio shift to high-margin SKUs."
  - "F-K2.1 (Cost Take-Out Orchestration): 0.5-1.2 pp via unit cost reduction programme."
  - "O-Q3.1 (Quality & Yield Orchestration): 0.3-0.8 pp from reduced COPQ in COGS."
