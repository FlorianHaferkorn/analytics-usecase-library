kpi_id: quality.fpy.pct
label: First Pass Yield %
baseline_range:
  min: 88
  likely: 93
  max: 97
  unit: "%"
  note: "FPY benchmark for discrete manufacturing; process industries typically higher."
target_range:
  min: 92
  likely: 96
  max: 99
  unit: "%"
  note: "Target: 3-6 pp FPY improvement reducing scrap and rework cost materially."
time_horizon_months: 12
driver_notes:
  - "O-Q3.1 (Quality & Yield Orchestration): identifies defect clusters and triggers root-cause actions."
  - "Each 1 pp FPY improvement reduces COPQ by approximately 0.5-1% of revenue."
  - "Scrap and rework represent 60-70% of total COPQ; FPY is the primary lever."
  - "Statistical process control (SPC) is the enabler; no major CAPEX required for process industries."
