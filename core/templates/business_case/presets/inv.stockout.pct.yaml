kpi_id: inv.stockout.pct
label: Stockout Rate %
baseline_range:
  min: 2
  likely: 4
  max: 8
  unit: "%"
  note: "Percentage of order lines experiencing a stockout; 2-4% typical for FMCG/industrial."
target_range:
  min: 1
  likely: 2
  max: 3.5
  unit: "%"
  note: "Target: halve stockout rate, recovering 1-3% of revenue in previously-lost sales."
time_horizon_months: 12
driver_notes:
  - "Each 1 pp stockout reduction protects an estimated 0.5-1% of revenue in fulfilled demand."
  - "S-I1.2 (Inventory Rightsizing) addresses structural stockouts from safety-stock gaps."
  - "S-F3.1 (Forecast Quality Orchestration) reduces demand-surprise stockouts from forecast error."
  - "S-R2.1 (OTIF Orchestration) closes supply-side stockouts from late/short supplier deliveries."
