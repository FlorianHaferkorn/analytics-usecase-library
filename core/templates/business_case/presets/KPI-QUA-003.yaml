kpi_id: KPI-QUA-003
label: Cost of Poor Quality
baseline_range:
  min: 8000000
  likely: 12000000
  max: 20000000
  unit: EUR
  note: "COPQ typically 2-4% of revenue; 500M EUR revenue implies 10-20M EUR baseline."
target_range:
  min: 5000000
  likely: 7500000
  max: 12000000
  unit: EUR
  note: "Target: 30-40% COPQ reduction over 12 months through yield and complaint action codes."
time_horizon_months: 12
driver_notes:
  - "Internal failure (scrap + rework) represents 60-70% of COPQ; addressable by O-Q3.1 FPY improvement."
  - "External failure (warranty, returns, penalties) represents 20-30%; addressed by S-R2.1 OTIF."
  - "Prevention and appraisal costs increase initially as quality systems improve."
  - "ASQ benchmark: world-class companies target COPQ below 1% of revenue."
