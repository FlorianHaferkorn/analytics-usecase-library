<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T3 — Operational Monitoring</title>
<script src="tokens.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: Inter, 'Segoe UI', system-ui, sans-serif;
  background: #E8E8E8;
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; padding: 24px;
}
</style>
</head>
<body>
<div id="root"></div>

<script>
// T3 — Operational Monitoring
// Use case: OPS OTIF Monitoring — "Where are we outside threshold, and who needs to act now?"

const T = window.T;
const slotPos = window.slotPos;

function style(obj) {
  return Object.entries(obj).map(([k,v]) => {
    return k.replace(/([A-Z])/g, m => '-'+m.toLowerCase())+':'+v;
  }).join(';');
}

function kpiCard(label, value, delta, deltaDir, period, polarity) {
  polarity = polarity || 'higher_is_better';
  const favourable =
    (deltaDir === 'up'   && polarity === 'higher_is_better') ||
    (deltaDir === 'down' && polarity === 'lower_is_better');
  const color = favourable ? T.positive : T.negative;
  const icon  = deltaDir === 'up' ? '▲' : '▼';
  return `<div style="${style({height:'100%',background:T.surfaceCard,
    border:'0.5px solid '+T.border,borderRadius:'4px',
    padding:'10px 12px',display:'flex',flexDirection:'column',gap:'2px'})}">
    <div style="font-size:10px;color:${T.textSecondary};font-weight:500">${label}</div>
    <div style="font-size:24px;font-weight:700;line-height:1.05;
      font-family:'JetBrains Mono',ui-monospace,monospace;color:${T.textPrimary}">${value}</div>
    <div style="display:flex;align-items:baseline;gap:4px;font-size:11px;color:${color};font-weight:600">
      <span>${icon}</span><span>${delta}</span>
      <span style="color:${T.textSecondary};font-weight:400;font-size:10px">${period}</span>
    </div>
  </div>`;
}

function severityChip(level) {
  const map = {
    critical: {bg:T.critTint, fg:T.negative, icon:'●', label:'Critical'},
    warning:  {bg:T.warnTint, fg:T.warning,  icon:'▲', label:'Warning'},
    info:     {bg:T.surfaceRowAlt, fg:T.neutral, icon:'■', label:'Info'},
  };
  const s = map[level];
  return `<span style="${style({display:'inline-flex',alignItems:'center',gap:'4px',
    background:s.bg,color:s.fg,fontSize:'9px',fontWeight:'600',
    padding:'1px 6px',borderRadius:'2px'})}">
    <span style="font-size:7px">${s.icon}</span>${s.label}
  </span>`;
}

function exceptionTable(rows) {
  const hdStyle = style({display:'grid',
    gridTemplateColumns:'1.3fr 0.9fr 1.1fr 1.3fr 1fr 0.7fr',
    fontSize:'8.5px',fontWeight:'700',padding:'5px 8px',
    borderBottom:'1px solid '+T.border,color:T.textPrimary,
    textTransform:'uppercase',letterSpacing:'0.3px',background:T.surfaceCard});
  const header = `<div style="${hdStyle}">
    <div>Entity</div><div>Severity</div><div>Metric</div>
    <div>Actual / Threshold</div><div>Owner</div>
    <div style="text-align:right">Age</div>
  </div>`;
  const rowsHtml = rows.map(r => {
    const bg = r.severity === 'critical' ? T.critTint :
               r.severity === 'warning'  ? T.warnTint : T.surfaceCard;
    return `<div style="${style({display:'grid',
      gridTemplateColumns:'1.3fr 0.9fr 1.1fr 1.3fr 1fr 0.7fr',
      fontSize:'9.5px',padding:'5px 8px',alignItems:'center',
      background:bg,borderBottom:'0.5px solid '+T.border})}">
      <div style="font-weight:600">${r.entity}</div>
      <div>${severityChip(r.severity)}</div>
      <div style="color:${T.textSecondary}">${r.metric}</div>
      <div style="font-family:'JetBrains Mono',monospace;
        color:${r.severity==='critical'?T.negative:T.textPrimary};font-weight:600">
        ${r.actual} <span style="color:${T.textSecondary};font-weight:400"> / ${r.threshold}</span>
      </div>
      <div style="font-size:9px">${r.owner}</div>
      <div style="text-align:right;font-family:'JetBrains Mono',monospace;
        font-size:9px;color:${T.textSecondary}">${r.age}</div>
    </div>`;
  }).join('');
  return `<div style="${style({height:'100%',overflow:'hidden',
    border:'0.5px solid '+T.border,borderRadius:'3px',background:T.surfaceCard})}">
    ${header}${rowsHtml}
  </div>`;
}

function lineChart(series, xLabels, w, h) {
  const all = series.flatMap(s => s.data);
  const maxV = Math.max(...all), minV = 0;
  const pad = {l:28, r:8, t:14, b:22};
  const plotW = w - pad.l - pad.r, plotH = h - pad.t - pad.b;
  const n = xLabels ? xLabels.length : series[0].data.length;
  const xOf = i => pad.l + (i / (n - 1)) * plotW;
  const yOf = v => pad.t + plotH - ((v - minV) / (maxV - minV || 1)) * plotH;
  const gridYs = [0, 0.5, 1].map(f => pad.t + f * plotH);
  let svg = `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" style="width:100%;height:100%;display:block">`;
  gridYs.forEach(y => {
    svg += `<line x1="${pad.l}" x2="${w-pad.r}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${T.border}" stroke-width="0.5" opacity="0.8"/>`;
  });
  const colors = [T.negative, T.warning, T.primary];
  series.forEach((s, si) => {
    const c = s.color || colors[si];
    const pts = s.data.map((v, i) => `${xOf(i).toFixed(1)},${yOf(v).toFixed(1)}`).join(' ');
    svg += `<polyline points="${pts}" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>`;
  });
  if (xLabels) {
    xLabels.forEach((l, i) => {
      if (i % Math.ceil(n / 6) === 0 || i === n - 1) {
        svg += `<text x="${xOf(i).toFixed(1)}" y="${h-4}" font-size="8" fill="${T.textSecondary}" text-anchor="middle">${l}</text>`;
      }
    });
  }
  svg += `<g transform="translate(${pad.l},2)">`;
  series.forEach((s, i) => {
    const c = s.color || colors[i];
    svg += `<g transform="translate(${i*70},0)">
      <line x1="0" y1="4" x2="10" y2="4" stroke="${c}" stroke-width="1.8"/>
      <text x="13" y="7" font-size="8" fill="${T.textSecondary}">${s.name}</text>
    </g>`;
  });
  svg += '</g></svg>';
  return svg;
}

function hBar(rows, valueFmt, w, h) {
  const max = Math.max(...rows.map(r => r.value));
  const pad = {l:70, r:30, t:8, b:8};
  const plotW = w - pad.l - pad.r;
  const rowH = (h - pad.t - pad.b) / rows.length;
  const barH = Math.min(rowH * 0.6, 12);
  let svg = `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" style="width:100%;height:100%;display:block">`;
  rows.forEach((r, i) => {
    const y = pad.t + i * rowH + (rowH - barH) / 2;
    const bw = (r.value / max) * plotW;
    const color = r.color || T.warning;
    svg += `<text x="${pad.l-4}" y="${(y+barH*0.78).toFixed(1)}" font-size="9" fill="${T.textPrimary}" text-anchor="end">${r.label}</text>`;
    svg += `<rect x="${pad.l}" y="${y.toFixed(1)}" width="${(bw||1).toFixed(1)}" height="${barH}" fill="${color}" rx="1"/>`;
    svg += `<text x="${(pad.l+bw+3).toFixed(1)}" y="${(y+barH*0.78).toFixed(1)}" font-size="8" fill="${T.textPrimary}" font-family="'JetBrains Mono',monospace">${valueFmt(r.value)}</text>`;
  });
  svg += '</svg>';
  return svg;
}

function card(title, innerHtml, noPad) {
  return `<div style="${style({width:'100%',height:'100%',background:T.surfaceCard,
    border:'0.5px solid '+T.border,borderRadius:'4px',
    display:'flex',flexDirection:'column',overflow:'hidden'})}">
    ${title ? `<div style="padding:8px 10px 4px;font-size:11px;font-weight:600;color:${T.textPrimary};line-height:1.2">${title}</div>` : ''}
    <div style="flex:1;${noPad?'':'padding:4px 10px 8px;'}min-height:0;overflow:hidden">${innerHtml}</div>
  </div>`;
}

function slicerBar(slicers) {
  const pills = slicers.map(s => `
    <div style="${style({display:'flex',alignItems:'center',gap:'6px',padding:'3px 9px',
      background:T.surfacePage,border:'0.5px solid '+T.border,borderRadius:'3px',fontSize:'10px'})}">
      <span style="color:${T.textSecondary}">${s.label}</span>
      <span style="font-weight:600">${s.value}</span>
      <svg width="8" height="8" viewBox="0 0 8 8" fill="none">
        <path d="M2 3l2 2 2-2" stroke="${T.textSecondary}" stroke-width="1"/>
      </svg>
    </div>`).join('');
  return `<div style="${style({height:'100%',background:T.surfaceCard,border:'0.5px solid '+T.border,
    borderRadius:'4px',display:'flex',alignItems:'center',gap:'8px',padding:'0 12px'})}">
    <span style="font-size:9px;color:${T.textSecondary};font-weight:600;text-transform:uppercase;letter-spacing:0.5px">Filter</span>
    ${pills}
  </div>`;
}

function slotDiv(col, row, cs, rs, innerHTML, extraStyle) {
  const p = slotPos(col, row, cs, rs);
  return `<div style="position:absolute;left:${p.left.toFixed(1)}px;top:${p.top.toFixed(1)}px;
    width:${p.width.toFixed(1)}px;height:${p.height.toFixed(1)}px;${extraStyle||''}">${innerHTML}</div>`;
}

function pageChrome(breadcrumb, pageType, title, decisionQ, innerHtml) {
  return `<div style="${style({width:'1280px',height:'720px',background:T.surfacePage,
    position:'relative',fontFamily:"Inter,'Segoe UI',system-ui,sans-serif",
    color:T.textPrimary,overflow:'hidden',boxShadow:'0 4px 24px rgba(0,0,0,0.12)'})}">
    <div style="${style({position:'absolute',top:'0',left:'0',right:'0',height:'24px',
      display:'flex',alignItems:'center',justifyContent:'space-between',
      padding:'6px 16px',fontSize:'10px',color:T.textSecondary,
      borderBottom:'1px solid '+T.border,background:T.surfaceCard})}">
      <span style="letter-spacing:0.3px">${breadcrumb}</span>
      <span style="${style({background:T.primary,color:'#fff',padding:'2px 8px',
        borderRadius:'3px',fontSize:'9px',fontWeight:'600',letterSpacing:'0.5px'})}">${pageType}</span>
    </div>
    <div style="${style({position:'absolute',top:'24px',left:'0',right:'0',height:'40px',
      padding:'6px 32px',borderBottom:'1px solid '+T.border,background:T.surfaceCard})}">
      <div style="font-size:13px;font-weight:600;line-height:1.1">${title}</div>
      <div style="font-size:10px;color:${T.textSecondary};margin-top:2px;font-style:italic">${decisionQ}</div>
    </div>
    <div style="position:absolute;top:64px;left:0;right:0;bottom:0">${innerHtml}</div>
  </div>`;
}

// ── T3 data ───────────────────────────────────────────────────────────────────

const kpis = [
  { label:'Open Exceptions',     value:'14',    delta:'+3',    deltaDir:'up',   period:'vs yesterday', polarity:'lower_is_better' },
  { label:'Critical',            value:'3',     delta:'+1',    deltaDir:'up',   period:'vs yesterday', polarity:'lower_is_better' },
  { label:'OTIF (7d rolling)',   value:'91.4%', delta:'-2.6pp',deltaDir:'down', period:'vs SLA',       polarity:'higher_is_better' },
  { label:'Avg Age (open)',      value:'4.2d',  delta:'+0.8d', deltaDir:'up',   period:'vs target',    polarity:'lower_is_better' },
];
const kpiW = (1280 - 64 - 3*16) / 4;
function kpiSlot(i, innerHTML) {
  const left = 32 + i * (kpiW + 16);
  return `<div style="position:absolute;left:${left.toFixed(1)}px;top:0px;width:${kpiW.toFixed(1)}px;height:104px">${innerHTML}</div>`;
}

const exceptions = [
  { entity:'SO-24891 · Müller AG', severity:'critical', metric:'OTIF',      actual:'0%',  threshold:'≥95%', owner:'CS · DACH',  age:'4d' },
  { entity:'SO-24903 · Volta BV',  severity:'critical', metric:'Lead Time',  actual:'11d', threshold:'≤7d',  owner:'Ops · BNX',  age:'3d' },
  { entity:'SO-24867 · Siemens',   severity:'critical', metric:'Fill Rate',  actual:'62%', threshold:'≥90%', owner:'SCM · DACH', age:'6d' },
  { entity:'SO-24912 · Philips',   severity:'warning',  metric:'OTIF',       actual:'88%', threshold:'≥95%', owner:'CS · BNX',   age:'2d' },
  { entity:'SO-24920 · Bosch',     severity:'warning',  metric:'Fill Rate',  actual:'84%', threshold:'≥90%', owner:'SCM · DACH', age:'1d' },
  { entity:'SO-24934 · Atlas',     severity:'warning',  metric:'Lead Time',  actual:'8d',  threshold:'≤7d',  owner:'Ops · NOR',  age:'1d' },
  { entity:'SO-24941 · Nordex',    severity:'info',     metric:'OTIF',       actual:'93%', threshold:'≥95%', owner:'CS · NOR',   age:'12h'},
];

const inner = `
  ${kpis.map((k, i) => kpiSlot(i, kpiCard(k.label, k.value, k.delta, k.deltaDir, k.period, k.polarity))).join('')}

  ${slotDiv(0, 2.2, 12, 0.8,
    slicerBar([{label:'Window',value:'Last 7d'},{label:'Owner Team',value:'All'},{label:'Severity',value:'≥ Warning'}]),
    'height:32px')}

  ${slotDiv(0, 3.4, 8, 7.6,
    card('Which shipments are currently above the overdue threshold?', exceptionTable(exceptions), true)
  )}

  ${slotDiv(8, 3.4, 4, 3.6,
    card('Are exceptions increasing? Last 30 days.',
      lineChart(
        [{name:'Critical',data:[1,2,1,2,2,2,3],color:T.negative},
         {name:'Warning', data:[5,4,6,5,7,8,11],color:T.warning}],
        ['-30','-25','-20','-15','-10','-5','0'],
        380, 130)))}

  ${slotDiv(8, 7.2, 4, 3.8,
    card('Which owner team has the most open criticals?',
      hBar(
        [{label:'SCM DACH',value:4,color:T.negative},
         {label:'CS DACH', value:3,color:T.negative},
         {label:'Ops BNX', value:2,color:T.warning},
         {label:'CS BNX',  value:2,color:T.warning},
         {label:'Ops NOR', value:1,color:T.warning},
         {label:'CS NOR',  value:1,color:T.neutral}],
        v => v, 380, 130)))}
`;

document.getElementById('root').innerHTML = pageChrome(
  'OPS · OTIF MONITORING · OVERVIEW',
  'T3 · OPERATIONAL MONITORING',
  'Delivery Reliability — Exception Monitor',
  'Where are we outside threshold, and who needs to act now?',
  inner
);
</script>
</body>
</html>
