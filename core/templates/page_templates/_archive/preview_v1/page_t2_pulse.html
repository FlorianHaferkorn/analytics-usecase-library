<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T2 — Tactical Variance</title>
<script src="tokens.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: Inter, 'Segoe UI', system-ui, sans-serif;
  background: #E8E8E8;
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; padding: 24px;
}
</style>
</head>
<body>
<div id="root"></div>

<script>
// T2 — Tactical Variance
// Use case: COM-001 Sales Performance
// Big idea: "Why are we off target, and which levers explain the gap?"

const T = window.T;
const GRID = window.GRID;
const slotPos = window.slotPos;

function style(obj) {
  return Object.entries(obj).map(([k,v]) => {
    const prop = k.replace(/([A-Z])/g, m => '-' + m.toLowerCase());
    return `${prop}:${v}`;
  }).join(';');
}

function kpiCard(label, value, delta, deltaDir, period, polarity) {
  polarity = polarity || 'higher_is_better';
  const favourable =
    (deltaDir === 'up'   && polarity === 'higher_is_better') ||
    (deltaDir === 'down' && polarity === 'lower_is_better');
  const color = delta == null ? T.neutral : (favourable ? T.positive : T.negative);
  const icon  = deltaDir === 'up' ? '▲' : deltaDir === 'down' ? '▼' : '─';
  return `<div style="${style({
    height:'100%', background:T.surfaceCard,
    border:'0.5px solid '+T.border, borderRadius:'4px',
    padding:'10px 12px', display:'flex', flexDirection:'column', gap:'2px',
  })}">
    <div style="font-size:10px;color:${T.textSecondary};font-weight:500">${label}</div>
    <div style="font-size:24px;font-weight:700;line-height:1.05;
      font-family:'JetBrains Mono',ui-monospace,monospace;color:${T.textPrimary}">${value}</div>
    ${delta != null ? `<div style="display:flex;align-items:baseline;gap:4px;font-size:11px;color:${color};font-weight:600">
      <span>${icon}</span><span>${delta}</span>
      <span style="color:${T.textSecondary};font-weight:400;font-size:10px">${period}</span>
    </div>` : ''}
  </div>`;
}

function lineChart(series, xLabels, refLine, w, h) {
  const all = series.flatMap(s => s.data).concat(refLine ? [refLine.value] : []);
  const maxV = Math.max(...all), minV = Math.min(0, Math.min(...all));
  const pad = {l:32, r:10, t:14, b:22};
  const plotW = w - pad.l - pad.r, plotH = h - pad.t - pad.b;
  const n = xLabels ? xLabels.length : series[0].data.length;
  const xOf = i => pad.l + (i / (n - 1)) * plotW;
  const yOf = v => pad.t + plotH - ((v - minV) / (maxV - minV || 1)) * plotH;
  const gridYs = [0, 0.25, 0.5, 0.75, 1].map(f => pad.t + f * plotH);
  let svg = `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" style="width:100%;height:100%;display:block">`;
  gridYs.forEach(y => {
    svg += `<line x1="${pad.l}" x2="${w-pad.r}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${T.border}" stroke-width="0.5" opacity="0.8"/>`;
  });
  if (refLine) {
    const ry = yOf(refLine.value);
    svg += `<line x1="${pad.l}" x2="${w-pad.r}" y1="${ry.toFixed(1)}" y2="${ry.toFixed(1)}" stroke="${T.primary}" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.8"/>`;
    svg += `<text x="${w-pad.r-2}" y="${(ry-3).toFixed(1)}" font-size="8" fill="${T.primary}" text-anchor="end">${refLine.label}</text>`;
  }
  const colors = [T.primary, T.neutral];
  series.forEach((s, si) => {
    const c = s.color || colors[si];
    const pts = s.data.map((v, i) => `${xOf(i).toFixed(1)},${yOf(v).toFixed(1)}`).join(' ');
    svg += `<polyline points="${pts}" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>`;
  });
  if (xLabels) {
    xLabels.forEach((l, i) => {
      if (i % Math.ceil(n / 6) === 0 || i === n - 1) {
        svg += `<text x="${xOf(i).toFixed(1)}" y="${h-4}" font-size="8" fill="${T.textSecondary}" text-anchor="middle">${l}</text>`;
      }
    });
  }
  svg += `<text x="${pad.l-4}" y="${pad.t+4}" font-size="8" fill="${T.textSecondary}" text-anchor="end">${maxV.toLocaleString()}</text>`;
  svg += `<text x="${pad.l-4}" y="${h-pad.b}" font-size="8" fill="${T.textSecondary}" text-anchor="end">${minV.toLocaleString()}</text>`;
  svg += `<g transform="translate(${pad.l},2)">`;
  series.forEach((s, i) => {
    const c = s.color || colors[i];
    svg += `<g transform="translate(${i*80},0)"><line x1="0" y1="4" x2="10" y2="4" stroke="${c}" stroke-width="1.8"/>
      <text x="13" y="7" font-size="8" fill="${T.textSecondary}">${s.name}</text></g>`;
  });
  svg += '</g></svg>';
  return svg;
}

function waterfall(bars, w, h) {
  const pad = {l:24, r:8, t:14, b:32};
  const plotW = w - pad.l - pad.r, plotH = h - pad.t - pad.b;
  let running = 0;
  const computed = bars.map(b => {
    if (b.type === 'start') { running = b.value; return {...b, from:0, to:b.value}; }
    if (b.type === 'end')   { return {...b, from:0, to:b.value}; }
    const from = running; running += b.value;
    return {...b, from, to:running};
  });
  const all = computed.flatMap(b => [b.from, b.to]);
  const maxV = Math.max(...all), minV = Math.min(0, ...all);
  const yOf = v => pad.t + plotH - ((v - minV) / (maxV - minV || 1)) * plotH;
  const bw = plotW / bars.length * 0.7;
  const step = plotW / bars.length;
  let svg = `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" style="width:100%;height:100%;display:block">`;
  svg += `<line x1="${pad.l}" x2="${w-pad.r}" y1="${yOf(0).toFixed(1)}" y2="${yOf(0).toFixed(1)}" stroke="${T.border}" stroke-width="0.5"/>`;
  computed.forEach((b, i) => {
    const bx = pad.l + step * i + (step - bw) / 2;
    const by = yOf(Math.max(b.from, b.to));
    const bh = Math.abs(yOf(b.from) - yOf(b.to));
    const color = b.type === 'start' || b.type === 'end' ? T.primary :
                  b.value > 0 ? T.positive : T.negative;
    svg += `<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${bw.toFixed(1)}" height="${(bh||1).toFixed(1)}" fill="${color}"/>`;
    if (i < computed.length - 1) {
      const connY = yOf(b.to).toFixed(1);
      svg += `<line x1="${(bx+bw).toFixed(1)}" x2="${(bx+step).toFixed(1)}" y1="${connY}" y2="${connY}" stroke="${T.neutral}" stroke-width="0.5" stroke-dasharray="2 2"/>`;
    }
    const labelY = (yOf(Math.max(b.from, b.to)) - 3).toFixed(1);
    const prefix = (b.value > 0 && b.type !== 'start' && b.type !== 'end') ? '+' : '';
    svg += `<text x="${(bx+bw/2).toFixed(1)}" y="${labelY}" font-size="8" fill="${T.textPrimary}" text-anchor="middle" font-weight="600">${prefix}${b.value}</text>`;
    svg += `<text x="${(bx+bw/2).toFixed(1)}" y="${h-18}" font-size="8" fill="${T.textSecondary}" text-anchor="middle">${b.label}</text>`;
  });
  svg += '</svg>';
  return svg;
}

function hBarSigned(rows, valueFmt, w, h) {
  const max = Math.max(...rows.map(r => Math.abs(r.value)));
  const pad = {l:70, r:60, t:8, b:8};
  const plotW = w - pad.l - pad.r;
  const rowH = (h - pad.t - pad.b) / rows.length;
  const barH = Math.min(rowH * 0.6, 12);
  const zeroX = pad.l + plotW / 2;
  let svg = `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" style="width:100%;height:100%;display:block">`;
  svg += `<line x1="${zeroX}" x2="${zeroX}" y1="${pad.t}" y2="${h-pad.b}" stroke="${T.neutral}" stroke-width="0.5"/>`;
  rows.forEach((r, i) => {
    const y = pad.t + i * rowH + (rowH - barH) / 2;
    const bw = (Math.abs(r.value) / max) * (plotW / 2);
    const bx = r.value < 0 ? zeroX - bw : zeroX;
    const color = r.value < 0 ? T.negative : T.positive;
    svg += `<text x="${pad.l-4}" y="${(y+barH*0.78).toFixed(1)}" font-size="9" fill="${T.textPrimary}" text-anchor="end">${r.label}</text>`;
    svg += `<rect x="${bx.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw||1).toFixed(1)}" height="${barH}" fill="${color}" rx="1"/>`;
    const valX = r.value < 0 ? bx - 3 : bx + bw + 3;
    const anchor = r.value < 0 ? 'end' : 'start';
    svg += `<text x="${valX.toFixed(1)}" y="${(y+barH*0.78).toFixed(1)}" font-size="8" fill="${T.textPrimary}" text-anchor="${anchor}" font-family="'JetBrains Mono',monospace">${valueFmt(r.value)}</text>`;
  });
  svg += '</svg>';
  return svg;
}

function card(title, innerHtml) {
  return `<div style="${style({
    width:'100%', height:'100%', background:T.surfaceCard,
    border:'0.5px solid '+T.border, borderRadius:'4px',
    display:'flex', flexDirection:'column', overflow:'hidden',
  })}">
    ${title ? `<div style="padding:8px 10px 4px;font-size:11px;font-weight:600;color:${T.textPrimary};line-height:1.2">${title}</div>` : ''}
    <div style="flex:1;padding:4px 10px 8px;min-height:0;overflow:hidden">${innerHtml}</div>
  </div>`;
}

function slicerBar(slicers) {
  const pills = slicers.map(s => `
    <div style="${style({display:'flex',alignItems:'center',gap:'6px',padding:'3px 9px',
      background:T.surfacePage,border:'0.5px solid '+T.border,borderRadius:'3px',fontSize:'10px'})}">
      <span style="color:${T.textSecondary}">${s.label}</span>
      <span style="font-weight:600">${s.value}</span>
      <svg width="8" height="8" viewBox="0 0 8 8" fill="none">
        <path d="M2 3l2 2 2-2" stroke="${T.textSecondary}" stroke-width="1"/>
      </svg>
    </div>`).join('');
  return `<div style="${style({height:'100%',background:T.surfaceCard,border:'0.5px solid '+T.border,
    borderRadius:'4px',display:'flex',alignItems:'center',gap:'8px',padding:'0 12px'})}">
    <span style="font-size:9px;color:${T.textSecondary};font-weight:600;
      text-transform:uppercase;letter-spacing:0.5px">Filter</span>
    ${pills}
  </div>`;
}

function slotDiv(col, row, cs, rs, innerHTML, extraStyle) {
  const p = slotPos(col, row, cs, rs);
  return `<div style="position:absolute;left:${p.left.toFixed(1)}px;top:${p.top.toFixed(1)}px;
    width:${p.width.toFixed(1)}px;height:${p.height.toFixed(1)}px;${extraStyle||''}">${innerHTML}</div>`;
}

function pageChrome(breadcrumb, pageType, title, decisionQ, innerHtml) {
  return `<div style="${style({
    width:'1280px', height:'720px', background:T.surfacePage,
    position:'relative', fontFamily:"Inter,'Segoe UI',system-ui,sans-serif",
    color:T.textPrimary, overflow:'hidden', boxShadow:'0 4px 24px rgba(0,0,0,0.12)',
  })}">
    <div style="${style({position:'absolute',top:'0',left:'0',right:'0',height:'24px',
      display:'flex',alignItems:'center',justifyContent:'space-between',
      padding:'6px 16px',fontSize:'10px',color:T.textSecondary,
      borderBottom:'1px solid '+T.border,background:T.surfaceCard})}">
      <span style="letter-spacing:0.3px">${breadcrumb}</span>
      <span style="${style({background:T.primary,color:'#fff',padding:'2px 8px',
        borderRadius:'3px',fontSize:'9px',fontWeight:'600',letterSpacing:'0.5px'})}">${pageType}</span>
    </div>
    <div style="${style({position:'absolute',top:'24px',left:'0',right:'0',height:'40px',
      padding:'6px 32px',borderBottom:'1px solid '+T.border,background:T.surfaceCard})}">
      <div style="font-size:13px;font-weight:600;line-height:1.1">${title}</div>
      <div style="font-size:10px;color:${T.textSecondary};margin-top:2px;font-style:italic">${decisionQ}</div>
    </div>
    <div style="position:absolute;top:64px;left:0;right:0;bottom:0">${innerHtml}</div>
  </div>`;
}

const kpis = [
  { label:'Net Sales YTD', value:'€42.3M', delta:'-€4.2M', deltaDir:'down', period:'vs Plan' },
  { label:'Volume',        value:'182K u', delta:'-6.4%',  deltaDir:'down', period:'vs Plan' },
  { label:'ASP',           value:'€232',   delta:'-1.8%',  deltaDir:'down', period:'vs PY' },
  { label:'Promo Depth',   value:'14.2%',  delta:'+2.1pp', deltaDir:'up',   period:'vs Plan', polarity:'lower_is_better' },
];
const kpiW = (1280 - 64 - 3*16) / 4;

function kpiSlot(i, innerHTML) {
  const left = 32 + i * (kpiW + 16);
  return `<div style="position:absolute;left:${left.toFixed(1)}px;top:0px;
    width:${kpiW.toFixed(1)}px;height:104px">${innerHTML}</div>`;
}

const inner = `
  ${kpis.map((k, i) => kpiSlot(i, kpiCard(k.label, k.value, k.delta, k.deltaDir, k.period, k.polarity))).join('')}

  ${slotDiv(0, 2.2, 12, 0.8,
    slicerBar([{label:'Period',value:'YTD 2026'},{label:'Region',value:'DACH · Focus'},{label:'Product',value:'All'}]),
    'height:32px')}

  ${slotDiv(0, 3.4, 4, 5.6,
    card('When did the gap begin? Net Sales vs Plan, 12 mo.',
      lineChart(
        [{name:'Actual',data:[45,45.2,45,44.3,43,42,41.5,41,41.8,42.3,42.5,42.3],color:T.primary}],
        ['M1','M2','M3','M4','M5','M6','M7','M8','M9','M10','M11','M12'],
        {value:45,label:'Plan'}, 380, 180)))}

  ${slotDiv(4, 3.4, 4, 5.6,
    card('Which factors explain the -€4.2M revenue gap vs Plan?',
      waterfall(
        [{label:'Plan',value:46.5,type:'start'},{label:'Volume',value:-3.1},
         {label:'Price',value:-0.8},{label:'Mix',value:-0.5},{label:'FX',value:0.2},
         {label:'Actual',value:42.3,type:'end'}],
        380, 180)))}

  ${slotDiv(8, 3.4, 4, 5.6,
    card('Which regions drive the largest deviation from Plan?',
      hBarSigned(
        [{label:'DACH',value:-3.1},{label:'Nordics',value:-0.9},
         {label:'Benelux',value:-0.5},{label:'Iberia',value:0.3},{label:'UK & I',value:0.6}],
        v => (v>0?'+':'')+'€'+Math.abs(v).toFixed(1)+'M',
        380, 180)))}

  ${slotDiv(0, 9.2, 12, 2.4, `
    <div style="${style({height:'100%',background:T.surfaceCard,
      border:'0.5px solid '+T.border,borderLeft:'2px solid '+T.negative,
      borderRadius:'4px',padding:'10px 14px',display:'flex',alignItems:'center',gap:'14px'})}">
      <div style="font-size:9px;color:${T.negative};font-weight:700;
        letter-spacing:0.5px;text-transform:uppercase;min-width:90px">Tactical Signal</div>
      <div style="flex:1;font-size:11px;line-height:1.4">
        <strong>Volume decline in DACH is the dominant driver (-€3.1M, 74% of gap).</strong>
        <span style="color:${T.textSecondary}"> Price effect secondary (-€0.8M). Promotional depth up 2.1pp — validate pricing levers.</span>
      </div>
      <div style="font-size:9px;color:${T.textSecondary};font-family:monospace">→ T4 RECOMMEND</div>
    </div>
  `)}
`;

document.getElementById('root').innerHTML = pageChrome(
  'COM · SALES PERFORMANCE · OVERVIEW',
  'T2 · TACTICAL VARIANCE',
  'Sales Performance — Variance Analysis',
  'Why are we off target, and which levers explain the gap?',
  inner
);
</script>
</body>
</html>
