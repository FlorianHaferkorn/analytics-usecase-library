# Visual Library entry — multi_tier_column  (schema: _schema.yaml)
# IBCS 2.0 CO 4.2 "Show multi-tier charts" (p. 149-150): tiers for analyses of the SAME basic data
# on one reduplicated category axis. The horizontal (time) form: the primary chart — AC columns with
# PY as the lighter solid reference behind them (UN 3.2, UN 4.1) — at the bottom; the secondary
# chart — absolute variance ΔPY as columns of the same width and scale (UN 4.1) — ABOVE it; the
# tertiary pin chart — relative variance ΔPY% (UN 4.1) — above that (CO 4.2, p. 149-150: "For
# horizontal charts the secondary chart appears above the primary chart").
#
# Same unit, same scale (CO 4.2, UN 4.1): AC, PY and ΔPY share ONE y scale — the ΔPY tier is drawn
# in the same view, lifted above the columns by a computed offset, so a variance of 1 is exactly as
# tall as a column of 1. ΔPY% has its own unit and its own view; both views share the x scale
# (vconcat, resolve x shared). The variances are DERIVED in the spec from AC and PY (a single source
# of truth for the three tiers); ΔPY% is N/A when PY <= 0 (UN 4.1: not interpretable).
id: multi_tier_column
name: Multi-tier column chart (values, ΔPY, ΔPY%)
version: "1.0.0"
status: active        # active | deprecated | experimental
purpose: [time_comparison, deviation_from_target]
zone: [analysis]
min_size: {cols: 6, rows: 6}   # grid units — canvas-relative legibility floor (≈600×320px @1280; px derived from layout_grid.yaml)
best_form_for: null            # line / deviation_bar stay the governed best forms; this is the dense IBCS combination of both
alternatives: [column_time, variance_pin, deviation_bar, waterfall_variance]

encoding:
  x: temporal_discrete              # periods as columns, one reduplicated category axis for every tier
  magnitude: length                 # column height = value (rank 1)
  reference: overlapped_prior       # PY lighter solid behind AC (scenario comparison)
  variance_abs: same_scale_columns  # ΔPY on the value scale, same column width
  variance_rel: pins                # ΔPY% as thin pins with a head
  tiers: [relative_variance, absolute_variance, values]   # top to bottom

anti_patterns:
  - variance_tier_on_its_own_scale     # ΔPY scaled apart from the values exaggerates small variances
  - relative_variance_as_wide_column
  - dual_axis_no_reason                # tiers replace a second value axis
  - color_beyond_semantic

params:
  measure:       {role: value, required: true, note: "the analysed scenario (AC)"}
  prior_measure: {role: reference, required: true, note: "the reference scenario (PY) — ΔPY and ΔPY% are derived from both"}
  date:          {role: axis, type: temporal, required: true, note: "a sortable period key (e.g. 2026-01)"}
  entity:        {role: table, default: _Measures}

data_fit:
  date: {type: temporal, max: 13, on_violation: too_many_categories}

tokens:
  col_ac:   brand.primary             # #0078D4 the analysed columns (house)
  col_py:   surface.row_alt_ink       # #C8CED5 the prior-period reference (house)
  col_pos:  color_semantics.positive  # #107C10
  col_neg:  color_semantics.negative  # #A4262C
  col_zero: color_semantics.neutral   # #586472 tier axes
  col_ink:  ink                       # #0F2430 labels and pin heads

# data column slots of the Vega-Lite track: which column role fills which {{param}} (A-31 R4)
data_slots:
  field:      {role: value, required: true}
  ref_field:  {role: prior, required: true}
  field_date: {role: time,  required: true}

canonical_params:
  entity: "_Measures"
  measure: "Sales"
  prior_measure: "Sales PY"
  category_entity: "dim_date"
  category_prop: "Month"
  field: "sales"
  ref_field: "sales_py"
  field_date: "month"
  col_ac: "#0078D4"
  col_py: "#C8CED5"
  col_pos: "#107C10"
  col_neg: "#A4262C"
  col_zero: "#586472"
  col_ink: "#0F2430"
  tier_width: "480"      # both views share the x scale, so they carry the same width
  h_pins: "70"
  h_values: "230"
  tier_gap: "0.3"        # free space between columns and the ΔPY axis, as a share of the value span (room for labels)
  pin_band: "0.1"        # pin width = 10 % of the column band
  head_size: "36"
  fmt_value: ",.1f"
  fmt_delta: "+,.1f"
  fmt_pct: "+.1~%"

preview_svg: |
