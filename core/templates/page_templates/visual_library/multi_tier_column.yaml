realizations:
  powerbi_native:
    applicable: false
    reason: "keine native Stufenform. Gemessen 30.09.2026 gegen @microsoft/powerbi-core-visual-schema (Pin 0.1.1): `clusteredColumnChart` (Rollen Category, Series, Y, Rows, Tooltips) und `lineClusteredColumnComboChart` (zusaetzlich Y2) zeichnen alle Kennzahlen in EINEN Plotbereich — die Combo mit hoechstens einer zweiten Wertachse (`valueAxis.sec*`), nicht mit einer zweiten Stufe. `smallMultiplesLayout` (Rolle Rows) teilt nach einer Dimension, jede Kachel zeigt dieselben Kennzahlen; eine Stufe je Kennzahl ueber derselben Kategorieachse ist damit nicht einstellbar. Drei gestapelte native Visuals waeren drei Dateien mit je eigener Achse und eigener Skala — genau der Fall, den `variance_tier_on_its_own_scale` ausschliesst"
    use: "deneb_vegalite (eine Spec, geteilte x-Skala, eine y-Skala fuer Werte und ΔPY)"

  powerbi_svg_dax:
    applicable: false
    reason: "a three-tier chart over all periods is a full chart, not a single-cell micro-chart"
    use: "deneb_vegalite; per table row use variance_pin (svg_dax) next to the value"

  deneb_vegalite:
    ext: json
    template: |
      {
        "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
        "data": { "name": "dataset" },
        "transform": [
          { "calculate": "datum['{{field}}'] - datum['{{ref_field}}']", "as": "d_abs" },
          { "calculate": "datum['{{ref_field}}'] > 0 ? (datum['{{field}}'] - datum['{{ref_field}}']) / datum['{{ref_field}}'] : null", "as": "d_rel" },
          { "window": [ { "op": "row_number", "as": "rn" } ] },
          { "joinaggregate": [
            { "op": "max", "field": "{{field}}", "as": "ac_max" }, { "op": "min", "field": "{{field}}", "as": "ac_min" },
            { "op": "max", "field": "{{ref_field}}", "as": "py_max" }, { "op": "min", "field": "{{ref_field}}", "as": "py_min" },
            { "op": "min", "field": "d_abs", "as": "d_min" } ] },
          { "calculate": "max(datum.ac_max, datum.py_max, 0)", "as": "v_top" },
          { "calculate": "datum.v_top + {{tier_gap}} * (datum.v_top - min(datum.ac_min, datum.py_min, 0)) + max(0, -datum.d_min)", "as": "tier_base" },
          { "calculate": "datum.tier_base + datum.d_abs", "as": "tier_end" }
        ],
        "resolve": { "scale": { "x": "shared" } },
        "spacing": 4,
        "vconcat": [
          { "width": {{tier_width}}, "height": {{h_pins}},
            "layer": [
              { "mark": { "type": "bar", "width": { "band": {{pin_band}} } },
                "encoding": {
                  "x": { "field": "{{field_date}}", "type": "ordinal", "timeUnit": "yearmonth", "axis": null },
                  "y": { "field": "d_rel", "type": "quantitative", "axis": null, "scale": { "zero": true, "padding": 16 } },
                  "color": { "condition": { "test": "datum.d_rel < 0", "value": "{{col_neg}}" }, "value": "{{col_pos}}" } } },
              { "mark": { "type": "rule", "color": "{{col_zero}}" }, "encoding": { "y": { "datum": 0 } } },
              { "mark": { "type": "point", "shape": "circle", "filled": true, "color": "{{col_ink}}", "size": {{head_size}}, "opacity": 1 },
                "encoding": { "x": { "field": "{{field_date}}", "type": "ordinal", "timeUnit": "yearmonth" }, "y": { "field": "d_rel", "type": "quantitative" } } },
              { "mark": { "type": "text", "color": "{{col_ink}}", "baseline": { "expr": "datum.d_rel < 0 ? 'top' : 'bottom'" }, "dy": { "expr": "datum.d_rel < 0 ? 6 : -6" } },
                "encoding": { "x": { "field": "{{field_date}}", "type": "ordinal", "timeUnit": "yearmonth" }, "y": { "field": "d_rel", "type": "quantitative" },
                  "text": { "field": "d_rel", "type": "quantitative", "format": "{{fmt_pct}}" } } },
              { "transform": [ { "filter": "datum.rn === 1" } ],
                "mark": { "type": "text", "color": "{{col_ink}}", "align": "right", "baseline": "middle", "dx": -8, "text": "ΔPY%" },
                "encoding": { "x": { "value": 0 }, "y": { "datum": 0 } } }
            ] },
          { "width": {{tier_width}}, "height": {{h_values}},
            "layer": [
              { "mark": { "type": "bar", "color": "{{col_py}}", "xOffset": -4 },
                "encoding": {
                  "x": { "field": "{{field_date}}", "type": "ordinal", "timeUnit": "yearmonth", "axis": { "title": null, "labelAngle": 0, "format": "%m/%y", "labelOverlap": true, "labelSeparation": 6, "domainColor": "{{col_zero}}" } },
                  "y": { "field": "{{ref_field}}", "type": "quantitative", "axis": null, "scale": { "zero": true } } } },
              { "mark": { "type": "bar", "color": "{{col_ac}}", "xOffset": 2 },
                "encoding": { "x": { "field": "{{field_date}}", "type": "ordinal", "timeUnit": "yearmonth" }, "y": { "field": "{{field}}", "type": "quantitative" } } },
              { "mark": { "type": "text", "color": "{{col_ink}}", "baseline": "bottom", "dy": -4, "xOffset": 2 },
                "encoding": { "x": { "field": "{{field_date}}", "type": "ordinal", "timeUnit": "yearmonth" }, "y": { "field": "{{field}}", "type": "quantitative" },
                  "text": { "field": "{{field}}", "type": "quantitative", "format": "{{fmt_value}}" } } },
              { "mark": { "type": "rule", "color": "{{col_zero}}" }, "encoding": { "y": { "field": "tier_base", "aggregate": "max", "type": "quantitative" } } },
              { "mark": { "type": "bar" },
                "encoding": { "x": { "field": "{{field_date}}", "type": "ordinal", "timeUnit": "yearmonth" },
                  "y": { "field": "tier_end", "type": "quantitative" }, "y2": { "field": "tier_base" },
                  "color": { "condition": { "test": "datum.d_abs < 0", "value": "{{col_neg}}" }, "value": "{{col_pos}}" } } },
              { "mark": { "type": "text", "color": "{{col_ink}}", "baseline": { "expr": "datum.d_abs < 0 ? 'top' : 'bottom'" }, "dy": { "expr": "datum.d_abs < 0 ? 4 : -4" } },
                "encoding": { "x": { "field": "{{field_date}}", "type": "ordinal", "timeUnit": "yearmonth" }, "y": { "field": "tier_end", "type": "quantitative" },
                  "text": { "field": "d_abs", "type": "quantitative", "format": "{{fmt_delta}}" } } },
              { "transform": [ { "filter": "datum.rn === 1" } ],
                "mark": { "type": "text", "color": "{{col_ink}}", "align": "right", "baseline": "middle", "dx": -8, "text": "ΔPY" },
                "encoding": { "x": { "value": 0 }, "y": { "field": "tier_base", "type": "quantitative" } } },
              { "transform": [ { "filter": "datum.rn === 1" } ],
                "mark": { "type": "text", "color": "{{col_ink}}", "align": "right", "baseline": "middle", "dx": -8, "text": "AC" },
                "encoding": { "x": { "value": 0 }, "y": { "field": "{{field}}", "type": "quantitative" } } }
            ] }
        ]
      }

  web_recharts:
    applicable: false
    reason: "three tiers on one category axis need three synchronised charts (syncId) inside a wrapper element; the Recharts track holds single-root charts, and the ΔPY tier would lose the shared value scale"
    use: "deneb_vegalite; in React render the Vega-Lite spec (react-vega) instead of three Recharts charts"

# --- notation profile: IBCS (second axis; see _notation_profiles.yaml) ---
profiles:
  ibcs:
    note: "IBCS 2.0 multi-tier chart (CO 4.2, p. 149-150): primary tier AC solid dark with PY lighter solid behind it (UN 3.2, UN 4.1); secondary tier ΔPY above it as columns of the same width and on the same scale, colour by rating good/bad/neutral via polarity, labels outside with '+' (UN 4.1); tertiary tier ΔPY% as thin pins with an AC head, N/A where PY <= 0 (UN 4.1); variance axes solid light for the PY reference (UN 4.1, p. 53/55); columns 2/3 of the category (UN 3.1); no value axes, labels instead (SI 3.1); zero-based (CH 1.1). Not drawn: PL/FC scenarios (hollow PL, hatched FC) — this is the AC-vs-PY form of Figure CO 4.2-1."
    rule_refs:
    - CH 1.1
    - CO 4.2
    - SI 3.1
    - UN 3.1
    - UN 3.2
    - UN 4.1
    param_overrides:
      col_ac: '#404040'
      col_good: '#5B9A35'
      col_bad: '#A4262C'
      col_neutral: '#1F6FB5'
      col_ink: '#201F1E'
      polarity: '1'
      py_opacity: '0.5'
    realizations:
      deneb_vegalite:
        ext: json
        template: |
          {
            "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
            "data": {
              "name": "dataset"
            },
            "transform": [
              {
                "calculate": "datum['{{field}}'] - datum['{{ref_field}}']",
                "as": "d_abs"
              },
              {
                "calculate": "datum['{{ref_field}}'] > 0 ? (datum['{{field}}'] - datum['{{ref_field}}']) / datum['{{ref_field}}'] : null",
                "as": "d_rel"
              },
              {
                "calculate": "datum.d_abs * {{polarity}} > 0 ? 'good' : (datum.d_abs * {{polarity}} < 0 ? 'bad' : 'neutral')",
                "as": "rating"
              },
              {
                "window": [
                  {
                    "op": "row_number",
                    "as": "rn"
                  }
                ]
              },
              {
                "joinaggregate": [
                  {
                    "op": "max",
                    "field": "{{field}}",
                    "as": "ac_max"
                  },
                  {
                    "op": "min",
                    "field": "{{field}}",
                    "as": "ac_min"
                  },
                  {
                    "op": "max",
                    "field": "{{ref_field}}",
                    "as": "py_max"
                  },
                  {
                    "op": "min",
                    "field": "{{ref_field}}",
                    "as": "py_min"
                  },
                  {
                    "op": "min",
                    "field": "d_abs",
                    "as": "d_min"
                  }
                ]
              },
              {
                "calculate": "max(datum.ac_max, datum.py_max, 0)",
                "as": "v_top"
              },
              {
                "calculate": "datum.v_top + {{tier_gap}} * (datum.v_top - min(datum.ac_min, datum.py_min, 0)) + max(0, -datum.d_min)",
                "as": "tier_base"
              },
              {
                "calculate": "datum.tier_base + datum.d_abs",
                "as": "tier_end"
              }
            ],
            "resolve": {
              "scale": {
                "x": "shared"
              }
            },
            "spacing": 4,
            "vconcat": [
              {
                "width": {{tier_width}},
                "height": {{h_pins}},
                "layer": [
                  {
                    "mark": {
                      "type": "bar",
                      "width": {
                        "band": {{pin_band}}
                      }
                    },
                    "encoding": {
                      "x": {
                        "field": "{{field_date}}",
                        "type": "ordinal", "timeUnit": "yearmonth",
                        "axis": null
                      },
                      "y": {
                        "field": "d_rel",
                        "type": "quantitative",
                        "axis": null,
                        "scale": {
                          "zero": true,
                          "padding": 16
                        }
                      },
                      "color": {
                        "field": "rating",
                        "type": "nominal",
                        "legend": null,
                        "scale": {
                          "domain": [
                            "good",
                            "bad",
                            "neutral"
                          ],
                          "range": [
                            "{{col_good}}",
                            "{{col_bad}}",
                            "{{col_neutral}}"
                          ]
                        }
                      }
                    }
                  },
                  {
                    "mark": {
                      "type": "rule",
                      "color": "{{col_ac}}",
                      "opacity": {{py_opacity}},
                      "strokeWidth": 3
                    },
                    "encoding": {
                      "y": {
                        "datum": 0
                      }
                    }
                  },
                  {
                    "mark": {
                      "type": "point",
                      "shape": "square",
                      "filled": true,
                      "color": "{{col_ac}}",
                      "size": {{head_size}},
                      "opacity": 1
                    },
                    "encoding": {
                      "x": {
                        "field": "{{field_date}}",
                        "type": "ordinal", "timeUnit": "yearmonth"
                      },
                      "y": {
                        "field": "d_rel",
                        "type": "quantitative"
                      }
                    }
                  },
                  {
                    "mark": {
                      "type": "text",
                      "color": "{{col_ink}}",
                      "baseline": {
                        "expr": "datum.d_rel < 0 ? 'top' : 'bottom'"
                      },
                      "dy": {
                        "expr": "datum.d_rel < 0 ? 6 : -6"
                      }
                    },
                    "encoding": {
                      "x": {
                        "field": "{{field_date}}",
                        "type": "ordinal", "timeUnit": "yearmonth"
                      },
                      "y": {
                        "field": "d_rel",
                        "type": "quantitative"
                      },
                      "text": {
                        "field": "d_rel",
                        "type": "quantitative",
                        "format": "{{fmt_pct}}"
                      }
                    }
                  },
                  {
                    "transform": [
                      {
                        "filter": "datum.d_rel === null"
                      }
                    ],
                    "mark": {
                      "type": "text",
                      "color": "{{col_ink}}",
                      "baseline": "bottom",
                      "dy": -6,
                      "text": "N/A"
                    },
                    "encoding": {
                      "x": {
                        "field": "{{field_date}}",
                        "type": "ordinal", "timeUnit": "yearmonth"
                      },
                      "y": {
                        "datum": 0
                      }
                    }
                  },
                  {
                    "transform": [
                      {
                        "filter": "datum.rn === 1"
                      }
                    ],
                    "mark": {
                      "type": "text",
                      "color": "{{col_ink}}",
                      "align": "right",
                      "baseline": "middle",
                      "dx": -8,
                      "text": "ΔPY%"
                    },
                    "encoding": {
                      "x": {
                        "value": 0
                      },
                      "y": {
                        "datum": 0
                      }
                    }
                  }
                ]
              },
              {
                "width": {{tier_width}},
                "height": {{h_values}},
                "layer": [
                  {
                    "mark": {
                      "type": "bar",
                      "color": "{{col_ac}}",
                      "opacity": {{py_opacity}},
                      "xOffset": -4
                    },
                    "encoding": {
                      "x": {
                        "field": "{{field_date}}",
                        "type": "ordinal", "timeUnit": "yearmonth",
                        "axis": {
                          "title": null,
                          "labelAngle": 0,
                          "format": "%m/%y",
                          "labelOverlap": true,
                          "labelSeparation": 6,
                          "ticks": false,
                          "domainColor": "{{col_ac}}"
                        }
                      },
                      "y": {
                        "field": "{{ref_field}}",
                        "type": "quantitative",
                        "axis": null,
                        "scale": {
                          "zero": true
                        }
                      }
                    }
                  },
                  {
                    "mark": {
                      "type": "bar",
                      "color": "{{col_ac}}",
                      "xOffset": 2
                    },
                    "encoding": {
                      "x": {
                        "field": "{{field_date}}",
                        "type": "ordinal", "timeUnit": "yearmonth"
                      },
                      "y": {
                        "field": "{{field}}",
                        "type": "quantitative"
                      }
                    }
                  },
                  {
                    "mark": {
                      "type": "text",
                      "color": "{{col_ink}}",
                      "baseline": "bottom",
                      "dy": -4,
                      "xOffset": 2
                    },
                    "encoding": {
                      "x": {
                        "field": "{{field_date}}",
                        "type": "ordinal", "timeUnit": "yearmonth"
                      },
                      "y": {
                        "field": "{{field}}",
                        "type": "quantitative"
                      },
                      "text": {
                        "field": "{{field}}",
                        "type": "quantitative",
                        "format": "{{fmt_value}}"
                      }
                    }
                  },
                  {
                    "mark": {
                      "type": "rule",
                      "color": "{{col_ac}}",
                      "opacity": {{py_opacity}},
                      "strokeWidth": 3
                    },
                    "encoding": {
                      "y": {
                        "field": "tier_base",
                        "aggregate": "max",
                        "type": "quantitative"
                      }
                    }
                  },
                  {
                    "mark": {
                      "type": "bar"
                    },
                    "encoding": {
                      "x": {
                        "field": "{{field_date}}",
                        "type": "ordinal", "timeUnit": "yearmonth"
                      },
                      "y": {
                        "field": "tier_end",
                        "type": "quantitative"
                      },
                      "y2": {
                        "field": "tier_base"
                      },
                      "color": {
                        "field": "rating",
                        "type": "nominal",
                        "legend": null,
                        "scale": {
                          "domain": [
                            "good",
                            "bad",
                            "neutral"
                          ],
                          "range": [
                            "{{col_good}}",
                            "{{col_bad}}",
                            "{{col_neutral}}"
                          ]
                        }
                      }
                    }
                  },
                  {
                    "mark": {
                      "type": "text",
                      "color": "{{col_ink}}",
                      "baseline": {
                        "expr": "datum.d_abs < 0 ? 'top' : 'bottom'"
                      },
                      "dy": {
                        "expr": "datum.d_abs < 0 ? 4 : -4"
                      }
                    },
                    "encoding": {
                      "x": {
                        "field": "{{field_date}}",
                        "type": "ordinal", "timeUnit": "yearmonth"
                      },
                      "y": {
                        "field": "tier_end",
                        "type": "quantitative"
                      },
                      "text": {
                        "field": "d_abs",
                        "type": "quantitative",
                        "format": "{{fmt_delta}}"
                      }
                    }
                  },
                  {
                    "transform": [
                      {
                        "filter": "datum.rn === 1"
                      }
                    ],
                    "mark": {
                      "type": "text",
                      "color": "{{col_ink}}",
                      "align": "right",
                      "baseline": "middle",
                      "dx": -8,
                      "text": "ΔPY"
                    },
                    "encoding": {
                      "x": {
                        "value": 0
                      },
                      "y": {
                        "field": "tier_base",
                        "type": "quantitative"
                      }
                    }
                  },
                  {
                    "transform": [
                      {
                        "filter": "datum.rn === 1"
                      }
                    ],
                    "mark": {
                      "type": "text",
                      "color": "{{col_ink}}",
                      "align": "right",
                      "baseline": "middle",
                      "dx": -8,
                      "text": "AC"
                    },
                    "encoding": {
                      "x": {
                        "value": 0
                      },
                      "y": {
                        "field": "{{field}}",
                        "type": "quantitative"
                      }
                    }
                  },
                  {
                    "transform": [
                      {
                        "filter": "datum.rn === 1"
                      }
                    ],
                    "mark": {
                      "type": "text",
                      "color": "{{col_ink}}",
                      "align": "right",
                      "baseline": "top",
                      "dx": -8,
                      "dy": 4,
                      "text": "PY"
                    },
                    "encoding": {
                      "x": {
                        "value": 0
                      },
                      "y": {
                        "field": "{{ref_field}}",
                        "type": "quantitative"
                      }
                    }
                  }
                ]
              }
            ]
          }

determinism:
  golden_dir: golden
  notes: "Pure {{param}} fill; golden-frozen. One spec, two views: ΔPY% pins (own unit) above the value view, where AC/PY columns and the ΔPY tier share one y scale (the tier is lifted by a computed offset). x shared across views. House form colours by sign on house tokens; the IBCS form rates by polarity and uses AC/PY fill notation."
