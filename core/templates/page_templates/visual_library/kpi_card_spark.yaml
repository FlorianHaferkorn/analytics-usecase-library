# Visual Library entry — kpi_card_spark  (schema: _schema.yaml)
#
# Anatomie einer KPI-Karte — welcher Slot wo lebt (gilt fuer alle drei kpi_card_*).
# Elf Slots stehen in der Vorlage, die diese Bibliothek nachbaut. Neun davon traegt ein
# Werkzeug, zwei ausdruecklich nicht. Gemessen 07.09.2026 gegen
# @microsoft/powerbi-core-visual-schema (Pin 0.1.1):
#
#   Slot            | traegt                        | wie
#   ----------------|-------------------------------|--------------------------------------
#   Title           | Visual-Rahmen (`visualContainer`) | Titel des Visuals, nicht der Karte
#   Subtitle        | Visual-Rahmen                 | Untertitel des Visuals
#   Label           | `cardVisual.label`            | `text`, `position`; im `kpi` kein Slot
#   Period          | Seiten-Slicer                 | eine Pille fuer die ganze Seite
#   Value           | `kpi.indicator` / `cardVisual.value` | Rang 1, groesstes Element
#   Alert signal    | `kpi.status` (goodColor/badColor) | Farbe, NICHT zusaetzlich das Icon
#   Comparison      | `kpi.goals.showDistance`      | Abstand zum Ziel, beschriftet
#   Sparkline       | `kpi.TrendLine`               | Linie; Spalten kann `kpi` nicht
#   Target          | `kpi.Goal` / `cardVisual.referenceLabel*` | Zahl, kein Bullet-Track
#   Call to action  | KEIN Kartenslot               | eigenes Visual (Navigation)
#   Refresh time    | KEIN Kartenslot               | Measure im Seitenrahmen
#
# Die beiden Ausschluesse sind Absicht und keine Luecke. Ein Handlungsaufruf ist ein
# Navigations-Steuerelement; als Karteneigenschaft gebaut, waere er in jeder Karte einmal
# vorhanden und in keiner klickbar an der richtigen Stelle. Und der Aktualisierungs-
# zeitpunkt gilt fuer das Modell, nicht fuer die Kennzahl: sechs Karten auf einer Seite
# wuerden sechsmal dieselbe Uhrzeit zeigen. `kpi.lastDate` kann ihn, wird hier aber nicht
# gesetzt.
id: kpi_card_spark
name: KPI card · value + spark + delta
version: "1.2.0"   # 1.2.0 (22.10.2026): Sparkline 40 px, erster/letzter Punkt (SP2), Lücken als Feld (SP6), Zielband (SP5). 1.1.0 (17.10.2026): Parameter polarity, goal_direction, status_direction; Sparkline #605E5C
status: active        # active | deprecated | experimental
purpose: [value_verdict]
zone: [pulse]
min_size: {cols: 3, rows: 3}   # grid units — canvas-relative legibility floor (≈292×152px @1280, 438×228px @1920; px derived from layout_grid.yaml)
best_form_for: value_verdict
alternatives: [kpi_card_bullet, kpi_card_sparkbar, deviation_bar]
y_basis: "angepasst"    # Gestaltungsregel werteachse_basis (_gestaltungsregeln.yaml)
werteachse: y           # quantitative Achse: x liegend, y stehend, xy, keine (Regel beschriftung_gitter)

encoding:
  value: headline_number            # the number, largest element (rank 1)
  trend: sparkline_line             # trailing context, low ink; first point hollow, last filled (SP2)
  gaps: break                       # SP6
  direction: [color, sign]          # delta vs plan — colour AND arrow/sign

anti_patterns:
  - number_without_context          # a value with no trend/target is not a verdict
  - color_of_number_for_magnitude
  - decorative_sparkline_no_axis_meaning

params:
  measure:       {role: value, required: true}
  delta_measure: {role: variance, required: true}
  date:          {role: axis, type: temporal, required: true}
  entity:        {role: table, default: _Measures}
  # Nur die native Spur braucht ihn, und zwar zwingend: das `kpi`-Visual rechnet den
  # Abstand SELBST aus `Goal`, statt eine fertige Abweichungs-Measure anzuzeigen. Damit
  # ist `delta_measure` dort ueberfluessig und `target` unverzichtbar — dieselbe Karte,
  # zwei Parametrierungen. Die SVG-Spur bleibt bei `delta_measure`.
  # Der Platzhalter heisst `target_measure` wie bei kpi_card_bullet: `params` fuehrt die
  # Rolle, `canonical_params` den Platzhalter, und zwei Schwesterkarten, die denselben
  # Zielwert verschieden benennen, kosten beim naechsten Lesen mehr als sie sparen.
  target:        {role: reference, required: false}

tokens:
  col_ink:   text.primary            # #0F2430 value
  col_pos:   color_semantics.positive# #107C10
  col_neg:   color_semantics.negative# #A4262C
  col_spark: color_semantics.neutral # #605E5C trailing line

canonical_params:
  entity: "_Measures"
  measure: "Net Sales Amount"
  delta_measure: "Net Sales % vs Plan"
  target_measure: "Plan Sales Amount"
  date_entity: "dim_date"
  date_prop: "Date"
  field: "net_sales"
  field_date: "month"
  value_format: "#,0,,.0\"M\""
  delta_format: "+0.0%;-0.0%"
  col_ink: "#0F2430"
  col_pos: "#107C10"
  col_neg: "#A4262C"
  col_spark: "#605E5C"
  col_band: "#ECECEC"
  gaps: "break"                   # break | connect | zero (Gestaltungsregel sparkline_luecken)
  band_low_expr: "BLANK ()"       # Zielband: Measure aus target_corridor mit Freigabe, sonst BLANK (D-795)
  band_high_expr: "BLANK ()"
  polarity: "1"
  goal_direction: "High is good"
  status_direction: "Positive"

preview_svg: |
  <svg viewBox="0 0 240 90" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="KPI card with sparkline">
    <rect width="240" height="90" rx="12" fill="#FFFFFF"/>
    <text x="14" y="24" font-family="Segoe UI,sans-serif" font-size="11" font-weight="600" fill="#586472">NET SALES</text>
    <text x="14" y="52" font-family="Segoe UI,sans-serif" font-size="26" font-weight="700" fill="#0F2430">€12.4M</text>
    <text x="120" y="52" font-family="Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#107C10">▲ +3.2%</text>
    <polyline fill="none" stroke="#94A0AC" stroke-width="2" points="14,80 46,72 78,76 110,64 142,68 174,58 206,62 226,50"/>
  </svg>

realizations:
  # ADR-0021 (07.09.2026). Bis heute stand hier `applicable: false` mit dem Grund, dem
  # modernen `cardVisual` fehle die eingebettete Sparkline. Der Satz ist woertlich richtig
  # und beantwortet die falsche Frage: geprueft wurde EIN Kartentyp, nicht die Plattform.
  #
  # Gemessen 07.09.2026 gegen @microsoft/powerbi-core-visual-schema (Pin 0.1.1):
  #   cardVisual.objects  -> 33 Objekte, KEIN `sparklines`   (der alte Grund, bestaetigt)
  #   kpi.dataRoles       -> Indicator (Wert), TrendLine ("Trend axis"), Goal (Ziel)
  #   kpi.objects         -> trendline, indicator, goals, status, lastDate
  # Das `kpi`-Visual traegt also Wert, Trend, Ziel, Abstand, Icon und Statusfarbe nativ.
  powerbi_native:
    ext: json
    template: |
      {
        "visualType": "kpi",
        "query": { "queryState": {
          "Indicator": { "projections": [ { "field": { "Measure": { "Expression": { "SourceRef": { "Entity": "{{entity}}" } }, "Property": "{{measure}}" } }, "queryRef": "{{entity}}.{{measure}}" } ] },
          "TrendLine": { "projections": [ { "field": { "Column": { "Expression": { "SourceRef": { "Entity": "{{date_entity}}" } }, "Property": "{{date_prop}}" } }, "queryRef": "{{date_entity}}.{{date_prop}}" } ] },
          "Goal": { "projections": [ { "field": { "Measure": { "Expression": { "SourceRef": { "Entity": "{{entity}}" } }, "Property": "{{target_measure}}" } }, "queryRef": "{{entity}}.{{target_measure}}" } ] }
        } },
        "objects": {
          "trendline": [ { "properties": { "show": { "expr": { "Literal": { "Value": "true" } } } } } ],
          "goals": [ { "properties": {
            "showGoal": { "expr": { "Literal": { "Value": "true" } } },
            "showDistance": { "expr": { "Literal": { "Value": "true" } } },
            "distanceLabel": { "expr": { "Literal": { "Value": "'Percent'" } } },
            "direction": { "expr": { "Literal": { "Value": "'{{goal_direction}}'" } } }
          } } ],
          "status": [ { "properties": {
            "direction": { "expr": { "Literal": { "Value": "'{{status_direction}}'" } } },
            "goodColor": { "solid": { "color": { "expr": { "Literal": { "Value": "'{{col_pos}}'" } } } } },
            "badColor": { "solid": { "color": { "expr": { "Literal": { "Value": "'{{col_neg}}'" } } } } }
          } } ],
          "indicator": [ { "properties": {
            "showIcon": { "expr": { "Literal": { "Value": "false" } } },
            "fontColor": { "solid": { "color": { "expr": { "Literal": { "Value": "'{{col_ink}}'" } } } } }
          } } ]
        }
      }
    notes: |
      `Goal` statt `delta_measure`: das Visual rechnet den Abstand selbst und beschriftet ihn
      ueber `goals.distanceLabel`. Eine fertige Abweichungs-Measure hineinzureichen hiesse,
      dieselbe Zahl zweimal zu fuehren — und die zweite waere die, die niemand prueft.

      `goals.direction: 'High is good'` und `status.direction: 'Positive'` sind fuer den
      kanonischen Fall (Net Sales) richtig und muessen bei einer Kennzahl kippen, bei der
      klein gut ist (DSO, Ausschuss). Beide Werte stehen im Katalog als Aufzaehlung, sind
      also pruefbar falsch statt still falsch.

      `indicator.showIcon: false` ist Absicht. Der Katalog traegt das Icon, und es waere das
      Alarmzeichen aus der Anatomie — aber ein Icon neben der Zahl konkurriert mit der
      Statusfarbe um dieselbe Aussage. Wer beides setzt, sagt zweimal dasselbe und einmal
      davon falsch, sobald die Schwellen auseinanderlaufen.

      Was `kpi` NICHT kann und was diese Karte deshalb nicht nativ ausdrueckt: Titel und
      Untertitel als eigene Slots (`kpi.objects` fuehrt nur `general`), die Periodenpille und
      den Handlungsaufruf. Titel traegt der Visual-Rahmen, die Periode ein Slicer, der
      Handlungsaufruf ein eigenes Visual — siehe die Anatomie-Notiz unten.

  powerbi_svg_dax:
    ext: dax
    template: |
      VAR _val = FORMAT ( [{{measure}}], "{{value_format}}" )
      VAR _dlt = [{{delta_measure}}]
      VAR _col = IF ( _dlt * {{polarity}} < 0, "{{col_neg}}", "{{col_pos}}" )
      VAR _dtxt = IF ( _dlt < 0, "▼ ", "▲ " ) & FORMAT ( _dlt, "{{delta_format}}" )
      VAR _P = CALCULATETABLE ( VALUES ( '{{date_entity}}'[{{date_prop}}] ), DATESINPERIOD ( '{{date_entity}}'[{{date_prop}}], MAX ( '{{date_entity}}'[{{date_prop}}] ), -12, MONTH ) )
      VAR _S = ADDCOLUMNS ( _P, "@v", IF ( "{{gaps}}" = "zero", [{{measure}}] + 0, [{{measure}}] ) )
      VAR _geteilt = TRUE ()
      VAR _bl = {{band_low_expr}}
      VAR _bh = {{band_high_expr}}
      VAR _band = _geteilt && NOT ISBLANK ( _bl ) && NOT ISBLANK ( _bh )
      VAR _lo0 = MINX ( _S, [@v] )
      VAR _hi0 = MAXX ( _S, [@v] )
      VAR _min = IF ( _band, MIN ( _lo0, _bl ), _lo0 )
      VAR _max = IF ( _band, MAX ( _hi0, _bh ), _hi0 )
      VAR _xmin = MINX ( _S, '{{date_entity}}'[{{date_prop}}] )
      VAR _xmax = MAXX ( _S, '{{date_entity}}'[{{date_prop}}] )
      VAR _N = ADDCOLUMNS ( FILTER ( _S, NOT ISBLANK ( [@v] ) ),
          "@x", INT ( 12 + 214 * DIVIDE ( '{{date_entity}}'[{{date_prop}}] - _xmin, _xmax - _xmin ) ),
          "@y", INT ( 96 - 40 * DIVIDE ( [@v] - _min, _max - _min ) ),
          "@luecke", '{{date_entity}}'[{{date_prop}}] > MINX ( _S, '{{date_entity}}'[{{date_prop}}] ) && ISBLANK ( MAXX ( TOPN ( 1, FILTER ( _S, '{{date_entity}}'[{{date_prop}}] < EARLIER ( '{{date_entity}}'[{{date_prop}}] ) ), '{{date_entity}}'[{{date_prop}}], DESC ), [@v] ) ) )
      VAR _erst = MINX ( _N, '{{date_entity}}'[{{date_prop}}] )
      VAR _letzt = MAXX ( _N, '{{date_entity}}'[{{date_prop}}] )
      VAR _d = CONCATENATEX ( _N, IF ( '{{date_entity}}'[{{date_prop}}] = _erst || ( [@luecke] && "{{gaps}}" = "break" ), " M", " L" ) & [@x] & "," & [@y], "", '{{date_entity}}'[{{date_prop}}] )
      VAR _marken = "<circle cx='" & MAXX ( FILTER ( _N, '{{date_entity}}'[{{date_prop}}] = _erst ), [@x] ) & "' cy='" & MAXX ( FILTER ( _N, '{{date_entity}}'[{{date_prop}}] = _erst ), [@y] ) & "' r='2' fill='#FFFFFF' stroke='{{col_spark}}' stroke-width='1'/>"
          & "<circle cx='" & MAXX ( FILTER ( _N, '{{date_entity}}'[{{date_prop}}] = _letzt ), [@x] ) & "' cy='" & MAXX ( FILTER ( _N, '{{date_entity}}'[{{date_prop}}] = _letzt ), [@y] ) & "' r='2.5' fill='{{col_spark}}'/>"
      VAR _bandsvg = IF ( _band, "<rect x='12' y='" & INT ( 96 - 40 * DIVIDE ( _bh - _min, _max - _min ) ) & "' width='214' height='" & INT ( 40 * DIVIDE ( _bh - _bl, _max - _min ) ) & "' fill='{{col_band}}'/>", "" )
      RETURN
          "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 240 100'>"
            & "<text x='12' y='34' font-family='Segoe UI,sans-serif' font-size='26' font-weight='700' fill='{{col_ink}}'>" & _val & "</text>"
            & "<text x='12' y='52' font-family='Segoe UI,sans-serif' font-size='12' font-weight='600' fill='" & _col & "'>" & _dtxt & "</text>"
            & _bandsvg
            & "<path fill='none' stroke='{{col_spark}}' stroke-width='2' d='" & _d & "'/>"
            & _marken
            & "</svg>"
    notes: |
      Sparkline 40 px hoch unter Wert und Abweichung (Regel sparkline_groesse, SP4: Karte mindestens 40 px), erster
      Punkt hohl, letzter in der Linienfarbe (SP2), Lücken nach `gaps` (SP6), Zielband nur aus freigegebenem Korridor
      (band_low_expr/band_high_expr, Standard BLANK (); Regel zielband, D-795).

  deneb_vegalite:
    applicable: false
    reason: "a KPI card composite (headline value + trailing spark + delta chip) is a card LAYOUT, not one Vega-Lite view; Deneb draws the spark, the value/delta are card chrome"
    use: "powerbi_svg_dax for the whole card; or `line` in Deneb for just the spark inside a card"

  web_recharts:
    applicable: false
    reason: "a KPI card is HTML (the value + delta) with a chart inside — a React component, not a single Recharts chart"
    use: "compose in React: value/delta as HTML + a small Recharts `line` sparkline"

determinism:
  golden_dir: golden
  notes: "Composite KPI tile: headline value (rank 1) + trailing sparkline (context) + signed, coloured delta vs plan. One SVG via cardVisual imageFX; the other tracks address partial forms."
