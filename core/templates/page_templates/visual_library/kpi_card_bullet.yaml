# Visual Library entry — kpi_card_bullet  (schema: _schema.yaml)
id: kpi_card_bullet
name: KPI card · value + bullet
purpose: [value_verdict]
zone: [pulse]
min_size: {w: 220, h: 90}   # minimum legible render size (px) — below this, labels/marks fall under the legibility floor
best_form_for: null
alternatives: [kpi_card_spark, kpi_card_sparkbar, bullet]

encoding:
  value: headline_number            # the number (rank 1)
  attainment: bullet_bar_vs_tick    # actual bar vs target tick — is it on target?
  direction: [color, sign]          # delta vs target — colour AND sign

anti_patterns:
  - gauge_instead                   # bullet is the governed gauge replacement (Few)
  - number_without_context
  - color_of_number_for_magnitude

params:
  measure:        {role: value, required: true}
  target:         {role: reference, required: true}
  delta_measure:  {role: variance, required: true}
  entity:         {role: table, default: _Measures}

tokens:
  col_ink:    text.primary            # #0F2430 value
  col_actual: text.primary            # #0F2430 bar
  col_target: color_semantics.negative# #A4262C tick
  col_pos:    color_semantics.positive# #107C10
  col_neg:    color_semantics.negative# #A4262C
  col_track:  surface.row_alt         # #EFF2F5

canonical_params:
  entity: "_Measures"
  measure: "SLA Attainment %"
  target_measure: "SLA Target %"
  delta_measure: "SLA % vs Target"
  field: "sla"
  value_format: "0.0%"
  delta_format: "+0.0 \"pp\";-0.0 \"pp\""
  col_ink: "#0F2430"
  col_actual: "#0F2430"
  col_target: "#A4262C"
  col_pos: "#107C10"
  col_neg: "#A4262C"
  col_track: "#EFF2F5"

preview_svg: |
  <svg viewBox="0 0 240 90" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="KPI card with bullet">
    <rect width="240" height="90" rx="12" fill="#FFFFFF"/>
    <text x="14" y="24" font-family="Segoe UI,sans-serif" font-size="11" font-weight="600" fill="#586472">SLA ATTAINMENT</text>
    <text x="14" y="52" font-family="Segoe UI,sans-serif" font-size="26" font-weight="700" fill="#0F2430">92.4%</text>
    <text x="130" y="52" font-family="Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#A4262C">▼ -2.6 pp</text>
    <rect x="14" y="70" width="212" height="10" rx="5" fill="#EFF2F5"/>
    <rect x="14" y="70" width="196" height="10" rx="5" fill="#0F2430"/>
    <line x1="215" y1="66" x2="215" y2="84" stroke="#A4262C" stroke-width="2.5"/>
  </svg>

realizations:
  powerbi_native:
    applicable: false
    reason: "no native bullet, and the cardVisual has no embedded bullet track — the value+bullet+delta composite is a single SVG"
    use: "powerbi_svg_dax (cardVisual callout.imageFX)"

  powerbi_svg_dax:
    ext: dax
    template: |
      VAR _val = FORMAT ( [{{measure}}], "{{value_format}}" )
      VAR _a = [{{measure}}] * 212
      VAR _t = [{{target_measure}}] * 212
      VAR _dlt = [{{delta_measure}}]
      VAR _col = IF ( _dlt < 0, "{{col_neg}}", "{{col_pos}}" )
      VAR _dtxt = IF ( _dlt < 0, "▼ ", "▲ " ) & FORMAT ( _dlt, "{{delta_format}}" )
      RETURN
          "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 240 90'>"
            & "<text x='12' y='34' font-family='Segoe UI,sans-serif' font-size='26' font-weight='700' fill='{{col_ink}}'>" & _val & "</text>"
            & "<text x='12' y='52' font-family='Segoe UI,sans-serif' font-size='12' font-weight='600' fill='" & _col & "'>" & _dtxt & "</text>"
            & "<rect x='12' y='68' width='212' height='10' rx='5' fill='{{col_track}}'/>"
            & "<rect x='12' y='68' width='" & _a & "' height='10' rx='5' fill='{{col_actual}}'/>"
            & "<line x1='" & ( 12 + _t ) & "' y1='64' x2='" & ( 12 + _t ) & "' y2='82' stroke='{{col_target}}' stroke-width='2.5'/>"
            & "</svg>"

  deneb_vegalite:
    applicable: false
    reason: "the value + delta chip are card chrome; Deneb draws the bullet only, not the headline layout"
    use: "powerbi_svg_dax for the whole card; or `bullet` in Deneb for just the attainment track"

  web_recharts:
    applicable: false
    reason: "a KPI card is HTML (value + delta) with a chart inside — a React component, not a single Recharts chart"
    use: "compose in React: value/delta as HTML + a Recharts `bullet`"

determinism:
  golden_dir: golden
  notes: "Composite KPI tile: headline value + a bullet (actual bar vs target tick) + signed, coloured delta vs target. One SVG via cardVisual imageFX."
