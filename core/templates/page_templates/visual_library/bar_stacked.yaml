# Visual Library entry — bar_stacked  (schema: _schema.yaml)
id: bar_stacked
name: Stacked bar (absolute)
purpose: [part_to_whole]
zone: [analysis]
min_size: {cols: 4, rows: 4}   # grid units — canvas-relative legibility floor; px derived from layout_grid.yaml
best_form_for: null
alternatives: [stacked_100, bar_absolute, donut]

encoding:
  magnitude: length                 # bar total = the absolute value (rank 1)
  composition: stacked_segments     # segments = the parts (<=4 series)
  color: categorical_series         # one hue per series (governed data colours)

anti_patterns:
  - too_many_series                 # >4 stacked segments are unreadable
  - stack_when_comparing_parts      # to compare parts across groups, use small_multiples
  - normalize_when_totals_matter    # if totals matter keep absolute (stacked_100 hides them)

params:
  category: {role: axis, type: category, required: true}
  series:   {role: series, type: category, required: true}
  measure:  {role: value, required: true}
  entity:   {role: table, default: _Measures}

tokens:
  col_1: brand.data_colors.0         # #0078D4
  col_2: brand.data_colors.4         # #008575
  col_3: brand.data_colors.6         # #EF6950

canonical_params:
  entity: "_Measures"
  category_entity: "dim_region"
  category_prop: "Region"
  series_entity: "dim_product"
  series_prop: "Category"
  measure: "Net Sales Amount"
  field_cat: "region"
  field: "sales"
  field_series: "part"
  col_1: "#0078D4"
  col_2: "#008575"
  col_3: "#EF6950"

preview_svg: |
  <svg viewBox="0 0 340 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Absolute stacked bar">
    <rect width="340" height="150" rx="12" fill="#FFFFFF"/>
    <text x="20" y="24" font-family="Segoe UI,sans-serif" font-size="11" font-weight="600" fill="#586472">NET SALES BY REGION</text>
    <g>
      <rect x="40"  y="60" width="46" height="70" fill="#0078D4"/><rect x="40"  y="42" width="46" height="18" fill="#008575"/><rect x="40"  y="34" width="46" height="8"  fill="#EF6950"/>
      <rect x="110" y="76" width="46" height="54" fill="#0078D4"/><rect x="110" y="58" width="46" height="18" fill="#008575"/><rect x="110" y="50" width="46" height="8"  fill="#EF6950"/>
      <rect x="180" y="88" width="46" height="42" fill="#0078D4"/><rect x="180" y="72" width="46" height="16" fill="#008575"/><rect x="180" y="64" width="46" height="8"  fill="#EF6950"/>
      <rect x="250" y="70" width="46" height="60" fill="#0078D4"/><rect x="250" y="54" width="46" height="16" fill="#008575"/><rect x="250" y="46" width="46" height="8"  fill="#EF6950"/>
    </g>
    <text x="52"  y="142" font-family="Segoe UI,sans-serif" font-size="9" fill="#586472">DACH</text><text x="126" y="142" font-family="Segoe UI,sans-serif" font-size="9" fill="#586472">BeNe</text><text x="196" y="142" font-family="Segoe UI,sans-serif" font-size="9" fill="#586472">Nord</text><text x="266" y="142" font-family="Segoe UI,sans-serif" font-size="9" fill="#586472">CEE</text>
  </svg>

realizations:
  powerbi_native:
    ext: json
    template: |
      {
        "visualType": "stackedColumnChart",
        "query": { "queryState": {
          "Category": { "projections": [ { "field": { "Column": { "Expression": { "SourceRef": { "Entity": "{{category_entity}}" } }, "Property": "{{category_prop}}" } }, "queryRef": "{{category_entity}}.{{category_prop}}" } ] },
          "Series": { "projections": [ { "field": { "Column": { "Expression": { "SourceRef": { "Entity": "{{series_entity}}" } }, "Property": "{{series_prop}}" } }, "queryRef": "{{series_entity}}.{{series_prop}}" } ] },
          "Y": { "projections": [ { "field": { "Measure": { "Expression": { "SourceRef": { "Entity": "{{entity}}" } }, "Property": "{{measure}}" } }, "queryRef": "{{entity}}.{{measure}}" } ] }
        } }
      }

  powerbi_svg_dax:
    applicable: false
    reason: "multi-series absolute stacking is not a single-cell micro-chart"
    use: "powerbi_native (stackedColumnChart) or Deneb"

  deneb_vegalite:
    ext: json
    template: |
      {
        "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
        "data": { "name": "dataset" },
        "mark": { "type": "bar" },
        "encoding": {
          "x": { "field": "{{field_cat}}", "type": "nominal", "axis": { "title": null } },
          "y": { "field": "{{field}}", "type": "quantitative", "stack": "zero", "axis": { "title": null } },
          "color": { "field": "{{field_series}}", "type": "nominal", "scale": { "range": ["{{col_1}}", "{{col_2}}", "{{col_3}}"] }, "legend": { "title": null } }
        }
      }

  web_recharts:
    ext: jsx
    template: |
      <BarChart data={data} width={480} height={300}>
        <XAxis dataKey="{{field_cat}}" />
        <YAxis />
        <Bar dataKey="series1" stackId="a" fill="{{col_1}}" />
        <Bar dataKey="series2" stackId="a" fill="{{col_2}}" />
        <Bar dataKey="series3" stackId="a" fill="{{col_3}}" />
      </BarChart>

determinism:
  golden_dir: golden
  notes: "Absolute stacked column: total = magnitude (kept, unlike stacked_100), segments = the parts (<=4). Multi-series stacking -> native/Deneb/Recharts, not a cell."
