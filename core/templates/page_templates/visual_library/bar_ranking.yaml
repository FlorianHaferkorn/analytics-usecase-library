# Visual Library entry — bar_ranking  (schema: _schema.yaml)
id: bar_ranking
name: Bar ranking
purpose: [compare_categories]
zone: [analysis]
best_form_for: compare_categories
alternatives: [lollipop, bar_absolute, deviation_bar]

encoding:
  magnitude: length                 # rank 3 — direct length comparison
  order: worst_first                # sorted; BC-CHART-10 Top-N
  reference: target_line
  color: semantic_below_target

anti_patterns:
  - unsorted_bars
  - pie_for_comparison
  - broken_baseline_on_absolute_bar
  - color_to_separate_equal_categories

params:
  category: {role: axis, type: category, required: true}
  measure:  {role: value, required: true}
  target:   {role: reference, optional: true}
  entity:   {role: table, default: _Measures}
  top_n:    {role: limit, default: 20}

tokens:
  col_above: ink                     # #0F2430 at/above target
  col_below: color_semantics.negative# #A4262C below target
  col_ref:   color_semantics.neutral # #94A0AC target reference

canonical_params:
  entity: "_Measures"
  measure: "Gross Margin %"
  category_entity: "dim_org"
  category_prop: "OrgName"
  field: "gm"
  field_cat: "unit"
  target_val: "44.1"
  col_above: "#0F2430"
  col_below: "#A4262C"
  col_ref: "#94A0AC"

realizations:
  powerbi_native:
    ext: json
    template: |
      {
        "visualType": "clusteredBarChart",
        "query": { "queryState": {
          "Category": { "projections": [ { "field": { "Column": { "Expression": { "SourceRef": { "Entity": "{{category_entity}}" } }, "Property": "{{category_prop}}" } }, "queryRef": "{{category_entity}}.{{category_prop}}" } ] },
          "Y": { "projections": [ { "field": { "Measure": { "Expression": { "SourceRef": { "Entity": "{{entity}}" } }, "Property": "{{measure}}" } }, "queryRef": "{{entity}}.{{measure}}" } ] },
          "sortDefinition": { "sort": [ { "field": { "Measure": { "Expression": { "SourceRef": { "Entity": "{{entity}}" } }, "Property": "{{measure}}" } }, "direction": "Ascending" } ], "isDefaultSort": true }
        } },
        "objects": {
          "valueAxis": [ { "properties": { "start": { "expr": { "Literal": { "Value": "0D" } } } } } ],
          "labels": [ { "properties": { "show": { "expr": { "Literal": { "Value": "true" } } } } } ]
        }
      }

  powerbi_svg_dax:
    ext: dax
    template: |
      VAR _v = [{{measure}}]
      VAR _max = CALCULATE ( MAXX ( ALLSELECTED ( '{{category_entity}}'[{{category_prop}}] ), [{{measure}}] ), REMOVEFILTERS ( '{{category_entity}}'[{{category_prop}}] ) )
      VAR _w = DIVIDE ( _v, _max ) * 100
      VAR _col = IF ( _v < {{target_val}} / 100, "{{col_below}}", "{{col_above}}" )
      RETURN
          IF ( HASONEVALUE ( '{{category_entity}}'[{{category_prop}}] ),
              "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 14' preserveAspectRatio='none'>"
                & "<rect x='0' y='2' width='" & _w & "' height='10' fill='" & _col & "'/>"
                & "</svg>" )

  deneb_vegalite:
    ext: json
    template: |
      {
        "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
        "data": { "name": "dataset" },
        "layer": [
          { "mark": { "type": "bar" },
            "encoding": {
              "y": { "field": "{{field_cat}}", "type": "nominal", "sort": "x", "axis": { "title": null } },
              "x": { "field": "{{field}}", "type": "quantitative", "axis": { "title": null } },
              "color": { "condition": { "test": "datum['{{field}}'] < {{target_val}}", "value": "{{col_below}}" }, "value": "{{col_above}}" } } },
          { "mark": { "type": "rule", "color": "{{col_ref}}", "strokeDash": [4, 3] }, "encoding": { "x": { "datum": {{target_val}} } } }
        ]
      }

  web_recharts:
    ext: jsx
    template: |
      <BarChart layout="vertical" data={[...data].sort((a, b) => a.{{field}} - b.{{field}})} width={640} height={320}>
        <XAxis type="number" />
        <YAxis type="category" dataKey="{{field_cat}}" width={90} />
        <ReferenceLine x={{{target_val}}} stroke="{{col_ref}}" strokeDasharray="4 3" />
        <Bar dataKey="{{field}}">
          {data.map((e, i) => (
            <Cell key={i} fill={e.{{field}} < {{target_val}} ? "{{col_below}}" : "{{col_above}}"} />
          ))}
        </Bar>
      </BarChart>

determinism:
  golden_dir: golden
  notes: "Worst-first via ascending sort; semantic colour below target. Same {{param}} fill; golden-frozen."
