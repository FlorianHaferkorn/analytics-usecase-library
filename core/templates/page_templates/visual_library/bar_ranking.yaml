# Visual Library entry — bar_ranking  (schema: _schema.yaml)
id: bar_ranking
name: Bar ranking
version: "1.4.0"   # 1.4.0 (22.10.2026): Höchstbreite 24 px (B2), Kategorielabel über dem Balken als Variante (B6), Vorjahr überlappend hinter dem Ist (B7), Null als Strich und „0“, fehlend als „–“ (B9). 1.3.0 (17.10.2026): Beschriftung an: Wertegitter und Werteachse aus (W2); Referenz #605E5C
status: active        # active | deprecated | experimental
purpose: [compare_categories]
zone: [analysis]
min_size: {cols: 4, rows: 4}   # grid units — canvas-relative legibility floor (≈395×208px @1280, 592×312px @1920; px derived from layout_grid.yaml)
best_form_for: compare_categories
alternatives: [lollipop, bar_absolute, deviation_bar]
y_basis: "null"         # Gestaltungsregel werteachse_basis (_gestaltungsregeln.yaml)
werteachse: x           # quantitative Achse: x liegend, y stehend, xy, keine (Regel beschriftung_gitter)

encoding:
  magnitude: length                 # rank 3 — direct length comparison
  order: worst_first                # sorted; BC-CHART-10 Top-N
  reference: target_line
  color: semantic_below_target
  thickness: capped                 # at most bar_max_px thick, the gap grows instead (B2, Gestaltungsregel hoechstbreite)
  prior: overlapped_behind          # PY wider and lighter behind a narrower AC bar (B7, Gestaltungsregel vorjahr_ueberlappend)
  zero_vs_missing: distinct         # 0 = 2 px tick + "0", missing = no bar + "–" (B9, Gestaltungsregel null_fehlend)
  category_label: [axis, above]     # "above": label in its own line over a thin bar (B6, Gestaltungsregel label_oben)

anti_patterns:
  - unsorted_bars
  - pie_for_comparison
  - broken_baseline_on_absolute_bar
  - color_to_separate_equal_categories
  - mixed_polarity_on_one_axis        # R6.3: ein Richtungssinn je Achse

params:
  category: {role: axis, type: category, required: true}
  measure:  {role: value, required: true}
  target:   {role: reference, optional: true}
  entity:   {role: table, default: _Measures}
  top_n:    {role: limit, default: 20}

tokens:
  col_above: ink                     # #0F2430 at/above target
  col_below: color_semantics.negative# #A4262C below target
  col_ref:   color_semantics.neutral # #605E5C target reference
  col_context: marks.context         # #8C8C8C rest row (not rated), 3:1 on white; "–" of a missing value
  col_py:      surface.row_alt_ink    # #C8CED5 PY bar behind AC (scenario area, Regel markenkontrast Ausnahme)

# data column slots of the Vega-Lite track: which column role fills which {{param}} (A-31 R4)
data_values: [target_val]   # a target, not a style: from params or removed (A-31 R6)
data_slots:
  field: {role: value, required: true}
  field_cat: {role: category, required: true}
  py_field: {role: prior, required: false}

canonical_params:
  col_label: "#201F1E"            # data label ink (text, 4.5:1); A-31 R6
  entity: "_Measures"
  measure: "Gross Margin %"
  category_entity: "dim_org"
  category_prop: "OrgName"
  field: "gm"
  field_cat: "unit"
  target_val: "44.1"
  polarity: "1"                    # -1 = lower is better: below target turns good (A-31 R7)
  worst_first: "ascending"        # derived from polarity by render_target unless given
  col_above: "#0F2430"
  col_below: "#A4262C"
  col_ref: "#605E5C"
  col_context: "#8C8C8C"
  col_py: "#C8CED5"               # house PY behind AC (B7); the value of PY is not labelled, AC is
  py_field: "gm_py"
  bar_max_px: "24"                # Gestaltungsregel hoechstbreite (B2)
  label_position: "axis"          # "above": category label over a thin bar (B6, Gestaltungsregel label_oben)
  label_above_px: "8"             # bar thickness under an "above" label (B6)
  label_missing: "–"              # missing value (B9, Gestaltungsregel null_fehlend)

preview_svg: |
  <svg viewBox="0 0 340 168" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bar ranking">
    <rect width="340" height="168" rx="12" fill="#FFFFFF"/>
    <text x="18" y="24" font-family="Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#586472">GM vs TARGET — WORST FIRST</text>
    <line x1="200" y1="38" x2="200" y2="160" stroke="#586472" stroke-width="1.3"/>
    <text x="16" y="56" font-family="Segoe UI,sans-serif" font-size="11" fill="#18202A">Nord</text><rect x="96" y="47" width="104" height="12" rx="2" fill="#A4262C"/>
    <text x="16" y="80" font-family="Segoe UI,sans-serif" font-size="11" fill="#18202A">Ost</text><rect x="119" y="71" width="81" height="12" rx="2" fill="#A4262C"/>
    <text x="16" y="104" font-family="Segoe UI,sans-serif" font-size="11" fill="#18202A">Sued</text><rect x="148" y="95" width="52" height="12" rx="2" fill="#A4262C"/>
    <text x="16" y="128" font-family="Segoe UI,sans-serif" font-size="11" fill="#18202A">West</text><rect x="169" y="119" width="31" height="12" rx="2" fill="#A4262C"/>
    <text x="16" y="152" font-family="Segoe UI,sans-serif" font-size="11" fill="#18202A">Nordics</text><rect x="200" y="143" width="38" height="12" rx="2" fill="#107C10"/>
  </svg>

realizations:
  powerbi_native:
    ext: json
    template: |
      {
        "visualType": "clusteredBarChart",
        "query": { "queryState": {
          "Category": { "projections": [ { "field": { "Column": { "Expression": { "SourceRef": { "Entity": "{{category_entity}}" } }, "Property": "{{category_prop}}" } }, "queryRef": "{{category_entity}}.{{category_prop}}" } ] },
          "Y": { "projections": [ { "field": { "Measure": { "Expression": { "SourceRef": { "Entity": "{{entity}}" } }, "Property": "{{measure}}" } }, "queryRef": "{{entity}}.{{measure}}" } ] }
        },
        "sortDefinition": { "sort": [ { "field": { "Measure": { "Expression": { "SourceRef": { "Entity": "{{entity}}" } }, "Property": "{{measure}}" } }, "direction": "Ascending" } ], "isDefaultSort": true } },
        "objects": {
          "valueAxis": [ { "properties": {
            "start": { "expr": { "Literal": { "Value": "0D" } } },
            "show": { "expr": { "Literal": { "Value": "false" } } },
            "gridlineShow": { "expr": { "Literal": { "Value": "false" } } }
          } } ],
          "labels": [ { "properties": { "show": { "expr": { "Literal": { "Value": "true" } } } } } ]
        }
      }

  powerbi_svg_dax:
    ext: dax
    template: |
      VAR _v = [{{measure}}]
      VAR _max = CALCULATE ( MAXX ( ALLSELECTED ( '{{category_entity}}'[{{category_prop}}] ), [{{measure}}] ), REMOVEFILTERS ( '{{category_entity}}'[{{category_prop}}] ) )
      VAR _w = DIVIDE ( _v, _max ) * 100
      VAR _col = IF ( _v < {{target_val}} / 100, "{{col_below}}", "{{col_above}}" )
      RETURN
          IF ( HASONEVALUE ( '{{category_entity}}'[{{category_prop}}] ),
              "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 14' preserveAspectRatio='none'>"
                & "<rect x='0' y='2' width='" & _w & "' height='10' fill='" & _col & "'/>"
                & "</svg>" )

  deneb_vegalite:
    ext: json
    template: |
      {
        "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
        "padding": { "right": 40 },
        "data": { "name": "dataset" },
        "params": [ { "name": "_n_daten", "expr": "max(length(data('dataset')), length(data('source_0')))" }, { "name": "_beschriftet", "expr": "_n_daten > 0 && _n_daten < 10" },
                    { "name": "_oben", "expr": "'{{label_position}}' == 'above'" },
                    { "name": "_dicke", "expr": "_oben ? {{label_above_px}} : min(bandwidth('y'), {{bar_max_px}})" } ],
        "transform": [
          { "calculate": "datum['{{field}}'] === 0 ? 0 : null", "as": "_nullstrich" },
          { "calculate": "isValid(datum['{{field}}']) || datum._rest === true ? null : 0", "as": "_fehlt" },
          { "calculate": "_oben ? 0 : null", "as": "_oben_x" }
        ],
        "encoding": {
          "y": { "field": "{{field_cat}}", "type": "nominal", "sort": { "field": "{{field}}", "order": "{{worst_first}}" }, "axis": { "title": null, "labelOpacity": { "expr": "_oben ? 0 : 1" } } }
        },
        "layer": [
          { "mark": { "type": "bar", "color": "{{col_py}}", "description": "Vorjahr" },
            "encoding": { "x": { "field": "{{py_field}}", "type": "quantitative" }, "size": { "value": { "expr": "_dicke" } } } },
          { "mark": { "type": "bar" },
            "encoding": {
              "x": { "field": "{{field}}", "type": "quantitative", "axis": { "title": null, "tickCount": { "expr": "_beschriftet ? 0 : ceil(width/40)" }, "domainOpacity": { "expr": "_beschriftet ? 0 : 1" } } },
              "size": { "condition": { "test": "isValid(datum['{{py_field}}'])", "value": { "expr": "_dicke * 0.6" } }, "value": { "expr": "_dicke" } },
              "color": { "condition": { "test": "(datum['{{field}}'] - {{target_val}}) * {{polarity}} < 0", "value": "{{col_below}}" }, "value": "{{col_above}}" } } },
          { "mark": { "type": "tick", "orient": "vertical", "thickness": 2, "color": "{{col_above}}", "description": "Null" },
            "encoding": { "x": { "field": "_nullstrich", "type": "quantitative" }, "size": { "value": { "expr": "_dicke" } } } },
          { "mark": { "type": "rule", "color": "{{col_ref}}", "strokeDash": [4, 3] }, "encoding": { "x": { "datum": {{target_val}} } } },
          { "mark": { "type": "text", "align": "left", "dx": 4, "color": "{{col_label}}" },
            "encoding": {
              "x": { "field": "{{field}}", "type": "quantitative" },
              "text": { "field": "{{field}}", "type": "quantitative", "format": ",.1~f" },
              "opacity": { "condition": { "test": "_beschriftet", "value": 1 }, "value": 0 } } },
          { "mark": { "type": "text", "text": "{{label_missing}}", "align": "left", "dx": 4, "color": "{{col_context}}", "description": "fehlender Wert" },
            "encoding": { "x": { "field": "_fehlt", "type": "quantitative" } } },
          { "mark": { "type": "text", "align": "left", "baseline": "bottom", "dy": { "expr": "-_dicke / 2 - 2" }, "color": "{{col_label}}", "description": "Kategorielabel oben" },
            "encoding": { "x": { "field": "_oben_x", "type": "quantitative" }, "text": { "field": "{{field_cat}}", "type": "nominal" } } }
        ]
      }

  web_recharts:
    ext: jsx
    template: |
      <BarChart layout="vertical" data={[...data].sort((a, b) => a.{{field}} - b.{{field}})} width={640} height={320}>
        <XAxis type="number" />
        <YAxis type="category" dataKey="{{field_cat}}" width={90} />
        <ReferenceLine x={{{target_val}}} stroke="{{col_ref}}" strokeDasharray="4 3" />
        <Bar dataKey="{{field}}">
          {data.map((e, i) => (
            <Cell key={i} fill={e.{{field}} < {{target_val}} ? "{{col_below}}" : "{{col_above}}"} />
          ))}
        </Bar>
      </BarChart>

# --- notation profile: IBCS (structural override — the overlapped comparison bar) ---
# House ranks AC against a target LINE. IBCS reads AC against PY at a glance by
# overlaying a narrow solid AC bar on a wider lighter PY reference bar (scenario
# discipline from color_semantics.ibcs_scenario: AC solid, PY tint). STRUCTURAL —
# adds a PY series and replaces the templates (vs the token overlay of deviation_bar@ibcs).
profiles:
  ibcs:
    note: 'IBCS 2.0: overlapped bars, PY lighter solid behind AC dark solid (UN 3.2, UN 4.1); bar width from the band (UN 3.1); labels instead of value axis (SI 3.1).'
    rule_refs:
    - SI 3.1
    - UN 3.1
    - UN 3.2
    - UN 4.1
    param_overrides:
      py_field: gm_py
      col_ac: '#404040'
      col_py: '#C8CED5'
      col_good: '#5B9A35'
      col_bad: '#A4262C'
      col_neutral: '#1F6FB5'
      col_ink: '#201F1E'
      polarity: '1'
    realizations:
      powerbi_native:
        applicable: false
        reason: native clusteredBar cannot overlay a narrower AC bar on a wider PY reference bar
        use: PowerofBI.IBCS overlapped-bar UDF (daxlib.org) or Inforiver
      powerbi_svg_dax:
        applicable: false
        reason: overlapped AC/PY bars across all categories is a full chart, not a single-cell micro-chart
        use: deneb_vegalite, or PowerofBI.IBCS
      deneb_vegalite:
        ext: json
        template: |
          {
            "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
            "padding": { "right": 40 },
            "data": {
              "name": "dataset"
            },
            "transform": [
              { "calculate": "max(datum['{{field}}'], isValid(datum['{{py_field}}']) ? datum['{{py_field}}'] : datum['{{field}}'])", "as": "_lx" }
            ],
            "encoding": {
              "y": {
                "field": "{{field_cat}}",
                "type": "nominal",
                "sort": { "field": "{{field}}", "order": "descending" },
                "axis": {
                  "title": null,
                  "ticks": false,
                  "domainColor": "{{col_ac}}"
                }
              }
            },
            "layer": [
              {
                "mark": {
                  "type": "bar",
                  "color": "{{col_ac}}",
                  "opacity": 0.5,
                  "yOffset": -4
                },
                "encoding": {
                  "x": {
                    "field": "{{py_field}}",
                    "type": "quantitative",
                    "axis": null,
                    "scale": {
                      "zero": true
                    }
                  }
                }
              },
              {
                "mark": {
                  "type": "bar",
                  "color": "{{col_ac}}",
                  "yOffset": 2
                },
                "encoding": {
                  "x": {
                    "field": "{{field}}",
                    "type": "quantitative"
                  }
                }
              },
              {
                "mark": {
                  "type": "text",
                  "color": "{{col_ink}}",
                  "align": "left",
                  "dx": 4,
                  "yOffset": 2
                },
                "encoding": {
                  "x": {
                    "field": "_lx",
                    "type": "quantitative"
                  },
                  "text": {
                    "field": "{{field}}",
                    "type": "quantitative",
                    "format": ",.1~f"
                  }
                }
              }
            ]
          }
      web_recharts:
        ext: jsx
        template: |
          <BarChart layout="vertical" data={[...data].sort((a, b) => b.{{field}} - a.{{field}})} width={640} height={320}>
            <XAxis type="number" />
            <YAxis type="category" dataKey="{{field_cat}}" width={90} />
            <Bar dataKey="{{py_field}}" fill="{{col_py}}" barSize={16} />
            <Bar dataKey="{{field}}" fill="{{col_ac}}" barSize={9} />
          </BarChart>

  print_safe:
    note: "CVAA / print-safe: the colour-blind-safe blue/orange variance pair replaces red/green so direction survives colour-vision-deficiency and greyscale print (always pair with an icon or sign)."
    param_overrides:
      col_below: "#F7630C"

determinism:
  golden_dir: golden
  notes: "Worst-first via ascending sort; semantic colour below target. IBCS profile overlays solid AC on a lighter PY (Vega true-overlaps via layer+size; Recharts groups AC/PY). Same {{param}} fill; golden-frozen."
