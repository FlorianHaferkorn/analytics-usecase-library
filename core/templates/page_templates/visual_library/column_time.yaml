# Visual Library entry — column_time  (schema: _schema.yaml)
id: column_time
name: Column chart over time
version: "1.3.0"   # 1.3.0 (22.10.2026): laufende Periode als Umriss, letzte vollständige in ink, frühere grau (S2); Einheit über der Werteachse (S3); Höchstbreite 24 px (B2). 1.2.0 (17.10.2026): Beschriftung gegen Gitter (W2); Säulen in ink
status: active        # active | deprecated | experimental
purpose: [time_comparison]
zone: [analysis]
min_size: {cols: 4, rows: 4}   # grid units — canvas-relative legibility floor; px derived from layout_grid.yaml
best_form_for: null
alternatives: [line, indexed_line, kpi_card_sparkbar]
y_basis: "null"         # Gestaltungsregel werteachse_basis (_gestaltungsregeln.yaml)
werteachse: y           # quantitative Achse: x liegend, y stehend, xy, keine (Regel beschriftung_gitter)

encoding:
  x: temporal_discrete              # discrete periods (months) -> columns, not a line
  magnitude: length                 # column height = the value (rank 1)
  endpoint: emphasized              # latest COMPLETE period in ink, earlier periods grey (S2, Gestaltungsregel laufende_periode)
  current_period: outline           # the running, incomplete period as an outline with the label "laufend" (S2)
  unit: above_value_axis            # unit from the KPI catalog above the value axis, no axis title (S3, Gestaltungsregel einheit)

anti_patterns:
  - line_for_few_discrete_periods   # a handful of discrete periods reads better as columns
  - column_for_many_continuous_points  # 30+ points -> a line, not columns

params:
  measure: {role: value, required: true}
  date:    {role: axis, type: temporal, required: true}
  entity:  {role: table, default: _Measures}

tokens:
  col_bar: ink                      # #0F2430 last complete period and the outline of the running one
  col_context: marks.context        # #8C8C8C earlier periods (3:1 on white; Regel markenkontrast)
  col_axis: color_semantics.neutral # #605E5C unit text (text on white 6.46:1)

# data column slots of the Vega-Lite track: which column role fills which {{param}} (A-31 R4)
data_values: [unit_label]        # the unit comes from the KPI catalog (Golden Thread): from params or the layer is removed
data_slots:
  field: {role: value, required: true}
  field_date: {role: time, required: true}
  current_field: {role: current, required: false}   # true on the running, incomplete period (Snapshot trend.laufend)

canonical_params:
  col_label: "#201F1E"            # data label ink (text, 4.5:1); A-31 R6
  entity: "_Measures"
  measure: "Orders Count"
  category_entity: "dim_date"
  category_prop: "Month"
  field: "count"
  field_date: "month"
  col_bar: "#0F2430"
  col_context: "#8C8C8C"
  col_axis: "#605E5C"
  current_field: "laufend"
  label_current: "laufend"        # label of the running period (caller passes "running" in English)
  unit_label: "Stk."              # sample unit; real units come from the KPI catalog (data_values)
  bar_max_px: "24"                # Höchstbreite einer Säule (Gestaltungsregel hoechstbreite, B2)

preview_svg: |
  <svg viewBox="0 0 340 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Column chart over time">
    <rect width="340" height="150" rx="12" fill="#FFFFFF"/>
    <text x="20" y="24" font-family="Segoe UI,sans-serif" font-size="11" font-weight="600" fill="#586472">ORDERS BY MONTH</text>
    <g fill="#0078D4">
      <rect x="34"  y="96"  width="26" height="34"/><rect x="70"  y="84" width="26" height="46"/><rect x="106" y="90" width="26" height="40"/>
      <rect x="142" y="72"  width="26" height="58"/><rect x="178" y="80" width="26" height="50"/><rect x="214" y="64" width="26" height="66"/>
      <rect x="250" y="70"  width="26" height="60"/><rect x="286" y="52" width="26" height="78"/>
    </g>
    <line x1="28" y1="130" x2="320" y2="130" stroke="#E1E7EE"/>
  </svg>

realizations:
  powerbi_native:
    ext: json
    template: |
      {
        "visualType": "clusteredColumnChart",
        "query": { "queryState": {
          "Category": { "projections": [ { "field": { "Column": { "Expression": { "SourceRef": { "Entity": "{{category_entity}}" } }, "Property": "{{category_prop}}" } }, "queryRef": "{{category_entity}}.{{category_prop}}" } ] },
          "Y": { "projections": [ { "field": { "Measure": { "Expression": { "SourceRef": { "Entity": "{{entity}}" } }, "Property": "{{measure}}" } }, "queryRef": "{{entity}}.{{measure}}" } ] }
        } }
      }

  powerbi_svg_dax:
    applicable: false
    reason: "a full column-over-time chart is not a single-cell micro-chart"
    use: "kpi_card_sparkbar for the in-card column trend; powerbi_native / Deneb for the full chart"

  deneb_vegalite:
    ext: json
    template: |
      {
        "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
        "data": { "name": "dataset" },
        "params": [ { "name": "_n_daten", "expr": "max(length(data('dataset')), length(data('source_0')))" }, { "name": "_beschriftet", "expr": "_n_daten > 0 && _n_daten < 10" } ],
        "transform": [
          { "calculate": "datum['{{current_field}}'] === true", "as": "_laufend" },
          { "window": [ { "op": "row_number", "as": "_rang" } ], "sort": [ { "field": "_laufend", "order": "ascending" }, { "field": "{{field_date}}", "order": "descending" } ] },
          { "calculate": "!datum._laufend && datum._rang == 1", "as": "_letzte" }
        ],
        "encoding": {
          "x": { "field": "{{field_date}}", "type": "ordinal", "axis": { "title": null, "labelAngle": 0 } },
          "y": { "field": "{{field}}", "type": "quantitative", "axis": { "title": null, "tickCount": { "expr": "_beschriftet ? 0 : ceil(height/40)" }, "domainOpacity": { "expr": "_beschriftet ? 0 : 1" } } }
        },
        "layer": [
          { "transform": [ { "filter": "!datum._laufend && !datum._letzte" } ],
            "mark": { "type": "bar", "width": { "expr": "min(bandwidth('x'), {{bar_max_px}})" }, "fill": "{{col_context}}" } },
          { "transform": [ { "filter": "datum._letzte" } ],
            "mark": { "type": "bar", "width": { "expr": "min(bandwidth('x'), {{bar_max_px}})" }, "fill": "{{col_bar}}" } },
          { "transform": [ { "filter": { "field": "{{current_field}}", "equal": true } } ],
            "mark": { "type": "bar", "width": { "expr": "min(bandwidth('x'), {{bar_max_px}})" }, "fill": "#FFFFFF", "stroke": "{{col_bar}}", "strokeWidth": 1.5, "description": "laufende Periode" } },
          { "mark": { "type": "text", "baseline": "bottom", "dy": -4, "color": "{{col_label}}" },
            "encoding": { "text": { "field": "{{field}}", "type": "quantitative", "format": ",.1~f" }, "opacity": { "condition": { "test": "_beschriftet", "value": 1 }, "value": 0 } } },
          { "transform": [ { "filter": { "field": "{{current_field}}", "equal": true } } ],
            "mark": { "type": "text", "text": "{{label_current}}", "baseline": "top", "dy": 4, "color": "{{col_axis}}" },
            "encoding": { "y": { "value": { "expr": "height" } } } },
          { "transform": [ { "window": [ { "op": "row_number", "as": "_e" } ] }, { "filter": "datum._e == 1" } ],
            "mark": { "type": "text", "text": "{{unit_label}}", "align": "left", "baseline": "bottom", "dy": -6, "color": "{{col_axis}}", "description": "Einheit" },
            "encoding": { "x": { "value": 0 }, "y": { "value": 0 } } }
        ]
      }

  web_recharts:
    ext: jsx
    template: |
      <BarChart data={data} width={480} height={280}>
        <XAxis dataKey="{{field_date}}" />
        <YAxis />
        <Bar dataKey="{{field}}" fill="{{col_bar}}" />
      </BarChart>

determinism:
  golden_dir: golden
  notes: "Discrete periods over time as columns (the 'bar for time series' case) — distinct from `line` (continuous trend) and `bar_ranking` (compare categories)."

profiles:
  ibcs:
    note: 'IBCS 2.0: AC dark solid columns, width 2/3 of the category via the profile config (UN 3.1), labels instead of value axis (SI 3.1), axis from zero (CH 1.1).'
    rule_refs:
    - CH 1.1
    - SI 3.1
    - UN 3.1
    param_overrides:
      col_bar: '#0F2430'
      col_label: '#201F1E'
      col_ac: '#404040'
      col_good: '#5B9A35'
      col_bad: '#A4262C'
      col_neutral: '#1F6FB5'
      col_ink: '#201F1E'
      polarity: '1'
    realizations:
      powerbi_native:
        ext: json
        template: |
          {
            "visualType": "clusteredColumnChart",
            "query": { "queryState": {
              "Category": { "projections": [ { "field": { "Column": { "Expression": { "SourceRef": { "Entity": "{{category_entity}}" } }, "Property": "{{category_prop}}" } }, "queryRef": "{{category_entity}}.{{category_prop}}" } ] },
              "Y": { "projections": [ { "field": { "Measure": { "Expression": { "SourceRef": { "Entity": "{{entity}}" } }, "Property": "{{measure}}" } }, "queryRef": "{{entity}}.{{measure}}" } ] }
            } },
            "objects": {
              "labels": [ { "properties": { "show": { "expr": { "Literal": { "Value": "true" } } } } } ],
              "valueAxis": [ { "properties": {
                "show": { "expr": { "Literal": { "Value": "false" } } },
                "gridlineShow": { "expr": { "Literal": { "Value": "false" } } }
              } } ]
            }
          }
      deneb_vegalite:
        ext: json
        template: |
          {
            "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
            "data": {
              "name": "dataset"
            },
            "encoding": {
              "x": {
                "field": "{{field_date}}",
                "type": "ordinal",
                "axis": {
                  "title": null,
                  "labelAngle": 0,
                  "ticks": false,
                  "domainColor": "{{col_ac}}"
                }
              }
            },
            "layer": [
              {
                "mark": {
                  "type": "bar",
                  "color": "{{col_ac}}"
                },
                "encoding": {
                  "y": {
                    "field": "{{field}}",
                    "type": "quantitative",
                    "axis": null,
                    "scale": {
                      "zero": true
                    }
                  }
                }
              },
              {
                "mark": {
                  "type": "text",
                  "dy": -6,
                  "color": "{{col_ink}}"
                },
                "encoding": {
                  "y": {
                    "field": "{{field}}",
                    "type": "quantitative"
                  },
                  "text": {
                    "field": "{{field}}",
                    "type": "quantitative",
                    "format": ".0f"
                  }
                }
              }
            ]
          }
      web_recharts:
        ext: jsx
        template: |
          <BarChart data={data} width={480} height={280}>
            <XAxis dataKey="{{field_date}}" />
            <YAxis />
            <Bar dataKey="{{field}}" fill="{{col_bar}}">
              <LabelList dataKey="{{field}}" position="top" />
            </Bar>
          </BarChart>
