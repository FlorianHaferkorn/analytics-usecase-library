# Visual Library entry — deviation_bar  (schema: _schema.yaml)
id: deviation_bar
name: Deviation bar
version: "1.0.0"
status: active        # active | deprecated | experimental
purpose: [deviation_from_target, compare_categories]
zone: [pulse, analysis]
min_size: {cols: 3, rows: 2}   # grid units — canvas-relative legibility floor (≈292×96px @1280, 438×144px @1920; px derived from layout_grid.yaml)
best_form_for: deviation_from_target
alternatives: [bullet]   # the IBCS reading (retired id `ibcs_overlapped`) is now `deviation_bar` under profile: ibcs

encoding:
  magnitude: length_position        # Cleveland-McGill rank 1-3
  direction: [color, sign]          # never colour alone
  reference: zero_is_target         # the plan/target is the zero line
  highlight: size_only

anti_patterns:
  - color_of_number_for_magnitude   # rank 9-10 — the tinted pill
  - decorative_tint
  - gauge

params:
  measure:   {role: value_delta, required: true, note: "a variance/Δ-vs-plan measure"}
  entity:    {role: table, default: _Measures}
  direction: {enum: [higher_is_better, lower_is_better], default: higher_is_better}

tokens:
  col_pos:   color_semantics.positive     # #107C10
  col_neg:   color_semantics.negative     # #A4262C
  col_zero:  color_semantics.neutral      # #586472 (axis)
  col_track: surface.row_alt              # #EFF2F5

# frozen sample that fills the templates for the golden test (same in -> same out)
canonical_params:
  entity: "_Measures"
  measure: "Gross Margin % vs Plan"
  field: "gm_vs_plan"
  col_neg: "#A4262C"
  col_pos: "#107C10"
  col_zero: "#586472"
  col_track: "#EFF2F5"
  viewbox: "0 0 340 60"
  zero_x: "170"
  half_track: "146"

preview_svg: |
  <svg viewBox="0 0 340 84" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Deviation bar">
    <rect width="340" height="84" rx="12" fill="#FFFFFF"/>
    <text x="20" y="26" font-family="Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#586472">GROSS MARGIN % vs PLAN</text>
    <rect x="24" y="44" width="292" height="12" rx="6" fill="#EFF2F5"/>
    <rect x="117" y="44" width="53" height="12" rx="3" fill="#A4262C"/>
    <line x1="170" y1="39" x2="170" y2="61" stroke="#586472" stroke-width="1.5"/>
    <text x="112" y="40" text-anchor="end" font-family="Segoe UI,sans-serif" font-size="10" font-weight="600" fill="#A4262C">-1.8 pp</text>
    <text x="24" y="76" font-family="Segoe UI,sans-serif" font-size="9" fill="#AEB6BF">-5 pp</text>
    <text x="316" y="76" text-anchor="end" font-family="Segoe UI,sans-serif" font-size="9" fill="#AEB6BF">+5 pp</text>
  </svg>

realizations:
  powerbi_native:
    ext: json
    template: |
      {
        "visualType": "clusteredBarChart",
        "query": { "queryState": { "Y": { "projections": [
          { "field": { "Measure": { "Expression": { "SourceRef": { "Entity": "{{entity}}" } }, "Property": "{{measure}}" } }, "queryRef": "{{entity}}.{{measure}}", "nativeQueryRef": "{{measure}}" }
        ] } } },
        "objects": {
          "valueAxis": [ { "properties": { "start": { "expr": { "Literal": { "Value": "0D" } } } } } ],
          "dataPoint": [ { "properties": { "fill": { "solid": { "color": { "expr": { "FillRule": {
            "Input": { "Measure": { "Expression": { "SourceRef": { "Entity": "{{entity}}" } }, "Property": "{{measure}}" } },
            "FillRule": { "linearGradient2": { "min": { "color": { "Literal": { "Value": "'{{col_neg}}'" } } }, "max": { "color": { "Literal": { "Value": "'{{col_pos}}'" } } } } }
          } } } } } }, "selector": { "metadata": "{{entity}}.{{measure}}" } } ]
        }
      }

  powerbi_svg_dax:
    ext: dax
    template: |
      VAR _dlt = [{{measure}}]
      VAR _col = IF ( _dlt < 0, "{{col_neg}}", "{{col_pos}}" )
      VAR _len = MIN ( ABS ( _dlt ) / 0.05 * {{half_track}}, {{half_track}} )
      VAR _x   = IF ( _dlt < 0, {{zero_x}} - _len, {{zero_x}} )
      RETURN
          "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='{{viewbox}}'>"
            & "<rect x='24' y='24' width='292' height='12' rx='6' fill='{{col_track}}'/>"
            & "<rect x='" & _x & "' y='24' width='" & _len & "' height='12' rx='3' fill='" & _col & "'/>"
            & "<line x1='{{zero_x}}' y1='19' x2='{{zero_x}}' y2='41' stroke='{{col_zero}}' stroke-width='1.5'/>"
            & "</svg>"

  deneb_vegalite:
    ext: json
    template: |
      {
        "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
        "data": { "name": "dataset" },
        "layer": [
          { "mark": { "type": "bar", "height": 12, "cornerRadius": 3 },
            "encoding": {
              "x": { "field": "{{field}}", "type": "quantitative", "axis": { "title": null }, "scale": { "domainMid": 0 } },
              "color": { "condition": { "test": "datum['{{field}}'] < 0", "value": "{{col_neg}}" }, "value": "{{col_pos}}" } } },
          { "mark": { "type": "rule", "color": "{{col_zero}}" }, "encoding": { "x": { "datum": 0 } } }
        ]
      }

  web_recharts:
    ext: jsx
    template: |
      <BarChart layout="vertical" data={data} width={340} height={60}>
        <XAxis type="number" hide domain={['dataMin', 'dataMax']} />
        <ReferenceLine x={0} stroke="{{col_zero}}" />
        <Bar dataKey="{{field}}" radius={3}>
          {data.map((e, i) => (
            <Cell key={i} fill={e.{{field}} < 0 ? "{{col_neg}}" : "{{col_pos}}"} />
          ))}
        </Bar>
      </BarChart>

# --- notation profile: IBCS (second axis; see _notation_profiles.yaml) ---
# The IBCS reading of a variance bar makes the plan/target reference PROMINENT (ink),
# not the muted house neutral — Hichert: the reference must read as the anchor. This
# is a pure token overlay, so the SVG-DAX / Vega-Lite / Recharts base templates render
# it directly. The native bar has no stroked reference to re-emphasise; its IBCS form
# is the fully overlapped AC-on-PY ± column, a structural override deferred to the next
# slice — so it is marked n/a here (use the PowerofBI.IBCS UDF meanwhile).
profiles:
  ibcs:
    note: "IBCS: prominent ink reference (plan/target) instead of the muted house zero line; sign + length carry good/bad."
    param_overrides:
      col_zero: "#201F1E"          # text.primary ink — the prominent IBCS reference
    realizations:
      powerbi_native:
        applicable: false
        reason: "native clusteredBar has no stroked reference line to emphasise; the IBCS form is the overlapped AC-on-PY ± column (structural), not a token swap."
        use: "PowerofBI.IBCS overlapped-bar UDF (daxlib.org), or deviation_bar@ibcs in deneb_vegalite"

  print_safe:
    note: "CVAA / print-safe: the colour-blind-safe blue/orange variance pair replaces red/green so direction survives colour-vision-deficiency and greyscale print (always pair with an icon or sign)."
    param_overrides:
      col_pos: "#0078D4"
      col_neg: "#F7630C"

determinism:
  golden_dir: golden
  notes: "render.py fills {{params}} from canonical_params (+ profile param_overrides); golden/*.* is frozen; the test asserts byte-for-byte + validity. Same input+profile -> same output."
