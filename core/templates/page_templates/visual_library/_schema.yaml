# Visual Library — entry schema (Single Source of Truth)
# ------------------------------------------------------------------
# Every idiom file (<id>.yaml) MUST have exactly these keys, in this order.
# The library is machine-first: the generator and AI agents read it directly;
# the human Artifact + spec Part D are RENDERED from it (never hand-diverged).
#
# Determinism contract: each realization is a pure template of {{params}}.
# Placeholders are filled ONLY from canonical_params (frozen sample) or, at
# generation time, from the semantic model measure names + governed tokens.
# `tooling/visual_library/render.py` fills them; golden/ freezes the output;
# test_visual_library.py asserts byte-for-byte equality — so the same request
# yields the same result every time (the byte-for-byte principle from the
# scaffold generator, extended to every idiom x tool).

schema_version: 1

# --- required keys per idiom entry (identical structure for every visual) ---
required_keys:
  - id                 # stable snake_case id (== filename)
  - name               # human name
  - purpose            # list of analytical-question ids it answers (see index.yaml)
  - zone               # 3-30-300 placement: subset of [pulse, analysis, detail]
  - min_size           # {cols, rows} grid units — the canvas-relative legibility floor (px derived from tokens/layout_grid.yaml); below this, labels/marks are unreadable
  - best_form_for      # the purpose id for which THIS is the governed best form (or null)
  - alternatives       # other idiom ids serving the same purpose(s)
  - encoding           # governed rationale: {magnitude, direction, reference, ...}
  - anti_patterns      # list of anti-pattern ids (why NOT / instead-of)
  - params             # the data/encoding inputs (role, type, default, required)
  - tokens             # token bindings (values resolved from color_semantics/typography)
  - canonical_params   # frozen sample values that fill the templates for the golden test
  - realizations       # {tool: {ext, template}} — concrete, runnable code per tool
  - determinism        # {golden_dir, notes}

# --- lifecycle metadata (version + status) — REQUIRED per idiom ---
# Every idiom carries a semantic `version` (major.minor.patch) and a `status`, so a change to an
# idiom's realizations/encoding is a deliberate, trackable event and a consumer can tell whether a
# previously generated report used an idiom that has since been revised or retired.
#   version: "1.0.0"      # bump: patch = golden re-freeze / fix; minor = additive param/profile;
#                         #        major = encoding change that alters the reading
#   status:  active       # one of:
#     active        — governed and recommended
#     experimental  — usable but not yet stable (encoding may change)
#     deprecated    — kept for provenance; DO NOT emit for new work — requires `superseded_by: <id>`
#   superseded_by: <idiom_id>   # OPTIONAL; REQUIRED when status == deprecated (the replacement idiom)
# Enforced by tooling/visual_library/tests/test_versioning.py.

# --- the four governed tool tracks (every entry provides all four) ---
tools:
  - powerbi_native     # visual.json (PBIR) — the native visual where it is the best form
  - powerbi_svg_dax    # reportExtensions.json ImageUrl measure (SVG via DAX)
  - deneb_vegalite     # Vega-Lite spec (Deneb-embedded == standalone)
  - web_recharts       # React/Recharts (also the D3 fallback note)

# --- notation profiles (the second axis) — OPTIONAL per idiom ---
# An idiom answers a QUESTION (purpose); a notation profile is the CONVENTION it is
# drawn in (see _notation_profiles.yaml). `house_default` is the governed baseline
# and is ALWAYS the `realizations` block above — no idiom restates it. An idiom may
# OPT IN to another profile (e.g. `ibcs`) by adding an OPTIONAL top-level key:
#
#   profiles:
#     ibcs:
#       note: "why this idiom's IBCS reading differs"
#       param_overrides: { col_zero: "#201F1E" }        # merged over canonical_params
#       realizations:                                    # OPTIONAL per-tool override
#         powerbi_native: { applicable: false, reason: "...", use: "..." }
#         deneb_vegalite: { ext: json, template: "..." } # a structural override
#
# Resolution (render.py): for a non-default profile, params = canonical_params +
# param_overrides; a tool uses its profile `realizations` override if present, else
# falls back to the base template (pure token/param overlay). Every declared profile
# id MUST exist in _notation_profiles.yaml. Goldens for a non-default profile are
# named `<id>.<tool>.<profile>.<ext>`; house_default keeps `<id>.<tool>.<ext>`.
# `profiles` is NOT a required key — an idiom with none exists only in house_default.

# --- placeholder syntax ---
# {{name}} is replaced literally by str(canonical_params[name]). No logic in
# templates — determinism requires pure substitution. Colours are hex from the
# governed tokens; never invented.
#
# --- data_fit (OPTIONAL per idiom) — the machine-checkable data contract ---
# `anti_patterns` names WHY an idiom can be wrong; `data_fit` says WHEN, against the
# actually-bound data. It is a per-param map of hard bounds the resolver checks at
# generation/audit time (resolve.py fit <idiom> <param>=<n>[:type] ...):
#
#   data_fit:
#     category: {type: category, min: 2, max: 4, on_violation: pie_or_donut_gt_4}
#     value:    {min: 1, max: 1}
#
# Keys are param NAMES (must exist in `params`). Sub-keys are all optional:
#   type          required data type (category|quantitative|temporal|date)
#   min / max     cardinality bounds — distinct-value count for a dimension/series,
#                 or measure count for a value role
#   on_violation  the anti_pattern id (defined in _anti_patterns.yaml) that EXPLAINS a
#                 min/max breach — this is the agent-legible "why not this idiom"
# `data_fit` is NOT a required key; an idiom whose correctness does not depend on input
# cardinality/type (e.g. a single-value KPI card) may omit it.
#
# --- _anti_patterns.yaml — the anti-pattern catalog (governance) ---
# Every id used in ANY idiom's `anti_patterns:` list MUST be defined once in
# _anti_patterns.yaml with a `message` + `fix` (+ optional `source`, `fit`). This turns
# free-text tags into governed rejection reasons the resolver can return verbatim.
# Enforced by tooling/visual_library/tests/test_data_fit.py.
#
# --- applicability ---
# Every idiom must ADDRESS all four tools, but not every idiom EXISTS in every tool
# (SVG-DAX is for cell micro-charts, not full waterfalls/scatter; Vega-Lite/Recharts
# are not table tools; there is no native bullet base visual). A tool that does not
# fit is written as:  <tool>: { applicable: false, reason: "...", use: "<other tool>" }
# instead of {ext, template}. render.tools() skips these; the golden test only freezes
# the runnable ones; the schema test requires every non-applicable to carry reason+use.
