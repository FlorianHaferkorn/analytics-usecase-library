# Visual Library entry — bar_absolute  (schema: _schema.yaml)
id: bar_absolute
name: Bar (absolute magnitude)
purpose: [compare_categories]
zone: [analysis]
min_size: {w: 320, h: 200}   # minimum legible render size (px) — below this, labels/marks fall under the legibility floor
best_form_for: null                 # `bar_ranking` is the governed best form; this is the no-reference variant
alternatives: [bar_ranking, lollipop]

encoding:
  magnitude: length                 # rank 3 — direct length comparison, zero baseline
  order: descending                 # largest first (no target -> no worst-first)
  reference: none                   # pure magnitude; no plan/target to deviate from
  color: single_series              # one neutral colour — NOT semantic, NOT per-category

anti_patterns:
  - broken_baseline_on_absolute_bar # a length bar MUST start at zero
  - color_to_separate_equal_categories
  - pie_for_comparison
  - unsorted_bars

params:
  category: {role: axis, type: category, required: true}
  measure:  {role: value, required: true}
  entity:   {role: table, default: _Measures}
  top_n:    {role: limit, default: 20}

tokens:
  col_bar: ink                      # #0F2430 — single neutral series colour (magnitude, not signal)

canonical_params:
  entity: "_Measures"
  measure: "Net Sales Amount"
  category_entity: "dim_org"
  category_prop: "OrgName"
  field: "net_sales"
  field_cat: "unit"
  col_bar: "#0F2430"

preview_svg: |
  <svg viewBox="0 0 340 168" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Absolute bar ranking">
    <rect width="340" height="168" rx="12" fill="#FFFFFF"/>
    <text x="18" y="24" font-family="Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#586472">NET SALES BY REGION</text>
    <text x="16" y="56" font-family="Segoe UI,sans-serif" font-size="11" fill="#18202A">Nord</text><rect x="96" y="47" width="222" height="12" rx="2" fill="#0F2430"/>
    <text x="16" y="80" font-family="Segoe UI,sans-serif" font-size="11" fill="#18202A">West</text><rect x="96" y="71" width="176" height="12" rx="2" fill="#0F2430"/>
    <text x="16" y="104" font-family="Segoe UI,sans-serif" font-size="11" fill="#18202A">Ost</text><rect x="96" y="95" width="121" height="12" rx="2" fill="#0F2430"/>
    <text x="16" y="128" font-family="Segoe UI,sans-serif" font-size="11" fill="#18202A">Sued</text><rect x="96" y="119" width="84" height="12" rx="2" fill="#0F2430"/>
    <text x="16" y="152" font-family="Segoe UI,sans-serif" font-size="11" fill="#18202A">Nordics</text><rect x="96" y="143" width="47" height="12" rx="2" fill="#0F2430"/>
  </svg>

realizations:
  powerbi_native:
    ext: json
    template: |
      {
        "visualType": "clusteredBarChart",
        "query": { "queryState": {
          "Category": { "projections": [ { "field": { "Column": { "Expression": { "SourceRef": { "Entity": "{{category_entity}}" } }, "Property": "{{category_prop}}" } }, "queryRef": "{{category_entity}}.{{category_prop}}" } ] },
          "Y": { "projections": [ { "field": { "Measure": { "Expression": { "SourceRef": { "Entity": "{{entity}}" } }, "Property": "{{measure}}" } }, "queryRef": "{{entity}}.{{measure}}" } ] },
          "sortDefinition": { "sort": [ { "field": { "Measure": { "Expression": { "SourceRef": { "Entity": "{{entity}}" } }, "Property": "{{measure}}" } }, "direction": "Descending" } ], "isDefaultSort": true }
        } },
        "objects": {
          "valueAxis": [ { "properties": { "start": { "expr": { "Literal": { "Value": "0D" } } } } } ],
          "dataPoint": [ { "properties": { "defaultColor": { "solid": { "color": { "expr": { "Literal": { "Value": "'{{col_bar}}'" } } } } } } } ]
        }
      }

  powerbi_svg_dax:
    ext: dax
    template: |
      VAR _v = [{{measure}}]
      VAR _max = CALCULATE ( MAXX ( ALLSELECTED ( '{{category_entity}}'[{{category_prop}}] ), [{{measure}}] ), REMOVEFILTERS ( '{{category_entity}}'[{{category_prop}}] ) )
      VAR _w = DIVIDE ( _v, _max ) * 100
      RETURN
          IF ( HASONEVALUE ( '{{category_entity}}'[{{category_prop}}] ),
              "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 14' preserveAspectRatio='none'>"
                & "<rect x='0' y='2' width='" & _w & "' height='10' fill='{{col_bar}}'/>"
                & "</svg>" )

  deneb_vegalite:
    ext: json
    template: |
      {
        "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
        "data": { "name": "dataset" },
        "mark": { "type": "bar", "color": "{{col_bar}}" },
        "encoding": {
          "y": { "field": "{{field_cat}}", "type": "nominal", "sort": "-x", "axis": { "title": null } },
          "x": { "field": "{{field}}", "type": "quantitative", "axis": { "title": null }, "scale": { "zero": true } }
        }
      }

  web_recharts:
    ext: jsx
    template: |
      <BarChart layout="vertical" data={[...data].sort((a, b) => b.{{field}} - a.{{field}})} width={640} height={320}>
        <XAxis type="number" domain={[0, 'dataMax']} />
        <YAxis type="category" dataKey="{{field_cat}}" width={90} />
        <Bar dataKey="{{field}}" fill="{{col_bar}}" />
      </BarChart>

determinism:
  golden_dir: golden
  notes: "Magnitude only: zero baseline, descending sort, one neutral colour (no target, no semantic tint). Same {{param}} fill; golden-frozen."
