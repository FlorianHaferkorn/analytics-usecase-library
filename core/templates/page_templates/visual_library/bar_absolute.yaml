# Visual Library entry — bar_absolute  (schema: _schema.yaml)
id: bar_absolute
name: Bar (absolute magnitude)
version: "1.2.0"   # 1.2.0 (22.10.2026): Höchstbreite 24 px (B2), ein Akzent per highlight_category, Rest grau (B5), Null als Strich und „0“, fehlend als „–“ (B9). 1.1.0 (17.10.2026): Beschriftung an: Wertegitter und Werteachse aus (W2)
status: active        # active | deprecated | experimental
purpose: [compare_categories]
zone: [analysis]
min_size: {cols: 4, rows: 4}   # grid units — canvas-relative legibility floor (≈395×208px @1280, 592×312px @1920; px derived from layout_grid.yaml)
best_form_for: null                 # `bar_ranking` is the governed best form; this is the no-reference variant
alternatives: [bar_ranking, lollipop]
y_basis: "null"         # Gestaltungsregel werteachse_basis (_gestaltungsregeln.yaml)
werteachse: x           # quantitative Achse: x liegend, y stehend, xy, keine (Regel beschriftung_gitter)

encoding:
  magnitude: length                 # rank 3 — direct length comparison, zero baseline
  order: descending                 # largest first (no target -> no worst-first)
  reference: none                   # pure magnitude; no plan/target to deviate from
  color: single_series              # one neutral colour — NOT semantic, NOT per-category
  accent: optional_single           # highlight_category: that bar ink, the rest #8C8C8C (B5, Gestaltungsregel akzent)
  thickness: capped                 # at most bar_max_px thick (B2, Gestaltungsregel hoechstbreite)
  zero_vs_missing: distinct         # 0 = 2 px tick + "0", missing = no bar + "–" (B9, Gestaltungsregel null_fehlend)

anti_patterns:
  - broken_baseline_on_absolute_bar # a length bar MUST start at zero
  - color_to_separate_equal_categories
  - pie_for_comparison
  - unsorted_bars

params:
  category: {role: axis, type: category, required: true}
  measure:  {role: value, required: true}
  entity:   {role: table, default: _Measures}
  top_n:    {role: limit, default: 20}

tokens:
  col_bar: ink                      # #0F2430 — single neutral series colour (magnitude, not signal)
  col_context: marks.context        # #8C8C8C the other bars when one is highlighted (B5); "–" of a missing value

# data column slots of the Vega-Lite track: which column role fills which {{param}} (A-31 R4)
data_values: [highlight_category]   # which category carries the accent is a statement about the data: from params or none
data_slots:
  field: {role: value, required: true}
  field_cat: {role: category, required: true}

canonical_params:
  col_label: "#201F1E"            # data label ink (text, 4.5:1); A-31 R6
  entity: "_Measures"
  measure: "Net Sales Amount"
  category_entity: "dim_org"
  category_prop: "OrgName"
  field: "net_sales"
  field_cat: "unit"
  col_bar: "#0F2430"
  col_context: "#8C8C8C"
  highlight_category: "Nord"      # sample accent (data_values: never reaches real data unless given)
  bar_max_px: "24"                # Gestaltungsregel hoechstbreite (B2)
  label_missing: "–"              # Gestaltungsregel null_fehlend (B9)

preview_svg: |
  <svg viewBox="0 0 340 168" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Absolute bar ranking">
    <rect width="340" height="168" rx="12" fill="#FFFFFF"/>
    <text x="18" y="24" font-family="Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#586472">NET SALES BY REGION</text>
    <text x="16" y="56" font-family="Segoe UI,sans-serif" font-size="11" fill="#18202A">Nord</text><rect x="96" y="47" width="222" height="12" rx="2" fill="#0F2430"/>
    <text x="16" y="80" font-family="Segoe UI,sans-serif" font-size="11" fill="#18202A">West</text><rect x="96" y="71" width="176" height="12" rx="2" fill="#0F2430"/>
    <text x="16" y="104" font-family="Segoe UI,sans-serif" font-size="11" fill="#18202A">Ost</text><rect x="96" y="95" width="121" height="12" rx="2" fill="#0F2430"/>
    <text x="16" y="128" font-family="Segoe UI,sans-serif" font-size="11" fill="#18202A">Sued</text><rect x="96" y="119" width="84" height="12" rx="2" fill="#0F2430"/>
    <text x="16" y="152" font-family="Segoe UI,sans-serif" font-size="11" fill="#18202A">Nordics</text><rect x="96" y="143" width="47" height="12" rx="2" fill="#0F2430"/>
  </svg>

realizations:
  powerbi_native:
    ext: json
    template: |
      {
        "visualType": "clusteredBarChart",
        "query": { "queryState": {
          "Category": { "projections": [ { "field": { "Column": { "Expression": { "SourceRef": { "Entity": "{{category_entity}}" } }, "Property": "{{category_prop}}" } }, "queryRef": "{{category_entity}}.{{category_prop}}" } ] },
          "Y": { "projections": [ { "field": { "Measure": { "Expression": { "SourceRef": { "Entity": "{{entity}}" } }, "Property": "{{measure}}" } }, "queryRef": "{{entity}}.{{measure}}" } ] }
        },
        "sortDefinition": { "sort": [ { "field": { "Measure": { "Expression": { "SourceRef": { "Entity": "{{entity}}" } }, "Property": "{{measure}}" } }, "direction": "Descending" } ], "isDefaultSort": true } },
        "objects": {
          "valueAxis": [ { "properties": { "start": { "expr": { "Literal": { "Value": "0D" } } } } } ],
          "dataPoint": [ { "properties": { "defaultColor": { "solid": { "color": { "expr": { "Literal": { "Value": "'{{col_bar}}'" } } } } } } } ]
        }
      }

  powerbi_svg_dax:
    ext: dax
    template: |
      VAR _v = [{{measure}}]
      VAR _max = CALCULATE ( MAXX ( ALLSELECTED ( '{{category_entity}}'[{{category_prop}}] ), [{{measure}}] ), REMOVEFILTERS ( '{{category_entity}}'[{{category_prop}}] ) )
      VAR _w = DIVIDE ( _v, _max ) * 100
      RETURN
          IF ( HASONEVALUE ( '{{category_entity}}'[{{category_prop}}] ),
              "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 14' preserveAspectRatio='none'>"
                & "<rect x='0' y='2' width='" & _w & "' height='10' fill='{{col_bar}}'/>"
                & "</svg>" )

  deneb_vegalite:
    ext: json
    template: |
      {
        "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
        "data": { "name": "dataset" },
        "params": [ { "name": "_n_daten", "expr": "max(length(data('dataset')), length(data('source_0')))" }, { "name": "_beschriftet", "expr": "_n_daten > 0 && _n_daten < 10" } ],
        "padding": { "right": 40 },
        "transform": [
          { "calculate": "datum['{{field}}'] === 0 ? 0 : null", "as": "_nullstrich" },
          { "calculate": "isValid(datum['{{field}}']) || datum._rest === true ? null : 0", "as": "_fehlt" }
        ],
        "encoding": {
          "y": { "field": "{{field_cat}}", "type": "nominal", "sort": { "field": "{{field}}", "order": "descending" }, "axis": { "title": null } },
          "x": { "field": "{{field}}", "type": "quantitative", "axis": { "title": null, "tickCount": { "expr": "_beschriftet ? 0 : ceil(width/40)" }, "domainOpacity": { "expr": "_beschriftet ? 0 : 1" } }, "scale": { "zero": true } }
        },
        "layer": [
          { "mark": { "type": "bar", "height": { "expr": "min(bandwidth('y'), {{bar_max_px}})" } },
            "encoding": { "color": { "condition": { "test": "datum['{{field_cat}}'] != '{{highlight_category}}'", "value": "{{col_context}}" }, "value": "{{col_bar}}" } } },
          { "mark": { "type": "tick", "orient": "vertical", "thickness": 2, "color": "{{col_bar}}", "description": "Null" },
            "encoding": { "x": { "field": "_nullstrich", "type": "quantitative" }, "size": { "value": { "expr": "min(bandwidth('y'), {{bar_max_px}})" } } } },
          { "mark": { "type": "text", "align": "left", "dx": 4, "color": "{{col_label}}" },
            "encoding": { "text": { "field": "{{field}}", "type": "quantitative", "format": ",.1~f" }, "opacity": { "condition": { "test": "_beschriftet", "value": 1 }, "value": 0 } } },
          { "mark": { "type": "text", "text": "{{label_missing}}", "align": "left", "dx": 4, "color": "{{col_context}}", "description": "fehlender Wert" },
            "encoding": { "x": { "field": "_fehlt", "type": "quantitative" } } }
        ]
      }

  web_recharts:
    ext: jsx
    template: |
      <BarChart layout="vertical" data={[...data].sort((a, b) => b.{{field}} - a.{{field}})} width={640} height={320}>
        <XAxis type="number" domain={[0, 'dataMax']} />
        <YAxis type="category" dataKey="{{field_cat}}" width={90} />
        <Bar dataKey="{{field}}" fill="{{col_bar}}" />
      </BarChart>

determinism:
  golden_dir: golden
  notes: "Magnitude only: zero baseline, descending sort, one neutral colour (no target, no semantic tint). Same {{param}} fill; golden-frozen."
