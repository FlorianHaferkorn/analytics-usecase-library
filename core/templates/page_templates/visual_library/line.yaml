# Visual Library entry — line  (schema: _schema.yaml)
id: line
name: Trend line
version: "2.2.1"   # 2.2.0 (23.10.2026): Zusammenführung der parallelen Zweige 2.1.x — Rubrikpaket (laufende Periode, Serienlabel am Linienende, Abweichungsfläche, Zielkorridor) und Cockpitzeit (Ereignismarker, Prognoseband, Ereignisnummer 19 px über der Fläche); beide Zweige hatten unabhängig 2.1.0/2.1.1 vergeben. Zweig Cockpitzeit: 2.1.2 (22.10.2026): die Ereignisnummer steht in einem eigenen Streifen 19 px über der Zeichenfläche, über allen Direktbeschriftungen (Endwert dy -10, Plan -8, P90 -7); bei -3 überdeckte sie den Endwert eines hohen letzten Punkts (Meridian Fabric-App-Tor G14, 390 px: '3' überdeckt '91,8'). 2.1.1 (22.10.2026): an der Regel die laufende Nummer des Ereignisses über der Zeichenfläche, der Text steht in der Legende des Aufrufers (Regel ereignismarker; ein Text in der Zeichenfläche überdeckte Direktbeschriftungen, Fabric-App-Tor G14), und ohne Marke für den Null-Platzhalter "(Blank)" des Fabric-Hosts (fabric-visuals NULL_SENTINEL). 2.1.0 (22.10.2026): Rollen event (Ereignismarker, Regel ereignismarker) und fc_band (Prognoseband P10-P90, Regel prognoseband), Meridian BO-401/BO-402. Zweig Rubrikpaket: 2.1.1 (22.10.2026): Abweichungsfläche aria false (leerer Container ohne Namen, Cockpit G8). 2.1.0 (22.10.2026): laufende Periode mit hohlem Endpunkt (L4), Serienlabel am Linienende statt am Anfang (L3), Abweichungsfläche Ist/Plan nach Richtung als Variante (L6), IBCS nativ mit Serienlabels. 2.0.0 (17.10.2026): Werteachse ab 0, angepasst mit Achsenbruch bei Spannweite < 25 %, monotone Linien, Alarmlinie (Gestaltungsregeln). 1.2.2 (17.10.2026): Hover-Ring ohne Füllung aus dem Host-Theme. 1.2.1: Vega-Linie dezenter, Punkte nur als kleine Kreise, Raster gepunktet ohne Y-Achsenlinie (house, print_safe)
# 2.2.1 (27.10.2026): Prognoseband neutralisiert Host-fillOpacity; Kernaussage erhält die idiomeigene Deckkraft.
status: active        # active | deprecated | experimental
purpose: [time_comparison]
zone: [analysis]
min_size: {cols: 4, rows: 4}   # grid units — canvas-relative legibility floor (≈395×208px @1280, 592×312px @1920; px derived from layout_grid.yaml)
best_form_for: time_comparison
alternatives: [area_stacked, small_multiples, indexed_line, slope]
y_basis: "null_oder_angepasst" # Gestaltungsregel werteachse_basis (_gestaltungsregeln.yaml)
werteachse: y           # quantitative Achse: x liegend, y stehend, xy, keine (Regel beschriftung_gitter)

encoding:
  x: temporal
  y: quantitative
  magnitude: position               # rank 1-2 on a common scale
  reference: target_line            # dashed plan/target reference
  endpoint: emphasized              # the verdict at the mark; hollow when the last period is still running (L4)
  series_labels: line_end           # PY, Plan, FC named at their last point, no legend (L3, Gestaltungsregel serienlabel)
  variance_area: optional           # area between AC and plan in direction colour, 20 % (L6, variant `abweichungsflaeche: an`)

anti_patterns:
  - bars_for_time
  - autoscale_without_reference     # graphical integrity (Tufte)
  - dual_axis_no_reason
  - legend_when_direct_label_works

params:
  category: {role: axis, type: date, required: true}
  measure:  {role: value, required: true}
  target:   {role: reference, optional: true}
  entity:   {role: table, default: _Measures}

tokens:
  col_line: ink                     # #0F2430 hero line
  col_ref:  color_semantics.neutral # #605E5C target reference
  col_alert: color_semantics.negative # #A4262C alarm line
  col_end:  color_semantics.negative# endpoint (semantic by sign at gen time)
  col_good: color_semantics.positive # #107C10 variance area where AC beats plan in its direction
  col_bad:  color_semantics.negative # #A4262C variance area where AC misses plan

# data column slots of the Vega-Lite track: which column role fills which {{param}} (A-31 R4)
data_values: {target_val: null, alert_val: null, band_low: null, band_high: null, col_end: col_line}   # band_*: Zielkorridor nur aus kpi target_corridor mit Freigabe (Regel zielband, D-795)
# (vorher)    # data, not style: from params; else removed (null) or the named fallback (A-31 R6)
data_slots:
  field: {role: value, required: true}
  field_date: {role: time, required: true}
  plan_field: {role: plan, required: false}
  fc_field: {role: forecast, required: false}   # FC (IBCS UN 3.2): dashed, never drawn as plan (BO-021)
  py_field: {role: prior, required: false}      # PY (IBCS UN 3.2): grey solid, behind AC; never plan or FC (BO-052)
  event_field: {role: event, required: false}   # text of a governed event at its date: rule + running number above the plot, the caller lists number and text (Regel ereignismarker); unbound or empty: no marker
  fc_lo_field: {role: fc_band, part: lo, required: false}   # lower percentile of the forecast (P10): static band, labelled (Regel prognoseband)
  fc_hi_field: {role: fc_band, part: hi, required: false}   # upper percentile of the forecast (P90)
  current_field: {role: current, required: false}  # true on the running period (Snapshot trend.laufend): hollow endpoint (L4)

canonical_params:
  col_label: "#201F1E"            # data label ink (text, 4.5:1); A-31 R6
  entity: "_Measures"
  measure: "Gross Margin %"
  target_measure: "Plan Gross Margin %"
  fc_measure: "Gross Margin % FC"       # native FC series (line@ibcs powerbi_native, BO-116)
  prior_measure: "Gross Margin % PY"    # native PY series (line@ibcs powerbi_native, BO-052)
  category_entity: "dim_date"
  category_prop: "Date"
  field: "gm"
  field_date: "month"
  target_val: "44.1"
  col_line: "#0F2430"
  col_ref: "#605E5C"               # reference marks 6.46:1 (≥ 3:1, WCAG 1.4.11; Regel markenkontrast)
  alert_val: "42.0"
  band_low: "43.0"                # Musterwerte des Goldens, keine Freigabe: real kommt der Korridor nur aus
  band_high: "46.0"               # target_corridor mit freigabe (render.zielband, Regel zielband, D-795)
  col_band: "#ECECEC"             # Band ohne Kontur (Regel zielband)
  col_alert: "#A4262C"             # alarm line = semantic.negative (7.26:1)
  label_alert: "Alarm"
  col_end: "#A4262C"
  plan_field: "gm_plan"
  fc_field: "gm_fc"
  py_field: "gm_py"
  col_py: "#8C8C8C"               # PY grey: a thin line needs 3:1 on white (3.4:1; WCAG 1.4.11), unlike a PY bar
  label_py: "PY"                  # direct label of the PY line (IBCS abbreviation; caller may pass "VJ")
  event_field: "gm_event"
  fc_lo_field: "gm_fc_p10"
  fc_hi_field: "gm_fc_p90"
  label_fc_lo: "P10"              # percentile labels of the band (Regel prognoseband: always labelled)
  label_fc_hi: "P90"
  label_plan: "Plan"              # direct label of the plan line at its end (L3)
  label_fc: "FC"                  # direct label of the forecast line at its end (L3)
  current_field: "laufend"
  label_current: "laufend"        # label under the hollow endpoint of the running period (L4)
  # The variance area carries "aria": false: switched off, its filter leaves an empty area/line container that Vega
  # exposes as an unnamed graphics-symbol (axe svg-img-alt, Meridian Cockpit G8, 22.10.2026); switched on, Ist and
  # Plan lines name the same deviation.
  abweichungsflaeche: "aus"       # variant L6: "an" draws the area between AC and plan (Gestaltungsregel abweichungsflaeche)
  polarity: "1"                   # -1 = lower is better: the variance area turns good below plan
  col_good: "#107C10"
  col_bad: "#A4262C"
  flaeche_deckkraft: "0.2"        # 20 % (Gestaltungsregel abweichungsflaeche.deckkraft)

preview_svg: |
  <svg viewBox="0 0 340 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Trend line">
    <rect width="340" height="140" rx="12" fill="#FFFFFF"/>
    <text x="20" y="26" font-family="Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#586472">GROSS MARGIN % — 12 MONTHS</text>
    <line x1="30" y1="52" x2="320" y2="52" stroke="#94A0AC" stroke-width="1.3" stroke-dasharray="5 4"/>
    <text x="320" y="47" text-anchor="end" font-family="Segoe UI,sans-serif" font-size="10" fill="#586472">Plan 44.1</text>
    <polyline points="30,66 56,60 82,64 108,58 134,66 160,74 186,70 212,80 238,88 264,96 290,102 316,110" fill="none" stroke="#0F2430" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="316" cy="110" r="4.2" fill="#A4262C"/>
    <text x="304" y="126" text-anchor="end" font-family="Segoe UI,sans-serif" font-size="11" font-weight="600" fill="#A4262C">42.3%</text>
  </svg>

realizations:
  powerbi_native:
    ext: json
    template: |
      {
        "visualType": "lineChart",
        "query": { "queryState": {
          "Category": { "projections": [ { "field": { "Column": { "Expression": { "SourceRef": { "Entity": "{{category_entity}}" } }, "Property": "{{category_prop}}" } }, "queryRef": "{{category_entity}}.{{category_prop}}" } ] },
          "Y": { "projections": [ { "field": { "Measure": { "Expression": { "SourceRef": { "Entity": "{{entity}}" } }, "Property": "{{measure}}" } }, "queryRef": "{{entity}}.{{measure}}" } ] }
        } },
        "objects": {
          "y1AxisReferenceLine": [ { "properties": {
            "show": { "expr": { "Literal": { "Value": "true" } } },
            "value": { "expr": { "Measure": { "Expression": { "SourceRef": { "Entity": "{{entity}}" } }, "Property": "{{target_measure}}" } } },
            "lineColor": { "solid": { "color": { "expr": { "Literal": { "Value": "'{{col_ref}}'" } } } } },
            "style": { "expr": { "Literal": { "Value": "'dashed'" } } }
          }, "selector": { "id": "1" } } ],
          "labels": [ { "properties": { "show": { "expr": { "Literal": { "Value": "false" } } } } } ]
        }
      }

  powerbi_svg_dax:
    ext: dax
    template: |
      VAR _S = ADDCOLUMNS ( CALCULATETABLE ( VALUES ( '{{category_entity}}'[{{category_prop}}] ), DATESINPERIOD ( '{{category_entity}}'[{{category_prop}}], MAX ( '{{category_entity}}'[{{category_prop}}] ), -12, MONTH ) ), "@v", [{{measure}}] )
      VAR _min = MINX ( _S, [@v] )
      VAR _max = MAXX ( _S, [@v] )
      VAR _xmin = MINX ( _S, '{{category_entity}}'[{{category_prop}}] )
      VAR _xmax = MAXX ( _S, '{{category_entity}}'[{{category_prop}}] )
      VAR _pts = CONCATENATEX ( _S, INT ( 100 * DIVIDE ( '{{category_entity}}'[{{category_prop}}] - _xmin, _xmax - _xmin ) ) & "," & INT ( 30 - 30 * DIVIDE ( [@v] - _min, _max - _min ) ), " ", '{{category_entity}}'[{{category_prop}}] )
      RETURN
          "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 30'>"
            & "<polyline fill='none' stroke='{{col_line}}' stroke-width='2' points='" & _pts & "'/>"
            & "</svg>"

  deneb_vegalite:
    ext: json
    template: |
      {
        "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
        "data": { "name": "dataset" },
        "padding": { "right": 36 },
        "transform": [
          { "calculate": "min(isValid(datum['{{field}}']) ? datum['{{field}}'] : 1e300, isValid(datum['{{plan_field}}']) ? datum['{{plan_field}}'] : 1e300, isValid(datum['{{py_field}}']) ? datum['{{py_field}}'] : 1e300, isValid(datum['{{fc_field}}']) ? datum['{{fc_field}}'] : 1e300, isValid(datum['{{fc_lo_field}}']) ? datum['{{fc_lo_field}}'] : 1e300)", "as": "_yu_z" },
          { "calculate": "max(isValid(datum['{{field}}']) ? datum['{{field}}'] : -1e300, isValid(datum['{{plan_field}}']) ? datum['{{plan_field}}'] : -1e300, isValid(datum['{{py_field}}']) ? datum['{{py_field}}'] : -1e300, isValid(datum['{{fc_field}}']) ? datum['{{fc_field}}'] : -1e300, isValid(datum['{{fc_hi_field}}']) ? datum['{{fc_hi_field}}'] : -1e300)", "as": "_yo_z" },
          { "joinaggregate": [ { "op": "min", "field": "_yu_z", "as": "_yu" }, { "op": "max", "field": "_yo_z", "as": "_yo" } ] },
          { "calculate": "min(datum._yu, isValid({{target_val}}) ? {{target_val}} : 1e300, isValid({{alert_val}}) ? {{alert_val}} : 1e300, isValid({{band_low}}) ? {{band_low}} : 1e300)", "as": "_ylo" },
          { "calculate": "max(datum._yo, isValid({{target_val}}) ? {{target_val}} : -1e300, isValid({{alert_val}}) ? {{alert_val}} : -1e300, isValid({{band_high}}) ? {{band_high}} : -1e300)", "as": "_yhi" },
          { "calculate": "max(abs(datum._yhi), abs(datum._ylo))", "as": "_ytop" },
          { "calculate": "datum._yhi > -1e299 && datum._ytop > 0 && datum._ytop < 1e299 && datum._yhi - datum._ylo < 0.25 * datum._ytop", "as": "_yangepasst" },
          { "calculate": "datum._yangepasst ? datum._ylo - max((datum._yhi - datum._ylo) * 0.1, datum._ytop * 0.01) : 0", "as": "_ybasis" },
          { "calculate": "datum['{{current_field}}'] === true", "as": "_laufend" }
        ],
        "encoding": { "x": { "field": "{{field_date}}", "type": "temporal", "axis": { "title": null } } },
        "layer": [
          { "mark": { "type": "rule", "opacity": 0, "strokeWidth": 0 }, "encoding": { "y": { "field": "_ybasis", "type": "quantitative" } } },
          { "data": { "values": [ {} ] },
            "mark": { "type": "rect", "color": "{{col_band}}", "strokeWidth": 0, "description": "Zielkorridor", "tooltip": null },
            "encoding": { "x": { "value": 0 }, "x2": { "value": { "expr": "width" } }, "y": { "datum": {{band_low}} }, "y2": { "datum": {{band_high}} } } },
          { "transform": [ { "filter": "isValid(datum['{{fc_lo_field}}']) && isValid(datum['{{fc_hi_field}}'])" } ],
            "mark": { "type": "area", "interpolate": "monotone", "color": "{{col_line}}", "opacity": 0.12, "fillOpacity": 1, "description": "Prognoseband {{label_fc_lo}}-{{label_fc_hi}}" },
            "encoding": { "y": { "field": "{{fc_lo_field}}", "type": "quantitative" }, "y2": { "field": "{{fc_hi_field}}" } } },
          { "transform": [ { "filter": "'{{abweichungsflaeche}}' == 'an' && isValid(datum['{{field}}']) && isValid(datum['{{plan_field}}'])" },
                           { "calculate": "(datum['{{field}}'] - datum['{{plan_field}}']) * {{polarity}} >= 0 ? datum['{{field}}'] : datum['{{plan_field}}']", "as": "_gut" } ],
            "mark": { "type": "area", "interpolate": "monotone", "color": "{{col_good}}", "opacity": {{flaeche_deckkraft}}, "description": "Abweichungsfläche gut", "aria": false, "line": false },
            "encoding": { "y": { "field": "_gut", "type": "quantitative" }, "y2": { "field": "{{plan_field}}" } } },
          { "transform": [ { "filter": "'{{abweichungsflaeche}}' == 'an' && isValid(datum['{{field}}']) && isValid(datum['{{plan_field}}'])" },
                           { "calculate": "(datum['{{field}}'] - datum['{{plan_field}}']) * {{polarity}} < 0 ? datum['{{field}}'] : datum['{{plan_field}}']", "as": "_schlecht" } ],
            "mark": { "type": "area", "interpolate": "monotone", "color": "{{col_bad}}", "opacity": {{flaeche_deckkraft}}, "description": "Abweichungsfläche schlecht", "aria": false, "line": false },
            "encoding": { "y": { "field": "_schlecht", "type": "quantitative" }, "y2": { "field": "{{plan_field}}" } } },
          { "transform": [ { "filter": "isValid(datum['{{fc_hi_field}}'])" }, { "window": [ { "op": "row_number", "as": "_bh" } ], "sort": [ { "field": "{{field_date}}", "order": "descending" } ] }, { "filter": "datum._bh == 1" } ],
            "mark": { "type": "text", "text": "{{label_fc_hi}}", "align": "right", "dx": -2, "dy": -7, "fontSize": 10, "color": "{{col_ref}}" },
            "encoding": { "y": { "field": "{{fc_hi_field}}", "type": "quantitative" } } },
          { "transform": [ { "filter": "isValid(datum['{{fc_lo_field}}'])" }, { "window": [ { "op": "row_number", "as": "_bl" } ], "sort": [ { "field": "{{field_date}}", "order": "descending" } ] }, { "filter": "datum._bl == 1" } ],
            "mark": { "type": "text", "text": "{{label_fc_lo}}", "align": "right", "dx": -2, "dy": 11, "fontSize": 10, "color": "{{col_ref}}" },
            "encoding": { "y": { "field": "{{fc_lo_field}}", "type": "quantitative" } } },
          { "transform": [ { "filter": "isValid(datum['{{event_field}}']) && datum['{{event_field}}'] != '' && datum['{{event_field}}'] != '(Blank)'" } ],
            "mark": { "type": "rule", "color": "{{col_ref}}", "strokeWidth": 1, "description": "Ereignis" },
              "encoding": { "tooltip": { "field": "{{event_field}}", "type": "nominal" } } },
          { "transform": [ { "filter": "isValid(datum['{{event_field}}']) && datum['{{event_field}}'] != '' && datum['{{event_field}}'] != '(Blank)'" }, { "window": [ { "op": "row_number", "as": "_ev" } ], "sort": [ { "field": "{{field_date}}", "order": "ascending" } ] } ],
            "mark": { "type": "text", "align": "center", "baseline": "bottom", "dy": -19, "fontSize": 11, "color": "{{col_ref}}", "description": "Ereignisnummer" },
            "encoding": { "y": { "value": 0 }, "text": { "field": "_ev", "type": "nominal" }, "tooltip": { "field": "{{event_field}}", "type": "nominal" } } },
          { "mark": { "type": "line", "interpolate": "monotone", "color": "{{col_py}}", "strokeWidth": 1.25, "strokeCap": "round", "strokeJoin": "round" },
            "encoding": { "y": { "field": "{{py_field}}", "type": "quantitative" } } },
          { "transform": [ { "filter": "isValid(datum['{{py_field}}'])" }, { "window": [ { "op": "row_number", "as": "_q" } ], "sort": [ { "field": "{{field_date}}", "order": "descending" } ] }, { "filter": "datum._q == 1" } ],
            "mark": { "type": "text", "text": "{{label_py}}", "align": "left", "baseline": "middle", "dx": 6, "color": "{{col_py}}", "description": "Serienlabel" },
            "encoding": { "y": { "field": "{{py_field}}", "type": "quantitative" } } },
          { "mark": { "type": "line", "interpolate": "monotone", "color": "{{col_line}}", "strokeWidth": 2, "strokeCap": "round", "strokeJoin": "round" },
            "encoding": { "y": { "field": "{{field}}", "type": "quantitative", "scale": { "zero": false }, "axis": { "title": null, "domain": false, "ticks": false, "gridDash": [2, 4], "gridOpacity": 0.8 } } } },
          { "mark": { "type": "rule", "color": "{{col_ref}}", "strokeWidth": 1, "strokeDash": [1, 4], "strokeCap": "round" },
            "encoding": { "y": { "datum": {{target_val}} } } },
          { "mark": { "type": "rule", "color": "{{col_alert}}", "strokeWidth": 1, "strokeDash": [4, 2], "strokeCap": "round" },
            "encoding": { "y": { "datum": {{alert_val}} } } },
          { "transform": [ { "window": [ { "op": "row_number", "as": "_a" } ] }, { "filter": "datum._a == 1" } ],
            "mark": { "type": "text", "text": "{{label_alert}}", "align": "left", "dx": 4, "dy": 10, "color": "{{col_alert}}" },
            "encoding": { "x": { "value": 0 }, "y": { "datum": {{alert_val}} } } },
          { "transform": [ { "filter": "datum._yangepasst" }, { "window": [ { "op": "row_number", "as": "_yb" } ] }, { "filter": "datum._yb == 1" } ],
            "mark": { "type": "text", "text": "≈", "fontSize": 14, "fontWeight": "bold", "color": "{{col_ref}}", "align": "center", "baseline": "middle", "description": "Achse beginnt nicht bei null" },
            "encoding": { "x": { "value": 0 }, "y": { "value": { "expr": "height" } } } },
          { "mark": { "type": "line", "interpolate": "monotone", "color": "{{col_ref}}", "strokeDash": [4, 4], "strokeWidth": 1.25, "strokeCap": "round", "strokeJoin": "round" },
            "encoding": { "y": { "field": "{{plan_field}}", "type": "quantitative" } } },
          { "mark": { "type": "line", "interpolate": "monotone", "color": "{{col_line}}", "strokeDash": [1, 4], "strokeWidth": 1.75, "strokeCap": "round" },
            "encoding": { "y": { "field": "{{fc_field}}", "type": "quantitative" } } },
          { "transform": [ { "filter": "isValid(datum['{{plan_field}}'])" }, { "window": [ { "op": "row_number", "as": "_p" } ], "sort": [ { "field": "{{field_date}}", "order": "descending" } ] }, { "filter": "datum._p == 1" } ],
            "mark": { "type": "text", "text": "{{label_plan}}", "align": "left", "baseline": "middle", "dx": 6, "color": "{{col_ref}}", "description": "Serienlabel" },
            "encoding": { "y": { "field": "{{plan_field}}", "type": "quantitative" } } },
          { "transform": [ { "filter": "isValid(datum['{{fc_field}}'])" }, { "window": [ { "op": "row_number", "as": "_f" } ], "sort": [ { "field": "{{field_date}}", "order": "descending" } ] }, { "filter": "datum._f == 1" } ],
            "mark": { "type": "text", "text": "{{label_fc}}", "align": "left", "baseline": "middle", "dx": 6, "color": "{{col_line}}", "description": "Serienlabel" },
            "encoding": { "y": { "field": "{{fc_field}}", "type": "quantitative" } } },
          { "transform": [ { "filter": "isValid(datum['{{field}}'])" }, { "window": [ { "op": "row_number", "as": "_r" } ], "sort": [ { "field": "{{field_date}}", "order": "descending" } ] }, { "filter": "datum._r == 1 && !datum._laufend" } ],
            "mark": { "type": "point", "shape": "circle", "size": 36, "strokeWidth": 1.5, "filled": true, "fill": "{{col_end}}", "stroke": "{{col_end}}" },
            "encoding": { "y": { "field": "{{field}}", "type": "quantitative" }, "opacity": { "value": 1 } } },
          { "transform": [ { "filter": "isValid(datum['{{field}}'])" }, { "window": [ { "op": "row_number", "as": "_r" } ], "sort": [ { "field": "{{field_date}}", "order": "descending" } ] }, { "filter": "datum._r == 1" }, { "filter": { "field": "{{current_field}}", "equal": true } } ],
            "mark": { "type": "point", "shape": "circle", "size": 36, "strokeWidth": 1.5, "filled": true, "fill": "#FFFFFF", "stroke": "{{col_end}}", "description": "laufende Periode" },
            "encoding": { "y": { "field": "{{field}}", "type": "quantitative" }, "opacity": { "value": 1 } } },
          { "transform": [ { "filter": "isValid(datum['{{field}}'])" }, { "filter": { "field": "{{current_field}}", "equal": true } }, { "window": [ { "op": "row_number", "as": "_l" } ], "sort": [ { "field": "{{field_date}}", "order": "descending" } ] }, { "filter": "datum._l == 1" } ],
            "mark": { "type": "text", "text": "{{label_current}}", "align": "right", "baseline": "top", "dx": -8, "dy": 8, "color": "{{col_ref}}", "description": "laufende Periode" },
            "encoding": { "y": { "field": "{{field}}", "type": "quantitative" } } },
          { "params": [ { "name": "hover", "select": { "type": "point", "fields": ["{{field_date}}"], "nearest": true, "on": "pointerover", "clear": "pointerout" } } ],
            "mark": { "type": "rule", "color": "{{col_ref}}", "strokeWidth": 1 },
            "encoding": { "opacity": { "condition": { "param": "hover", "empty": false, "value": 0.5 }, "value": 0 } } },
          { "mark": { "type": "point", "shape": "circle", "filled": false, "fill": "transparent", "strokeWidth": 2, "size": 56, "color": "{{col_line}}" },
            "encoding": { "y": { "field": "{{field}}", "type": "quantitative" },
                          "opacity": { "condition": { "param": "hover", "empty": false, "value": 1 }, "value": 0 } } },
          { "transform": [ { "filter": "isValid(datum['{{field}}'])" }, { "window": [ { "op": "row_number", "as": "_r" } ], "sort": [ { "field": "{{field_date}}", "order": "descending" } ] }, { "filter": "datum._r == 1" } ],
            "mark": { "type": "text", "align": "right", "dx": -8, "dy": -10, "color": "{{col_label}}" },
            "encoding": { "y": { "field": "{{field}}", "type": "quantitative" }, "text": { "field": "{{field}}", "type": "quantitative", "format": ",.1~f" } } }
        ]
      }

  web_recharts:
    ext: jsx
    template: |
      <LineChart data={data} width={640} height={220}>
        <XAxis dataKey="{{field_date}}" />
        <YAxis domain={['auto', 'auto']} />
        <ReferenceLine y={{{target_val}}} stroke="{{col_ref}}" strokeDasharray="5 4" />
        <Line type="monotone" dataKey="{{py_field}}" stroke="{{col_py}}" strokeWidth={1.5} dot={false} />
        <Line type="monotone" dataKey="{{field}}" stroke="{{col_line}}" strokeWidth={2.5} dot={false} />
      </LineChart>

# --- notation profile: IBCS (structural override — plan plotted as a scenario line) ---
# House shows plan as a flat dashed reference rule. IBCS plots PL (plan) as a real
# scenario LINE over time with the actuals (AC) solid on top (color_semantics.ibcs_scenario).
# STRUCTURAL — native gets a second Y measure; Vega/Recharts get a second line series.
profiles:
  ibcs:
    note: 'Follows the IBCS notation: AC and PL in the same colour, scenario on the markers — AC solid, PL outlined; PY = AC at 50 % (py_tint_alpha) behind AC; FC dashed (UN 3.2); value axis from zero (CH 1.1), replaced by labels (SI 3.1). Series named at the line end, no legend (Gestaltungsregel serienlabel; native seriesLabels Right, legend off). Native lineChart has no hollow marker: PL in col_pl there.'
    rule_refs:
    - CH 1.1
    - SI 3.1
    - UN 3.2
    param_overrides:
      plan_field: gm_plan
      col_pl: '#8C8C8C'
      col_ac: '#404040'
      col_good: '#5B9A35'
      col_bad: '#A4262C'
      col_neutral: '#1F6FB5'
      col_ink: '#201F1E'
      polarity: '1'
      label_pl: 'PL'
    realizations:
      powerbi_native:
        ext: json
        template: |
          {
            "visualType": "lineChart",
            "query": { "queryState": {
              "Category": { "projections": [ { "field": { "Column": { "Expression": { "SourceRef": { "Entity": "{{category_entity}}" } }, "Property": "{{category_prop}}" } }, "queryRef": "{{category_entity}}.{{category_prop}}" } ] },
              "Y": { "projections": [
                { "field": { "Measure": { "Expression": { "SourceRef": { "Entity": "{{entity}}" } }, "Property": "{{measure}}" } }, "queryRef": "{{entity}}.{{measure}}" },
                { "field": { "Measure": { "Expression": { "SourceRef": { "Entity": "{{entity}}" } }, "Property": "{{target_measure}}" } }, "queryRef": "{{entity}}.{{target_measure}}" },
                { "field": { "Measure": { "Expression": { "SourceRef": { "Entity": "{{entity}}" } }, "Property": "{{fc_measure}}" } }, "queryRef": "{{entity}}.{{fc_measure}}" },
                { "field": { "Measure": { "Expression": { "SourceRef": { "Entity": "{{entity}}" } }, "Property": "{{prior_measure}}" } }, "queryRef": "{{entity}}.{{prior_measure}}" }
              ] }
            } },
            "objects": {
              "dataPoint": [
                { "properties": { "fill": { "solid": { "color": { "expr": { "Literal": { "Value": "'{{col_ac}}'" } } } } } }, "selector": { "metadata": "{{entity}}.{{measure}}" } },
                { "properties": { "fill": { "solid": { "color": { "expr": { "Literal": { "Value": "'{{col_pl}}'" } } } } } }, "selector": { "metadata": "{{entity}}.{{target_measure}}" } },
                { "properties": { "fill": { "solid": { "color": { "expr": { "Literal": { "Value": "'{{col_ac}}'" } } } } } }, "selector": { "metadata": "{{entity}}.{{fc_measure}}" } },
                { "properties": { "fill": { "solid": { "color": { "expr": { "Literal": { "Value": "'{{col_ac}}'" } } } } } }, "selector": { "metadata": "{{entity}}.{{prior_measure}}" } }
              ],
              "lineStyles": [
                { "properties": { "lineStyle": { "expr": { "Literal": { "Value": "'solid'" } } }, "strokeWidth": { "expr": { "Literal": { "Value": "2D" } } }, "showMarker": { "expr": { "Literal": { "Value": "true" } } }, "markerShape": { "expr": { "Literal": { "Value": "'circle'" } } } }, "selector": { "metadata": "{{entity}}.{{measure}}" } },
                { "properties": { "lineStyle": { "expr": { "Literal": { "Value": "'solid'" } } }, "strokeWidth": { "expr": { "Literal": { "Value": "2D" } } }, "showMarker": { "expr": { "Literal": { "Value": "true" } } }, "markerShape": { "expr": { "Literal": { "Value": "'circle'" } } } }, "selector": { "metadata": "{{entity}}.{{target_measure}}" } },
                { "properties": { "lineStyle": { "expr": { "Literal": { "Value": "'dashed'" } } }, "strokeWidth": { "expr": { "Literal": { "Value": "2D" } } }, "showMarker": { "expr": { "Literal": { "Value": "false" } } } }, "selector": { "metadata": "{{entity}}.{{fc_measure}}" } },
                { "properties": { "lineStyle": { "expr": { "Literal": { "Value": "'solid'" } } }, "strokeWidth": { "expr": { "Literal": { "Value": "2D" } } }, "strokeTransparency": { "expr": { "Literal": { "Value": "50D" } } }, "showMarker": { "expr": { "Literal": { "Value": "false" } } } }, "selector": { "metadata": "{{entity}}.{{prior_measure}}" } }
              ],
              "labels": [ { "properties": { "show": { "expr": { "Literal": { "Value": "false" } } } } } ],
              "seriesLabels": [ { "properties": {
                "show": { "expr": { "Literal": { "Value": "true" } } },
                "seriesPosition": { "expr": { "Literal": { "Value": "'Right'" } } },
                "seriesMatchColor": { "expr": { "Literal": { "Value": "true" } } }
              } } ],
              "legend": [ { "properties": { "show": { "expr": { "Literal": { "Value": "false" } } } } } ]
            }
          }
      powerbi_svg_dax:
        applicable: false
        reason: two scenario lines (AC + PL) in a single table cell are too cramped to read
        use: powerbi_native (two Y measures) or deneb_vegalite
      deneb_vegalite:
        ext: json
        template: |
          {
            "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
            "padding": { "right": 36 },
            "data": {
              "name": "dataset"
            },
            "encoding": {
              "x": {
                "field": "{{field_date}}",
                "type": "temporal",
                "axis": {
                  "title": null,
                  "grid": false,
                  "ticks": false,
                  "domainColor": "{{col_ac}}"
                }
              }
            },
            "layer": [
              { "transform": [ { "filter": "isValid(datum['{{fc_lo_field}}']) && isValid(datum['{{fc_hi_field}}'])" } ],
                "mark": { "type": "area", "interpolate": "monotone", "color": "{{col_ac}}", "opacity": 0.12, "fillOpacity": 1, "description": "Prognoseband {{label_fc_lo}}-{{label_fc_hi}}" },
                "encoding": { "y": { "field": "{{fc_lo_field}}", "type": "quantitative", "axis": null, "scale": { "zero": true } }, "y2": { "field": "{{fc_hi_field}}" } } },
              { "transform": [ { "filter": "isValid(datum['{{fc_hi_field}}'])" }, { "window": [ { "op": "row_number", "as": "_bh" } ], "sort": [ { "field": "{{field_date}}", "order": "descending" } ] }, { "filter": "datum._bh == 1" } ],
                "mark": { "type": "text", "text": "{{label_fc_hi}}", "align": "right", "dx": -2, "dy": -7, "fontSize": 10, "color": "{{col_ink}}" },
                "encoding": { "y": { "field": "{{fc_hi_field}}", "type": "quantitative", "axis": null } } },
              { "transform": [ { "filter": "isValid(datum['{{fc_lo_field}}'])" }, { "window": [ { "op": "row_number", "as": "_bl" } ], "sort": [ { "field": "{{field_date}}", "order": "descending" } ] }, { "filter": "datum._bl == 1" } ],
                "mark": { "type": "text", "text": "{{label_fc_lo}}", "align": "right", "dx": -2, "dy": 11, "fontSize": 10, "color": "{{col_ink}}" },
                "encoding": { "y": { "field": "{{fc_lo_field}}", "type": "quantitative", "axis": null } } },
              { "transform": [ { "filter": "isValid(datum['{{event_field}}']) && datum['{{event_field}}'] != '' && datum['{{event_field}}'] != '(Blank)'" } ],
                "mark": { "type": "rule", "color": "{{col_ref}}", "strokeWidth": 1, "description": "Ereignis" },
                  "encoding": { "tooltip": { "field": "{{event_field}}", "type": "nominal" } } },
              { "transform": [ { "filter": "isValid(datum['{{event_field}}']) && datum['{{event_field}}'] != '' && datum['{{event_field}}'] != '(Blank)'" }, { "window": [ { "op": "row_number", "as": "_ev" } ], "sort": [ { "field": "{{field_date}}", "order": "ascending" } ] } ],
                "mark": { "type": "text", "align": "center", "baseline": "bottom", "dy": -19, "fontSize": 11, "color": "{{col_ref}}", "description": "Ereignisnummer" },
                "encoding": { "y": { "value": 0 }, "text": { "field": "_ev", "type": "nominal" }, "tooltip": { "field": "{{event_field}}", "type": "nominal" } } },
              {
                "mark": {
                  "type": "line",
                  "interpolate": "monotone",
                  "color": "{{col_ac}}",
                  "opacity": 0.5,
                  "strokeWidth": 1.5,
                  "point": {
                    "filled": true,
                    "color": "{{col_ac}}",
                    "opacity": 0.5,
                    "size": 20
                  }
                },
                "encoding": {
                  "y": {
                    "field": "{{py_field}}",
                    "type": "quantitative",
                    "axis": null,
                    "scale": {
                      "zero": true
                    }
                  }
                }
              },
              {
                "transform": [ { "filter": "isValid(datum['{{py_field}}'])" }, { "window": [ { "op": "row_number", "as": "_q" } ], "sort": [ { "field": "{{field_date}}", "order": "descending" } ] }, { "filter": "datum._q == 1" } ],
                "mark": { "type": "text", "text": "{{label_py}}", "align": "left", "baseline": "middle", "dx": 8, "color": "{{col_ink}}", "description": "Serienlabel" },
                "encoding": { "y": { "field": "{{py_field}}", "type": "quantitative", "axis": null } }
              },
              {
                "transform": [ { "filter": "isValid(datum['{{plan_field}}'])" }, { "window": [ { "op": "row_number", "as": "_pl" } ], "sort": [ { "field": "{{field_date}}", "order": "descending" } ] }, { "filter": "datum._pl == 1" } ],
                "mark": { "type": "text", "text": "{{label_pl}}", "align": "left", "baseline": "middle", "dx": 8, "color": "{{col_ink}}", "description": "Serienlabel" },
                "encoding": { "y": { "field": "{{plan_field}}", "type": "quantitative", "axis": null } }
              },
              {
                "mark": {
                  "type": "line",
                  "interpolate": "monotone",
                  "color": "{{col_ac}}",
                  "strokeWidth": 1.5,
                  "point": {
                    "filled": false,
                    "fill": "white",
                    "stroke": "{{col_ac}}",
                    "size": 30
                  }
                },
                "encoding": {
                  "y": {
                    "field": "{{plan_field}}",
                    "type": "quantitative",
                    "axis": null,
                    "scale": {
                      "zero": true
                    }
                  }
                }
              },
              {
                "mark": {
                  "type": "line",
                  "interpolate": "monotone",
                  "color": "{{col_ac}}",
                  "strokeWidth": 1.5,
                  "point": {
                    "filled": true,
                    "color": "{{col_ac}}",
                    "size": 30
                  }
                },
                "encoding": {
                  "y": {
                    "field": "{{field}}",
                    "type": "quantitative",
                    "axis": null,
                    "scale": {
                      "zero": true
                    }
                  }
                }
              },
              {
                "mark": {
                  "type": "line",
                  "interpolate": "monotone",
                  "color": "{{col_ac}}",
                  "strokeWidth": 1.5,
                  "strokeDash": [3, 2]
                },
                "encoding": {
                  "y": {
                    "field": "{{fc_field}}",
                    "type": "quantitative",
                    "axis": null,
                    "scale": {
                      "zero": true
                    }
                  }
                }
              },
              {
                "transform": [
                  { "filter": "isValid(datum['{{field}}'])" },
                  { "joinaggregate": [ { "op": "min", "field": "{{field}}", "as": "_min" }, { "op": "max", "field": "{{field}}", "as": "_max" }, { "op": "count", "as": "_n" } ] },
                  { "window": [ { "op": "row_number", "as": "_i" } ], "sort": [ { "field": "{{field_date}}", "order": "ascending" } ] },
                  { "calculate": "datum['{{field}}'] == datum._min ? datum._i : null", "as": "_at_min" },
                  { "calculate": "datum['{{field}}'] == datum._max ? datum._i : null", "as": "_at_max" },
                  { "calculate": "datum._i == 1 ? datum['{{field}}'] : null", "as": "_at_first" },
                  { "calculate": "datum._i == datum._n ? datum['{{field}}'] : null", "as": "_at_last" },
                  { "joinaggregate": [ { "op": "min", "field": "_at_min", "as": "_imin" }, { "op": "min", "field": "_at_max", "as": "_imax" }, { "op": "max", "field": "_at_first", "as": "_v1" }, { "op": "max", "field": "_at_last", "as": "_vn" } ] },
                  { "calculate": "max(abs(datum._max), abs(datum._min), 1e-9)", "as": "_top" },
                  { "calculate": "width / max(datum._n - 1, 1)", "as": "_step" },
                  { "calculate": "abs(datum._imax - 1) * datum._step < 34 && abs(datum._max - datum._v1) / datum._top * height < 14 || abs(datum._n - datum._imax) * datum._step < 34 && abs(datum._max - datum._vn) / datum._top * height < 14", "as": "_max_hidden" },
                  { "calculate": "abs(datum._imin - 1) * datum._step < 34 && abs(datum._min - datum._v1) / datum._top * height < 14 || abs(datum._n - datum._imin) * datum._step < 34 && abs(datum._min - datum._vn) / datum._top * height < 14 || !datum._max_hidden && abs(datum._imin - datum._imax) * datum._step < 34 && abs(datum._min - datum._max) / datum._top * height < 14", "as": "_min_hidden" },
                  { "filter": "datum._n <= 6 || datum._i == 1 || datum._i == datum._n || datum._i == datum._imax && !datum._max_hidden || datum._i == datum._imin && !datum._min_hidden" }
                ],
                "mark": {
                  "type": "text",
                  "color": "{{col_ink}}",
                  "dy": -10
                },
                "encoding": {
                  "y": {
                    "field": "{{field}}",
                    "type": "quantitative"
                  },
                  "text": {
                    "field": "{{field}}",
                    "type": "quantitative",
                    "format": ",.1~f"
                  }
                }
              }
            ]
          }
      web_recharts:
        ext: jsx
        template: |
          <LineChart data={data} width={640} height={220}>
            <XAxis dataKey="{{field_date}}" />
            <YAxis domain={['auto', 'auto']} />
            <Line type="monotone" dataKey="{{py_field}}" stroke="{{col_ac}}" strokeOpacity={0.5} strokeWidth={1.5} dot={false} />
            <Line type="monotone" dataKey="{{plan_field}}" stroke="{{col_pl}}" strokeWidth={1.5} strokeDasharray="4 3" dot={false} />
            <Line type="monotone" dataKey="{{field}}" stroke="{{col_line}}" strokeWidth={2.5} dot={false} />
          </LineChart>

  print_safe:
    note: "CVAA / print-safe: the colour-blind-safe blue/orange variance pair replaces red/green so direction survives colour-vision-deficiency and greyscale print (always pair with an icon or sign)."
    param_overrides:
      col_end: "#F7630C"

determinism:
  golden_dir: golden
  notes: "Pure {{param}} fill; golden-frozen. Event rule + label and the P10-P90 band (2.1.0) exist only on the Vega track: the native lineChart has no data-driven event lines and no percentile band (Meridian BO, 22.10.2026). Native uses the verified y1AxisReferenceLine; Vega layers line+rule+last-point. IBCS profile plots plan as a scenario line (native = 2nd Y measure), FC dashed and PY grey as 3rd/4th Y measure, styled per series by metadata selector (BO-116, BO-052)."
