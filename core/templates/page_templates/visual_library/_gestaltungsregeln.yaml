# Visual Library — Gestaltungsregeln (Regeln als Felder, nicht als Prosa)
# ------------------------------------------------------------------
# Was ein Chart zeigt, entscheidet das Idiom (purpose); wie es gezeichnet wird, entscheiden das Profil
# (_notation_profiles.yaml) und diese Regeln. Jede Regel trägt ihre Schwelle als Feld, ihren Stand als
# `umsetzung.status` und ihren Test als Pfad; `tooling/visual_library/gestaltung.py` liest die Felder,
# `tooling/visual_library/tests/test_gestaltungsregeln.py` prüft Felder, Idiome und Goldens dagegen.
#
# Quelle der Regeln: Entscheidungen Florian Haferkorn vom 17.10.2026 zur Vergleichsseite der Visual-Recherche
# (W1 Eckenradius, W2 Beschriftung gegen Gitter, W3 Zebra, Achsen/Nullbasis, Linienverlauf) und der
# Musterkatalog derselben Recherche (Kürzel B3, B4, T3 … in `muster`). Bericht der Runde:
# Meridian docs/runden/2026-10-17_Bericht_visuals.md. Fortgeschrieben in der Runde rubrikpaket (22.10.2026, Meridian
# BO-412 bis BO-441): Muster des Katalogs als Template-Eigenschaften mit Relationstest
# (`tests/test_gestaltungsmuster.py`), Entscheidung Florian 22.10.2026 zu W11/W12 (Regeln serienlabel, abweichungspille).
#
# umsetzung.nativ (optional): Stand in Power BI nativ, wenn die Vega-Spuren umgesetzt sind und nur die Messung im
# Desktop oder Dienst fehlt — `tenant_gebunden` (Meridian D-763): Code und Tor stehen, die Messung nicht.
#
# paket (D-832 Meridian, Florian 28.10.2026): ob @microsoft/fabric-visuals dieselbe Eigenschaft selbst setzt —
#   erzwingt   das Paket setzt sie immer; die Visual Library setzt sie ausdrücklich, damit das Profil gewinnt
#   teilweise  das Paket greift in einem Teil (nach dem Config-Merge, nur per Capability-Flag abschaltbar)
#   nein       das Paket berührt sie nicht
#   unklar     nicht gegen das Paket gelesen
# paket_beleg nennt die Stelle im Paket oder den Grund für unklar.
#
# umsetzung.status:
#   umgesetzt   die Regel wirkt in den genannten Spuren, ein Test hält sie
#   teilweise   wirkt in einem Teil der Spuren; `offen` nennt den Rest
#   offen       als Feld festgehalten, wirkt noch nicht; `offen` nennt den Grund
# Ein offener Rest steht in Meridian `meridian/studio/bewusst_offen.json` mit diesem Pfad und der Regel-ID in
# `quelle` (meridian/tests/test_gestaltungsregeln_spiegel.py).
# Externe Formulierung bei IBCS: „folgt der IBCS-Notation“, nie „IBCS-konform“ (IBCS® ist eine Marke).

schema_version: 1

regeln:

  eckenradius:
    paket: erzwingt
    paket_beleg: "Basis-Theme bar.cornerRadiusEnd 4 (chunk-4534POHG.js:2072), configVegaLite wird darüber gemergt; ibcs setzt cornerRadiusEnd 0 ausdrücklich, gemessen im Kompilat (test_ibcs_profile). fabric-visuals 5.0.0 dist, gelesen 27.10.2026 (Meridian Bericht 2026-10-27_Bericht_fabric-visuals-5)"
    muster: [B3]
    entscheidung: "W1 (Florian 17.10.2026): Radius je Mandant im Design Pack wählbar"
    regel: >
      Den Radius der Balkenenden wählt das Design Pack je Mandant (`chart.bar_corner_radius`, Vega-Lite
      `bar.cornerRadiusEnd`). Das Profil ibcs erzwingt 0 (keine abgerundeten Datenenden, SI 2.1); der Radius am
      Container bleibt Sache des Packs (border.radius).
    pack_feld: chart.bar_corner_radius
    vegalite: bar.cornerRadiusEnd
    profil_max: {ibcs: 0}
    umsetzung:
      status: umgesetzt
      wo: ["_notation_profiles.yaml ibcs vegalite_config bar.cornerRadius 0 und bar.cornerRadiusEnd 0 (gegen den Paket-Default)",
           "Meridian Cockpit (visuals.pack_chart_config) und HTML-Vorschau lesen chart.bar_corner_radius",
           "Deneb (Power BI Variante C): render.deneb_config(profil, chart.bar_corner_radius) setzt bar.cornerRadiusEnd"]
      test: [tooling/visual_library/tests/test_gestaltungsregeln.py]

  beschriftung_gitter:
    paket: teilweise
    paket_beleg: "axis.labelOverlap wird auf allen Achsen überschrieben (disableDynamicAxisLabelOverlap). fabric-visuals 5.0.0 dist, gelesen 27.10.2026 (Meridian Bericht 2026-10-27_Bericht_fabric-visuals-5)"
    muster: [B4]
    entscheidung: "W2 (Florian 17.10.2026): Datenbeschriftung an -> Gitter und Werteachse aus; aus -> Wertegitter an"
    regel: >
      Ein Chart, dessen Werte direkt beschriftet sind, zeigt weder Wertegitter noch Werteachse. Ohne Beschriftung
      zeigt er das Wertegitter. Kategorie- und Zeitachsen tragen nie ein Gitter. „Werteachse“ heißt je Ausrichtung
      die quantitative Achse: y bei Säulen, Linien und Wasserfällen, x bei liegenden Balken.
    schwelle_kategorien: 10        # beschriftet, solange weniger als 10 Kategorien gezeichnet werden
    signal: _beschriftet           # Vega-Lite-Parameter der Templates: _n_daten > 0 && _n_daten < 10
    zaehler: "max(length(data('dataset')), length(data('source_0')))"
    zaehler_grund: >
      Deneb benennt die Daten `dataset`; die Cockpit-Shell (fabric-visuals VegaVisual, eine Tabelle) bettet sie
      unbenannt ein (`data: {values}`, gelesen im Paketquelltext 17.10.2026), Vega-Lite nennt sie dann `source_0`.
      Findet der Zähler keine der beiden Quellen, ist er 0: dann keine Beschriftung und Werteachse an, nie beides aus.
    gitter_nach_achsentyp: {quantitativ: an, diskret: aus, zeit: aus}
    aus_mechanik: "tickCount 0 auf der Werteachse (Gitter, Ticks und Beschriftung zugleich); labelOpacity als Ausdruck setzt die Überlappungsprüfung von Vega wieder auf 1 (gemessen 17.10.2026, vl_convert 1.9.0)"
    umsetzung:
      status: umgesetzt
      wo: ["_notation_profiles.yaml: axisDiscrete/axisTemporal statt axisX (Gitter je Achsentyp)",
           "bar_ranking, bar_absolute, column_time, variance_pin, waterfall_buildup, waterfall_pvm, waterfall_variance (deneb_vegalite)",
           "Meridian chart_grenzen.json je Ausrichtung",
           "powerbi_native: beschriftete Visuals (bar_ranking, column_time@ibcs) schalten valueAxis.show und gridlineShow ab; Meridian PBI-Theme lässt das Wertegitter liegender Balken an (BO-441)"]
      test: [tooling/visual_library/tests/test_gestaltungsregeln.py, tooling/visual_library/tests/test_gestaltungsmuster.py]

  zebra:
    paket: unklar
    paket_beleg: "nicht gegen das Paket gelesen (Regelabgleich 27.10.2026 deckte nur die Überschneidungen ab)"
    muster: [T3]
    entscheidung: "W3 (Florian 17.10.2026): Zebra ab 10 Zeilen und 4 Spalten, #F3F3F3, aus bei Heatmap und Datenbalken"
    regel: >
      Tabellen ab 10 Zeilen und 4 Spalten bekommen Zebra-Streifen. Zellen, deren Farbe einen Wert trägt
      (Heatmap, Datenbalken), bekommen keine. Die Streifenfarbe ist ein Token, kein Markenwert.
    min_zeilen: 10
    min_spalten: 4
    farbe: "#F3F3F3"
    farbe_dunkel: "rgba(255, 255, 255, 0.05)"
    token: color_semantics.surface.zebra
    aus_bei: [heatmap, datenbalken]
    umsetzung:
      status: teilweise
      wo: ["color_semantics.yaml surface.zebra", "Meridian Cockpit-Tabelle (DataGrid) liest components.table.zebra (BO-365)"]
      test: [tooling/visual_library/tests/test_gestaltungsregeln.py]
      offen: "PBIR tableEx/pivotTable: Zebra hängt an der Zeilenzahl, die erst zur Laufzeit feststeht; nativ nur als festes Streifenmuster"

  werteachse_basis:
    paket: teilweise
    paket_beleg: "applyScaleZero und applyAxisBounds (nice 5) nach dem Config-Merge; abschaltbar nur per disableNonZeroQuantitativeBaseline/disableNiceAxisBounds. fabric-visuals 5.0.0 dist, gelesen 27.10.2026 (Meridian Bericht 2026-10-27_Bericht_fabric-visuals-5); gemessen headless 28.10.2026 (Meridian BO-560): Achse 120 bei Höchstwert 103, ibcs-Linie ab 950. Abgeschaltet: disableNiceAxisBounds in house_default (alle Profile), disableNonZeroQuantitativeBaseline in ibcs"
    muster: [K8, L5]
    entscheidung: "Achsen (Florian 17.10.2026, Empfehlung nach Best Practice, gilt bis Widerspruch)"
    regel: >
      Balken, Säulen und Flächen beginnen immer bei 0 (die Länge kodiert den Wert). Linien beginnen bei 0, außer die
      Spannweite der Daten einschließlich Ziel- und Alarmlinie ist kleiner als 25 % des Betragsmaximums (Quoten
      wie OTIF): dann beginnt die Achse knapp unter dem kleinsten Wert, schließt Ziel und Alarm ein und trägt eine
      sichtbare Achsenbruch-Markierung. Sparklines skalieren datenangepasst ohne Achse, mit Planband als Referenz.
      Indexierte Reihen beziehen sich auf die Basis 100.
    feld: y_basis                  # je Idiom, Werte unten
    klassen:
      "null": "Werteachse immer ab 0 (Länge kodiert den Wert)"
      null_oder_angepasst: "ab 0; unter der Spannweitenschwelle angepasst mit Achsenbruch"
      angepasst: "datenangepasst ohne Achse (Sparkline), Planband als Referenz"
      index: "Basis 100 (indexierte Daten)"
      position: "Position auf gemeinsamer Skala ohne Nullbezug (Streuung, Verteilung, Spannweite)"
      entfaellt: "keine Werteachse (Tabelle, Karte, Anteil, Fluss)"
    schwelle_spannweite: 0.25      # Spannweite / Betragsmaximum, strikt kleiner
    abstand_unten: 0.1             # Achse beginnt 10 % der Spannweite unter dem kleinsten Wert (mind. 1 % des Maximums)
    achsenbruch: {zeichen: "≈", farbe: "#605E5C"}
    umsetzung:
      status: teilweise
      wo: ["line (house_default, print_safe) und slope: deneb_vegalite, fabric_app, html_vegalite",
           "small_multiples: eine Werteachse für alle Facetten, ab 0 oder angepasst mit Achsenbruch je Facette",
           "Längen-Idiome und Abweichungen (deviation_bar, variance_pin, waterfall_*): ab 0, test_zero_baseline_all_profiles.py"]
      test: [tooling/visual_library/tests/test_gestaltungsregeln.py, tooling/visual_library/tests/test_zero_baseline_all_profiles.py]
      offen: "powerbi_native: valueAxis.start als Measure (Achsenbasis im semantischen Modell, im Desktop zu messen); Planband der Sparklines folgt der Regel zielband (D-795); IBCS-Linie bleibt nach CH 1.1 ab 0"

  linienverlauf:
    paket: unklar
    paket_beleg: "nicht gegen das Paket gelesen (Regelabgleich 27.10.2026 deckte nur die Überschneidungen ab)"
    muster: [L1, L2]
    entscheidung: "Achsen (Florian 17.10.2026): Linien monoton geglättet ohne Punkte; Nachtrag zu Meridian D-685"
    regel: >
      Linien verlaufen monoton kubisch (Vega-Lite `interpolate: monotone`, wie d3 curveMonotoneX): die Kurve läuft
      durch jeden Wert und schießt nie über. Keine Punkte je Wert; erhalten bleiben der Endpunkt (Urteil am
      letzten Ist), der Hover-Ring und die Szenariomarker der IBCS-Notation (UN 3.2). Ist-Linie 2 px.
    interpolation: monotone
    powerbi_native: linear         # bis zur Messung (BO-423): kein Golden setzt lineChartType smooth (Tor test_gestaltungsmuster)
    punkte_je_wert: false
    ist_strich_px: 2
    umsetzung:
      status: teilweise
      wo: ["line (alle Profile), indexed_line, small_multiples: deneb_vegalite; web_recharts war schon monotone"]
      test: [tooling/visual_library/tests/test_gestaltungsregeln.py]
      offen: "Power BI nativ kennt nur linear, smooth und step (lineStyles.lineChartType); ob smooth monoton verläuft, ist nicht gemessen und nur im Desktop messbar (Meridian BO-423)"
      nativ: tenant_gebunden

  markenkontrast:
    paket: unklar
    paket_beleg: "nicht gegen das Paket gelesen (Regelabgleich 27.10.2026 deckte nur die Überschneidungen ab)"
    muster: [A1, N1, N5, K4, S5]
    entscheidung: "Top 15 Rang 1 (Musterkatalog 17.10.2026)"
    regel: >
      Marken, die eine Aussage tragen (Ziel-, Plan-, Basis-, Null- und Vergleichslinien, Sparklines, Startpunkte),
      erreichen auf Weiß mindestens 3:1 (WCAG 1.4.11). Referenzmarken in #605E5C, Kontextmarken in #8C8C8C.
      Flächen hinter Text oder Daten (Spuren, Bänder, Stiele, Tönungen, Szenario-Füllungen der IBCS-Notation)
      sind Dekor und stehen mit Grund in `ausnahmen`.
    min_kontrast: 3.0
    farben: {referenz: "#605E5C", kontext: "#8C8C8C"}
    token: {referenz: color_semantics.marks.reference, kontext: color_semantics.marks.context}
    ausnahmen:
      deviation_bar: {col_track: dekor_spur}
      bullet: {col_band1: dekor_band, col_band2: dekor_band, col_band3: dekor_band}
      lollipop: {col_stem: dekor_stiel}
      dumbbell: {col_stem: dekor_stiel}
      kpi_card_bullet: {col_track: dekor_spur}
      matrix_delta_pill: {tint_pos: toenung_hinter_text, tint_neg: toenung_hinter_text}
      bar_ranking: {col_py: szenario_flaeche_ibcs}
      multi_tier_column: {col_py: szenario_flaeche}
      line: {col_band: dekor_zielband}
      kpi_card_spark: {col_band: dekor_zielband}
      matrix_sparkline: {col_band: dekor_zielband, col_rule: dekor_haarlinie}
      matrix_evidence: {col_rule: dekor_haarlinie}
      matrix_pivot: {col_rule: dekor_haarlinie}
    gruende:
      dekor_spur: "Spur hinter dem Wertbalken; der Wert liegt im Balken"
      dekor_band: "Qualitativer Bereich hinter dem Balken (Bullet-Grafik)"
      dekor_stiel: "Verbinder zwischen zwei Marken, die selbst ≥ 3:1 sind"
      toenung_hinter_text: "Hintergrund einer Zahl, die selbst ≥ 4,5:1 hat"
      szenario_flaeche_ibcs: "Vorjahr als hellere Fläche (IBCS UN 3.2); der Wert steht als Beschriftung daneben"
      szenario_flaeche: "Vorjahr als hellere Säule hinter dem Ist; der Wert steht als Beschriftung daneben"
      dekor_zielband: "Zielkorridor als Band hinter der Linie (Regel zielband); die Linie trägt die Aussage"
      dekor_haarlinie: "Zeilentrenner einer Tabelle (Regel tabellen_linien); WCAG 1.4.11 nimmt Gitterlinien aus"
    umsetzung:
      status: umgesetzt
      wo: ["line, bar_ranking, indexed_line, slope, dumbbell, kpi_card_spark, kpi_card_sparkbar (canonical_params)"]
      test: [tooling/visual_library/tests/test_gestaltungsregeln.py]

  kpi_abweichung_richtung:
    paket: unklar
    paket_beleg: "nicht gegen das Paket gelesen (Regelabgleich 27.10.2026 deckte nur die Überschneidungen ab)"
    muster: [K1]
    entscheidung: "Top 15 Rang 2 (Musterkatalog 17.10.2026); Meridian D-720 Wahl 4"
    regel: >
      Die Abweichung einer KPI-Karte färbt nach der Richtung der Kennzahl (`polarity`, nativ `goals.direction` und
      `status.direction`), nie nach dem Vorzeichen. Das Pfeilzeichen zeigt die Richtung der Veränderung.
    umsetzung:
      status: umgesetzt
      wo: ["kpi_card_spark (powerbi_svg_dax, powerbi_native)"]
      test: [tooling/visual_library/tests/test_gestaltungsregeln.py]

  saeulen_neutral:
    paket: unklar
    paket_beleg: "nicht gegen das Paket gelesen (Regelabgleich 27.10.2026 deckte nur die Überschneidungen ab)"
    muster: [S1]
    entscheidung: "Top 15 Rang 5 (Musterkatalog 17.10.2026)"
    regel: "Säulen über die Zeit sind neutral (ink #0F2430); Farbe nur mit Aussage (Hervorhebung, Bewertung)."
    umsetzung:
      status: umgesetzt
      wo: ["column_time canonical_params col_bar"]
      test: [tooling/visual_library/tests/test_gestaltungsregeln.py]

  nulllinie:
    paket: unklar
    paket_beleg: "nicht gegen das Paket gelesen (Regelabgleich 27.10.2026 deckte nur die Überschneidungen ab)"
    muster: [B8]
    entscheidung: "Top 15 Rang 9 (Musterkatalog 17.10.2026)"
    regel: "Die Nulllinie einer Abweichung ist 1,5 px stark und #605E5C (6,46:1); das übrige Gitter bleibt 1 px hell."
    breite_px: 1.5
    farbe: "#605E5C"
    umsetzung:
      status: umgesetzt
      wo: ["deviation_bar, variance_pin, multi_tier_column (deneb_vegalite)"]
      test: [tooling/visual_library/tests/test_gestaltungsregeln.py]

  # --- als Feld festgehalten, noch ohne Wirkung (je mit Grund; Meridian bewusst_offen.json) -------------------

  laufende_periode:
    paket: unklar
    paket_beleg: "nicht gegen das Paket gelesen (Regelabgleich 27.10.2026 deckte nur die Überschneidungen ab)"
    muster: [S2, L4]
    regel: >
      Die laufende, unvollständige Periode ist abgesetzt: als Säule ein Umriss ohne Füllung mit dem Label „laufend“,
      als Linie ein hohler Endpunkt. Die letzte vollständige Periode trägt die Tinte, frühere Säulen das Kontextgrau.
    rolle: current                 # data_slots-Rolle (boolesche Spalte, wahr in der laufenden Periode; Snapshot trend.laufend)
    umriss_px: 1.5
    farben: {letzte: "#0F2430", frueher: "#8C8C8C"}
    label: laufend
    umsetzung:
      status: teilweise
      wo: ["column_time, line: deneb_vegalite, fabric_app, html_vegalite (Rolle current)",
           "Meridian Cockpit-Vorschau liefert die Spalte aus trend.laufend"]
      test: [tooling/visual_library/tests/test_gestaltungsmuster.py]
      offen: "powerbi_native: Umriss je Datenpunkt (dataPoint.borderShow per Regel) und hohler Endpunkt sind nur im Desktop messbar; Live-Abfrage liefert die Spalte noch nicht"
      nativ: tenant_gebunden

  serienlabel:
    paket: teilweise
    paket_beleg: "Legende ab 5 Reihen gekürzt (disableLegendTruncation). fabric-visuals 5.0.0 dist, gelesen 27.10.2026 (Meridian Bericht 2026-10-27_Bericht_fabric-visuals-5); gemessen headless 28.10.2026 (Meridian D-837): Namen auf 100 px gekürzt, Rest als „…N entries“. Abgeschaltet per disableLegendTruncation in house_default, Legende zweispaltig mit labelLimit 170"
    muster: [L3]
    entscheidung: "W11 (Florian 22.10.2026, Meridian BO-432): höchstens vier direkt beschriftete Reihen; BC-CHART-03 und BC-DV-05 gleich"
    regel: "Linien mit 2 bis 4 Reihen tragen ihr Label am Linienende statt einer Legende; ab 5 Reihen Legende."
    max_reihen: 4
    rubrik: [BC-CHART-03, BC-DV-05]   # beide tragen thresholds.direct_labels_max == max_reihen (Test)
    abstand_px: 6
    endwert_abstand_px: 8   # der Endwert der Ist-Linie steht rechtsbündig links über dem letzten Punkt (dx -8); rechts vom Linienende nur Serienlabels (line 2.2.1, Meridian G14 29.10.2026: 'PL' überdeckte den zentrierten Endwert '41,4')
    umsetzung:
      status: teilweise
      wo: ["line (house_default, print_safe, ibcs): Plan, PY, FC am letzten Punkt; deneb_vegalite, fabric_app, html_vegalite",
           "line@ibcs powerbi_native: seriesLabels show, seriesPosition Right, seriesMatchColor; legend aus"]
      test: [tooling/visual_library/tests/test_gestaltungsmuster.py]
      offen: "powerbi_native: seriesLabels ist nur gegen den Formatkatalog geprüft, gerendert erst im Desktop"
      nativ: tenant_gebunden

  abweichungspille:
    paket: unklar
    paket_beleg: "nicht gegen das Paket gelesen (Regelabgleich 27.10.2026 deckte nur die Überschneidungen ab)"
    entscheidung: "W12 (Florian 22.10.2026, Meridian BO-432): die getönte Abweichungspille nur in Ausnahmetabellen; sonst gilt das Verbot aus house_default"
    regel: >
      Abweichungen stehen als Länge und Vorzeichen mit Richtungsfarbe, nie als getönte Pille. Einzige Ausnahme ist die
      Ausnahmetabelle `matrix_delta_pill`: Tönung nur aus color_semantics.severity_tints, die Zahl steht immer darin.
    verboten_in_profil: house_default
    erlaubt_nur_in: [matrix_delta_pill]
    merkmal: "Template-Parameter tint_* oder encoding.severity governed_tint"
    umsetzung:
      status: umgesetzt
      wo: ["_notation_profiles.yaml house_default rules.variance", "matrix_delta_pill (Ausnahmetabelle)"]
      test: [tooling/visual_library/tests/test_gestaltungsmuster.py]

  hoechstbreite:
    paket: unklar
    paket_beleg: "nicht gegen das Paket gelesen (Regelabgleich 27.10.2026 deckte nur die Überschneidungen ab)"
    muster: [B2]
    regel: "Säulen und Balken sind höchstens 24 px dick; bei wenigen Kategorien wächst der Abstand, nicht die Marke. Nicht unter IBCS (UN 3.1 koppelt die Breite an die Kategorie)."
    max_px: 24
    nicht_in_profil: [ibcs]
    umsetzung:
      status: umgesetzt
      wo: ["bar_ranking, bar_absolute, column_time (house_default): deneb_vegalite, fabric_app, html_vegalite"]
      nativ: entfaellt            # kein Feld für eine Höchstbreite im Formatkatalog (preferredCategoryWidth ist ein Mindestmaß)
      test: [tooling/visual_library/tests/test_gestaltungsmuster.py]

  akzent:
    paket: unklar
    paket_beleg: "nicht gegen das Paket gelesen (Regelabgleich 27.10.2026 deckte nur die Überschneidungen ab)"
    muster: [B5]
    regel: "Ohne Ziel: genau eine genannte Kategorie in Tinte, die übrigen in Kontextgrau (#8C8C8C); ohne Angabe alle in Tinte."
    parameter: highlight_category
    farben: {akzent: "#0F2430", rest: "#8C8C8C"}
    umsetzung:
      status: umgesetzt
      wo: ["bar_absolute: deneb_vegalite, fabric_app, html_vegalite (data_values: nur bei gegebenem Wert)"]
      test: [tooling/visual_library/tests/test_gestaltungsmuster.py]

  label_oben:
    paket: unklar
    paket_beleg: "nicht gegen das Paket gelesen (Regelabgleich 27.10.2026 deckte nur die Überschneidungen ab)"
    muster: [B6]
    regel: "Lange Kategorienamen stehen in einer eigenen Zeile über einem schmalen Balken (8 px) statt links an der Achse."
    parameter: label_position     # axis | above
    balken_px: 8
    schwelle_zeichen: null        # Ab welcher Labellänge „above“ gewählt wird, ist nicht gemessen: Leerstelle, der Aufrufer wählt
    umsetzung:
      status: umgesetzt
      wo: ["bar_ranking: deneb_vegalite, fabric_app, html_vegalite"]
      nativ: entfaellt            # kein Formatfeld für ein Kategorielabel über dem Balken
      test: [tooling/visual_library/tests/test_gestaltungsmuster.py]

  vorjahr_ueberlappend:
    paket: unklar
    paket_beleg: "nicht gegen das Paket gelesen (Regelabgleich 27.10.2026 deckte nur die Überschneidungen ab)"
    muster: [B7]
    regel: "Vorjahr als breiterer, hellerer Balken hinter einem schmaleren Ist (60 % der Dicke); beschriftet ist das Ist."
    anteil_ist: 0.6
    umsetzung:
