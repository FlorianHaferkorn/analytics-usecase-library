# Visual Library entry — waterfall_pvm  (schema: _schema.yaml)
id: waterfall_pvm
name: Waterfall bridge (PVM)
purpose: [contribution_to_change]
zone: [analysis]
min_size: {cols: 4, rows: 5}   # grid units — canvas-relative legibility floor (≈395×264px @1280, 592×396px @1920; px derived from layout_grid.yaml)
best_form_for: contribution_to_change
alternatives: [waterfall_buildup, waterfall_variance, waterfall_ibcs]

encoding:
  steps: sequential                 # Plan -> Price -> Volume -> Mix -> Actual
  running_total: connectors
  color: semantic_up_down           # green up / red down
  anchors: solid_totals

anti_patterns:
  - bridge_without_connectors
  - color_beyond_semantic
  - too_many_steps                  # group small drivers into "Other"
  - unlabelled_zoomed_axis

params:
  category: {role: step, type: category, required: true, note: "driver dim with a governed step order"}
  measure:  {role: value, required: true}
  entity:   {role: table, default: _Measures}

tokens:
  col_inc:   color_semantics.positive   # #107C10
  col_dec:   color_semantics.negative   # #A4262C
  col_total: ink                        # #0F2430 anchors

canonical_params:
  entity: "_Measures"
  measure: "PVM Bridge Value"
  category_entity: "dim_pvm_driver"
  category_prop: "Driver"
  field: "driver"
  field_val: "value"
  col_inc: "#107C10"
  col_dec: "#A4262C"
  col_total: "#0F2430"

preview_svg: |
  <svg viewBox="0 0 340 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PVM bridge">
    <rect width="340" height="160" rx="12" fill="#FFFFFF"/>
    <text x="18" y="24" font-family="Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#586472">GM BRIDGE — PLAN to ACTUAL</text>
    <rect x="26" y="60" width="44" height="76" fill="#0F2430"/>
    <rect x="86" y="60" width="44" height="38" fill="#A4262C"/>
    <rect x="146" y="74" width="44" height="24" fill="#107C10"/>
    <rect x="206" y="74" width="44" height="16" fill="#A4262C"/>
    <rect x="266" y="90" width="44" height="46" fill="#0F2430"/>
    <line x1="70" y1="60" x2="86" y2="60" stroke="#94A0AC" stroke-dasharray="3 2"/><line x1="130" y1="98" x2="146" y2="98" stroke="#94A0AC" stroke-dasharray="3 2"/><line x1="190" y1="74" x2="206" y2="74" stroke="#94A0AC" stroke-dasharray="3 2"/><line x1="250" y1="90" x2="266" y2="90" stroke="#94A0AC" stroke-dasharray="3 2"/>
    <text x="48" y="150" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="9" fill="#94A0AC">Plan</text><text x="108" y="150" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="9" fill="#94A0AC">Price</text><text x="168" y="150" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="9" fill="#94A0AC">Vol</text><text x="228" y="150" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="9" fill="#94A0AC">Mix</text><text x="288" y="150" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="9" fill="#94A0AC">Actual</text>
  </svg>

realizations:
  powerbi_native:
    ext: json
    template: |
      {
        "visualType": "waterfallChart",
        "query": { "queryState": {
          "Category": { "projections": [ { "field": { "Column": { "Expression": { "SourceRef": { "Entity": "{{category_entity}}" } }, "Property": "{{category_prop}}" } }, "queryRef": "{{category_entity}}.{{category_prop}}" } ] },
          "Y": { "projections": [ { "field": { "Measure": { "Expression": { "SourceRef": { "Entity": "{{entity}}" } }, "Property": "{{measure}}" } }, "queryRef": "{{entity}}.{{measure}}" } ] }
        } },
        "objects": { "sentimentColors": [ { "properties": {
          "increaseFill": { "solid": { "color": { "expr": { "Literal": { "Value": "'{{col_inc}}'" } } } } },
          "decreaseFill": { "solid": { "color": { "expr": { "Literal": { "Value": "'{{col_dec}}'" } } } } },
          "totalFill": { "solid": { "color": { "expr": { "Literal": { "Value": "'{{col_total}}'" } } } } }
        } } ] }
      }

  powerbi_svg_dax:
    applicable: false
    reason: "a full multi-step bridge with a running total is not a single-cell micro-chart"
    use: "powerbi_native (waterfallChart) or the PowerofBI.IBCS waterfall UDF (daxlib.org)"

  deneb_vegalite:
    ext: json
    template: |
      {
        "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
        "data": { "name": "dataset" },
        "transform": [
          { "window": [ { "op": "sum", "field": "{{field_val}}", "as": "cum" } ], "frame": [null, 0] },
          { "calculate": "datum.cum - datum['{{field_val}}']", "as": "prev" }
        ],
        "mark": { "type": "bar" },
        "encoding": {
          "x": { "field": "{{field}}", "type": "ordinal", "sort": null, "axis": { "title": null } },
          "y": { "field": "prev", "type": "quantitative", "axis": { "title": null } },
          "y2": { "field": "cum" },
          "color": { "condition": { "test": "datum['{{field_val}}'] < 0", "value": "{{col_dec}}" }, "value": "{{col_inc}}" }
        }
      }

  web_recharts:
    ext: jsx
    template: |
      <BarChart data={waterfallData} width={640} height={300}>
        <XAxis dataKey="{{field}}" />
        <YAxis />
        <Bar dataKey="base" stackId="a" fill="transparent" />
        <Bar dataKey="delta" stackId="a">
          {waterfallData.map((e, i) => (
            <Cell key={i} fill={e.delta < 0 ? "{{col_dec}}" : "{{col_inc}}"} />
          ))}
        </Bar>
      </BarChart>

# --- notation profile: IBCS (structural override — SUCCESS labeling discipline) ---
# The house bridge relies on the axis. IBCS labels every column with its value
# (SUCCESS: EXPRESS/CHECK — show the numbers). Structural: adds a label layer/object.
profiles:
  ibcs:
    note: "IBCS bridge: every column carries its value label (IBCS always shows the numbers), vs the house bridge that relies on the axis."
    realizations:
      powerbi_native:
        ext: json
        template: |
          {
            "visualType": "waterfallChart",
            "query": { "queryState": {
              "Category": { "projections": [ { "field": { "Column": { "Expression": { "SourceRef": { "Entity": "{{category_entity}}" } }, "Property": "{{category_prop}}" } }, "queryRef": "{{category_entity}}.{{category_prop}}" } ] },
              "Y": { "projections": [ { "field": { "Measure": { "Expression": { "SourceRef": { "Entity": "{{entity}}" } }, "Property": "{{measure}}" } }, "queryRef": "{{entity}}.{{measure}}" } ] }
            } },
            "objects": {
              "sentimentColors": [ { "properties": {
                "increaseFill": { "solid": { "color": { "expr": { "Literal": { "Value": "'{{col_inc}}'" } } } } },
                "decreaseFill": { "solid": { "color": { "expr": { "Literal": { "Value": "'{{col_dec}}'" } } } } },
                "totalFill": { "solid": { "color": { "expr": { "Literal": { "Value": "'{{col_total}}'" } } } } }
              } } ],
              "labels": [ { "properties": { "show": { "expr": { "Literal": { "Value": "true" } } } } } ]
            }
          }
      deneb_vegalite:
        ext: json
        template: |
          {
            "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
            "data": { "name": "dataset" },
            "transform": [
              { "window": [ { "op": "sum", "field": "{{field_val}}", "as": "cum" } ], "frame": [null, 0] },
              { "calculate": "datum.cum - datum['{{field_val}}']", "as": "prev" }
            ],
            "encoding": { "x": { "field": "{{field}}", "type": "ordinal", "sort": null, "axis": { "title": null } } },
            "layer": [
              { "mark": { "type": "bar" }, "encoding": { "y": { "field": "prev", "type": "quantitative", "axis": { "title": null } }, "y2": { "field": "cum" }, "color": { "condition": { "test": "datum['{{field_val}}'] < 0", "value": "{{col_dec}}" }, "value": "{{col_inc}}" } } },
              { "mark": { "type": "text", "dy": -6, "fontWeight": "bold", "color": "{{col_total}}" }, "encoding": { "y": { "field": "cum", "type": "quantitative" }, "text": { "field": "{{field_val}}", "type": "quantitative", "format": ".0f" } } }
            ]
          }
      web_recharts:
        ext: jsx
        template: |
          <BarChart data={waterfallData} width={640} height={300}>
            <XAxis dataKey="{{field}}" />
            <YAxis />
            <Bar dataKey="base" stackId="a" fill="transparent" />
            <Bar dataKey="delta" stackId="a">
              {waterfallData.map((e, i) => (
                <Cell key={i} fill={e.delta < 0 ? "{{col_dec}}" : "{{col_inc}}"} />
              ))}
              <LabelList dataKey="delta" position="top" />
            </Bar>
          </BarChart>

  print_safe:
    note: "CVAA / print-safe: the colour-blind-safe blue/orange variance pair replaces red/green so direction survives colour-vision-deficiency and greyscale print (always pair with an icon or sign)."
    param_overrides:
      col_inc: "#0078D4"
      col_dec: "#F7630C"

determinism:
  golden_dir: golden
  notes: "Vega uses a window running-sum (prev/cum) as the honest bridge; Recharts needs a precomputed {base, delta} per step. SVG-DAX n/a (full chart)."
