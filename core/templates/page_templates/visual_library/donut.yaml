# Visual Library entry — donut  (schema: _schema.yaml)
id: donut
name: Donut
version: "1.1.0"
status: active        # active | deprecated | experimental
purpose: [part_to_whole]
zone: [analysis]
min_size: {cols: 4, rows: 4}   # grid units — canvas-relative legibility floor (≈395×208px @1280, 592×312px @1920; px derived from layout_grid.yaml)
best_form_for: part_to_whole
alternatives: [stacked_100]

encoding:
  theta: quantitative               # angle = share
  color: category_content_reference
  guard: max_3_segments             # <= 3 parts (IBCS 2.0 EX 2.1, S. 136); else use a sorted bar

anti_patterns:
  - pie_or_donut_gt_4               # governed deny above 3 segments (id kept stable, see _anti_patterns.yaml)
  - many_thin_slivers
  - 3d_or_exploded

params:
  category: {role: category, type: category, required: true, max: 3}
  value:    {role: value, required: true}
  entity:   {role: table, default: _Measures}

data_fit:
  category: {type: category, min: 2, max: 3, on_violation: pie_or_donut_gt_4}
  value: {min: 1, max: 1}

tokens:
  col_1: brand.primary              # #0078D4
  col_2: brand.teal                 # #008575
  col_3: brand.coral                # #EF6950

# data column slots of the Vega-Lite track: which column role fills which {{param}} (A-31 R4)
data_slots:
  field_cat: {role: category, required: true}
  field_val: {role: value, required: true}

canonical_params:
  entity: "_Measures"
  measure: "Net Sales Amount"
  category_entity: "dim_product"
  category_prop: "Category"
  field_cat: "category"
  field_val: "sales"
  col_1: "#0078D4"
  col_2: "#008575"
  col_3: "#EF6950"

preview_svg: |
  <svg viewBox="0 0 340 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Donut">
    <rect width="340" height="150" rx="12" fill="#FFFFFF"/>
    <text x="20" y="26" font-family="Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#586472">NET SALES SHARE</text>
    <g transform="rotate(-90 96 92)">
      <circle cx="96" cy="92" r="40" fill="none" stroke="#0078D4" stroke-width="22" stroke-dasharray="126 251"/>
      <circle cx="96" cy="92" r="40" fill="none" stroke="#008575" stroke-width="22" stroke-dasharray="75 251" stroke-dashoffset="-126"/>
      <circle cx="96" cy="92" r="40" fill="none" stroke="#EF6950" stroke-width="22" stroke-dasharray="50 251" stroke-dashoffset="-201"/>
    </g>
    <rect x="176" y="66" width="10" height="10" fill="#0078D4"/><text x="194" y="75" font-family="Segoe UI,sans-serif" font-size="11" fill="#586472">Fashion 50%</text>
    <rect x="176" y="88" width="10" height="10" fill="#008575"/><text x="194" y="97" font-family="Segoe UI,sans-serif" font-size="11" fill="#586472">Home 30%</text>
    <rect x="176" y="110" width="10" height="10" fill="#EF6950"/><text x="194" y="119" font-family="Segoe UI,sans-serif" font-size="11" fill="#586472">Electro 20%</text>
  </svg>

realizations:
  powerbi_native:
    ext: json
    template: |
      {
        "visualType": "donutChart",
        "query": { "queryState": {
          "Category": { "projections": [ { "field": { "Column": { "Expression": { "SourceRef": { "Entity": "{{category_entity}}" } }, "Property": "{{category_prop}}" } }, "queryRef": "{{category_entity}}.{{category_prop}}" } ] },
          "Y": { "projections": [ { "field": { "Measure": { "Expression": { "SourceRef": { "Entity": "{{entity}}" } }, "Property": "{{measure}}" } }, "queryRef": "{{entity}}.{{measure}}" } ] }
        } }
      }

  powerbi_svg_dax:
    applicable: false
    reason: "arc-path geometry in DAX is impractical"
    use: "the DaxLib.SVG donut UDF (daxlib.org), or powerbi_native (donutChart) / Deneb"

  deneb_vegalite:
    ext: json
    template: |
      {
        "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
        "data": { "name": "dataset" },
        "mark": { "type": "arc", "innerRadius": 50 },
        "encoding": {
          "theta": { "field": "{{field_val}}", "type": "quantitative" },
          "color": { "field": "{{field_cat}}", "type": "nominal", "scale": { "range": ["{{col_1}}", "{{col_2}}", "{{col_3}}"] }, "legend": { "title": null } }
        }
      }

  web_recharts:
    ext: jsx
    template: |
      <PieChart width={280} height={280}>
        <Pie data={data} dataKey="{{field_val}}" nameKey="{{field_cat}}" innerRadius={60} outerRadius={100}>
          {data.map((e, i) => (
            <Cell key={i} fill={["{{col_1}}", "{{col_2}}", "{{col_3}}"][i % 3]} />
          ))}
        </Pie>
      </PieChart>

determinism:
  golden_dir: golden
  notes: "<= 3 segments (governed, IBCS 2.0 EX 2.1); series colours from the brand palette. SVG-DAX n/a (arc paths)."
