# Visual Library entry — matrix_sparkline  (schema: _schema.yaml)
id: matrix_sparkline
name: Matrix column · sparkline
version: "2.0.0"   # 2.0.0 (22.10.2026, MAJOR): gemeinsame Skala der Spalte als Standard (T6, SP1), erster/letzter Punkt markiert (SP2), Lücken als Feld (SP6), Zielband (SP5)
status: active        # active | deprecated | experimental
purpose: [evidence_detail]
zone: [detail]
min_size: {cols: 5, rows: 4}   # grid units — the HOST tableEx/matrix floor (the cell chart is per-row); px derived from layout_grid.yaml
best_form_for: null
alternatives: [line, matrix_evidence]
y_basis: "angepasst"    # Gestaltungsregel werteachse_basis (_gestaltungsregeln.yaml)
werteachse: y           # quantitative Achse: x liegend, y stehend, xy, keine (Regel beschriftung_gitter)

encoding:
  trend: sparkline_line             # a per-row micro trend over time, in the cell
  scope: shared                     # one scale for the whole column (min/max over ALLSELECTED rows); per_row only with reference line + hint (T6, SP1)
  markers: first_hollow_last_ink    # SP2: shape, no number in a cell
  gaps: break                       # SP6: break | connect | zero

anti_patterns:
  - axis_labels_in_a_sparkline      # a cell sparkline is context, not a labelled chart
  - line_when_periods_are_discrete

params:
  measure:   {role: value, required: true}
  category:  {role: row, type: category, required: true}
  date:      {role: axis, type: temporal, required: true}
  entity:    {role: table, default: _Measures}

tokens:
  col_rule:  border.default           # #E1DFDD horizontal hairline (T2, Gestaltungsregel tabellen_linien)
  col_line: ink                      # #0F2430 trend

canonical_params:
  col_rule: "#E1DFDD"             # waagrechte Haarlinie (Gestaltungsregel tabellen_linien, T2)
  entity: "_Measures"
  measure: "Gross Margin %"
  category_entity: "dim_product"
  category_prop: "Category"
  date_entity: "dim_date"
  date_prop: "Date"
  field: "gm"
  col_line: "#0F2430"
  col_ref: "#605E5C"
  col_band: "#ECECEC"
  scale: "shared"                 # shared | per_row (Gestaltungsregel sparkline_skala)
  gaps: "break"                   # break | connect | zero (Gestaltungsregel sparkline_luecken)
  label_per_row: "je Zeile skaliert"   # Hinweis bei per_row und in der nativen Spur (Spaltenkopf)
  band_low_expr: "BLANK ()"       # Zielband: Measure aus target_corridor mit Freigabe, sonst BLANK (D-795)
  band_high_expr: "BLANK ()"

preview_svg: |
  <svg viewBox="0 0 340 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Matrix sparkline column">
    <rect width="340" height="150" rx="12" fill="#FFFFFF"/>
    <text x="20" y="24" font-family="Segoe UI,sans-serif" font-size="11" font-weight="600" fill="#586472">CATEGORY</text><text x="220" y="24" font-family="Segoe UI,sans-serif" font-size="11" font-weight="600" fill="#586472">12-MONTH TREND</text>
    <line x1="16" y1="32" x2="324" y2="32" stroke="#E1E7EE"/>
    <text x="20" y="54" font-family="Segoe UI,sans-serif" font-size="11" fill="#18202A">Fashion</text><polyline fill="none" stroke="#0F2430" stroke-width="1.5" points="220,54 240,50 260,52 280,44 300,48 320,40"/>
    <text x="20" y="86" font-family="Segoe UI,sans-serif" font-size="11" fill="#18202A">Home</text><polyline fill="none" stroke="#0F2430" stroke-width="1.5" points="220,82 240,86 260,80 280,84 300,78 320,82"/>
    <text x="20" y="118" font-family="Segoe UI,sans-serif" font-size="11" fill="#18202A">Electro</text><polyline fill="none" stroke="#0F2430" stroke-width="1.5" points="220,120 240,112 260,116 280,108 300,110 320,104"/>
  </svg>

realizations:
  # ADR-0021 (07.09.2026): native track first where the official catalog carries the
  # capability. Until then this block read `applicable: false, reason: "this is an in-cell
  # column MEASURE (ImageUrl), not a standalone visual"`. That reason predates the feature.
  # Measured 07.09.2026 against @microsoft/powerbi-core-visual-schema (pinned 0.1.1):
  # `capabilities.tableEx.objects.sparklines` exists, and so does `pivotTable`'s. Its
  # properties are chartType (line|column), dataColor, strokeWidth, markers (flags
  # 1/2/4/8/16/32/128), markerColor, markerSize, markerShape (circle|square|diamond|
  # triangle|x|shortDash|longDash|plus). We were re-drawing in SVG what the host does.
  powerbi_native:
    ext: json
    template: |
      {
        "visualType": "tableEx",
        "query": { "queryState": {
          "Values": { "projections": [
            { "field": { "Column": { "Expression": { "SourceRef": { "Entity": "{{category_entity}}" } }, "Property": "{{category_prop}}" } }, "queryRef": "{{category_entity}}.{{category_prop}}" },
            { "field": { "Measure": { "Expression": { "SourceRef": { "Entity": "{{entity}}" } }, "Property": "{{measure}}" } }, "queryRef": "{{entity}}.{{measure}}" },
            { "field": { "SparklineData": {
                "Measure": { "Measure": { "Expression": { "SourceRef": { "Entity": "{{entity}}" } }, "Property": "{{measure}}" } },
                "Groupings": [ { "Column": { "Expression": { "SourceRef": { "Entity": "{{date_entity}}" } }, "Property": "{{date_prop}}" } } ]
              } }, "queryRef": "SparklineData({{entity}}.{{measure}}_[{{date_entity}}.{{date_prop}}])", "displayName": "{{measure}} ({{label_per_row}})" }
          ] }
        } },
        "objects": { "grid": [ { "properties": {
          "gridVertical": { "expr": { "Literal": { "Value": "false" } } },
          "gridHorizontal": { "expr": { "Literal": { "Value": "true" } } },
          "gridHorizontalWeight": { "expr": { "Literal": { "Value": "1D" } } },
          "gridHorizontalColor": { "solid": { "color": { "expr": { "Literal": { "Value": "'{{col_rule}}'" } } } } },
          "outlineWeight": { "expr": { "Literal": { "Value": "0D" } } }
        } } ], "sparklines": [ { "properties": {
          "chartType": { "expr": { "Literal": { "Value": "'line'" } } },
          "dataColor": { "solid": { "color": { "expr": { "Literal": { "Value": "'{{col_line}}'" } } } } },
          "strokeWidth": { "expr": { "Literal": { "Value": "1.5D" } } }
        }, "selector": { "metadata": "SparklineData({{entity}}.{{measure}}_[{{date_entity}}.{{date_prop}}])" } } ] }
      }
    notes: |
      Der Instanzselektor traegt denselben Ausdruck wie `queryRef`; beide muessen mitwandern,
      wenn eine Tabelle umbenannt wird (products/fabric/powerbi/docs/references/
      pbir-rename-cascade.md:281-306 beschreibt die Kaskade).

      Marker sind bewusst NICHT gesetzt: `anti_patterns` fuehrt
      `axis_labels_in_a_sparkline` — eine Zellen-Sparkline ist Kontext, kein beschriftetes
      Diagramm. Wer Datenpunkte hervorheben will, tut das im Idiom `small_multiples`, wo die
      Flaeche dafuer da ist. Die Faehigkeit steht im Katalog und bleibt hier ungenutzt; das
      ist eine Entscheidung, keine Luecke.

      `pivotTable` traegt dasselbe `sparklines`-Objekt (Katalog 0.1.1, gemessen 07.09.2026).
      Der Unterschied zu `tableEx` ist die Zeilengruppierung, nicht die Sparkline: wo Zeilen
      hierarchisch gruppiert sind, traegt `matrix_evidence` die Spalte unveraendert. Dafuer
      gibt es hier bewusst KEINE eigene Werkzeugspur — das Vokabular kennt vier, und eine
      fuenfte, die kein Renderer und kein Test liest, waere ein zweites Silo.

  powerbi_svg_dax:
    ext: dax
    template: |
      VAR _P = CALCULATETABLE ( VALUES ( '{{date_entity}}'[{{date_prop}}] ), DATESINPERIOD ( '{{date_entity}}'[{{date_prop}}], MAX ( '{{date_entity}}'[{{date_prop}}] ), -12, MONTH ) )
      VAR _S = ADDCOLUMNS ( _P, "@v", IF ( "{{gaps}}" = "zero", [{{measure}}] + 0, [{{measure}}] ) )
      VAR _alle = CALCULATETABLE ( ADDCOLUMNS ( CROSSJOIN ( VALUES ( '{{category_entity}}'[{{category_prop}}] ), _P ), "@v", [{{measure}}] ), ALLSELECTED ( '{{category_entity}}'[{{category_prop}}] ) )
      VAR _geteilt = "{{scale}}" = "shared"
      VAR _bl = {{band_low_expr}}
      VAR _bh = {{band_high_expr}}
      VAR _band = _geteilt && NOT ISBLANK ( _bl ) && NOT ISBLANK ( _bh )
      VAR _lo0 = IF ( _geteilt, MINX ( _alle, [@v] ), MINX ( _S, [@v] ) )
      VAR _hi0 = IF ( _geteilt, MAXX ( _alle, [@v] ), MAXX ( _S, [@v] ) )
      VAR _min = IF ( _band, MIN ( _lo0, _bl ), _lo0 )
      VAR _max = IF ( _band, MAX ( _hi0, _bh ), _hi0 )
      VAR _xmin = MINX ( _S, '{{date_entity}}'[{{date_prop}}] )
      VAR _xmax = MAXX ( _S, '{{date_entity}}'[{{date_prop}}] )
      VAR _N = ADDCOLUMNS ( FILTER ( _S, NOT ISBLANK ( [@v] ) ),
          "@x", INT ( 4 + 92 * DIVIDE ( '{{date_entity}}'[{{date_prop}}] - _xmin, _xmax - _xmin ) ),
          "@y", INT ( 24 - 22 * DIVIDE ( [@v] - _min, _max - _min ) ),
          "@luecke", '{{date_entity}}'[{{date_prop}}] > MINX ( _S, '{{date_entity}}'[{{date_prop}}] ) && ISBLANK ( MAXX ( TOPN ( 1, FILTER ( _S, '{{date_entity}}'[{{date_prop}}] < EARLIER ( '{{date_entity}}'[{{date_prop}}] ) ), '{{date_entity}}'[{{date_prop}}], DESC ), [@v] ) ) )
      VAR _erst = MINX ( _N, '{{date_entity}}'[{{date_prop}}] )
      VAR _letzt = MAXX ( _N, '{{date_entity}}'[{{date_prop}}] )
      VAR _d = CONCATENATEX ( _N, IF ( '{{date_entity}}'[{{date_prop}}] = _erst || ( [@luecke] && "{{gaps}}" = "break" ), " M", " L" ) & [@x] & "," & [@y], "", '{{date_entity}}'[{{date_prop}}] )
      VAR _marken = "<circle cx='" & MAXX ( FILTER ( _N, '{{date_entity}}'[{{date_prop}}] = _erst ), [@x] ) & "' cy='" & MAXX ( FILTER ( _N, '{{date_entity}}'[{{date_prop}}] = _erst ), [@y] ) & "' r='2' fill='#FFFFFF' stroke='{{col_line}}' stroke-width='1'/>"
          & "<circle cx='" & MAXX ( FILTER ( _N, '{{date_entity}}'[{{date_prop}}] = _letzt ), [@x] ) & "' cy='" & MAXX ( FILTER ( _N, '{{date_entity}}'[{{date_prop}}] = _letzt ), [@y] ) & "' r='2.5' fill='{{col_line}}'/>"
      VAR _bandsvg = IF ( _band, "<rect x='4' y='" & INT ( 24 - 22 * DIVIDE ( _bh - _min, _max - _min ) ) & "' width='92' height='" & INT ( 22 * DIVIDE ( _bh - _bl, _max - _min ) ) & "' fill='{{col_band}}'/>", "" )
      VAR _ref = IF ( _geteilt, "", "<title>{{label_per_row}}</title><line x1='4' x2='96' y1='" & INT ( 24 - 22 * DIVIDE ( AVERAGEX ( _N, [@v] ) - _min, _max - _min ) ) & "' y2='" & INT ( 24 - 22 * DIVIDE ( AVERAGEX ( _N, [@v] ) - _min, _max - _min ) ) & "' stroke='{{col_ref}}' stroke-width='0.75' stroke-dasharray='2 2'/>" )
      RETURN
          IF ( HASONEVALUE ( '{{category_entity}}'[{{category_prop}}] ),
              "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 26'>"
                & _bandsvg
                & _ref
                & "<path fill='none' stroke='{{col_line}}' stroke-width='1.5' d='" & _d & "'/>"
                & _marken
                & "</svg>" )
    notes: |
      Gestaltungsregeln sparkline_skala (T6, SP1), sparkline_marken (SP2), sparkline_luecken (SP6), zielband (SP5),
      sparkline_groesse (SP4). `scale: shared` rechnet Min/Max über ALLSELECTED der Zeilenkategorie, also eine Skala für
      die ganze Spalte; `per_row` zeichnet zusätzlich den Zeilenmittelwert als Referenzlinie und trägt den Hinweis
      `label_per_row` als <title>. Lücken: `break` beginnt nach einem leeren Monat einen neuen Pfad (M), `connect`
      verbindet, `zero` setzt leer = 0. Band nur bei `scale: shared` und nur, wenn beide Grenz-Ausdrücke einen Wert
      liefern (Measures aus target_corridor mit Freigabe; Standard BLANK ()). Die DAX-Auswertung bleibt Desktop-gebunden.

  deneb_vegalite:
    applicable: false
    reason: "a per-row cell chart inside a table is not a Vega-Lite view"
    use: "the whole trend as a standalone chart is `line` in Deneb; the cell column is SVG-DAX"

  web_recharts:
    applicable: false
    reason: "Recharts has no table cell primitive"
    use: "an HTML <table> with a small Recharts `line` per row"

determinism:
  golden_dir: golden
  notes: "Micro-trend per row for a tableEx column (ImageUrl). SVG-DAX: one scale for the column (scale shared), per_row only with reference line and hint. Native sparklines scale per row (no catalog property, MS Learn names no option): the column header carries the hint. No axis labels (context, not a chart)."
