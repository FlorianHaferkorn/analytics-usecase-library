# Visual Library entry — stacked_100  (schema: _schema.yaml)
id: stacked_100
name: 100% stacked bar
version: "1.0.0"
status: active        # active | deprecated | experimental
purpose: [part_to_whole]
zone: [analysis]
min_size: {cols: 4, rows: 4}   # grid units — canvas-relative legibility floor (≈395×208px @1280, 592×312px @1920; px derived from layout_grid.yaml)
best_form_for: null                 # part-to-whole across categories (donut is best for a single whole)
alternatives: [donut, area_stacked]

encoding:
  y: normalized_100                 # share sums to 100% per category
  color: series_content_reference
  guard: few_series

anti_patterns:
  - too_many_series
  - stacked_absolute_when_share_is_the_point
  - inconsistent_series_colours

params:
  category: {role: axis, type: category, required: true}
  measure:  {role: value, required: true}
  series:   {role: series, type: category, required: true}
  entity:   {role: table, default: _Measures}

data_fit:
  series: {type: category, max: 5, on_violation: too_many_series}

tokens:
  col_1: brand.primary              # #0078D4
  col_2: brand.teal                 # #008575
  col_3: brand.coral                # #EF6950

canonical_params:
  entity: "_Measures"
  measure: "Net Sales Amount"
  series_entity: "dim_product"
  series_prop: "Category"
  category_entity: "dim_org"
  category_prop: "Region"
  field: "sales"
  field_cat: "region"
  field_series: "category"
  col_1: "#0078D4"
  col_2: "#008575"
  col_3: "#EF6950"

preview_svg: |
  <svg viewBox="0 0 340 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="100% stacked">
    <rect width="340" height="150" rx="12" fill="#FFFFFF"/>
    <text x="20" y="26" font-family="Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#586472">SALES MIX — BY REGION</text>
    <rect x="40" y="40" width="46" height="50" fill="#0078D4"/><rect x="40" y="90" width="46" height="26" fill="#008575"/><rect x="40" y="116" width="46" height="14" fill="#EF6950"/>
    <rect x="110" y="40" width="46" height="40" fill="#0078D4"/><rect x="110" y="80" width="46" height="34" fill="#008575"/><rect x="110" y="114" width="46" height="16" fill="#EF6950"/>
    <rect x="180" y="40" width="46" height="58" fill="#0078D4"/><rect x="180" y="98" width="46" height="20" fill="#008575"/><rect x="180" y="118" width="46" height="12" fill="#EF6950"/>
    <rect x="250" y="40" width="46" height="34" fill="#0078D4"/><rect x="250" y="74" width="46" height="30" fill="#008575"/><rect x="250" y="104" width="46" height="26" fill="#EF6950"/>
    <text x="63" y="142" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="9" fill="#94A0AC">DACH</text><text x="133" y="142" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="9" fill="#94A0AC">BeNe</text><text x="203" y="142" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="9" fill="#94A0AC">Nord</text><text x="273" y="142" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="9" fill="#94A0AC">CEE</text>
  </svg>

realizations:
  powerbi_native:
    ext: json
    template: |
      {
        "visualType": "hundredPercentStackedColumnChart",
        "query": { "queryState": {
          "Category": { "projections": [ { "field": { "Column": { "Expression": { "SourceRef": { "Entity": "{{category_entity}}" } }, "Property": "{{category_prop}}" } }, "queryRef": "{{category_entity}}.{{category_prop}}" } ] },
          "Series": { "projections": [ { "field": { "Column": { "Expression": { "SourceRef": { "Entity": "{{series_entity}}" } }, "Property": "{{series_prop}}" } }, "queryRef": "{{series_entity}}.{{series_prop}}" } ] },
          "Y": { "projections": [ { "field": { "Measure": { "Expression": { "SourceRef": { "Entity": "{{entity}}" } }, "Property": "{{measure}}" } }, "queryRef": "{{entity}}.{{measure}}" } ] }
        } }
      }

  powerbi_svg_dax:
    applicable: false
    reason: "multi-series normalised stacking is not a single-cell micro-chart"
    use: "powerbi_native (hundredPercentStackedColumnChart) or Deneb"

  deneb_vegalite:
    ext: json
    template: |
      {
        "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
        "data": { "name": "dataset" },
        "mark": { "type": "bar" },
        "encoding": {
          "x": { "field": "{{field_cat}}", "type": "nominal", "axis": { "title": null } },
          "y": { "field": "{{field}}", "type": "quantitative", "stack": "normalize", "axis": { "title": null, "format": "%" } },
          "color": { "field": "{{field_series}}", "type": "nominal", "scale": { "range": ["{{col_1}}", "{{col_2}}", "{{col_3}}"] }, "legend": { "title": null } }
        }
      }

  web_recharts:
    ext: jsx
    template: |
      <BarChart data={data} width={480} height={300} stackOffset="expand">
        <XAxis dataKey="{{field_cat}}" />
        <YAxis tickFormatter={(v) => `${(v * 100).toFixed(0)}%`} />
        <Bar dataKey="series1" stackId="a" fill="{{col_1}}" />
        <Bar dataKey="series2" stackId="a" fill="{{col_2}}" />
        <Bar dataKey="series3" stackId="a" fill="{{col_3}}" />
      </BarChart>

determinism:
  golden_dir: golden
  notes: "Share sums to 100% (Vega stack:normalize; Recharts stackOffset='expand'). SVG-DAX n/a (multi-series)."
