# Visual Library entry — indexed_line  (schema: _schema.yaml)
id: indexed_line
name: Indexed line
version: "1.0.0"
status: active        # active | deprecated | experimental
purpose: [time_comparison]
zone: [analysis]
min_size: {cols: 4, rows: 4}   # grid units — canvas-relative legibility floor (≈395×208px @1280, 592×312px @1920; px derived from layout_grid.yaml)
best_form_for: null                 # variant of `line` for relative growth vs a base = 100
alternatives: [line, small_multiples, slope]

encoding:
  x: temporal
  y: index_to_100                   # value / value(t0) * 100 — compares relative growth
  reference: base_100_line

anti_patterns:
  - mixing_indexed_and_absolute_axes
  - hidden_base_period
  - autoscale_without_base_line

params:
  category: {role: axis, type: date, required: true}
  measure:  {role: value, required: true, note: "an already-indexed measure (base period = 100)"}
  entity:   {role: table, default: _Measures}

tokens:
  col_line: brand.primary           # #0078D4
  col_base: color_semantics.neutral # #94A0AC the 100 base line

# data column slots of the Vega-Lite track: which column role fills which {{param}} (A-31 R4)
data_slots:
  field: {role: value, required: true}
  field_date: {role: time, required: true}

canonical_params:
  entity: "_Measures"
  measure: "Net Sales Index"
  category_entity: "dim_date"
  category_prop: "Date"
  field: "idx"
  field_date: "month"
  col_line: "#0078D4"
  col_base: "#94A0AC"

preview_svg: |
  <svg viewBox="0 0 340 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Indexed line">
    <rect width="340" height="140" rx="12" fill="#FFFFFF"/>
    <text x="20" y="26" font-family="Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#586472">NET SALES — INDEXED (base 100)</text>
    <line x1="30" y1="86" x2="320" y2="86" stroke="#94A0AC" stroke-width="1.2" stroke-dasharray="2 2"/>
    <text x="30" y="80" font-family="Segoe UI,sans-serif" font-size="10" fill="#94A0AC">100</text>
    <polyline points="30,86 70,80 110,82 150,72 190,66 230,58 270,50 310,42" fill="none" stroke="#0078D4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="310" cy="42" r="4" fill="#0078D4"/>
  </svg>

realizations:
  powerbi_native:
    ext: json
    template: |
      {
        "visualType": "lineChart",
        "query": { "queryState": {
          "Category": { "projections": [ { "field": { "Column": { "Expression": { "SourceRef": { "Entity": "{{category_entity}}" } }, "Property": "{{category_prop}}" } }, "queryRef": "{{category_entity}}.{{category_prop}}" } ] },
          "Y": { "projections": [ { "field": { "Measure": { "Expression": { "SourceRef": { "Entity": "{{entity}}" } }, "Property": "{{measure}}" } }, "queryRef": "{{entity}}.{{measure}}" } ] }
        } },
        "objects": { "y1AxisReferenceLine": [ { "properties": {
          "show": { "expr": { "Literal": { "Value": "true" } } },
          "value": { "expr": { "Literal": { "Value": "100D" } } },
          "lineColor": { "solid": { "color": { "expr": { "Literal": { "Value": "'{{col_base}}'" } } } } },
          "style": { "expr": { "Literal": { "Value": "'dotted'" } } }
        }, "selector": { "id": "1" } } ] }
      }

  powerbi_svg_dax:
    ext: dax
    template: |
      VAR _S = ADDCOLUMNS ( CALCULATETABLE ( VALUES ( '{{category_entity}}'[{{category_prop}}] ), DATESINPERIOD ( '{{category_entity}}'[{{category_prop}}], MAX ( '{{category_entity}}'[{{category_prop}}] ), -12, MONTH ) ), "@v", [{{measure}}] )
      VAR _min = MINX ( _S, [@v] )
      VAR _max = MAXX ( _S, [@v] )
      VAR _xmin = MINX ( _S, '{{category_entity}}'[{{category_prop}}] )
      VAR _xmax = MAXX ( _S, '{{category_entity}}'[{{category_prop}}] )
      VAR _pts = CONCATENATEX ( _S, INT ( 100 * DIVIDE ( '{{category_entity}}'[{{category_prop}}] - _xmin, _xmax - _xmin ) ) & "," & INT ( 30 - 30 * DIVIDE ( [@v] - _min, _max - _min ) ), " ", '{{category_entity}}'[{{category_prop}}] )
      RETURN
          "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 30'>"
            & "<polyline fill='none' stroke='{{col_line}}' stroke-width='2' points='" & _pts & "'/>"
            & "</svg>"

  deneb_vegalite:
    ext: json
    template: |
      {
        "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
        "data": { "name": "dataset" },
        "layer": [
          { "mark": { "type": "line", "color": "{{col_line}}", "strokeWidth": 2.5 },
            "encoding": {
              "x": { "field": "{{field_date}}", "type": "temporal", "axis": { "title": null } },
              "y": { "field": "{{field}}", "type": "quantitative", "scale": { "zero": false }, "axis": { "title": null } } } },
          { "mark": { "type": "rule", "color": "{{col_base}}", "strokeDash": [2, 2] }, "encoding": { "y": { "datum": 100 } } }
        ]
      }

  web_recharts:
    ext: jsx
    template: |
      <LineChart data={data} width={640} height={220}>
        <XAxis dataKey="{{field_date}}" />
        <YAxis domain={['auto', 'auto']} />
        <ReferenceLine y={100} stroke="{{col_base}}" strokeDasharray="2 2" />
        <Line type="monotone" dataKey="{{field}}" stroke="{{col_line}}" strokeWidth={2.5} dot={false} />
      </LineChart>

determinism:
  golden_dir: golden
  notes: "Base = 100 dotted reference on every tool; the measure is pre-indexed. All four tools apply."
