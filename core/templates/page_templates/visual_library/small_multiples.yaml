# Visual Library entry — small_multiples  (schema: _schema.yaml)
id: small_multiples
name: Small multiples
purpose: [time_comparison]
zone: [analysis]
min_size: {w: 480, h: 280}   # minimum legible render size (px) — below this, labels/marks fall under the legibility floor
best_form_for: null                 # many series over time without spaghetti — one panel each
alternatives: [line, slope, area_stacked]

encoding:
  facet: series                     # one small chart per series, shared scale
  x: temporal
  y: quantitative_shared_scale

anti_patterns:
  - independent_y_scales_per_panel  # a shared scale is what makes them comparable
  - too_many_panels

params:
  category: {role: axis, type: date, required: true}
  measure:  {role: value, required: true}
  series:   {role: facet, type: category, required: true}
  entity:   {role: table, default: _Measures}

tokens:
  col_line: ink                     # #0F2430

canonical_params:
  entity: "_Measures"
  measure: "Gross Margin %"
  series_entity: "dim_org"
  series_prop: "OrgName"
  category_entity: "dim_date"
  category_prop: "Date"
  field: "gm"
  field_date: "month"
  field_series: "unit"
  col_line: "#0F2430"

preview_svg: |
  <svg viewBox="0 0 340 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Small multiples">
    <rect width="340" height="150" rx="12" fill="#FFFFFF"/>
    <text x="18" y="24" font-family="Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#586472">GM % — BY UNIT (small multiples)</text>
    <g fill="none" stroke="#0F2430" stroke-width="2">
      <polyline points="24,72 44,66 64,70 84,62 104,72"/><polyline points="128,68 148,64 168,72 188,66 208,78"/><polyline points="232,64 252,72 272,66 292,80 312,88"/>
      <polyline points="24,128 44,120 64,124 84,116 104,126"/><polyline points="128,124 148,118 168,128 188,122 208,130"/><polyline points="232,120 252,128 272,124 292,132 312,136"/>
    </g>
    <text x="24" y="46" font-family="Segoe UI,sans-serif" font-size="9" fill="#94A0AC">Nord</text><text x="128" y="46" font-family="Segoe UI,sans-serif" font-size="9" fill="#94A0AC">Ost</text><text x="232" y="46" font-family="Segoe UI,sans-serif" font-size="9" fill="#94A0AC">West</text>
  </svg>

realizations:
  powerbi_native:
    applicable: false
    reason: "small multiples is a field-well option, not a distinct visual JSON idiom"
    use: "a lineChart with the field placed in the Small multiples well (shared Y scale)"

  powerbi_svg_dax:
    applicable: false
    reason: "a grid of panels is not a single-cell micro-chart"
    use: "deneb_vegalite (facet) or the native Small multiples well"

  deneb_vegalite:
    ext: json
    template: |
      {
        "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
        "data": { "name": "dataset" },
        "facet": { "field": "{{field_series}}", "type": "nominal" },
        "columns": 3,
        "spec": {
          "mark": { "type": "line", "color": "{{col_line}}" },
          "encoding": {
            "x": { "field": "{{field_date}}", "type": "temporal", "axis": { "title": null } },
            "y": { "field": "{{field}}", "type": "quantitative", "axis": { "title": null } }
          }
        }
      }

  web_recharts:
    applicable: false
    reason: "no single small-multiples component"
    use: "map the series to a CSS grid of <LineChart> with a shared YAxis domain"

determinism:
  golden_dir: golden
  notes: "Shared Y scale across panels (Vega facet). Native = the Small multiples field well."
