# Visual Library entry — small_multiples  (schema: _schema.yaml)
id: small_multiples
name: Small multiples
version: "1.0.0"
status: active        # active | deprecated | experimental
purpose: [time_comparison]
zone: [analysis]
min_size: {cols: 5, rows: 6}   # grid units — canvas-relative legibility floor (≈497×320px @1280, 746×480px @1920; px derived from layout_grid.yaml)
best_form_for: null                 # many series over time without spaghetti — one panel each
alternatives: [line, slope, area_stacked]

encoding:
  facet: series                     # one small chart per series, shared scale
  x: temporal
  y: quantitative_shared_scale

anti_patterns:
  - independent_y_scales_per_panel  # a shared scale is what makes them comparable
  - too_many_panels

params:
  category: {role: axis, type: date, required: true}
  measure:  {role: value, required: true}
  series:   {role: facet, type: category, required: true}
  entity:   {role: table, default: _Measures}
  # Rasterform ausdruecklich statt `auto`: sonst haengt das Ergebnis an der Platzierung.
  panel_cols: {role: layout, type: integer, default: 3}
  panel_rows: {role: layout, type: integer, default: 3}

data_fit:
  series: {type: category, max: 12, on_violation: too_many_panels}

tokens:
  col_line: ink                     # #0F2430

# data column slots of the Vega-Lite track: which column role fills which {{param}} (A-31 R4)
data_slots:
  field: {role: value, required: true}
  field_date: {role: time, required: true}
  field_series: {role: series, required: true}

canonical_params:
  entity: "_Measures"
  measure: "Gross Margin %"
  series_entity: "dim_org"
  series_prop: "OrgName"
  category_entity: "dim_date"
  category_prop: "Date"
  field: "gm"
  field_date: "month"
  field_series: "unit"
  col_line: "#0F2430"
  panel_cols: 3
  panel_rows: 3

preview_svg: |
  <svg viewBox="0 0 340 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Small multiples">
    <rect width="340" height="150" rx="12" fill="#FFFFFF"/>
    <text x="18" y="24" font-family="Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#586472">GM % — BY UNIT (small multiples)</text>
    <g fill="none" stroke="#0F2430" stroke-width="2">
      <polyline points="24,72 44,66 64,70 84,62 104,72"/><polyline points="128,68 148,64 168,72 188,66 208,78"/><polyline points="232,64 252,72 272,66 292,80 312,88"/>
      <polyline points="24,128 44,120 64,124 84,116 104,126"/><polyline points="128,124 148,118 168,128 188,122 208,130"/><polyline points="232,120 252,128 272,124 292,132 312,136"/>
    </g>
    <text x="24" y="46" font-family="Segoe UI,sans-serif" font-size="9" fill="#94A0AC">Nord</text><text x="128" y="46" font-family="Segoe UI,sans-serif" font-size="9" fill="#94A0AC">Ost</text><text x="232" y="46" font-family="Segoe UI,sans-serif" font-size="9" fill="#94A0AC">West</text>
  </svg>

realizations:
  # ADR-0021 (07.09.2026). Bis heute stand hier `applicable: false` mit dem Grund "small
  # multiples is a field-well option, not a distinct visual JSON idiom" und dem `use`-Hinweis
  # "a lineChart with the field placed in the Small multiples well". Der Hinweis war richtig,
  # der Schluss daraus nicht: die nativen Vorlagen dieser Bibliothek SIND Visual-JSON mit
  # Projektionen und Formatierungsobjekten, und genau dort laesst sich das Feldfach setzen.
  # Ein `use`, das den richtigen Weg beschreibt und ihn nicht emittiert, ist die Luecke.
  #
  # Gemessen 07.09.2026 gegen @microsoft/powerbi-core-visual-schema (Pin 0.1.1):
  # `lineChart.dataRoles` fuehrt die Rolle `Rows` mit dem displayName "Small multiples";
  # `lineChart.objects.smallMultiplesLayout` traegt layoutType (auto|custom), rowCount,
  # columnCount, Gitterlinien und Abstaende. 14 Visualtypen tragen dasselbe Objekt.
  powerbi_native:
    ext: json
    template: |
      {
        "visualType": "lineChart",
        "query": { "queryState": {
          "Category": { "projections": [ { "field": { "Column": { "Expression": { "SourceRef": { "Entity": "{{category_entity}}" } }, "Property": "{{category_prop}}" } }, "queryRef": "{{category_entity}}.{{category_prop}}" } ] },
          "Y": { "projections": [ { "field": { "Measure": { "Expression": { "SourceRef": { "Entity": "{{entity}}" } }, "Property": "{{measure}}" } }, "queryRef": "{{entity}}.{{measure}}" } ] },
          "Rows": { "projections": [ { "field": { "Column": { "Expression": { "SourceRef": { "Entity": "{{series_entity}}" } }, "Property": "{{series_prop}}" } }, "queryRef": "{{series_entity}}.{{series_prop}}" } ] }
        } },
        "objects": {
          "smallMultiplesLayout": [ { "properties": {
            "layoutType": { "expr": { "Literal": { "Value": "'custom'" } } },
            "columnCount": { "expr": { "Literal": { "Value": "{{panel_cols}}D" } } },
            "rowCount": { "expr": { "Literal": { "Value": "{{panel_rows}}D" } } },
            "gridLineShow": { "expr": { "Literal": { "Value": "false" } } }
          } } ],
          "lineStyles": [ { "properties": {
            "showMarker": { "expr": { "Literal": { "Value": "true" } } },
            "markerShape": { "expr": { "Literal": { "Value": "'circle'" } } },
            "markerSize": { "expr": { "Literal": { "Value": "3D" } } },
            "markerColor": { "solid": { "color": { "expr": { "Literal": { "Value": "'{{col_line}}'" } } } } }
          } } ],
          "labels": [ { "properties": {
            "show": { "expr": { "Literal": { "Value": "true" } } },
            "labelPosition": { "expr": { "Literal": { "Value": "'OutsideEnd'" } } },
            "labelDensity": { "expr": { "Literal": { "Value": "0D" } } }
          } } ]
        }
      }
    notes: |
      Die geteilte Y-Skala kommt vom Visual selbst, sobald `Rows` besetzt ist — sie wird hier
      nicht gesetzt und darf auch nicht je Panel geloest werden: `anti_patterns` fuehrt
      `independent_y_scales_per_panel`, und genau das macht die Panels vergleichbar.

      `labelDensity: 0` zeigt nur den letzten Wert je Panel statt jeden Punkt. Das ist die
      Hervorhebung, die eine Kleinserie vertraegt; jeder beschriftete Punkt macht aus dem
      Raster wieder das Spaghetti, das es vermeiden soll.

      `layoutType: custom` mit ausdruecklicher Spalten- und Zeilenzahl statt `auto`: `auto`
      rechnet aus der Flaeche, und dieselbe Vorlage saehe dann je Seitengroesse anders aus.
      Eine Bibliothek, deren Ergebnis von der Platzierung abhaengt, ist keine.

      Dieselbe Vorlage traegt 13 weitere Visualtypen: areaChart, barChart, cardVisual,
      clusteredBarChart, clusteredColumnChart, columnChart, hundredPercentStackedAreaChart,
      hundredPercentStackedBarChart, hundredPercentStackedColumnChart,
      lineClusteredColumnComboChart, lineStackedColumnComboChart, ribbonChart,
      stackedAreaChart (Katalog 0.1.1, gemessen 07.09.2026). Zum Wechseln genuegt der
      `visualType`; Rolle und Layout-Objekt bleiben. `lineChart` ist die Erstwahl, weil
      `encoding.x` dieses Idioms temporal ist. Dafuer gibt es bewusst KEINE eigene
      Werkzeugspur — das Vokabular kennt vier, und eine fuenfte, die kein Renderer und kein
      Test liest, waere ein zweites Silo.

  powerbi_svg_dax:
    applicable: false
    reason: "a grid of panels is not a single-cell micro-chart"
    use: "deneb_vegalite (facet) or the native Small multiples well"

  deneb_vegalite:
    ext: json
    template: |
      {
        "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
        "data": { "name": "dataset" },
        "facet": { "field": "{{field_series}}", "type": "nominal" },
        "columns": 3,
        "spec": {
          "mark": { "type": "line", "color": "{{col_line}}" },
          "encoding": {
            "x": { "field": "{{field_date}}", "type": "temporal", "axis": { "title": null } },
            "y": { "field": "{{field}}", "type": "quantitative", "axis": { "title": null } }
          }
        }
      }

  web_recharts:
    applicable: false
    reason: "no single small-multiples component"
    use: "map the series to a CSS grid of <LineChart> with a shared YAxis domain"

determinism:
  golden_dir: golden
  notes: "Shared Y scale across panels (Vega facet). Native = the Small multiples field well."
