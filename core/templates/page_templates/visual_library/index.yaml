# Visual Library — purpose index (the machine-readable chooser)
# Analytical question (Munzner: why before how)  ->  candidate idioms, best first.
# An AI/generator resolves a request by purpose, takes `best` (or picks from
# `candidates` if constraints apply), then reads <idiom>.yaml for the code per tool.
# Governed by pbi-design/references/charts.md; unified with §A.8 layout (zone).

schema_version: 1

purposes:
  time_comparison:                 # "Entwicklung / Zeitvergleich"
    question: "How is X developing over time — and against plan?"
    zone: analysis
    best: line
    candidates: [line, column_time, area_stacked, small_multiples, indexed_line, slope, "multi_tier_column@ibcs"]   # multi-tier: IBCS CO 4.2 values + ΔPY + ΔPY% on one category axis

  deviation_from_target:
    question: "Are we above/below plan or target — by how much?"
    zone: [pulse, analysis]
    best: deviation_bar
    candidates: [deviation_bar, bullet, "deviation_bar@ibcs", "variance_pin@ibcs", "multi_tier_column@ibcs"]   # @ibcs = the IBCS notation profile of the same idiom; variance_pin = RELATIVE variance (UN 4.1 pins)

  compare_categories:
    question: "Which categories lead or lag — where should attention focus?"
    zone: analysis
    best: bar_ranking
    candidates: [bar_ranking, lollipop, bar_absolute, dumbbell]

  contribution_to_change:
    question: "What moved the number from A to B — which drivers?"
    zone: analysis
    best: waterfall_pvm
    candidates: [waterfall_pvm, waterfall_buildup, waterfall_variance, "waterfall_pvm@ibcs"]   # @ibcs pending (structural override); buildup/variance are distinct idioms

  part_to_whole:
    question: "What is the share of the whole (<= 3 parts)?"
    zone: analysis
    best: donut
    candidates: [donut, stacked_100, bar_stacked]

  correlation:
    question: "How do two continuous variables relate?"
    zone: analysis
    best: scatter
    candidates: [scatter]

  flow_between_stages:
    question: "How does quantity flow between stages — where does it leak?"
    zone: detail
    best: sankey                   # situational; Visual_Whitelist extension
    candidates: [sankey]

  driver_breakdown:
    question: "Which dimension drives the number? (interactive)"
    zone: detail
    best: decomposition_tree       # situational; Detail only
    candidates: [decomposition_tree]

  distribution:
    question: "What is the spread / median / outliers of a variable?"
    zone: analysis
    best: histogram
    candidates: [histogram, boxplot]

  evidence_detail:
    question: "Which rows are worst — and what is the next action?"
    zone: detail
    best: matrix_evidence
    candidates: [matrix_evidence, matrix_sparkline, matrix_bullet, matrix_delta_pill, column_time, dumbbell, bar_stacked]   # tableEx + governed in-cell column types

  value_verdict:
    question: "What is the headline value and its verdict?"
    zone: pulse
    best: kpi_card_spark
    candidates: [kpi_card_spark, kpi_card_bullet, kpi_card_sparkbar]   # composite cardVisual tiles (value + micro-chart + delta)

# --- zone vocabulary (A-31 R5): a page-template zone names WHAT it must answer, never the chart ---
# Both repos map their zone vocabulary here; the chart then comes from `purposes` above via
# resolve.choose (profile + available data roles). One mapping, one home (ALUCA), mirrored to Meridian.
#   tasks               Meridian page templates, zone field `task_taxonomy` (Munzner 2014 task).
#                       The enum of Meridian's template.schema.json must equal these keys (Meridian test).
#   information_blocks  ALUCA template_manifest slots, field `information_block` (visual_registry.yaml).
# Value: list of purposes, primary first — or {none: <reason>} for zones that carry no chart.
zone_vocabulary:
  tasks:
    summarize: [value_verdict]
    compare: [compare_categories]
    compare_to_target: [deviation_from_target]
    trend: [time_comparison]
    rank: [compare_categories]
    find_extremum: [compare_categories]
    distribute: [distribution]
    correlate: [correlation]
    comprehension: [contribution_to_change, driver_breakdown]
    lookup: [evidence_detail]           # known target, known place -> the value or row itself
    locate: {none: "orientation (breadcrumb, filter bar) - no chart"}
    decide: {none: "action block (recommendation, options, owner) - no chart"}
    audit: {none: "evidence trail (events, lineage) as a list - no chart"}
  information_blocks:
    status_signal: [value_verdict, deviation_from_target, evidence_detail]   # evidence_detail: the registry's bullet_graph is a tableEx of in-cell bullets (>= 4 KPIs)
    time_trend: [time_comparison]
    variance_explanation: [contribution_to_change, deviation_from_target, evidence_detail]   # evidence_detail: contribution_table (delta pills in a table)
    entity_ranking: [compare_categories]
    exception_list: [evidence_detail]
    structural_mix: [part_to_whole]
    distribution_spread: [distribution]
    detail_matrix: [evidence_detail]
    root_cause_context: [driver_breakdown, correlation, compare_categories]
    prescriptive_action: {none: "action block (owner, trigger, steps) - no chart"}

# --- notation profiles (the second axis; see _notation_profiles.yaml) ---
# An idiom answers a purpose; a profile is the convention it is drawn in. "idiom@profile"
# in a candidate list means the same idiom under a non-default profile — NOT a new idiom.
# So "IBCS bar" is bar_ranking@ibcs, not a duplicate id. house_default is the baseline.
notation_profiles:
  registry: _notation_profiles.yaml
  available: [house_default, ibcs, print_safe]
  implemented_ibcs: [deviation_bar, bar_ranking, line, waterfall_pvm, bullet, waterfall_variance, waterfall_buildup, column_time, variance_pin, multi_tier_column]   # idioms that carry an `ibcs` profile
  pending_ibcs: []   # IBCS applied where the notation genuinely maps (comparison/bridge/scenario idioms); distribution idioms (histogram/boxplot) intentionally have no IBCS reading
  implemented_print_safe: [deviation_bar, bar_ranking, line, waterfall_pvm, bullet]   # idioms that carry a CVAA/print-safe overlay

# governed deny-list (never emit)
# deprecated_map / qna_visual / legacy_card: von Microsoft abgekuendigte PBIR-Typen (map/filledMap -> azureMap,
# qnaVisual -> Copilot, card/multiRowCard -> cardVisual; Abgleich 07.10.2026, skills-for-fabric map.md/card.md).
deny: [pie_gt_4, three_d, gauge, radar, dual_axis_no_reason, color_as_decoration, powerbi_smart_narrative, deprecated_map, qna_visual, legacy_card]

# realised so far (rest scaffolded per increment)
implemented: [deviation_bar, line, bar_ranking, waterfall_pvm, area_stacked, indexed_line, matrix_evidence, scatter, donut, bullet, slope, stacked_100, lollipop, histogram, boxplot, small_multiples, sankey, decomposition_tree, bar_absolute, waterfall_buildup, waterfall_variance, kpi_card_spark, kpi_card_bullet, kpi_card_sparkbar, matrix_sparkline, matrix_bullet, matrix_delta_pill, column_time, dumbbell, bar_stacked, variance_pin, multi_tier_column]
