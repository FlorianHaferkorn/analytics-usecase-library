# Visual Library — purpose index (the machine-readable chooser)
# Analytical question (Munzner: why before how)  ->  candidate idioms, best first.
# An AI/generator resolves a request by purpose, takes `best` (or picks from
# `candidates` if constraints apply), then reads <idiom>.yaml for the code per tool.
# Governed by pbi-design/references/charts.md; unified with §A.8 layout (zone).

schema_version: 1

purposes:
  time_comparison:                 # "Entwicklung / Zeitvergleich"
    question: "How is X developing over time — and against plan?"
    zone: analysis
    best: line
    candidates: [line, column_time, area_stacked, small_multiples, indexed_line, slope]

  deviation_from_target:
    question: "Are we above/below plan or target — by how much?"
    zone: [pulse, analysis]
    best: deviation_bar
    candidates: [deviation_bar, bullet, "deviation_bar@ibcs"]   # @ibcs = the IBCS notation profile of the same idiom

  compare_categories:
    question: "Which categories lead or lag — where should attention focus?"
    zone: analysis
    best: bar_ranking
    candidates: [bar_ranking, lollipop, bar_absolute, dumbbell]

  contribution_to_change:
    question: "What moved the number from A to B — which drivers?"
    zone: analysis
    best: waterfall_pvm
    candidates: [waterfall_pvm, waterfall_buildup, waterfall_variance, "waterfall_pvm@ibcs"]   # @ibcs pending (structural override); buildup/variance are distinct idioms

  part_to_whole:
    question: "What is the share of the whole (<= 4 parts)?"
    zone: analysis
    best: donut
    candidates: [donut, stacked_100, bar_stacked]

  correlation:
    question: "How do two continuous variables relate?"
    zone: analysis
    best: scatter
    candidates: [scatter]

  flow_between_stages:
    question: "How does quantity flow between stages — where does it leak?"
    zone: detail
    best: sankey                   # situational; Visual_Whitelist extension
    candidates: [sankey]

  driver_breakdown:
    question: "Which dimension drives the number? (interactive)"
    zone: detail
    best: decomposition_tree       # situational; Detail only
    candidates: [decomposition_tree]

  distribution:
    question: "What is the spread / median / outliers of a variable?"
    zone: analysis
    best: histogram
    candidates: [histogram, boxplot]

  evidence_detail:
    question: "Which rows are worst — and what is the next action?"
    zone: detail
    best: matrix_evidence
    candidates: [matrix_evidence, matrix_sparkline, matrix_bullet, matrix_delta_pill, column_time, dumbbell, bar_stacked]   # tableEx + governed in-cell column types

  value_verdict:
    question: "What is the headline value and its verdict?"
    zone: pulse
    best: kpi_card_spark
    candidates: [kpi_card_spark, kpi_card_bullet, kpi_card_sparkbar]   # composite cardVisual tiles (value + micro-chart + delta)

# --- notation profiles (the second axis; see _notation_profiles.yaml) ---
# An idiom answers a purpose; a profile is the convention it is drawn in. "idiom@profile"
# in a candidate list means the same idiom under a non-default profile — NOT a new idiom.
# So "IBCS bar" is bar_ranking@ibcs, not a duplicate id. house_default is the baseline.
notation_profiles:
  registry: _notation_profiles.yaml
  available: [house_default, ibcs, print_safe]
  implemented_ibcs: [deviation_bar, bar_ranking, line, waterfall_pvm, bullet]   # idioms that carry an `ibcs` profile
  pending_ibcs: []   # all current-idiom IBCS profiles realized
  implemented_print_safe: [deviation_bar, bar_ranking, line, waterfall_pvm, bullet]   # idioms that carry a CVAA/print-safe overlay

# governed deny-list (never emit)
deny: [pie_gt_4, three_d, gauge, radar, dual_axis_no_reason, color_as_decoration, powerbi_smart_narrative]

# realised so far (rest scaffolded per increment)
implemented: [deviation_bar, line, bar_ranking, waterfall_pvm, area_stacked, indexed_line, matrix_evidence, scatter, donut, bullet, slope, stacked_100, lollipop, histogram, boxplot, small_multiples, sankey, decomposition_tree, bar_absolute, waterfall_buildup, waterfall_variance, kpi_card_spark, kpi_card_bullet, kpi_card_sparkbar, matrix_sparkline, matrix_bullet, matrix_delta_pill, column_time, dumbbell, bar_stacked]
