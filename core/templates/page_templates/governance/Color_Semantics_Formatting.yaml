## Scatter Plot Formatting (Impact-Effort Matrix)

### Axes

| Axis | Dimension | Range | Label |
|------|-----------|-------|-------|
| **X-axis** | Effort | 1-10 (or Low/Medium/High) | "Effort Required" |
| **Y-axis** | Impact | 1-10 (or Low/Medium/High) | "Expected Impact" |

### Quadrants

| Quadrant | Label | Color | Theme Role | Action |
|----------|-------|-------|------------|--------|
| **Top-Left** | Quick Wins | Green | `good` | Do First |
| **Top-Right** | Major Projects | Blue | `accent` | Plan Carefully |
| **Bottom-Left** | Fill-ins | Gray | `fourthLevelElements` | Do Later |
| **Bottom-Right** | Thankless Tasks | Red | `bad` | Avoid |

**Quadrant Lines:**
- Style: Dashed lines at midpoint (5.5 if 1-10 scale)
- Color: Theme `tableAccent`
- Width: 1px

**Quadrant Labels:**
- Position: Center of each quadrant
- Font: 12pt, theme `firstLevelElements`
- Background: Theme `secondaryBackground` with transparency

### Data Points

- **Size:** Based on confidence or priority
- **Color:** By quadrant (use theme roles)
- **Tooltips:** Show Action, Impact, Effort, Priority, Confidence, Owner

---

## Funnel Chart Formatting

### Color Gradient

- **Top stage:** Darker (theme `dataColors[0]`)
- **Bottom stage:** Lighter (theme `dataColors[0]` lightened)
- **Gradient:** Smooth transition from top to bottom

### Labels

- **Show:** Stage name and value on each bar
- **Font:** 12pt, theme `firstLevelElements`
- **Percentages:** Show conversion rate from top stage (e.g., "45% of initial leads")

