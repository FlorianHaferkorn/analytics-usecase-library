## Chart Formatting

### Default Color Palette

**Data Series:**
- Use theme `dataColors[0]` through `dataColors[7]` for data series
- First series: `dataColors[0]` (Base color)
- Subsequent series: `dataColors[1]` through `dataColors[7]`

**Target Lines:**
- Use theme `accent` or `hyperlink` color
- Style: Dashed line, 2px width

### Variance Charts (Waterfall)

| Variance Type | Color | Theme Role |
|---------------|-------|------------|
| **Positive variance** | Green | `good` |
| **Negative variance** | Red | `bad` |
| **Neutral/Zero** | Gray | `fourthLevelElements` |

### Grid Lines

- **Show:** Yes (subtle)
- **Color:** Theme `tableAccent` or light gray
- **Style:** Solid, 1px width
- **Transparency:** 80% (subtle)

### Axis Labels

- **Font size:** 12pt
- **Font color:** Theme `secondLevelElements`
- **Orientation:** Horizontal (rotate only if necessary)
- **Show:** Yes

### Data Labels

- **Show:** On key points only (not all points)
- **Font size:** 10-12pt
- **Font color:** Theme `firstLevelElements`
- **Background:** Theme `secondaryBackground` with transparency

---

## Table Formatting

### Exception Tables (T3)

**Required Columns:**
- Entity, Metric, Threshold, Actual, Deviation, Severity, Owner, Last Updated

**Conditional Formatting:**

| Severity | Background Color | Theme Role | Text Color |
|----------|-----------------|------------|------------|
| **Critical** | Light Red (#FFE6E6) | `bad` (lightened) | Theme `firstLevelElements` |
| **Warning** | Light Yellow (#FFF9E6) | `neutral` (lightened) | Theme `firstLevelElements` |
| **Info** | Light Gray (#F5F5F5) | `fourthLevelElements` (lightened) | Theme `firstLevelElements` |

**Row Formatting:**
- Alternating row colors: White / Light Gray (theme `secondaryBackground`)
- Max rows: 50 (paginate if more)
- Sorting: By severity (Critical > Warning > Info), then by deviation (descending)

### Prescriptive Tables (T4)

**Required Columns:**
- Action, Owner, Impact, Effort, Priority, Confidence, Due Date, Rationale

**Conditional Formatting:**

| Priority | Background Color | Theme Role | Text Color |
|----------|-----------------|------------|------------|
| **High** | Light Red (#FFE6E6) | `bad` (lightened) | Theme `firstLevelElements` |
| **Medium** | Light Yellow (#FFF9E6) | `neutral` (lightened) | Theme `firstLevelElements` |
| **Low** | Light Green (#E6F5E6) | `good` (lightened) | Theme `firstLevelElements` |

**Top Recommendation:**
- **Bold text**
- **Background:** Theme `accent` color (lightened, ~20% opacity)
- **Border:** Theme `accent` color, 2px

**Row Formatting:**
- Alternating row colors: White / Light Gray
- Max rows: 10 (show top recommendations)
- Sorting: By priority (High > Medium > Low), then by impact (descending)

