# Color Semantics and Formatting Rules — Framework Governance

## Purpose

This file defines **color semantics** and **formatting rules** for page templates. Colors reference theme roles (`good`/`bad`/`neutral`/`accent`) to ensure consistency and accessibility.

**Authority:** This file is referenced by scaffold generators and report documentation generators.

---

## Color Semantics

### Framework Color Meanings

| Color | Theme Role | Meaning | Usage |
|-------|------------|---------|-------|
| **Green** | `good` | Above target, positive variance, good performance | KPI above target, positive variance bars, good status |
| **Red** | `bad` | Below target, negative variance, critical exception | KPI below target, negative variance bars, critical exceptions |
| **Yellow/Orange** | `neutral` | Warning, near threshold, caution | KPI near threshold, warning exceptions, caution status |
| **Gray** | `null` or `fourthLevelElements` | Neutral, no data, inactive | Neutral KPIs, missing data, inactive items |
| **Blue** | `accent` or `hyperlink` | Baseline, reference, informational | Target lines, reference values, informational context |

**Rule:** Always use theme roles, never hardcode colors. Theme generator provides `good`/`bad`/`neutral` roles that align with these semantics.

---

## KPI Card Formatting

### Required Elements

| Element | Format | Purpose |
|---------|--------|---------|
| **KPI Name** | Text, 12pt, theme `firstLevelElements` | Metric name (e.g., "Sales Revenue") |
| **Current Value** | Number, formatted per metric type | Current period value |
| **Target Value** | Number, formatted per metric type | Target/goal value |
| **Variance** | Percentage or absolute | Deviation from target |
| **Trend Arrow** | Icon (Up/Down/Neutral) | Comparison to previous period |

### Value Formatting

| Metric Type | Format | Example |
|-------------|--------|---------|
| **Currency** | $1,234.56 (2 decimal places, thousands separator) | $1,234,567.89 |
| **Percentage** | 45.2% (1 decimal place) | 45.2% |
| **Large Numbers** | 1.2M, 45K (K/M/B abbreviations) | 1.2M, 45K, 1.5B |
| **Counts** | 1,234 (no decimal places, thousands separator) | 1,234,567 |

### Trend Arrows

**Show when:** Comparing to previous period (e.g., "vs Last Month")

**Color Logic:**
- **Up arrow:** 
  - Green if positive change (for metrics where increase is good, e.g., Revenue)
  - Red if positive change (for metrics where increase is bad, e.g., Costs)
- **Down arrow:**
  - Red if negative change (for metrics where decrease is bad, e.g., Revenue)
  - Green if negative change (for metrics where decrease is good, e.g., Costs)
- **Neutral:** Gray horizontal line (no significant change)

**Rule:** Arrow color depends on metric context (increase = good vs increase = bad).

### Color Coding

| Condition | Color | Theme Role |
|-----------|-------|------------|
| **Above target** | Green | `good` |
| **Below target** | Red | `bad` |
| **Near target (±5%)** | Yellow/Orange | `neutral` |
| **No target** | Gray | `fourthLevelElements` |

**Implementation:**
- Background color or border color based on performance vs target
- Use theme `good`/`bad`/`neutral` roles for conditional formatting

