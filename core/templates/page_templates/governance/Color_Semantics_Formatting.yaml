## General Formatting Rules

### Fonts

| Element | Font Family | Font Size | Font Weight | Color |
|---------|-------------|-----------|-------------|-------|
| **Page Title** | Segoe UI | 16pt | Normal | Theme `firstLevelElements` |
| **Visual Title** | Segoe UI | 14pt | Normal | Theme `firstLevelElements` |
| **Axis Labels** | Segoe UI | 12pt | Normal | Theme `secondLevelElements` |
| **Data Labels** | Segoe UI | 10-12pt | Normal | Theme `firstLevelElements` |
| **Table Headers** | Segoe UI | 12pt | Bold | Theme `firstLevelElements` |
| **Table Values** | Segoe UI | 11pt | Normal | Theme `firstLevelElements` |

### Borders

- **Visual borders:** Theme `tableAccent`, 0.5px width, 8px radius
- **Table borders:** Theme `tableAccent`, 1px width
- **Grid lines:** Theme `tableAccent`, 1px width, 80% transparency

### Backgrounds

- **Visual background:** Theme `secondaryBackground` (usually white)
- **Page background:** Theme `background`
- **Table row alternation:** White / Light Gray (theme `secondaryBackground`)

