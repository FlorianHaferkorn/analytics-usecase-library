## Accessibility

### Color Contrast

**Rule:** All text must meet WCAG AA contrast requirements:
- **Normal text:** 4.5:1 contrast ratio
- **Large text (≥18pt) or bold (≥14pt):** 3.0:1 contrast ratio

**Theme Validation:** Theme generator validates WCAG contrast. Use theme roles to ensure accessibility.

### Color-Blind Friendly

**Rule:** Avoid red-green pairs. Use patterns/textures in addition to color for critical distinctions.

**Theme Validation:** Theme generator validates color-blindness (CVD) scores. Use theme roles to ensure accessibility.

