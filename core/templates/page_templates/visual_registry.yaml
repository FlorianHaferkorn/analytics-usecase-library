# Visual Registry — ALUCA (Analytics Library of Use Cases)
#
# Machine-readable contracts for every information block.
# Each block defines: purpose, slot compatibility, required inputs,
# allowed visuals (with Power BI type), forbidden visuals (with reason),
# and quality rules.
#
# Authority: VISUAL_BAUKASTEN.md (human-readable contracts + evidence)
# Schema: tooling/generator/schemas/visual_registry.schema.json (pending)
#
# Visual substitution is ONLY valid within the same information block.
# See VISUAL_BAUKASTEN.md §3 for substitution rules.

registry_version: "1.0.0"

information_blocks:

  # ─────────────────────────────────────────────────────────────────────────
  # Block 1: status_signal
  # Purpose: Immediately communicate KPI on-track / at-risk / off-track state
  # ─────────────────────────────────────────────────────────────────────────
  - block_id: status_signal
    purpose: "Communicate whether a KPI meets its target — immediate status encoding"
    primary_layer: "3s"
    slot_compatibility: ["KPI_Cards"]
    page_types: ["T1", "T2", "T3", "T4"]

    required_inputs:
      - field: actual_value
        type: numeric
        mandatory: true
      - field: target_value
        type: numeric
        mandatory: false
        note: "Either target_value or reference_scenario required"
      - field: reference_scenario
        type: enum
        values: ["PL", "PY", "FC"]
        mandatory: false
      - field: absolute_delta
        type: numeric
        computed: "actual_value - reference_value"
        mandatory: true
      - field: relative_delta
        type: numeric
        computed: "absolute_delta / reference_value"
        mandatory: true
      - field: status
        type: enum
        values: ["on_track", "at_risk", "off_track"]
        mandatory: true

    allowed_visuals:
      - visual_id: kpi_card_with_delta
        pbip_type: cardVisual
        targets: {powerbi: cardVisual, evidence: "evidence:stat"}
        is_default: true
        condition: null
        source: "S7 — Few (2004): KPI card maximizes data-ink for status display"
      - visual_id: bullet_graph
        pbip_type: tableEx
        render_mode: svg_measure
        is_default: false
        condition: "space_constrained = true AND kpi_count >= 4"
        source: "S8 — Few (2005): bullet graph specification; space-efficient alternative to gauge"
        # Kein Fremd-Visual (Doktrin): der Bullet Graph entsteht als DAX-erzeugtes
        # SVG in einer tableEx-Zelle (Spalte als Image URL kategorisiert), nicht
        # ueber "Enlighten Bullet Chart". Der SVG-Weg selbst ist NOCH NICHT im
        # Service/Desktop gemessen -> Task L10 (Interaktivitaet, Export,
        # Barrierefreiheit, Performance).
        verify: "L10 — SVG-Measure-Weg in Desktop + Service pruefen"

    forbidden_visuals:
      - visual_id: gauge
        pbip_type: gaugeVisual
        reason: "90% non-data ink (S7 — Few 2004); KPI card communicates status with higher accuracy"
      - visual_id: pie
        pbip_type: pieChart
        reason: "Angle encoding rank 5 in accuracy hierarchy (S2 — Cleveland & McGill 1984); no reference encoding"
      - visual_id: radar
        pbip_type: radarChart
        reason: "Angle encoding; cross-axis comparisons perceptually invalid (S2)"

    quality_rules:
      - rule_id: show_both_deltas
        description: "Both absolute_delta and relative_delta must be displayed simultaneously"
        source: "S9 — IBCS EXPRESS E3"
        severity: error
      - rule_id: dual_encoding_status
        description: "Status must not be conveyed by color alone; add icon or label"
        source: "S14 — WCAG 2.1 AA: no meaning by color alone"
        severity: error
      - rule_id: favorable_positive_convention
        description: "Favorable delta = positive convention (value exceeds reference); never reversed"
        source: "S9 — IBCS UNIFY (semantische Notation: Szenario-Konvention)"
        severity: error
      - rule_id: min_font_size
        description: "Value field minimum 16pt at 1280x720, 24pt at 1920x1080"
        source: "S12 — Microsoft Power BI accessibility guidance"
        severity: warning
      - rule_id: title_names_kpi_and_reference
        description: "Title must name the KPI and reference scenario (e.g., 'Net Sales vs Plan YTD')"
        source: "S9 — IBCS UNIFY U4"
        severity: warning

  # ─────────────────────────────────────────────────────────────────────────
  # Block 2: time_trend
  # Purpose: Show direction and momentum of a KPI over a defined time window
  # ─────────────────────────────────────────────────────────────────────────
  - block_id: time_trend
    purpose: "Show the trajectory of a KPI over time — direction and momentum"
    primary_layer: "30s"
    slot_compatibility: ["Trend", "Main_1", "Focus_Area"]
    page_types: ["T1", "T2", "T3"]

    required_inputs:
      - field: time_dimension
        type: date
        grain: ["daily", "weekly", "monthly", "quarterly"]
        mandatory: true
      - field: actual_series
        type: numeric_series
        mandatory: true
      - field: reference_series
        type: numeric_series
        mandatory: false
        note: "PL or PY reference line; must be labeled if shown"
      - field: time_window
        type: string
        mandatory: true
        example: "last_12_months"

    allowed_visuals:
      - visual_id: line_chart
        pbip_type: lineChart
        targets: {powerbi: lineChart, evidence: "evidence:line"}
        is_default: true
        condition: null
        source: "S2 — Cleveland & McGill: position on common scale is highest accuracy encoding"
      - visual_id: column_chart
        pbip_type: clusteredBarChart
        targets: {powerbi: clusteredBarChart, evidence: "evidence:column"}
        is_default: false
        condition: "periodicity_emphasis = true"
        source: "S2 — length encoding; acceptable when comparing discrete periods"
      - visual_id: area_chart
        pbip_type: areaChart
        is_default: false
        condition: "page_type = T1 AND use_sparingly = true"
        source: "S2 — area encoding lower accuracy; use only when cumulative context adds value"
      - visual_id: small_multiples
        pbip_type: lineChart
        small_multiples: true
        is_default: false
        condition: "entity_count >= 3 AND entity_count <= 12"
        source: "S11 — Tufte: small multiples require identical scales; S2 — panel comparison valid"

    forbidden_visuals:
      - visual_id: stacked_column_single_kpi
        pbip_type: stackedBarChart
        reason: "Stacking hides the total when showing a single KPI trend"
      - visual_id: 3d_line
        pbip_type: null
        reason: "Depth encoding is non-functional for time series (S2); distorts comparison"
      - visual_id: pie
        pbip_type: pieChart
        reason: "No temporal encoding possible (S2)"

    quality_rules:
      - rule_id: time_axis_labeled
        description: "Time axis must show explicit period markers (year, quarter, or month labels)"
        source: "S9 — IBCS UNIFY (einheitliche Achsen-Notation); S11 — Tufte"
        severity: error
      - rule_id: reference_line_labeled
        description: "If reference line is shown, it must be labeled with scenario abbreviation (PL, PY, FC)"
        source: "S9 — IBCS UNIFY U4"
        severity: error
      - rule_id: y_axis_starts_at_zero
        description: "Y-axis must start at zero for volume/absolute metrics; truncation requires explicit justification"
        source: "S11 — Tufte p.53-77: zero-baseline rule for magnitude encoding"
        severity: warning
      - rule_id: small_multiples_identical_scale
        description: "All small-multiples panels must share identical scale and axis range"
        source: "S11 — Tufte p.170"
        severity: error
        applies_when: "small_multiples = true"
      - rule_id: small_multiples_max_12
        description: "Maximum 12 panels in small-multiples layout; above this use ranked bar chart"
        source: "S11 — Tufte"
        severity: error
        applies_when: "small_multiples = true"

  # ─────────────────────────────────────────────────────────────────────────
  # Block 3: variance_explanation
  # Purpose: Decompose a KPI gap into named driver contributions
  # ─────────────────────────────────────────────────────────────────────────
  - block_id: variance_explanation
    purpose: "Decompose the total KPI gap into named, signed driver contributions"
    primary_layer: "30s"
    slot_compatibility: ["Variance", "Main_2"]
    page_types: ["T2"]

    required_inputs:
      - field: reference_value
        type: numeric
        mandatory: true
        note: "Start bar value — PL or PY"
      - field: actual_value
        type: numeric
        mandatory: true
        note: "End bar value"
      - field: driver_contributions
        type: array
        item_schema:
          driver_name: string
          absolute_contribution: numeric
          direction: enum["favorable", "unfavorable", "neutral"]
        mandatory: true
      - field: reconciliation_check
        type: computed
        formula: "sum(driver_contributions) == actual_value - reference_value"
        mandatory: true
        validation: error_if_false

    allowed_visuals:
      - visual_id: waterfall_chart
        pbip_type: waterfallChart
        targets: {powerbi: waterfallChart, evidence: "evidence:waterfall"}
        is_default: true
        condition: null
        source: "S9 — IBCS: waterfall is canonical variance bridge; S2 — length encoding"
      - visual_id: variance_bar
        pbip_type: clusteredBarChart
        targets: {powerbi: clusteredBarChart, evidence: "evidence:bar"}
        is_default: false
        condition: "waterfall_not_feasible = true"
        source: "S2 — length encoding; acceptable deviation chart with baseline"
      - visual_id: contribution_table
        pbip_type: tableEx
        targets: {powerbi: tableEx, evidence: "evidence:table"}
        is_default: false
        condition: "layer = 300s"
        source: "Detail layer only; provides driver list with absolute and relative contribution"

    forbidden_visuals:
      - visual_id: pie
        pbip_type: pieChart
        reason: "Cannot show signed contributions (S2); no start/end reconciliation possible"
      - visual_id: area_chart
        pbip_type: areaChart
        reason: "Cannot reconcile start/end values as categorical driver bridge"
      - visual_id: line_chart
        pbip_type: lineChart
        targets: {powerbi: lineChart, evidence: "evidence:line"}
        reason: "Temporal encoding; does not represent categorical driver contributions"

    quality_rules:
      - rule_id: waterfall_start_labeled
        description: "Start bar must show reference value (PL/PY) and be labeled with scenario"
        source: "S9 — IBCS U4"
        severity: error
        applies_when: "visual = waterfall_chart"
      - rule_id: waterfall_end_labeled
        description: "End bar must show actual value and be labeled"
        source: "S9 — IBCS UNIFY (Beschriftung wie waterfall_start_labeled, U4)"
        severity: error
        applies_when: "visual = waterfall_chart"
      - rule_id: waterfall_reconciliation
        description: "Sum of driver bars must equal actual - reference; generator must validate"
        source: "S9 — IBCS CHECK (visuelle Integritaet: Start + Deltas = Ende); logical consistency"
        severity: error
        applies_when: "visual = waterfall_chart"
      - rule_id: waterfall_max_bars
        description: "Maximum 7-8 driver bars; group smaller drivers as 'Other'"
        source: "S5 — Miller: 7±2 working memory chunks"
        severity: warning
        applies_when: "visual = waterfall_chart"
      - rule_id: waterfall_driver_labeled
        description: "Each driver bar must show absolute contribution AND % of total gap"
        source: "S9 — IBCS EXPRESS E3"
        severity: error
        applies_when: "visual = waterfall_chart"
      - rule_id: favorable_unfavorable_colors
        description: "Favorable contributions use accent color; unfavorable use warning color — not raw red/green"
        source: "S14 — WCAG colorblind safety; S9 — IBCS UNIFY (semantische Farbnotation)"
        severity: error

  # ─────────────────────────────────────────────────────────────────────────
  # Block 4: entity_ranking
  # Purpose: Rank entities by performance to identify concentration of gap
  # ─────────────────────────────────────────────────────────────────────────
  - block_id: entity_ranking
    purpose: "Rank entities by performance or deviation to identify concentration"
    primary_layer: "30s"
    slot_compatibility: ["Ranking", "Main_2", "Main_3", "Support_1"]
    page_types: ["T1", "T2", "T3"]

    required_inputs:
      - field: entity_dimension
        type: categorical
        mandatory: true
      - field: metric_value
        type: numeric
        mandatory: true
      - field: reference_value
        type: numeric
        mandatory: false
      - field: sort_order
        type: enum
        values: ["deviation_desc", "value_desc", "value_asc"]
        mandatory: true

    allowed_visuals:
      - visual_id: horizontal_bar_chart
        pbip_type: clusteredBarChart
        targets: {powerbi: clusteredBarChart, evidence: "evidence:bar"}
        orientation: horizontal
        is_default: true
        condition: null
        source: "S2 — length on common scale; entity labels readable on y-axis (S7 — Few 2004)"
      - visual_id: dot_plot
        pbip_type: scatterChart
        is_default: false
        condition: "deviation_from_center = true"
        source: "S2 — position encoding; shows positive/negative deviation from baseline"
      - visual_id: column_chart
        pbip_type: clusteredBarChart
        targets: {powerbi: clusteredBarChart, evidence: "evidence:column"}
        orientation: vertical
        is_default: false
        condition: "page_type = T3 AND entity_count <= 8"
        source: "S2 — length encoding; acceptable for short entity lists"

    forbidden_visuals:
      - visual_id: pie
        pbip_type: pieChart
        reason: "Ranking requires position/length encoding; angle cannot encode rank (S2)"
      - visual_id: unsorted_bar
        pbip_type: clusteredBarChart
        reason: "Alphabetical ordering destroys ranking purpose; always sort by magnitude (S7)"
      - visual_id: ranked_table_30s
        pbip_type: tableEx
        reason: "Table allowed only at 300s layer; 30s requires visual encoding for fast scan (S1)"
        applies_when: "layer = 30s"

    quality_rules:
      - rule_id: sort_by_deviation_not_alpha
        description: "Sort descending by deviation magnitude; never alphabetical"
        source: "S7 — Few (2004): attention management requires severity ordering"
        severity: error
      - rule_id: entity_label_readable
        description: "Entity labels must be readable; truncate at 20 chars with tooltip"
        source: "S12 — Microsoft PBI readability guidance"
        severity: warning
      - rule_id: max_entities_30s
        description: "Maximum 15 entities without Top/Bottom filter; above this add filter control"
        source: "S5 — Miller: working memory limits scan-to-insight"
        severity: warning

  # ─────────────────────────────────────────────────────────────────────────
  # Block 5: exception_list
  # Purpose: Display threshold-breaching entities ranked by severity
  # ─────────────────────────────────────────────────────────────────────────
  - block_id: exception_list
    purpose: "List entities in threshold breach, ranked by severity and urgency"
    primary_layer: "30s"
    slot_compatibility: ["Exceptions", "Main_1"]
    page_types: ["T3"]

    required_inputs:
      - field: entity_id
        type: string
        mandatory: true
      - field: metric_value
        type: numeric
        mandatory: true
      - field: threshold_value
        type: numeric
        mandatory: true
      - field: severity
        type: enum
        values: ["critical", "warning", "info"]
        mandatory: true
      - field: owner
        type: string
        mandatory: true
      - field: age_days
        type: integer
        mandatory: true
      - field: absolute_deviation
        type: numeric
        computed: "metric_value - threshold_value"
        mandatory: true

    allowed_visuals:
      - visual_id: exception_table
        pbip_type: tableEx
        targets: {powerbi: tableEx, evidence: "evidence:table"}
        is_default: true
        condition: null
        source: "S1 — Shneiderman: filter tier; entity-level resolution required; S7 — Few: F-pattern anchored by entity column"
      - visual_id: alert_list_card
        pbip_type: tableEx
        render_mode: svg_measure
        is_default: false
        condition: "severity_grouping_primary = true"
        source: "Acceptable when severity grouping is the primary structural need"
        # Kein Fremd-Visual (Doktrin): Severity-Gruppierung wird ueber ein
        # SVG-Measure je Zeile ausgedrueckt, nicht ueber ein Marketplace-Visual.
        verify: "L10 — SVG-Measure-Weg in Desktop + Service pruefen"

    forbidden_visuals:
      - visual_id: waterfall
        pbip_type: waterfallChart
        reason: "No signed contribution concept for exception lists"
      - visual_id: pie
        pbip_type: pieChart
        reason: "Severity distribution pie is not actionable (S7)"
      - visual_id: aggregated_chart
        pbip_type: any_chart
        reason: "Aggregations hide the individual entity — exception monitoring requires entity-level granularity"

    quality_rules:
      - rule_id: column_order
        description: "Columns must follow contract order: Entity, Severity, Metric, Actual vs Threshold, Owner, Age"
        source: "S7 — Few (2004): F-pattern scan; entity anchors left"
        severity: error
      - rule_id: sort_by_severity_then_deviation
        description: "Sort: Critical first, then Warning, then by deviation magnitude descending"
        source: "S7 — Few (2004): attention management"
        severity: error
      - rule_id: max_6_columns
        description: "Maximum 6 columns without toggle to 'show more'"
        source: "S5 — Miller: working memory"
        severity: warning
      - rule_id: severity_dual_encoding
        description: "Severity must use icon AND label — not color alone"
        source: "S14 — WCAG 2.1 AA"
        severity: error

  # ─────────────────────────────────────────────────────────────────────────
  # Block 6: structural_mix
  # Purpose: Show composition of a KPI across categories
  # ─────────────────────────────────────────────────────────────────────────
  - block_id: structural_mix
    purpose: "Show the composition or share of a KPI across categories"
    primary_layer: "30s"
    slot_compatibility: ["Mix", "Main_3"]
    page_types: ["T1", "T2"]

    required_inputs:
      - field: category_dimension
        type: categorical
        mandatory: true
      - field: actual_value_per_category
        type: numeric_series
        mandatory: true
      - field: reference_value_per_category
        type: numeric_series
        mandatory: false

    allowed_visuals:
      - visual_id: stacked_bar_100
        pbip_type: 100%StackedBarChart
        is_default: true
        condition: null
        source: "S2 — length encoding on common scale; best for share comparison across scenarios"
      - visual_id: stacked_column_100
        pbip_type: 100%StackedColumnChart
        is_default: false
        condition: "time_on_x_axis = true"
        source: "S2 — length encoding; acceptable when time is the x-axis dimension"

    forbidden_visuals:
      - visual_id: pie
        pbip_type: pieChart
        reason: "Angle encoding rank 5 (S2 — Cleveland & McGill); no period-over-period comparison possible"
      - visual_id: regular_stacked
        pbip_type: stackedBarChart
        reason: "Shows totals, not shares; does not answer the composition question"
      - visual_id: treemap
        pbip_type: treemap
        reason: "Area encoding rank 6 (S2 — Cleveland & McGill); less accurate than length"

    quality_rules:
      - rule_id: categories_labeled
        description: "Each category segment must have a label; legend alone is insufficient"
        source: "S11 — Tufte: labels reduce reference-lookup cognitive load"
        severity: warning
      - rule_id: max_categories
        description: "Maximum 7 categories before grouping as 'Other'"
        source: "S5 — Miller: 7±2 working memory"
        severity: warning

  # ─────────────────────────────────────────────────────────────────────────
  # Block 6b: distribution_spread
  # Purpose: Show how values are SPREAD across a population — not the average,
  #          and not the share of a whole.
  #
  # Warum dieser Block existiert (gemessen 02.08.2026, nicht angenommen):
  # Der externe Abgleich gegen das FT Visual Vocabulary zeigte "Distribution" als
  # eigene Absicht, die uns fehlte. Der Nachweis im EIGENEN Korpus (20 Brackets) ist
  # unabhaengig davon dreifach:
  #   * FIN-001  — "Overdue AR aging buckets (0-30d, 31-60d, 61-90d, >90d) required
  #                 for DSO diagnostic depth"
  #   * XD-001   — "Distribution of open-case age (share of cases open > SLA target,
  #                 > 2x target)"
  #   * SCM-003  — "Averaging MAPE across SKUs hides bias and small-denominator
  #                 distortion" — genau das Argument fuer Streuung statt Mittelwert
  #
  # Abgrenzung, weil die Nachbarbloecke nahe liegen:
  #   * structural_mix  fragt "woraus besteht das Ganze" (Anteil, Summe = 100%)
  #   * entity_ranking  fragt "welche Einheit ist die schlechteste" (Rang)
  #   * distribution_spread fragt "wie breit streut es, und gibt es einen Schwanz"
  # Die Darstellung kann in allen drei Faellen ein Balken sein — die ABSICHT ist es
  # nicht, und nur die Absicht steuert, ob jemand den Schwanz ueberhaupt zeigt.
  # ─────────────────────────────────────────────────────────────────────────
  - block_id: distribution_spread
    purpose: "Show how values are spread across a population — reveal the tail, not the average"
    primary_layer: "30s"
    slot_compatibility: ["Main_2", "Main_3", "Mix"]
    page_types: ["T2", "T3"]

    required_inputs:
      - field: bucket_dimension
        type: categorical_ordered
        mandatory: true
        description: "Geordnete Baender (Alter, Betrag, Dauer). Reihenfolge ist Bedeutung, nicht Sortierung."
      - field: count_or_value_per_bucket
        type: numeric_series
        mandatory: true
      - field: threshold_marker
        type: numeric
        mandatory: false
        description: "Grenze, ab der ein Bucket als Ausnahme gilt (z. B. SLA-Ziel, >90d)"

    allowed_visuals:
      - visual_id: banded_column_chart
        pbip_type: columnChart
        is_default: true
        condition: null
        targets:
          powerbi: columnChart
          vegalite: bar
          evidence: "evidence:column"
        source: "S2 — Laengenkodierung auf gemeinsamer Skala; Baender behalten ihre Ordnung auf der x-Achse"
      - visual_id: banded_bar_chart
        pbip_type: barChart
        is_default: false
        condition: "bucket_labels_are_long = true"
        targets:
          powerbi: barChart
          vegalite: bar
          evidence: "evidence:bar"
        source: "S2 — gleiche Kodierung, horizontale Achse nur wegen Beschriftungslaenge"

    forbidden_visuals:
      - visual_id: pie
        pbip_type: pieChart
        reason: "Winkelkodierung Rang 5 (S2 — Cleveland & McGill); zerstoert ausserdem die Ordnung der Baender"
      - visual_id: sorted_by_value
        pbip_type: columnChart
        reason: "Nach Wert sortierte Baender sind keine Verteilung mehr — die Ordnung der Baender IST die Aussage"
      - visual_id: single_average_card
        pbip_type: cardVisual
        reason: "Ein Mittelwert ist die Antwort, die dieser Block gerade vermeiden soll (Beleg: SCM-003, averaging hides bias)"

    quality_rules:
      - rule_id: bucket_order_preserved
        description: "Baender erscheinen in ihrer fachlichen Reihenfolge, nie nach Wert sortiert"
        source: "S11 — Tufte: die Ordnung der Achse traegt Bedeutung und darf nicht umsortiert werden"
        severity: error
      - rule_id: threshold_visible
        description: "Ist ein threshold_marker definiert, muss er als Referenzlinie oder Farbwechsel sichtbar sein"
        source: "S9 — IBCS EXPRESS: Vergleichsgroessen gehoeren in dieselbe Darstellung wie der Wert"
        severity: warning
      - rule_id: max_buckets
        description: "Maximal 7 Baender, danach zusammenfassen"
        source: "S5 — Miller: 7±2 Arbeitsgedaechtnis"
        severity: warning

  # ─────────────────────────────────────────────────────────────────────────
  # Block 7: prescriptive_action
  # Purpose: Present a concrete recommended action with owner, trigger, steps, impact
  # ─────────────────────────────────────────────────────────────────────────
  - block_id: prescriptive_action
    purpose: "Present a concrete recommended action: owner, trigger, steps, expected impact"
    primary_layer: "3s"
    slot_compatibility: ["Prescriptive", "ActionPanel", "Focus_Area"]
    page_types: ["T4"]
    action_code_required: true

    required_inputs:
      - field: action_title
        type: string
        mandatory: true
        max_words: 5
      - field: owner_role
        type: string
        mandatory: true
      - field: trigger_condition
        type: string
        mandatory: true
        max_sentences: 2
      - field: recommended_steps
        type: array
        max_items: 4
        mandatory: true
      - field: expected_impact
        type: string
        mandatory: true
        format: "+/- magnitude with unit"
      - field: priority
        type: enum
        values: ["high", "medium", "low"]
        mandatory: true
      - field: due_date_or_cycle
        type: string
        mandatory: true

    allowed_visuals:
      - visual_id: action_panel_card
        pbip_type: textbox
        targets: {powerbi: textbox, evidence: "evidence:text"}
        is_default: true
        condition: null
        source: "S3 — Munzner: domain task is decide-and-act; text structure serves decision, not exploration"
      - visual_id: recommendation_table
        pbip_type: tableEx
        targets: {powerbi: tableEx, evidence: "evidence:table"}
        is_default: false
        condition: "variant = T4_OptionComparison"
        source: "S2 — position encoding; table allows structured comparison of multiple options"
      - visual_id: impact_effort_scatter
        pbip_type: scatterChart
        is_default: false
        condition: "variant = T4_OptionComparison AND needs_prescriptive = true"
        source: "S2 — position on two scales; effective for 2D option comparison"

    forbidden_visuals:
      - visual_id: dense_operational_table
        pbip_type: tableEx
        reason: "Not actionable at decision level; use detail_matrix block instead"
        applies_when: "row_count > 20"
      - visual_id: exception_list_as_action
        pbip_type: tableEx
        reason: "Exception list (T3) ≠ prescriptive recommendation (T4); different information blocks"
      - visual_id: exploratory_controls
        pbip_type: slicer
        reason: "Exploratory slicers destroy decision focus (S3 — wrong domain task)"
        applies_when: "slicer_count > 2"

    quality_rules:
      - rule_id: action_panel_fully_populated
        description: "All Action Panel fields must be populated from Action Code YAML before rendering"
        source: "T4_Prescriptive_Recommendation.md Action Panel Contract"
        severity: error
      - rule_id: action_panel_max_steps
        description: "Recommended steps maximum 4; more steps indicate unclear action scoping"
        source: "S5 — Miller: working memory"
        severity: warning
      - rule_id: one_primary_recommendation
        description: "Exactly one action must be marked as primary; alternatives are secondary"
        source: "T4_Prescriptive_Recommendation.md §Disallowed Slots"
        severity: error
      - rule_id: action_title_max_words
        description: "Action title maximum 5 words — the Big Idea must be immediately scannable"
        source: "S1 — Shneiderman: 3-second layer"
        severity: warning

  # ─────────────────────────────────────────────────────────────────────────
  # Block 8: detail_matrix
  # Purpose: Provide record-level data for validation (300s layer only)
  # ─────────────────────────────────────────────────────────────────────────
  - block_id: detail_matrix
    purpose: "Provide entity-level detail for validation of overview insights"
    primary_layer: "300s"
    slot_compatibility: ["Detail_Matrix", "Focus_Area", "Support_1", "Support_2"]
    page_types: ["T1", "T2", "T3", "T4"]
    layer_restriction: "300s_only"

    required_inputs:
      - field: entity_dimension
        type: categorical
        mandatory: true
      - field: primary_kpi_value
        type: numeric
        mandatory: true
      - field: reference_value
        type: numeric
        mandatory: false
      - field: deviation
        type: numeric
        computed: "primary_kpi_value - reference_value"
        mandatory: false

    allowed_visuals:
      - visual_id: table
        pbip_type: tableEx
        targets: {powerbi: tableEx, evidence: "evidence:table"}
        is_default: true
        condition: null
        source: "S1 — Shneiderman: details-on-demand tier; table maximizes information density per pixel"
      - visual_id: matrix
        pbip_type: pivotTable
        targets: {powerbi: pivotTable, evidence: "evidence:table"}
        is_default: false
        condition: "cross_tab_adds_decision_value = true"
        source: "S1 — cross-tab structure serves drill-down; acceptable when dimensions require cross-reference"

    forbidden_visuals:
      - visual_id: chart_on_detail_page
        pbip_type: any_chart
        reason: "Detail pages validate — they must not introduce new insights not in the overview"

    quality_rules:
      - rule_id: pre_filtered
        description: "Detail page must be pre-filtered to relevant context (exceptions only for T3; affected entities for T4)"
        source: "S1 — Shneiderman: zoom tier is pre-contextualized"
        severity: error
      - rule_id: sort_by_deviation
        description: "Sort descending by deviation magnitude"
        source: "S7 — Few: attention management"
        severity: warning
      - rule_id: max_columns
        description: "Maximum 8 columns without toggle; additional columns require explicit justification"
        source: "S5 — Miller"
        severity: warning

  # ─────────────────────────────────────────────────────────────────────────
  # Block 9: root_cause_context
  # Purpose: High-level contextual factors explaining exceptions or deviations
  # ─────────────────────────────────────────────────────────────────────────
  - block_id: root_cause_context
    purpose: "Provide contextual factors explaining why exceptions or deviations occur"
    primary_layer: "300s"
    slot_compatibility: ["Root_Cause", "Support_1", "Main_3"]
    page_types: ["T3", "T4"]
    activation_condition: "needs_root_cause = true"

    required_inputs:
      - field: causal_factor_dimensions
        type: categorical
        mandatory: true
      - field: correlation_metric
        type: numeric
        mandatory: false

    allowed_visuals:
      - visual_id: scatter_plot
        pbip_type: scatterChart
        is_default: true
        condition: "needs_root_cause = true"
        source: "S2 — position on two scales; effective for factor correlation display"
      - visual_id: decomposition_tree
        pbip_type: decompositionTreeVisual
        is_default: false
        condition: "drill_path_defined = true"
        source: "S1 — zoom tier; acceptable when causal hierarchy is explicit"
      - visual_id: horizontal_bar_categorical
        pbip_type: clusteredBarChart
        targets: {powerbi: clusteredBarChart, evidence: "evidence:bar"}
        orientation: horizontal
        is_default: false
        condition: "root_cause_is_categorical = true"
        source: "S2 — length encoding; appropriate for categorical root cause without correlation"

    forbidden_visuals:
      - visual_id: waterfall
        pbip_type: waterfallChart
        reason: "Waterfall encodes variance bridges, not causal factors (different information task)"
      - visual_id: pie
        pbip_type: pieChart
        reason: "Angle encoding cannot represent causal factors meaningfully (S2)"

    quality_rules:
      - rule_id: activation_required
        description: "Root cause slot requires explicit needs_root_cause = true in UseCase_Bracket"
        source: "T3_Operational_Monitoring.md §Slot-Specific Rules"
        severity: error
      - rule_id: context_only
        description: "Root cause on T3 is contextual only — not a full statistical analysis"
        source: "T3_Operational_Monitoring.md"
        severity: warning
