# Template Manifest — ALUCA (Analytics Library of Use Cases)
#
# Single source of truth for all page type definitions, variants, slot bindings,
# and grid template assignments.
#
# Authority:
#   - PAGE_TEMPLATE_DOCTRINE.md (rules and source evidence)
#   - PAGE_TYPE_TAXONOMY.md (variant definitions and mapping)
#   - VISUAL_BAUKASTEN.md (information block contracts per slot)
#
# Every UseCase_Bracket.yaml ux_layout_rules.template_variant must resolve to an
# entry in this manifest. The template compiler validates this at build time.
#
# Slot-Haerte: `mandatory` und `severity` sind ZWEI Fragen
# --------------------------------------------------------
#   mandatory: false  → der Slot muss seinen Platz erst verdienen. Genau das meint
#                       Microsofts powerbi-report-design-Skill mit „Treat archetype
#                       zones as advisory, not mandatory."
#   mandatory: true   → die Variante sagt den Slot zu. `severity` sagt, wie hart das
#                       Gate diese Zusage einfordert:
#                         error   (Default) → e2e_smoke FAIL
#                         warning           → e2e_smoke WARN, blockt nicht
#
# Die Achse ist die **Datenlage der Regel**, nie die Art des Slots — so wie Kubernetes
# Pod Security (enforce/audit/warn), HashiCorp Sentinel (advisory/soft-/hard-mandatory)
# und ESLint (off/warn/error) es halten. Daraus die Regel, die
# tooling/tests/test_template_manifest_alignment.py maschinell erzwingt:
#
#   Ein Pflicht-Slot steht nur auf `error`, wenn seine Variante benutzt wird.
#   `status: unused` heisst null Emissionen, also null Verletzungsdaten — und ein
#   hartes Gate ohne Datenlage ist der PSS-Weg rueckwaerts. Neue Slots starten
#   deshalb auf `warning` und steigen auf `error`, sobald echte Laeufe es tragen.
#
# Schema: tooling/generator/schemas/template_manifest.schema.json (pending)

manifest_version: "1.0.0"
design_canvas:
  width: 1280
  height: 720
production_canvas:
  width: 1920
  height: 1080
grid:
  columns: 12
  rows: 12
  outer_margin_px: 32
  gutter_px: 16
  internal_padding_px: 8
  zone_gap_px: 40

# Grid template slot catalog — every slot_id in grid_templates/*.json must resolve here.
grid_template_slots:
  pulse_wide:
    - KPI_Cards
    - Benchmark_Caption
    - Slicer_Date
    - Main_1
    - Main_2
    - Main_3
  action_rail:
    - Slicer_Pane
    - Smart_Narrative
    - Detail_Matrix
    - ActionPanel
  pulse:
    - KPI_Cards
    - Slicer_Date
    - Slicer_Region
    - Slicer_Product
    - Main_1
    - Main_2
    - Main_3
  pulse_asymmetric:
    - KPI_Cards
    - Slicer_Date
    - Main_1
    - Main_2
    - Main_3
  executive_kpi:
    - KPI_Cards
    - Slicer_Date
    - Main_1
    - Main_2
    - Main_3
  investigator:
    - Slicer_Pane
    - Focus_Area
    - Support_1
    - Support_2
  investigator_focus:
    - KPI_Cards
    - Slicer_Date
    - Main_1
    - Main_2
    - Main_3
  action_matrix:
    - Slicer_Pane
    - Slicer_Entity
    - Smart_Narrative
    - Detail_Matrix
    - ActionPanel

