    mandatory_slots: ["KPI_Cards"]
    max_slicers: 3
    narrative_template: "{domain} is {status} – {primary_kpi} is {delta} vs {reference}, {momentum}."

    variants:

      - variant_id: T1_Portfolio
        name: "Executive KPI Portfolio"
        description: "4–6 strategic KPIs, portfolio breadth view, no drill-down"
        grid_template: executive_kpi
        # Detail-Ebene explizit: die vier detail_slots dieser Variante
        # (Slicer_Pane, Focus_Area, Support_1, Support_2) SIND exakt die Slots von
        # grid_templates/investigator.json. Bis 02.08.2026 war das nirgends
        # deklariert — weder grid_template noch alternate_grid_template ist ein
        # Detail-Raster —, weshalb die Geometrie aus einem Default-Rueckfall kam.
        detail_grid_template: investigator
        alternate_grid_template: pulse
        overview_slots:
          - slot_id: KPI_Cards
            information_block: status_signal
            mandatory: true
          - slot_id: Slicer_Date
            information_block: null
            mandatory: true
          - slot_id: Slicer_Region
            information_block: null
            mandatory: false
          - slot_id: Slicer_Product
            information_block: null
            mandatory: false
          - slot_id: Main_1
            information_block: time_trend
            mandatory: true
          - slot_id: Main_2
            information_block: entity_ranking
            mandatory: false
          - slot_id: Main_3
            information_block: structural_mix
            mandatory: false
        detail_slots:
          - slot_id: Slicer_Pane
            information_block: null
            mandatory: true
          - slot_id: Focus_Area
            information_block: time_trend
            mandatory: true
          - slot_id: Support_1
            information_block: entity_ranking
            mandatory: false
          - slot_id: Support_2
            information_block: detail_matrix
            mandatory: false

      - variant_id: T1_Trend
