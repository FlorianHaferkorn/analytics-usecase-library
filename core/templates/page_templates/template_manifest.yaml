# T1 – Strategic Overview
# Primary Decision: "Are we on track against strategic targets?"
# Source: PAGE_TEMPLATE_DOCTRINE.md §3.1, T1_Strategic_Overview.md
# ─────────────────────────────────────────────────────────────────────────────
page_families:

  - family_id: T1
