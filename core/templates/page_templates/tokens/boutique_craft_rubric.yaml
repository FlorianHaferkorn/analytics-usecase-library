  # ── 1.1 (A-35; Meridian D-719): Frontend-Mindeststandard — Dataviz-Basisregeln ──
  # The chart method behind Claude Dashboards (dataviz skill, read 09.10.2026): form first, colour
  # by job, validated palette, thin marks, no dual axis, legend rules, text tokens, reserved status
  # colours, hover tooltip by default, one filter row, table view, own dark mode, render + visual
  # check. Applies under every concept unless scoped.
  - id: dataviz_base
    weight: 12
    rules:
      - id: BC-DV-01
        statement: "Never a dual axis — two value scales on one plot; use two charts or index to one scale."
        severity: knock_out
        weight: 3
        check: structural
        validator: null
        validator_blocked: not_yet_wired
        machine_hint: "combo chart with a bound secondary value axis (Y2) / two y-scales in one spec"
        source: "dataviz skill references/anti-patterns.md (dual-axis); BC-CHART-01 (mixed scale)"
      - id: BC-DV-02
        statement: "Every categorical palette passes the palette validator before use: CVD ΔE (OKLab×100) ≥ 8 for adjacent slots under protan/deutan, normal-vision floor ≥ 15, lightness band and chroma floor per mode, ≥ 3:1 against the surface or a relief channel (labels / table view). An unchecked palette is a knock-out."
        severity: knock_out
        weight: 3
        check: structural
        validator: null
        validator_blocked: not_yet_wired
        machine_hint: "categorical palette not run through tooling/visual_library/contrast.py palette gate, or FAIL"
        source: "dataviz skill references/color-formula.md (six checks); tooling/visual_library/contrast.py"
      - id: BC-DV-03
        statement: "Colour by job: categorical in a fixed slot order, sequential one hue light→dark, diverging two poles around a grey midpoint; never a value ramp on nominal categories."
        severity: major
        weight: 2
        check: structural
        validator: null
        validator_blocked: not_yet_wired
        machine_hint: "sequential ramp spans >1 hue / diverging midpoint chromatic / nominal bars coloured by value"
        source: "dataviz skill references/color-formula.md (four jobs); tokens/color_semantics.yaml"
      - id: BC-DV-04
        statement: "Colour follows the entity, not its rank: a series keeps its colour across filters, sorts and pages."
        severity: major
        weight: 1
        check: judge
        machine_hint: "series colour assigned by position after sort/filter"
        source: "dataviz skill references/color-formula.md (fixed order, never cycled)"
      - id: BC-DV-05
        statement: "Legend from two series on; a single series has no legend (the title names it); direct labels selectively, at most four."
        severity: minor
        weight: 1
        not_concept: ibcs   # IBCS replaces the legend by end-of-line labels (BC-CHART-03)
        check: judge
        machine_hint: "legend on a single-series chart / ≥2 series without legend or direct labels / >4 direct labels"
        source: "dataviz skill references/marks-and-anatomy.md (labels & legend)"
      - id: BC-DV-06
        statement: "Text in text tokens: labels, values, legends and axes use text colours, never a series or brand colour; status colours reserved and always with icon + label."
        severity: minor
        weight: 1
        check: structural
        validator: null
        validator_blocked: not_yet_wired
        machine_hint: "title/label colour token is a data/brand colour"
        source: "dataviz skill references/marks-and-anatomy.md; BC-COLOR-03 (status pairing)"
      - id: BC-DV-07
        statement: "Hover/focus tooltip on every data mark by default; it enhances, never gates (every value also reachable via labels or the table view)."
        severity: major
        weight: 2
        check: structural
        validator: null
        validator_blocked: not_yet_wired
        machine_hint: "data visual without tooltip / value reachable only by hover"
        source: "dataviz skill references/interaction.md (tooltips & hover)"
      - id: BC-DV-08
        statement: "Filters in one row above the charts they scope; every chart, stat and table re-renders against the same slice; date range first."
        severity: major
        weight: 1
        check: judge
        machine_hint: "filter inside a chart card / per-chart filter / filters split across rows"
        source: "dataviz skill references/interaction.md (filters & time ranges)"
      - id: BC-DV-09
        statement: "Table view for every chart: the data behind the graphic is one click away (and exportable)."
        severity: major
        weight: 2
        check: structural
        validator: null
        validator_blocked: not_yet_wired
        machine_hint: "chart without a table toggle / show-as-table"
        source: "dataviz skill references/anti-patterns.md (no table view)"
        gilt_fuer:
          powerbi: "nativ: 'Als Tabelle anzeigen' im Visual-Kopf"
      - id: BC-DV-10
        statement: "Own dark mode: dark palette and surfaces validated separately (not inverted), charts follow the host theme."
        severity: minor
        weight: 1
        check: structural
        validator: null
        validator_blocked: not_yet_wired
        machine_hint: "no dark palette / dark palette not run through the validator"
        source: "dataviz skill references/palette.md (light/dark instance)"
        gilt_fuer:
          powerbi: "entfaellt: Power-BI-Berichte haben keinen Dunkelmodus für Leser; das Theme bleibt hell"
      - id: BC-DV-11
        statement: "Rendered and visually checked before delivery (headless render + screenshot review), not only validated."
        severity: minor
        weight: 1
        check: structural
        validator: null
        validator_blocked: render_verification
        machine_hint: "no render evidence (screenshot) for the delivered version"
        source: "dataviz skill (render + visual check); KONZEPT_REPORT_QUALITAET.md (render-based judge)"
