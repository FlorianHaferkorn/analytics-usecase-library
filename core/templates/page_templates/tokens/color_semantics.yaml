# color_semantics.yaml — Machine-readable design tokens (tool-agnostic)
# Consumed by: products/fabric/powerbi/tooling/page_scaffold_generator/config_loader.py
# Prose documentation: governance/Color_Semantics_Formatting.md
# Authority: Storytelling_Principles.md §9 · Design_Spec_3_30_300.md §7.1
# Connector bindings (PBI theme.json, CSS vars): governance/Color_Semantics_Formatting.md
# Schema version: 1.1
#
# Semantic colour assignments conform to ISO 3864-1:2011 (Safety colours for workplaces
# and public areas) and IEC 60073 (Indicator lamp and actuator colour coding):
#   Red   = danger / immediate action required   → semantic.negative
#   Amber = warning / attention needed            → semantic.warning
#   Green = normal / on target                   → semantic.positive
# Never invert these conventions for aesthetic reasons.
#
# WCAG 2.2 AA compliance (W3C, October 2023):
#   SC 1.4.3 Text Contrast: all semantic hex values validated ≥4.5:1 on surface.card (#FFFFFF)
#   SC 1.4.11 Non-Text Contrast: all data-series and semantic fill colours validated ≥3:1
#     against surface.card and surface.page backgrounds — applies to chart lines, bars,
#     data points, axis indicators, and icon glyphs used as status signals

schema_version: "1.1"

semantic:
  positive: "#107C10"   # Favourable delta, above target — WCAG AA validated
  negative: "#A4262C"   # Unfavourable delta, below target — WCAG AA validated
  warning:  "#C98A00"   # Near threshold, attention needed — WCAG AA validated
  neutral:  "#605E5C"   # No signal, informational, no target set

# Severity tints — 15% alpha overlays for row/background highlighting
# Used in exception tables (T3) and prescriptive tables (T4)
severity_tints:
  critical: "#FFE6E6"   # semantic.negative at ~15% alpha on white
  warning:  "#FFF8E1"   # semantic.warning at ~15% alpha on white
  good:     "#E6F5E6"   # semantic.positive at ~15% alpha on white

# brand.default provides fallback values when no brand_spec.yaml is configured.
# At generation time ConfigLoader.resolve_color_tokens() replaces these with
# values from showcases/<showcase_id>/brand/brand_spec.yaml.
brand:
  primary:   "#0078D4"  # First data series, KPI trend line, reference lines
  secondary: "#50E6FF"  # Second data series, supporting metrics
  data_colors:
    - "#0078D4"   # slot 0
    - "#50E6FF"   # slot 1
    - "#8661C5"   # slot 2
    - "#F7630C"   # slot 3
    - "#008575"   # slot 4
    - "#E3008C"   # slot 5
    - "#EF6950"   # slot 6
    - "#FFB900"   # slot 7

surface:
  page:    "#F5F5F5"   # page background
  card:    "#FFFFFF"   # visual / card background
  row_alt: "#F9F9F9"   # alternating table row

text:
  primary:   "#201F1E"  # titles, values, labels
  secondary: "#605E5C"  # axis labels, footnotes (muted)

border:
  default: "#E1DFDD"   # visual borders, grid lines (0.5px, 8px radius)

# Colorblind-safe variance pair (blue/orange) — use instead of semantic.positive/negative
# when printing or when CVAA compliance is critical. Always pair with icon regardless.
colorblind_safe:
  positive: "#0078D4"   # brand.primary (blue)
  negative: "#F7630C"   # brand.data_colors[3] (orange)

# IBCS Scenario Encoding — fill/shape rules for AC/PL/FC/PY on the same visual.
# Authority: HICHERT, Rolf; FAISST, Jürgen — Solid, Outlined, Hatched (IBCS Institute, 2020)
# Color is shared; fill pattern distinguishes scenarios — never use a second color for scenarios.
# Connector implementation notes:
#   PBI: custom SVG marker / theme.json pattern for hatching; heavier stroke for outlined
#   CSS: background-image: repeating-linear-gradient(45deg, ...) for hatch; border-only for outlined
#   Fallback (no native hatch): outlined = stroke 2.5px; forecast = stroke dashed 2px
ibcs_scenario:
  ac:               # Actual / Current period
    fill: solid
    opacity: 1.0
    abbreviation: "AC"
  pl:               # Plan / Budget
    fill: outlined   # Same color as AC, no fill; border/stroke only
    opacity: 1.0
    abbreviation: "PL"
  fc:               # Forecast
    fill: hatched    # Crosshatch pattern at 45°
    opacity: 1.0
    abbreviation: "FC"
  py:               # Prior Year
    fill: solid
    opacity: 0.5     # Tint: 50% alpha overlay of AC fill color
    abbreviation: "PY"
