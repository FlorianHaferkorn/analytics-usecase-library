# typography.yaml — Machine-readable typography scale (tool-agnostic)
# Consumed by: products/fabric/powerbi/tooling/page_scaffold_generator/config_loader.py
# Prose documentation: governance/Color_Semantics_Formatting.md §Typography
# Authority: Storytelling_Principles.md §10
# Schema version: 1.0

schema_version: "1.0"

# All sizes in pt at 1280×720 design base canvas.
# Connector scaling:
#   1920×1080 production: add +2pt to all roles
#   PDF/print export:     add +2pt additional (total +4pt vs design base)
# See connectors/PowerBI_Connector.md for PBI-specific font compensation.

font_family:
  preferred: "Segoe UI"      # Fabric / Power BI — body, labels, titles, headers
  # Governed DISPLAY font: highlight values only (kpi_card callout numbers). A distinct
  # geometric face with tabular numerals makes the hero figure read as THE number. This
  # is an intentional two-face system — primary for text, display for highlight values —
  # NOT font drift (BC-TYPE-01 permits the governed display family alongside preferred).
  display: "DIN"             # callout / highlight-value numerals
  display_roles:
    - callout                 # the textClass this face is allowed on
  alternatives:
    - Inter
    - Roboto
    - "Open Sans"
  rule: sans_serif_only
  numerals: tabular           # monospaced numerals required for vertical number comparison

# Welche Schnitte Tabellenziffern HABEN — gemessen, nicht angenommen (05.08.2026).
#
# BC-TYPE-02 verlangt Tabellenziffern in jeder senkrecht verglichenen Zahlenspalte.
# Power BI hat dafuer KEINE Eigenschaft (`formatting search tableEx "numeral|figure|
# tabular"` ist leer) — der einzige Hebel ist die Schriftwahl. Damit haengt die Regel
# an einer Tatsache ueber die Schrift, und die stand bisher nirgends.
#
# Methode: Microsoft dokumentiert `Selawik` als "metrically compatible with Segoe UI"
# (learn.microsoft.com/windows/apps/design/signature-experiences/typography) und stellt
# es quelloffen bereit (github.com/microsoft/selawik). Metrisch kompatibel heisst
# gleiche Vorbreiten. Aus den UFO-Quellen die `<advance width>` der Glyphen zero..nine
# gelesen — sind alle zehn gleich, sind die Ziffern tabular (Definition laut
# learn.microsoft.com/typography/develop/character-design-standards/figures).
#
# Der Light-Schnitt ist der Grund, warum das kein Formalismus ist: er hat VIER
# verschiedene Ziffernbreiten. Eine Zahlenflaeche in Segoe UI Light verletzt BC-TYPE-02,
# und man sieht es einer Theme-Datei nicht an.
tabular_numeral_fonts:
  - family: "Segoe UI"
    weights_verified: [regular, bold]
    evidence: "Selawik-Regular.ufo / Selawik-Bold.ufo — zero..nine je 1 eindeutige Vorbreite (1104 bzw. 1178)"
  - family: "DIN"
    weights_verified: []
    evidence: "unbelegt — die Tokens behaupten es seit jeher, eine Quelle steht nicht dabei. Nur fuer callout im Einsatz, dort einzeilig, also unkritisch."
proportional_numeral_fonts:
  - family: "Segoe UI Light"
    evidence: "Selawik-Light.ufo — zero..nine mit 4 verschiedenen Vorbreiten (730/1022/1055/1087)"
    verdict: "auf Zahlenflaechen VERBOTEN; im aktuellen Theme nur auf subTitle/legend/subheader/categoryLabels/cardVisual-label, also Text"

scale:
  page_title:
    size_min_pt: 16
    size_max_pt: 18
    weight: regular
    color_token: text.primary
    usage: "Page / report title (decision question)"

  section_header:
    size_min_pt: 13
    size_max_pt: 14
    weight: semibold
    color_token: text.primary
    usage: "Visual title — question-oriented (e.g. 'Where are we off plan?')"

  kpi_value:
    size_min_pt: 28
    size_max_pt: 36
    weight: bold
    color_token: text.primary
    usage: "Hero number on KPI card — largest element per card"

  kpi_delta:
    size_min_pt: 13
    size_max_pt: 14
    weight: regular
    color_token: "semantic.*"  # resolved at render time from polarity + variance sign
    usage: "Variance value + direction icon on KPI card"

  kpi_label:
    size_min_pt: 10
    size_max_pt: 11
    weight: regular
    color_token: text.secondary
    muted: true
    usage: "KPI name below the value"

  axis_label:
    size_min_pt: 9
    size_max_pt: 11
    weight: regular
    color_token: text.secondary
    usage: "Chart axis tick labels — max 8 ticks per axis"

  data_label:
    size_min_pt: 10
    size_max_pt: 11
    weight: regular
    color_token: text.primary
    usage: "On-chart data labels — sparse; endpoints and inflection points only"

  table_header:
    size_min_pt: 11
    size_max_pt: 12
    weight: bold
    color_token: text.primary
    usage: "Column headers in tables and matrices"

  table_value:
    size_min_pt: 10
    size_max_pt: 11
    weight: regular
    color_token: text.primary
    usage: "Row values in tables"

  footnote:
    size_min_pt: 8
    size_max_pt: 9
    weight: regular
    color_token: text.secondary
    muted: true
    usage: "Data source, timestamp, filter disclosure"
