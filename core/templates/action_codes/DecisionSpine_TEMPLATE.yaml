schema_version: "1.0"

id: "DEC-SPINE-<DOMAIN>-<FIELD>"
name: "<Decision Spine Name>"
owner_domains: ["<Domain>"]
impact_dimension: "<Impact Dimension>"

purpose:
  intent: >
    <One sentence intent>

decision_context:
  decision_type: "Prescriptive"
  primary_question: >
    <Primary decision question>
  decision_owner_roles:
    - "<Role>"

decision_tradeoffs:
  improves:
    - "<Outcome>"
  risks:
    - "<Risk>"

when_not_to_act:
  conditions:
    - description: "<Condition>"
      signal: "Defined in Action Codes"

escalation_logic:
  principle: "<Escalation principle>"
  escalation_path:
    - level: "EarlyWarning"
      action: "<Action>"
    - level: "RequiredIntervention"
      action: "<Action>"
    - level: "PrescriptiveExecution"
      action: "<Action>"

decision_confidence:
  level: "<Low|Medium|High>"
  rationale:
    - "<Rationale>"

governance:
  ownership:
    accountable_role: "<Role>"
    consulted_roles:
      - "<Role>"
  change_policy:
    - "<Policy>"

quality_rules:
  - "No KPI IDs or thresholds are defined in the spine."
  - "Spine must remain domain-agnostic within its decision field."
