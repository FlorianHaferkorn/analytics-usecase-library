# Fact Data Contract Template (Final 10/10)
# Declarative contract defining the authoritative structure and semantics of a fact table.
# This contract specifies WHAT the data represents, not HOW it is ingested or transformed.

fact:
  name: fact_<domain>_<process>            # e.g. fact_commercial_sales
  description: >
    Transactional fact table capturing measurable business events
    used for KPI evaluation, decision-making, and Action Code triggering.

  grain: <invoice_line | order | daily_snapshot>

  ownership:
    business_owner: <role or team>         # e.g. Head of Controlling
    data_owner: <role or team>             # e.g. Data Platform Team

  # Primary and secondary date semantics of this fact
  date_roles:
    primary: DateKey                       # main analysis date
    secondary: []                          # e.g. [PostingDateKey, DeliveryDateKey]

  keys:
    - DateKey
    - OrgKey
    - <EntityKey>

  # Default privacy assumptions for all fields unless overridden
  privacy_defaults:
    contains_pii: false
    sensitivity: low

  measures:
    - name: <MeasureName>                  # e.g. NetSalesAmount
      type: currency                       # currency | number | integer | percentage
      unit: EUR
      aggregation: sum                    # sum | avg | min | max | last
      additivity: additive                # additive | semi_additive | non_additive
      description: <Business meaning>
      kpi_relevant: true
      kpi_id: <optional_kpi_id>

      # Only required if measure deviates from privacy_defaults
      pii:
        sensitivity: medium                # medium | high

  dimensions:
    - dim_date
    - dim_org
    - dim_<entity>

  currency:
    transaction_currency_column: CurrencyCode
    reporting_currency: EUR
    fx_rate_type: average                 # average | spot | closing

  action_readiness:
    supports_action_codes: true
    trigger_capabilities:
      - threshold
      - trend
      - persistence
    requires_aggregates: true

  freshness:
    expected_latency: daily               # intraday | daily | weekly
    allowed_delay_hours: 24

  governance:
    late_arriving_facts: false
    quality_checks:
      - referential_integrity
      - value_range
      - aggregation_consistency

# Rules:
# - Grain, additivity, and date roles must be explicitly defined.
# - Facts without clear action_readiness must not trigger Action Codes.
# - Privacy defaults apply unless overridden at measure level.
# - This contract is the authoritative input for semantic models and automation.
