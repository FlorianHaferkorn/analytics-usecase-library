evidence_pack_version: "1.0"
use_case_id: XD-004
use_case_title: Executive Action Governance
domain: Experience / Cross-Functional
authored_date: "2026-06-11"
authored_by: framework-architect-agent
reviewed_by: ""
status: draft

process_scope:
  description: >
    Closed-loop executive action-governance cockpit. Tracks whether strategic
    actions routed across domains are completed on time and actually move the KPIs
    they were meant to move. Grounded in PMI/APM Benefits Realization Management
    (identify → execute → sustain), Kaplan & Norton closed-loop management ("The
    Execution Premium"), ITIL 4 Continual Improvement, Gartner Decision Intelligence
    (engineering decisions and feedback loops), and COSO monitoring activities.
    Action Outcome Rate is the % of triggered/closed actions that achieved their
    expected KPI outcome; Action Effectiveness Delta is the measured KPI lift (EUR)
    attributable to executed actions. Scope is execution accountability and benefits
    realization — NOT domain remediation logic itself.
  in_scope:
    - Action Outcome Rate % — share of closed actions that achieved their intended KPI outcome
    - Action Effectiveness Delta — measured EUR KPI lift attributable to executed actions (before/after attribution)
    - Action lifecycle governance — routed → due → completed → outcome-evaluated, at action-instance grain
    - Benefits realization tracking across portfolio/program/project actions (identify, execute, sustain)
    - Closed-loop linkage of executed actions back to the Enterprise Value-at-Risk Index they were meant to reduce
    - Escalation of overdue / stalled / ineffective action instances via X-E3.3 and the cross-domain Impactful-15 action codes
  out_of_scope:
    - Domain-level remediation logic and root-cause analysis of underlying KPIs (owned by domain use cases)
    - Re-triggering or threshold-tuning of domain action codes
    - Executive performance roll-up itself (owned by XD-003)
    - Individual employee performance attribution (owners referenced by role, not identity)
    - Statutory project accounting and external benefit assurance audits
  industry_segment: "Cross-industry, enterprise/executive"
  applicable_frameworks:
    - name: "PMI — Benefits Realization Management: A Practice Guide (identify / execute / sustain life cycle)"
      id: PMI-BRM-2019
    - name: "Kaplan & Norton — The Execution Premium: closed-loop management system linking strategy to operations"
      id: KN-EXECUTION-PREMIUM
    - name: "ITIL 4 — Continual Improvement practice & model (AXELOS)"
      id: ITIL4-CSI
    - name: "Gartner — Decision Intelligence (engineering decisions and outcome feedback loops)"
      id: GARTNER-DI
    - name: "COSO — Internal Control — Integrated Framework (monitoring activities)"
      id: COSO-IC-2013
    - name: "APM — Benefits Management (Association for Project Management)"
      id: APM-BRM

canonical_domain_model:
  outcome_kpis:
    - id: enterprise.action_outcome_rate.pct
      name: Action Outcome Rate %
      definition: >
        % of closed/executed actions that achieved their intended KPI outcome within
        the agreed evaluation window. Successful Actions / Total Closed (executed)
        Actions. This is the headline benefits-realization metric of the closed loop.
      unit: "%"
      direction: maximize
      benchmark_target: >
        No single external benchmark for a bespoke outcome rate; calibrated as
        quarter-over-quarter improvement. Strategy-execution research provides the
        target rationale: companies typically realize only ~60% of strategy value
        (≈40% lost to execution breakdowns), so an improving outcome rate that closes
        this gap is the target.
      benchmark_source_id: SRC-005
    - id: enterprise.value_at_risk.index
      name: Enterprise Value-at-Risk Index
      role: guardrail
      definition: >
        Cross-link outcome: the composite enterprise risk index (defined in XD-003)
        that effective action governance is ultimately meant to reduce. Used here as
        the closed-loop "did the action actually lower enterprise risk" check.
      unit: index
      direction: minimize
      causal_mechanism: >
        Closed-loop linkage (Kaplan-Norton): if actions are closing but the value-at-risk
        index they targeted does not fall, outcomes are administrative, not real.
      benchmark_target: "Internally calibrated risk-appetite band (see XD-003)"
      benchmark_source_id: SRC-002

  driver_kpis:
    - id: enterprise.action_effectiveness_delta.amount
      name: Action Effectiveness Delta
      definition: >
        Average measured EUR impact per achieved action — the realized KPI lift
        (post-KPI minus pre-KPI value, valued in EUR) attributable to executed
        actions, before/after attribution.
      unit: EUR
      direction: maximize
      drives: enterprise.action_outcome_rate.pct
      causal_mechanism: >
        Quantifies how much each successful action actually moved its target KPI.
        A high outcome rate with a low effectiveness delta means actions are
        technically successful but immaterial — benefits realization is shallow.
      benchmark_target: "Improvement vs own baseline; positive and material per action family"
      benchmark_source_id: SRC-001
    - id: enterprise.value_at_risk.index
      name: Enterprise Value-at-Risk Index
      definition: "Composite enterprise risk index (XD-003) that the action loop targets."
      unit: index
      direction: minimize
      drives: enterprise.action_outcome_rate.pct
      causal_mechanism: >
        The risk the loop exists to reduce. Movement (or lack of movement) of the
        index after action closure is the ultimate benefits-realization signal.
      benchmark_target: "Risk-appetite band (XD-003)"
      benchmark_source_id: SRC-002

  diagnostic_kpis:
    - id: enterprise.action_latency.days
      name: Action Latency (Days to Close)
      definition: "Elapsed days from action routed to action completed; lateness vs due date."
      unit: days
      direction: minimize
      diagnoses: enterprise.action_outcome_rate.pct
      causal_mechanism: >
        Late closure (ITIL CSI / Bain decision speed) erodes outcome rate — value
        decays the longer an action sits open. Separates governance failure (latency)
        from domain execution complexity.
    - id: enterprise.action_coverage.pct
      name: Action Coverage %
      definition: "% of triggered KPI deviations that actually generated a routed action with a clear owner and due date."
      unit: "%"
      direction: maximize
      diagnoses: enterprise.action_outcome_rate.pct
      causal_mechanism: >
        Low coverage means deviations are detected but not acted on (the BRM 'identify
        but never execute' gap). Coverage must be read before outcome rate to avoid
        survivorship bias on the few actions that were routed.
    - id: enterprise.time_to_impact.days
      name: Time-to-Impact (Days to Outcome)
      definition: "Elapsed days from action completion to confirmed KPI outcome evaluation."
      unit: days
      direction: minimize
      diagnoses: enterprise.action_effectiveness_delta.amount
      causal_mechanism: >
        Distinguishes 'not yet realized' from 'failed'. An action evaluated before
        its review window closes can be wrongly scored ineffective (false negative).

  guardrails:
    - description: Do not score outcome before the evaluation window closes
      condition: >
        Outcome evaluation only after the domain-specific review window has elapsed.
        Marking an action ineffective before its time-to-impact window completes
        produces false negatives (ITIL CSI / BRM sustain stage).
      affected_kpis:
        - enterprise.action_outcome_rate.pct
        - enterprise.action_effectiveness_delta.amount
    - description: Exclude informational / observation-only actions
      condition: >
        Informational or monitoring-only actions must be excluded from the outcome
        denominator to avoid governance noise that depresses the rate artificially.
      affected_kpis:
        - enterprise.action_outcome_rate.pct
    - description: Governance evaluates follow-through, not domain logic
      condition: >
        Do not use governance metrics to second-guess or re-tune domain remediation
        logic without domain context — XD-004 evaluates lifecycle/benefit quality
        only (COSO monitoring activities, not control re-design).
      affected_kpis:
        - enterprise.action_outcome_rate.pct
        - enterprise.action_effectiveness_delta.amount

  wrong_interpretations:
    - description: Vanity 'actions taken / routed' count instead of outcome rate
      why_wrong: >
        Counting how many actions were routed measures activity, not benefit. BRM and
        Decision Intelligence both stress that volume of decisions/actions is not the
        same as realized outcome — a rising routed count with a flat or falling
        outcome rate is a governance red flag, not progress.
      source_id: SRC-001
    - description: Survivorship bias in action attribution
      why_wrong: >
        Computing outcome rate only over completed actions ignores deviations that
        never generated an action (coverage gap) and stalled actions silently
        dropped. The 'survivors' look effective while the population is failing;
        coverage % must be reported alongside outcome rate.
      source_id: SRC-006
    - description: Treating closure as outcome (administrative closure)
      why_wrong: >
        An action marked 'done' has not necessarily moved its KPI. Kaplan-Norton's
        closed loop and COSO monitoring require linking closure to actual KPI
        movement; optimizing for closure rate rather than effect inflates governance
        health while enterprise performance stalls.
      source_id: SRC-002
    - description: Correlation ≠ causation in effectiveness delta
      why_wrong: >
        A KPI improving after an action does not prove the action caused it —
        seasonality, concurrent actions, or market shifts confound naive before/after
        deltas. Effectiveness delta needs a defined attribution method (before/after
        baseline window, ideally with control/counterfactual) per Bain decision-yield
        and DI feedback-loop rigor.
      source_id: SRC-009

required_data_model:
  required_facts:
    - table: fact_action_governance
      description: >
        Action lifecycle ledger at action_instance grain — routed date, due date,
        completion date, evaluation date, owner role, status, routed/successful
        action counts, outcome success flag (existing governance.yaml contract).
    - table: fact_action_outcome
      description: >
        Outcome ledger at action_outcome grain — action_code_id, domain, outcome_status,
        days_to_outcome, impact_value (EUR KPI lift), cost_to_execute, pre/post KPI
        values for before/after attribution (existing governance.yaml contract).
    - table: fact_kpi_snapshot
      description: >
        Cross-domain KPI actual/plan/LY snapshots (shared with XD-003) used as the
        pre/post baseline for measuring action effectiveness delta against target KPIs.
  required_dimensions:
    - name: dim_date
      grain_relevance: Month/quarter cadence plus exact dates for latency and time-to-impact.
    - name: dim_org
      grain_relevance: Entity / region for ownership concentration and RLS.
    - name: dim_action_code
      grain_relevance: Action code, domain action code, and action family for outcome attribution by code.
    - name: dim_domain
      grain_relevance: Distinguishes governance failure from domain execution complexity across domains.
  preferred_grain: action_instance
  minimum_grain: action_outcome
  minimum_history_months: 12
  required_measures:
    - name: Action Outcome Rate %
      formula_seed: "actions_with_achieved_outcome / total_closed_actions (excluding informational; only after eval window)"
      source_id: SRC-001
    - name: Action Effectiveness Delta
      formula_seed: "AVERAGE(impact_value) over achieved rows = AVG(post_kpi_value - pre_kpi_value valued in EUR)"
      source_id: SRC-001
    - name: Action Latency (Days to Close)
      formula_seed: "AVERAGE(completion_date - routed_date); lateness = completion_date - due_date"
      source_id: SRC-003
    - name: Action Coverage %
      formula_seed: "triggered_deviations_with_routed_action / total_triggered_deviations"
      source_id: SRC-006
    - name: Time-to-Impact (Days)
      formula_seed: "AVERAGE(evaluation_date - completion_date) for achieved outcomes"
      source_id: SRC-003

action_logic_seeds:
  - trigger_driver: enterprise.action_outcome_rate.pct
    trigger_diagnostic: enterprise.action_latency.days
    trigger_condition: "Routed action volume rising while outcome rate flat/falling AND overdue (latency > due window) actions accumulating in specific owners/entities"
    guardrail: "Exclude informational actions; do not re-route actions already under an executive escalation"
    action_description: >
      Trigger Executive Action Governance — escalate overdue/stalled action instances,
      surface ownership concentration, and force follow-through on routed-but-unclosed
      actions.
    expected_outcome_kpi: enterprise.action_outcome_rate.pct
    action_code_candidate: X-E3.3
  - trigger_driver: enterprise.action_effectiveness_delta.amount
    trigger_diagnostic: enterprise.time_to_impact.days
    trigger_condition: "Closure rate healthy but outcome rate / effectiveness delta low after evaluation windows have closed"
    guardrail: "Only evaluate after the domain-specific review window elapsed; avoid false-negative on not-yet-realized actions"
    action_description: >
      Force outcome-based (not status-only) follow-up — re-open or re-route closed
      actions that did not move their target KPI, and feed the closed loop back to the
      originating domain code (e.g. C-S1.1, O-O1.1, F-C1.1).
    expected_outcome_kpi: enterprise.action_effectiveness_delta.amount
    action_code_candidate: X-E3.3
  - trigger_driver: enterprise.action_outcome_rate.pct
    trigger_diagnostic: enterprise.action_coverage.pct
    trigger_condition: "Coverage % low — many triggered KPI deviations across Impactful-15 domains never generated an owned, routed action"
    guardrail: "Do not penalise domains where deviations were within normal band or already mitigated by an active action"
    action_description: >
      Surface the 'identify-but-never-execute' benefits-realization gap to the
      executive forum so detected cross-domain deviations (e.g. via O-O1.1, C-C3.1,
      S-R2.1) are actually routed and owned.
    expected_outcome_kpi: enterprise.action_outcome_rate.pct
    action_code_candidate: X-E3.3

