# ──────────────────────────────────────────
# 6. MAPPING READINESS
# ──────────────────────────────────────────
mapping_readiness:
  kpi_catalog_coverage: complete
  factsheet_coverage: complete
  bracket_coverage: complete
  action_code_coverage: complete
  semantic_model_coverage: partial

  gap_summary:
    content_gaps:
      - gap_type: content_gap
        severity: medium
        affected_artifact: core/usecases/core/XD-004_Executive_Action_Governance/Business_Factsheet.md
        field: "Section 8 Success Criteria / benchmark targets"
        description: >
          Benchmark targets not stated: action outcome/closure rate ≥ 85–90% (outcome-verified),
          time-to-outcome trending down within the X-E3.3 90-day follow-up window, and 100%
          accountability coverage (single owner, due date, status, outcome flag). Added to make the
          success criteria measurable against a world-class decision-governance reference.
        evidence_reference: SRC-008 SRC-009 SRC-004
        remediation: "Add outcome-rate / time-to-outcome / accountability-coverage targets to the factsheet success criteria."
        status: resolved

    mapping_gaps: []

    schema_gaps: []

    generator_gaps: []

    model_gaps:
      - gap_type: model_gap
        severity: medium
        affected_artifact: core/data_contracts/domains/governance.yaml
        field: dim_owner_role (conformed owner-role dimension)
        description: >
          OwnerRole exists only as a degenerate text column on fact_action_governance; there is no
          conformed dim_owner_role. The accountability-coverage guardrail, owner/domain heatmap, and
          ownership-concentration diagnostics (single-A / single-D enforcement) require a governed
          owner-role dimension to attribute and slice closure quality by accountable owner.
        evidence_reference: SRC-005 SRC-006
        remediation: "Add dim_owner_role to the governance contract and conform fact_action_governance.OwnerRole to it."
        status: open

      - gap_type: model_gap
        severity: medium
        affected_artifact: core/data_contracts/domains/governance.yaml
        field: fact_action_outcome PreKPIValue / PostKPIValue (verified-outcome lineage)
        description: >
          X-E3.3 outcome evaluation references PreKPIValue / PostKPIValue (before-after attribution),
          but fact_action_outcome carries only outcome_status and impact_value — the pre/post KPI
          lineage that distinguishes verified outcome from administrative closure is not defined in
