mapping_readiness:
  kpi_catalog_coverage: complete
  factsheet_coverage: partial
  bracket_coverage: partial
  action_code_coverage: complete
  semantic_model_coverage: partial

  gap_summary:
    content_gaps:
      - gap_type: content_gap
        severity: medium
        affected_artifact: core/usecases/core/XD-004_Executive_Action_Governance/Business_Factsheet.md
        field: "Section 3 KPI & Action Code Overview"
        description: >
          Factsheet lists only enterprise.action_routed.count (deprecated) as the
          influencing KPI and X-E3.3 as the only action code, but the bracket and
          domain model also use action_effectiveness_delta and value_at_risk plus the
          16 cross-domain Impactful-15 codes.
        evidence_reference: SRC-001 SRC-013
        remediation: "Update Section 3 to reflect action_effectiveness_delta + value_at_risk influencers and the cross-domain action-code set; retire action_routed.count reference."
        status: open
      - gap_type: content_gap
        severity: low
        affected_artifact: core/usecases/core/XD-004_Executive_Action_Governance/Business_Factsheet.md
        field: "Section 9 Risks & Wrong Interpretations"
        description: "Survivorship bias and correlation≠causation in effectiveness delta not explicitly stated."
        evidence_reference: SRC-006 SRC-009
        remediation: "Add coverage/survivorship and attribution caveats to Section 9."
        status: open

    mapping_gaps:
      - gap_type: mapping_gap
        severity: medium
        affected_artifact: core/usecases/core/XD-004_Executive_Action_Governance/UseCase_Bracket.yaml
        field: ux_layout_rules.page_2_execution.component_300s.evidence_columns
        description: >
          Diagnostic KPIs action_latency, action_coverage, and time_to_impact are
          required for governance diagnosis but are not all present as evidence columns
          (only days_to_outcome is listed).
        evidence_reference: SRC-003 SRC-006
        remediation: "Add latency, coverage, and time-to-impact columns to the page-2 outcome-detail evidence grain."
        status: open
      - gap_type: mapping_gap
        severity: low
        affected_artifact: core/usecases/core/XD-004_Executive_Action_Governance/UseCase_Bracket.yaml
        field: governance.domain / influencing_kpi_ids
        description: "Bracket domain is 'Experience' while factsheet metadata says 'Executive / Governance'; influencing KPI list differs from factsheet."
        evidence_reference: SRC-001
        remediation: "Reconcile domain label and influencing-KPI list between bracket and factsheet."
        status: open

    schema_gaps: []
    generator_gaps: []
    model_gaps:
      - gap_type: model_gap
        severity: high
        affected_artifact: core/data_contracts/domains/governance.yaml
        field: "Action Coverage % numerator/denominator + triggered-deviation feed"
        description: >
          fact_action_governance and fact_action_outcome exist, but Action Coverage %
          requires a record of triggered KPI deviations that did NOT generate a routed
          action (the 'identify-but-not-executed' population). No fact currently captures
          un-actioned triggered deviations, so coverage % cannot yet be computed without
          survivorship bias.
        evidence_reference: SRC-006 SRC-001
        remediation: "Add a triggered-deviation ledger (or extend fact_action_governance) capturing detected deviations and whether an action was routed; link to dim_action_code/dim_domain."
        status: open
      - gap_type: model_gap
        severity: medium
        affected_artifact: products/fabric/powerbi/dist/Experience.SemanticModel
        field: "Action Effectiveness Delta attribution + pre/post KPI baseline"
        description: >
          Effectiveness delta uses fact_action_outcome.impact_value, but a robust
          before/after attribution needs pre/post KPI baseline windows joined to
          fact_kpi_snapshot. The attribution measure and counterfactual logic are not
          yet validated against BRM/decision-yield methodology.
        evidence_reference: SRC-001 SRC-009
        remediation: "Define and validate Action Effectiveness Delta with before/after baseline windows and an attribution guard in _Measures.tmdl."
        status: open
