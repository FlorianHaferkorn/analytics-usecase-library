schema_version: '2.0'
id: XD-004
title: Executive Action Governance
domain: Experience

governance:
  owner_role: chief_of_staff_pmo_lead
  steward_role: executive_office_pmo_bi_lead

orchestration:
  strategic_kpi_id: enterprise.action_outcome_rate.pct
  influencing_kpi_ids:
    - enterprise.action_effectiveness_delta.amount
    - enterprise.value_at_risk.index
  supporting_kpi_ids:
    # Cross-domain KPIs pulled into closure via Impactful 15 action code trigger chains
    - cost.material.pct
    - cost.opex.vs_plan.pct
    - crm.churned_customers.count
    - crm.lifetime_revenue.amount
    - fin.liquidity.inventory.amount
    - inv.obsolete.pct
    - inv.stockout.pct
    - inv.turnover
    - margin.cogs.pct
    - ops.downtime.unplanned.pct
    - ops.failure.count
    - ops.labor.productivity.pct
    - ops.mttr.hours
    - ops.pm_compliance.pct
    - ops.throughput.units
    - ops.quality.defect_rate.pct
    - ops.spare_parts.stockout.pct
    - ops.working_capital.ccc.days
    - ops.yield.pct
    - people.attrition_risk.pct
    - people.digital_adoption.pct
    - plan.forecast.mape.pct
    - plan.forecast.accuracy.pct
    - plan.forecast.bias.pct
    - plan.forecast.service_impact.pct
    - quality.complaint.pct
    - quality.copq.amount
    - quality.defect_density
    - quality.rework.pct
    - quality.scrap.pct
    - sales.net_sales.amount
    - sales.net_sales.delta_pct.ly
    - sales.price.list.amount
    - sales.price.net.amount
    - sales.promo.baseline_sales.amount
    - sales.promo.cost.amount
    - sales.promo.incremental_gm.amount
    - sales.pvm.price_effect.amount
    - sales.pvm.volume_effect.amount
    - supply.in_full.pct
    - supply.on_time.pct
    - supply.stockout_impact.pct
    - cost.cogs.amount
    - crm.active_customers.count
    - crm.clv.amount
    - crm.complaint.count
    - crm.nps.index
    - crm.retention.pct
    - margin.gm.pct
    - sales.promo.incremental.amount
    - supply.otif.pct
    - svc.aht.minutes
    - svc.backlog.count
    - svc.escalation.pct
    - svc.fcr.pct
    - svc.sla.attainment.pct
    - svc.tickets.closed.count
    - svc.tickets.created.count
    - wc.dio.days
    - wc.dpo.days
    - wc.dso.days
    - enterprise.actions_executed.count
    - enterprise.avg_time_to_outcome.days
    - enterprise.action_roi.pct
  action_code_ids:
    - C-M2.1
    - C-M2.2
    - C-S1.1
    - C-S1.2
    - C-C3.1
    - F-C1.1
    - F-C1.2
    - F-K2.1
    - O-A2.1
    - O-O1.1
    - O-O1.2
    - O-O1.3
    - O-Q3.1
    - S-I1.1
    - S-R2.1
    - X-E3.3

primary_kpi_ids:
  - enterprise.action_outcome_rate.pct

value_driver_model:
  formula: >
    enterprise.action_outcome_rate.pct = achieved_actions / total_executed_actions
  impact_direction: maximize
  primary_driver: enterprise.action_outcome_rate.pct
  impact_logic: >
    Executive action effectiveness improves when Impactful 15 action codes are
    executed on time, owned clearly, and produce confirmed outcomes tracked
    against agreed KPI improvements in fact_action_outcome.

ux_layout_rules:
  report_structure: 2-Page-Lead
  report_canvas:
    width: 1280
    height: 720
  page_1_summary:
    title: Executive Action Governance — Overview
    page_type: T1_Strategic_Overview
    template_variant: T1_Portfolio
    template_id: pulse
    decision_question: "Is the action governance cycle delivering verified business impact?"
    component_3s:
      kpi_id: enterprise.action_outcome_rate.pct
      visual_type: kpi_card
      comparison: vs_target
      status_logic: higher_is_better
    component_30s:
      - kpi_id: enterprise.action_outcome_rate.pct
        visual_type: trend_line
        message: "Action outcome rate is the KPI that verifies whether the governance cycle is closing on real business impact"
        so_what: "Tracking verified outcomes, not just actions closed, keeps the governance cycle honest about impact delivered."
      - kpi_id: enterprise.value_at_risk.index
        visual_type: bar_chart
        message: "Value at risk is concentrated where action follow-through is weakest across domains"
        so_what: "Prioritising domains with the highest value at risk directs governance attention to where it matters most."
  page_2_execution:
    title: Executive Action Governance — Outcome Detail
    decision_question: "Which action domains need governance intervention to convert into verified outcomes?"
    page_type: T4_Prescriptive_Recommendation
    template_variant: T4_ActionDecision
    template_id: action_matrix
    component_300s:
      evidence_grain: action_outcome
      evidence_columns:
        - action_code_id
        - domain
        - severity_level
        - outcome_status
        - days_to_outcome
        - impact_value
        - cost_to_execute
      # BC-CHART-10 (Craft-Core §5.4 / R1.3): governed worst-first sort + Top-N (R2.1 sort_by/top_n).
      sort_by:
        measure: impact_value
        direction: ascending
      top_n: 20
      action_panel: true
      payload_mode: full

prioritization:
  business_value: high
  implementation_effort: low
  confidence: 0.9
  reach: organization
  priority_score: 88

data_protection:
  # DSGVO Art. 25 Privacy by Design and by Default
  # Authority: core/templates/page_templates/governance/Data_Protection_Governance.md
  personal_data: false
  legal_basis: not_applicable
  data_minimisation: >
    Action governance metrics displayed at initiative and business-unit grain.
    No individual employee attribution — action owners are referenced by role,
    not identity. Row-level security applied at SemanticModel level.
  access_restriction: >
    executive_sponsor and xd_bi_lead roles; governance data visible to action
    owners for their assigned initiatives only.
  dpia_required: false
  ai_generated_output: false
readiness:
  data_availability: available
  org_capability: developing
  stakeholder_alignment: aligned
  overall_readiness: green

overrides:
  data_contract_ref: core/data_contracts/domains/governance.yaml

documentation:
  business_factsheet: ./Business_Factsheet.md
  evidence_pack: ./Domain_Evidence_Pack.yaml
