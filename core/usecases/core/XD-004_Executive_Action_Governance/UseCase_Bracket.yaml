schema_version: '2.0'
id: XD-004
title: Executive Action Governance
domain: Experience

governance:
  owner_role: chief_of_staff_pmo_lead
  steward_role: executive_office_pmo_bi_lead

orchestration:
  strategic_kpi_id: enterprise.action_outcome_rate.pct
  influencing_kpi_ids:
    - enterprise.value_at_risk.index
  supporting_kpi_ids:
    # Cross-domain KPIs pulled into closure via Impactful 15 action code trigger chains
    - cost.material.pct
    - cost.opex.vs_plan.pct
    - crm.churned_customers.count
    - crm.lifetime_revenue.amount
    - fin.liquidity.inventory.amount
    - inv.obsolete.pct
    - inv.turnover
    - margin.cogs.pct
    - ops.downtime.unplanned.pct
    - ops.failure.count
    - ops.labor.productivity.pct
    - ops.mttr.hours
    - ops.otif.pct
    - ops.pm_compliance.pct
    - ops.production.volume
    - ops.quality.defect_rate.pct
    - ops.spare_parts.stockout.pct
    - ops.working_capital.ccc.days
    - ops.yield.pct
    - people.attrition_risk.pct
    - people.digital_adoption.pct
    - plan.forecast.mape.pct
    - plan.forecast.service_impact.pct
    - quality.complaint.pct
    - quality.copq.amount
    - quality.rework.pct
    - sales.net_sales.amount
    - sales.net_sales.delta_pct.ly
    - sales.price.list.amount
    - sales.price.net.amount
    - sales.promo.baseline_sales.amount
    - sales.promo.cost.amount
    - sales.promo.incremental_gm.amount
    - sales.pvm.price_effect.amount
    - sales.pvm.volume_effect.amount
    - supply.in_full.pct
    - supply.on_time.pct
    - supply.stockout_impact.pct
    - svc.escalation.pct
    - svc.tickets.closed.count
    - wc.dio.days
    - wc.dpo.days
    - wc.dso.days
  action_code_ids:
    # Impactful 15 — full outcome loop visible in this governance view
    - C-M2.1
    - C-M2.2
    - C-C3.1
    - C-C3.2
    - C-P4.1
    - F-C1.1
    - F-K2.1
    - O-A2.1
    - O-Q3.1
    - O-Q3.2
    - S-I1.2
    - S-R2.1
    - S-F3.1
    - X-S1.1
    - X-S1.2
    - X-E3.3

primary_kpi_ids:
  - enterprise.action_outcome_rate.pct

value_driver_model:
  formula: >
    enterprise.action_outcome_rate.pct = achieved_actions / total_executed_actions
  impact_direction: maximize
  primary_driver: enterprise.action_outcome_rate.pct
  impact_logic: >
    Executive action effectiveness improves when Impactful 15 action codes are
    executed on time, owned clearly, and produce confirmed outcomes tracked
    against agreed KPI improvements in fact_action_outcome.

ux_layout_rules:
  report_structure: 2-Page-Lead
  report_canvas:
    width: 1280
    height: 720
  page_1_summary:
    title: Executive Action Governance — Overview
    page_type: T1_Strategic_Overview
    template_id: pulse
    component_3s:
      kpi_id: enterprise.action_outcome_rate.pct
      visual_type: kpi_card
    component_30s:
      - kpi_id: enterprise.action_outcome_rate.pct
        visual_type: trend_line
      - kpi_id: enterprise.value_at_risk.index
        visual_type: bar_chart
  page_2_execution:
    title: Executive Action Governance — Outcome Detail
    page_type: T4_Prescriptive_Recommendation
    template_id: action_matrix
    component_300s:
      evidence_grain: action_outcome
      evidence_columns:
        - action_code_id
        - domain
        - severity_level
        - outcome_status
        - days_to_outcome
        - impact_value
        - cost_to_execute
      action_panel: true
      payload_mode: full

prioritization:
  business_value: high
  implementation_effort: low
  confidence: 0.9
  reach: organization
  priority_score: 88

readiness:
  data_availability: available
  org_capability: developing
  stakeholder_alignment: aligned
  overall_readiness: green

overrides:
  data_contract_ref: core/data_contracts/domains/governance.yaml

documentation:
  business_factsheet: ./Business_Factsheet.md
