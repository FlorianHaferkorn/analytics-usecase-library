value_driver_model:
  formula: >
    KPI-GOV-001 = achieved_actions / total_executed_actions
  impact_direction: maximize
  primary_driver: KPI-GOV-001
  impact_logic: >
    Executive action effectiveness improves when Impactful 15 action codes are
    executed on time, owned clearly, and produce confirmed outcomes tracked
    against agreed KPI improvements in fact_action_outcome.

ux_layout_rules:
  report_structure: 2-Page-Lead
  intent_rules_version: 2
  title_statements_verified: false
  page_1_summary:
    title: Executive Action Governance — Overview
    page_type: T1_Strategic_Overview
    template_variant: T1_Portfolio
    template_id: pulse
    decision_question: "Is the action governance cycle delivering verified business impact?"
    big_idea: "Govern actions to verified outcomes by focusing executive attention where weak follow-through and material impact intersect."
    component_3s:
      kpi_id: KPI-GOV-001
      visual_type: kpi_card_with_delta
      comparison: vs_target
      status_logic: higher_is_better
    component_30s:
      - slot_id: Main_1
        kpi_id: KPI-GOV-001
        visual_type: line_chart
        question: "Is the action-governance cycle delivering verified business impact?"
        message: "Outcome-rate trend separates verified business impact from administrative action closure."
        so_what: "A weak or deteriorating outcome rate triggers governance intervention before more activity is mistaken for progress."
        category_field: dim_date.Year
        action_code_id: X-E3.3
        unit: rate
      - slot_id: Main_2
        kpi_id: KPI-GOV-002
        visual_type: horizontal_bar_chart
        # Wortlaut 23.09.2026 an so_what und Sortierung (schwaechste zuerst) angeglichen (Entscheidung Flo).
        question: "Which domains fail to convert actions into verified impact?"
        message: "Domain-level effectiveness ranks where governed actions deliver or fail to deliver verified value."
        so_what: "Executive attention should first address domains combining weak outcomes with material impact exposure."
        category_field: fact_action_outcome.domain
        action_code_id: X-E3.3
        unit: amount
  page_2_execution:
    title: Executive Action Governance — Outcome Detail
    decision_question: "Which action domains need governance intervention to convert into verified outcomes?"
    page_type: T4_Prescriptive_Recommendation
    template_variant: T4_ActionDecision
    template_id: action_matrix
    component_300s:
      evidence_grain: action_outcome
      slicer_field: fact_action_outcome.domain
      # 23.09.2026: die Tabelle zeigt Action-Codes mit governten Measures statt roher
      # Faktenzeilen. Vorher standen hier sechs Spalten von fact_action_outcome, sortiert
      # nach der Spalte `days_to_outcome` -- der Generator band sie als Measure, die es in
      # keinem Modell gibt, und die Top-N-Auswahl griff auf `cost_to_execute` als Entitaet.
      # Die Entitaet steht jetzt zuletzt (Top-N-Feld, wie ProductCode bei COM-002).
      evidence_columns:
        - fact_action_outcome.domain
        - fact_action_outcome.outcome_status
        - fact_action_outcome.action_code_id
        - KPI-GOV-006
        - KPI-GOV-002
        - KPI-GOV-007
      # BC-CHART-10 (Craft-Core §5.4 / R1.3): governed worst-first sort + Top-N (R2.1 sort_by/top_n).
      sort_by:
        measure: KPI-GOV-006
        direction: descending
      top_n: 20
      highlight_rule:
        column: KPI-GOV-006
        type: data_bar
      action_panel: true
      payload_mode: minimal

prioritization:
  business_value: high
  implementation_effort: low
  confidence: 0.9
  reach: organization
  priority_score: 88

data_protection:
  # DSGVO Art. 25 Privacy by Design and by Default
  # Authority: core/templates/page_templates/governance/Data_Protection_Governance.md
  personal_data: false
  legal_basis: not_applicable
  data_minimisation: >
    Action governance metrics displayed at initiative and business-unit grain.
    No individual employee attribution — action owners are referenced by role,
    not identity. Row-level security applied at SemanticModel level.
  access_restriction: >
    executive_sponsor and xd_bi_lead roles; governance data visible to action
    owners for their assigned initiatives only.
  dpia_required: false
  ai_generated_output: false
readiness:
  data_availability: available
  org_capability: developing
  stakeholder_alignment: aligned
  overall_readiness: green

overrides:
  data_contract_ref: core/data_contracts/domains/governance.yaml

documentation:
  business_factsheet: ./Business_Factsheet.md
  evidence_pack: ./Domain_Evidence_Pack.yaml
