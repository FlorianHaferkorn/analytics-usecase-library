schema_version: '2.0'
id: SCM-002
name: Supply Reliability & OTIF
domain: Supply Chain
governance:
  owner_role: Supply Chain Controlling / Logistics Performance
  steward_role: Logistics / Supply Chain BI Lead
  status: active
  last_review: '2026-02-12'
ontology_bracket:
  strategic_kpi_id: supply.otif.pct
  influencing_kpi_ids:
  - supply.on_time.pct
  - supply.in_full.pct
  - supply.stockout_impact.pct
  - supply.penalty.amount
  - supply.expedite.amount
  - order.lines
  - shipments.count
  action_code_ids:
  - S-R2.1
  - S-R2.2
  - S-R2.3
  - S-R2.4
  - S-R2.5
value_driver_model:
  description: supply.otif.pct is driven by influencing KPIs and operational levers.
  formula: supply.otif.pct = f(supply.on_time.pct, supply.in_full.pct, supply.stockout_impact.pct,
    supply.penalty.amount, supply.expedite.amount, order.lines, shipments.count)
ux_layout_rules:
  report_structure: 2-Page-Lead
  page_1_summary_insights:
    title: Supply Chain Summary & Insights
    3s_component: 'North Star: supply.otif.pct'
    30s_components: []
  page_2_execution:
    title: Supply Chain Execution
    300s_components:
    - 'Evidence_Table: (define evidence table requirements)'
    - 'Action_Panel: Integrated Side-Panel for Subscribed Action Codes'
    - 'Payload_Injection: Show Level (L1-L3) and Steps from Action Code YAML'
documentation:
  business_factsheet: ./Business_Factsheet.md
  technical_factsheet: ./Technical_Factsheet.md
