schema_version: '2.0'
id: SCM-002
title: Supply Reliability & OTIF
domain: Supply Chain
governance:
  owner_role: supply_chain_controlling_logistics_performance
  steward_role: logistics_supply_chain_bi_lead
orchestration:
  strategic_kpi_id: supply.otif.pct
  influencing_kpi_ids:
  - supply.on_time.pct
  - supply.in_full.pct
  - supply.stockout_impact.pct
  - supply.penalty.amount
  - supply.expedite.amount
  supporting_kpi_ids:
  - order.lines
  - shipments.count
  action_code_ids:
  - S-R2.1
  - S-R2.2
  - S-R2.3
  - S-R2.4
  - S-R2.5
primary_kpi_ids:
  - supply.otif.pct
  - supply.on_time.pct

value_driver_model:
  formula: supply.otif.pct = f(supply.on_time.pct, supply.in_full.pct, supply.stockout_impact.pct)
  impact_direction: maximize
  primary_driver: supply.on_time.pct
  impact_logic: Improving supply.on_time.pct is the primary lever for maximizing supply.otif.pct.
ux_layout_rules:
  report_structure: 2-Page-Lead
  report_canvas: { width: 1920, height: 1080 }
  # R2.4 (Cut C2): migrated to the intent layer, COM-002 as reference pattern.
  intent_rules_version: 2
  page_1_summary:
    title: Supply Chain Summary & Insights
    page_type: T3_Operational_Monitoring
    template_variant: T3_ProcessControl
    template_id: pulse
    decision_question: "Are suppliers delivering reliably enough to meet customer commitments?"
    big_idea: "OTIF performance is declining — supplier delivery failures in two key categories are creating downstream stockouts and eroding customer satisfaction."
    component_3s:
      kpi_id: supply.otif.pct
      visual_type: kpi_card
      comparison: vs_target
      status_logic: higher_is_better
    component_30s:
    - slot_id: Main_1
      kpi_id: supply.on_time.pct
      visual_type: trend_line
      message: On-time delivery is the component dragging OTIF below target, not in-full
      so_what: "Because on-time performance is dragging OTIF down, carrier and lane-level fixes matter more than in-full stock buffers."
      unit: rate
    - slot_id: Main_2
      # R2.4: was 3 KPIs of 2 different calc_types (rate vs. amount) on one
      # axis -- a ONE_MESSAGE_PER_CHART violation. supply.penalty.amount moved
      # to the Detail_Matrix.
      kpi_ids:
      - supply.in_full.pct
      - supply.stockout_impact.pct
      visual_type: bar_chart
      message: In-full rate and stockout impact — the two OTIF components beyond timeliness.
      so_what: "Ranking penalty cost by supplier focuses the reliability push where the money actually leaks."
      unit: rate
  page_2_execution:
    title: Supply Chain Execution
    decision_question: "Which lanes and suppliers should the reliability push target first?"
    page_type: T3_Operational_Monitoring
    template_variant: T3_ExceptionQueue
    template_id: action_matrix
    component_300s:
      evidence_grain: shipment_line
      # R2.4: curated 12→8. 'location' has no backing dimension table in
      # SupplyChain.SemanticModel -- dropped in favor of customer + lane
      # (both real). Cut order.lines/shipments.count (volume counts, less
      # central to the reliability decision_question).
      evidence_columns:
      - customer
      - lane
      - supply.otif.pct
      - supply.on_time.pct
      - supply.in_full.pct
      - supply.stockout_impact.pct
      - supply.penalty.amount
      - supply.expedite.amount
      action_panel: true
      payload_mode: full
      sort_by:
        measure: supply.otif.pct
        direction: ascending
      top_n: 20
      highlight_rule:
        column: supply.otif.pct
        type: data_bar
prioritization:
  business_value: high
  implementation_effort: medium
  confidence: 0.75
  reach: division
  priority_score: 25
data_protection:
  # DSGVO Art. 25 Privacy by Design and by Default
  # Authority: core/templates/page_templates/governance/Data_Protection_Governance.md
  personal_data: false
  legal_basis: not_applicable
  data_minimisation: >
    Detail Matrix limited to supplier, product-category, and delivery-lane
    grain. Supplier data is at legal-entity level (B2B) — no natural person is
    identified. Row-level security applied at SemanticModel level.
  access_restriction: >
    supply_chain_controlling_lead and scm_bi_lead roles; row-level security
    enforced by SupplyChain.SemanticModel (site filter per org role).
  dpia_required: false
  ai_generated_output: true
  ai_grounding_measure: >
    Active Actions Text (SCM) — DAX measure that reads current filter context
    and concatenates only triggered action texts. See Storytelling_Principles.md
    §13.
readiness:
  data_availability: partial
  org_capability: ready
  stakeholder_alignment: aligned
  overall_readiness: amber
overrides:
  data_contract_ref: core/data_contracts/domains/supply_chain.yaml
documentation:
  business_factsheet: ./Business_Factsheet.md
