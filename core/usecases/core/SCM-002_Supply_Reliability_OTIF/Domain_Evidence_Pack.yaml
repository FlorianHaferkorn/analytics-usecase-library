  factsheet_coverage: partial
  bracket_coverage: complete
  action_code_coverage: complete
  semantic_model_coverage: partial

  gap_summary:
    content_gaps:
      - gap_type: content_gap
        severity: medium
        affected_artifact: core/usecases/core/SCM-002_Supply_Reliability_OTIF/Business_Factsheet.md
        field: "Success Criteria / benchmark targets"
        description: >
          Benchmark targets not stated: OTIF ≥ 95% world-class (≥ 98% under retail compliance),
          On-Time ≥ 97%, In-Full ≥ 98% (Gartner / CSCMP). Add to make success criteria measurable.
        evidence_reference: SRC-004 SRC-005
        remediation: "Add OTIF/On-Time/In-Full world-class targets to the factsheet."
        status: resolved

    mapping_gaps: []

    schema_gaps: []

    generator_gaps: []

    model_gaps:
      - gap_type: model_gap
        severity: medium
        affected_artifact: core/data_contracts/domains/supply_chain.yaml
        field: dim_carrier_lane
        description: >
          On-Time root cause requires carrier/lane attribution. No confirmed carrier/lane
          dimension on fact_fulfillment, so on-time failure cannot be Pareto'd by lane.
        evidence_reference: SRC-001
        remediation: "Add carrier/lane attributes (or a dim_carrier_lane) to the fulfilment contract."
        status: open
