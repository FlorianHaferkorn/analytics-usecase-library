        severity: medium
        affected_artifact: core/usecases/core/SCM-002_Supply_Reliability_OTIF/Business_Factsheet.md
        field: "Section 8 Success Criteria"
        description: "OTIF benchmark targets not stated numerically (>=95% best-in-class, 98% retail/contract programs, On-Time >=97%, In-Full >=98%)."
        evidence_reference: SRC-001 SRC-004 SRC-005
        remediation: "Add benchmark targets and the line-vs-order grain note to Section 8."
        status: open
      - gap_type: content_gap
        severity: high
        affected_artifact: core/usecases/core/SCM-002_Supply_Reliability_OTIF/Business_Factsheet.md
        field: "Section 9 Risks & Wrong Interpretations"
        description: >
          Multiplicative OTIF = On-Time x In-Full decomposition and the expedite-masking
          risk are not explicit. Line-level vs order-level OTIF grain ambiguity not called out.
        evidence_reference: SRC-001 SRC-005 SRC-007
        remediation: "Add the On-Time/In-Full decomposition and expedite-masking interpretations."
        status: open
      - gap_type: content_gap
        severity: medium
        affected_artifact: core/usecases/core/SCM-002_Supply_Reliability_OTIF/UseCase_Bracket.yaml
        field: ux_layout_rules.page_1_summary.component_30s
        description: >
          On-Time and In-Full should be shown as the two decomposed components of OTIF on
          the 30s layer so the user sees which multiplicative component drives the gap.
        evidence_reference: SRC-001
        remediation: "Ensure On-Time and In-Full appear as the component split alongside OTIF."
        status: open

    mapping_gaps: []
    schema_gaps: []
    generator_gaps: []
    model_gaps:
      - gap_type: model_gap
        severity: medium
        affected_artifact: core/data_contracts/domains/supply_chain.yaml
        field: "fact_fulfillment carrier/appointment diagnostics"
        description: >
          Carrier on-time by lane and dock/appointment (MABD) compliance diagnostics require
          a carrier on-time signal and an appointment-window flag. fact_fulfillment carries
          On-Time/In-Full/penalty/expedite but no explicit appointment-compliance column.
        evidence_reference: SRC-005
        remediation: "Verify appointment/MABD window availability; derive from fact_logistics lane timing if absent."
        status: open
