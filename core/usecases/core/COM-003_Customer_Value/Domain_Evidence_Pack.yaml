evidence_pack_version: "1.0"
use_case_id: COM-003
use_case_title: Customer Value
domain: Commercial
authored_date: "2026-06-01"
authored_by: framework-architect-agent
reviewed_by: ""
status: draft

process_scope:
  description: >
    Customer lifetime value maximisation through retention, churn prevention,
    and targeted upsell/cross-sell actions. Covers CLV estimation, churn prediction
    signals, segment profitability, and revenue at risk management.
  in_scope:
    - Customer Lifetime Value (CLV) by segment and key account
    - Retention Rate and churn signals
    - Revenue at risk (customers below CLV threshold or engagement threshold)
    - Net Promoter Score as loyalty signal
    - Upsell/cross-sell conversion rates
  out_of_scope:
    - Acquisition funnel specifics (CST-010)
    - Promotion ROI (COM-004)
    - Win-loss pipeline (COM-010)
  industry_segment: B2B and B2C with recurring purchase patterns
  applicable_frameworks:
    - name: "Gupta, S. & Lehmann, D.R. (2005) CLV Framework — Customer Lifetime Value Theory"
      id: CLV-FRAMEWORK
    - name: RFM Analysis (Recency, Frequency, Monetary) — Segmentation Framework
      id: RFM-FRAMEWORK
    - name: APQC PCF 4.1 — Manage Customer Relationships
      id: APQC-PCF-4.1

canonical_domain_model:
  outcome_kpis:
    - id: crm.clv.amount
      name: Customer Lifetime Value
      definition: >
        Present value of future cash flows from a customer relationship.
        Simplified: CLV = (Average Purchase Value × Purchase Frequency × Customer Lifespan) - CAC
      unit: EUR
      direction: maximize
      benchmark_target: "CLV:CAC ratio ≥ 3:1 (HubSpot / Gartner B2B benchmark)"
      benchmark_source_id: SRC-004

  driver_kpis:
    - id: crm.retention.pct
      name: Customer Retention Rate
      definition: "(Customers at end of period - New customers) / Customers at start × 100"
      unit: "%"
      direction: maximize
      drives: crm.clv.amount
      causal_mechanism: >
        A 5% increase in customer retention produces a 25–95% increase in profit
        (Reichheld & Schefter 2000). Retention is the highest-leverage CLV driver.
      benchmark_target: "85–95% for B2B SaaS; 70–80% for B2B distribution (Gartner 2023)"
      benchmark_source_id: SRC-004

    - id: crm.revenue_at_risk.amount
      name: Revenue at Risk
      definition: >
        Net Sales attributed to customers showing churn signals (NPS < threshold,
        purchase frequency decline, or engagement score below floor).
      unit: EUR
      direction: minimize
      drives: crm.clv.amount
      causal_mechanism: >
        Revenue at risk is the leading indicator for actual churn revenue impact.
        Monitoring enables proactive retention before loss is realised.
      benchmark_target: ""
      benchmark_source_id: ""

    - id: crm.nps.index
      name: Net Promoter Score
      definition: "% Promoters - % Detractors based on 0–10 likelihood to recommend."
      unit: index
      direction: maximize
      drives: crm.clv.amount
      causal_mechanism: >
        NPS is a leading indicator of retention. NPS < 30 is associated with elevated
        churn risk in B2B relationships (Bain & Company research).
      benchmark_target: "NPS ≥ 50 world class; ≥ 30 acceptable (Bain & Company)"
      benchmark_source_id: SRC-003

  diagnostic_kpis:
    - id: crm.churned_customers.count
      name: Churned Customers Count
      definition: Customers lost in the period (no purchase or contract lapse).
      unit: count
      direction: minimize
      diagnoses: crm.retention.pct

    - id: crm.active_customers.count
      name: Active Customers Count
      definition: Customers with at least one purchase/engagement in the measurement period.
      unit: count
      direction: maximize
      diagnoses: crm.retention.pct

  guardrails:
    - description: Low-value customer churn is acceptable
      condition: >
        Revenue at risk and churn alerts must be filtered by CLV threshold.
        Churning unprofitable customers (CLV < 0 or below threshold) is a strategic goal,
        not a problem. Do not trigger retention actions for negative-CLV customers.
      affected_kpis: [crm.revenue_at_risk.amount, crm.retention.pct]

  wrong_interpretations:
    - description: Retention Rate masking profitable churn
      why_wrong: >
        A high retention rate that retains mainly low-value or negative-margin customers
        inflates the metric while reducing portfolio profitability. Retention must always
        be paired with CLV segmentation.
      source_id: SRC-001

    - description: NPS as a standalone revenue predictor
      why_wrong: >
        NPS measures advocacy intent, not actual purchase or retention behavior.
        In B2B settings, NPS can remain high even as purchasing declines if the
        contact respondent is not the decision maker.
      source_id: SRC-005

    - description: Average CLV hiding segment bimodality
      why_wrong: >
        Average CLV is meaningless if the customer portfolio is bimodal (a few large
        accounts driving most value and many small accounts with negative contribution).
        Segment-level CLV is required.
      source_id: SRC-001

