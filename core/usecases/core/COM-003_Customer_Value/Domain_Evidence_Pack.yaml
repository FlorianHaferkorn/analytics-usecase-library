action_logic_seeds:
  - trigger_driver: crm.retention.pct
    trigger_diagnostic: crm.revenue_at_risk.amount
    trigger_condition: "Revenue at risk > 5% of total active customer revenue AND NPS declining"
    guardrail: "Exclude negative-CLV customers from retention actions"
    action_description: Proactive retention outreach for at-risk high-value customers.
    expected_outcome_kpi: crm.clv.amount
    action_code_candidate: C-C3.1

required_data_model:
  required_facts:
    - table: fact_sales
      description: Transactions with customer_id for CLV calculation.
    - table: fact_crm_interactions
      description: NPS surveys, complaints, engagement scores linked to customer_id.
  required_dimensions:
    - name: dim_customer
      grain_relevance: Individual customer CLV and segment assignment.
    - name: dim_date
      grain_relevance: Cohort analysis for retention rate calculation.
  preferred_grain: customer-month
  minimum_grain: customer-quarter
  minimum_history_months: 24
  required_measures:
    - name: Customer Lifetime Value
      formula_seed: "NPV of future margin contribution per customer"
      source_id: SRC-001
    - name: Retention Rate
      formula_seed: "(Active customers end - New customers) / Active customers start"
      source_id: SRC-003

