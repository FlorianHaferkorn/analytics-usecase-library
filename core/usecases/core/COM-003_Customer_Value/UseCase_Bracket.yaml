schema_version: '2.0'
id: COM-003
title: Customer Value
domain: Commercial / CustomerValue
governance:
  owner_role: commercial_controlling_lead
  steward_role: sales_ops_bi_lead
orchestration:
  strategic_kpi_id: crm.clv.amount
  influencing_kpi_ids:
  - crm.lifetime_revenue.amount
  - crm.retention.pct
  - crm.churned_customers.count
  - crm.revenue_at_risk.amount
  - crm.active_customers.count
  - crm.nps.index
  - crm.complaint.count
  supporting_kpi_ids:
  - cost.cogs.amount
  - sales.promo.baseline_sales.amount
  - sales.promo.cost.amount
  - sales.promo.incremental_gm.amount
  - sales.pvm.price_effect.amount
  - sales.pvm.volume_effect.amount
  action_code_ids:
  - C-M2.2
  - C-P4.1
  - C-S1.2
value_driver_model:
  formula: crm.clv.amount = f(crm.lifetime_revenue.amount, crm.retention.pct, crm.churned_customers.count, crm.revenue_at_risk.amount,
    crm.active_customers.count, crm.nps.index, crm.complaint.count)
  impact_direction: maximize
  primary_driver: crm.lifetime_revenue.amount
  impact_logic: Improving crm.lifetime_revenue.amount is the primary lever for maximizing crm.clv.amount.
ux_layout_rules:
  report_structure: 2-Page-Lead
  report_canvas: { width: 1920, height: 1080 }
  page_1_summary:
    title: Commercial / CustomerValue Summary & Insights
    template_id: pulse
    component_3s:
      kpi_id: crm.clv.amount
      visual_type: kpi_card
    component_30s:
    - kpi_id: crm.lifetime_revenue.amount
      visual_type: trend_line
    - kpi_ids:
      - crm.retention.pct
      - crm.churned_customers.count
      - crm.revenue_at_risk.amount
      visual_type: bar_chart
  page_2_execution:
    title: Commercial / CustomerValue Execution
    template_id: action_matrix
    component_300s:
      evidence_grain: customer_month
      evidence_columns:
      - entity
      - period
      - crm.clv.amount
      action_panel: true
      payload_mode: full
overrides:
  data_contract_ref: core/data_contracts/domains/commercial_sales.yaml
  evidence_grain_note: >-
    customer_month grain is provided by domain contract facts fact_customer_value
    and fact_customer_events (commercial_sales.yaml). Revenue components can be
    derived from fact_sales (grain: invoice_line) via customer-month aggregation
    if needed.
documentation:
  business_factsheet: ./Business_Factsheet.md
