schema_version: '2.0'
id: COM-003
name: Customer Value
domain: Commercial / CustomerValue
governance:
  owner_role: Commercial Controlling Lead
  steward_role: Sales Ops BI Lead
  status: active
  last_review: '2026-02-12'
ontology_bracket:
  strategic_kpi_id: crm.clv.amount
  influencing_kpi_ids:
  - crm.lifetime_revenue.amount
  - crm.retention.pct
  - crm.churned_customers.count
  - crm.revenue_at_risk.amount
  - crm.active_customers.count
  - crm.nps.index
  - crm.complaint.count
  action_code_ids:
  - C-M2.2
  - C-P4.1
  - C-S1.2
value_driver_model:
  description: crm.clv.amount is driven by influencing KPIs and operational levers.
  formula: crm.clv.amount = f(crm.lifetime_revenue.amount, crm.retention.pct, crm.churned_customers.count,
    crm.revenue_at_risk.amount, crm.active_customers.count, crm.nps.index, crm.complaint.count)
ux_layout_rules:
  report_structure: 2-Page-Lead
  page_1_summary_insights:
    title: Commercial / CustomerValue Summary & Insights
    3s_component: 'North Star: crm.clv.amount'
    30s_components: []
  page_2_execution:
    title: Commercial / CustomerValue Execution
    300s_components:
    - 'Evidence_Table: (define evidence table requirements)'
    - 'Action_Panel: Integrated Side-Panel for Subscribed Action Codes'
    - 'Payload_Injection: Show Level (L1-L3) and Steps from Action Code YAML'
documentation:
  business_factsheet: ./Business_Factsheet.md
  technical_factsheet: ./Technical_Factsheet.md
