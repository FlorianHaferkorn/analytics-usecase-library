schema_version: '2.0'
id: COM-003
title: Customer Value
domain: Commercial / CustomerValue
governance:
  owner_role: commercial_controlling_lead
  steward_role: sales_ops_bi_lead
orchestration:
  strategic_kpi_id: KPI-CUS-001
  influencing_kpi_ids:
  - KPI-CUS-005
  - KPI-CUS-002
  - KPI-CUS-004
  - KPI-CUS-006
  - KPI-CUS-003
  - KPI-SVC-001
  - KPI-OPS-001
  supporting_kpi_ids:
  - KPI-COM-005
  - KPI-FIN-011
  # Additional KPIs from action code trigger chains (closure requirement)
  - KPI-QUA-004
  - KPI-QUA-003
  - KPI-QUA-005
  - KPI-QUA-001
  - KPI-OPS-010
  - KPI-QUA-002
  - KPI-SCM-018
  - KPI-SCM-008
  - KPI-SCM-007
  - KPI-SCM-009
  action_code_ids:
  - C-C3.1
  - C-C3.2
primary_kpi_ids:
  - KPI-CUS-001
  - KPI-CUS-002

value_driver_model:
  formula: KPI-CUS-001 = f(KPI-CUS-005, KPI-CUS-002, KPI-CUS-004, KPI-CUS-006,
    KPI-CUS-003, KPI-SVC-001)
  impact_direction: maximize
  primary_driver: KPI-CUS-002
  impact_logic: Improving KPI-CUS-002 is the primary lever for maximizing KPI-CUS-001 because the use case is designed to protect future profitable revenue before churn becomes realized loss.
ux_layout_rules:
  report_structure: 2-Page-Lead
  report_canvas: { width: 1920, height: 1080 }
  # R2.4 (Cut C2): migrated to the intent layer, COM-002 as reference pattern.
  intent_rules_version: 2
  page_1_summary:
    title: Commercial / CustomerValue Summary & Insights
    page_type: T1_Strategic_Overview
    template_variant: T1_Portfolio
    template_id: pulse
    decision_question: "Are we growing and protecting Customer Lifetime Value?"
    big_idea: "Customer Lifetime Value growth has stalled — churn acceleration in the mid-tier segment is eroding the base and requires targeted retention investment."
    component_3s:
      kpi_id: KPI-CUS-001
      visual_type: kpi_card_with_delta
      comparison: vs_py
      status_logic: higher_is_better
    component_30s:
    - slot_id: Main_1
      kpi_id: KPI-CUS-005
      visual_type: line_chart
      question: "Is customer lifetime value growing or eroding, and where?"
      message: Customer lifetime revenue is eroding, with the mid-tier segment driving the decline
      so_what: "Retention investment in the mid-tier segment is what stops the erosion before it compounds into lost revenue."
      unit: amount
    - slot_id: Main_2
      # R2.4: was 3 KPIs of 3 different calc_types (rate/count/amount) on one
      # axis -- a ONE_MESSAGE_PER_CHART violation (same mixed-scale bug class
      # R1.4 fixed on COM-002 Main_3). KPI-OPS-001 already IS
      # Main_3's own KPI (duplicate); KPI-CUS-004 moved to the
      # Detail_Matrix as a supporting evidence column instead.
      kpi_id: KPI-CUS-002
      visual_type: horizontal_bar_chart
      question: "Is retention holding evenly across segments?"
      message: Retention is slipping unevenly across segments, concentrating the CLV risk
      so_what: "Ranking retention by segment pinpoints where to spend before churn compounds into lost CLV."
      unit: rate
    - slot_id: Main_3
      # Revenue at Risk by segment — retention-prioritisation ranking (mapping_gap fix)
      kpi_id: KPI-OPS-001
      visual_type: horizontal_bar_chart
      category_field: dim_customer.Segment
      question: "Where is revenue-at-risk concentrated?"
      message: Revenue at risk is concentrated in a few customer segments
      so_what: "Focusing retention budget on the highest-risk segments protects more CLV per dollar spent."
      unit: amount
  page_2_execution:
    title: Commercial / CustomerValue Execution
    decision_question: "Which customer segments should retention investment protect first?"
    page_type: T4_Prescriptive_Recommendation
    template_variant: T4_ActionDecision
    template_id: action_matrix
    component_300s:
      evidence_grain: customer_month
      # R2.4: deduped repeated KPI-CUS-001; dropped region (customer_segment
      # is the finer, decision-relevant cross-cut for "protecting CLV"); kept
      # KPI-CUS-004 here (moved off Main_2, see above).
      evidence_columns:
      - customer_segment
      - channel
      - KPI-CUS-001
      - KPI-CUS-002
      - KPI-CUS-004
      - KPI-OPS-001
      - KPI-CUS-003
      - KPI-SVC-001
      action_panel: true
      payload_mode: full
      sort_by:
        measure: KPI-OPS-001
        direction: descending
      top_n: 20
      highlight_rule:
        column: KPI-OPS-001
        type: data_bar
prioritization:
  business_value: high
  implementation_effort: high
  confidence: 0.7
  reach: division
  priority_score: 16
data_protection:
  # DSGVO Art. 25 Privacy by Design and by Default
  # Authority: core/templates/page_templates/governance/Data_Protection_Governance.md
  personal_data: false
  legal_basis: not_applicable
  data_minimisation: >
    Detail Matrix limited to customer_segment grain — no individual customer
    records are exposed. CRM metrics (CLV, NPS, churn) are aggregated at segment
    level. If B2C individual-level records enter scope, re-assess personal_data
    = true and apply art6_1f_legitimate_interest.
  access_restriction: >
    commercial_controlling_lead and sales_bi_lead roles; row-level security
    enforced by Commercial.SemanticModel (entity filter per org role).
  dpia_required: false
  ai_generated_output: true
  ai_grounding_measure: >
    Active Actions Text (COM) — DAX measure that reads current filter context
    and concatenates only triggered action texts. See Storytelling_Principles.md
    §13.
readiness:
  data_availability: partial
  org_capability: developing
  stakeholder_alignment: partial
  overall_readiness: amber
overrides:
  data_contract_ref: core/data_contracts/domains/commercial_sales.yaml
  evidence_grain_note: >-
    customer_month grain is provided by domain contract facts fact_customer_value
    and fact_customer_events (commercial_sales.yaml). Revenue components can be
    derived from fact_sales (grain: invoice_line) via customer-month aggregation
    if needed.
documentation:
  business_factsheet: ./Business_Factsheet.md

use_case_links:
  - use_case_id: XD-002
    link_type: depends_on
    reason: "COM-003 CLV and retention outcomes are directly influenced by XD-002 service utilisation and SLA quality — service failures accelerate churn."
  - use_case_id: COM-IND-R001
    link_type: depends_on
    reason: "COM-003 customer-value and repeat-purchase outcomes are fed by COM-IND-R001 basket/category cross-sell — sustained basket breadth raises purchase frequency and CLV (reciprocal of the COM-IND-R001 feeds_into link)."
