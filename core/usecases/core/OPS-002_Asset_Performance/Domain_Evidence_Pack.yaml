# ──────────────────────────────────────────
# 6. MAPPING READINESS
# ──────────────────────────────────────────
mapping_readiness:
  kpi_catalog_coverage: complete
  factsheet_coverage: partial
  bracket_coverage: complete
  action_code_coverage: complete
  semantic_model_coverage: partial

  gap_summary:
    content_gaps:
      - gap_type: content_gap
        severity: medium
        affected_artifact: core/usecases/core/OPS-002_Asset_Performance/Business_Factsheet.md
        field: "Success Criteria / benchmark targets"
        description: >
          Benchmark targets not stated: PM compliance ≥ 90%, critical-asset availability ≥ 90%
          (SMRP BMP). Add to make the success criteria measurable.
        evidence_reference: SRC-005
        remediation: "Add SMRP world-class targets to the factsheet success criteria."
        status: open

    mapping_gaps: []

    schema_gaps: []

    generator_gaps: []

    model_gaps:
      - gap_type: model_gap
        severity: high
        affected_artifact: core/kpi_catalog/kpis/ops.safety.incident.count.yaml
        field: technical.lineage
        description: >
          ops.safety.incident.count has empty lineage — no backing fact table. The safety
          guardrail cannot be computed until a fact_safety (or fact_hse) source exists.
        evidence_reference: SRC-003
        remediation: "Define a safety/HSE fact in the operations data contract and bind the KPI lineage."
        status: open

      - gap_type: model_gap
        severity: medium
        affected_artifact: core/data_contracts/domains/operations.yaml
        field: dim_failure_mode / dim_cause_code
        description: >
          No failure-mode or cause-code dimension exists. ISO 14224 failure Pareto and RCM
          targeting (O-A2.2) require failure-mode and cause attribution at the asset grain.
        evidence_reference: SRC-001 SRC-007
        remediation: "Add dim_failure_mode and dim_cause_code per ISO 14224 taxonomy to the operations contract."
        status: open
