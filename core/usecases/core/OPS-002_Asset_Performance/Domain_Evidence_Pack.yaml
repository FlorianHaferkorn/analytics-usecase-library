use_case_id: OPS-002
use_case_title: Asset Performance
domain: Operations
authored_date: "2026-06-11"
authored_by: framework-architect-agent
reviewed_by: ""
status: draft

# ──────────────────────────────────────────
# 1. PROCESS SCOPE
# ──────────────────────────────────────────
process_scope:
  description: >
    Asset reliability and availability management for asset-intensive production
    environments. Covers the maintenance reliability loop — failure event capture,
    Mean Time Between Failures (MTBF) and Mean Time To Repair (MTTR) analysis,
    preventive maintenance (PM) compliance, spare-parts readiness, and unplanned
    downtime root-cause diagnostics. Grounded in ISO 14224 reliability and
    maintenance data collection, ISO 55001 asset management, EN 13306 maintenance
    terminology, and SMRP Best Practice Metrics. Drives corrective and preventive
    action codes that protect asset availability and the production plan.
  in_scope:
    - MTBF measurement per ISO 14224 (operating time between failures)
    - MTTR measurement per ISO 14224 / EN 13306 (mean active repair / restoration time)
    - Failure event capture and failure-mode taxonomy (ISO 14224 cause codes)
    - Equipment availability and unplanned downtime decomposition
    - Preventive maintenance (PM) compliance and schedule adherence (SMRP BMP)
    - Spare-parts stockout impact on maintenance response time
    - Reliability-Centered Maintenance task selection (SAE JA1011/JA1012)
    - Asset criticality classification and asset-class aggregation
    - Failure-count trending and recurring failure-mode Pareto analysis
    - Corrective and preventive maintenance action logic at asset/asset-class grain
  out_of_scope:
    - Predictive maintenance and condition-based monitoring (covered by OPS-013)
    - OEE / performance / quality-loss decomposition at line level (OPS-001)
    - Detailed maintenance cost modelling and CAPEX replace-vs-repair decisions (OPS-008)
    - Logistics and warehouse asset performance (OPS-011)
    - Energy and sustainability asset variants (ISO 14955)
  industry_segment: >
    Asset-intensive discrete and process manufacturing — most directly applicable
    to automotive, chemicals, oil & gas, FMCG, food & beverage, pharmaceuticals,
    and utilities. ISO 14224 reliability-data principles apply to any plant with a
    structured equipment taxonomy and failure-event logging.
  applicable_frameworks:
    - name: ISO 14224 Collection and exchange of reliability and maintenance data for equipment
      id: ISO-14224
    - name: ISO 55001 Asset management — Management systems — Requirements
      id: ISO-55001
    - name: EN 13306 Maintenance — Maintenance terminology
      id: EN-13306
    - name: SMRP Best Practice Metrics — Reliability & Maintenance KPIs
      id: SMRP-BMP
    - name: SAE JA1011 / JA1012 Evaluation Criteria for Reliability-Centered Maintenance
      id: SAE-JA1011
    - name: ISO 22400-2 Key Performance Indicators for Manufacturing Operations Management
      id: ISO-22400-2

# ──────────────────────────────────────────
# 2. CANONICAL DOMAIN MODEL (DRIVER TREE)
# ──────────────────────────────────────────
canonical_domain_model:
  outcome_kpis:
    - id: ops.mtbf.hours
      name: Mean Time Between Failures (MTBF)
      definition: >
        MTBF = Total Operating Time / Number of Failures. ISO 14224 defines MTBF as
        the expectation of the duration of the operating time between failures of a
        repairable item. The strategic reliability outcome KPI: a rising MTBF is the
        most direct evidence that the maintenance and reliability programme is
        preventing breakdowns; a declining MTBF signals deteriorating asset health,
        inadequate PM, or recurring failure modes.
      unit: hours
      direction: maximize
      benchmark_target: "Asset-criticality dependent; mature PM programmes achieve 40–70% higher MTBF than reactive baselines (Aberdeen / SMRP BMP). Set per asset class."
      benchmark_source_id: SRC-005
      iso_reference: ISO 14224:2016 clause 3 (terms) and Annex C (reliability parameters)

  driver_kpis:
    - id: ops.failure.count
      name: Failure Count
      definition: >
        Number of recorded failure events (loss of required function) for an asset
        or asset class in the period. ISO 14224 defines a failure as the termination
        of the ability of an item to perform a required function. Primary lever for
        MTBF: MTBF is operating time divided by failure count, so reducing recurring
        failures directly extends time between breakdowns.
      unit: count
      direction: minimize
      drives: ops.mtbf.hours
      causal_mechanism: >
        MTBF = Operating Time / Failure Count. Each eliminated recurring failure mode
        raises MTBF for a fixed operating window. A small number of dominant failure
        modes typically drive the majority of failure events (Pareto), making
        failure-mode elimination the highest-leverage reliability action (SAE JA1011 RCM).
      benchmark_target: "Declining trend on critical assets; near-zero recurrence for top-3 failure modes after RCM"
      benchmark_source_id: SRC-006

    - id: ops.mttr.hours
      name: Mean Time To Repair (MTTR)
      definition: >
        MTTR = Total Repair (restoration) Time / Number of Failures. ISO 14224 /
        EN 13306 define MTTR as the mean active corrective maintenance / repair time,
        combining detection, diagnosis, active repair, and restoration to operating state.
      unit: hours
      direction: minimize
      drives: ops.mtbf.hours
      causal_mechanism: >
        MTTR does not change MTBF arithmetically but governs availability for a given
        MTBF (Availability = MTBF / (MTBF + MTTR)). Elevated MTTR signals spare-parts
        stockout, skill gaps, or missing repair documentation, and converts each
        failure into disproportionate downtime — a reliability programme that lowers
        MTBF gains is undermined if MTTR rises.
      benchmark_target: "Asset-class dependent; minimise active repair time; SMRP BMP MTTR benchmarks by criticality"
      benchmark_source_id: SRC-004

    - id: ops.availability.pct
      name: Availability Rate
      definition: >
        Availability = Operating (Run) Time / (Operating Time + Unplanned Downtime),
        equivalently MTBF / (MTBF + MTTR). Measures the fraction of required time the
        asset is able to perform its function. ISO 22400-2 availability KPI; EN 13306
        inherent vs operational availability.
      unit: "%"
      direction: maximize
      drives: ops.mtbf.hours
      causal_mechanism: >
        Availability is the joint outcome of MTBF (failure frequency) and MTTR (repair
        speed). It is the bridge between reliability and the production plan: an asset
        with high MTBF but slow repairs still fails to meet availability targets.
      benchmark_target: "90% availability / unplanned downtime ≤ 10% is the world-class threshold (SMRP BMP)"
      benchmark_source_id: SRC-004

    - id: ops.downtime.unplanned.pct
      name: Unplanned Downtime %
      definition: >
        Unplanned Downtime % = Unplanned Downtime Minutes / Planned Production Time.
        Isolates breakdown-driven losses (excluding planned maintenance and approved
        shutdowns). The dominant availability destroyer in most asset-intensive plants.
      unit: "%"
      direction: minimize
      drives: ops.mtbf.hours
      causal_mechanism: >
        Unplanned downtime is the visible symptom of low MTBF and/or high MTTR. A
        rising unplanned-downtime trend with a falling MTBF confirms a reliability
        problem (vs a planned-work scheduling problem) and is the primary trigger for
        reliability recovery (O-A2.1).
      benchmark_target: "≤ 10% of planned production time (world-class availability ≥ 90%, SMRP BMP)"
      benchmark_source_id: SRC-004

    - id: ops.pm_compliance.pct
      name: Preventive Maintenance Compliance
      definition: >
        PM Compliance = Completed PM Tasks / Scheduled PM Tasks (within the compliance
        window). SMRP Best Practice Metric: the leading indicator of future reliability
        — the work being done now that prevents tomorrow's failures.
      unit: "%"
      direction: maximize
      drives: ops.mtbf.hours
      causal_mechanism: >
        PM compliance below ~90% is a leading indicator of MTBF decline on critical
        assets, typically within 2–4 months as deferred condition-restoration tasks
        allow failure modes to develop. PM compliance is the most actionable lever
        because it is controllable in the current period (SMRP BMP).
      benchmark_target: "≥ 90% world class (SMRP BMP); ≥ 95% for A-criticality assets"
      benchmark_source_id: SRC-003

    - id: ops.spare_parts.stockout.pct
      name: Spare Parts Stockout %
      definition: >
        Spare Parts Stockout % = Maintenance Orders Delayed by Parts Unavailability /
        Total Maintenance Orders. Measures spares readiness for corrective and
        preventive work. A supply-side constraint on repair speed.
      unit: "%"
      direction: minimize
      drives: ops.mttr.hours
      causal_mechanism: >
        Stockout of a critical spare extends MTTR (the asset waits for parts, not for
        repair labour), which depresses availability even when failure frequency is
        controlled. Persistent stockouts on critical-asset BOM items trigger a
        spare-parts / inventory review (O-A2.4).
      benchmark_target: "Critical-spare service level ≥ 95% (near-zero stockout on A-criticality BOM)"
      benchmark_source_id: SRC-003

  diagnostic_kpis:
    - id: ops.failure.count.by_mode
      name: Failure Count by Failure Mode / Cause Code
      definition: >
        Failure count decomposed by ISO 14224 failure-mode and cause-code taxonomy
        (e.g. wear, corrosion, fatigue, leakage, electrical/control fault). Enables a
        failure-mode Pareto to isolate the dominant recurring failures.
      unit: count
      direction: minimize
      diagnoses: ops.failure.count
      causal_mechanism: >
        A handful of cause codes usually drive most failures. Ranking failures by
        ISO 14224 cause code points RCM analysis (SAE JA1011) at the highest-leverage
        failure modes, distinguishing aging degradation from isolated incidents.

    - id: ops.mttr.repair_wait.hours
      name: Repair Wait Time (logistic delay)
      definition: >
        The portion of MTTR spent waiting (for parts, labour, permits, or access)
        rather than in active repair. EN 13306 distinguishes active repair time from
        logistic/administrative delay.
      unit: hours
      direction: minimize
      diagnoses: ops.mttr.hours
      causal_mechanism: >
        High wait time vs active-repair time indicates a logistics problem (spares,
        scheduling) rather than a technical/skill problem. This separation determines
        whether the action is a spare-parts review (O-A2.4) or a maintenance-strategy
        / skills review (O-A2.3).

    - id: ops.pm.task.overdue.count
      name: Overdue PM Task Count
      definition: >
        Count of scheduled preventive maintenance tasks past their due date / outside
        the compliance window. The execution detail behind PM compliance %.
      unit: count
      direction: minimize
      diagnoses: ops.pm_compliance.pct
      causal_mechanism: >
        Overdue PM tasks concentrated on specific asset clusters precede unplanned
        downtime spikes on those same assets, confirming a PM execution gap (vs a PM
        adequacy gap) and triggering PM schedule recovery (O-A2.2).

    - id: ops.failure.recurrence.pct
      name: Repeat Failure Rate
      definition: >
        Repeat Failure Rate = Failures recurring on the same asset/failure-mode within
        a defined window / Total failures. Detects ineffective repairs and chronic
        failure modes that PM is not addressing.
      unit: "%"
      direction: minimize
      diagnoses: ops.failure.count
      causal_mechanism: >
        High recurrence with high PM compliance indicates the PM programme is targeting
        the wrong failure modes — the signal for a maintenance-strategy / RCM review
        (O-A2.3) rather than more of the same PM.

  guardrails:
    - description: Planned maintenance and approved shutdowns
      condition: >
        Downtime occurring during scheduled PM windows, approved overhauls, or planned
        shutdowns must NOT be counted as unplanned downtime or availability loss
        (ISO 14224 down-time states; EN 13306 planned vs unplanned). Do not trigger
        reliability-recovery actions on planned-maintenance time.
      affected_kpis:
        - ops.availability.pct
        - ops.downtime.unplanned.pct
        - ops.mtbf.hours

    - description: Commissioning and infant-mortality period
      condition: >
        Newly installed or overhauled assets in the early-life (burn-in) period show
        elevated failure rates that are expected (bathtub curve, ISO 14224). Do not
        trigger O-A2.1 reliability recovery on infant-mortality failures; apply
        commissioning-quality actions instead.
      affected_kpis:
        - ops.mtbf.hours
        - ops.failure.count

    - description: Single-failure statistical noise on low-failure assets
      condition: >
        On assets with very few failures in the window, MTBF is statistically unstable
        — one event can halve reported MTBF. Require a minimum failure count or rolling
        window before triggering action to avoid acting on noise.
      affected_kpis:
        - ops.mtbf.hours

    - description: Force majeure and external-cause downtime
      condition: >
        Downtime from external factors outside maintenance control (power outage,
        utility loss, upstream supply stoppage) must be excluded from reliability KPIs
        and must NOT count against MTBF or availability (ISO 14224 maintenance-cause coding).
      affected_kpis:
        - ops.availability.pct
        - ops.downtime.unplanned.pct

  wrong_interpretations:
    - description: "Treating MTBF as a fixed asset property rather than a window-and-taxonomy-dependent statistic"
      why_wrong: >
        MTBF depends on how failures are defined, the failure-mode taxonomy applied,
        and the observation window. Comparing MTBF across assets or sites that code
        failures differently (or merge multiple stoppages into one event) produces
        misleading rankings. ISO 14224 exists precisely to standardise failure
        definitions and boundaries so MTBF is comparable.
      source_id: SRC-001

    - description: "Improving MTBF while ignoring MTTR (or vice versa)"
      why_wrong: >
        Availability = MTBF / (MTBF + MTTR). A reliability programme can raise MTBF yet
        lose availability if MTTR rises (e.g. spares stockouts). Optimising one metric
        in isolation masks the other; both must be monitored together to protect the
        production plan (SMRP BMP).
      source_id: SRC-004

    - description: "Reading high PM compliance as proof of reliability"
      why_wrong: >
        PM compliance measures whether scheduled tasks were done, not whether they
        addressed the right failure modes. High PM compliance with flat or falling MTBF
        and high repeat-failure rate means the PM programme is targeting the wrong
        modes — a maintenance-strategy/RCM problem, not an execution win (SAE JA1011).
      source_id: SRC-006

    - description: "Counting planned maintenance downtime as a reliability/availability loss"
      why_wrong: >
        Including planned PM and approved shutdown time in unplanned-downtime or
        availability-loss metrics overstates the reliability problem and can trigger
        the wrong corrective action. ISO 14224 and EN 13306 separate planned from
        unplanned down-time states; only unplanned events belong in the MTBF/availability loss view.
      source_id: SRC-001

    - description: "Chasing MTBF on non-critical assets at the expense of critical ones"
      why_wrong: >
        Reliability effort should follow asset criticality (ISO 55001 risk-based asset
        management; SAE JA1011 consequence prioritisation). Reporting a single
        plant-wide MTBF, or improving easy non-critical assets, can hide deteriorating
        reliability on the few assets that actually constrain the production plan.
      source_id: SRC-002

# ──────────────────────────────────────────
# 3. REQUIRED DATA MODEL
# ──────────────────────────────────────────
required_data_model:
  required_facts:
    - table: fact_ops_failures
      description: >
        Failure-event backbone (grain: failure_event). Columns used: AssetKey,
        Failure Start DateTime, Failure End DateTime, Repair Duration Hours,
        Downtime Minutes, Cause Code. Source of failure count, MTBF, MTTR, repeat-failure
        rate, and the ISO 14224 cause-code Pareto. This is the evidence_grain for OPS-002.
    - table: fact_maintenance
      description: >
        Maintenance order log (grain: maintenance_order). Columns used: AssetKey,
        DateKey, Order Type (PM/CM), Order Status, On Time Flag, Parts Stockout Flag.
        Source of PM compliance %, overdue PM task count, PM/CM task counts, and the
        spare-parts stockout flag.
    - table: fact_ops
      description: >
        Production line-day facts (grain: line_day). Columns used: DateKey, OrgKey,
        AssetKey, Planned Time Minutes, Run Time Minutes, Downtime Minutes. Source of
        operating time (MTBF denominator context), availability, and unplanned-downtime %.

  required_dimensions:
    - name: dim_asset
      grain_relevance: >
        AssetKey, AssetCode, AssetName, AssetClass, Criticality. Asset and asset-class
        level required for all reliability diagnostics; Criticality required for
        risk-based prioritisation (ISO 55001 / SAE JA1011) so action follows the assets
        that constrain the plan.
    - name: dim_org
      grain_relevance: >
        Plant → Line → Shift hierarchy. Plant/line level required to attribute failures
        and downtime; needed for row-level security and cross-site reliability comparison.
    - name: dim_date
      grain_relevance: >
        Time axis for MTBF/MTTR trend and PM-compliance trend. Must include Month and
        Week for weekly maintenance and monthly reliability review cadence.
    - name: dim_cause_code
      grain_relevance: >
        ISO 14224 failure-mode / cause-code taxonomy for the failure Pareto and RCM
        targeting. fact_ops_failures carries a free-text Cause Code column but no
        conformed cause-code dimension exists in the contract — classified as model_gap.
    - name: dim_maintenance_type
      grain_relevance: >
        Planned (PM) vs unplanned (CM) vs emergency. Required to separate planned
        downtime (excluded from availability loss) from unplanned downtime. Currently
        represented only by fact_maintenance.Order Type — no conformed dimension — model_gap.

  preferred_grain: asset-failure_event
  minimum_grain: asset-month
  minimum_history_months: 12
  grain_waiver_condition: >
    asset-month grain is acceptable only when individual failure-event timestamps are
    structurally unavailable and MTBF must be derived from aggregated downtime and
    failure counts. This degrades repeat-failure and MTTR-decomposition diagnostics
    and requires an explicit waiver in the bracket.

  required_measures:
    - name: MTBF (hours)
      formula_seed: "Total_Operating_Time_Hours / Number_of_Failures"
      source_id: SRC-001
    - name: MTTR (hours)
      formula_seed: "Total_Repair_Restoration_Time_Hours / Number_of_Failures"
      source_id: SRC-001
    - name: Availability %
      formula_seed: "MTBF / (MTBF + MTTR)"
      source_id: SRC-004
    - name: Unplanned Downtime %
      formula_seed: "Unplanned_Downtime_Minutes / Planned_Production_Time_Minutes"
      source_id: SRC-007
    - name: PM Compliance %
      formula_seed: "Completed_PM_Tasks_Within_Window / Scheduled_PM_Tasks"
      source_id: SRC-003
    - name: Failure Count
      formula_seed: "COUNT(failure_event records) filtered by asset / cause_code / period"
      source_id: SRC-001
    - name: Spare Parts Stockout %
      formula_seed: "Maintenance_Orders_With_Parts_Stockout_Flag / Total_Maintenance_Orders"
      source_id: SRC-003
    - name: Repeat Failure Rate %
      formula_seed: "Failures_Recurring_Same_Asset_Mode_Within_Window / Total_Failures"
      source_id: SRC-006
    - name: Overdue PM Task Count
      formula_seed: "COUNT(fact_maintenance where Order Type = PM AND On Time Flag = false)"
      source_id: SRC-003

# ──────────────────────────────────────────
# 4. ACTION LOGIC SEEDS
# ──────────────────────────────────────────
action_logic_seeds:
  - trigger_driver: ops.failure.count
    trigger_diagnostic: ops.failure.count.by_mode
    trigger_condition: "MTBF declining > 20% over 8 weeks on a critical asset AND a single cause code accounts for > 40% of failures"
    guardrail: "Exclude planned-maintenance time, force majeure, and assets in commissioning/infant-mortality period"
    action_description: >
      Asset reliability recovery: run a failure-mode Pareto (ISO 14224 cause codes),
      execute corrective maintenance on the dominant recurring mode, and update the
      PM task list for that failure mode via RCM logic (SAE JA1011).
    expected_outcome_kpi: ops.mtbf.hours
    action_code_candidate: O-A2.1

  - trigger_driver: ops.pm_compliance.pct
    trigger_diagnostic: ops.pm.task.overdue.count
    trigger_condition: "PM Compliance < 90% AND overdue PM tasks concentrated on assets with rising unplanned downtime for 3 consecutive weeks"
    guardrail: "Exclude assets under approved overhaul; require realistic PM plan (no padded schedule)"
    action_description: >
      PM schedule optimization and backlog recovery: restore PM compliance to ≥ 90%,
      reschedule overdue critical-asset PMs first, and review PM frequencies for adequacy.
    expected_outcome_kpi: ops.pm_compliance.pct
    action_code_candidate: O-A2.2

  - trigger_driver: ops.mtbf.hours
    trigger_diagnostic: ops.failure.recurrence.pct
    trigger_condition: "PM Compliance ≥ 90% AND MTBF flat/declining AND repeat-failure rate > 25% with failure modes shifting"
    guardrail: "Confirm failures are not external-cause; require minimum failure count for statistical stability"
    action_description: >
      Maintenance strategy / RCM review: failure-mode and effects analysis, score PM
      task relevance against actual failure modes, and re-select tasks per SAE JA1011/JA1012.
    expected_outcome_kpi: ops.mtbf.hours
    action_code_candidate: O-A2.3

  - trigger_driver: ops.mttr.hours
    trigger_diagnostic: ops.mttr.repair_wait.hours
    trigger_condition: "MTTR rising AND repair wait time (parts) > active repair time AND spare-parts stockout % > 10% on critical BOM"
    guardrail: "Exclude one-off long-lead-item failures already covered by a CAPEX plan"
    action_description: >
      Spare-parts and inventory review: raise critical-spare service level, adjust
      reorder points / safety stock on A-criticality BOM, and pre-kit high-failure-mode repairs.
    expected_outcome_kpi: ops.mttr.hours
    action_code_candidate: O-A2.4

  - trigger_driver: ops.availability.pct
    trigger_diagnostic: ops.failure.count.by_mode
    trigger_condition: "Availability < 90% sustained for 2 months on a critical asset with multiple distinct failure modes (no single dominant cause)"
    guardrail: "Exclude planned shutdown and force majeure; confirm criticality classification is current"
    action_description: >
      Asset criticality and renewal review (ISO 55001): re-assess asset criticality,
      evaluate repair-vs-replace, and escalate chronic low-availability critical assets
      to the asset-management plan.
    expected_outcome_kpi: ops.availability.pct
    action_code_candidate: O-A2.5

