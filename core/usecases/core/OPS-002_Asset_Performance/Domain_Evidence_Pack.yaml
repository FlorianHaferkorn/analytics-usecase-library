mapping_readiness:
  kpi_catalog_coverage: partial
  factsheet_coverage: partial
  bracket_coverage: partial
  action_code_coverage: partial
  semantic_model_coverage: partial

  gap_summary:
    content_gaps:
      - gap_type: content_gap
        severity: medium
        affected_artifact: core/usecases/core/OPS-002_Asset_Performance/Business_Factsheet.md
        field: "Section 8 Success Criteria"
        description: >
          Benchmark targets not quantified: availability ≥ 90% / unplanned downtime
          ≤ 10% (SMRP BMP), PM compliance ≥ 90% (≥ 95% A-criticality), and MTBF set
          per asset class with the 40–70% mature-vs-reactive uplift reference.
        evidence_reference: SRC-003 SRC-004 SRC-005
        remediation: "Add quantified benchmark targets to Section 8. Close when DEP approved."
        status: open

      - gap_type: content_gap
        severity: medium
        affected_artifact: core/usecases/core/OPS-002_Asset_Performance/Business_Factsheet.md
        field: "Section 2 Core Business Questions"
        description: >
          Core questions do not explicitly cover the failure-mode (ISO 14224 cause-code)
          Pareto or the repeat-failure / PM-adequacy distinction ("Is PM targeting the
          right failure modes?") that drives O-A2.3.
        evidence_reference: SRC-001 SRC-006
        remediation: "Add failure-mode Pareto and PM-adequacy questions to Section 2. Close when DEP approved."
        status: open

    mapping_gaps:
      - gap_type: mapping_gap
        severity: high
        affected_artifact: core/usecases/core/OPS-002_Asset_Performance/UseCase_Bracket.yaml
        field: ux_layout_rules.page_1_summary.component_30s (Main_1)
        description: >
          Main_1 trend visual shows ops.availability.pct (a driver KPI). The strategic
          KPI for OPS-002 is ops.mtbf.hours; the lead trend should answer "Is reliability
          (MTBF) on target?" before "Is availability sufficient?". Availability belongs
          alongside MTTR as the availability decomposition.
        evidence_reference: SRC-001 SRC-004
        remediation: "Set Main_1 to ops.mtbf.hours trend vs asset-class target; move availability to the supporting bar group. Close when DEP approved."
        status: in_progress

      - gap_type: mapping_gap
        severity: medium
        affected_artifact: core/usecases/core/OPS-002_Asset_Performance/UseCase_Bracket.yaml
        field: value_driver_model.formula
        description: >
          The bracket formula lists availability as a co-driver of MTBF. Per ISO 14224 /
          EN 13306, availability is an OUTPUT of MTBF and MTTR (Availability = MTBF /
          (MTBF + MTTR)), not a driver of MTBF. The driver tree should show failure
          count and PM compliance as MTBF drivers, with availability as the joint outcome.
        evidence_reference: SRC-001 SRC-004
        remediation: "Restate the value-driver model so availability is derived from MTBF and MTTR, not an MTBF input. Close when DEP approved."
        status: open

    schema_gaps: []

    generator_gaps: []

    model_gaps:
      - gap_type: model_gap
        severity: high
        affected_artifact: core/data_contracts/domains/operations.yaml
        field: dim_cause_code
        description: >
          No conformed failure-mode / cause-code dimension exists. fact_ops_failures
          carries a free-text Cause Code column, but the ISO 14224 failure-mode taxonomy
          (wear, corrosion, fatigue, leakage, electrical/control fault, etc.) requires a
          governed dimension for a stable failure Pareto and RCM targeting.
        evidence_reference: SRC-001 SRC-006
        remediation: >
          Add dim_cause_code conformed to ISO 14224 failure-mode classification and
          relate it to fact_ops_failures. Add to Operations.SemanticModel.
        status: open

      - gap_type: model_gap
        severity: medium
        affected_artifact: core/data_contracts/domains/operations.yaml
        field: fact_ops_failures repair-time decomposition
        description: >
          fact_ops_failures provides Repair Duration Hours but not the split between
          active repair time and logistic/administrative delay (parts wait). EN 13306
          distinguishes these, and the MTTR repair-wait diagnostic (O-A2.4 trigger)
          needs the split.
        evidence_reference: SRC-008 SRC-003
        remediation: >
          Add active-repair-time and wait-time fields to fact_ops_failures (or relate to
          fact_maintenance.Parts Stockout Flag) and expose an MTTR-decomposition measure.
        status: open
