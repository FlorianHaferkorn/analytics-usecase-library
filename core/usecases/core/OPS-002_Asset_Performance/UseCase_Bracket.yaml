schema_version: '2.0'
id: OPS-002
title: Asset Performance
domain: Operations
governance:
  owner_role: maintenance_controlling_reliability
  steward_role: maintenance_reliability_bi_lead
orchestration:
  strategic_kpi_id: ops.mtbf.hours
  influencing_kpi_ids:
  - ops.availability.pct
  - ops.mttr.hours
  - ops.downtime.unplanned.pct
  - ops.spare_parts.stockout.pct
  - ops.pm_compliance.pct
  - ops.failure.count
  - ops.inventory.value.amount
  - ops.pm.task.count
  - ops.safety.incident.count
  action_code_ids:
  - O-A2.1
  - O-A2.2
  - O-A2.3
  - O-A2.4
  - O-A2.5
value_driver_model:
  formula: ops.mtbf.hours = f(ops.availability.pct, ops.mttr.hours, ops.downtime.unplanned.pct, ops.spare_parts.stockout.pct,
    ops.pm_compliance.pct, ops.failure.count, ops.inventory.value.amount, ops.pm.task.count, ops.safety.incident.count)
  impact_direction: minimize
  primary_driver: ops.availability.pct
  impact_logic: Improving ops.availability.pct is the primary lever for minimizing ops.mtbf.hours.
ux_layout_rules:
  report_structure: 2-Page-Lead
  report_canvas: { width: 1920, height: 1080 }
  page_1_summary:
    title: Operations Summary & Insights
    page_type: T1_Strategic_Overview
    template_id: pulse
    component_3s:
      kpi_id: ops.mtbf.hours
      visual_type: kpi_card
    component_30s:
    - kpi_id: ops.availability.pct
      visual_type: trend_line
    - kpi_ids:
      - ops.mttr.hours
      - ops.downtime.unplanned.pct
      - ops.spare_parts.stockout.pct
      visual_type: bar_chart
  page_2_execution:
    title: Operations Execution
    page_type: T3_Operational_Monitoring
    template_id: action_matrix
    component_300s:
      evidence_grain: failure_event
      evidence_columns:
      - entity
      - period
      - ops.mtbf.hours
      action_panel: true
      payload_mode: full
overrides:
  data_contract_ref: core/data_contracts/domains/operations.yaml
documentation:
  business_factsheet: ./Business_Factsheet.md
