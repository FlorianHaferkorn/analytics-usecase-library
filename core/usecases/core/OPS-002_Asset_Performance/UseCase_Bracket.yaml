schema_version: '2.0'
id: OPS-002
title: Asset Performance
domain: Operations
governance:
  owner_role: maintenance_controlling_reliability
  steward_role: maintenance_reliability_bi_lead
orchestration:
  strategic_kpi_id: KPI-OPS-005
  influencing_kpi_ids:
  - KPI-OPS-016
  - KPI-OPS-006
  - KPI-OPS-018
  - KPI-OPS-008
  - KPI-OPS-007
  - KPI-OPS-012
  supporting_kpi_ids:
  - KPI-FIN-002
  - KPI-OPS-014
  - KPI-OPS-015
  action_code_ids:
  - O-A2.1
  - O-A2.2
  - O-A2.3
  - O-A2.4
  - O-A2.5
primary_kpi_ids:
  - KPI-OPS-005
  - KPI-OPS-012

value_driver_model:
  formula: KPI-OPS-005 = f(KPI-OPS-012, KPI-OPS-006, KPI-OPS-018, KPI-OPS-007, KPI-OPS-008,
    KPI-OPS-016)
  impact_direction: maximize
  primary_driver: KPI-OPS-012
  impact_logic: Reducing KPI-OPS-012 is the primary lever for maximizing KPI-OPS-005 because fewer recurring failures directly extend operating time between breakdowns.
ux_layout_rules:
  report_structure: 2-Page-Lead
  report_canvas: { width: 1920, height: 1080 }
  # R2.4 (Cut C2): migrated to the intent layer, COM-002 as reference pattern.
  intent_rules_version: 2
  page_1_summary:
    title: Operations Summary & Insights
    page_type: T1_Strategic_Overview
    template_variant: T1_Portfolio
    template_id: pulse
    decision_question: "Is asset availability sufficient to meet the production plan?"
    big_idea: "Asset availability is declining — maintenance backlog is accumulating faster than resolution, and OEE compression signals near-term production risk."
    component_3s:
      kpi_id: KPI-OPS-005
      visual_type: kpi_card_with_delta
      comparison: vs_plan
      status_logic: higher_is_better
    component_30s:
    - slot_id: Main_1
      kpi_id: KPI-OPS-016
      visual_type: line_chart
      question: "Is asset availability sufficient to hold the production plan?"
      message: Asset availability is trending toward the threshold needed to hold the production plan
      so_what: "At this trajectory, availability drops below the threshold needed to hold the production plan."
      unit: rate
    - slot_id: Main_2
      # R2.4: was 3 KPIs of 2 different calc_types (amount vs. rate) on one
      # axis -- a ONE_MESSAGE_PER_CHART violation. KPI-OPS-006 moved to
      # the Detail_Matrix (it's already the component_3s family's own KPI).
      kpi_ids:
      - KPI-OPS-018
      - KPI-OPS-008
      visual_type: horizontal_bar_chart
      question: "What are the leading failure-risk signals?"
      message: Unplanned downtime and spare-parts stockout — the two leading failure-risk signals.
      so_what: "Ranking downtime by asset targets maintenance effort where it protects the production plan most."
      unit: rate
  page_2_execution:
    title: Operations Execution
    decision_question: "Which assets need maintenance intervention to protect the production plan?"
    page_type: T3_Operational_Monitoring
    template_variant: T3_ProcessControl
    template_id: action_matrix
    component_300s:
      evidence_grain: failure_event
      # R2.4: dropped 'plant' (no backing dimension table in
      # Operations.SemanticModel; dim_asset is the real row-identity here).
      evidence_columns:
      - asset
      - criticality
      - KPI-OPS-005
      - KPI-OPS-006
      - KPI-OPS-018
      - KPI-OPS-007
      - KPI-OPS-008
      - KPI-OPS-012
      action_panel: true
      payload_mode: full
      sort_by:
        measure: KPI-OPS-018
        direction: descending
      top_n: 20
      highlight_rule:
        column: KPI-OPS-018
        type: data_bar
prioritization:
  business_value: high
  implementation_effort: high
  confidence: 0.7
  reach: division
  priority_score: 16
data_protection:
  # DSGVO Art. 25 Privacy by Design and by Default
  # Authority: core/templates/page_templates/governance/Data_Protection_Governance.md
  personal_data: false
  legal_basis: not_applicable
  data_minimisation: >
    Detail Matrix limited to asset, machine, and maintenance-type grain. Asset
    performance metrics (MTBF, OEE) attributed to equipment identifiers — no
    natural person is identified. Row-level security applied at SemanticModel
    level.
  access_restriction: >
    operations_controlling_lead and ops_bi_lead roles; row-level security
    enforced by Operations.SemanticModel (plant/asset filter per org role).
  dpia_required: false
  ai_generated_output: true
  ai_grounding_measure: >
    Active Actions Text (OPS) — DAX measure that reads current filter context
    and concatenates only triggered action texts. See Storytelling_Principles.md
    §13.
readiness:
  data_availability: partial
  org_capability: developing
  stakeholder_alignment: aligned
  overall_readiness: amber
overrides:
  data_contract_ref: core/data_contracts/domains/operations.yaml
documentation:
  business_factsheet: ./Business_Factsheet.md
