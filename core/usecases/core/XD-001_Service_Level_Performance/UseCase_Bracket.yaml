schema_version: '2.0'
id: XD-001
title: Service Level Performance
domain: Experience / Service
governance:
  owner_role: service_operations_cx_analytics
  steward_role: service_ops_cx_bi_lead
orchestration:
  strategic_kpi_id: svc.sla.attainment.pct
  influencing_kpi_ids:
  - svc.backlog.count
  - svc.fcr.pct
  - svc.aht.minutes
  - svc.escalation.pct
  - svc.tickets.created.count
  - svc.tickets.closed.count
  - crm.nps.index
  supporting_kpi_ids: []
  action_code_ids:
  - X-S1.1
  - X-S1.2
  - X-S1.3
  - X-S1.4
primary_kpi_ids:
  - svc.sla.attainment.pct
  - svc.backlog.count

value_driver_model:
  formula: svc.sla.attainment.pct = f(svc.fcr.pct, svc.aht.minutes, svc.backlog.count, svc.escalation.pct,
    svc.tickets.created.count, svc.tickets.closed.count)
  impact_direction: maximize
  primary_driver: svc.backlog.count
  impact_logic: Reducing queue backlog is the primary operational lever for maximizing svc.sla.attainment.pct while FCR, AHT, and escalation remain in guardrail balance.
ux_layout_rules:
  report_structure: 2-Page-Lead
  report_canvas: { width: 1920, height: 1080 }
  # R2.4 (Cut C2): migrated to the intent layer, COM-002 as reference pattern.
  intent_rules_version: 2
  page_1_summary:
    title: Experience / Service Summary & Insights
    page_type: T3_Operational_Monitoring
    template_variant: T3_ProcessControl
    template_id: pulse
    decision_question: "Is the service organization resolving cases fast enough to prevent backlog growth?"
    big_idea: "Service backlog is growing — first-contact resolution rate is declining and case escalation volume is rising, signalling a capacity or capability gap."
    component_3s:
      kpi_id: svc.sla.attainment.pct
      visual_type: kpi_card
      comparison: vs_target
      status_logic: higher_is_better
    component_30s:
    - slot_id: Main_1
      kpi_id: svc.backlog.count
      visual_type: trend_line
      message: Case backlog is building unchecked toward SLA breaches next cycle
      so_what: "An unchecked backlog trend converts into missed SLAs within the next reporting cycle."
      unit: count
    - slot_id: Main_2
      kpi_id: svc.fcr.pct
      visual_type: bar_chart
      message: First-contact resolution, handle time, and escalation — the three service-quality signals.
      so_what: "Ranking FCR by case type shows where a capability fix cuts escalations and backlog at once."
      unit: ratio
  page_2_execution:
    title: Service Queue Recovery & Execution
    decision_question: "Which case types and queues should recovery effort prioritise first?"
    page_type: T3_Operational_Monitoring
    template_variant: T3_ExceptionQueue
    template_id: action_matrix
    component_300s:
      evidence_grain: case
      evidence_columns:
      - entity
      - queue
      - channel
      - issue_type
      - severity
      - svc.sla.attainment.pct
      - svc.backlog.count
      - svc.escalation.pct
      action_panel: true
      payload_mode: full
      sort_by:
        measure: svc.sla.attainment.pct
        direction: ascending
      top_n: 20
      highlight_rule:
        column: svc.sla.attainment.pct
        type: data_bar
prioritization:
  business_value: medium
  implementation_effort: medium
  confidence: 0.75
  reach: division
  priority_score: 17
data_protection:
  # DSGVO Art. 25 Privacy by Design and by Default
  # Authority: core/templates/page_templates/governance/Data_Protection_Governance.md
  personal_data: false
  legal_basis: not_applicable
  data_minimisation: >
    Detail Matrix limited to service-channel, queue, and SLA-category grain.
    Service metrics attributed to channels and queues — no individual agent or
    customer is identified. Row-level security applied at SemanticModel level.
  access_restriction: >
    service_operations_lead and xd_bi_lead roles; row-level security enforced by
    Experience.SemanticModel (entity filter per org role).
  dpia_required: false
  ai_generated_output: true
  ai_grounding_measure: >
    Active Actions Text (XD) — DAX measure that reads current filter context and
    concatenates only triggered action texts. See Storytelling_Principles.md
    §13.
readiness:
  data_availability: partial
  org_capability: ready
  stakeholder_alignment: aligned
  overall_readiness: amber
overrides:
  data_contract_ref: core/data_contracts/domains/experience.yaml
documentation:
  business_factsheet: ./Business_Factsheet.md
  evidence_pack: ./Domain_Evidence_Pack.yaml
