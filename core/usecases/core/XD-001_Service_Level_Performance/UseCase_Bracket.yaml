schema_version: '2.0'
id: XD-001
title: Service Level Performance
domain: Experience / Service
governance:
  owner_role: service_operations_cx_analytics
  steward_role: service_ops_cx_bi_lead
orchestration:
  strategic_kpi_id: svc.sla.attainment.pct
  influencing_kpi_ids:
  - svc.fcr.pct
  - svc.aht.minutes
  - svc.backlog.count
  - svc.nps.index
  - svc.escalation.pct
  - svc.tickets.created.count
  - svc.tickets.closed.count
  action_code_ids:
  - X-S1.1
  - X-S1.2
  - X-S1.3
  - X-S1.4
value_driver_model:
  formula: svc.sla.attainment.pct = f(svc.fcr.pct, svc.aht.minutes, svc.backlog.count, svc.nps.index, svc.escalation.pct,
    svc.tickets.created.count, svc.tickets.closed.count)
  impact_direction: maximize
  primary_driver: svc.fcr.pct
  impact_logic: Improving svc.fcr.pct is the primary lever for maximizing svc.sla.attainment.pct.
ux_layout_rules:
  report_structure: 2-Page-Lead
  report_canvas: { width: 1920, height: 1080 }
  page_1_summary:
    title: Experience / Service Summary & Insights
    page_type: T1_Strategic_Overview
    template_id: pulse
    component_3s:
      kpi_id: svc.sla.attainment.pct
      visual_type: kpi_card
    component_30s:
    - kpi_id: svc.fcr.pct
      visual_type: trend_line
    - kpi_ids:
      - svc.aht.minutes
      - svc.backlog.count
      - svc.nps.index
      visual_type: bar_chart
  page_2_execution:
    title: Experience / Service Execution
    page_type: T3_Operational_Monitoring
    template_id: action_matrix
    component_300s:
      evidence_grain: case
      evidence_columns:
      - entity
      - period
      - svc.sla.attainment.pct
      action_panel: true
      payload_mode: full
overrides:
  data_contract_ref: core/data_contracts/domains/experience.yaml
documentation:
  business_factsheet: ./Business_Factsheet.md
