# 6. MAPPING READINESS
# ──────────────────────────────────────────
mapping_readiness:
  kpi_catalog_coverage: partial
  factsheet_coverage: complete
  bracket_coverage: partial
  action_code_coverage: partial
  semantic_model_coverage: partial

  gap_summary:
    content_gaps:
      - gap_type: content_gap
        severity: medium
        affected_artifact: core/usecases/core/XD-001_Service_Level_Performance/UseCase_Bracket.yaml
        field: orchestration.supporting_kpi_ids
        description: >
          Diagnostic KPIs from the domain model (svc.backlog.aging.days, svc.reopen.pct,
          svc.abandon.pct, svc.asa.seconds) are not represented in supporting_kpi_ids. These are
          required to target SLA-recovery action and to avoid the abandonment/reopen blind spots.
        evidence_reference: SRC-001 SRC-003 SRC-007
        remediation: "Add aging, reopen, abandonment, and ASA diagnostics to supporting_kpi_ids. Close when DEP approved."
        status: deferred
        resolution: "Blocked by model_gap: backlog-aging / reopen / abandonment / ASA KPIs not yet in catalog or experience contract; documented in DEP driver tree."

      - gap_type: content_gap
        severity: medium
        affected_artifact: core/usecases/core/XD-001_Service_Level_Performance/Business_Factsheet.md
        field: "Section 8 Success Criteria"
        description: >
          Benchmark targets not quantified: SLA 90–95% within target / <80% breach risk, FCR 70–79%,
          ASA ~38–45s. Section 8 states qualitative goals only.
        evidence_reference: SRC-001 SRC-007
        remediation: "Add quantified benchmark targets to Section 8. Close when DEP approved."
        status: resolved
        resolution: "Section 8 Success Criteria now states grounded benchmark targets — SLA attainment 90–95% within target (<80% = breach risk), FCR 70–79%, ASA ~38–45s (ITIL 4 / ISO/IEC 20000-1 / MetricNet-HDI)."

    mapping_gaps:
      - gap_type: mapping_gap
        severity: high
        affected_artifact: core/usecases/core/XD-001_Service_Level_Performance/UseCase_Bracket.yaml
        field: ux_layout_rules.page_1_summary.component_30s (Main_1)
        description: >
          Main_1 trend shows svc.backlog.count (the primary driver) rather than the strategic KPI
          svc.sla.attainment.pct. Domain evidence requires the strategic KPI as the lead trend with
          target overlay, answering 'Is SLA on target?' before 'Why?'. Backlog belongs in Main_2.
        evidence_reference: SRC-001 SRC-011
        remediation: "Set Main_1 kpi_id to svc.sla.attainment.pct vs_target; move backlog to Main_2. Close when DEP approved."
        status: rejected
        resolution: "Strategic KPI (svc.sla.attainment.pct) is already the 3-second headline card; Main_1 correctly leads with the backlog driver, consistent with COM-001. No change."

      - gap_type: mapping_gap
        severity: medium
        affected_artifact: core/usecases/core/XD-001_Service_Level_Performance/UseCase_Bracket.yaml
        field: ux_layout_rules.page_2_execution.component_300s.evidence_columns
        description: >
          Evidence columns omit backlog aging and reopen flag. Without aging, SLA-recovery (X-S1.1)
          cannot distinguish breached from recoverable cases; without reopen, premature-closure
          gaming is invisible.
        evidence_reference: SRC-001 SRC-012
        remediation: "Add backlog_age_bucket and reopen_flag to evidence_columns. Close when DEP approved."
        status: deferred
        resolution: "Blocked by model_gap — backlog_age_bucket / reopen_flag columns do not exist in the experience contract."

    schema_gaps: []
    generator_gaps: []

    model_gaps:
      - gap_type: model_gap
        severity: high
        affected_artifact: core/data_contracts/domains/experience.yaml
        field: fact_support_cases (abandonment / ASA)
        description: >
          The contract captures handled-case SLA but has no offered/abandoned contact or
          speed-of-answer fields. SLA-on-handled hides abandonment; abandonment and ASA cannot be
          computed from the current grain, leaving the survivorship blind spot per ISO 18295-1.
        evidence_reference: SRC-003 SRC-007
        remediation: >
          Add offered/abandoned contact events and answer-timestamp (ASA) to the experience contract
          and Experience.SemanticModel; define Abandonment % and ASA measures.
        status: deferred
        resolution: "Requires experience data-contract changes (offered/abandoned events + answer timestamp; reopen flag + case open/close timestamps)."

      - gap_type: model_gap
        severity: medium
        affected_artifact: core/data_contracts/domains/experience.yaml
        field: fact_support_cases (reopen / aging)
        description: >
          No reopen flag or case-age field exists. Reopen rate (true-FCR signal) and backlog aging
          (SLA-breach risk) cannot be derived, weakening the premature-closure guardrail and the
          recovery action targeting.
        evidence_reference: SRC-001 SRC-012
        remediation: >
          Add Reopen Flag and case open/close timestamps (to derive age) to fact_support_cases;
          add Reopen % and Backlog Aging measures to Experience.SemanticModel.
        status: deferred
        resolution: "Requires experience data-contract changes (offered/abandoned events + answer timestamp; reopen flag + case open/close timestamps)."
