schema_version: '2.0'
id: COM-001
title: Sales Performance vs Plan & LY
domain: Commercial
governance:
  owner_role: commercial_controlling_lead
  steward_role: sales_bi_lead
orchestration:
  # strategic_kpi_id drives the business guardrail (GM% is the ultimate P&L health signal)
  strategic_kpi_id: margin.gm.pct
  # First 3 influencing → KPI card band on Overview (generator: component_3s lead + deduped influencing, max 4)
  # Strategic margin.gm.pct must NOT repeat in influencing_kpi_ids (registry causal_links rule)
  influencing_kpi_ids:
  - sales.net_sales.delta_pct.plan
  - sales.net_sales.delta_pct.ly
  - sales.net_sales.amount
  - sales.pvm.price_effect.amount
  - sales.pvm.volume_effect.amount
  - sales.pvm.mix_effect.amount
  - cost.cogs.amount
  supporting_kpi_ids:
  - sales.net_sales.plan.amount
  - sales.net_sales.ly.amount
  - sales.price.list.amount
  - sales.price.net.amount
  action_code_ids:
  - C-M2.1
  - C-S1.1
  - C-S1.2
primary_kpi_ids:
  - margin.gm.pct
  - sales.net_sales.amount

value_driver_model:
  formula: margin.gm.pct = f(sales.net_sales.amount, sales.net_sales.delta_pct.plan, sales.net_sales.delta_pct.ly, sales.pvm.price_effect.amount,
    sales.pvm.volume_effect.amount, sales.pvm.mix_effect.amount)
  impact_direction: maximize
  primary_driver: sales.net_sales.amount
  impact_logic: Improving sales.net_sales.amount is the primary lever for maximizing margin.gm.pct.
ux_layout_rules:
  report_structure: 2-Page-Lead
  report_canvas: { width: 1920, height: 1080 }
  # R2.4 (Cut C2): migrated to the intent layer, COM-002 as reference pattern.
  intent_rules_version: 2
  title_statements_verified: false
  page_1_summary:
    title: Commercial Summary & Insights
    page_type: T2_Tactical_Variance
    template_variant: T2_DriverBridge
    template_id: pulse
    decision_question: "Are we on track for our Commercial targets this month?"
    big_idea: "Protect margin by separating the sales gap into price, volume, and mix before choosing an intervention."
    component_3s:
      # Lead card: Net Sales Amount — primary metric of this use case (Q1/Q5)
      # Generator uses strategic + first 3 influencing for the 4-card band:
      # Net Sales Amount | Net Sales % vs Plan | Delta% Net Sales | Gross Margin %
      kpi_id: sales.net_sales.amount
      visual_type: kpi_card_with_delta
      sparkline_field: NetSales_Monthly
      comparison: vs_plan
      status_logic: higher_is_better
    component_30s:
    - slot_id: Main_1
      # Q5: Trend over time — Actual vs Plan vs Last Year (monthly granularity)
      # kpi_ids: catalog IDs resolve via config_loader; direct measure names fall back as-is
      visual_type: line_chart
      question: "Are we on track versus Plan and last year — and is the lead holding?"
      message: "Net Sales compared with Plan and prior year reveals whether commercial performance is sustained."
      so_what: "A deteriorating trajectory moves the decision from monitoring to targeted commercial recovery."
      kpi_ids:
        - sales.net_sales.amount        # → Net Sales Amount
        - sales.net_sales.plan.amount
        - sales.net_sales.ly.amount
      category_field: dim_date.CalendarYearMonth
      action_code_id: C-S1.2
      unit: amount
    - slot_id: Main_2
      # T2_DriverBridge / variance_explanation: Plan → PVM drivers → Actual (IBCS bridge)
      visual_type: waterfall_chart
      question: "What's driving the gap between Plan and Actual — price, volume, or mix?"
      message: "Price, volume, and mix reconcile the movement from Plan to Actual Net Sales."
      so_what: "The dominant bridge component determines whether pricing, demand, or portfolio mix needs intervention."
      comparison: vs_plan
      kpi_ids:
        - sales.net_sales.plan.amount
        - sales.pvm.price_effect.amount
        - sales.pvm.volume_effect.amount
        - sales.pvm.mix_effect.amount
        - sales.net_sales.amount
      category_field: dim_pvm_driver.Driver
      action_code_id: C-M2.1
      unit: amount
    - slot_id: Main_3
      # Q1: Where are deviations largest? — % vs Plan by Region (sorted ascending = worst first)
      visual_type: horizontal_bar_chart
      question: "Is the Plan gap broad-based or concentrated in a few regions?"
      message: "Regional variance ranks where the sales gap and recovery opportunity are concentrated."
      so_what: "Worst-first prioritisation focuses commercial capacity where it can close the largest gap."
      kpi_id: sales.net_sales.delta_pct.plan
      category_field: dim_org.Region
      action_code_id: C-S1.2
      unit: rate
  page_2_execution:
    title: Commercial Execution
    page_type: T4_Prescriptive_Recommendation
    template_variant: T4_ActionDecision
    template_id: action_matrix
    decision_question: "Which entities explain the revenue and margin gap vs Plan?"
    big_idea: "DACH and CEE account for 80% of the Plan gap — mix degradation and price concessions are the root causes."
    component_300s:
      evidence_grain: invoice_line
      slicer_field: dim_org.Region
      # R2.4: curated 11→8 (Muster: COM-002 R1.3). Cut channel/customer_segment
      # (region is the finer, decision-relevant cross-cut; both are covered by
      # non-evidence-table context already) and delta_pct.ly (redundant next to
      # delta_pct.plan, the decision_question's own "on track for targets" signal).
      evidence_columns:
      - dim_org.Region
      - dim_product.Category
      - sales.net_sales.amount
      - sales.net_sales.delta_pct.plan
      - sales.pvm.price_effect.amount
      - sales.pvm.volume_effect.amount
      - sales.pvm.mix_effect.amount
      - margin.gm.pct
      action_panel: true
      payload_mode: summary
      sort_by:
        measure: sales.net_sales.delta_pct.plan
        direction: ascending
      top_n: 20
      highlight_rule:
        column: sales.net_sales.delta_pct.plan
        type: data_bar
prioritization:
  business_value: high
  implementation_effort: medium
  confidence: 0.9
  reach: organization
  priority_score: 45
data_protection:
  # DSGVO Art. 25 Privacy by Design and by Default
  # Authority: core/templates/page_templates/governance/Data_Protection_Governance.md
  personal_data: false
  # COM-001 processes aggregated commercial KPIs (Net Sales, GM%) at invoice-line grain.
  # Invoice lines carry customer/product identifiers but no natural-person data.
  # Aggregate-level display (DACH region, product category) does not identify individuals.
  legal_basis: not_applicable
  data_minimisation: >
    Detail Matrix limited to business-unit grain (region, channel, product_category,
    customer_segment). No individual-level customer or employee data is exposed.
    Row-level security applied at SemanticModel level — see commercial_sales data contract.
  access_restriction: >
    commercial_controlling_lead and sales_bi_lead roles; row-level security enforced
    by Commercial.SemanticModel (entity filter per org role).
  dpia_required: false
  ai_generated_output: true
  ai_grounding_measure: >
    Active Actions Text (COM) — DAX measure that reads current filter context and
    concatenates only triggered action texts. smartNarrativeVisual auto-reads same
    page filter context as KPI cards. See Storytelling_Principles.md §13.
readiness:
  data_availability: available
  org_capability: ready
  stakeholder_alignment: aligned
  overall_readiness: green
overrides:
  data_contract_ref: core/data_contracts/domains/commercial_sales.yaml
documentation:
  business_factsheet: ./Business_Factsheet.md

use_case_links:
  - use_case_id: FIN-002
    link_type: feeds_into
    reason: "Net Sales and GM% from COM-001 are the primary revenue inputs for the FIN-002 unit cost and COGS driver model."
