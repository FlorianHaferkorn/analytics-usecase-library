schema_version: '2.0'
id: COM-001
name: Sales Performance vs Plan & LY
domain: Commercial
governance:
  owner_role: Commercial Controlling Lead
  steward_role: Sales BI Lead
  status: active
  last_review: '2026-02-12'
ontology_bracket:
  strategic_kpi_id: margin.gm.pct
  influencing_kpi_ids:
  - sales.net_sales.amount
  - sales.net_sales.delta_pct.plan
  - sales.net_sales.delta_pct.ly
  - sales.pvm.price_effect.amount
  - sales.pvm.volume_effect.amount
  - sales.pvm.mix_effect.amount
  action_code_ids:
  - C-M2.1
  - C-S1.1
  - C-S1.2
value_driver_model:
  description: margin.gm.pct is driven by influencing KPIs and operational levers.
  formula: margin.gm.pct = f(sales.net_sales.amount, sales.net_sales.delta_pct.plan,
    sales.net_sales.delta_pct.ly, sales.pvm.price_effect.amount, sales.pvm.volume_effect.amount,
    sales.pvm.mix_effect.amount)
ux_layout_rules:
  report_structure: 2-Page-Lead
  page_1_summary_insights:
    title: Commercial Summary & Insights
    3s_component: 'North Star: margin.gm.pct'
    30s_components: []
  page_2_execution:
    title: Commercial Execution
    300s_components:
    - 'Evidence_Table: (define evidence table requirements)'
    - 'Action_Panel: Integrated Side-Panel for Subscribed Action Codes'
    - 'Payload_Injection: Show Level (L1-L3) and Steps from Action Code YAML'
documentation:
  business_factsheet: ./Business_Factsheet.md
  technical_factsheet: ./Technical_Factsheet.md
