evidence_pack_version: "1.0"
use_case_id: COM-001
use_case_title: Sales Performance vs Plan & LY
domain: Commercial
authored_date: "2026-06-01"
authored_by: framework-architect-agent
reviewed_by: ""
status: draft

process_scope:
  description: >
    Net Sales performance management against annual plan and prior year.
    Covers revenue gap analysis, Price/Volume/Mix decomposition, channel and region
    attribution, and early-warning actions to protect revenue and margin.
  in_scope:
    - Net Sales vs Plan and vs Last Year (absolute delta and % delta)
    - Price/Volume/Mix (PVM) decomposition of revenue variance
    - Channel, region, and product category attribution of sales gaps
    - Gross Margin % as guardrail metric alongside revenue
    - Early corrective action triggers (discount discipline, mix improvement)
  out_of_scope:
    - Promotion-specific ROI analysis (COM-004)
    - Customer lifetime value and churn (COM-003)
    - Long-term pricing strategy
  industry_segment: B2B and B2C manufacturing/distribution companies
  applicable_frameworks:
    - name: APQC PCF Category 2 — Develop and Manage Products and Services / Manage Sales
      id: APQC-PCF-2
    - name: McKinsey Price/Volume/Mix Revenue Analysis Framework
      id: PVM-FRAMEWORK
    - name: Gartner Sales Benchmark and Best Practices
      id: GARTNER-SALES

canonical_domain_model:
  outcome_kpis:
    - id: KPI-COM-005
      name: Net Sales Amount
      definition: Revenue net of discounts, returns, and rebates. Primary revenue KPI.
      unit: EUR
      direction: maximize
      benchmark_target: "Sector-specific; 5–10% YoY growth for manufacturing B2B (Gartner)"
      benchmark_source_id: SRC-004

    - id: KPI-COM-013
      name: Gross Margin %
      role: guardrail
      definition: "(Net Sales - COGS) / Net Sales × 100"
      unit: "%"
      direction: maximize
      causal_mechanism: >
        Co-outcome guardrail: revenue growth must not come at the cost of margin.
        PVM mix shifts can increase volume but destroy margin if product mix shifts
        toward lower-margin items. GM% is derived from Net Sales and COGS, not a causal
        driver of revenue.
      benchmark_target: "Sector-specific; 25–45% GM% for B2B manufacturing (APQC benchmarks)"
      benchmark_source_id: SRC-006

  driver_kpis:
    - id: KPI-COM-009
      name: Net Sales % vs Plan
      definition: "(Actual Net Sales - Plan Net Sales) / Plan Net Sales × 100"
      unit: "%"
      direction: maximize
      drives: KPI-COM-005
      causal_mechanism: Plan gap triggers pricing or volume corrective actions.
      benchmark_target: "Within ±3% of plan (Gartner Sales Performance Benchmark)"
      benchmark_source_id: SRC-004

    - id: KPI-COM-008
      name: Net Sales % vs LY
      definition: "(Actual Net Sales - LY Net Sales) / LY Net Sales × 100"
      unit: "%"
      direction: maximize
      drives: KPI-COM-005
      causal_mechanism: LY comparison signals structural growth or decline trends.
      benchmark_target: ""
      benchmark_source_id: ""

  diagnostic_kpis:
    - id: KPI-COM-010
      name: Price Effect (PVM)
      definition: Contribution of price changes to Net Sales variance.
      unit: EUR
      direction: maximize
      diagnoses: KPI-COM-009
      causal_mechanism: Positive price effect = realised price increases; negative = price erosion.

    - id: KPI-COM-011
      name: Volume Effect (PVM)
      definition: Contribution of volume changes to Net Sales variance.
      unit: EUR
      direction: maximize
      diagnoses: KPI-COM-009
      causal_mechanism: Isolated from mix and price to show pure volume driver.

    - id: KPI-COM-004
      name: Mix Effect (PVM)
      definition: Contribution of product/channel/customer mix changes to Net Sales variance.
      unit: EUR
      direction: maximize
      diagnoses: KPI-COM-009
      causal_mechanism: >
        Negative mix effect with positive volume = growth in lower-margin products.
        Requires GM% guardrail to prevent value-destroying volume growth.

  guardrails:
    - description: Margin guardrail on volume actions
      condition: >
        Do not trigger volume growth actions if GM% is below target and mix effect is
        already negative. Volume without margin recovery destroys value.
      affected_kpis:
        - KPI-COM-005
        - KPI-COM-013

  wrong_interpretations:
    - description: Revenue growth without margin check
      why_wrong: >
        Growing net sales by adding low-margin volume improves the top line but
        reduces total gross profit. Always evaluate Net Sales delta alongside GM%.
      source_id: SRC-005

    - description: Plan variance without PVM context
      why_wrong: >
        A -5% plan gap can be caused by price erosion, volume shortfall, or mix shift.
        Each has a different corrective action. Without PVM decomposition, managers
        correct the wrong lever.
      source_id: SRC-003

    - description: YoY comparison without adjusting for portfolio changes
      why_wrong: >
        LY comparison is misleading when the product portfolio changed significantly
        (new SKUs, discontinued products). Like-for-like revenue growth should be
        reported separately from total revenue growth.
      source_id: SRC-002

