action_logic_seeds:
  - trigger_driver: KPI-COM-009
    trigger_diagnostic: KPI-COM-010
    trigger_condition: "Net Sales < Plan by > 5% for 2 consecutive months AND price effect is negative"
    guardrail: "Do not trigger if GM% is above target and mix effect is positive"
    action_description: Discount discipline review and price realisation corrective action.
    expected_outcome_kpi: KPI-COM-005
    action_code_candidate: C-S1.1

  - trigger_driver: KPI-COM-009
    trigger_diagnostic: KPI-COM-011
    trigger_condition: "Net Sales < Plan by > 5% AND volume effect is negative with stable prices"
    guardrail: "Exclude periods of planned seasonal dip"
    action_description: Volume recovery actions — pipeline acceleration, channel activation.
    expected_outcome_kpi: KPI-COM-005
    action_code_candidate: C-S1.2

required_data_model:
  required_facts:
    - table: fact_sales
      description: Sales transaction/order line with net sales amount, list price, discount, COGS, product, customer, channel, region.
  required_dimensions:
    - name: dim_date
      grain_relevance: Month-level minimum; week for operational monitoring.
    - name: dim_product
      grain_relevance: Category/SKU level for mix analysis.
    - name: dim_org
      grain_relevance: Region/channel attribution.
    - name: dim_customer
      grain_relevance: Key account vs long-tail segmentation.
  preferred_grain: product-channel-month
  minimum_grain: channel-month
  minimum_history_months: 24
  required_measures:
    - name: Net Sales Amount
      formula_seed: "SUM(sales_amount) - SUM(returns) - SUM(rebates)"
      source_id: SRC-001
    - name: Plan Sales Amount
      formula_seed: "SUM(planned_sales_amount)"
      source_id: SRC-001
    - name: Net Sales % vs Plan
      formula_seed: "(Net Sales - Plan) / Plan"
      source_id: SRC-003
    - name: Price Effect (PVM)
      formula_seed: "(Actual Price - Prior Price) × Actual Volume"
      source_id: SRC-003
    - name: Volume Effect (PVM)
      formula_seed: "(Actual Volume - Prior Volume) × Prior Price"
      source_id: SRC-003
    - name: Mix Effect (PVM)
      formula_seed: "Total Variance - Price Effect - Volume Effect"
      source_id: SRC-003

