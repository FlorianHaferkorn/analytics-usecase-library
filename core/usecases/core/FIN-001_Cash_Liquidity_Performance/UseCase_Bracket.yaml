schema_version: '2.0'
id: FIN-001
title: Cash & Liquidity Performance
domain: Finance
governance:
  owner_role: treasury_finance_controlling
  steward_role: treasury_finance_bi_lead
orchestration:
  strategic_kpi_id: wc.ccc.days
  influencing_kpi_ids:
  - fin.cash.balance
  - fin.cash.ocf
  - fin.cash.vs_plan.pct
  - wc.dso.days
  - wc.dio.days
  - wc.dpo.days
  - scm.service_level.pct
  - scm.supplier_risk.score
  action_code_ids:
  - F-C1.1
  - F-C1.2
  - F-C1.3
  - F-C1.4
value_driver_model:
  formula: wc.ccc.days = f(fin.cash.balance, fin.cash.ocf, fin.cash.vs_plan.pct, wc.dso.days, wc.dio.days, wc.dpo.days, scm.service_level.pct,
    scm.supplier_risk.score)
  impact_direction: minimize
  primary_driver: fin.cash.balance
  impact_logic: Improving fin.cash.balance is the primary lever for minimizing wc.ccc.days.
ux_layout_rules:
  report_structure: 2-Page-Lead
  page_1_summary:
    title: Finance Summary & Insights
    component_3s:
      kpi_id: wc.ccc.days
      visual_type: kpi_card
    component_30s:
    - kpi_id: fin.cash.balance
      visual_type: trend_line
    - kpi_ids:
      - fin.cash.ocf
      - fin.cash.vs_plan.pct
      - wc.dso.days
      visual_type: bar_chart
  page_2_execution:
    title: Finance Execution
    component_300s:
      evidence_grain: transaction_line
      evidence_columns:
      - entity
      - period
      - wc.ccc.days
      action_panel: true
      payload_mode: full
documentation:
  business_factsheet: ./Business_Factsheet.md
