schema_version: '2.0'
id: FIN-001
title: Cash & Liquidity Performance
domain: Finance
governance:
  owner_role: treasury_finance_controlling
  steward_role: treasury_finance_bi_lead
orchestration:
  strategic_kpi_id: wc.ccc.days
  influencing_kpi_ids:
  - fin.cash.balance
  - fin.cash.ocf
  - fin.cash.vs_plan.pct
  - wc.dso.days
  - wc.dio.days
  - wc.dpo.days
  supporting_kpi_ids:
  - scm.service_level.pct
  - scm.supplier_risk.score
  - fin.liquidity.inventory.amount
  action_code_ids:
  - F-C1.1
  - F-C1.2
  - S-I1.2
  - F-C1.4
value_driver_model:
  formula: wc.ccc.days = wc.dso.days + wc.dio.days - wc.dpo.days
  impact_direction: minimize
  primary_driver: wc.dso.days
  impact_logic: Reducing wc.dso.days is the primary lever for minimizing wc.ccc.days.
ux_layout_rules:
  report_structure: 2-Page-Lead
  report_canvas: { width: 1920, height: 1080 }
  page_1_summary:
    title: Finance Summary & Insights
    page_type: T1_Strategic_Overview
    template_id: pulse
    component_3s:
      kpi_id: wc.ccc.days
      visual_type: kpi_card
    component_30s:
    - kpi_id: fin.cash.balance
      visual_type: trend_line
    - kpi_ids:
      - fin.cash.ocf
      - fin.cash.vs_plan.pct
      - wc.dso.days
      visual_type: bar_chart
  page_2_execution:
    title: Finance Execution
    page_type: T2_Tactical_Variance
    template_id: action_matrix
    component_300s:
      evidence_grain: entity_month
      evidence_columns:
      - entity
      - region
      - fin.cash.balance
      - fin.cash.ocf
      - fin.cash.vs_plan.pct
      - wc.dso.days
      - wc.dio.days
      - wc.dpo.days
      - wc.ccc.days
      - fin.liquidity.inventory.amount
      - scm.service_level.pct
      - scm.supplier_risk.score
      action_panel: true
      payload_mode: full
prioritization:
  business_value: high
  implementation_effort: medium
  confidence: 0.85
  reach: organization
  priority_score: 42
readiness:
  data_availability: available
  org_capability: ready
  stakeholder_alignment: aligned
  overall_readiness: green
overrides:
  data_contract_ref: core/data_contracts/domains/finance.yaml
documentation:
  business_factsheet: ./Business_Factsheet.md
