schema_version: '2.0'
id: FIN-001
title: Cash & Liquidity Performance
domain: Finance
governance:
  owner_role: treasury_finance_controlling
  steward_role: treasury_finance_bi_lead
orchestration:
  strategic_kpi_id: wc.ccc.days
  influencing_kpi_ids:
  - fin.cash.balance
  - fin.cash.ocf
  - fin.cash.vs_plan.pct
  - wc.dso.days
  - wc.dio.days
  - wc.dpo.days
  supporting_kpi_ids:
  - scm.service_level.pct
  - scm.supplier_risk.score
  - fin.liquidity.inventory.amount
  - inv.turnover
  - inv.stockout.pct
  - inv.obsolete.pct
  - inv.excess_inventory.amount
  - supply.otif.pct
  - supply.on_time.pct
  - supply.in_full.pct
  - supply.stockout_impact.pct
  - plan.forecast.accuracy.pct
  - plan.forecast.mape.pct
  - plan.forecast.bias.pct
  - plan.forecast.service_impact.pct
  - plan.replan.count
  - fin.overdue_ar.pct
  action_code_ids:
  - F-C1.1
  - F-C1.2
  - S-I1.2
  - F-C1.4
primary_kpi_ids:
  - wc.ccc.days
  - wc.dso.days

value_driver_model:
  formula: wc.ccc.days = wc.dso.days + wc.dio.days - wc.dpo.days
  impact_direction: minimize
  primary_driver: wc.dso.days
  impact_logic: Reducing wc.dso.days is the primary lever for minimizing wc.ccc.days.
ux_layout_rules:
  report_structure: 2-Page-Lead
  report_canvas: { width: 1920, height: 1080 }
  # R2.4 (Cut C2): migrated to the intent layer, COM-002 as reference pattern.
  intent_rules_version: 2
  page_1_summary:
    title: Finance Summary & Insights
    page_type: T1_Strategic_Overview
    template_variant: T1_Trend
    template_id: pulse
    decision_question: "Is cash conversion and liquidity on a safe trajectory?"
    big_idea: "Cash conversion is deteriorating — DSO extension and payables compression are squeezing liquidity headroom and require urgent working capital intervention."
    component_3s:
      kpi_id: wc.ccc.days
      visual_type: kpi_card
      comparison: vs_target
      status_logic: lower_is_better
    component_30s:
    - slot_id: Main_1
      kpi_id: fin.cash.balance
      visual_type: trend_line
      message: Cash balance is drifting down toward its safety-margin threshold
      so_what: "Without working-capital intervention, this trend erodes the safety margin before quarter-end."
      unit: amount
    - slot_id: Main_2
      # R2.4: was 3 KPIs of 2 different calc_types (amount vs. rate) on one
      # axis -- a ONE_MESSAGE_PER_CHART violation. wc.dso.days duplicates
      # Main_3's own bridge; fin.cash.vs_plan.pct moved to the Detail_Matrix
      # (its own worst-first variance signal there).
      kpi_id: fin.cash.ocf
      comparison: vs_plan
      visual_type: waterfall
      message: Operating cash flow is trailing plan, driven by collections rather than cost
      so_what: "An OCF-versus-Plan gap points at collections and cash conversion, not cost control, as the fix."
      unit: amount
    - slot_id: Main_3
      # CCC bridge: DSO + DIO − DPO → CCC decomposition (mapping_gap fix; IBCS bridge)
      visual_type: waterfall
      comparison: vs_target
      kpi_ids:
      - wc.dso.days
      - wc.dio.days
      - wc.dpo.days
      - wc.ccc.days
      message: Cash conversion cycle bridges DSO, DIO, and DPO into total days.
      so_what: "The lever is receivables and inventory days, not delaying payables further — that protects supplier relationships."
      unit: amount
  page_2_execution:
    title: Finance Execution
    decision_question: "Which receivables and inventory levers will shorten the cash conversion cycle fastest?"
    page_type: T4_Prescriptive_Recommendation
    template_variant: T4_ActionDecision
    template_id: action_matrix
    component_300s:
      evidence_grain: entity_month
      # R2.4: curated 12→8. Cut fin.cash.ocf (now Main_2's own headline KPI),
      # fin.liquidity.inventory.amount/scm.service_level.pct/scm.supplier_risk.score
      # (cross-domain supporting KPIs, less central to the cash decision_question).
      evidence_columns:
      - entity
      - region
      - fin.cash.balance
      - fin.cash.vs_plan.pct
      - wc.dso.days
      - wc.dio.days
      - wc.dpo.days
      - wc.ccc.days
      action_panel: true
      payload_mode: full
      sort_by:
        measure: fin.cash.vs_plan.pct
        direction: ascending
      top_n: 20
      highlight_rule:
        column: fin.cash.vs_plan.pct
        type: data_bar
prioritization:
  business_value: high
  implementation_effort: medium
  confidence: 0.85
  reach: organization
  priority_score: 42
data_protection:
  # DSGVO Art. 25 Privacy by Design and by Default
  # Authority: core/templates/page_templates/governance/Data_Protection_Governance.md
  personal_data: false
  legal_basis: not_applicable
  data_minimisation: >
    Detail Matrix limited to legal-entity and cash-flow-category grain.
    Processes financial positions of legal entities (not natural persons). No
    employee or individual customer data is exposed.
  access_restriction: >
    finance_controlling_lead and finance_bi_lead roles; row-level security
    enforced by Finance.SemanticModel (legal-entity filter per org role).
  dpia_required: false
  ai_generated_output: true
  ai_grounding_measure: >
    Active Actions Text (FIN) — DAX measure that reads current filter context
    and concatenates only triggered action texts. See Storytelling_Principles.md
    §13.
readiness:
  data_availability: available
  org_capability: ready
  stakeholder_alignment: aligned
  overall_readiness: green
overrides:
  data_contract_ref: core/data_contracts/domains/finance.yaml
documentation:
  business_factsheet: ./Business_Factsheet.md
