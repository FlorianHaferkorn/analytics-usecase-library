schema_version: '2.0'
id: FIN-001
name: Cash & Liquidity Performance
domain: Finance
governance:
  owner_role: Treasury / Finance Controlling
  steward_role: Treasury / Finance BI Lead
  status: active
  last_review: '2026-02-12'
ontology_bracket:
  strategic_kpi_id: wc.ccc.days
  influencing_kpi_ids:
  - fin.cash.balance
  - fin.cash.ocf
  - fin.cash.vs_plan.pct
  - wc.dso.days
  - wc.dio.days
  - wc.dpo.days
  - scm.service_level.pct
  - scm.supplier_risk.score
  action_code_ids:
  - F-C1.1
  - F-C1.2
  - F-C1.3
  - F-C1.4
value_driver_model:
  description: wc.ccc.days is driven by influencing KPIs and operational levers.
  formula: wc.ccc.days = f(fin.cash.balance, fin.cash.ocf, fin.cash.vs_plan.pct, wc.dso.days,
    wc.dio.days, wc.dpo.days, scm.service_level.pct, scm.supplier_risk.score)
ux_layout_rules:
  report_structure: 2-Page-Lead
  page_1_summary_insights:
    title: Finance Summary & Insights
    3s_component: 'North Star: wc.ccc.days'
    30s_components: []
  page_2_execution:
    title: Finance Execution
    300s_components:
    - 'Evidence_Table: (define evidence table requirements)'
    - 'Action_Panel: Integrated Side-Panel for Subscribed Action Codes'
    - 'Payload_Injection: Show Level (L1-L3) and Steps from Action Code YAML'
documentation:
  business_factsheet: ./Business_Factsheet.md
  technical_factsheet: ./Technical_Factsheet.md
