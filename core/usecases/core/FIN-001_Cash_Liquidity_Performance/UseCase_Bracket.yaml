schema_version: '2.0'
id: FIN-001
title: Cash & Liquidity Performance
domain: Finance
governance:
  owner_role: treasury_finance_controlling
  steward_role: treasury_finance_bi_lead
orchestration:
  strategic_kpi_id: KPI-FIN-006
  influencing_kpi_ids:
  - KPI-FIN-007
  - KPI-FIN-009
  - KPI-FIN-010
  - KPI-FIN-001
  - KPI-FIN-004
  - KPI-FIN-005
  supporting_kpi_ids:
  - KPI-SCM-022
  - KPI-FIN-002
  - KPI-SCM-016
  - KPI-SCM-002
  - KPI-SCM-004
  - KPI-SCM-003
  - KPI-SCM-007
  - KPI-SCM-008
  - KPI-SCM-018
  - KPI-SCM-009
  - KPI-SCM-005
  - KPI-SCM-017
  - KPI-SCM-006
  - KPI-SCM-012
  - KPI-SCM-014
  - KPI-FIN-008
  action_code_ids:
  - F-C1.1
  - F-C1.2
  - S-I1.2
  - F-C1.4
primary_kpi_ids:
  - KPI-FIN-006
  - KPI-FIN-001

value_driver_model:
  formula: KPI-FIN-006 = KPI-FIN-001 + KPI-FIN-004 - KPI-FIN-005
  impact_direction: minimize
  primary_driver: KPI-FIN-001
  impact_logic: Reducing KPI-FIN-001 is the primary lever for minimizing KPI-FIN-006.
ux_layout_rules:
  report_structure: 2-Page-Lead
  report_canvas: { width: 1920, height: 1080 }
  # Sprache der vom Generator formulierten Texte (Alt-Text), 01.10.2026: der Report in dist
  # traegt deutsche Seitentitel. Die Texte hier im Bracket bleiben englisch.
  report_locale: de-DE
  # R2.4 (Cut C2): migrated to the intent layer, COM-002 as reference pattern.
  intent_rules_version: 2
  page_1_summary:
    title: Finance Summary & Insights
    page_type: T1_Strategic_Overview
    template_variant: T1_Trend
    template_id: pulse
    decision_question: "Is cash conversion and liquidity on a safe trajectory?"
    big_idea: "Cash conversion is deteriorating — DSO extension and payables compression are squeezing liquidity headroom and require urgent working capital intervention."
    component_3s:
      kpi_id: KPI-FIN-006
      visual_type: kpi_card_with_delta
      comparison: vs_target
      status_logic: lower_is_better
    component_30s:
    - slot_id: Main_1
      kpi_id: KPI-FIN-007
      visual_type: line_chart
      question: "Is the cash balance on a safe trajectory?"
      message: Cash balance is drifting down toward its safety-margin threshold
      so_what: "Without working-capital intervention, this trend erodes the safety margin before quarter-end."
      unit: amount
    - slot_id: Main_2
      # R2.4: was 3 KPIs of 2 different calc_types (amount vs. rate) on one
      # axis -- a ONE_MESSAGE_PER_CHART violation. KPI-FIN-001 duplicates
      # Main_3's own bridge; KPI-FIN-010 moved to the Detail_Matrix
      # (its own worst-first variance signal there).
      kpi_id: KPI-FIN-009
      comparison: vs_plan
      visual_type: waterfall_chart
      question: "Is operating cash flow meeting plan, and what's driving the gap?"
      message: Operating cash flow is trailing plan, driven by collections rather than cost
      so_what: "An OCF-versus-Plan gap points at collections and cash conversion, not cost control, as the fix."
      unit: amount
    - slot_id: Main_3
      # CCC bridge: DSO + DIO − DPO → CCC decomposition (mapping_gap fix; IBCS bridge)
      visual_type: waterfall_chart
      comparison: vs_target
      kpi_ids:
      - KPI-FIN-001
      - KPI-FIN-004
      - KPI-FIN-005
      - KPI-FIN-006
      question: "Which part of the cash conversion cycle is the lever — receivables, inventory, or payables?"
      message: Cash conversion cycle bridges DSO, DIO, and DPO into total days.
      so_what: "The lever is receivables and inventory days, not delaying payables further — that protects supplier relationships."
      unit: amount
  page_2_execution:
    title: Finance Execution
    decision_question: "Which receivables and inventory levers will shorten the cash conversion cycle fastest?"
    page_type: T4_Prescriptive_Recommendation
    template_variant: T4_ActionDecision
    template_id: action_matrix
    component_300s:
      evidence_grain: entity_month
      # R2.4: curated 12→8. Cut KPI-FIN-009 (now Main_2's own headline KPI),
      # KPI-FIN-002/KPI-SCM-007/KPI-SCM-022
      # (cross-domain supporting KPIs, less central to the cash decision_question).
      # R2.5 (2026-07-22): partial reversal for demo completeness. The three
      # cross-domain supporting columns are restored now that their facts are
      # wired into Finance.SemanticModel (fact_fulfillment, fact_supplier_risk
      # registered + related; Supplier Risk Score de-stubbed). Supplier risk is
      # surfaced entity-side via the AP-exposure-weighted measure
      # 'Supplier Risk Score (Entity)' (a global constant would be misleading on
      # an entity grain). KPI-FIN-009 stays cut (Main_2's own headline KPI).
      evidence_columns:
      - entity
      - region
      - KPI-FIN-007
      - KPI-FIN-010
      - KPI-FIN-001
      - KPI-FIN-004
      - KPI-FIN-005
      - KPI-FIN-006
      - KPI-FIN-002
      - KPI-SCM-007
      - KPI-SCM-022   # entity grain → 'Supplier Risk Score (Entity)'
      action_panel: true
      payload_mode: full
      sort_by:
        measure: KPI-FIN-010
        direction: ascending
      top_n: 20
      highlight_rule:
        column: KPI-FIN-010
        type: data_bar
prioritization:
  business_value: high
  implementation_effort: medium
  confidence: 0.85
  reach: organization
  priority_score: 42
data_protection:
  # DSGVO Art. 25 Privacy by Design and by Default
  # Authority: core/templates/page_templates/governance/Data_Protection_Governance.md
  personal_data: false
  legal_basis: not_applicable
  data_minimisation: >
    Detail Matrix limited to legal-entity and cash-flow-category grain.
    Processes financial positions of legal entities (not natural persons). No
    employee or individual customer data is exposed.
  access_restriction: >
    finance_controlling_lead and finance_bi_lead roles; row-level security
    enforced by Finance.SemanticModel (legal-entity filter per org role).
  dpia_required: false
  ai_generated_output: true
  ai_grounding_measure: >
    Active Actions Text (FIN) — DAX measure that reads current filter context
    and concatenates only triggered action texts. See Storytelling_Principles.md
    §13.
readiness:
  data_availability: available
  org_capability: ready
  stakeholder_alignment: aligned
  overall_readiness: green
overrides:
  data_contract_ref: core/data_contracts/domains/finance.yaml
documentation:
  business_factsheet: ./Business_Factsheet.md
