action_logic_seeds:
  - trigger_driver: wc.dso.days
    trigger_diagnostic: fin.overdue_ar.pct
    trigger_condition: "DSO > benchmark by > 5 days for 2 consecutive months AND overdue AR > 15%"
    guardrail: "Do not pursue aggressive collection on strategically important customers"
    action_description: Accounts receivable collections acceleration and overdue customer follow-up.
    expected_outcome_kpi: wc.ccc.days
    action_code_candidate: F-C1.2

  - trigger_driver: wc.ccc.days
    trigger_diagnostic: wc.dio.days
    trigger_condition: "CCC > target by > 10 days AND DIO is the primary driver"
    guardrail: "Do not reduce inventory below minimum service level threshold"
    action_description: Inventory reduction program coordinated with SCM-001 action codes.
    expected_outcome_kpi: fin.cash.balance
    action_code_candidate: F-C1.1

required_data_model:
  required_facts:
    - table: fact_gl
      description: General ledger entries for OCF calculation and cash balance.
    - table: fact_ar
      description: Accounts receivable aging with due dates for DSO and overdue AR.
    - table: fact_ap
      description: Accounts payable with payment dates for DPO calculation.
  required_dimensions:
    - name: dim_customer
      grain_relevance: Customer-level DSO and overdue AR for collection targeting.
    - name: dim_date
      grain_relevance: Daily cash balance and monthly CCC trending.
  preferred_grain: company-month (CCC trend); customer-month (DSO analysis)
  minimum_grain: company-month
  minimum_history_months: 24
  required_measures:
    - name: Cash Conversion Cycle (days)
      formula_seed: "DSO + DIO - DPO"
      source_id: SRC-002
    - name: DSO (days)
      formula_seed: "(Average AR / Revenue) × Days in Period"
      source_id: SRC-007
    - name: DPO (days)
      formula_seed: "(Average AP / COGS) × Days in Period"
      source_id: SRC-007
    - name: Operating Cash Flow
      formula_seed: "Net Income + Depreciation/Amortisation ± Working Capital Changes"
      source_id: SRC-001

