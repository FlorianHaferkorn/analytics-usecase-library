evidence_pack_version: "1.0"
use_case_id: FIN-001
use_case_title: Cash & Liquidity Performance
domain: Finance
authored_date: "2026-06-01"
authored_by: framework-architect-agent
reviewed_by: ""
status: draft

process_scope:
  description: >
    Treasury and working capital management. Monitors cash balances, forecasted liquidity,
    cash conversion cycle (CCC = DSO + DIO - DPO), and operating cash flow. Enables
    early corrective actions on receivables, payables, and inventory to protect liquidity.
  in_scope:
    - Cash balance and liquidity buffer monitoring
    - Cash Conversion Cycle (CCC = DSO + DIO - DPO)
    - Days Sales Outstanding (DSO) trend and customer-level analysis
    - Days Payables Outstanding (DPO) optimisation
    - Operating Cash Flow (OCF) trend and bridge
    - Free Cash Flow (FCF) projection
  out_of_scope:
    - Capital structure and CAPEX decisions
    - FX hedging strategy
    - Detailed cost management (FIN-002)
  industry_segment: Manufacturing and distribution companies with B2B receivables
  applicable_frameworks:
    - name: "IAS 7 Statement of Cash Flows (IFRS)"
      id: IAS-7
    - name: "AFP (Association for Financial Professionals) — Treasury Management Handbook"
      id: AFP-TREASURY
    - name: "Gitman, L.J. (1974) Cash Conversion Cycle Framework"
      id: CCC-FRAMEWORK
    - name: "APQC PCF 11.0 Manage Financial Resources — Treasury and Cash Management"
      id: APQC-PCF-11

canonical_domain_model:
  outcome_kpis:
    - id: fin.cash.balance
      name: Cash and Cash Equivalents Balance
      definition: >
        Total cash and cash equivalents per IAS 7. Includes unrestricted bank accounts,
        short-term deposits (<3 months), and money market funds.
      unit: EUR
      direction: maximize
      benchmark_target: >
        Minimum liquidity buffer ≥ 30 days of operating expenses (AFP Treasury Standard);
        typical manufacturing target: 60–90 days of operating expenses.
      benchmark_source_id: SRC-003

  driver_kpis:
    - id: wc.ccc.days
      name: Cash Conversion Cycle (CCC)
      definition: >
        CCC = DSO + DIO - DPO. Measures the number of days a company's cash is tied up
        in operations. Lower CCC = faster cash cycle = more liquidity.
      unit: days
      direction: minimize
      drives: fin.cash.balance
      causal_mechanism: >
        Each day of CCC improvement releases cash equal to approximately one day of
        revenue. A 5-day CCC reduction on EUR 100M revenue frees EUR ~1.4M in cash.
        (Gitman 1974 original CCC framework).
      benchmark_target: "< 45 days world class (Hackett Group); sector-specific"
      benchmark_source_id: SRC-007

    - id: wc.dso.days
      name: Days Sales Outstanding (DSO)
      definition: "(Accounts Receivable / Revenue) × Days in Period. Measures collection speed."
      unit: days
      direction: minimize
      drives: wc.ccc.days
      causal_mechanism: >
        DSO is the largest CCC lever in most manufacturing companies. Each 1-day DSO
        reduction on EUR 100M revenue frees EUR ~274k in cash.
      benchmark_target: "< 40 days world class (Hackett Group manufacturing benchmark 2023)"
      benchmark_source_id: SRC-007

    - id: wc.dpo.days
      name: Days Payables Outstanding (DPO)
      definition: "(Accounts Payable / COGS) × Days in Period. Measures payment cycle length."
      unit: days
      direction: maximize
      drives: wc.ccc.days
      causal_mechanism: >
        Increasing DPO (within supplier contract terms) increases cash held. However,
        exceeding contract terms risks supplier relationship damage and early payment
        discounts. DPO is a tradeoff lever, not a pure maximise metric.
      benchmark_target: "45–60 days manufacturing (Hackett Group)"
      benchmark_source_id: SRC-007

    - id: inv.dio.days
      name: Days Inventory Outstanding (DIO)
      definition: "(Inventory Value / COGS) × 365. See SCM-001 for full definition."
      unit: days
      direction: minimize
      drives: wc.ccc.days
      causal_mechanism: Inventory is the third CCC component. See SCM-001 for driver analysis.
      benchmark_target: "30–90 days sector-specific (see SCM-001)"
      benchmark_source_id: SRC-007

  diagnostic_kpis:
    - id: fin.cash.ocf
      name: Operating Cash Flow
      definition: >
        Cash generated from operations before investing and financing activities.
        IAS 7 indirect method: Net Income + Non-cash items + Working Capital changes.
      unit: EUR
      direction: maximize
      diagnoses: fin.cash.balance

    - id: fin.overdue_ar.pct
      name: Overdue Accounts Receivable %
      definition: "Overdue AR (past due date) / Total AR × 100."
      unit: "%"
      direction: minimize
      diagnoses: wc.dso.days
      causal_mechanism: High overdue AR directly increases DSO. Customer-level overdue analysis enables targeted collection.

  guardrails:
    - description: DPO extension within contract terms only
      condition: >
        DPO optimisation actions must operate within supplier payment terms.
        Exceeding contractual DPO damages supplier relationships, may incur penalties,
        and disqualifies early payment discounts.
      affected_kpis: [wc.dpo.days]

    - description: Minimum liquidity buffer
      condition: >
        CCC and working capital actions must not reduce cash buffer below the minimum
        liquidity threshold (typically 30 days of operating expenses). Cash optimisation
        stops at the liquidity floor.
      affected_kpis: [fin.cash.balance, wc.ccc.days]

  wrong_interpretations:
    - description: Low DSO as unambiguously good
      why_wrong: >
        DSO can be artificially reduced by aggressive early payment discounts that
        destroy more value than the working capital improvement creates. DSO must
        always be evaluated alongside early payment discount costs.
      source_id: SRC-004

    - description: Increasing DPO without supplier impact analysis
      why_wrong: >
        Mechanically increasing DPO to improve CCC can damage strategic supplier
        relationships, trigger supply disruptions, and eliminate early payment discounts.
        DPO optimisation requires supplier segmentation (critical vs. commodity).
      source_id: SRC-005

    - description: Point-in-time cash balance vs. cash flow trend
      why_wrong: >
        A strong cash balance at period end can mask deteriorating OCF and impending
        liquidity pressure. Cash balance must be tracked alongside cash flow trend
        and liquidity forecast.
      source_id: SRC-003

    - description: CCC as the only treasury metric
      why_wrong: >
        CCC does not capture off-balance-sheet liquidity risks (contingent liabilities,
        credit facility headroom), interest rate risk, or FX exposure. CCC is an
        operational efficiency metric, not a comprehensive treasury health indicator.
      source_id: SRC-002

