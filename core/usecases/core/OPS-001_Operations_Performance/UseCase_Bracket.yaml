schema_version: '2.0'
id: OPS-001
title: Operations Performance
domain: Operations
governance:
  owner_role: operations_controlling_oee_lead
  steward_role: ops_bi_lead_plant_analytics
orchestration:
  strategic_kpi_id: KPI-OPS-011
  influencing_kpi_ids:
  - KPI-OPS-016
  - KPI-OPS-002
  - KPI-OPS-003
  - KPI-OPS-009
  supporting_kpi_ids:
  - KPI-OPS-017
  - KPI-OPS-018
  - KPI-OPS-013
  - KPI-OPS-005
  - KPI-OPS-006
  - KPI-OPS-007
  - KPI-QUA-001
  - KPI-SVC-001
  - KPI-OPS-012
  - KPI-OPS-008
  - KPI-QUA-004
  - KPI-QUA-003
  - KPI-QUA-005
  - KPI-OPS-010
  - KPI-QUA-002
  - KPI-OPS-019
  - KPI-OPS-020
  action_code_ids:
  - O-O1.1
  - O-O1.2
  - O-O1.3
  - O-O1.4
primary_kpi_ids:
  - KPI-OPS-011
  - KPI-OPS-016

value_driver_model:
  formula: KPI-OPS-011 = KPI-OPS-016 × KPI-OPS-002 × KPI-OPS-003
  impact_direction: maximize
  primary_driver: KPI-OPS-016
  impact_logic: Improving KPI-OPS-016 is the primary lever for maximizing KPI-OPS-011.
ux_layout_rules:
  report_structure: 2-Page-Lead
  report_canvas: { width: 1920, height: 1080 }
  # R2.4 (Cut C2): migrated to the intent layer, COM-002 as reference pattern.
  intent_rules_version: 2
  title_statements_verified: false
  page_1_summary:
    title: Operations Summary & Insights
    page_type: T3_Operational_Monitoring
    template_variant: T3_ProcessControl
    template_id: pulse
    decision_question: "Is OEE on target and which losses are biggest this week?"
    big_idea: "Recover OEE by isolating asset-level availability losses and routing the right maintenance response."
    component_3s:
      kpi_id: KPI-OPS-011
      visual_type: kpi_card_with_delta
      sparkline_field: OeePct_Daily
      comparison: vs_target
      status_logic: higher_is_better
      benchmark: true
    component_30s:
    - slot_id: Main_1
      # OEE trend vs target — strategic KPI must be the primary trend (SQ-V04, mapping_gap fix)
      kpi_id: KPI-OPS-011
      visual_type: line_chart
      comparison: vs_target
      question: "Is OEE on target, and is the gap closing or widening?"
      message: "OEE trend against target shows whether operational performance is stable, recovering, or deteriorating."
      so_what: "A persistent target gap triggers asset-level diagnosis before production output is put at risk."
      category_field: dim_date.Date
      action_code_id: O-O1.1
      unit: ratio
    - slot_id: Main_2
      # Availability ranking — the dominant OEE driver, compared at asset grain.
      kpi_id: KPI-OPS-016
      visual_type: horizontal_bar_chart
      comparison: vs_target
      question: "Which assets have the weakest availability?"
      message: "Asset availability ranking concentrates attention on the lines with the greatest recoverable OEE loss."
      so_what: "The worst availability assets are the first candidates for maintenance and reliability action."
      category_field: dim_asset.AssetName
      action_code_id: O-O1.1
      unit: rate
    - slot_id: Main_3
      # Operational exception queue — threshold breaches at asset grain.
      kpi_id: KPI-OPS-018
      visual_type: exception_table
      question: "Which assets require immediate intervention for unplanned downtime?"
      message: "The exception queue ranks assets with the most critical unplanned-downtime exposure."
      so_what: "A worst-first queue converts the OEE signal into an owned maintenance workload."
      category_field: dim_asset.AssetName
      action_code_id: O-O1.1
      unit: rate
  page_2_execution:
    title: Operations Execution
    page_type: T4_Prescriptive_Recommendation
    template_variant: T4_ActionDecision
    template_id: action_matrix
    decision_question: "Which assets and shifts explain the OEE gap this week?"
    big_idea: "Line 3 and Line 7 account for 65% of unplanned downtime — maintenance backlog on these assets is the root cause."
    component_300s:
      evidence_grain: line_day
      slicer_field: dim_asset.AssetName
      # R2.4: curated 21→8. plant/line/shift/loss_type/cause_code/maintenance_type
      # have no backing dimension table in Operations.SemanticModel (only
      # dim_asset exists -- "Asset or production line dimension" per its own
      # TMDL description, so asset is the real row-identity here). Kept the
      # KPIs most directly answering "which losses are biggest": unplanned
      # downtime as the variance signal (matches decision_question verbatim),
      # the three OEE components (Main_3), and scrap as the quality-loss proxy.
      evidence_columns:
      - dim_asset.AssetName
      - dim_product.Category
      - KPI-OPS-011
      - KPI-OPS-018
      - KPI-OPS-016
      - KPI-OPS-002
      - KPI-OPS-003
      - KPI-QUA-002
      action_panel: true
      payload_mode: summary
      sort_by:
        measure: KPI-OPS-018
        direction: descending
      top_n: 20
      highlight_rule:
        column: KPI-OPS-018
        type: data_bar
prioritization:
  business_value: high
  implementation_effort: medium
  confidence: 0.85
  reach: division
  priority_score: 28
data_protection:
  # DSGVO Art. 25 Privacy by Design and by Default
  # Authority: core/templates/page_templates/governance/Data_Protection_Governance.md
  personal_data: false
  legal_basis: not_applicable
  data_minimisation: >
    Detail Matrix limited to plant, shift, and production-order grain.
    Operational metrics (OEE, throughput) at plant/shift level — no individual
    employee attribution. Row-level security applied at SemanticModel level.
  access_restriction: >
    operations_controlling_lead and ops_bi_lead roles; row-level security
    enforced by Operations.SemanticModel (plant filter per org role).
  dpia_required: false
  ai_generated_output: true
  ai_grounding_measure: >
    Active Actions Text (OPS) — DAX measure that reads current filter context
    and concatenates only triggered action texts. See Storytelling_Principles.md
    §13.
readiness:
  data_availability: available
  org_capability: ready
  stakeholder_alignment: aligned
  overall_readiness: green
overrides:
  data_contract_ref: core/data_contracts/domains/operations.yaml
documentation:
  business_factsheet: ./Business_Factsheet.md
  evidence_pack: ./Domain_Evidence_Pack.yaml
