schema_version: '2.0'
id: OPS-001
name: Operations Performance
domain: Operations
governance:
  owner_role: Operations Controlling / OEE Lead
  steward_role: Ops BI Lead / Plant Analytics
  status: active
  last_review: '2026-02-12'
ontology_bracket:
  strategic_kpi_id: ops.oee.pct
  influencing_kpi_ids:
  - ops.availability.pct
  - ops.performance.pct
  - ops.quality.pct
  - ops.throughput.units
  - ops.downtime.pct
  - ops.planned_output.units
  action_code_ids:
  - O-O1.1
  - O-O1.2
  - O-O1.3
  - O-O1.4
value_driver_model:
  description: ops.oee.pct is driven by influencing KPIs and operational levers.
  formula: ops.oee.pct = f(ops.availability.pct, ops.performance.pct, ops.quality.pct,
    ops.throughput.units, ops.downtime.pct, ops.planned_output.units)
ux_layout_rules:
  report_structure: 2-Page-Lead
  page_1_summary_insights:
    title: Operations Summary & Insights
    3s_component: 'North Star: ops.oee.pct'
    30s_components: []
  page_2_execution:
    title: Operations Execution
    300s_components:
    - 'Evidence_Table: (define evidence table requirements)'
    - 'Action_Panel: Integrated Side-Panel for Subscribed Action Codes'
    - 'Payload_Injection: Show Level (L1-L3) and Steps from Action Code YAML'
documentation:
  business_factsheet: ./Business_Factsheet.md
  technical_factsheet: ./Technical_Factsheet.md
