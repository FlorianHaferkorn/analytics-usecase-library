schema_version: '2.0'
id: OPS-001
title: Operations Performance
domain: Operations
governance:
  owner_role: operations_controlling_oee_lead
  steward_role: ops_bi_lead_plant_analytics
orchestration:
  strategic_kpi_id: ops.oee.pct
  influencing_kpi_ids:
  - ops.availability.pct
  - ops.performance.pct
  - ops.quality.pct
  - ops.throughput.units
  supporting_kpi_ids:
  - ops.downtime.pct
  - ops.downtime.unplanned.pct
  - ops.planned_output.units
  - ops.mtbf.hours
  - ops.mttr.hours
  - ops.pm_compliance.pct
  - quality.fpy.pct
  - crm.complaint.count
  - ops.failure.count
  - ops.spare_parts.stockout.pct
  - quality.complaint.pct
  - quality.copq.amount
  - quality.defect_density
  - quality.rework.pct
  - quality.scrap.pct
  - ops.speed_loss.pct
  - ops.changeover.minutes
  action_code_ids:
  - O-O1.1
  - O-O1.2
  - O-O1.3
  - O-O1.4
primary_kpi_ids:
  - ops.oee.pct
  - ops.availability.pct

value_driver_model:
  formula: ops.oee.pct = ops.availability.pct × ops.performance.pct × ops.quality.pct
  impact_direction: maximize
  primary_driver: ops.availability.pct
  impact_logic: Improving ops.availability.pct is the primary lever for maximizing ops.oee.pct.
ux_layout_rules:
  report_structure: 2-Page-Lead
  report_canvas: { width: 1920, height: 1080 }
  # R2.4 (Cut C2): migrated to the intent layer, COM-002 as reference pattern.
  intent_rules_version: 2
  page_1_summary:
    title: Operations Summary & Insights
    page_type: T3_Operational_Monitoring
    template_variant: T3_ExceptionQueue
    template_id: pulse
    decision_question: "Is OEE on target and which losses are biggest this week?"
    big_idea: "OEE is below target — unplanned availability losses account for 70% of the gap and require immediate maintenance action."
    component_3s:
      kpi_id: ops.oee.pct
      visual_type: kpi_card
      sparkline_field: OeePct_Daily
      comparison: vs_target
      status_logic: higher_is_better
      benchmark: true
    component_30s:
    - slot_id: Main_1
      # OEE trend vs target — strategic KPI must be the primary trend (SQ-V04, mapping_gap fix)
      kpi_id: ops.oee.pct
      visual_type: line_chart
      comparison: vs_target
      question: "Is OEE on target, and is the gap closing or widening?"
      message: OEE is running below target and the gap is widening week over week
      so_what: "A widening OEE gap this close to target compounds into missed output if maintenance action doesn't land now."
      unit: ratio
    - slot_id: Main_2
      # Availability trend — dominant driver (Muchiri & Pintelon 2008 confirms primary driver)
      kpi_id: ops.availability.pct
      visual_type: line_chart
      comparison: vs_target
      question: "Which OEE component is the biggest loss — availability, performance, or quality?"
      message: Availability is the component pulling OEE below target, not performance or quality
      so_what: "Because availability dominates the OEE gap, maintenance fixes move the needle faster than performance or quality tweaks."
      unit: rate
    - slot_id: Main_3
      # OEE component comparison — all three drivers at same % unit (SQ-V02 fix: no unit mixing)
      kpi_ids:
      - ops.availability.pct
      - ops.performance.pct
      - ops.quality.pct
      visual_type: bar_chart_horizontal
      question: "How does the OEE gap break down across its three components?"
      message: Availability, performance, and quality — the three OEE components.
      so_what: "Prioritising availability fixes addresses the largest single component of the OEE shortfall."
      unit: rate
  page_2_execution:
    title: Operations Execution
    page_type: T3_Operational_Monitoring
    template_variant: T3_ExceptionQueue
    template_id: action_matrix
    decision_question: "Which assets and shifts explain the OEE gap this week?"
    big_idea: "Line 3 and Line 7 account for 65% of unplanned downtime — maintenance backlog on these assets is the root cause."
    component_300s:
      evidence_grain: line_day
      # R2.4: curated 21→8. plant/line/shift/loss_type/cause_code/maintenance_type
      # have no backing dimension table in Operations.SemanticModel (only
      # dim_asset exists -- "Asset or production line dimension" per its own
      # TMDL description, so asset is the real row-identity here). Kept the
      # KPIs most directly answering "which losses are biggest": unplanned
      # downtime as the variance signal (matches decision_question verbatim),
      # the three OEE components (Main_3), and scrap as the quality-loss proxy.
      evidence_columns:
      - asset
      - product_category
      - ops.oee.pct
      - ops.downtime.unplanned.pct
      - ops.availability.pct
      - ops.performance.pct
      - ops.quality.pct
      - quality.scrap.pct
      action_panel: true
      payload_mode: full
      sort_by:
        measure: ops.downtime.unplanned.pct
        direction: descending
      top_n: 20
      highlight_rule:
        column: ops.downtime.unplanned.pct
        type: data_bar
prioritization:
  business_value: high
  implementation_effort: medium
  confidence: 0.85
  reach: division
  priority_score: 28
data_protection:
  # DSGVO Art. 25 Privacy by Design and by Default
  # Authority: core/templates/page_templates/governance/Data_Protection_Governance.md
  personal_data: false
  legal_basis: not_applicable
  data_minimisation: >
    Detail Matrix limited to plant, shift, and production-order grain.
    Operational metrics (OEE, throughput) at plant/shift level — no individual
    employee attribution. Row-level security applied at SemanticModel level.
  access_restriction: >
    operations_controlling_lead and ops_bi_lead roles; row-level security
    enforced by Operations.SemanticModel (plant filter per org role).
  dpia_required: false
  ai_generated_output: true
  ai_grounding_measure: >
    Active Actions Text (OPS) — DAX measure that reads current filter context
    and concatenates only triggered action texts. See Storytelling_Principles.md
    §13.
readiness:
  data_availability: available
  org_capability: ready
  stakeholder_alignment: aligned
  overall_readiness: green
overrides:
  data_contract_ref: core/data_contracts/domains/operations.yaml
documentation:
  business_factsheet: ./Business_Factsheet.md
  evidence_pack: ./Domain_Evidence_Pack.yaml
