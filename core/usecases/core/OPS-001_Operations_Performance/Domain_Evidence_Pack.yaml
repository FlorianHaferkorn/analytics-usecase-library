# ──────────────────────────────────────────
# 1. PROCESS SCOPE
# ──────────────────────────────────────────
process_scope:
  description: >
    Overall Equipment Effectiveness (OEE) measurement and improvement for discrete and
    process manufacturing. Covers the three OEE loss dimensions (availability, performance,
    quality), Six Big Losses classification, TPM-based action logic, and asset reliability
    diagnostics at shopfloor level.
  in_scope:
    - OEE calculation per ISO 22400-2 (Availability × Performance × Quality)
    - Six Big Losses decomposition (Nakajima / JIPM classification)
    - Equipment availability and planned/unplanned downtime analysis
    - Performance loss (speed loss, minor stops, idling)
    - Quality loss (scrap, rework, startup waste)
    - Asset reliability metrics (MTBF, MTTR, PM compliance)
    - Shift, line, and plant-level aggregations
    - Changeover and SMED improvement
    - Corrective and preventive maintenance action logic
  out_of_scope:
    - Predictive maintenance and condition monitoring (covered by OPS-013)
    - Logistics and warehouse performance (OPS-011)
    - Detailed cost modeling and CAPEX decisions (OPS-008)
    - Energy consumption and sustainability OEE variants (ISO 14955)
  industry_segment: >
    Discrete and process manufacturing — most directly applicable to automotive, FMCG,
    chemicals, food & beverage, pharmaceuticals. OEE principles apply to any asset-intensive
    production environment.
  applicable_frameworks:
    - name: ISO 22400-2 Key Performance Indicators for Manufacturing Operations Management
      id: ISO-22400-2
    - name: Total Productive Maintenance (TPM) — JIPM Nakajima Classification
      id: JIPM-TPM
    - name: APQC Process Classification Framework — Category 4.0 Manage Production/Manufacturing
      id: APQC-PCF-4
    - name: SCOR Model — Source/Make/Deliver — RL.2.1 Return Defective Product Rate
      id: SCOR-12

# ──────────────────────────────────────────
# 2. CANONICAL DOMAIN MODEL (DRIVER TREE)
# ──────────────────────────────────────────
canonical_domain_model:
  outcome_kpis:
    - id: ops.oee.pct
      name: Overall Equipment Effectiveness (OEE)
      definition: >
        OEE = Availability Rate × Performance Rate × Quality Rate. Measures how effectively
        a manufacturing operation uses its planned production time to produce good units.
        ISO 22400-2 defines OEE as the ratio of Fully Productive Time to Planned Production Time.
      unit: "%"
      direction: maximize
      benchmark_target: "85% world class (Industry Week / SMRP survey); 60% typical manufacturer"
      benchmark_source_id: SRC-009
      iso_reference: ISO 22400-2:2014 clause 5.1.3

  driver_kpis:
    - id: ops.availability.pct
      name: Availability Rate
      definition: >
        Availability = Run Time / Planned Production Time. Measures time lost to unplanned
        downtime, breakdowns, and setup/adjustment events. ISO 22400-2 Section 5.1.3.1.
      unit: "%"
      direction: maximize
      drives: ops.oee.pct
      causal_mechanism: >
        Each percentage point of availability loss directly reduces OEE by 1 percentage point
        before performance and quality multipliers. Unplanned downtime is the dominant OEE
        destroyer in most discrete manufacturing environments (Muchiri & Pintelon 2008).
      benchmark_target: "90% world class (SMRP BMP)"
      benchmark_source_id: SRC-010

    - id: ops.performance.pct
      name: Performance Rate
      definition: >
        Performance = (Ideal Cycle Time × Total Count) / Run Time. Captures speed losses
        (running below ideal rate) and minor stops/idling events. ISO 22400-2 Section 5.1.3.2.
      unit: "%"
      direction: maximize
      drives: ops.oee.pct
      causal_mechanism: >
        Performance losses are less visible than downtime but highly cumulative. A line running
        at 90% of ideal speed loses 10% of theoretical output per shift. Speed reductions often
        go unrecorded as downtime events (Hedman et al. 2016 — misclassification risk).
      benchmark_target: "95% world class (ISO 22400 reference)"
      benchmark_source_id: SRC-001

    - id: ops.quality.pct
      name: Quality Rate
      definition: >
        Quality Rate = Good Count / Total Count. Measures output lost to defects,
        rework, and startup scrap. Also expressed as First Pass Yield (FPY) in some frameworks.
        ISO 22400-2 Section 5.1.3.3.
      unit: "%"
      direction: maximize
      drives: ops.oee.pct
      causal_mechanism: >
        Quality losses directly reduce the numerator of OEE without reducing run time,
        making them appear hidden unless tracked via separate quality metrics.
        COPQ impact compounds when rework time is also counted as downtime.
      benchmark_target: "99.9% world class (ISO 22400 reference)"
      benchmark_source_id: SRC-001

  diagnostic_kpis:
    - id: ops.mtbf.hours
      name: Mean Time Between Failures
      definition: >
        MTBF = Total Run Time / Number of Failures. Measures asset reliability.
        A declining MTBF indicates deteriorating equipment health or inadequate PM.
      unit: hours
      direction: maximize
      diagnoses: ops.availability.pct
      causal_mechanism: >
        MTBF < threshold (asset-specific) combined with high unplanned downtime triggers
        O-A2.1 (Asset Reliability Recovery). SMRP BMP defines MTBF targets by asset criticality.

    - id: ops.mttr.hours
      name: Mean Time to Repair
      definition: >
        MTTR = Total Downtime / Number of Failures. Measures maintenance response and
        repair speed. Combines detection time, active repair time, and restoration time.
      unit: hours
      direction: minimize
      diagnoses: ops.availability.pct
      causal_mechanism: >
        Even with stable MTBF, an increase in MTTR will reduce availability.
        High MTTR indicates spare parts stockout, skill gap, or documentation deficit.

    - id: ops.pm_compliance.pct
      name: Preventive Maintenance Compliance
      definition: >
        PM Compliance = Completed PM Tasks / Scheduled PM Tasks. Measures adherence to
        the preventive maintenance schedule. Low PM compliance is a leading indicator of
        availability decline (SMRP BMP).
      unit: "%"
      direction: maximize
      diagnoses: ops.availability.pct
      causal_mechanism: >
        PM compliance below 85% is a leading indicator of MTBF decline within 2–4 months
        on critical assets (SMRP 2023 BMP data).

    - id: ops.changeover.minutes
      name: Changeover Time
      definition: >
        Average time from last good piece of the previous production run to first good piece
        of the next run. Includes mechanical setup, parameter adjustment, and trial run waste.
        Directly drives Six Big Losses Category 2 (Setup & Adjustment).
      unit: minutes
      direction: minimize
      diagnoses: ops.availability.pct
      causal_mechanism: >
        Changeover time > SMED target is the primary trigger for O-O1.3 (Changeover Reduction).
        SMED methodology targets changeover < 10 minutes for high-mix lines.

    - id: ops.speed_loss.pct
      name: Speed Loss Rate
      definition: >
        Speed Loss = 1 - Performance Rate when minor stops are excluded.
        Isolates chronic speed reduction from intermittent minor stops.
        Corresponds to Six Big Losses Category 4 (Reduced Speed).
      unit: "%"
      direction: minimize
      diagnoses: ops.performance.pct
      causal_mechanism: >
        Speed losses often disguised as "operator safety margin." Hedman et al. (2016)
        found 63% of surveyed plants underestimate speed losses by misclassifying them
        as "acceptable" versus the ISO ideal cycle time.

    - id: quality.scrap.pct
      name: Scrap Rate
      definition: >
        Scrap Rate = Scrapped Units / Total Units. Measures unrecoverable quality loss.
        Contributes to Quality Rate and directly impacts COGS and COPQ.
      unit: "%"
      direction: minimize
      diagnoses: ops.quality.pct
      causal_mechanism: >
        Scrap is the dominant quality loss for startup and end-of-run waste (Six Big Losses
        Category 5 Process Defects and Category 6 Startup/Reduced Yield).

    - id: quality.fpy.pct
      name: First Pass Yield
      definition: >
        FPY = Units passing all quality checks without rework / Total units started.
        Differs from Quality Rate (which includes reworked units counted as good).
      unit: "%"
      direction: maximize
      diagnoses: ops.quality.pct
      causal_mechanism: >
        FPY < Quality Rate indicates hidden rework burden. Both metrics required to
        distinguish between "paper good" units and truly first-pass quality.

  guardrails:
    - description: Planned shutdown and scheduled maintenance
      condition: >
        Downtime occurring during planned shutdown windows, scheduled maintenance, or
        approved overhaul periods. These events are excluded from planned production time
        in ISO 22400-2 and must NOT be counted as availability losses.
      affected_kpis:
        - ops.availability.pct
        - ops.oee.pct

    - description: Quality qualification runs
      condition: >
        Speed reduction to below ideal cycle time during officially approved quality
        qualification runs (e.g., new product introduction, post-maintenance validation).
        These must NOT be classified as performance losses.
      affected_kpis:
        - ops.performance.pct
        - ops.speed_loss.pct

    - description: Trial and pilot production
      condition: >
        New product or process trial runs where defects are expected and budgeted.
        Scrap and FPY from trial runs must NOT inflate the operational quality loss KPIs.
      affected_kpis:
        - ops.quality.pct
        - quality.scrap.pct

    - description: Force majeure events
      condition: >
        Downtime caused by external factors outside plant control (power outage, natural
        disaster, supply disruption). Exclude from OEE calculation per ISO 22400-2 Annex B.
      affected_kpis:
        - ops.oee.pct
        - ops.availability.pct

  wrong_interpretations:
    - description: "OEE Theater — High OEE without real production value"
      why_wrong: >
        OEE can appear high if planned production time is set too conservatively (inflated
        by excess idle time). A plant reporting 92% OEE on only 4 hours/day planned time
        is performing worse than a plant at 75% OEE on 16 hours/day planned time.
        Always evaluate OEE alongside absolute throughput. (Jonsson & Lesshammar 1999).
      source_id: SRC-015

    - description: "Using OEE as a comparison metric across dissimilar assets"
      why_wrong: >
        OEE is a relative metric calibrated to the ideal cycle time of a specific asset.
        Comparing OEE across assets with different ideal cycle times, products, or
        complexity tiers produces misleading rankings. Use throughput-normalised metrics
        for cross-asset comparison. (Hedman et al. 2016, ISO 22400-2 clause 4.2).
      source_id: SRC-003

    - description: "Ignoring planned downtime in availability calculation"
      why_wrong: >
        Some implementations erroneously include planned maintenance time in availability
        calculations, making performance appear worse than it is. ISO 22400-2 defines
        planned production time as Total Time minus planned downtime.
      source_id: SRC-001

    - description: "Treating all minor stops as downtime"
      why_wrong: >
        Minor stops (<10 minutes) that do not require maintenance intervention are
        performance losses (Six Big Losses Category 3), not availability losses.
        Misclassifying them inflates downtime and understates performance loss.
        This makes the wrong action code fire (O-O1.2 instead of O-O1.1).
      source_id: SRC-002

    - description: "Single-metric OEE improvement masking other losses"
      why_wrong: >
        Improving Availability by reducing downtime events can mask quality losses
        (running faster but producing more scrap) or performance losses (running
        consistently but at lower speed). Always monitor all three OEE components together.
      source_id: SRC-004

# ──────────────────────────────────────────
# 3. REQUIRED DATA MODEL
# ──────────────────────────────────────────
required_data_model:
  required_facts:
    - table: fact_ops
      description: >
        Production event backbone. Must contain: planned_time, run_time, downtime_minutes,
        loss_type (Six Big Losses category), cause_code, output_units, good_units,
        scrap_units, rework_units, ideal_cycle_time_seconds, asset_id, shift_id,
        maintenance_type (planned/unplanned/emergency).
    - table: fact_maintenance
      description: >
        Maintenance work order log. Must contain: work_order_id, asset_id, failure_start,
        failure_end, repair_start, repair_end, maintenance_type, PM_due_date, PM_completed_date.
        Required for MTBF and MTTR calculation and PM compliance tracking.

  required_dimensions:
    - name: dim_date
      grain_relevance: "Time axis for trend analysis. Must include CalendarWeek and CalendarMonth."
    - name: dim_org
      grain_relevance: >
        Plant → Line → Asset hierarchy. Asset level required for MTBF/MTTR diagnostics.
        Shift level required for performance and quality loss patterns.
    - name: dim_loss_type
      grain_relevance: >
        Six Big Losses classification: (1) Breakdowns, (2) Setup/Adjustment, (3) Minor Stops,
        (4) Reduced Speed, (5) Process Defects, (6) Startup/Reduced Yield.
        This dimension is REQUIRED for correct Six Big Losses Pareto analysis.
        Currently NOT present in the data contract — classified as model_gap.
    - name: dim_cause_code
      grain_relevance: >
        Maintenance failure cause codes for Pareto of downtime reasons.
        Required for action code trigger specificity (O-O1.2 targets specific cause codes).
        Currently NOT listed as required in data contract — classified as model_gap.
    - name: dim_maintenance_type
      grain_relevance: >
        Planned / Unplanned / Emergency maintenance. Required to separate planned downtime
        (excluded from OEE) from unplanned downtime (included in OEE availability loss).
    - name: dim_product
      grain_relevance: >
        Product dimension for speed loss analysis per product (different ideal cycle times).
        Optional but recommended for mixed-product lines.

  preferred_grain: line-shift-day
  minimum_grain: line-day
  minimum_history_months: 12
  grain_waiver_condition: >
    line-day grain is acceptable only when the plant has a single-shift operation,
    or when shift-level data is structurally unavailable. Requires explicit waiver in bracket.

  required_measures:
    - name: OEE %
      formula_seed: "Availability_Rate × Performance_Rate × Quality_Rate"
      source_id: SRC-001
    - name: Availability Rate %
      formula_seed: "Run_Time / Planned_Production_Time"
      source_id: SRC-001
    - name: Performance Rate %
      formula_seed: "(Ideal_Cycle_Time × Total_Units) / Run_Time"
      source_id: SRC-001
    - name: Quality Rate %
      formula_seed: "Good_Units / Total_Units"
      source_id: SRC-001
    - name: MTBF (hours)
      formula_seed: "Total_Run_Time / Number_of_Failures"
      source_id: SRC-010
    - name: MTTR (hours)
      formula_seed: "Total_Repair_Time / Number_of_Repairs"
      source_id: SRC-010
    - name: PM Compliance %
      formula_seed: "Completed_PM_Tasks / Scheduled_PM_Tasks"
      source_id: SRC-010
    - name: Changeover Time (minutes)
      formula_seed: "AVG(Time_from_Last_Good_Piece_to_First_Good_Piece_Next_Run)"
      source_id: SRC-007
    - name: First Pass Yield %
      formula_seed: "Units_Passing_All_QC_First_Time / Total_Units_Started"
      source_id: SRC-006
    - name: Scrap Rate %
      formula_seed: "Scrap_Units / Total_Units"
      source_id: SRC-001
    - name: Downtime by Loss Type (minutes)
      formula_seed: "SUM(Downtime_Minutes) filtered by dim_loss_type"
      source_id: SRC-002

# ──────────────────────────────────────────
# 4. ACTION LOGIC SEEDS
# ──────────────────────────────────────────
action_logic_seeds:
  - trigger_driver: ops.availability.pct
    trigger_diagnostic: ops.mtbf.hours
    trigger_condition: "Availability < 85% for 2 consecutive months AND MTBF declining trend"
    guardrail: "Exclude periods with planned shutdown or force majeure"
    action_description: >
      Asset reliability recovery: identify chronic failure modes, execute corrective
      maintenance, standardise PM schedule for the specific asset family.
    expected_outcome_kpi: ops.oee.pct
    action_code_candidate: O-A2.1

  - trigger_driver: ops.availability.pct
    trigger_diagnostic: ops.pm_compliance.pct
    trigger_condition: "Availability < 90% AND PM Compliance < 85% for 3 months"
    guardrail: "Exclude lines under approved overhaul"
    action_description: >
      Planned maintenance recovery: restore PM compliance, review PM task list for
      adequacy, address backlog.
    expected_outcome_kpi: ops.availability.pct
    action_code_candidate: O-O1.2

  - trigger_driver: ops.availability.pct
    trigger_diagnostic: ops.changeover.minutes
    trigger_condition: "Changeover time > 2× SMED target for this line for 3 consecutive weeks"
    guardrail: "Exclude product introduction qualification runs"
    action_description: >
      Changeover reduction via SMED analysis: separate internal and external setup,
      standardise tooling, train operators.
    expected_outcome_kpi: ops.availability.pct
    action_code_candidate: O-O1.3

  - trigger_driver: ops.performance.pct
    trigger_diagnostic: ops.speed_loss.pct
    trigger_condition: "Performance < 90% without corresponding downtime events (speed loss dominant)"
    guardrail: "Exclude quality qualification runs"
    action_description: >
      Speed loss investigation: identify authorised vs unauthorised speed reductions,
      standardise operating speed for each product, update standard cycle times.
    expected_outcome_kpi: ops.performance.pct
    action_code_candidate: O-O1.1

  - trigger_driver: ops.quality.pct
    trigger_diagnostic: quality.fpy.pct
    trigger_condition: "FPY drops > 3pp in 5 consecutive shifts OR Quality Rate < 96%"
    guardrail: "Exclude trial runs and approved product qualification batches"
    action_description: >
      Quality root cause analysis: defect Pareto by loss type, isolate raw material
      batch vs process parameter drift vs equipment degradation.
    expected_outcome_kpi: ops.quality.pct
    action_code_candidate: O-Q3.1

