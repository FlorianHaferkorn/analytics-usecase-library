# ──────────────────────────────────────────
# 6. MAPPING READINESS
# ──────────────────────────────────────────
mapping_readiness:
  kpi_catalog_coverage: complete
  factsheet_coverage: partial
  bracket_coverage: partial
  action_code_coverage: partial
  semantic_model_coverage: partial

  gap_summary:
    content_gaps:
      - gap_type: content_gap
        severity: high
        affected_artifact: core/usecases/core/OPS-001_Operations_Performance/UseCase_Bracket.yaml
        field: orchestration.supporting_kpi_ids
        description: >
          MTBF (ops.mtbf.hours), MTTR (ops.mttr.hours), PM Compliance (ops.pm_compliance.pct),
          and Scrap Rate (quality.scrap.pct) exist in the KPI catalog but are NOT listed in
          supporting_kpi_ids. These are required diagnostic KPIs per the domain model.
        evidence_reference: SRC-008 SRC-010 SRC-001
        remediation: "Add ops.mtbf.hours, ops.mttr.hours, ops.pm_compliance.pct, quality.scrap.pct to supporting_kpi_ids. Core updated; close gap when DEP status is approved."
        status: in_progress

      - gap_type: content_gap
        severity: high
        affected_artifact: core/usecases/core/OPS-001_Operations_Performance/UseCase_Bracket.yaml
        field: ux_layout_rules.page_2_execution.component_300s.evidence_columns
        description: >
          Evidence columns missing: cause_code, loss_type (Six Big Losses), maintenance_type,
          asset_id. These are required dimensions for root cause drill-down per the domain model.
        evidence_reference: SRC-002 SRC-008
        remediation: "Add cause_code, loss_type, maintenance_type, asset to evidence_columns. Core updated; close gap when DEP status is approved."
        status: in_progress

      - gap_type: content_gap
        severity: medium
        affected_artifact: core/usecases/core/OPS-001_Operations_Performance/Business_Factsheet.md
        field: "Section 2 Core Business Questions"
        description: >
          Core business questions do not explicitly mention Six Big Losses analysis
          ("What are the top Six Big Loss categories by line?") or MTBF/MTTR
          ("What is the reliability trend for critical assets?").
        evidence_reference: SRC-002 SRC-010
        remediation: "Add two questions: Six Big Losses Pareto and asset reliability trend. Core updated; close gap when DEP status is approved."
        status: in_progress

      - gap_type: content_gap
        severity: medium
        affected_artifact: core/usecases/core/OPS-001_Operations_Performance/Business_Factsheet.md
        field: "Section 8 Success Criteria"
        description: >
          Benchmark targets not stated: OEE 85% world class, Availability 90%,
          Performance 95%, Quality 99.9% (ISO 22400 / SMRP reference).
        evidence_reference: SRC-009 SRC-010
        remediation: "Add benchmark targets to Section 8. Core updated; close gap when DEP status is approved."
        status: in_progress

    mapping_gaps:
      - gap_type: mapping_gap
        severity: high
        affected_artifact: core/usecases/core/OPS-001_Operations_Performance/UseCase_Bracket.yaml
        field: ux_layout_rules.page_1_summary.component_30s (Main_1)
        description: >
          Main_1 shows ops.availability.pct (a driver KPI) as the primary trend visual.
          Domain evidence requires the strategic KPI (ops.oee.pct) as Main_1 trend with
          the target overlay. Availability trend should be Main_2, or available in
          drill-down. This answers the core question "Is OEE on target?" before "Why not?"
        evidence_reference: SRC-004 SRC-012
        remediation: "Change Main_1 kpi_id to ops.oee.pct with comparison: vs_target; move Availability to Main_2. Core updated; close gap when DEP status is approved."
        status: in_progress

      - gap_type: mapping_gap
        severity: critical
        affected_artifact: core/usecases/core/OPS-001_Operations_Performance/UseCase_Bracket.yaml
        field: ux_layout_rules.page_1_summary.component_30s (Main_3)
        description: >
          Main_3 combines ops.performance.pct (%), ops.quality.pct (%), and
          ops.throughput.units (count) on the same visual. Mixing percentage rates
          and absolute unit counts on the same axis creates a misleading visual that
          cannot be interpreted without additional context. Violates SQ-V02.
        evidence_reference: SRC-003
        remediation: >
          Split Main_3: show OEE component breakdown (Availability/Performance/Quality %)
          as a grouped bar chart for the current period vs target for each driver.
          Remove ops.throughput.units from this visual.
          Core updated; close gap when DEP status is approved.
        status: in_progress

      - gap_type: mapping_gap
        severity: medium
        affected_artifact: core/usecases/core/OPS-001_Operations_Performance/UseCase_Bracket.yaml
        field: value_driver_model.formula
        description: >
          Current formula 'ops.oee.pct = f(ops.availability.pct, ops.performance.pct, ops.quality.pct)'
          is correct but does not express the multiplicative nature.
          ISO 22400-2 defines OEE as a product (×), not a general function f().
        evidence_reference: SRC-001
        remediation: "Update formula to: ops.oee.pct = ops.availability.pct × ops.performance.pct × ops.quality.pct. Core updated; close gap when DEP status is approved."
        status: in_progress

    schema_gaps: []

    generator_gaps: []

    model_gaps:
      - gap_type: model_gap
        severity: high
        affected_artifact: core/data_contracts/domains/operations.yaml
        field: dim_loss_type
        description: >
          No dim_loss_type dimension exists in the data contract or semantic model.
          This dimension is required for Six Big Losses Pareto analysis per ISO 22400-2
          and Nakajima TPM framework. Without it, the OEE driver decomposition cannot
          distinguish between the 6 loss categories.
        evidence_reference: SRC-001 SRC-002
        remediation: >
          Add dim_loss_type to operations data contract with values matching ISO 22400-2
          Six Big Losses classification (1–6). Add to Operations.SemanticModel TMDL.
        status: open

      - gap_type: model_gap
        severity: medium
        affected_artifact: core/data_contracts/domains/operations.yaml
        field: fact_maintenance
        description: >
          fact_maintenance table required for MTBF and MTTR calculation is not present
          in the current data contract. MTBF/MTTR require individual failure event records
          with asset_id, failure_start, repair_start, repair_end timestamps.
          Currently estimated from fact_ops downtime aggregates — grain is insufficient.
        evidence_reference: SRC-010 SRC-008
        remediation: >
          Define fact_maintenance in operations data contract. Add MTBF/MTTR measures
          to Operations.SemanticModel based on this fact.
        status: open
