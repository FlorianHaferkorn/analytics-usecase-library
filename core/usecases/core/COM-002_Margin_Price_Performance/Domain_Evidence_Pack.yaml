action_logic_seeds:
  - trigger_driver: margin.gm.pct
    trigger_diagnostic: sales.pvm.price_effect.amount
    trigger_condition: "GM% below target by > 2pp AND price effect is negative for 2 consecutive months"
    guardrail: "Do not trigger if volume is already below plan by > 10%"
    action_description: Discount discipline review and price realisation improvement program.
    expected_outcome_kpi: margin.gm.pct
    action_code_candidate: C-M2.1

  - trigger_driver: margin.gm.pct
    trigger_diagnostic: sales.pvm.mix_effect.amount
    trigger_condition: "Mix effect is negative and contributing > 30% of total GM gap"
    guardrail: "Exclude seasonal product mix shifts"
    action_description: Strategic mix management — shift volume toward higher-margin products.
    expected_outcome_kpi: margin.gm.pct
    action_code_candidate: C-M2.2

required_data_model:
  required_facts:
    - table: fact_sales
      description: Sales transactions with net price, list price, COGS, discount, rebate by product, channel, customer.
  required_dimensions:
    - name: dim_product
      grain_relevance: SKU/category for mix analysis.
    - name: dim_org
      grain_relevance: Channel/region attribution.
    - name: dim_customer
      grain_relevance: Customer segment profitability.
  preferred_grain: product-channel-month
  minimum_grain: product-month
  minimum_history_months: 24
  required_measures:
    - name: Gross Margin %
      formula_seed: "(Net Sales - COGS) / Net Sales"
      source_id: SRC-001
    - name: Price Realization Rate
      formula_seed: "Net Price / List Price"
      source_id: SRC-003

