use_case_id: COM-002
use_case_title: Margin & Price Performance
domain: Commercial
authored_date: "2026-06-01"
authored_by: framework-architect-agent
reviewed_by: ""
status: draft

process_scope:
  description: >
    Gross margin protection and price realisation management. Covers GM% trending,
    price/discount analysis, COGS drivers, and mix-adjusted margin decomposition.
    Enables targeted margin recovery actions without volume sacrifice.
  in_scope:
    - Gross Margin % and absolute GM by product, channel, region
    - Price realization rate (net price vs list price)
    - COGS variance analysis (material cost, labour, overhead)
    - Mix effect on gross margin
    - Discount and rebate leakage
  out_of_scope:
    - Promotional ROI deep dives (COM-004)
    - Long-term list price strategy
    - Capital cost and EBITDA bridge (FIN-002)
  industry_segment: B2B manufacturing and distribution
  applicable_frameworks:
    - name: Price/Volume/Mix Methodology (McKinsey / Deloitte Commercial Excellence)
      id: PVM-FRAMEWORK
    - name: APQC PCF — Category 11.0 Manage Financial Resources (Gross Margin)
      id: APQC-PCF-11
    - name: Simon-Kucher Pricing Power Framework
      id: SK-PRICING

canonical_domain_model:
  outcome_kpis:
    - id: margin.gm.pct
      name: Gross Margin %
      definition: "(Net Sales - COGS) / Net Sales × 100"
      unit: "%"
      direction: maximize
      benchmark_target: "25–45% for B2B manufacturing (APQC); improvement target +0.5–1.5pp (Deloitte)"
      benchmark_source_id: SRC-006

  driver_kpis:
    - id: sales.price.realization_pct
      name: Price Realization Rate
      definition: "Net Price / List Price × 100. Measures discount discipline."
      unit: "%"
      direction: maximize
      drives: margin.gm.pct
      causal_mechanism: >
        Each 1pp decline in price realization typically reduces GM% by 0.8–1.2pp
        in B2B manufacturing (Simon-Kucher data). Price realization is the fastest lever.
      benchmark_target: "≥ 90% (Simon-Kucher B2B Pricing Study 2023)"
      benchmark_source_id: SRC-003

    - id: cost.cogs.amount
      name: COGS Amount
      definition: Direct cost of goods sold (material + direct labour + variable overhead).
      unit: EUR
      direction: minimize
      drives: margin.gm.pct
      causal_mechanism: >
        COGS increases directly erode GM%. Key drivers: raw material price increases,
        labour productivity losses, yield/scrap increases.
      benchmark_target: ""
      benchmark_source_id: ""

    - id: sales.pvm.mix_effect.amount
      name: Mix Effect on Margin
      definition: Margin variance attributable to product/channel/customer mix shifts.
      unit: EUR
      direction: maximize
      drives: margin.gm.pct
      causal_mechanism: >
        Negative mix effect signals growth in structurally lower-margin products.
        Mix management is a strategic lever for long-term GM% improvement.
      benchmark_target: ""
      benchmark_source_id: ""

  diagnostic_kpis:
    - id: sales.pvm.price_effect.amount
      name: Price Effect (PVM)
      definition: GM variance from price changes.
      unit: EUR
      direction: maximize
      diagnoses: margin.gm.pct

    - id: sales.price.net.amount
      name: Net Price (Average)
      definition: Average net selling price after discounts, rebates, and returns.
      unit: EUR
      direction: maximize
      diagnoses: sales.price.realization_pct

  guardrails:
    - description: Volume guardrail on margin recovery actions
      condition: >
        Do not trigger pure margin recovery actions (price increases) if volume is already
        below plan by > 10%. Price recovery at the cost of significant volume loss destroys
        more value than temporary margin dilution.
      affected_kpis: [margin.gm.pct, sales.net_sales.amount]

  wrong_interpretations:
    - description: Gross Margin improvement through COGS reduction alone
      why_wrong: >
        COGS reduction via quality reduction or supply shortcuts can temporarily improve
        GM% but triggers warranty claims, returns, and customer churn that ultimately
        destroy more value. COGS and quality KPIs must be monitored together.
      source_id: SRC-004

    - description: Price realisation without volume context
      why_wrong: >
        A 95% price realisation rate looks healthy, but if it was achieved by losing
        volume on high-margin products and retaining volume on low-margin products,
        the mix effect will destroy GM% regardless of list price discipline.
      source_id: SRC-003

    - description: Margin by product without channel attribution
      why_wrong: >
        The same product can have very different net margins across channels
        (direct vs distributor vs online). Reporting margin at product level only
        hides channel-specific discount patterns.
      source_id: SRC-005

