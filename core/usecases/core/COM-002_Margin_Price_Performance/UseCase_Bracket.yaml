schema_version: '2.0'
id: COM-002
title: Margin & Price Performance
domain: Commercial
governance:
  owner_role: commercial_controlling_lead
  steward_role: commercial_bi_pricing_analytics_lead
orchestration:
  strategic_kpi_id: margin.gm.pct
  # R2.3-Fund follow-up: order matters here -- _card_kpi_ids() takes the lead
  # (component_3s.kpi_id) + first 3 unique influencing_kpi_ids for the KPI
  # band. Reordered (same 7 KPIs, no membership change) to match R1.5's real,
  # hand-patched dist/ card set (GM% | GM% vs Plan | Price Realization % | GM
  # Amount) -- R1.5 changed which 3 KPIs the cards show but never updated this
  # list's order, so the generator kept building the pre-R1.5 card set.
  influencing_kpi_ids:
  - margin.gm.vs_plan.pct
  - sales.price.realization_pct
  - margin.gm.amount
  - sales.price.list.amount
  - sales.price.net.amount
  - sales.pvm.mix_effect.amount
  - cost.cogs_per_unit.amount
  supporting_kpi_ids:
  - cost.cogs.amount
  - sales.promo.baseline_sales.amount
  - sales.promo.cost.amount
  - sales.promo.incremental_gm.amount
  - sales.promo.incremental.amount
  - sales.pvm.price_effect.amount
  - sales.pvm.volume_effect.amount
  action_code_ids:
  - C-M2.2
  - C-P4.1
  - C-S1.2
primary_kpi_ids:
  - margin.gm.pct
  - margin.gm.amount

value_driver_model:
  formula: margin.gm.pct = f(margin.gm.amount, sales.price.realization_pct, sales.pvm.mix_effect.amount, cost.cogs_per_unit.amount,
    margin.gm.vs_plan.pct)
  impact_direction: maximize
  primary_driver: margin.gm.amount
  impact_logic: Improving margin.gm.amount is the primary lever for maximizing margin.gm.pct.
ux_layout_rules:
  report_structure: 2-Page-Lead
  report_canvas: { width: 1920, height: 1080 }
  # R2.1/R2.3 (Cut C2): intent layer opt-in. COM-002 is the reference pattern
  # R2.4 migrates the other 16 brackets against (UMSETZUNGSPLAN_REPORT_EXZELLENZ.md).
  # message/unit/sort_by/top_n/highlight_rule below reproduce, via the generator,
  # what R1.1/R1.3/R1.4 previously hand-patched directly into dist/ PBIR.
  intent_rules_version: 2
  page_1_summary:
    title: Commercial Summary & Insights
    page_type: T2_Tactical_Variance
    template_variant: T2_DriverBridge
    template_id: pulse
    decision_question: "Is our gross margin holding against price and mix pressure?"
    big_idea: "Gross Margin is under pressure — price concessions and adverse mix in key SKUs are compressing contribution; guardrails and mix optimization are the priority levers."
    component_3s:
      kpi_id: margin.gm.pct
      visual_type: kpi_card
      comparison: vs_plan
      status_logic: higher_is_better
    component_30s:
    - slot_id: Main_1
      kpi_id: margin.gm.amount
      visual_type: trend_line
      # R2.3-Fund follow-up: generator's trend_line default is CalendarYearMonth
      # (matches COM-001's own dist/); COM-002's real dist/ uses daily Date
      # grain for this specific trend -- explicit override, not a global default
      # change (COM-001 stays on the monthly default, unaffected).
      category_field: dim_date.Date
      message: Gross margin has been sliding below plan through the period
      so_what: "The erosion compounds month over month — a trend, not a one-off dip."
      unit: amount
    - slot_id: Main_2
      # T2_DriverBridge / variance_explanation: PVM drivers bridging Plan to Actual GM.
      # R1.6 follow-up (was open since R2.3-Fund): waterfallChart's real
      # capabilities only allow ONE measure in the Y role (Category carries the
      # per-bar breakdown) -- confirmed against Microsoft's own Waterfall-chart
      # docs (learn.microsoft.com/power-bi/visuals/power-bi-visualization-
      # waterfall-charts): a native waterfall's bars come from Category values,
      # not from stacking multiple Y measures. Fixed via a disconnected
      # selector table (dim_pvm_driver, 3 rows: Price/Volume/Mix Effect) +
      # 'PVM Bridge Value', a new SWITCH/SELECTEDVALUE measure that reads the
      # active Driver bar and returns the matching existing effect measure --
      # see Commercial.SemanticModel/definition/tables/dim_pvm_driver.tmdl and
      # _Measures.tmdl. "PVM Bridge Value" has no governed kpi_id (same
      # "direct measure name, no catalog ID exists yet" pattern as Main_1's
      # Bracket precedent elsewhere) -- it's a presentation-layer helper, not
      # a business KPI with causal links/action codes of its own.
      # DAX runtime not verified against a live Power BI engine (none
      # available in the authoring sandbox) -- structurally valid TMDL,
      # reuses three already-verified measures; pending Desktop confirmation.
      visual_type: waterfall
      comparison: vs_plan
      category_field: dim_pvm_driver.Driver
      kpi_id: PVM Bridge Value
      message: Price concessions and adverse mix drive gross margin below plan, not volume
      so_what: "The levers are commercial — price discipline and mix — not demand generation."
      unit: amount
    - slot_id: Main_3
      # Ranking slot (Slot_Definitions.md §3): entities ranked by a SINGLE performance
      # measure — "Who are top/bottom performers? Where should attention focus?"
      # dim_org.OrgName ranked by margin.gm.pct (the page's primary KPI, component_3s),
      # one unit (%), default-sorted descending. Resolves the R1.4 mixed-scale bug: the
      # prior three multi-unit drivers (price realization %, mix effect €, unit cost €)
      # never belonged on one axis and are already surfaced correctly elsewhere —
      # Main_2's PVM bridge (Price/Volume/Mix, all €) and Detail_Matrix's curated
      # evidence columns (R1.3). PBIR: Main_3/visual.json (Golden Thread — must not drift).
      kpi_id: margin.gm.pct
      visual_type: bar_chart
      message: Gross margin sits below target in a few business units that drag the portfolio
      so_what: "Focused intervention in those units beats a broad, thinly-spread program."
      unit: ratio
  page_2_execution:
    title: Commercial Execution
    page_type: T4_Prescriptive_Recommendation
    template_variant: T4_ActionDecision
    template_id: action_matrix
    component_300s:
      evidence_grain: invoice_line
      # Curated ≤8 evidence columns (R1.3) — chosen to answer the decision_question
      # "Is our gross margin holding against price and mix pressure?" in one scan.
      # Locate (product_category, sku) → margin outcome (gm.amount, gm.pct) →
      # variance signal (gm.vs_plan.pct: default sort worst-first + data bars, Top-20) →
      # the two named pressure drivers (price realization, mix effect).
      # Cut vs. prior 12: region/channel (covered by page slicers dim_org.OrgName +
      # dim_date.CalendarYearMonth), list/net price absolutes (redundant once
      # price.realization_pct is shown), cogs_per_unit (cost driver, not the
      # price/mix pressure the decision_question asks about). Cut KPIs remain
      # governed via orchestration.influencing_kpi_ids on page 1.
      # PBIR implementation: Detail_Matrix/visual.json (Golden Thread — must not drift).
      evidence_columns:
      - product_category
      - sku
      - margin.gm.amount
      - margin.gm.vs_plan.pct
      - sales.price.realization_pct
      - sales.pvm.mix_effect.amount
      - margin.gm.pct
      action_panel: true
      payload_mode: full
      # sort_by/top_n/highlight_rule (R2.1) reproduce, via the generator, what R1.3
      # hand-patched directly into Detail_Matrix/visual.json: worst-first default sort,
      # Top-20 row limit, data-bar emphasis on the variance signal.
      sort_by:
        measure: margin.gm.vs_plan.pct
        direction: ascending
      top_n: 20
      highlight_rule:
        column: margin.gm.vs_plan.pct
        type: data_bar
prioritization:
  business_value: high
  implementation_effort: medium
  confidence: 0.85
  reach: organization
  priority_score: 42
data_protection:
  # DSGVO Art. 25 Privacy by Design and by Default
  # Authority: core/templates/page_templates/governance/Data_Protection_Governance.md
  personal_data: false
  legal_basis: not_applicable
  data_minimisation: >
    Detail Matrix limited to product-category and region grain
    (product_category, region, channel). No individual-level customer or
    employee data is exposed. Row-level security applied at SemanticModel level
    — see commercial_sales data contract.
  access_restriction: >
    commercial_controlling_lead and sales_bi_lead roles; row-level security
    enforced by Commercial.SemanticModel (entity filter per org role).
  dpia_required: false
  ai_generated_output: true
  ai_grounding_measure: >
    Active Actions Text (COM) — DAX measure that reads current filter context
    and concatenates only triggered action texts. smartNarrativeVisual auto-
    reads same page filter context as KPI cards. See Storytelling_Principles.md
    §13.
readiness:
  data_availability: available
  org_capability: ready
  stakeholder_alignment: aligned
  overall_readiness: green
overrides:
  data_contract_ref: core/data_contracts/domains/commercial_sales.yaml
documentation:
  business_factsheet: ./Business_Factsheet.md
