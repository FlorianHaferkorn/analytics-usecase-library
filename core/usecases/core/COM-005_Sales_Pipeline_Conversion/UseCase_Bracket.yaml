schema_version: '2.0'
id: COM-005
title: Sales Pipeline & Conversion
domain: Commercial
governance:
  owner_role: commercial_controlling_revenue_operations
  steward_role: revenue_operations_bi_lead
orchestration:
  strategic_kpi_id: KPI-COM-026
  influencing_kpi_ids:
  - KPI-COM-027
  - KPI-COM-028
  - KPI-COM-029
  - KPI-COM-030
  supporting_kpi_ids:
  - KPI-COM-031
  action_code_ids:
  - C-P1.1
primary_kpi_ids:
- KPI-COM-026
- KPI-COM-027
value_driver_model:
  formula: KPI-COM-026 = f(KPI-COM-027, KPI-COM-028, KPI-COM-029)
  impact_direction: maximize
  primary_driver: KPI-COM-027
  impact_logic: Raising KPI-COM-027 is the primary lever for restoring KPI-COM-026.
ux_layout_rules:
  report_structure: 2-Page-Lead
  report_canvas:
    width: 1920
    height: 1080
  intent_rules_version: 2
  page_1_summary:
    title: Commercial Summary & Insights
    page_type: T3_Operational_Monitoring
    template_variant: T3_ProcessControl
    template_id: pulse
    decision_question: Is there enough qualified pipeline converting to hit the target?
    big_idea: Pipeline coverage is below the safe threshold and the gap is a win-rate problem, not a shortage
      of opportunities.
    component_3s:
      kpi_id: KPI-COM-026
      visual_type: kpi_card_with_delta
      comparison: vs_target
      status_logic: higher_is_better
    component_30s:
    - slot_id: Main_1
      kpi_id: KPI-COM-027
      visual_type: line_chart
      question: Is the coverage gap a volume problem or a conversion problem?
      message: Win rate is dragging coverage below plan, not a shortage of open opportunities
      so_what: Because conversion is the lever, deal-qualification and win-rate coaching beat pure lead-volume
        pushes.
      unit: rate
    - slot_id: Main_2
      kpi_id: KPI-COM-027
      visual_type: horizontal_bar_chart
      category_field: dim_salesrep.Team
      # Bis 24.10.2026 stand hier KPI-COM-028 (Stage Conversion). Der KPI ist im Katalog op: hitl:
      # fact_pipeline fuehrt je Opportunity nur die erreichte Endstufe, keine Stufenwechsel, und
      # Negotiation ist in Gold leer (0 von 5894 Zeilen). Ein Balken je Stufe waere leer.
      question: Is the conversion gap a team problem or a rep problem?
      message: Win rate differs by under three points between teams; the spread sits at rep level
      so_what: Coaching targets individual reps on page 2, not whole teams.
      unit: rate
  page_2_execution:
    title: Commercial Execution
    decision_question: Which reps should the conversion push target first?
    page_type: T4_Prescriptive_Recommendation
    template_variant: T4_ActionDecision
    template_id: action_matrix
    component_300s:
      evidence_grain: opportunity
      # Zeile = Rep (Team > Rep, 5/40). KPI-COM-026 fehlt bewusst: fact_sales_target fuehrt kein
      # SalesRepKey, je Rep teilte die Coverage dessen Pipeline durch das ganze Org-Ziel. 028/030 sind
      # im Katalog op: hitl und blieben leere Spalten. "segment" loeste ueber dim_customer auf, die
      # fact_pipeline nicht kennt (kein CustomerKey).
      evidence_columns:
      - dim_salesrep.Team
      - dim_salesrep.Rep Name
      - KPI-COM-027
      - KPI-COM-029
      - KPI-COM-031
      action_panel: true
      payload_mode: full
      sort_by:
        measure: KPI-COM-027
        direction: ascending
      top_n: 20
      highlight_rule:
        column: KPI-COM-027
        type: data_bar
prioritization:
  business_value: high
  implementation_effort: medium
  confidence: 0.6
  reach: division
  priority_score: 20
data_protection:
  personal_data: false
  legal_basis: not_applicable
  data_minimisation: Detail grain limited to opportunity level; row-level security applied at SemanticModel
    level.
  access_restriction: 'commercial_controlling_revenue_operations and revenue_operations_bi_lead roles;
    row-level security enforced by Commercial.SemanticModel (org filter per role).

    '
  dpia_required: false
  ai_generated_output: true
  ai_grounding_measure: 'Active Actions Text (COM) — DAX measure that reads current filter context and
    concatenates only triggered action texts. See Storytelling_Principles.md §13.

    '
readiness:
  data_availability: available
  org_capability: developing
  stakeholder_alignment: aligned
  overall_readiness: amber
overrides:
  data_contract_ref: core/data_contracts/domains/commercial_sales.yaml
documentation:
  business_factsheet: ./Business_Factsheet.md
