schema_version: '2.0'
id: SCM-001
title: Inventory Performance
domain: Supply Chain
governance:
  owner_role: supply_chain_controlling_inventory_mgmt_lead
  steward_role: supply_chain_bi_lead
orchestration:
  strategic_kpi_id: inv.dio.days
  influencing_kpi_ids:
  - inv.turnover
  - inv.stockout.pct
  - supply.otif.pct
  - inv.obsolete.pct
  - plan.forecast.accuracy.pct
  supporting_kpi_ids:
  - supply.on_time.pct
  - supply.in_full.pct
  - supply.stockout_impact.pct
  - plan.forecast.mape.pct
  - plan.forecast.bias.pct
  - plan.forecast.service_impact.pct
  - plan.replan.count
  - sales.units
  action_code_ids:
  - S-I1.1
  - S-I1.2
  - S-I1.3
  - S-I1.4
  - S-I1.5
value_driver_model:
  formula: inv.dio.days = f(inv.turnover, inv.stockout.pct, supply.otif.pct, inv.obsolete.pct, plan.forecast.accuracy.pct)
  impact_direction: minimize
  primary_driver: inv.turnover
  impact_logic: Improving inv.turnover is the primary lever for minimizing inv.dio.days.
ux_layout_rules:
  report_structure: 2-Page-Lead
  report_canvas: { width: 1920, height: 1080 }
  page_1_summary:
    title: Supply Chain Summary & Insights
    page_type: T1_Strategic_Overview
    template_id: pulse
    component_3s:
      kpi_id: inv.dio.days
      visual_type: kpi_card
    component_30s:
    - kpi_id: inv.turnover
      visual_type: trend_line
    - kpi_ids:
      - inv.stockout.pct
      - supply.otif.pct
      - inv.obsolete.pct
      visual_type: bar_chart
  page_2_execution:
    title: Supply Chain Execution
    page_type: T3_Operational_Monitoring
    template_id: action_matrix
    component_300s:
      evidence_grain: location_sku_month
      evidence_columns:
      - location
      - channel
      - product_category
      - abc_class
      - xyz_class
      - inv.turnover
      - inv.stockout.pct
      - supply.otif.pct
      - inv.obsolete.pct
      - plan.forecast.accuracy.pct
      - sales.units
      - inv.dio.days
      action_panel: true
      payload_mode: full
prioritization:
  business_value: high
  implementation_effort: medium
  confidence: 0.8
  reach: division
  priority_score: 27
readiness:
  data_availability: available
  org_capability: ready
  stakeholder_alignment: aligned
  overall_readiness: green
overrides:
  data_contract_ref: core/data_contracts/domains/supply_chain.yaml
documentation:
  business_factsheet: ./Business_Factsheet.md
