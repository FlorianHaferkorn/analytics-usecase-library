schema_version: '2.0'
id: SCM-001
title: Inventory Performance
domain: Supply Chain
governance:
  owner_role: supply_chain_controlling_inventory_mgmt_lead
  steward_role: supply_chain_bi_lead
orchestration:
  strategic_kpi_id: KPI-SCM-001
  influencing_kpi_ids:
  - KPI-SCM-016
  - KPI-SCM-002
  - KPI-SCM-007
  - KPI-SCM-004
  - KPI-SCM-005
  supporting_kpi_ids:
  - KPI-SCM-008
  - KPI-SCM-018
  - KPI-SCM-009
  - KPI-SCM-017
  - KPI-SCM-006
  - KPI-SCM-012
  - KPI-SCM-014
  - KPI-COM-012
  - KPI-SCM-003
  action_code_ids:
  - S-I1.1
  - S-I1.2
  - S-I1.3
  - S-I1.4
  - S-I1.5
primary_kpi_ids:
  - KPI-SCM-001
  - KPI-SCM-016

value_driver_model:
  formula: KPI-SCM-001 = f(KPI-SCM-016, KPI-SCM-002, KPI-SCM-007, KPI-SCM-004, KPI-SCM-005)
  impact_direction: minimize
  primary_driver: KPI-SCM-016
  impact_logic: Improving KPI-SCM-016 is the primary lever for minimizing KPI-SCM-001.
ux_layout_rules:
  report_structure: 2-Page-Lead
  report_canvas: { width: 1920, height: 1080 }
  # R2.4 (Cut C2): migrated to the intent layer, COM-002 as reference pattern.
  intent_rules_version: 2
  page_1_summary:
    title: Supply Chain Summary & Insights
    page_type: T1_Strategic_Overview
    template_variant: T1_Portfolio
    template_id: pulse
    decision_question: "Is inventory turning efficiently without stockout or obsolescence risk?"
    big_idea: "Inventory turnover is deteriorating — dead stock in three SKU clusters is tying up working capital and masking the true demand signal for replenishment planning."
    component_3s:
      kpi_id: KPI-SCM-001
      visual_type: kpi_card_with_delta
      comparison: vs_target
      status_logic: lower_is_better
      benchmark: true
    component_30s:
    - slot_id: Main_1
      kpi_id: KPI-SCM-016
      visual_type: line_chart
      question: "Is inventory turning efficiently, or tying up working capital?"
      message: Inventory turnover is falling, tying up working capital in slow-moving stock
      so_what: "Falling turnover ties up working capital that could fund faster-moving SKUs."
      unit: ratio
    - slot_id: Main_2
      kpi_ids:
      - KPI-SCM-002
      - KPI-SCM-007
      - KPI-SCM-004
      # R6.3 (23.09.2026): Kennzahlen gegensaetzlicher Richtung auf einer Balkenachse
      # (Knock-out mixed-polarity). Je Einheit eine Zeile, je Signal eine Spalte.
      visual_type: exception_table
      category_field: dim_org.OrgName
      question: "What are the inventory-health signals telling us?"
      message: Stockout, OTIF, and obsolescence risk — the three inventory health signals.
      so_what: "Stockouts and obsolescence rising together point to a demand-signal problem, not a capacity one."
      unit: rate
    - slot_id: Main_3
      # Forecast Accuracy trend vs target — upstream driver of DIO and the excess/stockout trade-off (content_gap fix)
      kpi_id: KPI-SCM-005
      visual_type: line_chart
      comparison: vs_target
      question: "Is poor forecasting the root cause behind the inventory swings?"
      message: Forecast accuracy below target is the root cause behind the stockout-and-obsolescence swing
      so_what: "Fixing forecast accuracy addresses the root cause instead of firefighting stockouts and dead stock separately."
      unit: rate
  page_2_execution:
    title: Supply Chain Execution
    decision_question: "Which SKUs drive the excess or stockout risk, and what is the rebalancing action?"
    page_type: T3_Operational_Monitoring
    template_variant: T3_ExceptionQueue
    template_id: action_matrix
    component_300s:
      evidence_grain: location_sku_month
      # R2.4: curated 12→8. 'location' has no backing dimension table in
      # SupplyChain.SemanticModel (dim_org's Region/OrgName already cover
      # site-level cross-cuts elsewhere) -- dropped in favor of product_category
      # + ABC/XYZ classification, the decision_question's own analytical lens.
      evidence_columns:
      - product_category
      - abc_class
      - xyz_class
      - KPI-SCM-016
      - KPI-SCM-002
      - KPI-SCM-004
      - KPI-SCM-001
      - KPI-SCM-007
      action_panel: true
      payload_mode: full
      sort_by:
        measure: KPI-SCM-004
        direction: descending
      top_n: 20
      highlight_rule:
        column: KPI-SCM-004
        type: data_bar
prioritization:
  business_value: high
  implementation_effort: medium
  confidence: 0.8
  reach: division
  priority_score: 27
data_protection:
  # DSGVO Art. 25 Privacy by Design and by Default
  # Authority: core/templates/page_templates/governance/Data_Protection_Governance.md
  personal_data: false
  legal_basis: not_applicable
  data_minimisation: >
    Detail Matrix limited to SKU, warehouse, and inventory-category grain.
    Inventory metrics attributed to products and locations — no natural person
    is identified. Row-level security applied at SemanticModel level.
  access_restriction: >
    supply_chain_controlling_lead and scm_bi_lead roles; row-level security
    enforced by SupplyChain.SemanticModel (site filter per org role).
  dpia_required: false
  ai_generated_output: true
  ai_grounding_measure: >
    Active Actions Text (SCM) — DAX measure that reads current filter context
    and concatenates only triggered action texts. See Storytelling_Principles.md
    §13.
readiness:
  data_availability: available
  org_capability: ready
  stakeholder_alignment: aligned
  overall_readiness: green
overrides:
  data_contract_ref: core/data_contracts/domains/supply_chain.yaml
documentation:
  business_factsheet: ./Business_Factsheet.md
