schema_version: '2.0'
id: SCM-001
name: Inventory Performance
domain: Supply Chain
governance:
  owner_role: Supply Chain Controlling / Inventory Mgmt Lead
  steward_role: Supply Chain BI Lead
  status: active
  last_review: '2026-02-12'
ontology_bracket:
  strategic_kpi_id: inv.dio.days
  influencing_kpi_ids:
  - inv.turnover
  - inv.stockout.pct
  - supply.otif.pct
  - inv.obsolete.pct
  - plan.forecast.accuracy.pct
  - sales.units
  action_code_ids:
  - S-I1.1
  - S-I1.2
  - S-I1.3
  - S-I1.4
  - S-I1.5
value_driver_model:
  description: inv.dio.days is driven by influencing KPIs and operational levers.
  formula: inv.dio.days = f(inv.turnover, inv.stockout.pct, supply.otif.pct, inv.obsolete.pct,
    plan.forecast.accuracy.pct, sales.units)
ux_layout_rules:
  report_structure: 2-Page-Lead
  page_1_summary_insights:
    title: Supply Chain Summary & Insights
    3s_component: 'North Star: inv.dio.days'
    30s_components: []
  page_2_execution:
    title: Supply Chain Execution
    300s_components:
    - 'Evidence_Table: (define evidence table requirements)'
    - 'Action_Panel: Integrated Side-Panel for Subscribed Action Codes'
    - 'Payload_Injection: Show Level (L1-L3) and Steps from Action Code YAML'
documentation:
  business_factsheet: ./Business_Factsheet.md
  technical_factsheet: ./Technical_Factsheet.md
