action_logic_seeds:
  - trigger_driver: inv.dio.days
    trigger_diagnostic: inv.excess_inventory.amount
    trigger_condition: "DIO > benchmark + 20% for 3 consecutive months AND excess inventory > 10% of total inventory value"
    guardrail: "Exclude strategic buffer stock SKUs and long-lead-time items"
    action_description: Excess inventory reduction program (promotions, write-offs, replenishment freeze).
    expected_outcome_kpi: inv.dio.days
    action_code_candidate: S-I1.1

  - trigger_driver: inv.stockout.pct
    trigger_diagnostic: plan.forecast.bias.pct
    trigger_condition: "Stockout rate > 3% AND forecast bias is negative (under-forecast)"
    guardrail: "Exclude SKUs under product phase-out"
    action_description: Replenishment parameter review and safety stock recalibration.
    expected_outcome_kpi: supply.otif.pct
    action_code_candidate: S-I1.2

required_data_model:
  required_facts:
    - table: fact_inventory
      description: Daily inventory snapshots by SKU-warehouse with on-hand, on-order, and demand values.
    - table: fact_sales
      description: Orders and shipments for OTIF calculation and demand history.
  required_dimensions:
    - name: dim_product
      grain_relevance: SKU level for excess identification and stockout analysis.
    - name: dim_warehouse
      grain_relevance: Location-level for multi-echelon inventory management.
    - name: dim_date
      grain_relevance: Daily snapshots for DIO trending.
  preferred_grain: sku-warehouse-day
  minimum_grain: sku-warehouse-month
  minimum_history_months: 24
  required_measures:
    - name: Days Inventory Outstanding
      formula_seed: "(Average Inventory Value / (COGS / 365))"
      source_id: SRC-001
    - name: Stockout Rate
      formula_seed: "SKU-periods with zero stock and active demand / Total SKU-periods"
      source_id: SRC-001
    - name: OTIF %
      formula_seed: "Orders delivered on time and in full / Total orders"
      source_id: SRC-001

