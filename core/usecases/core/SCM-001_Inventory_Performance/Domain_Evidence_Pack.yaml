evidence_pack_version: "1.0"
use_case_id: SCM-001
use_case_title: Inventory Performance
domain: Supply Chain
authored_date: "2026-06-01"
authored_by: framework-architect-agent
reviewed_by: ""
status: draft

process_scope:
  description: >
    Inventory balance management: minimise working capital tied up in inventory while
    maintaining service levels. Covers Days Inventory Outstanding (DIO), stockout rates,
    excess and obsolete inventory, and OTIF as the service output.
  in_scope:
    - Days Inventory Outstanding (DIO) by product, warehouse, and category
    - Stockout rate and service level impact
    - Excess inventory identification and write-off risk
    - OTIF (On-Time In-Full) as the downstream service output
    - Forecast accuracy as the upstream driver
  out_of_scope:
    - Detailed demand planning tuning (SCM-003)
    - Transport cost optimization (OPS-018)
    - Supplier OTIF (SCM-002)
  industry_segment: Manufacturing and distribution with multi-echelon inventory
  applicable_frameworks:
    - name: SCOR Digital Standard 2023 — Plan/Source/Make/Deliver KPIs
      id: SCOR-2023
    - name: APQC PCF Category 3 — Supply Chain Management
      id: APQC-PCF-3
    - name: CSCMP Supply Chain Quarterly Benchmarks
      id: CSCMP-BNK
    - name: "Chopra & Meindl (2022) Supply Chain Management — Cycle Stock / Safety Stock Theory"
      id: CHOPRA-MEINDL

canonical_domain_model:
  outcome_kpis:
    - id: inv.dio.days
      name: Days Inventory Outstanding
      definition: "DIO = (Average Inventory Value / COGS) × 365. Measures inventory efficiency in days."
      unit: days
      direction: minimize
      benchmark_target: "Industry-specific: 30–60 days for FMCG, 60–90 days for manufacturing (CSCMP 2023)"
      benchmark_source_id: SRC-004

  driver_kpis:
    - id: inv.stockout.pct
      name: Stockout Rate
      definition: "% of SKU-warehouse-period combinations with zero inventory despite active demand."
      unit: "%"
      direction: minimize
      drives: inv.dio.days
      causal_mechanism: >
        Reducing DIO without increasing stockout rate requires better forecast accuracy and
        replenishment timing. A stockout rate above 3% signals under-stocking that will
        ultimately force safety stock increases (Chopra & Meindl 2022).
      benchmark_target: "< 2% (CSCMP world class); < 5% acceptable"
      benchmark_source_id: SRC-004

    - id: supply.otif.pct
      name: OTIF % (Delivery Service Level)
      definition: "% of customer orders delivered On-Time and In-Full."
      unit: "%"
      direction: maximize
      drives: inv.dio.days
      causal_mechanism: >
        OTIF is the downstream output of inventory health. Low DIO increases stockout risk
        which drives OTIF failures. OTIF and DIO must be balanced: optimise DIO subject
        to OTIF ≥ target constraint.
      benchmark_target: "≥ 95% world class (SCOR); ≥ 90% acceptable"
      benchmark_source_id: SRC-001

    - id: plan.forecast.accuracy.pct
      name: Forecast Accuracy
      definition: "1 - MAPE (Mean Absolute Percentage Error). Higher = more accurate."
      unit: "%"
      direction: maximize
      drives: inv.dio.days
      causal_mechanism: >
        Each 10pp improvement in forecast accuracy reduces required safety stock by
        approximately 15–25% (CSCMP benchmark data). Forecast accuracy is the primary
        upstream lever for DIO optimisation.
      benchmark_target: "≥ 80% MAPE-based (APQC / CSCMP)"
      benchmark_source_id: SRC-004

  diagnostic_kpis:
    - id: inv.excess_inventory.amount
      name: Excess Inventory Value
      definition: "Inventory value exceeding X months of forward demand (typically > 6 months)."
      unit: EUR
      direction: minimize
      diagnoses: inv.dio.days
      causal_mechanism: Excess inventory is the primary capital lock-up driver when DIO is high.

    - id: plan.forecast.bias.pct
      name: Forecast Bias
      definition: "(Forecast - Actual) / Actual. Positive = over-forecast; negative = under-forecast."
      unit: "%"
      direction: minimize
      diagnoses: plan.forecast.accuracy.pct
      causal_mechanism: Systematic over-forecast builds excess; under-forecast causes stockouts.

  guardrails:
    - description: Minimum service level constraint
      condition: >
        DIO reduction actions must not push stockout rate above 3% or OTIF below 95%.
        Service level is a constraint, not a tradeoff objective.
      affected_kpis: [inv.dio.days, inv.stockout.pct, supply.otif.pct]

    - description: Safety stock for critical/high-lead-time SKUs
      condition: >
        DIO reduction targets must not apply to strategic buffer stock for single-source
        or long-lead-time SKUs. These require a separate minimum stock level waiver.
      affected_kpis: [inv.dio.days]

  wrong_interpretations:
    - description: Low DIO as unambiguously good
      why_wrong: >
        DIO < benchmark may indicate chronic stockouts, supply chain fragility, or
        aggressive write-offs of obsolete inventory. DIO must always be evaluated
        alongside stockout rate and OTIF. (SCOR Digital Standard 2023).
      source_id: SRC-001

    - description: Aggregate OTIF hiding SKU-level failures
      why_wrong: >
        A 95% aggregate OTIF can hide a pattern where 20% of SKUs consistently fail
        OTIF while 80% perform well. SKU-level OTIF analysis is required to target
        root causes.
      source_id: SRC-003

    - description: Safety stock as the primary DIO driver
      why_wrong: >
        Most excess inventory in practice is cycle stock (ordering in large batches)
        or speculative stock, not safety stock. Safety stock optimisation has limited
        DIO impact if cycle stock and order quantities are not addressed.
      source_id: SRC-006

