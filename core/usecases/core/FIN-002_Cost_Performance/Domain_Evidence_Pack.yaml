evidence_pack_version: "1.0"
use_case_id: FIN-002
use_case_title: Cost Performance
domain: Finance / Operations
authored_date: "2026-06-11"
authored_by: framework-architect-agent
reviewed_by: ""
status: draft

process_scope:
  description: >
    Unit-cost and conversion-cost performance management across plants, lines, and products.
    Covers cost-of-goods decomposition (material, labor, overhead/OpEx), standard-costing
    variance analysis (price vs usage, rate vs efficiency, volume/absorption), and the
    quality/yield drivers that determine true conversion cost per good unit. Enables early
    corrective actions that reduce unit cost without shifting cost downstream into scrap,
    rework, warranty, or service failure.
  in_scope:
    - Unit Cost Amount (cost per good unit produced) vs plan and vs last year by plant/line/product
    - COGS % of sales as the margin guardrail co-outcome
    - Cost-bucket decomposition (material %, labor, overhead/OpEx vs plan)
    - Standard-costing variance analysis (material price vs usage, labor rate vs efficiency, fixed-cost absorption/volume)
    - Yield- and scrap-driven conversion cost (cost of poor quality embedded in unit cost)
    - Early corrective action triggers on material, labor, OpEx, and quality drivers
  out_of_scope:
    - Detailed OEE / availability-performance tuning (OPS-001)
    - Supplier purchase-price-variance (PPV) negotiation and sourcing strategy (OPS-002)
    - Logistics and distribution cost ratio (OPS-009)
    - Working-capital and inventory valuation for cash purposes (FIN-001, SCM-001)
    - Long-term capacity / CapEx footprint decisions
  industry_segment: Discrete and process manufacturing companies producing to standard cost
  applicable_frameworks:
    - name: "IAS 2 Inventories — Cost of Inventories and Cost of Conversion (IFRS)"
      id: IAS-2
    - name: "ISO 22400-2 KPIs for Manufacturing Operations Management (productivity, yield, scrap)"
      id: ISO-22400
    - name: "APQC PCF 8.0 — Manage Financial Resources: Perform Cost Management"
      id: APQC-PCF-8
    - name: "IMA Conceptual Framework for Managerial Costing / Standard Costing & Variance Analysis (CIMA)"
      id: IMA-CFMC
    - name: "ISA-95 / IEC 62264 Enterprise-Control System Integration (Level 3 cost-to-output linkage)"
      id: ISA-95

canonical_domain_model:
  outcome_kpis:
    - id: cost.unit.amount
      name: Unit Cost Amount
      definition: >
        Fully-loaded cost per good unit produced = (Material Cost + Labor Cost + Overhead/Conversion Cost)
        / Good Output Units. Per IAS 2, conversion cost includes direct labor plus a systematic
        allocation of variable and fixed production overhead at normal capacity.
      unit: EUR per unit
      direction: minimize
      benchmark_target: "Sector-specific; track to plan ±2% and to standard cost; total manufacturing cost trended via APQC OSB total-cost-of-manufacturing-as-%-of-revenue"
      benchmark_source_id: SRC-006

    - id: margin.cogs.pct
      name: COGS % of Sales
      role: guardrail
      definition: "COGS Amount / Net Sales Amount × 100. Margin co-outcome — unit-cost actions must not raise COGS %."
      unit: "%"
      direction: minimize
      causal_mechanism: >
        Co-outcome guardrail: unit cost can fall while COGS % rises (or vice versa) when mix or
        volume shifts. COGS % is the financial translation of unit-cost discipline into margin and
        is benchmarked by industry. It is a derived margin guardrail, not a causal driver of unit cost.
      benchmark_target: "Sector-specific; benchmarked via APQC OSB 'Cost of goods sold as a percentage of revenue'"
      benchmark_source_id: SRC-006

  driver_kpis:
    - id: cost.material.pct
      name: Material Cost %
      definition: "Material Cost Amount / COGS Amount × 100 (share of cost from purchased materials and consumables)."
      unit: "%"
      direction: minimize
      drives: cost.unit.amount
      causal_mechanism: >
        Material is the largest and fastest-moving cost bucket in most manufacturing. Material cost %
        moves with purchase price (price variance) and consumption efficiency (usage/yield variance).
        It is the primary structural lever on unit cost before labor or overhead redesign.
      benchmark_target: "Industry-specific; benchmarked via APQC OSB 'Material costs as a percentage of cost of goods sold'"
      benchmark_source_id: SRC-006

    - id: cost.opex.vs_plan.pct
      name: OpEx vs Plan %
      definition: "(Actual OpEx − Plan OpEx) / Plan OpEx × 100. Overhead/operating-expense overspend against plan."
      unit: "%"
      direction: minimize
      drives: cost.unit.amount
      causal_mechanism: >
        Overhead and operating expense are absorbed into unit cost through the conversion-cost
        allocation. OpEx running over plan inflates absorbed cost per unit; the gap signals structural
        overspend versus temporary ramp-up. Per IAS 2, only normal-capacity overhead is absorbable.
      benchmark_target: "Within ±3% of plan; structural overspend escalated above tolerance"
      benchmark_source_id: SRC-002

    - id: ops.labor.productivity.pct
      name: Labor Productivity %
      definition: "Good Output Units per labor hour, indexed vs standard (standard hours earned / actual hours × 100)."
      unit: "%"
      direction: maximize
      drives: cost.unit.amount
      causal_mechanism: >
        Labor cost per unit = labor rate / units-per-hour. Falling productivity raises conversion cost
        per unit even at constant wage rates. Decomposes into labor rate variance (price) and labor
        efficiency variance (productivity) per standard costing.
      benchmark_target: "≥100% of standard (earned hours ≥ actual hours); ISO 22400 productivity index"
      benchmark_source_id: SRC-003

    - id: ops.production.volume
      name: Production Volume
      definition: "Good output units produced in the period. Determines fixed-cost absorption per unit."
      unit: count
      direction: maximize
      drives: cost.unit.amount
      causal_mechanism: >
        Fixed conversion cost is spread over output volume. Lower volume raises fixed cost per unit
        even when total spend is flat — an absorption effect, not an efficiency loss. Per IAS 2,
        unabsorbed fixed overhead at abnormally low volume must be expensed, not capitalized into inventory.
      benchmark_target: "At or above normal capacity used for overhead absorption (IAS 2 normal capacity)"
      benchmark_source_id: SRC-001

    - id: ops.quality.defect_rate.pct
      name: Defect Rate %
      definition: "Defective (scrap + rework) units / total units produced × 100."
      unit: "%"
      direction: minimize
      drives: cost.unit.amount
      causal_mechanism: >
        Defects consume material, labor, and overhead that produce no saleable unit, so they re-load
        onto the cost of good units (cost of poor quality). Rising defect rate raises unit cost even
        when nominal spend is unchanged.
      benchmark_target: "Cost of poor quality 15–20% of sales typical; world-class <5% (ASQ)"
      benchmark_source_id: SRC-007

    - id: ops.yield.pct
      name: Yield %
      definition: "Good (saleable) units / total units started × 100. First-pass yield of conversion."
      unit: "%"
      direction: maximize
      drives: cost.unit.amount
      causal_mechanism: >
        Yield is the inverse driver of scrap-loaded cost: every point of yield loss spreads the full
        input cost of started units over fewer good units, raising cost per good unit. Yield and defect
        rate are the quality drivers that determine true conversion cost per saleable unit.
      benchmark_target: "Maximize toward 100%; benchmarked via APQC OSB 'Scrap and rework costs as a percentage of cost of goods sold'"
      benchmark_source_id: SRC-006

  diagnostic_kpis:
    - id: cost.material.price_variance.amount
      name: Material Price Variance
      definition: "Actual Quantity × (Standard Price − Actual Price). Isolates purchase-price effect on material cost."
      unit: EUR
      direction: maximize
      diagnoses: cost.material.pct
      causal_mechanism: >
        Separates whether material cost % moved because of purchase price (a sourcing/procurement issue)
        rather than consumption. Adverse price variance points to procurement/commodity action, not shopfloor action.

    - id: cost.material.usage_variance.amount
      name: Material Usage (Quantity) Variance
      definition: "Standard Price × (Standard Quantity − Actual Quantity). Isolates consumption/yield effect on material cost."
      unit: EUR
      direction: maximize
      diagnoses: cost.material.pct
      causal_mechanism: >
        Separates whether material cost % moved because more material was consumed per unit (yield/scrap,
        recipe drift, calibration). Adverse usage variance points to shopfloor/quality action, not procurement.

    - id: cost.labor.rate_variance.amount
      name: Labor Rate Variance
      definition: "Actual Hours × (Standard Rate − Actual Rate). Isolates wage-rate effect on labor cost."
      unit: EUR
      direction: maximize
      diagnoses: ops.labor.productivity.pct
      causal_mechanism: >
        Separates labor cost movement caused by wage rate / overtime / skill-mix from movement caused by efficiency.
        Adverse rate variance points to scheduling, overtime, and shift-mix decisions.

    - id: cost.labor.efficiency_variance.amount
      name: Labor Efficiency Variance
      definition: "Standard Rate × (Standard Hours for actual output − Actual Hours). Isolates productivity effect on labor cost."
      unit: EUR
      direction: maximize
      diagnoses: ops.labor.productivity.pct
      causal_mechanism: >
        Separates labor cost movement caused by hours-per-unit (true productivity) from wage rate.
        Adverse efficiency variance points to line balancing, training, downtime, and changeover action.

    - id: cost.overhead.absorption_variance.amount
      name: Fixed Overhead Volume / Absorption Variance
      definition: "(Actual Volume − Budgeted Normal Volume) × Standard Fixed Overhead Rate. Isolates volume/absorption effect on unit cost."
      unit: EUR
      direction: maximize
      diagnoses: cost.opex.vs_plan.pct
      causal_mechanism: >
        Distinguishes a unit-cost rise caused by under-absorption (low volume spreading fixed cost over
        fewer units) from a genuine spend overrun. Under-absorption is a demand/scheduling issue, not an overspend.

    - id: cost.copq.scrap_rework.amount
      name: Cost of Poor Quality (Scrap + Rework)
      definition: "Material + labor + overhead consumed by scrapped and reworked units, expressed in EUR and as % of COGS."
      unit: EUR
      direction: minimize
      diagnoses: ops.yield.pct
      causal_mechanism: >
        Quantifies how much of the unit-cost gap is scrap/rework-driven rather than price or overhead.
        Confirms that the real lever is quality/yield improvement, not headline cost cutting.

  guardrails:
    - description: Do not cut maintenance, quality, or prevention spend to hit a short-term cost target
      condition: >
        Block OpEx / overhead reduction actions that lower preventive maintenance, inspection, or
        quality-prevention spend when defect rate or scrap variance is rising. Cutting prevention/appraisal
        cost shifts cost downstream into internal failure (scrap/rework) and external failure (warranty/returns),
        raising total cost of poor quality even as the line item falls.
      affected_kpis:
        - cost.unit.amount
        - ops.quality.defect_rate.pct
        - ops.yield.pct

    - description: Do not declare unit-cost improvement that is only a volume/absorption artifact
      condition: >
        Do not trigger structural cost-reduction actions when a unit-cost change is explained by the
        fixed-overhead absorption variance (volume up or down) rather than by efficiency or price.
        Reading an absorption swing as a real efficiency gain or loss misdirects action.
      affected_kpis:
        - cost.unit.amount
        - ops.production.volume

    - description: Do not optimise unit cost in a way that raises COGS % or shifts cost to another stage
      condition: >
        Block material-substitution or make-vs-buy actions that reduce one plant's unit cost while raising
        COGS % at the entity level or moving cost into logistics, service, or warranty downstream.
      affected_kpis:
        - cost.unit.amount
        - margin.cogs.pct

  wrong_interpretations:
    - description: Unit cost fell only because volume rose (fixed-cost absorption)
      why_wrong: >
        A lower unit cost driven by higher production volume spreading fixed overhead over more units is
        an absorption effect, not an efficiency or price improvement. When volume normalizes the gain
        reverses. Per IAS 2 the inverse case — abnormally low volume — must expense unabsorbed fixed
        overhead rather than capitalize it. Always decompose unit-cost change into price, efficiency, and
        volume/absorption before claiming a structural win.
      source_id: SRC-001

    - description: Cutting quality, inspection, or maintenance spend reduces cost
      why_wrong: >
        Treating prevention and appraisal spend as pure cost ignores that it suppresses internal and
        external failure cost. The cost of poor quality already runs 15–20% of sales for typical
        manufacturers; cutting prevention shifts cost downstream into scrap, rework, warranty, and lost
        sales, raising total cost while the cut line item looks improved.
      source_id: SRC-008

    - description: Material cost % read without splitting price from usage/yield
      why_wrong: >
        A rise in material cost % can be caused by purchase price (a procurement/commodity issue) or by
        consumption/yield loss (a shopfloor/quality issue). Each has a different owner and corrective action.
        Without the material price-vs-usage variance split, controllers correct the wrong lever.
      source_id: SRC-004

    - description: Reducing unit cost at one stage that shifts cost downstream
      why_wrong: >
        Cheaper inputs or compressed cycle times can lower a plant's unit cost while increasing scrap,
        warranty, returns, or expedited-freight cost elsewhere. Unit cost must be evaluated against COGS %
        and total cost of poor quality, not in isolation, to avoid value-destroying local optimisation.
      source_id: SRC-005

