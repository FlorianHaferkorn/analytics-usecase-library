action_logic_seeds:
  - trigger_driver: cost.material.pct
    trigger_diagnostic: cost.material.usage_variance.amount
    trigger_condition: "Material Cost % above plan by > 2pp for 2 consecutive months AND usage variance is adverse (price variance not the cause)"
    guardrail: "Do not trigger if the gap is a price variance owned by procurement (route to OPS-002), or if volume/absorption explains the move"
    action_description: Cost variance investigation — split material price vs usage/yield variance by plant-line-product and launch yield/recipe corrective action where usage is the driver.
    expected_outcome_kpi: cost.unit.amount
    action_code_candidate: F-K2.1

  - trigger_driver: ops.labor.productivity.pct
    trigger_diagnostic: cost.labor.efficiency_variance.amount
    trigger_condition: "Labor Productivity < 95% of standard AND labor efficiency variance adverse for 2 consecutive months"
    guardrail: "Exclude planned training, ramp-up, or new-product qualification periods; do not cut headcount that raises defect rate"
    action_description: Labor productivity recovery — line balancing, changeover reduction, and standard-time re-validation where efficiency (not rate) drives the gap.
    expected_outcome_kpi: cost.unit.amount
    action_code_candidate: F-K2.2

  - trigger_driver: cost.opex.vs_plan.pct
    trigger_diagnostic: cost.overhead.absorption_variance.amount
    trigger_condition: "OpEx vs Plan > +5% AND absorption variance confirms structural overspend (not low-volume under-absorption)"
    guardrail: "Do not cut maintenance, inspection, or quality-prevention spend; do not act if the gap is pure volume/absorption"
    action_description: OpEx containment — cost-driver decomposition and overhead variance bridge separating structural overspend from temporary ramp-up or absorption swings.
    expected_outcome_kpi: cost.unit.amount
    action_code_candidate: F-K2.3

  - trigger_driver: ops.yield.pct
    trigger_diagnostic: cost.copq.scrap_rework.amount
    trigger_condition: "Yield % below target AND defect rate rising AND scrap/rework cost > 10% of COGS for the line"
    guardrail: "Quality/yield action must increase, not reduce, prevention and appraisal spend (cost of poor quality guardrail)"
    action_description: Yield and quality cost-out — root-cause scrap/rework reduction targeting the cost of poor quality embedded in unit cost.
    expected_outcome_kpi: cost.unit.amount
    action_code_candidate: F-K2.4

required_data_model:
  required_facts:
    - table: fact_cost
      description: Cost breakdown (COGS Amount, Material Cost Amount, Overhead Amount) per plant-line-product-month — the core unit-cost numerator.
    - table: fact_output
      description: Output Units per plant-line-product-month — the unit-cost denominator (good output) for cost per unit.
    - table: fact_finance
      description: P&L facts (Net Sales, COGS, OpEx, Plan OpEx, Material Cost) per entity-month for COGS % and OpEx-vs-plan control.
    - table: fact_labor
      description: Labor Hours per plant-line-month for labor productivity and rate/efficiency variance.
    - table: fact_ops
      description: Output/Good/Scrap Units and standard rate per line-day for productivity and yield drivers (operations contract).
    - table: fact_quality
      description: Total/Good/Scrap/Rework Units and Defect Count per line-day for defect rate, yield, and cost-of-poor-quality (operations contract).
  required_dimensions:
    - name: dim_date
      grain_relevance: Month-level minimum for cost variance trending; week/day for operational yield and labor drivers.
    - name: dim_org
      grain_relevance: Plant/line attribution of unit cost and absorption; entity level for OpEx and COGS % control.
    - name: dim_product
      grain_relevance: Product/category-level material %, yield, and unit-cost mix analysis.
    - name: security_user_org
      grain_relevance: Row-level security so controllers see only their cost-centers (no individual employee attribution).
  preferred_grain: plant-line-product-month
  minimum_grain: plant-product-month (with entity-month for OpEx/COGS %)
  minimum_history_months: 24
  required_measures:
    - name: Unit Cost Amount
      formula_seed: "(Material Cost Amount + Labor Cost + Overhead Amount) / Output Units (good units)"
      source_id: SRC-001
    - name: COGS % of Sales
      formula_seed: "COGS Amount / Net Sales Amount × 100"
      source_id: SRC-006
    - name: Material Cost %
      formula_seed: "Material Cost Amount / COGS Amount × 100"
      source_id: SRC-006
    - name: OpEx vs Plan %
      formula_seed: "(OpEx Amount − Plan OpEx Amount) / Plan OpEx Amount × 100"
      source_id: SRC-002
    - name: Material Price Variance
      formula_seed: "Actual Quantity × (Standard Price − Actual Price)"
      source_id: SRC-004
    - name: Material Usage Variance
      formula_seed: "Standard Price × (Standard Quantity − Actual Quantity)"
      source_id: SRC-004
    - name: Labor Efficiency Variance
      formula_seed: "Standard Rate × (Standard Hours for actual output − Actual Hours)"
      source_id: SRC-004
    - name: Fixed Overhead Absorption / Volume Variance
      formula_seed: "(Actual Volume − Normal/Budgeted Volume) × Standard Fixed Overhead Rate"
      source_id: SRC-001
    - name: Yield %
      formula_seed: "Good Units / Total Units × 100"
      source_id: SRC-003
    - name: Cost of Poor Quality (Scrap + Rework) % of COGS
      formula_seed: "(Scrap + Rework cost) / COGS Amount × 100"
      source_id: SRC-007

