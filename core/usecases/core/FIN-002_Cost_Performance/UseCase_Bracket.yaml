schema_version: '2.0'
id: FIN-002
title: Cost Performance
domain: Finance / Operations
governance:
  owner_role: plant_ops_controllers
  steward_role: finance_bi_lead
orchestration:
  strategic_kpi_id: cost.unit.amount
  influencing_kpi_ids:
  - margin.cogs.pct
  - cost.opex.vs_plan.pct
  - cost.material.pct
  - ops.labor.productivity.pct
  - cost.base_volume.amount
  - cost.opex.base.amount
  - ops.production.volume
  - ops.quality.defect_rate.pct
  - ops.service_level.pct
  - ops.yield.pct
  supporting_kpi_ids:
  - sales.net_sales.amount
  action_code_ids:
  - F-K2.1
  - F-K2.2
  - F-K2.3
  - F-K2.4
value_driver_model:
  formula: cost.unit.amount = f(margin.cogs.pct, cost.opex.vs_plan.pct, cost.material.pct, ops.labor.productivity.pct, cost.base_volume.amount,
    cost.opex.base.amount, ops.production.volume, ops.quality.defect_rate.pct, ops.service_level.pct, ops.yield.pct)
  impact_direction: minimize
  primary_driver: margin.cogs.pct
  impact_logic: Improving margin.cogs.pct is the primary lever for minimizing cost.unit.amount.
ux_layout_rules:
  report_structure: 2-Page-Lead
  report_canvas: { width: 1920, height: 1080 }
  page_1_summary:
    title: Finance / Operations Summary & Insights
    template_id: pulse
    component_3s:
      kpi_id: cost.unit.amount
      visual_type: kpi_card
    component_30s:
    - kpi_id: margin.cogs.pct
      visual_type: trend_line
    - kpi_ids:
      - cost.opex.vs_plan.pct
      - cost.material.pct
      - ops.labor.productivity.pct
      visual_type: bar_chart
  page_2_execution:
    title: Finance / Operations Execution
    template_id: action_matrix
    component_300s:
      evidence_grain: plant_line_product_month
      evidence_columns:
      - entity
      - period
      - cost.unit.amount
      action_panel: true
      payload_mode: full
documentation:
  business_factsheet: ./Business_Factsheet.md
