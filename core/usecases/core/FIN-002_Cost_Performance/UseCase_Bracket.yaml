schema_version: '2.0'
id: FIN-002
title: Cost Performance
domain: Finance / Operations
governance:
  owner_role: plant_ops_controllers
  steward_role: finance_bi_lead
orchestration:
  strategic_kpi_id: cost.unit.amount
  influencing_kpi_ids:
  - margin.cogs.pct
  - cost.opex.vs_plan.pct
  - cost.material.pct
  - ops.labor.productivity.pct
  - ops.production.volume
  - ops.quality.defect_rate.pct
  - ops.yield.pct
  supporting_kpi_ids:
  - sales.net_sales.amount
  - cost.base_volume.amount
  - cost.opex.base.amount
  - ops.service_level.pct
  action_code_ids:
  - F-K2.1
  - F-K2.2
  - F-K2.3
  - F-K2.4
value_driver_model:
  formula: cost.unit.amount = f(margin.cogs.pct, cost.opex.vs_plan.pct, cost.material.pct, ops.labor.productivity.pct, ops.production.volume,
    ops.quality.defect_rate.pct, ops.yield.pct)
  impact_direction: minimize
  primary_driver: cost.material.pct
  impact_logic: Improving cost.material.pct is the primary lever for minimizing cost.unit.amount because material consumption and purchase discipline are the fastest structural levers before broader labor or overhead redesign is needed.
ux_layout_rules:
  report_structure: 2-Page-Lead
  report_canvas: { width: 1920, height: 1080 }
  page_1_summary:
    title: Finance / Operations Summary & Insights
    page_type: T1_Strategic_Overview
    template_id: pulse
    decision_question: "Is input cost inflation being recovered in pricing and margin?"
    big_idea: "Input cost inflation is outpacing pricing recovery — COGS % is expanding and will erode operating margin within two quarters if not addressed."
    component_3s:
      kpi_id: cost.unit.amount
      visual_type: kpi_card
    component_30s:
    - slot_id: Main_1
      kpi_id: margin.cogs.pct
      visual_type: trend_line
    - kpi_ids:
      - cost.opex.vs_plan.pct
      - cost.material.pct
      - ops.labor.productivity.pct
      visual_type: bar_chart
  page_2_execution:
    title: Finance / Operations Execution
    page_type: T2_Tactical_Variance
    template_id: action_matrix
    component_300s:
      evidence_grain: plant_line_product_month
      evidence_columns:
      - entity
      - plant
      - line
      - product_category
      - cost.unit.amount
      - margin.cogs.pct
      - cost.material.pct
      - cost.opex.vs_plan.pct
      - ops.labor.productivity.pct
      - ops.production.volume
      - ops.quality.defect_rate.pct
      - ops.yield.pct
      - cost.unit.amount
      action_panel: true
      payload_mode: full
prioritization:
  business_value: high
  implementation_effort: high
  confidence: 0.75
  reach: division
  priority_score: 17
readiness:
  data_availability: partial
  org_capability: ready
  stakeholder_alignment: aligned
  overall_readiness: amber
overrides:
  data_contract_ref: core/data_contracts/domains/finance.yaml
documentation:
  business_factsheet: ./Business_Factsheet.md
