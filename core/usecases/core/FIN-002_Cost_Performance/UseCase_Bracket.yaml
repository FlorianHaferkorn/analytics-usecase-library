schema_version: '2.0'
id: FIN-002
title: Cost Performance
domain: Finance / Operations
governance:
  owner_role: plant_ops_controllers
  steward_role: finance_bi_lead
orchestration:
  strategic_kpi_id: cost.unit.amount
  influencing_kpi_ids:
  - margin.cogs.pct
  - cost.opex.vs_plan.pct
  - cost.material.pct
  - ops.labor.productivity.pct
  - ops.throughput.units
  - ops.quality.defect_rate.pct
  - ops.quality.pct
  supporting_kpi_ids:
  - sales.net_sales.amount
  - cost.base_volume.amount
  - cost.opex.base.amount
  - supply.otif.pct
  - supply.on_time.pct
  - supply.in_full.pct
  - supply.stockout_impact.pct
  - margin.ebitda.pct
  action_code_ids:
  - F-K2.1
  - F-K2.2
  - F-K2.3
  - F-K2.4
primary_kpi_ids:
  - cost.unit.amount
  - cost.material.pct

value_driver_model:
  formula: cost.unit.amount = f(margin.cogs.pct, cost.opex.vs_plan.pct, cost.material.pct, ops.labor.productivity.pct, ops.throughput.units,
    ops.quality.defect_rate.pct, ops.quality.pct)
  impact_direction: minimize
  primary_driver: cost.material.pct
  impact_logic: Improving cost.material.pct is the primary lever for minimizing cost.unit.amount because material consumption and purchase discipline are the fastest structural levers before broader labor or overhead redesign is needed.
ux_layout_rules:
  report_structure: 2-Page-Lead
  report_canvas: { width: 1920, height: 1080 }
  # R2.4 (Cut C2): migrated to the intent layer, COM-002 as reference pattern.
  intent_rules_version: 2
  title_statements_verified: false
  page_1_summary:
    title: Finance / Operations Summary & Insights
    page_type: T2_Tactical_Variance
    template_variant: T2_DriverBridge
    template_id: pulse
    decision_question: "Is unit cost deteriorating, and which entities have the largest OpEx variance?"
    big_idea: "Restore unit-cost performance by locating the worst entities before selecting the material, productivity, or OpEx lever."
    component_3s:
      kpi_id: cost.unit.amount
      visual_type: kpi_card_with_delta
      comparison: vs_plan
      status_logic: lower_is_better
    component_30s:
    - slot_id: Main_1
      kpi_id: cost.unit.amount
      visual_type: line_chart
      comparison: vs_plan
      question: "Is unit cost moving back toward Plan or deteriorating further?"
      message: "Unit-cost trend against Plan shows whether cost recovery is taking hold."
      so_what: "A persistent or widening gap requires entity-level diagnosis before a cost action is selected."
      category_field: dim_date.CalendarYearMonth
      action_code_id: F-K2.1
      unit: amount
    - slot_id: Main_2
      kpi_id: cost.opex.vs_plan.pct
      visual_type: variance_bar
      comparison: vs_plan
      question: "Which entities have the largest unfavorable OpEx variance?"
      message: "OpEx variance ranking isolates where controllable cost pressure is concentrated."
      so_what: "Worst-first prioritisation limits deeper diagnosis to the entities with the largest controllable variance."
      category_field: dim_org.Entity
      action_code_id: F-K2.4
      unit: rate
  page_2_execution:
    title: Finance / Operations Execution
    decision_question: "For the worst cost entities, is material, productivity, or OpEx the primary controllable driver?"
    page_type: T4_Prescriptive_Recommendation
    template_variant: T4_ActionDecision
    template_id: action_matrix
    component_300s:
      evidence_grain: plant_line_product_month
      slicer_field: dim_org.Entity
      # R2.4: deduped repeated cost.unit.amount; dropped plant/line (no
      # backing dimension table in Finance.SemanticModel -- dim_asset is
      # Operations-only, not joined here); cut ops.throughput.units/
      # ops.quality.pct (less central to the cost-recovery decision_question).
      evidence_columns:
      - dim_org.Entity
      - dim_product.Category
      - cost.unit.amount
      - margin.cogs.pct
      - cost.material.pct
      - cost.opex.vs_plan.pct
      - ops.labor.productivity.pct
      - ops.quality.defect_rate.pct
      action_panel: true
      payload_mode: summary
      sort_by:
        measure: cost.opex.vs_plan.pct
        direction: descending
      top_n: 20
      highlight_rule:
        column: cost.opex.vs_plan.pct
        type: data_bar
prioritization:
  business_value: high
  implementation_effort: high
  confidence: 0.75
  reach: division
  priority_score: 17
data_protection:
  # DSGVO Art. 25 Privacy by Design and by Default
  # Authority: core/templates/page_templates/governance/Data_Protection_Governance.md
  personal_data: false
  legal_basis: not_applicable
  data_minimisation: >
    Detail Matrix limited to cost-center and cost-category grain. Cost-center
    data is at organisational-unit level — no individual employee attribution.
    Row-level security applied at SemanticModel level.
  access_restriction: >
    finance_controlling_lead and finance_bi_lead roles; row-level security
    enforced by Finance.SemanticModel (cost-center filter per org role).
  dpia_required: false
  ai_generated_output: true
  ai_grounding_measure: >
    Active Actions Text (FIN) — DAX measure that reads current filter context
    and concatenates only triggered action texts. See Storytelling_Principles.md
    §13.
readiness:
  data_availability: partial
  org_capability: ready
  stakeholder_alignment: aligned
  overall_readiness: amber
overrides:
  data_contract_ref: core/data_contracts/domains/finance.yaml
documentation:
  business_factsheet: ./Business_Factsheet.md
  evidence_pack: ./Domain_Evidence_Pack.yaml

use_case_links:
  - use_case_id: COM-001
    link_type: depends_on
    reason: "FIN-002 unit cost model depends on Net Sales and GM% sourced from COM-001 to correctly separate volume effect from cost-structure effect."
