schema_version: '2.0'
id: FIN-002
name: Cost Performance
domain: Finance / Operations
governance:
  owner_role: Plant/Ops Controllers
  steward_role: Finance BI Lead / Ops Finance
  status: active
  last_review: '2026-02-12'
ontology_bracket:
  strategic_kpi_id: cost.unit.amount
  influencing_kpi_ids:
  - margin.cogs.pct
  - cost.opex.vs_plan.pct
  - cost.material.pct
  - ops.labor.productivity.pct
  - cost.base_volume.amount
  - cost.opex.base.amount
  - ops.production.volume
  - ops.quality.defect_rate.pct
  - ops.service_level.pct
  - ops.yield.pct
  action_code_ids:
  - F-K2.1
  - F-K2.2
  - F-K2.3
  - F-K2.4
value_driver_model:
  description: cost.unit.amount is driven by influencing KPIs and operational levers.
  formula: cost.unit.amount = f(margin.cogs.pct, cost.opex.vs_plan.pct, cost.material.pct,
    ops.labor.productivity.pct, cost.base_volume.amount, cost.opex.base.amount, ops.production.volume,
    ops.quality.defect_rate.pct, ops.service_level.pct, ops.yield.pct)
ux_layout_rules:
  report_structure: 2-Page-Lead
  page_1_summary_insights:
    title: Finance / Operations Summary & Insights
    3s_component: 'North Star: cost.unit.amount'
    30s_components: []
  page_2_execution:
    title: Finance / Operations Execution
    300s_components:
    - 'Evidence_Table: (define evidence table requirements)'
    - 'Action_Panel: Integrated Side-Panel for Subscribed Action Codes'
    - 'Payload_Injection: Show Level (L1-L3) and Steps from Action Code YAML'
documentation:
  business_factsheet: ./Business_Factsheet.md
  technical_factsheet: ./Technical_Factsheet.md
