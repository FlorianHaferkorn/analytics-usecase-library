schema_version: '2.0'
id: XD-002
title: Resource Utilization
domain: Experience / Service
governance:
  owner_role: service_operations_workforce_planning
  steward_role: workforce_management_service_ops_bi_lead
orchestration:
  strategic_kpi_id: res.utilization.pct
  influencing_kpi_ids:
  - res.occupancy.pct
  - svc.sla.attainment.pct
  - res.overtime.pct
  - res.shrinkage.pct
  - svc.backlog.count
  - svc.tickets.created.count
  action_code_ids:
  - X-R2.1
  - X-R2.2
  - X-R2.3
  - X-R2.4
value_driver_model:
  formula: res.utilization.pct = f(res.occupancy.pct, svc.sla.attainment.pct, res.overtime.pct, res.shrinkage.pct, svc.backlog.count,
    svc.tickets.created.count)
  impact_direction: maximize
  primary_driver: res.occupancy.pct
  impact_logic: Improving res.occupancy.pct is the primary lever for maximizing res.utilization.pct.
ux_layout_rules:
  report_structure: 2-Page-Lead
  report_canvas: { width: 1920, height: 1080 }
  page_1_summary:
    title: Experience / Service Summary & Insights
    template_id: pulse
    component_3s:
      kpi_id: res.utilization.pct
      visual_type: kpi_card
    component_30s:
    - kpi_id: res.occupancy.pct
      visual_type: trend_line
    - kpi_ids:
      - svc.sla.attainment.pct
      - res.overtime.pct
      - res.shrinkage.pct
      visual_type: bar_chart
  page_2_execution:
    title: Experience / Service Execution
    template_id: action_matrix
    component_300s:
      evidence_grain: agent_day
      evidence_columns:
      - entity
      - period
      - res.utilization.pct
      action_panel: true
      payload_mode: full
prioritization:
  business_value: medium
  implementation_effort: medium
  confidence: 0.7
  reach: division
  priority_score: 16
readiness:
  data_availability: partial
  org_capability: developing
  stakeholder_alignment: partial
  overall_readiness: amber
overrides:
  data_contract_ref: core/data_contracts/domains/efficiency.yaml
documentation:
  business_factsheet: ./Business_Factsheet.md
