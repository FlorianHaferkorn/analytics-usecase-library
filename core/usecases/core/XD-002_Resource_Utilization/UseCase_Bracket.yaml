schema_version: '2.0'
id: XD-002
name: Resource Utilization
domain: Experience / Service
governance:
  owner_role: Service Operations / Workforce Planning
  steward_role: Workforce Management / Service Ops BI Lead
  status: active
  last_review: '2026-02-12'
ontology_bracket:
  strategic_kpi_id: res.utilization.pct
  influencing_kpi_ids:
  - res.occupancy.pct
  - svc.sla.attainment.pct
  - res.overtime.pct
  - res.shrinkage.pct
  - svc.backlog.count
  - svc.tickets.created.count
  action_code_ids:
  - X-R2.1
  - X-R2.2
  - X-R2.3
  - X-R2.4
value_driver_model:
  description: res.utilization.pct is driven by influencing KPIs and operational levers.
  formula: res.utilization.pct = f(res.occupancy.pct, svc.sla.attainment.pct, res.overtime.pct,
    res.shrinkage.pct, svc.backlog.count, svc.tickets.created.count)
ux_layout_rules:
  report_structure: 2-Page-Lead
  page_1_summary_insights:
    title: Experience / Service Summary & Insights
    3s_component: 'North Star: res.utilization.pct'
    30s_components: []
  page_2_execution:
    title: Experience / Service Execution
    300s_components:
    - 'Evidence_Table: (define evidence table requirements)'
    - 'Action_Panel: Integrated Side-Panel for Subscribed Action Codes'
    - 'Payload_Injection: Show Level (L1-L3) and Steps from Action Code YAML'
documentation:
  business_factsheet: ./Business_Factsheet.md
  technical_factsheet: ./Technical_Factsheet.md
