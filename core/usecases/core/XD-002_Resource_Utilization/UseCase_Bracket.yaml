schema_version: '2.0'
id: XD-002
title: Resource Utilization
domain: Experience / Service
governance:
  owner_role: service_operations_workforce_planning
  steward_role: workforce_management_service_ops_bi_lead
orchestration:
  strategic_kpi_id: KPI-SVC-009
  influencing_kpi_ids:
  - KPI-SVC-010
  - KPI-SVC-004
  - KPI-SVC-011
  - KPI-SVC-012
  - KPI-SVC-007
  - KPI-SVC-013
  supporting_kpi_ids:
  - KPI-SVC-005
  - KPI-SVC-006
  - KPI-SVC-008
  - KPI-SVC-014
  action_code_ids:
  - X-R2.1
  - X-R2.2
  - X-R2.3
  - X-R2.4
primary_kpi_ids:
  - KPI-SVC-009
  - KPI-SVC-010

value_driver_model:
  formula: KPI-SVC-009 = f(KPI-SVC-010, KPI-SVC-004, KPI-SVC-011, KPI-SVC-012, KPI-SVC-007,
    KPI-SVC-013)
  impact_direction: maximize
  primary_driver: KPI-SVC-010
  impact_logic: Improving KPI-SVC-010 is the primary capacity lever for maximizing KPI-SVC-009 while overtime, shrinkage, and backlog remain within acceptable bounds.
ux_layout_rules:
  report_structure: 2-Page-Lead
  report_canvas: { width: 1920, height: 1080 }
  # R2.4 (Cut C2): migrated to the intent layer, COM-002 as reference pattern.
  intent_rules_version: 2
  page_1_summary:
    title: Experience / Service Summary & Insights
    page_type: T1_Strategic_Overview
    template_variant: T1_Portfolio
    template_id: pulse
    decision_question: "Is resource utilization sustainable without degrading service quality?"
    big_idea: "Resource utilization is above sustainable threshold — occupancy peaks in two teams are creating burnout risk and reducing service quality consistency."
    component_3s:
      kpi_id: KPI-SVC-009
      visual_type: kpi_card_with_delta
      comparison: vs_plan
      status_logic: higher_is_better
    component_30s:
    - slot_id: Main_1
      kpi_id: KPI-SVC-010
      visual_type: line_chart
      question: "Is resource utilization sustainable, or are teams overloaded?"
      message: Resource occupancy is running at sustained overload in a few teams
      so_what: "Sustained overload in those teams threatens the service-quality consistency the SLA depends on."
      unit: ratio
    - slot_id: Main_2
      kpi_ids:
      - KPI-SVC-004
      - KPI-SVC-011
      - KPI-SVC-012
      # R6.3 (23.09.2026): Kennzahlen gegensaetzlicher Richtung auf einer Balkenachse
      # (Knock-out mixed-polarity). Je Einheit eine Zeile, je Signal eine Spalte.
      visual_type: exception_table
      category_field: dim_org.OrgName
      question: "What are utilization's quality trade-offs?"
      message: SLA attainment, overtime, and shrinkage — utilization's three quality trade-offs.
      so_what: "Overtime absorbing the gap today is not sustainable — it is the early signal of the capacity shortfall to come."
      unit: ratio
  page_2_execution:
    title: Workforce Balance & Execution
    decision_question: "Where should we rebalance capacity to relieve overload without breaching SLA?"
    page_type: T3_Operational_Monitoring
    template_variant: T3_ProcessControl
    template_id: action_matrix
    component_300s:
      evidence_grain: agent_day
      # R2.4: dropped 'agent_group' -- no backing dimension table anywhere in
      # Experience.SemanticModel today, so the generator could not resolve it
      # (would silently become a bogus _Measures.agent_group reference, the
      # same failure class as R2.3's "sku" bug). NOTE: the data_minimisation
      # note below still describes agent_group as the intended privacy grain
      # -- that's the target design, not yet backed by a real dimension;
      # tracked separately, not fixed here.
      evidence_columns:
      - entity
      - queue
      - channel
      - KPI-SVC-009
      - KPI-SVC-010
      - KPI-SVC-011
      - KPI-SVC-012
      action_panel: true
      payload_mode: full
      sort_by:
        measure: KPI-SVC-009
        direction: descending
      top_n: 20
      highlight_rule:
        column: KPI-SVC-009
        type: data_bar
prioritization:
  business_value: medium
  implementation_effort: medium
  confidence: 0.7
  reach: division
  priority_score: 16
data_protection:
  # DSGVO Art. 25 Privacy by Design and by Default
  # Authority: core/templates/page_templates/governance/Data_Protection_Governance.md
  personal_data: true
  personal_data_categories:
    - performance_data
  legal_basis: art6_1b_contract
  data_minimisation: >
    Detail Matrix limited to agent_group grain — individual agent metrics are
    aggregated before display; groups with fewer than 5 agents apply statistical
    disclosure limitation. Raw agent_day records are not exposed in the report
    layer.
  retention_period_days: 90
  access_restriction: >
    service_operations_workforce_planning and
    workforce_management_service_ops_bi_lead roles only; row-level security
    enforced by Experience.SemanticModel. Individual agent records not
    accessible via report drill-through.
  dpia_required: false
  ai_generated_output: true
  ai_grounding_measure: >
    Active Actions Text (XD) — DAX measure that reads current filter context and
    concatenates only triggered action texts. See Storytelling_Principles.md
    §13.
readiness:
  data_availability: partial
  org_capability: developing
  stakeholder_alignment: partial
  overall_readiness: amber
overrides:
  data_contract_ref: core/data_contracts/domains/experience.yaml
documentation:
  business_factsheet: ./Business_Factsheet.md
  evidence_pack: ./Domain_Evidence_Pack.yaml

use_case_links:
  - use_case_id: COM-003
    link_type: feeds_into
    reason: "Workforce utilisation and SLA attainment from XD-002 are upstream levers that directly affect customer retention and CLV in COM-003."
