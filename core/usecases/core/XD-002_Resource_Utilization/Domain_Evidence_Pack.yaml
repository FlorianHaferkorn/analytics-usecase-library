mapping_readiness:
  kpi_catalog_coverage: partial
  factsheet_coverage: complete
  bracket_coverage: partial
  action_code_coverage: partial
  semantic_model_coverage: partial

  gap_summary:
    content_gaps:
      - gap_type: content_gap
        severity: medium
        affected_artifact: core/usecases/core/XD-002_Resource_Utilization/UseCase_Bracket.yaml
        field: orchestration.supporting_kpi_ids
        description: >
          Diagnostic KPIs from the domain model (res.schedule_adherence.pct, res.shrinkage.unplanned.pct,
          res.idle.pct, res.forecast_accuracy.pct) are not represented. They are required to separate
          actionable unplanned shrinkage from planned, and routing imbalance from genuine overstaffing.
        evidence_reference: SRC-002 SRC-006 SRC-007
        remediation: "Add adherence, unplanned-shrinkage, idle, and forecast-accuracy diagnostics to supporting_kpi_ids. Close when DEP approved."
        status: deferred
        resolution: "Blocked by model_gap: schedule-adherence / unplanned-shrinkage / idle / forecast-accuracy KPIs not yet in catalog or experience contract."

      - gap_type: content_gap
        severity: medium
        affected_artifact: core/usecases/core/XD-002_Resource_Utilization/Business_Factsheet.md
        field: "Section 8 Success Criteria"
        description: >
          Benchmark bands not quantified: utilization sustainable band, occupancy ~80–85% ceiling,
          shrinkage 30–35% norm, overtime <8%, adherence ~90%. Section 8 states qualitative goals only.
        evidence_reference: SRC-002 SRC-006 SRC-008
        remediation: "Add quantified target bands to Section 8. Close when DEP approved."
        status: resolved
        resolution: "Section 8 Success Criteria now states grounded benchmark bands — utilization sustainable band, occupancy ~80–85% ceiling, shrinkage 30–35% norm, overtime <8%, schedule adherence ~90% (SWPP/ICMI/COPC WFM practice)."

    mapping_gaps:
      - gap_type: mapping_gap
        severity: high
        affected_artifact: core/usecases/core/XD-002_Resource_Utilization/UseCase_Bracket.yaml
        field: ux_layout_rules.page_1_summary.component_30s (Main_1)
        description: >
          Main_1 trend shows KPI-SVC-010 (the primary driver) rather than the strategic KPI
          KPI-SVC-009. Domain evidence requires the strategic KPI as the lead trend with the
          target band, answering 'Is utilization sustainable?' before 'Why?'. Occupancy belongs in Main_2.
        evidence_reference: SRC-002 SRC-006
        remediation: "Set Main_1 kpi_id to KPI-SVC-009 vs target band; move occupancy to Main_2. Close when DEP approved."
        status: rejected
        resolution: "Strategic KPI (KPI-SVC-009) is already the 3-second headline card; Main_1 correctly leads with the occupancy driver, consistent with COM-001. No change."

      - gap_type: mapping_gap
        severity: medium
        affected_artifact: core/usecases/core/XD-002_Resource_Utilization/UseCase_Bracket.yaml
        field: ux_layout_rules.page_1_summary.component_30s (occupancy visual band)
        description: >
          Occupancy should be displayed against a sustainable-ceiling band (~85–90% upper bound), not as
          a maximize-to-100% metric. Without the ceiling overlay the visual invites the burnout
          anti-pattern of pushing occupancy ever higher.
        evidence_reference: SRC-002 SRC-008
        remediation: "Add an upper-ceiling band overlay (~85–90%) to the occupancy visual. Close when DEP approved."
        status: deferred
        resolution: "Occupancy upper-ceiling band overlay (~85–90%) is a bracket-visual/generator change; defer."

    schema_gaps: []
    generator_gaps: []

    model_gaps:
      - gap_type: model_gap
        severity: high
        affected_artifact: core/data_contracts/domains/experience.yaml
        field: fact_workforce_management (schedule adherence / planned shrinkage)
        description: >
          The contract has Shrinkage Minutes but no scheduled/on-task time or planned-shrinkage baseline,
          so Schedule Adherence % and Unplanned Shrinkage % (the actionable levers) cannot be computed.
          Total shrinkage alone cannot separate budgeted from controllable shrinkage.
        evidence_reference: SRC-006 SRC-007
        remediation: >
          Add scheduled on-task minutes and a planned-shrinkage baseline to fact_workforce_management
          and Experience.SemanticModel; define Schedule Adherence % and Unplanned Shrinkage % measures.
        status: deferred
        resolution: "Requires experience data-contract changes (scheduled on-task minutes + planned-shrinkage baseline; forecast vs actual volume/AHT fact)."

      - gap_type: model_gap
        severity: medium
        affected_artifact: core/data_contracts/domains/experience.yaml
        field: forecast vs actual (forecast accuracy)
        description: >
          No forecast (volume/AHT) versus actual records exist, so Forecast Accuracy % cannot be
          computed. Without it, structural over/under-staffing from poor forecasts is indistinguishable
          from floor-level scheduling issues, weakening the capacity-model re-run trigger (X-R2.2).
        evidence_reference: SRC-004 SRC-005
        remediation: >
          Add a forecast fact (forecast volume/AHT vs actuals) to the experience contract and a
          Forecast Accuracy % measure to Experience.SemanticModel.
        status: deferred
        resolution: "Requires experience data-contract changes (scheduled on-task minutes + planned-shrinkage baseline; forecast vs actual volume/AHT fact)."
