  kpi_catalog_coverage: complete
  factsheet_coverage: complete
  bracket_coverage: complete
  action_code_coverage: complete
  semantic_model_coverage: partial

  gap_summary:
    content_gaps:
      - gap_type: content_gap
        severity: medium
        affected_artifact: core/usecases/core/XD-002_Resource_Utilization/Business_Factsheet.md
        field: "Section 8 Success Criteria / benchmark targets"
        description: >
          Benchmark targets not stated: sustainable utilization/occupancy band 75–85% with the
