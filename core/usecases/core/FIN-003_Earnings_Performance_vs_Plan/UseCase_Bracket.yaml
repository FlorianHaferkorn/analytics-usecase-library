schema_version: '2.0'
id: FIN-003
title: Earnings Performance vs Plan
domain: Finance
governance:
  owner_role: finance_controlling_fpa
  steward_role: finance_bi_lead
orchestration:
  strategic_kpi_id: KPI-FIN-018
  # 24.10.2026 (Entscheid Florian Haferkorn, Weg b): KPI-COM-013 und KPI-COM-009 rechnen auf
  # fact_sales, das das Finance-Modell nicht fuehrt. Gross Margin % weicht KPI-FIN-016 (COGS %
  # of Sales, fact_finance, Kehrwert-Aussage); Net Sales % vs Plan bleibt Treiber in der Formel,
  # steht aber unter supporting, damit keine Karte ins Leere bindet.
  influencing_kpi_ids:
  - KPI-FIN-021
  - KPI-FIN-016
  - KPI-FIN-014
  supporting_kpi_ids:
  - KPI-FIN-020
  - KPI-COM-009
  - KPI-FIN-009
  # Required for report creation (referenced by the value-driver / evidence) but
  # previously unlisted — added so the orchestration completeness gate resolves.
  - KPI-FIN-011
  - KPI-COM-005
  action_code_ids:
  - F-E1.1
primary_kpi_ids:
- KPI-FIN-018
- KPI-FIN-014
value_driver_model:
  formula: KPI-FIN-018 = f(KPI-COM-009, KPI-FIN-016, KPI-FIN-014)
  impact_direction: maximize
  primary_driver: KPI-FIN-014
  impact_logic: Bringing KPI-FIN-014 back to plan is the primary lever for restoring KPI-FIN-018.
ux_layout_rules:
  report_structure: 2-Page-Lead
  report_canvas:
    width: 1920
    height: 1080
  intent_rules_version: 2
  page_1_summary:
    title: Finance Summary & Insights
    page_type: T3_Operational_Monitoring
    template_variant: T3_ProcessControl
    template_id: pulse
    decision_question: Is EBITDA tracking plan, and if not, which lever is the cause?
    big_idea: EBITDA margin is trailing plan and the gap is opex-led, while revenue and gross margin hold.
    component_3s:
      kpi_id: KPI-FIN-018
      visual_type: kpi_card_with_delta
      comparison: vs_plan
      status_logic: higher_is_better
    component_30s:
    - slot_id: Main_1
      kpi_id: KPI-FIN-021
      visual_type: line_chart
      question: Is the earnings gap a revenue, gross-margin or opex problem?
      message: The EBITDA-margin gap versus plan is opex-led, while revenue and gross margin hold
      so_what: Because opex is the driver, cost-base actions recover more earnings than chasing incremental
        revenue.
      unit: rate
    # 24.10.2026: vorher KPI-COM-013 (ratio, hoeher besser) und KPI-FIN-014 (rate, niedriger
    # besser) auf einer Balkenachse -- ONE_MESSAGE_PER_CHART und gemischte Polaritaet. Die
    # Kostenquote (KPI-FIN-016) steht in der Evidenztabelle; die Karte rankt nur, was das so_what sagt.
    - slot_id: Main_2
      kpi_id: KPI-FIN-014
      visual_type: horizontal_bar_chart
      question: Where does operating expense run above plan?
      message: Operating expense above plan is where the earnings leak concentrates
      so_what: Ranking opex overruns by entity focuses the recovery where the money actually leaks.
      unit: rate
  page_2_execution:
    title: Finance Execution
    decision_question: Which entities should the earnings-recovery effort target first?
    page_type: T4_Prescriptive_Recommendation
    template_variant: T4_ActionDecision
    template_id: action_matrix
    component_300s:
      # 24.10.2026 (Entscheid Florian Haferkorn, Option b): Entity-Koernung. dim_cost_center
      # haengt nur an fact_opex_costcenter; KPI-FIN-018/021/020/016 ignorieren
      # den Kostenstellenfilter, eine Kostenstellen-Zeile wiederholte vier von fuenf Werten.
      # Kostenstellen-Sicht als Drillthrough offen: der Prototyp-Renderer kann keine eigene
      # Drillthrough-Seite, der offizielle Emitter noch nicht (technical_backlog, FIN-003).
      evidence_grain: entity_month
      evidence_columns:
      - entity
      - KPI-FIN-018
      - KPI-FIN-021
      - KPI-FIN-016
      - KPI-FIN-014
      - KPI-FIN-020
      action_panel: true
      payload_mode: full
      sort_by:
        measure: KPI-FIN-021
        direction: ascending
      top_n: 20
      highlight_rule:
        column: KPI-FIN-021
        type: data_bar
prioritization:
  business_value: high
  implementation_effort: medium
  confidence: 0.6
  reach: division
  priority_score: 20
data_protection:
  personal_data: false
  legal_basis: not_applicable
  data_minimisation: Detail grain limited to entity level; row-level security applied at SemanticModel
    level.
  access_restriction: 'supply_chain_controlling_lead and scm_bi_lead roles; row-level security enforced
    by SupplyChain.SemanticModel (site filter per org role).

    '
  dpia_required: false
  ai_generated_output: true
  ai_grounding_measure: 'Active Actions Text (SCM) — DAX measure that reads current filter context and
    concatenates only triggered action texts. See Storytelling_Principles.md §13.

    '
readiness:
  data_availability: missing
  org_capability: developing
  stakeholder_alignment: aligned
  overall_readiness: amber
overrides:
  data_contract_ref: core/data_contracts/domains/finance.yaml
documentation:
  business_factsheet: ./Business_Factsheet.md
