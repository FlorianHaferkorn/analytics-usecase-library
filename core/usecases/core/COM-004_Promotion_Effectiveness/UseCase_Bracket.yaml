schema_version: '2.0'
id: COM-004
title: Promotion Effectiveness
domain: Commercial
governance:
  owner_role: revenue_growth_management_commercial_controlling
  steward_role: trade_marketing_commercial_bi_lead
orchestration:
  strategic_kpi_id: sales.promo.roi.pct
  influencing_kpi_ids:
  - sales.promo.incremental.amount
  - margin.promo.gm.pct
  - sales.price.list.amount
  - sales.price.net.amount
  - sales.price.realization_pct
  - sales.promo.cannibalization.pct
  supporting_kpi_ids:
  - cost.cogs.amount
  - sales.promo.baseline_sales.amount
  - sales.promo.cannibalized_sales.amount
  - sales.promo.cost.amount
  - sales.promo.incremental_gm.amount
  - sales.pvm.volume_effect.amount
  action_code_ids:
  - C-M2.1
  - C-S1.1
  - C-M2.2
  - C-P4.1
  - C-S1.2
value_driver_model:
  formula: sales.promo.roi.pct = f(sales.promo.incremental.amount, margin.promo.gm.pct, sales.price.realization_pct, sales.promo.cannibalization.pct)
  impact_direction: maximize
  primary_driver: sales.promo.incremental.amount
  impact_logic: Improving sales.promo.incremental.amount is the primary lever for maximizing sales.promo.roi.pct.
ux_layout_rules:
  report_structure: 2-Page-Lead
  report_canvas: { width: 1920, height: 1080 }
  page_1_summary:
    title: Commercial Summary & Insights
    page_type: T1_Strategic_Overview
    template_id: pulse
    component_3s:
      kpi_id: sales.promo.roi.pct
      visual_type: kpi_card
    component_30s:
    - kpi_id: sales.promo.incremental.amount
      visual_type: trend_line
    - kpi_ids:
      - margin.promo.gm.pct
      - sales.price.realization_pct
      - sales.promo.cannibalization.pct
      visual_type: bar_chart
  page_2_execution:
    title: Commercial Execution
    page_type: T2_Tactical_Variance
    template_id: action_matrix
    component_300s:
      evidence_grain: promotion
      evidence_columns:
      - entity
      - period
      - sales.promo.roi.pct
      action_panel: true
      payload_mode: full
overrides:
  data_contract_ref: core/data_contracts/domains/commercial_sales.yaml
documentation:
  business_factsheet: ./Business_Factsheet.md
