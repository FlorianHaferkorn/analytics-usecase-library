schema_version: '2.0'
id: COM-004
name: Promotion Effectiveness
domain: Commercial
governance:
  owner_role: Revenue Growth Management / Commercial Controlling
  steward_role: Trade Marketing / Commercial BI Lead
  status: active
  last_review: '2026-02-12'
ontology_bracket:
  strategic_kpi_id: sales.promo.roi.pct
  influencing_kpi_ids:
  - sales.promo.incremental.amount
  - margin.promo.gm.pct
  - sales.price.realization_pct
  - sales.promo.cannibalization.pct
  action_code_ids:
  - C-M2.1
  - C-S1.1
  - C-M2.2
  - C-P4.1
  - C-S1.2
value_driver_model:
  description: sales.promo.roi.pct is driven by influencing KPIs and operational levers.
  formula: sales.promo.roi.pct = f(sales.promo.incremental.amount, margin.promo.gm.pct,
    sales.price.realization_pct, sales.promo.cannibalization.pct)
ux_layout_rules:
  report_structure: 2-Page-Lead
  page_1_summary_insights:
    title: Commercial Summary & Insights
    3s_component: 'North Star: sales.promo.roi.pct'
    30s_components: []
  page_2_execution:
    title: Commercial Execution
    300s_components:
    - 'Evidence_Table: (define evidence table requirements)'
    - 'Action_Panel: Integrated Side-Panel for Subscribed Action Codes'
    - 'Payload_Injection: Show Level (L1-L3) and Steps from Action Code YAML'
documentation:
  business_factsheet: ./Business_Factsheet.md
  technical_factsheet: ./Technical_Factsheet.md
