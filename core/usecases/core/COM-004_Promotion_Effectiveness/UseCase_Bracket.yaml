schema_version: '2.0'
id: COM-004
title: Promotion Effectiveness
domain: Commercial
governance:
  owner_role: revenue_growth_management_commercial_controlling
  steward_role: trade_marketing_commercial_bi_lead
orchestration:
  strategic_kpi_id: sales.promo.roi.pct
  influencing_kpi_ids:
  - sales.promo.incremental.amount
  - margin.promo.gm.pct
  - sales.price.list.amount
  - sales.price.net.amount
  - sales.price.realization_pct
  - sales.promo.cannibalization.pct
  supporting_kpi_ids:
  - cost.cogs.amount
  - sales.net_sales.amount
  - sales.promo.baseline_sales.amount
  - sales.promo.cannibalized_sales.amount
  - sales.promo.cost.amount
  - sales.promo.incremental_gm.amount
  - sales.pvm.price_effect.amount
  - sales.pvm.volume_effect.amount
  action_code_ids:
  - C-P4.1
  - C-M2.1
  - C-M2.2
primary_kpi_ids:
  - sales.promo.roi.pct
  - sales.promo.incremental.amount

value_driver_model:
  formula: sales.promo.roi.pct = f(sales.promo.incremental.amount, margin.promo.gm.pct, sales.price.realization_pct, sales.promo.cannibalization.pct)
  impact_direction: maximize
  primary_driver: sales.promo.incremental.amount
  impact_logic: Improving sales.promo.incremental.amount is the primary lever for maximizing sales.promo.roi.pct.
ux_layout_rules:
  report_structure: 2-Page-Lead
  report_canvas: { width: 1920, height: 1080 }
  # R2.4 (Cut C2): migrated to the intent layer, COM-002 as reference pattern.
  intent_rules_version: 2
  page_1_summary:
    title: Commercial Summary & Insights
    page_type: T1_Strategic_Overview
    template_variant: T1_Portfolio
    template_id: pulse
    decision_question: "Are our promotions generating profitable incremental volume?"
    big_idea: "Promotion ROI is below threshold — cannibalization and insufficient incremental lift signal that promotional mechanics need redesign before next campaign cycle."
    component_3s:
      kpi_id: sales.promo.roi.pct
      visual_type: kpi_card_with_delta
      comparison: vs_plan
      status_logic: higher_is_better
    component_30s:
    - slot_id: Main_1
      kpi_id: sales.promo.incremental.amount
      visual_type: line_chart
      question: "Are promotions generating enough incremental lift to justify the spend?"
      message: Incremental promo lift is running too low to justify the spend behind it
      so_what: "If incremental lift stays this low, promo spend is subsidising sales that would have happened anyway."
      unit: amount
    - slot_id: Main_2
      # R2.4: was 3 KPIs of 2 different calc_types (ratio vs. rate) on one axis
      # -- a ONE_MESSAGE_PER_CHART violation. sales.price.realization_pct and
      # sales.promo.cannibalization.pct moved to the Detail_Matrix instead.
      kpi_id: margin.promo.gm.pct
      visual_type: horizontal_bar_chart
      question: "Why is promo ROI missing target?"
      message: Thin promo margins are being eroded by cannibalization, pulling ROI below target
      so_what: "High cannibalization eating into thin promo margin is why ROI is missing target — mechanics need redesign, not more spend."
      unit: ratio
  page_2_execution:
    title: Commercial Execution
    decision_question: "Which promotions should we redesign, pause, or scale?"
    page_type: T4_Prescriptive_Recommendation
    template_variant: T4_ActionDecision
    template_id: action_matrix
    component_300s:
      evidence_grain: promo_product_period
      # R2.4: curated 12→8. Cut region/channel (redundant cross-cut once
      # promotion/mechanic/product_category are shown); cut sales.promo.cost.amount
      # (cost is implicit in ROI, the headline variance signal below).
      evidence_columns:
      - promotion
      - product_category
      - mechanic
      - sales.promo.incremental.amount
      - sales.promo.roi.pct
      - sales.price.realization_pct
      - sales.promo.cannibalization.pct
      - sales.promo.incremental_gm.amount
      action_panel: true
      payload_mode: full
      sort_by:
        measure: sales.promo.roi.pct
        direction: ascending
      top_n: 20
      highlight_rule:
        column: sales.promo.roi.pct
        type: data_bar
prioritization:
  business_value: high
  implementation_effort: high
  confidence: 0.65
  reach: division
  priority_score: 14
data_protection:
  # DSGVO Art. 25 Privacy by Design and by Default
  # Authority: core/templates/page_templates/governance/Data_Protection_Governance.md
  personal_data: false
  legal_basis: not_applicable
  data_minimisation: >
    Detail Matrix limited to promotion and product-category grain. No
    individual-level customer or employee data is exposed. Row-level security
    applied at SemanticModel level.
  access_restriction: >
    commercial_controlling_lead and sales_bi_lead roles; row-level security
    enforced by Commercial.SemanticModel (entity filter per org role).
  dpia_required: false
  ai_generated_output: true
  ai_grounding_measure: >
    Active Actions Text (COM) — DAX measure that reads current filter context
    and concatenates only triggered action texts. See Storytelling_Principles.md
    §13.
readiness:
  data_availability: partial
  org_capability: developing
  stakeholder_alignment: aligned
  overall_readiness: amber
overrides:
  data_contract_ref: core/data_contracts/domains/commercial_sales.yaml
documentation:
  business_factsheet: ./Business_Factsheet.md
  evidence_pack: ./Domain_Evidence_Pack.yaml
use_case_links:
  - use_case_id: COM-IND-R001
    link_type: peer_context
    reason: "Promotion attachment mechanics are shared with COM-IND-R001 basket/category cross-sell — promotion ROI and cross-sell lift must be read together to avoid double-counting incremental revenue (reciprocal of the COM-IND-R001 peer_context link)."
