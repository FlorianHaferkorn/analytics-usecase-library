evidence_pack_version: "1.0"
use_case_id: COM-004
use_case_title: Promotion Effectiveness
domain: Commercial
authored_date: "2026-06-11"
authored_by: framework-architect-agent
reviewed_by: ""
status: draft

process_scope:
  description: >
    Post-event and in-flight evaluation of trade and consumer promotions against true
    incremental sales, incremental gross margin, and promotion ROI. Covers baseline
    decomposition (separating promotional uplift from baseline demand), price realization
    leakage during promo windows, cannibalization and pull-forward effects, and prescriptive
    redesign of promo mechanics. Anchored in Revenue Growth Management (RGM) and Trade
    Promotion Management/Optimization (TPM/TPO) practice for B2B/B2C manufacturers.
  in_scope:
    - Promotion ROI % measured on incremental gross margin net of promo cost (not apparent gross uplift)
    - Baseline vs incremental sales decomposition (true lift net of pull-forward and cannibalization)
    - Cannibalization % across related SKUs and product families within a promotion window
    - Price realization (net vs list) leakage from discounts, rebates, and surcharges during promos
    - Promo gross margin % vs standard gross margin % as a profitability guardrail
    - Mechanic, depth, timing, channel, and category targeting of promotional investment
  out_of_scope:
    - Long-term list pricing strategy and price architecture (COM-002)
    - Assortment and range optimization
    - Omni-channel mix and channel strategy (COM-009)
    - Marketing-mix media attribution and above-the-line advertising effectiveness
  industry_segment: B2B and B2C consumer goods manufacturing/distribution (FMCG/CPG-style trade promotions)
  applicable_frameworks:
    - name: APQC PCF Category 3.0 — Market and Sell Products and Services (3.3 Manage advertising, pricing, and promotional activities)
      id: APQC-PCF-3
    - name: Revenue Growth Management (RGM) / Trade Promotion Management & Optimization (TPM/TPO) practice framework
      id: RGM-TPM-TPO
    - name: ESMA Guidelines on Alternative Performance Measures (ratio/ROI disclosure and reconciliation discipline)
      id: ESMA-APM-2015

canonical_domain_model:
  outcome_kpis:
    - id: sales.promo.roi.pct
      name: Promotion ROI %
      definition: >
        Incremental gross margin generated by a promotion divided by total promotion cost,
        expressed as a percentage. The strategic profitability outcome of a promotion.
        Formula intent: Incremental Gross Margin / Promo Cost × 100.
      unit: "%"
      direction: maximize
      benchmark_target: ">=120% (>1.2x payback); 30-40% of promotions typically destroy value with negative ROI (Simon-Kucher)"
      benchmark_source_id: SRC-007

    - id: sales.promo.incremental.amount
      name: Incremental Sales Amount
      role: co-outcome
      definition: >
        Sales causally attributable to the promotion, equal to actual promo-period sales
        minus modelled baseline sales, net of pull-forward and cannibalization. The volume
        outcome that ROI is built on.
      unit: EUR
      direction: maximize
      causal_mechanism: >
        Incremental sales are the numerator of value creation but only convert to ROI when
        priced and costed: positive incremental volume at a margin-destroying discount can
        still yield negative ROI. Reported alongside, not above, sales.promo.roi.pct.
      benchmark_target: "True incremental lift only ~one-third of apparent promo bump on average (Van Heerde et al.)"
      benchmark_source_id: SRC-004

  driver_kpis:
    - id: margin.promo.gm.pct
      name: Promo Gross Margin %
      definition: "(Promo Net Sales - Promo COGS) / Promo Net Sales × 100 during the promotion window."
      unit: "%"
      direction: maximize
      drives: sales.promo.roi.pct
      causal_mechanism: >
        ROI is incremental gross margin over promo cost; the margin rate on promoted units is
        the conversion factor from incremental volume to incremental profit. A promo GM% well
        below standard GM% mechanically suppresses ROI even when volume lifts.
      benchmark_target: "Promo GM% within 5-8pp of standard GM%; wider gap signals over-discounting"
      benchmark_source_id: SRC-009

    - id: sales.price.realization_pct
      name: Price Realization %
      definition: "Net Price Amount / List Price Amount × 100 — share of list price actually realized after discounts, rebates, and surcharges."
      unit: "%"
      direction: maximize
      drives: sales.promo.roi.pct
      causal_mechanism: >
        Promotions leak value through the discount ladder (off-invoice, rebates, allowances).
        Falling price realization during a promo directly compresses net sales and promo GM%,
        eroding ROI before any volume benefit is counted.
      benchmark_target: "Healthy promos sustain price realization above the channel norm; <75% flags deep-discount leakage"
      benchmark_source_id: SRC-001

    - id: sales.promo.cannibalization.pct
      name: Cannibalization %
      definition: >
        Share of apparent promo uplift sourced from sales shifted away from the brand's own
        related SKUs/product family rather than from new incremental demand. Cannibalized
        Sales / Apparent Uplift × 100.
      unit: "%"
      direction: minimize
      drives: sales.promo.incremental.amount
      causal_mechanism: >
        Higher cannibalization means a larger fraction of the bump is internal sales transfer,
        reducing true incremental sales and thus ROI. Cross-brand switching is the only source
        that creates genuine incremental category volume.
      benchmark_target: "Cross-brand switching averages ~33% of the bump (not 75%); high own-brand cannibalization is value-neutral"
      benchmark_source_id: SRC-005

  diagnostic_kpis:
    - id: sales.price.list.amount
      name: List Price Amount
      definition: Gross list (pre-discount) price value of promoted lines; the realization ceiling.
      unit: EUR
      direction: maximize
      diagnoses: sales.price.realization_pct
      causal_mechanism: Establishes the denominator for realization; isolates whether leakage is from list erosion or discount depth.

    - id: sales.price.net.amount
      name: Net Price Amount
      definition: Realized net price value of promoted lines after all discount components.
      unit: EUR
      direction: maximize
      diagnoses: sales.price.realization_pct
      causal_mechanism: Net vs list gap quantifies the discount/rebate/surcharge leakage driving realization down during promos.

    - id: sales.promo.incremental_gm.amount
      name: Incremental Gross Margin Amount
      definition: Gross margin on incremental (baseline-adjusted) promoted volume; the numerator of promotion ROI.
      unit: EUR
      direction: maximize
      diagnoses: sales.promo.roi.pct
      causal_mechanism: >
        Links incremental volume and promo GM% into the profit that ROI divides by promo cost;
        negative incremental GM is the decisive stop signal for a promotion.

    - id: sales.promo.baseline_sales.amount
      name: Baseline Sales Amount
      definition: Modelled non-promotional sales that would have occurred absent the promotion.
      unit: EUR
      direction: maximize
      diagnoses: sales.promo.incremental.amount
      causal_mechanism: >
        The baseline is the reference line for incrementality; a mis-specified (too low) baseline
        overstates uplift and ROI. Stability of the baseline assumption governs trust in the whole tree.

  guardrails:
    - description: Do not scale a promotion with negative incremental gross margin
      condition: >
        Do NOT trigger a scale-up or repeat action when sales.promo.incremental_gm.amount is
        negative or sales.promo.roi.pct is below 100%, even if sales.promo.incremental.amount
        (volume uplift) is strongly positive. Volume that loses margin destroys value.
      affected_kpis:
        - sales.promo.roi.pct
        - sales.promo.incremental_gm.amount
        - sales.promo.incremental.amount

    - description: Do not credit uplift dominated by own-brand cannibalization or pull-forward
      condition: >
        Do NOT treat apparent uplift as incremental when sales.promo.cannibalization.pct is high
        or the bump is concentrated in pull-forward/stockpiling. Re-base ROI on true incremental
        (cross-brand and category-expansion) volume before any continue/scale decision.
      affected_kpis:
        - sales.promo.incremental.amount
        - sales.promo.cannibalization.pct
        - sales.promo.roi.pct

    - description: Do not deepen discount when price realization is already eroded
      condition: >
        Do NOT increase promo depth to chase volume when sales.price.realization_pct is below the
        channel norm and margin.promo.gm.pct is below standard GM%; deeper discounts compound
        realization leakage faster than they add profitable volume.
      affected_kpis:
        - sales.price.realization_pct
        - margin.promo.gm.pct

  wrong_interpretations:
    - description: Reading apparent gross uplift as true incremental lift
      why_wrong: >
        The raw promo "bump" includes baseline sales, pull-forward (timing shifts), and
        cannibalization. On average only about one-third of the bump is genuinely incremental.
        Crediting the full bump overstates incremental sales and inflates ROI, leading to repeats
        of value-destroying promos.
      source_id: SRC-004

    - description: Ignoring cannibalization and treating own-brand switching as incremental
      why_wrong: >
        Sales shifted from a brand's own related SKUs/family create no new category volume. The
        common assumption that ~75% of the bump is brand switching is wrong; cross-brand switching
        (the only truly incremental source) averages ~33%. Ignoring cannibalization double-counts
        internal transfers as growth.
      source_id: SRC-005

    - description: Computing promotion ROI on revenue uplift without the margin and cost legs
      why_wrong: >
        ROI must divide incremental gross margin by promo cost. Measuring "ROI" on incremental
        revenue ignores discount-driven margin compression and trade spend, so a deeply discounted
        promo can show strong revenue lift yet negative true ROI. As a disclosed ratio APM, ROI
        must be defined and reconciled consistently.
      source_id: SRC-008

