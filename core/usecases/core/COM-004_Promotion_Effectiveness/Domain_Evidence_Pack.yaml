evidence_pack_version: "1.0"
use_case_id: COM-004
use_case_title: Promotion Effectiveness
domain: Commercial
authored_date: "2026-06-13"
authored_by: framework-architect-agent
reviewed_by: ""
status: draft

# ──────────────────────────────────────────
# 1. PROCESS SCOPE
# ──────────────────────────────────────────
process_scope:
  description: >
    Trade and consumer promotion effectiveness: whether promotional investment generates
    true incremental sales and gross margin rather than subsidising baseline demand. Isolates
    the promotion P&L — incremental lift above a measured baseline, the discount/realization
    leakage that erodes margin, cannibalization that offsets uplift, and the ROI that ties it
    together. Distinct from COM-002 (long-term pricing strategy) and COM-009 (omni-channel mix)
    — this use case evaluates the incremental return of a promotion event, not list-price
    architecture or channel allocation.
  in_scope:
    - Promotion ROI as the strategic outcome (incremental margin returned per unit of promo spend)
    - Incremental sales measured against a stable baseline (lift decomposition vs subsidised demand)
    - Promotion gross margin and price realization (list-to-net discount/rebate/surcharge leakage)
    - Cannibalization of related SKUs/baseline demand shifted into the promo window
    - Promotion-cost and incremental-GM reconstruction at campaign/event grain
    - Margin and baseline-integrity guardrails (no GM-destroying or baseline-eroding promotions)
  out_of_scope:
    - Long-term list-price and pack-price architecture (COM-002)
    - Assortment / range optimisation
    - Omni-channel mix and media allocation (COM-009)
    - Long-run brand-equity and loyalty measurement (separate brand use case)
  industry_segment: >
    Consumer packaged goods, retail, food & beverage, and any branded-goods environment where
    trade and consumer promotions are a material P&L line (typically 15–25% of gross revenue in
    CPG) and incremental lift must be separated from baseline subsidy.
  applicable_frameworks:
    - name: MASB Marketing Metric Audit Protocol (MMAP) — linking marketing metrics to financial outcomes
      id: MASB-MMAP
    - name: Return on Marketing Investment (ROMI) — contribution to profit net of marketing spend
      id: ROMI
    - name: Baseline & incremental-lift measurement (retail-measurement methodology)
      id: BASELINE-LIFT
    - name: Promotion P&L decomposition — switching / stockpiling / incremental lift
      id: PROMO-DECOMP
    - name: Price realization (list-to-net) and discount-depth elasticity
      id: PRICE-REALIZATION

# ──────────────────────────────────────────
# 2. CANONICAL DOMAIN MODEL (DRIVER TREE)
# ──────────────────────────────────────────
canonical_domain_model:
  outcome_kpis:
    - id: sales.promo.roi.pct
      name: Promotion ROI %
      definition: >
        Incremental Gross Margin generated by a promotion / Promotion Cost. The strategic
        outcome of the use case — whether promotional investment returns more incremental
        margin than it costs. A value above 100% (1.0x) clears breakeven; below it the
        promotion destroys margin (ROMI logic, MASB).
      unit: "%"
      direction: maximize
      benchmark_target: "ROI >= 120% (1.2x) target; globally ~59% of CPG promotions fail to break even (72% in the US)"
      benchmark_source_id: SRC-009
      framework_reference: "ROMI / MASB MMAP — contribution to profit net of marketing spend"

  driver_kpis:
    - id: sales.promo.incremental.amount
      name: Incremental Sales Amount
      definition: >
        Actual promoted sales minus the modelled baseline (the sales that would have occurred
        without the promotion). The true uplift created by the event, net of demand that was
        already going to happen.
      unit: EUR
      direction: maximize
      drives: sales.promo.roi.pct
      causal_mechanism: >
        Incremental sales is the primary ROI lever (bracket primary_driver): every euro of
        genuine uplift converts to incremental margin at the promo GM rate. Only the share of
        promoted volume above baseline is incremental — retailer studies show roughly 45% of
        gross promotional lift is truly incremental, the remainder being switching/stockpiling
        (Ailawadi et al. 2006).
      benchmark_target: "~45% of gross promotional lift is incremental for the retailer (CVS study, Ailawadi et al. 2006)"
      benchmark_source_id: SRC-004

    - id: margin.promo.gm.pct
      name: Promo Gross Margin %
      definition: >
        Gross Margin on promoted volume = (Net Promo Sales − COGS) / Net Promo Sales. The
        margin rate at which incremental promotional volume is actually realised after discount.
      unit: "%"
      direction: maximize
      drives: sales.promo.roi.pct
      causal_mechanism: >
        Promo GM% is the conversion rate from incremental sales to incremental margin. Deep
        discounts can lift volume while collapsing GM%, so high incremental sales at low promo
        GM% still destroys ROI — the volume-positive / margin-negative trap (NielsenIQ; McKinsey).
      benchmark_target: "Promo GM% should not fall materially below standard GM% (volume-positive/margin-negative guardrail)"
      benchmark_source_id: SRC-006

    - id: sales.price.realization_pct
      name: Price Realization %
      definition: >
        Net Price / List Price. The share of list price actually captured after discounts,
        rebates, and surcharges. Quantifies list-to-net leakage during promotions.
      unit: "%"
      direction: maximize
      drives: sales.promo.roi.pct
      causal_mechanism: >
        Realization is the discount-depth lever on ROI: deeper discounts raise promotional
        price elasticity (avg short-term promo elasticity ≈ −3.6 vs ≈ −2.6 overall) but each
        point of realization lost is margin given away. ROI optimisation balances depth-driven
        lift against realization erosion (Bijmolt, Van Heerde & Pieters 2005).
      benchmark_target: "Average price elasticity ≈ −2.6; promotional price elasticity ≈ −3.6 (meta-analysis, Bijmolt et al. 2005)"
      benchmark_source_id: SRC-005

    - id: sales.promo.cannibalization.pct
      name: Cannibalization %
      definition: >
        Cannibalized (related-SKU and baseline) sales lost / Promoted incremental sales. The
        share of apparent uplift that is merely demand shifted from other SKUs, periods, or the
        item's own baseline rather than genuinely new.
      unit: "%"
      direction: minimize
      drives: sales.promo.roi.pct
      causal_mechanism: >
        Cannibalization offsets gross lift: switching and forward-buying/pantry-loading move
        existing demand into the promo window, inflating apparent uplift while net incremental
        value is far smaller. Ignoring it overstates ROI; structural cannibalization trains
        buyers to wait for promotions (Ailawadi et al. 2007 stockpiling decomposition; Circana).
      benchmark_target: "Net of cannibalization/halo; only ~45% of gross lift typically incremental (Ailawadi et al.)"
      benchmark_source_id: SRC-007

    - id: sales.price.list.amount
      name: List Price Amount
      definition: >
        Gross list price before promotional discounts, rebates, or surcharges. The numerator
        anchor of the realization ladder.
      unit: EUR
      direction: maximize
      drives: sales.price.realization_pct
      causal_mechanism: >
        List price is the reference against which realization is measured; without an accurate
        list anchor the discount depth and leakage of a promotion cannot be quantified.

    - id: sales.price.net.amount
      name: Net Price Amount
      definition: >
        Net price actually realised after all discount, rebate, and surcharge components. The
        achieved-price endpoint of the list-to-net waterfall.
      unit: EUR
      direction: maximize
      drives: sales.price.realization_pct
      causal_mechanism: >
        Net price is the realised value per unit; the gap between list and net is the leakage
        the promotion creates. Net price feeds both realization and promo GM%.

  diagnostic_kpis:
    - id: sales.promo.baseline_sales.amount
      name: Baseline Sales Amount
      definition: "Modelled sales that would have occurred without the promotion (fact_promo). The denominator-of-truth for incremental lift."
      unit: EUR
      direction: context
      diagnoses: sales.promo.incremental.amount
      causal_mechanism: >
        Baseline is the foundation of incremental measurement: an over-stated baseline
        understates uplift and a mis-specified one is the single largest source of ROI error.
        Baseline integrity is what separates lift from subsidy (NielsenIQ baseline methodology).

    - id: sales.promo.cost.amount
      name: Promotion Cost Amount
      definition: "Total trade and promotional spend for the event (fact_promo): off-invoice, scan-down, fixtures, and funding. The ROI denominator."
      unit: EUR
      direction: minimize
      diagnoses: sales.promo.roi.pct
      causal_mechanism: >
        Promotion cost is the investment side of ROI. CPG trade spend is typically 15–25% of
        gross revenue — the second-largest P&L line after COGS — so cost accuracy directly drives
        ROI accuracy (McKinsey; Gartner CPG benchmark).

    - id: sales.promo.incremental_gm.amount
      name: Incremental Gross Margin Amount
      definition: "Incremental sales valued at promo GM% minus promo cost (fact_promo + fact_sales). The ROI numerator."
      unit: EUR
      direction: maximize
      diagnoses: sales.promo.roi.pct
      causal_mechanism: >
        Incremental GM is what ROI actually returns. It collapses incremental volume, promo GM%,
        and cannibalization into the single margin number the business keeps.

    - id: sales.promo.cannibalized_sales.amount
      name: Cannibalized Sales Amount
      definition: "Baseline/related-SKU sales shifted into the promo window (fact_promo). The numerator behind cannibalization %."
      unit: EUR
      direction: minimize
      diagnoses: sales.promo.cannibalization.pct
      causal_mechanism: >
        Cannibalized sales attributes the non-incremental share of lift to the SKUs/periods it
        was pulled from, exposing harmful promotions that shuffle demand rather than grow it.

    - id: cost.cogs.amount
      name: Cost of Goods Sold Amount
      definition: "Cost of goods sold on promoted volume (fact_sales). Required to convert net sales into gross margin."
      unit: EUR
      direction: minimize
      diagnoses: margin.promo.gm.pct
      causal_mechanism: >
        COGS is the cost basis of promo GM%; without it the margin consequence of a discount
        cannot be separated from its volume effect.

    - id: sales.pvm.volume_effect.amount
      name: "Price-Volume-Mix: Volume Effect"
      definition: "Volume component of the PVM bridge (fact_sales). Isolates promotion-driven volume from price and mix."
      unit: EUR
      direction: context
      diagnoses: sales.promo.incremental.amount
      causal_mechanism: >
        The volume effect separates the quantity uplift of a promotion from the price-down and
        mix effects in the PVM bridge, validating that incremental sales is genuine volume rather
        than a price/mix artefact.

  guardrails:
    - description: Margin floor — promotions must not be margin-destroying to buy volume
      condition: >
        A promotion whose incremental GM is negative (promo cost exceeds incremental margin, ROI
        < 100%) must not run on volume justification alone. Volume-positive / margin-negative
        promotions accumulate into quarterly GM shortfalls (NielsenIQ; McKinsey).
      affected_kpis: [sales.promo.roi.pct, margin.promo.gm.pct, sales.promo.incremental_gm.amount]

    - description: Baseline integrity — uplift is only valid against a stable, defensible baseline
      condition: >
        Incremental sales and ROI must be computed against a stable, documented baseline model
        aligned with COM-001/002. A mis-specified or drifting baseline overstates uplift and
        invalidates the ROI — the largest single error source (NielsenIQ baseline methodology).
      affected_kpis: [sales.promo.incremental.amount, sales.promo.roi.pct, sales.promo.baseline_sales.amount]

    - description: Net-of-cannibalization — report incremental value net of cannibalization and halo
      condition: >
        ROI and incremental sales must be reported net of cannibalization and halo effects.
        Gross lift overstates value because switching and forward-buying shift existing demand;
        only ~45% of gross lift is typically incremental (Ailawadi et al. 2006).
      affected_kpis: [sales.promo.roi.pct, sales.promo.cannibalization.pct, sales.promo.cannibalized_sales.amount]

  wrong_interpretations:
    - description: "Reading gross uplift as incremental value"
      why_wrong: >
        Apparent lift includes brand-switching and stockpiling/forward-buying that merely shift
        existing demand. Retailer decomposition shows roughly 45% of gross lift is incremental;
        treating 100% as incremental massively overstates ROI (Ailawadi et al. 2006).
      source_id: SRC-004

    - description: "Mis-specified baseline inflating uplift and ROI"
      why_wrong: >
        Incremental sales is entirely relative to the baseline. An understated baseline makes a
        mediocre promotion look incremental and an unstable baseline makes ROI unreproducible —
        baseline integrity is the precondition for any lift measurement (NielsenIQ).
      source_id: SRC-006

    - description: "Chasing volume while ignoring the GM / realization consequence"
      why_wrong: >
        Deep discounts raise promotional elasticity (≈ −3.6) and generate volume, but each point
        of realization lost is margin given away. High incremental sales at collapsed promo GM%
        still destroys ROI (Bijmolt, Van Heerde & Pieters 2005).
      source_id: SRC-005

    - description: "Treating price promotions as loyalty/equity builders"
      why_wrong: >
        Promotions produce short-term spikes but do not build long-term loyalty; repeated deep
        promotions can train buyers to wait and erode base price. Promotion ROI must be judged on
        incremental margin, not assumed equity effects (Sharp / Ehrenberg-Bass).
      source_id: SRC-011

# ──────────────────────────────────────────
# 3. REQUIRED DATA MODEL
# ──────────────────────────────────────────
required_data_model:
  required_facts:
    - table: fact_promo
      description: >
        Promotion event ledger. Must contain: promotion_id, baseline_sales, promo_cost,
        incremental_sales, cannibalized_sales, promo_type, mechanic, channel, product grain.
        Provides baseline, incremental lift, promo cost, cannibalization and ROI.
    - table: fact_sales
      description: >
        Invoice-line sales fact. Must contain: list_price, net_price, gross_sales, net_sales,
        cogs, quantity at invoice-line grain. Provides realization, promo GM%, PVM volume effect
        and uplift reconstruction.

  required_dimensions:
    - name: dim_date
      grain_relevance: "Time axis for promo window vs baseline period and pre/post event analysis. Promo period + CalendarWeek required."
    - name: dim_org
      grain_relevance: "Region → Channel hierarchy. Channel level mandatory for ROI-by-channel ranking."
    - name: dim_product
      grain_relevance: "Product → Category/Subcategory and related-item links for uplift, GM, and cannibalization Pareto."
    - name: dim_promo
      grain_relevance: >
        Promotion → promo_type → mechanic taxonomy for promo-level ROI, depth and mechanic
        comparison. Mechanic/depth attributes required for realization and elasticity analysis.
    - name: security_user_org
      grain_relevance: "Row-level security mapping of user to org scope; enforced by Commercial.SemanticModel."

  preferred_grain: promotion-product-week
  minimum_grain: promotion-week
  minimum_history_months: 12
  grain_waiver_condition: >
    promotion-week grain is acceptable only where invoice-line attribution to a promotion is
    structurally unavailable. Requires explicit waiver in the bracket; price-realization and
    SKU-level cannibalization diagnostics are degraded without invoice-line sales.

  required_measures:
    - name: Promotion ROI %
      formula_seed: "Incremental_Gross_Margin / Promotion_Cost"
      source_id: SRC-002
    - name: Incremental Sales Amount
      formula_seed: "Promoted_Sales - Baseline_Sales"
      source_id: SRC-004
    - name: Promo Gross Margin %
      formula_seed: "(Net_Promo_Sales - COGS) / Net_Promo_Sales"
      source_id: SRC-006
    - name: Price Realization %
      formula_seed: "Net_Price / List_Price"
      source_id: SRC-005
    - name: Cannibalization %
      formula_seed: "Cannibalized_Sales / Incremental_Sales"
      source_id: SRC-007
    - name: Incremental Gross Margin Amount
      formula_seed: "Incremental_Sales * Promo_GM_pct - Promotion_Cost"
      source_id: SRC-001

# ──────────────────────────────────────────
# 4. ACTION LOGIC SEEDS
# ──────────────────────────────────────────
action_logic_seeds:
  - trigger_driver: sales.promo.roi.pct
    trigger_diagnostic: sales.promo.incremental_gm.amount
    trigger_condition: "Promo ROI below threshold (< 120%, near/under breakeven) with thin or negative incremental GM"
    guardrail: "Use baseline-validated incremental margin; do not justify on gross volume"
    action_description: >
      Promotion ROI recovery: rank promotions by ROI gap × spend, isolate the events returning
      below breakeven, and redesign or stop the loss-making mechanics before the next cycle.
    expected_outcome_kpi: sales.promo.roi.pct
    action_code_candidate: C-P4.1

  - trigger_driver: sales.promo.cannibalization.pct
    trigger_diagnostic: sales.promo.cannibalized_sales.amount
    trigger_condition: "Cannibalization rate spiking (e.g. > 30%) while gross lift looks positive (demand shifted, not created)"
    guardrail: "Decompose switching/stockpiling vs true incremental before acting; protect baseline integrity"
    action_description: >
      Promo mix optimisation: run cannibalization decomposition by product pair and campaign type,
      retire promotions that shuffle baseline demand, and protect genuinely incremental mechanics.
    expected_outcome_kpi: sales.promo.cannibalization.pct
    action_code_candidate: C-M2.1

  - trigger_driver: margin.promo.gm.pct
    trigger_diagnostic: sales.price.realization_pct
    trigger_condition: "Promo GM% materially below standard GM% with price realization collapsing (volume-positive/margin-negative)"
    guardrail: "Apply margin floor; balance discount depth against realization erosion"
    action_description: >
      Mechanic depth correction: compare mechanics on depth vs realization, cap discount depth
      where elasticity does not justify the margin given away, and shift to lower-leakage mechanics.
    expected_outcome_kpi: margin.promo.gm.pct
    action_code_candidate: C-M2.2

  - trigger_driver: sales.promo.incremental.amount
    trigger_diagnostic: sales.promo.baseline_sales.amount
    trigger_condition: "Reported uplift sensitive to baseline assumptions; baseline drift suspected to overstate incrementality"
    guardrail: "Re-validate and stabilise baseline model aligned with COM-001/002 before re-scoring promotions"
    action_description: >
      Baseline integrity remediation: re-fit and freeze the baseline, re-score affected promotions
      on the corrected baseline, and re-rank ROI on defensible incremental sales.
    expected_outcome_kpi: sales.promo.incremental.amount
    action_code_candidate: C-P4.1

  - trigger_driver: sales.price.realization_pct
    trigger_diagnostic: sales.price.net.amount
    trigger_condition: "List-to-net leakage widening (deep discounts/rebates) eroding net price during promotions"
    guardrail: "Confirm leakage is promotion-driven vs structural list-price issue (route structural to COM-002)"
    action_description: >
      Price realization recovery: run the list-to-net waterfall by mechanic and channel, target
      the deepest leakage components, and tighten promo terms to recover realised price.
    expected_outcome_kpi: sales.price.realization_pct
    action_code_candidate: C-M2.2

