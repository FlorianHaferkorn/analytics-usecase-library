action_logic_seeds:
  - trigger_driver: sales.promo.cannibalization.pct
    trigger_diagnostic: sales.promo.baseline_sales.amount
    trigger_condition: "Cannibalization % > 30% AND Promotion ROI % < 100% for the campaign wave"
    guardrail: "Do not credit own-brand-switching uplift as incremental; re-base ROI on true (cross-brand + category-expansion) volume before acting"
    action_description: >
      Run cannibalization decomposition by product pair / product family and campaign type;
      de-overlap promotions on substitutes and shift mechanic toward cross-brand-switching
      categories to convert internal transfer into true incremental volume.
    expected_outcome_kpi: sales.promo.roi.pct
    action_code_candidate: C-M2.1

  - trigger_driver: margin.promo.gm.pct
    trigger_diagnostic: sales.price.realization_pct
    trigger_condition: "Promo GM% > 5pp below standard GM% AND Price Realization % < 75% during the promo window"
    guardrail: "Do not deepen discount to chase volume when realization is already eroded and promo GM% is below standard"
    action_description: >
      Trigger promo-level P&L and price-realization recovery: reduce promo depth, tighten the
      discount ladder (off-invoice/rebate/allowance), and compare mechanics to restore net price
      and promo gross margin.
    expected_outcome_kpi: sales.promo.roi.pct
    action_code_candidate: C-M2.2

  - trigger_driver: sales.promo.incremental.amount
    trigger_diagnostic: sales.promo.incremental_gm.amount
    trigger_condition: "Incremental Gross Margin Amount negative OR Promotion ROI % < 100% despite positive volume uplift"
    guardrail: "Do not scale or repeat a promotion with negative incremental gross margin even if volume lifts"
    action_description: >
      Redesign or stop the promotion mechanic: standardize only payback-positive mechanics/depths,
      reallocate trade spend to channels and categories with proven incremental ROI, and retire
      value-destroying formats before the next campaign cycle.
    expected_outcome_kpi: sales.promo.roi.pct
    action_code_candidate: C-P4.1

required_data_model:
  required_facts:
    - table: fact_promo
      description: "Promotion costs and baseline (Promo Cost, Funding Amount, Baseline Sales/Quantity, Baseline Non-Promo Sales Amount) per promotion — basis for incrementality and cannibalization."
    - table: fact_sales
      description: "Invoice-line sales with Net Sales Amount, List/Net Price Amount, Discount Amount, COGS, Quantity, Promo Flag and PromoKey — basis for uplift, realization, and promo GM reconstruction."
  required_dimensions:
    - name: dim_promo
      grain_relevance: "Promotion, PromoType, Mechanic, and Start/End date range — the campaign grain for ROI and uplift evaluation."
    - name: dim_date
      grain_relevance: "Promo period vs baseline period windowing; promo calendar alignment for pull-forward detection."
    - name: dim_product
      grain_relevance: "Category/Subcategory/Brand and ProductFamily for mix targeting and cannibalization across comparable items."
    - name: dim_org
      grain_relevance: "Region and Channel attribution of promo ROI and realization; basis for row-level security."
  preferred_grain: promotion (campaign) with invoice-line sales retained for uplift and realization diagnostics
  minimum_grain: promotion-product_category-channel
  minimum_history_months: 12
  required_measures:
    - name: Incremental Sales Amount
      formula_seed: "Promo-period Net Sales Amount (Promo Flag = true) - Baseline Sales Amount, net of cannibalized and pull-forward sales"
      source_id: SRC-006
    - name: Baseline Sales Amount
      formula_seed: "Modelled non-promotional sales over the promo window from fact_promo Baseline Sales Amount"
      source_id: SRC-006
    - name: Promo Gross Margin %
      formula_seed: "(Promo Net Sales Amount - Promo Cost of Goods Sold Amount) / Promo Net Sales Amount × 100"
      source_id: SRC-009
    - name: Price Realization %
      formula_seed: "SUM(Net Price Amount) / SUM(List Price Amount) × 100"
      source_id: SRC-001
    - name: Cannibalization %
      formula_seed: "Cannibalized (own-family) Sales Amount / Apparent Uplift × 100"
      source_id: SRC-005
    - name: Incremental Gross Margin Amount
      formula_seed: "Incremental Sales Amount × Promo Gross Margin % (gross margin on baseline-adjusted volume)"
      source_id: SRC-009
    - name: Promotion ROI %
      formula_seed: "Incremental Gross Margin Amount / Promo Cost × 100"
      source_id: SRC-008

