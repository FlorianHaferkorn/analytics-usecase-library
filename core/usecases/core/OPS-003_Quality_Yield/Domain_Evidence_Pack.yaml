evidence_pack_version: "1.0"
use_case_id: OPS-003
use_case_title: Quality & Yield
domain: Operations
authored_date: "2026-06-11"
authored_by: framework-architect-agent
reviewed_by: ""
status: draft

# ──────────────────────────────────────────
# 1. PROCESS SCOPE
# ──────────────────────────────────────────
process_scope:
  description: >
    Manufacturing quality and yield management: maximizing First Pass Yield (FPY) and
    reducing scrap, rework, defects, customer complaints, and the Cost of Poor Quality
    (COPQ). Covers the quality loss hierarchy from in-process defects through to field
    quality, grounded in ISO 9001:2015 QMS, ISO 22400-2 manufacturing quality KPIs,
    Six Sigma yield metrics (FPY / RTY / DPMO), the Juran/Crosby/ASQ Cost of Quality
    model, and AIAG core tools (APQP/PPAP/SPC). Drives root-cause and containment
    action codes that protect yield, margin, and customer trust.
  in_scope:
    - First Pass Yield (FPY) measurement per Six Sigma / ISO 22400-2 quality ratio family
    - Scrap ratio and rework ratio per ISO 22400-2 definitions
    - Cost of Poor Quality (COPQ) — prevention, appraisal, internal & external failure (Juran/Crosby/ASQ)
    - Defect density and defect-type Pareto (Six Sigma DPU/DPMO)
    - Customer complaint rate as the external-failure / field-quality signal
    - Defect root-cause analysis at line / product / shift / process-step grain
    - Containment vs corrective action logic (ISO 9001 nonconformity & corrective action)
    - Hidden-factory (rework loop) and rolled-throughput-yield context
    - Process parameter / SPC stability linkage (AIAG SPC)
  out_of_scope:
    - Supplier quality, PPV, and incoming inspection scoring (separate sourcing use case)
    - Predictive maintenance and equipment reliability (OPS-002, OPS-013)
    - OEE quality-rate decomposition at the OEE level (OPS-001)
    - Logistics / shipping damage quality (OPS-011)
    - Warranty financial provisioning and claims accounting (Finance domain)
  industry_segment: >
    Discrete and process manufacturing with in-line quality inspection — most directly
    applicable to automotive (IATF 16949 / AIAG core tools), electronics, medical
    devices, FMCG, food & beverage, and pharmaceuticals. FPY/COPQ principles apply to
    any multi-step production process with defect and inspection data.
  applicable_frameworks:
    - name: ISO 9001:2015 Quality management systems — Requirements (with ISO 9000 vocabulary)
      id: ISO-9001
    - name: ISO 22400-2 Key Performance Indicators for Manufacturing Operations Management
      id: ISO-22400-2
    - name: Six Sigma Yield Metrics — FPY / Rolled Throughput Yield / DPMO
      id: SIX-SIGMA
    - name: Juran / Crosby / ASQ Cost of Quality (PAF model — Prevention, Appraisal, Failure)
      id: COQ-PAF
    - name: AIAG Core Tools — APQP, PPAP, FMEA, MSA, SPC, Control Plan
      id: AIAG-CORE-TOOLS

# ──────────────────────────────────────────
# 2. CANONICAL DOMAIN MODEL (DRIVER TREE)
# ──────────────────────────────────────────
canonical_domain_model:
  outcome_kpis:
    - id: quality.fpy.pct
      name: First Pass Yield (FPY)
      definition: >
        FPY = Units Passing All Quality Checks First Time (without rework) / Units
        Started. The strategic quality outcome KPI. FPY excludes reworked units that
        later pass — it measures right-first-time capability, distinguishing truly
        first-pass-good units from "paper good" units recovered through rework. In a
        multi-step process, the product of step FPYs is the Rolled Throughput Yield (RTY).
      unit: "%"
      direction: maximize
      benchmark_target: "≥ 95% good in most manufacturing; world-class high-volume discrete ≥ 99% (Six Sigma 99.99966% at 3.4 DPMO)"
      benchmark_source_id: SRC-005
      iso_reference: ISO 22400-2:2014 (quality ratio family); Six Sigma yield definitions

  driver_kpis:
    - id: quality.scrap.pct
      name: Scrap Rate (Scrap Ratio)
      definition: >
        Scrap Rate = Scrap Units / Total Units. ISO 22400-2 scrap ratio: units that must
        be discarded and cannot be reworked. The dominant unrecoverable quality loss and
        the primary lever on FPY.
      unit: "%"
      direction: minimize
      drives: quality.fpy.pct
      causal_mechanism: >
        Scrap units fail at first pass and are not recoverable, so each scrapped unit
        directly reduces FPY and is an unrecoverable contributor to COPQ (internal
        failure cost). Reducing the dominant scrap defect type is the highest-leverage
        FPY action (O-Q3.1).
      benchmark_target: "< 0.5% world-class discrete; < 2% acceptable for most processes"
      benchmark_source_id: SRC-005

    - id: quality.rework.pct
      name: Rework Rate (Rework Ratio)
      definition: >
        Rework Rate = Rework Units / Total Units. ISO 22400-2 rework ratio: units that
        failed first pass but were recovered to good through additional work. The
        "hidden factory" — recovered output that depresses FPY without showing in final
        yield.
      unit: "%"
      direction: minimize
      drives: quality.fpy.pct
      causal_mechanism: >
        Reworked units pass eventually (so final Quality Rate can look healthy) but they
        failed first pass, so they reduce FPY and add internal-failure COPQ (rework
        labour, retest). A widening gap between final Quality Rate and FPY exposes a
        growing hidden factory (O-Q3.2 COPQ / hidden-factory reduction).
      benchmark_target: "Minimise; trend toward zero; rework cost tracked as internal-failure COPQ"
      benchmark_source_id: SRC-004

    - id: quality.copq.amount
      name: Cost of Poor Quality (COPQ)
      definition: >
        COPQ = Internal Failure Cost + External Failure Cost (+ Appraisal + Prevention
        in the full Cost of Quality / PAF model). Monetises quality losses — scrap,
        rework, warranty, complaints, inspection — into a single financial signal.
        Juran/Crosby/ASQ estimate unmanaged COPQ at 15–20% of sales.
      unit: EUR
      direction: minimize
      drives: quality.fpy.pct
      causal_mechanism: >
        COPQ is the financial translation of low FPY: low FPY drives internal-failure
        cost (scrap, rework) and, when defects escape, external-failure cost
        (complaints, warranty). Rising COPQ with stable FPY signals shifting cost mix
        (e.g. rising rework or escapes) rather than a yield change.
      benchmark_target: "Unmanaged 15–20% of sales (Juran/Crosby/ASQ); world-class quality programmes < 5%"
      benchmark_source_id: SRC-002

    - id: quality.defect_density
      name: Defect Density
      definition: >
        Defect Density = Total Defects / Units (or per opportunity → DPU / DPMO in Six
        Sigma). Counts defects rather than defective units, so a single unit with
        multiple defects is fully visible. Feeds the defect-type Pareto.
      unit: defects_per_unit
      direction: minimize
      drives: quality.fpy.pct
      causal_mechanism: >
        Defect density (DPU) converts to DPMO and process sigma level and predicts FPY:
        as defect density falls, first-pass yield rises. A high-defect-density process
        step is the root-cause focus for parameter / SPC review (O-Q3.3).
      benchmark_target: "Six Sigma ≈ 3.4 DPMO; track DPU/DPMO per process step"
      benchmark_source_id: SRC-003

    - id: quality.complaint.pct
      name: Customer Complaint Rate
      definition: >
        Complaint Rate = Complaints / Shipped Units (or per shipment/order). The
        external-failure / field-quality signal — defects that escaped internal
        inspection and reached the customer.
      unit: "%"
      direction: minimize
      drives: quality.fpy.pct
      causal_mechanism: >
        Complaints lag internal quality; a rising complaint rate while internal FPY
        looks stable indicates escapes (inspection gaps / hidden factory masking defects
        that later fail in the field), carrying the most expensive external-failure COPQ
        and triggering field-quality containment (O-Q3.4).
      benchmark_target: "Minimise; near-zero for safety-critical; automotive escapes target < 50 PPM"
      benchmark_source_id: SRC-005

  diagnostic_kpis:
    - id: quality.scrap.by_defect_type
      name: Scrap / Defects by Defect Type (Pareto)
      definition: >
        Scrap units and defect counts decomposed by defect type / cause code. A defect
        Pareto isolating the few defect types that drive most of the loss (Six Sigma /
        AIAG problem-solving).
      unit: count
      direction: minimize
      diagnoses: quality.scrap.pct
      causal_mechanism: >
        A small number of defect types typically account for most scrap. Ranking by
        defect type focuses root-cause analysis on the dominant mode and points the
        corrective action at the right process step (O-Q3.1).

    - id: quality.rty.pct
      name: Rolled Throughput Yield (RTY)
      definition: >
        RTY = product of each process step's FPY. The probability a unit passes the
        entire multi-step process defect-free. Exposes cumulative yield loss that
        single-step FPY hides.
      unit: "%"
      direction: maximize
      diagnoses: quality.fpy.pct
      causal_mechanism: >
        Ten steps at 90% FPY yield only ~35% RTY. RTY below expectation with healthy
        per-step FPY reveals that yield loss is distributed across many steps (a
        systemic process-capability issue) rather than one bad step.

    - id: quality.copq.internal_vs_external
      name: COPQ Internal vs External Failure Split
      definition: >
        COPQ decomposed into internal failure (scrap, rework, retest) vs external
        failure (complaints, returns, warranty) per the Juran/Crosby PAF model.
      unit: EUR
      direction: minimize
      diagnoses: quality.copq.amount
      causal_mechanism: >
        A rising external-failure share means defects are escaping to customers (the
        most costly category) and points to an inspection/containment gap rather than a
        pure internal-yield problem (O-Q3.4 vs O-Q3.2).

    - id: quality.defect.by_process_step
      name: Defect Density by Process Step
      definition: >
        Defect density (DPU/DPMO) attributed to each process step / station via SPC and
        inspection data, locating where defects are introduced.
      unit: defects_per_unit
      direction: minimize
      diagnoses: quality.defect_density
      causal_mechanism: >
        Concentrated defect density at one step with out-of-control SPC indicates a
        process-parameter or capability problem at that step, triggering a parameter /
        control-plan review (O-Q3.3, AIAG SPC).

  guardrails:
    - description: New product / process trial and qualification runs
      condition: >
        Defects from approved NPI trials, APQP/PPAP qualification runs, and pilot
        batches are expected and budgeted. Scrap, rework, and FPY from trial runs must
        NOT inflate operational quality KPIs or trigger corrective action (AIAG APQP/PPAP).
      affected_kpis:
        - quality.fpy.pct
        - quality.scrap.pct
        - quality.rework.pct

    - description: Inspection-tightening / measurement-system change
      condition: >
        A step-change in defect or scrap rate caused by tightened inspection criteria or
        a new gauge (MSA change) is a measurement effect, not a process deterioration.
        Do not trigger process actions until the measurement system is validated (AIAG MSA).
      affected_kpis:
        - quality.defect_density
        - quality.scrap.pct

    - description: Statistically insignificant short-term FPY dips
      condition: >
        Short-window FPY dips on low-volume lines may be statistical noise or a single
        bad batch. Require a minimum unit count or a sustained out-of-control SPC signal
        before triggering containment to avoid overreacting (SPC rules).
      affected_kpis:
        - quality.fpy.pct
        - quality.scrap.pct

  wrong_interpretations:
    - description: "Reading final Quality Rate / yield as if it were First Pass Yield"
      why_wrong: >
        Final yield counts reworked units as good, so it overstates right-first-time
        performance. A process can show 98% final yield while FPY is 88% because of a
        large hidden factory of rework. FPY and final yield must be reported together;
        confusing them hides rework cost and masks the real defect rate.
      source_id: SRC-003

    - description: "Treating single-step FPY as the whole-process yield"
      why_wrong: >
        High per-step FPY can still produce poor end-to-end yield: ten steps at 90% give
        ~35% Rolled Throughput Yield. Reporting only one step's FPY (or averaging steps)
        understates cumulative loss. RTY must be used for multi-step processes.
      source_id: SRC-003

    - description: "Ignoring COPQ / chasing FPY without the cost lens"
      why_wrong: >
        FPY can be propped up by 100% inspection and heavy rework, which keeps escapes
        low but explodes internal-failure COPQ. Optimising FPY without COPQ rewards the
        hidden factory. Juran/Crosby/ASQ show unmanaged quality cost runs 15–20% of
        sales — the cost lens is required to avoid value-destroying "quality theatre".
      source_id: SRC-002

    - description: "Interpreting a rising internal scrap rate as worse than a stable complaint rate"
      why_wrong: >
        Internal failure (scrap caught in-house) is far cheaper than external failure
        (a complaint/escape). A stable complaint rate alongside rising scrap can mean
        the plant is correctly catching defects internally — better, not worse. The
        internal-vs-external COPQ split, not scrap alone, indicates whether quality is degrading.
      source_id: SRC-002

    - description: "Acting on defect-rate changes caused by measurement-system or inspection changes"
      why_wrong: >
        A jump in defects after tightening inspection criteria or changing a gauge is a
        measurement effect, not a process change. Acting on it triggers the wrong
        corrective action. AIAG MSA requires validating measurement-system change before
        attributing a shift to the process.
      source_id: SRC-006

# ──────────────────────────────────────────
# 3. REQUIRED DATA MODEL
# ──────────────────────────────────────────
required_data_model:
  required_facts:
    - table: fact_quality
      description: >
        Line-day quality backbone (grain: line_day). Columns used: DateKey, OrgKey,
        ProductKey, Total Units, Good Units, Scrap Units, Rework Units, Defect Count.
        Source of FPY, scrap %, rework %, and defect density. This is the primary
        evidence grain for OPS-003.
    - table: fact_quality_costs
      description: >
        Quality cost facts (grain: month_product). Columns used: DateKey, OrgKey,
        ProductKey, COPQ Amount. Source of COPQ and the internal/external failure split
        (when cost categories are coded).
    - table: fact_complaints
      description: >
        Customer complaint facts (grain: complaint). Columns used: DateKey, ProductKey,
        OrgKey, Complaint Count, Severity. Source of the complaint rate (external-failure
        / field-quality signal).
    - table: fact_shipments
      description: >
        Shipment facts (grain: shipment_line). Columns used: DateKey, ProductKey, OrgKey,
        Shipped Units. Denominator for complaint rate (complaints per shipped unit).

  required_dimensions:
    - name: dim_product
      grain_relevance: >
        ProductKey, ProductCode, Category, Subcategory. Product / product-family level
        required for the defect Pareto, FPY-by-product ranking, and complaint linkage.
    - name: dim_org
      grain_relevance: >
        Plant → Line → Shift hierarchy. Line and shift level required to localise yield
        loss; required for row-level security and cross-line comparison.
    - name: dim_date
      grain_relevance: >
        Time axis. Must include Week and Month for the weekly quality review and monthly
        COPQ review cadence; scrap/rework trend is read weekly.
    - name: dim_defect_type
      grain_relevance: >
        Defect-type / cause-code taxonomy for the scrap and defect Pareto and the
        process-step root cause. No conformed defect-type dimension exists in the
        contract (fact_quality has only an aggregate Defect Count) — classified as model_gap.
    - name: dim_process_step
      grain_relevance: >
        Process step / station for defect-density-by-step and RTY (per-step FPY).
        Not present in the contract; fact_quality is line-day aggregate — classified as model_gap.

  preferred_grain: line-product-shift-day
  minimum_grain: line-day
  minimum_history_months: 12
  grain_waiver_condition: >
    line-day grain is acceptable when product- or shift-level quality data is
    structurally unavailable, but this prevents the per-product defect Pareto and the
    per-step RTY decomposition. Requires an explicit waiver in the bracket.

  required_measures:
    - name: First Pass Yield %
      formula_seed: "Units_Passing_First_Time / Units_Started  (= (Total_Units - Scrap_Units - Rework_Units) / Total_Units)"
      source_id: SRC-003
    - name: Scrap Rate %
      formula_seed: "Scrap_Units / Total_Units"
      source_id: SRC-007
    - name: Rework Rate %
      formula_seed: "Rework_Units / Total_Units"
      source_id: SRC-007
    - name: COPQ (EUR)
      formula_seed: "Internal_Failure_Cost + External_Failure_Cost (+ Appraisal_Cost + Prevention_Cost)"
      source_id: SRC-002
    - name: Defect Density (DPU)
      formula_seed: "Defect_Count / Total_Units"
      source_id: SRC-003
    - name: DPMO
      formula_seed: "(Defect_Count / (Total_Units × Opportunities_Per_Unit)) × 1,000,000"
      source_id: SRC-003
    - name: Complaint Rate %
      formula_seed: "Complaint_Count / Shipped_Units"
      source_id: SRC-001
    - name: Rolled Throughput Yield %
      formula_seed: "PRODUCT(FPY_step_i) across all process steps"
      source_id: SRC-003
    - name: Quality Rate % (final yield, for FPY contrast)
      formula_seed: "Good_Units / Total_Units"
      source_id: SRC-007

# ──────────────────────────────────────────
# 4. ACTION LOGIC SEEDS
# ──────────────────────────────────────────
action_logic_seeds:
  - trigger_driver: quality.scrap.pct
    trigger_diagnostic: quality.scrap.by_defect_type
    trigger_condition: "FPY < target AND scrap rate > target for 4 consecutive weeks AND one defect type accounts for > 40% of scrap"
    guardrail: "Exclude NPI trial / PPAP qualification runs; confirm not a measurement-system change"
    action_description: >
      Yield recovery / defect root-cause analysis: run a defect-type Pareto, isolate the
      dominant defect's process step (material vs parameter vs operator), and implement
      corrective action per ISO 9001 nonconformity handling.
    expected_outcome_kpi: quality.fpy.pct
    action_code_candidate: O-Q3.1

  - trigger_driver: quality.rework.pct
    trigger_diagnostic: quality.copq.internal_vs_external
    trigger_condition: "Final Quality Rate stable but FPY falling AND rework rate rising AND internal-failure COPQ up > 15%"
    guardrail: "Exclude planned rework on trial batches; confirm rework is recorded, not hidden"
    action_description: >
      COPQ / hidden-factory reduction: identify rework loops, quantify hidden-factory
      cost, and eliminate the rework root cause rather than absorbing the rework labour.
    expected_outcome_kpi: quality.copq.amount
    action_code_candidate: O-Q3.2

  - trigger_driver: quality.defect_density
    trigger_diagnostic: quality.defect.by_process_step
    trigger_condition: "Defect density rising AND concentrated at one process step AND SPC out-of-control on that step's key characteristic"
    guardrail: "Validate measurement system (MSA) before attributing the shift to the process"
    action_description: >
      Process parameter / control-plan review (AIAG SPC): investigate the out-of-control
      step, recentre/re-capability the process, and update the control plan and reaction plan.
    expected_outcome_kpi: quality.defect_density
    action_code_candidate: O-Q3.3

  - trigger_driver: quality.complaint.pct
    trigger_diagnostic: quality.copq.internal_vs_external
    trigger_condition: "Complaint rate rising > 10% AND external-failure COPQ share increasing AND internal FPY stable (escapes)"
    guardrail: "Exclude complaints traced to logistics/shipping damage (out of scope)"
    action_description: >
      Field-quality containment: contain affected lots, run 8D on the escape, close the
      inspection/detection gap that let the defect reach the customer (ISO 9001 corrective action).
    expected_outcome_kpi: quality.complaint.pct
    action_code_candidate: O-Q3.4

  - trigger_driver: quality.fpy.pct
    trigger_diagnostic: quality.rty.pct
    trigger_condition: "RTY below expectation with no single dominant step AND per-step FPY each acceptable (systemic loss)"
    guardrail: "Exclude steps under active NPI ramp; confirm RTY built from validated per-step FPY"
    action_description: >
      Process capability improvement programme: prioritise steps by cumulative RTY drag,
      run capability studies (Cp/Cpk) and DOE across the lowest-yield steps, and lift
      systemic first-pass capability.
    expected_outcome_kpi: quality.fpy.pct
    action_code_candidate: O-Q3.5

