# ──────────────────────────────────────────
# 6. MAPPING READINESS
# ──────────────────────────────────────────
mapping_readiness:
  kpi_catalog_coverage: complete
  factsheet_coverage: complete
  bracket_coverage: complete
  action_code_coverage: complete
  semantic_model_coverage: partial

  gap_summary:
    content_gaps:
      - gap_type: content_gap
        severity: medium
        affected_artifact: core/usecases/core/OPS-003_Quality_Yield/Business_Factsheet.md
        field: "Section 8 Success Criteria / benchmark targets"
        description: >
          Benchmark targets not stated: FPY 99% world-class, COPQ < 5% of sales (15–20% poor
          performers), 6σ ≈ 3.4 DPMO (Juran / ASQ / Six Sigma). Added to make success criteria measurable.
        evidence_reference: SRC-006 SRC-008 SRC-009
        remediation: "Add FPY / COPQ / DPMO world-class targets to the factsheet success criteria."
        status: resolved

    mapping_gaps: []

    schema_gaps: []

    generator_gaps: []

    model_gaps:
      - gap_type: model_gap
        severity: high
        affected_artifact: core/data_contracts/domains/operations.yaml
        field: dim_defect_mode / dim_cause_code
        description: >
          No defect-mode or quality cause-code dimension exists. ISO 9001 / IATF 16949 defect
          Pareto and root-cause targeting (O-Q3.1) require defect-mode and cause attribution at
          the line/product grain.
        evidence_reference: SRC-002 SRC-004
        remediation: "Add dim_defect_mode and dim_cause_code per ISO 9001 / IATF 16949 taxonomy to the operations contract."
        status: open

      - gap_type: model_gap
        severity: medium
        affected_artifact: core/data_contracts/domains/operations.yaml
        field: fact_quality_costs (PAF cost categories)
        description: >
          COPQ requires prevention, appraisal, internal-failure and external-failure cost
          categories. fact_quality_costs is referenced by the factsheet but its PAF cost-category
          lineage is not defined in the data contract.
        evidence_reference: SRC-006
        remediation: "Define fact_quality_costs with PAF cost categories and bind COPQ measure lineage."
        status: open
