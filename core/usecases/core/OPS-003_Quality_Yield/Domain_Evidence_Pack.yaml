mapping_readiness:
  kpi_catalog_coverage: partial
  factsheet_coverage: partial
  bracket_coverage: partial
  action_code_coverage: partial
  semantic_model_coverage: partial

  gap_summary:
    content_gaps:
      - gap_type: content_gap
        severity: medium
        affected_artifact: core/usecases/core/OPS-003_Quality_Yield/Business_Factsheet.md
        field: "Section 8 Success Criteria"
        description: >
          Benchmark targets not quantified: FPY ≥ 95% (world-class ≥ 99%), scrap < 0.5%
          world-class / < 2% acceptable, unmanaged COPQ 15–20% of sales (target < 5%),
          and Six Sigma 3.4 DPMO reference.
        evidence_reference: SRC-002 SRC-003 SRC-005
        remediation: "Add quantified benchmark targets to Section 8. Close when DEP approved."
        status: open

      - gap_type: content_gap
        severity: medium
        affected_artifact: core/usecases/core/OPS-003_Quality_Yield/Business_Factsheet.md
        field: "Section 2 Core Business Questions"
        description: >
          Core questions do not distinguish FPY from final yield (hidden factory) or ask
          about Rolled Throughput Yield across steps and the internal-vs-external COPQ
          split — the questions that drive O-Q3.2 and O-Q3.4.
        evidence_reference: SRC-003 SRC-002
        remediation: "Add FPY-vs-final-yield and RTY / COPQ-split questions to Section 2. Close when DEP approved."
        status: open

    mapping_gaps:
      - gap_type: mapping_gap
        severity: high
        affected_artifact: core/usecases/core/OPS-003_Quality_Yield/UseCase_Bracket.yaml
        field: ux_layout_rules.page_1_summary.component_30s (Main_1)
        description: >
          Main_1 trend visual shows quality.scrap.pct (a driver KPI). The strategic KPI
          for OPS-003 is quality.fpy.pct; the lead trend should answer "Is yield (FPY)
          on target?" before the scrap driver. Scrap belongs in the supporting driver group.
        evidence_reference: SRC-003
        remediation: "Set Main_1 to quality.fpy.pct trend vs target; move scrap to the supporting bar group. Close when DEP approved."
        status: in_progress

      - gap_type: mapping_gap
        severity: medium
        affected_artifact: core/usecases/core/OPS-003_Quality_Yield/UseCase_Bracket.yaml
        field: ux_layout_rules.page_1_summary.component_30s.bar_chart
        description: >
          The bar group mixes quality.copq.amount (EUR) with quality.rework.pct and
          quality.complaint.pct (%). Mixing a currency measure and percentage rates on
          one axis produces a misleading visual; COPQ should be its own EUR-scaled visual.
        evidence_reference: SRC-002
        remediation: "Separate COPQ (EUR) from the percentage drivers onto its own visual / axis. Close when DEP approved."
        status: open

    schema_gaps: []

    generator_gaps: []

    model_gaps:
      - gap_type: model_gap
        severity: high
        affected_artifact: core/data_contracts/domains/operations.yaml
        field: dim_defect_type
        description: >
          No conformed defect-type / cause-code dimension exists. fact_quality has only
          an aggregate Defect Count, so the defect Pareto (the core diagnostic for O-Q3.1)
          cannot be built. A governed defect-type taxonomy is required.
        evidence_reference: SRC-003 SRC-006
        remediation: >
          Add dim_defect_type and relate it to a defect-grain fact (or add DefectTypeKey
          to fact_quality). Add to Operations.SemanticModel.
        status: open

      - gap_type: model_gap
        severity: high
        affected_artifact: core/data_contracts/domains/operations.yaml
        field: process-step grain and COPQ category split
        description: >
          (1) fact_quality is line-day aggregate with no process_step grain, so per-step
          FPY and Rolled Throughput Yield (O-Q3.5) cannot be computed. (2) fact_quality_costs
          carries a single COPQ Amount with no PAF category, so the internal-vs-external
          split (O-Q3.2 / O-Q3.4 trigger) cannot be derived.
        evidence_reference: SRC-003 SRC-002
        remediation: >
          Add a process-step dimension/grain to quality facts and a cost-category column
          (prevention/appraisal/internal/external) to fact_quality_costs. Expose RTY and
          COPQ-split measures in Operations.SemanticModel.
        status: open
