schema_version: '2.0'
id: OPS-003
title: Quality & Yield
domain: Operations
governance:
  owner_role: quality_manager
  steward_role: quality_analytics_ops_bi_lead
orchestration:
  strategic_kpi_id: KPI-QUA-001
  influencing_kpi_ids:
  - KPI-QUA-002
  - KPI-OPS-010
  - KPI-QUA-003
  - KPI-QUA-004
  - KPI-QUA-005
  supporting_kpi_ids:
  - KPI-OPS-013
  - KPI-COM-012
  - KPI-SVC-001
  action_code_ids:
  - O-Q3.1
  - O-Q3.2
  - O-Q3.3
  - O-Q3.4
  - O-Q3.5
primary_kpi_ids:
  - KPI-QUA-001
  - KPI-QUA-002

value_driver_model:
  formula: KPI-QUA-001 = f(KPI-QUA-002, KPI-OPS-010, KPI-QUA-003, KPI-QUA-004, KPI-QUA-005)
  impact_direction: maximize
  primary_driver: KPI-QUA-002
  impact_logic: Improving KPI-QUA-002 is the primary lever for maximizing KPI-QUA-001.
ux_layout_rules:
  report_structure: 2-Page-Lead
  report_canvas: { width: 1920, height: 1080 }
  # R2.4 (Cut C2): migrated to the intent layer, COM-002 as reference pattern.
  intent_rules_version: 2
  page_1_summary:
    title: Operations Summary & Insights
    page_type: T3_Operational_Monitoring
    template_variant: T3_ProcessControl
    template_id: pulse
    decision_question: "Is product quality yield within acceptable thresholds?"
    big_idea: "Scrap rate is trending above target — yield losses are concentrated in two production lines and require root-cause containment before end of quarter."
    component_3s:
      kpi_id: KPI-QUA-001
      visual_type: kpi_card_with_delta
      comparison: vs_target
      status_logic: higher_is_better
      benchmark: true
    component_30s:
    - slot_id: Main_1
      kpi_id: KPI-QUA-002
      visual_type: line_chart
      question: "Is quality loss plant-wide or concentrated on a few lines?"
      message: Rising scrap is concentrated on a couple of lines, not plant-wide
      so_what: "Containing the two lines driving the trend is faster than a plant-wide quality program."
      unit: rate
    - slot_id: Main_2
      # R2.4: was 3 KPIs of 2 different calc_types (rate vs. amount) on one
      # axis -- a ONE_MESSAGE_PER_CHART violation. KPI-QUA-003 moved
      # to the Detail_Matrix.
      kpi_ids:
      - KPI-OPS-010
      - KPI-QUA-004
      visual_type: horizontal_bar_chart
      question: "What are the downstream quality-cost signals?"
      message: Rework and complaint rates — the two downstream quality-cost signals.
      so_what: "Ranking COPQ by line prioritises containment where the financial impact is largest."
      unit: rate
  page_2_execution:
    title: Operations Execution
    decision_question: "Which lines and defect modes should containment target first?"
    page_type: T3_Operational_Monitoring
    template_variant: T3_ProcessControl
    template_id: action_matrix
    component_300s:
      evidence_grain: line_day
      # R2.4: curated 12→8. plant/line/shift have no backing dimension table
      # in Operations.SemanticModel (only dim_asset exists) -- replaced with
      # asset. Cut KPI-OPS-013/KPI-COM-012 (volume context, less
      # central to the quality-yield decision_question).
      evidence_columns:
      - asset
      - product_category
      - KPI-QUA-001
      - KPI-QUA-002
      - KPI-OPS-010
      - KPI-QUA-003
      - KPI-QUA-004
      - KPI-QUA-005
      action_panel: true
      payload_mode: full
      sort_by:
        measure: KPI-QUA-002
        direction: descending
      top_n: 20
      highlight_rule:
        column: KPI-QUA-002
        type: data_bar
prioritization:
  business_value: high
  implementation_effort: high
  confidence: 0.7
  reach: division
  priority_score: 16
data_protection:
  # DSGVO Art. 25 Privacy by Design and by Default
  # Authority: core/templates/page_templates/governance/Data_Protection_Governance.md
  personal_data: false
  legal_basis: not_applicable
  data_minimisation: >
    Detail Matrix limited to production-batch, quality-defect-type, and line
    grain. Quality KPIs attributed to equipment and process steps — no
    individual employee attribution. Row-level security applied at SemanticModel
    level.
  access_restriction: >
    operations_controlling_lead and ops_bi_lead roles; row-level security
    enforced by Operations.SemanticModel (plant filter per org role).
  dpia_required: false
  ai_generated_output: true
  ai_grounding_measure: >
    Active Actions Text (OPS) — DAX measure that reads current filter context
    and concatenates only triggered action texts. See Storytelling_Principles.md
    §13.
readiness:
  data_availability: partial
  org_capability: developing
  stakeholder_alignment: partial
  overall_readiness: amber
overrides:
  data_contract_ref: core/data_contracts/domains/operations.yaml
documentation:
  business_factsheet: ./Business_Factsheet.md
  evidence_pack: ./Domain_Evidence_Pack.yaml
