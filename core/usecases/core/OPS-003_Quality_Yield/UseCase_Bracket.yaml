schema_version: '2.0'
id: OPS-003
name: Quality & Yield
domain: Operations
governance:
  owner_role: Quality Manager / Ops Controlling
  steward_role: Quality Analytics / Ops BI Lead
  status: active
  last_review: '2026-02-12'
ontology_bracket:
  strategic_kpi_id: quality.fpy.pct
  influencing_kpi_ids:
  - quality.scrap.pct
  - quality.rework.pct
  - quality.copq.amount
  - quality.complaint.pct
  - quality.defect_density
  - ops.planned_output.units
  - sales.units
  action_code_ids:
  - O-Q3.1
  - O-Q3.2
  - O-Q3.3
  - O-Q3.4
  - O-Q3.5
value_driver_model:
  description: quality.fpy.pct is driven by influencing KPIs and operational levers.
  formula: quality.fpy.pct = f(quality.scrap.pct, quality.rework.pct, quality.copq.amount,
    quality.complaint.pct, quality.defect_density, ops.planned_output.units, sales.units)
ux_layout_rules:
  report_structure: 2-Page-Lead
  page_1_summary_insights:
    title: Operations Summary & Insights
    3s_component: 'North Star: quality.fpy.pct'
    30s_components: []
  page_2_execution:
    title: Operations Execution
    300s_components:
    - 'Evidence_Table: (define evidence table requirements)'
    - 'Action_Panel: Integrated Side-Panel for Subscribed Action Codes'
    - 'Payload_Injection: Show Level (L1-L3) and Steps from Action Code YAML'
documentation:
  business_factsheet: ./Business_Factsheet.md
  technical_factsheet: ./Technical_Factsheet.md
