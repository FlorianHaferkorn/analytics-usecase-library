schema_version: '2.0'
id: SCM-003
title: Forecast vs Actual
domain: Supply Chain / Planning
governance:
  owner_role: planning_excellence_controlling
  steward_role: planning_s_op_bi_lead
orchestration:
  strategic_kpi_id: plan.forecast.accuracy.pct
  influencing_kpi_ids:
  - plan.forecast.mape.pct
  - plan.forecast.bias.pct
  - plan.forecast.service_impact.pct
  - plan.replan.count
  supporting_kpi_ids:
  - order.lines
  - plans.count
  - sales.units
  action_code_ids:
  - S-F3.1
  - S-F3.2
  - S-F3.3
  - S-F3.4
primary_kpi_ids:
  - plan.forecast.accuracy.pct
  - plan.forecast.mape.pct

value_driver_model:
  formula: plan.forecast.accuracy.pct = f(plan.forecast.mape.pct, plan.forecast.bias.pct, plan.forecast.service_impact.pct,
    plan.replan.count)
  impact_direction: maximize
  primary_driver: plan.forecast.mape.pct
  impact_logic: Improving plan.forecast.mape.pct is the primary lever for maximizing plan.forecast.accuracy.pct.
ux_layout_rules:
  report_structure: 2-Page-Lead
  report_canvas: { width: 1920, height: 1080 }
  page_1_summary:
    title: Supply Chain / Planning Summary & Insights
    page_type: T2_Tactical_Variance
    template_variant: T2_Comparative
    template_id: pulse
    decision_question: "Is forecast accuracy sufficient to support production and inventory planning?"
    big_idea: "Forecast error is above threshold — systematic bias in the mid-range SKU cluster is driving overstock in two regions and requires model recalibration."
    component_3s:
      kpi_id: plan.forecast.accuracy.pct
      visual_type: kpi_card
    component_30s:
    - slot_id: Main_1
      kpi_id: plan.forecast.mape.pct
      visual_type: trend_line
      message: "Forecast error (MAPE) is running above threshold, driven by systematic bias in the mid-range SKU cluster"
      so_what: "A systematic bias, not random noise, means model recalibration fixes more of the gap than manual overrides."
    - kpi_ids:
      - plan.forecast.bias.pct
      - plan.forecast.service_impact.pct
      - plan.replan.count
      visual_type: bar_chart
      message: "Forecast bias is skewed high and pulling both service impact and replanning volume up with it"
      so_what: "Rising replans are the operational cost of the bias — fixing the model reduces both errors and rework."
  page_2_execution:
    title: Supply Chain / Planning Execution
    page_type: T4_Prescriptive_Recommendation
    template_variant: T4_ActionDecision
    template_id: action_matrix
    component_300s:
      evidence_grain: sku_location_month
      evidence_columns:
      - location
      - channel
      - product_category
      - abc_class
      - xyz_class
      - plan.forecast.mape.pct
      - plan.forecast.bias.pct
      - plan.forecast.service_impact.pct
      - plan.replan.count
      - order.lines
      - plans.count
      - sales.units
      - plan.forecast.accuracy.pct
      action_panel: true
      payload_mode: full
prioritization:
  business_value: high
  implementation_effort: medium
  confidence: 0.7
  reach: division
  priority_score: 23
data_protection:
  # DSGVO Art. 25 Privacy by Design and by Default
  # Authority: core/templates/page_templates/governance/Data_Protection_Governance.md
  personal_data: false
  legal_basis: not_applicable
  data_minimisation: >
    Detail Matrix limited to SKU, region, and planning-horizon grain. Forecast
    accuracy metrics attributed to products and planning units — no natural
    person is identified. Row-level security applied at SemanticModel level.
  access_restriction: >
    supply_chain_controlling_lead and scm_bi_lead roles; row-level security
    enforced by SupplyChain.SemanticModel (site filter per org role).
  dpia_required: false
  ai_generated_output: true
  ai_grounding_measure: >
    Active Actions Text (SCM) — DAX measure that reads current filter context
    and concatenates only triggered action texts. See Storytelling_Principles.md
    §13.
readiness:
  data_availability: partial
  org_capability: developing
  stakeholder_alignment: partial
  overall_readiness: amber
overrides:
  data_contract_ref: core/data_contracts/domains/supply_chain.yaml
documentation:
  business_factsheet: ./Business_Factsheet.md
  evidence_pack: ./Domain_Evidence_Pack.yaml
