schema_version: '2.0'
id: SCM-003
title: Forecast vs Actual
domain: Supply Chain / Planning
governance:
  owner_role: planning_excellence_controlling
  steward_role: planning_s_op_bi_lead
orchestration:
  strategic_kpi_id: KPI-SCM-005
  influencing_kpi_ids:
  - KPI-SCM-017
  - KPI-SCM-006
  - KPI-SCM-012
  - KPI-SCM-014
  supporting_kpi_ids:
  - KPI-SCM-013
  - KPI-COM-012
  action_code_ids:
  - S-F3.1
  - S-F3.2
  - S-F3.3
  - S-F3.4
primary_kpi_ids:
  - KPI-SCM-005
  - KPI-SCM-017

value_driver_model:
  formula: KPI-SCM-005 = f(KPI-SCM-017, KPI-SCM-006, KPI-SCM-012)
  impact_direction: maximize
  primary_driver: KPI-SCM-017
  impact_logic: Improving KPI-SCM-017 is the primary lever for maximizing KPI-SCM-005.
ux_layout_rules:
  report_structure: 2-Page-Lead
  report_canvas: { width: 1920, height: 1080 }
  # R2.4 (Cut C2): migrated to the intent layer, COM-002 as reference pattern.
  intent_rules_version: 2
  page_1_summary:
    title: Supply Chain / Planning Summary & Insights
    page_type: T2_Tactical_Variance
    template_variant: T2_Comparative
    template_id: pulse
    decision_question: "Is forecast accuracy sufficient to support production and inventory planning?"
    big_idea: "Forecast error is above threshold — systematic bias in the mid-range SKU cluster is driving overstock in two regions and requires model recalibration."
    component_3s:
      kpi_id: KPI-SCM-005
      visual_type: kpi_card_with_delta
      comparison: vs_target
      status_logic: higher_is_better
    component_30s:
    - slot_id: Main_1
      kpi_id: KPI-SCM-017
      visual_type: line_chart
      question: "Is forecast error random noise or a systematic bias?"
      message: Forecast error is a systematic bias, not random noise
      so_what: "A systematic bias, not random noise, means model recalibration fixes more of the gap than manual overrides."
      unit: rate
    - slot_id: Main_2
      # R2.4: was 3 KPIs of 2 different calc_types (rate vs. count) on one
      # axis -- a ONE_MESSAGE_PER_CHART violation. plan.replan.count moved
      # to the Detail_Matrix.
      kpi_ids:
      - KPI-SCM-006
      - KPI-SCM-012
      # R6.3 (23.09.2026): Kennzahlen gegensaetzlicher Richtung auf einer Balkenachse
      # (Knock-out mixed-polarity). Je Einheit eine Zeile, je Signal eine Spalte.
      visual_type: exception_table
      category_field: dim_org.OrgName
      question: "What are the forecast-quality signals, and where do they hurt service?"
      message: Forecast bias and downstream service impact — the two forecast-quality signals.
      so_what: "Ranking bias by SKU cluster isolates where a model recalibration removes most of the replanning load."
      unit: rate
  page_2_execution:
    title: Supply Chain / Planning Execution
    decision_question: "Which SKU clusters need forecast-model recalibration versus manual override?"
    page_type: T4_Prescriptive_Recommendation
    template_variant: T4_ActionDecision
    template_id: action_matrix
    component_300s:
      evidence_grain: sku_location_month
      # R2.4: curated 13→8. 'location'/'channel'/KPI-SCM-013/KPI-SCM-014/
      # KPI-COM-012 dropped ('location' has no backing dimension table in
      # SupplyChain.SemanticModel; product_category+ABC/XYZ is the
      # decision-relevant lens, matching SCM-001's own pattern).
      evidence_columns:
      - product_category
      - abc_class
      - xyz_class
      - KPI-SCM-005
      - KPI-SCM-017
      - KPI-SCM-006
      - KPI-SCM-012
      action_panel: true
      payload_mode: full
      sort_by:
        measure: KPI-SCM-017
        direction: descending
      top_n: 20
      highlight_rule:
        column: KPI-SCM-017
        type: data_bar
prioritization:
  business_value: high
  implementation_effort: medium
  confidence: 0.7
  reach: division
  priority_score: 23
data_protection:
  # DSGVO Art. 25 Privacy by Design and by Default
  # Authority: core/templates/page_templates/governance/Data_Protection_Governance.md
  personal_data: false
  legal_basis: not_applicable
  data_minimisation: >
    Detail Matrix limited to SKU, region, and planning-horizon grain. Forecast
    accuracy metrics attributed to products and planning units — no natural
    person is identified. Row-level security applied at SemanticModel level.
  access_restriction: >
    supply_chain_controlling_lead and scm_bi_lead roles; row-level security
    enforced by SupplyChain.SemanticModel (site filter per org role).
  dpia_required: false
  ai_generated_output: true
  ai_grounding_measure: >
    Active Actions Text (SCM) — DAX measure that reads current filter context
    and concatenates only triggered action texts. See Storytelling_Principles.md
    §13.
readiness:
  data_availability: partial
  org_capability: developing
  stakeholder_alignment: partial
  overall_readiness: amber
overrides:
  data_contract_ref: core/data_contracts/domains/supply_chain.yaml
documentation:
  business_factsheet: ./Business_Factsheet.md
  evidence_pack: ./Domain_Evidence_Pack.yaml
