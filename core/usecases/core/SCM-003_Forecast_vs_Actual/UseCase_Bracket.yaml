schema_version: '2.0'
id: SCM-003
name: Forecast vs Actual
domain: Supply Chain / Planning
governance:
  owner_role: Planning Excellence / Controlling
  steward_role: Planning / S&OP BI Lead
  status: active
  last_review: '2026-02-12'
ontology_bracket:
  strategic_kpi_id: plan.forecast.accuracy.pct
  influencing_kpi_ids:
  - plan.forecast.mape.pct
  - plan.forecast.bias.pct
  - plan.forecast.service_impact.pct
  - plan.replan.count
  - order.lines
  - plans.count
  - sales.units
  action_code_ids:
  - S-F3.1
  - S-F3.2
  - S-F3.3
  - S-F3.4
value_driver_model:
  description: plan.forecast.accuracy.pct is driven by influencing KPIs and operational
    levers.
  formula: plan.forecast.accuracy.pct = f(plan.forecast.mape.pct, plan.forecast.bias.pct,
    plan.forecast.service_impact.pct, plan.replan.count, order.lines, plans.count,
    sales.units)
ux_layout_rules:
  report_structure: 2-Page-Lead
  page_1_summary_insights:
    title: Supply Chain / Planning Summary & Insights
    3s_component: 'North Star: plan.forecast.accuracy.pct'
    30s_components: []
  page_2_execution:
    title: Supply Chain / Planning Execution
    300s_components:
    - 'Evidence_Table: (define evidence table requirements)'
    - 'Action_Panel: Integrated Side-Panel for Subscribed Action Codes'
    - 'Payload_Injection: Show Level (L1-L3) and Steps from Action Code YAML'
documentation:
  business_factsheet: ./Business_Factsheet.md
  technical_factsheet: ./Technical_Factsheet.md
