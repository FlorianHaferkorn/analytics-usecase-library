evidence_pack_version: "1.0"
use_case_id: SCM-003
use_case_title: Forecast vs Actual
domain: Supply Chain / Planning
authored_date: "2026-06-13"
authored_by: framework-architect-agent
reviewed_by: ""
status: draft

# ──────────────────────────────────────────
# 1. PROCESS SCOPE
# ──────────────────────────────────────────
process_scope:
  description: >
    Demand forecasting accuracy and bias: how closely the demand forecast tracks actual
    sales by SKU/location/period, the error (MAPE/WMAPE) and directional bias that erode it,
    the service and re-plan consequences those errors generate, and whether the forecasting
    process itself adds value over a naive benchmark (Forecast Value Added). Distinct from
    SCM-001 (inventory optimization) — this use case isolates the quality of the demand
    signal that feeds supply and inventory planning within the S&OP / IBP cycle.
  in_scope:
    - Forecast Accuracy % and the error decomposition (MAPE, WMAPE) that drives it
    - Forecast Bias % as the directional (over/under-forecasting) signal distinct from error magnitude
    - Service impact (OTIF/stockout) attributable to forecast error, and re-plan frequency as instability
    - Forecast Value Added (FVA) versus a naive benchmark — whether the process adds or destroys value
    - Forecastability segmentation (ABC/XYZ, demand volatility) as the context for accuracy targets
    - Forecast-gaming guardrail (no sandbagging / hockey-stick bias to hit a target number)
  out_of_scope:
    - Promotion-specific uplift modelling (COM-004)
    - Portfolio mix and assortment strategy (COM-009)
    - Detailed inventory optimization and safety-stock sizing (SCM-001)
    - Supply-side capacity and constraint planning (separate supply planning use case)
  industry_segment: >
    Any demand-driven supply chain — CPG/FMCG, retail, industrial distribution, manufacturing,
    pharma, and B2B. Applicable wherever a periodic demand forecast feeds production, procurement,
    and inventory decisions through an S&OP / IBP process.
  applicable_frameworks:
    - name: APICS / ASCM Sales & Operations Planning (S&OP) body of knowledge
      id: ASCM-SOP
    - name: ASCM SCOR Digital Standard — Plan process (forecasting, demand planning)
      id: ASCM-SCOR
    - name: IBF forecast error metrics (MAPE, WMAPE, bias, MAD) and benchmarking
      id: IBF-METRICS
    - name: Forecast Value Added (FVA) analysis — naive-benchmark process evaluation
      id: FVA
    - name: CSCMP Suggested Minimum Supply Chain Benchmarking Standards
      id: CSCMP-BENCH

# ──────────────────────────────────────────
# 2. CANONICAL DOMAIN MODEL (DRIVER TREE)
# ──────────────────────────────────────────
canonical_domain_model:
  outcome_kpis:
    - id: plan.forecast.accuracy.pct
      name: Forecast Accuracy %
      definition: >
        Forecast Accuracy = 1 − WMAPE (or 100% − MAPE) at the chosen grain. The proportion of
        demand the forecast correctly anticipated. The primary planning outcome and the strategic
        KPI of SCM-003; it gates production, procurement, and inventory decisions in S&OP.
      unit: "%"
      direction: maximize
      benchmark_target: "World-class ~80–90% (≈10–20% WMAPE) for stable/high-volume SKUs; lumpy/intermittent SKUs far lower — read against forecastability, not a single flat target (IBF)"
      benchmark_source_id: SRC-007
      iso_reference: "APICS/ASCM S&OP demand-plan accuracy; IBF forecast error metrics"

  driver_kpis:
    - id: plan.forecast.mape.pct
      name: Forecast Error (MAPE / WMAPE) %
      definition: >
        Mean / Weighted Mean Absolute Percentage Error of forecast versus actual. The magnitude
        of forecast error irrespective of direction. The primary lever on accuracy; WMAPE is
        preferred over plain MAPE because small actuals inflate MAPE.
      unit: "%"
      direction: minimize
      drives: plan.forecast.accuracy.pct
      causal_mechanism: >
        Accuracy is the complement of error: every point of WMAPE is a point of lost accuracy.
        WMAPE weights error by volume so high-revenue SKUs dominate the number, making it the
        actionable entry point for error reduction (Hyndman & Athanasopoulos; IBF).
      benchmark_target: "World-class 10–20% WMAPE for stable high-volume demand; intermittent demand structurally higher (IBF; Makridakis M-competitions)"
      benchmark_source_id: SRC-007

    - id: plan.forecast.bias.pct
      name: Forecast Bias %
      definition: >
        Signed mean forecast error: (Forecast − Actual) / Actual over the period. Measures
        systematic over- or under-forecasting (direction), distinct from MAPE which measures
        magnitude only.
      unit: "%"
      direction: target_zero
      drives: plan.forecast.accuracy.pct
      causal_mechanism: >
        Bias is the directional defect MAPE cannot see: a forecast can have moderate MAPE yet
        persistent positive bias that systematically overstocks. Bias near zero is the
        precondition for accuracy gains to translate into balanced inventory (IBF; Gilliland).
      benchmark_target: "World-class |bias| ≈ 0 (within ±5% tracking-signal band); persistent one-sided bias indicates process or gaming problem (IBF; Gilliland)"
      benchmark_source_id: SRC-007

    - id: plan.forecast.service_impact.pct
      name: Forecast Service Impact %
      definition: >
        Share of OTIF misses / stockouts attributable to forecast error (under-forecast driving
        shortage, over-forecast driving excess/obsolescence). Translates forecast quality into a
        service and working-capital consequence.
      unit: "%"
      direction: minimize
      drives: plan.forecast.accuracy.pct
      causal_mechanism: >
        Forecast error is only material where it breaks service or ties up capital. Linking error
        to OTIF/stockout focuses action on the SKU/location clusters where accuracy actually
        moves the business outcome (ASCM S&OP; CSCMP).
      benchmark_target: "Declining trend; forecast-attributable service misses should fall as accuracy rises and bias centres (CSCMP benchmarking)"
      benchmark_source_id: SRC-006

    - id: plan.replan.count
      name: Re-Plan Count
      definition: >
        Count of forecast-driven re-plan / re-forecast events in the period. A measure of plan
        instability and nervousness in the S&OP cycle.
      unit: count
      direction: minimize
      drives: plan.forecast.accuracy.pct
      causal_mechanism: >
        Frequent re-plans signal a forecast the organisation does not trust; they consume
        planner capacity and propagate nervousness into supply. Stable accuracy reduces re-plan
        volume; high re-plans with stable accuracy point to process churn, not signal change (ASCM S&OP).
      benchmark_target: "Declining trend; re-plans should track genuine demand shifts, not process churn (ASCM S&OP)"
      benchmark_source_id: SRC-001

  diagnostic_kpis:
    - id: plan.forecast.fva
      name: Forecast Value Added (FVA)
      definition: "Accuracy of the analyst/statistical forecast minus accuracy of a naive benchmark (e.g. last period = next period). Positive FVA means the process adds value."
      unit: "%"
      direction: maximize
      diagnoses: plan.forecast.mape.pct
      causal_mechanism: >
        FVA is the lean diagnostic for the forecasting process itself: if a process step does not
        beat the naive benchmark, it is waste and should be removed. Negative FVA explains
        persistent error that model tuning alone cannot fix (Gilliland FVA; SAS).

    - id: plans.count
      name: Plan / Forecast Version Count
      definition: "Count of stored forecast versions (fact_forecast). Denominator context for re-plan frequency and FVA step comparison."
      unit: count
      direction: minimize
      diagnoses: plan.replan.count
      causal_mechanism: >
        Version count exposes how many process hands touch the forecast; each touch is an FVA
        step to evaluate. Excess versions without accuracy gain is process waste (Gilliland FVA).

    - id: sales.units
      name: Actual Sales Units
      definition: "Actual demand realised (fact_sales). The actuals denominator behind every accuracy, MAPE, and bias calculation."
      unit: count
      direction: maximize
      diagnoses: plan.forecast.accuracy.pct
      causal_mechanism: >
        Small or intermittent actuals inflate MAPE and destabilise accuracy; actual-volume context
        is required to choose WMAPE over MAPE and to segment by forecastability (IBF; Hyndman).

  guardrails:
    - description: Forecast must never be gamed to hit a target (no sandbagging / hockey-stick bias)
      condition: >
        Forecasts must NOT be padded down (sandbagging) or inflated (hockey-stick) to make a
        target acceptable or beatable. Deliberate bias to game an incentive corrupts the demand
        signal and propagates excess or shortage downstream (Gilliland worst practices; IBF bias guidance).
      affected_kpis: [plan.forecast.bias.pct, plan.forecast.accuracy.pct, plan.replan.count]

    - description: Exclude launches and promotions from baseline accuracy
      condition: >
        New-product launches and promotional periods must be flagged and segmented out of baseline
        statistical accuracy so deliberate demand-shaping is not read as a forecasting failure
        (ASCM S&OP; FVA process segmentation).
      affected_kpis: [plan.forecast.accuracy.pct, plan.forecast.mape.pct]

    - description: Read accuracy against forecastability, not a single flat target
      condition: >
        Accuracy and MAPE targets must be set per forecastability segment (ABC/XYZ, demand
        coefficient of variation). Holding lumpy/intermittent SKUs to a stable-demand target sets
        an unachievable goal and misdirects effort (forecastability; IBF benchmarking).
      affected_kpis: [plan.forecast.accuracy.pct, plan.forecast.mape.pct]

  wrong_interpretations:
    - description: "Reading forecast bias from MAPE (confusing magnitude with direction)"
      why_wrong: >
        MAPE/WMAPE is unsigned — it cannot reveal systematic over- or under-forecasting. A low-MAPE
        forecast can still carry persistent positive bias that quietly overstocks. Bias must be
        measured separately with a signed metric / tracking signal (IBF forecast error metrics).
      source_id: SRC-007

    - description: "Benchmarking accuracy against a flat industry number, ignoring forecastability"
      why_wrong: >
        Comparing a portfolio's accuracy to a single industry figure is misleading when demand
        volatility (forecastability) differs. Low accuracy on intermittent demand is not poor
        forecasting; benchmarking is 'dead' without a forecastability baseline (forecastability source).
      source_id: SRC-010

    - description: "Assuming a complex statistical/model step always adds value"
      why_wrong: >
        A forecasting step that does not beat a naive benchmark destroys value. Without FVA analysis,
        organisations invest in model complexity that makes the forecast worse than 'last period =
        next period' — the central finding of FVA and the M-competitions (Gilliland; Makridakis).
      source_id: SRC-008

    - description: "Treating raw MAPE as reliable on low-volume / intermittent SKUs"
      why_wrong: >
        MAPE is inflated to extreme or undefined values when actuals are small or zero, over-weighting
        low-volume items. WMAPE (volume-weighted) must be used instead so the number reflects business
        impact (Hyndman & Athanasopoulos; IBF WMAPE guidance).
      source_id: SRC-003

# ──────────────────────────────────────────
# 3. REQUIRED DATA MODEL
# ──────────────────────────────────────────
required_data_model:
  required_facts:
    - table: fact_forecast
      description: >
        Forecast version log. Must contain: forecast quantity, forecast_version, snapshot_date,
        sku_id, location_id, period, and method/source. Provides accuracy, MAPE, bias, FVA step
        comparison and re-plan derivation.
    - table: fact_sales
      description: >
        Actual demand fact. Must contain: actual sales/shipped units at sku/location/period grain.
        The actuals denominator for accuracy, MAPE, WMAPE, and bias.
    - table: fact_fulfillment
      description: >
        Order fulfilment fact (OTIF). Must contain: ordered vs delivered lines, on-time flag, at
        sku/location/order grain. Required to attribute service impact to forecast error.
    - table: fact_stockout
      description: >
        Stockout / shortage events. Must contain: stockout records at sku/location/period grain.
        Required for the under-forecast → shortage side of service impact.

  required_dimensions:
    - name: dim_date
      grain_relevance: "Time axis for accuracy/bias trend and re-plan. CalendarMonth + CalendarWeek required."
    - name: dim_org
      grain_relevance: "Region → Channel → Location hierarchy. Location level mandatory for forecast diagnostics."
    - name: dim_product
      grain_relevance: "SKU → Category → Family for accuracy ranking and bias decomposition."
    - name: dim_forecastability
      grain_relevance: >
        ABC/XYZ and demand-volatility (coefficient of variation) classification for setting
        segment-specific accuracy targets. Not present in the current data contract — model_gap.
    - name: security_user_org
      grain_relevance: "Row-level security mapping of user to org/site for the SupplyChain semantic model."

  preferred_grain: sku-location-month
  minimum_grain: category-location-month
  minimum_history_months: 12
  grain_waiver_condition: >
    category-location-month grain is acceptable only where SKU-level forecast/actual alignment is
    structurally unavailable. Requires explicit waiver in the bracket; bad-actor SKU bias analysis
    and forecastability segmentation are degraded.

  required_measures:
    - name: Forecast Accuracy %
      formula_seed: "1 - (SUM(ABS(Forecast - Actual)) / SUM(Actual))"
      source_id: SRC-007
    - name: Forecast Error (WMAPE) %
      formula_seed: "SUM(ABS(Forecast - Actual)) / SUM(Actual)"
      source_id: SRC-003
    - name: Forecast Bias %
      formula_seed: "SUM(Forecast - Actual) / SUM(Actual)"
      source_id: SRC-007
    - name: Forecast Value Added (FVA)
      formula_seed: "Accuracy_Process - Accuracy_Naive_Benchmark"
      source_id: SRC-008
    - name: Forecast Service Impact %
      formula_seed: "Forecast_Attributable_Service_Misses / Total_Service_Misses"
      source_id: SRC-006
    - name: Re-Plan Count
      formula_seed: "DISTINCTCOUNT(Replan_Event_Id)"
      source_id: SRC-001

# ──────────────────────────────────────────
# 4. ACTION LOGIC SEEDS
# ──────────────────────────────────────────
action_logic_seeds:
  - trigger_driver: plan.forecast.bias.pct
    trigger_diagnostic: plan.forecast.fva
    trigger_condition: "Persistent one-sided bias on a SKU/location cluster AND tracking signal outside ±band"
    guardrail: "Confirm bias is not a flagged launch/promo; rule out sandbagging/hockey-stick gaming"
    action_description: >
      Forecast bias correction: decompose bias by product family and input source, identify the
      systematic over/under-forecast driver, and recentre the baseline so bias returns toward zero.
    expected_outcome_kpi: plan.forecast.bias.pct
    action_code_candidate: S-F3.1

  - trigger_driver: plan.forecast.mape.pct
    trigger_diagnostic: plan.forecast.fva
    trigger_condition: "WMAPE above target AND FVA low/negative (model not beating naive benchmark)"
    guardrail: "Use WMAPE not raw MAPE; validate against forecastability segment before refitting"
    action_description: >
      Model refit / FVA cleanup: run FVA across the process steps, strip steps that do not beat the
      naive benchmark, and refit the statistical model on the high-error volume-weighted SKUs.
    expected_outcome_kpi: plan.forecast.mape.pct
    action_code_candidate: S-F3.2

  - trigger_driver: plan.forecast.mape.pct
    trigger_diagnostic: sales.units
    trigger_condition: "High WMAPE concentrated in volatile / intermittent (XYZ-Z) or new-launch demand"
    guardrail: "Confirm the segment is genuinely low-forecastability before changing method"
    action_description: >
      Forecast method review / demand sensing: switch high-volatility or launch SKUs from statistical
      baseline to demand-sensing / analogous / bottom-up methods sized to their forecastability.
    expected_outcome_kpi: plan.forecast.mape.pct
    action_code_candidate: S-F3.3

  - trigger_driver: plan.forecast.service_impact.pct
    trigger_diagnostic: plan.replan.count
    trigger_condition: "Forecast-attributable service misses rising AND re-plan count elevated"
    guardrail: "Link service miss to forecast error (not supply constraint) before acting"
    action_description: >
      Service-impact containment: trace OTIF/stockout misses to under/over-forecast, stabilise the
      affected forecasts, and reduce re-plan nervousness on the impacted SKU/location set.
    expected_outcome_kpi: plan.forecast.service_impact.pct
    action_code_candidate: S-F3.4

  - trigger_driver: plan.forecast.accuracy.pct
    trigger_diagnostic: plan.forecast.fva
    trigger_condition: "Portfolio accuracy below target with no forecastability-aware targets set"
    guardrail: "Set segment-specific targets; do not benchmark against a flat industry number"
    action_description: >
      Forecastability-based target reset: segment the portfolio by ABC/XYZ and demand volatility,
      set achievable accuracy/MAPE targets per segment, and reallocate planner effort to the
      forecastable, high-impact SKUs where FVA is positive.
    expected_outcome_kpi: plan.forecast.accuracy.pct
    action_code_candidate: S-F3.1

