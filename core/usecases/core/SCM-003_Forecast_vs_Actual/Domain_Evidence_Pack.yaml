# 6. MAPPING READINESS
# ──────────────────────────────────────────
mapping_readiness:
  kpi_catalog_coverage: complete
  factsheet_coverage: complete
  bracket_coverage: complete
  action_code_coverage: complete
  semantic_model_coverage: partial

  gap_summary:
    content_gaps:
      - gap_type: content_gap
        severity: medium
        affected_artifact: core/usecases/core/SCM-003_Forecast_vs_Actual/Business_Factsheet.md
        field: "Section 8 Success Criteria / benchmark targets"
        description: >
          Benchmark targets not stated: world-class accuracy ~80–90% (10–20% WMAPE) for stable
          high-volume demand, bias near zero (±5% tracking-signal band), and positive FVA versus a
          naive benchmark — read against forecastability, not a flat number (IBF / CSCMP / FVA).
          Added to make success criteria measurable.
        evidence_reference: SRC-006 SRC-007 SRC-008
        remediation: "Add accuracy / WMAPE / bias / FVA world-class targets to the factsheet success criteria."
        status: resolved

    mapping_gaps: []

    schema_gaps: []

    generator_gaps: []

    model_gaps:
      - gap_type: model_gap
        severity: high
        affected_artifact: core/data_contracts/domains/supply_chain.yaml
        field: dim_forecastability (ABC/XYZ + demand coefficient of variation)
        description: >
          No forecastability dimension exists. Segment-specific accuracy targets and the
          forecastability-aware action (S-F3.1 / S-F3.3) require ABC/XYZ and demand-volatility
          classification at the SKU/location grain, which the current data contract does not define.
        evidence_reference: SRC-007 SRC-010
        remediation: "Add dim_forecastability (ABC/XYZ + CoV bands) to the supply_chain contract and bind it to SKU/location grain."
        status: open

      - gap_type: model_gap
        severity: medium
        affected_artifact: core/data_contracts/domains/supply_chain.yaml
        field: fact_forecast (naive-benchmark and FVA step lineage)
        description: >
          FVA requires a naive-benchmark forecast and per-step forecast versions stored alongside the
          analyst/statistical forecast. fact_forecast is referenced by the factsheet but its
          naive-benchmark and process-step lineage is not defined in the data contract.
        evidence_reference: SRC-008
        remediation: "Define fact_forecast with naive-benchmark and per-step version columns and bind the FVA measure lineage."
        status: open
