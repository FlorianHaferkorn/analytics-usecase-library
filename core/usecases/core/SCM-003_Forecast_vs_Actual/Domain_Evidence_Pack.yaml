evidence_pack_version: "1.0"
use_case_id: SCM-003
use_case_title: Forecast vs Actual
domain: Supply Chain / Planning
authored_date: "2026-06-11"
authored_by: framework-architect-agent
reviewed_by: "framework-architect-agent — SQ-E evidence gate pass + mapping triage (2026-06-12)"
status: approved
approved_by: "Framework Architect — repo owner (authorized 2026-06-12)"
approved_date: "2026-06-12"
approval_basis: "16/16 SQ-E gate; all deferred items classified model_gap (no schema_gap); see docs/process/evidence-to-model-uplift-scope.md"

process_scope:
  description: >
    Demand forecast quality management within the S&OP/IBP cycle: maximise forecast
    accuracy and minimise systematic bias so that production, inventory, and service
    planning are stable. Covers forecast accuracy (1 - MAPE), MAPE, bias (mean
    percentage error), the service impact of forecast error, and replan frequency.
    Grounded in IBF metrics, APICS/ASCM S&OP-IBP, Hyndman & Athanasopoulos error
    measures, and Gilliland's Forecast Value Added discipline at SKU-location-month grain.
  in_scope:
    - Forecast accuracy % (1 - MAPE) by channel, category, location, and ABC/XYZ class
    - MAPE (Mean Absolute Percentage Error) as the magnitude-of-error driver
    - Forecast bias % (mean percentage error) as the directional-error driver
    - Service impact % linking forecast error to OTIF/stockout outcomes
    - Replan count as a planning-stability / nervousness signal
    - Forecast Value Added vs a naive benchmark and forecastability (CoV) diagnostics
  out_of_scope:
    - Promotion-specific uplift / cannibalisation models (COM-004)
    - Portfolio and product-mix strategy (COM-009)
    - Detailed inventory and safety-stock optimisation (SCM-001)
    - Downstream OTIF execution and carrier/lane management (SCM-002)
  industry_segment: Manufacturing and distribution running a monthly S&OP/IBP demand-planning cycle
  applicable_frameworks:
    - name: IBF (Institute of Business Forecasting & Planning) — forecast error metrics and benchmarking
      id: IBF-METRICS
    - name: APICS/ASCM — Sales & Operations Planning (S&OP) and Integrated Business Planning (IBP)
      id: ASCM-SOP-IBP
    - name: SCOR Digital Standard — Plan attribute (Forecast Accuracy, planning reliability)
      id: SCOR-DS-PLAN
    - name: "Hyndman, R.J. & Athanasopoulos, G. — Forecasting: Principles and Practice (error measures, MAPE, MASE, bias)"
      id: HYNDMAN-FPP

canonical_domain_model:
  outcome_kpis:
    - id: plan.forecast.accuracy.pct
      name: Forecast Accuracy %
      definition: >
        Accuracy = 1 - MAPE (clamped at 0), expressing how close the forecast is to actual
        demand. Higher is better. Reported at SKU-location-month and aggregated weighted by
        volume (WMAPE) to avoid small-denominator distortion (Hyndman & Athanasopoulos; IBF).
      unit: "%"
      direction: maximize
      benchmark_target: "World-class ~80%+ accuracy for stable SKUs; FMCG mature items ~85-90%; new/intermittent SKUs far lower (IBF Benchmarking Forecast Errors 2023-2024)"
      benchmark_source_id: SRC-004

  driver_kpis:
    - id: plan.forecast.mape.pct
      name: MAPE (Mean Absolute Percentage Error)
      definition: "mean(|Actual - Forecast| / Actual) over the evaluation window; the magnitude of forecast error regardless of direction."
      unit: "%"
      direction: minimize
      drives: plan.forecast.accuracy.pct
      causal_mechanism: >
        MAPE is the inverse face of accuracy (Accuracy = 1 - MAPE) and the primary lever:
        reducing absolute percentage error directly raises accuracy. It is the magnitude
        component and must be paired with bias because MAPE alone is asymmetric and favours
        under-forecasting (Hyndman & Athanasopoulos).
      benchmark_target: "<= 15-20% MAPE for mature/stable demand; volatile SKUs higher (IBF)"
      benchmark_source_id: SRC-004
    - id: plan.forecast.bias.pct
      name: Forecast Bias %
      definition: "mean((Forecast - Actual) / Actual); positive = systematic over-forecast, negative = systematic under-forecast."
      unit: "%"
      direction: minimize
      drives: plan.forecast.accuracy.pct
      causal_mechanism: >
        Bias is the directional component of error. A forecast can have acceptable MAPE yet
        a large persistent bias that systematically over- or under-stocks. Bias is the lever
        for inventory/service consequences because direction, not just magnitude, drives
        overstock vs stockout (Hyndman & Athanasopoulos; IBF).
      benchmark_target: "Within +/-5% (effectively unbiased); |bias| > 10% signals systematic correction needed (IBF)"
      benchmark_source_id: SRC-004
    - id: plan.forecast.service_impact.pct
      name: Service Impact %
      definition: "% of demand/orders where forecast error translated into an OTIF miss or stockout; links forecast quality to service outcomes."
      unit: "%"
      direction: minimize
      drives: plan.forecast.accuracy.pct
      causal_mechanism: >
        Service impact closes the loop between Plan and Deliver: under-forecast bias and high
        MAPE on covered SKUs propagate into stockouts and In-Full failures (SCM-002). It is
        the consequence metric that justifies forecast investment (SCOR Plan-to-Deliver link).
      benchmark_target: "Minimise; forecast-attributable service misses < 2% of demand"
      benchmark_source_id: SRC-008
    - id: plan.replan.count
      name: Replan Count
      definition: "Number of forecast/plan version changes per SKU-cluster per period; a planning-stability / nervousness signal."
      unit: count
      direction: minimize
      drives: plan.forecast.accuracy.pct
      causal_mechanism: >
        Frequent replanning indicates plan instability ('nervousness') that itself degrades
        execution and signals an unstable baseline or unmanaged demand inputs. Excessive
        replans rarely add accuracy and often subtract Forecast Value Added (Gilliland).
      benchmark_target: "Minimise unplanned replans; track against an FVA baseline (Gilliland)"
      benchmark_source_id: SRC-005

  diagnostic_kpis:
    - id: plan.forecast.bias_by_family.pct
      name: Bias by Product Family
      definition: "Forecast bias decomposed by product family / input source to localise systematic over- or under-forecast."
      unit: "%"
      direction: minimize
      diagnoses: plan.forecast.bias.pct
      causal_mechanism: Aggregate bias near zero can hide offsetting family-level biases; family decomposition reveals the systematic over/under clusters.
    - id: plan.forecast.mape_by_horizon.pct
      name: MAPE by Forecast Horizon (lag)
      definition: "MAPE measured at each lag/horizon (e.g., lag-1 vs lag-3 months) to show how error grows with horizon."
      unit: "%"
      direction: minimize
      diagnoses: plan.forecast.mape.pct
      causal_mechanism: Error that explodes at longer horizons points to model/seasonality limits; flat error points to data or input problems.
    - id: plan.demand_cov.ratio
      name: Demand Volatility (Coefficient of Variation)
      definition: "CoV = stddev(demand) / mean(demand) per SKU; the forecastability signal that contextualises whether high MAPE is fixable."
      unit: ratio
      direction: minimize
      diagnoses: plan.forecast.mape.pct
      causal_mechanism: >
        High MAPE on a high-CoV (low-forecastability) SKU is largely irreducible; high MAPE
        on a low-CoV SKU is a fixable process failure. CoV separates 'hard to forecast' from
        'badly forecast' and frames the Forecast Value Added question (Gilliland; IBF).
    - id: plan.fva.pp
      name: Forecast Value Added vs Naive (pp)
      definition: "Accuracy of the statistical/consensus forecast minus accuracy of a naive (random-walk/seasonal-naive) benchmark, in percentage points."
      unit: pp
      direction: maximize
      diagnoses: plan.forecast.accuracy.pct
      causal_mechanism: >
        FVA quantifies whether the forecasting process beats doing nothing. Negative FVA means
        the process performs worse than a naive forecast and should be simplified — a common,
        costly failure mode (Gilliland: a large share of forecasts are worse than naive).

  guardrails:
    - description: New-product and promo exclusion from baseline accuracy
      condition: >
        Do NOT trigger model-refit or bias-correction actions on SKUs in launch (< ~6 months)
        or under active promotion using the statistical baseline accuracy. These need
        analogous/bottom-up methods and a separate evaluation; mixing them inflates aggregate MAPE.
      affected_kpis: [plan.forecast.accuracy.pct, plan.forecast.mape.pct, plan.forecast.bias.pct]
    - description: Forecastability floor (do not chase irreducible error)
      condition: >
        Do NOT set accuracy targets that ignore demand volatility. For high-CoV / intermittent
        SKUs, target Forecast Value Added over a naive benchmark, not an absolute MAPE, to avoid
        wasting effort on irreducible error.
      affected_kpis: [plan.forecast.mape.pct, plan.fva.pp]
    - description: Plan-stability vs over-reaction
      condition: >
        Do NOT replan on a single-period demand shock that is within normal volatility. Replanning
        on noise increases nervousness without adding accuracy and can reduce FVA.
      affected_kpis: [plan.replan.count, plan.forecast.accuracy.pct]

  wrong_interpretations:
    - description: Averaging MAPE across SKUs hides bias and small-denominator distortion
      why_wrong: >
        A simple SKU average MAPE is dominated by low-volume SKUs (small actuals inflate
        percentage error) and conceals systematic bias entirely — a portfolio can show
        acceptable mean MAPE while being heavily over-forecast. Use volume-weighted MAPE
        (WMAPE) and always report bias alongside magnitude (Hyndman & Athanasopoulos).
      source_id: SRC-006
    - description: High accuracy on easy SKUs read as good forecasting (no FVA check)
      why_wrong: >
        Reporting high accuracy on stable, easy-to-forecast SKUs masks poor forecastability
        management elsewhere and ignores whether the process beats a naive benchmark. Without
        Forecast Value Added, a process can score 'high accuracy' while performing worse than a
        random walk on the SKUs that matter (Gilliland: a large share of forecasts are worse
        than naive).
      source_id: SRC-005
    - description: MAPE treated as symmetric and direction-free
      why_wrong: >
        MAPE is asymmetric: it penalises over-forecast and under-forecast unequally and
        structurally favours under-forecasting, so optimising MAPE alone can induce a downward
        bias that drives stockouts. Magnitude (MAPE) and direction (bias) must be read together
        (Hyndman & Athanasopoulos).
      source_id: SRC-006
    - description: Forecast accuracy improvement claimed without controlling for demand volatility
      why_wrong: >
        An accuracy gain that merely reflects a shift toward more stable demand (lower CoV) is
        not a process improvement. Accuracy must be contextualised by forecastability (CoV) and
        by FVA vs naive, or improvement is illusory (IBF forecastability).
      source_id: SRC-007

required_data_model:
  required_facts:
    - table: fact_forecast
      description: Demand forecast by SKU, location, and month with forecast version (for accuracy, MAPE, bias, replan, and FVA-by-version).
    - table: fact_sales
      description: Actual sales units by SKU and month — the actual demand baseline for accuracy/MAPE/bias.
    - table: fact_fulfillment
      description: Order-level OTIF/On-Time/In-Full flags to attribute forecast error to service impact (link to SCM-002).
    - table: fact_stockout
      description: Stockout events and lost demand to quantify the service impact of under-forecast bias.
  required_dimensions:
    - name: dim_product
      grain_relevance: SKU/category and ABC/XYZ class for forecastability segmentation and bias-by-family.
    - name: dim_org
      grain_relevance: Location/region/channel attribution of accuracy and bias.
    - name: dim_date
      grain_relevance: Month grain for S&OP cadence; horizon/lag derived from forecast version vs actual month.
  preferred_grain: sku_location_month
  minimum_grain: sku_location_month
  minimum_history_months: 24
  required_measures:
    - name: Forecast Accuracy %
      formula_seed: "1 - MAPE (clamped at 0); aggregated as 1 - WMAPE for portfolios"
      source_id: SRC-004
    - name: MAPE
      formula_seed: "AVERAGE( ABS(Actual - Forecast) / Actual ) over evaluated SKU-location-months"
      source_id: SRC-006
    - name: WMAPE
      formula_seed: "SUM( ABS(Actual - Forecast) ) / SUM(Actual)"
      source_id: SRC-006
    - name: Forecast Bias %
      formula_seed: "AVERAGE( (Forecast - Actual) / Actual )  (mean percentage error)"
      source_id: SRC-006
    - name: Forecast Value Added (pp)
      formula_seed: "Accuracy(statistical/consensus forecast) - Accuracy(naive/seasonal-naive benchmark)"
      source_id: SRC-005
    - name: Demand Volatility (CoV)
      formula_seed: "STDEV(Sales Units) / AVERAGE(Sales Units) per SKU"
      source_id: SRC-007
    - name: Replan Count
      formula_seed: "COUNT of distinct Forecast Version changes per SKU-cluster per period"
      source_id: SRC-002

action_logic_seeds:
  - trigger_driver: plan.forecast.bias.pct
    trigger_diagnostic: plan.forecast.bias_by_family.pct
    trigger_condition: "|Bias| > 10% for 3 consecutive cycles on a product family (e.g., persistent +15% over-forecast)"
    guardrail: "Exclude launch (<6 months) and active-promotion SKUs from baseline bias correction"
    action_description: Forecast bias correction — decompose bias by family/input source and recalibrate baseline or consensus inputs.
    expected_outcome_kpi: plan.forecast.accuracy.pct
    action_code_candidate: S-F3.1
  - trigger_driver: plan.forecast.mape.pct
    trigger_diagnostic: plan.fva.pp
    trigger_condition: "MAPE above target AND Forecast Value Added <= 0 (process no better than naive) on a low-CoV cluster"
    guardrail: "Do not refit on high-CoV/intermittent SKUs where error is largely irreducible"
    action_description: Forecast model refit / method review — replace or simplify the model where it underperforms a naive benchmark.
    expected_outcome_kpi: plan.forecast.mape.pct
    action_code_candidate: S-F3.2
  - trigger_driver: plan.forecast.mape.pct
    trigger_diagnostic: plan.demand_cov.ratio
    trigger_condition: "High MAPE concentrated in new-product launches or high-CoV SKUs accounting for the majority of total error"
    guardrail: "Do not apply statistical-baseline targets to launch/intermittent demand"
    action_description: Forecast method segmentation and demand-sensing activation for new/volatile SKUs (analogous/bottom-up, shorter horizon).
    expected_outcome_kpi: plan.forecast.accuracy.pct
    action_code_candidate: S-F3.3
  - trigger_driver: plan.forecast.service_impact.pct
    trigger_diagnostic: plan.forecast.bias.pct
    trigger_condition: "Service impact % rising AND traced to negative (under-forecast) bias on covered SKUs"
    guardrail: "Hand off recovery execution to SCM-002; replan only beyond normal volatility"
    action_description: Replan and service-protection trigger — adjust plan and coordinate with OTIF execution (SCM-002) where forecast error is causing stockouts.
    expected_outcome_kpi: plan.forecast.service_impact.pct
    action_code_candidate: S-F3.4

