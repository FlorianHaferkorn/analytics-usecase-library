schema_version: '2.0'
id: XD-003
title: Executive KPI Overview
domain: Executive / Cross-Functional
governance:
  owner_role: finance_strategy_ops_controlling
  steward_role: enterprise_bi_lead
orchestration:
  strategic_kpi_id: KPI-GOV-004
  influencing_kpi_ids:
  - KPI-COM-013
  - KPI-COM-008
  - KPI-CUS-001
  - KPI-SVC-004
  - KPI-SCM-007
  - KPI-FIN-006
  - KPI-SVC-002
  - KPI-SVC-003
  supporting_kpi_ids:
  - KPI-FIN-011
  - KPI-CUS-006
  - KPI-CUS-004
  - KPI-SVC-001
  - KPI-CUS-005
  - KPI-CUS-003
  - KPI-CUS-002
  - KPI-COM-005
  - KPI-SCM-007
  - KPI-SCM-008
  - KPI-SCM-018
  - KPI-SCM-009
  - KPI-SVC-005
  - KPI-SVC-006
  - KPI-SVC-007
  - KPI-SVC-008
  - KPI-SVC-013
  - KPI-SVC-014
  - KPI-FIN-001
  - KPI-FIN-004
  - KPI-FIN-005
  action_code_ids:
  - X-E3.2
primary_kpi_ids:
  - KPI-GOV-004
  - KPI-COM-013

value_driver_model:
  formula: KPI-GOV-004 = f(KPI-COM-013, KPI-COM-008, KPI-CUS-001, KPI-SVC-004,
    KPI-SCM-007, KPI-FIN-006, KPI-SVC-002, KPI-SVC-003)
  impact_direction: minimize
  primary_driver: KPI-COM-013
  impact_logic: Enterprise value at risk rises when profitability, service, working-capital, people, or action-effectiveness signals deteriorate.
ux_layout_rules:
  report_structure: 2-Page-Lead
  report_canvas: { width: 1920, height: 1080 }
  # R2.4 (Cut C2): migrated to the intent layer, COM-002 as reference pattern.
  intent_rules_version: 2
  page_1_summary:
    title: Executive / Cross-Functional Summary & Insights
    page_type: T1_Strategic_Overview
    template_variant: T1_Portfolio
    template_id: pulse
    decision_question: "Are we on track across all strategic KPIs this quarter?"
    big_idea: "Revenue growth is on track but GM% compression and OTIF decline signal execution risk that requires executive intervention."
    component_3s:
      kpi_id: KPI-GOV-004
      visual_type: kpi_card_with_delta
      comparison: vs_target
      status_logic: lower_is_better
    component_30s:
    - slot_id: Main_1
      kpi_id: KPI-COM-008
      visual_type: line_chart
      question: "Are we on track across the strategic KPIs — and is growth holding?"
      message: Net sales growth versus last year is softening quarter to quarter
      so_what: "A softening growth rate is the first sign the on-track story could reverse next quarter."
      unit: rate
    - slot_id: Main_2
      # R2.4: was slot_id Main_3 but positionally bound to Main_2 (component_30s
      # binds by list position, not by its own slot_id label -- relabeled for
      # clarity). Was also 3 KPIs of 3 different calc_types (amount/ratio/rate)
      # on one axis -- a ONE_MESSAGE_PER_CHART violation. KPI-CUS-001 and
      # KPI-SVC-004 moved to the Detail_Matrix; KPI-SCM-007 kept
      # (matches Main_1's 'rate' family).
      kpi_id: KPI-SCM-007
      visual_type: horizontal_bar_chart
      question: "Where does enterprise delivery risk concentrate across the portfolio?"
      message: OTIF is uneven across the portfolio, flagging where delivery risk concentrates
      so_what: "A normalized index makes the strategic KPIs comparable, so attention goes to the biggest exposure."
      unit: rate
  page_2_execution:
    title: Executive / Cross-Functional Risk Prioritisation
    page_type: T4_Prescriptive_Recommendation
    template_variant: T4_ActionDecision
    template_id: action_matrix
    decision_question: "Which business units require executive intervention this quarter?"
    big_idea: "Two business units are below threshold on both GM% and service level — escalation and resource reallocation required."
    component_300s:
      evidence_grain: entity_month
      # R2.4: added KPI-CUS-001 and KPI-SVC-004 (moved off
      # Main_2, see above) so both are still surfaced in the evidence table.
      evidence_columns:
      - entity
      - period
      - KPI-GOV-004
      - KPI-COM-013
      - KPI-COM-008
      - KPI-SCM-007
      - KPI-CUS-001
      - KPI-SVC-004
      action_panel: true
      payload_mode: full
      sort_by:
        measure: KPI-GOV-004
        direction: descending
      top_n: 20
      highlight_rule:
        column: KPI-GOV-004
        type: data_bar
prioritization:
  business_value: high
  implementation_effort: low
  confidence: 0.9
  reach: organization
  priority_score: 90
data_protection:
  # DSGVO Art. 25 Privacy by Design and by Default
  # Authority: core/templates/page_templates/governance/Data_Protection_Governance.md
  personal_data: false
  legal_basis: not_applicable
  data_minimisation: >
    Detail Matrix limited to business-unit and strategic-KPI grain. Executive
    overview displays aggregated cross-domain KPIs — no individual-level data is
    exposed. Row-level security applied per business-unit scope.
  access_restriction: >
    executive_sponsor and xd_bi_lead roles; row-level security enforced by
    cross-domain SemanticModel federation (business-unit filter per org role).
  dpia_required: false
  ai_generated_output: true
  ai_grounding_measure: >
    Active Actions Text (XD) — DAX measure that reads current filter context and
    concatenates only triggered action texts. See Storytelling_Principles.md
    §13.
readiness:
  data_availability: available
  org_capability: ready
  stakeholder_alignment: aligned
  overall_readiness: green
overrides:
  data_contract_ref: core/data_contracts/domains/executive.yaml
documentation:
  business_factsheet: ./Business_Factsheet.md

security:
  rls:
    model: entity_hierarchy
    enforcement_layer: semantic_model
    role_table: security_user_org
    access_column: entity_key
    test_requirement: "DAX EVALUATE CALCULATETABLE(VALUES('_Measures'[Value At Risk Index]), USERELATIONSHIP(security_user_org[entity_key], dim_org[entity_key])) returns only rows for the signed-in user's assigned entities."
