schema_version: '2.0'
id: XD-003
title: Executive KPI Overview
domain: Executive / Cross-Functional
governance:
  owner_role: finance_strategy_ops_controlling
  steward_role: enterprise_bi_lead
orchestration:
  strategic_kpi_id: enterprise.value_at_risk.index
  influencing_kpi_ids:
  - margin.gm.pct
  - sales.net_sales.delta_pct.ly
  - crm.clv.amount
  - svc.sla.attainment.pct
  - ops.otif.pct
  - ops.working_capital.ccc.days
  - people.digital_adoption.pct
  - people.attrition_risk.pct
  supporting_kpi_ids:
  - cost.cogs.amount
  - crm.active_customers.count
  - crm.churned_customers.count
  - crm.complaint.count
  - crm.lifetime_revenue.amount
  - crm.nps.index
  - crm.retention.pct
  - sales.net_sales.amount
  - supply.otif.pct
  - supply.on_time.pct
  - supply.in_full.pct
  - supply.stockout_impact.pct
  - svc.fcr.pct
  - svc.aht.minutes
  - svc.backlog.count
  - svc.escalation.pct
  - svc.tickets.created.count
  - svc.tickets.closed.count
  action_code_ids:
  - X-E3.2
primary_kpi_ids:
  - enterprise.value_at_risk.index
  - margin.gm.pct

value_driver_model:
  formula: enterprise.value_at_risk.index = f(margin.gm.pct, sales.net_sales.delta_pct.ly, crm.clv.amount, svc.sla.attainment.pct,
    ops.otif.pct, ops.working_capital.ccc.days, people.digital_adoption.pct, people.attrition_risk.pct)
  impact_direction: minimize
  primary_driver: margin.gm.pct
  impact_logic: Enterprise value at risk rises when profitability, service, working-capital, people, or action-effectiveness signals deteriorate.
ux_layout_rules:
  report_structure: 2-Page-Lead
  report_canvas: { width: 1920, height: 1080 }
  page_1_summary:
    title: Executive / Cross-Functional Summary & Insights
    page_type: T1_Strategic_Overview
    template_variant: T1_Portfolio
    template_id: pulse
    decision_question: "Are we on track across all strategic KPIs this quarter?"
    big_idea: "Revenue growth is on track but GM% compression and OTIF decline signal execution risk that requires executive intervention."
    component_3s:
      kpi_id: enterprise.value_at_risk.index
      visual_type: kpi_card
    component_30s:
    - slot_id: Main_1
      kpi_id: sales.net_sales.delta_pct.ly
      visual_type: line_chart
    - slot_id: Main_3
      kpi_ids:
      - crm.clv.amount
      - svc.sla.attainment.pct
      - ops.otif.pct
      visual_type: bar_chart_horizontal
  page_2_execution:
    title: Executive / Cross-Functional Risk Prioritisation
    page_type: T4_Prescriptive_Recommendation
    template_variant: T4_ActionDecision
    template_id: action_matrix
    decision_question: "Which business units require executive intervention this quarter?"
    big_idea: "Two business units are below threshold on both GM% and service level — escalation and resource reallocation required."
    component_300s:
      evidence_grain: entity_month
      evidence_columns:
      - entity
      - period
      - enterprise.value_at_risk.index
      - margin.gm.pct
      - sales.net_sales.delta_pct.ly
      - ops.otif.pct
      action_panel: true
      payload_mode: full
prioritization:
  business_value: high
  implementation_effort: low
  confidence: 0.9
  reach: organization
  priority_score: 90
data_protection:
  # DSGVO Art. 25 Privacy by Design and by Default
  # Authority: core/templates/page_templates/governance/Data_Protection_Governance.md
  personal_data: false
  legal_basis: not_applicable
  data_minimisation: >
    Detail Matrix limited to business-unit and strategic-KPI grain. Executive
    overview displays aggregated cross-domain KPIs — no individual-level data is
    exposed. Row-level security applied per business-unit scope.
  access_restriction: >
    executive_sponsor and xd_bi_lead roles; row-level security enforced by
    cross-domain SemanticModel federation (business-unit filter per org role).
  dpia_required: false
  ai_generated_output: true
  ai_grounding_measure: >
    Active Actions Text (XD) — DAX measure that reads current filter context and
    concatenates only triggered action texts. See Storytelling_Principles.md
    §13.
readiness:
  data_availability: available
  org_capability: ready
  stakeholder_alignment: aligned
  overall_readiness: green
overrides:
  data_contract_ref: core/data_contracts/domains/executive.yaml
documentation:
  business_factsheet: ./Business_Factsheet.md

security:
  rls:
    model: entity_hierarchy
    enforcement_layer: semantic_model
    role_table: security_user_org
    access_column: entity_key
    test_requirement: "DAX EVALUATE CALCULATETABLE(VALUES('_Measures'[Value At Risk Index]), USERELATIONSHIP(security_user_org[entity_key], dim_org[entity_key])) returns only rows for the signed-in user's assigned entities."
