schema_version: '2.0'
id: XD-003
title: Executive KPI Overview
domain: Executive / Cross-Functional
governance:
  owner_role: finance_strategy_ops_controlling
  steward_role: enterprise_bi_lead
orchestration:
  strategic_kpi_id: margin.gm.pct
  influencing_kpi_ids:
  - sales.net_sales.delta_pct.ly
  - crm.clv.amount
  - svc.sla.attainment.pct
  - ops.otif.pct
  - ops.working_capital.ccc.days
  - people.digital_adoption.pct
  - people.attrition_risk.pct
  - enterprise.action_routed.count
  - enterprise.action_outcome_rate.pct
  - enterprise.value_at_risk.index
  supporting_kpi_ids:
  - cost.cogs.amount
  - sales.net_sales.amount
  - supply.otif.pct
  action_code_ids:
  - X-E3.2
  - X-E3.3
value_driver_model:
  formula: margin.gm.pct = f(sales.net_sales.delta_pct.ly, crm.clv.amount, svc.sla.attainment.pct, ops.otif.pct, ops.working_capital.ccc.days,
    people.digital_adoption.pct, people.attrition_risk.pct, enterprise.action_routed.count, enterprise.action_outcome_rate.pct,
    enterprise.value_at_risk.index)
  impact_direction: maximize
  primary_driver: sales.net_sales.delta_pct.ly
  impact_logic: Improving sales.net_sales.delta_pct.ly is the primary lever for maximizing margin.gm.pct.
ux_layout_rules:
  report_structure: 2-Page-Lead
  report_canvas: { width: 1920, height: 1080 }
  page_1_summary:
    title: Executive / Cross-Functional Summary & Insights
    page_type: T1_Strategic_Overview
    template_id: pulse
    decision_question: "Are we on track across all strategic KPIs this quarter?"
    big_idea: "Revenue growth is on track but GM% compression and OTIF decline signal execution risk that requires executive intervention."
    component_3s:
      kpi_id: margin.gm.pct
      visual_type: kpi_card_hero
      sparkline_field: GmPct_Monthly
      comparison: vs_plan
      status_logic: higher_is_better
    component_30s:
    - slot_id: Main_1
      kpi_id: sales.net_sales.delta_pct.ly
      visual_type: line_chart
    - slot_id: Main_3
      kpi_ids:
      - crm.clv.amount
      - svc.sla.attainment.pct
      - ops.otif.pct
      visual_type: bar_chart_horizontal
  page_2_execution:
    title: Executive / Cross-Functional Execution
    page_type: T1_Strategic_Overview
    template_id: action_matrix
    decision_question: "Which business units require executive intervention this quarter?"
    big_idea: "Two business units are below threshold on both GM% and service level — escalation and resource reallocation required."
    component_300s:
      evidence_grain: entity_month
      evidence_columns:
      - entity
      - period
      - margin.gm.pct
      action_panel: true
      payload_mode: full
prioritization:
  business_value: high
  implementation_effort: low
  confidence: 0.9
  reach: organization
  priority_score: 90
readiness:
  data_availability: available
  org_capability: ready
  stakeholder_alignment: aligned
  overall_readiness: green
overrides:
  data_contract_ref: core/data_contracts/domains/executive.yaml
documentation:
  business_factsheet: ./Business_Factsheet.md
