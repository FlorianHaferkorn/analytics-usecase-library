approval_basis: "16/16 SQ-E gate; all deferred items classified model_gap (no schema_gap); see docs/process/evidence-to-model-uplift-scope.md"

process_scope:
  description: >
    Enterprise-wide strategic performance management cockpit for the executive
    committee. Aggregates certified financial, commercial, customer, service,
    operations, working-capital, and people KPIs into a single strategic view and
    condenses cross-domain downside into one composite Enterprise Value-at-Risk
    Index. The index is a weighted, normalized aggregation of domain risk signals
    (Corporate / Enterprise Performance Management plus COSO ERM portfolio-view
    thinking) — it is explicitly NOT a financial Value-at-Risk (VaR) market-loss
    measure. Scope covers descriptive and diagnostic surfacing of where the
    enterprise is on/off track and routing of cross-domain interventions through
    the 3-30-300 navigation.
  in_scope:
    - Enterprise Value-at-Risk Index as a weighted composite of normalized domain risk signals
    - Strategic monitoring of Gross Margin %, Net Sales % vs LY, CLV, SLA Attainment, OTIF, Cash Conversion Cycle, Digital Adoption, and Attrition Risk
    - Balanced-Scorecard-style four-perspective roll-up (financial, customer, internal process, learning & growth) into one executive cockpit
    - Cross-domain risk prioritisation — ranking entities/business units by aggregated value-at-risk and material driver contribution
    - Plan and prior-year (LY) comparators for all headline KPIs at entity-month grain
    - Executive action routing to domain leads via the X-E3.2 Cross-Domain Risk Prioritisation action code
  out_of_scope:
    - Detailed domain diagnostics and root-cause remediation (owned by domain use cases COM-/FIN-/OPS-/SCM-)
    - Operational incident tracking and standalone domain scorecards without executive alignment
    - Execution/governance of whether routed actions actually moved KPIs (owned by XD-004)
    - Financial market Value-at-Risk / treasury VaR modelling (different methodology and meaning)
    - Statutory financial consolidation, close, and external regulatory reporting
  industry_segment: "Cross-industry, enterprise/executive"
  applicable_frameworks:
    - name: "Kaplan & Norton — Balanced Scorecard & Strategy Maps (four-perspective strategic measurement)"
      id: BSC-STRATEGY-MAP
    - name: "COSO Enterprise Risk Management — Integrating with Strategy and Performance (2017) — portfolio view of risk"
      id: COSO-ERM-2017
    - name: "ISO 31000:2018 — Risk Management Guidelines (principles, framework, process)"
      id: ISO-31000-2018
    - name: "Gartner Corporate / Enterprise Performance Management (CPM/EPM)"
      id: GARTNER-CPM-EPM
    - name: "OKR Methodology — Objectives & Key Results (Doerr)"
      id: OKR-METHOD

canonical_domain_model:
  outcome_kpis:
    - id: KPI-GOV-004
      name: Enterprise Value-at-Risk Index
      definition: >
        Weighted, normalized composite index of downside risk aggregated across
        domains. Each contributing domain KPI is normalized to its target/plan,
        scored for downside deviation, and weighted by financial and strategic
        materiality, then summed into a single 0–100 style index. This is a
        composite management index (COSO ERM portfolio view), NOT a financial
        market Value-at-Risk loss measure.
      unit: index
      direction: minimize
      benchmark_target: >
        No universal external benchmark exists for a bespoke composite index.
        Target is an internally calibrated risk-appetite band (e.g. green < 30,
        amber 30–60, red > 60) anchored to COSO ERM risk-appetite/tolerance
        methodology and the firm's own materiality model — the methodology, not a
        single number, is what is benchmarked.
      benchmark_source_id: SRC-002
    - id: KPI-COM-013
      name: Gross Margin %
      role: guardrail
      definition: "(Net Sales - COGS) / Net Sales × 100. Co-headline profitability outcome and guardrail."
      unit: "%"
      direction: maximize
      causal_mechanism: >
        Profitability outcome that must not be traded away for growth. Feeds the
        financial perspective of the scorecard and is a high-weight contributor to
        the value-at-risk index when compression appears.
      benchmark_target: "Sector-specific; 25–45% GM% typical for B2B manufacturing (cross-industry benchmark)"
      benchmark_source_id: SRC-007

  driver_kpis:
    - id: KPI-COM-013
      name: Gross Margin %
      definition: "(Net Sales - COGS) / Net Sales × 100."
      unit: "%"
      direction: maximize
      drives: KPI-GOV-004
      causal_mechanism: >
        Primary driver. Margin compression below target raises the financial-perspective
        risk contribution and lifts the composite index (impact_direction minimize).
      benchmark_target: "25–45% GM% for B2B manufacturing (cross-industry)"
      benchmark_source_id: SRC-007
    - id: KPI-COM-008
      name: Net Sales % vs LY
      definition: "(Actual Net Sales - LY Net Sales) / LY Net Sales × 100."
      unit: "%"
      direction: maximize
      drives: KPI-GOV-004
      causal_mechanism: >
        Growth-trajectory driver. Sustained negative LY delta signals structural
        revenue decline, increasing strategic (financial-perspective) risk weight.
      benchmark_target: "5–10% YoY growth typical for manufacturing B2B (Gartner CPM/EPM context)"
      benchmark_source_id: SRC-005
    - id: KPI-CUS-001
      name: Customer Lifetime Value
      definition: "Present value of future margin contribution per customer relationship."
      unit: EUR
      direction: maximize
      drives: KPI-GOV-004
      causal_mechanism: >
        Customer-perspective driver (Balanced Scorecard). Declining CLV erodes future
        cash-flow base and raises the customer-risk contribution to the index.
      benchmark_target: "CLV:CAC ratio ≥ 3:1 (B2B benchmark)"
      benchmark_source_id: SRC-005
    - id: KPI-SVC-004
      name: SLA Attainment %
      definition: "% of service interactions meeting the agreed service-level target."
      unit: "%"
      direction: maximize
      drives: KPI-GOV-004
      causal_mechanism: >
        Internal-process / service-quality driver. SLA breaches signal experience
        risk and downstream churn, raising the service-risk contribution.
      benchmark_target: "≥ 95% SLA attainment typical world-class target"
      benchmark_source_id: SRC-006
    - id: KPI-SCM-007
      name: OTIF %
      definition: "On-Time-In-Full delivery performance (orders delivered complete and on time)."
      unit: "%"
      direction: maximize
      drives: KPI-GOV-004
      causal_mechanism: >
        Internal-process / fulfilment driver. OTIF decline indicates supply
        reliability risk that compounds with cash and customer risk.
      benchmark_target: "≥ 95% OTIF best-in-class (cross-industry)"
      benchmark_source_id: SRC-007
    - id: KPI-FIN-006
      name: Cash Conversion Cycle (Days)
      definition: "DSO + DIO - DPO. Days of working capital tied up in operations."
      unit: days
      direction: minimize
      drives: KPI-GOV-004
      causal_mechanism: >
        Financial-liquidity driver. A lengthening CCC ties up cash and raises
        liquidity risk weighting in the composite index.
      benchmark_target: "Sector-specific; lower is better — improvement vs own baseline and peer band"
      benchmark_source_id: SRC-007
    - id: KPI-SVC-002
      name: Digital Adoption %
      definition: "% of target users actively adopting the deployed digital tools/capabilities."
      unit: "%"
      direction: maximize
      drives: KPI-GOV-004
      causal_mechanism: >
        Learning-&-growth / intangible-capital driver (Skandia Navigator renewal &
        development perspective). Low adoption signals stalled transformation value,
        a leading risk to future performance.
      benchmark_target: "Internally calibrated against rollout plan; renewal & development perspective"
      benchmark_source_id: SRC-008
    - id: KPI-SVC-003
      name: Attrition Risk %
      definition: "% of (key/critical-role) workforce flagged at elevated risk of leaving."
      unit: "%"
      direction: minimize
      drives: KPI-GOV-004
      causal_mechanism: >
        Learning-&-growth / human-capital driver. Rising attrition risk in key roles
        threatens capability continuity and raises the people-risk contribution.
      benchmark_target: "Lower is better; calibrated to critical-role retention target"
      benchmark_source_id: SRC-008

  diagnostic_kpis:
    - id: enterprise.var_contribution.margin
      name: Value-at-Risk Contribution — Margin
      definition: "Weighted normalized margin-downside contribution to the Enterprise Value-at-Risk Index."
      unit: index_points
      direction: minimize
      diagnoses: KPI-COM-013
      causal_mechanism: "Decomposes how much of the composite index is driven by margin compression for this entity-period."
    - id: enterprise.var_contribution.growth
      name: Value-at-Risk Contribution — Growth
      definition: "Weighted normalized revenue-growth-downside contribution to the index."
      unit: index_points
      direction: minimize
      diagnoses: KPI-COM-008
      causal_mechanism: "Isolates the share of value-at-risk attributable to negative LY growth trajectory."
    - id: enterprise.var_contribution.service
      name: Value-at-Risk Contribution — Service & Fulfilment
      definition: "Combined weighted SLA + OTIF downside contribution to the index."
      unit: index_points
      direction: minimize
      diagnoses: KPI-SCM-007
      causal_mechanism: "Shows when service reliability and fulfilment failures are the dominant risk driver."
    - id: enterprise.var_contribution.working_capital
      name: Value-at-Risk Contribution — Working Capital
      definition: "Weighted CCC-deterioration contribution to the index."
      unit: index_points
      direction: minimize
      diagnoses: KPI-FIN-006
      causal_mechanism: "Quantifies the liquidity-risk share so cash and service signals can be read together."
    - id: enterprise.var_contribution.people
      name: Value-at-Risk Contribution — People
      definition: "Combined weighted attrition-risk + low-digital-adoption contribution to the index."
      unit: index_points
      direction: minimize
      diagnoses: KPI-SVC-003
      causal_mechanism: "Surfaces intangible / human-capital risk (Skandia renewal & development) feeding the index."

  guardrails:
    - description: Composite index must not override a healthy underlying portfolio
      condition: >
        Do not trigger enterprise escalation when the index rises solely because of
        a single non-material domain signal already covered by an active domain
        action. COSO ERM portfolio view requires materiality and double-counting
        checks before executive routing.
      affected_kpis:
        - KPI-GOV-004
    - description: Do not act on transient or low-confidence index movement
      condition: >
        Suppress action when the index movement falls within normal volatility / the
        risk-appetite band, or when plan/LY comparators are incomplete for material
        KPIs (data-quality guardrail). ISO 31000 monitoring & review requires
        confidence before treatment.
      affected_kpis:
        - KPI-GOV-004
        - KPI-COM-013
    - description: Profitability guardrail on growth-led interventions
      condition: >
        Do not endorse pure volume/growth recovery actions when GM% is already below
        target — protect margin while closing the growth gap.
      affected_kpis:
        - KPI-COM-013
        - KPI-COM-008

  wrong_interpretations:
    - description: Treating the composite index as a precise financial VaR
      why_wrong: >
        Enterprise Value-at-Risk Index is a weighted, normalized management composite
        of domain risk signals — not a statistical financial Value-at-Risk
        (probability-weighted monetary loss at a confidence level). Reading it as a
        precise EUR loss figure implies false precision. COSO ERM and ISO 31000 treat
        such aggregations as decision-support, not actuarial measures.
      source_id: SRC-002
    - description: Over-rotating on a single headline KPI without cross-domain context
      why_wrong: >
        Acting on one KPI (e.g. margin) in isolation ignores the Balanced Scorecard
        principle that financial, customer, process, and learning perspectives must
        be balanced. A favourable one-off (e.g. FX) can mask structural weakness in
        other domains; the index exists precisely to prevent single-lever myopia.
      source_id: SRC-001
    - description: Aggregating the index without materiality weighting (false equivalence)
      why_wrong: >
        Summing normalized domain risks with equal weights overweights financially
        large but strategically minor risks and underweights small-but-critical ones.
        Bain/Kaplan-Norton strategy-execution research shows execution value is lost
        when prioritisation is not materiality-weighted.
      source_id: SRC-009
    - description: Reading a stable index as 'no action needed' despite hidden offsetting risks
      why_wrong: >
        A flat composite can hide two opposite-moving domain risks netting out.
        Without drilling the per-domain VaR contributions, leadership misses that one
        domain is deteriorating while another temporarily improves — the opposite of
        the COSO portfolio-view intent.
      source_id: SRC-002

required_data_model:
  required_facts:
    - table: fact_kpi_snapshot
      description: >
        Cross-domain certified KPI values at entity-month grain (actual, plan, LY)
        for all headline and driver KPIs, with normalized/target columns to support
        index construction.
    - table: fact_exec_summary
      description: >
        Pre-aggregated executive comparators (Revenue, Gross Margin, EBITDA, DSO/DIO/DPO,
        OTIF %, Turnover %, Actions Routed/Outcome) sourced from finance, commercial,
        supply chain, and people contracts (existing executive.yaml contract).
    - table: fact_risk_weights
      description: >
        Materiality and strategic weights per domain/KPI used to construct the
        Enterprise Value-at-Risk Index (referenced by X-E3.2).
  required_dimensions:
    - name: dim_date
      grain_relevance: Month-level minimum with plan/LY references for executive cadence.
    - name: dim_org
      grain_relevance: Entity / business unit / region for cross-domain risk attribution and RLS.
    - name: dim_domain
      grain_relevance: Tags each KPI/risk contribution to its domain for portfolio-view decomposition.
    - name: dim_kpi
      grain_relevance: Identifies KPI, its target/direction, and normalization basis for the index.
  preferred_grain: entity-domain-month
  minimum_grain: entity-month
  minimum_history_months: 24
  required_measures:
    - name: Enterprise Value-at-Risk Index
      formula_seed: "weighted_sum( normalize(domain_risk_score_k) × materiality_weight_k ) across domains k"
      source_id: SRC-002
    - name: Value-at-Risk Contribution (per domain)
      formula_seed: "normalize(domain_risk_score_k) × materiality_weight_k, expressed as index points"
      source_id: SRC-002
    - name: Gross Margin %
      formula_seed: "(Net Sales - COGS) / Net Sales"
      source_id: SRC-007
    - name: Net Sales % vs LY
      formula_seed: "(Net Sales - LY Net Sales) / LY Net Sales"
      source_id: SRC-005
    - name: Cash Conversion Cycle (Days)
      formula_seed: "DSO + DIO - DPO"
      source_id: SRC-007

action_logic_seeds:
  - trigger_driver: KPI-COM-013
    trigger_diagnostic: enterprise.var_contribution.margin
    trigger_condition: "Enterprise Value-at-Risk Index in amber/red AND margin contribution is the dominant component for the entity for 2 consecutive months"
    guardrail: "Suppress if margin dip is a known one-off and other domains are green; avoid acting on single non-material signal"
    action_description: >
      Trigger Cross-Domain Risk Prioritisation — rank entities by aggregated
      value-at-risk, surface margin as the lead contributor, and route a focused
      review to Finance/Commercial leads.
    expected_outcome_kpi: KPI-GOV-004
    action_code_candidate: X-E3.2
  - trigger_driver: KPI-SCM-007
    trigger_diagnostic: enterprise.var_contribution.service
    trigger_condition: "Index rising with service+fulfilment contribution material AND working-capital contribution also rising in same entities"
    guardrail: "Exclude entities whose service risk is already covered by an active domain OTIF action; avoid double-counting"
    action_description: >
      Prioritise entities where service reliability and cash pressure compound into
      enterprise downside, and route coordinated intervention to Operations/SCM and
      Finance leads.
    expected_outcome_kpi: KPI-GOV-004
    action_code_candidate: X-E3.2
  - trigger_driver: KPI-SVC-003
    trigger_diagnostic: enterprise.var_contribution.people
    trigger_condition: "People (attrition + low digital adoption) contribution becomes a top-3 component of the index for strategic entities"
    guardrail: "Do not escalate when attrition risk concerns non-critical roles or movement is within normal band"
    action_description: >
      Surface intangible/human-capital risk to executives and route talent-retention
      and adoption-acceleration focus to People leads before capability erosion
      compounds financial risk.
    expected_outcome_kpi: KPI-GOV-004
    action_code_candidate: X-E3.2

