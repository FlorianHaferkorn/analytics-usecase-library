schema_version: "2.0"
id: COM-EXT-001
title: Advanced Customer Segmentation (RFM + CLV)
domain: Commercial
# build_status: draft — scaffold only; not yet build_ready
# prerequisites: COM-001, COM-003

governance:
  owner_role: commercial_controlling_lead
  steward_role: sales_bi_lead

orchestration:
  strategic_kpi_id: customer.clv.amount           # Customer Lifetime Value
  influencing_kpi_ids:
    - customer.rfm.recency_score
    - customer.rfm.frequency_score
    - customer.rfm.monetary_score
    - customer.churn.risk_pct
    - sales.net_sales.amount
  action_code_ids:
    - C-M2.1    # Pricing intervention (inherited from COM-001)
    - C-S1.2    # Sales channel activation
  supporting_kpi_ids:
    - cost.cogs.amount
    - sales.price.list.amount
    - sales.price.net.amount

value_driver_model:
  formula: customer.clv.amount = f(customer.rfm.recency_score, customer.rfm.frequency_score, customer.rfm.monetary_score, customer.churn.risk_pct)
  impact_direction: maximize
  primary_driver: customer.rfm.monetary_score
  impact_logic: >
    Improving RFM scores — particularly monetary value and frequency — increases
    CLV. High-churn-risk segments require retention actions before CLV is realised.
  critical_threshold: 0.10    # 10% CLV drop triggers escalation

ux_layout_rules:
  report_structure: 2-Page-Lead
  report_canvas: { width: 1920, height: 1080 }
  page_1_summary:
    title: Customer Segmentation Overview
    template_id: pulse
    component_3s:
      kpi_id: customer.clv.amount
      visual_type: kpi_card
    component_30s:
      - kpi_id: customer.rfm.monetary_score
        visual_type: scatter_chart
      - kpi_ids:
          - customer.rfm.recency_score
          - customer.rfm.frequency_score
          - customer.churn.risk_pct
        visual_type: bar_chart
  page_2_execution:
    title: Segment Drill-Down & Actions
    template_id: action_matrix
    component_300s:
      evidence_grain: customer_event
      evidence_columns:
        - customer_id
        - segment_label
        - customer.clv.amount
        - customer.rfm.recency_score
        - customer.churn.risk_pct
      action_panel: true
      payload_mode: full

overrides:
  data_contract_ref: core/data_contracts/domains/commercial_sales.yaml

documentation:
  business_factsheet: ./Business_Factsheet.md
