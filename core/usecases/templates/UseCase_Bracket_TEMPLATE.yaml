# UseCase Bracket - Machine-Readable Logic Source
# Purpose: Orchestrates the "Golden Thread" by linking Strategy, KPIs, and Actions.
# Target: Registry Engine, Power BI Generator, AI-Agents.

schema_version: "2.0"
id: "[PREFIX-000]"              # e.g., COM-001
title: "[Title]"                # Should match the Factsheet title
domain: "[Domain]"              # Commercial, Finance, Ops, SCM, XD

governance:
  owner_role: "[role_id]"       # Must exist in core/organization/org_roles.yaml
  steward_role: "[role_id]"     # Must exist in core/organization/org_roles.yaml

orchestration:
  # The "3-Second" Level (System 1)
  strategic_kpi_id: "[kpi.id]"  # Exactly ONE North Star KPI

  # The "30-Second" Level (System 2 Light)
  influencing_kpi_ids:          # The diagnostic levers
    - "[kpi.id_1]"
    - "[kpi.id_2]"
    - "[kpi.id_3]"

  # Report BoM: KPIs required to calculate strategic/influencing/action (optional; add if registry reports incomplete_supporting)
  # supporting_kpi_ids: []

  # The "300-Second" Level (Execution)
  action_code_ids:              # Prescriptive interventions subscribed by this Use Case
    - "[action.id_1]"
    - "[action.id_2]"

value_driver_model:
  formula: "[e.g., GM% = (NetSales - COGS) / NetSales]"
  impact_direction: "maximize"   # maximize / minimize
  primary_driver: "[kpi.id]"     # The main influencing KPI
  impact_logic: "[Explain how the primary driver affects the strategic KPI]"
  critical_threshold: 0.05       # Optional: deviation trigger (e.g., 5%)

ux_layout_rules:
  report_structure: "2-Page-Lead"
  page_1_summary:
    title: "[Domain] Summary & Insights"

    # Template variant — choose one based on the primary decision question:
    #   T1_Portfolio  → "Are we on track?" — 4-6 KPIs, portfolio breadth
    #   T1_Trend      → "Are we on track?" — single KPI, momentum emphasis
    #   T2_DriverBridge  → "Why are we off target?" — waterfall variance decomposition
    #   T2_Comparative   → "Why are we off target?" — entity/segment comparison
    #   T2_Funnel        → "Why are we off target?" — sequential process loss
    #   T3_ExceptionQueue   → "Where is execution breaking?" — severity-ranked exceptions
    #   T3_ProcessControl   → "Where is execution breaking?" — SLA/OTD trend + exceptions
    #   T3_IncidentMonitor  → "Where is execution breaking?" — real-time incident tracking
    #   T4_ActionDecision   → "What should we do?" — single primary recommendation
    #   T4_OptionComparison → "What should we do?" — ranked option comparison
    #   T4_Sensitivity      → "What should we do?" — recommendation + scenario check
    # Full decision tree: studio/docs/rebuild/PAGE_TYPE_TAXONOMY.md §4
    # template_variant: "[e.g., T2_DriverBridge]"

    component_3s:
      kpi_id: "[strategic_kpi_id]"
      visual_type: "kpi_card"
    component_30s:
      - kpi_id: "[influencing_kpi_id_1]"
        visual_type: "trend_line"
      - kpi_ids:
          - "[influencing_kpi_id_2]"
          - "[influencing_kpi_id_3]"
        visual_type: "bar_chart"
  page_2_execution:
    title: "[Domain] Execution"
    component_300s:
      # Must match a governed fact-table grain from core/data_contracts/domains/*.yaml
      # Placeholder 'transaction_line' is forbidden
      # Reference: internal/evidence_grain_audit_results.md
      evidence_grain: "[e.g., invoice_line]"
      evidence_columns:
        - "[column_1]"
        - "[column_2]"
        - "[column_3]"
      action_panel: true
      payload_mode: "full"        # full / summary / minimal

documentation:
  business_factsheet: "./Business_Factsheet.md"

# Optional: Use Case Prioritization (RICE-inspired scoring)
# Helps objectively rank use cases for implementation order.
# prioritization:
#   business_value: high             # high / medium / low
#   implementation_effort: medium    # high / medium / low
#   confidence: 0.8                  # 0.0 - 1.0
#   reach: organization              # organization / division / team
#   priority_score: null             # 1-100 (auto-calculated or manual)

# Optional: Readiness Assessment
# Evaluates organizational prerequisites before implementation starts.
# readiness:
#   data_availability: partial       # available / partial / missing
#   org_capability: ready            # ready / developing / not_ready
#   stakeholder_alignment: aligned   # aligned / partial / not_aligned
#   overall_readiness: amber         # green / amber / red

# Optional overrides (only if not auto-detectable)
overrides:
  measure_folder: "[e.g., 01_Sales_Performance]"
  data_contract_ref: "[e.g., core/data_contracts/commercial.yaml]"
