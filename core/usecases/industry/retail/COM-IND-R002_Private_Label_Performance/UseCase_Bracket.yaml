schema_version: '2.0'
id: COM-IND-R002
title: Private Label Performance
domain: Commercial / Retail
# Added 02.10.2026 (PR #584): gives KPI-COM-033 a governed consumer inside the library.
# Retail extension tier (ADR-0004, sector letter R) because own-brand assortment is a retail
# category-management decision. No Domain_Evidence_Pack.yaml yet; the Research-to-Core pack is
# an open follow-up, not a waiver approved by the Framework Architect.
governance:
  owner_role: category_manager
  steward_role: trade_marketing_commercial_bi_lead
  status: active
orchestration:
  strategic_kpi_id: KPI-COM-033
  # The catalog carries no driver KPI of private-label share yet (price gap to the brand
  # leader, own-brand assortment share); the diagnostic cut is by category and region.
  influencing_kpi_ids: []
  supporting_kpi_ids:
  - KPI-COM-005
  # C-M2.3 (02.10.2026, BO-120) is status draft: KPI-COM-033 is op:hitl (no own-brand flag in
  # the data contract) and the thresholds are open owner decisions, so no level can fire yet.
  # Page 2 stays an exception queue (T3) until the action code is active.
  action_code_ids:
  - C-M2.3
primary_kpi_ids:
- KPI-COM-033
value_driver_model:
  formula: KPI-COM-033 = private-label net sales / total net sales, per category and region
  impact_direction: maximize
  impact_logic: The private-label share is an outcome of category-management decisions already taken
    (assortment, shelf space, price gap to brands), so it is read per category to see where those
    decisions land and where they do not.
ux_layout_rules:
  report_structure: 2-Page-Lead
  report_canvas:
    width: 1920
    height: 1080
  intent_rules_version: 2
  page_1_summary:
    title: Retail / Private Label Summary & Insights
    page_type: T1_Strategic_Overview
    template_variant: T1_Trend
    template_id: pulse
    decision_question: Is the private-label share of revenue growing in the categories we steer?
    big_idea: The private-label share grows in a few categories only, so the own-brand programme lands
      unevenly across the assortment.
    component_3s:
      kpi_id: KPI-COM-033
      visual_type: kpi_card_with_delta
      comparison: vs_py
      status_logic: higher_is_better
    component_30s:
    - slot_id: Main_1
      kpi_id: KPI-COM-033
      visual_type: line_chart
      question: Does the private-label share rise from month to month?
      message: The private-label share rises only while own-brand sales grow faster than total net sales
      so_what: A flat share while total sales grow means the own-brand programme only follows the market.
      unit: ratio
    - slot_id: Main_3
      kpi_id: KPI-COM-033
      visual_type: horizontal_bar_chart
      category_field: dim_product.Category
      question: Which categories carry the private-label share?
      message: A few categories carry a higher private-label share than the rest of the assortment
      so_what: Own-brand assortment and pricing work starts in the categories with the lowest share
        against their peers.
      unit: ratio
  page_2_execution:
    title: Retail / Private Label Execution
    decision_question: Which categories and regions lag on private-label share the most?
    page_type: T3_Operational_Monitoring
    template_variant: T3_ExceptionQueue
    template_id: action_matrix
    component_300s:
      # Governed fact grain (fact_sales, commercial_sales.yaml).
      evidence_grain: invoice_line
      evidence_columns:
      - category
      - region
      - KPI-COM-033
      - KPI-COM-005
      action_panel: false
      payload_mode: full
      sort_by:
        measure: KPI-COM-033
        direction: ascending
      top_n: 20
      highlight_rule:
        column: KPI-COM-033
        type: data_bar
prioritization:
  business_value: medium
  implementation_effort: medium
  confidence: 0.5
  reach: division
  priority_score: 10
data_protection:
  # DSGVO Art. 25 Privacy by Design and by Default
  # Authority: core/templates/page_templates/governance/Data_Protection_Governance.md
  personal_data: false
  legal_basis: not_applicable
  data_minimisation: >
    Reporting stays at category, region and month grain; no customer record is exposed.
  access_restriction: >
    category_manager and trade_marketing_commercial_bi_lead roles; row-level security enforced
    by the Commercial semantic model (entity filter per org role).
  dpia_required: false
  ai_generated_output: false
readiness:
  data_availability: missing
  org_capability: developing
  stakeholder_alignment: partial
  overall_readiness: red
overrides:
  data_contract_ref: core/data_contracts/domains/commercial_sales.yaml
documentation:
  business_factsheet: ./Business_Factsheet.md
