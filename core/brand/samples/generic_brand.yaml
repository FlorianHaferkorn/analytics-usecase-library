$schema: analytics-usecase-library/brand/v1
identity:
  brand_id: generic
  brand_name: Generic Framework Brand
  brand_version: 1.0.0
  created_by: analytics-core-team
  approved: true
color:
  primary: '#2B5EB4'
  secondary: '#3B8EA5'
  semantic:
    positive:
      color: '#107C10'
      icon: ▲
      label: positive
    negative:
      color: '#D13438'
      icon: ▼
      label: negative
    warning:
      color: '#F7630C'
      icon: ⚠
      label: warning
    neutral:
      color: '#605E5C'
      icon: ─
      label: neutral
  neutral_scale:
    '50': '#FAFAFA'
    '100': '#F3F2F1'
    '200': '#E1DFDD'
    '400': '#A19F9D'
    '700': '#3B3A39'
    '900': '#201F1E'
  mode: light
typography:
  font_family:
    primary: Segoe UI, system-ui, -apple-system, sans-serif
    secondary: null
    monospace: Cascadia Code, Consolas, 'Courier New', monospace
  type_scale:
    xs:
      size_rem: 0.625
      line_height: 1.4
    sm:
      size_rem: 0.75
      line_height: 1.4
    md:
      size_rem: 0.875
      line_height: 1.5
    lg:
      size_rem: 1.0
      line_height: 1.5
    xl:
      size_rem: 1.25
      line_height: 1.3
    2xl:
      size_rem: 1.5
      line_height: 1.2
    3xl:
      size_rem: 2.0
      line_height: 1.1
  role_map:
    kpi_value: 3xl
    kpi_label: sm
    kpi_delta: md
    kpi_period: xs
    chart_title: md
    axis_label: xs
    legend_label: xs
    body: md
    caption: xs
    heading_1: 2xl
    heading_2: xl
    heading_3: lg
    table_header: sm
    table_cell: sm
  tool_minimums:
    powerbi:
      body_pt: 12
      label_pt: 10
      kpi_pt: 18
      canvas_design_base: 1280x720
      canvas_production: 1920x1080
    web:
      body_rem: 1.0
      label_rem: 0.75
    export_pdf:
      body_pt: 11
      label_pt: 9
spacing:
  base_unit: 8
  scale:
    xs: 4
    sm: 8
    md: 16
    lg: 24
    xl: 32
    2xl: 48
    3xl: 64
border:
  radius:
    none: 0
    sm: 2
    md: 4
    lg: 8
    full: 9999
  width:
    hairline: 1
    thin: 1
    medium: 2
shadow:
  none: none
  low: 0 1px 3px rgba(0,0,0,0.10), 0 1px 2px rgba(0,0,0,0.06)
  medium: 0 4px 12px rgba(0,0,0,0.12), 0 2px 6px rgba(0,0,0,0.08)
  high: 0 8px 24px rgba(0,0,0,0.16), 0 4px 12px rgba(0,0,0,0.10)
logo:
  light_bg_asset: null
  dark_bg_asset: null
  clear_space: 16
  min_width: 80
canvas_profiles:
  powerbi_design_base:
    width: 1280
    height: 720
    description: Design reference — layout and fonts at 100% readability.
  powerbi_production:
    width: 1920
    height: 1080
    font_size_delta_pt: 2
    description: Production — fonts +2pt to compensate for FitToPage scale-down.
  web_fluid:
    breakpoints:
      sm: 640
      md: 768
      lg: 1024
      xl: 1280
      2xl: 1536
    description: Browser context — fluid typography, 12-column CSS grid.
tool_derivations:
  powerbi_theme: core/brand/samples/Generic_Framework_Brand__Monochromatic__powerbi_design_base__2B5EB4.json
  css_variables: core/brand/samples/generic_variables.css
  sass_variables: null
