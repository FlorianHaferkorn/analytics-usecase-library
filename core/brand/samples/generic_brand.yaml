# Generic Brand — Framework-Neutral Sample
# ─────────────────────────────────────────────
# Copy this file to showcases/<name>/brand/brand_spec.yaml and fill in your values.
# Schema reference: core/brand/BrandSpec.schema.yaml
# Derivation guides: core/brand/tool_derivations/

$schema: "analytics-usecase-library/brand/v1"

identity:
  brand_id: "generic"
  brand_name: "Generic Framework Brand"
  brand_version: "1.0.0"
  created_by: "analytics-core-team"
  approved: true

color:
  # Slate blue — neutral, professional, works in both light and dark modes.
  primary:   "#2B5EB4"     # Slate Blue — primary data series, KPI highlights, links
  secondary: "#3B8EA5"     # Steel Teal — second data series, divergent second pole

  semantic:
    positive:
      color: "#107C10"     # Microsoft Green — matches PBI default positive signal
      icon: "▲"
      label: "positive"
    negative:
      color: "#D13438"     # Microsoft Red — matches PBI default negative signal
      icon: "▼"
      label: "negative"
    warning:
      color: "#F7630C"     # Microsoft Orange — near-threshold, attention required
      icon: "⚠"
      label: "warning"
    neutral:
      color: "#605E5C"     # Microsoft Neutral — no directional signal
      icon: "─"
      label: "neutral"

  neutral_scale:
    "50":  "#FAFAFA"       # Page background (near-white)
    "100": "#F3F2F1"       # Card/panel background — matches PBI canvas light grey
    "200": "#E1DFDD"       # Borders, dividers
    "400": "#A19F9D"       # Disabled text, placeholders, muted labels
    "700": "#3B3A39"       # Body text, secondary labels
    "900": "#201F1E"       # Headlines, primary labels, maximum contrast

  mode: "light"

typography:
  font_family:
    primary:   "Segoe UI, system-ui, -apple-system, sans-serif"
    secondary: null
    monospace: "Cascadia Code, Consolas, 'Courier New', monospace"

  type_scale:
    xs:    { size_rem: 0.625, line_height: 1.4 }
    sm:    { size_rem: 0.75,  line_height: 1.4 }
    md:    { size_rem: 0.875, line_height: 1.5 }
    lg:    { size_rem: 1.0,   line_height: 1.5 }
    xl:    { size_rem: 1.25,  line_height: 1.3 }
    "2xl": { size_rem: 1.5,   line_height: 1.2 }
    "3xl": { size_rem: 2.0,   line_height: 1.1 }

  role_map:
    kpi_value:    "3xl"
    kpi_label:    "sm"
    kpi_delta:    "md"
    kpi_period:   "xs"
    chart_title:  "md"
    axis_label:   "xs"
    legend_label: "xs"
    body:         "md"
    caption:      "xs"
    heading_1:    "2xl"
    heading_2:    "xl"
    heading_3:    "lg"
    table_header: "sm"
    table_cell:   "sm"

  tool_minimums:
    powerbi:
      body_pt:    12
      label_pt:   10
      kpi_pt:     18
      canvas_design_base: "1280x720"
      canvas_production:  "1920x1080"
    web:
      body_rem:   1.0
      label_rem:  0.75
    export_pdf:
      body_pt:    11
      label_pt:   9

spacing:
  base_unit: 8
  scale:
    xs:    4
    sm:    8
    md:    16
    lg:    24
    xl:    32
    "2xl": 48
    "3xl": 64

border:
  radius:
    none:   0
    sm:     2
    md:     4
    lg:     8
    full:   9999
  width:
    hairline: 1
    thin:     1
    medium:   2

shadow:
  none:   "none"
  low:    "0 1px 3px rgba(0,0,0,0.10), 0 1px 2px rgba(0,0,0,0.06)"
  medium: "0 4px 12px rgba(0,0,0,0.12), 0 2px 6px rgba(0,0,0,0.08)"
  high:   "0 8px 24px rgba(0,0,0,0.16), 0 4px 12px rgba(0,0,0,0.10)"

logo:
  light_bg_asset: null
  dark_bg_asset:  null
  clear_space:    16
  min_width:      80

canvas_profiles:
  powerbi_design_base:
    width:  1280
    height: 720
    description: "Design reference — layout and fonts at 100% readability."
  powerbi_production:
    width:  1920
    height: 1080
    font_size_delta_pt: +2
    description: "Production — fonts +2pt to compensate for FitToPage scale-down."
  web_fluid:
    breakpoints:
      sm:    640
      md:    768
      lg:    1024
      xl:    1280
      "2xl": 1536
    description: "Browser context — fluid typography, 12-column CSS grid."

tool_derivations:
  powerbi_theme:  null
  css_variables:  null
  sass_variables: null
