# BrandSpec Schema — Tool-Agnostic Brand Specification
# Version: 1.0
# Authority: core/brand/README.md
#
# This schema defines every property a brand specification may contain.
# All values are tool-independent. Tool derivations (Power BI, CSS, etc.)
# translate these properties to their native formats.
#
# Validation: core/brand/derivations/loader.py (I/O boundary — validates required fields)
# Derivation pipeline: tooling/brand/derive_brand_artifacts.py --showcase <name>
# Derivation guides: core/brand/tool_derivations/

$schema: "analytics-usecase-library/brand/v1"

# ─────────────────────────────────────────────
# IDENTITY
# ─────────────────────────────────────────────
identity:
  brand_id: string                      # Unique slug — e.g. "aurora_group"  (kebab-case, lowercase)
  brand_name: string                    # Display name — e.g. "Aurora Group SE"
  brand_version: string                 # Semver — e.g. "1.0.0"
  created_by: string                    # Author or team
  approved: boolean                     # true once brand owner has signed off

# ─────────────────────────────────────────────
# COLOR SYSTEM
# ─────────────────────────────────────────────
color:

  # Primary brand color — used for: first data series, primary KPI highlights,
  # active states, primary CTA buttons.
  primary: "#RRGGBB"

  # Secondary / complementary color — used for: second data series,
  # divergent palette second pole, accent elements.
  secondary: "#RRGGBB"

  # Semantic signal system — tool-independent meaning.
  # Rule: MUST NOT rely on color alone. Each signal also defines an icon
  # (for colorblind safety) and a pattern fallback.
  semantic:
    positive:                           # Good performance, upward favourable trend
      color: "#RRGGBB"                  # Recommended: green-family (#107C10, #00B050, etc.)
      icon: "▲"                         # Direction glyph used in KPI cards, tables
      label: "positive"                 # Accessible text label
    negative:                           # Bad performance, downward unfavourable trend
      color: "#RRGGBB"                  # Recommended: red-family (#D13438, #C00000, etc.)
      icon: "▼"
      label: "negative"
    warning:                            # Caution — near threshold, monitoring required
      color: "#RRGGBB"                  # Recommended: amber-family (#F7630C, #FF8C00, etc.)
      icon: "⚠"
      label: "warning"
    neutral:                            # No signal — informational, no clear direction
      color: "#RRGGBB"                  # Recommended: blue-grey (#605E5C, #8A8886, etc.)
      icon: "─"
      label: "neutral"

  # Neutral scale — used for backgrounds, borders, text, and UI chrome.
  # Not data colors. Step names follow Tailwind convention (50 = lightest).
  neutral_scale:
    "50":  "#RRGGBB"                    # Page/canvas background (lightest)
    "100": "#RRGGBB"                    # Card/panel background, section fills
    "200": "#RRGGBB"                    # Borders, dividers, rule lines
    "400": "#RRGGBB"                    # Disabled text, placeholder text, muted labels
    "700": "#RRGGBB"                    # Body text, secondary labels
    "900": "#RRGGBB"                    # Headlines, primary labels, high-contrast text

  # Color mode supported by this brand spec.
  # "light" — light backgrounds only.
  # "dark"  — dark backgrounds only.
  # "both"  — full light + dark token set provided.
  mode: "light"                         # Enum: light | dark | both

# ─────────────────────────────────────────────
# TYPOGRAPHY
# ─────────────────────────────────────────────
typography:

  # Font family stack — tool must fall back gracefully if named font unavailable.
  font_family:
    primary: "Segoe UI, system-ui, -apple-system, sans-serif"   # Body, labels, data
    secondary: null                     # Optional editorial/heading font; null = use primary
    monospace: "Cascadia Code, Consolas, 'Courier New', monospace"  # Data tables, dev labels

  # Type scale — logical named steps.
  # Size values are expressed in 'rem' (web baseline 16px) for tool-agnostic portability.
  # Tool derivations multiply by tool-specific base or apply minimum-safe overrides.
  #
  # Web:         rem values used directly (fluid with clamp() if needed)
  # Power BI:    rem → pt (multiply rem × 9 for PBI 12px base; see powerbi_mapping.md)
  # Export/PDF:  rem × 12 for print-safe minimum
  type_scale:
    xs:   { size_rem: 0.625, line_height: 1.4 }   # 10px web — axis tick labels, footnotes
    sm:   { size_rem: 0.75,  line_height: 1.4 }   # 12px web — KPI labels, captions
    md:   { size_rem: 0.875, line_height: 1.5 }   # 14px web — body text, chart titles
    lg:   { size_rem: 1.0,   line_height: 1.5 }   # 16px web — section headings
    xl:   { size_rem: 1.25,  line_height: 1.3 }   # 20px web — page subtitles
    "2xl": { size_rem: 1.5,  line_height: 1.2 }   # 24px web — KPI values (secondary)
    "3xl": { size_rem: 2.0,  line_height: 1.1 }   # 32px web — KPI hero values

  # Role map — maps semantic roles to scale steps.
  # Each role name corresponds to a visual element across all layouts.
  role_map:
    kpi_value:    "3xl"     # Main KPI number (hero)
    kpi_label:    "sm"      # KPI title below value
    kpi_delta:    "md"      # Delta value and % (▲ +8.2%)
    kpi_period:   "xs"      # "vs Plan", "vs PY" reference label
    chart_title:  "md"      # Visual/slot title (question-oriented)
    axis_label:   "xs"      # Chart axis tick labels
    legend_label: "xs"      # Chart legend text
    body:         "md"      # Body text, narrative, smart narrative
    caption:      "xs"      # Footnotes, data source labels
    heading_1:    "2xl"     # Page title
    heading_2:    "xl"      # Section heading
    heading_3:    "lg"      # Subsection heading
    table_header: "sm"      # Column header in detail matrix
    table_cell:   "sm"      # Cell value in detail matrix

  # Tool-specific minimum-safe font sizes.
  # These OVERRIDE the type_scale when the derived size would fall below minimum.
  # Reason: In Power BI, fonts do not scale with FitToPage; at 1920×1080 canvas
  # displayed on a 1366×768 screen (0.71× scale), a 9pt font becomes ~6pt — unreadable.
  tool_minimums:
    powerbi:
      body_pt:    12        # Minimum for body/narrative text in PBI
      label_pt:   10        # Minimum for axis/legend labels in PBI
      kpi_pt:     18        # Minimum for KPI values in PBI
      canvas_design_base: "1280x720"    # Design at this size; scale up for production
      canvas_production:  "1920x1080"   # Production canvas; increase all font sizes by +2pt
    web:
      body_rem:   1.0       # 16px minimum for body
      label_rem:  0.75      # 12px minimum for labels (clamp to viewport)
    export_pdf:
      body_pt:    11        # Minimum for PDF/print export
      label_pt:   9

# ─────────────────────────────────────────────
# SPACING
# ─────────────────────────────────────────────
spacing:
  base_unit: 8              # Base grid unit in pixels — all steps are multiples
  scale:
    xs:  4                  # 0.5 × base  — tight internal padding
    sm:  8                  # 1 × base    — component internal padding
    md:  16                 # 2 × base    — between related elements
    lg:  24                 # 3 × base    — between visual groups
    xl:  32                 # 4 × base    — outer margins, section gaps
    "2xl": 48               # 6 × base    — major section separators
    "3xl": 64               # 8 × base    — page-level zones

# ─────────────────────────────────────────────
# SHAPE
# ─────────────────────────────────────────────
border:
  radius:
    none:   0               # px — sharp corners (typical for data tables)
    sm:     2               # px — subtle rounding (KPI cards, light UI)
    md:     4               # px — standard rounded (panels, tooltips)
    lg:     8               # px — prominent rounding (modals, sidebars)
    full:   9999            # px — pill shape (badges, status chips)
  width:
    hairline: 1             # px — subtle dividers
    thin:     1             # px — standard borders
    medium:   2             # px — emphasis borders, focus rings

# ─────────────────────────────────────────────
# ELEVATION / SHADOW
# ─────────────────────────────────────────────
shadow:
  # CSS box-shadow syntax — tool derivations translate to native equivalents.
  # Power BI: shadows are not natively supported; use border + background as substitute.
  none:   "none"
  low:    "0 1px 3px rgba(0,0,0,0.10), 0 1px 2px rgba(0,0,0,0.06)"
  medium: "0 4px 12px rgba(0,0,0,0.12), 0 2px 6px rgba(0,0,0,0.08)"
  high:   "0 8px 24px rgba(0,0,0,0.16), 0 4px 12px rgba(0,0,0,0.10)"

# ─────────────────────────────────────────────
# LOGO
# ─────────────────────────────────────────────
logo:
  light_bg_asset: null      # Path to logo for light backgrounds (relative to showcase root)
  dark_bg_asset:  null      # Path to logo for dark backgrounds
  clear_space:    16        # Minimum clear space around logo in px (at base canvas size)
  min_width:      80        # Minimum display width in px

# ─────────────────────────────────────────────
# CANVAS PROFILES
# Named canvas configurations for different tool/environment targets.
# The 12×12 logical grid scales proportionally to any canvas size.
# ─────────────────────────────────────────────
canvas_profiles:
  powerbi_design_base:
    width:  1280
    height: 720
    description: >
      Design reference canvas. Design layouts at this size so fonts are legible
      at 100% zoom. PBI FitToPage scales this up on larger screens.
  powerbi_production:
    width:  1920
    height: 1080
    font_size_delta_pt: +2
    description: >
      Production canvas. Increase all font pt sizes by +2 relative to design_base
      to compensate for FitToPage scale-down on standard laptop screens (0.71×).
  powerbi_widescreen:
    width:  2560
    height: 1440
    font_size_delta_pt: +4
    description: >
      4K / large monitor canvas. Use when primary audience uses high-resolution
      displays. Increase font sizes by +4pt. Not recommended as default.
  web_fluid:
    breakpoints:
      sm:   640
      md:   768
      lg:   1024
      xl:   1280
      "2xl": 1536
    description: >
      Web/browser context. Use fluid typography (rem/clamp). No fixed canvas —
      layouts reflow at breakpoints using the 12-column CSS grid.

# ─────────────────────────────────────────────
# TOOL DERIVATION OUTPUT REFERENCES
# These are output paths, not definitions. Populated by generators.
# ─────────────────────────────────────────────
tool_derivations:
  powerbi_theme:    null    # Relative path to generated Power BI theme JSON
  css_variables:    null    # Relative path to generated CSS custom properties file
  sass_variables:   null    # Relative path to generated Sass/SCSS variables file
