# Reporting Feature Catalog (A-31 R7, 30.09.2026). Schema:
# tooling/generator/schemas/reporting_feature_catalog.schema.json; test:
# tooling/tests/test_reporting_feature_catalog.py. One entry per feature a report or cockpit user
# expects; sources are entry ids of docs/architecture/research/2026-09-30_visual-stack-r1/*.yaml.
# meridian_module = module of the Meridian Cockpit plan (M1 Shell, M2 Reports, M3 Steuerung,
# M4 Wissen, M5 Transparenz, M6 KI, M7 Zusammenarbeit, M8 Betrieb).
schema_version: "1.0.0"
features:
