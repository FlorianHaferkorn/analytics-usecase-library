  acceptance_tests:
    - id: at_incremental_replay
      readiness_gate_ref: g_delivery_apply_ready
      statement: Initial, repeated, late-update and delete or correction runs execute against the approved incremental contract.
      expected_result: Target keys remain unique, the second identical run is a no-op, and reconciliation matches the authoritative source within the approved threshold.
      evidence_requirement_refs:
        - e_incremental_replay_proof
    - id: at_quality_blocks_publication
      readiness_gate_ref: g_delivery_apply_ready
      statement: A deliberate blocking quality defect is introduced after a previously approved publication.
      expected_result: The run records started and failed states, the defective output is not published, the last approved output remains available and the exception is assigned.
      evidence_requirement_refs:
        - e_quality_failure_proof
        - e_product_health_proof
    - id: at_stale_run_detected
      readiness_gate_ref: g_delivery_apply_ready
      statement: A run is left without a terminal publication state beyond the approved stale threshold.
      expected_result: Product health becomes unhealthy and the named receiver is notified through the configured route.
      evidence_requirement_refs:
        - e_product_health_proof
        - e_alert_route_proof
    - id: at_capacity_threshold
      readiness_gate_ref: g_delivery_apply_ready
      statement: The representative workload approaches or exceeds the approved capacity threshold.
      expected_result: The threshold is measured, the sequencing or scale response is recorded and the alert route is exercised.
      evidence_requirement_refs:
        - e_capacity_baseline
        - e_alert_route_proof
    - id: at_classified_failures
      readiness_gate_ref: g_delivery_apply_ready
      statement: One transient, one authentication or schema, and one uncertain mutation outcome are injected.
      expected_result: Only the transient case retries with bounded backoff; the non-retryable case stops; the uncertain case reconciles by readback before another mutation.
      evidence_requirement_refs:
        - e_recovery_proof
    - id: at_serving_acceptance
      readiness_gate_ref: g_delivery_acceptance_ready
      statement: Model queries, negative access personas and report interactions run against the same frozen snapshot.
      expected_result: Values meet approved tolerances, denied personas remain denied, and every required report page renders and interacts successfully.
      evidence_requirement_refs:
        - e_serving_acceptance_proof
    - id: at_cutover_and_retirement
      readiness_gate_ref: g_delivery_acceptance_ready
      statement: Downstream consumers are rebound from the compatibility path to the approved target before the former writer or serving path is retired.
      expected_result: Bindings resolve to the target, values reconcile, denied personas remain denied, reports render, rollback succeeds and retirement is backed by an approval record.
      evidence_requirement_refs:
        - e_cutover_decommission_proof
        - e_serving_acceptance_proof
    - id: at_eventual_consistency_bound
      readiness_gate_ref: g_delivery_apply_ready
      statement: A newly created platform resource is read back through the same path used by subsequent binding automation, while one permanent error is injected separately.
      expected_result: Visibility delay is absorbed within the approved bounded retry window and the permanent error stops immediately with classified evidence.
      evidence_requirement_refs:
        - e_eventual_consistency_proof
    - id: at_runtime_identity_drift
      readiness_gate_ref: g_delivery_apply_ready
      statement: A production pipeline is edited and saved by a delivery user and then corrected through the documented re-save or recreate path.
      expected_result: Readback shows the changed executing identity after the edit and the declared runtime identity after the correction; no scheduled run executes under the delivery user.
      evidence_requirement_refs:
        - e_runtime_identity_drift_proof
    - id: at_personal_access_removal
      readiness_gate_ref: g_delivery_acceptance_ready
      statement: The direct assignments of the delivery user are removed after the runtime identity has taken over.
      expected_result: Scheduled runs continue under the runtime identity, the operator keeps access through the declared group and no environment reports a direct user assignment or a user-owned schedule or semantic model.
      evidence_requirement_refs:
        - e_runtime_ownership_proof
        - e_access_assignment_proof
        - e_check_execution_record
    - id: at_restore_and_rebuild
      readiness_gate_ref: g_delivery_acceptance_ready
      statement: One deleted item is restored from retention and one governed layer is rebuilt from the source in a non-production environment.
      expected_result: Both paths finish within the confirmed recovery targets, restored and rebuilt data reconcile with the reference, and achieved times are retained.
      evidence_requirement_refs:
        - e_retention_recovery_readback
        - e_recovery_proof
    - id: at_change_governance
      readiness_gate_ref: g_delivery_apply_ready
      statement: A pull request that violates the branch policy and a compliant pull request are submitted against the protected branch.
      expected_result: The violating request is blocked, the compliant one merges only after the required reviewers approve, and the deployment runs under a service connection with least privilege.
      evidence_requirement_refs:
        - e_change_governance_proof
