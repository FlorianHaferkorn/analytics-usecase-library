schema_version: '2.0'
id: S-P1.2
name: Dual-Source Activation
owner_domain: Procurement / Supply Chain Leadership
impact_dimension: Supply Continuity
status: active
owner_role: head_of_supply_chain
steward_role: supply_chain_leadership_bi_lead
use_case_links:
  core_use_cases: []
  related_use_cases:
  - SCM-EXT-001
kpis:
  trigger_kpis:
  - supply.stockout_impact.pct
  - supply.otif.pct
  guardrail_kpis:
  - supply.penalty.amount
  outcome_kpis:
  - supply.stockout_impact.pct
scope:
  default_grain: supplier_material_month
  default_perspective:
  - Supplier
  - Material
  supported_slices:
  - Plant
  - Region
  exclusions:
  - Regulated materials with single-source approval requirement
  - Suppliers already under dual-source rollout
  - Items with immaterial service exposure
trigger:
  type: Pattern
  evaluation:
    grain: supplier_material_month
    window:
      kind: rolling
      length: 3
      unit: periods
    persistence:
      required: true
      min_consecutive_periods: 2
    minimum_data:
      min_observations: 1
  levels:
    L1:
      severity: EarlyWarning
      condition:
        metric_kpi_id: supply.stockout_impact.pct
        comparator: gt
        threshold:
          basis: absolute
          value: 0.03
          unit: '%'
        filters: []
    L2:
      severity: RequiredIntervention
      condition:
        metric_kpi_id: supply.stockout_impact.pct
        comparator: gt
        threshold:
          basis: absolute
          value: 0.06
          unit: '%'
        filters: []
    L3:
      severity: PrescriptiveExecution
      condition:
        metric_kpi_id: supply.stockout_impact.pct
        comparator: gt
        threshold:
          basis: absolute
          value: 0.1
          unit: '%'
        filters: []
  gating_rules:
  - Trigger only if service exposure is recurring and concentrated on one supplier-source setup
  - Do not trigger if alternate supplier already approved and ramping up
  - Exclude materials with strategic single-source policy exception
impact:
  category: High
  expected_range:
    metric_kpi_id: supply.stockout_impact.pct
    value_low: -2.0
    value_high: -8.0
    unit: pp
    time_to_effect:
      min_periods: 2
      max_periods: 6
  mechanism:
  - Reduces concentration risk on vulnerable supply positions
  - Lowers service disruption exposure through alternate source readiness
  confidence:
    level: Medium
    rationale:
    - Impact depends on qualification lead time and source readiness
    - Benefits are strongest for high-concentration critical materials
operational_execution:
  stakeholders:
  - Procurement
  - Supplier Quality
  - Engineering
  prerequisites:
  - Approved critical material list and supplier qualification process
  - Alternative source shortlist or sourcing pipeline
  steps:
  - IDENTIFY each supplier-material pair with recurring service exposure
  - NOMINATE alternative source candidates for this supplier-material pair
  - INITIATE qualification and onboarding workflow for this supplier-material pair
  - TRACK dual-source readiness milestones for this supplier-material pair monthly
  effort:
    level: Medium
    typical_duration_days: 90
  risks_and_tradeoffs:
  - Additional qualification cost and slower short-term execution
  - Quality risk if alternate source is onboarded too quickly
data_requirements:
  required_entities:
  - Supplier
  - Material
  semantic_dependencies:
    measures:
    - Stockout Impact %
    - OTIF %
    - Penalty Amount
    tables:
    - fact_fulfillment
    - fact_supplier_penalties
    - dim_supplier
    - dim_material
automation:
  detection:
    enabled: true
    evaluation_frequency: monthly
    output: Supplier-material pairs requiring dual-source activation
  suggested_actions:
    enabled: true
    outputs:
    - Ranked alternate source activation list
  copilot_prompts: []
tracking:
  execution_log:
    enabled: true
    recommended_storage: fact_action_execution
    minimum_fields:
    - ActionCode
    - Supplier
    - Material
    - TriggerLevel
    - ExecutedDate
  outcome_evaluation:
    enabled: true
    recommended_storage: fact_action_outcome
    minimum_fields:
    - ActionCode
    - Pre_StockoutImpact_Pct
    - Post_StockoutImpact_Pct_90d
governance:
  approvals_required:
  - VP Procurement
  - Head of Supplier Quality
  rollback_plan:
  - Pause onboarding if quality, cost, or compliance risk exceeds thresholds
  documentation_links:
  - core/usecases/extended/SCM-EXT-001_Supplier_Risk_Monitor/Business_Factsheet.md
quality_rules:
- All kpi_id values must exist in KPI catalog.
- Trigger severity must be strictly increasing from L1 to L3.
- impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis.
- If status=deprecated then lifecycle.replaced_by is required.
- 'No free-text trigger notes: use gating_rules and structured filters.'