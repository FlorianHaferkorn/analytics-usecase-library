schema_version: '2.0'
id: S-R2.4
name: Penalty & Expedite Cost Control
owner_domain: Logistics / Procurement
impact_dimension: Cost Efficiency
status: active
owner_role: logistics_cost_manager
steward_role: logistics_procurement_bi_lead
use_case_links:
  core_use_cases:
  - SCM-002
  related_use_cases:
  - FIN-002
kpis:
  trigger_kpis:
  - supply.penalty.amount
  - supply.expedite.amount
  guardrail_kpis:
  - supply.otif.pct
  outcome_kpis:
  - supply.penalty.amount
  - supply.expedite.amount
scope:
  default_grain: lane_dc_month
  default_perspective:
  - Lane
  - Location
  supported_slices:
  - Customer
  - Channel
  exclusions:
  - Penalties driven by customer-side process failures
  - Approved premium service agreements
  - Force majeure-driven expedites
trigger:
  type: Deviation
  evaluation:
    grain: lane_dc_month
    window:
      kind: rolling
      length: 2
      unit: periods
    persistence:
      required: true
      min_consecutive_periods: 2
    minimum_data:
      min_observations: 1
      volume_guardrail:
        enabled: true
        metric_kpi_id: shipments.count
        comparator: gte
        value: 200
        unit: count
  levels:
    L1:
      severity: EarlyWarning
      condition:
        metric_kpi_id: supply.penalty.amount
        comparator: gt
        threshold:
          basis: relative
          value: 10.0
          unit: '%'
        filters: []
    L2:
      severity: RequiredIntervention
      condition:
        metric_kpi_id: supply.penalty.amount
        comparator: gt
        threshold:
          basis: relative
          value: 25.0
          unit: '%'
        filters: []
    L3:
      severity: PrescriptiveExecution
      condition:
        metric_kpi_id: supply.penalty.amount
        comparator: gt
        threshold:
          basis: relative
          value: 40.0
          unit: '%'
        filters: []
  gating_rules:
  - Trigger only if penalties/expedites are structurally recurring
  - Do not trigger if cost increase is explained by approved service upgrades
  - Exclude lanes with active transport stabilisation actions
impact_valuation:
  method: CostAvoidance
  currency: EUR
  success_window:
    duration: P60D
    metric_kpi_id: supply.penalty.amount
    success_criteria:
      kind: return_to_baseline
      baseline_window: P90D
  calculation_logic:
    standardized: "RealizedEUR = Pre_Penalty_Amount - Post_Penalty_Amount"
  required_measures:
  - Penalty Amount
  - Action Execution Count
  attribution:
    method: before_after
impact:
  category: Medium
  expected_range:
    metric_kpi_id: supply.penalty.amount
    value_low: -10.0
    value_high: -30.0
    unit: '%'
    time_to_effect:
      min_periods: 1
      max_periods: 3
  mechanism:
  - Elimination of avoidable service failure penalties
  - Reduction of reactive expedite usage
  confidence:
    level: Medium
    rationale:
    - Cost drivers are often concentrated
    - Effectiveness depends on root-cause follow-through
operational_execution:
  stakeholders:
  - Supply Planning
  - Customer Operations
  - Finance
  prerequisites:
  - Penalty attribution by lane, location, and customer
  - Clear expedite approval logic
  steps:
  - IDENTIFY recurring penalties or expedites by lane and location
  - CLASSIFY costs as avoidable vs justified for the affected lane-DC scope
  - CORRECT underlying execution or planning issues for the affected lane-DC scope
  - REVIEW cost trends monthly for the affected lane-DC scope
  effort:
    level: Medium
    typical_duration_days: 60
  risks_and_tradeoffs:
  - Cost focus masking service degradation
  - Delayed service recovery if expedites are over-restricted
data_requirements:
  required_entities:
  - Lane
  - Location
  - Customer
  semantic_dependencies:
    measures:
    - Penalty Amount
    - Expedite Cost Amount
    - OTIF %
    - Shipments Count
    tables:
    - fact_fulfillment
    - fact_logistics
    - dim_lane
    - dim_org
automation:
  detection:
    enabled: true
    evaluation_frequency: monthly
    output: Lane-DC combinations with structurally high service costs
  suggested_actions:
    enabled: true
    outputs:
    - Penalty and expedite containment actions
  copilot_prompts: []
tracking:
  execution_log:
    enabled: true
    recommended_storage: fact_action_execution
    minimum_fields:
    - ActionCode
    - Lane
    - Location
    - TriggerLevel
    - ExecutedDate
  outcome_evaluation:
    enabled: true
    recommended_storage: fact_action_outcome
    minimum_fields:
    - ActionCode
    - Pre_Penalty_Amount
    - Post_Penalty_Amount_60d
governance:
  approvals_required:
  - Head of Logistics
  - Finance Business Partner
  rollback_plan:
  - Reinstate expedites if OTIF deteriorates beyond tolerance
  documentation_links:
  - core/usecases/core/SCM-002_Supply_Reliability_OTIF/Business_Factsheet.md
quality_rules:
- All kpi_id values must exist in KPI catalog.
- Trigger severity must be strictly increasing from L1 to L3.
- impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis.
- If status=deprecated then lifecycle.replaced_by is required.
- 'No free-text trigger notes: use gating_rules and structured filters.'
