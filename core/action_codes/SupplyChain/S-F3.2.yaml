schema_version: '2.0'
id: S-F3.2
name: Forecast Bias & Accuracy Correction
owner_domain: Demand Planning
impact_dimension: Forecast Quality
status: active
owner_role: demand_planning_manager
steward_role: demand_planning_bi_lead
use_case_links:
  core_use_cases:
  - SCM-003
  related_use_cases:
  - SCM-001
kpis:
  trigger_kpis:
  - plan.forecast.bias.pct
  - plan.forecast.mape.pct
  guardrail_kpis:
  - plans.count
  outcome_kpis:
  - plan.forecast.accuracy.pct
  - plan.forecast.bias.pct
scope:
  default_grain: sku_location_month
  default_perspective:
  - SKU
  - Location
  supported_slices:
  - Planner
  - Demand Pattern
  exclusions:
  - New product introductions
  - Promotion-driven demand volatility (COM-004)
  - Exceptional market events
trigger:
  type: Deviation
  evaluation:
    grain: sku_location_month
    window:
      kind: rolling
      length: 3
      unit: periods
    persistence:
      required: true
      min_consecutive_periods: 2
    minimum_data:
      min_observations: 3
      volume_guardrail:
        enabled: true
        metric_kpi_id: sales.units
        comparator: gte
        value: 3000
        unit: units
  levels:
    L1:
      severity: EarlyWarning
      condition:
        metric_kpi_id: plan.forecast.bias.pct
        comparator: abs_gt
        threshold:
          basis: absolute
          value: 10.0
          unit: '%'
        filters: []
    L2:
      severity: RequiredIntervention
      condition:
        metric_kpi_id: plan.forecast.bias.pct
        comparator: abs_gt
        threshold:
          basis: absolute
          value: 20.0
          unit: '%'
        filters: []
    L3:
      severity: PrescriptiveExecution
      condition:
        metric_kpi_id: plan.forecast.bias.pct
        comparator: abs_gt
        threshold:
          basis: absolute
          value: 30.0
          unit: '%'
        filters: []
  gating_rules:
  - Trigger only if bias direction is consistent across periods
  - Do not trigger if error is driven by one-off demand shocks
  - Exclude SKUs with active service containment actions
impact_valuation:
  method: CostAvoidance
  currency: EUR
  success_window:
    duration: P90D
    metric_kpi_id: plan.forecast.mape.pct
    success_criteria:
      kind: return_to_baseline
      baseline_window: P90D
  calculation_logic:
    standardized: "RealizedEUR = (Pre_MAPE - Post_MAPE) * Avg_Demand_Value * Safety_Stock_Factor"
  required_measures:
  - MAPE %
  - Demand Value
  - Action Execution Count
  attribution:
    method: before_after
impact:
  category: Medium
  expected_range:
    metric_kpi_id: plan.forecast.accuracy.pct
    value_low: 4.0
    value_high: 10.0
    unit: pp
    time_to_effect:
      min_periods: 2
      max_periods: 5
  mechanism:
  - Reduction of systematic forecast bias
  - Cleaner override discipline and input quality
  confidence:
    level: Medium
    rationale:
    - Bias correction is highly effective when systematic
    - Planner discipline is a critical success factor
operational_execution:
  stakeholders:
  - Sales
  - Supply Planning
  prerequisites:
  - Consistent bias and accuracy measurement
  - Transparent forecast override logging
  steps:
  - Identify SKUs with persistent forecast bias
  - Correct parameters, overrides, or input data
  - Align planners on bias correction targets
  - Monitor bias and accuracy monthly
  effort:
    level: Medium
    typical_duration_days: 90
  risks_and_tradeoffs:
  - Overcorrection creating oscillations
  - Planner resistance to override constraints
data_requirements:
  required_entities:
  - SKU
  - Location
  semantic_dependencies:
    measures:
    - Forecast Accuracy %
    - Forecast Bias %
    - Forecast MAPE %
    - Plans Count
    - Sales Units
    tables:
    - fact_forecast
    - fact_sales
    - fact_fulfillment
    - dim_product
    - dim_org
automation:
  detection:
    enabled: true
    evaluation_frequency: monthly
    output: SKU-locations with persistent forecast bias
  suggested_actions:
    enabled: true
    outputs:
    - Bias correction and override discipline actions
  copilot_prompts: []
tracking:
  execution_log:
    enabled: true
    recommended_storage: fact_action_execution
    minimum_fields:
    - ActionCode
    - SKU
    - Location
    - TriggerLevel
    - ExecutedDate
  outcome_evaluation:
    enabled: true
    recommended_storage: fact_action_outcome
    minimum_fields:
    - ActionCode
    - Pre_Bias_Pct
    - Post_Bias_Pct_120d
governance:
  approvals_required:
  - Head of Demand Planning
  rollback_plan:
  - Relax override constraints if forecast volatility increases
  documentation_links:
  - core/usecases/core/SCM-003_Forecast_vs_Actual/Business_Factsheet.md
quality_rules:
- All kpi_id values must exist in KPI catalog.
- Trigger severity must be strictly increasing from L1 to L3.
- impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis.
- If status=deprecated then lifecycle.replaced_by is required.
- 'No free-text trigger notes: use gating_rules and structured filters.'
