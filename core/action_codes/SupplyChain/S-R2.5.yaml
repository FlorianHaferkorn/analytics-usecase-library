schema_version: '2.0'
id: S-R2.5
name: Planning & Execution Alignment
owner_domain: S&OP / Supply Chain Planning
impact_dimension: Stability
status: active
owner_role: s_and_op_lead
steward_role: s_and_op_supply_chain_planning_bi_lead
use_case_links:
  core_use_cases:
  - SCM-002
  related_use_cases:
  - SCM-003
  - SCM-001
kpis:
  trigger_kpis:
  - supply.otif.pct
  - supply.expedite.amount
  guardrail_kpis:
  - inv.dio.days
  outcome_kpis:
  - supply.otif.pct
scope:
  default_grain: region_month
  default_perspective:
  - Region
  - Channel
  supported_slices:
  - Planning Horizon
  - Location
  exclusions:
  - Forecast-driven structural demand shifts
  - One-off crisis or recovery planning cycles
  - SKUs under promotion programs (COM-004)
trigger:
  type: Deviation
  evaluation:
    grain: region_month
    window:
      kind: rolling
      length: 4
      unit: periods
    persistence:
      required: true
      min_consecutive_periods: 2
    minimum_data:
      min_observations: 2
      volume_guardrail:
        enabled: true
        metric_kpi_id: shipments.count
        comparator: gte
        value: 500
        unit: count
  levels:
    L1:
      severity: EarlyWarning
      condition:
        metric_kpi_id: supply.expedite.amount
        comparator: gt
        threshold:
          basis: relative
          value: 10.0
          unit: '%'
        filters: []
    L2:
      severity: RequiredIntervention
      condition:
        metric_kpi_id: supply.expedite.amount
        comparator: gt
        threshold:
          basis: relative
          value: 25.0
          unit: '%'
        filters: []
    L3:
      severity: PrescriptiveExecution
      condition:
        metric_kpi_id: supply.expedite.amount
        comparator: gt
        threshold:
          basis: relative
          value: 40.0
          unit: '%'
        filters: []
  gating_rules:
  - Trigger only if expedites are caused by planning overrides or late changes
  - Do not trigger if expedites are driven by external disruptions
  - Exclude cycles with active fulfillment or transport stabilisation actions
impact_valuation:
  method: CostAvoidance
  currency: EUR
  success_window:
    duration: P60D
    metric_kpi_id: supply.expedite.amount
    success_criteria:
      kind: return_to_baseline
      baseline_window: P90D
  calculation_logic:
    standardized: "RealizedEUR = Pre_Expedite_Amount - Post_Expedite_Amount"
  required_measures:
  - Expedite Amount
  - Action Execution Count
  attribution:
    method: before_after
impact:
  category: Medium
  expected_range:
    metric_kpi_id: supply.otif.pct
    value_low: 1.0
    value_high: 3.0
    unit: pp
    time_to_effect:
      min_periods: 2
      max_periods: 6
  mechanism:
  - Reduced late forecast-version changes and execution churn
  - Clear freeze windows improving execution reliability
  confidence:
    level: Medium
    rationale:
    - Governance changes take time
    - Effectiveness depends on adherence discipline
operational_execution:
  stakeholders:
  - Supply Planning
  - Logistics
  - Sales Operations
  prerequisites:
  - Clear forecast freeze windows and decision rights
  - Visibility of forecast version changes vs execution impact
  steps:
  - IDENTIFY regions and channels affected by repeated late forecast-version changes
  - ANALYSE root causes of plan-execution mismatch for the affected region and channel
  - ENFORCE freeze windows and escalation rules for the affected region and channel
  - REVIEW OTIF and expedite trends monthly for the affected region and channel
  effort:
    level: Medium
    typical_duration_days: 120
  risks_and_tradeoffs:
  - Reduced flexibility for late customer changes
  - Resistance to stricter governance
data_requirements:
  required_entities:
  - Region
  - Channel
  semantic_dependencies:
    measures:
    - OTIF %
    - Expedite Cost Amount
    - DIO (Days)
    - Shipments Count
    tables:
    - fact_forecast
    - fact_fulfillment
    - dim_org
automation:
  detection:
    enabled: true
    evaluation_frequency: monthly
    output: Region-channel scopes with repeated late forecast-version changes
  suggested_actions:
    enabled: true
    outputs:
    - Planning freeze-window and forecast-governance actions
  copilot_prompts: []
tracking:
  execution_log:
    enabled: true
    recommended_storage: fact_action_execution
    minimum_fields:
    - ActionCode
    - Region
    - Channel
    - TriggerLevel
    - ExecutedDate
  outcome_evaluation:
    enabled: true
    recommended_storage: fact_action_outcome
    minimum_fields:
    - ActionCode
    - Pre_OTIF_Pct
    - Post_OTIF_Pct_180d
governance:
  approvals_required:
  - VP Supply Chain
  rollback_plan:
  - Relax freeze windows if customer service deteriorates materially
  documentation_links:
  - core/usecases/core/SCM-002_Supply_Reliability_OTIF/Business_Factsheet.md
quality_rules:
- All kpi_id values must exist in KPI catalog.
- Trigger severity must be strictly increasing from L1 to L3.
- impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis.
- If status=deprecated then lifecycle.replaced_by is required.
- 'No free-text trigger notes: use gating_rules and structured filters.'
