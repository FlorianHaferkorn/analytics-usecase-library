schema_version: '2.0'
id: S-R2.5
name: Planning & Execution Alignment
owner_domain: S&OP / Supply Chain Planning
impact_dimension: Stability
status: active
owner_role: s_and_op_lead
steward_role: s_and_op_supply_chain_planning_bi_lead
use_case_links:
  core_use_cases:
  - SCM-002
  related_use_cases:
  - SCM-003
  - SCM-001
kpis:
  trigger_kpis:
  - supply.otif.pct
  - supply.expedite.amount
  guardrail_kpis:
  - inv.dio.days
  outcome_kpis:
  - supply.otif.pct
scope:
  default_grain: sop_cycle_week
  default_perspective:
  - S&OP Cycle
  - Region
  supported_slices:
  - Planning Horizon
  - Execution Window
  exclusions:
  - Forecast-driven structural demand shifts
  - One-off crisis or recovery planning cycles
  - SKUs under promotion programs (COM-004)
trigger:
  type: Deviation
  evaluation:
    grain: sop_cycle_week
    window:
      kind: rolling
      length: 4
      unit: periods
    persistence:
      required: true
      min_consecutive_periods: 2
    minimum_data:
      min_observations: 2
      volume_guardrail:
        enabled: true
        metric_kpi_id: shipments.count
        comparator: gte
        value: 500
        unit: count
  levels:
    L1:
      severity: EarlyWarning
      condition:
        metric_kpi_id: supply.expedite.amount
        comparator: gt
        threshold:
          basis: relative
          value: 0.1
          unit: '%'
        filters: []
    L2:
      severity: RequiredIntervention
      condition:
        metric_kpi_id: supply.expedite.amount
        comparator: gt
        threshold:
          basis: relative
          value: 0.25
          unit: '%'
        filters: []
    L3:
      severity: PrescriptiveExecution
      condition:
        metric_kpi_id: supply.expedite.amount
        comparator: gt
        threshold:
          basis: relative
          value: 0.4
          unit: '%'
        filters: []
  gating_rules:
  - Trigger only if expedites are caused by planning overrides or late changes
  - Do not trigger if expedites are driven by external disruptions
  - Exclude cycles with active fulfillment or transport stabilisation actions
impact:
  category: Medium
  expected_range:
    metric_kpi_id: supply.otif.pct
    value_low: 1.0
    value_high: 3.0
    unit: pp
    time_to_effect:
      min_periods: 2
      max_periods: 6
  mechanism:
  - Reduced late plan changes and execution churn
  - Clear freeze windows improving execution reliability
  confidence:
    level: Medium
    rationale:
    - Governance changes take time
    - Effectiveness depends on adherence discipline
operational_execution:
  stakeholders:
  - Supply Planning
  - Logistics
  - Sales Operations
  prerequisites:
  - Clear S&OP cadence and decision rights
  - Visibility of plan changes vs execution impact
  steps:
  - IDENTIFY shipments affected by repeated last-minute plan changes
  - ANALYSE root causes of plan-execution mismatch for this shipment
  - ENFORCE freeze windows and escalation rules for this shipment
  - REVIEW OTIF and expedite trends for this shipment per cycle
  effort:
    level: Medium
    typical_duration_days: 120
  risks_and_tradeoffs:
  - Reduced flexibility for late customer changes
  - Resistance to stricter governance
data_requirements:
  required_entities:
  - S&OP Cycle
  - Region
  semantic_dependencies:
    measures:
    - OTIF %
    - Expedite Cost Amount
    - DIO (Days)
    - Shipments Count
    tables:
    - fact_shipments
    - fact_logistics_cost
    - fact_sop_changes
    - dim_region
    - dim_sop_cycle
automation:
  detection:
    enabled: true
    evaluation_frequency: monthly
    output: S&OP cycles with repeated plan-execution mismatches
  suggested_actions:
    enabled: true
    outputs:
    - Planning governance and freeze-window enforcement actions
  copilot_prompts: []
tracking:
  execution_log:
    enabled: true
    recommended_storage: fact_action_execution
    minimum_fields:
    - ActionCode
    - SOPCycle
    - Region
    - TriggerLevel
    - ExecutedDate
  outcome_evaluation:
    enabled: true
    recommended_storage: fact_action_outcome
    minimum_fields:
    - ActionCode
    - Pre_OTIF_Pct
    - Post_OTIF_Pct_180d
governance:
  approvals_required:
  - VP Supply Chain
  rollback_plan:
  - Relax freeze windows if customer service deteriorates materially
  documentation_links:
  - framework/usecases/core/SCM-002_Supply_Reliability_OTIF/Business_Factsheet.md
quality_rules:
- All kpi_id values must exist in KPI catalog.
- Trigger severity must be strictly increasing from L1 to L3.
- impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis.
- If status=deprecated then lifecycle.replaced_by is required.
- 'No free-text trigger notes: use gating_rules and structured filters.'
