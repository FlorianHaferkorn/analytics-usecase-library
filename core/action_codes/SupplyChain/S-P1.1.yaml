schema_version: '2.0'
id: S-P1.1
name: Supplier Performance Escalation
owner_domain: Procurement / Supply Chain Leadership
impact_dimension: Supply Continuity
status: active
owner_role: head_of_supply_chain
steward_role: supply_chain_leadership_bi_lead
use_case_links:
  core_use_cases: []
  related_use_cases:
  - SCM-EXT-001
kpis:
  trigger_kpis:
  - supply.otif.pct
  - supply.penalty.amount
  guardrail_kpis:
  - supply.stockout_impact.pct
  outcome_kpis:
  - supply.otif.pct
scope:
  default_grain: supplier_month
  default_perspective:
  - Supplier
  - Material Group
  supported_slices:
  - Region
  - Plant
  exclusions:
  - Force majeure events acknowledged in supplier contract
  - Newly onboarded suppliers within stabilization window
  - Suppliers already under formal remediation governance
trigger:
  type: Deviation
  evaluation:
    grain: supplier_month
    window:
      kind: rolling
      length: 2
      unit: periods
    persistence:
      required: true
      min_consecutive_periods: 2
    minimum_data:
      min_observations: 1
      volume_guardrail:
        enabled: true
        metric_kpi_id: supply.penalty.amount
        comparator: gte
        value: 5000
        unit: amount
  levels:
    L1:
      severity: EarlyWarning
      condition:
        metric_kpi_id: supply.otif.pct
        comparator: lt
        threshold:
          basis: absolute
          value: 95.0
          unit: '%'
        filters: []
    L2:
      severity: RequiredIntervention
      condition:
        metric_kpi_id: supply.otif.pct
        comparator: lt
        threshold:
          basis: absolute
          value: 92.0
          unit: '%'
        filters: []
    L3:
      severity: PrescriptiveExecution
      condition:
        metric_kpi_id: supply.otif.pct
        comparator: lt
        threshold:
          basis: absolute
          value: 90.0
          unit: '%'
        filters: []
  gating_rules:
  - Trigger only if supplier deterioration persists beyond one review cycle
  - Do not trigger if service failure is fully explained by internal scheduling changes
  - Exclude suppliers with approved recovery plan already on track
impact:
  category: High
  expected_range:
    metric_kpi_id: supply.otif.pct
    value_low: 1.0
    value_high: 4.0
    unit: pp
    time_to_effect:
      min_periods: 1
      max_periods: 2
  mechanism:
  - Formal escalation increases supplier management attention
  - Corrective action plan reduces repeat service failures
  confidence:
    level: Medium
    rationale:
    - Effectiveness depends on supplier leverage and remedy speed
    - Stronger signal when supported by penalty and OTIF evidence
operational_execution:
  stakeholders:
  - Procurement
  - Supplier Quality
  - Supply Planning
  prerequisites:
  - Agreed supplier SLA baseline and scorecard cadence
  - Named supplier account owner and escalation workflow
  steps:
  - IDENTIFY each supplier breaching OTIF thresholds with material impact
  - ISSUE formal performance escalation for this supplier
  - REQUIRE corrective action plan and committed recovery milestones for this supplier
  - REVIEW supplier recovery status for this supplier monthly
  effort:
    level: Low
    typical_duration_days: 30
  risks_and_tradeoffs:
  - Escalation fatigue if low-materiality suppliers are included
  - Adversarial tone can delay collaboration if not evidence-based
data_requirements:
  required_entities:
  - Supplier
  - Material Group
  semantic_dependencies:
    measures:
    - OTIF %
    - Penalty Amount
    - Stockout Impact %
    tables:
    - fact_fulfillment
    - fact_supplier_penalties
    - dim_supplier
    - dim_material
automation:
  detection:
    enabled: true
    evaluation_frequency: monthly
    output: Suppliers requiring formal escalation
  suggested_actions:
    enabled: true
    outputs:
    - Escalation pack with OTIF and penalty evidence
  copilot_prompts: []
tracking:
  execution_log:
    enabled: true
    recommended_storage: fact_action_execution
    minimum_fields:
    - ActionCode
    - Supplier
    - MaterialGroup
    - TriggerLevel
    - ExecutedDate
  outcome_evaluation:
    enabled: true
    recommended_storage: fact_action_outcome
    minimum_fields:
    - ActionCode
    - Pre_OTIF_Pct
    - Post_OTIF_Pct_30d
governance:
  approvals_required:
  - VP Procurement
  rollback_plan:
  - Close escalation if recovery remains within tolerance for one full cycle
  documentation_links:
  - core/usecases/extended/SCM-EXT-001_Supplier_Risk_Monitor/Business_Factsheet.md
quality_rules:
- All kpi_id values must exist in KPI catalog.
- Trigger severity must be strictly increasing from L1 to L3.
- impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis.
- If status=deprecated then lifecycle.replaced_by is required.
- 'No free-text trigger notes: use gating_rules and structured filters.'