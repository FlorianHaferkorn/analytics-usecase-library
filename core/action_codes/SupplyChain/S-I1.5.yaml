schema_version: '2.0'
id: S-I1.5
name: Forecast & Planning Stabilisation
owner_domain: Demand Planning / S&OP
impact_dimension: Planning Quality
status: active
owner_role: head_of_demand_planning
steward_role: demand_planning_s_and_op_bi_lead
use_case_links:
  core_use_cases:
  - SCM-001
  related_use_cases:
  - SCM-003
kpis:
  trigger_kpis:
  - plan.forecast.accuracy.pct
  guardrail_kpis:
  - inv.dio.days
  outcome_kpis:
  - plan.forecast.accuracy.pct
scope:
  default_grain: sku_location_month
  default_perspective:
  - SKU
  - Location
  supported_slices:
  - Demand Pattern
  - Planning Cycle
  exclusions:
  - New product introductions
  - Promotion-driven demand volatility
  - Markets under exceptional events
trigger:
  type: Deviation
  evaluation:
    grain: sku_location_month
    window:
      kind: rolling
      length: 3
      unit: periods
    persistence:
      required: true
      min_consecutive_periods: 2
    minimum_data:
      min_observations: 3
      volume_guardrail:
        enabled: true
        metric_kpi_id: sales.units
        comparator: gte
        value: 3000
        unit: units
  levels:
    L1:
      severity: EarlyWarning
      condition:
        metric_kpi_id: plan.forecast.accuracy.pct
        comparator: lt
        threshold:
          basis: absolute
          value: 70.0
          unit: '%'
        filters: []
    L2:
      severity: RequiredIntervention
      condition:
        metric_kpi_id: plan.forecast.accuracy.pct
        comparator: lt
        threshold:
          basis: absolute
          value: 60.0
          unit: '%'
        filters: []
    L3:
      severity: PrescriptiveExecution
      condition:
        metric_kpi_id: plan.forecast.accuracy.pct
        comparator: lt
        threshold:
          basis: absolute
          value: 50.0
          unit: '%'
        filters: []
  gating_rules:
  - Trigger only if forecast error is structurally recurring
  - Do not trigger if volatility is driven by approved promotions
  - Exclude SKUs with active rightsizing or stockout actions
impact_valuation:
  method: CostAvoidance
  currency: EUR
  success_window:
    duration: P60D
    metric_kpi_id: plan.forecast.accuracy.pct
    success_criteria:
      kind: return_to_baseline
      baseline_window: P90D
  calculation_logic:
    standardized: "RealizedEUR = Avoided_Excess_Cost + Avoided_Stockout_Cost"
  required_measures:
  - Forecast Accuracy %
  - Excess Cost
  - Stockout Cost
  - Action Execution Count
  attribution:
    method: before_after
impact:
  category: Medium
  expected_range:
    metric_kpi_id: plan.forecast.accuracy.pct
    value_low: 5.0
    value_high: 15.0
    unit: pp
    time_to_effect:
      min_periods: 2
      max_periods: 6
  mechanism:
  - Stabilised planning governance and cadence
  - Reduction of manual overrides and planning noise
  confidence:
    level: Medium
    rationale:
    - Governance changes take time
    - Effectiveness depends on planning discipline
operational_execution:
  stakeholders:
  - Supply Planning
  - Sales
  - Finance
  prerequisites:
  - Consistent forecast accuracy measurement
  - Clear S&OP cadence and escalation rules
  steps:
  - Identify SKUs with persistent forecast instability
  - Review planning inputs, overrides, and cadence
  - Enforce planning governance and parameter discipline
  - Monitor forecast accuracy monthly
  effort:
    level: Medium
    typical_duration_days: 120
  risks_and_tradeoffs:
  - Reduced flexibility in volatile markets
  - Over-standardisation of planning assumptions
data_requirements:
  required_entities:
  - SKU
  - Location
  semantic_dependencies:
    measures:
    - Forecast Accuracy %
    - DIO (Days)
    - Stockout %
    - Sales Units
    tables:
    - fact_forecast
    - fact_sales
    - fact_inventory
    - fact_stockout
    - dim_product
    - dim_org
automation:
  detection:
    enabled: true
    evaluation_frequency: monthly
    output: SKU-locations with structurally unstable forecasts
  suggested_actions:
    enabled: true
    outputs:
    - Planning governance stabilisation actions
  copilot_prompts: []
tracking:
  execution_log:
    enabled: true
    recommended_storage: fact_action_execution
    minimum_fields:
    - ActionCode
    - SKU
    - Location
    - TriggerLevel
    - ExecutedDate
  outcome_evaluation:
    enabled: true
    recommended_storage: fact_action_outcome
    minimum_fields:
    - ActionCode
    - Pre_Forecast_Accuracy_Pct
    - Post_Forecast_Accuracy_Pct_180d
governance:
  approvals_required:
  - S&OP Lead
  rollback_plan:
  - Relax governance if service or responsiveness deteriorates
  documentation_links:
  - core/usecases/core/SCM-001_Inventory_Performance/Business_Factsheet.md
quality_rules:
- All kpi_id values must exist in KPI catalog.
- Trigger severity must be strictly increasing from L1 to L3.
- impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis.
- If status=deprecated then lifecycle.replaced_by is required.
- 'No free-text trigger notes: use gating_rules and structured filters.'
