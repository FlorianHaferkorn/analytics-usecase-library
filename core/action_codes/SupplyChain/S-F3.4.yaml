schema_version: '2.0'
id: S-F3.4
name: Re-Plan Discipline & Stability
owner_domain: S&OP / Planning Excellence
impact_dimension: Planning Stability
status: active
owner_role: planning_excellence_lead
steward_role: s_and_op_planning_excellence_bi_lead
use_case_links:
  core_use_cases:
  - SCM-003
  related_use_cases:
  - SCM-002
kpis:
  trigger_kpis:
  - plan.replan.count
  guardrail_kpis:
  - supply.otif.pct
  outcome_kpis:
  - plan.replan.count
  - plan.forecast.accuracy.pct
scope:
  default_grain: sop_cycle_month
  default_perspective:
  - S&OP Cycle
  supported_slices:
  - Planner
  - Region
  exclusions:
  - Crisis or recovery planning cycles
  - Promotion-driven replans (COM-004)
  - Regulatory or customer-mandated replans
trigger:
  type: Deviation
  evaluation:
    grain: sop_cycle_month
    window:
      kind: rolling
      length: 3
      unit: periods
    persistence:
      required: true
      min_consecutive_periods: 2
    minimum_data:
      min_observations: 1
      volume_guardrail:
        enabled: true
        metric_kpi_id: plans.count
        comparator: gte
        value: 10
        unit: count
  levels:
    L1:
      severity: EarlyWarning
      condition:
        metric_kpi_id: plan.replan.count
        comparator: gt
        threshold:
          basis: absolute
          value: 3
          unit: count
        filters: []
    L2:
      severity: RequiredIntervention
      condition:
        metric_kpi_id: plan.replan.count
        comparator: gt
        threshold:
          basis: absolute
          value: 6
          unit: count
        filters: []
    L3:
      severity: PrescriptiveExecution
      condition:
        metric_kpi_id: plan.replan.count
        comparator: gt
        threshold:
          basis: absolute
          value: 10
          unit: count
        filters: []
  gating_rules:
  - Trigger only if replans are driven by planning overrides or governance breaches
  - Do not trigger if replans are caused by external disruptions
  - Exclude cycles with active forecast bias correction actions
impact_valuation:
  method: CostAvoidance
  currency: EUR
  success_window:
    duration: P60D
    metric_kpi_id: plan.replan.count
    success_criteria:
      kind: return_to_baseline
      baseline_window: P90D
  calculation_logic:
    standardized: "RealizedEUR = Avoided_Replans * Avg_Replan_Cost + Avoided_Nervousness_Cost"
  required_measures:
  - Replan Count
  - Replan Cost
  - Action Execution Count
  attribution:
    method: before_after
impact:
  category: Medium
  expected_range:
    metric_kpi_id: plan.replan.count
    value_low: -20.0
    value_high: -50.0
    unit: '%'
    time_to_effect:
      min_periods: 2
      max_periods: 6
  mechanism:
  - Stricter re-plan thresholds and freeze enforcement
  - Reduction of planning noise and churn
  confidence:
    level: Medium
    rationale:
    - Governance changes require adherence
    - Benefits compound over cycles
operational_execution:
  stakeholders:
  - Demand Planning
  - Supply Planning
  - Sales Operations
  prerequisites:
  - Transparent re-plan logging
  - Clear decision rights and escalation paths
  steps:
  - IDENTIFY cycles or planner scopes with excessive replans
  - ANALYSE root causes of re-planning for the affected cycle or planner scope
  - ENFORCE thresholds, freeze windows, and escalation rules for the affected cycle or planner scope
  - REVIEW re-plan trends per cycle for the affected planning scope
  effort:
    level: Medium
    typical_duration_days: 120
  risks_and_tradeoffs:
  - Reduced flexibility for late demand changes
  - Resistance to stricter planning discipline
data_requirements:
  required_entities:
  - S&OP Cycle
  semantic_dependencies:
    measures:
    - Re-Plan Count
    - Forecast Accuracy %
    - OTIF %
    - Plans Count
    tables:
    - fact_forecast
    - fact_fulfillment
    - dim_org
automation:
  detection:
    enabled: true
    evaluation_frequency: monthly
    output: S&OP cycles with excessive re-planning
  suggested_actions:
    enabled: true
    outputs:
    - Re-plan threshold enforcement actions
  copilot_prompts: []
tracking:
  execution_log:
    enabled: true
    recommended_storage: fact_action_execution
    minimum_fields:
    - ActionCode
    - SOPCycle
    - TriggerLevel
    - ExecutedDate
  outcome_evaluation:
    enabled: true
    recommended_storage: fact_action_outcome
    minimum_fields:
    - ActionCode
    - Pre_Replan_Count
    - Post_Replan_Count_180d
governance:
  approvals_required:
  - VP Supply Chain
  rollback_plan:
  - Relax thresholds if service or responsiveness deteriorates
  documentation_links:
  - core/usecases/core/SCM-003_Forecast_vs_Actual/Business_Factsheet.md
quality_rules:
- All kpi_id values must exist in KPI catalog.
- Trigger severity must be strictly increasing from L1 to L3.
- impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis.
- If status=deprecated then lifecycle.replaced_by is required.
- 'No free-text trigger notes: use gating_rules and structured filters.'
