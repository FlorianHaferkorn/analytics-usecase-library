schema_version: '2.0'
id: S-I1.1
name: Inventory Orchestration
owner_domain: Supply Chain Leadership
impact_dimension: Working Capital & Service Balance
status: active
owner_role: head_of_supply_chain
steward_role: supply_chain_leadership_bi_lead
use_case_links:
  core_use_cases:
  - SCM-001
  related_use_cases:
  - SCM-002
  - FIN-001
kpis:
  trigger_kpis:
  - KPI-SCM-001
  - KPI-SCM-002
  guardrail_kpis:
  - KPI-SCM-007
  outcome_kpis:
  - KPI-SCM-001
scope:
  default_grain: sku_location_month
  default_perspective:
  - SKU
  - Location
  supported_slices:
  - Product Category
  - Planning Group
  exclusions:
  - SKUs under end-of-life programs
  - Inventory constrained by regulatory or safety stock mandates
  - Promotional stock governed by COM-004
trigger:
  type: Deviation
  evaluation:
    grain: sku_location_month
    window:
      kind: rolling
      length: 2
      unit: periods
    persistence:
      required: true
      min_consecutive_periods: 2
    minimum_data:
      min_observations: 1
      volume_guardrail:
        enabled: true
        metric_kpi_id: KPI-COM-012
        comparator: gte
        value: 5000
        unit: units
  levels:
    L1:
      severity: EarlyWarning
      condition:
        metric_kpi_id: KPI-SCM-001
        comparator: gt
        threshold:
          basis: relative
          value: 10.0
          unit: '%'
        filters: []
    L2:
      severity: RequiredIntervention
      condition:
        metric_kpi_id: KPI-SCM-001
        comparator: gt
        threshold:
          basis: relative
          value: 25.0
          unit: '%'
        filters: []
    L3:
      severity: PrescriptiveExecution
      condition:
        metric_kpi_id: KPI-SCM-001
        comparator: gt
        threshold:
          basis: relative
          value: 40.0
          unit: '%'
        filters: []
  gating_rules:
  - Trigger only if OTIF remains within agreed tolerance
  - Do not trigger if DIO increase is driven by approved buffer build-up
  - Exclude SKUs with active execution Action Codes already in progress
impact_valuation:
  method: CashRelease
  currency: EUR
  success_window:
    duration: P60D
    metric_kpi_id: KPI-SCM-001
    success_criteria:
      kind: return_to_baseline
      baseline_window: P90D
  calculation_logic:
    standardized: "RealizedEUR = (Pre_DIO - Post_DIO) / 365 * Annual_COGS"
  required_measures:
  - DIO Days
  - COGS
  - Action Execution Count
  attribution:
    method: before_after
impact:
  category: High
  expected_range:
    metric_kpi_id: KPI-SCM-001
    value_low: -5.0
    value_high: -15.0
    unit: days
    time_to_effect:
      min_periods: 1
      max_periods: 3
  mechanism:
  - Focused activation of the dominant inventory lever
  - Prevention of contradictory stock actions
  confidence:
    level: High
    rationale:
    - DIO is highly sensitive to targeted rightsizing
    - Central coordination improves execution quality
operational_execution:
  stakeholders:
  - Demand Planning
  - Supply Planning
  - Inventory Controlling
  prerequisites:
  - Reliable SKU-location inventory visibility
  - Clear ownership of execution Action Codes
  steps:
  - DETECT sustained DIO deviation for this SKU/location
  - DIAGNOSE the dominant inventory driver (excess, stockout, obsolescence, planning)
    for this SKU/location
  - ACTIVATE the corresponding execution Action Code for this SKU/location
  - REVIEW inventory recovery for this SKU/location monthly
  effort:
    level: Low
    typical_duration_days: 30
  risks_and_tradeoffs:
  - Delayed execution if diagnosis is incorrect
  - Underreaction to multi-driver inventory issues
data_requirements:
  required_entities:
  - SKU
  - Location
  semantic_dependencies:
    measures:
    - DIO (Days)
    - Stockout %
    - OTIF %
    - Sales Units
    tables:
    - fact_inventory
    - fact_stockout
    - fact_fulfillment
    - fact_sales
    - dim_product
    - dim_org
automation:
  detection:
    enabled: true
    evaluation_frequency: monthly
    output: SKU-locations with sustained inventory imbalance
  suggested_actions:
    enabled: true
    outputs:
    - Recommended inventory lever activation
  copilot_prompts: []
tracking:
  execution_log:
    enabled: true
    recommended_storage: fact_action_execution
    minimum_fields:
    - ActionCode
    - SKU
    - Location
    - TriggerLevel
    - ActivatedLever
    - ExecutedDate
  outcome_evaluation:
    enabled: true
    recommended_storage: fact_action_outcome
    minimum_fields:
    - ActionCode
    - Pre_DIO_Days
    - Post_DIO_Days_60d
governance:
  approvals_required:
  - VP Supply Chain
  rollback_plan:
  - Suspend orchestration if service KPIs deteriorate
  documentation_links:
  - core/usecases/core/SCM-001_Inventory_Performance/Business_Factsheet.md
parameters:
- name: period
  type: period
  required: true
  grain: sku_location_month
  source_field: scope.default_grain
- name: trigger_level
  type: trigger_level
  required: true
  allowed_values:
  - L1
  - L2
  - L3
  source_field: trigger.levels
- name: sku
  label: SKU
  type: dimension_member
  required: true
  binding: nicht_belegt
  source_field: scope.default_perspective
- name: location
  label: Location
  type: dimension_member
  required: true
  binding: nicht_belegt
  source_field: scope.default_perspective
- name: product_category
  label: Product Category
  type: dimension_member
  required: false
  binding: nicht_belegt
  source_field: scope.supported_slices
- name: planning_group
  label: Planning Group
  type: dimension_member
  required: false
  binding: nicht_belegt
  source_field: scope.supported_slices
preconditions:
  combine: guardrails_all_and_trigger_any
  checks:
  - id: level_l1
    role: trigger
    kind: kpi_level
    ref: trigger.levels.L1.condition
    kpi_id: KPI-SCM-001
    pruefbar: true
  - id: level_l2
    role: trigger
    kind: kpi_level
    ref: trigger.levels.L2.condition
    kpi_id: KPI-SCM-001
    pruefbar: true
  - id: level_l3
    role: trigger
    kind: kpi_level
    ref: trigger.levels.L3.condition
    kpi_id: KPI-SCM-001
    pruefbar: true
  - id: volume_guardrail
    role: guardrail
    kind: volume_guardrail
    ref: trigger.evaluation.minimum_data.volume_guardrail
    kpi_id: KPI-COM-012
    pruefbar: true
permitted_role:
  source_field: governance.approvals_required
  roles:
  - approver: VP Supply Chain
    role_id: nicht_belegt
review:
  required: true
  state: vorgeschlagen
quality_rules:
- All kpi_id values must exist in KPI catalog.
- Trigger severity must be strictly increasing from L1 to L3.
- impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis.
- If status=deprecated then lifecycle.replaced_by is required.
- 'No free-text trigger notes: use gating_rules and structured filters.'
