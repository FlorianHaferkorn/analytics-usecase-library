schema_version: '2.0'
id: S-I1.4
name: Obsolescence & Excess Reduction
owner_domain: Inventory Management / Finance
impact_dimension: Capital Efficiency
status: active
owner_role: inventory_controller
steward_role: finance_bi_lead
use_case_links:
  core_use_cases:
  - SCM-001
  related_use_cases:
  - FIN-002
kpis:
  trigger_kpis:
  - KPI-SCM-004
  guardrail_kpis:
  - KPI-SCM-002
  outcome_kpis:
  - KPI-SCM-004
  - KPI-SCM-001
scope:
  default_grain: sku_location_month
  default_perspective:
  - SKU
  - Location
  supported_slices:
  - Inventory Age Bucket
  - Product Lifecycle Stage
  exclusions:
  - SKUs in approved end-of-life programs
  - Inventory reserved for regulatory or contractual reasons
  - Promotion stock managed by COM-004
trigger:
  type: Deviation
  evaluation:
    grain: sku_location_month
    window:
      kind: rolling
      length: 2
      unit: periods
    persistence:
      required: true
      min_consecutive_periods: 2
    minimum_data:
      min_observations: 1
      volume_guardrail:
        enabled: true
        metric_kpi_id: KPI-FIN-002
        comparator: gte
        value: 50000
        unit: currency
  levels:
    L1:
      severity: EarlyWarning
      condition:
        metric_kpi_id: KPI-SCM-004
        comparator: gt
        threshold:
          basis: absolute
          value: 5.0
          unit: '%'
        filters: []
    L2:
      severity: RequiredIntervention
      condition:
        metric_kpi_id: KPI-SCM-004
        comparator: gt
        threshold:
          basis: absolute
          value: 10.0
          unit: '%'
        filters: []
    L3:
      severity: PrescriptiveExecution
      condition:
        metric_kpi_id: KPI-SCM-004
        comparator: gt
        threshold:
          basis: absolute
          value: 20.0
          unit: '%'
        filters: []
  gating_rules:
  - Trigger only if items are outside active demand horizon
  - Do not trigger if obsolescence is driven by approved lifecycle transitions
  - Exclude SKUs with active rightsizing or stockout actions
impact_valuation:
  method: CashRelease
  currency: EUR
  success_window:
    duration: P60D
    metric_kpi_id: KPI-SCM-016
    success_criteria:
      kind: threshold_met
      baseline_window: P90D
  calculation_logic:
    standardized: "RealizedEUR = (Post_Turnover - Pre_Turnover) * Avg_Inventory_Value / Pre_Turnover"
  required_measures:
  - Inventory Turnover
  - Inventory Value
  - Action Execution Count
  attribution:
    method: before_after
impact:
  category: Medium
  expected_range:
    metric_kpi_id: KPI-SCM-004
    value_low: -2.0
    value_high: -8.0
    unit: pp
    time_to_effect:
      min_periods: 2
      max_periods: 6
  mechanism:
  - Liquidation or disposal of obsolete stock
  - Structural prevention via replenishment blocking
  confidence:
    level: Medium
    rationale:
    - Impact depends on liquidation options
    - Prevention effect is structurally strong
operational_execution:
  stakeholders:
  - Finance
  - Supply Planning
  - Sales (for disposition channels)
  prerequisites:
  - Reliable inventory aging logic
  - Clear write-off and disposal rules
  steps:
  - Identify obsolete and aging inventory beyond demand horizon
  - Block further replenishment
  - Execute liquidation, return, or disposal actions
  - Monitor obsolete share monthly
  effort:
    level: Medium
    typical_duration_days: 120
  risks_and_tradeoffs:
  - Write-off impact on P&L
  - One-time clearance distorting sales signals
data_requirements:
  required_entities:
  - SKU
  - Location
  semantic_dependencies:
    measures:
    - Obsolete Inventory %
    - DIO (Days)
    - Stockout %
    - Inventory On-Hand Value
    tables:
    - fact_inventory
    - fact_stockout
    - dim_product
    - dim_org
automation:
  detection:
    enabled: true
    evaluation_frequency: monthly
    output: SKU-locations with structurally obsolete inventory
  suggested_actions:
    enabled: true
    outputs:
    - Liquidation and replenishment block candidates
  copilot_prompts: []
tracking:
  execution_log:
    enabled: true
    recommended_storage: fact_action_execution
    minimum_fields:
    - ActionCode
    - SKU
    - Location
    - TriggerLevel
    - ExecutedDate
  outcome_evaluation:
    enabled: true
    recommended_storage: fact_action_outcome
    minimum_fields:
    - ActionCode
    - Pre_Obsolete_Pct
    - Post_Obsolete_Pct_180d
governance:
  approvals_required:
  - Head of Inventory Control
  - Finance Business Partner
  rollback_plan:
  - Suspend liquidation if service KPIs deteriorate
  documentation_links:
  - core/usecases/core/SCM-001_Inventory_Performance/Business_Factsheet.md
parameters:
- name: period
  type: period
  required: true
  grain: sku_location_month
  source_field: scope.default_grain
- name: trigger_level
  type: trigger_level
  required: true
  allowed_values:
  - L1
  - L2
  - L3
  source_field: trigger.levels
- name: sku
  label: SKU
  type: dimension_member
  required: true
  binding: nicht_belegt
  source_field: scope.default_perspective
- name: location
  label: Location
  type: dimension_member
  required: true
  binding: dim_org.Location
  source_field: scope.default_perspective
- name: inventory_age_bucket
  label: Inventory Age Bucket
  type: dimension_member
  required: false
  binding: nicht_belegt
  source_field: scope.supported_slices
- name: product_lifecycle_stage
  label: Product Lifecycle Stage
  type: dimension_member
  required: false
  binding: dim_product.Lifecycle Stage
  source_field: scope.supported_slices
preconditions:
  combine: guardrails_all_and_trigger_any
  checks:
  - id: level_l1
    role: trigger
    kind: kpi_level
    ref: trigger.levels.L1.condition
    kpi_id: KPI-SCM-004
    pruefbar: true
  - id: level_l2
    role: trigger
    kind: kpi_level
    ref: trigger.levels.L2.condition
    kpi_id: KPI-SCM-004
    pruefbar: true
  - id: level_l3
    role: trigger
    kind: kpi_level
    ref: trigger.levels.L3.condition
    kpi_id: KPI-SCM-004
    pruefbar: true
  - id: volume_guardrail
    role: guardrail
    kind: volume_guardrail
    ref: trigger.evaluation.minimum_data.volume_guardrail
    kpi_id: KPI-FIN-002
    pruefbar: true
permitted_role:
  source_field: governance.approvals_required
  roles:
  - approver: Head of Inventory Control
    role_id: inventory_manager
  - approver: Finance Business Partner
    role_id: finance_business_partner
review:
  required: true
  state: vorgeschlagen
quality_rules:
- All kpi_id values must exist in KPI catalog.
- Trigger severity must be strictly increasing from L1 to L3.
- impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis.
- If status=deprecated then lifecycle.replaced_by is required.
- 'No free-text trigger notes: use gating_rules and structured filters.'
