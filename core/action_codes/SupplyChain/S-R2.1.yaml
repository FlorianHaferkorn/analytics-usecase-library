schema_version: '2.0'
id: S-R2.1
name: OTIF Orchestration
owner_domain: Supply Chain Leadership
impact_dimension: Service Reliability
status: active
owner_role: head_of_supply_chain
steward_role: supply_chain_leadership_bi_lead
use_case_links:
  core_use_cases:
  - SCM-002
  related_use_cases:
  - SCM-001
kpis:
  trigger_kpis:
  - supply.otif.pct
  - supply.expedite.amount
  guardrail_kpis:
  - inv.dio.days
  outcome_kpis:
  - supply.otif.pct
scope:
  default_grain: lane_dc_week
  default_perspective:
  - Lane
  - Distribution Center
  supported_slices:
  - Customer Channel
  exclusions:
  - Service degradation caused by force majeure
  - Contractually approved service exceptions
  - SKUs under promotion programs (COM-004)
trigger:
  type: Deviation
  evaluation:
    grain: lane_dc_week
    window:
      kind: rolling
      length: 3
      unit: periods
    persistence:
      required: true
      min_consecutive_periods: 2
    minimum_data:
      min_observations: 2
      volume_guardrail:
        enabled: true
        metric_kpi_id: shipments.count
        comparator: gte
        value: 100
        unit: count
  levels:
    L1:
      severity: EarlyWarning
      condition:
        metric_kpi_id: supply.otif.pct
        comparator: lt
        threshold:
          basis: absolute
          value: 96.0
          unit: '%'
        filters: []
    L2:
      severity: RequiredIntervention
      condition:
        metric_kpi_id: supply.otif.pct
        comparator: lt
        threshold:
          basis: absolute
          value: 93.0
          unit: '%'
        filters: []
    L3:
      severity: PrescriptiveExecution
      condition:
        metric_kpi_id: supply.otif.pct
        comparator: lt
        threshold:
          basis: absolute
          value: 90.0
          unit: '%'
        filters: []
  gating_rules:
  - Trigger only if service deterioration is structurally recurring
  - Do not trigger if OTIF loss is fully explained by inventory shortages
  - Exclude lanes with active execution Action Codes in progress
impact_valuation:
  method: CostAvoidance
  currency: EUR
  success_window:
    duration: P60D
    metric_kpi_id: supply.otif.pct
    success_criteria:
      kind: return_to_baseline
      baseline_window: P90D
  calculation_logic:
    standardized: "RealizedEUR = Avoided_Penalty_Cost + Avoided_Expedite_Cost"
  required_measures:
  - OTIF %
  - Penalty Amount
  - Expedite Cost
  - Action Execution Count
  attribution:
    method: before_after
impact:
  category: High
  expected_range:
    metric_kpi_id: supply.otif.pct
    value_low: 1.0
    value_high: 4.0
    unit: pp
    time_to_effect:
      min_periods: 1
      max_periods: 3
  mechanism:
  - Focused activation of the dominant OTIF improvement lever
  - Avoidance of conflicting expedites and root-cause actions
  confidence:
    level: High
    rationale:
    - OTIF failures are typically concentrated by lane/DC
    - Central coordination improves execution effectiveness
operational_execution:
  stakeholders:
  - Logistics
  - Supply Planning
  - Customer Operations
  prerequisites:
  - Reliable OTIF decomposition (on-time vs in-full)
  - Clear ownership of execution Action Codes
  steps:
  - DETECT sustained OTIF deterioration for this lane-DC scope
  - DIAGNOSE the dominant OTIF loss driver for this lane-DC scope
  - ACTIVATE the corresponding execution Action Code for this lane-DC scope
  - REVIEW OTIF recovery for this lane-DC scope weekly
  effort:
    level: Low
    typical_duration_days: 21
  risks_and_tradeoffs:
  - Delayed execution if root cause is misclassified
  - Underreaction to multi-driver service failures
data_requirements:
  required_entities:
  - Lane
  - Distribution Center
  semantic_dependencies:
    measures:
    - OTIF %
    - On-Time %
    - In-Full %
    - Expedite Cost Amount
    - DIO (Days)
    tables:
    - fact_fulfillment
    - fact_stockout
    - fact_inventory
    - dim_lane
    - dim_org
automation:
  detection:
    enabled: true
    evaluation_frequency: weekly
    output: Lane-DC combinations with sustained OTIF deterioration
  suggested_actions:
    enabled: true
    outputs:
    - Recommended OTIF lever activation
  copilot_prompts: []
tracking:
  execution_log:
    enabled: true
    recommended_storage: fact_action_execution
    minimum_fields:
    - ActionCode
    - Lane
    - DistributionCenter
    - TriggerLevel
    - ActivatedLever
    - ExecutedDate
  outcome_evaluation:
    enabled: true
    recommended_storage: fact_action_outcome
    minimum_fields:
    - ActionCode
    - Pre_OTIF_Pct
    - Post_OTIF_Pct_30d
governance:
  approvals_required:
  - VP Supply Chain
  rollback_plan:
  - Suspend orchestration if service actions conflict or mask root causes
  documentation_links:
  - core/usecases/core/SCM-002_Supply_Reliability_OTIF/Business_Factsheet.md
quality_rules:
- All kpi_id values must exist in KPI catalog.
- Trigger severity must be strictly increasing from L1 to L3.
- impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis.
- If status=deprecated then lifecycle.replaced_by is required.
- 'No free-text trigger notes: use gating_rules and structured filters.'
