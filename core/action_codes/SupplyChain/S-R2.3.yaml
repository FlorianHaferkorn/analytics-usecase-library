schema_version: '2.0'
id: S-R2.3
name: In-Full & Stockout Impact Reduction
owner_domain: Supply Planning
impact_dimension: Availability
status: active
owner_role: supply_planner
steward_role: supply_planning_bi_lead
use_case_links:
  core_use_cases:
  - SCM-002
  related_use_cases:
  - SCM-001
kpis:
  trigger_kpis:
  - supply.stockout_impact.pct
  guardrail_kpis:
  - inv.dio.days
  outcome_kpis:
  - supply.stockout_impact.pct
  - supply.in_full.pct
scope:
  default_grain: sku_lane_week
  default_perspective:
  - SKU
  - Lane
  supported_slices:
  - Customer Priority
  - Channel
  exclusions:
  - Approved customer allocation constraints
  - Force majeure supply shortages
  - SKUs under promotion programs (COM-004)
trigger:
  type: Deviation
  evaluation:
    grain: sku_lane_week
    window:
      kind: rolling
      length: 3
      unit: periods
    persistence:
      required: true
      min_consecutive_periods: 2
    minimum_data:
      min_observations: 2
      volume_guardrail:
        enabled: true
        metric_kpi_id: order.lines
        comparator: gte
        value: 200
        unit: count
  levels:
    L1:
      severity: EarlyWarning
      condition:
        metric_kpi_id: supply.stockout_impact.pct
        comparator: gt
        threshold:
          basis: absolute
          value: 3.0
          unit: '%'
        filters: []
    L2:
      severity: RequiredIntervention
      condition:
        metric_kpi_id: supply.stockout_impact.pct
        comparator: gt
        threshold:
          basis: absolute
          value: 6.0
          unit: '%'
        filters: []
    L3:
      severity: PrescriptiveExecution
      condition:
        metric_kpi_id: supply.stockout_impact.pct
        comparator: gt
        threshold:
          basis: absolute
          value: 10.0
          unit: '%'
        filters: []
  gating_rules:
  - Trigger only if in-full failures dominate OTIF loss
  - Do not trigger if issues are transport-driven
  - Exclude SKUs with active inventory rightsizing actions
impact_valuation:
  method: CostAvoidance
  currency: EUR
  success_window:
    duration: P60D
    metric_kpi_id: supply.stockout_impact.pct
    success_criteria:
      kind: return_to_baseline
      baseline_window: P90D
  calculation_logic:
    standardized: "RealizedEUR = Avoided_Lost_Sales - Incremental_Holding_Cost"
  required_measures:
  - Stockout Impact %
  - Lost Sales
  - Holding Cost
  - Action Execution Count
  attribution:
    method: before_after
impact:
  category: High
  expected_range:
    metric_kpi_id: supply.stockout_impact.pct
    value_low: -1.0
    value_high: -4.0
    unit: pp
    time_to_effect:
      min_periods: 0
      max_periods: 2
  mechanism:
  - Short-term allocation and prioritisation corrections
  - Containment of partial shipment behaviour
  confidence:
    level: High
    rationale:
    - In-full failures have immediate service impact
    - Tactical levers are directly actionable
operational_execution:
  stakeholders:
  - Customer Operations
  - Logistics
  prerequisites:
  - Clear allocation and priority rules
  - Visibility into order line fulfilment
  steps:
  - IDENTIFY SKU-lane scopes with rising in-full failures
  - REALLOCATE constrained supply by service priority for the affected SKU-lane scope
  - CORRECT partial shipment practices for the affected SKU-lane scope
  - REVIEW in-full performance weekly for the affected SKU-lane scope
  effort:
    level: Low
    typical_duration_days: 14
  risks_and_tradeoffs:
  - Service improvement for priority customers at expense of others
  - Increased planning complexity
data_requirements:
  required_entities:
  - SKU
  - Lane
  semantic_dependencies:
    measures:
    - Stockout Impact %
    - In-Full %
    - DIO (Days)
    - Order Lines
    tables:
    - fact_fulfillment
    - fact_stockout
    - fact_inventory
    - dim_product
    - dim_lane
automation:
  detection:
    enabled: true
    evaluation_frequency: weekly
    output: SKU-lane combinations with rising in-full failures
  suggested_actions:
    enabled: true
    outputs:
    - Allocation and partial shipment containment actions
  copilot_prompts: []
tracking:
  execution_log:
    enabled: true
    recommended_storage: fact_action_execution
    minimum_fields:
    - ActionCode
    - SKU
    - Lane
    - TriggerLevel
    - ExecutedDate
  outcome_evaluation:
    enabled: true
    recommended_storage: fact_action_outcome
    minimum_fields:
    - ActionCode
    - Pre_Stockout_Impact_Pct
    - Post_Stockout_Impact_Pct_30d
governance:
  approvals_required:
  - Head of Supply Planning
  rollback_plan:
  - Revert allocation rules if service imbalance escalates
  documentation_links:
  - core/usecases/core/SCM-002_Supply_Reliability_OTIF/Business_Factsheet.md
quality_rules:
- All kpi_id values must exist in KPI catalog.
- Trigger severity must be strictly increasing from L1 to L3.
- impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis.
- If status=deprecated then lifecycle.replaced_by is required.
- 'No free-text trigger notes: use gating_rules and structured filters.'
