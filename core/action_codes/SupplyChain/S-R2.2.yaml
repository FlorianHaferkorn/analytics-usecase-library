schema_version: '2.0'
id: S-R2.2
name: Fulfillment & Transport Stabilisation
owner_domain: Logistics / Operations
impact_dimension: Timeliness
status: active
owner_role: logistics_manager
steward_role: operations_bi_lead
use_case_links:
  core_use_cases:
  - SCM-002
  related_use_cases:
  - OPS-001
kpis:
  trigger_kpis:
  - supply.on_time.pct
  guardrail_kpis:
  - supply.expedite.amount
  outcome_kpis:
  - supply.on_time.pct
  - supply.otif.pct
scope:
  default_grain: lane_dc_week
  default_perspective:
  - Lane
  - Distribution Center
  supported_slices:
  - Carrier
  - Transport Mode
  exclusions:
  - Force majeure or weather-related disruptions
  - Customer-requested delivery date changes
  - Shipments under approved premium service
trigger:
  type: Deviation
  evaluation:
    grain: lane_dc_week
    window:
      kind: rolling
      length: 3
      unit: periods
    persistence:
      required: true
      min_consecutive_periods: 2
    minimum_data:
      min_observations: 2
      volume_guardrail:
        enabled: true
        metric_kpi_id: shipments.count
        comparator: gte
        value: 100
        unit: count
  levels:
    L1:
      severity: EarlyWarning
      condition:
        metric_kpi_id: supply.on_time.pct
        comparator: lt
        threshold:
          basis: absolute
          value: 97.0
          unit: '%'
        filters: []
    L2:
      severity: RequiredIntervention
      condition:
        metric_kpi_id: supply.on_time.pct
        comparator: lt
        threshold:
          basis: absolute
          value: 94.0
          unit: '%'
        filters: []
    L3:
      severity: PrescriptiveExecution
      condition:
        metric_kpi_id: supply.on_time.pct
        comparator: lt
        threshold:
          basis: absolute
          value: 90.0
          unit: '%'
        filters: []
  gating_rules:
  - Trigger only if late deliveries dominate OTIF loss
  - Do not trigger if delays are inventory-driven
  - Exclude lanes with active penalty or expedite containment actions
impact:
  category: High
  expected_range:
    metric_kpi_id: supply.on_time.pct
    value_low: 2.0
    value_high: 5.0
    unit: pp
    time_to_effect:
      min_periods: 1
      max_periods: 2
  mechanism:
  - Lane and carrier execution corrections
  - Dispatch and handover discipline
  confidence:
    level: High
    rationale:
    - Delivery delays are typically lane- or carrier-specific
    - Operational levers are immediately available
operational_execution:
  stakeholders:
  - DC Operations
  - Transport Providers
  prerequisites:
  - Accurate shipment event timestamps
  - Clear lane and carrier ownership
  steps:
  - IDENTIFY shipments with recurring late deliveries by lane/DC
  - ANALYSE delay root causes (pickup, transit, handover) for this shipment
  - IMPLEMENT corrective actions with carriers and DCs for this shipment
  - REVIEW on-time performance for this shipment weekly
  effort:
    level: Low to Medium
    typical_duration_days: 30
  risks_and_tradeoffs:
  - Overuse of premium transport
  - Local optimisation without systemic fix
data_requirements:
  required_entities:
  - Lane
  - Distribution Center
  - Carrier
  semantic_dependencies:
    measures:
    - On-Time %
    - OTIF %
    - Expedite Cost Amount
    - Shipments Count
    tables:
    - fact_shipments
    - fact_logistics_events
    - fact_logistics_cost
    - dim_lane
    - dim_distribution_center
    - dim_carrier
automation:
  detection:
    enabled: true
    evaluation_frequency: weekly
    output: Lane-DC combinations with recurring delivery delays
  suggested_actions:
    enabled: true
    outputs:
    - Carrier and dispatch stabilisation actions
  copilot_prompts: []
tracking:
  execution_log:
    enabled: true
    recommended_storage: fact_action_execution
    minimum_fields:
    - ActionCode
    - Lane
    - DistributionCenter
    - Carrier
    - TriggerLevel
    - ExecutedDate
  outcome_evaluation:
    enabled: true
    recommended_storage: fact_action_outcome
    minimum_fields:
    - ActionCode
    - Pre_OnTime_Pct
    - Post_OnTime_Pct_30d
governance:
  approvals_required:
  - Head of Logistics
  rollback_plan:
  - Revert corrective actions if cost or service volatility increases
  documentation_links:
  - core/usecases/core/SCM-002_Supply_Reliability_OTIF/Business_Factsheet.md
quality_rules:
- All kpi_id values must exist in KPI catalog.
- Trigger severity must be strictly increasing from L1 to L3.
- impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis.
- If status=deprecated then lifecycle.replaced_by is required.
- 'No free-text trigger notes: use gating_rules and structured filters.'
