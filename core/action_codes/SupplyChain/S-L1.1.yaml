schema_version: '2.0'
id: S-L1.1
name: Carrier SLA Escalation
owner_domain: Supply Chain / Logistics Leadership
impact_dimension: Delivery Reliability
status: active
owner_role: logistics_manager
steward_role: supply_planning_logistics_bi_lead
use_case_links:
  core_use_cases: []
  related_use_cases:
  - SCM-IND-L001
kpis:
  trigger_kpis:
  - supply.on_time.pct
  - supply.penalty.amount
  guardrail_kpis:
  - supply.otif.pct
  outcome_kpis:
  - supply.on_time.pct
scope:
  default_grain: carrier_region_week
  default_perspective:
  - Carrier
  - Region
  supported_slices:
  - Customer Segment
  exclusions:
  - Extreme weather or force majeure windows
  - Carriers under approved service transition
  - Low-volume lanes below monitoring threshold
trigger:
  type: Deviation
  evaluation:
    grain: carrier_region_week
    window:
      kind: rolling
      length: 3
      unit: periods
    persistence:
      required: true
      min_consecutive_periods: 2
    minimum_data:
      min_observations: 2
      volume_guardrail:
        enabled: true
        metric_kpi_id: shipments.count
        comparator: gte
        value: 100
        unit: count
  levels:
    L1:
      severity: EarlyWarning
      condition:
        metric_kpi_id: supply.on_time.pct
        comparator: lt
        threshold:
          basis: absolute
          value: 96.0
          unit: '%'
        filters: []
    L2:
      severity: RequiredIntervention
      condition:
        metric_kpi_id: supply.on_time.pct
        comparator: lt
        threshold:
          basis: absolute
          value: 94.0
          unit: '%'
        filters: []
    L3:
      severity: PrescriptiveExecution
      condition:
        metric_kpi_id: supply.on_time.pct
        comparator: lt
        threshold:
          basis: absolute
          value: 92.0
          unit: '%'
        filters: []
  gating_rules:
  - Trigger only if lateness persists across weeks and regions
  - Do not trigger if failure is driven by warehouse cut-off violations
  - Exclude carriers with active contractual remedy accepted by logistics leadership
impact:
  category: High
  expected_range:
    metric_kpi_id: supply.on_time.pct
    value_low: 1.0
    value_high: 4.0
    unit: pp
    time_to_effect:
      min_periods: 1
      max_periods: 3
  mechanism:
  - Formal SLA breach escalation improves carrier focus on service recovery
  - Weekly remedy cadence reduces repeat late-delivery patterns
  confidence:
    level: Medium
    rationale:
    - Impact depends on carrier leverage and data-backed discussions
    - Best effect where regional performance variance is transparent
operational_execution:
  stakeholders:
  - Logistics
  - Carrier Management
  prerequisites:
  - Carrier SLA baseline and region-level service tracking
  - Agreed remedy workflow with carriers
  steps:
  - IDENTIFY each carrier-region pair breaching on-time thresholds
  - ISSUE formal SLA breach escalation for this carrier-region pair
  - AGREE weekly remedy plan and service checkpoints for this carrier-region pair
  - REVIEW on-time recovery for this carrier-region pair weekly
  effort:
    level: Low
    typical_duration_days: 21
  risks_and_tradeoffs:
  - Escalations can damage carrier relationship if evidence is weak
  - Short-term expedites may raise cost while service is recovered
data_requirements:
  required_entities:
  - Carrier
  - Region
  semantic_dependencies:
    measures:
    - On-Time %
    - OTIF %
    - Penalty Amount
    - Shipments Count
    tables:
    - fact_fulfillment
    - fact_shipments
    - dim_carrier
    - dim_region
automation:
  detection:
    enabled: true
    evaluation_frequency: weekly
    output: Carrier-region pairs requiring escalation
  suggested_actions:
    enabled: true
    outputs:
    - SLA breach evidence pack
  copilot_prompts: []
tracking:
  execution_log:
    enabled: true
    recommended_storage: fact_action_execution
    minimum_fields:
    - ActionCode
    - Carrier
    - Region
    - TriggerLevel
    - ExecutedDate
  outcome_evaluation:
    enabled: true
    recommended_storage: fact_action_outcome
    minimum_fields:
    - ActionCode
    - Pre_OnTime_Pct
    - Post_OnTime_Pct_21d
governance:
  approvals_required:
  - Head of Logistics
  rollback_plan:
  - De-escalate if on-time performance remains stable above threshold for one cycle
  documentation_links:
  - core/usecases/industry/logistics/SCM-IND-L001_Last_Mile_Delivery_Performance/Business_Factsheet.md
quality_rules:
- All kpi_id values must exist in KPI catalog.
- Trigger severity must be strictly increasing from L1 to L3.
- impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis.
- If status=deprecated then lifecycle.replaced_by is required.
- 'No free-text trigger notes: use gating_rules and structured filters.'