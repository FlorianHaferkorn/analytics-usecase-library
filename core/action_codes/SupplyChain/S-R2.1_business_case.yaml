confidence: medium
evidence_source_url: "https://www.gartner.com/en/supply-chain/insights/on-time-in-full"
owner: Chief Supply Chain Officer / Head of Logistics
assumptions:
  - "Baseline OTIF 84%; retailer penalty cost 500-800k EUR/year at current OTIF level."
  - "Each 1 pp OTIF improvement reduces penalty exposure by 50-80k EUR; expedite costs by 30k EUR."
