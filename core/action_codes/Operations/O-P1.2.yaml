schema_version: '2.0'
id: O-P1.2
name: Line Rebalancing
owner_domain: Operations / Manufacturing Leadership
impact_dimension: Throughput Efficiency
status: active
owner_role: production_manager
steward_role: operations_bi_lead
use_case_links:
  core_use_cases: []
  related_use_cases:
  - OPS-IND-M001
kpis:
  trigger_kpis:
  - ops.performance.pct
  - ops.throughput.units
  guardrail_kpis:
  - ops.availability.pct
  outcome_kpis:
  - ops.performance.pct
  - ops.oee.pct
scope:
  default_grain: plant_line_shift_month
  default_perspective:
  - Plant
  - Line
  supported_slices:
  - Shift
  - Product Family
  exclusions:
  - New product ramp-ups without stable standard rate
  - Lines under engineering trial or major changeover redesign
  - Lines constrained primarily by upstream material shortages
trigger:
  type: Deviation
  evaluation:
    grain: plant_line_shift_month
    window:
      kind: rolling
      length: 2
      unit: periods
    persistence:
      required: true
      min_consecutive_periods: 2
    minimum_data:
      min_observations: 1
      volume_guardrail:
        enabled: true
        metric_kpi_id: ops.throughput.units
        comparator: gte
        value: 1000
        unit: units
  levels:
    L1:
      severity: EarlyWarning
      condition:
        metric_kpi_id: ops.performance.pct
        comparator: lt
        threshold:
          basis: absolute
          value: 90.0
          unit: '%'
        filters: []
    L2:
      severity: RequiredIntervention
      condition:
        metric_kpi_id: ops.performance.pct
        comparator: lt
        threshold:
          basis: absolute
          value: 86.0
          unit: '%'
        filters: []
    L3:
      severity: PrescriptiveExecution
      condition:
        metric_kpi_id: ops.performance.pct
        comparator: lt
        threshold:
          basis: absolute
          value: 82.0
          unit: '%'
        filters: []
  gating_rules:
  - Trigger only if performance loss persists after downtime normalization
  - Do not trigger if quality loss is the primary OEE issue
  - Exclude lines already under active balancing experiment
impact:
  category: Medium
  expected_range:
    metric_kpi_id: ops.performance.pct
    value_low: 2.0
    value_high: 5.0
    unit: pp
    time_to_effect:
      min_periods: 1
      max_periods: 2
  mechanism:
  - Better station balance reduces micro-stops and idle losses
  - Improves pace adherence against standard cycle targets
  confidence:
    level: Medium
    rationale:
    - Impact depends on standard time quality and supervisor follow-through
    - Most effective where imbalance is structural rather than transient
operational_execution:
  stakeholders:
  - Production
  - Industrial Engineering
  prerequisites:
  - Stable standard cycle times and shift-level throughput visibility
  - Line balancing ownership agreed between production and engineering
  steps:
  - IDENTIFY each line-shift combination with persistent performance loss
  - ANALYSE bottleneck stations and cycle imbalance for this line-shift combination
  - REBALANCE workload and staffing for this line-shift combination
  - REVIEW performance recovery for this line-shift combination monthly
  effort:
    level: Medium
    typical_duration_days: 30
  risks_and_tradeoffs:
  - Rebalancing can temporarily reduce throughput while teams adapt
  - Local bottleneck fixes can shift constraint downstream if not system-wide
data_requirements:
  required_entities:
  - Plant
  - Line
  - Shift
  semantic_dependencies:
    measures:
    - Performance %
    - Throughput Units
    - Availability %
    - OEE %
    tables:
    - fact_ops_runtime
    - fact_ops_output
    - dim_plant
    - dim_line
automation:
  detection:
    enabled: true
    evaluation_frequency: monthly
    output: Line-shift combinations requiring balancing
  suggested_actions:
    enabled: true
    outputs:
    - Bottleneck and balancing recommendation set
  copilot_prompts: []
tracking:
  execution_log:
    enabled: true
    recommended_storage: fact_action_execution
    minimum_fields:
    - ActionCode
    - Plant
    - Line
    - Shift
    - TriggerLevel
    - ExecutedDate
  outcome_evaluation:
    enabled: true
    recommended_storage: fact_action_outcome
    minimum_fields:
    - ActionCode
    - Pre_Performance_Pct
    - Post_Performance_Pct_30d
governance:
  approvals_required:
  - Plant Manager
  - Head of Industrial Engineering
  rollback_plan:
  - Revert staffing or cycle changes if quality or safety degrades
  documentation_links:
  - core/usecases/industry/manufacturing/OPS-IND-M001_Shift_OEE_Benchmarking/Business_Factsheet.md
quality_rules:
- All kpi_id values must exist in KPI catalog.
- Trigger severity must be strictly increasing from L1 to L3.
- impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis.
- If status=deprecated then lifecycle.replaced_by is required.
- 'No free-text trigger notes: use gating_rules and structured filters.'