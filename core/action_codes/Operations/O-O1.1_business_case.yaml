impact_range_eur_max: 4000000
time_to_effect_days: 60
confidence: high
evidence_source_url: "https://www.leanproduction.com/oee/"
owner: Plant Manager / Maintenance Manager
assumptions:
  - "Production value 50M EUR/year per plant; 1 pp OEE availability gain recovers approx. 500k EUR in output value."
  - "Impact formula: Availability_pp_gain x Hourly_Production_Value x Operating_Hours; 3-8 pp gain range per action code."
  - "Chronic downtime typically concentrated in 3-5 recurring failure categories; targeted root-cause elimination applied."
  - "Corrective maintenance lead time 30-60 days; short-term disruption during work modeled into min range."
  - "Lines under planned shutdown, pilot or approved changeover excluded; force majeure events excluded."
