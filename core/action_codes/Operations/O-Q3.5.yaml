schema_version: '2.0'
id: O-Q3.5
name: Complaint-Driven Stabilisation
owner_domain: Quality / Operations Excellence
impact_dimension: Customer Impact
status: active
owner_role: quality_manager
steward_role: operations_bi_lead
use_case_links:
  core_use_cases:
  - OPS-003
  related_use_cases:
  - XD-001
kpis:
  trigger_kpis:
  - KPI-QUA-004
  guardrail_kpis:
  - KPI-QUA-001
  outcome_kpis:
  - KPI-QUA-004
scope:
  default_grain: product_month
  default_perspective:
  - Plant
  - Product
  supported_slices:
  - Complaint Category
  - Defect Type
  exclusions:
  - Isolated customer misuse cases
  - Complaints linked to logistics or delivery issues
  - Products in early market launch phase
trigger:
  type: Deviation
  evaluation:
    grain: product_month
    window:
      kind: rolling
      length: 2
      unit: periods
    persistence:
      required: true
      min_consecutive_periods: 2
    minimum_data:
      min_observations: 5
      volume_guardrail:
        enabled: true
        metric_kpi_id: KPI-COM-012
        comparator: gte
        value: 10000
        unit: units
  levels:
    L1:
      severity: EarlyWarning
      condition:
        metric_kpi_id: KPI-QUA-004
        comparator: gt
        threshold:
          basis: absolute
          value: 0.3
          unit: '%'
        filters: []
    L2:
      severity: RequiredIntervention
      condition:
        metric_kpi_id: KPI-QUA-004
        comparator: gt
        threshold:
          basis: absolute
          value: 0.6
          unit: '%'
        filters: []
    L3:
      severity: PrescriptiveExecution
      condition:
        metric_kpi_id: KPI-QUA-004
        comparator: gt
        threshold:
          basis: absolute
          value: 1.0
          unit: '%'
        filters: []
  gating_rules:
  - Trigger only if complaint trend is structurally increasing
  - Do not trigger if complaints are driven by distribution or service issues
  - Exclude products with active recall or field action programs
impact_valuation:
  method: RiskAvoidance
  currency: EUR
  success_window:
    duration: P90D
    metric_kpi_id: KPI-QUA-004
    success_criteria:
      kind: return_to_baseline
      baseline_window: P90D
  calculation_logic:
    standardized: "RealizedEUR = Avoided_Complaints * Avg_Complaint_Resolution_Cost"
  required_measures:
  - Complaint Rate %
  - Complaint Count
  - Resolution Cost
  - Action Execution Count
  attribution:
    method: before_after
impact:
  category: High
  expected_range:
    metric_kpi_id: KPI-QUA-004
    value_low: -20.0
    value_high: -50.0
    unit: '%'
    time_to_effect:
      min_periods: 1
      max_periods: 4
  mechanism:
  - Rapid stabilisation of externally visible defect drivers
  - Containment and corrective action at source
  confidence:
    level: Medium
    rationale:
    - Complaint signals are strong but lagging
    - Impact depends on root-cause clarity
operational_execution:
  stakeholders:
  - Operations Excellence
  - Production
  - Customer Quality
  prerequisites:
  - Complaint-to-process mapping
  - Timely complaint classification
  steps:
  - IDENTIFY products with rising complaint rates in this plant-product scope
  - MAP complaints to production defects and processes in this plant-product scope
  - EXECUTE stabilisation and containment actions in this plant-product scope
  - MONITOR complaint trend for this plant-product scope monthly
  effort:
    level: Medium
    typical_duration_days: 90
  risks_and_tradeoffs:
  - Overreaction to noisy complaint signals
  - Misattribution of root cause to production
data_requirements:
  required_entities:
  - Product
  - Plant
  semantic_dependencies:
    measures:
    - Complaint Rate %
    - First Pass Yield %
    - Sales Units
    tables:
    - fact_complaints
    - fact_quality
    - fact_shipments
    - dim_product
    - dim_org
automation:
  detection:
    enabled: true
    evaluation_frequency: monthly
    output: Products with sustained complaint increases
  suggested_actions:
    enabled: true
    outputs:
    - Complaint-driven stabilisation actions
  copilot_prompts: []
tracking:
  execution_log:
    enabled: true
    recommended_storage: fact_action_execution
    minimum_fields:
    - ActionCode
    - Product
    - Plant
    - TriggerLevel
    - ExecutedDate
  outcome_evaluation:
    enabled: true
    recommended_storage: fact_action_outcome
    minimum_fields:
    - ActionCode
    - Pre_Complaint_Pct
    - Post_Complaint_Pct_120d
governance:
  approvals_required:
  - Head of Quality
  rollback_plan:
  - Suspend stabilisation if FPY or throughput deteriorates materially
  documentation_links:
  - core/usecases/core/OPS-003_Quality_Yield/Business_Factsheet.md
parameters:
- name: period
  type: period
  required: true
  grain: product_month
  source_field: scope.default_grain
- name: trigger_level
  type: trigger_level
  required: true
  allowed_values:
  - L1
  - L2
  - L3
  source_field: trigger.levels
- name: plant
  label: Plant
  type: dimension_member
  required: true
  binding: nicht_belegt
  source_field: scope.default_perspective
- name: product
  label: Product
  type: dimension_member
  required: true
  binding: nicht_belegt
  source_field: scope.default_perspective
- name: complaint_category
  label: Complaint Category
  type: dimension_member
  required: false
  binding: nicht_belegt
  source_field: scope.supported_slices
- name: defect_type
  label: Defect Type
  type: dimension_member
  required: false
  binding: nicht_belegt
  source_field: scope.supported_slices
preconditions:
  combine: guardrails_all_and_trigger_any
  checks:
  - id: level_l1
    role: trigger
    kind: kpi_level
    ref: trigger.levels.L1.condition
    kpi_id: KPI-QUA-004
    pruefbar: true
  - id: level_l2
    role: trigger
    kind: kpi_level
    ref: trigger.levels.L2.condition
    kpi_id: KPI-QUA-004
    pruefbar: true
  - id: level_l3
    role: trigger
    kind: kpi_level
    ref: trigger.levels.L3.condition
    kpi_id: KPI-QUA-004
    pruefbar: true
  - id: volume_guardrail
    role: guardrail
    kind: volume_guardrail
    ref: trigger.evaluation.minimum_data.volume_guardrail
    kpi_id: KPI-COM-012
    pruefbar: true
permitted_role:
  source_field: governance.approvals_required
  roles:
  - approver: Head of Quality
    role_id: head_of_quality
review:
  required: true
  state: vorgeschlagen
quality_rules:
- All kpi_id values must exist in KPI catalog.
- Trigger severity must be strictly increasing from L1 to L3.
- impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis.
- If status=deprecated then lifecycle.replaced_by is required.
- 'No free-text trigger notes: use gating_rules and structured filters.'
