schema_version: '2.0'
id: O-Q3.1
name: Quality & Yield Orchestration
owner_domain: Quality / Operations Leadership
impact_dimension: Effectiveness
status: active
owner_role: head_of_quality
steward_role: operations_bi_lead
use_case_links:
  core_use_cases:
  - OPS-003
  related_use_cases:
  - OPS-001
  - OPS-002
kpis:
  trigger_kpis:
  - quality.fpy.pct
  - quality.scrap.pct
  guardrail_kpis:
  - ops.throughput.units
  outcome_kpis:
  - quality.fpy.pct
scope:
  default_grain: line_month
  default_perspective:
  - Plant
  - Production Line
  supported_slices:
  - Defect Category
  exclusions:
  - Lines under approved engineering trials
  - Quality deviations fully explained by supplier defects
  - Low-volume prototype production
trigger:
  type: Deviation
  evaluation:
    grain: line_month
    window:
      kind: rolling
      length: 2
      unit: periods
    persistence:
      required: true
      min_consecutive_periods: 2
    minimum_data:
      min_observations: 1
      volume_guardrail:
        enabled: true
        metric_kpi_id: ops.planned_output.units
        comparator: gte
        value: 20000
        unit: units
  levels:
    L1:
      severity: EarlyWarning
      condition:
        metric_kpi_id: quality.fpy.pct
        comparator: lt
        threshold:
          basis: absolute
          value: 98.0
          unit: '%'
        filters: []
    L2:
      severity: RequiredIntervention
      condition:
        metric_kpi_id: quality.fpy.pct
        comparator: lt
        threshold:
          basis: absolute
          value: 96.0
          unit: '%'
        filters: []
    L3:
      severity: PrescriptiveExecution
      condition:
        metric_kpi_id: quality.fpy.pct
        comparator: lt
        threshold:
          basis: absolute
          value: 94.0
          unit: '%'
        filters: []
  gating_rules:
  - Trigger only if throughput impact remains within tolerance
  - Do not trigger if quality loss is driven by temporary ramp-up
  - Exclude lines with active execution Action Codes already in progress
impact_valuation:
  method: CostAvoidance
  currency: EUR
  success_window:
    duration: P30D
    metric_kpi_id: quality.fpy.pct
    success_criteria:
      kind: return_to_baseline
      baseline_window: P60D
  calculation_logic:
    standardized: "RealizedEUR = (Post_FPY - Pre_FPY) * Total_Output * Unit_Cost"
  required_measures:
  - First Pass Yield %
  - Total Output
  - Unit Cost
  - Action Execution Count
  attribution:
    method: before_after
impact:
  category: High
  expected_range:
    metric_kpi_id: quality.fpy.pct
    value_low: 1.0
    value_high: 3.0
    unit: pp
    time_to_effect:
      min_periods: 1
      max_periods: 3
  mechanism:
  - Focused activation of dominant quality improvement lever
  - Avoidance of conflicting quality initiatives
  confidence:
    level: High
    rationale:
    - FPY is sensitive to targeted defect reduction
    - Central coordination improves execution quality
operational_execution:
  stakeholders:
  - Plant Manager
  - Production Supervisors
  prerequisites:
  - Consistent FPY and defect measurement
  - Clear ownership of execution Action Codes
  steps:
  - DETECT sustained FPY deterioration on this production line
  - DIAGNOSE the dominant quality loss driver for this line
  - ACTIVATE the corresponding execution Action Code for this line
  - REVIEW FPY recovery for this line monthly
  effort:
    level: Low
    typical_duration_days: 30
  risks_and_tradeoffs:
  - Delayed execution if diagnosis is incorrect
  - Underreaction to multi-cause quality issues
data_requirements:
  required_entities:
  - Plant
  - Production Line
  semantic_dependencies:
    measures:
    - First Pass Yield %
    - Scrap %
    - Rework %
    - Throughput Units
    tables:
    - fact_quality
    - fact_ops
    - dim_org
automation:
  detection:
    enabled: true
    evaluation_frequency: monthly
    output: Lines with sustained FPY deterioration
  suggested_actions:
    enabled: true
    outputs:
    - Recommended quality lever activation
  copilot_prompts: []
tracking:
  execution_log:
    enabled: true
    recommended_storage: fact_action_execution
    minimum_fields:
    - ActionCode
    - Plant
    - ProductionLine
    - TriggerLevel
    - ActivatedLever
    - ExecutedDate
  outcome_evaluation:
    enabled: true
    recommended_storage: fact_action_outcome
    minimum_fields:
    - ActionCode
    - Pre_FPY_Pct
    - Post_FPY_Pct_60d
governance:
  approvals_required:
  - COO
  rollback_plan:
  - Suspend orchestration if execution actions conflict or stall
  documentation_links:
  - core/usecases/core/OPS-003_Quality_Yield/Business_Factsheet.md
quality_rules:
- All kpi_id values must exist in KPI catalog.
- Trigger severity must be strictly increasing from L1 to L3.
- impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis.
- If status=deprecated then lifecycle.replaced_by is required.
- 'No free-text trigger notes: use gating_rules and structured filters.'
