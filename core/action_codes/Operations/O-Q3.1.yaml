schema_version: "1.1"

id: "O-Q3.1"
name: "Quality & Yield Orchestration"
owner_domain: "Quality / Operations Leadership"
impact_dimension: "Effectiveness"

status: "active"
lifecycle:
  introduced_date: "2025-12-18"
  deprecated_date: null
  replaced_by: null
  change_notes: []

category:
  group: "Quality Governance"
  theme: "Coordinate Quality and Yield Improvement Actions"

tags: ["quality", "yield", "orchestration"]

strategic_alignment:
  strategic_kpis:
    - id: "quality.fpy.pct"
      role: "primary"
    - id: "quality.scrap.pct"
      role: "secondary"
    - id: "quality.rework.pct"
      role: "secondary"
  decisions_enabled:
    - "Select dominant quality lever (defects, scrap, rework, COPQ, complaints)"
    - "Sequence quality actions to avoid parallel disruption"
  non_goals:
    - "Executing quality actions directly"
    - "Supplier quality programs"
    - "Predictive or AI-driven quality models"

use_case_links:
  core_use_cases:
    - "OPS-003"
  related_use_cases:
    - "OPS-001"
    - "OPS-002"

kpis:
  trigger_kpis:
    - kpi_id: "quality.fpy.pct"
      label: "First Pass Yield %"
      semantic_ref:
        model_domain: "Quality"
        measure: "First Pass Yield %"
    - kpi_id: "quality.scrap.pct"
      label: "Scrap %"
      semantic_ref:
        model_domain: "Quality"
        measure: "Scrap %"
  guardrail_kpis:
    - kpi_id: "ops.throughput.units"
      label: "Throughput Units"
      semantic_ref:
        model_domain: "Operations"
        measure: "Throughput Units"
  outcome_kpis:
    - kpi_id: "quality.fpy.pct"
      label: "First Pass Yield %"
      semantic_ref:
        model_domain: "Quality"
        measure: "First Pass Yield %"

scope:
  default_grain: "line_month"
  default_perspective: ["Plant", "Production Line"]
  supported_slices:
    - "Defect Category"
  exclusions:
    - "Lines under approved engineering trials"
    - "Quality deviations fully explained by supplier defects"
    - "Low-volume prototype production"

trigger:
  type: "Deviation"
  evaluation:
    grain: "line_month"
    window:
      kind: "rolling"
      length: 2
      unit: "periods"
    persistence:
      required: true
      min_consecutive_periods: 2
    minimum_data:
      min_observations: 1
      volume_guardrail:
        enabled: true
        metric_kpi_id: "ops.planned_output.units"
        comparator: "gte"
        value: 20000
        unit: "units"
  levels:
    L1:
      severity: "EarlyWarning"
      condition:
        metric_kpi_id: "quality.fpy.pct"
        comparator: "lt"
        threshold:
          basis: "absolute"
          value: 98.0
          unit: "%"
        filters: []
    L2:
      severity: "RequiredIntervention"
      condition:
        metric_kpi_id: "quality.fpy.pct"
        comparator: "lt"
        threshold:
          basis: "absolute"
          value: 96.0
          unit: "%"
        filters: []
    L3:
      severity: "PrescriptiveExecution"
      condition:
        metric_kpi_id: "quality.fpy.pct"
        comparator: "lt"
        threshold:
          basis: "absolute"
          value: 94.0
          unit: "%"
        filters: []
  gating_rules:
    - "Trigger only if throughput impact remains within tolerance"
    - "Do not trigger if quality loss is driven by temporary ramp-up"
    - "Exclude lines with active execution Action Codes already in progress"

impact:
  category: "High"
  expected_range:
    metric_kpi_id: "quality.fpy.pct"
    value_low: 1.0
    value_high: 3.0
    unit: "pp"
    time_to_effect:
      min_periods: 1
      max_periods: 3
  mechanism:
    - "Focused activation of dominant quality improvement lever"
    - "Avoidance of conflicting quality initiatives"
  confidence:
    level: "High"
    rationale:
      - "FPY is sensitive to targeted defect reduction"
      - "Central coordination improves execution quality"

operational_execution:
  primary_owner_role: "Head of Quality"
  stakeholders:
    - "Plant Manager"
    - "Production Supervisors"
  prerequisites:
    - "Consistent FPY and defect measurement"
    - "Clear ownership of execution Action Codes"
  steps:
    - "Detect sustained FPY deterioration"
    - "Diagnose dominant quality loss driver"
    - "Activate corresponding execution Action Code"
    - "Review FPY recovery monthly"
  effort:
    level: "Low"
    typical_duration_days: 30
  risks_and_tradeoffs:
    - "Delayed execution if diagnosis is incorrect"
    - "Underreaction to multi-cause quality issues"

data_requirements:
  required_entities:
    - "Plant"
    - "Production Line"
  semantic_dependencies:
    measures:
      - "First Pass Yield %"
      - "Scrap %"
      - "Rework %"
      - "Throughput Units"
    tables:
      - "fact_quality"
      - "fact_ops_output"
      - "dim_production_line"
      - "dim_plant"

automation:
  detection:
    enabled: true
    evaluation_frequency: "monthly"
    output: "Lines with sustained FPY deterioration"
  suggested_actions:
    enabled: true
    outputs:
      - "Recommended quality lever activation"
  copilot_prompts: []

tracking:
  execution_log:
    enabled: true
    recommended_storage: "fact_action_execution"
    minimum_fields:
      - "ActionCode"
      - "Plant"
      - "ProductionLine"
      - "TriggerLevel"
      - "ActivatedLever"
      - "ExecutedDate"
  outcome_evaluation:
    enabled: true
    recommended_storage: "fact_action_outcome"
    minimum_fields:
      - "ActionCode"
      - "Pre_FPY_Pct"
      - "Post_FPY_Pct_60d"

governance:
  approvals_required:
    - "COO"
  rollback_plan:
    - "Suspend orchestration if execution actions conflict or stall"
  documentation_links:
    - "framework/usecases/core/OPS-003_Quality_Yield/Business_Factsheet.md"

quality_rules:
  - "All kpi_id values must exist in KPI catalog."
  - "Trigger severity must be strictly increasing from L1 to L3."
  - "impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis."
  - "If status=deprecated then lifecycle.replaced_by is required."
  - "No free-text trigger notes: use gating_rules and structured filters."
