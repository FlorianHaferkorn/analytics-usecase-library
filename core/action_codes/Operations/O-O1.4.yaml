schema_version: '2.0'
id: O-O1.4
name: Throughput Constraint Resolution
owner_domain: Operations Leadership
impact_dimension: Output
status: active
owner_role: operations_director
steward_role: operations_bi_lead
use_case_links:
  core_use_cases:
  - OPS-001
  related_use_cases:
  - FIN-002
kpis:
  trigger_kpis:
  - ops.throughput.units
  guardrail_kpis:
  - ops.oee.pct
  outcome_kpis:
  - ops.throughput.units
scope:
  default_grain: plant_month
  default_perspective:
  - Plant
  supported_slices:
  - Production Line
  - Shift
  exclusions:
  - Plants under planned capacity expansion
  - One-off demand shocks approved by S&OP
  - Throughput loss fully explained by availability, performance, or quality actions
    already active
trigger:
  type: Deviation
  evaluation:
    grain: plant_month
    window:
      kind: rolling
      length: 2
      unit: periods
    persistence:
      required: true
      min_consecutive_periods: 2
    minimum_data:
      min_observations: 1
      volume_guardrail:
        enabled: true
        metric_kpi_id: ops.planned_output.units
        comparator: gte
        value: 50000
        unit: units
  levels:
    L1:
      severity: EarlyWarning
      condition:
        metric_kpi_id: ops.throughput.units
        comparator: lt
        threshold:
          basis: relative
          value: 0.05
          unit: '%'
        filters: []
    L2:
      severity: RequiredIntervention
      condition:
        metric_kpi_id: ops.throughput.units
        comparator: lt
        threshold:
          basis: relative
          value: 0.1
          unit: '%'
        filters: []
    L3:
      severity: PrescriptiveExecution
      condition:
        metric_kpi_id: ops.throughput.units
        comparator: lt
        threshold:
          basis: relative
          value: 0.15
          unit: '%'
        filters: []
  gating_rules:
  - Trigger only if OEE components are within acceptable range
  - Do not trigger if throughput miss is demand-driven
  - Exclude plants with active stabilization or recovery actions dominating output
impact_valuation:
  method: CostAvoidance
  currency: EUR
  success_window:
    duration: P14D
    metric_kpi_id: ops.quality.pct
    success_criteria:
      kind: return_to_baseline
      baseline_window: P28D
  calculation_logic:
    standardized: "RealizedEUR = (Post_Quality_Pct - Pre_Quality_Pct) * Total_Output * Unit_Cost"
  required_measures:
  - Quality %
  - Total Output
  - Unit Cost
  - Action Execution Count
  attribution:
    method: before_after
impact:
  category: High
  expected_range:
    metric_kpi_id: ops.throughput.units
    value_low: 3.0
    value_high: 10.0
    unit: '%'
    time_to_effect:
      min_periods: 1
      max_periods: 3
  mechanism:
  - Constraint identification and focused resolution
  - Better coordination of line-level actions
  confidence:
    level: Medium
    rationale:
    - Depends on clarity of dominant constraint
    - Coordination lever rather than direct execution
operational_execution:
  stakeholders:
  - Plant Managers
  - Production Planning
  - Ops Excellence
  prerequisites:
  - Reliable throughput vs plan tracking
  - Clear ownership of line-level actions
  steps:
  - IDENTIFY each production line missing throughput plan
  - DIAGNOSE the dominant constraint (availability, performance, quality, mix, staffing)
    for this line
  - ACTIVATE or REPRIORITISE relevant execution Action Codes for this line
  - REVIEW throughput recovery for this line bi-weekly
  effort:
    level: Low
    typical_duration_days: 30
  risks_and_tradeoffs:
  - Misidentification of true bottleneck
  - Over-coordination delaying execution
data_requirements:
  required_entities:
  - Plant
  semantic_dependencies:
    measures:
    - Throughput Units
    - OEE %
    - Planned Output Units
    tables:
    - fact_ops_output
    - fact_ops_runtime
    - dim_plant
automation:
  detection:
    enabled: true
    evaluation_frequency: monthly
    output: Plants with sustained throughput shortfall
  suggested_actions:
    enabled: true
    outputs:
    - Constraint diagnosis and action prioritization
  copilot_prompts: []
tracking:
  execution_log:
    enabled: true
    recommended_storage: fact_action_execution
    minimum_fields:
    - ActionCode
    - Plant
    - TriggerLevel
    - ActivatedConstraint
    - ExecutedDate
  outcome_evaluation:
    enabled: true
    recommended_storage: fact_action_outcome
    minimum_fields:
    - ActionCode
    - Pre_Throughput_Units
    - Post_Throughput_Units_60d
governance:
  approvals_required:
  - COO
  rollback_plan:
  - Suspend coordination if execution actions stall without impact
  documentation_links:
  - core/usecases/core/OPS-001_Operations_Performance/Business_Factsheet.md
quality_rules:
- All kpi_id values must exist in KPI catalog.
- Trigger severity must be strictly increasing from L1 to L3.
- impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis.
- If status=deprecated then lifecycle.replaced_by is required.
- 'No free-text trigger notes: use gating_rules and structured filters.'
