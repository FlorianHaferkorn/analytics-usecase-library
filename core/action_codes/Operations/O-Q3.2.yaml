schema_version: "1.1"

id: "O-Q3.2"
name: "Process Defect Elimination"
owner_domain: "Quality / Production"
impact_dimension: "Effectiveness"

status: "active"
lifecycle:
  introduced_date: "2025-12-18"
  deprecated_date: null
  replaced_by: null
  change_notes: []

category:
  group: "Defect Control"
  theme: "Eliminate Dominant Process Defects"

tags: ["defects", "root-cause", "fpy"]

strategic_alignment:
  strategic_kpis:
    - id: "quality.defect_density"
      role: "primary"
    - id: "quality.fpy.pct"
      role: "secondary"
  decisions_enabled:
    - "Prioritise dominant defect categories by frequency and impact"
    - "Execute focused root-cause elimination on critical process steps"
  non_goals:
    - "Supplier defect programs"
    - "Product redesign or specification changes"
    - "Predictive or AI-based quality models"

use_case_links:
  core_use_cases:
    - "OPS-003"
  related_use_cases:
    - "OPS-001"
    - "OPS-002"

kpis:
  trigger_kpis:
    - kpi_id: "quality.defect_density"
      label: "Defect Density"
      semantic_ref:
        model_domain: "Quality"
        measure: "Defect Density"
  guardrail_kpis:
    - kpi_id: "ops.availability.pct"
      label: "Availability %"
      semantic_ref:
        model_domain: "Operations"
        measure: "Availability %"
  outcome_kpis:
    - kpi_id: "quality.defect_density"
      label: "Defect Density"
      semantic_ref:
        model_domain: "Quality"
        measure: "Defect Density"
    - kpi_id: "quality.fpy.pct"
      label: "First Pass Yield %"
      semantic_ref:
        model_domain: "Quality"
        measure: "First Pass Yield %"

scope:
  default_grain: "line_month"
  default_perspective: ["Plant", "Production Line"]
  supported_slices:
    - "Defect Category"
    - "Process Step"
  exclusions:
    - "Defects caused by supplier material issues"
    - "One-off defects during approved ramp-up phases"
    - "Low-volume pilot production"

trigger:
  type: "Deviation"
  evaluation:
    grain: "line_month"
    window:
      kind: "rolling"
      length: 2
      unit: "periods"
    persistence:
      required: true
      min_consecutive_periods: 2
    minimum_data:
      min_observations: 1
      volume_guardrail:
        enabled: true
        metric_kpi_id: "ops.planned_output.units"
        comparator: "gte"
        value: 15000
        unit: "units"
  levels:
    L1:
      severity: "EarlyWarning"
      condition:
        metric_kpi_id: "quality.defect_density"
        comparator: "gt"
        threshold:
          basis: "relative"
          value: 0.10
          unit: "%"
        filters: []
    L2:
      severity: "RequiredIntervention"
      condition:
        metric_kpi_id: "quality.defect_density"
        comparator: "gt"
        threshold:
          basis: "relative"
          value: 0.25
          unit: "%"
        filters: []
    L3:
      severity: "PrescriptiveExecution"
      condition:
        metric_kpi_id: "quality.defect_density"
        comparator: "gt"
        threshold:
          basis: "relative"
          value: 0.40
          unit: "%"
        filters: []
  gating_rules:
    - "Trigger only if defect concentration exceeds Pareto threshold"
    - "Do not trigger if defects are dominated by external material causes"
    - "Exclude lines with active scrap or rework reduction actions"

impact:
  category: "High"
  expected_range:
    metric_kpi_id: "quality.defect_density"
    value_low: -20.0
    value_high: -50.0
    unit: "%"
    time_to_effect:
      min_periods: 1
      max_periods: 3
  mechanism:
    - "Root-cause elimination of dominant process defects"
    - "Stabilisation of critical process parameters"
  confidence:
    level: "High"
    rationale:
      - "Defects are typically concentrated in few causes"
      - "Focused actions yield fast FPY improvement"

operational_execution:
  primary_owner_role: "Quality Engineer"
  stakeholders:
    - "Production Supervisors"
    - "Process Engineering"
  prerequisites:
    - "Consistent defect logging by category and step"
    - "RCA capability at line level"
  steps:
    - "Identify top defect categories and process steps"
    - "Perform root-cause analysis on dominant defects"
    - "Implement corrective and preventive actions"
    - "Monitor defect density weekly"
  effort:
    level: "Medium"
    typical_duration_days: 60
  risks_and_tradeoffs:
    - "Local optimisation shifting defects downstream"
    - "Temporary throughput impact during adjustments"

data_requirements:
  required_entities:
    - "Plant"
    - "Production Line"
    - "Process Step"
  semantic_dependencies:
    measures:
      - "Defect Density"
      - "First Pass Yield %"
      - "Availability %"
    tables:
      - "fact_quality"
      - "fact_ops_output"
      - "dim_production_line"
      - "dim_plant"

automation:
  detection:
    enabled: true
    evaluation_frequency: "monthly"
    output: "Lines with concentrated defect drivers"
  suggested_actions:
    enabled: true
    outputs:
      - "Defect category prioritisation and RCA actions"
  copilot_prompts: []

tracking:
  execution_log:
    enabled: true
    recommended_storage: "fact_action_execution"
    minimum_fields:
      - "ActionCode"
      - "Plant"
      - "ProductionLine"
      - "DefectCategory"
      - "TriggerLevel"
      - "ExecutedDate"
  outcome_evaluation:
    enabled: true
    recommended_storage: "fact_action_outcome"
    minimum_fields:
      - "ActionCode"
      - "Pre_Defect_Density"
      - "Post_Defect_Density_60d"

governance:
  approvals_required:
    - "Head of Quality"
  rollback_plan:
    - "Revert process changes if FPY deteriorates further"
  documentation_links:
    - "core/usecases/core/OPS-003_Quality_Yield/Business_Factsheet.md"

quality_rules:
  - "All kpi_id values must exist in KPI catalog."
  - "Trigger severity must be strictly increasing from L1 to L3."
  - "impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis."
  - "If status=deprecated then lifecycle.replaced_by is required."
  - "No free-text trigger notes: use gating_rules and structured filters."
