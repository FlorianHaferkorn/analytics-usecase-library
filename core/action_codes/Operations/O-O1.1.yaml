schema_version: '2.0'
id: O-O1.1
name: Operations Stabilisation
owner_domain: Operations Excellence / Maintenance
impact_dimension: Effectiveness
status: active
owner_role: maintenance_manager
steward_role: operations_bi_lead
use_case_links:
  core_use_cases:
  - OPS-001
  related_use_cases:
  - FIN-002
kpis:
  trigger_kpis:
  - ops.availability.pct
  - ops.downtime.pct
  guardrail_kpis:
  - ops.quality.pct
  outcome_kpis:
  - ops.availability.pct
  - ops.oee.pct
scope:
  default_grain: line_month
  default_perspective:
  - Plant
  - Production Line
  supported_slices:
  - Shift
  - Downtime Category
  exclusions:
  - Lines under planned shutdown or overhaul
  - Pilot or test lines
  - Downtime driven solely by approved changeovers
trigger:
  type: Deviation
  evaluation:
    grain: line_month
    window:
      kind: rolling
      length: 2
      unit: periods
    persistence:
      required: true
      min_consecutive_periods: 2
    minimum_data:
      min_observations: 1
      volume_guardrail:
        enabled: true
        metric_kpi_id: ops.planned.hours
        comparator: gte
        value: 200
        unit: hours
  levels:
    L1:
      severity: EarlyWarning
      condition:
        metric_kpi_id: ops.availability.pct
        comparator: lt
        threshold:
          basis: absolute
          value: 90.0
          unit: '%'
        filters: []
    L2:
      severity: RequiredIntervention
      condition:
        metric_kpi_id: ops.availability.pct
        comparator: lt
        threshold:
          basis: absolute
          value: 85.0
          unit: '%'
        filters: []
    L3:
      severity: PrescriptiveExecution
      condition:
        metric_kpi_id: ops.availability.pct
        comparator: lt
        threshold:
          basis: absolute
          value: 80.0
          unit: '%'
        filters: []
  gating_rules:
  - Trigger only if downtime is dominated by recurring failure categories
  - Do not trigger if availability loss is driven by approved changeovers
  - Exclude periods with force majeure events
impact_valuation:
  method: CostAvoidance
  currency: EUR
  success_window:
    duration: P14D
    metric_kpi_id: ops.performance.pct
    success_criteria:
      kind: return_to_baseline
      baseline_window: P28D
  calculation_logic:
    standardized: "RealizedEUR = (Post_Performance_Pct - Pre_Performance_Pct) * Hourly_Production_Value * Operating_Hours"
  required_measures:
  - Performance %
  - Production Value
  - Action Execution Count
  attribution:
    method: before_after
impact:
  category: High
  expected_range:
    metric_kpi_id: ops.availability.pct
    value_low: 3.0
    value_high: 8.0
    unit: pp
    time_to_effect:
      min_periods: 1
      max_periods: 3
  mechanism:
  - Removal of chronic downtime causes
  - Stabilisation of maintenance and operating routines
  confidence:
    level: High
    rationale:
    - Availability improvements have immediate OEE impact
    - Chronic downtime is typically concentrated in few causes
operational_execution:
  stakeholders:
  - Plant Manager
  - Production Supervisors
  prerequisites:
  - Reliable downtime categorisation
  - Clear ownership of maintenance actions
  steps:
  - IDENTIFY top recurring downtime categories on this production line
  - PRIORITISE chronic failure modes for this line
  - EXECUTE corrective maintenance and standardisation on this line
  - MONITOR availability recovery for this line weekly
  effort:
    level: Medium
    typical_duration_days: 60
  risks_and_tradeoffs:
  - Maintenance overload if too many causes tackled in parallel
  - Short-term disruption during corrective work
data_requirements:
  required_entities:
  - Plant
  - Production Line
  semantic_dependencies:
    measures:
    - Availability %
    - Downtime %
    - OEE %
    - Planned Runtime Hours
    tables:
    - fact_ops_runtime
    - fact_ops_downtime
    - dim_production_line
    - dim_plant
automation:
  detection:
    enabled: true
    evaluation_frequency: monthly
    output: Lines with chronic availability loss
  suggested_actions:
    enabled: true
    outputs:
    - Top downtime causes and stabilisation actions
  copilot_prompts: []
tracking:
  execution_log:
    enabled: true
    recommended_storage: fact_action_execution
    minimum_fields:
    - ActionCode
    - Plant
    - ProductionLine
    - TriggerLevel
    - ExecutedDate
  outcome_evaluation:
    enabled: true
    recommended_storage: fact_action_outcome
    minimum_fields:
    - ActionCode
    - Pre_Availability_Pct
    - Post_Availability_Pct_60d
governance:
  approvals_required:
  - Plant Manager
  rollback_plan:
  - Pause stabilisation actions if quality or safety KPIs deteriorate
  documentation_links:
  - core/usecases/core/OPS-001_Operations_Performance/Business_Factsheet.md
quality_rules:
- All kpi_id values must exist in KPI catalog.
- Trigger severity must be strictly increasing from L1 to L3.
- impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis.
- If status=deprecated then lifecycle.replaced_by is required.
- 'No free-text trigger notes: use gating_rules and structured filters.'
