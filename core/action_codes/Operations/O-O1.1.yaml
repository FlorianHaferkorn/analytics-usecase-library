schema_version: '2.0'
id: O-O1.1
name: Operations Stabilisation
owner_domain: Operations Excellence / Maintenance
impact_dimension: Effectiveness
status: active
owner_role: maintenance_manager
steward_role: operations_bi_lead
use_case_links:
  core_use_cases:
  - OPS-001
  related_use_cases:
  - FIN-002
kpis:
  trigger_kpis:
  - KPI-OPS-016
  - KPI-OPS-017
  guardrail_kpis:
  - KPI-OPS-003
  outcome_kpis:
  - KPI-OPS-016
  - KPI-OPS-011
scope:
  default_grain: line_month
  default_perspective:
  - Plant
  - Production Line
  supported_slices:
  - Shift
  - Downtime Category
  exclusions:
  - Lines under planned shutdown or overhaul
  - Pilot or test lines
  - Downtime driven solely by approved changeovers
trigger:
  type: Deviation
  evaluation:
    grain: line_month
    window:
      kind: rolling
      length: 2
      unit: periods
    persistence:
      required: true
      min_consecutive_periods: 2
    minimum_data:
      min_observations: 1
      volume_guardrail:
        enabled: true
        metric_kpi_id: KPI-SCM-019
        comparator: gte
        value: 200
        unit: hours
  levels:
    L1:
      severity: EarlyWarning
      condition:
        metric_kpi_id: KPI-OPS-016
        comparator: lt
        threshold:
          basis: absolute
          value: 90.0
          unit: '%'
        filters: []
    L2:
      severity: RequiredIntervention
      condition:
        metric_kpi_id: KPI-OPS-016
        comparator: lt
        threshold:
          basis: absolute
          value: 85.0
          unit: '%'
        filters: []
    L3:
      severity: PrescriptiveExecution
      condition:
        metric_kpi_id: KPI-OPS-016
        comparator: lt
        threshold:
          basis: absolute
          value: 80.0
          unit: '%'
        filters: []
  gating_rules:
  - Trigger only if downtime is dominated by recurring failure categories
  - Do not trigger if availability loss is driven by approved changeovers
  - Exclude periods with force majeure events
impact_valuation:
  method: CostAvoidance
  currency: EUR
  success_window:
    duration: P14D
    metric_kpi_id: KPI-OPS-002
    success_criteria:
      kind: return_to_baseline
      baseline_window: P28D
  calculation_logic:
    standardized: "RealizedEUR = (Post_Performance_Pct - Pre_Performance_Pct) * Hourly_Production_Value * Operating_Hours"
  required_measures:
  - Performance %
  - Production Value
  - Action Execution Count
  attribution:
    method: before_after
impact:
  category: High
  expected_range:
    metric_kpi_id: KPI-OPS-016
    value_low: 3.0
    value_high: 8.0
    unit: pp
    time_to_effect:
      min_periods: 1
      max_periods: 3
  mechanism:
  - Removal of chronic downtime causes
  - Stabilisation of maintenance and operating routines
  confidence:
    level: High
    rationale:
    - Availability improvements have immediate OEE impact
    - Chronic downtime is typically concentrated in few causes
operational_execution:
  stakeholders:
  - Plant Manager
  - Production Supervisors
  prerequisites:
  - Reliable downtime categorisation
  - Clear ownership of maintenance actions
  steps:
  - IDENTIFY top recurring downtime categories on this production line
  - PRIORITISE chronic failure modes for this line
  - EXECUTE corrective maintenance and standardisation on this line
  - MONITOR availability recovery for this line weekly
  effort:
    level: Medium
    typical_duration_days: 60
  risks_and_tradeoffs:
  - Maintenance overload if too many causes tackled in parallel
  - Short-term disruption during corrective work
data_requirements:
  required_entities:
  - Plant
  - Production Line
  semantic_dependencies:
    measures:
    - Availability %
    - Downtime %
    - OEE %
    - Planned Runtime Hours
    tables:
    - fact_ops
    - dim_org
automation:
  detection:
    enabled: true
    evaluation_frequency: monthly
    output: Lines with chronic availability loss
  suggested_actions:
    enabled: true
    outputs:
    - Top downtime causes and stabilisation actions
  copilot_prompts: []
tracking:
  execution_log:
    enabled: true
    recommended_storage: fact_action_execution
    minimum_fields:
    - ActionCode
    - Plant
    - ProductionLine
    - TriggerLevel
    - ExecutedDate
  outcome_evaluation:
    enabled: true
    recommended_storage: fact_action_outcome
    minimum_fields:
    - ActionCode
    - Pre_Availability_Pct
    - Post_Availability_Pct_60d
governance:
  approvals_required:
  - Plant Manager
  rollback_plan:
  - Pause stabilisation actions if quality or safety KPIs deteriorate
  documentation_links:
  - core/usecases/core/OPS-001_Operations_Performance/Business_Factsheet.md
parameters:
- name: period
  type: period
  required: true
  grain: line_month
  source_field: scope.default_grain
- name: trigger_level
  type: trigger_level
  required: true
  allowed_values:
  - L1
  - L2
  - L3
  source_field: trigger.levels
- name: plant
  label: Plant
  type: dimension_member
  required: true
  binding: dim_org.Plant
  source_field: scope.default_perspective
- name: production_line
  label: Production Line
  type: dimension_member
  required: true
  binding: dim_org.Line
  source_field: scope.default_perspective
- name: shift
  label: Shift
  type: dimension_member
  required: false
  binding: dim_org.Shift
  source_field: scope.supported_slices
- name: downtime_category
  label: Downtime Category
  type: dimension_member
  required: false
  binding: nicht_belegt
  source_field: scope.supported_slices
preconditions:
  combine: guardrails_all_and_trigger_any
  checks:
  - id: level_l1
    role: trigger
    kind: kpi_level
    ref: trigger.levels.L1.condition
    kpi_id: KPI-OPS-016
    pruefbar: true
  - id: level_l2
    role: trigger
    kind: kpi_level
    ref: trigger.levels.L2.condition
    kpi_id: KPI-OPS-016
    pruefbar: true
  - id: level_l3
    role: trigger
    kind: kpi_level
    ref: trigger.levels.L3.condition
    kpi_id: KPI-OPS-016
    pruefbar: true
  - id: volume_guardrail
    role: guardrail
    kind: volume_guardrail
    ref: trigger.evaluation.minimum_data.volume_guardrail
    kpi_id: KPI-SCM-019
    pruefbar: true
permitted_role:
  source_field: governance.approvals_required
  roles:
  - approver: Plant Manager
    role_id: plant_manager
review:
  required: true
  state: vorgeschlagen
quality_rules:
- All kpi_id values must exist in KPI catalog.
- Trigger severity must be strictly increasing from L1 to L3.
- impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis.
- If status=deprecated then lifecycle.replaced_by is required.
- 'No free-text trigger notes: use gating_rules and structured filters.'
