schema_version: "1.1"

id: "O-A2.2"
name: "Failure Reduction (MTBF Improvement)"
owner_domain: "Reliability Engineering / Maintenance"
impact_dimension: "Reliability"

status: "active"
lifecycle:
  introduced_date: "2025-12-18"
  deprecated_date: null
  replaced_by: null
  change_notes: []

category:
  group: "Failure Control"
  theme: "Reduce Failure Frequency and Improve MTBF"

tags: ["mtbf", "failures", "reliability"]

strategic_alignment:
  strategic_kpis:
    - id: "ops.mtbf.hours"
      role: "primary"
    - id: "ops.downtime.unplanned.pct"
      role: "secondary"
  decisions_enabled:
    - "Prioritise dominant failure modes for elimination"
    - "Stabilise asset operating conditions to prevent recurrence"
  non_goals:
    - "Predictive maintenance models or sensors"
    - "Major equipment redesign or replacement"
    - "Production scheduling optimisation"

use_case_links:
  core_use_cases:
    - "OPS-002"
  related_use_cases:
    - "OPS-001"

kpis:
  trigger_kpis:
    - kpi_id: "ops.mtbf.hours"
      label: "Mean Time Between Failures (Hours)"
      semantic_ref:
        model_domain: "Operations"
        measure: "MTBF (Hours)"
  guardrail_kpis:
    - kpi_id: "ops.pm_compliance.pct"
      label: "PM Compliance %"
      semantic_ref:
        model_domain: "Operations"
        measure: "PM Compliance %"
  outcome_kpis:
    - kpi_id: "ops.mtbf.hours"
      label: "Mean Time Between Failures (Hours)"
      semantic_ref:
        model_domain: "Operations"
        measure: "MTBF (Hours)"
    - kpi_id: "ops.availability.pct"
      label: "Availability %"
      semantic_ref:
        model_domain: "Operations"
        measure: "Availability %"

scope:
  default_grain: "asset_month"
  default_perspective: ["Plant", "Asset"]
  supported_slices:
    - "Failure Mode"
    - "Failure Category"
  exclusions:
    - "Assets with low utilisation (<30%)"
    - "Failures caused by operator misuse"
    - "Assets under warranty or supplier-led fixes"

trigger:
  type: "Deviation"
  evaluation:
    grain: "asset_month"
    window:
      kind: "rolling"
      length: 3
      unit: "periods"
    persistence:
      required: true
      min_consecutive_periods: 2
    minimum_data:
      min_observations: 2
      volume_guardrail:
        enabled: true
        metric_kpi_id: "ops.failure.count"
        comparator: "gte"
        value: 3
        unit: "count"
  levels:
    L1:
      severity: "EarlyWarning"
      condition:
        metric_kpi_id: "ops.mtbf.hours"
        comparator: "lt"
        threshold:
          basis: "relative"
          value: 0.10
          unit: "%"
        filters: []
    L2:
      severity: "RequiredIntervention"
      condition:
        metric_kpi_id: "ops.mtbf.hours"
        comparator: "lt"
        threshold:
          basis: "relative"
          value: 0.20
          unit: "%"
        filters: []
    L3:
      severity: "PrescriptiveExecution"
      condition:
        metric_kpi_id: "ops.mtbf.hours"
        comparator: "lt"
        threshold:
          basis: "relative"
          value: 0.30
          unit: "%"
        filters: []
  gating_rules:
    - "Trigger only if PM compliance is within acceptable range"
    - "Do not trigger if failures are dominated by external events"
    - "Exclude assets with active MTTR recovery actions"

impact:
  category: "Medium"
  expected_range:
    metric_kpi_id: "ops.mtbf.hours"
    value_low: 10.0
    value_high: 30.0
    unit: "%"
    time_to_effect:
      min_periods: 2
      max_periods: 6
  mechanism:
    - "Root-cause elimination of dominant failure modes"
    - "Improved maintenance and operating discipline"
  confidence:
    level: "Medium"
    rationale:
      - "Failure modes are often concentrated"
      - "Effectiveness depends on root-cause quality"

operational_execution:
  primary_owner_role: "Reliability Engineer"
  stakeholders:
    - "Maintenance Technicians"
    - "Operations Supervisors"
  prerequisites:
    - "Consistent failure logging and categorisation"
    - "Root-cause analysis capability (RCA)"
  steps:
    - "Identify assets with declining MTBF"
    - "Analyse dominant failure modes"
    - "Execute corrective and preventive actions"
    - "Monitor MTBF trend quarterly"
  effort:
    level: "Medium"
    typical_duration_days: 120
  risks_and_tradeoffs:
    - "Analysis paralysis delaying action"
    - "Partial fixes without systemic resolution"

data_requirements:
  required_entities:
    - "Asset"
    - "Plant"
  semantic_dependencies:
    measures:
      - "MTBF (Hours)"
      - "Availability %"
      - "PM Compliance %"
      - "Failure Count"
    tables:
      - "fact_ops_failures"
      - "fact_ops_runtime"
      - "fact_ops_maintenance"
      - "dim_asset"
      - "dim_plant"

automation:
  detection:
    enabled: true
    evaluation_frequency: "monthly"
    output: "Assets with declining MTBF and recurring failures"
  suggested_actions:
    enabled: true
    outputs:
      - "Failure mode prioritisation and RCA backlog"
  copilot_prompts: []

tracking:
  execution_log:
    enabled: true
    recommended_storage: "fact_action_execution"
    minimum_fields:
      - "ActionCode"
      - "Asset"
      - "Plant"
      - "TriggerLevel"
      - "FailureCategory"
      - "ExecutedDate"
  outcome_evaluation:
    enabled: true
    recommended_storage: "fact_action_outcome"
    minimum_fields:
      - "ActionCode"
      - "Pre_MTBF_Hours"
      - "Post_MTBF_Hours_180d"

governance:
  approvals_required:
    - "Maintenance Manager"
  rollback_plan:
    - "Pause RCA if corrective actions show no effect after review cycle"
  documentation_links:
    - "core/usecases/core/OPS-002_Asset_Performance/Business_Factsheet.md"

quality_rules:
  - "All kpi_id values must exist in KPI catalog."
  - "Trigger severity must be strictly increasing from L1 to L3."
  - "impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis."
  - "If status=deprecated then lifecycle.replaced_by is required."
  - "No free-text trigger notes: use gating_rules and structured filters."
