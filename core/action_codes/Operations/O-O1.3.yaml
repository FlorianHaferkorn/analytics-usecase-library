schema_version: '2.0'
id: O-O1.3
name: Quality & Yield Recovery
owner_domain: Quality / Production
impact_dimension: Effectiveness
status: active
owner_role: quality_manager
steward_role: quality_production_bi_lead
use_case_links:
  core_use_cases:
  - OPS-001
  related_use_cases:
  - OPS-003
kpis:
  trigger_kpis:
  - KPI-OPS-003
  guardrail_kpis:
  - KPI-OPS-016
  outcome_kpis:
  - KPI-OPS-003
  - KPI-OPS-011
scope:
  default_grain: line_month
  default_perspective:
  - Plant
  - Production Line
  supported_slices:
  - Defect Category
  - Product Variant
  exclusions:
  - Lines under product change trials
  - Low-volume prototype runs
  - Quality losses driven by supplier defects
trigger:
  type: Deviation
  evaluation:
    grain: line_month
    window:
      kind: rolling
      length: 2
      unit: periods
    persistence:
      required: true
      min_consecutive_periods: 2
    minimum_data:
      min_observations: 1
      volume_guardrail:
        enabled: true
        metric_kpi_id: KPI-SCM-019
        comparator: gte
        value: 150
        unit: hours
  levels:
    L1:
      severity: EarlyWarning
      condition:
        metric_kpi_id: KPI-OPS-003
        comparator: lt
        threshold:
          basis: absolute
          value: 98.0
          unit: '%'
        filters: []
    L2:
      severity: RequiredIntervention
      condition:
        metric_kpi_id: KPI-OPS-003
        comparator: lt
        threshold:
          basis: absolute
          value: 96.0
          unit: '%'
        filters: []
    L3:
      severity: PrescriptiveExecution
      condition:
        metric_kpi_id: KPI-OPS-003
        comparator: lt
        threshold:
          basis: absolute
          value: 94.0
          unit: '%'
        filters: []
  gating_rules:
  - Trigger only if availability and performance are stable
  - Do not trigger if defects are supplier-driven
  - Exclude periods with approved engineering changes
impact_valuation:
  method: CostAvoidance
  currency: EUR
  success_window:
    duration: P30D
    metric_kpi_id: KPI-OPS-016
    success_criteria:
      kind: return_to_baseline
      baseline_window: P60D
  calculation_logic:
    standardized: "RealizedEUR = Saved_Changeover_Minutes * Hourly_Production_Value / 60"
  required_measures:
  - Changeover Minutes
  - Production Value
  - Action Execution Count
  attribution:
    method: before_after
impact:
  category: Medium
  expected_range:
    metric_kpi_id: KPI-OPS-003
    value_low: 1.0
    value_high: 3.0
    unit: pp
    time_to_effect:
      min_periods: 1
      max_periods: 3
  mechanism:
  - Root-cause elimination of dominant defect drivers
  - Stabilisation of process parameters
  confidence:
    level: Medium
    rationale:
    - Defect causes often concentrated
    - Guarded by upstream availability and performance
operational_execution:
  stakeholders:
  - Production Supervisors
  - Process Engineering
  prerequisites:
  - Consistent defect categorisation
  - Clear escalation paths for quality issues
  steps:
  - Identify lines with sustained quality loss
  - Prioritise dominant defect categories
  - Execute corrective actions and process controls
  - Monitor yield recovery weekly
  effort:
    level: Medium
    typical_duration_days: 60
  risks_and_tradeoffs:
  - Over-correction impacting throughput
  - Hidden interaction with performance actions
data_requirements:
  required_entities:
  - Plant
  - Production Line
  semantic_dependencies:
    measures:
    - Quality %
    - OEE %
    - Availability %
    - Planned Runtime Hours
    tables:
    - fact_quality
    - fact_ops
    - dim_org
automation:
  detection:
    enabled: true
    evaluation_frequency: monthly
    output: Lines with sustained quality loss
  suggested_actions:
    enabled: true
    outputs:
    - Defect root-cause and correction actions
  copilot_prompts: []
tracking:
  execution_log:
    enabled: true
    recommended_storage: fact_action_execution
    minimum_fields:
    - ActionCode
    - Plant
    - ProductionLine
    - TriggerLevel
    - ExecutedDate
  outcome_evaluation:
    enabled: true
    recommended_storage: fact_action_outcome
    minimum_fields:
    - ActionCode
    - Pre_Quality_Pct
    - Post_Quality_Pct_60d
governance:
  approvals_required:
  - Plant Manager
  - Head of Quality
  rollback_plan:
  - Suspend corrective actions if throughput drops below tolerance
  documentation_links:
  - core/usecases/core/OPS-001_Operations_Performance/Business_Factsheet.md
parameters:
- name: period
  type: period
  required: true
  grain: line_month
  source_field: scope.default_grain
- name: trigger_level
  type: trigger_level
  required: true
  allowed_values:
  - L1
  - L2
  - L3
  source_field: trigger.levels
- name: plant
  label: Plant
  type: dimension_member
  required: true
  binding: dim_org.Plant
  source_field: scope.default_perspective
- name: production_line
  label: Production Line
  type: dimension_member
  required: true
  binding: dim_org.Line
  source_field: scope.default_perspective
- name: defect_category
  label: Defect Category
  type: dimension_member
  required: false
  binding: dim_defect_mode.DefectCategory
  source_field: scope.supported_slices
- name: product_variant
  label: Product Variant
  type: dimension_member
  required: false
  binding: nicht_belegt
  source_field: scope.supported_slices
preconditions:
  combine: guardrails_all_and_trigger_any
  checks:
  - id: level_l1
    role: trigger
    kind: kpi_level
    ref: trigger.levels.L1.condition
    kpi_id: KPI-OPS-003
    pruefbar: true
  - id: level_l2
    role: trigger
    kind: kpi_level
    ref: trigger.levels.L2.condition
    kpi_id: KPI-OPS-003
    pruefbar: true
  - id: level_l3
    role: trigger
    kind: kpi_level
    ref: trigger.levels.L3.condition
    kpi_id: KPI-OPS-003
    pruefbar: true
  - id: volume_guardrail
    role: guardrail
    kind: volume_guardrail
    ref: trigger.evaluation.minimum_data.volume_guardrail
    kpi_id: KPI-SCM-019
    pruefbar: true
permitted_role:
  source_field: governance.approvals_required
  roles:
  - approver: Plant Manager
    role_id: plant_manager
  - approver: Head of Quality
    role_id: head_of_quality
review:
  required: true
  state: vorgeschlagen
quality_rules:
- All kpi_id values must exist in KPI catalog.
- Trigger severity must be strictly increasing from L1 to L3.
- impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis.
- If status=deprecated then lifecycle.replaced_by is required.
- 'No free-text trigger notes: use gating_rules and structured filters.'
