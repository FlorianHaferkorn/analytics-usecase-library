schema_version: '2.0'
id: O-O1.2
name: Performance Uplift
owner_domain: Production
impact_dimension: Throughput
status: active
owner_role: production_manager
steward_role: production_bi_lead
use_case_links:
  core_use_cases:
  - OPS-001
  related_use_cases:
  - FIN-002
kpis:
  trigger_kpis:
  - ops.performance.pct
  guardrail_kpis:
  - ops.availability.pct
  outcome_kpis:
  - ops.performance.pct
  - ops.throughput.units
scope:
  default_grain: line_month
  default_perspective:
  - Plant
  - Production Line
  supported_slices:
  - Shift
  - Product Variant
  exclusions:
  - Lines with unresolved availability issues (O-O1.1 active)
  - Pilot or test runs
  - Lines under major changeover programs
trigger:
  type: Deviation
  evaluation:
    grain: line_month
    window:
      kind: rolling
      length: 2
      unit: periods
    persistence:
      required: true
      min_consecutive_periods: 2
    minimum_data:
      min_observations: 1
      volume_guardrail:
        enabled: true
        metric_kpi_id: ops.planned.hours
        comparator: gte
        value: 180
        unit: hours
  levels:
    L1:
      severity: EarlyWarning
      condition:
        metric_kpi_id: ops.performance.pct
        comparator: lt
        threshold:
          basis: absolute
          value: 95.0
          unit: '%'
        filters: []
    L2:
      severity: RequiredIntervention
      condition:
        metric_kpi_id: ops.performance.pct
        comparator: lt
        threshold:
          basis: absolute
          value: 90.0
          unit: '%'
        filters: []
    L3:
      severity: PrescriptiveExecution
      condition:
        metric_kpi_id: ops.performance.pct
        comparator: lt
        threshold:
          basis: absolute
          value: 85.0
          unit: '%'
        filters: []
  gating_rules:
  - Trigger only if availability is stable (>= 90%)
  - Do not trigger if performance loss is driven by quality rework
  - Exclude periods with abnormal product mix shifts
impact_valuation:
  method: CostAvoidance
  currency: EUR
  success_window:
    duration: P14D
    metric_kpi_id: ops.availability.pct
    success_criteria:
      kind: return_to_baseline
      baseline_window: P28D
  calculation_logic:
    standardized: "RealizedEUR = (Post_Availability - Pre_Availability) * Hourly_Production_Value * Operating_Hours"
  required_measures:
  - Availability %
  - Production Value
  - Action Execution Count
  attribution:
    method: before_after
impact:
  category: Medium
  expected_range:
    metric_kpi_id: ops.performance.pct
    value_low: 2.0
    value_high: 6.0
    unit: pp
    time_to_effect:
      min_periods: 1
      max_periods: 2
  mechanism:
  - Reduction of micro-stops
  - Improved line balance and standard work adherence
  confidence:
    level: Medium
    rationale:
    - Speed losses are typically recoverable short-term
    - Guarded by availability and quality constraints
operational_execution:
  stakeholders:
  - Line Supervisors
  - Ops Excellence
  prerequisites:
  - Standard rates and takt times defined
  - Reliable micro-stop tracking
  steps:
  - Identify lines with sustained performance loss
  - Analyze micro-stops and speed losses
  - Implement line balance and standard work corrections
  - Review throughput impact weekly
  effort:
    level: Low to Medium
    typical_duration_days: 45
  risks_and_tradeoffs:
  - Operator fatigue if speed pushed too aggressively
  - Hidden quality impact if standards are bypassed
data_requirements:
  required_entities:
  - Plant
  - Production Line
  semantic_dependencies:
    measures:
    - Performance %
    - Throughput Units
    - Availability %
    - Planned Runtime Hours
    tables:
    - fact_ops_runtime
    - fact_ops_output
    - dim_production_line
    - dim_plant
automation:
  detection:
    enabled: true
    evaluation_frequency: monthly
    output: Lines with sustained performance losses
  suggested_actions:
    enabled: true
    outputs:
    - Micro-stop and line balance improvement actions
  copilot_prompts: []
tracking:
  execution_log:
    enabled: true
    recommended_storage: fact_action_execution
    minimum_fields:
    - ActionCode
    - Plant
    - ProductionLine
    - TriggerLevel
    - ExecutedDate
  outcome_evaluation:
    enabled: true
    recommended_storage: fact_action_outcome
    minimum_fields:
    - ActionCode
    - Pre_Performance_Pct
    - Post_Performance_Pct_30d
governance:
  approvals_required:
  - Plant Manager
  rollback_plan:
  - Reduce line speed if quality or safety KPIs deteriorate
  documentation_links:
  - core/usecases/core/OPS-001_Operations_Performance/Business_Factsheet.md
quality_rules:
- All kpi_id values must exist in KPI catalog.
- Trigger severity must be strictly increasing from L1 to L3.
- impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis.
- If status=deprecated then lifecycle.replaced_by is required.
- 'No free-text trigger notes: use gating_rules and structured filters.'
