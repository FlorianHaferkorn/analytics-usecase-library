schema_version: '2.0'
id: O-A2.5
name: Spare Parts Readiness
owner_domain: Maintenance / Procurement
impact_dimension: Availability
status: active
owner_role: maintenance_supply_coordinator
steward_role: maintenance_procurement_bi_lead
use_case_links:
  core_use_cases:
  - OPS-002
  related_use_cases:
  - SCM-001
kpis:
  trigger_kpis:
  - ops.spare_parts.stockout.pct
  guardrail_kpis:
  - ops.inventory.value.amount
  outcome_kpis:
  - ops.spare_parts.stockout.pct
  - ops.mttr.hours
scope:
  default_grain: asset_month
  default_perspective:
  - Plant
  - Asset
  supported_slices:
  - Spare Part Category
  - Criticality Class
  exclusions:
  - Non-critical consumables
  - Parts with extremely low failure probability
  - One-off emergency purchases already approved
trigger:
  type: Deviation
  evaluation:
    grain: asset_month
    window:
      kind: rolling
      length: 2
      unit: periods
    persistence:
      required: true
      min_consecutive_periods: 2
    minimum_data:
      min_observations: 1
      volume_guardrail:
        enabled: true
        metric_kpi_id: ops.failure.count
        comparator: gte
        value: 1
        unit: count
  levels:
    L1:
      severity: EarlyWarning
      condition:
        metric_kpi_id: ops.spare_parts.stockout.pct
        comparator: gt
        threshold:
          basis: absolute
          value: 5.0
          unit: '%'
        filters: []
    L2:
      severity: RequiredIntervention
      condition:
        metric_kpi_id: ops.spare_parts.stockout.pct
        comparator: gt
        threshold:
          basis: absolute
          value: 10.0
          unit: '%'
        filters: []
    L3:
      severity: PrescriptiveExecution
      condition:
        metric_kpi_id: ops.spare_parts.stockout.pct
        comparator: gt
        threshold:
          basis: absolute
          value: 20.0
          unit: '%'
        filters: []
  gating_rules:
  - Trigger only if MTTR impact is observable
  - Do not trigger if stockouts are caused by approved supplier shutdowns
  - Exclude parts with approved alternative sourcing in place
impact_valuation:
  method: RiskAvoidance
  currency: EUR
  success_window:
    duration: P90D
    metric_kpi_id: ops.safety.incident.count
    success_criteria:
      kind: return_to_baseline
      baseline_window: P180D
  calculation_logic:
    standardized: "RealizedEUR = Avoided_Incidents * Avg_Incident_Cost"
  required_measures:
  - Safety Incident Count
  - Avg Incident Cost
  - Action Execution Count
  attribution:
    method: before_after
impact:
  category: Medium
  expected_range:
    metric_kpi_id: ops.spare_parts.stockout.pct
    value_low: -5.0
    value_high: -15.0
    unit: pp
    time_to_effect:
      min_periods: 1
      max_periods: 2
  mechanism:
  - Improved availability of maintenance-critical parts
  - Faster repair execution due to reduced waiting time
  confidence:
    level: High
    rationale:
    - Direct causal link between stockouts and MTTR
    - Fast corrective levers available
operational_execution:
  stakeholders:
  - Maintenance Manager
  - Procurement
  - Warehouse Operations
  prerequisites:
  - Criticality classification for spare parts
  - Clear emergency and standard replenishment rules
  steps:
  - Identify assets impacted by spare part stockouts
  - Classify missing parts by criticality and lead time
  - Correct stocking levels or secure alternative sourcing
  - Monitor stockout and MTTR trends monthly
  effort:
    level: Low to Medium
    typical_duration_days: 45
  risks_and_tradeoffs:
  - Increased inventory value if overcorrected
  - Obsolescence risk for rarely used parts
data_requirements:
  required_entities:
  - Asset
  - Spare Part
  - Plant
  semantic_dependencies:
    measures:
    - Spare Parts Stockout %
    - MTTR (Hours)
    - Inventory Value Amount
    - Failure Count
    tables:
    - fact_maintenance
    - fact_ops_failures
    - fact_ops
    - dim_asset
    - dim_org
automation:
  detection:
    enabled: true
    evaluation_frequency: monthly
    output: Assets and parts with recurring stockouts
  suggested_actions:
    enabled: true
    outputs:
    - Critical spare part replenishment actions
  copilot_prompts: []
tracking:
  execution_log:
    enabled: true
    recommended_storage: fact_action_execution
    minimum_fields:
    - ActionCode
    - Asset
    - SparePart
    - TriggerLevel
    - ExecutedDate
  outcome_evaluation:
    enabled: true
    recommended_storage: fact_action_outcome
    minimum_fields:
    - ActionCode
    - Pre_Stockout_Pct
    - Post_Stockout_Pct_60d
governance:
  approvals_required:
  - Maintenance Manager
  - Procurement Lead
  rollback_plan:
  - Revert stocking levels if inventory value exceeds guardrails
  documentation_links:
  - core/usecases/core/OPS-002_Asset_Performance/Business_Factsheet.md
quality_rules:
- All kpi_id values must exist in KPI catalog.
- Trigger severity must be strictly increasing from L1 to L3.
- impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis.
- If status=deprecated then lifecycle.replaced_by is required.
- 'No free-text trigger notes: use gating_rules and structured filters.'
