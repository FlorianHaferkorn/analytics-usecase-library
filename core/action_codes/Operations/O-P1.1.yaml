schema_version: '2.0'
id: O-P1.1
name: Preventive Maintenance Trigger
owner_domain: Operations / Maintenance Leadership
impact_dimension: Availability
status: active
owner_role: maintenance_manager
steward_role: operations_bi_lead
use_case_links:
  core_use_cases: []
  related_use_cases:
  - OPS-IND-M001
kpis:
  trigger_kpis:
  - ops.availability.pct
  - ops.oee.pct
  guardrail_kpis:
  - ops.performance.pct
  outcome_kpis:
  - ops.availability.pct
scope:
  default_grain: plant_line_shift_month
  default_perspective:
  - Plant
  - Line
  supported_slices:
  - Shift
  - Asset Group
  exclusions:
  - Planned overhaul windows
  - Lines in commissioning phase
  - Availability loss caused by external utilities outage
trigger:
  type: Deviation
  evaluation:
    grain: plant_line_shift_month
    window:
      kind: rolling
      length: 2
      unit: periods
    persistence:
      required: true
      min_consecutive_periods: 2
    minimum_data:
      min_observations: 1
      volume_guardrail:
        enabled: true
        metric_kpi_id: ops.throughput.units
        comparator: gte
        value: 1000
        unit: units
  levels:
    L1:
      severity: EarlyWarning
      condition:
        metric_kpi_id: ops.availability.pct
        comparator: lt
        threshold:
          basis: absolute
          value: 92.0
          unit: '%'
        filters: []
    L2:
      severity: RequiredIntervention
      condition:
        metric_kpi_id: ops.availability.pct
        comparator: lt
        threshold:
          basis: absolute
          value: 89.0
          unit: '%'
        filters: []
    L3:
      severity: PrescriptiveExecution
      condition:
        metric_kpi_id: ops.availability.pct
        comparator: lt
        threshold:
          basis: absolute
          value: 85.0
          unit: '%'
        filters: []
  gating_rules:
  - Trigger only if unplanned downtime is the dominant OEE loss driver
  - Do not trigger if availability loss is caused by scheduled changeovers
  - Exclude lines already executing approved PM catch-up plan
impact:
  category: High
  expected_range:
    metric_kpi_id: ops.availability.pct
    value_low: 2.0
    value_high: 6.0
    unit: pp
    time_to_effect:
      min_periods: 1
      max_periods: 3
  mechanism:
  - Earlier PM intervention reduces repeated stoppages
  - Stabilizes shift-to-shift availability on chronic assets
  confidence:
    level: High
    rationale:
    - Availability loss is often concentrated in recurring failure modes
    - PM timing is a direct controllable lever in manufacturing
operational_execution:
  stakeholders:
  - Maintenance
  - Plant Operations
  prerequisites:
  - Shift-level downtime transparency and PM calendar
  - Named maintenance owner per critical line
  steps:
  - IDENTIFY each line-shift combination with declining availability trend
  - SCHEDULE targeted preventive maintenance for this line-shift combination
  - CONFIRM downtime window and maintenance scope for this line-shift combination
  - REVIEW availability recovery for this line-shift combination monthly
  effort:
    level: Medium
    typical_duration_days: 21
  risks_and_tradeoffs:
  - Over-maintenance can reduce short-term throughput if scope is too broad
  - Poor maintenance timing can shift losses into adjacent shifts
data_requirements:
  required_entities:
  - Plant
  - Line
  - Shift
  semantic_dependencies:
    measures:
    - Availability %
    - OEE %
    - Performance %
    - Throughput Units
    tables:
    - fact_ops_runtime
    - fact_ops_downtime
    - fact_ops_maintenance
    - dim_plant
    - dim_line
automation:
  detection:
    enabled: true
    evaluation_frequency: monthly
    output: Line-shift combinations requiring preventive maintenance
  suggested_actions:
    enabled: true
    outputs:
    - PM worklist by line and shift
  copilot_prompts: []
tracking:
  execution_log:
    enabled: true
    recommended_storage: fact_action_execution
    minimum_fields:
    - ActionCode
    - Plant
    - Line
    - Shift
    - TriggerLevel
    - ExecutedDate
  outcome_evaluation:
    enabled: true
    recommended_storage: fact_action_outcome
    minimum_fields:
    - ActionCode
    - Pre_Availability_Pct
    - Post_Availability_Pct_30d
governance:
  approvals_required:
  - Plant Manager
  rollback_plan:
  - Defer PM cycle if throughput impact exceeds agreed tolerance
  documentation_links:
  - core/usecases/industry/manufacturing/OPS-IND-M001_Shift_OEE_Benchmarking/Business_Factsheet.md
quality_rules:
- All kpi_id values must exist in KPI catalog.
- Trigger severity must be strictly increasing from L1 to L3.
- impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis.
- If status=deprecated then lifecycle.replaced_by is required.
- 'No free-text trigger notes: use gating_rules and structured filters.'