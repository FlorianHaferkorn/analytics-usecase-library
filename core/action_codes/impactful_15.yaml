# Impactful 15 — Lean Core action code spine (v1.1)
#
# These 15 action codes are the most impactful across the framework.
# Every XD and domain report must wire at least one Impactful 15 action code.
# The action-outcome loop (Week 5) tracks outcome rates per this list.
#
# Selection criteria (audit §2B, 2026-04-20; refreshed 2026-06-01):
#   - Referenced in 2+ use cases OR wired in core UseCase_Bracket.yaml
#   - Spans L1 (Early Warning), L2 (Required Intervention), L3 (Prescriptive)
#   - Distributed across domains to prevent single-domain bias
#   - DEP action_logic_seeds must reference IDs present here or on disk

schema_version: "1.0"
published: "2026-06-01"

action_code_ids:
  # ── Commercial ────────────────────────────────────────────────
  - id: C-M2.1
    domain: Commercial
    name: Price Realization Guardrails
    rationale: Most-referenced commercial action; prevents margin erosion from discount drift.

  - id: C-M2.2
    domain: Commercial
    name: Mix Optimization (Margin-Driven)
    rationale: Second most-referenced commercial action; drives top-line quality improvement.

  - id: C-S1.1
    domain: Commercial
    name: Price Discipline Enforcement
    rationale: COM-001 volume/price recovery; DEP and bracket wired for plan-gap price actions.

  - id: C-S1.2
    domain: Commercial
    name: Sales Gap Recovery via Price & Pack Adjustment
    rationale: COM-001 plan-gap volume recovery; pairs with PVM volume-effect diagnostics.

  - id: C-C3.1
    domain: Commercial
    name: Customer Retention Intervention
    rationale: Directly linked to CLV and revenue-at-risk Golden 20 KPIs.

  # ── Finance ───────────────────────────────────────────────────
  - id: F-C1.1
    domain: Finance
    name: Working Capital Improvement
    rationale: Governs CCC/DIO recovery; primary FIN-001 inventory and liquidity lever.

  - id: F-C1.2
    domain: Finance
    name: Collections Acceleration
    rationale: FIN-001 DSO/overdue-AR trigger; closes cash conversion loop.

  - id: F-K2.1
    domain: Finance
    name: Cost Take-Out Orchestration
    rationale: Orchestrates cost-lever activation across Material/Labor/OpEx; FIN-002 anchor.

  # ── Operations ────────────────────────────────────────────────
  - id: O-A2.1
    domain: Operations
    name: Asset Downtime Response
    rationale: Primary OEE / MTBF intervention; OPS-001 availability trigger.

  - id: O-O1.1
    domain: Operations
    name: Operations Stabilisation
    rationale: Speed-loss and performance recovery; OPS-001 DEP wired.

  - id: O-O1.2
    domain: Operations
    name: Performance Uplift
    rationale: Performance and speed-loss recovery; OPS-001 DEP wired.

  - id: O-O1.3
    domain: Operations
    name: Quality & Yield Recovery
    rationale: Quality-rate and yield recovery; OPS-001 DEP wired.

  - id: O-Q3.1
    domain: Operations
    name: Quality Defect Containment
    rationale: First response to FPY degradation; tier-1 quality action.

  # ── Supply Chain ──────────────────────────────────────────────
  - id: S-I1.1
    domain: SupplyChain
    name: Inventory Orchestration
    rationale: Orchestration action covering both excess and stockout triggers; dispatches to S-I1.2/S-I1.3/S-I1.4.

  - id: S-R2.1
    domain: SupplyChain
    name: OTIF Orchestration
    rationale: SCM-002 core OTIF intervention; L2 replenishment and supplier escalation spine.
