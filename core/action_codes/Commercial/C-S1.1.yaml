schema_version: '2.0'
inherits_decision_spine: pricing_discipline
id: C-S1.1
name: Price Discipline Enforcement
owner_domain: Commercial
impact_dimension: Profitability
status: active
owner_role: pricing_manager
steward_role: commercial_bi_lead
use_case_links:
  core_use_cases:
  - COM-001
  related_use_cases:
  - COM-002
kpis:
  trigger_kpis:
  - KPI-COM-013
  - KPI-COM-010
  guardrail_kpis:
  - KPI-COM-009
  outcome_kpis:
  - KPI-COM-013
scope:
  default_grain: month
  default_perspective:
  - Region
  - Channel
  supported_slices:
  - Product Category
  exclusions:
  - Approved promotions
  - Strategic SKUs with executive pricing approval
trigger:
  type: Deviation
  evaluation:
    grain: month
    window:
      kind: rolling
      length: 2
      unit: periods
    persistence:
      required: true
      min_consecutive_periods: 2
    minimum_data:
      min_observations: 1
      volume_guardrail:
        enabled: true
        metric_kpi_id: KPI-COM-005
        comparator: gte
        value: 100000
        unit: amount
  levels:
    L1:
      severity: EarlyWarning
      condition:
        metric_kpi_id: KPI-COM-013
        comparator: lt
        threshold:
          basis: target
          value: 25.0
          unit: '%'
        filters: []
    L2:
      severity: RequiredIntervention
      condition:
        metric_kpi_id: KPI-COM-010
        comparator: lt
        threshold:
          basis: absolute
          value: 0
          unit: amount
        filters: []
    L3:
      severity: PrescriptiveExecution
      condition:
        metric_kpi_id: KPI-COM-013
        comparator: lt
        threshold:
          basis: absolute
          value: 22.0
          unit: '%'
        filters: []
  gating_rules:
  - Do not trigger if Net Sales % vs Plan < -10% (structural demand issue)
  - Do not trigger for SKUs flagged as strategic
impact_valuation:
  method: DirectMarginImprovement
  currency: EUR
  attribution:
    method: before_after
  success_window:
    duration: P30D
    metric_kpi_id: KPI-COM-013
    success_criteria:
      kind: return_to_baseline
      baseline_window: P60D
  calculation_logic:
    standardized: "RealizedEUR = (Post_GM_Pct - Pre_GM_Pct) * Net_Sales_Amount"
    latex: EUR = \Delta GM\% \times NetSales
  required_measures:
  - Gross Margin %
  - Net Sales Amount
  - Action Execution Count
impact:
  category: High
  expected_range:
    metric_kpi_id: KPI-COM-013
    value_low: 0.5
    value_high: 1.5
    unit: pp
    time_to_effect:
      min_periods: 1
      max_periods: 3
  confidence:
    level: High
operational_execution:
  stakeholders:
  - Sales Operations
  - Regional Sales Leads
  prerequisites:
  - Defined discount floors by product/category
  - Approval workflow for price exceptions
  steps:
  - IDENTIFY each {entity} breaching gross margin threshold
  - FREEZE new discretionary discounts for this {entity}
  - REQUIRE approval for any price exception on this {entity}
  - REVIEW net price realization for this {entity} weekly
  effort:
    level: Low
    typical_duration_days: 30
data_requirements:
  required_entities:
  - Region
  - Channel
  - Product
  semantic_dependencies:
    measures:
    - Gross Margin %
    - Price Effect Amount
    - Net Sales % vs Plan
    tables:
    - fact_sales
    - dim_org
    - dim_product
automation:
  detection:
    enabled: true
    evaluation_frequency: monthly
    output: Flag Region/Channel combinations breaching price discipline thresholds
  suggested_actions:
    enabled: true
    outputs:
    - List of SKUs requiring discount enforcement
  copilot_prompts: []
tracking:
  execution_log:
    enabled: true
    recommended_storage: fact_action_execution
    minimum_fields:
    - ActionCode
    - TriggerLevel
    - Region
    - Channel
    - ExecutedDate
  outcome_evaluation:
    enabled: true
    recommended_storage: fact_action_outcome
    minimum_fields:
    - ActionCode
    - Pre_GM_Pct
    - Post_GM_Pct_30d
governance:
  approvals_required:
  - Commercial Controlling Lead
  rollback_plan:
  - Re-enable discount flexibility if Net Sales drop exceeds tolerance
  documentation_links:
  - core/usecases/core/COM-001_Sales_Performance/Business_Factsheet.md
quality_rules:
- All kpi_id values must exist in KPI catalog.
- Trigger severity must be strictly increasing from L1 to L3.
- impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis.
- If status=deprecated then lifecycle.replaced_by is required.
- 'No free-text trigger notes: use gating_rules and structured filters.'
