schema_version: '2.0'
id: C-M2.4
name: Private Label Share Forecast Warning
# Added 30.10.2026 (ADR-0028): first action code of trigger type Forecast, the early companion of C-M2.3.
# C-M2.3 fires once the own-brand share has fallen; C-M2.4 fires when the lower edge of the 80 %
# prediction interval one month ahead crosses the same levels against the baseline, so the category
# can act before the fall. Since 30.10.2026 the three forecast measures exist in the Commercial
# model, generated by tooling/codegen/forecast_measures.py (ADR-0028 7.1): point = mean of the last
# 3 months, band = point + 10th/90th percentile of one-month errors over 24 months (min 12).
# status stays draft: the thresholds are assumptions (Florian, 30.10.2026).
# Thresholds set 30.10.2026 as an assumption (value_status: assumed): -2 / -4 / -6 % against the
# baseline, the same as C-M2.3. ANNAHME, ungeprueft - no measured or benchmarked number; the category
# owner confirms or replaces them, then value_status: set.
inherits_decision_spine: null
owner_domain: Commercial
impact_dimension: Profitability
status: draft
owner_role: category_manager
steward_role: trade_marketing_commercial_bi_lead
use_case_links:
  core_use_cases:
  - COM-IND-R002
  related_use_cases: []
kpis:
  trigger_kpis:
  - KPI-COM-033
  guardrail_kpis:
  - KPI-COM-005
  outcome_kpis:
  - KPI-COM-033
scope:
  default_grain: month
  default_perspective:
  - Region
  - Product Category
  supported_slices:
  - Channel
  exclusions:
  - Categories without an own-brand range
  - Categories in an active range review
trigger:
  type: Forecast
  forecast:
    horizon:
      length: 1
      unit: months
    forecast_measure: Private Label Penetration % Forecast
    compare: band_lower
    band:
      kind: prediction_interval
      level: 0.8
      lower_measure: Private Label Penetration % Forecast Lower
      upper_measure: Private Label Penetration % Forecast Upper
  evaluation:
    grain: month
    window:
      kind: rolling
      length: 3
      unit: periods
    persistence:
      required: true
      min_consecutive_periods: 2
    minimum_data:
      min_observations: 3
  levels:
    L1:
      severity: EarlyWarning
      condition:
        metric_kpi_id: KPI-COM-033
        comparator: lt
        threshold:
          basis: relative
          reference: baseline
          value: 2.0
          value_status: assumed
          unit: '%'
        filters: []
    L2:
      severity: RequiredIntervention
      condition:
        metric_kpi_id: KPI-COM-033
        comparator: lt
        threshold:
          basis: relative
          reference: baseline
          value: 4.0
          value_status: assumed
          unit: '%'
        filters: []
    L3:
      severity: PrescriptiveExecution
      condition:
        metric_kpi_id: KPI-COM-033
        comparator: lt
        threshold:
          basis: relative
          reference: baseline
          value: 6.0
          value_status: assumed
          unit: '%'
        filters: []
  gating_rules:
  - Read per category; a falling total share from category mix alone is no trigger
  - Do not evaluate where the forecast edge is blank (fewer than 12 one-month errors in the last 24 months)
  - Suppress while C-M2.3 fires for the same category; the review is already running
impact_valuation:
  method: DirectMarginImprovement
  currency: EUR
  attribution:
    method: before_after
  success_window:
    duration: P90D
    metric_kpi_id: KPI-COM-033
    success_criteria:
      kind: return_to_baseline
      baseline_window: P90D
  calculation_logic:
    standardized: "RealizedEUR = Shifted net sales from brand to own brand * (Own-brand gross margin % - Brand gross margin %)"
    latex: EUR = \Delta NS_{PL} \times (GM\%_{PL} - GM\%_{brand})
  required_measures:
  - Private Label Penetration %
  - Private Label Penetration % Forecast
  - Private Label Penetration % Forecast Lower
  - Private Label Penetration % Forecast Upper
  - Net Sales Amount
  - Gross Margin %
impact:
  category: Unquantified
  mechanism:
  - Shelf, promotion and price-gap decisions per category before the forecast own-brand share falls
  confidence:
    level: Low
    rationale:
    - ANNAHME, ungeprueft - the margin gap between own brand and brand is not measured in the library; the EUR value follows only from the formula above once both margins are measured
    - KPI-COM-033 is measured only on synthetic showcase data (Aurora); its category shares are generator assumptions, not observations
operational_execution:
  stakeholders:
  - Category Management
  - Private Label Management
  # Backtest 30.10.2026 on the Aurora showdata (45 one-month forecasts per series, 2021-04 to
  # 2024-12, Python reference of the measure): share of actuals inside the 80 % band CE 0.667,
  # Fashion 0.800, Home & Living 0.800, total 0.711. Showcase data, no customer calibration.
  prerequisites:
  - Own-brand flag on every SKU in dim_product (commercial_sales contract)
  - Gross margin per SKU available for own brand and brand
  - Monthly forecast of KPI-COM-033 per category with an 80 % prediction interval, backtested on at least 12 months
  steps:
  - IDENTIFY categories where the lower forecast edge for next month falls below the baseline level for this {entity}
  - CHECK planned promotions, listings and price changes of brand and own brand for this {entity}
  - EXECUTE a counter-measure before month end (shelf, promotion or price gap) for this {entity}
  - MONITOR the forecast edge and the actual own-brand share weekly for this {entity}
  effort:
    level: Medium
  risks_and_tradeoffs:
  - Pushing own brand can lose shoppers who buy the brand elsewhere
  - Supplier negotiations with brand manufacturers can be affected
data_requirements:
  required_entities:
  - Region
  - Product Category
  semantic_dependencies:
    measures:
    - Private Label Penetration %
    - Private Label Penetration % Forecast
    - Private Label Penetration % Forecast Lower
    - Private Label Penetration % Forecast Upper
    - Net Sales Amount
    tables:
    - fact_sales
    - dim_product
governance:
  approvals_required:
  - Head of Category Management
  - Commercial Director
  rollback_plan:
  - Revert the range or price-gap decision if category net sales fall below plan during the success window
  documentation_links:
  - core/usecases/industry/retail/COM-IND-R002_Private_Label_Performance/Business_Factsheet.md
quality_rules:
- All kpi_id values must exist in KPI catalog.
- Trigger severity must be strictly increasing from L1 to L3.
- Thresholds are assumptions (value_status assumed) until the owner confirms them; status stays draft until then.
- If status=deprecated then lifecycle.replaced_by is required.
- 'No free-text trigger notes: use gating_rules and structured filters.'
