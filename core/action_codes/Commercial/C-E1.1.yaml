schema_version: '2.0'
id: C-E1.1
name: E-Commerce Share Recovery
# Added 02.10.2026 (BO-120): first action code for COM-006. status draft on purpose: the trigger KPI
# KPI-COM-032 is op:hitl (open decision which dim_org[Channel] values count as e-commerce), so no
# level can fire until that measure exists. Thresholds are open customer decisions (value: null,
# value_status: open); nothing here is a measured or benchmarked number.
inherits_decision_spine: null
owner_domain: Commercial
impact_dimension: Growth
status: draft
owner_role: commercial_controlling_lead
steward_role: sales_bi_lead
use_case_links:
  core_use_cases:
  - COM-006
  related_use_cases: []
kpis:
  trigger_kpis:
  - KPI-COM-032
  guardrail_kpis:
  - KPI-COM-005
  outcome_kpis:
  - KPI-COM-032
  - KPI-COM-034
scope:
  default_grain: month
  default_perspective:
  - Region
  - Channel
  supported_slices:
  - Product Category
  exclusions:
  - Regions without an own web shop or marketplace listing
  - Months in which the channel attribution of sales was changed
trigger:
  type: Deviation
  evaluation:
    grain: month
    window:
      kind: rolling
      length: 3
      unit: periods
    persistence:
      required: true
      min_consecutive_periods: 2
    minimum_data:
      min_observations: 3
  levels:
    L1:
      severity: EarlyWarning
      condition:
        metric_kpi_id: KPI-COM-032
        comparator: lt
        threshold:
          basis: relative
          reference: baseline
          value: null
          value_status: open
          unit: '%'
        filters: []
    L2:
      severity: RequiredIntervention
      condition:
        metric_kpi_id: KPI-COM-032
        comparator: lt
        threshold:
          basis: relative
          reference: baseline
          value: null
          value_status: open
          unit: '%'
        filters: []
    L3:
      severity: PrescriptiveExecution
      condition:
        metric_kpi_id: KPI-COM-032
        comparator: lt
        threshold:
          basis: relative
          reference: baseline
          value: null
          value_status: open
          unit: '%'
        filters: []
  gating_rules:
  - Do not evaluate until the e-commerce channel set (dim_org[Channel] values) is decided and KPI-COM-032 has a measure
  - Do not trigger while total net sales of the region fall below plan (KPI-COM-005); then the share moves for the wrong reason
impact_valuation:
  method: RevenueUplift
  currency: EUR
  attribution:
    method: before_after
  success_window:
    duration: P90D
    metric_kpi_id: KPI-COM-032
    success_criteria:
      kind: return_to_baseline
      baseline_window: P90D
  calculation_logic:
    standardized: "RealizedEUR = (Post_EcomShare - Pre_EcomShare) * Total net sales of the affected regions in the success window"
    latex: EUR = (S_{post} - S_{pre}) \times NS_{total}
  required_measures:
  - E-Commerce Revenue Share
  - Net Sales Amount
impact:
  category: Unquantified
  mechanism:
  - Shop experience and checkout fixes where session conversion (KPI-COM-034) falls while traffic holds
  - Channel programme in the regions with the lowest e-commerce share
  confidence:
    level: Low
    rationale:
    - ANNAHME, ungeprueft - no measured effect size in the library; the EUR value follows only from the formula above once the measure exists
    - KPI-COM-032 and KPI-COM-034 are op:hitl, so neither trigger nor outcome can be measured yet
operational_execution:
  stakeholders:
  - E-Commerce Management
  - Commercial Controlling
  prerequisites:
  - Decision which dim_org[Channel] values count as e-commerce (KPI-COM-032)
  - Web-analytics session data in a data contract (KPI-COM-034)
  steps:
  - IDENTIFY regions where the e-commerce share fell below its baseline for this {entity}
  - CHECK whether session conversion or traffic explains the drop for this {entity}
  - EXECUTE shop-experience or channel-programme measures for this {entity}
  - MONITOR e-commerce share and session conversion for this {entity} monthly
  effort:
    level: Medium
  risks_and_tradeoffs:
  - Shifting existing customers online raises the share without new revenue
  - Marketplace fees can lower margin while the share rises
data_requirements:
  required_entities:
  - Region
  - Channel
  semantic_dependencies:
    measures:
    - E-Commerce Revenue Share
    - Net Sales Amount
    tables:
    - fact_sales
    - dim_org
governance:
  approvals_required:
  - Head of E-Commerce
  - Commercial Director
  rollback_plan:
  - Stop the channel programme if net sales of the region fall below plan during the success window
  documentation_links:
  - core/usecases/core/COM-006_E-Commerce_Channel_Performance/Business_Factsheet.md
quality_rules:
- All kpi_id values must exist in KPI catalog.
- Trigger severity must be strictly increasing from L1 to L3.
- Thresholds stay value null with value_status open until the owner sets them; status stays draft until then.
- If status=deprecated then lifecycle.replaced_by is required.
- 'No free-text trigger notes: use gating_rules and structured filters.'
