id: C-S1.2
action_code_id: C-S1.2
kpi_id: sales.net_sales.amount
impact_range_eur_min: 200000
impact_range_eur_likely: 800000
impact_range_eur_max: 2500000
time_to_effect_days: 45
confidence: medium
evidence_source_url: "https://www.mckinsey.com/capabilities/growth-marketing-and-sales/our-insights/pricing-the-next-frontier-of-value-creation"
owner: Sales Director / Category Management Lead
assumptions:
  - "Targeted segment size 20-80M EUR net sales showing plan gap; price or pack adjustment recovers 1-3% net sales."
  - "Revenue uplift formula: Net_Sales_post_intervention - Net_Sales_pre; measured on targeted segment after 2 cycles."
  - "Gross margin guardrail maintained at 25%+; no action triggered if structural demand shortfall persists > 3 months."
  - "Pack-size flexibility requires Category Management approval; operational complexity modeled as 4-6 week lead time."
  - "Customer price anchoring risk factored into medium confidence rating; one-time price resets not included in range."
