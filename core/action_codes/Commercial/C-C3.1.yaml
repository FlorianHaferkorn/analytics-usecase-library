schema_version: '2.0'
inherits_decision_spine: DEC-SPINE-COM-CUSTOMER_VALUE
id: C-C3.1
name: Customer Retention Intervention
owner_domain: Commercial
impact_dimension: Customer Value
status: active
owner_role: commercial_controlling_lead
steward_role: sales_ops_bi_lead
use_case_links:
  core_use_cases:
  - COM-003
kpis:
  trigger_kpis:
  - KPI-CUS-002
  - KPI-OPS-001
  guardrail_kpis:
  - KPI-COM-013
  outcome_kpis:
  - KPI-CUS-002
  - KPI-CUS-001
scope:
  default_grain: customer_month
  default_perspective:
  - Customer Segment
  - Channel
  supported_slices:
  - Region
  - Customer
  exclusions:
  - New customers in onboarding
  - Customers under active contractual lock-in
  - Segments with approved strategic exit decisions
trigger:
  type: Deviation
  evaluation:
    grain: customer_month
    window:
      kind: rolling
      length: 2
      unit: periods
    persistence:
      required: true
      min_consecutive_periods: 2
    minimum_data:
      min_observations: 1
      volume_guardrail:
        enabled: true
        metric_kpi_id: KPI-CUS-006
        comparator: gte
        value: 50
        unit: count
  levels:
    L1:
      severity: EarlyWarning
      condition:
        metric_kpi_id: KPI-CUS-002
        comparator: lt
        threshold:
          basis: absolute
          value: 97.0
          unit: '%'
        filters: []
    L2:
      severity: RequiredIntervention
      condition:
        metric_kpi_id: KPI-CUS-002
        comparator: lt
        threshold:
          basis: absolute
          value: 94.0
          unit: '%'
        filters: []
    L3:
      severity: PrescriptiveExecution
      condition:
        metric_kpi_id: KPI-CUS-002
        comparator: lt
        threshold:
          basis: absolute
          value: 90.0
          unit: '%'
        filters: []
  gating_rules:
  - Trigger only if revenue at risk is materially increasing for the same segment or customer set
  - Do not trigger for onboarding cohorts within their first 90 days
  - Exclude low-margin segments with approved deprioritization strategy
impact_valuation:
  method: RevenueUplift
  currency: EUR
  attribution:
    method: before_after
  success_window:
    duration: P90D
    metric_kpi_id: KPI-CUS-001
    success_criteria:
      kind: threshold_met
      baseline_window: P90D
  calculation_logic:
    standardized: "RealizedEUR = SUM(Post_CLV - Pre_CLV) for targeted customer segments"
    latex: EUR = \sum (CLV_{post} - CLV_{pre})
  required_measures:
  - CLV
  - Retention Rate
  - Action Execution Count
impact:
  category: High
  expected_range:
    metric_kpi_id: KPI-CUS-002
    value_low: 1.0
    value_high: 4.0
    unit: pp
    time_to_effect:
      min_periods: 1
      max_periods: 3
  mechanism:
  - Targeted re-engagement of high-value customers
  - Prioritized intervention on segments with rising revenue at risk
  confidence:
    level: Medium
    rationale:
    - Retention actions are effective when prioritized by value and timing
    - Impact varies by segment and contract structure
operational_execution:
  stakeholders:
  - Sales Leadership
  - CRM Team
  prerequisites:
  - Consistent churn and retention definitions
  - Customer ownership and outreach playbooks assigned
  steps:
  - IDENTIFY segments or customers with persistent retention deterioration
  - PRIORITIZE the book of business by KPI-OPS-001 and KPI-CUS-001
  - ASSIGN targeted recovery actions to account or CRM owners
  - REVIEW retention and CLV recovery for the targeted population monthly
  effort:
    level: Medium
    typical_duration_days: 60
  risks_and_tradeoffs:
  - Over-investment in low-quality or low-margin customers
  - Slow feedback loop on CLV improvement
data_requirements:
  required_entities:
  - Customer
  - Customer Segment
  semantic_dependencies:
    measures:
    - Customer Retention %
    - Revenue at Risk Amount
    - CLV
    - Customer Lifetime Revenue Amount
    tables:
    - fact_customer_events
    - fact_customer_value
    - fact_sales
    - dim_customer
    - dim_org
automation:
  detection:
    enabled: true
    evaluation_frequency: monthly
    output: Customers and segments with sustained retention deterioration
  suggested_actions:
    enabled: true
    outputs:
    - Prioritized re-engagement worklist
tracking:
  execution_log:
    enabled: true
    recommended_storage: fact_action_execution
    minimum_fields:
    - ActionCode
    - CustomerKey
    - CustomerSegment
    - TriggerLevel
    - ExecutedDate
  outcome_evaluation:
    enabled: true
    recommended_storage: fact_action_outcome
    minimum_fields:
    - ActionCode
    - Pre_Retention_Pct
    - Post_Retention_Pct_90d
governance:
  approvals_required:
  - Commercial Controlling Lead
  rollback_plan:
  - Stop retention spend if margin guardrails deteriorate without value recovery
  documentation_links:
  - core/usecases/core/COM-003_Customer_Value/Business_Factsheet.md
parameters:
- name: period
  type: period
  required: true
  grain: customer_month
  source_field: scope.default_grain
- name: trigger_level
  type: trigger_level
  required: true
  allowed_values:
  - L1
  - L2
  - L3
  source_field: trigger.levels
- name: customer_segment
  label: Customer Segment
  type: dimension_member
  required: true
  binding: dim_customer.Segment
  source_field: scope.default_perspective
- name: channel
  label: Channel
  type: dimension_member
  required: true
  binding: nicht_belegt
  source_field: scope.default_perspective
- name: region
  label: Region
  type: dimension_member
  required: false
  binding: nicht_belegt
  source_field: scope.supported_slices
- name: customer
  label: Customer
  type: dimension_member
  required: false
  binding: dim_org.Customer
  source_field: scope.supported_slices
preconditions:
  combine: guardrails_all_and_trigger_any
  checks:
  - id: level_l1
    role: trigger
    kind: kpi_level
    ref: trigger.levels.L1.condition
    kpi_id: KPI-CUS-002
    pruefbar: true
  - id: level_l2
    role: trigger
    kind: kpi_level
    ref: trigger.levels.L2.condition
    kpi_id: KPI-CUS-002
    pruefbar: true
  - id: level_l3
    role: trigger
    kind: kpi_level
    ref: trigger.levels.L3.condition
    kpi_id: KPI-CUS-002
    pruefbar: true
  - id: volume_guardrail
    role: guardrail
    kind: volume_guardrail
    ref: trigger.evaluation.minimum_data.volume_guardrail
    kpi_id: KPI-CUS-006
    pruefbar: true
permitted_role:
  source_field: governance.approvals_required
  roles:
  - approver: Commercial Controlling Lead
    role_id: commercial_controlling_lead
review:
  required: true
  state: vorgeschlagen
quality_rules:
- All kpi_id values must exist in KPI catalog.
- Trigger severity must be strictly increasing from L1 to L3.
- impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis.
- If status=deprecated then lifecycle.replaced_by is required.
- 'No free-text trigger notes: use gating_rules and structured filters.'