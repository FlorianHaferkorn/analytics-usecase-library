evidence_source_url: "https://www.mckinsey.com/capabilities/growth-marketing-and-sales/our-insights/the-art-of-mix-management"
owner: VP Commercial / Head of Category Management
assumptions:
  - "Baseline net revenue 500M EUR; 1 pp GM improvement equals 5M EUR gross margin uplift."
  - "Mix shift of 0.08-0.60 pp achievable by redirecting sales resources to high-margin SKUs."
  - "Assumes 15% of promoted volume can shift without full revenue loss (demand elasticity)."
  - "Time-to-effect longer than price actions due to channel and shelf-space constraints."
  - "Effect measured as incremental GM vs prior 12-month baseline; low-margin SKU volume loss netted out."
