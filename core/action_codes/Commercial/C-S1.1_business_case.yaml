assumptions:
  - "Baseline net sales in scope 150-300M EUR; price discipline enforcement recovers 0.20-1.00 pp gross margin."
  - "Impact formula: GM%_gain x Net_Sales_in_Scope; 1 pp gain on 200M EUR = 2M EUR, capped by observable leakage."
