schema_version: '2.0'
id: C-M2.2
name: Mix Optimization (Margin-Driven)
owner_domain: Commercial
impact_dimension: Profitability
status: active
owner_role: category_manager
steward_role: commercial_bi_lead
use_case_links:
  core_use_cases:
  - COM-002
  related_use_cases:
  - COM-001
kpis:
  trigger_kpis:
  - sales.pvm.mix_effect.amount
  guardrail_kpis:
  - margin.gm.pct
  - crm.retention.pct
  - crm.revenue_at_risk.amount
  - cost.cogs_per_unit.amount
  outcome_kpis:
  - margin.gm.pct
  - sales.pvm.mix_effect.amount
  - crm.clv.amount
scope:
  default_grain: month
  default_perspective:
  - Region
  - Channel
  supported_slices:
  - Product Category
  - SKU
  exclusions:
  - Strategic SKUs
  - Contractually fixed assortments
  - New product launches (<3 months)
trigger:
  type: Pattern
  evaluation:
    grain: month
    window:
      kind: rolling
      length: 3
      unit: periods
    persistence:
      required: true
      min_consecutive_periods: 2
    minimum_data:
      min_observations: 2
      volume_guardrail:
        enabled: true
        metric_kpi_id: margin.gm.amount
        comparator: gte
        value: 40000
        unit: amount
  levels:
    L1:
      severity: EarlyWarning
      condition:
        metric_kpi_id: sales.pvm.mix_effect.amount
        comparator: lt
        threshold:
          basis: absolute
          value: 0
          unit: amount
        filters: []
    L2:
      severity: RequiredIntervention
      condition:
        metric_kpi_id: sales.pvm.mix_effect.amount
        comparator: lt
        threshold:
          basis: absolute
          value: -75000
          unit: amount
        filters: []
    L3:
      severity: PrescriptiveExecution
      condition:
        metric_kpi_id: sales.pvm.mix_effect.amount
        comparator: lt
        threshold:
          basis: absolute
          value: -200000
          unit: amount
        filters: []
  gating_rules:
  - Trigger only if price realization is within guardrails
  - Do not trigger if negative mix is driven by temporary availability constraints
  - Exclude SKUs flagged as strategic
impact:
  category: Medium
  expected_range:
    metric_kpi_id: margin.gm.pct
    value_low: 0.3
    value_high: 1.2
    unit: pp
    time_to_effect:
      min_periods: 1
      max_periods: 3
  mechanism:
  - Rebalancing sales toward higher-margin products
  - Reducing exposure to low-margin mix elements
  confidence:
    level: Medium
    rationale:
    - Observed margin uplift through mix steering
    - Independent of pricing actions
operational_execution:
  stakeholders:
  - Sales Operations
  - Pricing Analytics
  prerequisites:
  - Defined SKU margin tiers
  - Clear identification of strategic SKUs
  steps:
  - IDENTIFY each {entity} with persistent negative mix effect
  - RANK SKUs by margin contribution for this {entity}
  - ADJUST sales targets and focus lists for this {entity}
  - MONITOR mix and margin for this {entity} monthly
  effort:
    level: Medium
    typical_duration_days: 60
  risks_and_tradeoffs:
  - Short-term volume softness
  - Sales resistance to deprioritizing familiar SKUs
data_requirements:
  required_entities:
  - Region
  - Channel
  - Product
  semantic_dependencies:
    measures:
    - Mix Effect Amount
    - Gross Margin %
    - Gross Margin Amount
    tables:
    - fact_sales
    - dim_product
    - dim_org
automation:
  detection:
    enabled: true
    evaluation_frequency: monthly
    output: Regions/channels/SKUs with adverse mix patterns
  suggested_actions:
    enabled: true
    outputs:
    - SKU priority lists by margin tier
  copilot_prompts: []
tracking:
  execution_log:
    enabled: true
    recommended_storage: fact_action_execution
    minimum_fields:
    - ActionCode
    - TriggerLevel
    - Region
    - Channel
    - Product
    - ExecutedDate
  outcome_evaluation:
    enabled: true
    recommended_storage: fact_action_outcome
    minimum_fields:
    - ActionCode
    - Pre_GM_Pct
    - Post_GM_Pct_60d
governance:
  approvals_required:
  - Commercial Controlling Lead
  - Category Management Lead
  rollback_plan:
  - Restore prior sales focus if revenue decline exceeds tolerance
  documentation_links:
  - core/usecases/core/COM-002_Margin_Price_Performance/Business_Factsheet.md
quality_rules:
- All kpi_id values must exist in KPI catalog.
- Trigger severity must be strictly increasing from L1 to L3.
- impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis.
- If status=deprecated then lifecycle.replaced_by is required.
- 'No free-text trigger notes: use gating_rules and structured filters.'
