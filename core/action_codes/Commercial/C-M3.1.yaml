schema_version: '2.0'
id: C-M3.1
name: Category Cross-Sell & Basket Optimization
inherits_decision_spine: DEC-SPINE-COM-BASKET_CROSSSELL
owner_domain: Commercial
impact_dimension: Growth
status: active
owner_role: category_manager
steward_role: trade_marketing_commercial_bi_lead
use_case_links:
  core_use_cases:
  - COM-IND-R001
  related_use_cases:
  - COM-004
kpis:
  trigger_kpis:
  - retail.category.crosssell_rate.pct
  guardrail_kpis:
  - retail.basket.value.average
  outcome_kpis:
  - retail.category.crosssell_rate.pct
  - retail.promotion.attachment_rate.pct
scope:
  default_grain: month
  default_perspective:
  - Region
  - Channel
  supported_slices:
  - Product Category
  - Store Format
  exclusions:
  - Stores in active range review (>15% SKU change)
  - Small-format stores (<500m2 sales floor)
  - Category pairs under an active promotional campaign
trigger:
  type: Pattern
  evaluation:
    grain: month
    window:
      kind: rolling
      length: 3
      unit: periods
    persistence:
      required: true
      min_consecutive_periods: 2
    minimum_data:
      min_observations: 2
      volume_guardrail:
        enabled: true
        metric_kpi_id: retail.basket.items_per_transaction
        comparator: gte
        value: 1.2
        unit: ratio
  levels:
    L1:
      severity: EarlyWarning
      condition:
        metric_kpi_id: retail.category.crosssell_rate.pct
        comparator: lt
        threshold:
          basis: absolute
          value: 25
          unit: pct
        filters: []
    L2:
      severity: RequiredIntervention
      condition:
        metric_kpi_id: retail.category.crosssell_rate.pct
        comparator: lt
        threshold:
          basis: absolute
          value: 20
          unit: pct
        filters: []
    L3:
      severity: PrescriptiveExecution
      condition:
        metric_kpi_id: retail.category.crosssell_rate.pct
        comparator: lt
        threshold:
          basis: absolute
          value: 15
          unit: pct
        filters: []
  gating_rules:
  - Do not trigger while the affected assortment is in range review (affinity model stale)
  - Exclude small-format stores where adjacent placement is physically impossible
  - If a promotional campaign is active in the category pair, measure attachment before layering new mechanics
impact_valuation:
  method: RevenueUplift
  currency: EUR
  attribution:
    method: before_after
  success_window:
    duration: P30D
    metric_kpi_id: retail.category.crosssell_rate.pct
    success_criteria:
      kind: return_to_baseline
      baseline_window: P60D
  calculation_logic:
    standardized: "RealizedEUR = (Post_ABV - Pre_ABV) * Transactions attributable to cross-sell activation"
    latex: EUR = (ABV_{post} - ABV_{pre}) \times N_{tx}
  required_measures:
  - Average Basket Value
  - Category Cross-Sell Rate %
  - Action Execution Count
impact:
  category: Medium
  expected_range:
    metric_kpi_id: retail.category.crosssell_rate.pct
    value_low: 2.0
    value_high: 8.0
    unit: pp
    time_to_effect:
      min_periods: 1
      max_periods: 3
  mechanism:
  - Adjacent placement of high-affinity category pairs
  - Promotion mechanics that pull margin-accretive attachment
  - Targeting frequent-visit cohorts with relevant cross-sell prompts
  confidence:
    level: Medium
    rationale:
    - Placement-driven cross-sell uplift validated in retail case studies
    - Confidence decreases for new categories or after major range changes
operational_execution:
  stakeholders:
  - Category Management
  - Trade Marketing
  prerequisites:
  - Category affinity model refreshed within the last quarter
  - Planogram approval workflow available
  steps:
  - IDENTIFY top high-affinity underperforming category pairs for this {entity}
  - RANK pairs by incremental basket-value potential for this {entity}
  - EXECUTE placement directive or attachment promotion for this {entity}
  - MONITOR cross-sell rate and average basket value for this {entity} monthly
  effort:
    level: Medium
    typical_duration_days: 45
  risks_and_tradeoffs:
  - Excessive bundling pressure slows checkout throughput
  - Placement changes carry planogram approval lead time
data_requirements:
  required_entities:
  - Region
  - Channel
  - Product Category
  semantic_dependencies:
    measures:
    - Category Cross-Sell Rate %
    - Average Basket Value
    - Promotion Attachment Rate %
    tables:
    - fact_sales
    - dim_product
    - dim_store
automation:
  detection:
    enabled: true
    evaluation_frequency: monthly
    output: Category pairs with declining cross-sell rate and untapped affinity
  suggested_actions:
    enabled: true
    outputs:
    - Ranked placement and attachment-promotion candidates
  copilot_prompts: []
tracking:
  execution_log:
    enabled: true
    recommended_storage: fact_action_execution
    minimum_fields:
    - ActionCode
    - TriggerLevel
    - Region
    - Channel
    - CategoryPair
    - ExecutedDate
  outcome_evaluation:
    enabled: true
    recommended_storage: fact_action_outcome
    minimum_fields:
    - ActionCode
    - Pre_CrossSell_Pct
    - Post_CrossSell_Pct_60d
governance:
  approvals_required:
  - Head of Category Management
  - Commercial Director
  rollback_plan:
  - Revert placement directive if average basket value declines beyond tolerance
  documentation_links:
  - core/usecases/industry/retail/COM-IND-R001_Basket_Category_CrossSell/Business_Factsheet.md
quality_rules:
- All kpi_id values must exist in KPI catalog.
- Trigger severity must be strictly increasing from L1 to L3.
- impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis.
- If status=deprecated then lifecycle.replaced_by is required.
- 'No free-text trigger notes: use gating_rules and structured filters.'
