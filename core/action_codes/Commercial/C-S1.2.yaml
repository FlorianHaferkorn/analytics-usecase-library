schema_version: '2.0'
inherits_decision_spine: pricing_discipline
id: C-S1.2
name: Sales Gap Recovery via Price & Pack Adjustment
owner_domain: Commercial
impact_dimension: Growth
status: active
owner_role: sales_director
steward_role: commercial_bi_lead
use_case_links:
  core_use_cases:
  - COM-001
  related_use_cases:
  - COM-002
  - COM-004
kpis:
  trigger_kpis:
  - KPI-COM-009
  guardrail_kpis:
  - KPI-COM-013
  outcome_kpis:
  - KPI-COM-005
scope:
  default_grain: month
  default_perspective:
  - Region
  - Channel
  supported_slices:
  - Product Category
  - Customer Segment
  exclusions:
  - Approved promotions
  - Strategic SKUs with fixed pricing policy
trigger:
  type: Deviation
  evaluation:
    grain: month
    window:
      kind: rolling
      length: 2
      unit: periods
    persistence:
      required: true
      min_consecutive_periods: 2
    minimum_data:
      min_observations: 1
      volume_guardrail:
        enabled: true
        metric_kpi_id: KPI-COM-005
        comparator: gte
        value: 200000
        unit: amount
  levels:
    L1:
      severity: EarlyWarning
      condition:
        metric_kpi_id: KPI-COM-009
        comparator: lt
        threshold:
          basis: absolute
          value: -2.0
          unit: '%'
        filters: []
    L2:
      severity: RequiredIntervention
      condition:
        metric_kpi_id: KPI-COM-009
        comparator: lt
        threshold:
          basis: absolute
          value: -5.0
          unit: '%'
        filters: []
    L3:
      severity: PrescriptiveExecution
      condition:
        metric_kpi_id: KPI-COM-009
        comparator: lt
        threshold:
          basis: absolute
          value: -8.0
          unit: '%'
        filters: []
  gating_rules:
  - Trigger only if Gross Margin % >= 25%
  - Do not trigger if price effect is structurally negative for 3+ months (hand over
    to COM-002)
  - Do not trigger during approved campaign periods
impact_valuation:
  method: RevenueUplift
  currency: EUR
  attribution:
    method: before_after
  success_window:
    duration: P60D
    metric_kpi_id: KPI-COM-005
    success_criteria:
      kind: return_to_baseline
      baseline_window: P60D
  calculation_logic:
    standardized: "RealizedEUR = Post_Net_Sales - Pre_Net_Sales for targeted segments"
    latex: EUR = NetSales_{post} - NetSales_{pre}
  required_measures:
  - Net Sales Amount
  - Volume Units
  - Action Execution Count
impact:
  category: Medium
  expected_range:
    metric_kpi_id: KPI-COM-005
    value_low: 1.0
    value_high: 3.0
    unit: '%'
    time_to_effect:
      min_periods: 1
      max_periods: 2
  mechanism:
  - Improved price-point attractiveness
  - Reduced entry barriers via pack sizing
  confidence:
    level: Medium
    rationale:
    - Observed elasticity effects in comparable periods
    - Guardrails prevent margin dilution
operational_execution:
  stakeholders:
  - Pricing Manager
  - Category Management
  prerequisites:
  - Defined GM guardrails by category
  - Pack-size flexibility approved by Category Management
  steps:
  - IDENTIFY each {entity} breaching plan thresholds
  - SELECT eligible products for this {entity} within GM guardrails
  - APPLY temporary price or pack adjustments to this {entity}
  - REVIEW Net Sales uplift for this {entity} after one cycle
  effort:
    level: Medium
    typical_duration_days: 45
  risks_and_tradeoffs:
  - Temporary customer price anchoring
  - Operational complexity from pack variants
data_requirements:
  required_entities:
  - Region
  - Channel
  - Product
  - Customer Segment
  semantic_dependencies:
    measures:
    - Net Sales % vs Plan
    - Gross Margin %
    - Net Sales Amount
    tables:
    - fact_sales
    - dim_org
    - dim_product
automation:
  detection:
    enabled: true
    evaluation_frequency: monthly
    output: Region/Channel/Product combinations eligible for gap recovery
  suggested_actions:
    enabled: true
    outputs:
    - Candidate price corridors
    - Eligible pack-size adjustments
  copilot_prompts: []
tracking:
  execution_log:
    enabled: true
    recommended_storage: fact_action_execution
    minimum_fields:
    - ActionCode
    - TriggerLevel
    - Region
    - Channel
    - Product
    - ExecutedDate
  outcome_evaluation:
    enabled: true
    recommended_storage: fact_action_outcome
    minimum_fields:
    - ActionCode
    - Pre_NetSales
    - Post_NetSales_30d
governance:
  approvals_required:
  - Commercial Controlling Lead
  - Category Management Lead
  rollback_plan:
  - Revert price or pack changes if GM % falls below guardrail
  documentation_links:
  - core/usecases/core/COM-001_Sales_Performance/Business_Factsheet.md
quality_rules:
- All kpi_id values must exist in KPI catalog.
- Trigger severity must be strictly increasing from L1 to L3.
- impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis.
- If status=deprecated then lifecycle.replaced_by is required.
- 'No free-text trigger notes: use gating_rules and structured filters.'
