schema_version: '2.0'
id: C-P4.1
name: Promo Calendar Discipline
owner_domain: Trade Marketing
impact_dimension: Profitability
status: active
owner_role: trade_marketing_lead
steward_role: trade_marketing_bi_lead
use_case_links:
  core_use_cases:
  - COM-004
  related_use_cases:
  - COM-002
kpis:
  trigger_kpis:
  - KPI-COM-016
  - KPI-SVC-001
  guardrail_kpis:
  - KPI-FIN-012
  outcome_kpis:
  - KPI-COM-016
  - KPI-FIN-012
  - KPI-CUS-003
scope:
  default_grain: promotion
  default_perspective:
  - Region
  - Channel
  supported_slices:
  - Product Category
  - PromoType
  exclusions:
  - Strategic brand-building campaigns with approved ROI override
  - Legally or contractually fixed promotions
  - First-time pilot mechanics (<1 execution)
trigger:
  type: Deviation
  evaluation:
    grain: promotion
    window:
      kind: rolling
      length: 3
      unit: executions
    persistence:
      required: true
      min_consecutive_periods: 2
    minimum_data:
      min_observations: 2
      volume_guardrail:
        enabled: true
        metric_kpi_id: KPI-COM-021
        comparator: gte
        value: 100000
        unit: amount
  levels:
    L1:
      severity: EarlyWarning
      condition:
        metric_kpi_id: KPI-COM-016
        comparator: lt
        threshold:
          basis: absolute
          value: 0.0
          unit: '%'
        filters: []
    L2:
      severity: RequiredIntervention
      condition:
        metric_kpi_id: KPI-COM-016
        comparator: lt
        threshold:
          basis: absolute
          value: -5.0
          unit: '%'
        filters: []
    L3:
      severity: PrescriptiveExecution
      condition:
        metric_kpi_id: KPI-COM-016
        comparator: lt
        threshold:
          basis: absolute
          value: -10.0
          unit: '%'
        filters: []
  gating_rules:
  - Trigger only if baseline quality checks pass (baseline sales/qty present)
  - Do not trigger if Promo Gross Margin % remains above target
  - Exclude promotions flagged as strategic branding with approved override
impact_valuation:
  method: DirectMarginImprovement
  currency: EUR
  attribution:
    method: before_after
  success_window:
    duration: P30D
    metric_kpi_id: KPI-COM-016
    success_criteria:
      kind: threshold_met
      baseline_window: P30D
  calculation_logic:
    standardized: "RealizedEUR = (Post_Promo_ROI - Pre_Promo_ROI) * Promo_Spend"
    latex: EUR = (\Delta ROI) \times Spend
  required_measures:
  - Promo ROI
  - Promo Spend
  - Action Execution Count
impact:
  category: High
  expected_range:
    metric_kpi_id: KPI-COM-016
    value_low: 5.0
    value_high: 20.0
    unit: pp
    time_to_effect:
      min_periods: 1
      max_periods: 2
  mechanism:
  - Removal of structurally loss-making promotions
  - Reallocation toward higher-ROI mechanics
  confidence:
    level: High
    rationale:
    - Direct stop/continue lever
    - Short feedback loop per promotion cycle
operational_execution:
  stakeholders:
  - Commercial Controlling
  - Category Management
  prerequisites:
  - Promotion ROI calculation validated
  - Clear classification of strategic vs tactical promotions
  steps:
  - IDENTIFY each {entity} with repeated negative ROI
  - REVIEW mechanics and baseline assumptions for this {entity}
  - STOP, REPLACE, or RESEQUENCE this {entity} based on ROI analysis
  - VALIDATE ROI improvement for this {entity} in next cycle
  effort:
    level: Low
    typical_duration_days: 30
  risks_and_tradeoffs:
  - Short-term volume dip from promo removal
  - Channel pushback on reduced promo intensity
data_requirements:
  required_entities:
  - Promotion
  - Product
  - Org
  semantic_dependencies:
    measures:
    - Promotion ROI %
    - Promo Gross Margin %
    - Incremental Sales Amount
    tables:
    - fact_sales
    - fact_promo
    - dim_promo
automation:
  detection:
    enabled: true
    evaluation_frequency: per_promotion
    output: Promotion list with repeated negative ROI
  suggested_actions:
    enabled: true
    outputs:
    - Stop/replace/resequence recommendation
  copilot_prompts: []
tracking:
  execution_log:
    enabled: true
    recommended_storage: fact_action_execution
    minimum_fields:
    - ActionCode
    - Promotion
    - TriggerLevel
    - ExecutedDate
  outcome_evaluation:
    enabled: true
    recommended_storage: fact_action_outcome
    minimum_fields:
    - ActionCode
    - Promotion
    - Pre_ROI_Pct
    - Post_ROI_Pct
governance:
  approvals_required:
  - Head of Trade Marketing
  rollback_plan:
  - Reintroduce promotion if strategic KPI deviation exceeds tolerance
  documentation_links:
  - core/usecases/core/COM-004_Promotion_Effectiveness/Business_Factsheet.md
quality_rules:
- All kpi_id values must exist in KPI catalog.
- Trigger severity must be strictly increasing from L1 to L3.
- impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis.
- If status=deprecated then lifecycle.replaced_by is required.
- 'No free-text trigger notes: use gating_rules and structured filters.'
