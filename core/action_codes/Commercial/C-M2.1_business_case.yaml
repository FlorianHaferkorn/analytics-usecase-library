# Business Case — C-M2.1 Price Realization Guardrails
id: C-M2.1
action_code_id: C-M2.1
kpi_id: KPI-COM-003
impact_range_eur_min: 500000
impact_range_eur_likely: 1500000
impact_range_eur_max: 3500000
time_to_effect_days: 45
confidence: high
evidence_source_url: "https://www.bain.com/insights/pricing-discipline-value-creation/"
owner: VP Commercial
assumptions:
  - "Baseline net revenue 500M EUR; 1 pp price realization gain equals 5M EUR top-line impact."
  - "Guardrails expected to recover 0.10-0.70 pp lost price realization versus list price."
  - "Assumes current price-to-invoice leakage is 3-8% of gross revenue based on industry benchmarks."
  - "Sales incentives are not restructured as part of this action; purely process and approval guardrails."
  - "Effect horizon is 12 months; assumes no macro price pressure exceeding +/-3% market movement."
