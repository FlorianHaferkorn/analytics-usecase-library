schema_version: "1.0"

id: "DEC-SPINE-COM-CUSTOMER_VALUE"
name: "Customer Value and Retention Discipline"
owner_domains: ["Commercial"]
impact_dimension: "Customer Value"

purpose:
  intent: >
    Improve retention and lifetime value by acting on churn and value signals.

decision_context:
  decision_type: "Prescriptive"
  primary_question: >
    Which customers should we retain, protect, or reprioritize?
  decision_owner_roles:
    - "commercial_controlling_lead"
    - "trade_marketing_commercial_bi_lead"

decision_tradeoffs:
  improves:
    - "Retention"
    - "Margin"
    - "Service cost"
  risks:
    - "Over-investment in low-value segments"

when_not_to_act:
  conditions:
    - description: "New customers in onboarding"
      signal: "Customer in early onboarding period; churn signals within first 90 days are not yet statistically reliable"
    - description: "Contractual constraints"
      signal: "Active contractual lock-in, minimum purchase agreement, or exclusive arrangement in force"

escalation_logic:
  principle: "Escalate as customer value decline persists; prioritize retention investment by segment margin"
  escalation_path:
    - level: "EarlyWarning"
      action: "Flag declining customer segments to Sales Director and CRM team; initiate segment review within 5 business days"
    - level: "RequiredIntervention"
      action: "Trigger structured retention intervention with Account Manager and Commercial Controlling Lead"
    - level: "PrescriptiveExecution"
      action: "Initiate formal customer re-engagement programme or exit analysis with executive sign-off"

decision_confidence:
  level: "Low"
  rationale:
    - "Customer lifetime value models are inherently approximate; CLV estimates carry significant uncertainty, especially for SME segments"
    - "Retention effects of interventions take multiple quarters to materialize; causal attribution is difficult in the short term"

governance:
  ownership:
    accountable_role: "commercial_controlling_lead"
    consulted_roles:
      - "trade_marketing_commercial_bi_lead"
      - "sales_bi_lead"
  change_policy:
    - "Spine changes require domain and governance sign-off"

quality_rules:
  - "No KPI IDs or thresholds are defined in the spine."
  - "Spine must remain domain-agnostic within its decision field."
