schema_version: "1.0"

id: "DEC-SPINE-OPS-QUALITY"
name: "Quality and Yield Discipline"
owner_domains: ["Operations"]
impact_dimension: "Quality"

purpose:
  intent: >
    Improve yield by addressing dominant defect drivers.

decision_context:
  decision_type: "Prescriptive"
  primary_question: >
    Which defect driver is most material to yield and COPQ?
  decision_owner_roles:
    - "Domain Lead"
    - "Controlling Lead"

decision_tradeoffs:
  improves:
    - "Yield"
    - "Throughput"
    - "Cost"
  risks:
    - "Overreaction to noise"

when_not_to_act:
  conditions:
    - description: "Unstable process changes"
      signal: "Defined in Action Codes"
    - description: "Unverified inspection data"
      signal: "Defined in Action Codes"

escalation_logic:
  principle: "Escalate as impact persists while guardrails are respected"
  escalation_path:
    - level: "EarlyWarning"
      action: "Visibility and monitoring"
    - level: "RequiredIntervention"
      action: "Controlled corrective action"
    - level: "PrescriptiveExecution"
      action: "Mandatory enforcement"

decision_confidence:
  level: "Medium"
  rationale:
    - "Depends on signal quality and execution follow-through"

governance:
  ownership:
    accountable_role: "Domain Lead"
    consulted_roles:
      - "Strategy"
      - "Analytics"
  change_policy:
    - "Spine changes require domain and governance sign-off"

quality_rules:
  - "No KPI IDs or thresholds are defined in the spine."
  - "Spine must remain domain-agnostic within its decision field."

