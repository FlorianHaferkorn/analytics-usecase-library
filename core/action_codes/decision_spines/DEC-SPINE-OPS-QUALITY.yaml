schema_version: "1.0"

id: "DEC-SPINE-OPS-QUALITY"
name: "Quality and Yield Discipline"
owner_domains: ["Operations"]
impact_dimension: "Quality"

purpose:
  intent: >
    Improve yield by addressing dominant defect drivers.

decision_context:
  decision_type: "Prescriptive"
  primary_question: >
    Which defect driver is most material to yield and COPQ?
  decision_owner_roles:
    - "quality_manager"
    - "quality_analytics_ops_bi_lead"

decision_tradeoffs:
  improves:
    - "Yield"
    - "Throughput"
    - "Cost"
  risks:
    - "Overreaction to noise"

when_not_to_act:
  conditions:
    - description: "Unstable process changes"
      signal: "Process change or new equipment commissioning within settling period (first 72 hours); defect signal is not yet representative"
    - description: "Unverified inspection data"
      signal: "Measurement system analysis (MSA) flag raised; inspection data reliability is under review"
    - description: "Qualification run"
      signal: "Material qualification or customer acceptance run in progress; defect tolerance rules are temporarily different"

escalation_logic:
  principle: "Contain before correcting; prioritise COPQ-weighted defect drivers, not defect count"
  escalation_path:
    - level: "EarlyWarning"
      action: "Notify Quality Manager and Shift Lead; initiate defect pareto analysis and containment review within 1 shift"
    - level: "RequiredIntervention"
      action: "Quality Manager activates root cause team; implement SPC-guided corrective action; Plant Manager informed"
    - level: "PrescriptiveExecution"
      action: "Production hold or customer notification required; Quality Director sign-off; 8D report initiated"

decision_confidence:
  level: "High"
  rationale:
    - "Process output quality is directly measurable via inspection and SPC; statistical signal quality is high when data collection is consistent"
    - "Pareto analysis on defect categories reliably identifies dominant drivers in most production environments"

governance:
  ownership:
    accountable_role: "quality_manager"
    consulted_roles:
      - "quality_analytics_ops_bi_lead"
      - "operations_controlling_oee_lead"
  change_policy:
    - "Spine changes require domain and governance sign-off"

quality_rules:
  - "No KPI IDs or thresholds are defined in the spine."
  - "Spine must remain domain-agnostic within its decision field."
