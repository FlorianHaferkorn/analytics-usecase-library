schema_version: "1.0"

id: "DEC-SPINE-XD-EXEC"
name: "Executive Cross-Domain Governance"
owner_domains: ["Enterprise"]
impact_dimension: "Enterprise Governance"

purpose:
  intent: >
    Prioritize cross-domain risks and ensure action follow-through.

decision_context:
  decision_type: "Prescriptive"
  primary_question: >
    Which domain risk should be escalated to executives?
  decision_owner_roles:
    - "Domain Lead"
    - "Controlling Lead"

decision_tradeoffs:
  improves:
    - "Risk reduction"
    - "Focus"
    - "Change capacity"
  risks:
    - "Over-escalation"

when_not_to_act:
  conditions:
    - description: "Single-KPI noise"
      signal: "Defined in Action Codes"
    - description: "Already mitigated risks"
      signal: "Defined in Action Codes"

escalation_logic:
  principle: "Escalate as impact persists while guardrails are respected"
  escalation_path:
    - level: "EarlyWarning"
      action: "Visibility and monitoring"
    - level: "RequiredIntervention"
      action: "Controlled corrective action"
    - level: "PrescriptiveExecution"
      action: "Mandatory enforcement"

decision_confidence:
  level: "Medium"
  rationale:
    - "Depends on signal quality and execution follow-through"

governance:
  ownership:
    accountable_role: "Domain Lead"
    consulted_roles:
      - "Strategy"
      - "Analytics"
  change_policy:
    - "Spine changes require domain and governance sign-off"

quality_rules:
  - "No KPI IDs or thresholds are defined in the spine."
  - "Spine must remain domain-agnostic within its decision field."

