schema_version: "1.0"

id: "DEC-SPINE-XD-EXEC"
name: "Executive Cross-Domain Governance"
owner_domains: ["Enterprise"]
impact_dimension: "Enterprise Governance"

purpose:
  intent: >
    Prioritize cross-domain risks and ensure action follow-through.

decision_context:
  decision_type: "Prescriptive"
  primary_question: >
    Which domain risk should be escalated to executives?
  decision_owner_roles:
    - "head_of_enterprise_controlling"
    - "enterprise_bi_lead"

decision_tradeoffs:
  improves:
    - "Risk reduction"
    - "Focus"
    - "Change capacity"
  risks:
    - "Over-escalation"

when_not_to_act:
  conditions:
    - description: "Single-KPI noise"
      signal: "Deviation is isolated to a single KPI in one domain with no cross-domain spillover confirmed; escalation to executive level is premature without multi-signal corroboration"
    - description: "Already mitigated risks"
      signal: "Domain-level corrective action plan is in place with documented ownership and measurable progress in the current review cycle; executive escalation would duplicate governance already active"
    - description: "Seasonal or planned variance"
      signal: "Deviation is within approved seasonal, promotional, or investment plan; variance is expected and budgeted; escalation would create false alarm"

escalation_logic:
  principle: "Escalate cross-domain patterns, not single-domain symptoms; prioritise by combined financial impact and strategic exposure"
  escalation_path:
    - level: "EarlyWarning"
      action: "Enterprise BI Lead flags multi-domain signal correlation in Executive KPI dashboard; domain leads notified to assess alignment; reviewed in next leadership cycle"
    - level: "RequiredIntervention"
      action: "Head of Enterprise Controlling convenes cross-domain review; impact quantified across Finance, Commercial, Operations, and Supply Chain; executive sponsor assigned"
    - level: "PrescriptiveExecution"
      action: "C-suite decision required; trade-off between domains formalised; resource reallocation or strategic priority adjustment approved; board notification if covenant or guidance impact confirmed"

decision_confidence:
  level: "Medium"
  rationale:
    - "Cross-domain KPI synthesis aggregates signals from multiple measurement systems with different data freshness and granularity; aggregation introduces noise that can obscure root causes"
    - "Executive prioritisation involves strategic trade-offs between domains with competing ownership; attribution of systemic risk to a single corrective lever is inherently uncertain at this level"

governance:
  ownership:
    accountable_role: "head_of_enterprise_controlling"
    consulted_roles:
      - "enterprise_bi_lead"
      - "treasury_finance_controlling"
  change_policy:
    - "Spine changes require domain and governance sign-off"

quality_rules:
  - "No KPI IDs or thresholds are defined in the spine."
  - "Spine must remain domain-agnostic within its decision field."
