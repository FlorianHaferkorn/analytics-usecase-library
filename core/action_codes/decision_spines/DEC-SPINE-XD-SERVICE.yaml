schema_version: "1.0"

id: "DEC-SPINE-XD-SERVICE"
name: "Service Level Discipline"
owner_domains: ["Service"]
impact_dimension: "Service Quality"

purpose:
  intent: >
    Restore SLA without degrading resolution quality.

decision_context:
  decision_type: "Prescriptive"
  primary_question: >
    Which service lever should be prioritized to recover SLA?
  decision_owner_roles:
    - "Domain Lead"
    - "Controlling Lead"

decision_tradeoffs:
  improves:
    - "SLA"
    - "FCR"
    - "AHT"
  risks:
    - "Quality erosion"

when_not_to_act:
  conditions:
    - description: "Exceptional incidents"
      signal: "Defined in Action Codes"
    - description: "Regulated cases"
      signal: "Defined in Action Codes"

escalation_logic:
  principle: "Escalate as impact persists while guardrails are respected"
  escalation_path:
    - level: "EarlyWarning"
      action: "Visibility and monitoring"
    - level: "RequiredIntervention"
      action: "Controlled corrective action"
    - level: "PrescriptiveExecution"
      action: "Mandatory enforcement"

decision_confidence:
  level: "Medium"
  rationale:
    - "Depends on signal quality and execution follow-through"

governance:
  ownership:
    accountable_role: "Domain Lead"
    consulted_roles:
      - "Strategy"
      - "Analytics"
  change_policy:
    - "Spine changes require domain and governance sign-off"

quality_rules:
  - "No KPI IDs or thresholds are defined in the spine."
  - "Spine must remain domain-agnostic within its decision field."

