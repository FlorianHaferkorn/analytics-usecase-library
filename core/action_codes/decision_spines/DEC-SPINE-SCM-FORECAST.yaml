schema_version: "1.0"

id: "DEC-SPINE-SCM-FORECAST"
name: "Forecast Quality Discipline"
owner_domains: ["SupplyChain"]
impact_dimension: "Planning"

purpose:
  intent: >
    Improve forecast accuracy and stability without overcorrecting.

decision_context:
  decision_type: "Prescriptive"
  primary_question: >
    Which forecast quality lever should be applied first?
  decision_owner_roles:
    - "planning_s_op_bi_lead"
    - "supply_chain_bi_lead"

decision_tradeoffs:
  improves:
    - "Accuracy"
    - "Stability"
    - "Service impact"
  risks:
    - "Planning churn"

when_not_to_act:
  conditions:
    - description: "Promotions or launches"
      signal: "Active promotion or product launch with less than 3 months of post-event history; baseline signal is not statistically reliable"
    - description: "Insufficient history"
      signal: "New SKU or market segment with fewer than 12 months of sales history; statistical forecasting models have limited applicability"
    - description: "Deliberate conservative buffer"
      signal: "S&OP-approved conservative overstock buffer for strategic or seasonal reasons; intentional bias accepted"

escalation_logic:
  principle: "Correct systematic bias before tuning algorithms; separate signal from noise using multi-period analysis"
  escalation_path:
    - level: "EarlyWarning"
      action: "Alert Planning team and S&OP BI Lead; run MAPE and bias analysis; flag in next S&OP cycle review"
    - level: "RequiredIntervention"
      action: "Demand Manager initiates mandatory forecast review and bias correction; Planning Excellence team engaged"
    - level: "PrescriptiveExecution"
      action: "Head of Supply Chain mandates forecast model review; algorithm change requires S&OP sign-off"

decision_confidence:
  level: "Low"
  rationale:
    - "Demand forecasts carry inherent uncertainty; algorithm performance varies significantly by product lifecycle stage and market volatility"
    - "Forecast improvement actions have multi-cycle lag before measurable accuracy gains; immediate attribution is unreliable"

governance:
  ownership:
    accountable_role: "planning_s_op_bi_lead"
    consulted_roles:
      - "supply_chain_bi_lead"
      - "planning_excellence_controlling"
  change_policy:
    - "Spine changes require domain and governance sign-off"

quality_rules:
  - "No KPI IDs or thresholds are defined in the spine."
  - "Spine must remain domain-agnostic within its decision field."
