schema_version: "1.0"

id: "DEC-SPINE-COM-SEGMENTATION"
name: "Customer Segmentation and RFM Targeting Discipline"
owner_domains: ["Commercial"]
impact_dimension: "Customer Value"

purpose:
  intent: >
    Improve commercial targeting precision by acting on RFM segment signals to
    maximise CLV, reduce churn in high-value segments, and avoid over-investing
    in low-value customer groups.

decision_context:
  decision_type: "Prescriptive"
  primary_question: >
    Which customer segments should we target, re-engage, or deprioritise this period?
  decision_owner_roles:
    - "commercial_controlling_lead"
    - "trade_marketing_commercial_bi_lead"

decision_tradeoffs:
  improves:
    - "CLV portfolio value"
    - "Campaign ROI"
    - "Retention in Champion and Loyal segments"
  risks:
    - "Over-targeting high-value segments causes contact fatigue"
    - "Under-investing in Potential Loyal segment delays migration"
    - "Model-driven targeting misses sudden behavioural shifts"

when_not_to_act:
  conditions:
    - description: "Customers in active promotional period"
      signal: "Customer already enrolled in an active retention or promotional campaign; avoid concurrent conflicting outreach"
    - description: "Model confidence low"
      signal: "Churn model AUC below 0.70 or RFM scoring coverage below 80%; do not act on scores pending model review"
    - description: "Data gap period"
      signal: "Scoring data older than 14 days due to pipeline failure; escalate to data engineering before campaign activation"

escalation_logic:
  principle: "Escalate as CLV declines or churn risk concentrates; prioritise high-CLV at-risk segments first"
  escalation_path:
    - level: "EarlyWarning"
      action: "Flag At-Risk segment migration to CRM Lead; initiate segment review within 5 business days"
    - level: "RequiredIntervention"
      action: "Activate structured retention programme (C-C3.1) for top-100 CLV customers at high churn risk; CRM Director sign-off required"
    - level: "PrescriptiveExecution"
      action: "Full portfolio re-segmentation review; Commercial Director and Marketing Lead co-own corrective campaign plan"

decision_confidence:
  level: "Medium"
  rationale:
    - "RFM scoring is deterministic given clean transaction data; confidence is high for established customers with 12+ months history"
    - "Churn propensity model introduces probabilistic uncertainty; recovery rates of 15-25% are statistically valid ranges, not precise predictions"
    - "Campaign response is influenced by external factors (competitor action, seasonality) not captured in the model"

governance:
  ownership:
    accountable_role: "commercial_controlling_lead"
    consulted_roles:
      - "crm_analytics_lead"
      - "trade_marketing_commercial_bi_lead"
  change_policy:
    - "Spine changes require CRM analytics and commercial controlling sign-off"
    - "RFM scoring weights reviewed annually or after major assortment changes"

quality_rules:
  - "No KPI IDs or thresholds are defined in the spine."
  - "Spine must remain domain-agnostic within its decision field."
