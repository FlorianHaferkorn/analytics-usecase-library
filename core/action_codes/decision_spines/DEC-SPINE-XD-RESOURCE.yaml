schema_version: "1.0"

id: "DEC-SPINE-XD-RESOURCE"
name: "Resource Utilization Discipline"
owner_domains: ["Service"]
impact_dimension: "Workforce"

purpose:
  intent: >
    Balance utilization with SLA and staff sustainability.

decision_context:
  decision_type: "Prescriptive"
  primary_question: >
    Which capacity lever should be used to restore balance?
  decision_owner_roles:
    - "service_operations_workforce_planning"
    - "service_ops_cx_bi_lead"

decision_tradeoffs:
  improves:
    - "Utilization"
    - "SLA"
    - "Overtime"
  risks:
    - "Burnout"
    - "Backlog growth"

when_not_to_act:
  conditions:
    - description: "Training periods"
      signal: "New staff cohort in structured onboarding or certification programme; productivity and utilization metrics are not yet representative of steady-state capacity"
    - description: "Approved surge coverage"
      signal: "Capacity model reflects approved seasonal or event-driven surge staffing; utilization deviation is planned and within approved operational parameters"
    - description: "Voluntary workload reduction"
      signal: "Workforce management team has approved temporary reduced scheduling for wellbeing, union agreement, or statutory rest requirements; capacity constraint is policy-governed"

escalation_logic:
  principle: "Restore balance by adjusting demand routing before adding headcount; protect staff sustainability as a non-negotiable constraint"
  escalation_path:
    - level: "EarlyWarning"
      action: "Alert Workforce Planning Lead and Service Ops BI Lead; review demand-capacity gap and routing options; overtime trend assessed within current sprint"
    - level: "RequiredIntervention"
      action: "Service Operations Manager activates rebalancing plan (skill routing, temporary redeployment, or burst capacity); HR Partner engaged if overtime threshold approached"
    - level: "PrescriptiveExecution"
      action: "Head of Service Operations mandates structural capacity review; headcount plan revised; HR Director and Finance sign-off required for net new FTE"

decision_confidence:
  level: "Medium"
  rationale:
    - "Workforce utilization is measurable but influenced by demand variability, case complexity, and individual productivity differences; aggregate metrics can mask distribution imbalances"
    - "Capacity interventions (routing, redeployment, hiring) have different lead times and cost profiles; selecting the right lever requires multi-factor judgment beyond signal analysis"

governance:
  ownership:
    accountable_role: "service_operations_workforce_planning"
    consulted_roles:
      - "service_ops_cx_bi_lead"
      - "enterprise_bi_lead"
  change_policy:
    - "Spine changes require domain and governance sign-off"

quality_rules:
  - "No KPI IDs or thresholds are defined in the spine."
  - "Spine must remain domain-agnostic within its decision field."
