schema_version: "1.0"

id: "DEC-SPINE-COM-BASKET_CROSSSELL"
name: "Basket Value and Category Cross-Sell Discipline"
owner_domains: ["Commercial", "Retail"]
impact_dimension: "Revenue per Transaction"

purpose:
  intent: >
    Grow average basket value and category cross-sell rates by acting on
    category affinity signals, promotion attachment data, and store-level
    placement performance — maximising revenue per customer visit without
    increasing traffic.

decision_context:
  decision_type: "Prescriptive"
  primary_question: >
    Which category pairs have untapped cross-sell potential, and should we act
    via placement, promotion mechanics, or digital recommendation?
  decision_owner_roles:
    - "commercial_controlling_lead"
    - "trade_marketing_commercial_bi_lead"

decision_tradeoffs:
  improves:
    - "Average basket value"
    - "Items per transaction"
    - "Category cross-sell rate"
  risks:
    - "Excessive bundling or cross-sell pressure reduces transaction speed at POS"
    - "Association model retraining lag means affinity data may not reflect recent assortment changes"
    - "Placement changes in physical stores carry implementation cost and planogram approval lead time"

when_not_to_act:
  conditions:
    - description: "Assortment in major transition"
      signal: "Range review in progress (> 15% SKU change); affinity model is stale until retraining completes; do not initiate placement changes based on pre-transition affinity scores"
    - description: "Small-format physical constraint"
      signal: "Store format (< 500m² sales floor) prevents adjacent placement of cross-sell categories; placement-based actions are not applicable"
    - description: "Campaign currently running"
      signal: "Active promotional campaign in the affected category pair; measure attachment rate performance before layering additional mechanics"

escalation_logic:
  principle: "Escalate as basket value declines or cross-sell rates stagnate; start with lowest-effort placement action before campaign investment"
  escalation_path:
    - level: "EarlyWarning"
      action: "Flag declining cross-sell rate or ABV trend to Category Manager; review category affinity heatmap in weekly category meeting"
    - level: "RequiredIntervention"
      action: "Issue placement directive for top-3 high-affinity underperforming category pairs (C-M2.1); planogram update within 10 business days"
    - level: "PrescriptiveExecution"
      action: "Full promotional mechanics review; Head of Category and Head of Marketing co-own campaign redesign; A/B test required before full rollout"

decision_confidence:
  level: "Medium"
  rationale:
    - "Association rule (affinity) model is reliable for established category pairs with 52+ weeks of transaction history; confidence decreases for new categories or after major range changes"
    - "Placement-driven cross-sell uplift (8–15%) is validated from multiple retail case studies but varies significantly by store format and customer demographics"
    - "Online basket affinity may differ substantially from in-store; channel-split analysis is required before applying in-store findings to e-commerce recommendations"

governance:
  ownership:
    accountable_role: "commercial_controlling_lead"
    consulted_roles:
      - "category_managers"
      - "head_of_merchandising"
      - "trade_marketing_commercial_bi_lead"
  change_policy:
    - "Spine changes require Head of Category and Commercial Director sign-off"
    - "Affinity model weights reviewed after each annual range review or when cross-sell rates shift by > 20% unexpectedly"

quality_rules:
  - "No KPI IDs or thresholds are defined in the spine."
  - "Spine must remain domain-agnostic within its decision field."
