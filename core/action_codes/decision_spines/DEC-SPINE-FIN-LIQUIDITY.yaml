schema_version: "1.0"

id: "DEC-SPINE-FIN-LIQUIDITY"
name: "Liquidity and Working Capital Discipline"
owner_domains: ["Finance"]
impact_dimension: "Liquidity"

purpose:
  intent: >
    Stabilize cash position by balancing DSO, DIO, and DPO levers.

decision_context:
  decision_type: "Prescriptive"
  primary_question: >
    Which working-capital lever should be prioritized without harming service?
  decision_owner_roles:
    - "treasury_finance_controlling"
    - "treasury_finance_bi_lead"

decision_tradeoffs:
  improves:
    - "Cash"
    - "Service level"
    - "Supplier risk"
  risks:
    - "Service degradation"
    - "Supplier disruption"

when_not_to_act:
  conditions:
    - description: "Temporary cash buffers"
      signal: "Seasonal cash build or treasury-approved liquidity buffer is in place with documented rationale"
    - description: "Regulatory payment constraints"
      signal: "Payment terms governed by local regulatory requirements, approved supplier financing programme, or early payment discount arrangement"
    - description: "Strategic financing"
      signal: "Cash position is intentionally low due to approved M&A, capex deployment, or dividend commitment"

escalation_logic:
  principle: "Escalate as cash deterioration persists; prioritise lever with lowest service and supplier risk"
  escalation_path:
    - level: "EarlyWarning"
      action: "Alert Treasury team and Finance Controller; initiate working capital lever review within 2 business days"
    - level: "RequiredIntervention"
      action: "CFO-sponsored working capital review; activate DSO or DIO lever with Credit & Collections or Supply Chain"
    - level: "PrescriptiveExecution"
      action: "Mandatory cash management action; CFO sign-off required; Board notification if breach of covenant"

decision_confidence:
  level: "High"
  rationale:
    - "Cash and working capital positions are measured daily with high accounting precision"
    - "DSO, DIO, DPO are deterministic calculations from ledger data; causal attribution to levers is reliable"

governance:
  ownership:
    accountable_role: "treasury_finance_controlling"
    consulted_roles:
      - "treasury_finance_bi_lead"
      - "head_of_credit_and_collections"
  change_policy:
    - "Spine changes require domain and governance sign-off"

quality_rules:
  - "No KPI IDs or thresholds are defined in the spine."
  - "Spine must remain domain-agnostic within its decision field."
