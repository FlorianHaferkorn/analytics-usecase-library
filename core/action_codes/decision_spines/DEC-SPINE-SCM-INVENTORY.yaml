schema_version: "1.0"

id: "DEC-SPINE-SCM-INVENTORY"
name: "Inventory Balance Discipline"
owner_domains: ["SupplyChain"]
impact_dimension: "Working Capital"

purpose:
  intent: >
    Balance inventory reduction with service protection.

decision_context:
  decision_type: "Prescriptive"
  primary_question: >
    Which inventory lever should be activated without harming OTIF?
  decision_owner_roles:
    - "supply_chain_controlling_inventory_mgmt_lead"
    - "supply_chain_bi_lead"

decision_tradeoffs:
  improves:
    - "DIO"
    - "OTIF"
    - "Stockouts"
  risks:
    - "Service failures"
    - "Obsolescence write-offs"

when_not_to_act:
  conditions:
    - description: "Launch or ramp-up items"
      signal: "New product launch or market expansion with fewer than 3 months post-launch history; safety stock rules are not yet calibrated for demand signal"
    - description: "Force majeure events"
      signal: "Active supply disruption caused by external force majeure (port closure, supplier site incident, regulatory hold); replenishment lead times are not representative"
    - description: "Strategic buffer stock"
      signal: "S&OP-approved strategic buffer for seasonal peak, promotional uplift, or supply security rationale; intentional overstock is policy-governed"

escalation_logic:
  principle: "Protect service level first; reduce inventory only when OTIF risk is quantified and acceptable"
  escalation_path:
    - level: "EarlyWarning"
      action: "Alert Inventory Manager and Supply Chain BI Lead; initiate stock coverage and service risk analysis within 2 business days"
    - level: "RequiredIntervention"
      action: "Supply Chain Controlling Lead activates inventory reduction or replenishment plan; S&OP cycle review triggered; Risk assessed per SKU-segment"
    - level: "PrescriptiveExecution"
      action: "Head of Supply Chain mandates structural inventory rebalancing; cross-domain impact (Finance, Operations) assessed; write-off approval required if obsolescence risk confirmed"

decision_confidence:
  level: "High"
  rationale:
    - "Inventory position is deterministic from WMS and ERP ledger data; stock levels, coverage days, and stockout events are directly observable"
    - "Causal link between inventory levers (safety stock, reorder point, MOQ) and service outcomes is well-established in standard SCM practice"

governance:
  ownership:
    accountable_role: "supply_chain_controlling_inventory_mgmt_lead"
    consulted_roles:
      - "supply_chain_bi_lead"
      - "planning_s_op_bi_lead"
  change_policy:
    - "Spine changes require domain and governance sign-off"

quality_rules:
  - "No KPI IDs or thresholds are defined in the spine."
  - "Spine must remain domain-agnostic within its decision field."
