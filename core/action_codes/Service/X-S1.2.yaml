schema_version: '2.0'
id: X-S1.2
name: Capacity & Backlog Stabilisation
owner_domain: Service Operations
impact_dimension: Throughput
status: active
owner_role: service_operations_manager
steward_role: operations_bi_lead
use_case_links:
  core_use_cases:
  - XD-001
  related_use_cases:
  - XD-002
kpis:
  trigger_kpis:
  - KPI-SVC-007
  guardrail_kpis:
  - KPI-SVC-005
  outcome_kpis:
  - KPI-SVC-007
  - KPI-SVC-004
scope:
  default_grain: queue_day
  default_perspective:
  - Queue
  - Channel
  supported_slices:
  - Region
  - Priority Class
  exclusions:
  - Low-volume specialist queues
  - Queues under active quality remediation
  - Incident-driven backlog spikes with exec override
trigger:
  type: Deviation
  evaluation:
    grain: queue_day
    window:
      kind: rolling
      length: 5
      unit: days
    persistence:
      required: true
      min_consecutive_periods: 3
    minimum_data:
      min_observations: 3
      volume_guardrail:
        enabled: true
        metric_kpi_id: KPI-SVC-013
        comparator: gte
        value: 150
        unit: count
  levels:
    L1:
      severity: EarlyWarning
      condition:
        metric_kpi_id: KPI-SVC-007
        comparator: gt
        threshold:
          basis: relative
          value: 10.0
          unit: '%'
        filters: []
    L2:
      severity: RequiredIntervention
      condition:
        metric_kpi_id: KPI-SVC-007
        comparator: gt
        threshold:
          basis: relative
          value: 25.0
          unit: '%'
        filters: []
    L3:
      severity: PrescriptiveExecution
      condition:
        metric_kpi_id: KPI-SVC-007
        comparator: gt
        threshold:
          basis: relative
          value: 40.0
          unit: '%'
        filters: []
  gating_rules:
  - Trigger only if backlog growth exceeds arrival rate trend
  - Do not trigger if backlog increase is quality-driven
  - Exclude queues with active handling-time reduction actions
impact_valuation:
  method: CostAvoidance
  currency: EUR
  success_window:
    duration: P30D
    metric_kpi_id: KPI-SVC-006
    success_criteria:
      kind: return_to_baseline
      baseline_window: P60D
  calculation_logic:
    standardized: "RealizedEUR = (Pre_AHT - Post_AHT) * Ticket_Volume * Cost_Per_Minute"
  required_measures:
  - AHT Minutes
  - Ticket Volume
  - Cost Per Minute
  - Action Execution Count
  attribution:
    method: before_after
impact:
  category: High
  expected_range:
    metric_kpi_id: KPI-SVC-007
    value_low: -15.0
    value_high: -35.0
    unit: '%'
    time_to_effect:
      min_periods: 1
      max_periods: 4
  mechanism:
  - Targeted capacity shifts and backlog sweeps
  - Short-term throughput maximisation
  confidence:
    level: High
    rationale:
    - Backlog concentration is typically queue-specific
    - Tactical capacity levers are immediately available
operational_execution:
  stakeholders:
  - Workforce Management
  - Team Leads
  prerequisites:
  - Accurate queue-level backlog measurement
  - Flexible capacity allocation rules
  steps:
  - IDENTIFY queues with sustained backlog growth
  - REALLOCATE capacity or extend operating windows for this queue backlog
  - EXECUTE backlog reduction waves targeting this queue or issue segment
  - MONITOR SLA and quality for this queue daily
  effort:
    level: Medium
    typical_duration_days: 21
  risks_and_tradeoffs:
  - Quality degradation under throughput pressure
  - Burnout from sustained capacity shifts
data_requirements:
  required_entities:
  - Queue
  - Channel
  semantic_dependencies:
    measures:
    - Backlog Count
    - SLA Attainment %
    - First Contact Resolution %
    - Tickets Created Count
    tables:
    - fact_support_cases
    - fact_workforce_management
    - dim_case_queue
    - dim_org
automation:
  detection:
    enabled: true
    evaluation_frequency: daily
    output: Queues with structurally growing backlog
  suggested_actions:
    enabled: true
    outputs:
    - Capacity rebalancing and backlog sweep actions
  copilot_prompts: []
tracking:
  execution_log:
    enabled: true
    recommended_storage: fact_action_execution
    minimum_fields:
    - ActionCode
    - Queue
    - Channel
    - TriggerLevel
    - ExecutedDate
  outcome_evaluation:
    enabled: true
    recommended_storage: fact_action_outcome
    minimum_fields:
    - ActionCode
    - Pre_Backlog_Count
    - Post_Backlog_Count_21d
governance:
  approvals_required:
  - Head of Service Operations
  rollback_plan:
  - Revert capacity shifts if quality KPIs deteriorate
  documentation_links:
  - core/usecases/core/XD-001_Service_Level_Performance/Business_Factsheet.md
quality_rules:
- All kpi_id values must exist in KPI catalog.
- Trigger severity must be strictly increasing from L1 to L3.
- impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis.
- If status=deprecated then lifecycle.replaced_by is required.
- 'No free-text trigger notes: use gating_rules and structured filters.'
