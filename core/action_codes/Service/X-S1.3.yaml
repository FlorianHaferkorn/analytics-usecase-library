schema_version: '2.0'
id: X-S1.3
name: Quality & First-Contact Resolution Uplift
owner_domain: CX / Quality Management
impact_dimension: Quality & Yield
status: active
owner_role: quality_and_training_lead
steward_role: cx_quality_management_bi_lead
use_case_links:
  core_use_cases:
  - XD-001
  related_use_cases:
  - XD-002
kpis:
  trigger_kpis:
  - KPI-SVC-005
  - KPI-SVC-008
  guardrail_kpis:
  - KPI-SVC-006
  outcome_kpis:
  - KPI-SVC-005
  - KPI-SVC-008
  - KPI-CUS-003
scope:
  default_grain: queue_agent_week
  default_perspective:
  - Queue
  - Agent Group
  supported_slices:
  - Issue Category
  - Customer Segment
  exclusions:
  - Low-volume expert queues
  - Regulatory-mandated escalations
  - Incident-driven spikes
trigger:
  type: Deviation
  evaluation:
    grain: queue_agent_week
    window:
      kind: rolling
      length: 4
      unit: weeks
    persistence:
      required: true
      min_consecutive_periods: 2
    minimum_data:
      min_observations: 2
      volume_guardrail:
        enabled: true
        metric_kpi_id: KPI-SVC-014
        comparator: gte
        value: 200
        unit: count
  levels:
    L1:
      severity: EarlyWarning
      condition:
        metric_kpi_id: KPI-SVC-005
        comparator: lt
        threshold:
          basis: absolute
          value: 75.0
          unit: '%'
        filters: []
    L2:
      severity: RequiredIntervention
      condition:
        metric_kpi_id: KPI-SVC-005
        comparator: lt
        threshold:
          basis: absolute
          value: 65.0
          unit: '%'
        filters: []
    L3:
      severity: PrescriptiveExecution
      condition:
        metric_kpi_id: KPI-SVC-005
        comparator: lt
        threshold:
          basis: absolute
          value: 55.0
          unit: '%'
        filters: []
  gating_rules:
  - Trigger only if repeat contacts drive backlog growth
  - Do not trigger if low FCR is caused by missing authority to resolve
  - Exclude queues with active capacity stabilisation actions
impact_valuation:
  method: CostAvoidance
  currency: EUR
  success_window:
    duration: P30D
    metric_kpi_id: KPI-SVC-007
    success_criteria:
      kind: return_to_baseline
      baseline_window: P30D
  calculation_logic:
    standardized: "RealizedEUR = Cleared_Backlog_Items * Avg_Cost_Per_Delayed_Case"
  required_measures:
  - Backlog Count
  - Cost Per Delayed Case
  - Action Execution Count
  attribution:
    method: before_after
impact:
  category: High
  expected_range:
    metric_kpi_id: KPI-SVC-005
    value_low: 5.0
    value_high: 12.0
    unit: pp
    time_to_effect:
      min_periods: 2
      max_periods: 6
  mechanism:
  - Improved resolution quality reduces repeat contacts
  - Lower escalations stabilise SLA and backlog
  confidence:
    level: Medium
    rationale:
    - Effectiveness depends on training uptake
    - Knowledge improvements compound over time
operational_execution:
  stakeholders:
  - Service Operations
  - Knowledge Management
  prerequisites:
  - Root-cause tagging of repeat contacts
  - Accessible knowledge base and coaching capacity
  steps:
  - IDENTIFY cases with low first-contact resolution by queue/agent group
  - DIAGNOSE top repeat-contact drivers for this case type
  - DEPLOY targeted coaching, scripts, or knowledge updates for this case type
  - REVIEW FCR and escalations for this case type bi-weekly
  effort:
    level: Medium
    typical_duration_days: 90
  risks_and_tradeoffs:
  - Temporary AHT increase during learning phase
  - Uneven quality uplift across agents
data_requirements:
  required_entities:
  - Queue
  - Agent Group
  semantic_dependencies:
    measures:
    - First Contact Resolution %
    - Escalation %
    - AHT (Minutes)
    - Tickets Closed Count
    tables:
    - fact_support_cases
    - fact_nps
    - dim_case_queue
    - dim_org
automation:
  detection:
    enabled: true
    evaluation_frequency: weekly
    output: Queues and agent groups with persistent low FCR
  suggested_actions:
    enabled: true
    outputs:
    - Targeted quality and coaching actions
  copilot_prompts: []
tracking:
  execution_log:
    enabled: true
    recommended_storage: fact_action_execution
    minimum_fields:
    - ActionCode
    - Queue
    - AgentGroup
    - TriggerLevel
    - ExecutedDate
  outcome_evaluation:
    enabled: true
    recommended_storage: fact_action_outcome
    minimum_fields:
    - ActionCode
    - Pre_FCR_Pct
    - Post_FCR_Pct_90d
governance:
  approvals_required:
  - Head of CX / Quality
  rollback_plan:
  - Pause coaching if AHT degradation exceeds tolerance
  documentation_links:
  - core/usecases/core/XD-001_Service_Level_Performance/Business_Factsheet.md
quality_rules:
- All kpi_id values must exist in KPI catalog.
- Trigger severity must be strictly increasing from L1 to L3.
- impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis.
- If status=deprecated then lifecycle.replaced_by is required.
- 'No free-text trigger notes: use gating_rules and structured filters.'
