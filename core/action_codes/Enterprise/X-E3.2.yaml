schema_version: '2.0'
id: X-E3.2
name: Cross-Domain Risk Prioritisation
owner_domain: Strategy / Enterprise Controlling
impact_dimension: Risk Management
status: active
owner_role: head_of_enterprise_controlling
steward_role: enterprise_bi_lead
use_case_links:
  core_use_cases:
  - XD-003
  related_use_cases:
  - COM-001
  - COM-002
  - COM-003
  - COM-004
  - FIN-001
  - FIN-002
  - OPS-001
  - OPS-002
  - OPS-003
  - SCM-001
  - SCM-002
  - SCM-003
  - XD-001
  - XD-002
kpis:
  trigger_kpis:
  - sales.net_sales.delta_pct.ly
  - margin.gm.pct
  - svc.sla.attainment.pct
  - ops.otif.pct
  - ops.working_capital.ccc.days
  - people.attrition_risk.pct
  - people.digital_adoption.pct
  guardrail_kpis: []
  outcome_kpis:
  - enterprise.value_at_risk.index
scope:
  default_grain: entity_month
  default_perspective:
  - Business Unit
  - Region
  supported_slices:
  - Domain
  - Risk Category
  exclusions:
  - Single-KPI local deviations
  - Domain-specific execution logic
  - Non-material short-term noise
trigger:
  type: CompositeDeviation
  evaluation:
    grain: entity_month
    window:
      kind: rolling
      length: 2
      unit: periods
    persistence:
      required: true
      min_consecutive_periods: 1
    minimum_data:
      min_observations: 1
  levels:
    L1:
      severity: RiskSignal
      condition:
        composite_rule:
          description: Elevated downside risk in at least one domain
        filters: []
    L2:
      severity: MaterialRisk
      condition:
        composite_rule:
          description: Multiple domains contributing to downside risk
        filters: []
    L3:
      severity: CriticalRisk
      condition:
        composite_rule:
          description: High aggregated value-at-risk with enterprise impact
        filters: []
  gating_rules:
  - Trigger only for entities with cross-domain exposure
  - Limit output to top N risk items per cycle
  - Exclude risks already mitigated by active domain actions
impact_valuation:
  method: RiskAvoidance
  currency: EUR
  success_window:
    duration: P60D
    metric_kpi_id: enterprise.action_outcome_rate.pct
    success_criteria:
      kind: threshold_met
      baseline_window: P90D
  calculation_logic:
    standardized: "RealizedEUR = Improved_Outcome_Rate * Total_Actions * Avg_Action_Value"
  required_measures:
  - Action Outcome Rate %
  - Action Count
  - Action Value
  - Action Execution Count
  attribution:
    method: before_after
impact:
  category: High
  expected_range:
    metric_kpi_id: enterprise.value_at_risk.index
    value_low: -10.0
    value_high: -30.0
    unit: '%'
    time_to_effect:
      min_periods: 0
      max_periods: 1
  mechanism:
  - Aggregation of domain KPI downside into a single prioritisation index
  - Executive focus on the most material risks
  confidence:
    level: Medium
    rationale:
    - Depends on quality of risk weighting logic
    - Does not rely on execution effectiveness
operational_execution:
  stakeholders:
  - Strategy
  - Finance
  - Domain Leads
  prerequisites:
  - Approved risk weighting and materiality model
  - Consistent KPI target definitions
  steps:
  - AGGREGATE downside deviation per KPI for this entity
  - WEIGHT by financial and strategic materiality for this entity
  - RANK this entity by total value-at-risk
  - PROVIDE prioritised risk list for this entity to executives
  effort:
    level: Low
    typical_duration_days: 7
  risks_and_tradeoffs:
  - Overweighting financially large but strategically minor risks
  - False precision in composite indices
data_requirements:
  required_entities:
  - Business Unit
  - Region
  semantic_dependencies:
    measures:
    - Net Sales % vs LY
    - Gross Margin %
    - Service Level %
    - Ops OTIF %
    - Cash Conversion Cycle (Days)
    - Attrition Risk %
    - Digital Adoption %
    tables:
    - fact_kpi_snapshot
    - fact_risk_weights
    - dim_entity
    - dim_region
automation:
  detection:
    enabled: true
    evaluation_frequency: monthly
    output: Ranked list of cross-domain risks by entity
  suggested_actions:
    enabled: true
    outputs:
    - Prioritised entities and domains for executive review
  copilot_prompts: []
tracking:
  execution_log:
    enabled: true
    recommended_storage: fact_risk_prioritisation
    minimum_fields:
    - ActionCode
    - Entity
    - RiskScore
    - SeverityLevel
    - EvaluationDate
  outcome_evaluation:
    enabled: false
governance:
  approvals_required:
  - CFO
  - Chief Strategy Officer
  rollback_plan:
  - Revert to single-domain routing if composite risk logic misleads
  documentation_links:
  - core/usecases/core/XD-003_Executive_KPI_Overview/Business_Factsheet.md
quality_rules:
- XD-003 Action Codes must not introduce execution logic.
- Risk prioritisation must be based on aggregated KPI signals.
- Composite indices must be transparent and auditable.
- If status=deprecated then lifecycle.replaced_by is required.
