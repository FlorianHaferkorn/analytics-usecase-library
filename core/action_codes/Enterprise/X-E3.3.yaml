schema_version: "1.1"

id: "X-E3.3"
name: "Action Follow-up & Outcome Governance"
owner_domain: "Executive Office / PMO"
impact_dimension: "Execution Accountability"

status: "active"
lifecycle:
  introduced_date: "2025-12-18"
  deprecated_date: null
  replaced_by: null
  change_notes: []

category:
  group: "Executive Accountability"
  theme: "Ensure Routed Actions Are Executed and Outcomes Measured"

tags: ["executive", "governance", "follow-up", "outcomes"]

strategic_alignment:
  strategic_kpis:
    - id: "enterprise.action_outcome_rate.pct"
      role: "primary"
  decisions_enabled:
    - "Detect missing or delayed execution of routed Action Codes"
    - "Assess whether KPI trajectory improved post-intervention"
    - "Escalate non-effective or non-executed actions"
  non_goals:
    - "Re-executing or modifying domain Action Codes"
    - "Introducing new remediation logic"
    - "Overriding domain ownership or thresholds"

use_case_links:
  core_use_cases:
    - "XD-003"
  related_use_cases:
    - "COM-001"
    - "COM-002"
    - "COM-003"
    - "COM-004"
    - "FIN-001"
    - "FIN-002"
    - "OPS-001"
    - "OPS-002"
    - "OPS-003"
    - "SCM-001"
    - "SCM-002"
    - "SCM-003"
    - "XD-001"
    - "XD-002"

kpis:
  trigger_kpis:
    - kpi_id: "enterprise.action_routed.count"
      label: "Actions Routed Count"
      semantic_ref: { model_domain: "Enterprise", measure: "Actions Routed Count" }
  guardrail_kpis: []
  outcome_kpis:
    - kpi_id: "enterprise.action_outcome_rate.pct"
      label: "Action Outcome Rate %"
      semantic_ref: { model_domain: "Enterprise", measure: "Action Outcome Rate %" }

scope:
  default_grain: "action_instance"
  default_perspective: ["Domain", "Entity"]
  supported_slices:
    - "Severity Level"
    - "Executive Priority"
  exclusions:
    - "Domain execution logic"
    - "Re-triggering domain Action Codes"
    - "Operational KPI threshold tuning"

trigger:
  type: "LifecycleDeviation"
  evaluation:
    grain: "action_instance"
    window:
      kind: "fixed"
      length: 90
      unit: "days"
    persistence:
      required: false
      min_consecutive_periods: 0
    minimum_data:
      min_observations: 1
  levels:
    L1:
      severity: "Monitoring"
      condition:
        lifecycle_rule:
          description: "Action routed but not yet completed"
        filters: []
    L2:
      severity: "Delayed"
      condition:
        lifecycle_rule:
          description: "Action not executed within agreed SLA"
        filters: []
    L3:
      severity: "Ineffective"
      condition:
        lifecycle_rule:
          description: "Action executed but no KPI improvement observed"
        filters: []
  gating_rules:
    - "Outcome evaluation only after domain-defined evaluation window"
    - "Do not escalate if follow-up window not elapsed"
    - "Exclude actions explicitly marked as informational"

impact:
  category: "High"
  expected_range:
    metric_kpi_id: "enterprise.action_outcome_rate.pct"
    value_low: 10.0
    value_high: 25.0
    unit: "pp"
    time_to_effect:
      min_periods: 1
      max_periods: 3
  mechanism:
    - "Visibility of execution gaps at executive level"
    - "Pressure for closure and measurable impact"
  confidence:
    level: "High"
    rationale:
      - "Pure governance and transparency effect"
      - "No dependency on operational levers"

operational_execution:
  primary_owner_role: "Chief of Staff / PMO Lead"
  stakeholders:
    - "Domain Executives"
    - "Strategy"
    - "Enterprise Controlling"
  prerequisites:
    - "Action routing and execution logging in place"
    - "Defined evaluation windows per domain Action Code"
  steps:
    - "Track routed Action Codes and execution status"
    - "Evaluate KPI trajectory post-action window"
    - "Escalate delayed or ineffective actions"
    - "Report outcomes to executive committee"
  effort:
    level: "Low"
    typical_duration_days: 30
  risks_and_tradeoffs:
    - "False negatives if evaluation window is mis-sized"
    - "Perceived micromanagement by domains"

data_requirements:
  required_entities:
    - "Action Instance"
    - "Domain"
  semantic_dependencies:
    measures:
      - "Actions Routed Count"
      - "Action Outcome Rate %"
    tables:
      - "fact_action_routing"
      - "fact_action_execution"
      - "fact_action_outcome"

automation:
  detection:
    enabled: true
    evaluation_frequency: "monthly"
    output: "List of delayed or ineffective Action Codes"
  suggested_actions:
    enabled: true
    outputs:
      - "Escalation and follow-up signals"
  copilot_prompts: []

tracking:
  execution_log:
    enabled: true
    recommended_storage: "fact_action_governance"
    minimum_fields:
      - "ActionCode"
      - "DomainActionCode"
      - "Entity"
      - "Status"
      - "EvaluationDate"
  outcome_evaluation:
    enabled: true
    recommended_storage: "fact_action_outcome"
    minimum_fields:
      - "ActionCode"
      - "DomainActionCode"
      - "Pre_KPI_Value"
      - "Post_KPI_Value"

governance:
  approvals_required:
    - "CEO"
    - "Chief of Staff"
  rollback_plan:
    - "Suspend escalations if governance noise outweighs value"
  documentation_links:
    - "framework/usecases/core/XD-003_Executive_KPI_Overview/Business_Factsheet.md"

quality_rules:
  - "XD-003 Action Codes must not introduce execution logic."
  - "Outcome evaluation must reference domain-defined KPIs."
  - "Escalation must be lifecycle-based, not KPI-threshold-based."
  - "If status=deprecated then lifecycle.replaced_by is required."
