schema_version: '2.0'
id: X-E3.3
name: Executive Action Governance
owner_domain: Executive Office / PMO
impact_dimension: Execution Accountability
status: active
owner_role: chief_of_staff_pmo_lead
steward_role: executive_office_pmo_bi_lead
use_case_links:
  core_use_cases:
  - XD-004
  related_use_cases:
  - XD-003
  - COM-001
  - COM-002
  - COM-003
  - COM-004
  - FIN-001
  - FIN-002
  - OPS-001
  - OPS-002
  - OPS-003
  - SCM-001
  - SCM-002
  - SCM-003
  - XD-001
  - XD-002
kpis:
  trigger_kpis:
  - KPI-GOV-003
  guardrail_kpis: []
  outcome_kpis:
  - KPI-GOV-001
scope:
  default_grain: action_instance
  default_perspective:
  - Domain
  - Entity
  supported_slices:
  - Severity Level
  - Executive Priority
  exclusions:
  - Domain execution logic
  - Re-triggering domain Action Codes
  - Operational KPI threshold tuning
trigger:
  type: LifecycleDeviation
  evaluation:
    grain: action_instance
    window:
      kind: fixed
      length: 90
      unit: days
    persistence:
      required: false
      min_consecutive_periods: 0
    minimum_data:
      min_observations: 1
  levels:
    L1:
      severity: Monitoring
      condition:
        lifecycle_rule:
          description: Action routed but not yet completed within the expected follow-up window.
        filters: []
    L2:
      severity: Delayed
      condition:
        lifecycle_rule:
          description: Action not executed within the agreed service level.
        filters: []
    L3:
      severity: Ineffective
      condition:
        lifecycle_rule:
          description: Action completed but intended KPI improvement not achieved.
        filters: []
  gating_rules:
  - Outcome evaluation only after the domain-specific review window elapsed.
  - Exclude actions explicitly marked as informational or observation-only.
  - Do not re-route actions already owned by an executive escalation.
impact_valuation:
  method: RiskAvoidance
  currency: EUR
  success_window:
    duration: P30D
    metric_kpi_id: KPI-GOV-003
    success_criteria:
      kind: threshold_met
      baseline_window: P60D
  calculation_logic:
    standardized: "RealizedEUR = Improved_Routing_Rate * Total_Actions * Avg_Time_Saved * Hourly_Cost"
  required_measures:
  - Routed Action Count
  - Time Saved
  - Hourly Cost
  - Action Execution Count
  attribution:
    method: before_after
impact:
  category: High
  expected_range:
    metric_kpi_id: KPI-GOV-001
    value_low: 10.0
    value_high: 25.0
    unit: pp
    time_to_effect:
      min_periods: 1
      max_periods: 3
  mechanism:
  - Visibility of delayed or ineffective action execution.
  - Escalation pressure on ownership gaps and missing follow-through.
  confidence:
    level: High
    rationale:
    - Governance transparency effect is directly observable.
    - No dependency on domain-specific remediation logic.
operational_execution:
  stakeholders:
  - Executive Office
  - PMO
  - Domain Executives
  prerequisites:
  - Routed actions logged with owner, due date, and status.
  - Outcome evaluation criteria defined per domain action code.
  steps:
  - TRACK routed Action Codes at action-instance level with owner and due date.
  - EVALUATE completion status and elapsed time for each routed action.
  - ASSESS post-action KPI movement once the evaluation window is complete.
  - ESCALATE delayed or ineffective actions to the executive governance forum.
  effort:
    level: Low
    typical_duration_days: 30
  risks_and_tradeoffs:
  - False negatives if outcome windows are too short.
  - Governance noise if informational actions are not filtered out.
data_requirements:
  required_entities:
  - Action Instance
  - Domain Action Code
  - Entity
  semantic_dependencies:
    measures:
    - Actions Routed Count
    - Action Outcome Rate %
    tables:
    - fact_action_governance
    - dim_action_code
    - dim_org
automation:
  detection:
    enabled: true
    evaluation_frequency: monthly
    output: List of delayed or ineffective Action Codes by owner and entity
  suggested_actions:
    enabled: true
    outputs:
    - Executive escalation queue
    - Ownership and SLA breach summary
  copilot_prompts: []
tracking:
  execution_log:
    enabled: true
    recommended_storage: fact_action_governance
    minimum_fields:
    - ActionCode
    - DomainActionCode
    - ActionInstanceId
    - Entity
    - OwnerRole
    - Status
    - DueDate
    - EvaluationDate
  outcome_evaluation:
    enabled: true
    recommended_storage: fact_action_governance
    minimum_fields:
    - ActionCode
    - DomainActionCode
    - ActionInstanceId
    - OutcomeSuccessFlag
    - PreKPIValue
    - PostKPIValue
governance:
  approvals_required:
  - CEO
  - Chief of Staff
  rollback_plan:
  - Suspend executive escalation if governance noise outweighs decision value.
  documentation_links:
  - core/usecases/core/XD-004_Executive_Action_Governance/Business_Factsheet.md
quality_rules:
- Executive governance must evaluate lifecycle quality, not domain remediation logic.
- Outcome evaluation must reference domain-defined KPIs and windows.
- Escalation must remain action-instance based and auditable.
- If status=deprecated then lifecycle.replaced_by is required.