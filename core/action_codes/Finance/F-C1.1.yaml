schema_version: '2.0'
id: F-C1.1
name: Working Capital Improvement
owner_domain: Finance
impact_dimension: Liquidity
status: active
owner_role: finance_director
steward_role: finance_bi_lead
use_case_links:
  core_use_cases:
  - FIN-001
  related_use_cases:
  - SCM-001
  - SCM-002
kpis:
  trigger_kpis:
  - wc.ccc.days
  - fin.cash.vs_plan.pct
  guardrail_kpis:
  - fin.cash.balance
  outcome_kpis:
  - wc.ccc.days
scope:
  default_grain: month
  default_perspective:
  - Legal Entity
  supported_slices:
  - Region
  exclusions:
  - One-off treasury movements
  - Seasonal effects already approved in forecast
  - Entities under restructuring programs
trigger:
  type: Deviation
  evaluation:
    grain: month
    window:
      kind: rolling
      length: 2
      unit: periods
    persistence:
      required: true
      min_consecutive_periods: 2
    minimum_data:
      min_observations: 1
      volume_guardrail:
        enabled: true
        metric_kpi_id: fin.cash.balance
        comparator: gte
        value: 500000
        unit: amount
  levels:
    L1:
      severity: EarlyWarning
      condition:
        metric_kpi_id: fin.cash.vs_plan.pct
        comparator: lt
        threshold:
          basis: absolute
          value: -5.0
          unit: pp
        filters: []
    L2:
      severity: RequiredIntervention
      condition:
        metric_kpi_id: wc.ccc.days
        comparator: gt
        threshold:
          basis: absolute
          value: 5
          unit: days
        filters: []
    L3:
      severity: PrescriptiveExecution
      condition:
        metric_kpi_id: wc.ccc.days
        comparator: gt
        threshold:
          basis: absolute
          value: 10
          unit: days
        filters: []
  gating_rules:
  - Trigger only if liquidity deviation is structural, not seasonal
  - Do not trigger if deterioration is fully explained by growth-driven inventory
    build
  - Exclude entities with active refinancing programs
impact:
  category: High
  expected_range:
    metric_kpi_id: wc.ccc.days
    value_low: -3
    value_high: -10
    unit: days
    time_to_effect:
      min_periods: 1
      max_periods: 3
  mechanism:
  - Coordinated activation of DSO, DIO, or DPO actions
  - Faster response to emerging liquidity pressure
  confidence:
    level: High
    rationale:
    - Integrated view across WC levers
    - Proven effectiveness in liquidity steering
operational_execution:
  stakeholders:
  - Credit & Collections
  - Supply Chain
  - Procurement
  prerequisites:
  - Consistent WC KPI definitions across entities
  - Clear ownership of execution-level actions
  steps:
  - DETECT sustained CCC or cash-vs-plan deterioration for this entity
  - IDENTIFY the dominant working capital driver (DSO, DIO, or DPO) for this entity
  - TRIGGER the corresponding execution Action Code for this entity
  - REVIEW working capital impact for this entity monthly
  effort:
    level: Low
    typical_duration_days: 30
  risks_and_tradeoffs:
  - Over-triggering execution teams
  - Conflicting incentives across domains
data_requirements:
  required_entities:
  - Legal Entity
  - Region
  semantic_dependencies:
    measures:
    - Cash Conversion Cycle (Days)
    - Cash vs Plan %
    - Cash Balance
    tables:
    - fact_cash
    - fact_working_capital
    - dim_entity
automation:
  detection:
    enabled: true
    evaluation_frequency: monthly
    output: Entities with structural WC deterioration
  suggested_actions:
    enabled: true
    outputs:
    - Recommended WC lever activation (DSO / DIO / DPO)
  copilot_prompts: []
tracking:
  execution_log:
    enabled: true
    recommended_storage: fact_action_execution
    minimum_fields:
    - ActionCode
    - Entity
    - TriggerLevel
    - ActivatedLever
    - ExecutedDate
  outcome_evaluation:
    enabled: true
    recommended_storage: fact_action_outcome
    minimum_fields:
    - ActionCode
    - Pre_CCC_Days
    - Post_CCC_Days_90d
governance:
  approvals_required:
  - CFO
  rollback_plan:
  - Suspend WC escalation if operational disruption exceeds tolerance
  documentation_links:
  - core/usecases/core/FIN-001_Cash_Liquidity_Performance/Business_Factsheet.md
quality_rules:
- All kpi_id values must exist in KPI catalog.
- Trigger severity must be strictly increasing from L1 to L3.
- impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis.
- If status=deprecated then lifecycle.replaced_by is required.
- 'No free-text trigger notes: use gating_rules and structured filters.'
