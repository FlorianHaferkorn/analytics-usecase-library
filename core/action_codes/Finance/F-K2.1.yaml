schema_version: '2.0'
id: F-K2.1
name: Cost Take-Out Orchestration
owner_domain: Finance / Operations
impact_dimension: Profitability
status: active
owner_role: finance_director
steward_role: finance_bi_lead
use_case_links:
  core_use_cases:
  - FIN-002
  related_use_cases:
  - OPS-001
  - OPS-002
kpis:
  trigger_kpis:
  - cost.unit.amount
  - cost.opex.vs_plan.pct
  guardrail_kpis:
  - ops.labor.productivity.pct
  outcome_kpis:
  - cost.unit.amount
scope:
  default_grain: month
  default_perspective:
  - Plant
  - Product Category
  supported_slices:
  - Line
  exclusions:
  - One-off approved restructuring costs
  - Temporary cost spikes linked to ramp-ups
  - Sites under strategic transformation programs
trigger:
  type: Deviation
  evaluation:
    grain: month
    window:
      kind: rolling
      length: 2
      unit: periods
    persistence:
      required: true
      min_consecutive_periods: 2
    minimum_data:
      min_observations: 1
      volume_guardrail:
        enabled: true
        metric_kpi_id: cost.base_volume.amount
        comparator: gte
        value: 500000
        unit: amount
  levels:
    L1:
      severity: EarlyWarning
      condition:
        metric_kpi_id: cost.unit.amount
        comparator: gt
        threshold:
          basis: relative
          value: 2.0
          unit: '%'
        filters: []
    L2:
      severity: RequiredIntervention
      condition:
        metric_kpi_id: cost.unit.amount
        comparator: gt
        threshold:
          basis: relative
          value: 5.0
          unit: '%'
        filters: []
    L3:
      severity: PrescriptiveExecution
      condition:
        metric_kpi_id: cost.unit.amount
        comparator: gt
        threshold:
          basis: relative
          value: 8.0
          unit: '%'
        filters: []
  gating_rules:
  - Trigger only if deviation is structural, not volume-mix driven
  - Do not trigger if margin erosion is price-driven (handled in COM-002)
  - Exclude plants with approved cost increase programs
impact_valuation:
  method: CostAvoidance
  currency: EUR
  attribution:
    method: before_after
  success_window:
    duration: P90D
    metric_kpi_id: cost.cogs.amount
    success_criteria:
      kind: return_to_baseline
      baseline_window: P90D
  calculation_logic:
    standardized: "RealizedEUR = Pre_COGS - Post_COGS for targeted cost categories"
    latex: EUR = COGS_{pre} - COGS_{post}
  required_measures:
  - COGS Amount
  - Action Execution Count
impact:
  category: High
  expected_range:
    metric_kpi_id: cost.unit.amount
    value_low: 2.0
    value_high: 6.0
    unit: '%'
    time_to_effect:
      min_periods: 1
      max_periods: 3
  mechanism:
  - Focused activation of dominant cost driver actions
  - Avoidance of parallel, conflicting initiatives
  confidence:
    level: High
    rationale:
    - Clear orchestration improves execution effectiveness
    - Short decision loop at management level
operational_execution:
  stakeholders:
  - Operations Management
  - Procurement
  - Ops Controlling
  prerequisites:
  - Reliable unit cost decomposition by driver
  - Clear ownership of execution Action Codes
  steps:
  - DETECT sustained unit cost deterioration for this plant/product
  - IDENTIFY the dominant cost driver (Material, Labor, OpEx) for this plant/product
  - ACTIVATE the corresponding execution Action Code for this plant/product
  - REVIEW cost impact for this plant/product monthly
  effort:
    level: Low
    typical_duration_days: 30
  risks_and_tradeoffs:
  - Delayed execution if ownership unclear
  - Underreaction to multi-driver cost pressure
data_requirements:
  required_entities:
  - Plant
  - Product Category
  semantic_dependencies:
    measures:
    - Unit Cost Amount
    - OpEx vs Plan %
    - Labor Productivity %
    tables:
    - fact_cost
    - fact_output
    - fact_finance
    - fact_labor
    - dim_org
    - dim_product
automation:
  detection:
    enabled: true
    evaluation_frequency: monthly
    output: Plants and cost centers with structural unit cost increase
  suggested_actions:
    enabled: true
    outputs:
    - Recommended cost lever activation (Material / Labor / OpEx)
  copilot_prompts: []
tracking:
  execution_log:
    enabled: true
    recommended_storage: fact_action_execution
    minimum_fields:
    - ActionCode
    - Plant
    - ProductCategory
    - TriggerLevel
    - ActivatedLever
    - ExecutedDate
  outcome_evaluation:
    enabled: true
    recommended_storage: fact_action_outcome
    minimum_fields:
    - ActionCode
    - Pre_UnitCost
    - Post_UnitCost_90d
governance:
  approvals_required:
  - CFO
  - COO
  rollback_plan:
  - Suspend orchestration if execution domains report conflicting priorities
  documentation_links:
  - core/usecases/core/FIN-002_Cost_Performance/Business_Factsheet.md
quality_rules:
- All kpi_id values must exist in KPI catalog.
- Trigger severity must be strictly increasing from L1 to L3.
- impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis.
- If status=deprecated then lifecycle.replaced_by is required.
- 'No free-text trigger notes: use gating_rules and structured filters.'
