schema_version: '2.0'
id: F-C1.4
name: Payables Optimisation
owner_domain: Procurement / Accounts Payable
impact_dimension: Liquidity
status: active
owner_role: head_of_accounts_payable
steward_role: procurement_accounts_payable_bi_lead
use_case_links:
  core_use_cases:
  - FIN-001
  related_use_cases:
  - SCM-002
kpis:
  trigger_kpis:
  - wc.dpo.days
  guardrail_kpis:
  - scm.supplier_risk.score
  outcome_kpis:
  - wc.dpo.days
  - fin.cash.ocf
scope:
  default_grain: month
  default_perspective:
  - Supplier
  - Legal Entity
  supported_slices:
  - Region
  exclusions:
  - Suppliers under financial distress
  - Invoices with early-payment discounts already accepted
  - Intercompany payables
trigger:
  type: Deviation
  evaluation:
    grain: month
    window:
      kind: rolling
      length: 2
      unit: periods
    persistence:
      required: true
      min_consecutive_periods: 2
    minimum_data:
      min_observations: 1
      volume_guardrail:
        enabled: true
        metric_kpi_id: fin.liquidity.payables.amount
        comparator: gte
        value: 250000
        unit: amount
  levels:
    L1:
      severity: EarlyWarning
      condition:
        metric_kpi_id: wc.dpo.days
        comparator: lt
        threshold:
          basis: absolute
          value: -3
          unit: days
        filters: []
    L2:
      severity: RequiredIntervention
      condition:
        metric_kpi_id: wc.dpo.days
        comparator: lt
        threshold:
          basis: absolute
          value: -7
          unit: days
        filters: []
    L3:
      severity: PrescriptiveExecution
      condition:
        metric_kpi_id: wc.dpo.days
        comparator: lt
        threshold:
          basis: absolute
          value: -12
          unit: days
        filters: []
  gating_rules:
  - Trigger only if Supplier Risk Score remains within acceptable range
  - Do not trigger if early-payment discounts provide higher economic benefit
  - Exclude suppliers with contractual payment term freezes
impact_valuation:
  method: CashRelease
  currency: EUR
  attribution:
    method: before_after
  success_window:
    duration: P90D
    metric_kpi_id: wc.ccc.days
    success_criteria:
      kind: return_to_baseline
      baseline_window: P90D
  calculation_logic:
    standardized: "RealizedEUR = (Pre_CCC - Post_CCC) / 365 * Annual_Revenue"
    latex: EUR = \frac{CCC_{pre} - CCC_{post}}{365} \times Rev
  required_measures:
  - CCC Days
  - Revenue
  - Action Execution Count
impact:
  category: Medium
  expected_range:
    metric_kpi_id: wc.dpo.days
    value_low: 2
    value_high: 6
    unit: days
    time_to_effect:
      min_periods: 1
      max_periods: 3
  mechanism:
  - Later payment execution within agreed terms
  - Selective term renegotiation with low-risk suppliers
  confidence:
    level: Medium
    rationale:
    - Effectiveness depends on supplier portfolio flexibility
    - Guarded by supplier risk constraints
operational_execution:
  stakeholders:
  - Procurement
  - Finance Controlling
  - Treasury
  prerequisites:
  - Accurate invoice due-date and payment term data
  - Supplier risk classification available
  steps:
  - IDENTIFY suppliers driving early payment behaviour for this entity
  - ASSESS contractual flexibility and risk for this entity
  - ADJUST payment runs or renegotiate terms for this entity
  - MONITOR supplier performance and cash impact for this entity
  effort:
    level: Low to Medium
    typical_duration_days: 60
  risks_and_tradeoffs:
  - Supplier relationship tension
  - Potential loss of early-payment discounts
data_requirements:
  required_entities:
  - Supplier
  - Entity
  semantic_dependencies:
    measures:
    - DPO (Days)
    - Operating Cash Flow
    - Supplier Risk Score
    - AP Balance Amount
    tables:
    - fact_accounts_payable
    - fact_cash_flow
    - dim_supplier
    - dim_org
automation:
  detection:
    enabled: true
    evaluation_frequency: monthly
    output: Suppliers with early payment behaviour
  suggested_actions:
    enabled: true
    outputs:
    - Payment timing and term optimisation candidates
  copilot_prompts: []
tracking:
  execution_log:
    enabled: true
    recommended_storage: fact_action_execution
    minimum_fields:
    - ActionCode
    - Supplier
    - Entity
    - TriggerLevel
    - ExecutedDate
  outcome_evaluation:
    enabled: true
    recommended_storage: fact_action_outcome
    minimum_fields:
    - ActionCode
    - Pre_DPO_Days
    - Post_DPO_Days_60d
governance:
  approvals_required:
  - CFO
  - Head of Procurement
  rollback_plan:
  - Revert payment timing if supplier risk indicators deteriorate
  documentation_links:
  - core/usecases/core/FIN-001_Cash_Liquidity_Performance/Business_Factsheet.md
quality_rules:
- All kpi_id values must exist in KPI catalog.
- Trigger severity must be strictly increasing from L1 to L3.
- impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis.
- If status=deprecated then lifecycle.replaced_by is required.
- 'No free-text trigger notes: use gating_rules and structured filters.'
