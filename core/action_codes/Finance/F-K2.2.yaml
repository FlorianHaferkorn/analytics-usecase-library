schema_version: '2.0'
id: F-K2.2
name: Material Cost Discipline
owner_domain: Procurement / Operations
impact_dimension: Profitability
status: active
owner_role: head_of_procurement
steward_role: operations_bi_lead
use_case_links:
  core_use_cases:
  - FIN-002
  related_use_cases:
  - OPS-002
kpis:
  trigger_kpis:
  - KPI-SCM-020
  guardrail_kpis:
  - KPI-OPS-003
  outcome_kpis:
  - KPI-SCM-020
  - KPI-FIN-015
scope:
  default_grain: month
  default_perspective:
  - Plant
  - Product Category
  supported_slices:
  - Line
  exclusions:
  - Approved spec changes and engineering trials
  - One-off material price spikes with approved pass-through
  - Low-volume pilot products
trigger:
  type: Deviation
  evaluation:
    grain: month
    window:
      kind: rolling
      length: 2
      unit: periods
    persistence:
      required: true
      min_consecutive_periods: 2
    minimum_data:
      min_observations: 1
      volume_guardrail:
        enabled: true
        metric_kpi_id: KPI-FIN-019
        comparator: gte
        value: 300000
        unit: amount
  levels:
    L1:
      severity: EarlyWarning
      condition:
        metric_kpi_id: KPI-SCM-020
        comparator: gt
        threshold:
          basis: relative
          value: 2.0
          unit: '%'
        filters: []
    L2:
      severity: RequiredIntervention
      condition:
        metric_kpi_id: KPI-SCM-020
        comparator: gt
        threshold:
          basis: relative
          value: 5.0
          unit: '%'
        filters: []
    L3:
      severity: PrescriptiveExecution
      condition:
        metric_kpi_id: KPI-SCM-020
        comparator: gt
        threshold:
          basis: relative
          value: 8.0
          unit: '%'
        filters: []
  gating_rules:
  - Trigger only if yield remains within guardrails
  - Do not trigger if unit cost increase is labor-driven
  - Exclude plants under approved material transition programs
impact_valuation:
  method: CostAvoidance
  currency: EUR
  attribution:
    method: before_after
  success_window:
    duration: P90D
    metric_kpi_id: KPI-SCM-021
    success_criteria:
      kind: return_to_baseline
      baseline_window: P90D
  calculation_logic:
    standardized: "RealizedEUR = Pre_OpEx - Post_OpEx for targeted cost lines"
    latex: EUR = OpEx_{pre} - OpEx_{post}
  required_measures:
  - OpEx Amount
  - Action Execution Count
impact:
  category: Medium
  expected_range:
    metric_kpi_id: KPI-SCM-020
    value_low: 1.0
    value_high: 4.0
    unit: '%'
    time_to_effect:
      min_periods: 2
      max_periods: 4
  mechanism:
  - Reduced scrap and rework
  - Spec and sourcing discipline corrections
  confidence:
    level: Medium
    rationale:
    - Depends on process stability and supplier responsiveness
    - Guarded by yield constraints
operational_execution:
  stakeholders:
  - Plant Management
  - Quality
  - Ops Controlling
  prerequisites:
  - Material usage and scrap transparency
  - Clear escalation paths for spec deviations
  steps:
  - Identify plants/products with rising material cost share
  - Analyze scrap, yield, and spec adherence
  - Implement corrective sourcing or usage actions
  - Review material cost trend monthly
  effort:
    level: Medium
    typical_duration_days: 90
  risks_and_tradeoffs:
  - Quality risk if spec discipline is over-tightened
  - Supplier friction during corrective actions
data_requirements:
  required_entities:
  - Plant
  - Product
  semantic_dependencies:
    measures:
    - Material Cost %
    - Unit Cost Amount
    - Yield %
    tables:
    - fact_cost
    - fact_ops
    - fact_output
    - fact_quality
    - dim_org
    - dim_product
automation:
  detection:
    enabled: true
    evaluation_frequency: monthly
    output: Plants/products with material cost deviations
  suggested_actions:
    enabled: true
    outputs:
    - Material usage and sourcing correction candidates
  copilot_prompts: []
tracking:
  execution_log:
    enabled: true
    recommended_storage: fact_action_execution
    minimum_fields:
    - ActionCode
    - Plant
    - ProductCategory
    - TriggerLevel
    - ExecutedDate
  outcome_evaluation:
    enabled: true
    recommended_storage: fact_action_outcome
    minimum_fields:
    - ActionCode
    - Pre_MaterialCost_Pct
    - Post_MaterialCost_Pct_90d
governance:
  approvals_required:
  - Head of Procurement
  - COO
  rollback_plan:
  - Pause corrective actions if yield or quality deteriorates
  documentation_links:
  - core/usecases/core/FIN-002_Cost_Performance/Business_Factsheet.md
parameters:
- name: period
  type: period
  required: true
  grain: month
  source_field: scope.default_grain
- name: trigger_level
  type: trigger_level
  required: true
  allowed_values:
  - L1
  - L2
  - L3
  source_field: trigger.levels
- name: plant
  label: Plant
  type: dimension_member
  required: true
  binding: nicht_belegt
  source_field: scope.default_perspective
- name: product_category
  label: Product Category
  type: dimension_member
  required: true
  binding: nicht_belegt
  source_field: scope.default_perspective
- name: line
  label: Line
  type: dimension_member
  required: false
  binding: nicht_belegt
  source_field: scope.supported_slices
preconditions:
  combine: guardrails_all_and_trigger_any
  checks:
  - id: level_l1
    role: trigger
    kind: kpi_level
    ref: trigger.levels.L1.condition
    kpi_id: KPI-SCM-020
    pruefbar: true
  - id: level_l2
    role: trigger
    kind: kpi_level
    ref: trigger.levels.L2.condition
    kpi_id: KPI-SCM-020
    pruefbar: true
  - id: level_l3
    role: trigger
    kind: kpi_level
    ref: trigger.levels.L3.condition
    kpi_id: KPI-SCM-020
    pruefbar: true
  - id: volume_guardrail
    role: guardrail
    kind: volume_guardrail
    ref: trigger.evaluation.minimum_data.volume_guardrail
    kpi_id: KPI-FIN-019
    pruefbar: true
permitted_role:
  source_field: governance.approvals_required
  roles:
  - approver: Head of Procurement
    role_id: head_of_procurement
  - approver: COO
    role_id: nicht_belegt
review:
  required: true
  state: vorgeschlagen
quality_rules:
- All kpi_id values must exist in KPI catalog.
- Trigger severity must be strictly increasing from L1 to L3.
- impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis.
- If status=deprecated then lifecycle.replaced_by is required.
- 'No free-text trigger notes: use gating_rules and structured filters.'
