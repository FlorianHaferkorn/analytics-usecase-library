confidence: high
evidence_source_url: "https://www.pwc.com/gx/en/services/advisory/deals/business-recovery-restructuring/working-capital-report.html"
owner: Head of Credit & Collections / Finance Director
assumptions:
  - "Annual revenue in scope 200M EUR; DSO reduction of 2-6 days frees cash at 548k EUR per day on 200M EUR revenue base."
  - "Cash benefit formula: DSO_reduction_days x (Annual_Revenue / 365); cost of capital 5% per annum applied."
  - "Disputed receivables and legally blocked accounts excluded; collections team effort modeled at 0.5-1.0 FTE."
  - "Range reflects customer mix: min (single large account focused campaign) to max (systematic portfolio-wide programme)."
  - "Relationship risk factored into medium assumptions; strategic customer exceptions modeled separately."
