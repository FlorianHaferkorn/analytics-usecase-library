schema_version: "1.1"

id: "F-C1.2"
name: "Collections Acceleration"
owner_domain: "Finance / Credit & Collections"
impact_dimension: "Liquidity"

status: "active"
lifecycle:
  introduced_date: "2025-12-18"
  deprecated_date: null
  replaced_by: null
  change_notes: []

category:
  group: "Receivables Control"
  theme: "Accelerate Cash Inflow"

tags: ["dso", "collections", "receivables"]

strategic_alignment:
  strategic_kpis:
    - id: "wc.dso.days"
      role: "primary"
    - id: "fin.cash.ocf"
      role: "secondary"
  decisions_enabled:
    - "Prioritise collection efforts on overdue and high-exposure receivables"
    - "Escalate enforcement actions within policy guardrails"
  non_goals:
    - "Credit policy redesign or scoring model changes"
    - "Customer acquisition or pricing concessions"
    - "Handling of disputed receivables beyond escalation"

use_case_links:
  core_use_cases:
    - "FIN-001"
  related_use_cases:
    - "COM-003"

kpis:
  trigger_kpis:
    - kpi_id: "wc.dso.days"
      label: "Days Sales Outstanding (Days)"
      semantic_ref:
        model_domain: "Finance"
        measure: "DSO (Days)"
  guardrail_kpis:
    - kpi_id: "fin.cash.balance"
      label: "Cash Balance"
      semantic_ref:
        model_domain: "Finance"
        measure: "Cash Balance"
  outcome_kpis:
    - kpi_id: "wc.dso.days"
      label: "Days Sales Outstanding (Days)"
      semantic_ref:
        model_domain: "Finance"
        measure: "DSO (Days)"
    - kpi_id: "fin.cash.ocf"
      label: "Operating Cash Flow"
      semantic_ref:
        model_domain: "Finance"
        measure: "Operating Cash Flow"

scope:
  default_grain: "month"
  default_perspective: ["Customer", "Legal Entity"]
  supported_slices:
    - "Region"
  exclusions:
    - "Disputed receivables with open claims"
    - "Customers under formal insolvency proceedings"
    - "Intercompany receivables"

trigger:
  type: "Deviation"
  evaluation:
    grain: "month"
    window:
      kind: "rolling"
      length: 2
      unit: "periods"
    persistence:
      required: true
      min_consecutive_periods: 2
    minimum_data:
      min_observations: 1
      volume_guardrail:
        enabled: true
        metric_kpi_id: "fin.cash.balance"
        comparator: "gte"
        value: 300000
        unit: "amount"
  levels:
    L1:
      severity: "EarlyWarning"
      condition:
        metric_kpi_id: "wc.dso.days"
        comparator: "gt"
        threshold:
          basis: "absolute"
          value: 3
          unit: "days"
        filters: []
    L2:
      severity: "RequiredIntervention"
      condition:
        metric_kpi_id: "wc.dso.days"
        comparator: "gt"
        threshold:
          basis: "absolute"
          value: 7
          unit: "days"
        filters: []
    L3:
      severity: "PrescriptiveExecution"
      condition:
        metric_kpi_id: "wc.dso.days"
        comparator: "gt"
        threshold:
          basis: "absolute"
          value: 12
          unit: "days"
        filters: []
  gating_rules:
    - "Exclude receivables flagged as disputed or legally blocked"
    - "Do not trigger if DSO increase is driven solely by approved term extensions"
    - "Suspend escalation for strategic customers under negotiation"

impact:
  category: "High"
  expected_range:
    metric_kpi_id: "wc.dso.days"
    value_low: -2
    value_high: -6
    unit: "days"
    time_to_effect:
      min_periods: 1
      max_periods: 2
  mechanism:
    - "Focused follow-up on overdue invoices"
    - "Faster dispute resolution and enforcement"
  confidence:
    level: "High"
    rationale:
      - "Direct cash-in lever"
      - "Short operational cycle time"

operational_execution:
  primary_owner_role: "Head of Credit & Collections"
  stakeholders:
    - "Sales Account Leads"
    - "Finance Controlling"
  prerequisites:
    - "Up-to-date aging and dispute flags"
    - "Clear escalation and approval matrix"
  steps:
    - "Identify customers driving DSO deterioration"
    - "Prioritise invoices by age and exposure"
    - "Execute reminders, calls, and escalations"
    - "Review cash-in impact weekly"
  effort:
    level: "Medium"
    typical_duration_days: 45
  risks_and_tradeoffs:
    - "Customer relationship strain"
    - "Increased workload for collections team"

data_requirements:
  required_entities:
    - "Customer"
    - "Legal Entity"
  semantic_dependencies:
    measures:
      - "DSO (Days)"
      - "Operating Cash Flow"
      - "Cash Balance"
    tables:
      - "fact_ar"
      - "fact_cash"
      - "dim_customer"
      - "dim_entity"

automation:
  detection:
    enabled: true
    evaluation_frequency: "monthly"
    output: "Customers and invoices driving DSO increase"
  suggested_actions:
    enabled: true
    outputs:
      - "Prioritised collections worklist"
  copilot_prompts: []

tracking:
  execution_log:
    enabled: true
    recommended_storage: "fact_action_execution"
    minimum_fields:
      - "ActionCode"
      - "CustomerKey"
      - "Entity"
      - "TriggerLevel"
      - "ExecutedDate"
  outcome_evaluation:
    enabled: true
    recommended_storage: "fact_action_outcome"
    minimum_fields:
      - "ActionCode"
      - "Pre_DSO_Days"
      - "Post_DSO_Days_60d"

governance:
  approvals_required:
    - "Finance Director"
  rollback_plan:
    - "De-escalate enforcement if customer churn risk increases"
  documentation_links:
    - "core/usecases/core/FIN-001_Cash_Liquidity_Performance/Business_Factsheet.md"

quality_rules:
  - "All kpi_id values must exist in KPI catalog."
  - "Trigger severity must be strictly increasing from L1 to L3."
  - "impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis."
  - "If status=deprecated then lifecycle.replaced_by is required."
  - "No free-text trigger notes: use gating_rules and structured filters."
