schema_version: '2.0'
id: F-C1.2
name: Collections Acceleration
owner_domain: Finance / Credit & Collections
impact_dimension: Liquidity
status: active
owner_role: head_of_credit_and_collections
steward_role: finance_bi_lead
use_case_links:
  core_use_cases:
  - FIN-001
  related_use_cases:
  - COM-003
kpis:
  trigger_kpis:
  - KPI-FIN-001
  guardrail_kpis:
  - KPI-FIN-007
  outcome_kpis:
  - KPI-FIN-001
  - KPI-FIN-009
scope:
  default_grain: month
  default_perspective:
  - Customer
  - Legal Entity
  supported_slices:
  - Region
  exclusions:
  - Disputed receivables with open claims
  - Customers under formal insolvency proceedings
  - Intercompany receivables
trigger:
  type: Deviation
  evaluation:
    grain: month
    window:
      kind: rolling
      length: 2
      unit: periods
    persistence:
      required: true
      min_consecutive_periods: 2
    minimum_data:
      min_observations: 1
      volume_guardrail:
        enabled: true
        metric_kpi_id: KPI-FIN-007
        comparator: gte
        value: 300000
        unit: amount
  levels:
    L1:
      severity: EarlyWarning
      condition:
        metric_kpi_id: KPI-FIN-001
        comparator: gt
        threshold:
          basis: absolute
          reference: baseline
          value: 3
          unit: days
        filters: []
    L2:
      severity: RequiredIntervention
      condition:
        metric_kpi_id: KPI-FIN-001
        comparator: gt
        threshold:
          basis: absolute
          reference: baseline
          value: 7
          unit: days
        filters: []
    L3:
      severity: PrescriptiveExecution
      condition:
        metric_kpi_id: KPI-FIN-001
        comparator: gt
        threshold:
          basis: absolute
          reference: baseline
          value: 12
          unit: days
        filters: []
  gating_rules:
  - Exclude receivables flagged as disputed or legally blocked
  - Do not trigger if DSO increase is driven solely by approved term extensions
  - Suspend escalation for strategic customers under negotiation
impact_valuation:
  method: CashRelease
  currency: EUR
  attribution:
    method: before_after
  success_window:
    duration: P60D
    metric_kpi_id: KPI-FIN-005
    success_criteria:
      kind: threshold_met
      baseline_window: P60D
  calculation_logic:
    standardized: "RealizedEUR = (Post_DPO - Pre_DPO) / 365 * Annual_COGS"
    latex: EUR = \frac{DPO_{post} - DPO_{pre}}{365} \times COGS
  required_measures:
  - DPO Days
  - COGS
  - Action Execution Count
impact:
  category: High
  expected_range:
    metric_kpi_id: KPI-FIN-001
    value_low: -2
    value_high: -6
    unit: days
    time_to_effect:
      min_periods: 1
      max_periods: 2
  mechanism:
  - Focused follow-up on overdue invoices
  - Faster dispute resolution and enforcement
  confidence:
    level: High
    rationale:
    - Direct cash-in lever
    - Short operational cycle time
operational_execution:
  stakeholders:
  - Sales Account Leads
  - Finance Controlling
  prerequisites:
  - Up-to-date aging and dispute flags
  - Clear escalation and approval matrix
  steps:
  - IDENTIFY customers driving DSO deterioration for this entity
  - PRIORITISE invoices by age and exposure within this entity
  - EXECUTE reminders, calls, and escalations for this entity
  - REVIEW cash-in impact for this entity weekly
  effort:
    level: Medium
    typical_duration_days: 45
  risks_and_tradeoffs:
  - Customer relationship strain
  - Increased workload for collections team
data_requirements:
  required_entities:
  - Customer
  - Entity
  semantic_dependencies:
    measures:
    - DSO (Days)
    - Operating Cash Flow
    - Cash Balance
    tables:
    - fact_accounts_receivable
    - fact_cash_position
    - fact_cash_flow
    - dim_customer
    - dim_org
automation:
  detection:
    enabled: true
    evaluation_frequency: monthly
    output: Customers and invoices driving DSO increase
  suggested_actions:
    enabled: true
    outputs:
    - Prioritised collections worklist
  copilot_prompts: []
tracking:
  execution_log:
    enabled: true
    recommended_storage: fact_action_execution
    minimum_fields:
    - ActionCode
    - CustomerKey
    - Entity
    - TriggerLevel
    - ExecutedDate
  outcome_evaluation:
    enabled: true
    recommended_storage: fact_action_outcome
    minimum_fields:
    - ActionCode
    - Pre_DSO_Days
    - Post_DSO_Days_60d
governance:
  approvals_required:
  - Finance Director
  rollback_plan:
  - De-escalate enforcement if customer churn risk increases
  documentation_links:
  - core/usecases/core/FIN-001_Cash_Liquidity_Performance/Business_Factsheet.md
parameters:
- name: period
  type: period
  required: true
  grain: month
  source_field: scope.default_grain
- name: trigger_level
  type: trigger_level
  required: true
  allowed_values:
  - L1
  - L2
  - L3
  source_field: trigger.levels
- name: customer
  label: Customer
  type: dimension_member
  required: true
  binding: nicht_belegt
  source_field: scope.default_perspective
- name: legal_entity
  label: Legal Entity
  type: dimension_member
  required: true
  binding: nicht_belegt
  source_field: scope.default_perspective
- name: region
  label: Region
  type: dimension_member
  required: false
  binding: nicht_belegt
  source_field: scope.supported_slices
preconditions:
  combine: guardrails_all_and_trigger_any
  checks:
  - id: level_l1
    role: trigger
    kind: kpi_level
    ref: trigger.levels.L1.condition
    kpi_id: KPI-FIN-001
    pruefbar: true
  - id: level_l2
    role: trigger
    kind: kpi_level
    ref: trigger.levels.L2.condition
    kpi_id: KPI-FIN-001
    pruefbar: true
  - id: level_l3
    role: trigger
    kind: kpi_level
    ref: trigger.levels.L3.condition
    kpi_id: KPI-FIN-001
    pruefbar: true
  - id: volume_guardrail
    role: guardrail
    kind: volume_guardrail
    ref: trigger.evaluation.minimum_data.volume_guardrail
    kpi_id: KPI-FIN-007
    pruefbar: true
permitted_role:
  source_field: governance.approvals_required
  roles:
  - approver: Finance Director
    role_id: finance_director
review:
  required: true
  state: vorgeschlagen
quality_rules:
- All kpi_id values must exist in KPI catalog.
- Trigger severity must be strictly increasing from L1 to L3.
- impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis.
- If status=deprecated then lifecycle.replaced_by is required.
- 'No free-text trigger notes: use gating_rules and structured filters.'
