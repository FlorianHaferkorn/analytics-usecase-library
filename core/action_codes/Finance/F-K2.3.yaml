schema_version: '2.0'
id: F-K2.3
name: Labor Productivity Recovery
owner_domain: Operations / Production
impact_dimension: Profitability
status: active
owner_role: plant_manager
steward_role: operations_bi_lead
use_case_links:
  core_use_cases:
  - FIN-002
  related_use_cases:
  - OPS-001
kpis:
  trigger_kpis:
  - KPI-OPS-004
  guardrail_kpis:
  - KPI-QUA-006
  outcome_kpis:
  - KPI-OPS-004
  - KPI-FIN-015
scope:
  default_grain: month
  default_perspective:
  - Plant
  - Production Line
  supported_slices:
  - Shift
  exclusions:
  - Planned ramp-ups or ramp-downs
  - Training periods for new hires
  - Lines under major maintenance shutdown
trigger:
  type: Deviation
  evaluation:
    grain: month
    window:
      kind: rolling
      length: 2
      unit: periods
    persistence:
      required: true
      min_consecutive_periods: 2
    minimum_data:
      min_observations: 1
      volume_guardrail:
        enabled: true
        metric_kpi_id: KPI-OPS-009
        comparator: gte
        value: 100000
        unit: units
  levels:
    L1:
      severity: EarlyWarning
      condition:
        metric_kpi_id: KPI-OPS-004
        comparator: lt
        threshold:
          basis: absolute
          reference: baseline
          value: -3.0
          unit: pp
        filters: []
    L2:
      severity: RequiredIntervention
      condition:
        metric_kpi_id: KPI-OPS-004
        comparator: lt
        threshold:
          basis: absolute
          reference: baseline
          value: -6.0
          unit: pp
        filters: []
    L3:
      severity: PrescriptiveExecution
      condition:
        metric_kpi_id: KPI-OPS-004
        comparator: lt
        threshold:
          basis: absolute
          reference: baseline
          value: -10.0
          unit: pp
        filters: []
  gating_rules:
  - Trigger only if defect rate remains within guardrails
  - Do not trigger if productivity drop is driven by approved training or ramp-up
  - Exclude lines with unresolved technical downtime issues
impact_valuation:
  method: CostAvoidance
  currency: EUR
  attribution:
    method: before_after
  success_window:
    duration: P60D
    metric_kpi_id: KPI-FIN-015
    success_criteria:
      kind: return_to_baseline
      baseline_window: P60D
  calculation_logic:
    standardized: "RealizedEUR = (Pre_UnitCost - Post_UnitCost) * Volume"
    latex: EUR = (UC_{pre} - UC_{post}) \times V
  required_measures:
  - Unit Cost
  - Volume
  - Action Execution Count
impact:
  category: Medium
  expected_range:
    metric_kpi_id: KPI-OPS-004
    value_low: 3.0
    value_high: 8.0
    unit: pp
    time_to_effect:
      min_periods: 1
      max_periods: 3
  mechanism:
  - Improved staffing and shift alignment
  - Reduction of idle and unproductive labor time
  confidence:
    level: Medium
    rationale:
    - Execution quality depends on plant discipline
    - Guarded by quality constraints
operational_execution:
  stakeholders:
  - Production Supervisors
  - HR Operations
  - Ops Controlling
  prerequisites:
  - Reliable labor time and output measurement
  - Clear productivity targets by line and shift
  steps:
  - Identify lines and shifts with productivity decline
  - Analyze staffing, shift balance, and idle time
  - Implement corrective scheduling and supervision actions
  - Review productivity trend monthly
  effort:
    level: Medium
    typical_duration_days: 60
  risks_and_tradeoffs:
  - Employee fatigue or morale impact
  - Short-term disruption during rebalancing
data_requirements:
  required_entities:
  - Plant
  - Line
  semantic_dependencies:
    measures:
    - Labor Productivity %
    - Unit Cost Amount
    - Defect Rate %
    - Production Volume
    tables:
    - fact_ops
    - fact_labor
    - fact_output
    - fact_quality
    - fact_cost
    - dim_org
automation:
  detection:
    enabled: true
    evaluation_frequency: monthly
    output: Lines and shifts with sustained productivity decline
  suggested_actions:
    enabled: true
    outputs:
    - Staffing and shift correction recommendations
  copilot_prompts: []
tracking:
  execution_log:
    enabled: true
    recommended_storage: fact_action_execution
    minimum_fields:
    - ActionCode
    - Plant
    - Line
    - TriggerLevel
    - ExecutedDate
  outcome_evaluation:
    enabled: true
    recommended_storage: fact_action_outcome
    minimum_fields:
    - ActionCode
    - Pre_Productivity_Pct
    - Post_Productivity_Pct_60d
governance:
  approvals_required:
  - COO
  rollback_plan:
  - Suspend actions if quality or safety incidents increase
  documentation_links:
  - core/usecases/core/FIN-002_Cost_Performance/Business_Factsheet.md
parameters:
- name: period
  type: period
  required: true
  grain: month
  source_field: scope.default_grain
- name: trigger_level
  type: trigger_level
  required: true
  allowed_values:
  - L1
  - L2
  - L3
  source_field: trigger.levels
- name: plant
  label: Plant
  type: dimension_member
  required: true
  binding: nicht_belegt
  source_field: scope.default_perspective
- name: production_line
  label: Production Line
  type: dimension_member
  required: true
  binding: nicht_belegt
  source_field: scope.default_perspective
- name: shift
  label: Shift
  type: dimension_member
  required: false
  binding: nicht_belegt
  source_field: scope.supported_slices
preconditions:
  combine: guardrails_all_and_trigger_any
  checks:
  - id: level_l1
    role: trigger
    kind: kpi_level
    ref: trigger.levels.L1.condition
    kpi_id: KPI-OPS-004
    pruefbar: true
  - id: level_l2
    role: trigger
    kind: kpi_level
    ref: trigger.levels.L2.condition
    kpi_id: KPI-OPS-004
    pruefbar: true
  - id: level_l3
    role: trigger
    kind: kpi_level
    ref: trigger.levels.L3.condition
    kpi_id: KPI-OPS-004
    pruefbar: true
  - id: volume_guardrail
    role: guardrail
    kind: volume_guardrail
    ref: trigger.evaluation.minimum_data.volume_guardrail
    kpi_id: KPI-OPS-009
    pruefbar: true
permitted_role:
  source_field: governance.approvals_required
  roles:
  - approver: COO
    role_id: nicht_belegt
review:
  required: true
  state: vorgeschlagen
quality_rules:
- All kpi_id values must exist in KPI catalog.
- Trigger severity must be strictly increasing from L1 to L3.
- impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis.
- If status=deprecated then lifecycle.replaced_by is required.
- 'No free-text trigger notes: use gating_rules and structured filters.'
