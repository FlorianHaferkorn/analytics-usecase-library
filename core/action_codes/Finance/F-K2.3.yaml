schema_version: '2.0'
id: F-K2.3
name: Labor Productivity Recovery
owner_domain: Operations / Production
impact_dimension: Profitability
status: active
owner_role: plant_manager
steward_role: operations_bi_lead
use_case_links:
  core_use_cases:
  - FIN-002
  related_use_cases:
  - OPS-001
kpis:
  trigger_kpis:
  - ops.labor.productivity.pct
  guardrail_kpis:
  - ops.quality.defect_rate.pct
  outcome_kpis:
  - ops.labor.productivity.pct
  - cost.unit.amount
scope:
  default_grain: month
  default_perspective:
  - Plant
  - Production Line
  supported_slices:
  - Shift
  exclusions:
  - Planned ramp-ups or ramp-downs
  - Training periods for new hires
  - Lines under major maintenance shutdown
trigger:
  type: Deviation
  evaluation:
    grain: month
    window:
      kind: rolling
      length: 2
      unit: periods
    persistence:
      required: true
      min_consecutive_periods: 2
    minimum_data:
      min_observations: 1
      volume_guardrail:
        enabled: true
        metric_kpi_id: ops.production.volume
        comparator: gte
        value: 100000
        unit: units
  levels:
    L1:
      severity: EarlyWarning
      condition:
        metric_kpi_id: ops.labor.productivity.pct
        comparator: lt
        threshold:
          basis: absolute
          value: -3.0
          unit: pp
        filters: []
    L2:
      severity: RequiredIntervention
      condition:
        metric_kpi_id: ops.labor.productivity.pct
        comparator: lt
        threshold:
          basis: absolute
          value: -6.0
          unit: pp
        filters: []
    L3:
      severity: PrescriptiveExecution
      condition:
        metric_kpi_id: ops.labor.productivity.pct
        comparator: lt
        threshold:
          basis: absolute
          value: -10.0
          unit: pp
        filters: []
  gating_rules:
  - Trigger only if defect rate remains within guardrails
  - Do not trigger if productivity drop is driven by approved training or ramp-up
  - Exclude lines with unresolved technical downtime issues
impact:
  category: Medium
  expected_range:
    metric_kpi_id: ops.labor.productivity.pct
    value_low: 3.0
    value_high: 8.0
    unit: pp
    time_to_effect:
      min_periods: 1
      max_periods: 3
  mechanism:
  - Improved staffing and shift alignment
  - Reduction of idle and unproductive labor time
  confidence:
    level: Medium
    rationale:
    - Execution quality depends on plant discipline
    - Guarded by quality constraints
operational_execution:
  stakeholders:
  - Production Supervisors
  - HR Operations
  - Ops Controlling
  prerequisites:
  - Reliable labor time and output measurement
  - Clear productivity targets by line and shift
  steps:
  - Identify lines and shifts with productivity decline
  - Analyze staffing, shift balance, and idle time
  - Implement corrective scheduling and supervision actions
  - Review productivity trend monthly
  effort:
    level: Medium
    typical_duration_days: 60
  risks_and_tradeoffs:
  - Employee fatigue or morale impact
  - Short-term disruption during rebalancing
data_requirements:
  required_entities:
  - Plant
  - Production Line
  semantic_dependencies:
    measures:
    - Labor Productivity %
    - Unit Cost Amount
    - Defect Rate %
    - Production Volume
    tables:
    - fact_ops
    - fact_cost
    - dim_plant
    - dim_production_line
automation:
  detection:
    enabled: true
    evaluation_frequency: monthly
    output: Lines and shifts with sustained productivity decline
  suggested_actions:
    enabled: true
    outputs:
    - Staffing and shift correction recommendations
  copilot_prompts: []
tracking:
  execution_log:
    enabled: true
    recommended_storage: fact_action_execution
    minimum_fields:
    - ActionCode
    - Plant
    - ProductionLine
    - TriggerLevel
    - ExecutedDate
  outcome_evaluation:
    enabled: true
    recommended_storage: fact_action_outcome
    minimum_fields:
    - ActionCode
    - Pre_Productivity_Pct
    - Post_Productivity_Pct_60d
governance:
  approvals_required:
  - COO
  rollback_plan:
  - Suspend actions if quality or safety incidents increase
  documentation_links:
  - core/usecases/core/FIN-002_Cost_Performance/Business_Factsheet.md
quality_rules:
- All kpi_id values must exist in KPI catalog.
- Trigger severity must be strictly increasing from L1 to L3.
- impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis.
- If status=deprecated then lifecycle.replaced_by is required.
- 'No free-text trigger notes: use gating_rules and structured filters.'
