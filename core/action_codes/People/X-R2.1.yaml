schema_version: "2.0"
id: X-R2.1
name: Resource Utilization Orchestration
owner_domain: Service Operations / Workforce Management Leadership
impact_dimension: Utilization Governance
status: active
owner_role: Head of Workforce Management
steward_role: Operations BI Lead
use_case_links:
  core_use_cases:
  - XD-002
  related_use_cases:
  - XD-001
kpis:
  trigger_kpis:
  - res.utilization.pct
  - res.overtime.pct
  guardrail_kpis:
  - svc.sla.attainment.pct
  outcome_kpis:
  - res.utilization.pct
scope:
  default_grain: queue_week
  default_perspective:
  - Queue
  - Region
  supported_slices:
  - Channel
  - Agent Group
  exclusions:
  - Queues under exceptional incident handling
  - Low-volume specialist teams
  - Training-only weeks
trigger:
  type: Deviation
  evaluation:
    grain: queue_week
    window:
      kind: rolling
      length: 4
      unit: weeks
    persistence:
      required: true
      min_consecutive_periods: 2
    minimum_data:
      min_observations: 2
      volume_guardrail:
        enabled: true
        metric_kpi_id: svc.tickets.created.count
        comparator: gte
        value: 200
        unit: count
  levels:
    L1:
      severity: EarlyWarning
      condition:
        metric_kpi_id: res.utilization.pct
        comparator: lt_or_gt_band
        threshold:
          basis: band
          lower: 70.0
          upper: 85.0
          unit: '%'
        filters: []
    L2:
      severity: RequiredIntervention
      condition:
        metric_kpi_id: res.utilization.pct
        comparator: lt_or_gt_band
        threshold:
          basis: band
          lower: 65.0
          upper: 90.0
          unit: '%'
        filters: []
    L3:
      severity: PrescriptiveExecution
      condition:
        metric_kpi_id: res.utilization.pct
        comparator: lt_or_gt_band
        threshold:
          basis: band
          lower: 60.0
          upper: 95.0
          unit: '%'
        filters: []
  gating_rules:
  - Trigger only if deviation is structurally recurring
  - Do not trigger if utilization deviation is caused by approved surge coverage
  - Exclude queues with active execution Action Codes in progress
impact:
  category: High
  expected_range:
    metric_kpi_id: res.utilization.pct
    value_low: 3.0
    value_high: 8.0
    unit: pp
    time_to_effect:
      min_periods: 1
      max_periods: 3
  mechanism:
  - Focused activation of the dominant utilization lever
  - Avoidance of conflicting WFM actions
  confidence:
    level: High
    rationale:
    - Utilization imbalance is typically structural by queue
    - Central orchestration improves effectiveness
operational_execution:
  stakeholders:
  - Service Operations
  - HR Operations
  prerequisites:
  - Reliable utilization and occupancy measurement
  - Clear ownership of execution Action Codes
  steps:
  - Detect sustained utilization band violations
  - Diagnose dominant utilization driver
  - Activate corresponding execution Action Code
  - Review utilization weekly
  effort:
    level: Low
    typical_duration_days: 21
  risks_and_tradeoffs:
  - Delayed correction if driver diagnosis is incorrect
  - Underreaction to multi-driver utilization issues
data_requirements:
  required_entities:
  - Queue
  - Region
  semantic_dependencies:
    measures:
    - Utilization %
    - Occupancy %
    - Overtime %
    - SLA Attainment %
    - Tickets Created Count
    tables:
    - fact_workforce
    - fact_service_tickets
    - dim_queue
    - dim_region
automation:
  detection:
    enabled: true
    evaluation_frequency: weekly
    output: Queues with sustained utilization band violations
  suggested_actions:
    enabled: true
    outputs:
    - Recommended utilization lever activation
  copilot_prompts: []
tracking:
  execution_log:
    enabled: true
    recommended_storage: fact_action_execution
    minimum_fields:
    - ActionCode
    - Queue
    - Region
    - TriggerLevel
    - ActivatedLever
    - ExecutedDate
  outcome_evaluation:
    enabled: true
    recommended_storage: fact_action_outcome
    minimum_fields:
    - ActionCode
    - Pre_Utilization_Pct
    - Post_Utilization_Pct_30d
governance:
  approvals_required:
  - VP Service Operations
  rollback_plan:
  - Suspend orchestration if SLA deterioration exceeds tolerance
  documentation_links:
  - core/usecases/core/XD-002_Resource_Utilization/Business_Factsheet.md
quality_rules:
- All kpi_id values must exist in KPI catalog.
- Trigger severity must be strictly increasing from L1 to L3.
- impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis.
- If status=deprecated then lifecycle.replaced_by is required.
- 'No free-text trigger notes: use gating_rules and structured filters.'
