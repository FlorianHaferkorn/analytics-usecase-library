schema_version: '2.0'
id: X-R2.2
name: Capacity Reallocation & Load Balancing
owner_domain: Workforce Management
impact_dimension: Allocation Efficiency
status: active
owner_role: workforce_management_lead
steward_role: workforce_management_bi_lead
use_case_links:
  core_use_cases:
  - XD-002
  related_use_cases:
  - XD-001
kpis:
  trigger_kpis:
  - res.utilization.pct
  - res.occupancy.pct
  guardrail_kpis:
  - svc.sla.attainment.pct
  outcome_kpis:
  - res.utilization.pct
scope:
  default_grain: queue_day
  default_perspective:
  - Queue
  - Channel
  supported_slices:
  - Region
  - Agent Group
  exclusions:
  - Low-volume specialist queues
  - Queues under active quality remediation
  - Training-only schedules
trigger:
  type: Deviation
  evaluation:
    grain: queue_day
    window:
      kind: rolling
      length: 5
      unit: days
    persistence:
      required: true
      min_consecutive_periods: 3
    minimum_data:
      min_observations: 3
      volume_guardrail:
        enabled: true
        metric_kpi_id: svc.tickets.created.count
        comparator: gte
        value: 150
        unit: count
  levels:
    L1:
      severity: EarlyWarning
      condition:
        metric_kpi_id: res.utilization.pct
        comparator: lt_or_gt_band
        threshold:
          basis: band
          lower: 72.0
          upper: 85.0
          unit: '%'
        filters: []
    L2:
      severity: RequiredIntervention
      condition:
        metric_kpi_id: res.utilization.pct
        comparator: lt_or_gt_band
        threshold:
          basis: band
          lower: 68.0
          upper: 90.0
          unit: '%'
        filters: []
    L3:
      severity: PrescriptiveExecution
      condition:
        metric_kpi_id: res.utilization.pct
        comparator: lt_or_gt_band
        threshold:
          basis: band
          lower: 63.0
          upper: 95.0
          unit: '%'
        filters: []
  gating_rules:
  - Trigger only if imbalance is queue-structural, not individual
  - Do not trigger if imbalance is caused by approved surge coverage
  - Exclude queues with active overtime containment actions
impact:
  category: High
  expected_range:
    metric_kpi_id: res.utilization.pct
    value_low: 4.0
    value_high: 10.0
    unit: pp
    time_to_effect:
      min_periods: 1
      max_periods: 2
  mechanism:
  - Short-term staffing shifts
  - Cross-queue and cross-channel load balancing
  confidence:
    level: High
    rationale:
    - Utilization gaps are structurally uneven
    - WFM levers are immediately available
operational_execution:
  stakeholders:
  - Service Operations
  - Team Leads
  prerequisites:
  - Flexible skill coverage matrix
  - Near-real-time queue volume visibility
  steps:
  - IDENTIFY queues with sustained utilization imbalance
  - REALLOCATE capacity across queues or channels for this queue cluster
  - VALIDATE SLA and backlog impact for this queue daily
  effort:
    level: Low to Medium
    typical_duration_days: 14
  risks_and_tradeoffs:
  - Skill mismatch reducing quality
  - Local optimisation creating downstream gaps
data_requirements:
  required_entities:
  - Queue
  - Channel
  semantic_dependencies:
    measures:
    - Utilization %
    - Occupancy %
    - SLA Attainment %
    - Tickets Created Count
    tables:
    - fact_workforce_management
    - fact_support_cases
    - dim_case_queue
    - dim_org
automation:
  detection:
    enabled: true
    evaluation_frequency: daily
    output: Queues with sustained utilization imbalance
  suggested_actions:
    enabled: true
    outputs:
    - Capacity reallocation recommendations
  copilot_prompts: []
tracking:
  execution_log:
    enabled: true
    recommended_storage: fact_action_execution
    minimum_fields:
    - ActionCode
    - Queue
    - Channel
    - TriggerLevel
    - ExecutedDate
  outcome_evaluation:
    enabled: true
    recommended_storage: fact_action_outcome
    minimum_fields:
    - ActionCode
    - Pre_Utilization_Pct
    - Post_Utilization_Pct_14d
governance:
  approvals_required:
  - Head of Workforce Management
  rollback_plan:
  - Revert reallocation if SLA or quality deteriorates
  documentation_links:
  - core/usecases/core/XD-002_Resource_Utilization/Business_Factsheet.md
quality_rules:
- All kpi_id values must exist in KPI catalog.
- Trigger severity must be strictly increasing from L1 to L3.
- impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis.
- If status=deprecated then lifecycle.replaced_by is required.
- 'No free-text trigger notes: use gating_rules and structured filters.'
