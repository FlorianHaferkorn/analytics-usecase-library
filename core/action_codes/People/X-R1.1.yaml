schema_version: '2.0'
id: X-R1.1
name: Attrition & Retention Orchestration
owner_domain: People & Culture / HR Leadership
impact_dimension: Retention Governance
status: active
owner_role: head_of_hr
steward_role: people_analytics_bi_lead
use_case_links:
  core_use_cases:
  - HR-001
  related_use_cases: []
kpis:
  trigger_kpis:
  - KPI-PPL-001
  - KPI-PPL-002
  guardrail_kpis:
  - KPI-PPL-005
  outcome_kpis:
  - KPI-PPL-001
scope:
  default_grain: segment_month
  default_perspective:
  - Segment
  - Role
  supported_slices:
  - Location
  - Tenure Band
  exclusions:
  - Units under active transformation initiatives
  - One-off exceptional events with executive override
  - Low-volume segments below the minimum-observation guardrail
trigger:
  type: Deviation
  evaluation:
    grain: segment_month
    window:
      kind: rolling
      length: 5
      unit: days
    persistence:
      required: true
      min_consecutive_periods: 3
    minimum_data:
      min_observations: 3
      volume_guardrail:
        enabled: true
        metric_kpi_id: KPI-PPL-006
        comparator: gte
        value: 50
        unit: count
  levels:
    L1:
      severity: EarlyWarning
      condition:
        metric_kpi_id: KPI-PPL-001
        comparator: gt
        threshold:
          basis: absolute
          value: 12.0
          unit: '%'
        filters: []
    L2:
      severity: RequiredIntervention
      condition:
        metric_kpi_id: KPI-PPL-001
        comparator: gt
        threshold:
          basis: absolute
          value: 15.0
          unit: '%'
        filters: []
    L3:
      severity: PrescriptiveExecution
      condition:
        metric_kpi_id: KPI-PPL-001
        comparator: gt
        threshold:
          basis: absolute
          value: 18.0
          unit: '%'
        filters: []
  gating_rules:
  - Trigger only if backlog growth or escalations confirm structural issue
  - Do not trigger if SLA miss is caused by one-off incidents
  - Exclude queues with active execution Action Codes in progress
impact_valuation:
  method: CostAvoidance
  currency: EUR
  success_window:
    duration: P30D
    metric_kpi_id: KPI-PPL-001
    success_criteria:
      kind: return_to_baseline
      baseline_window: P60D
  calculation_logic:
    standardized: RealizedEUR = Avoided_Loss + Recovered_Value
  required_measures: &id001
  - Attrition %
  - Engagement Index
  - Absence Rate %
  - Headcount FTE
  attribution:
    method: before_after
impact:
  category: High
  expected_range:
    metric_kpi_id: KPI-PPL-001
    value_low: 2.0
    value_high: 8.0
    unit: pp
    time_to_effect:
      min_periods: 1
      max_periods: 3
  mechanism:
  - Focused activation of the dominant service lever
  - Avoidance of conflicting service actions
  confidence:
    level: High
    rationale:
    - Service failures are concentrated by queue
    - Central coordination improves execution quality
operational_execution:
  stakeholders:
  - HR Business Partners
  - People Analytics
  - Team Leadership
  prerequisites:
  - Reliable SLA, backlog, and escalation measurement
  - Clear ownership of execution Action Codes
  steps:
  - DETECT sustained SLA deterioration for this queue
  - DIAGNOSE the dominant service constraint for this queue
  - ACTIVATE the corresponding execution Action Code for this queue
  - REVIEW SLA recovery for this queue daily
  effort:
    level: Low
    typical_duration_days: 14
  risks_and_tradeoffs:
  - Delayed execution if diagnosis is incorrect
  - Underreaction to multi-driver service issues
data_requirements:
  required_entities:
  - Segment
  - Role
  semantic_dependencies:
    measures: *id001
    tables:
    - fact_workforce
    - fact_engagement_survey
    - dim_org
    - dim_employee_segment
automation:
  detection:
    enabled: true
    evaluation_frequency: daily
    output: Queues with sustained SLA deterioration
  suggested_actions:
    enabled: true
    outputs:
    - Recommended service lever activation
  copilot_prompts: []
tracking:
  execution_log:
    enabled: true
    recommended_storage: fact_action_execution
    minimum_fields:
    - ActionCode
    - Queue
    - Region
    - TriggerLevel
    - ActivatedLever
    - ExecutedDate
  outcome_evaluation:
    enabled: true
    recommended_storage: fact_action_outcome
    minimum_fields:
    - ActionCode
    - Pre_SLA_Pct
    - Post_SLA_Pct_14d
governance:
  approvals_required:
  - VP Customer Operations
  rollback_plan:
  - Suspend orchestration if quality KPIs deteriorate
  documentation_links:
  - core/usecases/core/HR-001_Workforce_Performance_Retention/Business_Factsheet.md
parameters:
- name: period
  type: period
  required: true
  grain: segment_month
  source_field: scope.default_grain
- name: trigger_level
  type: trigger_level
  required: true
  allowed_values:
  - L1
  - L2
  - L3
  source_field: trigger.levels
- name: segment
  label: Segment
  type: dimension_member
  required: true
  binding: nicht_belegt
  source_field: scope.default_perspective
- name: role
  label: Role
  type: dimension_member
  required: true
  binding: dim_role.Role
  source_field: scope.default_perspective
- name: location
  label: Location
  type: dimension_member
  required: false
  binding: dim_org.Location
  source_field: scope.supported_slices
- name: tenure_band
  label: Tenure Band
  type: dimension_member
  required: false
  binding: dim_employee_segment.Tenure Band
  source_field: scope.supported_slices
preconditions:
  combine: guardrails_all_and_trigger_any
  checks:
  - id: level_l1
    role: trigger
    kind: kpi_level
    ref: trigger.levels.L1.condition
    kpi_id: KPI-PPL-001
    pruefbar: true
  - id: level_l2
    role: trigger
    kind: kpi_level
    ref: trigger.levels.L2.condition
    kpi_id: KPI-PPL-001
    pruefbar: true
  - id: level_l3
    role: trigger
    kind: kpi_level
    ref: trigger.levels.L3.condition
    kpi_id: KPI-PPL-001
    pruefbar: true
  - id: volume_guardrail
    role: guardrail
    kind: volume_guardrail
    ref: trigger.evaluation.minimum_data.volume_guardrail
    kpi_id: KPI-PPL-006
    pruefbar: true
permitted_role:
  source_field: governance.approvals_required
  roles:
  - approver: VP Customer Operations
    role_id: vp_customer_service_operations
review:
  required: true
  state: vorgeschlagen
quality_rules:
- All kpi_id values must exist in KPI catalog.
- Trigger severity must be strictly increasing from L1 to L3.
- impact.expected_range.metric_kpi_id must be one of kpis.outcome_kpis.
- If status=deprecated then lifecycle.replaced_by is required.
- 'No free-text trigger notes: use gating_rules and structured filters.'
