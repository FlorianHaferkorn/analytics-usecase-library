measure_name: OCF Health
is_kpi_measure: false
kpi_id_ref: ''
semantic_model: Finance_SemanticModel
display_folder: FIN-001 (Now)
category: Supporting
expression:
  aggregation_method: custom
  logical: OCF Health = VAR _n = [_NowIdx] VAR _ocf = [Operating Cash Flow (Now)]
    VAR _plan = CALCULATE ( [OCF Plan], REMOVEFILTERS ( dim_date ), FILTER ( ALL (
    dim_date ), dim_date[Year] * 12 + dim_date[MonthNumber] = _n ) ) RETURN _ocf -
    _plan
documentation:
  description: 'OCF-Gesundheit (numerisch): OCF(Now) - OCF-Plan(Now). >0 = ueber Plan
    = gut.'
  notes: 'Nachgetragen 01.10.2026: steht seit #421 (06f93e98c, 15.08.2026) in dist,
    ohne Dictionary-Eintrag (check_tmdl_vs_measure_dictionary rot). Ausdruck aus dem
    TMDL übernommen.'
governance:
  owner: Finance Analytics
  status: active
  version: v1.0
  last_review: '2026-10-01'
