measure_name: Cash Balance Delta (Now)
is_kpi_measure: false
kpi_id_ref: ''
semantic_model: Finance_SemanticModel
display_folder: FIN-001 (Now)
category: Supporting
expression:
  aggregation_method: custom
  logical: Cash Balance Delta (Now) = VAR _n = [_NowIdx] VAR _now = [Cash Balance
    (Now)] VAR _pm = CALCULATE ( [Cash Balance], REMOVEFILTERS ( dim_date ), FILTER
    ( ALL ( dim_date ), dim_date[Year] * 12 + dim_date[MonthNumber] = _n - 1 ) ) VAR
    _plan = CALCULATE ( [Cash Plan], REMOVEFILTERS ( dim_date ), FILTER ( ALL ( dim_date
    ), dim_date[Year] * 12 + dim_date[MonthNumber] = _n ) ) RETURN SWITCH ( SELECTEDVALUE
    ( Vergleich[Sort] ), 1, _now - _pm, _now - _plan )
documentation:
  description: Cash Balance Delta je Vergleichsmodus, auf letzten Datenmonat gepinnt.
    Hoeher = besser.
  notes: 'Nachgetragen 01.10.2026: steht seit #421 (06f93e98c, 15.08.2026) in dist,
    ohne Dictionary-Eintrag (check_tmdl_vs_measure_dictionary rot). Ausdruck aus dem
    TMDL übernommen.'
governance:
  owner: Finance Analytics
  status: active
  version: v1.0
  last_review: '2026-10-01'
