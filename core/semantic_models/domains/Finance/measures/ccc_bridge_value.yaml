    to total CCC Days when no step is in context. Drives the Main_3 CCC decomposition
    waterfall over the disconnected _CCC_Bridge[Step] dimension. Grain: bridge_step
    · Unit: days · Owner: Finance Analytics · Status: active'
  notes: 'Nachgetragen 01.10.2026: steht seit #421 (06f93e98c, 15.08.2026) in dist,
    ohne Dictionary-Eintrag (check_tmdl_vs_measure_dictionary rot). Ausdruck aus dem
    TMDL übernommen.'
