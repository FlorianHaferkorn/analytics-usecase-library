measure_name: NPS Index
is_kpi_measure: false
kpi_id_ref: ''
semantic_model: CustomerValue_SemanticModel
display_folder: XD-001
category: Supporting
expression:
  aggregation_method: custom
  logical: NPS Index = VAR Promoters = CALCULATE ( COUNTROWS ( fact_nps ), fact_nps[NPS
    Score] >= 9 ) VAR Detractors = CALCULATE ( COUNTROWS ( fact_nps ), fact_nps[NPS
    Score] <= 6 ) VAR TotalResponses = COUNTROWS ( fact_nps ) VAR NetPromoterShare
    = DIVIDE ( Promoters - Detractors, TotalResponses ) RETURN ROUND ( NetPromoterShare
    * 100, 0 )
documentation:
  description: 'NPS score from surveys: %Promoters - %Detractors. Formula: %Promoters
    minus %Detractors from NPS survey. Grain: month · Unit: index Owner: Service Analytics
    · Status: active Synonyms: Net Promoter Score, Service NPS, Weiterempfehlungsrate,
    NPS Example question: Why did NPS dip for the Returns queue?'
  notes: 'Nachgetragen 01.10.2026: steht seit #421 (06f93e98c, 15.08.2026) in dist,
    ohne Dictionary-Eintrag (check_tmdl_vs_measure_dictionary rot). Ausdruck aus dem
    TMDL übernommen.'
governance:
  owner: CX BI
  status: active
  version: v1.0
  last_review: '2026-10-01'
