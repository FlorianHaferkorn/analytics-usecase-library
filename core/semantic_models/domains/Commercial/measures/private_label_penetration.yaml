measure_name: Private Label Penetration %
is_kpi_measure: true
kpi_id_ref: KPI-COM-033
semantic_model: Commercial_Sales_SemanticModel
display_folder: COM-IND-R002
category: KPI
expression:
  logical: Private Label Penetration % = DIVIDE ( ( CALCULATE ( SUM ( fact_sales[Net Sales Amount] ),
    dim_product[Private Label Flag] = TRUE () ) ), SUM ( fact_sales[Net Sales Amount] ) )
  aggregation_method: ratio
documentation:
  description: Net sales of private-label products divided by total net sales.
  notes: 'Grain: category/region; weekly, reported monthly. Unit: percent.

    Lineage: fact_sales[Net Sales Amount], dim_product[Private Label Flag].

    Expression synthesized from the governed catalog calculation (KPI-COM-033, op ratio over
    sum_filtered) via tooling/superversion/targets/dax_synth.py. Measured on Aurora gold
    (30.10.2026, DuckDB over the active fact_sales files joined to dim_product after
    generate_model_columns.py and generate_eigenmarke_trend.py, checked against pandas, max
    deviation 2e-13 pp): 2024 29.47 %, Consumer Electronics 22.26 %, Fashion 36.42 %, Home &
    Living 32.41 %; Consumer Electronics December 2024 21.52 %. The category shares and the
    12-week decline in Consumer Electronics are assumptions of the showcase generator.

    QA: Denominator > 0 for reported slices; every SKU flagged private label yes/no.

    '
dependencies:
  columns:
  - dim_product[Private Label Flag]
  - fact_sales[Net Sales Amount]
governance:
  owner: Commercial BI
  status: experimental
  version: v0.1
  last_review: '2026-10-30'
