domain: operations
version: v1.2
owner: Operations Data Product

dimension:
  - name: dim_date
    description: "Calendar dimension with fiscal hierarchy for time slicing."
    purpose: "Time dimension for operations reporting."
    scd_type: 1
    columns:
      - {name: DateKey, type: int, role: key}
      - {name: Date, type: date}
      - {name: Year, type: int}
      - {name: Quarter, type: text, allowed_values: [Q1, Q2, Q3, Q4]}
      - {name: Month, type: text}
      - {name: MonthNumber, type: int}
      - {name: Week, type: text, nullable: true}

  - name: dim_org
    description: "Organization dimension (plant, line, shift, region) for operations."
    purpose: "Scoping for production and quality reporting."
    scd_type: 2
    columns:
      - {name: OrgKey, type: int, role: key}
      - {name: Plant, type: text, synonyms: [Site, Facility, Werk, Standort]}
      - {name: Line, type: text, allowed_values: [Line A, Line B, Line C, Line D], synonyms: [Production Line, Work Center, Fertigungslinie, Produktionslinie]}
      - {name: Shift, type: text, nullable: true, allowed_values: [Day Shift, Afternoon Shift, Night Shift], synonyms: [Work Shift, Schicht, Arbeitsschicht]}
      - {name: Region, type: text, nullable: true, allowed_values: [DACH, Benelux, Nordics, SouthernEurope, CEE], synonyms: [Sales Region, Territory, Vertriebsregion]}
      - {name: Country, type: text, nullable: true}

  - name: dim_asset
    description: "Asset or production line dimension (code, name, class, criticality) for OEE and maintenance."
    purpose: "Asset-level performance and downtime analysis."
    scd_type: 2
    columns:
      - {name: AssetKey, type: int, role: key}
      - {name: AssetCode, type: text}
      - {name: AssetName, type: text}
      - {name: AssetClass, type: text, allowed_values: [Assembly Line, Production Line, Finishing Station, Packaging Station, Quality Control, Warehouse], synonyms: [Equipment Class, Asset Category, Anlagenklasse, Gerätetyp]}
      - {name: Criticality, type: text, nullable: true, allowed_values: [High, Medium, Low], synonyms: [Asset Criticality, Kritikalität, Kritikalitätsstufe]}
      - {name: OrgKey, type: int, ref: dim_org}

  - name: dim_product
    description: "Product dimension for quality and output reporting."
    purpose: "Product-level quality and throughput."
    scd_type: 2
    columns:
      - {name: ProductKey, type: int, role: key}
      - {name: ProductCode, type: text}
      - {name: ProductName, type: text}
      - {name: Category, type: text, allowed_values: [Fashion, "Home & Living", Consumer Electronics], synonyms: [Product Group, Warengruppe, Produktgruppe]}
      - {name: Subcategory, type: text, nullable: true, allowed_values: [Apparel, Footwear, Accessories, Jewelry, Furniture, Decor, Kitchenware, Bedding, Lighting, TVs, Audio, Computers, Smartphones, Gaming], synonyms: [Sub Category, Untergruppe, Unterkategorie]}

  - name: dim_loss_type
    description: "ISO 22400-2 Six Big Losses taxonomy mapping each loss to its OEE pillar."
    purpose: "Standardized loss classification for OEE breakdown and availability/performance/quality attribution."
    scd_type: 1
    columns:
      - {name: LossTypeKey, type: int, role: key}
      - {name: LossTypeCode, type: text}
      - {name: LossTypeName, type: text}
      - {name: BigLossCategory, type: text, allowed_values: [Breakdowns, Setup/Adjustment, MinorStops, ReducedSpeed, ProcessDefects, StartupWaste], synonyms: [Six Big Losses, Loss Category, Verlustart, Verlustkategorie]}
      - {name: LossPillar, type: text, allowed_values: [Availability, Performance, Quality], synonyms: [OEE Pillar, OEE Component, OEE-Komponente]}

  - name: dim_failure_mode
    description: "ISO 14224 failure-mode taxonomy (mode and underlying mechanism) for reliability analysis."
    purpose: "Standardized failure-mode classification for MTBF and root cause analysis."
    scd_type: 1
    columns:
      - {name: FailureModeKey, type: int, role: key}
      - {name: FailureModeCode, type: text}
      - {name: FailureModeName, type: text}
      - {name: FailureMechanism, type: text, nullable: true, synonyms: [Failure Mechanism, Degradation Mechanism, Schadensmechanismus]}

  - name: dim_cause_code
    description: "Conformed cause-code dimension promoting the former free-text cause code to a governed taxonomy."
    purpose: "Standardized cause classification shared across failure and quality facts."
    scd_type: 1
    columns:
      - {name: CauseCodeKey, type: int, role: key}
      - {name: CauseCode, type: text}
      - {name: CauseDescription, type: text}
      - {name: CauseCategory, type: text, nullable: true, synonyms: [Cause Group, Cause Class, Ursachenkategorie]}

  - name: dim_defect_mode
    description: "ISO 9001 / IATF 16949 defect taxonomy (defect type and category) for quality analysis."
    purpose: "Standardized defect classification for defect-rate and COPQ attribution."
    scd_type: 1
    columns:
      - {name: DefectModeKey, type: int, role: key}
      - {name: DefectCode, type: text}
      - {name: DefectName, type: text}
      - {name: DefectCategory, type: text, nullable: true, synonyms: [Defect Group, Defect Class, Fehlerkategorie]}

fact:
  - name: fact_ops
    description: "Production line-day facts (planned/run/downtime, output, scrap) for OEE."
    purpose: "OEE, availability, performance, and throughput reporting."
    grain: line_day
    columns:
      - {name: DateKey, type: int, ref: dim_date}
      - {name: OrgKey, type: int, ref: dim_org}
      - {name: AssetKey, type: int, ref: dim_asset, nullable: true}
      - {name: LossTypeKey, type: int, ref: dim_loss_type, nullable: true}
      - {name: Planned Time Minutes, type: decimal, agg: sum}
      - {name: Run Time Minutes, type: decimal, agg: sum}
      - {name: Downtime Minutes, type: decimal, agg: sum}
      - {name: Output Units, type: decimal, agg: sum}
      - {name: Good Units, type: decimal, agg: sum}
      - {name: Scrap Units, type: decimal, agg: sum}
      - {name: Standard Rate Units Per Minute, type: decimal}

  - name: fact_ops_failures
    description: "Failure events per asset (start/end, repair duration, cause) for MTBF and root cause."
    purpose: "Reliability and failure analysis."
    grain: failure_event
    columns:
      - {name: AssetKey, type: int, ref: dim_asset}
      - {name: Failure Start DateTime, type: datetime}
      - {name: Failure End DateTime, type: datetime}
      - {name: Repair Duration Hours, type: decimal}
      - {name: Downtime Minutes, type: decimal}
      - {name: FailureModeKey, type: int, ref: dim_failure_mode, nullable: true}
      - {name: CauseCodeKey, type: int, ref: dim_cause_code, nullable: true}
      - {name: Cause Code, type: text, nullable: true}   # retained free-text for backward-compat; CauseCodeKey is the conformed reference

  - name: fact_maintenance
    description: "Maintenance orders (PM/CM) per asset and date with status and on-time flags."
    purpose: "Maintenance compliance and planning."
    grain: maintenance_order
    columns:
      - {name: AssetKey, type: int, ref: dim_asset}
      - {name: DateKey, type: int, ref: dim_date}
      - {name: Order Type, type: text}            # PM / CM
      - {name: Order Status, type: text}
      - {name: On Time Flag, type: boolean, nullable: true}
      - {name: Parts Stockout Flag, type: boolean, nullable: true}

  - name: fact_quality
    description: "Line-day quality facts (total/good/scrap/rework units, defect count) for FPY and COPQ."
    purpose: "First-pass yield and cost of poor quality."
    grain: line_day
    columns:
      - {name: DateKey, type: int, ref: dim_date}
      - {name: OrgKey, type: int, ref: dim_org}
      - {name: ProductKey, type: int, ref: dim_product, nullable: true}
      - {name: Total Units, type: decimal, agg: sum}
      - {name: Good Units, type: decimal, agg: sum}
      - {name: Scrap Units, type: decimal, agg: sum}
      - {name: Rework Units, type: decimal, agg: sum}
      - {name: Defect Count, type: decimal, agg: sum, nullable: true}
      - {name: DefectModeKey, type: int, ref: dim_defect_mode, nullable: true}
      - {name: CauseCodeKey, type: int, ref: dim_cause_code, nullable: true}

  - name: fact_quality_costs
    grain: month_product
    columns:
      - {name: DateKey, type: int, ref: dim_date}
      - {name: OrgKey, type: int, ref: dim_org}
      - {name: ProductKey, type: int, ref: dim_product, nullable: true}
      - {name: Prevention Cost, type: currency, agg: sum}
      - {name: Appraisal Cost, type: currency, agg: sum}
      - {name: Internal Failure Cost, type: currency, agg: sum}
      - {name: External Failure Cost, type: currency, agg: sum}
      - {name: COPQ Amount, type: currency, agg: sum}    # total cost of poor quality (Internal + External Failure; PAF total)

  - name: fact_complaints
    grain: complaint
    columns:
      - {name: DateKey, type: int, ref: dim_date}
      - {name: ProductKey, type: int, ref: dim_product}
      - {name: Complaint Count, type: int, agg: sum}
      - {name: Severity, type: text, nullable: true}
      - {name: OrgKey, type: int, ref: dim_org, nullable: true}

  - name: fact_shipments
    grain: shipment_line
    columns:
      - {name: DateKey, type: int, ref: dim_date}
      - {name: ProductKey, type: int, ref: dim_product}
      - {name: OrgKey, type: int, ref: dim_org}
      - {name: Shipped Units, type: decimal, agg: sum}

  - name: fact_safety
    description: "Site-month safety facts (incident count, severity, lost-time flag) for EHS reporting."
    purpose: "Safety incident tracking and lost-time injury monitoring."
    grain: site_month
    columns:
      - {name: DateKey, type: int, ref: dim_date}
      - {name: OrgKey, type: int, ref: dim_org}
      - {name: Incident Count, type: int, agg: sum}
      - {name: Severity, type: text, nullable: true}
      - {name: Lost Time Injury Flag, type: boolean, nullable: true}

quality_rules:
  freshness_sla:
    fact_ops: daily                 # production data by shift-end; next-day availability expected
    fact_ops_failures: real-time    # failure events captured within 30 min of occurrence
    fact_maintenance: daily
    fact_quality: daily
    fact_quality_costs: monthly
    fact_complaints: daily
    fact_shipments: daily
    fact_safety: monthly
  key_nullability:
    - "fact_ops.DateKey, OrgKey, Planned Time Minutes, Run Time Minutes, Output Units: never null"
    - "fact_ops_failures.AssetKey, Failure Start DateTime, Repair Duration Hours: never null"
    - "fact_quality.DateKey, OrgKey, Total Units, Good Units, Scrap Units: never null"
    - "fact_maintenance.AssetKey, DateKey, Order Type, Order Status: never null"
    - "fact_quality_costs.DateKey, OrgKey: never null"
    - "fact_safety.DateKey, OrgKey, Incident Count: never null"
  value_ranges:
    - "fact_ops.Run Time Minutes: >= 0; <= Planned Time Minutes"
    - "fact_ops.Downtime Minutes: >= 0"
    - "fact_ops.Good Units: >= 0; <= Output Units"
    - "fact_quality.Good Units: >= 0; <= Total Units"
    - "fact_quality.Scrap Units + Rework Units: <= Total Units"
    - "fact_ops.Standard Rate Units Per Minute: > 0 (must be a positive reference rate)"
    - "fact_quality_costs.Prevention Cost, Appraisal Cost, Internal Failure Cost, External Failure Cost: >= 0"
    - "fact_quality_costs.COPQ Amount: >= 0; >= Internal Failure Cost + External Failure Cost"
    - "fact_safety.Incident Count: >= 0"
  referential_integrity:
    - "fact_ops.AssetKey → dim_asset (nullable; absent = line without asset-level tracking)"
    - "fact_ops.LossTypeKey → dim_loss_type (nullable; absent = unclassified loss)"
    - "fact_ops_failures.FailureModeKey → dim_failure_mode (nullable; absent = unclassified failure mode)"
    - "fact_ops_failures.CauseCodeKey → dim_cause_code (nullable; absent = uncoded cause)"
    - "fact_quality.ProductKey → dim_product (nullable; absent = multi-product line run)"
    - "fact_quality.DefectModeKey → dim_defect_mode (nullable; absent = unclassified defect)"
    - "fact_quality.CauseCodeKey → dim_cause_code (nullable; absent = uncoded cause)"
    - "fact_maintenance.AssetKey → dim_asset (required)"
    - "fact_safety.DateKey → dim_date (required); fact_safety.OrgKey → dim_org (required)"

settings:
  timezone: Europe/Berlin
  fiscal_year_start: 01-01
