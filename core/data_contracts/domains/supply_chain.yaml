domain: supply_chain
version: v1.2
owner: Supply Chain Data Product

dimension:
  - name: dim_date
    description: "Calendar dimension for time slicing in supply chain."
    purpose: "Time dimension for inventory, fulfillment, and forecast reporting."
    scd_type: 1
    columns:
      - {name: DateKey, type: int, role: key}
      - {name: Date, type: date}
      - {name: Year, type: int}
      - {name: Quarter, type: text, allowed_values: [Q1, Q2, Q3, Q4]}
      - {name: Month, type: text}
      - {name: MonthNumber, type: int}
      - {name: Week, type: text, nullable: true}

  - name: dim_org
    description: "Location/organization dimension (location, region, channel) for supply chain."
    purpose: "Scoping for inventory, fulfillment, and replenishment."
    scd_type: 2
    columns:
      - {name: OrgKey, type: int, role: key}
      - {name: Location, type: text, synonyms: [Site, Distribution Center, Node, Standort, Lager]}
      - {name: Region, type: text, nullable: true, allowed_values: [DACH, Benelux, Nordics, SouthernEurope, CEE], synonyms: [Geography, Territory, Vertriebsregion, Gebiet]}
      - {name: Channel, type: text, nullable: true, allowed_values: [Retail, Online, Wholesale, Marketplace, Direct, Outlet], synonyms: [Distribution Channel, Route to Market, Vertriebskanal, Absatzkanal]}
      - {name: Customer, type: text, nullable: true, synonyms: [Account, Ship-To, Consignee, Warenempfänger]}

  - name: dim_product
    description: "Product dimension with ABC/XYZ classification for supply chain."
    purpose: "Product-level inventory, COGS, and fulfillment."
    scd_type: 2
    columns:
      - {name: ProductKey, type: int, role: key}
      - {name: ProductCode, type: text}
      - {name: ProductName, type: text}
      - {name: Category, type: text, allowed_values: [Fashion, "Home & Living", Consumer Electronics], synonyms: [Product Group, Warengruppe, Produktgruppe]}
      - {name: Subcategory, type: text, nullable: true, allowed_values: [Apparel, Footwear, Accessories, Jewelry, Furniture, Decor, Kitchenware, Bedding, Lighting, TVs, Audio, Computers, Smartphones, Gaming], synonyms: [Sub Category, Untergruppe, Unterkategorie]}
      - {name: ABC_Class, type: text, nullable: true, allowed_values: [A, B, C], synonyms: [ABC Class, ABC Classification, ABC-Analyse, ABC-Klassifizierung]}
      - {name: XYZ_Class, type: text, nullable: true, allowed_values: [X, Y, Z], synonyms: [XYZ Class, XYZ Classification, XYZ-Analyse, RSU-Analyse]}

  - name: dim_lane
    description: "Transport lane dimension (origin, destination, mode) for fulfillment."
    purpose: "Lane-level OTIF and logistics analysis."
    scd_type: 1
    columns:
      - {name: LaneKey, type: int, role: key}
      - {name: Origin, type: text, allowed_values: [DC-AT-01, DC-AT-02, DC-BE-01, DC-CH-01, DC-CH-02, DC-DE-01, DC-DE-02, DC-NL-01], synonyms: [Ship-From, Source DC, Versandort, Quelle]}
      - {name: Destination, type: text, allowed_values: [AT, BE, CH, DE, DK, ES, LU, NL, NO, SE], synonyms: [Ship-To, Delivery Country, Zielland, Empfangsort]}
      - {name: Mode, type: text, nullable: true, allowed_values: [Road, Rail, Air, Sea], synonyms: [Transport Mode, Shipping Mode, Verkehrsträger, Transportmodus]}

  - name: dim_carrier_lane
    description: "Carrier-lane dimension (carrier, origin, destination, lane, mode) for on-time root cause."
    purpose: "Carrier and lane-level on-time delivery root cause analysis (SCM-002)."
    scd_type: 1
    columns:
      - {name: CarrierLaneKey, type: int, role: key}
      - {name: Carrier, type: text, synonyms: [Carrier Name, Transporteur, Spediteur, Frachtführer]}
      - {name: Origin, type: text, synonyms: [Ship-From, Source DC, Versandort, Quelle]}
      - {name: Destination, type: text, synonyms: [Ship-To, Delivery Country, Zielland, Empfangsort]}
      - {name: Lane, type: text, synonyms: [Origin-Destination, Route, Verbindung, Strecke]}
      - {name: Mode, type: text, nullable: true, allowed_values: [Road, Rail, Air, Sea], synonyms: [Transport Mode, Shipping Mode, Verkehrsträger, Transportmodus]}

  - name: dim_forecastability
    description: "Forecastability segmentation (ABC/XYZ class, demand CoV band) for segment-specific targets."
    purpose: "Segment-specific forecast accuracy targets and FVA benchmarking (SCM-003)."
    scd_type: 1
    columns:
      - {name: ForecastabilityKey, type: int, role: key}
      - {name: ABC_Class, type: text, allowed_values: [A, B, C], synonyms: [ABC Class, ABC Classification, ABC-Analyse, ABC-Klassifizierung]}
      - {name: XYZ_Class, type: text, allowed_values: [X, Y, Z], synonyms: [XYZ Class, XYZ Classification, XYZ-Analyse, RSU-Analyse]}
      - {name: Demand_CoV_Band, type: text, allowed_values: [Low, Medium, High], synonyms: [Demand CoV Band, Coefficient of Variation Band, Variabilitätsklasse, Streuungsband]}

fact:
  - name: fact_inventory
    description: "Daily inventory snapshot (on-hand/average/obsolete) at location-SKU-day grain for precise DIO."
    purpose: "Inventory value, days inventory outstanding (DIO), and obsolescence reporting (SCM-001)."
    grain: location_sku_day
    columns:
      - {name: DateKey, type: int, ref: dim_date}
      - {name: OrgKey, type: int, ref: dim_org}
      - {name: ProductKey, type: int, ref: dim_product}
      - {name: Average Inventory Amount, type: currency, agg: sum}
      - {name: Average Inventory Units, type: decimal, agg: sum}
      - {name: Obsolete Inventory Amount, type: currency, agg: sum, nullable: true}
      - {name: Obsolete Inventory Units, type: decimal, agg: sum, nullable: true}

  - name: fact_cogs
    description: "Cost of goods sold at location-SKU-month grain."
    purpose: "COGS and margin analysis."
    grain: location_sku_month
    columns:
      - {name: DateKey, type: int, ref: dim_date}
      - {name: OrgKey, type: int, ref: dim_org}
      - {name: ProductKey, type: int, ref: dim_product}
      - {name: COGS Amount, type: currency, agg: sum}

  - name: fact_fulfillment
    description: "Order-level fulfillment (OTIF, on-time, in-full, penalties, expedite)."
    purpose: "Delivery performance and logistics cost."
    grain: order
    columns:
      - {name: DateKey, type: int, ref: dim_date}
      - {name: OrgKey, type: int, ref: dim_org}
      - {name: ProductKey, type: int, ref: dim_product, nullable: true}
      - {name: LaneKey, type: int, ref: dim_lane, nullable: true}
      - {name: CarrierLaneKey, type: int, ref: dim_carrier_lane, nullable: true}
      - {name: OTIF Flag, type: boolean}
      - {name: On-Time Flag, type: boolean, nullable: true}
      - {name: In-Full Flag, type: boolean, nullable: true}
      - {name: Order Correct Flag, type: boolean, nullable: true}
      - {name: Order Qty, type: decimal, agg: sum}
      - {name: Penalty Amount, type: currency, agg: sum, nullable: true}
      - {name: Expedite Cost, type: currency, agg: sum, nullable: true}

  - name: fact_stockout
    description: "Stockout events and lost demand at location-SKU-day."
    purpose: "Stockout rate and lost sales."
    grain: location_sku_day
    columns:
      - {name: DateKey, type: int, ref: dim_date}
      - {name: OrgKey, type: int, ref: dim_org}
      - {name: ProductKey, type: int, ref: dim_product}
      - {name: Stockout Flag, type: boolean}
      - {name: Lost Demand Units, type: decimal, agg: sum, nullable: true}
      - {name: Demand Units, type: decimal, agg: sum}

  - name: fact_forecast
    description: "Demand forecast by SKU, location, and month with naive/statistical/consensus forecast and actuals for FVA."
    purpose: "Forecast accuracy, segment-specific targets, and Forecast Value Added (FVA) vs naive benchmark (SCM-003)."
    grain: sku_location_month
    columns:
      - {name: DateKey, type: int, ref: dim_date}
      - {name: ProductKey, type: int, ref: dim_product}
      - {name: OrgKey, type: int, ref: dim_org, nullable: true}
      - {name: ForecastabilityKey, type: int, ref: dim_forecastability, nullable: true}
      - {name: Forecast Units, type: decimal, agg: sum}
      - {name: Naive Forecast Units, type: decimal, agg: sum, nullable: true}
      - {name: Statistical Forecast Units, type: decimal, agg: sum, nullable: true}
      - {name: Actual Units, type: decimal, agg: sum, nullable: true}
      - {name: Forecast Version, type: text, nullable: true}

  - name: fact_sales
    description: "Sales units by SKU and month (supply chain view)."
    purpose: "Demand and sell-through for SCM."
    grain: sku_month
    columns:
      - {name: DateKey, type: int, ref: dim_date}
      - {name: ProductKey, type: int, ref: dim_product}
      - {name: OrgKey, type: int, ref: dim_org, nullable: true}
      - {name: Sales Units, type: decimal, agg: sum}

  - name: fact_procurement
    description: "Purchase order line facts (amount, quantity, contracted vs actual)."
    purpose: "Procurement spend and compliance."
    grain: purchase_order_line
    columns:
      - {name: DateKey, type: int, ref: dim_date}
      - {name: OrgKey, type: int, ref: dim_org}
      - {name: ProductKey, type: int, ref: dim_product, nullable: true}
      - {name: Purchase Amount, type: currency, agg: sum}
      - {name: Contracted Amount, type: currency, agg: sum, nullable: true}
      - {name: Actual Unit Price, type: currency, agg: sum, nullable: true}
      - {name: Contract Unit Price, type: currency, agg: sum, nullable: true}
      - {name: Purchase Quantity, type: decimal, agg: sum}

  - name: fact_replenishment
    description: "Replenishment events at location-SKU-day."
    purpose: "Replenishment cycle and fill rate."
    grain: location_sku_day
    columns:
      - {name: DateKey, type: int, ref: dim_date}
      - {name: OrgKey, type: int, ref: dim_org}
      - {name: ProductKey, type: int, ref: dim_product}
      - {name: Actual Orders, type: decimal, agg: sum}
      - {name: Target Orders, type: decimal, agg: sum}

  - name: fact_logistics
    grain: shipment_line
    columns:
      - {name: DateKey, type: int, ref: dim_date}
      - {name: OrgKey, type: int, ref: dim_org}
      - {name: ProductKey, type: int, ref: dim_product, nullable: true}
      - {name: LaneKey, type: int, ref: dim_lane, nullable: true}
      - {name: Units Qty, type: decimal, agg: sum}
      - {name: Cost Amount, type: currency, agg: sum}

  - name: fact_warehouse
    grain: warehouse_day
    columns:
      - {name: DateKey, type: int, ref: dim_date}
      - {name: OrgKey, type: int, ref: dim_org}
      - {name: Order Lines Processed, type: decimal, agg: sum}
      - {name: Productive Hours, type: decimal, agg: sum}
      - {name: Picks Count, type: decimal, agg: sum}
      - {name: Picking Hours, type: decimal, agg: sum, nullable: true}
      - {name: Cost Amount, type: currency, agg: sum}

quality_rules:
  freshness_sla:
    fact_inventory: daily             # EOD snapshot required for coverage calculation
    fact_stockout: daily              # intraday preferred; next-day maximum
    fact_fulfillment: daily           # order closure events same-day
    fact_forecast: weekly             # S&OP cycle; latest version by Monday 08:00
    fact_sales: daily
    fact_procurement: daily
    fact_replenishment: daily
    fact_logistics: daily
    fact_warehouse: daily
    fact_cogs: monthly
  key_nullability:
    - "fact_inventory.DateKey, OrgKey, ProductKey, Average Inventory Amount: never null"
    - "fact_fulfillment.DateKey, OrgKey, OTIF Flag: never null"
    - "fact_stockout.DateKey, OrgKey, ProductKey, Stockout Flag, Demand Units: never null"
    - "fact_forecast.DateKey, ProductKey, Forecast Units: never null"
  value_ranges:
    - "fact_inventory.Average Inventory Amount: >= 0; Average Inventory Units >= 0"
    - "fact_inventory.Obsolete Inventory Amount: >= 0 when present; <= Average Inventory Amount"
    - "fact_fulfillment.Order Qty: > 0"
    - "fact_fulfillment.Penalty Amount: >= 0 when present"
    - "fact_stockout.Demand Units: >= 0; Lost Demand Units >= 0 and <= Demand Units when present"
    - "fact_forecast.Forecast Units: >= 0"
    - "fact_forecast.Naive Forecast Units: >= 0 when present"
    - "fact_forecast.Statistical Forecast Units: >= 0 when present"
    - "fact_forecast.Actual Units: >= 0 when present"
  referential_integrity:
    - "fact_fulfillment.LaneKey → dim_lane (nullable; absent = direct or unrouted shipment)"
    - "fact_fulfillment.CarrierLaneKey → dim_carrier_lane (nullable; absent = carrier/lane not resolved)"
    - "fact_fulfillment.ProductKey → dim_product (nullable)"
    - "fact_forecast.OrgKey → dim_org (nullable; absent = company-wide forecast)"
    - "fact_forecast.ForecastabilityKey → dim_forecastability (nullable; absent = unsegmented SKU)"

settings:
  timezone: Europe/Berlin
  fiscal_year_start: 01-01
