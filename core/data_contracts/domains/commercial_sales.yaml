domain: commercial_sales
version: v1.2
owner: Commercial Data Product

dimension:
  - name: dim_date
    description: "Calendar dimension with fiscal hierarchy (Fiscal Year > Quarter > Month > Date)."
    purpose: "Single source for time slicing and fiscal reporting."
    scd_type: 1
    columns:
      - {name: DateKey, type: int, role: key}
      - {name: Date, type: date}
      - {name: Year, type: int}
      - {name: Quarter, type: text, allowed_values: [Q1, Q2, Q3, Q4]}
      - {name: Month, type: text}
      - {name: MonthNumber, type: int}
      - {name: Week, type: text, nullable: true}
      - {name: Month Name, type: text}
      - {name: Fiscal Year, type: int}
      - {name: Fiscal Period, type: text}
      - {name: CalendarYearMonth, type: text}

  - name: dim_org
    description: "Organization dimension (region, country, channel, org name) for reporting and RLS."
    purpose: "Scoping and security for entity-level reporting."
    scd_type: 2
    columns:
      - {name: OrgKey, type: int, role: key}
      - {name: OrgCode, type: text}
      - {name: OrgName, type: text}
      - {name: Region, type: text, nullable: true, description: "Sales region grouping countries.", allowed_values: [DACH, Benelux, Nordics, SouthernEurope, CEE], synonyms: [Sales Region, Geo]}
      - {name: Country, type: text, nullable: true, description: "Country of the selling org unit."}
      - {name: Channel, type: text, nullable: true, description: "Go-to-market sales channel.", allowed_values: [Retail, Online, Wholesale, Marketplace, Outlet], synonyms: [Sales Channel, Route to Market]}
      - {name: OrgLevel, type: text, allowed_values: [Group, Region, Country, DC, Store]}
      - {name: OrgType, type: text, allowed_values: [Group, Region, Country, DC, Store]}
      - {name: ParentOrgKey, type: decimal, nullable: true}
      - {name: Currency Code, type: text}
      - {name: Open DateKey, type: int}
      - {name: Close DateKey, type: decimal, nullable: true}
      - {name: IssueType, type: text, nullable: true, allowed_values: [Account, Billing, Delivery, Order, Product, Technical]}
      - {name: Severity, type: text, nullable: true, allowed_values: [Critical, High, Medium, Low]}

  - name: dim_product
    description: "Product dimension with category hierarchy (Category > Sub Category > Brand > Product Name)."
    purpose: "Product and margin analysis, mix reporting."
    scd_type: 2
    columns:
      - {name: ProductKey, type: int, role: key}
      - {name: ProductCode, type: text}
      - {name: ProductName, type: text}
      - {name: Category, type: text, allowed_values: [Fashion, "Home & Living", Consumer Electronics]}
      - {name: Subcategory, type: text, allowed_values: [Apparel, Footwear, Accessories, Jewelry, Furniture, Decor, Kitchenware, Bedding, Lighting, TVs, Audio, Computers, Smartphones, Gaming]}
      - {name: Brand, type: text}
      - {name: ProductFamily, type: text, nullable: true, target_state: true}   # for comparable item grouping (cannibalization)
      - {name: Lifecycle Status, type: text, allowed_values: [Active, EOL]}
      - {name: List Price Amount, type: currency}

  - name: dim_customer
    description: "Customer dimension (segment, region, country) for CRM and value reporting."
    purpose: "Customer-level analysis, CLV, retention, and segmentation."
    scd_type: 2
    columns:
      - {name: CustomerKey, type: int, role: key}
      - {name: CustomerCode, type: text}
      - {name: CustomerName, type: text}
      - {name: Segment, type: text, nullable: true, allowed_values: [Loyalty, HighValue, New, Occasional, ChurnRisk]}
      - {name: Channel, type: text, nullable: true, allowed_values: [Retail, Online, Wholesale, Marketplace, Outlet], target_state: true}
      - {name: Region, type: text, nullable: true, allowed_values: [DACH, Benelux, Nordics, SouthernEurope, CEE]}
      - {name: Channel Preference, type: text, allowed_values: [Store, ECom, Mixed]}
      - {name: Tenure Bucket, type: text, allowed_values: [<1Y, 1-3Y, ">3Y"]}

  - name: dim_promo
    description: "Promotion dimension (name, type, mechanic, discount depth, date range) for promo effectiveness."
    purpose: "Promo mechanic comparison, ROI, realization, incremental sales, elasticity, and cannibalization analysis."
    scd_type: 1
    columns:
      - {name: PromoKey, type: int, role: key}
      - {name: PromoName, type: text, synonyms: [Promo Name, Promotion, Campaign Name]}
      - {name: Promo Type, type: text, nullable: true, description: "Promotion type family.", allowed_values: [Bundle, "Multi-buy", Discount, "None"], synonyms: [Promotion Type]}
      - {name: Promo Mechanic, type: text, nullable: true, description: "Specific offer mechanic applied.", allowed_values: [FixedPrice, MultiBuy, PercentOff, "None"], synonyms: [Mechanic, Offer Mechanic]}
      - {name: "Discount %", type: decimal, nullable: true, description: "Promotion discount depth as a fraction (0-1)."}
      - {name: Start DateKey, type: int, nullable: true}
      - {name: End DateKey, type: int, nullable: true}
      - {name: PromoCode, type: text}

  # COM-005 pipeline & conversion (convention). Aurora gold: fact_pipeline + fact_sales_target.
  - name: dim_sales_stage
    description: "Opportunity funnel stage (Lead → Qualified → Proposal → Negotiation → Closed Won/Lost)."
    purpose: "Stage conversion, win/loss, and funnel-leak analysis for the sales pipeline."
    scd_type: 1
    columns:
      - {name: StageKey, type: int, role: key}
      - {name: Stage, type: text, allowed_values: [Lead, Qualified, Proposal, Negotiation, "Closed Won", "Closed Lost"]}
      - {name: Stage Order, type: int}
      - {name: Is Won, type: bool}
      - {name: Is Lost, type: bool}

  - name: dim_salesrep
    description: "Sales representative (rep, team, region) for pipeline ownership."
    purpose: "Rep- and team-level pipeline coverage, win-rate, and velocity analysis."
    scd_type: 1
    columns:
      - {name: SalesRepKey, type: int, role: key}
      - {name: Rep Name, type: text}
      - {name: Team, type: text, allowed_values: ["DACH Sales", "Benelux Sales", "Nordics Sales", "SouthernEurope Sales", "CEE Sales"]}
      - {name: Region, type: text, allowed_values: [DACH, Benelux, Nordics, SouthernEurope, CEE]}

  # COM-001 price/volume/mix bridge for the Net-Sales-vs-Plan waterfall.
  - name: dim_pvm_driver
    description: "Price/Volume/Mix driver bridge (3 rows) for the PVM waterfall."
    purpose: "Decomposes Net Sales Δ vs Plan into governed Price/Volume/Mix effects."
    scd_type: 1
    columns:
      - {name: PVMDriverKey, type: int, role: key}
      - {name: Driver, type: text, allowed_values: [Price, Volume, Mix]}
      - {name: Sort Order, type: int}
      - {name: Sign Convention, type: text, allowed_values: ["As-is"]}

fact:
  - name: fact_sales
    description: "Invoice-line sales (net sales, quantity, price, COGS) with plan and prior year."
    purpose: "Core revenue and margin reporting; PVM and variance analysis."
    grain: invoice_line
    columns:
      - {name: DateKey, type: int, ref: dim_date, cardinality: many-to-one}
      - {name: OrgKey, type: int, ref: dim_org, cardinality: many-to-one}
      - {name: ProductKey, type: int, ref: dim_product, cardinality: many-to-one}
      - {name: CustomerKey, type: int, ref: dim_customer, nullable: true, cardinality: many-to-one}
      - {name: PromoKey, type: int, ref: dim_promo, nullable: false, cardinality: many-to-one, unknown_member: -1}
      - {name: Promo Flag, type: boolean, nullable: true}   # identifies promotional transactions
      - {name: Net Sales Amount, type: currency, agg: sum, description: "Invoiced revenue net of discounts and returns.", synonyms: [Revenue, Net Revenue, Umsatz]}
      - {name: Quantity, type: decimal, agg: sum, description: "Units sold on the invoice line.", unit: units}
      - {name: Plan Quantity, type: decimal, agg: sum, nullable: true}
      - {name: List Price Amount, type: currency, agg: sum}
      - {name: Net Price Amount, type: currency, agg: sum}
      - {name: Discount Amount, type: currency, agg: sum, nullable: true, checks: [{gte: 0, when_present: true}]}
      - {name: Plan Sales Amount, type: currency, agg: sum, nullable: true}
      - {name: Last Year Sales Amount, type: currency, agg: sum, nullable: true}
      - {name: Cost of Goods Sold Amount, type: currency, agg: sum}
      - {name: InvoiceLineID, type: text}
      - {name: Plan COGS Amount, type: currency, agg: sum}

  - name: fact_plan_sales
    description: "Planned sales and COGS at product-month grain for variance vs plan."
    purpose: "Plan vs actual reporting and forecasting alignment."
    grain: product_month
    columns:
      - {name: DateKey, type: int, ref: dim_date, cardinality: many-to-one}
      - {name: OrgKey, type: int, ref: dim_org, cardinality: many-to-one}
      - {name: ProductKey, type: int, ref: dim_product, cardinality: many-to-one}
      - {name: Plan Net Sales Amount, type: currency, agg: sum}
      - {name: Plan Cost of Goods Sold Amount, type: currency, agg: sum, nullable: true}
      - {name: Plan Gross Margin Amount, type: currency, agg: sum, nullable: true}

  - name: fact_promo
    description: "Promotion baseline, incremental, cannibalization, cost, and margin per promo, SKU, and period."
    purpose: "Promo ROI, incremental sales, realization, and cannibalization calculations (COM-004)."
    grain: promo_product_period
    columns:
      - {name: PromoKey, type: int, ref: dim_promo, cardinality: many-to-one}
      - {name: ProductKey, type: int, ref: dim_product, cardinality: many-to-one, target_state: true}
      - {name: DateKey, type: int, ref: dim_date, cardinality: many-to-one, target_state: true}
      - {name: OrgKey, type: int, ref: dim_org, nullable: true, cardinality: many-to-one, target_state: true}
      - {name: Baseline Sales Amount, type: currency, agg: sum, nullable: true, description: "Expected non-promo sales used as the incremental reference level."}
      - {name: Incremental Sales Amount, type: currency, agg: sum, nullable: true, description: "Promo sales above baseline (Promo Sales - Baseline Sales).", target_state: true}
      - {name: Cannibalized Sales Amount, type: currency, agg: sum, nullable: true, description: "Sales lost on non-promoted comparable items vs baseline.", checks: [{gte: 0, when_present: true}], target_state: true}
      - {name: Promo Cost, type: currency, agg: sum, nullable: true, description: "Total promotional spend for ROI.", synonyms: [Promo Cost Amount, Trade Spend], checks: [{gte: 0, when_present: true}]}
      - {name: Incremental GM Amount, type: currency, agg: sum, nullable: true, description: "Incremental gross margin from the promotion (ROI numerator).", synonyms: [Incremental Gross Margin Amount], target_state: true}
      - {name: Funding Amount, type: currency, agg: sum, nullable: true}
      - {name: Baseline Quantity, type: decimal, agg: sum, nullable: true}
      - {name: Baseline Non-Promo Sales Amount, type: currency, agg: sum, nullable: true}   # for cannibalization calculations

  - name: fact_customer_events
    description: "Customer activity and churn flags plus attrition risk at customer-month grain."
    purpose: "Retention, churn, and risk reporting."
    grain: customer_month
    columns:
      - {name: DateKey, type: int, ref: dim_date, cardinality: many-to-one}
      - {name: CustomerKey, type: int, ref: dim_customer, cardinality: many-to-one}
      - {name: OrgKey, type: int, ref: dim_org, nullable: true, cardinality: many-to-one}
      - {name: Activity Flag, type: boolean}
      - {name: Churn Flag, type: boolean}
      - {name: Attrition Risk %, type: decimal, nullable: true, checks: [{between: [0, 1], when_present: true}]}
    qa:
      - "Activity and Churn flags mutually consistent per customer-month."
      - "Attrition Risk % within [0;1] when present."

  - name: fact_customer_value
    description: "Customer lifetime value (CLV) and remaining value at customer-month grain."
    purpose: "CLV reporting and prioritization."
    grain: customer_month
    columns:
      - {name: DateKey, type: int, ref: dim_date, cardinality: many-to-one}
      - {name: CustomerKey, type: int, ref: dim_customer, cardinality: many-to-one}
      - {name: CLV Amount, type: currency, checks: [{gte: 0}]}
      - {name: CLV Remaining Amount, type: currency, nullable: true, checks: [{gte: 0, when_present: true}]}
    qa:
      - "CLV Amount >= 0; Remaining Amount >= 0 when present."

  - name: fact_experience
    description: "Customer complaint and experience events (customer, org, date, severity)."
    purpose: "Complaint and experience KPI reporting."
    grain: customer_event
    columns:
      - {name: Complaint ID, type: text, role: key}
      - {name: CustomerKey, type: int, ref: dim_customer, cardinality: many-to-one}
      - {name: OrgKey, type: int, ref: dim_org, nullable: true, cardinality: many-to-one}
      - {name: DateKey, type: int, ref: dim_date, cardinality: many-to-one}
      - {name: Severity, type: text, nullable: true}
      - {name: Complaint Type, type: text, allowed_values: [Billing Error, Delivery Issue, Product Quality, Return Request, Service Complaint]}
    qa:
      - "Complaint ID unique per event."

  - name: fact_nps
    description: "NPS survey responses (score, promoter/detractor flags) per response."
    purpose: "NPS and advocacy reporting."
    grain: customer_event
    columns:
      - {name: ResponseID, type: text, role: key}
      - {name: DateKey, type: int, ref: dim_date, cardinality: many-to-one}
      - {name: CustomerKey, type: int, ref: dim_customer, nullable: true, cardinality: many-to-one}
      - {name: OrgKey, type: int, ref: dim_org, nullable: true, cardinality: many-to-one}
      - {name: NPS Score, type: number, checks: [{between: [0, 10]}]}
      - {name: Is Promoter, type: bool, nullable: true}
      - {name: Is Detractor, type: bool, nullable: true}
    qa:
      - "NPS Score in [0;10]; Promoter/Detractor flags mutually exclusive."

  # --- COM-005 pipeline facts (Aurora gold) ---
  - name: fact_pipeline
    description: "Sales opportunity (one row per opportunity) with funnel stage reached, value, and close outcome."
    purpose: "Pipeline value/coverage, win-rate, sales-cycle, conversion, and velocity."
    grain: opportunity
    columns:
      - {name: OpportunityID, type: int, role: key}
      - {name: DateKey, type: int, ref: dim_date, cardinality: many-to-one}
      - {name: OrgKey, type: int, ref: dim_org, cardinality: many-to-one}
      - {name: SalesRepKey, type: int, ref: dim_salesrep, cardinality: many-to-one}
      - {name: StageKey, type: int, ref: dim_sales_stage, cardinality: many-to-one}
      - {name: Create Date, type: int}
      - {name: Close Date, type: int, description: "0 when still open."}
      - {name: Opportunity Value Amount, type: currency, agg: sum}
      - {name: Open Qualified Value Amount, type: currency, agg: sum, description: "Value if open & qualified, else 0."}
      - {name: Won Flag, type: bool}
      - {name: Lost Flag, type: bool}
      - {name: Qualified Flag, type: bool}
      - {name: Won Count, type: int, agg: sum}
      - {name: Decided Count, type: int, agg: sum, description: "1 if won or lost (closed), else 0."}
      - {name: Cycle Days, type: decimal, agg: avg, nullable: true, description: "Close-Create for closed opps; blank while open."}

  - name: fact_sales_target
    description: "Remaining sales target per org and month (coverage denominator)."
    purpose: "Denominator of pipeline coverage (open qualified pipeline / remaining target)."
    grain: month_org
    columns:
      - {name: DateKey, type: int, ref: dim_date, cardinality: many-to-one}
      - {name: OrgKey, type: int, ref: dim_org, cardinality: many-to-one}
      - {name: Remaining Target Amount, type: currency, agg: sum}

quality_rules:
  # Not-null, FK, unbekannter Eintrag und Wertebereiche stehen strukturiert an den Spalten
  # (nullable, ref, unknown_member, checks). Hier bleibt nur, was sich nicht strukturieren laesst.
  freshness_sla: daily        # fact_sales refreshed within 24 h of business close; fact_customer_events monthly
  value_ranges:
    - "fact_nps.NPS Score: integer values only"
  referential_integrity:
    - "fact_sales.CustomerKey: NULL = unidentified customer"
    - "fact_sales.PromoKey: -1 (dim_promo 'No Promotion') = non-promotional transaction"
    - "fact_promo.OrgKey: NULL = promo not org-scoped"

settings:
  timezone: Europe/Berlin
  fiscal_year_start: 01-01
