domain: esg
version: v1.0
owner: ESG / Sustainability Data Product

# ESG contract covers environmental, social, and governance reporting inputs.
# Scope: carbon emissions, energy consumption, water/waste, workforce safety, D&I indicators.
# This v1.0 is a structured placeholder — tables and columns are indicative and require
# validation against the company's ESG reporting framework before production use.

dimension:
  - name: dim_date
    conformed_from: commercial_sales   # einzige Definition dort (Bus-Matrix, 29.09.2026)
    uses_columns: [DateKey, Date, Year, Quarter, Month, MonthNumber]

  - name: dim_org
    conformed_from: commercial_sales   # einzige Definition dort (Bus-Matrix, 29.09.2026)
    uses_columns: [OrgKey, SiteCode, SiteName, Region, Country, Segment]

  - name: dim_emission_scope
    showcase: false
    description: "GHG emission scope classification (Scope 1, 2, 3)."
    purpose: "Carbon reporting by emission scope."
    scd_type: 1
    columns:
      - {name: ScopeKey, type: int, role: key}
      - {name: ScopeCode, type: text}   # e.g. SCOPE_1, SCOPE_2, SCOPE_3
      - {name: ScopeName, type: text}
      - {name: Category, type: text, nullable: true}

fact:
  - name: fact_emissions
    showcase: false
    description: "GHG emissions (tCO2e) by site, scope, and period."
    purpose: "Carbon footprint reporting and net-zero progress tracking."
    grain: site_scope_month
    columns:
      - {name: DateKey, type: int, ref: dim_date, cardinality: many-to-one}
      - {name: OrgKey, type: int, ref: dim_org, cardinality: many-to-one}
      - {name: ScopeKey, type: int, ref: dim_emission_scope, cardinality: many-to-one}
      - {name: Emissions tCO2e, type: decimal, agg: sum, checks: [{gte: 0}]}
      - {name: Target Emissions tCO2e, type: decimal, agg: sum, nullable: true}

  - name: fact_energy
    showcase: false
    description: "Energy consumption (MWh) by source and site per month."
    purpose: "Energy intensity and renewable energy ratio reporting."
    grain: site_source_month
    columns:
      - {name: DateKey, type: int, ref: dim_date, cardinality: many-to-one}
      - {name: OrgKey, type: int, ref: dim_org, cardinality: many-to-one}
      - {name: Energy Source, type: text}       # e.g. Grid, Gas, Renewable
      - {name: Energy Consumed MWh, type: decimal, agg: sum}
      - {name: Is Renewable, type: boolean}

  - name: fact_water_waste
    showcase: false
    description: "Water withdrawal, recycled water, and waste generated per site per month."
    purpose: "Water intensity and waste-to-landfill reporting."
    grain: site_month
    columns:
      - {name: DateKey, type: int, ref: dim_date, cardinality: many-to-one}
      - {name: OrgKey, type: int, ref: dim_org, cardinality: many-to-one}
      - {name: Water Withdrawn m3, type: decimal, agg: sum, nullable: true}
      - {name: Water Recycled m3, type: decimal, agg: sum, nullable: true, checks: [{lte_column: Water Withdrawn m3, when_present: true}]}
      - {name: Waste Generated Tonnes, type: decimal, agg: sum, nullable: true}
      - {name: Waste Recycled Tonnes, type: decimal, agg: sum, nullable: true}

  - name: fact_safety
    showcase: false
    description: "Workplace safety incidents and lost time per site per month."
    purpose: "LTIFR, incident rate, and safety performance reporting."
    grain: site_month
    # Konformer Fakt (Bus-Matrix, 29.09.2026): die einzige Definition; operations verweist.
    # `Incidents` (esg) und `Incident Count` (operations) waren dieselbe Zählung: eine Spalte,
    # Name aus der KPI-Lineage (ops.safety.incident.count). Weder Gold noch Modell führen die Tabelle.
    uses_columns: [DateKey, OrgKey, Incident Count, Lost Time Incidents, Hours Worked, Fatalities]
    columns:
      - {name: DateKey, type: int, ref: dim_date, cardinality: many-to-one}
      - {name: OrgKey, type: int, ref: dim_org, cardinality: many-to-one}
      - {name: Incident Count, type: int, agg: sum, checks: [{gte: 0}]}
      - {name: Lost Time Incidents, type: int, agg: sum, checks: [{lte_column: Incident Count}]}
      - {name: Hours Worked, type: decimal, agg: sum}
      - {name: Fatalities, type: int, agg: sum, checks: [{gte: 0}]}
      # Severity und Lost Time Injury Flag (Merkmale je Vorfall) stehen seit 29.09.2026 in
      # operations.fact_safety_incidents (Korn incident), nicht in diesem Monats-Snapshot.

  - name: fact_di
    showcase: false
    description: "Diversity and inclusion metrics per org per reporting period."
    purpose: "D&I reporting (gender, leadership representation, pay gap)."
    grain: org_period
    columns:
      - {name: DateKey, type: int, ref: dim_date, cardinality: many-to-one}
      - {name: OrgKey, type: int, ref: dim_org, cardinality: many-to-one}
      - {name: Female Headcount, type: int, agg: sum, nullable: true}
      - {name: Total Headcount, type: int, agg: sum}
      - {name: Female Leadership %, type: decimal, nullable: true, checks: [{between: [0, 1], when_present: true}]}
      - {name: Gender Pay Gap %, type: decimal, nullable: true}

quality_rules:
  # Not-null, FK, unbekannter Eintrag und Wertebereiche stehen strukturiert an den Spalten
  # (nullable, ref, unknown_member, checks). Hier bleibt nur, was sich nicht strukturieren laesst.
  freshness_sla:
    fact_emissions: quarterly       # GHG data typically quarterly; annual for external reporting
    fact_energy: monthly
    fact_water_waste: monthly
    fact_safety: monthly
    fact_di: annually               # annual reporting cycle; quarterly updates where available
  value_ranges:
    - "fact_di.Gender Pay Gap %: may be negative (female-favourable gap); no range restriction"

settings:
  timezone: Europe/Berlin
  fiscal_year_start: 01-01
