domain: people
version: v1.2
owner: People Data Product

dimension:
  - name: dim_date
    scd_type: 1
    columns:
      - {name: DateKey, type: int, role: key}
      - {name: Date, type: date}
      - {name: Year, type: int}
      - {name: Quarter, type: text}
      - {name: Month, type: text}
      - {name: MonthNumber, type: int}
      - {name: MonthKey, type: int}

  - name: dim_org
    scd_type: 2
    columns:
      - {name: OrgKey, type: int, role: key}
      - {name: Entity, type: text}
      - {name: Region, type: text, nullable: true}
      - {name: Country, type: text, nullable: true}

fact:
  - name: fact_hr
    grain: month_org
    columns:
      - {name: DateKey, type: int, ref: dim_date}
      - {name: OrgKey, type: int, ref: dim_org}
      - {name: Headcount, type: decimal, agg: avg}
      - {name: Leavers, type: int, agg: sum}
      - {name: Absent Hours, type: decimal, agg: sum}
      - {name: Scheduled Hours, type: decimal, agg: sum}
      - {name: FTE, type: decimal, agg: sum}
      - {name: Personnel Cost, type: currency, agg: sum}

  - name: fact_it
    grain: month_org
    columns:
      - {name: DateKey, type: int, ref: dim_date}
      - {name: OrgKey, type: int, ref: dim_org}
      - {name: Digital Users, type: int, agg: sum}

  - name: fact_survey
    grain: survey_month
    columns:
      - {name: DateKey, type: int, ref: dim_date}
      - {name: OrgKey, type: int, ref: dim_org, nullable: true}
      - {name: Engaged Responses, type: int, agg: sum}
      - {name: Total Responses, type: int, agg: sum}
      - {name: Training Hours, type: decimal, agg: sum}

quality_rules:
  freshness_sla:
    fact_hr: monthly          # payroll-aligned; available within 5 business days of month close
    fact_it: monthly
    fact_survey: per-cycle    # survey data available within 2 weeks of survey close
  key_nullability:
    - "fact_hr.DateKey, OrgKey, Headcount, FTE: never null"
    - "fact_hr.Leavers, Absent Hours, Scheduled Hours: never null; must be >= 0"
    - "fact_survey.Engaged Responses, Total Responses: never null"
    - "fact_it.Digital Users: never null; must be >= 0"
  value_ranges:
    - "fact_hr.Headcount: >= 0"
    - "fact_hr.Absent Hours: >= 0; <= Scheduled Hours"
    - "fact_hr.FTE: >= 0"
    - "fact_survey.Engaged Responses: <= Total Responses"
    - "fact_hr.Personnel Cost: >= 0"
  referential_integrity:
    - "fact_hr.OrgKey → dim_org (required)"
    - "fact_survey.OrgKey → dim_org (nullable; absent = company-wide survey)"

settings:
  timezone: Europe/Berlin
  fiscal_year_start: 01-01
