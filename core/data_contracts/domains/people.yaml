domain: people
version: v1.2
owner: People Data Product

dimension:
  - name: dim_date
    conformed_from: commercial_sales   # einzige Definition dort (Bus-Matrix, 29.09.2026)
    uses_columns: [DateKey, Date, Year, Quarter, Month, MonthNumber, MonthKey]

  - name: dim_org
    conformed_from: commercial_sales   # einzige Definition dort (Bus-Matrix, 29.09.2026)
    uses_columns: [OrgKey, Entity, Region, Country]

  # HR-001 workforce/retention (ISO 30414). Realised in Aurora gold as fact_workforce
  # (segment grain) + fact_engagement_survey + fact_recruiting; supersedes the fact_hr/
  # fact_survey stubs above, which have no physical backing.
  - name: dim_employee_segment
    scd_type: 1
    columns:
      - {name: EmployeeSegmentKey, type: int, role: key}
      - {name: Segment, type: text}
      - {name: Function, type: text}
      - {name: Tenure Band, type: text}

  - name: dim_role
    scd_type: 1
    columns:
      - {name: RoleKey, type: int, role: key}
      - {name: Role, type: text}
      - {name: Job Family, type: text}
      - {name: Level, type: text}

fact:
  - name: fact_hr
    showcase: false
    grain: month_org
    columns:
      - {name: DateKey, type: int, ref: dim_date}
      - {name: OrgKey, type: int, ref: dim_org}
      - {name: Headcount, type: decimal, agg: avg, checks: [{gte: 0}]}
      - {name: Leavers, type: int, agg: sum, checks: [{gte: 0}]}
      - {name: Absent Hours, type: decimal, agg: sum, checks: [{gte: 0}, {lte_column: Scheduled Hours}]}
      - {name: Scheduled Hours, type: decimal, agg: sum, checks: [{gte: 0}]}
      - {name: FTE, type: decimal, agg: sum, checks: [{gte: 0}]}
      - {name: Personnel Cost, type: currency, agg: sum, checks: [{gte: 0}]}

  - name: fact_it
    showcase: false
    grain: month_org
    columns:
      - {name: DateKey, type: int, ref: dim_date}
      - {name: OrgKey, type: int, ref: dim_org}
      - {name: Digital Users, type: int, agg: sum, checks: [{gte: 0}]}

  - name: fact_survey
    showcase: false
    grain: survey_month
    columns:
      - {name: DateKey, type: int, ref: dim_date}
      - {name: OrgKey, type: int, ref: dim_org, nullable: true}
      - {name: Engaged Responses, type: int, agg: sum, checks: [{lte_column: Total Responses}]}
      - {name: Total Responses, type: int, agg: sum}
      - {name: Training Hours, type: decimal, agg: sum}

  # --- HR-001 physical facts (Aurora gold) ---
  - name: fact_workforce
    grain: month_org_segment
    columns:
      - {name: DateKey, type: int, ref: dim_date}
      - {name: OrgKey, type: int, ref: dim_org}
      - {name: EmployeeSegmentKey, type: int, ref: dim_employee_segment}
      - {name: Headcount FTE, type: decimal, agg: sum, checks: [{gt: 0}]}
      - {name: Voluntary Leavers, type: decimal, agg: sum}
      - {name: Involuntary Leavers, type: decimal, agg: sum}
      - {name: Hires, type: decimal, agg: sum}
      - {name: Absence Days, type: decimal, agg: sum, checks: [{gte: 0}, {lte_column: Scheduled Working Days}]}
      - {name: Scheduled Working Days, type: decimal, agg: sum}
      - {name: Workforce Cost Amount, type: currency, agg: sum}

  - name: fact_engagement_survey
    grain: quarter_org_segment
    columns:
      - {name: DateKey, type: int, ref: dim_date}
      - {name: OrgKey, type: int, ref: dim_org}
      - {name: EmployeeSegmentKey, type: int, ref: dim_employee_segment}
      - {name: Engagement Score, type: decimal, agg: avg, checks: [{between: [0, 100]}]}
      - {name: Respondents, type: int, agg: sum, checks: [{lte_column: Invited}]}
      - {name: Invited, type: int, agg: sum}

  - name: fact_recruiting
    grain: filled_requisition
    columns:
      - {name: DateKey, type: int, ref: dim_date}
      - {name: OrgKey, type: int, ref: dim_org}
      - {name: RoleKey, type: int, ref: dim_role}
      - {name: Requisition Open Date, type: int}
      - {name: Filled Date, type: int}
      - {name: Positions Filled, type: int, agg: sum}
      - {name: Days to Fill, type: int, agg: avg, checks: [{gt: 0}]}

quality_rules:
  # Not-null, FK, unbekannter Eintrag und Wertebereiche stehen strukturiert an den Spalten
  # (nullable, ref, unknown_member, checks). Hier bleibt nur, was sich nicht strukturieren laesst.
  freshness_sla:
    fact_hr: monthly          # payroll-aligned; available within 5 business days of month close
    fact_it: monthly
    fact_survey: per-cycle    # survey data available within 2 weeks of survey close
  referential_integrity:
    - "fact_survey.OrgKey: NULL = company-wide survey"

settings:
  timezone: Europe/Berlin
  fiscal_year_start: 01-01
