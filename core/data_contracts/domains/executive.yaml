domain: executive
version: v1.2
owner: Executive Data Product

# Executive layer consumes curated aggregates from finance, commercial, supply chain, and HR.
# This contract defines the minimal conformed structures expected for the executive cockpit.

dimension:
  - name: dim_date
    scd_type: 1
    columns:
      - {name: DateKey, type: int, role: key}
      - {name: Date, type: date}
      - {name: Year, type: int}
      - {name: Quarter, type: text}
      - {name: Month, type: text}
      - {name: MonthNumber, type: int}

  - name: dim_org
    scd_type: 2
    columns:
      - {name: OrgKey, type: int, role: key}
      - {name: Entity, type: text}
      - {name: Region, type: text, nullable: true}
      - {name: Country, type: text, nullable: true}
      - {name: Segment, type: text, nullable: true}

  - name: dim_entity
    description: "Conformed business-unit dimension (group/division/BU/site hierarchy) for entity-grain risk prioritisation."
    purpose: "Entity-scoped scorecard slicing and entity-level RLS for the executive KPI overview."
    scd_type: 2
    columns:
      - {name: EntityKey, type: int, role: key}
      - {name: Entity Name, type: text, synonyms: [Business Unit, Organisation Unit, Geschäftseinheit]}
      - {name: Entity Type, type: text, allowed_values: [Group, Division, BusinessUnit, Site], synonyms: [Org Level, Hierarchy Level, Einheitstyp]}
      - {name: Parent Entity, type: text, nullable: true, synonyms: [Parent Unit, Übergeordnete Einheit]}
      - {name: Region, type: text, nullable: true}

fact:
  - name: fact_exec_summary
    grain: entity_month
    columns:
      - {name: DateKey, type: int, ref: dim_date, cardinality: many-to-one}
      - {name: OrgKey, type: int, ref: dim_org, cardinality: many-to-one}
      - {name: Revenue Amount, type: currency, agg: sum}
      - {name: Gross Margin Amount, type: currency, agg: sum}
      - {name: EBITDA Amount, type: currency, agg: sum}
      - {name: DSO Days, type: decimal, nullable: true}
      - {name: DIO Days, type: decimal, nullable: true}
      - {name: DPO Days, type: decimal, nullable: true}
      - {name: OTIF %, type: decimal, nullable: true}
      - {name: Turnover %, type: decimal, nullable: true}
      - {name: Actions Routed Count, type: int, nullable: true}
      - {name: Action Outcome Rate %, type: decimal, nullable: true}

  - name: fact_kpi_snapshot
    description: "Per-KPI actual/plan/last-year/target values per entity and month for the composite value-at-risk index."
    purpose: "Transparent, auditable inputs so the composite KPI index is computable per entity and per perspective."
    grain: kpi_entity_month
    columns:
      - {name: DateKey, type: int, ref: dim_date, cardinality: many-to-one}
      - {name: EntityKey, type: int, ref: dim_entity, cardinality: many-to-one}
      - {name: KpiId, type: text}
      - {name: Actual Value, type: decimal, agg: sum}
      - {name: Plan Value, type: decimal, agg: sum}
      - {name: Last Year Value, type: decimal, agg: sum}
      - {name: Target Value, type: decimal, agg: sum}
      - {name: Status, type: text, allowed_values: [On Track, At Risk, Off Track]}

  - name: fact_risk_weights
    description: "Materiality weights and balanced-scorecard perspective per KPI (optionally scoped to an entity)."
    purpose: "Weighting factors for the weighted composite value-at-risk index."
    grain: kpi_entity
    columns:
      - {name: KpiId, type: text}
      - {name: EntityKey, type: int, ref: dim_entity, nullable: true, cardinality: many-to-one}
      - {name: Materiality Weight, type: decimal}
      - {name: Perspective, type: text, allowed_values: [Financial, Customer, Internal Process, Learning and Growth]}

quality_rules:
  freshness_sla:
    fact_exec_summary: monthly    # refreshed within 3 business days of month close
    fact_kpi_snapshot: monthly    # per-KPI snapshot refreshed within 3 business days of month close
    fact_risk_weights: monthly    # materiality weights reviewed/refreshed at month close
  key_nullability:
    - "fact_exec_summary.DateKey, OrgKey, Revenue Amount, Gross Margin Amount, EBITDA Amount: never null"
    - "DSO Days, DIO Days, DPO Days, OTIF %, Turnover %, Actions Routed Count, Action Outcome Rate %: nullable (not all entities report all KPIs)"
    - "fact_kpi_snapshot.DateKey, EntityKey, KpiId, Actual Value, Status: never null"
    - "fact_kpi_snapshot.Plan Value, Last Year Value, Target Value: nullable (not every KPI has a plan/LY/target baseline)"
    - "fact_risk_weights.KpiId, Materiality Weight, Perspective: never null; EntityKey nullable (null = group-wide default weight)"
  value_ranges:
    - "fact_exec_summary.OTIF %: in [0; 1] when present"
    - "fact_exec_summary.Turnover %: >= 0 when present"
    - "fact_exec_summary.Action Outcome Rate %: in [0; 1] when present"
    - "fact_exec_summary.Actions Routed Count: >= 0 when present"
    - "fact_exec_summary.Revenue Amount: may be negative only for credit/reversal entities"
    - "fact_kpi_snapshot.Status: in [On Track, At Risk, Off Track]"
    - "fact_risk_weights.Materiality Weight: >= 0; weights per (Perspective) or per Entity scope should sum to 1 within rounding tolerance"
    - "fact_risk_weights.Perspective: in [Financial, Customer, Internal Process, Learning and Growth]"
  referential_integrity:
    - "Source: aggregated from finance, commercial_sales, supply_chain, and people domain contracts"
    - "fact_exec_summary must align with fact_finance entity-month totals within rounding tolerance"
    - "fact_kpi_snapshot.DateKey → dim_date (required); fact_kpi_snapshot.EntityKey → dim_entity (required)"
    - "fact_risk_weights.EntityKey → dim_entity (nullable; null = group-wide default applied to all entities)"
    - "fact_kpi_snapshot.KpiId and fact_risk_weights.KpiId share a common KPI catalogue so the weighted composite index is joinable per (KpiId, EntityKey)"

settings:
  timezone: Europe/Berlin
  fiscal_year_start: 01-01
