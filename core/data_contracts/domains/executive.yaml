domain: executive
version: v1.2
owner: Executive Data Product

# Executive layer consumes curated aggregates from finance, commercial, supply chain, and HR.
# This contract defines the minimal conformed structures expected for the executive cockpit.

dimension:
  - name: dim_date
    scd_type: 1
    columns:
      - {name: DateKey, type: int, role: key}
      - {name: Date, type: date}
      - {name: Year, type: int}
      - {name: Quarter, type: text}
      - {name: Month, type: text}
      - {name: MonthNumber, type: int}

  - name: dim_org
    scd_type: 2
    columns:
      - {name: OrgKey, type: int, role: key}
      - {name: Entity, type: text}
      - {name: Region, type: text, nullable: true}
      - {name: Country, type: text, nullable: true}
      - {name: Segment, type: text, nullable: true}

fact:
  - name: fact_exec_summary
    grain: entity_month
    columns:
      - {name: DateKey, type: int, ref: dim_date, cardinality: many-to-one}
      - {name: OrgKey, type: int, ref: dim_org, cardinality: many-to-one}
      - {name: Revenue Amount, type: currency, agg: sum}
      - {name: Gross Margin Amount, type: currency, agg: sum}
      - {name: EBITDA Amount, type: currency, agg: sum}
      - {name: DSO Days, type: decimal, nullable: true}
      - {name: DIO Days, type: decimal, nullable: true}
      - {name: DPO Days, type: decimal, nullable: true}
      - {name: OTIF %, type: decimal, nullable: true}
      - {name: Turnover %, type: decimal, nullable: true}
      - {name: Actions Routed Count, type: int, nullable: true}
      - {name: Action Outcome Rate %, type: decimal, nullable: true}

quality_rules:
  freshness_sla: monthly    # fact_exec_summary refreshed within 3 business days of month close
  key_nullability:
    - "fact_exec_summary.DateKey, OrgKey, Revenue Amount, Gross Margin Amount, EBITDA Amount: never null"
    - "DSO Days, DIO Days, DPO Days, OTIF %, Turnover %, Actions Routed Count, Action Outcome Rate %: nullable (not all entities report all KPIs)"
  value_ranges:
    - "fact_exec_summary.OTIF %: in [0; 1] when present"
    - "fact_exec_summary.Turnover %: >= 0 when present"
    - "fact_exec_summary.Action Outcome Rate %: in [0; 1] when present"
    - "fact_exec_summary.Actions Routed Count: >= 0 when present"
    - "fact_exec_summary.Revenue Amount: may be negative only for credit/reversal entities"
  referential_integrity:
    - "Source: aggregated from finance, commercial_sales, supply_chain, and people domain contracts"
    - "fact_exec_summary must align with fact_finance entity-month totals within rounding tolerance"

settings:
  timezone: Europe/Berlin
  fiscal_year_start: 01-01
