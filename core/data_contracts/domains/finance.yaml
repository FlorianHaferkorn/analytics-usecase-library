domain: finance
version: v1.2
owner: Finance Data Product

dimension:
  - name: dim_date
    description: "Calendar dimension for finance reporting."
    purpose: "Time dimension for P&L, cash flow, and working capital."
    scd_type: 1
    columns:
      - {name: DateKey, type: int, role: key}
      - {name: Date, type: date}
      - {name: Year, type: int}
      - {name: Quarter, type: text, allowed_values: [Q1, Q2, Q3, Q4]}
      - {name: Month, type: text}
      - {name: MonthNumber, type: int}
      - {name: CalendarYearMonth, type: text}

  - name: dim_org
    description: "Entity/organization dimension (entity, region, country) for finance."
    purpose: "Scoping for P&L and balance sheet."
    scd_type: 2
    columns:
      - {name: OrgKey, type: int, role: key}
      - {name: Entity, type: text, synonyms: [Legal Entity, Company Code, Gesellschaft, Buchungskreis]}
      - {name: Region, type: text, nullable: true, allowed_values: [DACH, Benelux, Nordics, SouthernEurope, CEE], synonyms: [Sales Region, Territory, Vertriebsregion]}
      - {name: Country, type: text, nullable: true, synonyms: [Country of Domicile, Land, Sitzland]}

  - name: dim_customer
    description: "Customer dimension for AR and revenue attribution."
    purpose: "Customer-level receivables and revenue."
    scd_type: 2
    columns:
      - {name: CustomerKey, type: int, role: key}
      - {name: CustomerCode, type: text}
      - {name: CustomerName, type: text}
      - {name: Region, type: text, nullable: true, allowed_values: [DACH, Benelux, Nordics, SouthernEurope, CEE], synonyms: [Sales Region, Territory, Vertriebsregion]}

  - name: dim_supplier
    showcase: false
    description: "Supplier dimension for AP and procurement attribution."
    purpose: "Supplier-level payables and COGS."
    scd_type: 2
    columns:
      - {name: SupplierKey, type: int, role: key}
      - {name: SupplierCode, type: text}
      - {name: SupplierName, type: text}
      - {name: Region, type: text, nullable: true, allowed_values: [DACH, Benelux, Nordics, SouthernEurope, CEE], synonyms: [Sales Region, Territory, Vertriebsregion]}

  - name: dim_product
    description: "Product dimension for finance (inventory, COGS, cost)."
    purpose: "Product-level P&L and working capital."
    scd_type: 2
    columns:
      - {name: ProductKey, type: int, role: key}
      - {name: ProductCode, type: text}
      - {name: ProductName, type: text}
      - {name: Category, type: text, allowed_values: [Fashion, "Home & Living", Consumer Electronics], synonyms: [Product Group, Warengruppe, Produktgruppe]}

  - name: dim_cost_category
    showcase: false
    description: "Cost-category dimension for activity-based costing and variance decomposition."
    purpose: "ABC/causal overhead attribution and price/usage/volume/mix variance decomposition."
    scd_type: 1
    columns:
      - {name: CostCategoryKey, type: int, role: key}
      - {name: Cost Category, type: text, allowed_values: [Material, Labor, Overhead, SG&A, Logistics], synonyms: [Cost Element, Kostenart, Kostenkategorie]}
      - {name: Cost Type, type: text, allowed_values: [Fixed, Variable], synonyms: [Cost Behavior, Fixkostenart, Kostenverhalten]}
      - {name: Activity, type: text, nullable: true, synonyms: [Cost Driver, Activity Pool, Aktivität, Kostentreiber]}

  # FIN-003: cost-centre (org-responsibility) axis for EBITDA-vs-plan overrun attribution.
  # Distinct from dim_cost_category (cost-element/behaviour); this is the accountable unit.
  - name: dim_cost_center
    description: "Conformed functional cost centre (Store Operations, Merchandising, Marketing, Supply
      Chain & Logistics, IT & Digital, General & Admin) for OpEx variance attribution."
    purpose: "Locates which cost centres carry the opex/EBITDA overrun in FIN-003."
    scd_type: 1
    columns:
      - {name: CostCenterKey, type: int, role: key}
      - {name: Cost Center, type: text}
      - {name: Business Unit, type: text}
      - {name: Account Group, type: text}

fact:
  - name: fact_cash_position
    description: "Daily cash balance and plan cash per entity."
    purpose: "Cash position and liquidity."
    grain: day
    columns:
      - {name: DateKey, type: int, ref: dim_date, cardinality: many-to-one}
      - {name: OrgKey, type: int, ref: dim_org, cardinality: many-to-one}
      - {name: Cash Balance Amount, type: currency, agg: sum}
      - {name: Plan Cash Amount, type: currency, agg: sum, nullable: true}

  - name: fact_cash_flow
    description: "Monthly operating cash flow, CapEx, and plan OCF per entity."
    purpose: "Cash flow and liquidity planning."
    grain: month
    columns:
      - {name: DateKey, type: int, ref: dim_date, cardinality: many-to-one}
      - {name: OrgKey, type: int, ref: dim_org, cardinality: many-to-one}
      - {name: Operating Cash Flow Amount, type: currency, agg: sum}
      - {name: CapEx Amount, type: currency, agg: sum, nullable: true}
      - {name: Plan OCF Amount, type: currency, agg: sum, nullable: true}

  - name: fact_accounts_receivable
    description: "Accounts receivable and revenue by entity and customer per month."
    purpose: "AR aging and revenue recognition."
    grain: month
    columns:
      - {name: DateKey, type: int, ref: dim_date, cardinality: many-to-one}
      - {name: OrgKey, type: int, ref: dim_org, cardinality: many-to-one}
      - {name: CustomerKey, type: int, ref: dim_customer, nullable: true, cardinality: many-to-one}
      - {name: AR Amount, type: currency, agg: sum}
      - {name: Revenue Amount, type: currency, agg: sum}
      - {name: Overdue AR Amount, type: currency, agg: sum, nullable: true, checks: [{gte: 0, when_present: true}], target_state: true}
      - {name: AR 0-30 Days Amount, type: currency, agg: sum, nullable: true, checks: [{gte: 0, when_present: true}], target_state: true}
      - {name: AR 31-60 Days Amount, type: currency, agg: sum, nullable: true, checks: [{gte: 0, when_present: true}], target_state: true}
      - {name: AR 61-90 Days Amount, type: currency, agg: sum, nullable: true, checks: [{gte: 0, when_present: true}], target_state: true}
      - {name: AR Over 90 Days Amount, type: currency, agg: sum, nullable: true, checks: [{gte: 0, when_present: true}], target_state: true}

  - name: fact_accounts_payable
    description: "Accounts payable and COGS by entity and supplier per month."
    purpose: "AP aging and payables management."
    grain: month
    columns:
      - {name: DateKey, type: int, ref: dim_date, cardinality: many-to-one}
      - {name: OrgKey, type: int, ref: dim_org, cardinality: many-to-one}
      - {name: SupplierKey, type: int, ref: dim_supplier, nullable: true, cardinality: many-to-one}
      - {name: AP Amount, type: currency, agg: sum}
      - {name: COGS Amount, type: currency, agg: sum}

  - name: fact_inventory
    description: "Inventory and COGS value by entity and product per month (finance view)."
    purpose: "Working capital and inventory valuation."
    grain: month
    columns:
      - {name: DateKey, type: int, ref: dim_date, cardinality: many-to-one}
      - {name: OrgKey, type: int, ref: dim_org, cardinality: many-to-one}
      - {name: ProductKey, type: int, ref: dim_product, nullable: true, cardinality: many-to-one}
      - {name: Inventory Amount, type: currency, agg: sum}
      - {name: COGS Amount, type: currency, agg: sum}

  - name: fact_finance
    description: "P&L facts (net sales, COGS, EBITDA, OpEx, plan) per entity-month."
    purpose: "P&L and management reporting."
    grain: entity_month
    columns:
      - {name: DateKey, type: int, ref: dim_date, cardinality: many-to-one}
      - {name: OrgKey, type: int, ref: dim_org, cardinality: many-to-one}
      - {name: Net Sales Amount, type: currency, agg: sum}
      - {name: COGS Amount, type: currency, agg: sum}
      - {name: EBITDA Amount, type: currency, agg: sum}
      - {name: Material Cost Amount, type: currency, agg: sum, nullable: true}
      - {name: OpEx Amount, type: currency, agg: sum, nullable: true}
      - {name: Plan OpEx Amount, type: currency, agg: sum, nullable: true}
      # FIN-003 earnings-vs-plan (IFRS/ESMA-APM): EBITDA add-back + plan side + cost-centre axis
      - {name: EBIT Amount, type: currency, agg: sum, nullable: true}
      - {name: Net Income Amount, type: currency, agg: sum, nullable: true}
      - {name: D&A Amount, type: currency, agg: sum, nullable: true, description: "Depreciation & amortisation; EBITDA = EBIT + D&A."}
      - {name: Plan Net Sales Amount, type: currency, agg: sum, nullable: true}
      - {name: Plan COGS Amount, type: currency, agg: sum, nullable: true}
      - {name: Plan EBITDA Amount, type: currency, agg: sum, nullable: true}

  # FIN-003 OpEx split by conformed cost centre (sums back to fact_finance entity OpEx /
  # Plan OpEx). The overrun concentrates in a few cost centres — the "where" of the story.
  - name: fact_opex_costcenter
    description: "OpEx and Plan OpEx at org × cost-centre × month; reconciles to fact_finance entity OpEx."
    purpose: "Cost-centre attribution of the OpEx / EBITDA-vs-plan overrun (FIN-003)."
    grain: entity_costcentre_month
    columns:
      - {name: DateKey, type: int, ref: dim_date, cardinality: many-to-one}
      - {name: OrgKey, type: int, ref: dim_org, cardinality: many-to-one}
      - {name: CostCenterKey, type: int, ref: dim_cost_center, cardinality: many-to-one}
      - {name: OpEx Amount, type: currency, agg: sum}
      - {name: Plan OpEx Amount, type: currency, agg: sum}

  - name: fact_cost
    description: "Cost breakdown (COGS, material, overhead) per plant-line-product-month."
    purpose: "Cost analysis and variance."
    grain: plant_line_product_month
    columns:
      - {name: DateKey, type: int, ref: dim_date, cardinality: many-to-one}
      - {name: OrgKey, type: int, ref: dim_org, cardinality: many-to-one}
      - {name: ProductKey, type: int, ref: dim_product, cardinality: many-to-one}
      - {name: CostCategoryKey, type: int, ref: dim_cost_category, nullable: true, cardinality: many-to-one, target_state: true}
      - {name: COGS Amount, type: currency, agg: sum, checks: [{gte: 0}]}
      - {name: Material Cost Amount, type: currency, agg: sum, nullable: true}
      - {name: Overhead Amount, type: currency, agg: sum, nullable: true}
      - {name: Actual Cost Amount, type: currency, agg: sum, checks: [{gte: 0}], target_state: true}
      - {name: Standard Cost Amount, type: currency, agg: sum, nullable: true, target_state: true}
      - {name: Plan/Budget Cost Amount, type: currency, agg: sum, nullable: true, target_state: true}

  - name: fact_output
    description: "Output units per plant-line-product-month."
    purpose: "Production output for cost per unit."
    grain: plant_line_product_month
    columns:
      - {name: DateKey, type: int, ref: dim_date, cardinality: many-to-one}
      - {name: OrgKey, type: int, ref: dim_org, cardinality: many-to-one}
      - {name: ProductKey, type: int, ref: dim_product, cardinality: many-to-one}
      - {name: Output Units, type: decimal, agg: sum, checks: [{gte: 0}]}
      - {name: Good Units, type: decimal, agg: sum, checks: [{gte: 0}, {lte_column: Output Units}]}
      - {name: Defect Count, type: decimal, agg: sum, checks: [{gte: 0}]}

  - name: fact_labor
    description: "Labor hours and cost per plant-line-month."
    purpose: "Labor cost and productivity."
    grain: plant_line_month
    columns:
      - {name: DateKey, type: int, ref: dim_date, cardinality: many-to-one}
      - {name: OrgKey, type: int, ref: dim_org, cardinality: many-to-one}
      - {name: Labor Hours, type: decimal, agg: sum, checks: [{gte: 0}]}

  # Aus Gold und Modell nachgezogen (A-23, 29.09.2026); das Finance-Modell führt die Tabelle.
  - name: fact_supplier_risk
    description: "Daily supplier risk scores (overall, delivery, quality, financial) per supplier."
    purpose: "Supplier risk monitoring (KPI scm.supplier_risk.score)."
    grain: supplier_day
    columns:
      - {name: DateKey, type: int, ref: dim_date, cardinality: many-to-one}
      - {name: SupplierKey, type: int, ref: dim_supplier, cardinality: many-to-one}
      - {name: Risk Score, type: decimal, agg: avg}
      - {name: Delivery Risk Score, type: decimal, agg: avg}
      - {name: Quality Risk Score, type: decimal, agg: avg}
      - {name: Financial Risk Score, type: decimal, agg: avg}

quality_rules:
  # Not-null, FK, unbekannter Eintrag und Wertebereiche stehen strukturiert an den Spalten
  # (nullable, ref, unknown_member, checks). Hier bleibt nur, was sich nicht strukturieren laesst.
  freshness_sla:
    fact_cash_position: daily           # treasury reconciled daily
    fact_cash_flow: monthly             # within 3 business days of month close
    fact_accounts_receivable: monthly   # within 3 business days of month close
    fact_accounts_payable: monthly      # within 3 business days of month close
    fact_finance: monthly               # within 5 business days of month close
    fact_cost: monthly
    fact_output: daily
    fact_labor: monthly
  value_ranges:
    - "fact_cash_position.Cash Balance Amount: may be negative (overdraft); no range constraint"
    - "fact_accounts_receivable.AR 0-30 Days Amount + AR 31-60 Days Amount + AR 61-90 Days Amount + AR Over 90 Days Amount: = AR Amount"
    - "fact_accounts_receivable.Overdue AR Amount: = AR 31-60 + AR 61-90 + AR Over 90 (excludes current 0-30)"
  referential_integrity:
    - "fact_cost.CostCategoryKey: NULL = uncategorized cost"

settings:
  timezone: Europe/Berlin
  fiscal_year_start: 01-01
