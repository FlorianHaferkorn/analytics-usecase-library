domain: experience
version: v1.2
owner: Experience / Service Data Product

dimension:
  - name: dim_date
    conformed_from: commercial_sales   # einzige Definition dort (Bus-Matrix, 29.09.2026)
    uses_columns: [DateKey, Date, Year, Quarter, Month, MonthNumber, Week, CalendarYearMonth]

  - name: dim_org
    conformed_from: commercial_sales   # einzige Definition dort (Bus-Matrix, 29.09.2026)
    uses_columns: [OrgKey, Region, Channel, Queue, Agent Group, IssueType, Severity]

  - name: dim_case_queue
    description: "Support case queue dimension (queue name, channel, region)."
    purpose: "Queue-level case and WFM analysis."
    scd_type: 1
    columns:
      - {name: QueueKey, type: int, role: key}
      - {name: QueueName, type: text, allowed_values: [Billing, Returns, Sales Support, Technical Support], synonyms: [Queue, Work Queue, Warteschlange]}
      - {name: Channel, type: text, nullable: true, allowed_values: [Phone, Email, Chat], synonyms: [Contact Channel, Interaction Channel, Kontaktkanal, Kanal]}
      - {name: Region, type: text, nullable: true, allowed_values: [Americas, EMEA], synonyms: [Geography, Geo, Service Region]}

  - name: dim_issue_type
    description: "Issue type dimension (type, category, severity) for case classification, FCR, and escalation Pareto."
    purpose: "Issue-type, category, and severity analysis for support (FCR and escalation Pareto)."
    scd_type: 1
    columns:
      - {name: IssueKey, type: int, role: key}
      - {name: IssueType, type: text, allowed_values: [Billing, Delivery, Order, Product, Technical], synonyms: [Issue Type, Case Type, Ticket Type, Request Type, Falltyp, Anliegenart]}
      - {name: Issue Category, type: text, nullable: true, synonyms: [Issue Group, Category, Anliegenkategorie], target_state: true}
      - {name: Severity, type: text, nullable: true, allowed_values: [Critical, High, Medium, Low], synonyms: [Severity Level, Priority, Schweregrad, Priorität]}

  - name: dim_sla_policy
    showcase: false
    description: "SLA policy dimension (priority, response/resolution targets, force-majeure exclusion) for SLA attainment."
    purpose: "Correct SLA attainment with force-majeure exclusion (XD-001)."
    scd_type: 1
    columns:
      - {name: SlaPolicyKey, type: int, role: key}
      - {name: SLA Name, type: text, synonyms: [SLA Policy, Service Level Agreement, SLA-Richtlinie]}
      - {name: Priority, type: text, allowed_values: [P1, P2, P3, P4], synonyms: [SLA Priority, Severity Tier, Prioritätsstufe]}
      - {name: Response Target Minutes, type: decimal, synonyms: [Response SLA, First Response Target, Reaktionszeitziel]}
      - {name: Resolution Target Minutes, type: decimal, synonyms: [Resolution SLA, Resolution Target, Lösungszeitziel]}
      - {name: Force Majeure Exclusion Flag, type: boolean, synonyms: [Force Majeure Flag, SLA Exclusion, Höhere-Gewalt-Ausschluss]}

  - name: dim_shrinkage_category
    showcase: false
    description: "Shrinkage category dimension (category, paid flag) for shrinkage decomposition."
    purpose: "Shrinkage decomposition for utilization (XD-002)."
    scd_type: 1
    columns:
      - {name: ShrinkageCategoryKey, type: int, role: key}
      - {name: Shrinkage Category, type: text, allowed_values: [Training, Meetings, Breaks, Absence, SystemDowntime, Coaching], synonyms: [Shrinkage Reason, Shrinkage Type, Schwundkategorie]}
      - {name: Paid Flag, type: boolean, synonyms: [Paid Shrinkage Flag, Bezahlt-Kennzeichen]}

  - name: dim_agent_skill
    showcase: false
    description: "Agent skill dimension (skill group, level, channel) for skill-based utilization and occupancy."
    purpose: "Skill-based utilization and occupancy analysis (XD-002)."
    scd_type: 2
    columns:
      - {name: AgentSkillKey, type: int, role: key}
      - {name: Skill Group, type: text, synonyms: [Skill, Competency Group, Kompetenzgruppe]}
      - {name: Skill Level, type: text, allowed_values: [Junior, Intermediate, Senior, Expert], synonyms: [Proficiency, Seniority, Qualifikationsstufe]}
      - {name: Channel, type: text, allowed_values: [Voice, Chat, Email, Social], synonyms: [Contact Channel, Interaction Channel, Kontaktkanal, Kanal]}

fact:
  - name: fact_support_cases
    description: "Support case facts (SLA, FCR, handle time, escalation, backlog)."
    purpose: "Case performance and SLA reporting."
    grain: case
    columns:
      - {name: DateKey, type: int, ref: dim_date, cardinality: many-to-one}
      - {name: OrgKey, type: int, ref: dim_org, cardinality: many-to-one}
      - {name: QueueKey, type: int, ref: dim_case_queue, nullable: true, cardinality: many-to-one}
      - {name: IssueKey, type: int, ref: dim_issue_type, nullable: true, cardinality: many-to-one}
      - {name: SlaPolicyKey, type: int, ref: dim_sla_policy, nullable: true, cardinality: many-to-one, target_state: true}
      - {name: SLA Met Flag, type: boolean}
      - {name: FCR Flag, type: boolean}
      - {name: Handle Time Minutes, type: decimal, checks: [{gte: 0}]}
      - {name: Escalation Flag, type: boolean}
      - {name: Backlog Flag, type: boolean}
      - {name: Open Case Flag, type: boolean}

  - name: fact_workforce_management
    description: "Workforce management facts (work, paid, talk, wrap, idle, overtime, shrinkage) per agent-day."
    purpose: "WFM utilization and shrinkage reporting."
    grain: agent_day
    columns:
      - {name: DateKey, type: int, ref: dim_date, cardinality: many-to-one}
      - {name: OrgKey, type: int, ref: dim_org, cardinality: many-to-one}
      - {name: QueueKey, type: int, ref: dim_case_queue, nullable: true, cardinality: many-to-one}
      - {name: ShrinkageCategoryKey, type: int, ref: dim_shrinkage_category, nullable: true, cardinality: many-to-one, target_state: true}
      - {name: AgentSkillKey, type: int, ref: dim_agent_skill, nullable: true, cardinality: many-to-one, target_state: true}
      - {name: Work Time Minutes, type: decimal, agg: sum, checks: [{gte: 0}, {lte_column: Paid Time Minutes}]}
      - {name: Paid Time Minutes, type: decimal, agg: sum}
      - {name: Talk Time Minutes, type: decimal, agg: sum}
      - {name: Wrap Time Minutes, type: decimal, agg: sum}
      - {name: Idle Time Minutes, type: decimal, agg: sum, checks: [{gte: 0}]}
      - {name: Overtime Minutes, type: decimal, agg: sum, nullable: true}
      - {name: Shrinkage Minutes, type: decimal, agg: sum, nullable: true, checks: [{gte: 0, when_present: true}]}

  - name: fact_nps
    description: "NPS survey responses (score, promoter/detractor flags), one row per response."
    purpose: "Net Promoter Score and advocacy reporting."
    grain: survey_response
    # Konformer Fakt (Bus-Matrix, 29.09.2026): die einzige Definition; commercial_sales verweist.
    # Spalten aus der commercial_sales-Fassung (trifft Aurora-Gold 7/7, ResponseID eindeutig in
    # 900 Zeilen); NPS Score ist int (Gold BIGINT, Werte 0-10).
    uses_columns: [DateKey, OrgKey, NPS Score]
    columns:
      - {name: ResponseID, type: text, role: key}
      - {name: DateKey, type: int, ref: dim_date, cardinality: many-to-one}
      - {name: CustomerKey, type: int, ref: dim_customer, nullable: true, cardinality: many-to-one}
      - {name: OrgKey, type: int, ref: dim_org, nullable: true, cardinality: many-to-one}
      - {name: NPS Score, type: int, checks: [{between: [0, 10]}]}
      - {name: Is Promoter, type: bool, nullable: true}
      - {name: Is Detractor, type: bool, nullable: true}
    qa:
      - "NPS Score in [0;10]; Promoter/Detractor flags mutually exclusive."

  # Aus Gold und Modell nachgezogen (A-23, 29.09.2026). Action Code / Responsible Role liest das
  # Experience-Modell, Gold hat sie noch nicht (A-24, Generator zieht nach).
  - name: fact_action_log
    description: "Routed actions (one row per action) with use case, type, and outcome."
    purpose: "Action routing volume and outcome for the action-governance pages (XD-004)."
    grain: action
    columns:
      - {name: ActionID, type: text, role: key}
      - {name: DateKey, type: int, ref: dim_date, cardinality: many-to-one}
      - {name: OrgKey, type: int, ref: dim_org, cardinality: many-to-one}
      - {name: UseCaseID, type: text}
      - {name: Action Type, type: text}
      - {name: Action Outcome, type: text}
      - {name: Action Code, type: text}        # A-24: im Modell, fehlt in Gold
      - {name: Responsible Role, type: text}   # A-24: im Modell, fehlt in Gold

quality_rules:
  # Not-null, FK, unbekannter Eintrag und Wertebereiche stehen strukturiert an den Spalten
  # (nullable, ref, unknown_member, checks). Hier bleibt nur, was sich nicht strukturieren laesst.
  freshness_sla:
    fact_support_cases: real-time   # case events captured within 15 min; closed cases same-day
    fact_workforce_management: daily
    fact_nps: per-cycle             # survey results available within 24 h of survey close
  value_ranges:
    - "fact_nps.NPS Score: integer values only"
  referential_integrity:
    - "fact_support_cases.SlaPolicyKey: NULL = no SLA policy assigned"
    - "fact_workforce_management.ShrinkageCategoryKey: NULL = unclassified shrinkage"
    - "fact_workforce_management.AgentSkillKey: NULL = no skill profile"

settings:
  timezone: Europe/Berlin
  fiscal_year_start: 01-01
