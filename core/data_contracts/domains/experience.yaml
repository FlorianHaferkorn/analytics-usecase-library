domain: experience
version: v1.2
owner: Experience / Service Data Product

dimension:
  - name: dim_date
    description: "Calendar dimension for experience and service reporting."
    purpose: "Time slicing for cases, WFM, and NPS."
    scd_type: 1
    columns:
      - {name: DateKey, type: int, role: key}
      - {name: Date, type: date}
      - {name: Year, type: int}
      - {name: Quarter, type: text, allowed_values: [Q1, Q2, Q3, Q4]}
      - {name: Month, type: text}
      - {name: MonthNumber, type: int}
      - {name: Week, type: text, nullable: true}

  - name: dim_org
    description: "Organization dimension (region, channel, queue, agent group) for experience."
    purpose: "Scoping for support cases and WFM."
    scd_type: 2
    columns:
      - {name: OrgKey, type: int, role: key}
      - {name: Region, type: text, nullable: true, allowed_values: [DACH, Benelux, Nordics, SouthernEurope, CEE], synonyms: [Geography, Territory, Vertriebsregion, Gebiet]}
      - {name: Channel, type: text, nullable: true, allowed_values: [Retail, Online, Wholesale, Marketplace, Direct, Outlet], synonyms: [Sales Channel, Distribution Channel, Vertriebskanal]}
      - {name: Queue, type: text, nullable: true, allowed_values: [Order Management, "Returns & Refunds", Technical Support, "Billing & Payments", General Support, VIP Support], synonyms: [Support Queue, Work Queue, Warteschlange, Routing Queue]}
      - {name: Agent Group, type: text, nullable: true, allowed_values: ["Tier 1 – General", "Tier 2 – Specialist", "Tier 3 – Expert", Back-Office, Escalation Team, VIP Desk], synonyms: [Team, Skill Group, Agententeam, Support Team]}

  - name: dim_case_queue
    description: "Support case queue dimension (queue name, channel, region)."
    purpose: "Queue-level case and WFM analysis."
    scd_type: 1
    columns:
      - {name: QueueKey, type: int, role: key}
      - {name: QueueName, type: text, allowed_values: [Billing, Returns, Sales Support, Technical Support], synonyms: [Queue, Work Queue, Warteschlange]}
      - {name: Channel, type: text, nullable: true, allowed_values: [Phone, Email, Chat], synonyms: [Contact Channel, Interaction Channel, Kontaktkanal, Kanal]}
      - {name: Region, type: text, nullable: true, allowed_values: [Americas, EMEA], synonyms: [Geography, Geo, Service Region]}

  - name: dim_issue_type
    description: "Issue type dimension (type, severity) for case classification."
    purpose: "Issue-type and severity analysis for support."
    scd_type: 1
    columns:
      - {name: IssueKey, type: int, role: key}
      - {name: IssueType, type: text, allowed_values: [Billing, Delivery, Order, Product, Technical], synonyms: [Case Type, Ticket Type, Request Type, Falltyp, Anliegenart]}
      - {name: Severity, type: text, nullable: true, allowed_values: [High, Medium, Low], synonyms: [Severity Level, Priority, Schweregrad, Priorität]}

fact:
  - name: fact_support_cases
    description: "Support case facts (SLA, FCR, handle time, escalation, backlog)."
    purpose: "Case performance and SLA reporting."
    grain: case
    columns:
      - {name: DateKey, type: int, ref: dim_date, cardinality: many-to-one}
      - {name: OrgKey, type: int, ref: dim_org, cardinality: many-to-one}
      - {name: QueueKey, type: int, ref: dim_case_queue, nullable: true, cardinality: many-to-one}
      - {name: IssueKey, type: int, ref: dim_issue_type, nullable: true, cardinality: many-to-one}
      - {name: SLA Met Flag, type: boolean}
      - {name: FCR Flag, type: boolean}
      - {name: Handle Time Minutes, type: decimal}
      - {name: Escalation Flag, type: boolean}
      - {name: Backlog Flag, type: boolean}
      - {name: Open Case Flag, type: boolean}

  - name: fact_workforce_management
    description: "Workforce management facts (work, paid, talk, wrap, idle, overtime, shrinkage) per agent-day."
    purpose: "WFM utilization and shrinkage reporting."
    grain: agent_day
    columns:
      - {name: DateKey, type: int, ref: dim_date, cardinality: many-to-one}
      - {name: OrgKey, type: int, ref: dim_org, cardinality: many-to-one}
      - {name: QueueKey, type: int, ref: dim_case_queue, nullable: true, cardinality: many-to-one}
      - {name: Work Time Minutes, type: decimal, agg: sum}
      - {name: Paid Time Minutes, type: decimal, agg: sum}
      - {name: Talk Time Minutes, type: decimal, agg: sum}
      - {name: Wrap Time Minutes, type: decimal, agg: sum}
      - {name: Idle Time Minutes, type: decimal, agg: sum}
      - {name: Overtime Minutes, type: decimal, agg: sum, nullable: true}
      - {name: Shrinkage Minutes, type: decimal, agg: sum, nullable: true}

  - name: fact_nps
    description: "NPS survey facts (score per survey) for experience metrics."
    purpose: "Net Promoter Score reporting."
    grain: survey
    columns:
      - {name: DateKey, type: int, ref: dim_date, cardinality: many-to-one}
      - {name: OrgKey, type: int, ref: dim_org, nullable: true, cardinality: many-to-one}
      - {name: QueueKey, type: int, ref: dim_case_queue, nullable: true, cardinality: many-to-one}
      - {name: NPS Score, type: int}

quality_rules:
  freshness_sla:
    fact_support_cases: real-time   # case events captured within 15 min; closed cases same-day
    fact_workforce_management: daily
    fact_nps: per-cycle             # survey results available within 24 h of survey close
  key_nullability:
    - "fact_support_cases.DateKey, OrgKey, SLA Met Flag, FCR Flag, Handle Time Minutes: never null"
    - "fact_support_cases.Escalation Flag, Backlog Flag, Open Case Flag: never null"
    - "fact_workforce_management.DateKey, OrgKey, Work Time Minutes, Paid Time Minutes: never null"
    - "fact_nps.DateKey, NPS Score: never null"
  value_ranges:
    - "fact_support_cases.Handle Time Minutes: >= 0"
    - "fact_nps.NPS Score: integer in [0; 10]"
    - "fact_workforce_management.Work Time Minutes: >= 0; <= Paid Time Minutes"
    - "fact_workforce_management.Shrinkage Minutes: >= 0 when present"
    - "fact_workforce_management.Idle Time Minutes: >= 0"
  referential_integrity:
    - "fact_support_cases.QueueKey → dim_case_queue (nullable)"
    - "fact_support_cases.IssueKey → dim_issue_type (nullable)"
    - "fact_workforce_management.QueueKey → dim_case_queue (nullable)"

settings:
  timezone: Europe/Berlin
  fiscal_year_start: 01-01
