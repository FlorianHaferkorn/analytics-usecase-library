domain: risk
version: v1.0
owner: Risk / Governance Data Product

# Risk contract covers enterprise risk management inputs: risk register, control effectiveness,
# issue/incident tracking, and risk exposure quantification.
# This v1.0 is a structured placeholder — tables and columns are indicative and require
# validation against the company's risk framework before production use.

dimension:
  - name: dim_date
    description: "Calendar dimension for risk reporting."
    purpose: "Time slicing for risk register snapshots and control cycles."
    scd_type: 1
    columns:
      - {name: DateKey, type: int, role: key}
      - {name: Date, type: date}
      - {name: Year, type: int}
      - {name: Quarter, type: text}
      - {name: Month, type: text}
      - {name: MonthNumber, type: int}

  - name: dim_org
    description: "Organization dimension for risk ownership and reporting."
    purpose: "Scoping risk items to business units and regions."
    scd_type: 2
    columns:
      - {name: OrgKey, type: int, role: key}
      - {name: Entity, type: text}
      - {name: Region, type: text, nullable: true}
      - {name: Country, type: text, nullable: true}

  - name: dim_risk_category
    description: "Risk category taxonomy (strategic, operational, financial, compliance, reputational)."
    purpose: "Risk classification and reporting by category."
    scd_type: 1
    columns:
      - {name: RiskCategoryKey, type: int, role: key}
      - {name: CategoryCode, type: text}
      - {name: CategoryName, type: text}
      - {name: ParentCategory, type: text, nullable: true}

fact:
  - name: fact_risk_register
    description: "Risk register snapshot per risk item and reporting period."
    purpose: "Enterprise risk exposure reporting and trend analysis."
    grain: risk_item_period
    columns:
      - {name: DateKey, type: int, ref: dim_date}
      - {name: OrgKey, type: int, ref: dim_org}
      - {name: RiskCategoryKey, type: int, ref: dim_risk_category}
      - {name: Risk ID, type: text, role: key}
      - {name: Likelihood Score, type: int}        # 1–5 scale
      - {name: Impact Score, type: int}             # 1–5 scale
      - {name: Residual Risk Score, type: int}      # Likelihood × Impact
      - {name: Target Risk Score, type: int, nullable: true}
      - {name: Status, type: text}                  # Open / Mitigated / Closed / Escalated

  - name: fact_control_effectiveness
    description: "Control testing results per control item and period."
    purpose: "Control coverage and effectiveness reporting."
    grain: control_period
    columns:
      - {name: DateKey, type: int, ref: dim_date}
      - {name: OrgKey, type: int, ref: dim_org}
      - {name: Control ID, type: text, role: key}
      - {name: Design Effectiveness, type: text}     # Effective / Partially Effective / Ineffective
      - {name: Operating Effectiveness, type: text}  # Effective / Partially Effective / Ineffective
      - {name: Exception Count, type: int, agg: sum, nullable: true}

  - name: fact_risk_incidents
    description: "Risk incidents and near-misses with impact quantification per event."
    purpose: "Incident frequency and financial impact reporting."
    grain: incident
    columns:
      - {name: DateKey, type: int, ref: dim_date}
      - {name: OrgKey, type: int, ref: dim_org}
      - {name: RiskCategoryKey, type: int, ref: dim_risk_category}
      - {name: Incident ID, type: text, role: key}
      - {name: Financial Impact Amount, type: currency, agg: sum, nullable: true}
      - {name: Is Near Miss, type: boolean}
      - {name: Is Resolved, type: boolean}

quality_rules:
  freshness_sla:
    fact_risk_register: quarterly       # risk register reviewed quarterly; critical risks monthly
    fact_control_effectiveness: per-audit-cycle
    fact_risk_incidents: real-time      # incidents logged within 24 h of occurrence
  key_nullability:
    - "fact_risk_register.Risk ID, DateKey, OrgKey, Likelihood Score, Impact Score, Status: never null"
    - "fact_control_effectiveness.Control ID, DateKey, OrgKey: never null"
    - "fact_risk_incidents.Incident ID, DateKey, OrgKey: never null"
  value_ranges:
    - "fact_risk_register.Likelihood Score: integer in [1; 5]"
    - "fact_risk_register.Impact Score: integer in [1; 5]"
    - "fact_risk_register.Residual Risk Score: in [1; 25] (product of Likelihood × Impact)"
    - "fact_risk_incidents.Financial Impact Amount: >= 0 when present"
  referential_integrity:
    - "fact_risk_register.RiskCategoryKey → dim_risk_category (required)"
    - "fact_risk_incidents.RiskCategoryKey → dim_risk_category (required)"
    - "All facts: OrgKey → dim_org (required)"

settings:
  timezone: Europe/Berlin
  fiscal_year_start: 01-01
