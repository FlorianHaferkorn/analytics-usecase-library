domain: governance
version: v1.2
owner: Governance Data Product

dimension:
  - name: dim_date
    scd_type: 1
    columns:
      - {name: DateKey, type: int, role: key}
      - {name: Date, type: date}
      - {name: Year, type: int}
      - {name: Quarter, type: text}
      - {name: Month, type: text}
      - {name: MonthNumber, type: int}

  - name: dim_org
    scd_type: 2
    columns:
      - {name: OrgKey, type: int, role: key}
      - {name: Entity, type: text}
      - {name: Region, type: text, nullable: true}
      - {name: Country, type: text, nullable: true}

  - name: dim_project
    scd_type: 1
    columns:
      - {name: ProjectKey, type: int, role: key}
      - {name: ProjectCode, type: text}
      - {name: ProjectName, type: text}
      - {name: Portfolio, type: text, nullable: true}

  - name: dim_dataset
    scd_type: 1
    columns:
      - {name: DatasetKey, type: int, role: key}
      - {name: DatasetName, type: text}

  - name: dim_action_code
    scd_type: 1
    columns:
      - {name: ActionCodeKey, type: int, role: key}
      - {name: ActionCode, type: text}
      - {name: DomainActionCode, type: text, nullable: true}
      - {name: ActionFamily, type: text, nullable: true}

  - name: dim_owner_role
    scd_type: 1
    columns:
      - {name: OwnerRoleKey, type: int, role: key}
      - {name: Owner Role, type: text}
      - {name: Role Level, type: text, allowed_values: [Executive, Senior, Lead, Analyst]}
      - {name: Function, type: text, allowed_values: [Finance, Operations, Commercial, SupplyChain, Quality, Experience]}

fact:
  - name: fact_dq
    grain: dataset_month
    columns:
      - {name: DateKey, type: int, ref: dim_date, cardinality: many-to-one}
      - {name: OrgKey, type: int, ref: dim_org, nullable: true, cardinality: many-to-one}
      - {name: DatasetKey, type: int, ref: dim_dataset, cardinality: many-to-one}
      - {name: Valid Records, type: int, agg: sum}
      - {name: Total Records, type: int, agg: sum}

  - name: fact_compliance
    grain: month_org
    columns:
      - {name: DateKey, type: int, ref: dim_date, cardinality: many-to-one}
      - {name: OrgKey, type: int, ref: dim_org, cardinality: many-to-one}
      - {name: Incidents, type: int, agg: sum}
      - {name: Breaches, type: int, agg: sum}

  - name: fact_audit
    grain: finding
    columns:
      - {name: DateKey, type: int, ref: dim_date, cardinality: many-to-one}
      - {name: OrgKey, type: int, ref: dim_org, nullable: true, cardinality: many-to-one}
      - {name: Finding ID, type: text, role: key}
      - {name: Findings, type: int, agg: sum, nullable: true}
      - {name: Open Findings, type: int, agg: sum, nullable: true}

  - name: fact_projects
    grain: project_month
    columns:
      - {name: DateKey, type: int, ref: dim_date, cardinality: many-to-one}
      - {name: OrgKey, type: int, ref: dim_org, nullable: true, cardinality: many-to-one}
      - {name: ProjectKey, type: int, ref: dim_project, cardinality: many-to-one}
      - {name: Benefit, type: currency, agg: sum, nullable: true}
      - {name: Planned Benefit, type: currency, agg: sum, nullable: true}
      - {name: Actual Cost, type: currency, agg: sum, nullable: true}
      - {name: Cost, type: currency, agg: sum, nullable: true}
      - {name: Budget, type: currency, agg: sum, nullable: true}
      - {name: Milestone On Time, type: int, agg: sum, nullable: true}
      - {name: Milestone Total, type: int, agg: sum, nullable: true}
      - {name: Cashflows, type: currency, agg: sum, nullable: true}

  - name: fact_security
    grain: month
    columns:
      - {name: DateKey, type: int, ref: dim_date, cardinality: many-to-one}
      - {name: OrgKey, type: int, ref: dim_org, nullable: true, cardinality: many-to-one}
      - {name: Incidents, type: int, agg: sum}
      - {name: Critical Incidents, type: int, agg: sum, nullable: true}
      - {name: MTTR, type: decimal, agg: avg, nullable: true}

  - name: fact_action_outcome
    grain: action_outcome
    columns:
      - {name: ActionOutcomeId, type: text, role: key}
      - {name: DateKey, type: int, ref: dim_date, cardinality: many-to-one}
      - {name: ActionCodeKey, type: int, ref: dim_action_code, cardinality: many-to-one}
      - {name: OrgKey, type: int, ref: dim_org, nullable: true, cardinality: many-to-one}
      - {name: action_code_id, type: text}
      - {name: domain, type: text}
      - {name: outcome_status, type: text}
      - {name: days_to_outcome, type: int, agg: avg, nullable: true}
      - {name: impact_value, type: currency, agg: sum, nullable: true}
      - {name: cost_to_execute, type: currency, agg: sum, nullable: true}
      - {name: Pre KPI Value, type: decimal}
      - {name: Post KPI Value, type: decimal}
      - {name: KPI Delta, type: decimal}
      - {name: Outcome Status, type: text, allowed_values: [Successful, Routed, No Change, Failed]}
      - {name: Action Effectiveness Delta Amount, type: currency, agg: sum, nullable: true}

  - name: fact_target
    description: "Ziel- und Planwerte je KPI und Monat, vom Kunden beim Onboarding geliefert (R6.1)."
    purpose: "Referenz fuer comparison: vs_target / vs_plan, wo kein governter Plan existiert. Leer = keine Ziellinie."
    grain: kpi_month
    columns:
      - {name: kpi_id, type: text, description: "KPI-ID aus core/kpi_catalog/kpis."}
      - {name: scenario, type: text, allowed_values: [target, plan]}
      - {name: DateKey, type: int, ref: dim_date, cardinality: many-to-one}
      - {name: Target Value, type: decimal, description: "In der Skala der Measure; Prozent als Anteil (0.85 = 85 %)."}

  - name: fact_action_governance
    grain: action_instance
    columns:
      - {name: ActionInstanceId, type: text, role: key}
      - {name: DateKey, type: int, ref: dim_date, cardinality: many-to-one}
      - {name: OrgKey, type: int, ref: dim_org, nullable: true, cardinality: many-to-one}
      - {name: ActionCodeKey, type: int, ref: dim_action_code, cardinality: many-to-one}
      - {name: OwnerRoleKey, type: int, ref: dim_owner_role, cardinality: many-to-one}
      - {name: OwnerRole, type: text}   # retained free-text for backward-compat; OwnerRoleKey is the conformed reference
      - {name: Status, type: text}
      - {name: Routed Actions, type: int, agg: sum}
      - {name: Successful Actions, type: int, agg: sum, nullable: true}
      - {name: Outcome Success Flag, type: int, agg: max, nullable: true}
      - {name: Due Date, type: date, nullable: true}
      - {name: Completion Date, type: date, nullable: true}
      - {name: Evaluation Date, type: date, nullable: true}

quality_rules:
  freshness_sla:
    fact_dq: monthly              # data quality metrics compiled monthly
    fact_compliance: monthly      # compliance incidents reported monthly
    fact_audit: per-audit-cycle   # findings loaded within 5 business days of audit close
    fact_projects: monthly
    fact_security: monthly
    fact_action_outcome: per-action-cycle   # outcome verified within 5 business days of action closure
  key_nullability:
    - "fact_dq.DateKey, DatasetKey, Valid Records, Total Records: never null"
    - "fact_compliance.DateKey, OrgKey, Incidents, Breaches: never null"
    - "fact_audit.Finding ID: unique per row; never null"
    - "fact_security.DateKey, Incidents: never null"
    - "fact_action_governance.ActionInstanceId, DateKey, ActionCodeKey, OwnerRoleKey, OwnerRole, Status, Routed Actions: never null"
    - "fact_action_outcome.ActionOutcomeId, DateKey, ActionCodeKey, action_code_id, Pre KPI Value, Post KPI Value, KPI Delta, Outcome Status: never null"
  value_ranges:
    - "fact_dq.Valid Records: >= 0; <= Total Records"
    - "fact_compliance.Incidents: >= 0; Breaches >= 0; Breaches <= Incidents"
    - "fact_audit.Open Findings: >= 0 when present; <= Findings when present"
    - "fact_security.Critical Incidents: >= 0 when present; <= Incidents"
    - "fact_security.MTTR: >= 0 when present"
    - "fact_action_governance.Routed Actions: >= 0"
    - "fact_action_governance.Successful Actions: >= 0 when present; <= Routed Actions when present"
    - "fact_action_governance.Outcome Success Flag: in [0; 1] when present"
    - "fact_action_outcome.KPI Delta: = Post KPI Value - Pre KPI Value"
    - "fact_action_outcome.Outcome Status: Successful requires verified KPI movement (KPI Delta != 0); administrative closure without KPI movement is not Successful"
  referential_integrity:
    - "fact_dq.DatasetKey → dim_dataset (required)"
    - "fact_projects.ProjectKey → dim_project (required)"
    - "fact_projects.OrgKey → dim_org (nullable)"
    - "fact_action_governance.ActionCodeKey → dim_action_code (required)"
    - "fact_action_governance.OwnerRoleKey → dim_owner_role (required)"
    - "fact_action_outcome.ActionCodeKey → dim_action_code (required)"

settings:
  timezone: Europe/Berlin
  fiscal_year_start: 01-01
