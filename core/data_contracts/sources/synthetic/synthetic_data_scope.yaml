version: 1.0
company: Aurora Group SE
description: >
  Synthetic data scope for the Aurora Group backbone model.
  Describes which tables are in scope, their planned or generated status,
  periods and primary use case coverage.

datasets:
  - table: dim_date
    status: planned
    period:
      start: 2018-01-01
      end: 2028-12-31
    notes: Calendar and fiscal dates for all facts.
    covers_usecases: []

  - table: dim_org
    status: planned
    notes: Org hierarchy for all domains (Commercial, Ops, ESG, HR, Corporate).
    covers_usecases: []

  - table: dim_product
    status: planned
    notes: Product master across Fashion, Home & Electronics.
    covers_usecases: []

  - table: dim_customer
    status: planned
    notes: Customer segmentation, PII-free.
    covers_usecases: []

  - table: dim_promo
    status: planned
    notes: Promotion master for Commercial use cases.
    covers_usecases: []

  - table: dim_currency
    status: planned
    notes: Multi-currency support for all financial use cases.
    covers_usecases: []

  - table: dim_account
    status: planned
    notes: Chart of accounts for corporate and strategy use cases.
    covers_usecases: []

  - table: dim_employee
    status: planned
    notes: Employee dimension for People & Innovation use cases.
    covers_usecases: []

  - table: dim_esg_site
    status: planned
    notes: ESG-relevant sites for emissions and energy use cases.
    covers_usecases: []

  - table: fact_sales
    status: planned
    period:
      start: 2020-01-01
      end: 2024-12-31
    volume_hint: "~ 30-80 million invoice_line rows"
    notes: Core sales backbone.
    covers_usecases:
      - COM-001
      - COM-002
      - COM-003
      - COM-005

  - table: fact_inventory_snapshot
    status: planned
    period:
      start: 2020-01-01
      end: 2024-12-31
    notes: Inventory backbone for store/DC product snapshots.
    covers_usecases: []

  - table: fact_sales_budget
    status: planned
    period:
      start: 2020-01-01
      end: 2024-12-31
    notes: Sales budgets for variance analysis.
    covers_usecases: []

  - table: fact_working_capital
    status: planned
    period:
      start: 2020-01-01
      end: 2024-12-31
    notes: Working capital (AR, AP, Inventory) for corporate use cases.
    covers_usecases: []

  - table: fact_gl_journal
    status: planned
    period:
      start: 2020-01-01
      end: 2024-12-31
    notes: GL journal lines for P&L and balance sheet analysis.
    covers_usecases: []

  - table: fact_customer_interactions
    status: planned
    period:
      start: 2020-01-01
      end: 2024-12-31
    notes: Funnel and engagement interactions.
    covers_usecases: []

  - table: fact_nps
    status: planned
    period:
      start: 2020-01-01
      end: 2024-12-31
    notes: NPS survey data.
    covers_usecases: []

  - table: fact_esg_emissions
    status: planned
    period:
      start: 2020-01-01
      end: 2024-12-31
    notes: Emissions and energy use for ESG.
    covers_usecases: []

  - table: fact_employee_snapshot
    status: planned
    period:
      start: 2020-01-01
      end: 2024-12-31
    notes: HR backbone for headcount, FTE and costs.
    covers_usecases: []

  - table: fact_innovation_pipeline
    status: planned
    period:
      start: 2020-01-01
      end: 2024-12-31
    notes: Innovation project pipeline.
    covers_usecases: []

  - table: fact_action_log
    status: planned
